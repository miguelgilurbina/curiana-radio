<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espiral Curiana · 3D</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html,body{margin:0;height:100%}
  three-d-stage:not(:defined){visibility:hidden}
  three-d-stage{display:block;width:100vw;height:100vh}
  .placa{position:fixed;top:20px;left:24px;z-index:10;font-family:ui-monospace,Menlo,monospace;
    font-size:11px;letter-spacing:.28em;color:#5b4a33;text-transform:uppercase;pointer-events:none}
  .placa strong{display:block;font-family:Georgia,serif;font-style:italic;font-size:15px;
    letter-spacing:0;text-transform:none;color:#2f2517;margin-top:4px}
</style>
</head>
<body>
<div class="placa">Curiana Radio · isotipo<strong>La espiral, en bulto</strong></div>
<three-d-stage name="espiral-curiana" background="#f3ead4" autorotate></three-d-stage>
<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

// ---- la silueta REAL: se calca el PNG original (uploads/Curiana  PNG.png) ----
// El logo es un disco ovalado macizo con un canal espiral en negativo:
// se binariza la imagen, se extraen contornos (marching squares) y el
// canal blanco queda como AGUJERO de la forma — fidelidad total al dibujo.
const bmp = await createImageBitmap(await (await fetch('uploads/Curiana  PNG.png')).blob());
const S = 180;
const cv = document.createElement('canvas'); cv.width = cv.height = S;
const c2 = cv.getContext('2d', { willReadFrequently: true });
c2.drawImage(bmp, 0, 0, S, S);
const px = c2.getImageData(0, 0, S, S).data;
const solid = (x, y) => {
  if (x < 0 || y < 0 || x >= S || y >= S) return 0;
  const i = (y * S + x) * 4;
  return px[i + 3] > 120 && (px[i] + px[i + 1] + px[i + 2]) < 400 ? 1 : 0;
};

// marching squares -> segmentos (con ids enteros precomputados) -> lazos
const W2 = (S + 3) * 2;
const pid = p => Math.round(p[0] * 2 + 2) * W2 + Math.round(p[1] * 2 + 2);
const segs = [];
for (let y = -1; y < S; y++) for (let x = -1; x < S; x++) {
  const tl = solid(x, y), tr = solid(x + 1, y), br = solid(x + 1, y + 1), bl = solid(x, y + 1);
  const cs = tl * 8 + tr * 4 + br * 2 + bl;
  if (cs === 0 || cs === 15) continue;
  const T = [x + 0.5, y], R = [x + 1, y + 0.5], B = [x + 0.5, y + 1], L = [x, y + 0.5];
  const put = (a, b) => segs.push({ a, b, ia: pid(a), ib: pid(b), usado: false });
  if (cs === 1 || cs === 14) put(L, B);
  else if (cs === 2 || cs === 13) put(B, R);
  else if (cs === 3 || cs === 12) put(L, R);
  else if (cs === 4 || cs === 11) put(T, R);
  else if (cs === 6 || cs === 9) put(T, B);
  else if (cs === 7 || cs === 8) put(L, T);
  else if (cs === 5) { put(L, T); put(B, R); }
  else { put(T, R); put(L, B); }
}
const adj = new Map();
segs.forEach((s, i) => {
  for (const k of [s.ia, s.ib]) {
    let l = adj.get(k); if (!l) adj.set(k, l = []);
    l.push(i);
  }
});
const lazos = [];
for (let i = 0; i < segs.length; i++) {
  if (segs[i].usado) continue;
  segs[i].usado = true;
  const lazo = [segs[i].a, segs[i].b];
  let cur = segs[i].ib;
  while (true) {
    const cand = (adj.get(cur) || []).find(j => !segs[j].usado);
    if (cand === undefined) break;
    const sg = segs[cand]; sg.usado = true;
    if (sg.ia === cur) { lazo.push(sg.b); cur = sg.ib; }
    else { lazo.push(sg.a); cur = sg.ia; }
  }
  if (lazo.length > 24) lazos.push(lazo);
}

// suavizar (2 pasadas de promedio) + submuestrear + a metros (ancho ~1 m)
const aPts = lazo => {
  let p = lazo;
  for (let pass = 0; pass < 2; pass++)
    p = p.map((q, i) => {
      const a = p[(i - 1 + p.length) % p.length], b = p[(i + 1) % p.length];
      return [(a[0] + q[0] * 2 + b[0]) / 4, (a[1] + q[1] * 2 + b[1]) / 4];
    });
  return p.filter((_, i) => i % 2 === 0)
    .map(q => new THREE.Vector2((q[0] - S / 2) / S, (S / 2 - q[1]) / S));
};
const area = pts => Math.abs(pts.reduce((s, p, i) => {
  const q = pts[(i + 1) % pts.length]; return s + p.x * q.y - q.x * p.y;
}, 0) / 2);
const formas = lazos.map(aPts).filter(p => area(p) > 0.001).sort((a, b) => area(b) - area(a));

const shape = new THREE.Shape(formas[0]);           // el disco ovalado
for (const h of formas.slice(1)) shape.holes.push(new THREE.Path(h)); // el canal espiral

// ---- materiales (paleta del sistema) ----
const arcilla = new THREE.MeshStandardMaterial({ color: 0x8f3b26, roughness: 0.62, metalness: 0.08 });
arcilla.name = 'arcilla-rubrica';
const piedra = new THREE.MeshStandardMaterial({ color: 0xd8c8a3, roughness: 0.92, metalness: 0.0 });
piedra.name = 'piedra-arenisca';

// ---- extrusión de la silueta original, con bisel suave ----
const PROF = 0.09;
const geo = new THREE.ExtrudeGeometry(shape, {
  depth: PROF, steps: 1, curveSegments: 8,
  bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.01, bevelSegments: 3,
});
geo.translate(0, 0, -PROF / 2);                   // centrar la profundidad
const trazo = new THREE.Mesh(geo, arcilla);
trazo.name = 'trazo-espiral';

const espiral = new THREE.Group();
espiral.name = 'espiral';
espiral.add(trazo);

const modelo = new THREE.Group();
modelo.name = 'espiral-curiana';

const PE_H = 0.07;
const peana = new THREE.Mesh(new THREE.CylinderGeometry(0.64, 0.68, PE_H, 56), piedra);
peana.name = 'peana';
peana.position.y = PE_H / 2;
modelo.add(peana);

// apoyar la espiral: su punto más bajo queda apenas hundido en la peana
espiral.updateMatrixWorld(true);
const bb = new THREE.Box3().setFromObject(espiral);
espiral.position.y = PE_H - 0.015 - bb.min.y;
modelo.add(espiral);

stage.setObject(modelo);
</script>
</body>
</html>

    fecha: '2026-08-25'
    eje: significado
    procedencia:
      obra: gonzalez-batista-nombre-de-coro
    veredicto: coincide con Esteves por vía independiente; 'valle' es matiz suyo de bacoa
  - tipo: hipotesis
    lectura: la Guaybacoa «ciudad de grandísimo momento» de Castellanos (1589) y la Guaibacoa de Bastidas

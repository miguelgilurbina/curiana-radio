    fecha: '2026-09-01'
    eje: referente
    apoyo: 'Velasco: el cerro se llamaba Cerro de Capú; Salas: la cabecera religiosa del polity en Paraguaná;
      Oliver p. 275: silencio de cronistas sobre lo ritual («quite secretive»)'
    veredicto: 'canon-simulación como modelo espacial (Claude, 2026-09-01): ninguna fuente lo dice así
      de explícito, pero es consistente con tres piezas canónicas. Esteves da el nombre a un cerro pequeño
      cerca de Misaray, no al macizo. Detalle: 6-fusion/toponimia_paraguana_miguel.yaml §capubana-centro-sagrado'

    §capubana-centro-sagrado). ⚠ El estrato es INFERENCIA léxica de Esteves, sin documento, y su etiqueta
    nombra una lengua arahuaca (el caribe insular de Breton): B.6, minada el 2026-09-07, no da ningún
    grupo de lengua caribe en Paraguaná (6-fusion/oliver_324_caribes.yaml §5).'
  lecturas:
  - tipo: testimonio-residente
    lectura: 'el ''manantial azul'' cae al pie este del Capubana, donde sigue habiendo agua y uno de los
      pocos bosques xerófitos que quedan: converge con Chamuriana (''agua que baja del cerro'') en un
      radio de pocos kilómetros'
    quien: Miguel Gil Urbina (mapa y terreno)
    fecha: '2026-09-01'
    eje: referente
  procedencia:
    obra: esteves-1989
    pagina: 49
- id: toponimo-090
  forma: amuay
  nivel: C
  clase: topónimo
  glosa_fuente: «la voz da la idea de cavidad subterránea, haitón, cueva grande. Y justamente en las cercanías
    de Amuay hay unas cuevas naturales que debieron ser habituales residencias de los nativos»
  segmentacion: amu- + -ay   [sin morfema caquetío que alinee]
  razon: la glosa es una idea del autor («da la idea de»), sin fuente; ningún morfema del canon alinea.
    Lo que sí está atestiguado por otra vía es que el nombre es el ETNÓNIMO de uno de los dos clanes caquetíos
    de la península, los Amuayes, con territorio al sur y reasentamiento Cayerda → Moruy (Delmonte 1883
    vía Oliver cap. 3 pp. 275-276; paraguana_dos_clanes.yaml). El topónimo hereda el nombre del grupo,
    como la bahía de Guaranao el del otro clan. Se registra en C por el etnónimo, no por la glosa.
  observacion: '⚠ Esteves lo atribuye al «caribe insular» «por su fonética, como batey, mamey, caney,
    carey» (p. 16): cuatro taínismos del español general; y el caribe insular de Breton es lengua arahuaca.
    B.6 (Oliver §3.2.4, minada 2026-09-07) no da ningún grupo caribe en Paraguaná. Conflicto amuay-caquetio-vs-caribe
    resuelto a favor de la etnohistoria (propuesta). Bahía y población de Los Taques; 1881: 8 casas, 60
    vecinos; «hoy» ~400 casas y 3.000 habitantes; también la etimología «muelle» (1924), que Esteves descarta.'
  lecturas:
  - tipo: hipotesis
    lectura: el topónimo es el etnónimo del clan Amuay, sub-grupo caquetío que controlaba el sur de la

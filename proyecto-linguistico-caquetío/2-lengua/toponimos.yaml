    lectura: 'supi: sitio a orilla del mar; arena; arboleda supide'
    quien: Zavala Reyes 2015 (glosario)
    fecha: '2026-09-06'
    eje: significado
    procedencia:
      obra: zavala-reyes-2015
    veredicto: compite con el fitónimo de Esteves; un balneario de arena a orilla del mar encaja con las
      dos
  procedencia:
    obra: esteves-1989

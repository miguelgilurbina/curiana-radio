- id: toponimo-104
  forma: cayeruba
  nivel: C
  clase: topónimo
  glosa_fuente: «¿Origen de la voz? ¿Simaruba? Es posible, hay abundancia de este árbol rutáceo en sus
    contornos» (leído en la imagen; la línea está borrosa en el OCR)
  segmentacion: caye + ruba (?)   [conjetura fitonímica del autor]
  razon: 'Esteves solo conjetura, con interrogación, un fitónimo (simaruba); ningún morfema del canon
    alinea. Lo que sí está firme es la existencia y la antigüedad del lugar, por cuatro vías: cerámica
    aborigen abundante y un cementerio (Esteves), pueblo de Paraguaná en 1556 según Arcaya (vía Esteves
    p. 52), Cayerda como primer asiento de los Amuayes en Delmonte 1883 (vía Oliver p. 276), y el sitio
    FAL-143 de Oliver (nodo-025, dabajuroide, precontacto probable).'
  observacion: '⭐ Un lugar, cuatro grafías: Cayerda / Cayerta / «Coyarna» (Delmonte vía Oliver), Cayeruba
    (Esteves, que llama a la grafía Cayerúa «nacida de snobismo»), y CAYERÚA en el mapa vivo, la forma
    que Miguel verificó («Cayerda no existe, pero Cayerúa sí»). Aldea de Pueblo Nuevo, omitida en el censo
    de 1881 («la omisión es inexplicable»).'
  lecturas:
  - tipo: testimonio-residente
    lectura: '«Cayerda no existe, pero Cayerúa sí»: en el mapa actual aparece Cayerúa cerca de Moruy,
      con Uarayadito en el mismo sector'
    quien: Miguel Gil Urbina (mapa)
    fecha: '2026-09-01'
    eje: referente
  - tipo: hipotesis
    lectura: Cayerda (Delmonte 1883), Cayeruba (Esteves 1989) y Cayerúa (mapa 2026) son un solo lugar,
      el primer asiento de los Amuayes; las variantes -erda/-erta/-eruba/-erúa son ruido de transmisión
      sobre un mismo nombre
    quien: proyecto
    fecha: '2026-09-07'
    eje: referente
    procedencia:
      obra: oliver-1989-cap3
      pagina: 276
    veredicto: muy probable por la geografía (Esteves y el mapa lo ponen donde Delmonte); sin documento
      que las iguale
  procedencia:
    obra: esteves-1989
    pagina: 30
- id: toponimo-108
  forma: moruy
  nivel: C
  clase: topónimo
  glosa_fuente: «Es más aceptable considerar la voz como una alteración de merejuy, cierta levadura o
    preparación agria que usaban para acelerar la fermentación del maíz cocido con que elaboraban la chicha
    embriagadora, que consumían en ceremonias religiosas»
  segmentacion: moruy (< merejuy, según Esteves; sin composición)
  razon: 'la etimología es propuesta de Esteves («más aceptable»), sin fuente, y merejuy no está en el
    lexicón; el paso merejuy → moruy pide varios cambios vocálicos y una síncopa. Ningún morfema del canon
    alinea. Lo firme es el lugar: asiento del clan Amuay tras el reasentamiento desde Cayerda (Delmonte
    1883 vía Oliver), pueblo de Paraguaná en 1556 (Arcaya vía Esteves p. 52), sitio FAL-149 de Oliver
    (nodo-027), 213 casas en 1881, y hoy capital de municipio.'
  observacion: '⭐ Esteves: «los indios de Moruy eran los más belicosos de Paraguaná, hay testimonios escritos»
    de sus peleas contra los españoles que les usurpaban tierras — contra el «Caquetío, who were always
    peaceful» de Oliver (n. 154): otra etiqueta colonial. «La comunidad con más apego a las costumbres
    de sus antepasados»: cerámica, silletas, bernegales, jabón de la tierra; apellidos sin deformar (Caguao,
    Cuauro, Mabo, Guarecuco, Cotopo). Es uno de los dos nodos de la era 2 (DISENO_ERA2 §2). La versión
    de merejuy que Miguel recogió «sin identificar» era esta página.'
  lecturas:
  - tipo: etimologia-popular
    lectura: los naturales temían a los moros (los piratas) y al ver barcos gritaban «¡Moro... uy!»
    quien: tradición oral, recogida por Esteves y por Miguel
    fecha: '2026-09-01'
    eje: significado
    procedencia:
      obra: esteves-1989
      pagina: 53
    veredicto: 'Esteves: «demasiado infantil»; el proyecto: etimología de anécdota, improbable'
  - tipo: etimologia-popular
    lectura: del quechua muru 'viruela' o 'pepa'
    quien: tradición recogida por Miguel
    fecha: '2026-09-01'
    eje: significado
    veredicto: 'exige préstamo quechua sin ruta: improbable'
  - tipo: hipotesis
    lectura: 'Moruy era un cacique: topónimo < antropónimo, el patrón regional (cf. Manaure)'
    quien: tradición recogida por Miguel; validación del proyecto
    fecha: '2026-09-01'
    eje: referente
    veredicto: compatible con merejuy por la regla 0 (un cacique puede llamarse por el oficio del sitio);
      sin documento
  - tipo: hipotesis
    lectura: 'Moruy y Santa Ana (Chamuriana) eran del mismo clan, en órbita del Capubana: Moruy donde
      se hacía el merejuy para la chicha ritual, a la izquierda del cerro; la asignación de Delmonte (Guaranaos
      en Santa Ana) describiría geografía colonial'
    quien: Miguel Gil Urbina
    fecha: '2026-09-01'
    eje: referente
    veredicto: canon-simulacion como modelo espacial (validación en toponimia_paraguana_miguel.yaml §capubana-centro-sagrado);
      Oliver confirma el REASENTAMIENTO Cayerda → Moruy, que huele a reducción colonial
  procedencia:
    obra: esteves-1989
    pagina: 53
- id: toponimo-109
  forma: chamuriana
  nivel: C
  clase: topónimo
  glosa_fuente: «Antigua aldea indígena en cuyas cercanías los españoles fundaron en 1538 el pueblo de
    Santa Ana de Paraguaná. En el lugar se hallan restos de cerámica indígena y europea. Nada sabemos
    del significado de la voz»
  segmentacion: chamur- + -iana
  razon: 'Esteves no glosa. Lo único que alinea es la terminación -iana, la misma de Coriana/Curiana,
    sobre el formante -ana (forma atestiguada, glosa ''lugar de'' en disputa, #109): un dato más para
    esa cola, no una etimología. Lo firme es el referente: la aldea nativa anterior a 1538 junto a la
    que se fundó Santa Ana, con cerámica indígena y europea (nodos 013 y 024: el cerro tiene tres dataciones
    precontacto, hasta 1415).'
  observacion: '⭐ El nombre nativo del sitio de Santa Ana, que Miguel había hallado en investigación coloquial
    sin fuente citable: la fuente es esta (p. 35). Esteves fecha la fundación española en 1538; Miguel
    la da como franciscana. Con Moruy, Cayerúa y Maitiruma orbita el Capubana: el otro nodo de la era
    2.'
  lecturas:
  - tipo: tradicion-local
    lectura: «elegida por los nativos debido a la abundancia de agua dulce que bajaba del cerro»
    quien: crónica local, recogida por Miguel
    fecha: '2026-09-01'
    eje: referente
    veredicto: sin procedencia para la frase; el agua del cerro es verificable (Maitiruma, el bosque xerófito)
  - tipo: hipotesis
    lectura: 'el pueblo de Santa Ana es fundación colonial (franciscana según Miguel, «los españoles»
      en 1538 según Esteves) y el nodo norte precontacto no puede anclarse en él como pueblo: el sitio
      y su agua se llamaban Chamuriana'
    quien: Miguel Gil Urbina
    fecha: '2026-09-01'
    eje: referente
    veredicto: 'Esteves lo sostiene: aldea indígena ANTERIOR a la fundación, con cerámica de las dos épocas'
  procedencia:
    obra: esteves-1989
    pagina: 35
- id: toponimo-077
  forma: supí
  nivel: C
  clase: topónimo
  glosa_fuente: es un árbol cactáceo que exuda una goma medicinal, es el guamacho Pereskia de los botánicos
  segmentacion: supí (fitónimo, sin composición)
  razon: 'el topónimo ES una palabra atestiguada, pero con dos glosas que no coinciden: Zavala da `supi`
    ''sitio a orilla del mar; arena; arboleda supide'' (lexicón, caquetío-atestiguado) y Esteves ''guamacho
    (Pereskia)''. Dos lugares en Paraguaná: el balneario El Supí cerca de Adícora y otro en Baraived.
    Sin cognado que decida, queda en C con el conflicto declarado.'
  observacion: 'En El Supí, playa de Adícora, «hay un placer de piedras escritas» (petroglifos): el único
    rastro no funerario del conjunto arqueológico de Paraguaná que reporta Esteves. En el mapa vivo.'
  lecturas:

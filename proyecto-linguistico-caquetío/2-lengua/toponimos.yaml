  razon: 'los dos morfemas de Esteves están atestiguados en el lexicón (tuba ''aglomeración, montón'';
    kiba ''piedra''), pero su ecuación exige ENMENDAR la forma: los primarios dicen Todariquiba (Bastidas
    1538) y Todariquibo (Castellanos 1589), no Tubariquiba. Zavala #250 tiene toda- como «desinencia»
    sin valor: la forma atestiguada segmenta sin enmienda, pero sin glosa para toda-. Cierra a medias.'
  observacion: '«Legendaria ciudad caquetía que se supone fuera asiento del gobierno del Cacique Manaure»
    (Esteves); la carta de Bastidas (AGI 1538) la pone a dos leguas de Coro con el cacique Don Alexandro;
    Castellanos la encabeza entre las «ciudades de grandísimo momento». Ubicación sin fijar: Esteves recoge
    Tacuato y los Médanos de Coro, y objeta que allí hay arena, no piedra. Es nodo-001 del registro de
    asentamientos (la Curiana de la simulación).'
  lecturas:
  - tipo: hipotesis
    lectura: 'toda- (Zavala #250, desinencia sin valor) + ri + quiba ''piedra'': la forma atestiguada
      de 1538 y 1589 se segmenta sin enmendar; falta la glosa de toda-'
    quien: proyecto
    fecha: '2026-09-07'
    eje: significado
    veredicto: pendiente de que toda- reciba glosa en otra fuente
  procedencia:
    obra: esteves-1989
    pagina: 64
- id: toponimo-095
  forma: miraca
  nivel: C
  clase: topónimo (glosa guaraúna, según Esteves)
  glosa_fuente: '«De la voz hemos averiguado que en lengua guaraúna, Miraca es atarraya. Miraca sanuco:
    atarraya pequeña»'
  segmentacion: miraca (sin composición; voz warao según Esteves)
  razon: 'la glosa viene de otra lengua (warao) y de un «hemos averiguado» sin cita: ningún morfema caquetío
    alinea. Lo firme es la cadena de atestación, la más larga del canon: Myraca con el cacique Bonyata
    en la carta de Bastidas (1538), pueblo de Paraguaná en 1556 según Arcaya (vía Esteves), «ciudad de
    grandísimo momento» en Castellanos (1589), 79 casas en el censo de 1881, y población viva hoy — «de
    los cuales sólo existe hoy el pueblo de Miraca», dice Esteves de las tres ciudades.'
  observacion: '⭐ Cinco siglos con el mismo nombre en el mismo sitio (Baraived). Un topónimo que sigue
    en uso es dato aunque no tenga etimología: aquí la continuidad del asentamiento está mejor sostenida
    que la de cualquier otro nombre de la península. Candidato a nodo en asentamientos.yaml.'
  lecturas:
  - tipo: etimologia-analitica
    lectura: '''atarraya'' en warao (guaraúno); «Miraca sanuco: atarraya pequeña»'
    quien: Esteves 1989
    fecha: '2026-09-07'
    eje: significado
    procedencia:
      obra: esteves-1989
      pagina: 52
    veredicto: sin cita ni ruta de contacto warao–caquetío; encaja con un pueblo de costa pescadora, que
      es poco. Misma cuarentena que sus atribuciones caribe insular y cumanagota
  procedencia:
    obra: esteves-1989
    pagina: 52
- id: toponimo-102
  forma: jarayadito
  nivel: C
  clase: topónimo
  glosa_fuente: «Jarayadito significa espinar, retamal, ñaragatal. El sufijo dito es distintivo de los
    nombres colectivos abundanciales»
  segmentacion: jaraya + -dito
  razon: '`-dito` colectivo abundancial está atestiguado por Esteves cuatro veces y atribuido al caquetío;
    la base jaraya ''espina, retama'' se despeja por sustracción de la glosa, sin recurrencia. Cierra
    la mitad.'
  observacion: '⭐ Tres grafías en tres siglos y el nombre sigue vivo: Sarayadite (censo de 1881), Jarayadito
    (Esteves), UARAYADITO (mapa vivo, fotos de Miguel 2026-09-01, junto a Moruy y Cayerúa). La inicial
    j ~ s ~ u es la misma aspiración inestable de Hurehurebo ~ Jurijurebo. Aldea del municipio Moruy;
    1881: 9 casas, 58 vecinos.'
  lecturas:
  - tipo: testimonio-residente
    lectura: vivo en el mapa actual como Uarayadito, en el mismo sector que Moruy y Cayerúa
    quien: Miguel Gil Urbina (fotos del mapa)
    fecha: '2026-09-01'
    eje: referente
  procedencia:
    obra: esteves-1989
    pagina: 46
- id: toponimo-103
  forma: barunú
  nivel: C
  clase: topónimo
  glosa_fuente: «El nombre viene de Barubaru (palo delgado), palmera con cuyas hojas fabrican esteras
    los nativos. Esta palmera abunda en las faldas del Cerro de Santa Ana»
  segmentacion: baru~baru (bara 'palo', reduplicado) + -nú
  razon: '`bara` ''palo, árbol'' es caquetío-atestiguado y la reduplicación es patrón del corpus (jurijurebo,
    quibaquiba, barabara ''olivo''); el -nú final queda sin explicar y el fitónimo barubaru no tiene segunda
    fuente. Cierra a medias.'
  observacion: 'Aldea al norte de Moruy; 1881: 5 casas, 29 habitantes. Esteves lo pone en su serie Bara-
    indígena (Bariquí, Baracara, Barunú, p. 22). En el mapa vivo, PARUNU (fotos de Miguel): p por b y
    u por ú, y el nombre sigue.'
  lecturas:
  - tipo: testimonio-residente
    lectura: vivo en el mapa actual como Parunu, sector del Capubana
    quien: Miguel Gil Urbina (fotos del mapa)
    fecha: '2026-09-01'
    eje: referente
  procedencia:
    obra: esteves-1989

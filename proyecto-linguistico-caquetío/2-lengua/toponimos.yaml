toponimos:
- id: toponimo-146
  forma: caracubana
  nivel: A
  clase: topónimo
  deuda: sin-pagina
  glosa_fuente: cerro poblado de caracara
  segmentacion: caracu(ara) + bana
  morfemas:
    caracara: ave rapaz (Caracara cheriway)  [Alvarado 1921 y van Buurt 2014, que da el papiamentu warawara
      para la misma ave]
    bana: cerro, sitio alto  [lexicón, caquetío-atestiguado; D9 resuelta 2026-08-31 con seis apoyos]
  glosa_reconstruida: caracara + cerro = 'cerro poblado de caracara'
  razon: 'Esteves segmenta y glosa él mismo, y las dos piezas estaban atestiguadas antes por otras fuentes.
    Y la entrada hace más que cerrar su propia ecuación: es la vez que ESTEVES glosa `-bana` como ''cerro''
    sobre un topónimo, que era justo lo que D9 había tenido que reconstruir. El formante recurre 14 veces
    en su propio gazetteer (achichibana, chichabana, chichibana, coabana, dibana, gibana, guacabana, judibana,
    pipiribana, tausabana, tautabana, carirubana, caracubana).'
  observacion: 'Caserío del municipio Borojó, Distrito Democracia. ⚠️ La glosa se había PERDIDO en el
    minado automático: el OCR se come el paréntesis de cierre —lee «(Caracu- bana: …» y mete ruido detrás—
    y el extractor la daba por entrada sin glosa. Arreglado en glosas_esteves_parte2.py el 2026-09-10;
    verificar en la IMAGEN antes de citarla fuera del repo. CARACARA está también en la lista dictada
    por Miguel como topónimo aparte: son el mismo hecho visto dos veces.'
  lecturas:
  - tipo: glosa-fuente
    lectura: «otra raíz que llaman caracara, la cual muelen en cueros de venados» — un tubérculo comestible,
      no un ave
    quien: Castellanos, Elegías
    fecha: '2026-09-10'
    eje: significado
    procedencia:
      obra: castellanos-elegias
    veredicto: referente alternativo para la misma forma. La glosa de Esteves —'cerro POBLADO de caracara'—
      encaja mejor con el ave. Se declara y no se elige.
  procedencia:
    obra: esteves-1989
- id: toponimo-001
  forma: jurijurebo
  nivel: A
  clase: topónimo
  mapa_vivo: 'OSM 2026: «Jurujurebo», poblado, 12.049 -69.940 — al norte de Pueblo Nuevo y cerca de El
    Vínculo, donde Esteves lo sitúa (p. 47); u por i en la segunda sílaba.'
  glosa_fuente: Paso de los vientos
  segmentacion: juri~juri + ebo
  morfemas:
    juri: 'viento, ventarrón  [lexicón, caquetío-atestiguado, Zavala #178]'
    ebo: 'camino, paso, senda  [lexicón, caquetío-atestiguado, Zavala #117]'
  glosa_reconstruida: viento(-viento) + paso = 'paso de los vientos'
  razon: los dos morfemas ya estaban en el lexicón y la traducción cierra sin residuo. La reduplicación
    juri~juri explica el PLURAL de la glosa ('los vientos', no 'el viento'); la segunda copia pierde la
    vocal final por haplología (juri-jur-ebo).
  observacion: 'Estaba archivado en TOPONIMOS_ZAVALA como ''glosa incierta'' y fuera del habla. Es el
    caso que originó toda la tarea F11. Formas atestiguadas (2026-09-07): Hurihurebo (Bastidas 1538, AGI,
    «pueblo de la Provincia de Paraguaná»), Hurehurebo (Castellanos 1589, II-1, «Señor de la ciudad Hurehurebo»
    y en la lista de las once ciudades), Jurijurebo (Zavala, Esteves p. 47: «lugar al norte de Pueblo
    Nuevo, cercano a El Vínculo; todavía hay vestigios de su cementerio»).'
  lecturas:
  - tipo: etimologia-analitica
    lectura: hure 'arena' -> hurehure 'arenal' -> hurehurebo 'lugar de muchos arenales' (reduplicación
      + sufijo -bo)
    quien: González Batista
    fecha: '2026-08-25'
    eje: significado
    procedencia:
      obra: gonzalez-batista-nombre-de-coro
    veredicto: 'descartada como lectura principal (2026-08-25): Zavala #178-179 tiene glosa impresa y
      juri~juri + ebo cierra sin residuo; el propio autor la da como conjetura («si hure fuera como creemos»).
      Se conserva por D7. Detalle: 6-fusion/toponimia_coro_espina.yaml §veredicto-jurijurebo'
  - tipo: testimonio-residente
    lectura: 'Jurijurebo está en Judibana (Paraguaná); judi y juri son la misma palabra deformada, y el
      viento es el rasgo dominante del sitio: el topónimo moderno y el antiguo comparten raíz y referente'
    quien: Miguel Gil Urbina, residente en Judibana
    fecha: '2026-08-25'
    eje: referente
    apoyo: converge con la ubicación que dan las fuentes divulgativas (esteves-1989) y con la tradición
      local de Judibana (velasco-2015-resistencia §judibana_tradicion)
  procedencia:
    obra: zavala-reyes-2015
- id: toponimo-002
  forma: yacarebacoa
  nivel: A
  clase: topónimo
  glosa_fuente: Pueblo del bosque
  segmentacion: yacare + bacoa
  morfemas:
    yacare: pueblo  [despejado — ver MORFEMAS_DESPEJADOS]
    bacoa: bosque, lugar, paraje, sitio fértil  [lexicón, caquetío-atestiguado]
  glosa_reconstruida: pueblo + bosque = 'pueblo del bosque'
  razon: '`yacare` aparece en el propio corpus de Zavala con glosa ''Pueblo. Caimán''; `bacoa` está en
    el lexicón. La ecuación cierra pieza por pieza y en el mismo orden.'
  procedencia:
    obra: zavala-reyes-2015
- id: toponimo-003
  forma: quibacoas
  nivel: A
  clase: topónimo
  glosa_fuente: Bosques pedregosos
  segmentacion: quiba + (b)acoa   [haplología de la sílaba -ba-]
  morfemas:
    quiba: piedra, roca  [lexicón `quiva`/`cuiva`; van Buurt §8 'siba or quiba means stone or rock']
    bacoa: bosque, lugar, paraje, sitio fértil  [lexicón, caquetío-atestiguado]
  glosa_reconstruida: piedra + bosque = 'bosques pedregosos'
  razon: la `-s` final es plural castellano de Zavala, no caquetío. Resuelto, corrobora las dos piezas
    a la vez.
  observacion: '⚠ Resuelve un problema del lexicón: hay una entrada `quiba` = ''ayuda'' (Zavala #203)
    y otra `quiva`/`cuiva` = ''piedra''. El topónimo, con glosa ''pedregosos'', confirma ''piedra'' —
    y coincide con van Buurt. Ver CONFLICTOS. (Cerrado el 2026-08-31: ambas fusionadas como `kiba`, homónimos
    declarados; el sentido piedra lleva el sig activo.)'
  procedencia:
    obra: zavala-reyes-2015
- id: toponimo-004
  forma: cumarebo
  nivel: A
  clase: topónimo
  glosa_fuente: Camino del cacique Cumare
  segmentacion: Cumare + ebo
  morfemas:
    Cumare: antropónimo — la propia fuente lo identifica como el nombre del cacique
    ebo: camino, paso, senda  [lexicón, caquetío-atestiguado]
  glosa_reconstruida: Cumare + camino = 'camino de Cumare'
  razon: 'la glosa NOMBRA su propia clave: Zavala dice de quién es el camino. El único morfema léxico
    es `ebo`, y encaja. Segunda atestación independiente de `ebo` (la otra es `jurijurebo`).'
  procedencia:
    obra: zavala-reyes-2015
- id: toponimo-005
  forma: guacaubana
  nivel: A
  clase: topónimo
  glosa_fuente: Río escondido
  segmentacion: guaca/waka + -ubana
  morfemas:
    waka: subterráneo, bajo tierra  [van Buurt §6, vía Oliver 1989; sostiene `sawaka` 'inframundo']
    -ubana: 'desinencia  [AFIJOS_ZAVALA, Zavala #265, sin valor precisado por la fuente]'
  glosa_reconstruida: bajo tierra + (desinencia) = 'río escondido'
  razon: '''escondido'' ← waka ''bajo tierra'' es una alineación limpia, y el compuesto recurre en la
    isla: **Wakubana / Wacobana** (Aruba, mapa de 1825; Gatschet 1885 lo registra igual). Dos atestaciones
    separadas por el mar y por 130 años.'
  observacion: '⚠ A con reserva: `-ubana` sigue sin glosa, así que la parte ''río'' de la traducción NO
    queda explicada por ningún morfema. La ecuación cierra a medias.'
  procedencia:
    obra: zavala-reyes-2015
- id: toponimo-006
  forma: barisi
  nivel: A
  clase: topónimo
  subtipo: identidad — corrobora, no descompone
  glosa_fuente: Región de tierras coloradas cerca del mar
  segmentacion: barisi (= `barici` del lexicón, misma forma)
  morfemas:
    barici: agua turbia, tierras coloradas rojizas  [lexicón, caquetío-atestiguado]
  glosa_reconstruida: '''tierras coloradas'' ← barici, literal'
  razon: 'no hay composición que resolver: el topónimo ES la palabra. Pero la coincidencia de glosa entre
    la entrada del glosario y la del listado toponímico es corroboración interna, y no estaba registrada.'
  procedencia:
    obra: zavala-reyes-2015
- id: toponimo-075
  forma: judibana
  nivel: A
  clase: topónimo
  glosa_fuente: 'Judi, jurí: viento. Bana: sitio alto'
  segmentacion: judi + bana
  morfemas:
    judi: 'viento  [= juri, lexicón caquetío-atestiguado, Zavala #178; la variante judi la da Esteves]'
    bana: 'cerro, sitio alto  [lexicón caquetío-atestiguado, Zavala #26; D9 resuelta 2026-08-31]'
  glosa_reconstruida: viento + sitio alto = 'el cerro del viento'
  razon: 'Esteves da la segmentación y las dos glosas, y los dos morfemas ya estaban atestiguados por
    otra fuente (Zavala): la ecuación cierra sin residuo. Sexta atestación de bana ''cerro'' en Esteves
    y la que trae la variante judi de juri (r~d), la misma raíz de jurijurebo (toponimo-001) y del hudi
    de Hudishibana (Aruba).'
  observacion: '«Antiguamente era un fundo pecuario de la aldea de Guanadito, hoy es una moderna ciudad
    del municipio Los Taques.» Es el pueblo donde se crió Miguel: el único topónimo del canon con testimonio
    de residente. Nombra también a la hija de Manaure en la tradición local — significado ≠ referente:
    la etimología vale igual si nombra al cerro o a la persona.'
  lecturas:
  - tipo: testimonio-residente
    lectura: el viento es el rasgo dominante del sitio y de Paraguaná entera; judi y juri son la misma
      palabra deformada, y el topónimo moderno y el antiguo (Jurijurebo) comparten raíz y referente
    quien: Miguel Gil Urbina, residente en Judibana
    fecha: '2026-08-25'
    eje: ambos
  - tipo: tradicion-local
    lectura: «Judibana era una hermosa mujer, que era esposa del Gran Cacique de Jurijurebo»
    quien: leyenda que recoge Esteves
    fecha: '2026-09-06'
    eje: referente
    procedencia:
      obra: esteves-1989
      pagina: 47
    veredicto: 'el propio autor: «Es pura leyenda, nada consta en documentos»'
  - tipo: testimonio-residente
    lectura: 'Judibana era el nombre de la hija del cacique Manaure, unida al señor de Jurijurebo, al
      que mataron con perros: así lo tenía desde niño, antes de leer a Velasco'
    quien: Miguel Gil Urbina, criado en Judibana
    fecha: '2026-08-25'
    eje: referente
    apoyo: Velasco 2015 recoge la misma tradición; dos receptores independientes salvo fuente común reciente
      (reserva declarada en velasco-2015-resistencia §judibana_tradicion)
  - tipo: hipotesis
    lectura: 'doña Juana, la mujer del señor de Hurehurebo bautizada en casa de Ampiés (Castellanos 1589,
      línea 48166), sería el bautismo de Judibana: Ju[dib]ana → Juana por truncamiento'
    quien: proyecto
    fecha: '2026-08-25'
    eje: referente
    veredicto: 'no demostrada: la homofonía puede ser casual y la tradición pudo derivar el nombre desde
      el verso (castellanos_1589_toponimos.yaml §3)'
  procedencia:
    obra: esteves-1989
    pagina: 47
- id: toponimo-105
  forma: yauquiba
  nivel: A
  clase: topónimo
  glosa_fuente: 'Yabu-quiba: la piedra del yabo, árbol resinoso'
  segmentacion: yabu + quiba
  morfemas:
    yabo: cercidium, árbol resinoso  [lexicón caquetío-atestiguado, Zavala — la misma glosa que da Esteves]
    kiba: 'piedra  [lexicón caquetío-atestiguado, Zavala #92/#218]'
  glosa_reconstruida: yabo + piedra = 'la piedra del yabo'
  razon: 'Esteves segmenta y glosa, y los dos morfemas ya estaban atestiguados por Zavala con las mismas
    glosas: cierra sin residuo. Séptima forma de la familia -quiba de Paraguaná.'
  observacion: 'Población del municipio Moruy; 1881: 26 casas, 199 vecinos. ⭐ La cabecera de Esteves dice
    Yauquiba, pero su propia segmentación dice Yabu-quiba — y el mapa vivo (fotos de Miguel, 2026-09-01:
    YABUQUIVA) conserva la b del étimo que el libro perdió en la cabecera. El nombre en uso es más fiel
    que el gazeteer.'
  lecturas:
  - tipo: testimonio-residente
    lectura: vivo en el mapa actual como Yabuquiva, sector del Capubana; con Jadacaquiva hace crecer la
      familia -quiva/-quiba de la península
    quien: Miguel Gil Urbina (fotos del mapa)
    fecha: '2026-09-01'
    eje: referente
  procedencia:
    obra: esteves-1989
    pagina: 67
- id: toponimo-147
  forma: bariquire
  nivel: B
  clase: topónimo
  glosa_fuente: árbol tintóreo
  segmentacion: bara + quire
  morfemas:
    bara: 'árbol  [despejado en la campaña: Baraived = bara + bere ''amargo'']'
    quire: 'color  [NUEVO — glosado por Esteves aquí; recurre 4 veces en su gazetteer: autaquire, bariquire,
      sanajagquire, utaquire]'
  glosa_reconstruida: árbol + color = 'árbol tintóreo'
  razon: 'Nivel B y no A porque `quire` es morfema nuevo: lo glosa una sola fuente. Pero cumple la condición
    de B —recurrencia 4 y glosa consistente— y la otra mitad, `bara`, ya estaba despejada en otro nombre
    y otro distrito. La ecuación cierra sin residuo.'
  observacion: 'Dos referentes: «El Barigüí, aldea del municipio Puerto Cumarebo, Distrito Zamora» y «El
    Bariquisal, quebrada y lugar boscoso en el municipio Guaibacoa, Distrito Colina». La forma que Miguel
    dictó es BARIQUIS, que es la base de El Bariquisal con el `-al` colectivo castellano encima — el mismo
    caso que Guayacanal y Cacetal. ⚠️ No confundir con Bariquisimeto, que tiene entrada propia y otra
    glosa (''río de aguas turbias'').'
  procedencia:
    obra: esteves-1989
- id: toponimo-148
  forma: carirubana
  nivel: B
  clase: topónimo
  segmentacion: cari + (ru) + bana
  morfemas:
    cari: orilla del mar, costa  [lexicón, caquetío-atestiguado]
    bana: cerro, sitio alto  [lexicón, caquetío-atestiguado; D9]
    ru: SIN DESPEJAR — ni la fuente ni el canon lo explican
  glosa_reconstruida: orilla + cerro = 'la orilla del cerro'
  razon: Las dos piezas grandes estaban atestiguadas y la suma da el referente. Es B y no A porque queda
    un residuo sin explicar —la `-ru-` de en medio— y porque la glosa no viene de una fuente impresa del
    canon sino de etimología popular recogida en el barrido (va en lecturas, no en glosa_fuente).
  observacion: Municipio de Punto Fijo, uno de los nombres vivos más grandes de la península. La etimología
    popular coincide EXACTA con la glosa que D9 tuvo que reconstruir para `bana`, y por un canal que no
    es ninguno de sus seis apoyos.
  lecturas:
  - tipo: etimologia-popular
    lectura: «Carirubana significa orilla del peñón, la orilla del cerro, en donde CARI es orilla y BANA
      sitio alto»
    quien: divulgación local
    fecha: '2026-09-10'
    eje: significado
    veredicto: '⭐ vale como CORROBORACIÓN independiente de la glosa de `bana`, no como fuente de la entrada:
      las dos piezas ya estaban en el lexicón antes de leerla. Registro: 6-fusion/barrido_toponimos_web_2026-09-10.yaml'
  procedencia:
    obra: esteves-1989
- id: toponimo-114
  forma: bariquí
  nivel: B
  clase: topónimo
  glosa_fuente: '«Bariquire, que es la forma plena, es un árbol tanante que da una tinta como óxido de
    hierro y, según hemos leído, con esa tinta se pintaban los aborígenes en ciertas ceremonias religiosas.
    Bariquire dice: palo colorado. Bara: palo, árbol. Quire: colorado»'
  segmentacion: bara + quire   [Bariquire; -re cae en la forma viva]
  morfemas:
    bara: 'palo, árbol  [caquetío-atestiguado, Zavala #29; #101 resuelto con Esteves y van Buurt diciendo
      lo mismo]'
    quire: 'color, colorado  [Esteves; recurre en Sanajaquí < Sanajaquire, «Quire: color», p. 58]'
  glosa_reconstruida: 'palo colorado: el árbol de la tinta'
  razon: 'bara está atestiguado y quire es nuevo con recurrencia 2 en Esteves (Bariquire, Sanajaquire)
    y glosa consistente ''color''. B y no A porque quire solo lo da Esteves. Alvarado (Glosario) trae
    la planta: «Barquís, planta sarmentosa de Occidente; tinta que usaban para pintarse los indios ayamanes».'
  observacion: 'Lugar del municipio Jadacaquiva; censo de 1881: 7 casas, 50 vecinos. Esteves lo cuenta
    entre la toponimia indígena de Paraguaná con Baraived, Baracara y Barunú (p. 22). En el mapa vivo:
    «El Variquí» (OSM 2026, lugar, 12.013 -70.079), b~v y artículo castellano.'
  lecturas:
  - tipo: glosa-fuente
    lectura: '«Barquís: especie de planta sarmentosa de Occidente; tinta que usaban para pintarse los
      indios ayamanes»'
    quien: Lisandro Alvarado, Glosario de voces indígenas, vía Esteves 1989
    fecha: '2026-09-07'
    eje: ambos
    procedencia:
      obra: esteves-1989
      pagina: 22
    veredicto: 'segunda atestación de la planta y de su uso; Alvarado la da a los ayamanes, no a los caquetíos:
      el fitónimo es regional'
  procedencia:
    obra: esteves-1989
    pagina: 22
- id: toponimo-144
  forma: guatacare
  nivel: B
  clase: topónimo
  glosa_fuente: «Lugar del municipio Jadacaquiva; hay también Guatacarita. Ambos lugares aparecen censados
    en 1881. De las voces sabemos que Guatacare es un árbol perennifolio, hojas grandes y sapidiáceo [lectura
    dudosa de la imagen]; Guatacarita es una hierba»
  segmentacion: guatacare (fitónimo, sin composición; termina en -are)
  razon: 'fitónimo con glosa de fuente y segunda atestación viva (Medina Colina: «árbol común, y cuyos
    frutos no eran comestibles por el ser humano»), y dos topónimos con el nombre (Guatacare, Guatacarita).
    C como Caseto: planta sin componer. La voz se usa también en el oriente caribe del país y su origen
    no está resuelto. Si -are es aquí ''sitio de'' (morfema-002) o parte del fitónimo, queda abierto.'
  observacion: Censados en 1881 los dos lugares. No está en el mapa vivo de OSM (0 en el barrido de Paraguaná).
  lecturas:
  - tipo: glosa-fuente
    lectura: «árbol común, y cuyos frutos no eran comestibles por el ser humano»
    quien: Medina Colina (dictado de Miguel)
    fecha: '2026-09-07'
    eje: significado
    procedencia:
      obra: medina-colina-sxx
    veredicto: segunda atestación, independiente de Esteves y compatible. Página pendiente.
  procedencia:
    obra: esteves-1989
    pagina: 42
- id: toponimo-143
  forma: guarataro
  nivel: B
  clase: topónimo
  glosa_fuente: «Lugar del municipio Pueblo Nuevo, entre Guacuira y Santa Cruz. En el censo de 1881 tenía
    16 casas y 88 vecinos; hoy el vecindario está integrado a la aldea de Guacuira Arriba y lo nombran
    La Hoyada. Guarataro es un barro de loza, gomoso, con que fabrican budares y ollas. Hay abundancia
    de este material en el lugar»
  segmentacion: guarataro (materia, sin composición)
  morfemas:
    guarataro: 'barro de loza para budares y ollas  [caquetío-atestiguado, Zavala #141 (E) = Esteves;
      lexicón warataro]; Medina Colina: la tierra de grano que se mezcla con el barro de loza, el desgrasante'
  glosa_reconstruida: 'el guarataro: el sitio de la tierra de alfarero'
  razon: 'un lexema atestiguado por dos fuentes independientes con glosa consistente (Esteves 1989 y Medina
    Colina, s. XX) y el referente en el sitio («hay abundancia de este material en el lugar»): B, como
    Abudure. No A porque no hay atestación colonial y el nombre no compone. Es el principio toponímico
    en limpio: el nombre dice lo que hay.'
  observacion: 'El lugar cambió de nombre: hoy La Hoyada, dentro de Guacuira Arriba (OSM 2026: Guaquira
    Arriba, 11.940 -69.887). Par de materias de la olla en caquetío: dabuda ''barro de loza'' (Dabudare)
    y guarataro (aquí). En el resto de Venezuela guarataro es ''guijarro''.'
  lecturas:
  - tipo: glosa-fuente
    lectura: «es una especie de tierra con grano especial que, unido al barro de loza, es la materia prima
      para la alfarería»
    quien: Medina Colina (dictado de Miguel)
    fecha: '2026-09-07'
    eje: significado
    procedencia:
      obra: medina-colina-sxx
    veredicto: 'segunda atestación viva, independiente de Esteves, y más precisa: desgrasante, no barro.
      Página pendiente.'
  procedencia:
    obra: esteves-1989
    pagina: 41
- id: toponimo-113
  forma: capuhana
  nivel: B
  clase: topónimo
  glosa_fuente: '«Capu-hana, con hache intercalada para deshacer el diptongo, es el nombre de un pequeño
    cerro, cerca de Misaray. Quiere decir: el cerro del duende. Capú: duende, ente sobrenatural. Bana:
    cerro, sitio alto»'
  segmentacion: capu + (h)ana   [< capu + bana, con b > h intervocálica]
  morfemas:
    capu: 'duende, espíritu protector de los árboles  [capo/capú del lexicón; Zavala #61 capubana ''duende
      del cerro'']'
    bana: cerro, sitio alto  [D9, resuelta 2026-08-31; el «Barna» del OCR es Bana]
  glosa_reconstruida: cerro del duende
  razon: 'dos morfemas atestiguados, glosa impresa y referente dicho (un cerro). Segunda atestación del
    compuesto capubana, ahora como topónimo y con el núcleo al final: Esteves lee ''el cerro del duende''
    donde Zavala glosaba ''duende del cerro'', y el referente decide. B y no A porque la forma con h es
    de Esteves y la identificación con el capubana de Zavala es nuestra.'
  observacion: 'Alternancia b~h intervocálica: permutación nueva para la skill. En el mapa vivo: «Cerro
    Capuana» (OSM, 11.844 -69.896), unos 6 km al NE de la cumbre del Cerro Santa Ana; Esteves lo llama
    «pequeño cerro cerca de Misaray». Tensión con la lectura de Miguel, que identifica el Capubana con
    el Cerro Santa Ana entero: o son dos Capubana o el nombre bajó del cerro grande al pequeño.'
  lecturas:
  - tipo: hipotesis
    lectura: 'el Capubana es el Cerro Santa Ana (el Cerro de Capú, D9/Velasco) y el centro sagrado del
      sector: Moruy, donde se hacía el merejuy para la chicha ritual, a su izquierda; Chamuriana, con
      el agua que baja del cerro, al sur; Cayerúa al norte. Sitios con funciones rituales distintas organizados
      en torno a la morada del dueño Capo'

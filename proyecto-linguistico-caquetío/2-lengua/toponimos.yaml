  glosa_fuente: Arboleda
  segmentacion: wa- + ada + bacoa   [haplología de -a-]
  despeja: ada
  razon: segunda aparición de `ada`, con la misma glosa que la primera. El `wa-` inicial es el prefijo
    de pluralidad de van Buurt §6 (de Goeje 1928), lo que explica que Zavala glose `adabacoa` 'TODO arboleda'
    y este simplemente 'arboleda'.
  observacion: '⚠ (2026-09-07) Es el mismo nombre que Esteves escribe Guaidabacoa («Guadabacoa es como
    está escrito en el censo de 1881», p. 39: lugar pecuario al norte de Jadacaquiva, 2 casas, 35 habitantes)
    y que González Batista analiza como Guaibacoa. Dos segmentaciones compiten con morfemas atestiguados
    las dos: wa-ada-bacoa ''arboleda'' (Zavala) y way-bacoa ''sitio de guái, el árbol parecido a la ceiba''
    (Esteves y González Batista, independientes). Se conserva la de Zavala como principal por ser la que
    glosa ''arboleda''; las otras van en lecturas. Formas antiguas: Guaybacoa entre las once ciudades
    de Castellanos (1589) y Guaibacoa en la carta de Bastidas (1538, nodo-003) — la identificación con
    ESTE lugar no está demostrada.'
  lecturas:
  - tipo: glosa-fuente
    lectura: '«Guaidabacoa, con sílaba epentética intercalada, es una voz compuesta de guái, árbol parecido
      a la ceiba y bacoa: sitio, paraje»'
    quien: Esteves 1989
    fecha: '2026-09-07'
    eje: significado
    procedencia:
      obra: esteves-1989
      pagina: 39
    veredicto: 'way ''árbol parecido a la ceiba'' es caquetío-atestiguado en el lexicón: la ecuación también
      cierra por aquí. Conflicto de segmentación declarado, sin resolver'
  - tipo: etimologia-analitica
    lectura: Guaibacoa = 'el valle (bacoa) de las ceibas (guay)'

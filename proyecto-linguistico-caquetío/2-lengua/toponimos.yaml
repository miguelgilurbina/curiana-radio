  glosa_fuente: 'en el caribe insular, mái significa: manantial, ojo de agua; iruma: azul celeste, o sea
    que Maitiruma expresa: manantial azul'
  segmentacion: mai + iruma   [según Esteves; no caquetío]
  razon: 'la ecuación cierra, pero con morfemas de otra lengua: ni mai ni iruma están en el lexicón caquetío
    (e''iruma wayuu ''primogénito'' es falso amigo). Uno de los cinco topónimos de Paraguaná que Esteves
    da como no caquetíos (Amuay, Elegüey, Maragüey, Jamaica, Maitiruma): evidencia de convivencia de lenguas
    en la península (cola B.6, Oliver §3.2.4).'
  observacion: 'Aldea del municipio Santa Ana; 1881: 52 casas, 342 vecinos. Geolocalizado: la escuela

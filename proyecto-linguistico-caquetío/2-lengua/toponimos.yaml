corroboraciones_lexicon:
- palabra: bacoa
  glosa_lexicon: bosque, lugar, paraje, sitio fértil
  toponimos:
  - adabacoa
  - guadabacoa
  - quibacoas
  - yacarebacoa
  independencia: alta
- palabra: ebo
  glosa_lexicon: camino, paso, senda
  toponimos:
  - cumarebo
  - jurijurebo
  independencia: alta
  nota: 'dos contraejemplos con glosa divergente: guacurebo, turijerebo'
- palabra: juri
  glosa_lexicon: viento, ventarrón
  toponimos:
  - jurijurebo
  independencia: alta
  nota: y eco insular en Hudishibana 'windy plain' (van Buurt)
- palabra: kiba
  glosa_lexicon: piedra
  toponimos:
  - quibacoas
  independencia: alta
  nota: 'grafías fuente quiva/quiba/cuiva (colisiones D5 2026-08-31: fusionadas como kiba, con kiba-2
    ''ayuda'' de homónimo declarado). El topónimo corrobora kiba-1 ''piedra'' — y Zavala #92 «Cuiva. Kiba»
    trae la grafía k impresa'
- palabra: barici
  glosa_lexicon: agua turbia, tierras coloradas rojizas
  toponimos:
  - barisi
  independencia: alta

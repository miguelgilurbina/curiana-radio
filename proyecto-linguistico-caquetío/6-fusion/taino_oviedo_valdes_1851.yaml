# ══════════════════════════════════════════════════════════════════════
# 1. LA COSTA DE VENEZUELA — lo que va arriba del todo
#    Oviedo NO dice «caquetío» ni una vez en este volumen (`caquet` = 0,
#    `caiquet` = 0, `Curiana` = 0, `Coquibacoa` = 0). Pero sí nombra la
#    provincia de Venezuela, Coro y Paraguaná, y da tres voces de allí.
# ══════════════════════════════════════════════════════════════════════
costa_de_venezuela:

  - forma_fuente: Paraguana
    glosa_fuente: >-
      «En el camino que hay desde la cibdad de Coro, yendo al cabo de Sanct
      Román, que los indios llaman á aquella provinçia Paraguana, es un cabo
      que sale á la mar veynte y çinco leguas ó mas»
    libro: VI
    capitulo: XIX
    pagina_impresa: 205
    atribucion: "«los indios» de la provinçia de Veneçuela, en el camino de Coro al cabo de Sanct Román"
    variedad_declarada: no-declarada
    campo: toponimo
    verificacion: ocr-sin-imagen
    en_el_lexicon: "no como voz; el topónimo Paraguaná sí está en el canon de topónimos"
    por_que_importa: >-
      Es una atestación de 1548 del nombre Paraguaná PUESTO EN BOCA DE LOS
      INDIOS por un cronista que no estuvo allí pero que toma juramento a dos
      testigos ante la Audiencia de Santo Domingo el 13 de julio de 1540
      (Alonso de la Llana y Françisco Nuñez, nombrados en la p. 206) y cita a
      un tercero (Lázaro Bejarano). Es la fuente más antigua del repo para el
      nombre, y llega por una vía independiente de Esteves y de Medina.
    ojo: >-
      El capítulo trata de un espejismo óptico en el istmo, no de lengua. El
      topónimo viene de paso — que es justo lo que lo hace fiable.

  - forma_fuente: comoho
    glosa_fuente: >-
      Título: «De los cardos de las tunas é su fructa, la qual en la provinçia
      de Venezuela en la Tierra-Firme se llama comoho». Cuerpo: «Esta fructa y
      aun el cardo en que nasçe, se llama comoho en la provinçia de Veneçuela»
    libro: VIII
    capitulo: XXVIII
    pagina_impresa: [313, 314]
    atribucion: "provinçia de Veneçuela, en Tierra-Firme — DECLARADA dos veces, en el título y en el cuerpo"
    variedad_declarada: no-declarada
    campo: planta
    verificacion: ocr-sin-imagen
    en_el_lexicon: no
    que_es: "el fruto del cardón de las tunas (Opuntia / Cactaceae) y el propio cardón"
    por_que_importa: >-
      Es lo más cerca que este volumen llega de una voz de la Kaketiana: una
      planta del cardonal —el paisaje que el corpus ya tiene medido
      (`ecologia-007/018/032`: cardonal, sin ríos ni ceibas)— nombrada en la
      provincia que es la de los caquetíos. NO se puede llamar caquetía: Oviedo
      dice «provinçia de Veneçuela», que en 1548 es la gobernación de los
      Welser entera, no una etnia. Va a la esfera, con la etiqueta más baja
      que aguante.

  - forma_fuente: hado
    forma_ocr_cruda: hado
    glosa_fuente: >-
      Título del cap. XX: «De la hierva que los indios de Nicaragua llaman
      yaat, é en la gobernación de Venecuela se dice hado, y en el Perú la
      llaman coca, é en otras partes la nombran por otros nombres diversos,
      porque son las lenguas diferentes». Y en el cuerpo: «En la provincia de
      Veneçuela é otra parte la siembran é cultivan é curan con mucha
      diligençia é cuydado en sus huertos»
    libro: VI
    capitulo: XX
    pagina_impresa: [206, 207]
    atribucion: "gobernación de Veneçuela — DECLARADA"
    variedad_declarada: no-declarada
    campo: [planta, rito]
    verificacion: ocr-sin-imagen
    # 🔴 aquí es donde manda la regla 2
    duda: >-
      El OCR da `hado` en las DOS apariciones (p. 206 y el índice, p. 621),
      pero `hado` es palabra castellana y el contexto pide un nombre indígena.
      La lectura esperable es **hayo**, que es como se llama la coca en el
      occidente de Venezuela y Colombia, y que además es homógrafa de una
      entrada del lexicón (`hayo`, una de las 52 voces que colisionan con un
      nombre del elenco). `d`/`y` es confusión de OCR corriente. **Sin imagen
      no se puede decidir** (p. 206 > 154), así que la entrada queda EN DUDA y
      degradada: no se propone al lexicón hasta verla.
    como_se_cierra: "una sola página de otra copia del tomo I (Internet Archive) resuelve esto en un minuto"
    en_el_lexicon: "`hayo` existe como clave; esta cita NO se le cuelga hasta verificar la forma"

  - forma_fuente: yaguaraha
    glosa_fuente: >-
      «llevan una fructa de dos maneras de forma de higos; los unos colorados ó
      roxos… é llaman los indios á esta fructa yaguaraha. Es muy buena al gusto
      é sano mantenimiento é fresco, y en el cardo en que nasçe, está cubierta
      esta fructa de espinas á manera de castañas»
    libro: VIII
    capitulo: XXXIX
    pagina_impresa: 326
    atribucion: "«los indios» de la isla de Cubagua"
    variedad_declarada: no-declarada
    campo: planta
    verificacion: ocr-sin-imagen
    en_el_lexicon: no
    ojo: >-
      Cubagua es costa de Venezuela pero es la ORIENTAL (Cumaná, Margarita):
      guaiquerí y cumanagoto, no caquetío. Regla 4: la esfera no es la comarca,
      pero tampoco todo lo venezolano es lo mismo. Se anota como esfera, lejos.

# ══════════════════════════════════════════════════════════════════════
# 2. LA ESPAÑOLA — voces que Oviedo declara de esta isla
#    Las de impresa ≤ 154 llevan `verificacion: imagen`: la forma se leyó
#    con los ojos sobre el escaneo, no sobre el OCR.
# ══════════════════════════════════════════════════════════════════════
la_espanola:

  # ── 2.a  Rito, autoridad y memoria (Libro V) ────────────────────────
  - forma_fuente: areyto
    plural_en_la_fuente: areytos
    glosa_fuente: >-
      «Y en esta isla, á lo que he podido entender, solos sus cantares, que
      ellos llaman areytos, es su libro ó memorial que de gente en gente queda
      de los padres á los hijos, y de los presentes á los venideros». Y en el
      cap. I: «esto era en sus cantares é bayles, que ellos llaman areyto, que
      es lo mismo que nosotros llamamos baylar cantando»
    libro: V
    capitulo: I
    pagina_impresa: [125, 127, 128]
    atribucion: "«en esta isla» — la Española. Oviedo lo extiende luego: «en esta y en las otras islas (y aun en mucha parte de la Tierra-Firme)»"
    variedad_declarada: no-declarada
    campo: [rito, transmision]
    verificacion: imagen
    en_el_lexicon: "sí — `areito`, fuente `taíno`, glosa «areíto, danza ritual narrativa, celebración», SIN procedencia.obra"
    aporta: "primera cita citable para `areito`; y la glosa de Oviedo es más precisa que la del lexicón: no es sólo danza, es el SOPORTE DE LA MEMORIA («es su libro ó memorial»)"

  - forma_fuente: duho
    glosa_fuente: >-
      p.125: «no solamente en una parte de la casa le tienen figurado, mas aun
      en los bancos, en que se assientan (que ellos llaman duho)». p.165: «al
      caçique é hombres prinçipales poníanles unos banquillos de palo, muy bien
      labrados, de lindas maderas, é con muchas labores de relieve é
      concavadas, entalladas y esculpidas en ellos, á los quales bancos ó
      escabelo llaman duho»
    libro: V
    capitulo: I
    pagina_impresa: [125, 165]
    atribucion: "«en esta isla» (contexto del cap. I); la segunda cita es del Libro VI cap. II, del juego del batey"
    variedad_declarada: no-declarada
    campo: [objeto, autoridad]
    verificacion: imagen        # p.125 verificada; p.165 es OCR
    en_el_lexicon: "sí — `dujo`, glosa «dujo, asiento de madera tallado del cacique», SIN procedencia"
    aporta: "dos atestaciones en la misma obra, y la segunda confirma la glosa del lexicón (es el banco del caçique y de los principales)"

  - forma_fuente: çemi
    forma_ocr_cruda: gemi
    plural_en_la_fuente: çemies
    glosa_fuente: >-
      «Al qual ellos llaman çemi, y á este tienen por su Dios, y á este piden
      el agua, ó el sol, ó el pan, ó la victoria contra todos sus enemigos y
      todo lo que dessean». Y más abajo: «En esta Isla Española çemi, como he
      dicho, es el mismo que nosotros llamamos diablo»
    libro: V
    capitulo: I
    pagina_impresa: [126, 138]
    atribucion: "«En esta Isla Española» — DECLARADA, literal"
    variedad_declarada: no-declarada
    campo: [rito, creencia]
    verificacion: imagen
    en_el_lexicon: "sí — `cemi`, glosa «cemí, ídolo sagrado, espíritu materializado», SIN procedencia"
    ojo: >-
      Oviedo usa `çemi` para DOS cosas y lo dice: el ídolo/dios, y también el
      adivino que lo lleva («por tal imagen les daban el mismo nombre que á
      ella, é los deçían çemies, allende de los deçir buhitís»). La glosa del
      lexicón sólo recoge la primera.

  - forma_fuente: buhití
    forma_ocr_cruda: buhüí
    plural_en_la_fuente: buhitís
    glosa_fuente: >-
      «E tenian çiertos hombres entre sí que llaman buhití, que servian de
      auríspiçes ó agoreros adevinos; é aquestos les daban á entender que el
      çemí es señor del mundo é del çielo y de la tierra y de todo lo demas».
      Y: «Estos, por la mayor parte, eran grandes hervolarios é tenian
      conosçidas las propiedades de muchos árboles é plantas é hiervas; é como
      sanaban á muchos con tal arte, teníanlos en gran veneraçión»
    libro: V
    capitulo: I
    pagina_impresa: 126
    atribucion: "«En esta Isla Española» (mismo pasaje que çemi)"
    variedad_declarada: no-declarada
    campo: [rito, autoridad, transmision]
    verificacion: imagen
    en_el_lexicon: "sí — `bejique`, glosa «bejique, chamán taíno, mediador ritual», SIN procedencia"
    # este es el caso que justifica todo el protocolo de imagen
    aporta: >-
      La forma del lexicón (`bejique`) NO es la de Oviedo (`buhití`), y el OCR
      daba una tercera cosa (`buhüí`) que no es ninguna de las dos. Sin mirar
      la página, esta entrada se habría citado mal. Además Oviedo añade un
      rasgo que el lexicón no tiene: el buhití es HERBOLARIO, y su medicina va
      junta con la adivinación.

  - forma_fuente: tabaco
    plural_en_la_fuente: tabacos
    glosa_fuente: >-
      «Usaban los indios desta isla entre otros sus viçios uno muy malo, que es

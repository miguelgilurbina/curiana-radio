      «entre las batatas se hallan çinco espeçies ó géneros dellas
      diferençiadas en la rama ó en la hoja, é tienen aquestos nombres:
      aniguamar, atibiuneix, guaraca, guacarayca é guananagax, y todas son
      batatas… y esta que llaman aniguamar tienen por la mejor é mas presçiada»
    libro: VII
    capitulo: IV
    pagina_impresa: 274
    atribucion: "la Española (mismo capítulo que `batata`)"
    variedad_declarada: no-declarada
    campo: [planta, alimento, cultivo]
    verificacion: ocr-sin-imagen
    en_el_lexicon: no
    # 🔴 esta entrada es la que MÁS necesita la imagen
    duda: >-
      Cinco formas largas, raras y en cursiva, leídas por un OCR que en cursiva
      falla: es donde más probable es que haya letras mal. `atibiuneix` y
      `guacarayca` son las más sospechosas. NO fusionar ninguna sin ver la
      página. Se listan porque el HECHO —que la Española distinguía cinco
      variedades cultivadas de batata y les daba nombre propio— vale aunque las
      formas necesiten repaso.
    por_que_importa: >-
      Es taxonomía agrícola indígena: cinco cultivares nombrados de una misma
      raíz, con una de ellas declarada la mejor. Dato de MUNDO (cultivo) tanto
      como de léxico.

  - forma_fuente: mani
    glosa_fuente: >-
      «Una fructa tienen los indios en esta Isla Española, que llaman mani, la

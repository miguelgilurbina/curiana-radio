      huertos y heredades, y es tamaña como piñones con cáscara»
    libro: VII
    capitulo: V
    pagina_impresa: 274
    atribucion: "«los indios en esta Isla Española» — DECLARADA"
    variedad_declarada: no-declarada
    campo: [planta, alimento, cultivo]
    verificacion: ocr-sin-imagen
    en_el_lexicon: no
    ojo: "Oviedo la da como planta de los indios de la Española y comida de «gente baxa», esclavos y muchachos — dato social, no sólo botánico"

  - forma_fuente: yahutia
    variante_en_la_fuente: diahutia
    glosa_fuente: >-

# ══════════════════════════════════════════════════════════════════════
# TAÍNO — Fernández de Oviedo y Valdés, *Historia general y natural de las
# Indias*, vol. I (Primera parte, libros I-XIX), ed. Amador de los Ríos,
# Madrid, Real Academia de la Historia, 1851.
#
# PROPUESTA (regla 5). Comparanda de la ESFERA DE CONTACTO, NO caquetío.
# Campaña del taíno, parcela T1, 2026-09-21.
#
# Las cifras de `meta.cobertura` se MIDEN (regla 1) con
# `6-fusion/scripts/medir_taino_oviedo.py`; no se escriben a mano.
# ══════════════════════════════════════════════════════════════════════
meta:
  obra: oviedo-y-valdes-1851          # clave foránea → 4-fuentes/bibliografia.yaml (regla 8)
  parcela: "T1 — Oviedo y Valdés 1851, vol. I"
  fecha: 2026-09-21
  generado_por: >-
    lectura del escriba (agente Opus 5) sobre la capa de texto del PDF local,
    con verificación por imagen de cada forma allí donde la página todavía
    tiene imagen (impresas 1-154).

  # ─────────────────────────────────────────────────────────────────
  # LO PRIMERO: la ficha de esta obra decía que el PDF era ilegible.
  # Es falso, y hay que decirlo antes que nada.
  # ─────────────────────────────────────────────────────────────────
  correccion_a_la_ficha:
    decia: >-
      `4-fuentes/oviedo-y-valdes-1851.md` (verificado 2026-07-29) daba el PDF
      por «🔴 corrupto»: `pypdf` falla con «Stream has ended unexpectedly»,
      `pdftotext` extrae **0 caracteres**, veredicto «no procesable con las
      herramientas actuales»; y además «sería el volumen equivocado».
    es: >-
      El archivo está TRUNCADO (no tiene `startxref` ni `%%EOF`: 0 de cada uno),
      y por eso los dos extractores se plantan. Pero MuPDF lo abre en modo
      reparación reconstruyendo la tabla de referencias, y entonces el volumen
      entero está ahí — capa de texto incluida. Y es el tomo CORRECTO: portada
      «HISTORIA GENERAL Y NATURAL DE LAS INDIAS… PRIMERA PARTE. MADRID… 1851»,
      libros I-XIX, que son justamente los de costumbres, agricultura, árboles,
      animales, aves, Cuba, Jamáyca y Tierra-Firme.
    como_se_lee: "python -c \"import pymupdf; d=pymupdf.open(RUTA); d[n].get_text()\""
    lo_que_sigue_siendo_verdad: >-
      La IMAGEN escaneada sí se perdió en parte (ver `estado_del_pdf`), y el
      «apéndice de voces del tomo IV» sigue sin existir. Pero la obra dejó de
      ser una deuda documental: es una fuente minable, y lo es desde hoy.

  estado_del_pdf:
    paginas_pdf: 766
    extractor_que_funciona: "pymupdf (MuPDF) en modo reparación (`is_repaired = True`)"
    extractores_que_fallan: "pdftotext (0 caracteres) y pypdf (excepción) — los dos por el truncamiento"
    capa_de_texto: "OCR antiguo (`GlyphLessFont`), 3.000.938 caracteres, 12 páginas del PDF casi vacías"
    desfase_paginas: "impresa = pdf − 118 (pdf 119 = impresa 1; pdf 736 = impresa 618). Constante, verificado en 405 páginas"
    indice_del_editor: "impresas 619-648 — es índice de CAPÍTULOS, no un vocabulario de voces americanas. Sirve para localizar, no para citar"
    # ⚠️ el límite que manda sobre todo lo demás
    imagen_recuperable_hasta: 154
    imagen_perdida_desde: 155
    consecuencia: >-
      Las impresas 1-154 se pueden RENDERIZAR y por tanto la forma se verifica
      con los ojos. De la 155 a la 618 la imagen escaneada está rota («format
      error: object is not a stream») y sólo sobrevive el texto OCR: allí la
      forma es una LECTURA DEL OCR, no una lectura de la página. Cada entrada
      lo declara en `verificacion`, y en duda se degrada (regla 2).

  # ─────────────────────────────────────────────────────────────────
  # La ortografía, medida ANTES de contar (skill minar-fuente §2)
  # ─────────────────────────────────────────────────────────────────
  ortografia_de_la_obra:
    cedilla: "la obra usa ç sistemáticamente (`çemi`, `caçique`, `caçabi`, `haçer`, `deçir`)"
    ocr_destroza_la_cedilla: >-
      El OCR transcribe ç como `g` o como `9`: `gemi` por `çemi`, `cagique` por
      `caçique`, `ca9abi` por `caçabi`, `hager` por `haçer`. Es la sustitución
      más frecuente y afecta a casi toda página.
    y_por_i: "`mahiz`, `areyto`, `yvana`, `Jamáyca`, `Mayci`, `bayle`"
    x_por_/ʃ/: "`xagua`, `axi`, `dexar`, `baxo`"
    ss_intervocalica: "`passado`, `possession`, `assi`, `paresçe`/`paresçer`"
    chripstiano: "siempre `chripstiano`, nunca `cristiano` — sonda útil"
    b_v: "vacila: `buhio`/`huhio` (OCR), `savana`/`sabana`, `bexuco`"
    tildes: "del editor del XIX, no del original; el propio editor anota cuándo enmienda"
    # 🔴 lo que más cuesta, y es lo que hace falta
    las_cursivas_son_las_voces: >-
      El editor de 1851 pone en CURSIVA las voces indígenas. El OCR es peor
      justo en la cursiva, así que **el OCR corrompe precisamente la palabra
      que se busca**. Medido: `buhití` salió `buhüí`; `çemi` salió `gemi`;
      `bixa` salió `hixa`; `dalihao`/`datihao` es ilegible sin imagen. Por eso
      ninguna forma de este YAML se da por buena por el OCR solo cuando la
      página todavía tiene imagen.
    y_la_cursiva_no_se_puede_detectar_sola: >-
      La capa de texto es `GlyphLessFont`: no conserva la fuente, así que no
      hay manera programática de listar las cursivas. Se localiza con el OCR y
      se lee con los ojos.

  formulas_de_atribucion_medidas:
    nota: "conteos sobre el volumen entero, con los espacios normalizados"
    llaman: 517
    los_indios_llaman: 38
    llaman_los_indios: 25
    se_llama: 188
    nombran: 21
    en_su_lengua: 10
    lengua_desta_isla: 5
    # y los ceros que hubo que verificar (regla 6)
    ceros_verificados:
      Jamaica: "0 — porque la obra escribe **Jamáyca**. Verificado en el índice (impresa 619) y en p.82"
      nitaino: "0 con todas las grafías probadas (`nitayno`, `nitaino`, `nilaino`, `nita*`). Oviedo NO da la voz en este volumen"
      maboya: "0 (`maboya`, `mabuya`) — no está en el vol. I"
      behique: "0 con esa grafía: la voz existe pero Oviedo la escribe **buhití** (p.126, verificada en imagen)"
      borattio: "0 (`borat*`, `boratt?io`) — el dato de `creencia-001` NO está en el vol. I"
      cemi_con_c: "0 con `cemi`: la obra escribe **çemi**, que el OCR da como `gemi`"
      cazabe_con_z: "0: la obra escribe **caçabi**"

  advertencia: >-
    ESTO NO ES CAQUETÍO. Es taíno (y, en la sección `no_taino`, cueva,
    nicaragüense y de Tierra-Firme). Entra como ESFERA DE CONTACTO, que se
    mide aparte en `prestamos_de_esfera` y no penaliza — no como andamio de la
    reconstrucción. Y es COLONIAL por definición (regla 3): Oviedo escribe
    entre 1514 y 1548, la simulación es del XIV-XV. No se proyecta nada.

  quedan_fuera:
    recuperacion_contemporanea: >-
      Excluido y dicho: no se ha mirado ni una página de taíno «revivido»,
      neologismo moderno, alfabeto nuevo ni diccionario comunitario del s.
      XX-XXI. Esta parcela sale ENTERA de una edición de 1851 de un texto de
      1535-1548, dominio público.
    tainismo_panhispanico: >-
      Una voz que hoy diga el castellano (`huracán`, `canoa`, `sabana`,
      `macana`) NO entra por ser tainismo de diccionario: entra sólo si Oviedo
      la declara de una isla o una lengua, y con la glosa que él da. La glosa
      se lee VERBATIM antes de aceptar nada.
    no_declaradas: >-
      Lo que Oviedo nombra sin decir de dónde es lleva
      `atribucion: no-declarada` y NO cuenta como taíno.


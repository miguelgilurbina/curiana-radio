# 3. LAS OTRAS ISLAS — Cuba, San Juan, los lucayos
#    Porque el taíno tampoco era una sola lengua.
# ══════════════════════════════════════════════════════════════════════
  # ── 2.e  La mar (Libro XIII) — añadida el 2026-09-24 ────────────────
  # Estaba en el cuerpo y nadie la veía: la voz va en cursiva y el OCR la
  # destroza («á la mar tagua»). La halló #227 (fuentes_poporo_coro_zayas_2026-09-23.yaml §bagua).
  - forma_fuente: bagua
    glosa_fuente: >-
      «Llaman los indios de aquesta Isla Española á la mar bagua (no digo
      baygua, porque baygua es aquel barbasco, con que toman mucho pescado,
      segund tengo dicho, sino bagua es el nombre de la mar en esta isla).»
    libro: XIII
    capitulo: IX
    pagina_impresa: 436
    atribucion: "«aquesta Isla Española» — DECLARADA"
    variedad_declarada: La Española
    campo: geografia
    verificacion: imagen
    en_el_lexicon: "sí — `bagua`, fuente `taíno`, desde el 2026-09-24 («Ok a todo»)"
    aporta: "la página PRIMARIA de `bagua`: el glosario del editor (t. IV p. 594) y Zayas la copian de aquí"

otras_islas:

  - forma_fuente: dalihao
    forma_probable: datihao
    glosa_fuente: >-
      «y entonçes dixo el caçique: “Adelante, adelante, á mi dalihao (que
      quiere deçir mi señor, ó el que, como yo, se nombra), dexa ese bellaco”»
    libro: XVI
    capitulo: V
    pagina_impresa: 473
    atribucion: >-
      San Juan (Boriquén). Lo dice el caçique **Agueybana**, y Oviedo precisa
      que el intérprete habló «en el lenguaje de los indios». Isla DECLARADA
      por el libro entero (Libro XVI = conquista y población de San Juan).
    variedad_declarada: "la de San Juan"
    campo: [autoridad, parentesco]
    verificacion: ocr-sin-imagen
    en_el_lexicon: no
    # ⭐⭐ el hallazgo de la parcela
    por_que_importa: >-
      Esta es la voz que la ficha de la obra llama «la deuda documental más
      grande del proyecto». `creencia-001` afirma *datihao/diao* = «señor»
      citando a Jahn p. 213 n.29, que a su vez cita «el apéndice al tomo IV» de
      Oviedo — apéndice que el rastreo del 2026-08-14 verificó que NO EXISTE.
      La voz está aquí, en el tomo I que el repo ya tenía, con glosa del propio
      Oviedo. La cadena Oviedo → Jahn → nosotros se puede cerrar por fin, y se
      cierra en el volumen equivocado respecto del que Jahn decía.
    # 🔴 y lo que el hallazgo ROMPE
    pero: >-
      No es una segunda atestación independiente (skill §8): Jahn y nosotros
      bebemos del MISMO Oviedo. Lo que cambia es que ahora se puede leer la
      fuente. Y al leerla aparece el problema: **Oviedo la atribuye a SAN JUAN,
      en boca de un caçique de Boriquén — no a los caquetíos.** El corpus la
      trata como dato caquetío. Eso es precontacto ≠ colonial y, peor, isla ≠
      Tierra-Firme. Va al issue como corrección epistémica, no se toca aquí
      (regla 5).
    glosa_doble: >-
      Oviedo da DOS sentidos en el mismo paréntesis: «mi señor» Y «el que, como
      yo, se nombra». El segundo es el hermanamiento por intercambio de nombre
      (el *guaitiao* de otras fuentes), que es una institución, no un título.
      El corpus sólo recoge el primero.
    urgente: "p.473 > 154: NO hay imagen. `dalihao` vs `datihao` es exactamente la confusión l/t del OCR. Verificar en otra copia ANTES de citar la forma"

  - forma_fuente: naboria
    plural_en_la_fuente: naborias
    glosa_fuente: >-
      p.471: «escapóse un muchacho, indio naboría del preso Pero Xuarez».
      p.472: «le dio quatro naborías ó esclavos que le sirviessen é otras joyas
      é preseas». p.473, en boca del intérprete: «Yo te serviré é seré tu
      naboría»
    libro: XVI
    capitulo: [IV, V]
    pagina_impresa: [471, 472, 473]
    atribucion: "San Juan (Libro XVI). La tercera cita es habla indígena reportada"
    variedad_declarada: "la de San Juan"
    campo: [autoridad, parentesco]
    verificacion: ocr-sin-imagen
    en_el_lexicon: "sí — `naboria`, glosa «naboría, servidor permanente, trabajador dep[endiente]», SIN procedencia"
    ojo: >-
      Las tres citas son de uso COLONIAL (el naboría de un español preso, cuatro
      naborías dadas como regalo junto a joyas). Oviedo glosa «ó esclavos», que
      es la lectura del encomendero. Que la institución precontacto fuera eso
      es otra cuestión, y esta fuente no la resuelve. Regla 3.

  - forma_fuente: guahiniquinax
    glosa_fuente: >-
      «Este animal se llama guahiniquinax: son como gorros é del tamaño de una
      liebre, de color pardo, mixto con bermejo. La cola poblada é la cabeça
      como de hurón, é hay muchos dellos en la costa de la isla Fernandina»
    libro: XVII
    capitulo: V
    pagina_impresa: [500, 501]
    atribucion: "isla Fernandina = **Cuba** (Oviedo lo dice: «la isla Fernandina, por otro nombre llamada primero Cuba»)"
    variedad_declarada: "la de Cuba"
    campo: animal
    verificacion: ocr-sin-imagen
    en_el_lexicon: no
    aporta: "voz de CUBA, no de la Española — de las pocas que el volumen atribuye a otra isla con nombre"

  - forma_fuente: ayre
    forma_ocr_cruda: atjre
    glosa_fuente: >-
      «hay otro animal que llaman ayre, tamaño como un conejo, de color entre
      pardo y bermejo, y es muy duro de comer»
    libro: XVII
    capitulo: V
    pagina_impresa: 500
    atribucion: "isla Fernandina = Cuba"
    variedad_declarada: "la de Cuba"
    campo: animal
    verificacion: ocr-sin-imagen
    en_el_lexicon: no
    duda: "forma corrupta en el OCR (`atjre`); `ayre` es reconstrucción probable pero no leída. Degradada"

  - forma_fuente: Mayci
    glosa_fuente: >-
      «el qual puerto es doçe leguas mas al poniente de la punta que llaman
      Mayci; é allí falló gente, assi de la propia isla de Cuba, como de las
      otras que están al norte opuestas»
    libro: II
    capitulo: VI
    pagina_impresa: 25
    atribucion: "punta de la isla de **Cuba**"
    variedad_declarada: no-declarada
    campo: toponimo
    verificacion: imagen
    en_el_lexicon: no

  - forma_fuente: [Guanahani, Caycos, Jumeto, Yabaque, Mayaguana, Samana]
    glosa_fuente: >-
      «que se llaman islas de los Lucayos generalmente todas ellas, no obstante
      que cada una tiene su propio nombre y son muchas; assi como Guanahani,
      Caycos, Jumeto, Yabaque, Mayaguana, Samana…»
    libro: II
    capitulo: VI
    pagina_impresa: [24, 25]
    atribucion: "islas de los **Lucayos** — DECLARADA"
    variedad_declarada: "lucayo"
    campo: toponimo
    verificacion: imagen
    en_el_lexicon: no
    aporta: >-
      Seis topónimos lucayos de 1548, y la observación de que «Lucayos» es el
      nombre colectivo y cada isla tiene el suyo. Es el único sitio del volumen
      donde asoma la variedad lucaya.

  - forma_fuente: [Hayti, Baoruco, Hayna, Xaragua, Higuey, Cibao, Guacanagari, Anacaona, Caonabo, Agueybana, Guarionex, Guaorocaya, Tamayo, Aybaguanex]
    glosa_fuente: "topónimos y antropónimos de la Española y San Juan, recogidos de paso por la narración histórica"
    libro: [II, III, IV, V, XVI]
    capitulo: "varios"
    pagina_impresa: [25, 48, 58, 60, 82, 89, 90, 128, 140, 143, 163, 467, 469, 470, 472, 473]
    atribucion: "la Española, salvo Agueybana (San Juan)"
    variedad_declarada: no-declarada
    campo: [toponimo, antroponimo]
    verificacion: parcial
    en_el_lexicon: no
    estado: >-
      LISTA DE LOCALIZACIÓN, no transcripción. Cada uno necesita su pasaje
      leído antes de contar como dato. `Hayti` es el más importante: es el
      nombre propio de la isla («esta Isla Española, por otro nombre llamada
      Hayti», cabecera del Libro VI cap. I) y la lengua que Oviedo llama «la
      lengua de Hayti» (ver `eracra`).

# ══════════════════════════════════════════════════════════════════════
# 4. LO QUE NO ES TAÍNO — y Oviedo lo dice
#    Separado a propósito: es la mitad del valor de esta minería.
# ══════════════════════════════════════════════════════════════════════
no_taino:

  - forma_fuente: yraca
    plural_en_la_fuente: yracas
    glosa_fuente: >-
      «Son los indios muy amigos de comer hiervas cogidas, y en Tierra-Firme
      llámanlas yracas, que es lo mismo que deçir hiervas… **Este nombre yraca
      es de la lengua de Cueva, en Tierra-Firme, en la gobernaçión de Castilla
      del Oro**»
    libro: VII
    capitulo: XII
    pagina_impresa: 279
    atribucion: "lengua de **CUEVA**, Tierra-Firme, Castilla del Oro — DECLARADA con todas las letras"
    lengua: cueva
    campo: [planta, alimento]
    verificacion: ocr-sin-imagen
    en_el_lexicon: no
    por_que_esta_aqui: >-
      Es el ejemplo perfecto de la trampa nº2 del encargo: una voz india, en un
      libro sobre la agricultura de la Española, que NO es taína y que sólo se
      sabe leyendo la glosa hasta el final. Si se hubiera contado por
      proximidad, entraba como taína.

  - forma_fuente: [yra, yracha]
    glosa_fuente: >-
      «alli donde á las hiervas llaman yracas seyendo muchas, llaman á la muger
      yra, y á la mançeba yracha»
    libro: VII
    capitulo: XII
    pagina_impresa: 279
    atribucion: "lengua de Cueva — misma declaración que `yraca`"
    lengua: cueva
    campo: parentesco
    verificacion: ocr-sin-imagen
    en_el_lexicon: no
    ojo: >-
      Tres voces de la misma familia formal (`yra` / `yracha` / `yraca`) con
      significados que no se parecen: mujer, manceba, hierbas. Oviedo lo saca
      precisamente para ilustrar que el parecido de formas no prueba nada — la
      misma lección que la skill §2 midió con el achagua.

  # 🔴 y la frase que debería ir en la cabecera de toda esta campaña
  - cita_de_metodo: >-
      «y en estas islas y en la Tierra-Firme hay muchas diferençias de lenguas
      de una gente á otra, é una cosa tiene muchos nombres, é también diversas
      cosas tienen un mismo nombre; y querer escudriñar este, seria nunca
      acabar»
    libro: VII
    capitulo: XII
    pagina_impresa: 279
    quien_lo_dice: "Oviedo, 1548"
    para_que_sirve: >-
      Es la advertencia de la campaña dicha por la fuente cuatro siglos y medio
      antes, y conviene citarla en la nota: el cronista sabía que estaba
      mezclando lenguas y lo declaró.

  - forma_fuente: Terarcqui
    glosa_fuente: "«la isla de las Perlas (que los indios llaman Terarcqui)»"
    libro: II
    capitulo: X
    pagina_impresa: 41
    atribucion: "indios de Tierra-Firme, mar del Sur (golfo de San Miguel, Panamá)"
    lengua: "no declarada; zona cueva"
    campo: toponimo
    verificacion: ocr-sin-imagen
    en_el_lexicon: no

  - forma_fuente: yaat
    glosa_fuente: "«la hierva que los indios de Nicaragua llaman yaat» (la misma que en Venezuela `hado`/`hayo` y en el Perú `coca`)"
    libro: VI
    capitulo: XX
    pagina_impresa: [206, 207]
    atribucion: "indios de **Nicaragua** — DECLARADA"
    lengua: "de Nicaragua (no precisa cuál)"
    campo: [planta, rito]
    verificacion: ocr-sin-imagen
    en_el_lexicon: no
    aporta: >-
      El capítulo da la MISMA planta con tres nombres y tres regiones en una
      línea (Nicaragua / Venezuela / Perú) y dice por qué: «porque son las
      lenguas diferentes». Para la esfera de contacto es un modelo de cómo se
      anota un préstamo areal.

  - forma_fuente: olocoton
    glosa_fuente: "«en la gobernaçión de Nicaragua llaman esta fructa olocoton» (la papaya)"
    libro: VIII
    capitulo: XXXIII
    pagina_impresa: 323
    atribucion: "**Nicaragua** — DECLARADA"
    lengua: "de Nicaragua"
    campo: planta
    verificacion: ocr-sin-imagen
    en_el_lexicon: no

  - recordatorio: >-
      `comoho`, `hado`/`hayo`, `Paraguana` y `yaguaraha` están en la sección 1
      (`costa_de_venezuela`) y TAMPOCO son taínos: son de la provincia de
      Veneçuela y de Cubagua. Están arriba por su valor para este proyecto, no
      por su filiación. No se cuentan dos veces.

# ══════════════════════════════════════════════════════════════════════
# 5. HALLAZGOS DE MUNDO (skill §4) — lo que no va al lexicón
#    Minar alimenta la esfera que toque, no sólo el léxico (regla 7).
# ══════════════════════════════════════════════════════════════════════
hallazgos_de_mundo:

  transmision:
    - hecho: >-
        El areyto es el soporte de la memoria histórica y genealógica, y Oviedo
        lo dice con esas palabras: «es su libro ó memorial que de gente en
        gente queda de los padres á los hijos»; «por esta forma resçitan las
        genealogías de sus caçiques y reyes ó señores que han tenido»; «estos
        cantares les quedan en la memoria, en lugar de libros de su acuerdo».
      pagina_impresa: [125, 127, 128]
      esfera: "3-mundo/corpus/transmision.yaml"
      encaja_con: "la sesión 4/4 del corpus cultural (transmisión del saber) ya cerrada"
    - hecho: >-
        La forma del areyto está descrita como técnica: un guía entona, el
        corro repite literalmente, el guía calla mientras responden, y encadena
        el verso siguiente «sin intervalo»; dura tres o cuatro horas «y á veçes
        les tura desde un dia hasta otro»; los guías se remudan y al mudar
        cambian tono y contrapás pero siguen la misma historia.
      pagina_impresa: [127, 128]
      esfera: "3-mundo/corpus/transmision.yaml"
      por_que_importa: "es un mecanismo de transmisión oral con redundancia y relevo — describible, no genérico"
    - hecho: >-
        El buhití es a la vez adivino y herbolario, y su medicina va junta con
        la adivinación: «eran grandes hervolarios é tenian conosçidas las
        propiedades de muchos árboles é plantas é hiervas; é como sanaban á
        muchos con tal arte, teníanlos en gran veneraçión… como entre los
        chripstianos los saçerdotes».
      pagina_impresa: 126
      esfera: "3-mundo/corpus/creencia.yaml + transmision.yaml"

  creencia:
    - hecho: >-
        El çemi se pide para el agua, el sol, el pan y la victoria — cuatro
        peticiones, en ese orden. Y está figurado no sólo en un lugar de la
        casa sino en los bancos (duho), las joyas, los moscadores y la frente.
      pagina_impresa: [125, 126]
      esfera: "3-mundo/corpus/creencia.yaml"
    - hecho: >-
        El areyto solemne acaba en borrachera por diseño: «la misma borrachera
        es la que da conclusión al areyto». Se hace «en bodas ó mortuorios ó
        por una batalla, ó señalada victoria é fiesta»; otros areytos se hacen
        a menudo «sin se emborrachar».
      pagina_impresa: 130
      esfera: "3-mundo/corpus/creencia.yaml"
    - hecho: >-
        El tabaco es rito de principales, no costumbre general: los cañutos de
        dos cañones son de «los caçiques é hombres prinçipales»; los demás usan
        cañuelas de carrizo. Y la hierba se cultivaba en huertos para eso,
        teniéndola «no tan solamente cosa sana, pero muy sancta cosa».
      pagina_impresa: [130, 131]
      esfera: "3-mundo/corpus/creencia.yaml"
    - hecho_negativo: >-
        **NO está el funeral del díao.** Ni `borattio` ni `datihao` como voz
        caquetía ni la desecación sobre brasas aparecen en este volumen
        (`borat*` = 0 verificado). Lo que sí está es `dalihao` en San Juan
        (§3). El funeral sigue estando en el tomo II, como decía la ficha.
      esfera: "3-mundo/corpus/creencia.yaml — `creencia-001`, `creencia-010`"

  ecologia:
    - hecho: >-
        Censo de cuadrúpedos de la Española según Oviedo: cinco, y cuatro con
        nombre indígena — «perro, hutia, quemi, mohuy, cori». Y la secuencia de
        agotamiento: se comieron primero esos y luego «se dieron á comer unas
        sierpes que se llaman yvana».
      pagina_impresa: 50
      esfera: "3-mundo/corpus/ecologia.yaml"
    - hecho: >-
        Dos panes y no uno: el de grano (mahiz) y el de raíz (caçabi, de yuca),
        «muy distintos é apartados el uno del otro», y Oviedo dice que los
        cristianos llegaron a preferir el segundo.
      pagina_impresa: [264, 268]
      esfera: "3-mundo/corpus/ecologia.yaml"
    - hecho: >-
        La yuca de la Española mata y la de Tierra-Firme no: «en la
        Tierra-Firme hay yuca que no es mortal… y en esta isla é las otras
        comarcanas deste golpho, toda la yuca que hay, por la mayor parte, es
        de la que mata». Y existe una dulce con nombre propio (`boniata`).
      pagina_impresa: 269
      esfera: "3-mundo/corpus/ecologia.yaml"
      ojo: "es una diferencia ISLA / TIERRA-FIRME en la misma planta, justo el tipo de distinción que la regla 4 pide no aplanar"
    - hecho: >-
        Cinco cultivares nombrados de batata y tres de piña: la agricultura de
        la isla distinguía variedades y las nombraba, y una de las de batata
        estaba declarada «la mejor é mas presçiada».
      pagina_impresa: [274, 280]
      esfera: "3-mundo/corpus/ecologia.yaml"
    - hecho: >-
        En la provinçia de Veneçuela el cardón de las tunas y su fruta se
        llaman `comoho`, y allí se cultiva la hierva de mascar en huertos. Es
        ecología del CARDONAL, que es el paisaje del corpus caquetío.
      pagina_impresa: [206, 207, 313, 314]
      esfera: "3-mundo/corpus/ecologia.yaml"
      encaja_con: "ecologia-007/018/032 (cardonal, sin ríos ni ceibas)"

  casa_y_asentamiento:
    - hecho: >-
        Dos tipos de casa, y el de los principales NO es el redondo: el caney
        es la casa redonda de postes en círculo con mástil central; la de «los
        hombres mas prinçipales é caçiques» es «á dos aguas y luenga», con
        portales que sirven de zaguán. Vivían «en las costas ó riberas de los
        rios ó çerca de la mar».
      pagina_impresa: [163, 164, 165]
      esfera: "3-mundo/corpus/ — y contradice la glosa de `caney` en el lexicón"
    - hecho: >-
        Cada pueblo tenía plaça con «lugar diputado» para el batey, y además
        otro sitio a las salidas del pueblo, con asientos, más grande que los
        de las plaças. Los caçiques miraban desde banquillos de palo (duho);
        los demás, desde asientos de piedra.
      pagina_impresa: [163, 165]
      esfera: "3-mundo/corpus/ — plaza, autoridad, rito"
      por_que_importa: "es planta urbana: dos espacios de juego por poblado, y jerarquía materializada en el asiento"

  geografia_politica:
    - hecho: >-
        La provinçia de Veneçuela en 1548 está «encomendada en gobernaçión á
        los Alemanes Velgares» (los Welser), y el camino de Coro al cabo de
        Sanct Román atraviesa «aquella provinçia [que] los indios llaman
        Paraguana».
      pagina_impresa: 205
      esfera: "3-mundo/geografia_politica.yaml"
      ojo: "colonial, 1540-1548. No se proyecta al XIV-XV (regla 3); vale como atestación del nombre y del marco"

  metodo:
    - hecho: >-
        Oviedo declara él mismo que está mezclando lenguas y que no piensa
        deslindarlas: «una cosa tiene muchos nombres, é también diversas cosas
        tienen un mismo nombre; y querer escudriñar este, seria nunca acabar»
        (p.279). Cualquier uso de este volumen como fuente léxica tiene que
        citarse con esa advertencia al lado.
      pagina_impresa: 279
      esfera: "4-fuentes/ (bitácora) y 2-lengua/metodo-comparativo"

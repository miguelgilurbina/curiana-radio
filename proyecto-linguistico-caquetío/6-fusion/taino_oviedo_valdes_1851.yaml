  libros_leidos:
    # qué se leyó de verdad, no qué se hojeó
    completos_o_casi:
      - "Libro V (impresas 124-160) — ritos, çerimonias y costumbres. Es el libro con más voces glosadas y, por suerte, cae casi entero en la franja con imagen"
      - "Libro VI, caps. I-IV y XIX-XX (161-171, 205-207) — casas, batey, canoas, huracanes; y el capítulo de Paraguaná y el de la hierva de Venezuela"
      - "Libro VII (263-286) — agricultura: mahiz, caçabi, yuca, ajes, batatas, maní, lirenes, la piña"
    por_sondeo_dirigido:
      - "Libros I-IV (1-123) — sondeados por fórmula de nombrar: pp. 25, 41, 48-50, 62-68, 82, 90"
      - "Libro VIII (287-360) — árboles fructíferos: pp. 296-297, 305-306, 313-315, 323, 326"
      - "Libros IX-XI (361-385) — pp. 376, 380"
      - "Libros XII-XIV (386-448) — animales, animales de agua, aves: pp. 393-396, 424, 433, 442"

      estas islas todas» de «lo propio de la lengua de Hayti», y da las dos
      formas: `buhio` es la voz general (la que se quedó en el castellano) y
      `eracra` es la de la lengua. Es exactamente la distinción que pedía el
      encargo —el taíno no era una sola lengua— dicha por el cronista. Y el
      lexicón tiene `bohio`/`bohío` y NO tiene `eracra`: tenemos la voz de
      koiné colonial y nos falta la propia.

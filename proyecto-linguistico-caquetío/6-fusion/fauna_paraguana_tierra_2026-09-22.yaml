      tapan el cielo y dejan el maizal pelado. Se cogen, se meten en cestas y
      se comen asados.
    sonido: {descripcion: 'la nube sobre el maizal (Oviedo no describe el ruido)', fuente: 'Oviedo t. II p. 331', onomatopeya_fuente: null}
    fuentes: [oviedo-y-valdes-1852-1855, medina-colina-sxx, gbif-paraguana-2026]


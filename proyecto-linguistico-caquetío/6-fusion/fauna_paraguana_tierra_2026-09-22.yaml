# ═════════════════════════════════════════════════════════════════════════
# 3. CANDIDATOS A REFERENTE — los HUECOS, ordenados
# ═════════════════════════════════════════════════════════════════════════
# Criterio: es_hueco, presencia segura o probable, visible, cerca de la vida
# diaria, con descripción y —si hay— sonido de fuente. Tono del catálogo
# (curiana_koine.REFERENTES_NOVEDOSOS), pero como HUECO: algo que se ve siempre,
# no algo nuevo. desc_referente ≤ 180, se_oye ≤ 80. El orden lo abre la
# decisión de Miguel (db.4): la tarántula azul primero.
candidatos_referente:
  - orden: 1
    especie: fa1-001
    id_propuesto: tarantula_azul
    desc_referente: >-
      la araña grande y peluda de patas azules y vientre naranja que vive en
      un hueco de árbol forrado de tela blanca, en el monte del cerro
    se_oye: 'nada: sólo el roce de sus patas sobre la tela seca'
    por_que: 'decisión de Miguel (db.4); presencia segura; la más llamativa de la parcela; SIN sonido de fuente, y se dice'

  - orden: 2
    especie: fa1-011
    id_propuesto: conejo
    desc_referente: >-
      el animal pardo de orejas largas y cola blanca que se agacha quieto
      entre la paja y huye corriendo como liebre; al que no se le tira echado
    se_oye: 'casi nada: huye callado entre la paja'
    por_que: 'presencia segura (tres crónicas y GBIF), caza diaria, y la única regla de caza caquetía del repo (Simón vía Arcaya p. 42)'

  - orden: 3
    especie: fa1-036
    id_propuesto: cascabel
    desc_referente: >-
      la serpiente gruesa de rombos oscuros y cabeza de triángulo que duerme
      entre los cujíes y, al sentir el paso, levanta la cola y la hace sonar
    se_oye: 'la cola seca que suena al agitarse, un siseo de semillas'
    por_que: 'segura; el animal que el paisaje enseña a temer (ecologia-035); el único que SUENA de las serpientes, y `buio` no la distingue'

  - orden: 4
    especie: fa1-050
    id_propuesto: sapito_lipon
    desc_referente: >-
      el sapito gordo y chato con dos manchas negras como ojos en la cadera,
      que aparece en los charcos la noche después del aguacero
    se_oye: 'dos notas en la noche de los charcos: do-ri, do-ri'
    se_oye_sin_silabas: 'un canto corto de dos notas que se repite en los charcos después de la lluvia'
    por_que: 'segura; el ÚNICO de la parcela con onomatopeya de fuente (van Buurt p. 30); ver el aviso en el issue: «do-ri» casi le dicta a los agentes el nombre papiamento'

  - orden: 5
    especie: fa1-023
    id_propuesto: perro_de_la_casa
    desc_referente: >-
      el perro pequeño de pelo corto que duerme junto al fogón y sigue a la
      gente al conuco, y que nunca ladra
    se_oye: 'nada: el perro de la casa no ladra'
    por_que: 'probable (Oviedo t. II p. 331, verificado en imagen); el único animal de la casa; el sonido —su silencio— es de fuente'

  - orden: 6
    especie: fa1-016
    id_propuesto: mapurite
    desc_referente: >-
      el animal negro con dos listas blancas del lomo a la cola, que camina
      despacio y no huye, y levanta la cola cuando alguien se acerca
    se_oye: 'nada; lo que se nota es el olor que deja'
    por_que: 'segura (GBIF, ecologia-034); visible y reconocible; su señal es el olor (Alvarado, pdf 237), no el sonido'

  - orden: 7
    especie: fa1-003
    id_propuesto: arana_plateada
    desc_referente: >-
      la araña de lomo plateado que espera quieta en el centro de una tela
      redonda tendida entre espinas, con bandas blancas en zigzag
    se_oye: 'nada'
    por_que: 'probable (GBIF); visible todos los días en el cardonal; sin sonido'

  - orden: 8
    especie: fa1-065
    id_propuesto: chicharra
    desc_referente: >-
      el bicho de alas transparentes pegado a la corteza, que casi no se ve y
      llena de chirrido las tardes de calor
    se_oye: 'un chirrido largo y fuerte desde los árboles, en lo más caliente'
    por_que: 'probable (un registro GBIF); el sonido de la seca. El se_oye NO tiene fuente leída: degradar si Miguel lo exige'

  - orden: 9
    especie: fa1-066
    id_propuesto: zancudo
    desc_referente: >-
      el mosquito de patas largas que sale del agua quieta de los charcos y
      pica de noche
    se_oye: 'un zumbido agudo junto al oído, en la oscuridad'
    por_que: 'segura (GBIF, especies nativas); de todas las noches; `jején` nombra al diminuto, no a éste. Sonido sin fuente leída'

  - orden: 10
    especie: fa1-002
    id_propuesto: ciempies
    desc_referente: >-
      el bicho largo de anillos rojizos y patas amarillas que corre bajo las
      piedras y muerde con dos garfios
    se_oye: 'nada; un roce entre la hojarasca'
    por_que: 'probable (GBIF); se ve poco pero no se olvida; sin sonido'

referentes_descartados:
  - {especie: fa1-021, razon: 'endémico pero escondido en el bosque del cerro: nadie lo vería a diario'}
  - {especie: fa1-034, razon: 'endémico, del tamaño de un dedo y bajo las piedras'}
  - {especie: fa1-024, razon: 'con carga cultural (la piel en la frente), pero casi nunca se ve; bueno para la era 3'}
  - {especie: fa1-067, razon: 'cocuyo: visual magnífico, pero ya tiene voz de la esfera (taíno cocuyo) y sin registro en la península'}
  - {especie: fa1-013, razon: 'rabipelado: probable, pero sin rasgo sonoro ni registro GBIF en el polígono'}

# ═════════════════════════════════════════════════════════════════════════
# 4. PROPUESTAS A 3-mundo/corpus/ecologia.yaml (esquema de ese archivo)
# ═════════════════════════════════════════════════════════════════════════
# PROPUESTA, no edición: los ids son provisionales (el siguiente libre es
# ecologia-085 hoy en main; si otra campaña lo toma antes, se renumeran).
propuestas_ecologia:
  - id: ecologia-085-propuesto
    voz: null
    contenido: >
      La tarántula azul (Chromatopelma cyaneopubescens, Strand 1907) es un
      animal de este monte: su localidad tipo es Paraguaná («Paraguara»), el
      género tiene una sola especie, y 9 de sus 11 registros verificados están
      en la península, su baluarte; los demás, en Coro, Colina y Lara. Vive en
      un hueco de árbol, tronco caído o grieta de corteza que forra de seda; es
      azul metálico con el abdomen naranja; los machos vagan de abril a junio.
    fuente: atestiguado
    referencia: "Sherwood y Gianni-Zurita 2023, Anartia 36, pp. 36-41; Colmenares 2015 (Libro Rojo, En Peligro B1ab(iii,v))"
    procedencia: {obra: sherwood-gianni-zurita-2023, pagina: '36-41'}
    dominios: [ecologia, fauna, hueco_lexico]
    agentes_relacionados: []
    palabra_lexicon: null
    locacion: matorral
    lectura: >-
      Presencia en el s. XV segura por biología (endemismo regional), no por
      documento: ninguna fuente la nombra ni le da uso o creencia (búsqueda de
      6-fusion/scripts/buscar_tarantula_azul.py). Es hueco léxico: el lexicón
      no tiene voz caquetía para araña. «Endémica de la península» se corrige
      a endémica de Venezuela con núcleo en la península.

  - id: ecologia-086-propuesto
    contenido: >
      La fauna de tierra de la provincia de Venezuela hacia 1540, según el
      informe del obispo Bastidas que Oviedo copia: osos hormigueros, «tigres
      muchos», «venados en grand número, é á manadas», puercos de monte de dos
      géneros, «conejos tantos ó mas que en nuestra España; pero… menores y
      alebrestados», perezas, armados, «cories», ardillas, dantas, «perros
      gosques que crian los indios en sus casas, é son mudos, que no ladran» y
      leones pardos.
    fuente: atestiguado
    referencia: "Oviedo y Valdés, Historia general y natural, t. II (1852), lib. XXV, cap. XXII, pp. 330-331 (verificado en imagen el 2026-09-22)"
    procedencia: {obra: oviedo-y-valdes-1852-1855, pagina: '330-331'}
    dominios: [ecologia, fauna, caza]
    agentes_relacionados: []
    palabra_lexicon: null
    locacion: matorral
    lectura: >-
      Capa de contacto temprano y de la PROVINCIA, no de la península (regla
      4): prueba lo que había en la tierra de Coro, no en cada cerro. Corrige a
      ecologia-033/034 en un punto: la caza de la provincia no era tan pobre
      como el istmo de hoy («venados á manadas»). El perro mudo es el único
      animal doméstico precontacto de la lista y NO es el perro europeo.

  - id: ecologia-087-propuesto
    contenido: >
      La miel era de abejas sin aguijón, y se criaban en casa: «Algunas crian
      los indios en sus casas en unos calabaços grandes: no pican ni tienen
      ponçoña… y los vasillos de los panales… son cada uno tan grande como una
      bellota»; hay miel de cera amarilla, más dulce, y de cera negra. También
      comían la miel de ciertas avispas «muy malas y ponçoñosas».
    fuente: atestiguado
    referencia: "Oviedo y Valdés, t. II, lib. XXV, cap. XXII, p. 331 (verificado en imagen)"
    procedencia: {obra: oviedo-y-valdes-1852-1855, pagina: '331'}
    dominios: [ecologia, fauna, recoleccion, oficios]
    agentes_relacionados: []
    palabra_lexicon: ruba
    locacion: bohios
    lectura: >-
      Es la primera técnica de cría animal de la provincia en el corpus, y
      casa con el racimo de la miel de Medina (ecologia-062 a 067: la abeja
      amarilla `wakukero`, la negra `ruba`, el panal en tronco seco). Capa de
      contacto temprano; su proyección al s. XV es lectura (la técnica no
      depende de nada europeo).

  - id: ecologia-088-propuesto
    contenido: >
      La langosta es plaga y es comida: «Hay mucha langosta, que los indios
      llaman tara, y esta no es continua; pero algunos años hay tanta, que
      cubre el ayre á no se poder ver el çielo… si dá en un mahiçal, lo tala
      todo… también los indios en su vengança las toman y embanastan y se las
      comen asadas».
    fuente: atestiguado
    referencia: "Oviedo y Valdés, t. II, lib. XXV, cap. XXII, p. 331 (verificado en imagen); la campaña taíno 2 ya lo midió para la glosa de `tara`"
    procedencia: {obra: oviedo-y-valdes-1852-1855, pagina: '331'}
    dominios: [ecologia, fauna, agricultura]
    agentes_relacionados: []
    palabra_lexicon: tara
    locacion: conuco
    lectura: 'Un año de langosta es un evento del calendario, no un referente: tiene nombre (`tara`) y tiene respuesta (cestas y brasa).'

  - id: ecologia-089-propuesto
    contenido: >
      Los endemismos de tierra de la península: el ratón mochilero de
      Paraguaná (Heteromys oasicus), sólo en los bosques del Cerro Santa Ana y
      Monte Cano; el tuqueque de Monte Cano (Lepidoblepharis montecanoensis),
      bajo piedras y hojarasca de las quebradas; y la tarántula azul, con su
      núcleo aquí. El cerro y Monte Cano son islas de bosque húmedo en
      el cardonal, y ahí vive lo que no hay en otra parte.
    fuente: atestiguado
    referencia: "Libro Rojo de la Fauna Venezolana 2015 (Gutiérrez et al.; Molina et al.); Sherwood y Gianni-Zurita 2023; GBIF (6-fusion/gbif_fauna_tierra_paraguana_2026-09-22.yaml)"
    procedencia: {obra: libro-rojo-fauna-venezolana-2015, pagina: 'fichas del ratón mochilero y del tuqueque de Monte Cano'}
    dominios: [ecologia, fauna]
    agentes_relacionados: []
    palabra_lexicon: null
    locacion: null
    lectura: 'Capa moderna del censo; los endemismos son del medio (evolucionaron aquí) y por eso proyectables al s. XV. Que el cerro sea isla de bosque sostiene capubana_agua_y_microclima.yaml.'

  - id: ecologia-090-propuesto
    contenido: >
      El cardón necesita al murciélago: el murciélago cardonero (Leptonycteris
      curasoae) poliniza de noche las flores de los cardones y los agaves y
      dispersa sus semillas; vive en colonias de miles en las cuevas de la
      península (Jacuque, El Pico, Piedra Honda, El Guano) y cruza a las islas
      ABC.
    fuente: atestiguado
    referencia: "Libro Rojo de la Fauna Venezolana 2015, ficha del murciélago cardonero (Vulnerable A2c)"
    procedencia: {obra: libro-rojo-fauna-venezolana-2015, pagina: 'ficha del murciélago cardonero'}
    dominios: [ecologia, fauna, flora]
    agentes_relacionados: []
    palabra_lexicon: wache
    locacion: matorral
    lectura: 'Enlaza el fruto del cardón (dato, tampañá, cachinare) con la noche y la cueva. Proyectable: la relación planta-murciélago es del medio, no de la gente.'

  - id: ecologia-091-propuesto
    contenido: >
      Las cabras llegaron pronto y se quedaron: hacia 1589 los campos de Coro
      estaban «llenos» de ganado y «De cabras muchedumbre copiosa»; en 1546 ya
      había «algunas bacas y obejas y puercos». Hoy el pastoreo de caprinos es
      la primera amenaza de los bosques del cerro y de Monte Cano.
    fuente: atestiguado
    referencia: "Castellanos, Elegías, líneas 48235-48243; Pérez de Tolosa 1546 vía Arcaya 1920 p. 264; Libro Rojo 2015 (ratón mochilero, tuqueque de Monte Cano)"
    procedencia: {obra: castellanos-elegias, pagina: 'líneas 48235-48243'}
    dominios: [ecologia, fauna, biosfera_perdida, metodo]
    agentes_relacionados: []
    palabra_lexicon: null
    locacion: null
    lectura: 'Fecha la frontera de la regla 3 para la fauna: el chivo no es del s. XV y el monte que hoy se ve está ramoneado por él.'

# ═════════════════════════════════════════════════════════════════════════
# 5. CEROS VERIFICADOS Y DEUDAS
# ═════════════════════════════════════════════════════════════════════════
ceros_verificados:
  - que: 'relación humana con la tarántula (nombre, uso, creencia)'
    como: '6-fusion/scripts/buscar_tarantula_azul.py --contexto (raíces: araña con y sin eñe, tarántula, arácnido, arachn, spider, pollera)'
    resultado: 'cero en Paraguaná; los tres aciertos con arañas son de fuera de la esfera o interpretativos (tarantula_azul.relacion_humana)'
  - que: 'escorpiones en el polígono'
    como: 'GBIF, faceta de especies de Arachnida'
    resultado: 'cero: mide GBIF (bicho nocturno), no la península'
  - que: 'voz caquetía para conejo, araña, sapo, perro, cascabel'
    como: 'glosas de VOCABULARIO_BASE y FUERA_DEL_HABLA, las cuatro capas caquetías'
    resultado: 'cero para las cinco; el perro y el sapo tienen voz wayuu en el lexicón (erü, eperü''üi)'
  - que: 'grabaciones por ID (xeno-canto, Macaulay)'
    como: 'API v2 de xeno-canto (retirada), v3 (pide cuenta), buscador web (Access Denied)'
    resultado: 'no consultable sin cuenta: ninguna onomatopeya sale de una grabación'
deudas:
  - 'Barrio-Amorós, Miralles, Rivas y Barros 2008, «Reptiles de la península venezolana de Paraguaná», Reptilia 72: 43-48 — la lista de reptiles de la península; no es de acceso abierto (revista comercial): se anota, no se baja'
  - 'Marte 2012, «Hábitat y microhábitat de la Chromatopelma cyaneopubescens en los Bosques Secos del segundo piso biótico del Cerro Santa Ana», resumen del III Congreso Venezolano de Diversidad Biológica, p. 93'
  - 'Anderson 2003 (Heteromys oasicus), en Zenodo 5373417 — abierto; no se bajó por economía'
  - 'una lista de escorpiones y de insectos de Falcón con especies de la península'
  - 'grabaciones por ID para el sapo, la rana silbadora, la chicharra, el zancudo y la cascabel (necesitan cuenta en xeno-canto o Macaulay: decide Miguel)'

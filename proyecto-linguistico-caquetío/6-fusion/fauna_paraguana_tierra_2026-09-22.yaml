# ─────────────────────────────────────────────────────────────────────────
# PROPUESTA — La fauna de TIERRA de Paraguaná en el siglo XV (campaña FA1)
#
# Encargo de Miguel, 2026-09-22 (verbatim, en el preámbulo de la campaña):
#   «otro agente que busque y mine todas las especies que conviven en La
#    Península que podamos intuir que lo hacían en esa fecha […] y luego va a
#    realizar una campaña para describirlos visualmente, y si es posible
#    encontrar la onomatopeya que hacen, así le damos a los agentes una
#    descripción y onomatopeya que "escuchar" por así decirlo.»
# Y su decisión de la base (db.4, rama tanda/base-2026-09-22): los referentes
#   empiezan por «los animales que no sabemos como se llamaban originalmente,
#   por ejemplo La Tarantula azul, que si o si tuvo que ser una especie muy
#   importante ya que es endémica de la Península».
#
# Regla 5: esto PROPONE. No toca el lexicón, ni 3-mundo/corpus/, ni el motor.
# Parcela: tierra (mamíferos, reptiles, anfibios, arácnidos, miriápodos,
# insectos, caracoles de tierra). Las aves son de FA2; el mar y las orillas
# (cangrejos de tierra incluidos) de FA3.
# Cifras de GBIF: 6-fusion/gbif_fauna_tierra_paraguana_2026-09-22.yaml,
# GENERADO por 6-fusion/scripts/gbif_fauna_tierra_paraguana.py (regla 1: aquí
# no se copian). Largos y claves: 6-fusion/scripts/verificar_fauna_tierra.py.
# ─────────────────────────────────────────────────────────────────────────
meta:
  recogido: '2026-09-22'
  estado: sin-fusionar
  quien: agente FA1 (Claude Opus 5.5), campaña de minería 3
  rama: campana/fauna-tierra
  pregunta: >-
    ¿Qué animales de tierra vivían en Paraguaná (cardonal, médanos del istmo,
    Cerro Santa Ana, salinas, conucos) en el s. XV, cómo se llaman en cada
    lengua de la esfera, cómo se ven y cómo suenan — y cuáles no tienen voz
    caquetía conocida y pueden ser referentes, empezando por la tarántula azul?
  respuesta_corta: >-
    La tarántula azul existe, está descrita y es de aquí: Chromatopelma
    cyaneopubescens (Strand, 1907), localidad tipo «Paraguara» = Paraguaná, En
    Peligro en el Libro Rojo 2015. Pero NO es endémica de la península en
    sentido estricto: es endémica de VENEZUELA, y la península es su baluarte
    (9 de 11 registros verificados; otros en Coro, en el municipio Colina y
    cerca de Barquisimeto — Sherwood y Gianni-Zurita 2023). Estuvo en el s. XV
    con seguridad (evolucionó en este monte seco), pero NINGUNA fuente del
    repo ni de las leídas le da nombre, uso ni creencia: su importancia para
    los caquetíos es una intuición de Miguel sin evidencia, y el referente no
    la afirma. El hallazgo mayor de la campaña es otro: Oviedo (t. II, lib.
    XXV, cap. XXII, pp. 330-331, verificado en imagen) inventaría la fauna de
    tierra de la provincia de Venezuela hacia 1540 —venados «á manadas»,
    conejos, osos hormigueros, «armados», «cories», perros mudos «que no
    ladran», abejas sin aguijón criadas en calabazos, avispas de miel, la
    langosta `tara` que se come asada— y es la mejor prueba de presencia
    temprana que tiene el proyecto para esta parcela.
  lo_que_resulto_falso:
    - >-
      «Endémica de la península» (db.4). Colmenares 2015 (Libro Rojo) lo dice;
      Sherwood y Gianni-Zurita 2023 lo corrigen con registros verificados fuera
      de ella (Coro, Colina, Lara). Endémica de Venezuela y del monte seco del
      noroeste; la península es su núcleo y su localidad tipo.
    - >-
      «Vive en madrigueras» (fichas divulgativas, y el propio Libro Rojo habla
      de «madrigueras»). La literatura de campo la da semiarborícola: su
      refugio es un hueco de árbol, un tronco caído o una grieta de corteza,
      tapizado de seda (Klaas 2003 vía Sherwood y Gianni-Zurita 2023, p. 37).
    - >-
      De paso, y fuera de la parcela: el `korie` 'armadillo' del lexicón
      (caquetío-atestiguado; Oliver A-9 «vocabulario del s. XVI» y Zavala #90)
      podría ser una mala lectura de Oviedo t. II p. 330, «Armados *cories*
      hay», donde `cori` (en cursiva) es el cuy/curí de La Española (t. I lib.
      XII cap. IV, p. 390) y «armados» son los armadillos. Es una sospecha con
      forma de cadena de copia, como `datihao`: va al issue, no se afirma.
  como_se_midio:
    - 'GBIF: API pública de búsqueda con facetas sobre un polígono de la península y el istmo (6-fusion/scripts/gbif_fauna_tierra_paraguana.py); sin descarga, así que sin DOI: se cita la consulta y cada conjunto de datos'
    - 'lexicón: curiana_lexicon.VOCABULARIO_BASE y FUERA_DEL_HABLA leídos (sin tocar), glosas con palabras de fauna, todas las capas; y curiana_sim/lexicon_van_buurt.py (VAN_BUURT_S6/S11, propuesta no importada)'
    - 'fuentes nuevas: Sherwood y Gianni-Zurita 2023 (descargada, CC BY 4.0) y las fichas del Libro Rojo 2015 de la tarántula, el ratón mochilero, el tuqueque de Monte Cano y el murciélago cardonero (copia de archive.org de especiesamenazadas.org: el sitio rechazó la conexión directa)'
    - 'fuentes del repo releídas para esta pregunta: Oviedo t. II pp. 330-331 (imagen), t. I p. 390 y cap. XXIII-XXIV del lib. XII; Castellanos líneas 48221-48246; Arcaya pp. 42, 57, 144, 264; Alvarado 1921 (entradas de fauna); van Buurt 2014 §6 y §11; Medina Colina (dictado); Esteves p. 51'
    - 'ceros de la tarántula: 6-fusion/scripts/buscar_tarantula_azul.py (araña, tarántula, arácnido, spider, pollera) sobre 16 textos y 5 PDF del repo'
  convenciones:
    presencia_s_xv:
      segura: 'endémica (evolucionó aquí), o registrada en zooarqueología o en crónica temprana de la provincia'
      probable: 'nativa, de distribución amplia en el Caribe sur seco, registrada hoy en la península'
      dudosa: 'nativa de la región pero sin registro en la península, o identificación insegura'
      excluida: 'introducida después de 1492, con la fecha o el porqué'
    capa_de_las_evidencias: 'epoca: precontacto | contacto-temprano | colonial | moderno (el censo de hoy NO es el del s. XV — regla 3)'
    es_hueco: 'true si no hay voz CAQUETÍA en el lexicón (ninguna de las cuatro capas) que nombre al animal; una voz genérica (buio «serpiente») cubre al grupo, no a la especie: se dice en cada caso'
    descripcion_visual: '≤ 220 caracteres, lo que vería alguien del s. XV, sin referencias modernas'
    sonido: >-
      descripción con fuente; la onomatopeya, sólo si una fuente la escribe, y
      LITERAL. Toda onomatopeya es una transcripción MODERNA, no una palabra
      caquetía. `silabeo_propuesto` (opcional) es de este agente, con la
      fonotáctica del caquetío atestiguado (inventario de curiana_fonotactica,
      CV, y la reduplicación que Gatschet 1885 describe para la onomatopeya en
      Aruba — 2-lengua/morfologia.md §9), y lleva etiqueta hipotetico.
    grabaciones: >-
      Ninguna citada por ID: la API de xeno-canto pide cuenta (v3) y su
      buscador web devolvió «Access Denied» el 2026-09-22; Macaulay sólo se
      consulta con JavaScript. Deuda declarada en cada sonido que la necesita.

# ═════════════════════════════════════════════════════════════════════════
# 1. LA TARÁNTULA AZUL, A FONDO
# ═════════════════════════════════════════════════════════════════════════
tarantula_azul:
  especie: Chromatopelma cyaneopubescens
  autor_y_anio: '(Strand, 1907) — descrita como Eurypelma cyaneopubescens'
  descripcion_original: >-
    Strand, E. 1907. «Aviculariidae und Atypidae des Kgl.
    Naturalienkabinetts in Stuttgart». Jahreshefte des Vereins für
    vaterländische Naturkunde in Württemberg 63: 1-100 (citado por Sherwood y
    Gianni-Zurita 2023, p. 49; no leído: no está en el repo).
  localidad_tipo: >-
    «Venezuela, Paraguara [sic]» = Paraguaná (Sherwood y Gianni-Zurita 2023,
    pp. 36-37). Los sintipos (macho y hembra) se perdieron en los bombardeos
    de la Segunda Guerra Mundial.
  historia_del_nombre: >-
    Eurypelma (Strand 1907) → Delopelma (Petrunkevitch 1939) → Aphonopelma
    (por la sinonimia de Delopelma) → Chromatopelma, género creado para ella
    sola por Schmidt 1995 (Sherwood y Gianni-Zurita 2023, p. 37; Colmenares
    2015). Es un género MONOTÍPICO.
  distribucion:
    dato: >-
      De 11 registros de iNaturalist verificados por los autores, 9 son de la
      península de Paraguaná (8 del centro y sureste; en los monumentos
      naturales Cerro Santa Ana y Montecano y fuera de ellos); fuera: Coro
      (barrio Sur La Paz), el municipio Colina entre Acurigua y El Paso (bosque
      seco Lara-Falcón) y un juvenil al oeste de Durigua, cerca de
      Barquisimeto, a más de 200 km al sur. «9 out of 11 records are from the
      Península de Paraguaná» y la península es «the most important stronghold
      of this species».
    fuente: {obra: sherwood-gianni-zurita-2023, pagina: '38-41'}
    epoca: moderno
  endemica:
    veredicto: 'endémica de Venezuela y del monte seco del noroeste; NO endémica estricta de la península'
    razon: >-
      Colmenares 2015 (Libro Rojo): «Especie endémica de la península de
      Paraguaná», con distribución «inferior a los 2.500 km²». Sherwood y
      Gianni-Zurita 2023 la registran fuera (arriba) y concluyen que «seems not
      to be endemic to the Paraguaná xeric scrub ecoregion». Para el proyecto
      basta: es un animal de ESTE monte seco, con la península como su centro.
    fuentes: [libro-rojo-fauna-venezolana-2015, sherwood-gianni-zurita-2023]
  habitat: >-
    Matorral xerófilo y bosque seco. Semiarborícola: se refugia en huecos de
    árbol, troncos caídos y grietas de corteza que tapiza de seda (Klaas 2003
    vía Sherwood y Gianni-Zurita 2023, p. 37); el Libro Rojo dice «grietas y
    agujeros» en vegetación arbustiva y herbácea, «que cubre con seda». Un
    ejemplar vivía en una silla de madera dentro de una casa del Monumento
    Natural Montecano (Sherwood y Gianni-Zurita 2023, p. 39): tolera la casa si
    no se la molesta.
  aspecto: >-
    13-15 cm de envergadura total; caparazón verde-azul metálico, patas azul
    metálico, abdomen anaranjado brillante a marrón claro (Colmenares 2015).
    Los machos, más pequeños y de patas más largas; cambio de color con la
    edad (Gabriel y Sherwood 2019, citado en Sherwood y Gianni-Zurita 2023).
    Pelos urticantes abdominales de tipos III y IV (Colmenares 2015, citando a
    Bertani y Guadanucci 2013).
  conducta: >-
    Depredador activo que se desplaza por el suelo; come sobre todo insectos
    (Colmenares 2015). Los machos maduran y vagan en busca de hembra entre
    abril y junio (dos registros: 15-IV-2021 y 17-VI-2008); en mayo de 2005
    se fotografiaron dos machos peleando a la entrada del refugio de una hembra
    en un tronco hueco caído (Barrio-Amorós et al. 2008 vía Sherwood y
    Gianni-Zurita 2023, pp. 39 y 48).
  estado: 'En Peligro, B1ab(iii,v) — Libro Rojo de la Fauna Venezolana 2015 (Colmenares); amenazas: extracción para el comercio de mascotas y pérdida de hábitat'
  relacion_humana:
    veredicto: 'NINGUNA evidencia encontrada — ni nombre indígena, ni uso, ni creencia'
    lo_que_se_busco: >-
      6-fusion/scripts/buscar_tarantula_azul.py sobre los seis OCR de Esteves,
      van Buurt, Castellanos, Gatschet, Pané, el dictado de Medina, el canon de
      sitios, creencia/ecología/transmisión del corpus y los PDF de Alvarado,
      Arcaya, Oviedo t. II, Antolínez 1946 y Jahn. Aciertos leídos uno a uno:
      ninguno habla de la tarántula ni de una araña de Paraguaná. Los únicos
      con arañas: (a) Castellanos, ed. 1857 p. 283, sepulturas con figuras de
      oro «Moscas, arañas y otras sabandijas» — de las sepulturas de mogotes,
      FUERA de la Kaketiana (regla 4); (b) Antolínez 1946 (pdf 205-206) lee
      «la manta religiosa, tara o cerbatana y las arañas» como símbolos de la
      cerámica arawak — ensayo interpretativo, sin pieza ni sitio: hipotético;
      (c) el dictado de Medina: el tuqueque «se alimenta de arañas y moscas»
      (p. 287). El lexicón no tiene voz caquetía para araña (wayuu `walekerü`).
      Colmenares 2015 y Sherwood y Gianni-Zurita 2023 no dan nombre local fuera
      de «tarántula azul de Paraguaná».
    lectura: >-
      La importancia que Miguel intuye no está en ninguna fuente. Lo que sí es
      dato: el animal es llamativo (el único de su color en este monte),
      conspicuo en su tela, y hoy vive a veces DENTRO de las casas. Eso basta
      para que una comunidad lo nombre; no prueba que lo reverenciara. El
      referente describe al animal y no afirma su importancia (db.4).
  sonido:
    descripcion: >-
      Ninguna fuente leída le atribuye sonido: ni estridulación ni siseo en
      Colmenares 2015 ni en Sherwood y Gianni-Zurita 2023. Lo que se oye cuando
      está es nada; a lo sumo el roce de las patas en la seda seca.
    fuente: 'silencio de las dos fuentes (no es prueba de mudez: es lo que dicen)'
    onomatopeya_fuente: null
    silabeo_propuesto: null
  presencia_s_xv: segura
  por_que: >-
    Endemismo regional de un género monotípico con localidad tipo en la
    península: la especie evolucionó en este monte seco, que es constante
    desde hace ~4000 años en su medio físico (ecologia-002). Ninguna crónica
    la nombra — tampoco nombran arañas de Coro —, así que la seguridad viene de
    la biología, no del documento.

# ═════════════════════════════════════════════════════════════════════════
# 2. EL INVENTARIO — una entrada por especie (o por grupo, dicho)
# ═════════════════════════════════════════════════════════════════════════
especies:

  # ── ARÁCNIDOS Y MIRIÁPODOS ───────────────────────────────────────────
  - id: fa1-001
    nombre_comun: tarántula azul de Paraguaná
    cientifico: Chromatopelma cyaneopubescens
    autor: '(Strand, 1907)'
    grupo: arácnido
    habitat: [cardonal, cerro, monte seco]
    presencia_s_xv: segura
    por_que: 'ver tarantula_azul: endémica regional con localidad tipo en la península'
    nombres:
      caquetio: null
      papiamento: null
      wayuu: 'walekerü «araña» (genérico, lexicón)'
      lokono: null
      castellano_regional: 'tarántula azul de Paraguaná'
    es_hueco: true
    descripcion_visual: >-
      Araña grande y peluda del tamaño de una mano, patas de un azul que
      brilla, lomo verde azulado y vientre naranja. Vive en un hueco de árbol
      o tronco caído forrado de tela blanca.
    sonido:
      descripcion: 'no se le conoce sonido; se oye nada, o el roce de sus patas sobre la tela seca'
      fuente: 'ninguna de las dos fuentes le atribuye sonido (tarantula_azul.sonido)'
      onomatopeya_fuente: null
    fuentes: [sherwood-gianni-zurita-2023, libro-rojo-fauna-venezolana-2015]

  - id: fa1-002
    nombre_comun: ciempiés gigante
    cientifico: Scolopendra gigantea
    grupo: miriápodo
    habitat: [cardonal, hojarasca, piedras]
    presencia_s_xv: probable
    por_que: >-
      Nativo del Caribe sur seco (Aruba, Curazao, norte de Venezuela) y
      registrado en el polígono de la península (GBIF). Ninguna crónica lo
      nombra.
    nombres:
      caquetio: null
      papiamento: null
      wayuu: 'kasipa «ciempiés» (lexicón)'
      lokono: null
      castellano_regional: 'ciempiés, cienpiés'
    es_hueco: true
    descripcion_visual: >-
      Bicho largo como un antebrazo, hecho de anillos rojizos y oscuros, con
      un par de patas amarillas en cada anillo; corre rápido bajo piedras y
      hojas, y muerde con dos garfios en la cabeza.
    sonido:
      descripcion: 'sin sonido propio documentado'
      fuente: null
      onomatopeya_fuente: null
    fuentes: [gbif-paraguana-2026]

  - id: fa1-003
    nombre_comun: araña plateada del cardonal
    cientifico: Argiope argentata
    grupo: arácnido
    habitat: [cardonal, arbustos]
    presencia_s_xv: probable
    por_que: 'nativa de la América tropical seca, registrada en la península (GBIF); tela orbicular muy visible'
    nombres:
      caquetio: null
      wayuu: 'walekerü «araña» (genérico, lexicón)'
      castellano_regional: 'araña (sin nombre propio hallado)'
    es_hueco: true
    descripcion_visual: >-
      Araña de lomo plateado y lobulado, patas en cruz, quieta en el centro de
      una tela redonda tendida entre espinas, con bandas blancas en zigzag
      tejidas en la rueda.
    sonido: {descripcion: 'ninguno', fuente: null, onomatopeya_fuente: null}
    fuentes: [gbif-paraguana-2026]
    notas: >-
      En la península hay además pholcidos descritos hace poco, uno de ellos
      bautizado por los caquetíos: Chisosa caquetio (GBIF). Arañas de rincón,
      sin interés de referente.

  - id: fa1-004
    nombre_comun: alacrán
    cientifico: 'Buthidae indet. (especie de la península sin identificar)'
    grupo: arácnido
    habitat: [cardonal, piedras, casa]
    presencia_s_xv: dudosa
    por_que: >-
      GBIF no da ningún escorpión en el polígono y ninguna fuente leída
      nombra uno en Paraguaná. Regla 6: el cero mide GBIF (animal nocturno y
      poco fotografiado), no la península. Deuda: una lista de escorpiones de
      Falcón (González-Sponga) que no se consiguió.
    nombres:
      caquetio: null
      castellano_regional: alacrán, escorpión
    es_hueco: true
    descripcion_visual: >-
      Bicho pardo amarillento con dos pinzas delante y la cola enroscada sobre
      el lomo, terminada en un aguijón; sale de noche de bajo las piedras.
    sonido: {descripcion: 'ninguno documentado', fuente: null, onomatopeya_fuente: null}
    fuentes: []
    deuda: sin-procedencia

  # ── MAMÍFEROS ────────────────────────────────────────────────────────
  - id: fa1-010
    nombre_comun: venado matacán
    cientifico: 'Mazama sp.'
    grupo: mamífero
    habitat: [cerro, monte seco, bosque]
    presencia_s_xv: segura
    por_que: >-
      Crónica temprana de la provincia: «venados en grand número, é á
      manadas» (Oviedo t. II p. 330, c. 1540, informe del obispo Bastidas);
      «Hay perdices, conejos y venados» en Coro (Castellanos, líneas
      48230); «muchos benados» (Pérez de Tolosa 1546 vía Arcaya p. 264); el
      tabú de caza de los de Coro (Simón vía Arcaya p. 42); y el rebaño de
      matacán «en tiempos pasados» en los bosques de Paraguaná (Esteves p.
      51). Hoy sólo en el Cerro Santa Ana (monumento-cerro-santa-ana).
    evidencias:
      - {obra: oviedo-y-valdes-1852-1855, pagina: '330 (t. II)', texto: 'venados en grand número, é á manadas', epoca: contacto-temprano}
      - {obra: castellanos-elegias, pagina: 'línea 48230', texto: 'Hay perdices, conejos y venados', epoca: contacto-temprano}
      - {obra: arcaya-1920, pagina: '264', texto: 'muchos benados y perdices de las pardillas (Pérez de Tolosa, 1546)', epoca: contacto-temprano}
      - {obra: esteves-1989, pagina: '51', texto: 'En tiempos pasados había rebaños de este tipo de venado en los bosques de Paraguaná', epoca: moderno}
    nombres:
      caquetio: {clave: matakán, capa: caquetío-retroabstraido}
      castellano_regional: 'matacán, venado matacán'
    es_hueco: false
    nota_hueco: 'la voz es retroabstraída (Esteves), no atestiguada: el venado sigue sin palabra caquetía ATESTIGUADA (ecologia-037)'
    descripcion_visual: >-
      Venado pequeño, de lomo rojizo y patas finas, que apenas llega a la
      cintura; cuernos cortos y rectos, sin ramas, en el macho. Se esconde en
      el monte del cerro y salta al huir.
    sonido:
      descripcion: 'sin descripción de su voz en las fuentes leídas'
      fuente: null
      onomatopeya_fuente: null
      deuda: 'grabación de Mazama (bufido de alarma) por ID en Macaulay'
    fuentes: [oviedo-y-valdes-1852-1855, castellanos-elegias, arcaya-1920, esteves-1989, monumento-cerro-santa-ana]
    notas: >-
      Oviedo dice «á manadas», y el matacán (Mazama) es de costumbres
      solitarias: la manada cuadra mejor con el venado caramerudo (Odocoileus
      virginianus). Si el s. XV tuvo dos venados, el llano pudo ser del
      caramerudo y el cerro del matacán. Dudoso: se deja abierto (ecologia-077
      ya tomó el matacán como «el» venado de la península).

  - id: fa1-011
    nombre_comun: conejo sabanero
    cientifico: Sylvilagus floridanus
    grupo: mamífero
    habitat: [cardonal, médanos, conucos]
    presencia_s_xv: segura
    por_que: >-
      Nativo, registrado hoy en la península (GBIF) y en TODAS las crónicas de
      Coro: «conejos tantos ó mas que en nuestra España; pero son estos
      menores y alebrestados» (Oviedo t. II p. 330); Castellanos (línea
      48230); Pérez de Tolosa 1546 («mucha caza de conejos grandes y muy
      buenos»); y la regla de caza: no se les tiraba «estando echados o
      detenidos, porque decían era matarlos a traición, sino cuando huían»
      (Simón vía Arcaya p. 42). En 1502 Ojeda se llevó de Coquibacoa «un
      conejo semejante a los de Castilla» (Navarrete vía Arcaya p. 144).
    evidencias:
      - {obra: oviedo-y-valdes-1852-1855, pagina: '330 (t. II)', texto: 'conejos tantos ó mas que en nuestra España; pero son estos menores y alebrestados', epoca: contacto-temprano}

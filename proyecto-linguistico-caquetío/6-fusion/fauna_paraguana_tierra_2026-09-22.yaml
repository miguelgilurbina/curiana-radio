      caquetio_otro: {clave: chebebe, capa: caquetío-retroabstraido, alcance: 'saltamontes (Medina pp. 69-70)'}
      wayuu: 'kaashapü «langosta» (lexicón)'
    es_hueco: false
    descripcion_visual: >-

      cola»). Con pelo como de ardilla, los «cories» son roedores, no
      armadillos. Si la A-9 sacó `corie` 'armadillo' de este renglón, la glosa
      es una mala lectura. No se afirma: se pide verificar el origen de la A-9
      (issue).


    por_que: >-
      «Hay mucha langosta, que los indios llaman tara, y esta no es continua;
      pero algunos años hay tanta, que cubre el ayre á no se poder ver el
      cielo… si dá en un mahiçal, lo tala todo… los indios en su vengança las
      toman y embanastan y se las comen asadas» (Oviedo t. II p. 331, verificado
      en imagen). Tropidacris y Schistocerca, registradas en el polígono.
    evidencias:
      - {obra: oviedo-y-valdes-1852-1855, pagina: '331 (t. II)', texto: 'Hay mucha langosta, que los indios llaman tara', epoca: contacto-temprano}
    nombres:

  formas_seed: >-
    `curiana_koine.FORMAS_SEED` es INSTRUMENTO, no emergencia: una
    lista escrita a mano que entra en `[Tu manera de hablar]` desde el
    día 1. Sembrar ahí una forma archivada sería enseñarla por la
    puerta de atrás, así que las seis que la política retiró se mudan a
    su rival atestiguada. El NÚMERO de formas por agente no cambia, y
    con él la divergencia inicial que DISENO_KOINE §4 pide.
  sima_es_de_miguel: >-
    El par 6 («cerro») lo ALCANZA la política —`turumako` es
    atestiguada (Zavala #262) y el caquetío dice además 'cerro' con
    `-bana` (D9, seis apoyos)— y NO se ha aplicado. Es la pregunta que
    Miguel dejó abierta y aquí está su coste delante: `sima` está en
    `prompt_reglas_completo` dos veces (la voz y el molde `sima-bana`,
    que es el ejemplo de los locativos) y tiene el uso que dice la
    tabla de arriba, mientras `turumako` casi no se ha dicho. Aplicarla
    obligaría además a reescribir el ejemplo del locativo, que es lo
    que enseña `-bana`.

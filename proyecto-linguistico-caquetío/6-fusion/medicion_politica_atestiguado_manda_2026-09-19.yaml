meta:
  fecha: '2026-09-19'
  generado_por: 6-fusion/scripts/medir_politica_atestiguado_manda.py
  ref_del_brazo_antes: 'f864482'
  elenco: era2
  decision_literal: >-
    «Sí o sí tenemos que usar los atestiguados por sobre los
    reconstruidos, por lo menos la parte caquetía.» (Miguel, 2026-09-19)
  como_se_mide_el_antes: >-
    `git show <ref>:./curiana_sim/curiana_lexicon.py` (y curiana_koine)
    a un directorio temporal que va PRIMERO en el sys.path de un
    subproceso que corre este mismo código. Los dos brazos salen del
    mismo motor y la única diferencia es el módulo. Sin API, sin .env,
    base local en sólo lectura.
politica:
  alcance: >-
    Sólo muerde donde hay rival ATESTIGUADO para el mismo significado.
    El grueso del lexicón caquetío es reconstrucción legítima porque no
    hay atestación —los pronombres, los aspectos, la mayoría de las 86
    reconstruidas— y no lo toca.
  pares_aplicados:
    - par: 1
      glosa: 'sol'
      manda: kasi
      manda_capa: 'caquetío-atestiguado'
      manda_cita: 'Zavala Reyes 2015, glosario #76 (GC): «Sol» · MANDA desde el 2026-09-19 (política «manda la atestiguada»): ocupa el sitio de `kali`, la forma reconstruida que quedó archivada en FU'
      manda_usos: 9
      archivada: kali
      archivada_capa_antes: 'caquetío-reconstruido'
      archivada_capa_despues: 'caquetío-reconstruido'
      archivada_usos: 2321
      archivada_formas: 114
    - par: 3
      glosa: 'ofrecer'
      manda: were
      manda_capa: 'caquetío-atestiguado'
      manda_cita: 'Zavala Reyes 2015, glosario #149 (AM): «Dar, entregar»'
      manda_usos: null
      archivada: paa
      archivada_capa_antes: 'caquetío-reconstruido'
      archivada_capa_despues: 'caquetío-reconstruido'
      archivada_usos: 1222
      archivada_formas: 56
    - par: 4
      glosa: 'escuchar'
      manda: jai
      manda_capa: 'caquetío-atestiguado'
      manda_cita: 'Zavala Reyes 2015, glosario #175 (AM): «Oír, escuchar»'
      manda_usos: 5
      archivada: kira
      archivada_capa_antes: 'caquetío-reconstruido'
      archivada_capa_despues: 'caquetío-reconstruido'
      archivada_usos: 831
      archivada_formas: 12
    - par: 12
      glosa: 'luna'
      manda: kati
      manda_capa: 'caquetío-atestiguado'
      manda_cita: 'Decisión colisiones D5 (2026-08-31) — FUSIONADA con cati: la grafía c es colonial y el lema fonémico es la palabra. Atestiguada: Zavala Reyes 2015, glosario #71 (CGB): «Luna [catir'
      manda_usos: 33
      archivada: kasha
      archivada_capa_antes: 'caquetío-reconstruido'
      archivada_capa_despues: 'caquetío-reconstruido'
      archivada_usos: 168
      archivada_formas: 8
    - par: 13
      glosa: 'mar'
      manda: para
      manda_capa: 'caquetío-atestiguado'
      manda_cita: 'Zavala Reyes 2015 #190 (E+HP): ''Aguadulce o salada en grandes cantidades''; cf. #191 paragua (GC) = mar. Reflejo del proto-arahuaco *para, atestiguado en 4 lenguas: CQ para, WY pala'
      manda_usos: 227
      archivada: habo

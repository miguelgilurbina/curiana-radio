# Adam 1879 — las 79 voces arahuacas en el caribe insular (transcritas en imagen).
meta:
  obra_id: adam-1879
  que_es: 'La tabla de Adam 1879 (pp. 288-290): 79 voces ARAHUACAS (lokono, del vocabulario que Platzmann le copió,
    «incompleto y moderno», nota p. 290) identificadas en el caribe insular, con el registro en que caen: F = habla
    de mujeres, H = de hombres, C = común, D = dudoso.'
  cifras_de_adam: 60 en la de mujeres, 5 en la de hombres, 11 comunes, 3 dudosas (p. 290)
  transcrito: 2026-09-24, en IMAGEN (PyMuPDF sobre fuentes_caquetios/Adam_1879_Parler_hommes_femmes_langue_caraibe.pdf,
    índices 14-16); la capa de texto rompe la cursiva
  derechos: 1879, dominio público
  para_que: 'el conjunto donde el lokono y el kalinago de mujeres COINCIDEN, voz a voz: la base de 6-fusion/nucleo_fundacional_hermanas_2026-09-24.yaml'
  ortografia: 'la de Adam (francesa: ou = u, ch = š, gn = ñ)'

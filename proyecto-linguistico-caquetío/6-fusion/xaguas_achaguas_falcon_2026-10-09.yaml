# ─────────────────────────────────────────────────────────────────────────
# PROPUESTA — Los xaguas de Carora y Pedregal: ¿son los achaguas? 2026-10-09.
#
# Regla 5: esto PROPONE. No toca 3-mundo/etnias.yaml, 3-mundo/corpus/,
# 2-lengua/, curiana_lexicon.py ni lexicon_*.py.
# Regla 4: lo de los xaguas de 1530-1579 es de la polity de BARQUISIMETO
# (vecinos de sus caquetíos), nunca de la costera. Lo de Pedregal, Pecaya,
# Utaquire y Paraguaná es de la ENCOMIENDA de Coro (s. XVI tardío-XVIII).
# Regla 3: nada de esto es precontacto. Lo más temprano es de octubre de 1530.
# Las cifras (sondas, azar, distancias) las emite
# 6-fusion/scripts/medir_xaguas_2026-10-09.py en
# 6-fusion/medicion_xaguas_achaguas_2026-10-09.yaml; aquí se citan, no se
# calculan (regla 1).
# ─────────────────────────────────────────────────────────────────────────
meta:
  recogido: '2026-10-09'
  estado: sin-fusionar
  quien: 'minero de los xaguas (Claude Opus 5.5), rama vault/xaguas-falcon'
  bitacora: 4-fuentes/sesiones/11_xaguas_achaguas_falcon.md
  issue_borrador: 6-fusion/issues-pendientes/xaguas-achaguas-falcon-2026-10-09.md
  medicion: 6-fusion/medicion_xaguas_achaguas_2026-10-09.yaml
  script: 6-fusion/scripts/medir_xaguas_2026-10-09.py
  pregunta: >-
    Miguel (2026-10-09): «he encontrado que habían achaguas también en la zona
    de ahora Falcón, más que todo cerca de lo que es Mitare, más hacia el lado
    occidental de Falcón… habría que buscar más información al respecto». Y su
    decisión del mismo día: el achagua es «una línea maipuriana aparte de los
    caquetíos» (prima, no hermana). Cuatro preguntas: (1) ¿xagua = achagua?
    (2) ¿el nombre es el mismo o un parecido? (3) ¿dónde estaban, y alguna
    fuente los pone cerca de Mitare? (4) ¿qué se sabe de los xaguas en sí?
  fuentes_leidas:
    - federmann-1916
    - oliver-1989-cap3-vecinos
    - oliver-1989-cap3
    - jahn-1927
    - arcaya-1920
    - perez-de-tolosa-1546
    - aguado-1581
    - rivero-1883
    - urbina-jimenez-2007-2011
    - esteves-1989
    - nueva-segovia-1579
    - osm-kaketiana
  cobertura:
    federmann-1916: >-
      cap. VII entero («La nación de los Xaguas», pp. 53-58, con la nota (a) de
      Arcaya, pp. 53-54, y las notas (b)-(d)), el arranque del cap. VIII
      (pp. 58-60), la p. 63 (los cuatro enemigos de los caquetíos de
      Barquisimeto) y la nota (a) del cap. IV (p. 29-30, jirajaras y ajaguas);
      cotejado con el alemán: Klüpfel 1859 pp. 32-36 en su capa de texto y el
      original de 1557, folios [44] y [45], vistos en imagen (imágenes 54 y 55
      del PDF).
    oliver-1989-cap3-vecinos: >-
      §3.3.1, tesis pp. 243-247 (pdf 270-274), en el OCR guardado
      (fuentes_caquetios/Oliver_1989_cap3_s33_falcon_lara.ocr.txt), y p. 231
      (la orografía: Baragua, Siruma).
    oliver-1989-cap3: >-
      la edición DOC (2006), capa de texto nativa: pp. 225 (orografía), 239
      (los xaguas, el mismo pasaje que la tesis p. 245), 253-254 (el censo de
      Martí, 1773-1782; la p. 254 vista en imagen), 272 (cuentas de concha) y
      287-288 (los achaguas, los «Jaguas carniceros» de 1535, Barraguá).
    jahn-1927: >-
      pp. 6-7 (Párraga y Oramas), 52 (las «tierras pobres» de Carora), 207-227
      (cap. IV, «Los Caquetíos y Achaguas»), 254-256 (los jirajaras de Ciruma
      y los xaguas «de Carora y Baragua»; la p. 255 vista en imagen) y 273-275
      (Oramas y la filiación), en pdftotext.
    arcaya-1920: >-
      cap. I pp. 8-25 (la orografía: Pedregal, río de los Mitares, Siruma,
      Empalado), cap. II pp. 31-61 (los aborígenes: el territorio ajagua, la
      identidad con el achagua, Pérez de Tolosa, las Relaciones de 1579),
      pp. 73-75 y 83 (la filiación lingüística), 91-94 (pueblos), 101-102
      (Capu y el sol y la luna de los axaguas), 117 (la «xagua» tinte),
      230-232 (indios libres e indios de encomienda), 278-279 (Cariagua,
      Mapiare…) y 326-328 (Paraguaná, Mitare), en pdftotext (impresa = pdf − 8).
    perez-de-tolosa-1546: 'Fernández Duro t. II p. 232 (pdf 243), vista en imagen.'
    aguado-1581: >-
      las 4 apariciones de «xagua/axagua» leídas en contexto: lib. II caps. XI
      y XXI, lib. III cap. XVI (el texto de Gutenberg no conserva la página).
    rivero-1883: 'pp. 27-35 (pdf 48-57): Barragua, Airico, los «Tamudes»; sólo para la trampa de homonimia.'
    urbina-jimenez-2007-2011: 'Urbina 2011 pp. 21-22 (pdf 25-26): el complejo Guacoa.'
    esteves-1989: >-
      Parte II, las entradas Acurigua (p. 84), Autaquire (p. 86), Avaria y
      Baragua (p. 87), Carazao y Cariagua (p. 98; el OCR lee «Cariacua»), Mapiare (p. 121), Mitare
      (p. 123), Quiragua (p. 130), Siburúa (p. 131), Tupure (p. 136) y
      Utaquire (p. 138), en el OCR guardado (sin verificar en imagen).
    nueva-segovia-1579: 'sólo la ficha (la Relación no está en el repo: se lee por Arcaya y Oliver).'
    osm-kaketiana: 'coordenadas de Mitare, Pedregal, Acurigua y Quiragua; el resto, por Nominatim (mismo OSM), con su id en la medición.'
  no_leido:
    - 'Arcaya 1977 (3.ª ed. de la Historia del Estado Falcón, t. I), que es la que cita Oliver (pp. 37, 41-42 ss.): se leyó la 1.ª ed. de 1920, la del repo. El pasaje que Oliver discute («[A]xagua» = achagua) está en la de 1920 en las pp. 35, 55-60 y 73-74, y en la nota (a) de Arcaya a Federmann 1916 pp. 53-54; no se puede jurar que la 3.ª ed. no añada nada.'
    - 'El estudio de Arcaya sobre «los Aborígenes del Estado Falcón» donde dice haber «demostrado» la identidad (Federmann 1916 p. 53, nota a): no localizado ni en el repo ni en la web (búsqueda 2026-10-09).'
    - 'Oramas 1916 (WALS lo fecha en 1915), «Materiales para el estudio de los dialectos Ayamán, Gayón, Jirajara, Ajagua»: no está en el repo ni se halló copia en la web.'
    - 'Las Relaciones de Nueva Segovia, El Tocuyo y Carora de 1579 (Arellano Moreno 1964): no están en el repo; se leen por Arcaya, Jahn y Oliver.'
    - 'Martí 1969 (la visita pastoral de 1773-1782): sólo por Oliver DOC p. 254.'
    - 'Useche Losada 1987 (los «xaguas/jaguas carniceros» del bajo Meta, 1535; la primera mención segura del achagua, 1583): sólo por Oliver DOC pp. 287-288.'
  sondas: >-
    En la medición (§sondas): cada grafía del etnónimo (xagua, axagua, ajagua
    —con su partición «aj agua» de pdftotext—, achagua —con «achaga»—, jagua,
    achagual) y cada lugar de la pregunta, por obra. Lo que decide: Klüpfel
    1859 sólo escribe «Xaguas»; Pérez de Tolosa sólo «Axaguas» (en el tomo de
    Fernández Duro, el «ajagua» y un «achagua» son el índice del editor, que
    ya en 1885 junta «Achaguas ó Ajaguas», y el otro «achagua» es una nota
    suya sobre los caribes); Rivero, «achagua» y nunca xagua; Esteves no trae
    el etnónimo: su único «jagua» es el n.º 240 de su índice de topónimos,
    sin entrada en el cuerpo (la p. 118, vista en imagen, pasa de «Jadagua»
    a «Jajatal»). Y la sonda «mitare» da
    cero aciertos que pongan a un xagua o un achagua en Mitare (ver
    `lugares.mitare`).

# ═════════════════════════════════════════════════════════════════════════
# 1 · LAS PALABRAS XAGUAS
# ═════════════════════════════════════════════════════════════════════════
palabras_xaguas:
  lo_que_dice_oliver: >-
    «it is not possible to determine the linguistic affiliation of the Xagua,
    and the few words recorded by the chroniclers have no relationship to
    either Jirajaran or Caquetio» (tesis p. 245; DOC p. 239). Oliver NO
    enumera esas palabras ni dice de qué crónica salen, y no hay nota al pie.
  lo_que_se_hallo_en_el_repo: >-
    Ninguna palabra xagua con glosa. Lo único que una crónica del repo pone
    en boca o en tierra de los xaguas son DOS NOMBRES DE ALDEA, de Federmann,
    sin significado. Arcaya (1920 pp. 73-75 y 83) clasifica el «dialecto» ajagua
    como nuarhuaco sin citar una sola voz: «Partiendo de la identidad de los
    Ajaguas […] con los Achaguas […], punto que creemos haber dejado
    establecido, no hay duda alguna de que su dialecto pertenecía a dicha
    familia» (p. 73-74). La filiación sale de la identidad, no de la lengua.
  probable_origen_de_las_few_words: >-
    Hipótesis, no dato: los dos nombres de aldea de Federmann (los únicos que
    el repo tiene) y, quizá, los «antiguos apellidos ajaguas» que Oramas 1916
    dice haber visto (Jahn p. 274: «También en los antiguos apellidos ajaguas,
    gayones, etc., se nota el origen aruaco»). Sin Arcaya 1977 ni Oramas no se
    puede decidir.
  formas:
    - forma: Coary
      glosa: null
      que_es: 'nombre de la aldea xagua donde Federmann acampó y recibió a los caciques (25 de octubre de 1530)'
      fuente: federmann-1916
      pagina: '56 (trad. de Arcaya); 1557 [44]; Klüpfel 1859 p. 34'
      cita_1557: '«in den Pueblo oder flecken / da sie / die außgesandten / gefangen worden / vnd Coary gehaissen ist»'
      verificado_en_imagen: true
      imagen: 'Federmann_1557_Indianische_Historia.pdf, imagen 54'
    - forma: Cacaridi
      glosa: null
      que_es: '«la última [aldea] de esta nación», a 73 leguas de Coro y a 3 leguas del fin de la sierra; llegada el 31 de octubre de 1530'
      fuente: federmann-1916
      pagina: '57 (trad. de Arcaya, que fecha «el 3 de octubre»); 1557 [45]; Klüpfel 1859 p. 34'
      cita_1557: '«auff den letsten tag gemelts monats Octobris / ihn einen Pueblo oder flecken Ca-caridi / gehaissen / welchs der letste flecken diser Nation ist»'
      verificado_en_imagen: true
      imagen: 'Federmann_1557_Indianische_Historia.pdf, imagen 55'
      erratas: >-
        La traducción de 1916 dice «el 3 de octubre»: el alemán dice «el último
        día del dicho mes de octubre», y Oliver (p. 246) da el 31. Y Arcaya
        1920 p. 56 escribe «Cocaride», que no está en ninguna edición de
        Federmann: es error suyo.
  el_nombre_del_pueblo: 'ver `el_nombre`'


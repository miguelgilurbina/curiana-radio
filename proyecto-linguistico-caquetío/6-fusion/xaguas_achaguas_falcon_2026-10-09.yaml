# 2 · EL CRUCE CON NEIRA Y RIBERO
# ═════════════════════════════════════════════════════════════════════════
cruce_con_neira:
  metodo: >-
    El del cruce del 09-13 (6-fusion/scripts/cruzar_achagua_caquetio.py):
    sólo cuenta un par si coincide la GLOSA, y el parecido de forma se pone
    contra un modelo nulo. Aquí no hay ni una palabra xagua con glosa, así
    que el cruce por concepto tiene CERO conceptos: no se puede hacer.
  conceptos_cruzables: 0
  lo_que_si_se_midio: >-
    El control del azar, sin cruce. Los dos nombres de aldea xaguas se
    pusieron contra las entradas de Neira con forma comparable y, al lado,
    13 nombres de aldea de los OTROS pueblos de la misma crónica (jirajara,
    ayamán, caquetíos de Barquisimeto, los Llanos y la costa), con el mismo
    instrumento (fon, copista, radicales y umbrales importados del script del
    09-13). Cifras en la medición, §azar_nombres_de_aldea.
  resultado: >-
    Coary y Cacaridi tienen un «mejor parecido» con alguna voz achagua
    (Coary ~ «Cari» 'barro'; Cacaridi ~ «Cacaribi») que cae DENTRO del rango
    del control y por debajo de su máximo: los nombres caquetíos Mitare y
    Miraca se «parecen» al achagua más que los xaguas, y casi todos los
    nombres del control tienen alguna voz de Neira por encima del umbral de
    cognado. Con 4.000 entradas en el pajar, cualquier nombre encuentra su
    aguja. `xaguas_por_encima_del_maximo_del_control` sale vacía.
  veredicto: >-
    NO MEDIBLE por concepto (0 glosas) y SIN SEÑAL por forma (los xaguas no se
    distinguen del control). Es un negativo bien medido: no prueba que el
    xagua no fuera achagua; prueba que el repo no tiene con qué decidirlo, y
    que un parecido de Coary o Cacaridi con Neira no debe leerse como indicio
    (minar-fuente §2).


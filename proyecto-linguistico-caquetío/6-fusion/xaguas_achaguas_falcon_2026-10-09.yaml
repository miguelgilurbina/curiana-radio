# 3 · EL NOMBRE
# ═════════════════════════════════════════════════════════════════════════
el_nombre:
  grafias_con_fecha:
    - {forma: Xaguas, anio: '1530 (impreso 1557)', donde: 'entre Bobare y el valle de Barquisimeto', obra: federmann-1916, pagina: '1557 [41]-[46]; 1916 pp. 53-63', verificado_en_imagen: true}
    - {forma: Axaguas, anio: 1546, donde: 'montes junto a la sabana de Carora', obra: perez-de-tolosa-1546, pagina: 'Fernández Duro t. II p. 232', verificado_en_imagen: true}
    - {forma: axaguas, anio: 'c. 1581 (hechos de c. 1539-1540)', donde: 'en el camino de la sierra a Barquisimeto', obra: aguado-1581, pagina: 'lib. II cap. XXI'}
    - {forma: Axaguas, anio: 1579, donde: 'Nueva Segovia y El Tocuyo', obra: nueva-segovia-1579, pagina: 'vía Arcaya 1920 pp. 56-57 y 102; Oliver tesis p. 244 («axaguas», Arellano 1964: 182)'}
    - {forma: 'Jaguas (carniceros)', anio: 1535, donde: 'boca del Meta', obra: oliver-1989-cap3, pagina: 'DOC p. 288 (Useche 1987: 23); Oliver la llama «dubious»'}
    - {forma: Achaguas, anio: 1583, donde: 'cabeceras del Aripopo, Meta', obra: oliver-1989-cap3, pagina: 'DOC p. 288 (Useche 1987: 201): «the earliest mention of true Achagua»'}
    - {forma: Achagua, anio: 'c. 1736', donde: 'Casanare, Meta, Airico', obra: rivero-1883, pagina: '21 ss.'}
    - {forma: 'Ajaguas', anio: 's. XVII-XVIII (según Arcaya)', donde: 'Coro y Barquisimeto', obra: arcaya-1920, pagina: '35: «Predominó en Coro y Barquisimeto la forma "Ajaguas", y en los llanos […] la de "Achagua"»'}
  la_fonologia_de_la_grafia: >-
    En el castellano del s. XVI «x» es /ʃ/ y «ch» es /tʃ/: Xagua, Axagua y
    Achagua eran tres grafías distintas para un escribano de 1546. Que
    «Axagua» pase a «Ajagua» en los documentos coloniales tardíos es el cambio
    del castellano (/ʃ/ → /x/, escrito «j», cumplido hacia el s. XVII), no
    otro nombre indígena: Ajagua es Axagua puesta al día. Lo que separa al
    xagua del achagua de verdad son dos cosas: la a- inicial (que ya varía en
    Falcón-Lara: Xaguas en Federmann, Axaguas en Tolosa) y /ʃ/ frente a /tʃ/,
    que un oído castellano pudo repartir de las dos maneras ante una
    africada o fricativa indígena. Conclusión: los nombres PUEDEN ser el
    mismo etnónimo mal oído; nada lo exige.
  la_cadena_de_la_identidad: >-
    Medido: la identidad xagua = achagua NO tiene cuatro apoyos sino uno
    repetido. (1) El índice de Fernández Duro (1885) ya junta «Achaguas ó
    Ajaguas, Indios»; (2) Arcaya la afirma en su nota a Federmann (1916
    pp. 53-54) y en 1920 (pp. 35, 55-60, 73-74), con tres argumentos: el
    parecido del nombre, la «constante vecindad de los Caquetíos, los
    Jirajaras y los Ajaguas» en Falcón-Lara y en los Llanos (p. 55), y una
    etimología guajira (achiagua 'aconsejar', Uterga; o «Jagua de una palma,
    tótem quizás», p. 35); (3) Jahn 1927 pp. 223-227 la copia de Arcaya —cita
    la nota de las pp. 53-54, las mismas frases de Rivero, el mismo Carvajal
    p. 197 y los mismos Documentos del Libertador—; (4) el Tesoro de los
    diccionarios históricos de la RAE (entrada «achagua», que según los
    buscadores recoge «achagua, ajagua, axagua; xagua» citando a Jahn: la
    página dio 403 y no se leyó). En `pendientes_en_alvarado_y_arcaya.yaml`
    §el_achagua_en_falcon, «Tres fuentes diciendo lo mismo» es una
    corroboración falsa (minar-fuente §8): Jahn y Arcaya no son
    independientes. Oliver (tesis p. 245) es el único que la examina, y la
    rechaza: «the only thing in common that these two groups have is their
    similarity in the names».
  la_cronologia_contra_la_identidad: >-
    Oliver (DOC pp. 287-288, con Useche 1987): la primera mención segura del
    achagua es de 1583 y está en el alto Meta; la expansión achagua por los
    Llanos es TARDÍA y desde el sur (Gran Airico), cuando los caquetíos de
    los Llanos ya menguaban. Los xaguas de Federmann están en Lara en 1530,
    cincuenta años antes y a varios cientos de kilómetros al norte. No es
    imposible (pudo haber achaguas tempranos más al norte), pero la identidad
    obliga a suponerlo sin dato. Y los «Jaguas carniceros» de 1535 en la boca
    del Meta, que serían el puente, Oliver los da por dudosos: no se sabe si
    son achaguas, xaguas o caribes.
  la_homonimia_xagua_tinte: >-
    Segunda trampa, medida: en el castellano de Indias «xagua» es el TINTE
    negro de Genipa americana (voz taína). Aguado escribe «xaguas» tres veces
    para el tinte (lib. II cap. XI: «el çumo de çiertas mançanas que en comun
    llaman xaguas»; lib. III cap. XVI: «zumo de xaguas») y una sola para el
    pueblo (lib. II cap. XXI). Y en Coro el tinte tenía otro nombre: «bixa y
    de xagua que allí llaman busera» (Oviedo, vía Arcaya 1920 p. 117; ya en
    6-fusion/oliver1989_lexico_restante_2026-09-22.yaml). Una «xagua» en una
    crónica no es un xagua hasta que el pasaje lo dice. Que el etnónimo sea
    un apodo castellano tomado del tinte es una hipótesis (Arcaya la roza con
    su «Jagua […] tótem»); no hay fuente que lo diga.
  la_trampa_baragua_barragua: >-
    Tres lugares y no dos. (1) BARAGUA de Lara: el río Baragua, las «Baragua
    Highlands» de Oliver (tesis p. 231) y hoy el pueblo de Baragua, capital
    de la PARROQUIA XAGUAS del municipio Urdaneta (OSM, relation 11073231);
    Esteves p. 87 da además un río Baragua que nace en el sur de Capatárida y
    corre hacia Lara. (2) La BARRAGUA de Rivero (pp. 27-35): «una serranía y
    monte grande, distante de la ciudad de Pore trece ó catorce días», en el
    Airico, entre el Vichada y el Guaviare, con 21 pueblos achaguas y «otra
    Nación que los Achaguas llaman Tamudes y los españoles Caquetíos»
    (p. 29). (3) El Barraguán o Barraguá del bajo Meta-Vichada, junto al
    Orinoco, que Oliver (DOC p. 287) separa expresamente del de Rivero, y que
    Tavera Acosta (vía Arcaya 1920 p. 47) proponía como lectura de Rivero.
    Medido: ni Arcaya ni Jahn las confunden. Arcaya usa la Barragua de
    Rivero sólo para los caquetíos de los Llanos (p. 47) y la Baragua de Lara
    sólo para los jirajaras (p. 50); Jahn sólo nombra la de Lara (p. 255;
    «Barragua»: 0 en todo el libro). La trampa está en el paralelo, no en los
    autores: «achaguas y caquetíos en Barragua» (Rivero, s. XVIII) y «xaguas
    junto a los caquetíos, hacia Baragua» (Lara, s. XVI) parecen el mismo par
    étnico en el mismo sitio, y no lo son: el sitio es otro, y el par se
    repite porque el caquetío estaba en las dos regiones. Y un detalle: la
    Baragua de 1546 es de Oliver (p. 246) y de Jahn (p. 255), no de Tolosa,
    cuyo texto dice sólo «junto á esta sabana, en unos montes» (FD t. II
    p. 232, visto en imagen). El nombre vivo de la parroquia apoya que los
    xaguas estuvieron en Baragua; no dice cuándo.
  veredicto_del_nombre: >-
    Parecido, no identidad demostrada. Xagua/Axagua/Ajagua son un mismo
    nombre (Ajagua = Axagua tras el cambio castellano). Xagua y Achagua
    pueden serlo, pero el único argumento es la forma, la cadena que lo
    afirma es una sola (Fernández Duro → Arcaya → Jahn → RAE), y la
    cronología del achagua juega en contra.

# ═════════════════════════════════════════════════════════════════════════
# 4 · DÓNDE
# ═════════════════════════════════════════════════════════════════════════
lugares:
  nota_coordenadas: >-
    lat/lon y distancias a Mitare y a Pedregal en la medición (§lugares),
    con el id OSM de cada punto. Un nombre vivo dice dónde está el nombre hoy
    (osm-kaketiana: «prueba que el nombre está vivo en 2026 y dónde, nada
    más»).
  sabana_de_carora:
    lo_que_dicen:
      - 'Pérez de Tolosa 1546 (FD t. II p. 232): sabanas «entre las sierras de Coro y las que confinan en el valle de Bariquisimeto»; «en tiempos pasados había ciertos pueblos; hanse despoblado por causa de los españoles», y «junto á esta sabana, en unos montes, hay cierta cantidad de indios de nación Axaguas».'
      - 'Oliver tesis p. 231 n. 159 (DOC p. 225 n. 67): «It is known as Sabana de Carora, although there is no savanna there». Y p. 246: los xaguas vivían antes en la sabana de Carora y hacia 1546 algunos en las alturas de Baragua.'
      - 'Jahn p. 223: los xaguas «poblaban las sabanas de Carora hasta Pedregal en el Estado Falcón».'
    coordenada: 'Carora (ciudad), en la medición; la «sabana» no es un punto.'
  ruta_de_federmann:
    lo_que_dicen:
      - 'Federmann 1916 pp. 53-57: cuatro días por el agua de un arroyo entre dos montañas desde el último pueblo gayón; cinco días en tierra xagua (Coary → Cacaridi); la sierra acaba tres leguas después de Cacaridi y empieza el valle de Barquisimeto.'
      - 'Arcaya (notas a-d, pp. 53-57): de Bobare al suroeste, por la quebrada de Menecabra (sitio Borote), hacia las sierras del municipio Río Tocuyo, Saroche y el camino de Carora a Barquisimeto.'
      - 'Oliver p. 243 lo discute: Arcaya llevaba a Federmann al oeste «because of the presence of Xagua (Jagua), who in the 1550''s were reported near the village of Río Tocuyo»; Oliver (con Friede 1958) prefiere una ruta al sur por las alturas de Bobare.'
    coordenada: 'Río Tocuyo (pueblo), en la medición, como referencia de la lectura de Arcaya; Coary y Cacaridi no tienen sitio.'
  baragua:
    lo_que_dicen:
      - 'Oliver tesis pp. 231 y 246 («Baragua Highlands»).'
      - 'Jahn p. 255 (visto en imagen): los jirajaras tenían «Por el Oeste […] sus vecinos los indios Xaguas, pobladores de las tierras de Carora y Baragua».'
      - 'Hoy: Baragua es la capital de la parroquia Xaguas, municipio Urdaneta, Lara (OSM).'
    coordenada: 'en la medición (pueblo y centroide de la parroquia).'
  pedregal:
    lo_que_dicen:
      - 'Arcaya 1920 p. 35: «Ocupaban los Ajaguas la sección meridional de los Distritos Buchivacoa y Democracia y algo de la occidental del Distrito Federación […] intercaladas con otras de los Jirajaras, pero los Ajaguas predominaban en las montañas de Pedregal», con la prueba en «documentos inéditos […] en los archivos de Coro y Caracas» (nota 5), sin signatura.'
      - 'Arcaya 1920 p. 94: los ajaguas de Falcón «tendrían sin duda sus aldeas hacia Tupure, Autaquire o Utaquire y Pedregal, donde después estuvieron en Encomiendas y con sus descendientes se constituyeron los dos últimos pueblos nombrados».'
      - 'Arcaya, nota a Federmann 1916 p. 53: «una tribu aislada, viniéndose por las montañas del Norte de Carora se situó en terreno correspondiente al Municipio Abaría del Distrito Democracia de Falcón». Es la misma pluma diciendo dos cosas: en 1920 los ajaguas son pobladores del suroeste de Falcón «al tiempo del descubrimiento» (p. 31); en 1916, una tribu que LLEGÓ.'
      - 'Martí 1773-1782, vía Oliver DOC p. 254 (visto en imagen): «Axagua Indians were said to be mostly "nomadic" and inhabiting the mountains around Pedregal and Pecaya areas. They, however, regularly came down to the settled villages of Pedregal, Pecaya, Siquisique and Aregue».'
      - 'Urbina 2011 pp. 21-22: el complejo cerámico Guacoa, un solo sitio en la serranía de La Guacoa, cerca de El Pedregal; corazonada de Oliver (comunicación personal 2011) de que fuera de los xaguas «forced into a wandering lifestyle (what the Spaniards called "alzados")».'
      - 'Esteves pp. 86, 87, 136, 138: Autaquire, «extinta comunidad indígena […] a 30 kilómetros al Sur de la población de Pedregal (Quire, en ayamán, es color)»; Avaria, municipio con capital en Tupure; Utaquire, caserío del municipio Urumaco. Esteves NO nombra a los ajaguas.'
      - 'Wikipedia (es), «Pedregal (Falcón)», leída por un espejo (kiddle): San Nicolás de Tolentino de Pedregal fundado en 1691 «en tierras de los Ajaguas», primero en Autaquire y luego en un «Pueblo Viejo». Fuente moderna, sin cita, no independiente de Arcaya: no es dato.'
    coordenada: 'Pedregal, Pecaya, Agua Clara y el centroide de la parroquia Avaria, en la medición.'
  sierra_de_ciruma_o_empalado:
    lo_que_dicen:
      - 'Jahn p. 223: los xaguas «se extendían al Oeste hasta la sierra de Ciruma o Empalado, donde vivía otro grupo de Jirajaras»; p. 255, ese grupo jirajara de Ciruma lindaba «por el Este» con «los ya citados Xaguas, de las tierras de Carora» (p. 256).'
      - 'Arcaya 1920 pp. 8-12: la serranía de Siruma y el Empalado, en el lindero Falcón-Zulia-Lara, divisoria de aguas entre el lago y el Tocuyo.'
      - 'Oliver tesis p. 231: «The Sierra of Siruma (a Guajiro noun that glosses as ''cloud'')».'
    coordenada: 'sin punto en OSM (Nominatim no la halla); la frontera Falcón-Zulia-Lara al oeste de Avaria.'
  la_lista_de_arcaya:
    cita: >-
      «Los Jirajaras y Ajaguas se mostraban tranquilos, sujetos a sus
      Encomenderos […]. Se habían formado con ellos pequeños grupos en
      Cariagua, Mapiare, Siburua, Utaquire, Acurigua, Quiragua y otros puntos,
      donde trabajaban en las plantaciones o hatos de los españoles» (Arcaya
      1920 p. 279, años de Arias de Villasinda, h. 1550-1556). Y a fines del
      s. XVI: «Siburúa, Quiragua, Curimagua, Cariagua, Mapiare, Maguay»
      (p. 327).
    lectura: >-
      Es una lista de ENCOMIENDA mixta (jirajaras y ajaguas), sin decir quién
      estaba dónde, y casi toda está en la Sierra de San Luis y al sur de
      Coro, territorio jirajara según el propio Arcaya. Dice dónde los
      pusieron los españoles, no dónde vivían los xaguas (regla 3).
    cada_lugar:
      Cariagua: 'Esteves p. 98, río que cruza San Luis (Distrito Bolívar); Oliver DOC p. 254, «San Luis Cariagua», pueblo de la sierra de San Luis con Acurigua (267 indios en el censo de Martí, «most probably the remnants of the Jirajara»). Coordenada: San Luis.'
      Mapiare: 'Esteves p. 121: «Lugar de Churuguara […]. Otrora fue una comunidad indígena que desapareció. Hoy es sitio arqueológico». Coordenada aproximada: Churuguara.'
      Siburúa: 'Arcaya p. 15, uno de los tres riachuelos que forman el río de Coro; Esteves p. 131, «pueblo y manantial en el municipio Guzmán Guillermo, Distrito Miranda». Sin punto en OSM.'
      Utaquire: 'Esteves p. 138, caserío del municipio Urumaco (Democracia); Arcaya p. 94 lo iguala con Autaquire. Sin punto en OSM.'
      Acurigua: 'Esteves p. 84, población y río del Distrito Colina, afluente del Ricoa; OSM (volcado).'
      Quiragua: 'Esteves p. 130 da tres aldeas de ese nombre (Jacura, Puerto Cumarebo, Guzmán Guillermo); Arcaya p. 94 pone ahí la primera aldea jirajara de Federmann. El punto del volcado es una de ellas, sin saber cuál es la de Arcaya.'
  mitare:
    lo_que_dicen:
      - 'Arcaya 1920 p. 230: un documento del protector de indios del s. XVI nombra «los pueblos de abaxo desta cibdad que son mitare, caracho, cococida, capatarida con sus yndios e yndias dellos», «libres y cristianos vasallos de su magestad amigos de los españoles»: Mitare es CAQUETÍO y libre.'
      - 'Arcaya 1920 pp. 93 y 328: Mitare es «probablemente el llamado Carao en los días de la conquista», y a fines del s. XVI «Progresaba el de Mitare» entre los caquetíos del occidente, con el cacique general don Sancho de Uriacoa.'
      - 'Oliver DOC p. 254 (Martí, 1773-1782): Mitare tiene 374 indios caquetíos; y DOC p. 262: Mitare, Zazárida, Capatárida y Borojó son las aldeas caquetías mayores de la costa occidental (Casicure).'
      - 'Arcaya 1920 pp. 14 y 17: el río Pedregal se une al «de San Luis o de los Mitares» cerca de Agua Clara, y desde ahí el río se llama «de Agua Clara, Sabaneta y Mitare» hasta el Golfete. Y p. 20: en esa costa están «las principales» salinas, «las de Mitare».'
    sonda: >-
      Ninguna fuente leída pone xaguas, axaguas, ajaguas ni achaguas EN Mitare
      ni en su costa: la sonda «mitare» da 7 aciertos en Arcaya, 5 en el DOC de
      Oliver, 1 en la tesis, 5 en Urbina y 11 en Esteves (medición §sondas), y
      todos son el pueblo caquetío, el río o la salina. Jahn: 0.
    la_lectura_posible_de_la_pista_de_miguel: >-
      Lo más cerca de Mitare que una fuente pone a los ajaguas es PEDREGAL y
      su sierra, en la CABECERA del mismo río: Pedregal está a unos 37 km del
      pueblo de Mitare y Agua Clara, la confluencia, a unos 22 (medición
      §lugares). Arcaya (nota a Federmann 1916 pp. 29-30) dice además que
      jirajaras y ajaguas compartían «el dominio del macizo montañoso que se
      extiende entre Carora al sur, el litoral occidental de Coro al norte y
      el lago de Maracaibo al oeste». Si la pista de Miguel es «la cuenca del
      Mitare», encaja con Arcaya y con Martí (s. XVIII, de encomienda); si es
      «el pueblo de Mitare», ninguna fuente la sostiene y las que hay lo dan
      por caquetío. La pista necesita su fuente: ¿dónde lo leyó?
    un_rumor_de_la_web: >-
      Un resumen de buscador atribuyó a la «Caracterización del Pueblo
      Achagua» del Ministerio de Cultura de Colombia que los achaguas
      abarcaron «los estados de Falcón, Aragua y Coro»; la página dio 404 y
      otra búsqueda no lo confirmó. No se leyó: no es dato. Si fuera ésa la
      fuente de Miguel, sería moderna y heredera de Codazzi (los «Axaguas» en
      Aragua, vía Arcaya p. 57 y Jahn p. 227) y de Jahn.

# ═════════════════════════════════════════════════════════════════════════
# 5 · LO QUE SE SABE DE LOS XAGUAS EN SÍ
# ═════════════════════════════════════════════════════════════════════════
# Etiquetas: atestiguado = lo dice una fuente de la época (aunque nos llegue
# por otra); reconstruido = lectura de un historiador sin el documento a la
# vista; hipotetico = conjetura. Polity: con quién de los caquetíos tenía que
# ver el hecho (regla 4). Ninguno es de la costera.
hechos:
  - id: xg-01
    tema: asentamiento
    hecho: >-
      En octubre de 1530 los xaguas vivían en ALDEAS, al sur-suroeste de los
      gayones y a la entrada del valle de Barquisimeto: Federmann cruzó su
      tierra en cinco días, desde Coary («no muy grande») hasta Cacaridi, «la
      última de esta nación». A Coary llegaron «varios caciques de los
      alrededores con cerca de ochocientas personas, hombres y mujeres, que
      moraban en dos o tres leguas a la redonda».
    etiqueta: atestiguado
    procedencia: {obra: federmann-1916, pagina: '55-57; 1557 [43]-[45] (imágenes 54-55)'}
    verificado_en_imagen: true
    epoca: contacto-temprano (1530)
    polity: barquisimeto
  - id: xg-02
    tema: diplomacia
    hecho: >-
      Para la paz llegaban «Todos desarmados y no portaban sino delgados
      garrotes como es su costumbre cuando se presentan con disposiciones
      pacíficas» (1557: «mit stecklin sonder ainige gewehre […] wie sie zu
      bezeügnus der freündtschafft zu thun im gebrauch haben»), y traían oro,
      víveres y caza. Federmann retuvo al cacique como rehén. El alemán y la
      traducción no coinciden en el resto: 1557 dice que soltó a cinco de los
      cautivos y se quedó con los principales y el cacique; la de 1916 (sobre
      la francesa), que soltó a casi todos y se quedó con cinco.
    etiqueta: atestiguado
    procedencia: {obra: federmann-1916, pagina: '56-57; 1557 [44] (imagen 54)'}
    verificado_en_imagen: true
    epoca: contacto-temprano (1530)
    polity: barquisimeto
  - id: xg-03
    tema: guerra
    hecho: >-
      Gayones y xaguas eran enemigos: para no dejar rastro caminaban por el
      agua de los arroyos —«observan la costumbre de marchar por el agua para
      que no puedan seguírseles las huellas»— y «no vivan tranquilos y
      descuidados sino cuando las aguas están muy crecidas». Federmann dice
      que los dos comían carne humana; Arcaya (pp. 56-57) y Jahn (p. 226)
      sostienen que la antropofagia era invención de los primeros
      expedicionarios, porque las Relaciones de 1579 no la mencionan.
    etiqueta: atestiguado
    aviso: 'la antropofagia es la palabra del conquistador, no un hecho (Oliver cap. 3 §3.2.4: «caribe» como categoría política)'
    procedencia: {obra: federmann-1916, pagina: '53-54; 1557 [41]-[42]'}
    epoca: contacto-temprano (1530)
    polity: barquisimeto
  - id: xg-04
    tema: lengua
    hecho: >-
      Su lengua era otra que la caquetía, la jirajara, la ayamana y la gayona:
      Federmann necesitó dos intérpretes con los xideharas, tres con los
      ayamanes, cuatro con los gayones y CINCO con los xaguas, y sólo «dos
      prisioneros Gayones» sabían la lengua xagua. La cadena dice que había
      cinco lenguas en el camino; no dice nada de parentesco (el achagua y el
      caquetío, parientes, también necesitarían intérprete).
    etiqueta: atestiguado
    procedencia: {obra: federmann-1916, pagina: '55, 58; 1557 [43], [46]'}
    epoca: contacto-temprano (1530)
    polity: barquisimeto
  - id: xg-05
    tema: comercio
    hecho: >-
      Comercio de SAL con los caquetíos de Barquisimeto aun siendo enemigos:
      los xaguas de las últimas aldeas «viven en paz con las tribus Caquetías
      […] y con ellas tienen comercio de sal»; y desde el otro lado, los
      caquetíos, «Aunque hacen comercio de sal con varias aldeas de los
      Xaguas, que tocan con su territorio, son sin embargo enemigos de este
      pueblo». No se dice de dónde venía la sal.
    etiqueta: atestiguado
    procedencia: {obra: federmann-1916, pagina: '60, 63; Oliver tesis p. 247'}
    epoca: contacto-temprano (1530)
    polity: barquisimeto
  - id: xg-06
    tema: relacion-con-caquetios
    hecho: >-
      Los xaguas le nombraron a Federmann a los caquetíos de Barquisimeto
      —«Este nombre nos sorprendió mucho cuando lo oímos a los Xaguas»— y le
      confirmaron que eran «numerosos y guerreros»; él mandó como emisarios a
      un caquetío de Coro y a «algunos Xaguas» de la última aldea. Según
      Federmann, los caquetíos habían obligado a todos sus vecinos, xaguas
      incluidos, a vivir en las montañas para quedarse con las llanuras.
    etiqueta: atestiguado
    aviso: 'el «los obligaron» es la explicación de Federmann, no algo que viera'
    procedencia: {obra: federmann-1916, pagina: '58-60; Oliver tesis pp. 246-247'}
    epoca: contacto-temprano (1530)
    polity: barquisimeto
  - id: xg-07
    tema: asentamiento
    hecho: >-
      En 1546 los «Axaguas» estaban «junto á esta sabana [de Carora], en unos
      montes»: «es gente que comen carne humana; son tan bellacos, que por
      ninguna vía con ellos se ha podido hacer paz; pelean con arcos y
      flechas y macanas; no tienen pueblos poblados». La sabana, que «en
      tiempos pasados» tuvo pueblos, se había despoblado «por causa de los
      españoles».
    etiqueta: atestiguado
    aviso: 'Oliver (p. 246 n. 173, vía Arellano 1964) lee «belicosos» donde Fernández Duro imprime «bellacos»; y la «Baragua» de su paráfrasis no está en el texto'
    procedencia: {obra: perez-de-tolosa-1546, pagina: 'Fernández Duro t. II p. 232'}
    verificado_en_imagen: true
    epoca: colonial-temprano (1546)
    polity: barquisimeto
  - id: xg-08
    tema: asentamiento
    hecho: >-
      El «no tienen pueblos poblados» de 1546 no es nomadismo de origen: en
      1530 Federmann los había visto en aldeas; la dispersión es efecto de las
      entradas españolas (Oliver, y antes Arcaya p. 56).
    etiqueta: reconstruido
    nota_etiqueta: 'lectura de Oliver que compara dos atestaciones (xg-01 y xg-07)'
    procedencia: {obra: oliver-1989-cap3-vecinos, pagina: '246'}
    epoca: contacto-temprano → colonial-temprano
    polity: barquisimeto
  - id: xg-09
    tema: asentamiento
    hecho: >-
      Hacia 1539-1540 el doctor Navarro, camino de Barquisimeto y El Tocuyo,
      estuvo «metido[s] en vna poblazon de yndios llamados los axaguas».
    etiqueta: atestiguado
    procedencia: {obra: aguado-1581, pagina: 'lib. II cap. XXI'}
    epoca: colonial-temprano (c. 1540)
    polity: barquisimeto
  - id: xg-10
    tema: creencia
    hecho: >-
      La Relación de Nueva Segovia (1579) dice de los axaguas: «Esta
      generación adora al sol y a la luna», y cuando falta el agua sacrifican
      a una muchacha «de diez años para arriba» a orillas del río, degollada
      con una piedra, porque «la quieren dar al sol por su muger […] porque
      llueva»; «después que poblamos lo hacen, más hacenlo de escondidas».
      Ya está en el vault como dato axagua, NO caquetío (nueva-segovia-1579;
      hsai_caquetios hda-21/22).
    etiqueta: atestiguado
    aviso: 'de segunda mano (Arcaya cita la Relación sin página) y colonial declarado (regla 3)'
    procedencia: {obra: arcaya-1920, pagina: '102 (cita la Relación de Nueva Segovia, 1579)'}
    epoca: colonial (1579)
    polity: barquisimeto
  - id: xg-11
    tema: territorio
    hecho: >-
      En 1579 los axaguas «se extendían desde cuatro o cinco leguas de la
      ciudad [Nueva Segovia] hacia los Llanos»; y la misma Relación pone en
      la sierra a tres leguas al norte de la ciudad a «algunos indios
      naturales de nación gayones, y algunos axaguas y xidaharas, y de nación
      camagos, y todos éstos diferentes en lenguas [en] cada nación».
    etiqueta: atestiguado
    aviso: 'de segunda mano: Arcaya p. 57 y Jahn p. 226 para lo primero; Oliver tesis p. 244 n. 170 (Arellano 1964: 182) para lo segundo'
    procedencia: {obra: oliver-1989-cap3-vecinos, pagina: '244 (Relación de Nueva Segovia 1579, Arellano 1964: 182); Arcaya 1920 p. 57'}
    epoca: colonial (1579)
    polity: barquisimeto
  - id: xg-12
    tema: comida-bebida
    hecho: >-
      La Relación de El Tocuyo (1579) cuenta a los axaguas entre los indios
      de su jurisdicción y dice de todos ellos que comían maíz y raíces que
      cultivaban, venado, puerco de monte, aves, pescado de río «y hasta […]
      culebras, ratones, murciélagos y gusanos», sin mencionar antropofagia.
    etiqueta: atestiguado
    aviso: 'de segunda mano y dicho de TODOS los indios de El Tocuyo, no de los axaguas en particular'
    procedencia: {obra: arcaya-1920, pagina: '56-57 (paráfrasis de la Relación de El Tocuyo, 1579)'}
    epoca: colonial (1579)
    polity: barquisimeto
  - id: xg-13
    tema: encomienda
    hecho: >-
      En la gobernación de Coro los caquetíos quedaron como indios libres (y
      luego de Real Corona) y los jirajaras y ajaguas como indios de
      ENCOMIENDA, después tributarios. Hacia 1550-1556 los encomenderos
      habían formado con jirajaras y ajaguas «pequeños grupos en Cariagua,
      Mapiare, Siburua, Utaquire, Acurigua, Quiragua»; y a fines del s. XVI
      habían trasladado «algunos Ajaguas y Jirajaras de la serranía» a
      PARAGUANÁ.
    etiqueta: reconstruido
    nota_etiqueta: 'Arcaya lee documentos que no identifica; en duda, degradar (regla 2)'
    procedencia: {obra: arcaya-1920, pagina: '232, 279, 327'}
    epoca: colonial (1550-1600)
    polity: costera-colonial
    nota_polity: 'es la encomienda de Coro, no la polity costera precontacto: lo de Paraguaná es gente traída, no gente de allí'
  - id: xg-14
    tema: asentamiento
    hecho: >-
      Los ajaguas de Falcón tendrían sus aldeas hacia Tupure, Autaquire o
      Utaquire y Pedregal, donde estuvieron en encomienda; de sus
      descendientes salieron los pueblos de Utaquire y Pedregal. Y en el
      s. XVIII, «a pesar de llevar dos siglos reducidos a Encomienda primero y
      a Pueblo tributario después», los de Pedregal andaban «vagando en
      pequeñas partidas, prefiriendo la caza a la agricultura».
    etiqueta: reconstruido
    nota_etiqueta: 'Arcaya, con «un documento de la época» sin identificar'
    procedencia: {obra: arcaya-1920, pagina: '58-59, 94'}
    epoca: colonial (s. XVII-XVIII)
    polity: costera-colonial
  - id: xg-15
    tema: asentamiento
    hecho: >-
      El censo del obispo Martí (1773-1782): los axaguas, «mostly
      "nomadic"», vivían en las montañas de Pedregal y Pecaya y bajaban a los
      pueblos de Pedregal, Pecaya, Siquisique y Aregue; en Aregue había
      mezcla de axagua y gayón.
    etiqueta: atestiguado
    aviso: 'de segunda mano (Oliver resume a Martí 1969 sin cita literal)'
    procedencia: {obra: oliver-1989-cap3, pagina: 'DOC p. 254 (Martí 1969)'}
    verificado_en_imagen: true
    epoca: colonial (1773-1782)
    polity: costera-colonial
    nota_polity: 'Pedregal y Pecaya, Falcón; Siquisique y Aregue, Lara'
  - id: xg-16
    tema: comercio
    hecho: >-
      Los jirajaras y los xaguas valoraban las cuentas de concha marina como
      medio de intercambio, como los achaguas y otros pueblos de los Llanos.
    etiqueta: reconstruido
    nota_etiqueta: 'generalización de Oliver; el pasaje de Federmann sobre conchas compradas es de los AYAMANES (tesis p. 243), y en el cap. VII (xaguas) no hay conchas'
    procedencia: {obra: oliver-1989-cap3, pagina: 'DOC p. 272 n. 122'}
    epoca: contacto-temprano
    polity: barquisimeto
  - id: xg-17
    tema: arqueologia
    hecho: >-
      El complejo Guacoa (un sitio en la serranía de La Guacoa, cerca de El
      Pedregal: cerámica tosca lisa con punteado grande y redondo, como el de
      Túcua, 800-1200 d. C.) sería de los xaguas «alzados».
    etiqueta: hipotetico
    nota_etiqueta: 'corazonada de Oliver en comunicación personal, recogida por Urbina'
    procedencia: {obra: urbina-jimenez-2007-2011, pagina: 'Urbina 2011 pp. 21-22'}
    epoca: sin fecha (el punteado de Túcua, 800-1200 d. C.)
    polity: ninguna
  - id: xg-18
    tema: nombre-vivo
    hecho: >-
      El etnónimo sigue vivo como nombre de lugar: la parroquia Xaguas del
      municipio Urdaneta (Lara), con capital en Baragua.
    etiqueta: atestiguado
    nota_etiqueta: 'atestigua el NOMBRE en 2026 (OSM), no al pueblo ni su época'
    procedencia: {obra: osm-kaketiana, pagina: 'Nominatim 2026-10-09, relation 11073231 y node 5334941552 (fuera del volcado del repo)'}
    epoca: actual
    polity: ninguna

# ═════════════════════════════════════════════════════════════════════════
# 6 · LO QUE CAMBIARÍA EN etnia-018 (no se toca: lo decide Miguel)
# ═════════════════════════════════════════════════════════════════════════
propuesta_para_etnia_018:
  se_queda:
    - 'familia_linguistica: desconocida. La identidad con el achagua no se sostiene con lo que hay (§cruce_con_neira, §el_nombre), y la decisión de Miguel del 2026-10-09 («el achagua es una línea maipuriana aparte de los caquetíos») es sobre el achagua de los Llanos y de Neira: no se traslada al xagua de Carora.'
    - 'polity_caquetia: barquisimeto, polity_nota: NO la costera.'
  se_corrige_o_se_anade:
    variantes: '[axagua, ajagua, jagua] — «ajagua» falta y es la forma colonial de Coro y Barquisimeto (Arcaya p. 35); «achagua» NO entra como variante: sería dar la identidad por hecha.'
    aviso_familia_ampliado: >-
      Añadir a la cita de Oliver: Arcaya 1916/1920 y Jahn 1927 los
      identifican con los achaguas sólo por el nombre y la vecindad, y Jahn
      copia a Arcaya (una sola fuente, no dos); Arcaya clasifica su «dialecto»
      como nuarhuaco DEDUCIÉNDOLO de esa identidad, sin una sola voz
      (6-fusion/xaguas_achaguas_falcon_2026-10-09.yaml).
    donde: >-
      «hacia 1530, aldeas entre las alturas de Bobare y el valle de Barquisimeto
      (Federmann); en 1546, montes junto a la sabana de Carora (Tolosa); en
      1579, desde 4-5 leguas de Nueva Segovia hacia los Llanos y en la sierra
      al norte de la ciudad; en el s. XVIII, montañas de Pedregal y Pecaya
      (Falcón), en encomienda (Arcaya, Martí vía Oliver)». Y la nota: la
      Baragua es de Oliver y Jahn, no del texto de Tolosa.
    contacto_nota: 'añadir el comercio de sal visto desde los dos lados (Federmann 1916 pp. 60 y 63) y que fueron los xaguas quienes le nombraron los caquetíos a Federmann.'
    procedencia: '{obra: oliver-1989-cap3-vecinos, pagina: "244-247"} + federmann-1916 pp. 53-63 + perez-de-tolosa-1546 p. 232 (FD t. II)'
  una_entrada_que_choca:
    lexicon_ajagua: >-
      curiana_lexicon.py tiene `ajagua` como «grupo Jirajaroide (Jirajaroid
      menor)», «cuarto grupo de la familia Jirajaroide», fuente `jirajaroide`,
      citando a Oramas 1916. Es una TERCERA filiación para el mismo pueblo
      (etnias.yaml: desconocida; Jahn/Arcaya: arahuaca), y su único apoyo es
      que el título de Oramas pone «Ajagua» junto al ayamán, el gayón y el
      jirajara. Oliver (p. 245) dice expresamente que las pocas voces no se
      relacionan con el jirajarano. Propuesta: re-glosar como «etnónimo de un
      pueblo de Carora-Pedregal de filiación desconocida (xagua/axagua)» y
      sacarlo de la capa jirajaroide, o archivarlo. Decide Miguel.
  la_entrada_de_pendientes: >-
    6-fusion/pendientes_en_alvarado_y_arcaya.yaml §el_achagua_en_falcon dice
    «Tres fuentes diciendo lo mismo» y «El puente entre el caquetío y una
    lengua arahuaca bien documentada tiene, por fin, un anclaje geográfico
    citado». Medido hoy: Jahn copia a Arcaya, y el anclaje es de un pueblo
    cuya filiación nadie ha medido. Propuesta: anotar allí este YAML como su
    resolución (sin borrar la entrada).


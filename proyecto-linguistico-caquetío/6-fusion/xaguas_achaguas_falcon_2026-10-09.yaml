    licencia: 'con derechos (edición de 1977)'
    responderia: '¿qué son las «few words» de Oliver? Oliver discute la p. 42 ss. de esta edición; si trae voces xaguas, ahí están.'
  - obra: 'Arcaya, estudio sobre «los Aborígenes del Estado Falcón» (anterior a 1916)'
    url: 'no localizado (búsqueda 2026-10-09)'
    licencia: 'dominio público si es anterior a 1931 y se halla'
    responderia: 'los «documentos inéditos» con que dice probar la identidad y la presencia ajagua en Abaría y Pedregal.'
  - obra: 'Oramas, Luis R., Materiales para el estudio de los dialectos Ayamán, Gayón, Jirajara, Ajagua (Caracas, 1916; WALS: 1915)'
    url: 'sin copia en la web hallada; buscar en la Biblioteca Nacional de Venezuela y la Academia Nacional de la Historia'
    licencia: 'dominio público en EE. UU. (anterior a 1931)'
    responderia: '¿registró voces o apellidos ajaguas (los «padrones» del Archivo Arzobispal de Caracas que publica)? Es la única vía a algo con glosa.'
  - obra: 'Arellano Moreno (ed.), Relaciones geográficas de Venezuela (Caracas, ANH, 1964): Relaciones de Nueva Segovia, El Tocuyo y Carora (1579) y Pérez de Tolosa (p. 10)'
    url: 'HathiTrust, sólo búsqueda: https://babel.hathitrust.org/cgi/pt?id=wu.89057098766 (ver la ficha nueva-segovia-1579)'
    licencia: 'con derechos'
    responderia: 'el texto primario de lo axagua de 1579 (creencia, territorio, lenguas), y si Tolosa en esa edición dice «belicosos» o «bellacos» y nombra Baragua.'
  - obra: 'Martí, Mariano, Documentos relativos a su visita pastoral de la Diócesis de Caracas 1771-1784 (Caracas, ANH, 1969), entradas de Pedregal, Pecaya, Siquisique y Aregue'
    url: 'no localizado en abierto (búsqueda 2026-10-09)'
    licencia: 'con derechos (edición de 1969); el manuscrito es de 1771-1784'
    responderia: 'la cita literal de los «axaguas» de Pedregal y Pecaya, si hablaban su lengua en 1773 y cómo la llamaba Martí.'
  - obra: 'Useche Losada, Mariano, El proceso colonial en el Alto Orinoco-Río Negro (siglos XVI a XVIII) (Bogotá, FIAN-Banco de la República, 1987), pp. 23 y 201'
    url: 'registro en https://descubridor.uniclaretiana.edu.co/vufind/Record/31278; sin PDF hallado'
    licencia: 'con derechos'
    responderia: 'el documento de 1535 de los «xaguas/jaguas carniceros» del bajo Meta y la mención de 1583: si el etnónimo de los Llanos y el de Lara se cruzan en algún documento temprano.'
  - obra: 'La fuente de Miguel sobre «achaguas cerca de Mitare»'
    url: 'preguntar a Miguel'
    licencia: '—'
    responderia: 'si dice Mitare (el pueblo, caquetío en todas las fuentes) o la cuenca del Mitare (Pedregal), y de quién lo toma.'

# ═════════════════════════════════════════════════════════════════════════
# 8 · VEREDICTO
# ═════════════════════════════════════════════════════════════════════════
veredicto:
  xagua_es_achagua: >-
    NO SE SOSTIENE con lo que hay, y tampoco se refuta. No hay una sola
    palabra xagua con glosa en el repo, y los dos nombres de aldea que hay
    (Coary, Cacaridi) no se parecen al achagua de Neira más que los nombres
    caquetíos del control. La identidad descansa en el parecido del nombre y
    en una cadena que es una sola voz (Fernández Duro 1885 → Arcaya 1916/1920
    → Jahn 1927 → RAE), y la cronología del achagua (primera mención segura
    en 1583, en el alto Meta; expansión tardía) juega en contra. Oliver la
    rechaza por las mismas razones. Etiqueta, si alguna vez entra: hipotético.
  el_nombre: >-
    Xagua, Axagua y Ajagua son un mismo etnónimo (Ajagua es Axagua tras el
    cambio castellano /ʃ/ → /x/). Xagua y Achagua son un parecido que puede
    ser un mismo nombre, no una prueba de pueblo. Ojo a dos homonimias:
    «xagua» = el tinte de Genipa (Aguado escribe tres de cuatro «xaguas» por
    el tinte), y Baragua (Lara, hoy parroquia Xaguas) ≠ Barragua (Rivero,
    Airico) ≠ Barraguán (bajo Meta). Nadie de los leídos las confundió, pero
    el paralelo invita.
  mitare: >-
    Ninguna fuente pone xaguas ni achaguas en Mitare: el pueblo es caquetío
    en el s. XVI (libre, Arcaya p. 230) y en 1773 (374 caquetíos, Martí vía
    Oliver). Lo más cercano son las montañas de Pedregal, en la cabecera del
    mismo río, a unos 37 km, donde Arcaya pone ajaguas en encomienda y Martí
    axaguas «nómadas» en el s. XVIII. La pista de Miguel necesita su fuente.
  lo_que_si_queda: >-
    Un vecino bien documentado de la polity de Barquisimeto: aldeas en 1530,
    diplomacia con bastones, guerra de emboscada con los gayones, una lengua
    propia, sal con los caquetíos aun siendo enemigos, culto al sol y la luna
    en 1579, encomienda en la sierra de Coro y Paraguaná después. Eso alimenta
    etnias.yaml y la esfera; la filiación, no.

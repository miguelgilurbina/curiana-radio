# ══════════════════════════════════════════════════════════════════════
# TAÍNO — Las Casas 1875 [c. 1561], *Historia de las Indias*, tomo I
# PROPUESTA (regla 5). Comparanda de la ESFERA DE CONTACTO, no caquetío.
# Campaña del taíno, parcela T2. 2026-09-21.
# ══════════════════════════════════════════════════════════════════════
meta:
  obra: las-casas-1875
  campana: taino-2026-09-21
  parcela: T2
  advertencia: >-
    ESTO NO ES CAQUETÍO. Es taíno de La Española / Cuba / los lucayos, y entra
    como COMPARANDA de la esfera de contacto (CLAUDE.md, «El préstamo de esfera
    no es una fuga»). Ninguna voz de aquí se proyecta al caquetío: alimenta la
    cita primaria de las 52 entradas taínas que hoy no citan a nadie.
  colonial_por_definicion: >-
    Regla 3. Todo el taíno escrito es de 1492 en adelante. Las Casas escribe
    c. 1527-1561 sobre 1492-1494, citando el diario de Colón que él mismo
    abrevió. No se proyecta nada al precontacto; se etiqueta y punto.

  # ── lo que resultó FALSO al medirlo ────────────────────────────────
  correcciones_al_encargo:
  - afirmacion: «Las Casas comenta "la penúltima luenga"»
    medido: >-
      En el tomo I NO aparece. `penultima` = 0 ocurrencias (normalizado sin
      acentos, sobre el texto entero). Lo que SÍ hay es «la última sílaba luenga
      y aguda» (2 veces) y «la última aguda» (1 vez). La frase «la penúltima
      sílaba luenga» existe, pero es de la *Historia General* lib. III cap. 21
      («llamábanse en su lengua, Cibon-eyes, la penúltima sílaba luenga»), que
      pertenece a un tomo que NO está en el repo; se conoce porque Brinton 1871
      la cita en nota (ver `taino_brinton_1871.yaml`).
  - afirmacion: «Las Casas distingue tres lenguas en La Española (la general, el
      macorix, el ciguayo)»
    medido: >-
      En el tomo I la distinción existe pero es MÁS DÉBIL de lo que se esperaba,
      y su forma exacta importa: dice que macoriges y ciguayos «tenían diversas
      lenguas de la universal de toda la isla» y acto seguido declara que **no se
      acuerda** de si diferían entre sí. La tripartición nítida está en la
      *Apologética*, que no está en el repo. Ver `metalinguistico.m07`.
  - afirmacion: «el PDF permite dar página impresa»
    medido: >-
      No directamente. El PDF es el ebook de Project Gutenberg #49298: su pie de
      página es un contador propio que coincide con el índice del pdf en 609 de
      613 páginas. La paginación de 1875 se recupera SOLO por el índice original
      que sobrevive en pdf 572-596. Ver `paginacion`.

  # ── §1 desconfiar del extractor ────────────────────────────────────
  extraccion:
    herramienta: pdftotext -enc UTF-8 (y otra vez con -layout, para el índice)
    plano_bytes: 1070309
    layout_bytes: 1115512
    paginas_pdf: 613
    por_que_las_dos: >-
      El índice original de 1875 es una tabla a dos columnas (sumario a la
      izquierda, página impresa alineada a la derecha). Sin `-layout` los
      números se mezclan con la prosa y el mapa capítulo→página no se puede
      construir. Con `-layout` sale limpio. Es la trampa de CLAUDE.md
      («tablas a dos columnas»), aquí en su versión de índice.

  paginacion:
    que_es_el_pdf: ebook de Project Gutenberg #49298 (release 2015) llevado a PDF
    pie_de_pagina: >-
      contador del ebook, NO paginación de 1875. Medido: el número del pie
      coincide con el índice de la página pdf en 609 de 613 páginas (las 4
      excepciones son portadas o páginas sin pie).
    ancla_recuperada: >-
      el ÍNDICE original de 1875 sobrevive en pdf 572-596 con las páginas
      impresas. Da las dos anclas (impresa y pdf) para los 82 capítulos.
    desfase: no constante — va de +8 (cap. I) a +69 (cap. LXXXII)
    script: 6-fusion/scripts/mapa_capitulos_las_casas.py
    como_se_cita_aqui: >-
      `capitulo` es EXACTO. `pagina_pdf` es EXACTA. `pagina_impresa` es una
      INTERPOLACIÓN lineal dentro del capítulo y va marcada `~`; el rango
      exacto del capítulo va en `pagina_impresa_capitulo`. Quien necesite la
      página impresa exacta de una voz tiene que ir al facsímil de 1875, que no
      está en el repo.

  # ── §2 medir la ortografía ANTES de contar ─────────────────────────
  ortografia_medida:
    nota: >-
      conteos sobre el texto normalizado (NFD sin diacríticos, minúsculas). La
      grafía es la del editor de 1875 (Fuensanta del Valle / Sancho Rayón), que
      moderniza a medias: acentúa «á», «ó», «é» donde hoy no se acentúa y
      conserva la ç del original en algunas voces indígenas.
    ce_cedilla: >-
      viva en voz indígena: `çabanas` (3) frente a `zabanas` (0) y `sabanas`
      (0). En el etnónimo alterna: `maçorix` (2) y `macorix` (2).
    y_frente_a_i: >-
      `cyguayos` (4) frente a `ciguayo` (1) y `çiguayo` (1). **Un grep por
      «ciguayo» solo, que es como se escribe hoy, se pierde 4 de 6
      ocurrencias** — regla 6, un cero mide la consulta.
    la_misma_voz_con_dos_grafias_en_el_mismo_tomo: >-
      `nucay` (cap. XLV) y `nozay` (cap. LXVII) son la misma palabra 'oro' de
      los lucayos, separadas por 22 capítulos. Y `mazoriges` (cuerpo del cap.
      LXVII) contra `Macorix` (cap. LXII, como topónimo) y `Maçorix`.
    conteos_de_control:
      lengua: 70
      llaman: 60
      llamaban: 58
      quiere_decir: 30
      significa: 12
      vocablo: 6
      luenga: 14
      silaba: 3
      penultima: 0
      acento: 0
      pronunci: 0

  cobertura:
    leido: >-
      barrido completo del tomo (613 pp. pdf) por patrón, con lectura de pasaje
      (§3) en los capítulos XL-LXVII, que son el primer viaje y la descripción
      de La Española — que es lo que el encargo pedía priorizar.
    patrones_barridos:
    - lengua|lenguaje|c[iy]guayo|ma[cç]orix|lucayo  (92 bloques leídos)
    - llaman|llamaban|llamamos|nombraban|quiere decir|significa|en su lengua|vocablo  (226 bloques)
    - macana|tabaco|axi|duho|nitayno|cazabi|yuca|iguana|hutia|ajes|maiz|caniba|matinino|cayo|guanin
    - s[ií]laba|aguda|luenga|faltan ó sobran
    no_leido_pasaje_a_pasaje: >-
      capítulos I-XXXIX (prólogo, cosmografía antigua, descubrimientos
      portugueses en África) y LXVIII-LXXXII (tornaviaje y corte). Se barrieron
      por patrón y no dieron voz indígena antillana: el cap. XXIV da `Adeget`,
      que es de la costa africana y NO es taíno.

  otros_volumenes_y_la_apologetica:
    nota: NO se descargó nada (restricción del encargo). Sólo se anota qué darían.
    tomos_II_a_V_1875: >-
      el tomo I cubre el LIBRO I (caps. I-LXXXII) y acaba con el regreso del
      primer viaje. Todo lo que el proyecto quiere del taíno de rito y religión
      —cemíes, behiques, areítos, cohoba— está en libros posteriores y en la
      *Apologética*: medido, en el tomo I `cemi`, `behique`, `areito`, `cohoba`,
      `Yocahu` y `Atabey` dan CERO.
    lo_que_cita_brinton_y_no_tenemos: >-
      Brinton 1871 cita, de obras que no están en el repo, las entradas más
      densas: *Hist. Apologética* caps. 46, 61, 120, 197, 199, 204, 241 (los
      títulos `matunheri` / `bajari` / `guaoxeri` / `nitaino`, los numerales,
      `batey`, `guayzas`, `bixa`, `batea`) y *Hist. General* lib. I cap. 90 y
      120, lib. III caps. 21, 33, lib. IV cap. 48. Ahí está el grueso.
    deuda: >-
      conseguir los tomos II-V de la edición de 1875 y la *Apologética* elevaría
      de golpe la cita primaria del taíno. Prioridad: la decide Miguel.

# ══════════════════════════════════════════════════════════════════════
# 1. LO QUE DICE SOBRE LA LENGUA MISMA
#    (acento, variedades, inteligibilidad — la evidencia de la trampa 3)
# ══════════════════════════════════════════════════════════════════════
metalinguistico:

- id: m01
  tema: acento
  libro: I
  capitulo: XL
  pagina_pdf: 330
  pagina_impresa: ~291
  pagina_impresa_capitulo: [291, 298]
  cita_verbatim: >-
    la cual se llamaba en lengua desta isla Española, y dellas, porque cuasi
    toda es una lengua y manera de hablar, Guanahaní, la última sílaba luenga y
    aguda.
  que_dice: >-
    acento final en `Guanahaní`, y de paso la tesis de la lengua única, matizada
    ya con un «cuasi».

- id: m02
  tema: acento
  libro: I
  capitulo: L
  pagina_pdf: 406
  pagina_impresa: ~359
  pagina_impresa_capitulo: [358, 361]
  cita_verbatim: >-
    siendo toda una lengua la de los de Cuba y de la Española, pues no se
    llamaba sino Haytí, la última sílaba luenga y aguda.

- id: m03
  tema: acento
  libro: I
  capitulo: LVII
  pagina_pdf: 442
  pagina_impresa: ~390
  pagina_impresa_capitulo: [389, 391]
  cita_verbatim: >-
    (estas debian ser la pimienta que llamaban axí, la última aguda)
  que_dice: >-
    tercera marca de acento del tomo, y la única sobre una voz común (no un
    topónimo). Los tres casos son OXÍTONOS: el rasgo que Las Casas anota es
    siempre el mismo, y sólo lo anota cuando la voz es aguda.

- id: m04
  tema: lengua-unica
  libro: I
  capitulo: XLVI
  pagina_pdf: 380
  pagina_impresa: ~335
  pagina_impresa_capitulo: [331, 338]
  quien_lo_dice: Colón (Las Casas transcribe «palabras formales del Almirante»)
  cita_verbatim: >-
    la cual es toda una en todas estas islas de Indias, y todos se entienden, y
    todas las andan con sus almadías, lo que no hacen en Guinea, donde hay mil
    maneras de lenguas, que la una no entiende á la otra.
  atribucion: >-
    OJO: la afirmación es de Colón en 1492, no de Las Casas. Colón llevaba
    quince días en las islas y no entendía a nadie — él mismo lo dice en m05.

- id: m05
  tema: lengua-unica
  libro: I
  capitulo: XLVIII
  pagina_pdf: 396
  pagina_impresa: ~351
  pagina_impresa_capitulo: [348, 354]
  quien_lo_dice: Colón
  cita_verbatim: >-
    Y tambien no se la lengua, y la gente destas tierras no me entienden, ni yo,
    ni otro que yo tenga, á ellos, y estos indios que yo traigo muchas veces les
    entiendo una cosa por otra al contrario [...] faré enseñar esta lengua á
    personas de mi casa, porque veo que es toda la lengua una, fasta aquí.
  que_dice: >-
    en el mismo párrafo declara que no entiende nada y que la lengua es una. El
    «fasta aquí» es la cláusula honesta.

- id: m06
  tema: transcripcion
  libro: I
  capitulo: LXII
  pagina_pdf: 467
  pagina_impresa: ~411
  pagina_impresa_capitulo: [409, 412]
  cita_verbatim: >-
    provincias, puesto que les faltan ó sobran sílabas ó letras, que no las
    debiera escribir bien el Almirante como no los entendiese bien.
  que_dice: >-
    Las Casas declara que las formas indígenas del diario de Colón están mal
    transcritas. Es la advertencia epistémica más fuerte del tomo y vale para
    TODA voz de estos capítulos: la fuente misma dice que su fuente falla.

- id: m07
  tema: variedades
  libro: I
  capitulo: LXVII
  pagina_pdf: 492
  pagina_impresa: ~434
  pagina_impresa_capitulo: [432, 438]
  cita_verbatim: >-
    Es aquí de saber, que un gran pedazo desta costa, bien más de 25 ó 30
    leguas, y 15 buenas y aún 20 de ancho hasta las sierras que hacen, desta
    parte del Norte, la gran vega inclusive, era poblada de una gente que se
    llamaban mazoriges, y otras cyguayos, y tenian diversas lenguas de la
    universal de toda la isla. No me acuerdo si diferian estos en la lengua,
    como ha tantos años, y no hay hoy uno ni ninguno á quien lo preguntar,
    puesto que conversé hartas veces con ambas generaciones, y son pasados ya
    más de cincuenta años.
  que_dice: >-
    LA PIEZA CENTRAL. (a) hay al menos DOS lenguas distintas de «la universal»
    en La Española; (b) el propio Las Casas, que trató con las dos gentes, NO
    se acuerda de si macoriges y ciguayos hablaban lo mismo entre sí; (c) para
    1561 no queda nadie a quien preguntar. La tripartición limpia que circula
    («la general, el macorix, el ciguayo») es más firme que lo que el tomo I
    sostiene.
  para_el_proyecto: >-
    evidencia directa de la trampa 3 de la campaña: **el taíno tampoco era una
    sola lengua**, y la fuente que más sabía lo dice con una laguna declarada.
    Cualquier entrada nuestra etiquetada `taíno` sin decir la isla y la
    variedad está diciendo más de lo que la fuente dice.

- id: m08
  tema: variedades
  libro: I
  capitulo: LXVII
  pagina_pdf: 492
  pagina_impresa: ~434
  pagina_impresa_capitulo: [432, 438]
  cita_verbatim: >-
    Aquí no llaman caona al oro como en la primera parte desta isla, ni nozay
    como en la isleta de Guanahaní ó Sant Salvador, sino tuob.
  que_dice: >-
    TRES palabras para 'oro' en tres zonas, dichas en una frase por quien vivió
    allí: `caona` (La Española occidental), `nozay` (lucayos) y `tuob` (costa
    ciguaya). Es el dato dialectológico más limpio del tomo, y contradice de
    hecho —no de opinión— la tesis de la lengua única de m04/m05.
  ojo: >-
    el mismo `nozay` aparece 22 capítulos antes como `nucay` (ver v14): la
    variación no es sólo dialectal, también es del copista.

- id: m09
  tema: etnonimo
  libro: I
  capitulo: LXVII
  pagina_pdf: 493
  pagina_impresa: ~435
  pagina_impresa_capitulo: [432, 438]
  cita_verbatim: >-
    se llamaban cyguayos porque traian todos los cabellos muy luengos, como en
    nuestra Castilla las mujeres
  que_dice: etimología del etnónimo dada por Las Casas; no da la forma indígena.

- id: m10
  tema: interpretes
  libro: I
  capitulo: XLVIII
  pagina_pdf: 394
  pagina_impresa: ~349
  pagina_impresa_capitulo: [348, 354]
  cita_verbatim: >-
    diciéndoles en su lengua, que no hobiesen miedo (porque, diz que, ya sabian
    algunos vocablos della, por la conversacion de los que consigo de las otras
    islas traian)
  que_dice: >-
    cómo se adquirió el poco taíno que hay en el diario: de oído, por marineros,
    a través de cautivos lucayos. Dato de procedencia, no de lengua.

# ══════════════════════════════════════════════════════════════════════
# 2. LAS VOCES, CON GLOSA VERBATIM
#    `atribucion` = isla/variedad que LA FUENTE declara. Si no la declara,
#    `no-declarada` (trampa 2 de la campaña) y no cuenta como taína.
# ══════════════════════════════════════════════════════════════════════
voces:

- id: v01
  forma_fuente: cayos
  glosa_fuente: "porque cayos en esta lengua son islas"
  libro: I
  capitulo: XL
  pagina_pdf: 331
  pagina_impresa: ~292
  pagina_impresa_capitulo: [291, 298]
  atribucion: lucayos (islas pequeñas al norte de Cuba y La Española)
  campo: geografia
  en_el_lexicon: cayo (taíno)
  nota: >-
    la glosa viene dentro de la etimología de `lucayos`: «quiere decir, cuasi
    moradores de cayos». Brinton p. 12 da la misma voz como `Cai, cayo, or
    cayco` y Brinton p. 15 la descompone `lukku kairi` 'hombres de las islas'.

- id: v02
  forma_fuente: canoas
  glosa_fuente: "sus barcos y barquillos que llamaban canoas (en latin se llaman monoxilla), hechas de un sólo cabado, madero de buena forma"
  libro: I
  capitulo: XLI
  pagina_pdf: 339
  pagina_impresa: ~299
  pagina_impresa_capitulo: [299, 305]
  atribucion: Guanahaní / lucayos
  campo: navegacion
  en_el_lexicon: "no como `canoa` con fuente taíno; el lexicón la tiene por la vía caquetía (kanoa, D5 2026-08-31)"
  nota: >-
    Las Casas anota aparte que Colón la llamaba `almadía` (voz árabe) y que los
    indios decían `canoa` (cap. XLV, pdf 369; cap. XLVI, pdf 379). Es una
    corrección explícita del cronista al Almirante.

- id: v03
  forma_fuente: cazabí
  glosa_fuente: "el pan de aquellas tierras, que es cazabí"
  libro: I
  capitulo: XLII
  pagina_pdf: 346
  pagina_impresa: ~306
  pagina_impresa_capitulo: [306, 311]
  atribucion: "no-declarada en este pasaje (isla Fernandina / lucayos); en cap. XLVI y LXIII, La Española"
  campo: alimentacion
  en_el_lexicon: cazabi (taíno) · casabe (taíno)
  segundas_menciones:
  - {capitulo: XLVI, pagina_pdf: 377, pagina_impresa: ~333, glosa: "de la yuca, de que hacian el pan que llamaban cazabí"}
  - {capitulo: LX,   pagina_pdf: 457, pagina_impresa: ~402, glosa: "de su pan, que llaman cazabí"}
  - {capitulo: LXIII, pagina_pdf: 469, pagina_impresa: ~413, glosa: "del pan de la tierra, que se llamaba cazabí"}
  para_el_proyecto: >-
    `casabe` es una de las cinco voces que copan `prestamos_de_esfera` (111 de
    161 formas-respuesta, medición del 2026-09-17) y `FORMA_DE_LA_ESFERA` ya la
    manda decir `cazabi`. Aquí está por fin la cita primaria de la grafía
    `cazabí`, cuatro veces y con la glosa del cronista.

- id: v04
  forma_fuente: hamacas
  glosa_fuente: "sus camas y paramentos de casa eran como redes de algodon. Estas llamaban en esta Española, hamacas, que son de hechura de hondas, no tejidas como redes"
  libro: I
  capitulo: XLII
  pagina_pdf: 350
  pagina_impresa: ~309
  pagina_impresa_capitulo: [306, 311]
  atribucion: La Española (declarada)
  campo: ajuar
  en_el_lexicon: "no con fuente taíno; entró por la vía caquetía (D5 2026-08-31)"

- id: v05
  forma_fuente: cupey
  glosa_fuente: "hay un árbol en estas tierras que se llama, en lengua de indios desta Española, cupey"
  libro: I
  capitulo: XLII
  pagina_pdf: 349
  pagina_impresa: ~309
  pagina_impresa_capitulo: [306, 311]
  atribucion: La Española (declarada, «en lengua de indios desta Española»)
  campo: flora
  en_el_lexicon: NO
  nota: >-
    voz nueva para el proyecto. Es un epífito estrangulador (Clusia): Las Casas
    describe el ciclo entero, pepita→pájaro→raíz aérea. Candidata a entrar como
    comparanda taína con cita, no al habla.

- id: v06
  forma_fuente: iguana
  glosa_fuente: "llámanla los indios desta isla Española iguana"
  libro: I
  capitulo: XLIII
  pagina_pdf: 355
  pagina_impresa: ~314
  pagina_impresa_capitulo: [312, 317]
  atribucion: La Española (declarada)
  campo: fauna
  en_el_lexicon: iwana (taíno) · higuana (taíno)
  nota: >-
    el pasaje es además un dato de tabú alimentario del propio Las Casas: «nunca
    jamás pudieron conmigo para que la gustase».

- id: v07
  forma_fuente: bohío
  glosa_fuente: "por todas estas islas, como sea toda ó cuasi toda una lengua, llamaban bohío á las casas en que moraban"
  libro: I
  capitulo: XLIII
  pagina_pdf: 357
  pagina_impresa: ~315
  pagina_impresa_capitulo: [312, 317]
  atribucion: "«todas estas islas»"
  campo: vivienda
  en_el_lexicon: bohio (taíno) · bohío (taíno)
  segunda_mencion: {capitulo: XLV, pagina_pdf: 372, pagina_impresa: ~328, glosa: "Este bohío quiere decir en su lengua casa"}
  nota: >-
    doble valor: sustantivo común 'casa' y, en boca de los intérpretes, nombre
    de isla. Las Casas resuelve el malentendido: «debian ellos de decir que en
    Hayti, habia grandes bohíos». Es un caso didáctico de la trampa 2 de esta
    campaña, resuelto POR EL CRONISTA.

- id: v08
  forma_fuente: Hayti
  glosa_fuente: "á esta gran isla Española, nombraban Hayti"
  libro: I
  capitulo: XLIII
  pagina_pdf: 357
  pagina_impresa: ~315
  pagina_impresa_capitulo: [312, 317]
  atribucion: La Española
  campo: toponimia
  en_el_lexicon: NO
  ver: m02 (el acento)

- id: v09
  forma_fuente: nacan
  glosa_fuente: "porque nacan quiere decir, en la lengua destas islas, medio ó en medio, y así componian este nombre Cubanacan, de Cuba y nacan, tierra ó provincia que está en medio ó cuasi en medio de toda la isla de Cuba"
  libro: I
  capitulo: XLIV
  pagina_pdf: 366
  pagina_impresa: ~323
  pagina_impresa_capitulo: [318, 324]
  atribucion: "«la lengua destas islas»"
  campo: nucleo-lexico
  en_el_lexicon: NO
  para_el_proyecto: >-
    ES LA ENTRADA MÁS VALIOSA DEL TOMO PARA LA LENGUA. No es un objeto ni una
    planta: es un elemento gramaticalizable, con análisis morfológico explícito
    del cronista (`Cuba` + `nacan`). Brinton p. 13 lo casa con arawack
    `annakan` 'centro' y p. 14 rehace la misma descomposición. Dos fuentes, un
    morfema, y el tipo de dato que decide filiación (skill §3).


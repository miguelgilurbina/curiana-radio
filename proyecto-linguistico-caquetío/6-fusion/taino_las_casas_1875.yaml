# ══════════════════════════════════════════════════════════════════════
# 4. LAS NEGATIVAS (skill §6 — valen tanto como las positivas)
# ══════════════════════════════════════════════════════════════════════
negativas:
  metodo: >-
    conteo sobre el texto normalizado sin diacríticos, probando cada forma con
    todas las grafías del XVI que se me ocurrieron (regla 6: un cero se
    verifica). Para `ciguayo` la verificación CAMBIÓ el resultado (0→6 con
    `cyguayo`); para las de abajo, no.
  religion_y_rito: >-
    **el tomo I no tiene NADA de religión taína.** `cemi`/`zemi`/`çemi` = 0,
    `behique`/`buhiti`/`bohiti` = 0, `areito`/`areyto` = 0, `cohoba` = 0,
    `Yocahu`/`Yucahu` = 0, `Atabey`/`Atabei` = 0, `Guabancex` = 0,
    `Guahayona` = 0, `Opiyelguobiran` = 0, `bagua` = 0, `duho` = 0,
    `naboria` = 0, `goeiza` = 0. Confirma las tres sesiones previas que ya lo
    habían medido (ver la nota de la fuente) y **esta vez con la lista completa
    de formas**. Todo eso está en Pané, que sí lo tiene: ver
    `taino_pane_c1498.yaml`.
  otras_ausencias:
  - {forma: barbacoa, n: 0}
  - {forma: batea, n: 0}
  - {forma: jagua/xagua, n: 0}
  - {forma: guayaba, n: 0}
  - {forma: guacamayo, n: 0}
  - {forma: yucayeque, n: 0}
  - {forma: naguas, n: 0}
  - {forma: Anacaona, n: 0}
  - {forma: Xaragua, n: 0}
  - {forma: Boriquén/Borinquen, n: 0}
  falso_positivo_declarado: >-
    `opia` da 77 y es RUIDO: son `propia`, `copia`, `apropia`. La voz taína
    `opía` 'alma del muerto' NO está en el tomo I. Está en Pané cap. XIII.
  consecuencia: >-
    la nota de la fuente decía «rendimiento nulo, documentado tres veces». Con
    la pregunta correcta —**taíno**, no caquetío ni corpus cultural— el tomo I
    rinde 26 voces con glosa y 10 pasajes metalingüísticos. No era la fuente:
    era la pregunta.

# ══════════════════════════════════════════════════════════════════════
# 5. QUÉ PROPONE ESTO (regla 5 — propone, no fusiona)
# ══════════════════════════════════════════════════════════════════════
propuesta:
  al_lexicon_como_procedencia:
    que: >-
      dar `procedencia.obra: las-casas-1875` (con libro, capítulo, página
      impresa estimada y página pdf) a las entradas taínas del lexicón que esta
      fuente atestigua en su CUERPO con glosa. Ninguna cambia de capa ni de
      glosa: sólo deja de estar sin procedencia (regla 8).
    ojo: >-
      `macana` NO entra por aquí (sólo epígrafe) y `canoa`/`hamaca`/`kunuku` ya
      entraron por la vía caquetía en D5, así que su cita taína es información
      añadida, no re-etiqueta.
  voces_nuevas_candidatas:
  - {forma: nacan, glosa: 'medio, en medio', por_que: "elemento gramaticalizable con análisis del cronista + cognado arawack (Brinton p. 13). El dato que más pesa del tomo."}
  - {forma: turey, glosa: 'cielo', por_que: "única voz de cosmos con glosa directa; dos fuentes (Las Casas, Brinton/Navarrete)"}
  - {forma: caona, glosa: 'oro (La Española)', por_que: "par dialectal con nozay/tuob, m08"}
  - {forma: nozay, glosa: 'oro (lucayos)', por_que: idem}
  - {forma: tuob, glosa: 'oro (costa ciguaya)', por_que: idem}
  - {forma: cupey, glosa: 'cierto árbol de La Española', por_que: "atribución declarada explícita"}
  - {forma: guaminiquinajes, glosa: 'perrillos blancos comestibles', por_que: "voz larga con prefijo gua-, material morfológico"}
  - {forma: çabana, glosa: 'campiña llana y rasa', por_que: "en su grafía original, no la castellanizada"}
  al_mundo:
    ecologia: >-
      quema de sabana para cazar hutías (cap. LVI, impresa ~384) — comparanda
      antillana, NO caquetía. No se proyecta a Paraguaná.
    geografia_politica: >-
      los dos rangos, cacique / nitayno, con su orden declarado (cap. LVIII,
      impresa ~394).
  lo_que_este_yaml_NO_propone: >-
    ni una sola re-etiqueta de capa, ni un cambio de glosa, ni tocar
    `curiana_lexicon.py`. Esto es materia para que Miguel decida voz a voz.

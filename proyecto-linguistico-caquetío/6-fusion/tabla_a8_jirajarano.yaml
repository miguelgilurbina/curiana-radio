# PROPUESTA — comparanda del vecino no arahuaco. Un minador propone (regla 5).
# Origen: Oliver 1989, Apéndice A, TABLA A-8 "JIRAJARAN STOCK, WESTERN
# VENEZUELA". pp. impresas 591-592 = pdf 618-619 (offset -27) de
# fuentes_caquetios/Oliver_1989_Tesis_Arawakan_NW_Venezuela_UCL.pdf
# OCR spa+eng, 500 dpi, --psm 6, --rotar auto (la p. 617 venía a 90°).
#
# ⚠️ LECTURA PROVISIONAL: transcripción por OCR de un escaneo. Las formas
#    llevan diacríticos y variantes separadas por "/" que hay que cotejar
#    contra la imagen antes de usar ninguna como dato.
#
# ─────────────────────────────────────────────────────────────────────────
# PARA QUÉ SIRVE ESTO AQUÍ
# ─────────────────────────────────────────────────────────────────────────
# No es vocabulario caquetío y NUNCA debe entrar al lexicón como tal. Sirve
# para lo contrario: para poder decir "esta palabra NO es caquetía, es del
# vecino". El lexicón ya tiene 7 formas `jirajaroide-contacto` sin nada con
# qué contrastarlas; esto es ese contraste.
#
# LA CUARTA COLUMNA ES PROTO-CHIBCHA, NO PROTO-JIRAJARA.
# Oliver no reconstruyó el jirajarano: puso el proto-chibcha de Wheeler (1972)
# al lado para PROBAR la hipótesis chibcha. El resultado está en el dato y
# sostiene su frase del cap. 3: "few points of comparison". 'agua', 'fuego',
# 'diente' y 'piedra' no se parecen en nada al proto-chibcha.
#
# CONSECUENCIA PARA EL CANON: el jirajarano no es arahuaco (Oliver nunca lo
# dice) y su filiación chibcha tampoco está sostenida. La etiqueta
# `jirajaroide-contacto` del lexicón —contacto, no parentesco— es la correcta.


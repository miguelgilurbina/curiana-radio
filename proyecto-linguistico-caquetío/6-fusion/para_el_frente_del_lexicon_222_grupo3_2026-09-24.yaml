      voces del lexicón»).'
    estado_actual:
      kalinagu: Kalinago, gente propia (autónimo)
      kalínagu: Caribe, kalínagu (autónimo del pueblo Caribe insular)
  no_entra: k3 (la glosa de `hiñaru` 'persona' → 'mujer') y k4 (las ocho sin apoyo) son la opción B de M5, no la
    A
dp.3.07_P2_gumilla_en_neira:
  decision: 'P2 A: las voces achaguas de Gumilla que corroboran a Neira y Ribero van como notas de sus entradas;
    «se corrige el YAML de Neira y se regenera»'
  por_que_es_del_frente: 'el generador de curiana_sim/lexicon_achagua.py (6-fusion/scripts/generar_lexicon_achagua.py)
    lee `nota` del `vocabulario`: tocar el YAML obliga a regenerar el módulo, y regenerarlo mueve el score (CLAUDE.md,
    «generados Y se importan»)'
  archivo: 6-fusion/achagua_neira_ribero_1762.yaml
  como: en cada entrada de `vocabulario` localizada por (castellano, pliego, lado), añadir al final de `nota` (o
    crear `nota`) el texto; después `python 6-fusion/scripts/generar_lexicon_achagua.py`, comprobar que sólo cambian
    esas `notas` del módulo, y `python 6-fusion/scripts/ensamblar_achagua_neira_ribero.py --check`
  fuente: 6-fusion/gumilla_1791_2026-09-23.yaml §achagua.voces (verificadas en imagen donde lo dice)
  aviso_de_independencia: 'Gumilla y Neira salen del mismo medio jesuita: «segunda mano del mismo taller», no dos
    atestaciones ciegas. Por eso va en notas y no cambia ninguna capa'
  ediciones:
  - entrada:
      castellano: Linage de tigre
      pliego: 72
      lado: der
    texto: 'Gumilla 1791 t. I p. 112 da «Chavi» = Tigre (misma voz; Gumilla y Neira, mismo medio jesuita; dp.3.07
      de #222)'
  - entrada:
      castellano: Vibrar la lanza
      pliego: 97
      lado: der
    texto: 'Gumilla 1791 t. I p. 112 da «Chavina» = Lanza (misma voz; dp.3.07 de #222)'
  - entrada:
      castellano: Caribe
      pliego: 46
      lado: izq
    texto: 'Gumilla 1791 t. I p. 112 da «Chavinavi» = Caribe, con dos etimologías achaguas («oriundo de Tigre» /
      «hijos de Tigres con Lanzas»); coincide con el plural Chabinabi de aquí (dp.3.07 de #222)'
  - entrada:
      castellano: Arbol
      pliego: 37
      lado: der
    texto: 'Gumilla 1791 t. I p. 114 (verificado en imagen) da «Aycubaverrenais», los que «se fingen hijos de los
      Troncos»: aycuba-berrenai ''linaje del árbol'', la misma formación que Chabiberraenay (pl. 72 der.). Apoyo
      a los linajes con nombre (dp.3.07 de #222)'
  - entrada:
      castellano: Agua
      pliego: 32
      lado: izq
    texto: 'Gumilla 1791 t. I p. 114 (verificado en imagen) da «Univerrenais», los que «idean su estirpe de los
      rios»: uni-berrenai ''linaje del agua''. Tercer testigo de que `uni` es agua (dp.3.07 de #222)'
  - entrada:
      castellano: Demonio, Diablo
      pliego: 53
      lado: izq
    texto: 'Gumilla 1791 t. II pp. 23-24: «Los Indios Achaguas le llaman Tanasimi» — idéntica (dp.3.07 de #222)'
  - entrada:
      castellano: Cinco
      pliego: 48
      lado: izq
    texto: 'Gumilla 1791 t. II p. 283 (verificado en imagen) da «Abacáje» = cinco, «los dedos de la mano» (dp.3.07
      de #222)'
  - entrada:
      castellano: Diez
      pliego: 55
      lado: der
    texto: 'Gumilla 1791 t. II p. 283 (verificado en imagen) da «Juchamacáje» = diez, «los dedos de ambas manos»:
      la forma analítica de esta (dp.3.07 de #222)'
  - entrada:
      castellano: Veinte
      pliego: 96
      lado: der
    texto: 'Gumilla 1791 t. II p. 283 da «Abacaytacáy» = veinte, «los dedos de piés y manos» (dp.3.07 de #222)'
  - entrada:
      castellano: Cuarenta
      pliego: 51
      lado: der
    texto: 'Gumilla 1791 t. II p. 283 da «Juchámatatacáy» = cuarenta, «los dedos de dos hombres»: confirma la base
      veinte, tacay = los dedos de un hombre (dp.3.07 de #222)'
  - entrada:
      castellano: Quarenta
      pliego: 87
      lado: izq
    texto: 'Gumilla 1791 t. II p. 283 da «Juchámatatacáy» = cuarenta (dp.3.07 de #222)'
  no_entran: 'Manóa (difiere en la glosa: laguna / mar), la frase de «matata» (aprisa / poco a poco), catena y arabata
    (no están en Neira): P2 A dice «las que corroboran»'
dp.3.10_togogo_tokoko_chogogo:
  decision: F2.4 A, F2.6 A y la nota de `chogogo` con lo de Goeje (M5 §7)
  fuente: '6-fusion/fauna_paraguana_aves_2026-09-22.yaml (ave-040, ave-041; FA2, #205) y 6-fusion/issues-pendientes/vocabularios-antillanos-2-2026-09-22.md
    §7 (M5, #219)'
  ediciones:
  - archivo: curiana_sim/curiana_lexicon.py
    dict: VOCABULARIO_BASE
    clave: chogogo
    campo: notas
    operacion: añadir al FINAL de `notas`, precedido de « · »
    texto: 'VARIANTE DE TIERRA FIRME (dp.3.10 F2.4 A de #222, 2026-09-24): «togogo», con t- donde las islas tienen
      ch-, en dos fuentes independientes del s. XX verificadas en imagen: Alvarado 1921 p. 292 («¿Es el TOGOGO de
      Coro?») y Esteves 1989 p. 134 (lema TOGOCO, «Togogo: ave ansérida»). Si es la misma voz, chogogo deja de ser
      sólo insular. Y Goeje 1939 p. 60 la da como caribe: «flamant tuguku, K tokoko, dialecte de Bonaire chogogo»
      (M5 §7): si Goeje tiene razón, el flamenco de las islas lleva nombre caribe. No cambia la capa: es evidencia
      en conflicto, escrita'
  - archivo: curiana_sim/curiana_lexicon.py
    dict: VOCABULARIO_BASE
    clave: tokoko
    campo: notas
    operacion: añadir al FINAL de `notas`, precedido de « · »
    texto: 'PROCEDENCIA COMPARADA (dp.3.10 F2.6 A de #222, 2026-09-24): alvarado-1921 p. 292 da la cadena gal. tokoka,
      car. tokóko, ar. tukkuku (verificado en imagen, FA2 ave-041). Es comparanda caribe/arahuaca: la entrada NO
      sube de capa, sigue caquetío-hipotético (acuñación de la simulación)'
  sin_edicion: '`togogo` no es clave del lexicón y no se crea: F2.4 A la registra en `notas` de `chogogo`'
dp.3.23_taino_hipotetico_json:
  decision: moverlo a 6-fusion/ con su fecha, no borrarlo
  por_que_es_del_frente: 'vive en curiana_sim/ y dos scripts de campaña lo leen por esa ruta: la orden del corte
    es no moverlo si algo lo lee'
  lectores:
  - 6-fusion/scripts/cruce_taino_caquetio.py — JSON_TAINO_HIP = os.path.join(R, "curiana_sim", "taino_hipotetico.json")
  - 6-fusion/scripts/medir_taino_inventario.py — p = os.path.join(SIM, "taino_hipotetico.json")
  ediciones:
  - 'git mv curiana_sim/taino_hipotetico.json 6-fusion/taino_hipotetico_2026-06-21.json   # la fecha es la de su
    único commit, 573719a'
  - '6-fusion/scripts/cruce_taino_caquetio.py: JSON_TAINO_HIP = os.path.join(R, "6-fusion", "taino_hipotetico_2026-06-21.json")'
  - '6-fusion/scripts/medir_taino_inventario.py: p = os.path.join(RAIZ_DE_6_FUSION, "taino_hipotetico_2026-06-21.json")
    — con la variable de ruta que ese script ya use para 6-fusion/'
  - 'una línea en el JSON no se puede poner (no admite comentarios): la huella va en el mensaje del commit y en
    6-fusion/decisiones_222_documentacion_2026-09-24.yaml'
  medir_despues: los dos scripts corren igual que antes (--check o su salida por defecto) y `git grep taino_hipotetico`
    ya no apunta a curiana_sim/

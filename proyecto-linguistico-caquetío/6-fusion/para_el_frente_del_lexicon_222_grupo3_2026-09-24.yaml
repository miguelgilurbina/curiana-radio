    edicion: 'Propuesta: se queda `kalinagu` (Goeje imprime la forma sin tilde, «Kalinago», p. 43; la elección es
      del frente, que mide antes cuál de las dos cita el resto del repo) y `kalínagu` pasa a FUERA_DEL_HABLA con
      su entrada entera y esta huella al principio de `notas`: «Fundida en `kalinagu` (dp.3.08 de #222, 2026-09-24):
      la misma voz de Goeje 1939 p. 43.» La glosa de `kalinagu` gana, al final de sus `notas`: «Variante con tilde
      `kalínagu` archivada (dp.3.08); su glosa decía ''Caribe, autónimo del pueblo Caribe insular''.»'
    medir_antes: '¿alguna de las dos está entre las candidatas de [Voces de fuera] o en sitios/clima (6-fusion/scripts/verificar_sitios_era2.py)?

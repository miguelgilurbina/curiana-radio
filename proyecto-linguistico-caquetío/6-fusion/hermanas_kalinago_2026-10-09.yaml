    contenido: >-
      Lo que el cuerpo dice. Todos los días se pintan de rojo con roucou y aceite,
      con círculos y bigotes negros de genipa; las mujeres, libres, llevan unas
      medias bottines de algodón y junco que son «une marque infaillible de leur
      liberté, d'où vient que les esclaves n'en portent jamais»; la cautiva
      lleva el pelo corto; el caracolí marca al capitán y a sus hijos; los
      hombres llevan al cuello silbatos de hueso de sus enemigos.

# ═════════════════════════════════════════════════════════════════════════
# HALLAZGO LATERAL — un dato CAQUETÍO que salió leyendo a Rochefort
# (no es kalinago; se propone aparte para el corpus caquetío)
# ═════════════════════════════════════════════════════════════════════════
hallazgo_lateral_caqueti:
  - id: kl10-L1
    contenido: >-
      Los indios de Curazao dejan la casa donde murió alguien. Tras decir que los
      kalinago se mudan cuando muere alguien de la casa y que los caribes del
      continente la queman, Rochefort: «Cette plaisante superstition se voit
      aussi chez les Indiens de l'Ile de Coraçao, bien que ces pauvres gens ayent
      reçeu le Saint Batême. Car Monsieur du Montel rapporte, qu'étant au grand
      village de ces Indiens nommé l'Ascension, & ayant remarqué en deus ou trois
      endroits, des maisons les unes desertes, quoy qu'elles fussent en leur
      entier, & les autres absolument ruinées, il demanda pourquoy ces maisons
      étoient ainsi abandonnées: Et le Cacique ou Capitaine, luy répondit, que
      c'étoit parce qu'il étoit mort quelques personnes en ces lieus-là.»
    fuente: atestiguado
    procedencia: {obra: rochefort-1658, pagina: 'pp. 437-438 (imagen)'}
    testigo: 'du Montel, que lo vio y lo preguntó al cacique; Rochefort lo transcribe'
    epoca: 'hacia 1640-1655 (du Montel en Curazao, ya holandés, con los indios bautizados)'
    limite: 'Colonial y post-bautismo: los indios de Curazao del s. XVII son los caquetíos que quedaron en la isla (geografia_politica-001, -014). Rochefort además cree que son refugiados de La Española (p. 327), lo que es error suyo.'
    toca: 'creencia-010b (la casa del díao que nadie vuelve a habitar): aquí es la casa de cualquier muerto, y en un pueblo caquetío real con cacique.'
    otro_dato_del_mismo_autor: 'p. 327 (imagen): los indios de Curazao «n''ont aucun mot de la langue Caraibe en la leur, ni aucune fasson de faire d''où l''on puisse recueillir qu''ils ayent jamais eu» trato con los caribes. Un juicio de oído del s. XVII, útil como negativa: ni léxico ni costumbre caribe en los caquetíos de Curazao.'
    destino: 'creencia.yaml, como atestiguado colonial de Curazao (lo decide Miguel); y geografia_politica para el pueblo «l''Ascension» con su cacique hacia 1650.'


# ══════════════════════════════════════════════════════════════════════
# OVIEDO Y VALDÉS, tomos II, III y IV — el LIBRO DE VENEZUELA
# ed. José Amador de los Ríos, Real Academia de la Historia, Madrid
# 1852 · 1853 · 1855.  Segunda campaña del taíno, parcela T6, 2026-09-22.
#
# PROPUESTA (regla 5). Nada de aquí entra al canon sin que Miguel lo fusione.
#
# Lo que esta parcela venía a buscar eran cuatro voces que el canon cita y
# nadie había visto en la fuente: `datihao`, `diao`, `borattio` y el funeral
# del díao. Están las cuatro. Pero la más importante —`datihao`— no está
# donde el canon cree, y eso cambia lo que se puede decir con ella.
#
# ⚠️ ESTO NO ES PRECONTACTO (regla 3). Oviedo escribe entre 1535 y 1548 sobre
# una gobernación que empieza en 1528. Todo lo de aquí es COLONIAL TEMPRANO y
# no se proyecta al s. XIV-XV sin decidirlo.
# ══════════════════════════════════════════════════════════════════════
meta:
  fusionado: >-
    PARCIAL (2026-09-22, db.2 de 6-fusion/decisiones_base_2026-09-22.yaml, en la
    rama de la tanda de la base, sin medir): `datihao` → `taíno`; cita primaria a
    `diao` y `boratio`; `creencia-001` con la referencia primaria. Por
    6-fusion/scripts/reetiquetar_datihao_diao.py. Queda sin fusionar el resto de la
    propuesta, y `waitiao` llevado a Miguel.
  parcela: "T6 — Oviedo y Valdés, tomos II-IV (el libro de la Provincia de Venezuela)"
  fecha: 2026-09-22
  campana: Segunda campaña del taíno
  obras:
    # claves foráneas → 4-fuentes/bibliografia.yaml (regla 8)
    - oviedo-y-valdes-1852-1855     # la nota nueva, tomos II-IV
    - oviedo-y-valdes-1851          # el tomo I, minado por T1 el 2026-09-21
  generado_por: >-
    lectura del escriba sobre la capa de texto de los tres PDF descargados hoy
    de Internet Archive, con verificación POR IMAGEN de cada forma que se
    propone. La imagen está entera en los tres tomos: aquí no hay el problema
    del tomo I (escaneo roto desde la impresa 155).

  # ─────────────────────────────────────────────────────────────────
  # LO PRIMERO: qué del encargo resultó falso al medirlo
  # ─────────────────────────────────────────────────────────────────
  lo_que_resulto_falso:

  - afirmacion: >-
      «el "apéndice de voces" del editor no existe» — `4-fuentes/oviedo-y-valdes-1851.md`
      §«Qué NO ha dado», 2026-09-21, apoyándose en «el rastreo del 2026-08-14
      sobre el tomo IV».
    medido: >-
      EXISTE. Se llama **«VOCES AMERICANAS EMPLEADAS POR OVIEDO»**, ocupa las
      impresas **593-607 del tomo IV** (pdf 608-622) y lo cierra una
      **BIBLIOGRAFIA** de los 23 vocabularios que el editor usó (impresa 608).
      Es exactamente lo que Jahn 1927 p.213 n.29 llama «el Apéndice al tomo IV»,
      y trae **doce entradas marcadas "(Lengua de Venezuela)"**, entre ellas las
      seis que Jahn cita. La conclusión de ayer era correcta SOBRE EL TOMO I
      (allí el apéndice es un índice de capítulos) y se extendió al tomo IV sin
      tenerlo delante.

  - afirmacion: >-
      «Oviedo no nombra a los caquetíos» — medido en el tomo I con las sondas
      `caquet` = 0, `caiquet` = 0.
    medido: >-
      Los nombra **12 veces en el tomo II**, y las sondas seguían dando 0 porque
      **la obra escribe `çaquitios`**, no «caquetíos». Verificado en imagen
      (t. II p.297, en cursiva). El editor lo moderniza a `zaquitios` en el
      glosario del tomo IV. Es la trampa de `minar-fuente` §2 en su forma más
      cara: la sonda medía nuestra ortografía, no la suya. Añádase `çaquiti`,
      `zaquiti` y `saquiti` a las sondas de esta obra para siempre.

  - afirmacion: >-
      «`datihao` está atestiguada a las DOS orillas por Oviedo» (encargo de esta
      campaña, y `creencia-001` + la ficha del lexicón).
    medido: >-
      **No por Oviedo.** `datihao` / `dalihao` aparece **una sola vez en los
      cuatro tomos**: t. I p.473, en boca de Agüeybana, en San Juan. En los
      tomos II, III y IV el cuerpo del texto la da **cero** veces (probado con
      `d[ai][tl]i?hao`, `\w{2,5}hao`, `dati`, `dali`, `datl` y con el guion de
      fin de línea deshecho). La atestación «venezolana» es **una entrada del
      GLOSARIO DEL EDITOR** (t. IV p.598), no un pasaje de Oviedo. Ver §4.

  - afirmacion: «`borattio`» (creencia-001, «Boratio, también borattio»).
    medido: >-
      Oviedo escribe **`boratio`, con una sola t**, 18 veces en dos páginas
      (t. II pp.298-299), verificado en imagen. La doble t es de la cadena
      Jahn/Arcaya, no de la fuente.

  - afirmacion: >-
      «el funeral del díao … t. II pp.299-300» y «el funeral del cacique común …
      t. II p.299-300» (`creencia-010`).
    medido: >-
      Son **dos páginas distintas**. El funeral del cacique común —el de beber
      los huesos en el maçato— está en la **impresa 297**, y es el que Oviedo
      atribuye **explícitamente a los çaquitios**. El del díao empieza al pie de
      la **299** y ocupa la **300**. `creencia-010` cita la página del segundo
      para el primero.

  - afirmacion: >-
      «el desfase pdf ↔ impresa se calcula UNA vez por tomo» (el encargo lo da
      por constante, y la ficha del tomo I dice «Constante, verificado en 405
      páginas»).
    medido: >-
      Constante en el t. II (13) y en el t. IV (15). **En el t. III NO lo es**:
      13 hasta la pdf ≈150 y 15 desde ahí (láminas intercaladas). Y en el propio
      tomo I la impresa 473 está en la pdf 590, o sea desfase **117**, no 118 —
      la cita de T1 es correcta, la fórmula de su ficha no lo es en ese tramo.

  - afirmacion: >-
      implícita en el encargo: que en los tomos II-IV habría algo sobre las
      islas de los Gigantes y el contacto con las Antillas.
    medido: >-
      El **nombre** «islas de los Gigantes» no está: los 39 «gigantes» del t. II
      son los **patagones del estrecho de Magallanes** y los guyrandos del
      Plata. Pero **las islas sí están**, y con sus nombres indígenas: t. II,
      libro XXI cap. VI, impresas **131-132**. Ver §5bis.
    y_esto_lo_falle_yo_primero: >-
      🔴 En la primera pasada di este apartado por **cero**, con las sondas
      `curazao|curaçao|curacao`, `aruba|oruba` y `bonaire|buynare|boynare` a 0 en
      los tres tomos. **Era mi propio error de §2, por tercera vez en la misma
      sesión**: el OCR da `Aruba` como `Aniba`, `Boynare` como `Boijnare` /
      `Boynarc` y `Coquibacoa` como `Quiquibacoa` (que además es la grafía
      impresa). Lo encontré al ampliar la clase de la ç a `[cgfz]` por otro
      motivo. **Una sonda negativa no vale si no se ha mirado antes cómo
      escribe la obra ESE nombre concreto** — y yo lo había escrito en este
      mismo archivo dos secciones más arriba.

  # ─────────────────────────────────────────────────────────────────
  # LAS DESCARGAS (autorizadas por Miguel el 2026-09-22)
  # ─────────────────────────────────────────────────────────────────

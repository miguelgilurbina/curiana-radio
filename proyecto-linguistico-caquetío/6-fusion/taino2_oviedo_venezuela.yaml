  # ─────────────────────────────────────────────────────────────────
  # ESTADO DE CADA PDF (tarea 2 del encargo)
  # ─────────────────────────────────────────────────────────────────
  estado_de_los_pdf:
    comun: >-
      Los tres son sanos: **pymupdf los abre sin reparar** (`is_repaired =
      False`), `pdftotext` funciona y la imagen está completa. Nada del calvario
      del tomo I. La capa de texto es OCR de archive.org y comete las mismas
      sustituciones que el tomo I —la ç sale `g`, `f`, `r` o `z`— así que
      **ninguna forma de este YAML se da por buena sin imagen**.
    tomo_II:
      paginas_pdf: 544
      caracteres_capa_texto: 2176259
      paginas_casi_vacias: 26
      desfase: "impresa = pdf − 13 (constante: 301 de 314 encabezados legibles)"
      extractores: "pymupdf ✓ · pdftotext ✓ · pypdf ✓"
    tomo_III:
      paginas_pdf: 680
      caracteres_capa_texto: 2802690
      paginas_casi_vacias: 18
      desfase: >-
        ⚠️ NO constante: **13** hasta la pdf ≈150, **15** desde ahí
        (68,4 % de 212 encabezados en 15; 25,0 % en 13, todos en el primer
        tramo). No afecta a ninguna cita: el tomo III no dio nada.
      extractores: "pymupdf ✓ · pdftotext ✓"
    tomo_IV:
      paginas_pdf: 656
      caracteres_capa_texto: 2607655
      paginas_casi_vacias: 27
      desfase: "impresa = pdf − 15 (constante: 341 de 357 encabezados legibles)"
      extractores: "pymupdf ✓ · pdftotext ✓"

    # 🔴 la trampa nueva, medida hoy
    el_guion_de_fin_de_linea:
      que_pasa: >-
        La caja es de dos columnas estrechas y **parte las palabras a fin de
        línea**. La capa OCR conserva el guion, así que un `grep` sobre el texto
        crudo no encuentra la mitad de las apariciones.
      medido_en_el_tomo_II:
        "çaquitio": "9 sin deshacer el guion → **12** deshaciéndolo"
        "boratio": "16 → **18**"
        "Veneçuela": "31 → **39**"
        "çemyruco": "**0 → 1**: sin deshacer el guion la voz no existe"
      y_lo_que_ni_asi_aparece: >-
        `busera` y `datos` siguen dando **0** con el guion deshecho, porque el
        OCR las destroza (`Intsera`, `dalos`). Las dos están en la página y se
        leyeron **con los ojos**. Moraleja: en esta edición el conteo es una
        cota inferior, siempre.

  # ─────────────────────────────────────────────────────────────────
  # DÓNDE ESTÁ EL LIBRO DE VENEZUELA (tarea 2)
  # ─────────────────────────────────────────────────────────────────
  el_libro_de_venezuela:
    tomo: II
    libro: XXV
    tambien_llamado: "«libro sexto de la segunda parte»"
    titulo_verbatim: >-
      «Comiença el libro sesto de la segunda parte, ques vigéssimo quinto de la
      Natural y general historia de las Indias: el qual tracta de la
      gobernaçión de la provinçia del golpho de Veneçuela y otras provinçias,
      questán por sus Magestades encomendadas á la grand compañía de los
      alemanes Velzares en la Tierra-Firme.»
    paginas_impresas: "269-332"
    paginas_pdf: "282-345"
    capitulos_que_importan:
    - numero: IX
      impresas: "297-302"
      titulo_verbatim: >-
        «De algunas particularidades é ritos é çerimonias de la gente natural
        desta gobernaçión del golpho de Veneçuela, é otras cosas notables é
        convenientes al discurso de la historia.»
      por_que: >-
        Es EL capítulo. Aquí están el funeral de los çaquitios, el boratio, el
        díao, el maçato, la caça y la busera. Cuatro de los cinco datos que el
        corpus tiene de «Oviedo t. II» salen de estas seis páginas.
    - numero: XXII
      impresas: "328-332"
      titulo_verbatim: >-
        «De algunas particularidades, de que el historiador fué informado desta
        provinçia de Venezuela por el mesmo señor obispo don Rodrigo de
        Bastidas, como testigo de vista y de tanta auctoridad.»
      por_que: >-
        El ayuno ritual (p.329), los grados de nobleza por tatuaje (p.330) y el
        párrafo de flora y fauna con `tara`, `datos`, `comoho` y `çemyrucos`
        (p.331). Y **declara su testigo**: el obispo Bastidas, más el tesorero
        Acuña, el contador Naveros, Pedro de Salvatierra y el capitán Pedro de
        Limpias, todos «á voce viva».
    en_los_otros_tomos:
      tomo_III: >-
        **NADA.** `Veneçuela` = 1 (una mención de paso), `Coro` = 5 (cuatro son
        «cantar en coro» y «corona»), `çaquiti` = 0, `diao` = 0, `borat` = 0,
        `Curiana` = 0, `Paraguaná` = 0, `Maracaybo` = 0. El tomo III es Perú,
        Nicaragua y Nueva Granada. **Fuente descartada para esta pregunta.**
      tomo_IV: >-
        En el cuerpo, sólo un naufragio que acaba en Coro (libro L, impresas
        531-535: Christóbal de Sanabria, el obispo Bastidas) — **cero lengua**.
        Todo el valor del tomo IV está en el **glosario del editor**, §4.

  cobertura_real:
    leido_entero:
    - "t. II, Libro XXV cap. IX (impresas 297-302) y cap. XXII (328-332)"
    - "t. II, apertura del Libro XXV (impresas 269-271)"
    - "t. IV, glosario «Voces americanas empleadas por Oviedo» (impresas 593-607) y su bibliografía (608)"
    leido_por_formula_de_nombrar:
    - >-
      t. II, Libro XXV entero (impresas 269-332): barrido de las diez fórmulas
      de nombrar («que llaman», «se llama», «los indios llaman», «en su lengua»,
      «quiere deçir»…), 88 pasajes extraídos y leídos uno a uno
    no_leido:
    - "t. II, libros XX-XXIV y XXVI-XXVIII (impresas 3-268 y 333-530) — sólo sondados"
    - "t. III entero — sólo sondado, y los ceros están medidos"
    - "t. IV, libros XXXIX-L (impresas 1-592) — sólo sondados"
    por_que: >-
      Son 1.880 páginas impresas entre los tres tomos. El encargo era el libro
      de Venezuela y las cuatro voces; se leyó eso y se dice lo que no se leyó
      en vez de insinuar que se leyó todo.

# ══════════════════════════════════════════════════════════════════════
# 1. EL ETNÓNIMO — lo que más cambia
# ══════════════════════════════════════════════════════════════════════
el_etnonimo:
  forma_fuente: çaquitios
  variantes_en_el_ocr: "gaquitios · gaquilios · faquitios · raqiiitios (todas son la ç mal leída)"
  forma_del_editor: "zaquitios (en el glosario del t. IV, modernizado)"
  apariciones_tomo_II: 12
  paginas_impresas: [296, 297, 300, 303, 304, 305, 306, 314, 315, 326]
  verificacion: imagen
  glosa_fuente: >-
    «En la provinçia de Veneçuela los indios naturales della, en espeçial los de
    la generaçion que llaman *çaquitios*…» (t. II p.297, cursiva del editor)
  que_es_para_oviedo: >-
    Una **generaçión** (= gente, nación) de la provincia de Venezuela, amiga de
    los cristianos, con pueblos propios (Apodori, Coativa), tierra «clara de
    savánas, y fértil, y de mucha montería», que **rescata y vende** con los
    pueblos palafíticos de la laguna.
  por_que_importa: >-
    Es la primera vez que este repo ve a Oviedo nombrar a los caquetíos. Y es lo
    que valida hacia atrás toda la cadena: cuando Jahn y Arcaya dicen «Oviedo
    dice de los caquetíos», tienen razón, aunque la palabra impresa sea otra.
  ojo_regla_4: >-
    Los çaquitios de Oviedo están **al sur y al oeste de Coro**, hacia la laguna
    de Maracaibo y el Apure: Apodori y Coativa están a jornadas de la sierra, y
    la nasçión se atraviesa camino del río Apuri. **No son la polity costera que
    simulamos.** Es el error que Oliver denuncia, y aquí está servido: esto es
    dato caquetío, pero es dato de OTRA comarca de la esfera.
  en_el_canon: >-
    `3-mundo/etnias.yaml` y `curiana_polities.py` no registran esta grafía.
    Propuesta: añadir `çaquitio` como forma de fuente del etnónimo, con esta
    cita, y dejar constancia de que la sonda `caquet` no la encuentra.

# ══════════════════════════════════════════════════════════════════════
# 2. LAS VOCES DEL LIBRO DE VENEZUELA — cuerpo del texto
#    Esquema de `6-fusion/taino_oviedo_valdes_1851.yaml`.
#    ⚠️ Ninguna de éstas es taína. Son de la Provincia de Venezuela, y varias
#    son caquetías declaradas. Entran por la esfera del proyecto, no por la
#    del taíno.
# ══════════════════════════════════════════════════════════════════════
voces_del_libro_de_venezuela:

- forma_fuente: maçato
  glosa_fuente: >-
    «y muy quemados y secos los muelen entre dos piedras, y haçen çierto brevaje
    quellos llaman *maçato*, que es muy espesso como maçamorra ó puches, que en
    algunas partes de España llaman poleadas ó cabinas; y este maçato es algo
    açedo, y tiénenlo por muy exçelente brevaje, y echan en ello los huessos del
    difunto molidos, y revuélvenlo mucho y bébenlo todos.»
  tomo: II
  libro: XXV
  capitulo: IX
  pagina_impresa: 297
  atribucion: "«los indios naturales» de la provinçia de Veneçuela, «en espeçial los de la generaçion que llaman çaquitios»"
  campo: comida-ritual
  verificacion: imagen
  en_el_lexicon: "sí — `macato`, con glosa 'bebida'"
  resuelve: >-
    El aviso de `4-fuentes/jahn-1927.md` («el lexicón dice *bebida*, el apéndice
    dice *mazamorra*: comida vs. bebida») **se cierra sin cambiar nada**. Oviedo
    dice las dos cosas a la vez: es un **brevaje** que es **espesso como
    maçamorra**. La glosa del lexicón se sostiene en el cuerpo del texto; la del
    apéndice es el resumen del editor. Se añade la evidencia a `notas`, no se
    toca la glosa (skill §8).

- forma_fuente: caça
  glosa_fuente: >-
    «lo primero que haçe el boratio es mandar ayunar á todos los que hay en
    casa, que no coman sino maçamorra rala de mahiz que ellos llaman *caça*, y
    no mas de una vez cada dia»
  tomo: II
  libro: XXV
  capitulo: IX
  pagina_impresa: 299
  atribucion: "«ellos» = los indios de la provinçia de Veneçuela, en el rito de cura del boratio"
  lemma_del_editor: "Caçá — «(Lengua de los zaquitios en la gobernaçión de Venezuela.)» (t. IV p.595)"
  campo: comida
  verificacion: imagen
  en_el_lexicon: "no comprobado por esta parcela"
  ojo: >-
    El editor la atribuye **a los zaquitios por su nombre**; el cuerpo del texto
    sólo dice «ellos». La atribución étnica fina es del editor, no de Oviedo.

- forma_fuente: boratio
  formas: "boratio (sg.) · boratios (pl.). NUNCA `borattio`."
  glosa_fuente: >-
    «al qual diçen y afirman los boratios que le ven y hablan muchas veçes … Estos
    *boratios* son como saçerdotes suyos, y en cada pueblo prinçipal hay un
    boratio, al qual ocurren todos á le preguntar las cosas que están por venir,
    y le preguntan si lloverá ó si el año será seco ó abundante, ó si deben yr á
    la guerra contra sus enemigos ó dexarlo de haçer»
  y_ademas: >-
    «Los boratios, demás de lo que se dixo de suso, sirven en los pueblos de
    **médicos**» (p.299) — y el rito de cura entero, con el ayuno, el soplo
    («Allá yrás mal»), el chupar y la espina escondida en la boca.
  tomo: II
  libro: XXV
  capitulo: IX
  paginas_impresas: [298, 299]
  apariciones: 18
  atribucion: "los indios de la provinçia / gobernaçión de Veneçuela, sin nombrar generaçión"
  lemma_del_editor: >-
    Boratio — «adivino, encantador ó saludador, ofiçio que ejerçitaban entre los
    indios conoçidos con el nombre de zaquitios sus saçerdotes y maestros.
    (Lengua de Venezuela.)» (t. IV p.595)
  campo: creencia
  verificacion: imagen
  en_el_lexicon: "sí — `boratio`, `caquetío-atestiguado`"
  para_creencia_001: >-
    (a) la forma es `boratio`, una t; (b) el cuerpo del texto **no dice
    çaquetío**: dice «los indios de Veneçuela» — quien lo estrecha a los
    zaquitios es el EDITOR en 1855; (c) hay dos atestaciones y no una: el pasaje
    y la entrada del glosario, y **no son independientes** (el editor glosa el
    pasaje), así que no suben la entrada a «dos fuentes» (skill §8).
  y_un_dato_que_el_corpus_no_tiene: >-
    «Tornando á los indios de Veneçuela, para ver si caminarán ó yrán á pescar ó
    sembrarán, y para saber si matarán caça ó si su muger los quiere bien,
    **cada uno es boratio**» (p.298) — el boratio es un OFICIO con titular en
    cada pueblo principal, pero la adivinación por tabaco la hace cualquiera.

- forma_fuente: diao
  glosa_fuente: >-
    «Volviendo á mi historia, en algunas partes desta gobernaçion de Veneçuela el
    señor prinçipal, que tiene muchos indios y le son subjetos otros caçiques,
    **llámanle *diao***; y quando muere, tienen con él otra manera de obsequias
    de la que se dixo de suso»
  tomo: II
  libro: XXV
  capitulo: IX
  paginas_impresas: [299, 300]
  apariciones: 6
  atribucion: >-
    «**en algunas partes** desta gobernaçión de Veneçuela» — Oviedo NO dice
    çaquitios, NO dice Coro y NO dice caquetío. Es la atribución más ancha
    posible dentro de la provincia.
  lemma_del_editor: >-
    Diao — «señor ó cacique soberano de la comarca de los zaquitios en la
    gobernacion de Venezuela.» (t. IV p.598)
  campo: poder
  verificacion: imagen
  en_el_lexicon: "sí — `diao`"
  corrige_a_creencia_001b:
    dice_el_corpus: >-
      «El "díao" … es el cacique principal **que es a la vez boratio**: no un
      simple médico-hechicero, sino aquel cuyos poderes mágicos le dan el
      carácter de jefe.»
    dice_la_fuente: >-
      **Nada de eso.** Oviedo define el díao por su posición política y por
      nada más: señor principal con caciques sujetos. En las dos páginas del
      díao no vuelve a aparecer la palabra `boratio`. La ecuación
      díao = boratio es de **Arcaya 1920**, no de Oviedo, y el corpus la cita
      como si fuera de los dos.
    propuesta: >-
      Separar la referencia: el hecho político (señor sobre caciques) cita
      Oviedo t. II p.299; el hecho religioso (poderes mágicos, «más respetado y
      temido como hechicero que obedecido como jefe») cita **sólo Arcaya**, y la
      etiqueta baja de `atestiguado` a `atestiguado` con la fuente correcta o a
      `reconstruido` si Arcaya lo infiere. En duda, degradar (regla 2).
    y_la_pagina: "creencia-001b cita «t. II p.299» y acierta: la definición empieza al pie de la 299."

- forma_fuente: busera
  glosa_fuente: >-
    «y van todos donde está el cuerpo embixados y pintados de bixa y de *xagua*,
    que allí llaman *busera*»
  tomo: II
  libro: XXV
  capitulo: IX
  pagina_impresa: 300
  atribucion: "«allí» = donde se bebe los huessos del diao, en la gobernaçión de Veneçuela"
  lemma_del_editor: >-
    Busera — «almagre, almazarrón ó bija, con que se pintaban los indios de
    guerra rostro y pechos, á fin de intimidar á sus enemigos. (Lengua de
    Venezuela.)» (t. IV p.595)
  campo: creencia
  verificacion: imagen
  en_el_lexicon: "no comprobado por esta parcela"
  ojo_el_editor_se_equivoca: >-
    En el cuerpo del texto `busera` es el nombre venezolano de la **xagua**
    (jagua, el tinte NEGRO-azul), y la `bixa` (el rojo) va al lado como otra
    cosa. El glosario lo da como «almagre, almazarrón ó **bija**», es decir lo
    identifica con el rojo. **Son cosas distintas y la fuente es clara.**
    `creencia-010c` dice «pintados de bija y jagua (busera)» y **acierta**.
  verbatim_para_creencia_010c: "ahí está, con página: t. II p.300."

- forma_fuente: mene
  glosa_fuente: >-
    «Hay en aquella provinçia algunos ojos ó manantiales de betún, á manera de
    broa ó pez derretida, que **los indios llaman *mene***»
  tomo: II
  libro: XXV
  capitulo: IX
  pagina_impresa: 301
  tambien: "«la sierra que llaman del *Mene*» (pp.281, 282) y «la sierra del Mene está entre los pemees y los aruacanas» (p.296)"
  atribucion: "«los indios» de la provinçia, en la comarca de Maracaybo"
  campo: ecologia
  verificacion: ocr-mas-cotejo   # la forma sale limpia en el OCR de la 281 y la 296
  en_el_lexicon: "sí — `mene`; y CLAUDE.md lo lista entre las 52 voces homógrafas de un nombre del elenco"
  por_que_importa: >-
    Atestación de 1548 de `mene` 'petróleo, betún' con glosa y con topónimo
    derivado el mismo año. Es la voz venezolana viva más antigua que el repo
    tiene documentada en su propia fuente.

- forma_fuente: hayo
  glosa_fuente: >-
    «y la boca llena de *hayo*, ques çierta hierba para no aver sed» (p.286) ·
    «el qual *hayo* es la hierba para quitar la sed ó no averla» (p.294)
  tomo: II
  libro: XXV
  capitulo: "V-VI"
  paginas_impresas: [286, 294]
  atribucion: "las armas y el avío «de indio» en la gobernaçión de Veneçuela"
  lemma_del_editor: >-
    Hayo — «yerba, de que usaban los indios para templar la sed … **Era voz
    común á diferentes comarcas, empleándose igualmente en Venezuela y en la
    Nueva Granada.**» (t. IV p.600)
  campo: ecologia
  verificacion: ocr-limpio-dos-veces
  en_el_lexicon: "sí — `hayo`"
  resuelve: >-
    T1 encontró `hado`/`hayo` en el tomo I p.206 y **lo degradó por duda de
    OCR**. Aquí sale limpio dos veces con glosa. **La duda se puede levantar.**
  ojo_regla_4: >-
    El propio editor avisa de que no es privativa de Venezuela, y el cuerpo lo
    confirma: `hayo` reaparece en el libro XXVI (Santa Marta / Nueva Granada,
    pp.390 y 408) con el mismo uso. Es voz AREAL. Compartirla no la descalifica
    (skill §3), pero tampoco la hace caquetía.

- forma_fuente: "haperon / raporon / baporon"
  glosa_fuente: >-
    «y su *haperon*: este es un calabazo en que traen los indios çierta manera
    de cal para quitar la hambre, chupándola» (p.286) · «el *baporon* es el
    calabaço de la cal para quitar la hambre, como en otra parte tengo dicho»
    (p.294)
  tomo: II
  libro: XXV
  paginas_impresas: [286, 294]
  atribucion: "el avío de los indios de la gobernaçión de Veneçuela"
  nota_del_editor_al_pie: >-
    En la p.294 el propio Amador de los Ríos anota: «baporon: poco antes y en
    otras partes se encuentra escrito raporon». **El editor declara la
    vacilación del manuscrito**, que es lo más honesto que hace en toda la obra.
  lemma_del_editor: "Baperon y Baperoni (t. IV p.594)"
  campo: utensilio
  verificacion: ocr-con-nota-del-editor
  en_el_lexicon: "no"
  ojo: >-
    **Cuatro grafías para una palabra** (haperon, raporon, baporon, baperon) y
    el editor lo sabe. Si entra, entra con las cuatro y con la nota, o no entra.
    En duda, degradar.

- forma_fuente: icoraotas
  glosa_fuente: >-
    «do tienen gentiles labranças de mahiz é *icoraotas*, que es una çierta
    legumbre como habas, é otras rayçes que siembran, que son como çanahorias»
  tomo: II
  libro: XXV
  capitulo: "V"
  pagina_impresa: 281
  atribucion: "la generaçión llamada *corbaços*, de la sierra del Mene"
  lemma_del_editor: "Ycouoata — «legumbre muy semejante á las habas. (Lengua de Venezuela.)» (t. IV p.607)"
  campo: agricultura
  verificacion: imagen
  en_el_lexicon: "no"
  correccion_de_cadena: >-
    🔴 La forma impresa es **`icoraotas`**, verificada en imagen. El glosario
    del editor la lematiza **`Ycouoata`** y Jahn 1927 n.29 la cita
    **`icoroata`**. Son tres formas distintas de la misma palabra y **sólo una
    está en el texto de Oviedo**. Cualquier ficha que entre debe llevar
    `icoraotas` como forma de fuente y las otras dos como lecturas de segunda
    mano.
  ojo_regla_4: "**No es de los çaquitios**: es de los corbaços de la sierra del Mene."

- forma_fuente: "amana (impreso dudoso: la página admite leerse `aniana`)"
  glosa_fuente: "«y otra fructa *amana* de turmas de tierra»"
  tomo: II
  libro: XXV
  capitulo: "V"
  pagina_impresa: 281
  atribucion: "la generaçión llamada *corbaços*, de la sierra del Mene"
  lemma_del_editor: "Amana — «patata, turma de tierra. (Lengua de Venezuela.)» (t. IV p.593)"
  campo: agricultura
  verificacion: imagen-dudosa
  en_el_lexicon: "no"
  por_que_dudosa: >-
    La tipografía de 1852 no separa bien `m` de `ni` en cursiva pequeña: la
    página se puede leer `amana` o `aniana`. El glosario del editor —que tuvo el
    manuscrito delante— lematiza **Amana**, y eso inclina la balanza, pero
    **no es la página**. Regla 2: entra degradada o no entra.

- forma_fuente: tara
  glosa_fuente: >-
    «Hay mucha **langosta**, que los indios llaman *tara*, y esta no es continua:
    pero algunos años hay tanta, que cubre el ayre á no se poder ver el çielo …
    si dá en un mahical, lo tala todo y lo abrasa … también los indios en su
    venganza las toman y embanastan y **se las comen asadas**»
  tomo: II
  libro: XXV
  capitulo: XXII
  pagina_impresa: 331
  atribucion: "«los indios» de la provinçia de Venezuela, en el capítulo informado por el obispo Bastidas"
  lemma_del_editor: "Tara — «langosta. (Lengua de Venezuela.)» (t. IV p.605)"
  campo: ecologia
  verificacion: ocr-limpio
  en_el_lexicon: "sí — con glosa **'venado, ciervo'**"
  🔴_conflicto: >-
    **CUARTA fuente y la primera de primera mano.** `4-fuentes/jahn-1927.md` ya
    decía «Ninguna fuente sostiene ya "venado"», con Jahn, Zavala #238 y
    Alvarado p.283 contra. Ahora está el pasaje de Oviedo con página, y no sólo
    glosa 'langosta': **la describe** (plaga, nube, se come asada). No hay
    lectura posible en que sea un venado.
  propuesta: >-
    La glosa de `tara` pasa a 'langosta'. Mueve canon ecológico, así que es
    decisión de Miguel (D10, grupo 2) — pero ya no hay nada al otro lado de la
    balanza. Ver el issue.

- forma_fuente: datos
  glosa_fuente: >-
    «y cardones de los altos y derechos, á los quales en aquella tierra los
    llaman *datos*»
  tomo: II
  libro: XXV
  capitulo: XXII
  pagina_impresa: 331
  atribucion: "«en aquella tierra» = la provinçia de Venezuela (cap. informado por el obispo Bastidas)"
  campo: ecologia
  verificacion: imagen
  invisible_al_ocr: "sí — el OCR lo da `dalos`. Sin la imagen esta voz no existe."
  en_el_lexicon: "no"
  por_que_importa: >-
    🟢 **`dato` sigue vivo en Falcón y Paraguaná** para el fruto del cardón. Es
    un nombre vivo con atestación de 1548 y glosa del cronista, que es
    exactamente la clase de dato que la campaña de topónimos persigue («un
    nombre vivo es dato»). Y encaja con el corpus de ecología, que tiene el
    cardonal como restricción del mundo (ecologia-007/018/032).
  ojo_homonimia: >-
    ⚠️ Oliver 1989 cap. 2 lista `dato` entre las voces caquetías con /d-/
    inicial (junto a `diao`, `dare`, `datihao`), donde `dato` es un TÍTULO. El
    `datos` de Oviedo es un CACTUS. O son homógrafos, o alguien leyó mal.
    **No se resuelve aquí**: se deja el conflicto escrito.

- forma_fuente: comoho
  glosa_fuente: "«Hay otra fructa que se diçe *comoho*, que en efeto son tunas»"
  tomo: II
  libro: XXV
  capitulo: XXII
  pagina_impresa: 331
  atribucion: "la provinçia de Venezuela"
  lemma_del_editor: "Comoho — «higo tuna. (Lengua de Venezuela.)» (t. IV p.597)"
  campo: ecologia
  verificacion: imagen
  en_el_lexicon: "no — T1 lo halló en el t. I pp.313-314 y lo propuso"
  segunda_atestacion: >-
    ✅ **Ésta sí es independiente**: T1 lo encontró en el tomo I (libro VIII, el
    cardón de las tunas «en la provinçia de Venezuela»); aquí está otra vez en
    el tomo II, en otro libro y con otro informante (el obispo Bastidas). Dos
    pasajes distintos de la misma obra, escritos con doce años de diferencia.
    La entrada sube de «una mención» a «dos» (skill §8).

- forma_fuente: çemyrucos
  glosa_fuente: >-
    «Hay otros árboles que se diçen *çemyrucos*, que la fructa es muy semejante
    en la vista á las çereças»
  tomo: II
  libro: XXV
  capitulo: XXII
  pagina_impresa: 331
  atribucion: "la provinçia de Venezuela"
  campo: ecologia
  verificacion: imagen
  invisible_al_ocr: "sí — parte en `çe-myrucos` a fin de línea; sin deshacer el guion, 0 apariciones"
  en_el_lexicon: "no"
  por_que_importa: >-
    🟢 **`semeruco`** — la cereza criolla (*Malpighia emarginata*), viva hoy en
    todo Falcón y en Paraguaná, con su jugo y su árbol de patio. Atestación de
    1548, con glosa del cronista y con la comparación que explica el nombre
    castellano moderno («muy semejante en la vista á las çereças»). Es la mejor
    voz nueva de esta parcela después del etnónimo.

- forma_fuente: manari
  glosa_fuente: >-
    «y un poco mas alto que el atahud estaba un canastico ancho que llaman
    *manari*, lleno de oro»
  tomo: II
  libro: XXV
  capitulo: "III"
  pagina_impresa: 277
  atribucion: >-
    **no-declarada** en cuanto a lengua: es el ajuar de un sepulcro en el valle
    de Thamara, camino de los pacabuyes. Muy lejos de la costa.
  campo: utensilio
  verificacion: ocr-limpio
  en_el_lexicon: "no"
  ojo: "`manari` es voz arahuaca conocida (cesto/cedazo). Se anota, no se atribuye."

- forma_fuente: Curiana
  glosa_fuente: >-
    «Desde la Punta Seca se corren al oçidente treynta leguas hasta *Curiana*,
    ques un rio assi llamado, que está algo mas de diez grados y medio desta
    parte de la equinoçial. Desde Curiana sale una punta ó promontorio en la mar
    diez leguas que se llama el cabo de Sanct Román»
  tomo: II
  libro: XXI
  capitulo: VI
  pagina_impresa: 131
  atribucion: "no-declarada — Oviedo la da como nombre corriente en la carta de marear, sin decir de quién es la voz"
  campo: toponimo
  verificacion: ocr-limpio
  en_el_lexicon: "el topónimo está en el canon"
  por_que_importa: >-
    Para Oviedo **Curiana es un río**, no una provincia ni un pueblo, y está
    inmediatamente al este del cabo de San Román: es decir, **en el Golfete**.
    Es una localización primaria y temprana de la Curiana que da nombre al
    proyecto, y es de otra mano que Esteves y Medina.
  y_el_cero: >-
    `Curiana` sale **2 veces en 544 páginas** del tomo II, las dos en este mismo
    pasaje geográfico, y **0 en los tomos III y IV**. `Coriana` = 0.
    `Coquibacoa` = 0 en los tres tomos.

- forma_fuente: Paraguana
  glosa_fuente: >-
    «Desde Coro al primero pueblo de *Paraguana* hay treçe leguas, el qual se
    llama **Miraca**»
  tomo: II
  libro: XXV
  capitulo: VIII
  pagina_impresa: 296
  atribucion: "no-declarada"
  campo: toponimo
  verificacion: ocr-limpio
  en_el_lexicon: "Paraguaná sí; **Miraca** hay que comprobarlo contra el canon de topónimos"
  por_que_importa: >-
    Segunda mención de Paraguaná en Oviedo (T1 halló la del t. I p.205, «que los
    indios llaman á aquella provinçia Paraguana»), y trae algo que aquélla no:
    **el nombre de su primer pueblo**, a trece leguas de Coro. `Miraca` es
    topónimo vivo de Paraguaná. Va a la campaña de topónimos, no al lexicón.

# ══════════════════════════════════════════════════════════════════════
# 3. LOS ETNÓNIMOS Y TOPÓNIMOS DEL LIBRO XXV
#    No son léxico caquetío. Son el MAPA de la gobernación en 1535-1546, que
#    es geografía política y va a `3-mundo/`, no al lexicón (regla 7).
#    Todos salen del OCR; las grafías con ç están reconstruidas por el patrón
#    medido y llevan por eso `verificacion: ocr`.
# ══════════════════════════════════════════════════════════════════════
el_mapa_del_libro_XXV:
  verificacion: ocr
  advertencia: >-
    ⚠️ Es el mapa **colonial** de 1528-1546, levantado por las entradas de
    Alfínger, Federmann, Jorge Espira y Felipe de Hutten. Regla 3: no es el
    mapa precontacto y no se proyecta.
  generaciones_de_indios:
    - bubures            # entre la sierra de los Bubures y Maracaybo; p.271
    - buredes            # coronados como frailes; p.271
    - coanaos            # hasta el cabo de la Vela; p.271
    - giriguanas         # p.272
    - aruacanas          # «tiran sus flechas con hierba muy mala»; pp.272, 285, 296
    - aruayas            # variante de aruacanas, p.283
    - çamyruas           # p.272
    - pauxotos           # p.273
    - haracañas          # enemigos de los pauxotos; p.273
    - gondaguas          # pp.274, 276, 279
    - pemenos            # pp.285, 294
    - pemees             # p.296; ¿los mismos?
    - onotos             # palafitos de la laguna; pp.270, 300
    - guiriguiris        # palafitos; pp.300, 309(t.I ed.), 294
    - guerigueris        # variante de guiriguiris, pp.293, 294
    - çaquitios          # ver §1
    - corbaços           # sierra del Mene; p.281
    - pacabuyes          # el valle; pp.270, 296
    - coybas             # p.302
    - coyones            # p.302
    - maropides          # pp.303, 304
    - guaypies           # «belicosa é muy armada de dardos é flechas é macanas»; pp.305, 306, 318
    - chogues            # pp.308, 310, 312
    - tapeys             # p.287
  lugares:
    - Coro · Maracaybo (villa y pueblo) · el Passaje · Pueblo Viejo · Caraho
    - "Paraguana, cuyo primer pueblo es **Miraca** (p.296)"
    - "sierra del Mene · sierra de los Bubures · sierra Nevada · valle de los Pacabuyes"
    - "ríos: Comiti · Xiriri · Yuma · Apuri · Darari · Cacavari · Ahia · Voayare · Papomene · Macouyte · Oppia"
    - "pueblos: Apodori · Coativa · Thamara · Compachay · Cuyandio (ó Cuandi) · Condiloa · Ixarán · Potonic · Cilano · Zoinico · Pauxoto · Cariga · Uriri · Araburuco · Mahaboro · Carerchota · Ayanoboto · Huahuovano · Guaruruma · Huracara · Aracay · Horoco · Caçicare · Carao · Caçarida · Cabiairi"
    - "el paso *Paracuandi* (p.297) · la **isla de Tara** en la boca de la laguna (p.296)"
  caciques_nombrados:
    - "Guaygueri — «un caçique llamado Guaygueri» que sirve de guía (p.304)"
    - "Catiriguey — «el rey llamado Catiriguey, que es muy poderoso» (p.303)"
  ojo: >-
    ⚠️ **Nada de esto se lleva al canon sin cruzarlo con `3-mundo/etnias.yaml`
    y `compilar_etnias.py`.** Es una lista de lectura, no una propuesta de
    fichas: la mitad son nombres que los alemanes oyeron a través de
    intérpretes y de los que Oviedo nunca dice de qué lengua son.

# ══════════════════════════════════════════════════════════════════════
# 4. EL GLOSARIO DEL TOMO IV — y el caso `datihao`
#    Es la pieza que el repo llevaba un año citando de oídas.
# ══════════════════════════════════════════════════════════════════════
el_glosario_del_tomo_IV:
  que_es:
    titulo: "VOCES AMERICANAS EMPLEADAS POR OVIEDO"
    donde: "tomo IV, impresas 593-607 (pdf 608-622)"
    quien: >-
      **El editor, no Oviedo.** Lo firma la Real Academia de la Historia bajo la
      dirección de José Amador de los Ríos, 1855 — trescientos años después del
      texto. Lleva su propia nota al pie disculpándose: «El presente glosario no
      ha podido ser tan completo como en la parte relativa á ciencias naturales
      fuera de desear, por causas independientes de la voluntad de la Academia».
    lo_cierra: >-
      una **BIBLIOGRAFIA** (impresa 608) con los 23 vocabularios que el editor
      manejó. La leí entera: Molina (mexicano), Santo Thomás y seis más de
      quechua, Barzena, Ruiz (guaraní), **Yangües (cumanagoto, 1683)**, Valdivia
      y Febres (Chile), Marbán (moxo), Noveda (tagalo), **Pichardo (voces
      cubanas, 1845)**, y sermonarios varios.
    🔴_lo_que_NO_hay_en_esa_bibliografia: >-
      **Ni un solo vocabulario de Venezuela, de Coro, ni de ninguna lengua de la
      costa caribe venezolana.** El editor no tenía de dónde sacar una voz
      venezolana que no estuviera en el texto de Oviedo. Esto es decisivo para
      el caso `datihao`.
  estatuto_epistemico: >-
    Una entrada del glosario **no es una atestación independiente**: es la
    lectura que un erudito del XIX hace del texto que él mismo está editando.
    Vale como localizador y como testimonio de cómo se leía el manuscrito en
    1855. No vale como segunda fuente (skill §8).


  jahn_leyo_seis_de_las_doce:
    las_seis: [boratío, cazá, "datihao/diao", mazato, tara, icoroata]
    medido: >-
      `4-fuentes/jahn-1927.md` dice que la n.29 «lista **seis** voces caquetías
      del Apéndice al tomo IV». Con el apéndice delante: **son doce las marcadas
      Venezuela**, y Jahn leyó seis. Faltan `Amana`, `Baperon`, `Busera`,
      `Comoho`, `Hayo` y `Ycouoata` — salvo que `Ycouoata` es la que él llama
      `icoroata`, con lo que faltan cinco.
    y_sus_grafias: >-
      Jahn moderniza: escribe `cazá` (el editor `Caçá`, el cuerpo `caça`),
      `mazato` (`Maçato` / `maçato`) y `boratío` con tilde (`Boratio` /
      `boratio`). Ninguna de sus formas es la de la página. **Citar a Jahn no es
      citar a Oviedo.**

  # ─────────────────────────────────────────────────────────────────
  el_caso_datihao:
    la_pregunta: >-
      ¿Atestigua Oviedo `datihao` en la costa de Venezuela, como el proyecto
      viene diciendo desde el arranque?
    lo_medido:
      en_el_cuerpo_de_los_tomos_II_III_IV: 0
      sondas_usadas: >-
        `d[ai][tl]i?hao`, `\w{2,6}hao`, `dati`, `dali`, `datl`,
        `d[a4][tl1i]{1,3}[hn][a4]o`, «presta su nombre», «como yo … se nombra» —
        con el guion de fin de línea deshecho y sin deshacer, sobre los tres
        tomos. Los únicos `-hao` de los tres tomos son `bihao(s)` (la hoja),
        `Macanahao` (un pueblo del t. III) y `Sachao` (un señor del Perú).
      en_el_tomo_I: >-
        **1 vez**, pdf 590 = impresa 473, libro XVI cap. V: «á mi *dalihao* (que
        quiere deçir mi señor, ó el que, como yo, se nombra)», dicha por el
        caçique **Agüeybana**, en **San Juan**, a un hombre que acababa de
        ofrecerle «yo te serviré e seré tu **naboría**».
      en_el_glosario_del_tomo_IV: >-
        1 entrada, impresa 598: «Datihao: señor: el que presta su nombre al
        esclavo. **(Lengua de Venezuela.)**» — verificada en imagen.
    lo_que_encaja: >-
      La glosa del editor —«el que presta su nombre **al esclavo**»— es la
      paráfrasis exacta del pasaje de San Juan: allí el hombre se ofrece como
      naboría (siervo) y Agüeybana le contesta llamándole «mi dalihao … el que,
      como yo, se nombra». **Señor + esclavo + compartir el nombre: los tres
      elementos de la glosa están en el pasaje del tomo I y en ningún otro sitio
      de la obra.**
    la_hipotesis_mas_económica: >-
      El editor glosó el pasaje de San Juan y le puso la etiqueta equivocada,
      arrastrado por `Diao` —que va dos entradas más abajo, empieza por `D-`,
      glosa 'señor' y **sí** es de Venezuela. Su propia bibliografía lo
      respalda: **no tenía ningún vocabulario venezolano** del que sacar la
      voz. La alternativa —que Oviedo la oyera también en Coro y el editor lo
      supiera por un pasaje perdido— exige suponer una fuente que no se declara
      en ninguna parte.
    la_cadena_completa:
      - "Oviedo t. I p.473 — `dalihao`, San Juan, boca de Agüeybana. ATESTIGUADO."
      - "Amador de los Ríos, t. IV p.598 (1855) — `Datihao`, «(Lengua de Venezuela)». ETIQUETA DEL EDITOR."
      - "Jahn 1927 p.213 n.29 — cita el apéndice del t. IV como voz caquetía. SEGUNDA MANO DE LA ETIQUETA."
      - "Oliver 1989 cap. 2 n.42 p.146 — duda, y concluye «equally shared by both Taíno and Caquetío». LECTURA."
      - "`creencia-001` y la ficha del lexicón — `caquetío-atestiguado`, sin reserva. AQUÍ SE PERDIÓ LA DUDA."
    y_oliver_tenia_razon_por_otro_motivo: >-
      Oliver dudaba porque «Oviedo hablaba de los indios de la Provincia de
      Venezuela en general y su larga residencia en La Española pudo hacerle
      usar taíno». **La duda era buena y el motivo era otro**: Oviedo no habló de
      los indios de Venezuela en absoluto — habló de San Juan. El «en general»
      es del editor.
    propuesta:
      a: >-
        **Degradar `datihao` de `caquetío-atestiguado`.** La única atestación en
        la fuente es taína (San Juan). La etiqueta que cabe es
        `taíno-atestiguado`, con nota de que el editor de 1855 la dio por
        venezolana y de que Oliver la ve compartida.
      b: >-
        Dejarla `caquetío-atestiguado` pero **con la reserva escrita** en
        `notas` y en `creencia-001`, diciendo que el apoyo venezolano es
        editorial y no del cronista.
      c: >-
        `caquetío-hipotético`, que es lo que la regla 2 pide para un dato cuyo
        único apoyo es una etiqueta de tercera mano.
      recomendacion_del_minador: >-
        **(a)**, y que `diao` cargue con el peso de la palabra caquetía para
        'señor'. `diao` sí está en el cuerpo del texto, en Venezuela, con glosa
        y con atribución, y el proyecto ya lo tiene. **No perdemos el concepto:
        perdemos una segunda palabra que nunca estuvo.**
    lo_que_NO_cambia: >-
      ⚠️ Esto **no toca** la etimología de Oliver (`/da-/` 1sg + `/-(i)tiao/`
      sobre lokona `/atti/`), ni su separación de `diao` y `datihao` en dos
      lexemas, ni el prefijo `/d-/` como rasgo del caquetío. Sólo toca **de qué
      orilla es el testimonio de esa palabra concreta**.

  otras_entradas_del_glosario_que_este_repo_debería_mirar:
  - lemma: Macana
    entrada_verbatim: >-
      «especie de maza de armas usada por los indios, y formada generalmente de
      una porra guarnecida de pedernales. **(Lengua de Haiti y Cuba.)**»
    impresa: 601
    verificacion: imagen
    por_que: >-
      El repo tiene abierta la etiqueta de `macana` (rama `campana/macana-etiqueta`,
      PR #184, y el issue `taino-caquetio-similitudes-2026-09-21.md`). Aquí hay
      una atribución explícita: **Haití y Cuba**, o sea taína, no venezolana. En
      el cuerpo del libro XXV las macanas las llevan los **guaypies** (p.305),
      que están tierra adentro, y Oviedo no dice que la palabra sea suya.
  - lemma: Piache
    entrada_verbatim: >-
      «sacerdote supremo: el primero en la gerarquía religiosa entre los indios
      del Paraguay y de Huyapari.»
    impresa: 603
    por_que: >-
      ✅ **Confirma la auditoría del 2026-08-03**: `piache` no es venezolano
      costero para este editor tampoco. Ni una mención de Venezuela, y `piache`
      = 0 en el libro XXV (las 13 apariciones del tomo II están en los libros
      XXIV y XXVII). Lo que los çaquitios tienen es el **boratio**.
  - lemma: Guaxiro
    entrada_verbatim: "«capitán, jefe, caudillo ó señor entre los indios caribes de Tierra-Firme.»"
    impresa: 599
    por_que: >-
      El editor de 1855 da `guaxiro` como título de mando y lo llama **caribe**.
      Es materia del mapa-familia, no de esta parcela, pero nadie lo había visto.
  - lemma: Areyto
    entrada_verbatim: >-
      «danza y cantar de los indios, en que se celebraban las victorias y
      proezas de sus antepasados, **ya en los funerales**, ya en las
      declaraciones de guerra y otros momentos solemnes. (Lenguas de Cuba y de
      Haiti.)»
    impresa: 594
    por_que: >-
      El canto fúnebre que recita las hazañas del muerto —el oficio de Bana-mana
      en el canon, `creencia-010`— tiene nombre en el glosario, y el nombre es
      **antillano**. El çaquitio de la p.297 hace exactamente eso («llóranle de
      noche en tono alto y cantando, y diçiendo en aquel cantar lo que hizo
      mientras vivió») y Oviedo **no le da nombre**. Paralelo de conducta sin
      paralelo de palabra: ver §6.

# ══════════════════════════════════════════════════════════════════════
# 5. LA PREGUNTA DEL CONTACTO (tarea 5 del encargo)
#    «¿Dice Oviedo algo de relación, viaje, comercio, noticia o parentesco
#     entre la gente de la costa de Venezuela / Coro / las islas de los
#     Gigantes y las Antillas?»
# ══════════════════════════════════════════════════════════════════════
la_pregunta_del_contacto:
  respuesta_en_una_frase: >-
    **No.** En 1.880 páginas de los tomos II, III y IV no hay una sola línea que
    ponga en relación a los indios de la costa de Venezuela con los de las
    Antillas. Lo que sí hay —y es mucho— es la red de intercambio **dentro de
    Tierra Firme**, con los çaquitios dentro; y, corregido después de la primera
    pasada, **los nombres indígenas de las islas ABC** (§5bis) — nombres, no
    gente.

  los_ceros_verificados:   # regla 6
    "islas de los Gigantes (el NOMBRE)": >-
      0. «Gigantes» sale 39 veces en el t. II, 2 en el t. III y 1 en el t. IV, y
      **todas** son los patagones del estrecho de Magallanes (libro XX) o los
      «guyrandos» del Plata, a quienes Oviedo compara con ellos. Las islas de
      enfrente de Coro **se nombran una a una, pero nunca así** — ver §5bis.
    "Hayti / Haiti": "0 en t. II y t. III. En t. IV sólo en el glosario del editor."
    "Manaure": "**0** en los tres tomos"
    "Ampíes / Ampués / Anpies": >-
      **0** en los tres tomos. Los seis aciertos aparentes del t. II y los cinco
      del t. IV son todos `anies` = «antes», mal leído por el OCR. Comprobados
      uno a uno.
    "Baracoica / Varacoica / Baracoya": "**0** en los tres tomos"
    "la hija de Manaure, o cualquier hija de cacique llevada a La Española": "**0**"
    "indios de Venezuela en La Española": >-
      0. Lo que cruza el mar en este libro son **españoles**: Alfínger llega a
      Santo Domingo y de ahí pasa a su gobernación (p.269); los procuradores de
      Coro van a la Corte (p.297); Federmann escribe desde Jamaica (pp.309, 322);
      el obispo Bastidas pasa de Venezuela al obispado de San Juan (pp.324, 328)
      y vuelve a Santo Domingo. Ni un indígena.
    "taínos en Tierra Firme": "0"

  el_episodio_de_la_hija_de_manaure:
    lo_que_se_buscaba: >-
      Si Oviedo cuenta la embajada de Manaure a Juan de Ampíes (c. 1525) con su
      «pariente y deudo» **Baracoica**, que vivía en las islas ABC, y el rapto de
      su hija a La Española — el episodio de Arcaya 1920 pp.160-161 y 166-167.
      Sería la **segunda fuente** del único contacto costa ↔ islas ↔ Antillas
      con parentesco que el proyecto tiene documentado.
    resultado: >-
      🔴 **NO ESTÁ.** Ni el episodio, ni Manaure, ni Ampíes, ni Baracoica, ni la
      hija, ni una armada que se lleve indios de Coro a Santo Domingo. En los
      tres tomos.
    y_por_que_no_sorprende: >-
      El libro XXV arranca la historia de la provincia **en 1528**, con la
      llegada de Alfínger y los Welser: «comiença … de la venida de los alemanes
      á la Tierra-Firme y gobernaçión del golpho de Venezuela, y del primer
      gobernador» (p.269). El período de Ampíes (1521-1528), que es justamente
      el del episodio, **queda fuera del arranque del relato**. Oviedo no lo
      cuenta porque su libro empieza después.
    donde_habria_que_buscarlo: >-
      En el **libro XIX del tomo I** (Tierra-Firme, impresas 586-618), que T1
      dejó sin leer, y en Las Casas. **No es mi parcela.**

  lo_que_SI_hay_y_vale:
  - que: "comercio de los çaquitios con los pueblos palafíticos de la laguna"
    verbatim: >-
      «están muchas poblaçiones de pueblos pequeños y medianos de indios, que
      llaman onotos y guiriguiris, los quales viven dentro del agua sobre
      barbacoas é buhíos de madera altos, que debaxo dellos andan y passan
      canoas. **Viven de pesquerias, é van é vienen á la ribera desta laguna y
      rescatan é venden aquel pescado que matan, por mahiz é por otras cosas,
      con otras generaçiones de indios çaquitios é bubures.**»
    donde: "t. II, libro XXV cap. IX, impresa 300"
    verificacion: imagen
    por_que_importa: >-
      Es **la esfera hablando**, atestiguada: pescado de los palafitos a cambio
      de maíz de los çaquitios, con canoas, ida y vuelta, y entre gentes de
      lenguas distintas. Es el tipo de red que el proyecto modela, documentada
      por un cronista que nombra a los caquetíos por su nombre. Va a
      `3-mundo/` — economía y esfera de interacción—, no al lexicón.
  - que: "la red de la sal y el maíz, y un hombre comprado y vendido dentro de ella"
    verbatim_resumido: >-
      Francisco Martín, náufrago, es curado por unos indios; llegan «unas canoas
      de la laguna, **cargadas de sal, á rescatar**»; después «vinieron allí
      otros indios de la tierra adentro en canoas por un rio abaxo **á vender
      mahiz á trueco de sal**»; lo ven, «**le compraron é dieron por él un
      águila de oro**, que podía ser quince ó veynte pessos», y quien lo compró
      lo llevó dos jornadas en canoa a Maracaybo.
    donde: "t. II, libro XXV cap. VII, impresas 293-294"
    por_que_importa: >-
      Tres nasçiones distintas, dos productos (sal, maíz), moneda de oro
      labrado, transporte en canoa y **personas dentro del tráfico**, todo en
      1531 y todo entre gente de Tierra Firme. Es el mejor retrato de la red
      regional que hay en la obra.
  - que: "la sospecha de un tracto de larga distancia"
    verbatim: >-
      «tomó por demanda preguntar por la laguna donde aquella sal se haçia tan
      diferente de la que **los indios de la costa de la mar** comen, y
      sospechaba que donde aquella sal se haçia, **debia aver mucho tracto con
      la gente del mediodia ó parte del sur**»
    donde: "t. II, libro XXVI (Sancta Marta), impresa 382"
    ojo: "Es Santa Marta, no Venezuela, y es una **sospecha del gobernador**, no un dato."

  que_queda_abierto: >-
    De la **gente** de las islas ABC sigue sin haber nada aquí (§5bis). Quien la
    busque, al **libro XIX del tomo I** (Tierra-Firme, impresas 586-618), que T1
    dejó sin leer y señaló como «el libro con más costa de Venezuela». **No es
    mi parcela y no lo he tocado.**

# ══════════════════════════════════════════════════════════════════════
# 5bis. LAS ISLAS ABC SÍ ESTÁN — y mis sondas no las veían
#       t. II, libro XXI cap. VI («de la geographía é assiento de la
#       Tierra-Firme»), impresas 131-132. Todo verificado en imagen.
# ══════════════════════════════════════════════════════════════════════
las_islas_de_enfrente_de_coro:
  como_aparecio: >-
    Ampliando la clase de la ç a `[cgfz]` por un motivo distinto, saltó
    `cura[cgf]ao`. La sonda que había dado cero era mía y estaba mal hecha: el
    OCR lee `Aruba` como `Aniba`, `Boynare` como `Boijnare`/`Boynarc` y
    `Corazante` como `Corazanle`. **Tercera vez en la misma sesión que el cero
    medía mi ortografía y no la suya.**

  el_rosario_de_islas:
    verbatim: >-
      «Más al Poniente de Cubagua diez leguas la *Tortuga*; ocho ó nueve leguas
      está otra isla llamada *Yaruma*, á la qual también la llaman isla de la
      *Orchilla*, porque hay allí mucha: más al Poniente de la Orchilla está otra
      que se llama *Isla Roca*; al Poniente de la Isla Roca está la isla de
      *Páxaros* ó de *Aves*, porque en ella señaladamente crian innumerables
      aves; más al Poniente de la isla de las Aves está la isla *Boynare*; más al
      Poniente de la isla Boynare está otra que se llama *Corazante*; más al
      Poniente de Corazante está **la isla llamada *Aruba***.»
    donde: "t. II, libro XXI cap. VI, impresas 131-132"
    verificacion: imagen
    lo_que_da:
      - "**`Boynare`** = Bonaire, en cursiva, con esa grafía"
      - "**`Aruba`** = Aruba, **impresa exactamente como hoy**"
      - "`Corazante` = Curaçao en la carta de marear — pero ver abajo"
      - "`Yaruma` / `Orchilla` = la Orchila · `Isla Roca` = Los Roques · `Páxaros ó de Aves` = las Aves"

  🟢_el_pasaje_que_mas_vale:
    verbatim: >-
      «Estos nombres mudan algunos cosmógraphos modernos en algunas cartas ó las
      que ellos quieren destas islas como les plaçe, ó como tienen relaçion del
      que se los dá á entender; porque estos maestros que pintan las cartas de
      navegar, intitúlanlas como los que lo navegan se lo diçen, y cada dia mudan
      y quitan nombres á sabor de temerarios: lo qual es muy grand desatino, y
      **no guardar los nombres primeros es poner confusión en todo. Á la que la
      carta llama *Corazante* llaman los indios *Corazao***, y el almirante que
      la descubrió la dexó con su nombre: á la quel almirante llamó *Poregari*
      llaman agora *Yaruma* ó de *Orchilla*.»
    donde: "t. II, libro XXI cap. VI, impresa 132"
    verificacion: imagen
    por_que_importa: >-
      🟢 **Es una atestación explícita, de 1548 o antes, del nombre INDÍGENA de
      Curaçao** — con la fórmula que el proyecto exige («llaman los indios»), y
      además con una **defensa del topónimo indígena frente al cartográfico**
      puesta por escrito por el cronista: «no guardar los nombres primeros es
      poner confusión en todo». Es exactamente la tesis de la campaña de
      topónimos, firmada por Oviedo.
    forma_fuente: Corazao
    glosa_fuente: "el nombre que los indios dan a la isla que la carta llama Corazante"
    atribucion: "«los indios» — sin decir de qué gente ni de qué lengua"
    campo: toponimo
    en_el_lexicon: "por comprobar contra el canon de topónimos"
    ojo: >-
      ⚠️ Oviedo **no dice de qué gente son esos indios**, ni si son los de la
      isla o los de la costa. `atribucion: no-declarada` en cuanto a lengua
      (trampa del cronista). Y `Poregari` es el nombre que puso **Colón**, no un
      indígena: la frase distingue tres capas —el nombre de los indios, el del
      almirante y el de la carta— y hay que leerla entera para no confundirlas.

  y_coquibacoa_tambien_estaba:
    forma_fuente: Quiquibacoa
    verbatim: >-
      «En estas quarenta leguas de camino están el puerto de *Quiquibacoa* y la
      Caleta y un ancón que le llaman el Lago» (p.132) · «desde el cabo ó
      promontorio de Sanct Román á la punta de *Quiquibacoa* hay veynte é çinco
      leguas» (p.296)
    donde: "t. II, libro XXI cap. VI (impresa 132) y libro XXV cap. VIII (impresa 296)"
    apariciones: 3
    verificacion: ocr-limpio-dos-pasajes
    por_que_importa: >-
      La sonda `coquibacoa` daba **0** y de ahí salía otro cero falso: **la obra
      escribe `Quiquibacoa`**. Es el mismo topónimo de
      `6-fusion/lengua_toponimia_quibacoa.yaml` y el de la polity occidental de
      `curiana_polities.py`, aquí con dos localizaciones independientes y una
      distancia medida desde el cabo de San Román.

  lo_que_NO_dan_estas_dos_paginas: >-
    **Gente.** El capítulo es una derrota de costa leída sobre la carta de
    marear: nombra las islas, las millas y los cabos, y **no dice una palabra de
    quién vive en ellas**, ni de si van y vienen a la costa, ni de parentesco. El
    dato es toponímico, no etnográfico. La respuesta a la pregunta del contacto
    **no cambia**: cambia el cero sobre los NOMBRES, no el cero sobre el
    CONTACTO.

# ══════════════════════════════════════════════════════════════════════
# 5ter. EL CAPÍTULO DE LOS ARUACAS — apareció buscando otra cosa
#       t. II, libro XXIV cap. XVII, impresas 266-267.
#       No es Venezuela ni es taíno, y es lo mejor que esta parcela ha
#       encontrado para la pregunta de Miguel («¿hubo contacto?»).
# ══════════════════════════════════════════════════════════════════════
el_capitulo_de_los_aruacas:
  como_aparecio: >-
    Comprobando que `dare` del tomo II fuera el futuro castellano y no la voz
    caquetía que Oliver lista. Lo era — y la frase en que aparecía era «daré la
    resoluçión que de estos **aruacas** se tiene».
  titulo_verbatim: >-
    «CAPITULO XVII. De la notiçia que se tiene de los indios llamados *aruacas*
    en la Tierra-Firme, y dónde viven.»
  donde: "t. II, libro XXIV cap. XVII, impresas 266-267"
  donde_viven: >-
    «En la costa de la mar del Norte, entre el río Marañón y la isla de la
    Trinidad é golpho de Paria» — es decir, las Guayanas y el bajo Orinoco, **no**
    la costa de Coro.
  la_cadena_de_custodia_declarada:
    - >-
      «Dos hombres honrados, veçinos de la isla Margarita, vinieron á esta cibdad
      de Sancto Domingo de la Isla Española, llamados **Rodrigo Navarrete é Alonso
      de Rojas**, personas que meresçen crédito, é dixeron assi…»
    - >-
      y un **morisco esclavo de los Silvas** que se fue con los aruacas hacia 1532
      tras la muerte de sus amos, **estuvo doce años con ellos y «tomó muy bien la
      lengua»**, y volvió en 1544 a Margarita y Cubagua **como general de una flota
      de más de cincuenta navíos**. Los señores principales le dieron sus hijas
      por mujeres, «siete ú ocho dellas en diversas partes», y lo llevaban por
      capitán general en la guerra.

  🟢_lo_que_importa_para_la_pregunta_de_miguel:
    verbatim: >-
      «Son gente los aruacas amigables … y **contractan por los ríos arriba muchas
      leguas y con muchas y diversas nasçiones que ellos tienen por amigos, y en
      la mar assimesmo contractan en mas de tresçientas leguas de costa, con
      armadas de çinqüenta é sessenta navíos, canoas é piraguas**, con quinientos
      é ochoçientos indios de pelea, arqueros, muy bien proveydos de bastimentos
      é armas.»
    donde: "impresas 266-267"
    por_que_importa: >-
      Es un pueblo **arahuaco** de Tierra Firme con una red de intercambio
      documentada de **trescientas leguas de costa** y flotas de cincuenta a
      sesenta embarcaciones, que llega a **Margarita y Cubagua** — islas. No
      prueba contacto con las Antillas Mayores y **no es la costa de Coro**, pero
      es la demostración, en un cronista del XVI, de que **una sociedad arahuaca
      de esta costa tenía la capacidad marítima y la práctica de comerciar a esa
      escala**. Para «de que es plausible es plausible», esto es un mecanismo
      atestiguado, no una analogía.
    y_el_limite: >-
      ⚠️ **Es del s. XVI y del golfo de Paria** (regla 3 y regla 4). Ni se
      proyecta al XIV-XV ni se traslada al Golfete sin decidirlo. Y ojo a la
      trampa del nombre: `aruaca` aquí es un etnónimo que Oviedo oye a españoles
      de Margarita, no una etiqueta de filiación lingüística.

  voces_con_glosa:
  - forma_fuente: abas
    glosa_fuente: >-
      «los aruacas tienen poco oro, é no haçen tanto caso dello como de unas
      piedras que llaman ellos *abas*, que son á manera de jaspes labradas, y de
      que haçen sartales y estiman mucho»
    pagina_impresa: 267
    atribucion: "«ellos» = los aruacas, dicho por el morisco que vivió doce años con ellos"
    campo: utensilio
    verificacion: ocr-limpio
    en_el_lexicon: "no"
  - forma_fuente: "pretos ó moavis"
    glosa_fuente: >-
      los cautivos caribes esquilados a quienes «sírvense dellos en sus labores
      como de esclavos, é los truecan, é venden é contractan como tales esclavos,
      **é llámanlos pretos ó moavis**»
    pagina_impresa: 266
    atribucion: "los aruacas"
    campo: parentesco-y-poder
    verificacion: ocr-limpio
    ojo: >-
      ⚠️ `pretos` es «negros» en portugués y hay moriscos y portugueses en la
      cadena de informantes: puede ser glosa del intérprete y no voz aruaca.
      `moavis` no tiene esa sospecha. En duda, degradar.
  - forma_fuente: Aruacay
    glosa_fuente: "«aquel pueblo dicho *Aruacay*, de quien tracté en el capítulo III deste libro XXIV»"
    pagina_impresa: 266
    campo: toponimo
    verificacion: ocr-limpio
    ojo: "Oviedo mismo duda de que los aruacas vengan de ese pueblo: «después el tiempo me ha puesto en otra opinión»"

  lo_que_queda_abierto: >-
    El libro XXIV entero (impresas 213-270: Cubagua, las perlas, Paria, el
    Huyapari) **no se ha leído**. Este capítulo salió por accidente. Si el repo
    quiere la costa oriental y la relación isla ↔ Tierra Firme, ahí está sin
    tocar, y con informantes declarados.

# ══════════════════════════════════════════════════════════════════════
# 6. OVIEDO COMPARA (tarea 6 del encargo)
#    Qué paralelos ve ÉL entre Venezuela y las islas.
# ══════════════════════════════════════════════════════════════════════
oviedo_compara:
  cuantos: 3
  advertencia: >-
    Son **tres en todo el libro de Venezuela**, y ninguno es un paralelo de
    lengua. Oviedo compara cuerpos, plantas y costumbres; nunca dice «la misma
    palabra». Las sondas «como en esta isla» y «la misma palabra» dan **0** en
    los tres tomos.

  los_tres:

  - comparacion: el cuerpo
    verbatim: >-
      «Estos indios é indias son de la color y estatura **de los destas islas**,
      y de la manera que en otras partes lo memoran estas historias; é nunca se
      cortan el cabello ni las uñas de las manos ni de los pies.»
    donde: "t. II, libro XXV cap. XXII, impresa 329"
    que_dice: >-
      Los indios de Venezuela son físicamente como los antillanos. Es una
      comparación de **tipo físico**, dicha por un hombre que llevaba treinta
      años en Santo Domingo.
    que_NO_dice: "nada de lengua, nada de origen, nada de parentesco"

  - comparacion: el tabaco
    verbatim: >-
      «es rescate muy estimado entre los indios. **Y en esta nuestra Isla
      Española hay mucha** en los heredamientos; y los negros, de que nos
      servimos, la preçian mucho para este efeto»
    donde: "t. II, libro XXV cap. IX, impresa 298"
    que_dice: >-
      Misma planta, mismo uso a las dos orillas — y la palabra `tabaco` la usa
      sin marcarla, porque para 1548 ya es castellana.

  - comparacion: el funeral
    verbatim: >-
      «de manera que **paresçe que todos quieren ser su sepoltura**, para que no
      piensse Artemisia que hizo mucho en tragarse las maritales çeniças, como
      diçe Johan de Mena, porque **en esta Tierra-Firme, de que tractamos,
      muchos las tragan**, segund se ha dicho de suso, y como en otros lugares y
      provinçias de la Tierra-Firme se acostumbra»
    donde: "t. II, libro XXV cap. IX, impresas 297-298"
    que_dice: >-
      Oviedo ve el endocanibalismo de los huesos como **rasgo de Tierra Firme**,
      no de las islas, y lo compara con un clásico europeo (Artemisia, vía Juan
      de Mena) en vez de con La Española. **Es una comparación que separa, no
      que une** — y es la que más pesa para la pregunta del contacto.
    para_el_canon: >-
      `creencia-010` dice «El caquetío es, atestiguadamente, endocanibalismo de
      los huesos, no entierro», y la fuente lo sostiene **y añade** que Oviedo lo
      tiene por costumbre extendida en Tierra Firme, no por rasgo propio.

# ══════════════════════════════════════════════════════════════════════
# 7. VEREDICTO POR ENTRADA DEL CORPUS
# ══════════════════════════════════════════════════════════════════════
veredicto_por_entrada:

- id: creencia-001
  decia: >-
    «"Boratio" (también borattio) es la palabra caquetía atestiguada para el
    médico-hechicero» · referencia: «Oviedo y Valdés, Historia general, apéndice
    t. IV (en Jahn 1927:213 n.29); Arcaya 1920:116»
  medido:
    - "la forma es `boratio`, una t (18 apariciones, imagen)"
    - "**el apéndice del t. IV existe** y la referencia se puede fijar: impresa 595"
    - >-
      pero el dato de primera mano está en el **cuerpo del t. II, pp.298-299**, y
      allí Oviedo dice «los indios de Veneçuela», no «los çaquetíos». La
      atribución étnica es del editor (t. IV p.595)
    - "`piache` no compite: el editor lo da de Paraguay y Huyapari, y no sale ni una vez en el libro XXV"
  propuesta: >-
    Cambiar la referencia a **Oviedo y Valdés t. II pp.298-299 (cuerpo) + t. IV
    p.595 (glosario del editor)**, quitar la variante `borattio` o marcarla como
    grafía de Jahn, y decir en el propio hecho que la atribución caquetía es
    editorial. La etiqueta `atestiguado` **se sostiene** para la voz y para el
    oficio: lo que no se sostiene es la finura étnica.
  y_lo_que_se_gana: >-
    la descripción completa del rito de cura (p.299), que el corpus no tiene:
    el ayuno impuesto a toda la casa, el «Allá yrás mal», el chupar, la espina
    escondida, los cinco o seis días, y la retirada del boratio cuando el
    enfermo no mejora («porque el diablo me lo ha dicho assi»).

- id: creencia-001b
  decia: "el díao es el cacique principal **que es a la vez boratio**; referencia «Oviedo t. II p.299; Arcaya…»"
  medido: >-
    La página es correcta. **La ecuación díao = boratio no está en Oviedo.** Él
    define el díao sólo por su posición: «el señor prinçipal, que tiene muchos
    indios y le son subjetos otros caçiques». Y la atribución es «**en algunas
    partes** desta gobernaçión de Veneçuela», más ancha que «los caquetíos de
    Coro».
  propuesta: >-
    Partir el hecho: lo político cita Oviedo t. II p.299; lo religioso cita
    Arcaya y baja de capa. Ver §2 `diao`.

- id: creencia-010
  decia: "el funeral del cacique común; referencia «Oviedo t. II p.299-300»"
  medido: >-
    ✅ El hecho es **exacto**, frase por frase, y la fuente lo atribuye
    **explícitamente a los çaquitios**, que es más de lo que el corpus reclama.
    🔴 Pero la página es la **297**, no la 299-300.
  propuesta: "corregir la página a t. II p.297 y añadir la atribución a los çaquitios."

- id: creencia-010b
  decia: "el funeral del díao, primer tiempo; referencia «Oviedo t. II p.300»"
  medido: >-
    ✅ Correcto y verificado: la hamaca sobre brasas, «no le queda sino el cuero
    y los huessos», la hamaca nueva «como si estuviesse un hombre echado
    durmiendo», la casa que nadie vuelve a habitar, el hijo y subçessor que le
    renueva la hamaca. Empieza al pie de la **299** y ocupa la 300.
  propuesta: "ampliar la referencia a pp.299-300."
  y_lo_que_falta_en_el_corpus: >-
    el cierre del rito, que el corpus no recoge: «É haçen á su semejança una
    figura de madera de relieve y pequeña, y el dia que muere el diao, pónenla
    debaxo de la hamaca … hasta que le queman, como es dicho, y **queman allí
    también esta imágen suya de palo**» (p.300). Una efigie del muerto que arde
    con él.

- id: creencia-010c
  decia: "segundo tiempo: el llamamiento general y beber los huesos; «Oviedo t. II p.300»"
  medido: >-
    ✅ Correcto y verbatim, incluida `busera`. Un matiz: el corpus dice
    «pintados de bija y jagua (busera)» y la fuente dice «pintados de bixa y de
    **xagua**, que allí llaman **busera**» — o sea `busera` es el nombre de la
    xagua, no de las dos. El corpus lo tenía bien; el **glosario del editor** lo
    tiene mal.
  propuesta: "sin cambio. Añadir la cita verbatim y la página."

- id: creencia-004b
  decia: "ayuno ritual antes de la guerra; «Oviedo t. II p.329»"
  medido: >-
    ✅ **Correcto**, página incluida, y con una precisión que el corpus ya
    recoge bien («el jefe de la familia y todos los suyos, menos los niños»).
    Y trae su testigo declarado: el capítulo entero es lo que el **obispo don
    Rodrigo de Bastidas** le contó a Oviedo «á voce viva», corroborado por el
    tesorero Acuña, el contador Naveros, Pedro de Salvatierra y el capitán Pedro
    de Limpias.
  propuesta: >-
    sin cambio en el contenido. **Añadir el testigo**: es una cadena de custodia
    declarada, que es más de lo que tienen casi todos los hechos del corpus.
  ojo: >-
    ⚠️ El ayuno de la p.329 se hace «antes de … coger el fruto» y «de mucha
    importançia» en general — el capítulo no lo ata a la guerra tan
    estrechamente como el corpus. Y el ayuno del **boratio** (p.299) es otro:
    ése lo impone el curandero a la casa del enfermo. **Son dos ayunos
    distintos** y conviene no fundirlos.

- id: "ficha `datihao` del lexicón"
  decia: "`caquetío-atestiguado`"
  medido: "ver §4 — la atestación es taína; el apoyo venezolano es editorial"
  propuesta: "opción (a): `taíno-atestiguado` con nota. Decide Miguel."

- id: "ficha `tara` del lexicón"
  decia: "'venado, ciervo'"
  medido: "Oviedo t. II p.331: **langosta**, descrita como plaga y como comida"
  propuesta: "glosa a 'langosta'. Cuarta fuente, primera de primera mano."

- id: "ficha `macato` del lexicón"
  decia: "'bebida'"
  medido: "t. II p.297: «çierto brevaje … muy espesso como maçamorra ó puches … algo açedo»"
  propuesta: "sin cambio. El aviso de `jahn-1927.md` se cierra: la fuente dice las dos cosas."

# ══════════════════════════════════════════════════════════════════════
# 8. LO QUE ESTA PARCELA **NO** APORTA A LA PREGUNTA DEL TAÍNO
# ══════════════════════════════════════════════════════════════════════
para_la_campaña_del_taino:
  en_una_frase: >-
    Los tomos II-IV de Oviedo **restan** en vez de sumar: quitan una de las dos
    orillas de `datihao`, que era el apoyo léxico más citado del contacto
    taíno-caquetío, y no ponen nada en su lugar.
  lo_que_queda_del_apoyo_lexico:
    - >-
      `diao` sigue siendo caquetío (venezolano) atestiguado, y su parecido con
      el taíno es asunto de Oliver, no de Oviedo.
    - >-
      `boratio`, `caça`, `maçato`, `busera`, `tara`, `icoraotas`, `amana`,
      `comoho`, `çemyrucos`, `datos`, `mene`, `hayo`, `baperon`: **ninguna** de
      las doce/trece voces venezolanas de Oviedo tiene gemela taína en su propia
      obra. Él no dice de ninguna que también se diga en las islas.
    - >-
      Y al revés: de las 89 formas que T1 sacó del tomo I, **ninguna** reaparece
      atribuida a Venezuela en los tomos II-IV.
  lo_que_esto_significa: >-
    La evidencia de contacto precolombino **no va a salir de Oviedo**. Oviedo es
    un buen testigo de dos vocabularios que no se tocan. Quien quiera contacto
    tiene que ir a la arqueología (Antczak, Rouse-Cruxent, Schroeder,
    Fernandes), a la genética o al libro XIX del tomo I. Decirlo ahorra noches
    (skill §6).
  y_una_cosa_que_sí_suma: >-
    El paralelo de **conducta** sin paralelo de palabra: el funeral de los
    çaquitios (canto nocturno que recita las hazañas del muerto, cremación,
    huesos molidos, bebida ritual) y el `areyto` antillano «ya en los funerales»
    hacen lo mismo con nombres distintos. Eso es materia de esfera cultural, no
    de préstamo léxico, y es más honesto que forzar una etimología.

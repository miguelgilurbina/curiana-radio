meta:
  fecha: '2026-09-19'
  generado_por: 6-fusion/scripts/medir_pares_atestiguado_reconstruido.py
  elenco: era2
  perfil_de_exposicion: era2
  motivo: >-
    Miguel, 2026-09-18, de oído: «¿por qué es kali si sol es kazi?». El
    lexicón tiene dos palabras vivas para 'sol' y el elenco dice la
    reconstruida 24 a 1.
criterio_de_glosa:
  normalizacion: >-
    NFC + minúsculas; fuera lo que va entre paréntesis y corchetes;
    fuera los diacríticos (á→a, ü→u, ñ→n); fuera el artículo inicial y
    la puntuación de los extremos; espacios colapsados. NO se aplica
    ningún diccionario de sinónimos: decidir que dos glosas distintas
    significan lo mismo es una afirmación sobre el significado y la
    decide Miguel (regla 2).
  estricto: glosa normalizada COMPLETA idéntica
  laxo: >-
    estricto, o las dos glosas comparten un sinónimo de los que ellas
    mismas separan con coma o punto y coma («cerro, sitio alto» y
    «cerro»). Incluye el caso «primer sinónimo igual». Es el número
    que sirve para decidir.
  contencion: >-
    EXPLORATORIO Y RUIDOSO, listado aparte: una glosa normalizada
    entera cae dentro de la otra como secuencia de palabras. Casi todo
    lo que añade es un modificador compartido —«grande» dentro de «ave
    rapaz grande»—, no un par de palabras rivales. No se cuenta en el
    número laxo y no entra en la cola de decisión.
  familia_de_compuestos: >-
    La raíz la decide el MOTOR, no un regex de este script:
    `_candidatos_motor()` reproduce la construcción de candidatos de
    `curiana_lexicon._familia_de_token()` con sus propias tablas de
    afijos, y el control lo verifica token a token contra el motor.
    Un token es de la familia si ES la raíz, si la lleva como elemento
    separado por guion, o si la raíz es candidato tras deshacer
    prefijos y sufijos. Residuo declarado: las formas aglutinadas sin
    guion no entran (`kali-kasibana` es de `kali`, no de `kasi`).
  variante_ortografica: >-
    Esqueleto fonémico IDÉNTICO (`curiana_fonotactica.fonemizar`, con
    y sin la regla abierta gu→w, comparando también `forma_fuente`).
    Una sola edición NO basta: `kasi`/`kali` difieren en un carácter y
    son dos palabras.

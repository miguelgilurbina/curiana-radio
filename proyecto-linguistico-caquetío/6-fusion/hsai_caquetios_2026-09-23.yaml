  - id: hda-21
    tema: "el jefe principal con poder religioso; templos; sol y luna"
    pagina_impresa: 474
    cita: >-
      «The head chief of the Caquetio had great religious power, being capable
      of increasing the fertility of crops and of controlling natural
      phenomena. There were community temples (adoratorios), but each family
      also had its own idols. The principal gods were the sun and moon, to
      whom the shamans (boratios), acting in the capacity of priests, made
      offerings or sacrifices.»
    cita_el_autor: null
    fuente_real: >-
      Tres fuentes cosidas. El poder del jefe: Ampíes y Aguado (hda-13).
      Boratios como sacerdotes, uno «en cada pueblo pringipal»: Oviedo t. II
      p. 298. ❌ El SOL Y LA LUNA: la Relación de Nueva Segovia (Barquisimeto,
      1579) lo dice de los AXAGUAS, no de los caquetíos — Arcaya 1920 p. 102,
      citándola: «se agrega respecto a los Axaguas: "Esta generación adora al
      sol y a la luna…"». Y Arcaya concluye (p. 102) que no les rendía culto
      «toda la tribu, sino que los invocaban individuos especialmente
      dedicados», lo contrario de los «community temples».
    en_repo: {oviedo-y-valdes-1852-1855: true, arcaya-1920: true}
    vault: "CULTURA_CAQUETIA §1: el Sol (kali) y la Luna (kasha) ordenan el tiempo, marcado [reconstruido] — no lo sostiene esta vía"
    polity: "sol y luna: AXAGUAS de Nueva Segovia; boratios: gobernación de Coro"
    epoca: "contacto / colonial (1579)"
    nuevo: false
    etiqueta_maxima: "sol y luna como dioses caquetíos: NO por el Handbook (es axagua)"


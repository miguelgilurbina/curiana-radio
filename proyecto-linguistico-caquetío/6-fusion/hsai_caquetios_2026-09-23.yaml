# ══════════════════════════════════════════════════════════════════════
# HSAI 4 (1948) y 5 (1949) — QUÉ DICE EL *HANDBOOK* DE LOS CAQUETÍOS Y DE
# DÓNDE LO SACA. Tercera campaña de minería, parcela «steward-hsai»,
# 2026-09-23.
#
# PROPUESTA (regla 5). Nada de aquí entra al canon sin que Miguel lo fusione.
#
# El Handbook es SÍNTESIS de 1948-1949 sobre crónicas del XVI y la
# arqueología de su tiempo. Nada de aquí sube a `atestiguado` por el Handbook
# (regla 2): el valor está en saber de qué crónica sale cada lugar común y
# en lo POCO que el Handbook trae y las fuentes primarias del repo no.
#
# Cómo leer cada afirmación:
#   cita              lo que dice el Handbook, verbatim y recortado (dominio
#                     público: publicación del gobierno federal de EE. UU.)
#   cita_el_autor     la fuente que el autor del capítulo pone, tal cual
#   fuente_real       de dónde sale DE VERDAD, comprobado en el repo cuando se
#                     pudo (página impresa y cita de la primaria)
#   en_repo           si esa primaria está en 4-fuentes/bibliografia.yaml
#   vault             si el vault ya lo tenía y de dónde
#   polity / epoca    regla 4 y regla 3
#   nuevo             si es lo único que el Handbook trae y el repo no
#   etiqueta_maxima   el techo que le permite su procedencia (regla 2)
# ══════════════════════════════════════════════════════════════════════
meta:
  parcela: "steward-hsai — HSAI vol. 4 (Circum-Caribbean Tribes) y vol. 5 (extracto pp. 655-772)"
  fecha: 2026-09-23
  campana: "Tercera campaña de minería (minería 3)"
  encargo: 6-fusion/issues-pendientes/encargo-mineria-steward-hsai.md
  obras:
    # claves foráneas → 4-fuentes/bibliografia.yaml (regla 8)
    - steward-1948-hsai-4
    - steward-1949
  obras_primarias_cotejadas:
    # lo que se abrió para comprobar de dónde sale cada afirmación
    - {obra: oviedo-y-valdes-1852-1855, que: "t. II, Libro XXV, caps. IX (pp. 297-300) y XXII (pp. 328-329)"}
    - {obra: oviedo-y-banos, que: "cap. III, pp. 26-28 (Biblioteca Ayacucho)"}
    - {obra: castellanos-elegias, que: "Parte II, introducción y Elegía I (texto plano del repo, líneas 48220-48450 y 52060-52540)"}
    - {obra: perez-de-tolosa-1546, que: "relación de 1546, pp. 226-234 del t. II de Oviedo y Baños 1885"}
    - {obra: federmann-1916, que: "pp. 89-92 (los guaycaríes)"}
    - {obra: arcaya-1920, que: "pp. 101-102 (Relación de Nueva Segovia 1579, citada) y 112-118 (Manaure, díao)"}
    - {obra: "(sin clave) carta de Juan de Ampíes", que: "en Oviedo y Baños 1885, t. II (Documentos), p. 212 — el mismo PDF que perez-de-tolosa-1546"}
  desfase_pdf_impresa:
    vol4: >-
      DERIVA por las láminas; se leyó el número impreso de cada página.
      Medido: pdf 20 = p. xvi (prefacio); pdf 45 = p. 21 (resumen de
      Steward); pdf 463 = p. 353; pdf 509 = p. 385; pdf 556 = p. 426; pdf 568
      = p. 434; pdf 571 = p. 437; pdf 598 = p. 464; pdf 600 = p. 466; pdf 605
      = p. 469 … pdf 610 = p. 474; pdf 611 = p. 475.
    vol5: "extracto: impresa = pdf + 644 (pp. 655-772); = pdf + 654 (bibliografía)"
  extractor: >-
    pdftotext -enc UTF-8 por página (-f/-l) sobre el PDF, y pymupdf para
    localizar páginas. El .txt de fuentes_caquetios/ es OCR de archive.org
    pasado por pdftotext: sirve para contar, no para citar sin mirar la
    página.
  sondas_de_ortografia_vol4: >-
    En el PDF (pymupdf, página a página): caquet|caiquet|caguet salen en 15
    páginas (pdf 20, 45, 463, 464, 473, 509, 598, 600, 605-610, 735). El OCR
    escribe una vez «Caguetio» (p. 474) y «Jivajara» por Jirajara (pp. 469,
    472): se añadieron a las sondas. En el .txt: `Caquet` 38, `caiquet` 2,
    `Paraguan` 7, `Manaur` 2, `Jirajar` 22, `Curiana` 8 (sin leer), `Aruba` 4.

# ══════════════════════════════════════════════════════════════════════
# §1. HERNÁNDEZ DE ALBA, «THE TRIBES OF NORTHWESTERN VENEZUELA»
#     HSAI 4, pp. 469-474 (pdf 605-610)
# ══════════════════════════════════════════════════════════════════════
hernandez_de_alba_noroeste:
  capitulo: "The tribes of northwestern Venezuela"
  autor: "Gregorio Hernández de Alba"
  paginas: "469-474 (pdf 605-610)"
  obra: steward-1948-hsai-4

  aviso_del_propio_handbook:
    # Lo primero que hay que saber del capítulo, y lo dice el editor
    - pagina_impresa: xvi
      pdf: 20
      autor: Steward (prefacio)
      cita: >-
        «Hernandez de Alba's articles are not exhaustive studies; they are
        merely preliminary essays hurriedly written to fill in gaps in the
        Handbook coverage»
    - pagina_impresa: 475
      pdf: 611
      autor: "el editor, nota al pie del capítulo siguiente (north central Venezuela)"
      cita: >-
        «Time permitted neither the coordination of cultural data and tribal
        locations with Kirchhoff's material dealing with closely related
        tribes nor inclusion of the modern ethnology.»
    - lectura: >-
        El capítulo de los caquetíos es un ensayo de urgencia, escrito en las
        últimas semanas antes de imprenta, y su sistema de citas es desigual:
        de las 28 afirmaciones de esta lista, 16 no citan nada (medido sobre
        este YAML: `afirmaciones[].cita_el_autor == null`).
        Casi todo lo que no cita sale de Oviedo y Valdés t. II, Libro XXV,
        cap. IX, que el vault ya lee directo. Lo que sí cita a veces no dice
        lo que se le atribuye (ver `lo_que_resulto_falso` en §0).

  afirmaciones:

  - id: hda-01
    tema: territorio
    pagina_impresa: 469
    cita: >-
      «The Caquetio, northern neighbors of the Jirajara, must have occupied the
      Atlantic Coast, especially the Peninsula of Paraguana and the Islands of
      Aruba, Curacao, and Bonaire. On the west they were bounded by the Coculza
      River, on the south by the Tocuyo and Baragua Rivers, and on the east by
      the Gueque River (Salas, 1920).»
    cita_el_autor: "Salas 1920 (Etnografía americana. Los indios caribes)"
    fuente_real: >-
      Salas 1920, síntesis moderna; no da fuente primaria en la cita. Los
      linderos coinciden con la definición del territorio que usa Arcaya 1920
      (introducción, pdf 16: los límites del Estado Falcón por el río Cocuicita y las cabeceras del Baragua), que es la del
      Estado Falcón moderno.
    en_repo: {salas-1920: false, arcaya-1920: true}
    vault: "el vault ya tiene Paraguaná + ABC por fuentes primarias (Pérez de Tolosa, Castellanos, Ampíes); los linderos fluviales no"
    polity: "costera + frontera interior (Tocuyo, Baragua)"
    epoca: "no declarada (síntesis de 1920)"
    nuevo: "los linderos fluviales como frontera caquetía — pero son los de Falcón, y huelen a proyección de la división política moderna (regla 4, reverso: la esfera no es una comarca)"
    etiqueta_maxima: hipotetico

  - id: hda-02
    tema: "territorio de los llanos; etnónimo en boca achagua"
    pagina_impresa: 469
    cita: >-
      «Pericot Garcia (1936) … assigns the Jirajara not only the islands
      previously mentioned but also the Venezuelan coast from Lake Maracaibo to
      the Yaracuy River and the inland territory south to the Ele River, where
      the Achagua call them the Tamud.»
    cita_el_autor: "Pericot García 1936 (América indígena)"
    fuente_real: >-
      ⚠️ Errata del propio capítulo: «Jirajara» por Caquetío (el sujeto de la
      frase anterior; nadie asigna las ABC a los jirajaras). El «Tamud» es el
      *tamude* que el vault ya tiene por Jahn 1927 p. 213 y Rivero; Pericot es
      un intermediario más de la misma cadena (minar-fuente §8: dos obras que
      se copian son UNA atestación).
    en_repo: {pericot-1936: false, jahn-1927: true, rivero-1883: true}
    vault: "3-mundo/corpus/parentesco.yaml (tamude, Jahn 1927:213 y Rivero) y ensayos/01_familia_caquetia.md"
    polity: llanos
    epoca: colonial (misiones de los llanos)
    nuevo: false
    etiqueta_maxima: "la que ya tiene en el corpus (el Handbook no añade atestación)"

  - id: hda-03
    tema: lengua
    pagina_impresa: 469
    cita: >-
      «the Jirajara and Caquetio speak an Arawakan language (Oramas, 1916).»
    cita_el_autor: "Oramas 1916, «Materiales para el estudio de los dialectos Ayamán, Gayón, Jirajara, Ajagua» (así en la bibliografía del vol. 4, pdf 751)"
    fuente_real: >-
      ❌ Doble error. (1) Oramas 1916 trata del ayamán, gayón, jirajara y
      ajagua —la familia jirajarana—, no del caquetío: no puede sostener la
      filiación caquetía. (2) El jirajara NO es arahuaco; es la familia
      jirajarana, como el propio título de Oramas agrupa. La filiación
      arahuaca del caquetío descansa en otras pruebas (Oliver, Zavala), no en
      esta cita.
    en_repo: {oramas-1916: false}
    vault: "la filiación arahuaca está en 2-lengua/ por otras vías; el jirajara ya se trata como vecino de otra familia"
    polity: general
    epoca: "no aplica"
    nuevo: false
    etiqueta_maxima: "no usar como apoyo de nada"

  - id: hda-04
    tema: "historia del contacto"
    pagina_impresa: 469-470
    cita: >-
      «The Caquetio, on the other hand, were more pacific, and they fled from
      the conquistadors to take refuge in the jungles of the interior in the
      region of the Ele River.»
    cita_el_autor: null
    fuente_real: >-
      Sin cita. Probablemente la misma línea de Pericot (hda-02). Mezcla las
      dos polities: la costera «amiga de los españoles» (Pérez de Tolosa 1546,
      p. 227: «muy amigos de los españoles»; Oviedo y Baños p. 27: la nación
      caiquetía que «jamás faltaron … al cumplimiento de la fe») y los
      caquetíos de los llanos (el Ele es afluente del Casanare). Que los de
      Coro «huyeran» al Ele no está en ninguna primaria del repo; lo que dice
      Pérez de Tolosa (p. 227) es que los de la costa «se andan por los
      montes» por huir de los malos tratos.
    en_repo: {perez-de-tolosa-1546: true, oviedo-y-banos: true}
    vault: "no"
    polity: "mezcla costa y llanos (regla 4)"
    epoca: contacto
    nuevo: "la migración al Ele como explicación de los caquetíos de los llanos — sin fuente; no usar"
    etiqueta_maxima: hipotetico

  - id: hda-05
    tema: subsistencia
    pagina_impresa: 470
    cita: >-
      «the Caquetio and Jirajara being the most intensive farmers. The Indians
      near Barquisimeto had an irrigation system … The Caquetio and Jirajara
      also ate cactus fruits or "datos" and tender cocuy leaves (Agave cocui).
      They prepared maize in various ways, including a boiled soup, called
      "caza," which was seasoned with aji … deer, tapirs, and other game,
      killed with the bow and arrow or surrounded with fire»
    cita_el_autor: null
    fuente_real: >-
      Sin cita en todo el párrafo. El riego de Barquisimeto es la Relación de
      Nueva Segovia 1579 (el vault lo tiene de segunda mano, ficha
      nueva-segovia-1579). La «caza» es la `caça` de Oviedo t. II p. 299
      («maçamorra rala de mahiz que ellos llaman caça»), que el vault ya tiene
      (taino2, y Oliver apéndice A #19): Oviedo la da como la comida de AYUNO
      de la casa del enfermo, no como sopa sazonada con ají — el ají es
      añadido de Hernández de Alba. Datos y cocuy: sin fuente localizable en
      el repo; el cocuy es planta de la sierra de Lara-Falcón.
    en_repo: {oviedo-y-valdes-1852-1855: true, nueva-segovia-1579: "no-disponible"}
    vault: "caça y el riego de Barquisimeto, sí; «datos» y cocuy como comida caquetía, no por esta vía"
    polity: "interior (Barquisimeto) mezclado con genérico"
    epoca: "colonial temprano (1546-1579)"
    nuevo: "«datos» (fruta de cactus) y cocuy tierno como comida — sin fuente citada; pista para buscar en la Relación de Nueva Segovia si aparece"
    etiqueta_maxima: hipotetico

  - id: hda-06
    tema: "casas: pares o cuartetos junto a las labranzas; casa del piache"
    pagina_impresa: 471
    cita: >-
      «The Jirajara and Caquetio grouped their houses in two's or four's,
      preferably by their cultivated fields, in order to protect them against
      dangerous animals (Descripción de la Ciudad . . . , 1579). The houses were
      rectangular huts of poles, vines, and grass, and there was a separate
      house for the shaman (piache) (Antolinez, 1943).»
    cita_el_autor: "Descripción de la Ciudad de Nueva Segovia … 2 de enero de 1579; Antolínez 1943, «Aporte etnográfico de la Relación Geográfica de Nueva Segovia, 1579», Acta Americana vol. 1 n.º 4"
    fuente_real: >-
      Relación de Nueva Segovia 1579 = BARQUISIMETO. La casa aparte del piache
      la confirma Arcaya 1920 p. 101, que cita la misma Relación: los médicos
      hechiceros «tenían chozas de paja que sólo les servían para invocar allí
      al demonio».
    en_repo: {nueva-segovia-1579: "no-disponible (ficha sin PDF)", antolinez-1943: false, arcaya-1920: true}
    vault: "creencia-004 (ayuno y cabello largo del piache) sale de la misma Relación vía Arcaya p. 101; las casas en pares o cuartetos, no"
    polity: "INTERIOR — Nueva Segovia / Barquisimeto (regla 4)"
    epoca: "colonial (1579)"
    nuevo: "casas agrupadas de dos en dos o de cuatro en cuatro junto a las labranzas — dato de Barquisimeto que el vault no tiene; NO es de la costa"
    etiqueta_maxima: "atestiguado de segunda mano PARA BARQUISIMETO; nada para la costa"

  - id: hda-07
    tema: "casas pobres y hamacas (Pérez de Tolosa)"
    pagina_impresa: 471
    cita: >-
      «A letter written in 1546 by the Licenciado Juan Pérez de Tolosa to the
      King of Spain states that the Caquetio built poor houses and slept in
      hammocks.»
    cita_el_autor: "Pérez de Tolosa 1546"
    fuente_real: >-
      ❌ No dice eso. Leído en el repo (Oviedo y Baños 1885, t. II): de la
      costa de Coro, «tenían medianos pueblos y mucha caza y pesca y ropa de
      hamacas; es gente muy pulida y limpia» (p. 227). Lo de «pobres» es de
      OTROS caquetíos y habla de ORO, no de casas: Barquisimeto, «los indios
      son pobres, que es miseria el oro que tratan» (p. 233); los llanos, «esta
      nación de Caquetíos es gente pobre y miserable» (p. 234). Y la hamaca es
      «ropa de hamacas», es decir, textil de intercambio, no el dato de que
      durmieran en ella.
    en_repo: {perez-de-tolosa-1546: true}
    vault: "Pérez de Tolosa se está minando en esta misma campaña (otro agente); p. 234 ya circula («algo difieren en la habla á los de Coro»)"
    polity: "el capítulo funde tres polities (costa p. 227, Barquisimeto p. 233, llanos p. 234) en una frase"
    epoca: "contacto (1546)"
    nuevo: false
    etiqueta_maxima: "no usar la paráfrasis; usar Pérez de Tolosa directo"

  - id: hda-08
    tema: vestido
    pagina_impresa: 471
    cita: >-
      «Caquetio men wore calabash penis covers, and women wore genital covers
      that were evidently woven ("de manta").»
    cita_el_autor: null
    fuente_real: >-
      Oviedo t. II p. 329 (cap. XXII, informe del obispo Bastidas): «los que
      son varones traen el miembro viril metido en un calabaçito» y las
      mujeres «unas bragas, que es una mantilleja ó trapo de algodón». Oviedo
      lo dice de los indios de la gobernación en general, no de los
      caquetíos; quien lo extiende a ellos es Arcaya 1920 p. 118 («todos los
      indios, inclusive los Caquetíos»).
    en_repo: {oviedo-y-valdes-1852-1855: true, arcaya-1920: true}
    vault: "no como hecho del corpus"
    polity: "genérico de la gobernación de Venezuela (Coro como centro del informe)"
    epoca: "contacto (c. 1535-1540)"
    nuevo: false
    etiqueta_maxima: "atestiguado para la gobernación por Oviedo; para los caquetíos, sólo por extensión"

  - id: hda-09
    tema: "adorno: perlas, orejeras, diademas; bija y jagua"
    pagina_impresa: 471
    cita: >-
      «diadems for chiefs and nobles, gold earrings, and, especially among the
      Caquetio of the maritime region of Paraguana, pearl bracelets.» ·
      «a pigment called "onoto" and … a fruit called "jagua" or "buxera"
      (Genipa). The paint was mixed with a resin (Castellanos, 1852).»
    cita_el_autor: "Castellanos 1852 (sólo para la pintura)"
    fuente_real: >-
      Perlas y orejeras: Oviedo y Baños cap. III p. 27 — los «cien indios
      nobles … con penachos de vistosas plumas, brazaletes de perlas y
      orejeras de oro» que acompañan a Manaure en Coro en 1527. «De
      Paraguaná» es añadido del capítulo. «Buxera» es la `busera` de Oviedo
      t. II p. 300 («bixa y de xagua, que allí llaman busera»), que el vault ya
      tiene (creencia-010c).
    en_repo: {oviedo-y-banos: true, oviedo-y-valdes-1852-1855: true, castellanos-elegias: true}
    vault: "busera sí; brazaletes de perlas del séquito de Manaure, sí vía Oviedo y Baños"
    polity: costera (Coro)
    epoca: "contacto (1527), contado en 1723"
    nuevo: false
    etiqueta_maxima: "la de Oviedo y Baños, que es crónica del XVIII"

  - id: hda-10
    tema: "navegación y canoas"
    pagina_impresa: 471-472
    cita: >-
      «These Indians were excellent navigators of the coast and lake,
      traveling and carrying their goods in dugout canoes that could
      accommodate three or four persons. After the Conquest they became
      handlers of cargo … from the coast to Barquisimeto and Nueva Segovia.»
    cita_el_autor: null
    fuente_real: "sin cita; «these Indians» son las tres naciones del capítulo, quiriquires de la laguna incluidos. No localizado en las primarias del repo cotejadas."
    en_repo: null
    vault: "no"
    polity: "genérico (laguna + costa)"
    epoca: "no declarada; el porteo es colonial"
    nuevo: "canoas de tres o cuatro personas — sin fuente; no usar para la costa caquetía sin localizarla"
    etiqueta_maxima: hipotetico

  - id: hda-11
    tema: sal
    pagina_impresa: 472
    cita: >-
      «Salt was prepared in the Caquetio region, possibly by the evaporation of
      tidal water confined in the low portions of the beaches.»
    cita_el_autor: null
    fuente_real: >-
      El método es conjetura del autor («possibly»). La sal junto a Coro sí es
      primaria: Pérez de Tolosa p. 227, «una legua de la ciudad de Coro hay
      unas salinas de mucha cantidad de sal»; Oviedo y Baños p. 28,
      «abundantes salinas» (ya del XVIII).
    en_repo: {perez-de-tolosa-1546: true, oviedo-y-banos: true}
    vault: "la sal como mercancía caquetía está en CULTURA_CAQUETIA y ecologia"
    polity: costera
    epoca: "contacto (1546)"
    nuevo: false
    etiqueta_maxima: "hipotetico para el método de evaporación"

  - id: hda-12
    tema: "Manaure, señor de Paraguaná, en hamaca; los «diaos» como jefes menores"
    pagina_impresa: 472
    cita: >-
      «The Caquetio were likewise divided into various lesser "chieftaincies"
      but had a general chief, the Señor de Paraguana, named Manaure (Oviedo y
      Baños, 1824, 1935), who was ceremoniously carried in a hammock which was
      decorated by the lesser chiefs or "diaos."»
    cita_el_autor: "Oviedo y Baños 1824, 1935"
    fuente_real: >-
      Oviedo y Baños p. 27 (leído en el repo): Manaure es «señor de toda
      aquella provincia» —la de Coriana, no «de Paraguaná»— y viene «en una
      hamaca, tejida de curiosas labores, en que venía (cargado en hombros de
      caciques)». Nada de «diaos». ❌ Y el capítulo INVIERTE el término: en
      Oviedo y Valdés t. II p. 299 el díao es el de ARRIBA —«el señor
      principal, que tiene muchos indios y le son subjetos otros caciques,
      llámanle diao»—, no los jefes menores que llevan la hamaca. Ampíes
      (carta, Oviedo y Baños 1885 t. II p. 212) sitúa además al «Naure ó
      Anaure» «diez leguas la tierra adentro en la provincia de Coro».
    en_repo: {oviedo-y-banos: true, oviedo-y-valdes-1852-1855: true, "carta de Ampíes": "sí, sin clave propia (PDF de perez-de-tolosa-1546)"}
    vault: "diao 'señor principal' ya en cognados.yaml (Oliver cap. 2) y en creencia-001b (Oviedo t. II p. 299); Castellanos pp. 185-186 (Manaure «sobre caciques tuvo mando», en andas) ya circula en esta campaña"
    polity: costera (Coro)
    epoca: contacto (1527)
    nuevo: false
    etiqueta_maxima: "no usar la paráfrasis: «diaos = jefes menores» contradice la fuente"

  - id: hda-13
    tema: "el jefe controla la naturaleza y la fertilidad"
    pagina_impresa: 472
    cita: >-
      «He was attributed divine or magical power to control nature and to make
      the crops fertile.»
    cita_el_autor: "la misma cita de Oviedo y Baños (1824, 1935) de la frase anterior"
    fuente_real: >-
      Oviedo y Baños no lo dice (cap. III leído entero, pp. 26-28), ni
      Castellanos en las estrofas de Manaure. Las fuentes que SÍ lo dicen las
      trae Arcaya 1920 pp. 114-115, y una está en el repo: (1) la CARTA DE
      JUAN DE AMPÍES al rey, Oviedo y Baños 1885 t. II p. 212 — «el cual por
      ser tan gran señor se hace adorar como Dios, dando á entender á los
      indios que él da los temporales» (leída en el repo, pdf 223); (2) FRAY
      PEDRO DE AGUADO, Historia de Venezuela, ed. Caracas t. I p. 40, citado
      por Arcaya p. 115 — Manaure les había hecho creer «que él era el autor y
      hacedor de … las lluvias, granizos, truenos y relámpagos y heladas y
      secas», de lo que dependían «los buenos temporales y fructificación de
      la tierra», y lo llevaban «cargado en los hombros en un género de lecho

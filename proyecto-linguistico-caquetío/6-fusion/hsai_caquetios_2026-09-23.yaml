    pagina_impresa: 474
    cita: >-
      «It is probable that time, at least seasons of the year, was measured not
      in terms of astronomical phenomena but of the ripening of wild fruits,
      for the Caquetio would set a date by saying "when such and such fruits
      ripen."»
    cita_el_autor: null
    fuente_real: >-
      SIN CITA, y no localizado. Sondas: `madur`, `fruct`, `frut` en Oviedo t.
      II Libro XXV (sólo «mahiz é muchas fructas», p. 328), en Arcaya 1920 (el
      único «madurar los frutos» es de los reyes MEXICANOS en la analogía de
      Spencer, p. 112) y en Federmann 1916 (sólo frutas como mercancía, p. 90).
      La sección «Learning» del capítulo no trae ninguna cita; las frases
      vecinas son de Nueva Segovia (Antolínez 1943), de modo que la
      procedencia más probable es la Relación de Barquisimeto 1579, que no
      está en el repo. Es además una inferencia del autor («It is probable»)
      apoyada en una sola frase entrecomillada.
    en_repo: false
    vault: "no — la ficha steward-1948-hsai-4 lo destacaba como dato del caquetío; el corpus ancla el calendario en las dos estaciones (creencia-014) y no en frutas"
    polity: "desconocida; probable INTERIOR (Nueva Segovia)"
    epoca: "no declarada; si es la Relación, 1579"
    nuevo: >-
      Es lo más interesante que trae el capítulo y lo único de su sección de
      saber: un calendario fenológico. Pero no tiene fuente ni polity. Para
      usarlo hay que encontrar la frase en una primaria.
    etiqueta_maxima: hipotetico
    como_verificar: >-
      Buscar la frase en la Relación de Nueva Segovia (edición de Arellano
      Moreno, *Relaciones geográficas de Venezuela*, o el Boletín del Centro
      Histórico Larense n.º 11, 1942 — ver la ficha nueva-segovia-1579) o en
      Antolínez 1943 (Acta Americana vol. 1 n.º 4, 1943). Si está allí, es de
      Barquisimeto y la regla 4 manda marcarlo.

# ══════════════════════════════════════════════════════════════════════
# §1b. EL VEHÍCULO: EL RESUMEN DE STEWARD (HSAI 4, pp. 21-22, pdf 45-46)
#
# Por aquí viaja el capítulo de Hernández de Alba a quien no lee el
# capítulo: Steward lo condensa en su introducción al volumen, sin citas.
# ══════════════════════════════════════════════════════════════════════
steward_resumen_noroeste:
  autor: "Julian H. Steward (introducción al volumen)"
  paginas: "21-22 (pdf 45-46)"
  obra: steward-1948-hsai-4
  afirmaciones:
  - id: st-01
    cita: >-
      «In religion and political organization the Arawakan Jirajara and
      Caquetio have certain specific resemblances to the Arawakan Taino of the
      Antilles.»
    lectura: >-
      Es la tesis que las dos campañas del taíno midieron y no sostuvieron
      («ni vecino ni pariente medible»). Aquí va sin argumento ni cita, y con
      el mismo error de hda-03 (el jirajara no es arahuaco). Útil sólo como
      origen posible del lugar común.
    polity: general
    etiqueta_maxima: "no usar como dato"
  - id: st-02
    cita: >-
      «The Caquetio chief was accredited with supernatural power to control
      natural phenomena and plant growth, he was carried in a hammock, and he
      received special treatment at death. Under the chief were nobles,
      warriors, and rich men, each forming a special class.»
    lectura: "repite hda-12, hda-13 y hda-14; lo sostenido está en hda-13 (Ampíes, Aguado)"
    polity: costera
  - id: st-03
    cita: >-
      «There was some kind of community temple (adoratorio) where offerings were
      made by shamans to the sun and moon … Human sacrifice was practiced: young
      girls were beheaded and their blood offered to the sun in order to obtain
      rain.»
    lectura: >-
      ❌ Aquí el dato AXAGUA de Nueva Segovia (hda-21, hda-22) ya aparece como
      rasgo del noroeste en general, sin nombre de nación. Es el camino por el
      que un rito ajeno y colonial (1579, «después que poblamos lo hacen … de
      escondidas») llegaría al vault como caquetío.
    polity: "axaguas de Nueva Segovia, generalizado"
    etiqueta_maxima: "no atribuible a los caquetíos"

# ══════════════════════════════════════════════════════════════════════
# §2. KIRCHHOFF (y Métraux y Kirchhoff): LOS CAQUETÍOS VISTOS DESDE LOS
#     VECINOS — llanos, Andes y la costa oriental
# ══════════════════════════════════════════════════════════════════════
kirchhoff:
  obra: steward-1948-hsai-4
  medido: >-
    El encargo mandaba a Kirchhoff, «Tribes north of the Orinoco» (pp.
    481-493), por los caquetíos. Ese capítulo NO los nombra (sondas
    caquet|caiquet|caguet sobre las páginas del PDF: ninguna página entre la
    pdf 611 y la 734). Donde Kirchhoff habla de caquetíos es en OTROS tres
    capítulos: los recolectores de los llanos (pp. 463-468), el guayupé
    (p. 385) y, con Métraux, la extensión nororiental de la cultura andina
    (pp. 353 y 363). Y «Tribes north of the Orinoco» sí trae algo que toca al
    proyecto de frente: la CURIANA (k-03).

  afirmaciones:

  - id: k-01
    capitulo: "The Guamontey, Guamo, Taparita and Ature (en «Food-gathering tribes of the Venezuelan Llanos»)"
    autor: Paul Kirchhoff
    pagina_impresa: "464 y 466"
    cita: >-
      «Some sources called the Guamo, both in the east and the west, Guaikeri
      (Guayquiri, Gaiqueri, Guaycari) … (The name Guaikeri occurs also outside
      of our region as a designation of tribes that live exclusively or largely
      by fishing.)» · «The westermost Guamo (Federmann's Guaycari) had retained
      their fishing culture, but their settlements were intermingled with those
      of the Caquetio, who seem to have been their overlords, and these tribes
      carried on an active exchange of their respective products.» (p. 464) ·
      «The western Guamo, who lived in the same territory as that of their
      Caquetio overlords, though in separate settlements, seem to have had
      permanent villages.» (p. 466)
    cita_el_autor: "Federmann 1840 (ed. francesa); Castellanos 1852; Gilij 1780-84"
    fuente_real: >-
      Federmann 1916 (en el repo), pp. 89-90: los guaycaríes, «gentes
      completamente negras», al otro lado del río; «Allí hacen mercado con los
      Caquetíos, que cambian frutas y otros víveres por pescado, porque es la
      pesca su única industria y hanse adueñado del río. Viven estas dos
      naciones en paz en el mismo territorio porque se necesitan mutuamente,
      pero cada una habita aldeas distintas». Y p. 92: el cacique de Itabana
      «era también señor de la mayor parte de las aldeas por donde había yo
      cruzado y le está sujeta una gran parte de la nación Caquetia». El
      «overlords» es LECTURA de Kirchhoff: Federmann dice paz y necesidad
      mutua, y que los dueños del río son los guaycaríes.
    en_repo: {federmann-1916: true, gilij-1780-1783: "ficha en el repo, sin cotejar aquí"}
    vault: >-
      Es una respuesta —de 1948 y como hipótesis— a un hueco que el vault tiene
      declarado: `3-mundo/esfera-de-interaccion.md` §6, «si los guaycaríes eran
      un grupo distinto o una denominación de otra cosa», y a la rareza de
      `3-mundo/etnias.yaml` etnia-002 (guayquerí en el Cojedes, «geográficamente
      rara: los guayqueríes se documentan en Margarita»). Según Kirchhoff,
      «Guaikeri» era un nombre GENÉRICO para pueblos pescadores, y los
      guaycaríes de Federmann eran los guamos del oeste, en el Portuguesa,
      Pao, Cojedes, Guanare y Acarigua.
    polity: "LLANOS (Cojedes-Portuguesa) — regla 4"
    epoca: "contacto (1530-1531)"
    nuevo: >-
      Sí: (1) «Guaikeri» como designación genérica de pueblos pescadores; (2)
      la filiación de los guaycaríes de Federmann con los GUAMO, que Kirchhoff
      emparenta lingüísticamente con el taparita y el otomaco (p. 464); (3) el
      marco de la relación caquetío-guaycarí como simbiosis de agricultores y
      pescadores en el mismo territorio y en aldeas separadas, que Federmann
      sí sostiene.
    consecuencia_para_el_elenco: >-
      Los guaycaríes de la era 1 («en la orilla» de la Curiana) no tienen
      fuente COSTERA: la única atestación es la de Federmann, en los llanos,
      y el nombre sería el de cualquier pescador. Eso no obliga a nada (son
      `canon-simulacion`), pero el día que se les busque fuente, la fuente
      dice llanos y pescadores de río. Lo decide Miguel.
    etiqueta_maxima: "atestiguado para los llanos (Federmann); la filiación guamo, hipotetico (Kirchhoff)"

  - id: k-02
    capitulo: "The Guayupé and Sae"
    autor: Paul Kirchhoff
    pagina_impresa: 385
    cita: >-
      «The Guayupé and Sae had relations with the Caquetio to the north (Speyer
      came to the Guayupé with a Caquetio interpreter)»
    cita_el_autor: null
    fuente_real: "sin cita en la frase; es la entrada de Spira (1535-1538). No se cotejó."
    en_repo: null
    vault: "no"
    polity: "LLANOS del sur (Meta-Guaviare): los caquetíos como intérpretes de la entrada"
    epoca: contacto
    nuevo: "el caquetío como lengua de paso hacia el guayupé — hipotetico hasta ver la fuente"
    etiqueta_maxima: hipotetico

  - id: k-03
    capitulo: "The tribes north of the Orinoco River"
    autor: Paul Kirchhoff
    pagina_impresa: "481, 483, 485-486"
    cita: >-
      «All tribes, with the exception of one town on the eastern fringe of the
      area, Aruacay, probably Arawakan, belong to the Cariban family. …
      "Provinces" mentioned … are Aruacay, Paria, Cumana, Chiribichi, Piriti,
      Maracapana, Anoantal, Guacharuco, Paripamotu, and Curiana.» (p. 481) ·
      «In Curiana at least two kinds of domesticated ducks, or ducklike birds,
      were known, one of them possibly being the Muscovy duck.» (p. 483) · «The
      Curiana obtained gold, in exchange for pearls, from a country 6 days'
      travel to the west, called Cauchieta. … According to Petrus Martyr …
      however, the Curiana were headhunters» (pp. 485-486)
    cita_el_autor: "Pedro Mártir (Anghiera 1912), Gómara 1552-53"
    fuente_real: >-
      Anglería (en el repo, angleria-1892): el viaje de Niño y Guerra,
      1499-1500 («curianenses», Cauchieto «hacia el Occidente … seis soles»,
      vol. 1 p. 310, según la ficha). Gómara no está en el repo.
    en_repo: {angleria-1892: true, gomara: false}
    vault: >-
      El vault tiene abierta la identidad de la Curiana (#33; fichas
      angleria-1892 y navarrete-1829-viages-menores: Navarrete separa DOS
      Curianas y pone la de Niño en Cumaná-Cariaco). Kirchhoff 1948 es una
      tercera voz en el mismo sentido: mete la Curiana de Niño en el bloque
      CARIBE de la costa oriental, entre Paria y Cabo Codera. No es
      independiente de Anglería (lo lee a él), pero es la clasificación de
      referencia de la etnología de 1948.
    polity: "costa ORIENTAL según Kirchhoff — si #33 no decide que la Curiana de Niño es la de Coro, nada de esto es caquetío"
    epoca: "contacto (1499-1500)"
    nuevo: >-
      Los patos domésticos (quizá el pato real, *Cairina moschata*) y la
      deformación craneal frontooccipital con cojines de algodón atribuidos a
      la Curiana — datos que el vault no tiene, y que NO deben entrar a la
      Kaketiana sin resolver #33.
    etiqueta_maxima: "hipotetico para la Kaketiana"

  - id: k-04
    capitulo: "The northeastern extension of Andean culture"
    autor: "Alfred Métraux y Paul Kirchhoff"
    pagina_impresa: 353
    cita: >-
      «the Chiguará, on the slopes north of Lagunillas; ethnographically
      unknown but important because of being mentioned in the traditions of the
      ruling family of the Caquetio of Coro, who claimed to have come from this
      region; … the Torondoy, like the Chiguará, are mentioned in the traditions
      of a Caquetio group, far to the northeast, in this case those of Yaracuay»
    cita_el_autor: null
    fuente_real: >-
      Sin cita en la frase. CERO en el repo: sondas chiguar|torondoy|lagunillas
      en Oviedo y Baños (sólo el río Torondoy y la montaña de Lagunillas de
      Terepaima, sin relación), Castellanos, Federmann 1916 y Arcaya; y cero en
      3-mundo/ y 4-fuentes/. Por la materia (Mérida) apunta a fray Pedro Simón
      o a Aguado, que son fuentes principales del capítulo.
    en_repo: false
    vault: "no — es lo más nuevo del volumen para la geografía política de la esfera"
    polity: "costera (la familia gobernante de Coro) con origen declarado en los Andes de Mérida"
    epoca: "tradición recogida en el contacto; lo que dice es de antes"
    nuevo: >-
      Una tradición de ORIGEN de la casa gobernante de Coro en el Chiguará
      (vertiente norte de Lagunillas, Mérida), y otra de un grupo caquetío de
      Yaracuy en el Torondoy. Si se localiza la fuente, alimenta geografía
      política (de dónde decía venir la casa del Manaure) y creencia.
    etiqueta_maxima: hipotetico
    como_verificar: "buscar «Chiguará» en Simón, Noticias historiales (la parte de Mérida), y en Aguado; ninguno está en el repo"

  - id: k-05
    capitulo: "The northeastern extension of Andean culture"
    autor: "Alfred Métraux y Paul Kirchhoff"
    pagina_impresa: 363
    cita: >-
      «The Lache, in contrast to all the other tribes of this area and almost
      certainly through the influence of their neighbors and friends, the
      Arawakan Caquetio, publicly recognized male homosexuals, whom they married
      and buried as if they were women.»
    cita_el_autor: null
    fuente_real: >-
      Sin cita; la influencia caquetía es inferencia de los autores («almost
      certainly»). Los lache están en la sierra del Cocuy: los caquetíos
      vecinos son los de los LLANOS de Casanare-Apure, no los de Coro.
    en_repo: null
    vault: "no"
    polity: "LLANOS — regla 4"
    epoca: contacto
    nuevo: "sí, pero es inferencia sobre los caquetíos llaneros; no para la costa"
    etiqueta_maxima: hipotetico

# ══════════════════════════════════════════════════════════════════════
# §3. KIDDER II, «THE ARCHEOLOGY OF VENEZUELA» — el noroeste
#     HSAI 4, pp. 425-429 y 434-437 (pdf 555-563, 568-571)
#
# Contrapeso a la falta de rouse-cruxent-1963. Kidder resume a Osgood y
# Howard 1943 y a Nomland 1933-1935 (ninguno en el repo). No hay una sola
# fecha absoluta: el volumen es anterior al radiocarbono.
# ══════════════════════════════════════════════════════════════════════
kidder_noroeste:
  autor: "Alfred Kidder II"
  obra: steward-1948-hsai-4
  fuentes_que_resume: "Osgood y Howard 1943 (An archeological survey of Venezuela, Yale Univ. Publ. Anthrop. 27); Nomland 1933, 1935 — ninguna en el repo"
  afirmaciones:
  - id: kd-01
    tema: "sitios y conchales del llano costero de Falcón y de Paraguaná; relación con las ABC"
    pagina_impresa: 426
    cita: >-
      «Village sites and shell heaps on the Falcon coastal plain are recorded
      from Coro and to the west (Nomland, 1933, 1935), and on the Paraguana
      Peninsula (Osgood and Howard, 1943). The general relationship of the
      culture of this area to that of Quibor and Carache, as well as to that of
      Curacao, Aruba, and Bonaire … is obvious, although differences in detail
      and in frequency of certain traits are apparent.»
    vault: "la relación Falcón-ABC está en el vault por vía arqueológica moderna (Oliver cap. 4, Haviser, Dijkhoff); esto es su enunciado de 1948"
    nuevo: false
    etiqueta_maxima: "reconstruido (arqueología de 1943-1948, sin fechas)"
  - id: kd-02
    tema: "entierro secundario en urna cerca de Coro"
    pagina_impresa: "426 y 436"
    cita: >-
      «Secondary urn burials, from near Coro, for example, are in contrast to
      the primary burials of Carache and central Lara.» · «Primary burials at
      Carache contrast with secondary urn burials, found on the Falcón coast,
      the Goajira Peninsula, and at the two Maracaibo sites» (p. 436)
    vault: >-
      Toca de frente a creencia-010b («un SEGUNDO ENTIERRO caquetío
      atestiguado», por Oviedo): la arqueología de 1943 registra el
      entierro secundario en urna en la costa de Falcón. Es un apoyo
      material, independiente de la crónica, a que el tratamiento en dos
      tiempos del muerto sea costero y no sólo de un informante de Oviedo.
      Ojo: una urna con huesos no es beber los huesos; apoya el «segundo
      tiempo», no el endocanibalismo.
    polity: "costera (Coro, Falcón)"
    epoca: "precontacto probable, sin fecha"
    nuevo: "como enlace, sí: el vault no cruza el entierro secundario arqueológico con creencia-010b"
    etiqueta_maxima: "reconstruido (dato arqueológico sin fecha, de segunda mano)"
  - id: kd-03
    tema: "Cayerúa (Paraguaná): la única estratigrafía"
    pagina_impresa: "426, 429 y 434"
    cita: >-
      «At the Cayerua site on Paraguana Peninsula, pottery marked by impression
      of knotless netting showed a marked increase in the upper level of a
      shallow excavation, with a proportionate decrease in linear painting.»
      (p. 426) · «Bone artifacts are rare, one bone point and a carved pendant
      having been found in the Cayerua site. Shell … occurs in the Coro district
      in the form of beads and pendants, and Cayerua produced beads, a
      Strombus-shell ax, and Strombus tips.» (p. 429) · «in a total depth of 50
      cm. (about 20 inches)» (p. 434)
    vault: >-
      nodo-025 (cayerua) en 3-mundo/asentamientos.yaml: sitio FAL-143 de
      Oliver, «Dabajuroide [cf. Howard 1943]», `precontacto: probable`. Esto
      añade lo que Osgood y Howard vieron al excavar: dos niveles en 50 cm,
      cambio de la pintura lineal a la impresión de red sin nudos, hacha de
      Strombus, cuentas, punta de hueso. Sigue sin fecha.
    polity: "costera (Paraguaná)"
    epoca: "precontacto probable (sin fecha)"
    nuevo: "sí, como detalle material del sitio; no cambia su `precontacto: probable`"
    etiqueta_maxima: "reconstruido"
  - id: kd-04
    tema: "cerámica del área de Coro"
    pagina_impresa: "426-427 y 436"
    cita: >-
      «Plain ware is commonly incised at Coro, much less frequently so at other
      Falcon sites. … Bowls and jars with corrugated necks … are characteristic
      of this area; hollow rims also occur. The linear decoration of painted
      ware is strikingly similar in style to that of Quibor and Carache but
      occurs on double-spouted jars … in the north coastal area» · «The La
      Maravilla Aspect is set off from the Coro Aspect on account of the
      preponderance of incised, as contrasted to painted, decoration at the Coro
      site» (p. 436)
    nuevo: "los «aspectos» de Osgood y Howard (Coro, La Maravilla, Cayerúa) como unidades de 1943; el vault usa la serie dabajuroide de Oliver"
    etiqueta_maxima: "reconstruido"
  que_no_da: >-
    Ninguna fecha, ninguna secuencia regional para Falcón (Kidder, p. 434:
    fuera de Cayerúa, la poca profundidad de los depósitos no deja ver
    cambio), nada de la seriación dabajuroide (el nombre es posterior). No
    reemplaza a rouse-cruxent-1963: sólo confirma que en 1948 ya se sabía
    que Falcón, Lara y las ABC eran un mismo horizonte cerámico con
    variantes.

# ══════════════════════════════════════════════════════════════════════
# §4. HSAI 5 (1949), STEWARD: LA POBLACIÓN (Parte 3) Y LOS RASGOS
#     «CIRCUM-CARIBEÑOS» (Parte 4)
# ══════════════════════════════════════════════════════════════════════
steward_1949:
  obra: steward-1949
  poblacion:
    - id: v5-01
      pagina_impresa: 663
      pdf_extracto: 19
      verificado_en_imagen: true
      cita: >-
        Tabla 2, «Sub-Andean Tribes: Venezuela, north of Orinoco» —
        Population 144,000 · Size in units of 100 km² 3,200 · Persons per 100
        km² 45 · «Humboldt's estimates (1822-27) give 38 persons per 100 km.²
        in 1800.»
      lectura: >-
        ❌ La ficha y el encargo daban «86.300 y 144.000» como las dos cifras
        de «Venezuela, north of Orinoco». Mirado en imagen: 86.300 es OTRA
        fila, «Total Northwestern South America» (motilones 40.000 + guajiros
        31.300 + costa pacífica de Colombia 15.000). La única cifra de
        Venezuela al norte del Orinoco es 144.000, sobre 320.000 km² a 45 por
        cada 100 km². Y Steward la clasifica como «Sub-Andean», no como
        «Circum-Caribbean».
    - id: v5-02
      pagina_impresa: 660
      tema: método
      cita: >-
        «The best source for Venezuela is Humboldt (1862), whose observations
        made about 1800 give sample densities of 38 per 100 km.². The native
        population was greater, but it is impossible to say how much greater
        without utilization of Contact Period sources. It is allowed a density
        of 45.»
      lectura: >-
        El 144.000 no sale de ninguna fuente del contacto: es la densidad de
        HUMBOLDT hacia 1800 subida a ojo de 38 a 45 y multiplicada por el área.
        Steward lo declara él mismo. Nivel máximo `hipotetico`, como decía la
        ficha, y con una razón más: la base es de 1800.
    - id: v5-03
      pagina_impresa: 666
      verificado_en_imagen: true
      cita: >-
        Tabla 3, «South American Indian population» — Venezuela: 1500,
        350,000; 1940, 103,000; 3.7 por ciento de la población nacional (1946).
      lectura: >-
        El 350.000 que el vault atribuye a Steward (prop-polity-015 en
        6-fusion/polities_no_costeras_federmann.yaml, vía Brito Figueroa, «pp.
        665-668») SÍ está, en la p. 666, como población de 1500. La página que
        da el vault es buena; la cifra, también.
    - id: v5-04
      pagina_impresa: "655-668"
      tema: "las «tres áreas demográficas» y el «Área Costero-Montañosa»"
      lectura: >-
        ❌ NO están en Steward. La ficha steward-1949 cita como suyo el
        «Área Costero-Montañosa … aldeas de elevada densidad demográfica en
        las zonas de agricultura intensiva y riego sistemático», y
        prop-polity-016 lo atribuye a steward-1949 pp. 665-668. Medido:
        «Venezuel*» sale en la Parte 3 sólo en las pp. 660 (método), 663
        (tabla 2), 666 (tabla 3) y 667 (supervivientes en las montañas del
        oeste); ninguna partición en tres áreas, ninguna mención de riego.
        La partición es de Brito Figueroa, que discute a Steward en ese mismo
        pasaje. Lo más cercano de Steward es genérico (p. 665): «The next
        greatest densities were in the Circum-Caribbean area, where the people
        relied on ocean resources as much as on farming.»
      propuesta: >-
        prop-polity-016: cambiar la procedencia a brito-figueroa-poblacion-economia
        como lectura PROPIA del autor, no «vía» Steward. Y corregir la ficha
        steward-1949 (hecho en esta rama, bitácora 2026-09-23).
  rasgos_caquetios_parte_4:
    # Cada rasgo con el nombre «Caquetio» en la síntesis de Steward, y de dónde
    # sale. Medido: caquet|caiquet|caguet en el extracto → pp. 720, 721 y 724
    # (la p. 702 es «Caquetá», el río de Colombia).
    - id: v5-10
      pagina_impresa: 720
      cita: "«Northern Venezuela is inadequately known, but considerable intervillage solidarity seems indicated for the Timoteans, Caquetio, Cumanagoto, and Aruacay.»"
      fuente_real: "el jefe general de hda-12 (Oviedo y Baños p. 27; Castellanos pp. 185-186; Oviedo t. II p. 299, díao)"
      polity: costera

      whom the shamans (boratios), acting in the capacity of priests, made
      offerings or sacrifices.»
    cita_el_autor: null
    fuente_real: >-
      Tres fuentes cosidas. El poder del jefe: Ampíes y Aguado (hda-13).
      Boratios como sacerdotes, uno «en cada pueblo pringipal»: Oviedo t. II
      p. 298. ❌ El SOL Y LA LUNA: la Relación de Nueva Segovia (Barquisimeto,
      1579) lo dice de los AXAGUAS, no de los caquetíos — Arcaya 1920 p. 102,
      citándola: «se agrega respecto a los Axaguas: "Esta generación adora al
      sol y a la luna…"». Y Arcaya concluye (p. 102) que no les rendía culto
      «toda la tribu, sino que los invocaban individuos especialmente
      dedicados», lo contrario de los «community temples».

    Ninguna cifra para la costa caquetía ni para el Golfete: la unidad
    mínima de Steward es «Venezuela, north of Orinoco». Y ningún rasgo
    caquetío que no venga, por Hernández de Alba, de las mismas crónicas.

# ══════════════════════════════════════════════════════════════════════
# §5. ROUSE, «THE WEST INDIES» Y «THE ARAWAK» (HSAI 4, pp. 495 ss.)
# ══════════════════════════════════════════════════════════════════════
rouse:
  obra: steward-1948-hsai-4
  capitulos_medidos: "The West Indies: an introduction (pdf 631-632), The Ciboney (pdf 633), The Arawak (pdf 651-691), The Carib (pdf 699 ss.)"
  medido: >-
    Sondas sobre pdf 630-720: Venezuel* 1, Cura[cçgz]ao/Corazao 0, Aruba/Oruba
    0, Bonaire/Buinare 0, Coro 0, Paraguan* 0, caquet|caiquet 0, Tierra Firme
    0, Maracaibo 0. «Dutch» sale 2 veces y son Saba, San Eustaquio y la
    colonización del XVII. La única mención de Venezuela es cerámica (p. 510,
    pdf 654): la alfarería modelada-incisa antillana «is more like» la del
    nivel bajo de Los Tamarindos (Maracay, Kidder II 1944) y la de Los
    Barrancos en el bajo Orinoco.
  veredicto: >-
    NEGATIVO bien medido: Rouse no trata la esfera de contacto con la costa
    caquetía ni las ABC; su puente antillano con el continente es por el
    Orinoco y el centro-norte, no por Falcón. Encaja con lo que ya
    concluyeron las dos campañas del taíno. Visto de paso y FUERA del HSAI:
    el documento que sí liga ABC y costa está en el repo, la carta de
    Ampíes (Oviedo y Baños 1885 t. II pp. 209-213: las islas declaradas
    «inútiles», don Juan Baracoica, cacique en las islas y «pariente y
    deudo» de los de la costa, que «muchas veces se pasaban allá á holgar
    con ellos»).


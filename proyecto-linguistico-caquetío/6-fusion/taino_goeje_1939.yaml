      CUARTA frase: `cynato machabuka guamechyna`. Con `teitoka` y la de
      Esquivel, **Goeje recoge cuatro enunciados taínos con glosa**. El
      inventario de ayer daba por única la de Pané.

# ══════════════════════════════════════════════════════════════════════
# 4. MORFOLOGÍA COMPARADA — lo que Goeje afirma como sistema
# ══════════════════════════════════════════════════════════════════════
morfologia_comparada:
  aviso: >-
    ESTO NO ES CAQUETÍO y NO se fusiona. Es lo que un arawakista dice del
    TAÍNO, y vale como apoyo externo de una decisión ya tomada sobre el
    caquetío (d21.5) y como aviso sobre otra abierta (`-gua`).
  cuadro:
  - morfema: 'ka-'
    valor_segun_goeje: avec, présent (atributivo)
    corresponde_con: "G, A y el arahuaco común ka-"
    formas_tainas_que_lo_llevan: [ka-hoba, ka-sabi, ka-ona, ka-k-ona, kasike, caçibaxagua, bu-ti-k-ako]
    que_dice_el_canon_del_repo: >-
      ATRIBUTIVO `ka-` (hay X, tiene X), decidido en d21.5 → C, apoyado en van
      Buurt §8 y Perea p. 555.
    lectura: >-
      apoyo externo en una TERCERA lengua de la esfera. No mueve la decisión:
      la sostiene.
  - morfema: 'ma-'
    valor_segun_goeje: sans, absent (privativo)
    corresponde_con: "G, A y el arahuaco común ma-"
    formas_tainas_que_lo_llevan: [m-ahi-te, Matinino, Macorix, amaiaua, mayani]
    que_dice_el_canon_del_repo: 'PRIVATIVO `ma-` (sin X), mismo d21.5'
    lectura: ídem.
  - morfema: 'gua-'
    valor_segun_goeje: 1ª persona del plural (nuestro)
    corresponde_con: "G, A, arahuaco común wa-"
    formas_tainas_que_lo_llevan: [gu-aroko-el, guamechyna, guaoxeri]
    que_dice_el_canon_del_repo: >-
      `-gua` 'región' como SUFIJO toponímico, `deuda: sin-procedencia`, campaña
      abierta (`propuesta_gua_procedencia_2026-09-21.yaml`).
    lectura: >-
      ⚠️ **NO es lo mismo y no cierra la deuda.** Goeje habla de un PREFIJO de
      persona; el canon tiene un SUFIJO locativo. Lo que esto aporta es que la
      sílaba `gua` en una forma antillana puede ser el posesivo de 1ª plural, y
      por tanto **la sonda `gua-/wa-` del cruce puede estar contando
      posesivos**. Es un aviso metodológico, no una procedencia.
  - morfema: '-el'
    valor_segun_goeje: formativo, sobre todo en nombres propios
    corresponde_con: "G -ri, A -ri / -li (formativos de nombres verbales)"
    formas_tainas_que_lo_llevan: [gu-aroko-el, Mauciatiuu-el]
    que_dice_el_canon_del_repo: nada — no está en `morfemas.yaml`
    lectura: >-
      la sonda `-el final (antropónimo)` del cruce del repo tiene aquí su
      justificación bibliográfica. No es propuesta de morfema: es la fuente de
      la sonda.
  el_orden_de_la_frase:
    dato: >-
      las dos frases con pronombre de 1ª persona que Goeje recoge lo ponen
      DETRÁS: `Dios naboria daca` y `Juan Desquivel daca`.
    lectura: >-
      predicado nominal sin cópula y pronombre pospuesto. `taino_pane_c1498`
      pv01 ya lo decía de la primera y advertía de que es MACORIX; la segunda
      no lleva variedad declarada, así que el patrón deja de depender de la
      lengua de Pané. **Sigue siendo material de morfología taína, no
      caquetía.**

# ══════════════════════════════════════════════════════════════════════
# 5. LO QUE GOEJE SACA DEL TAÍNO — las negativas, que valen igual
# ══════════════════════════════════════════════════════════════════════
lo_que_goeje_saca_del_taino:
  mots_taino_d_origine_espagnole:
    donde: p. 18, sección propia
    que_es: >-
      voces que circulan como taínas y que él declara de otro origen. Es la
      trampa 1 de esta campaña, marcada por la fuente.
    entradas:
    - forma: kabuya
      glosa: cordes du hamac, plante fibreuse
      origen_segun_goeje: español *cabuya / cabre*
    - forma: tiburon
      glosa: requin
      origen_segun_goeje: >-
        español, tomado a su vez del tupí del Brasil (cita Friederici 1930)
    - forma: name
      glosa: igname
      origen_segun_goeje: 'africano (Friederici pp. 51, 71)'
    para_el_proyecto: >-
      ninguna de las tres está en el lexicón como taína. Cero hallazgos y es
      buena noticia: el lexicón no tiene esa contaminación.
  voces_que_pasan_al_caribe_insular:
    donde: 'pp. 18-19, sección «Caribe des Iles, 15e et 16e siècle»'
    aviso: >-
      🔴 ESTA SECCIÓN ES LA QUE MÁS DUELE. Son voces que la tradición da por
      taínas y que Goeje coloca en el CARIBE INSULAR.
    entradas:
    - forma: behiko
      glosa: homme-médecin
      que_dice_goeje: 'caribe insular, usado «à Haïti, selon Las Casas»'
      comparanda: "C boyahiku, boye; kalina puyei"
      en_el_lexicon: bejique
      consecuencia: >-
        la etiqueta `taíno` de `bejique` queda en duda. Regla 2: en duda,
        degradar. **Pero no se degrada aquí** — esto PROPONE. La forma taína
        que Goeje sí da para lo mismo es `buhuitihu`.
    - forma: piragua
      glosa: grand canot à voile
      que_dice_goeje: >-
        la atestigua en Oviedo I p. 171; dice que los kalina de Guayana llaman
        así a sus canoas de mar, que **no existe en garífuna ni en caribe de
        Honduras**, y que quizá sea composición con el español *vela*
      en_el_lexicon: piragua
      consecuencia: >-
        `piragua` está en el lexicón como `taíno`. Su propio especialista de
        referencia (a) no la pone entre las taínas, (b) sospecha que lleva
        dentro una palabra castellana, y (c) avisa aparte de que `piragua`,
        `kanoa` y `hamaka` viajaron a otras lenguas indígenas **por vía del
        español**. Tres razones para mirarla. Lo decide Miguel.
    - forma: tuob
      glosa: or
      que_dice_goeje: '«lengua Macorix de arriba?», de Colón, 13 de enero de 1493'
      en_el_lexicon: null
      consecuencia: >-
        TERCERA palabra para 'oro' en las Antillas (`ka-ona`, `nukai`, `tuob`),
        cada una de una variedad distinta. Es la prueba en tres piezas de que
        «el taíno» de una lista es varias lenguas.
    - forma: mabi / nabi
      glosa: igname, Dioscorea
      que_dice_goeje: >-
        de Chanca y Colón en Guadalupe; cita la frase de época «a este age
        llaman los de Caribi nabi»
      en_el_lexicon: null
    - forma: tabunuko
      glosa: arbre à résine pour calfater
      que_dice_goeje: 'Gómara, Puerto Rico; Friederici p. 90'
      en_el_lexicon: null
    - forma: baeza
      glosa: négation
      que_dice_goeje: >-
        «lengua Macorix de arriba», Las Casas *Apol. Hist.* cap. CCXLI; compara
        con el sufijo `-pa` de caribe y kalina
      en_el_lexicon: null
      consecuencia: >-
        🔴 hay DOS negaciones antillanas atestiguadas y son de lenguas
        distintas: `mayani` (taíno, §VII) y `baeza` (macorix de arriba). Quien
        meta las dos en una lista «taína» borra la distinción que la fuente
        hace.
  maboya:
    que_dice_goeje: >-
      da `ma-poya` como forma del caribe de Honduras y `mapoya` / `mafuiya` /
      `mafia` 'diable' en el caribe insular; la voz taína para el espíritu del
      muerto es `hupia`. Propone que `ma-poya` sea 'sin-alma'.
    en_el_lexicon: maboya (fuente `taíno`)
    consecuencia: >-
      `maboya` es una de las nueve voces de arqueología antillana que el
      encargo daba por sin cita. Ésta es su cita: y no dice lo que la entrada
      dice. **Lo decide Miguel.**
  hutia:
    medido: >-
      `hutia` aparece **1 vez en toda la obra** y es dentro de `yahutia`, que
      es la yautía (tubérculo), no el roedor. El roedor antillano que Goeje sí
      recoge es `guabiniquinax` (Coelogenys paca).
    consecuencia: >-
      `hutia` del lexicón no tiene apoyo en Goeje. No está desmentida: está
      entre los 12 nombres de animales que él deja sin identificar y manda
      buscar en Oviedo.

# ══════════════════════════════════════════════════════════════════════
# 6. ARUBA — lo más cerca de casa que llega esta obra
# ══════════════════════════════════════════════════════════════════════
aruba:
  hallazgo: >-
    Goeje cita dos veces un «dialecte de Aruba» dentro de sus columnas
    arahuacas: `luaidanga` 'calabaza, Crescentia Cujete' (p. 15, junto al
    lokono `iwida` y al taíno `hibuera`) y `hanuhana` 'hormiga' (en el
    vocabulario caribe).
  por_que_importa_aqui: >-
    Aruba está en la Kaketiana. Un arawakista que en 1939 tiene material de un
    «dialecto de Aruba» es una pista de fuente para el proyecto **por el lado
    caquetío**, no por el taíno — y no estaba en el mapa de fuentes de ayer.
  que_no_dice: >-
    no dice de dónde lo saca. Su lista de literatura (pp. 19-20 y el
    suplemento de la p. 110) hay que leerla para saberlo. **No se ha leído.**
  siguiente_paso_propuesto: >-
    buscar la fuente arubana de Goeje en su bibliografía, y cruzarla con
    `Gatschet_1885_Aruba_texto.txt` y con `VanBuurt_2014_CaquetioWords_Papiamentu.txt`,
    que ya están en el repo. Si es Gatschet, no hay nada nuevo; si no lo es,
    hay una fuente arubana que el proyecto no conoce.

# ══════════════════════════════════════════════════════════════════════
# 7. NEGATIVAS MEDIDAS (regla 6: un cero se verifica)
# ══════════════════════════════════════════════════════════════════════
negativas:
  metodo: >-
    búsqueda sobre el txt aplanado (espacios colapsados, para que el salto de
    línea no rompa la palabra), con raíz corta y sin acentos.
  resultados:
  - busqueda: caquetío / caiquetío / Curiana / Coriana / Paraguaná
    resultado: 0
    lectura: >-
      esta obra NO habla del caquetío. Se mina por el taíno y por la esfera,
      no por la lengua de casa.
  - busqueda: 'cobo'
    resultado: 0
    lectura: sin apoyo en Goeje; ver los 12 animales sin identificar.
  - busqueda: 'guabina'
    resultado: 0
    lectura: >-
      ⚠️ `guabiniquinax` no cuenta: glosa distinta (paca, no pez). Sin apoyo.
  - busqueda: 'manigua'
    resultado: 0
    lectura: sin apoyo en Goeje.
  - busqueda: 'taita'
    resultado: 0
    lectura: >-
      la única atestación conocida de `taita` sigue siendo la de Brinton vía
      «Richardo» = Pichardo, un diccionario del español de Cuba del s. XIX.
      Goeje no la recoge. El inventario de ayer ya la señalaba como candidata
      a degradar; esto lo refuerza sin cerrarlo.
  - busqueda: 'batata'
    resultado: 'aparente 0 — FALSO'
    lectura: >-
      🔴 el OCR la escribe `batala` dentro de la lista de las 46 plantas sin
      identificar. **Cero de consulta, no de fuente** (regla 6). Igual
      `tuna`, que sí sale con su grafía.
  - busqueda: 'lokono'
    resultado: 'aparente 0 — FALSO'
    lectura: >-
      Goeje escribe `Arawak` (29 veces) y `A` en la tabla. Mismo caso que
      Brinton.
  - busqueda: 'acoa, aduri, agari, akcicyaa, thigisi, wacusi, wagulo'
    resultado: 0 (las siete)
    lectura: >-
      son las formas `taíno-reconstruido` que el propio proyecto generó desde
      el lokono con `reconstruir_taino()`. Que no estén aquí **es lo esperado
      y es la contraprueba del método**: un vocabulario taíno real no las
      tiene, porque nunca fueron taínas.

# ══════════════════════════════════════════════════════════════════════
# 8. LO QUE ESTA OBRA NO DIO
# ══════════════════════════════════════════════════════════════════════
lo_que_no_dio:
- >-
  **ni una glosa caquetía.** 0 menciones. Esperado, y hay que decirlo para que
  nadie vuelva a mirar aquí buscándolas.
- >-
  **la asignación voz a voz a una variedad.** Goeje nombra Macorix, Ciguayo,
  lucayo y «lengua de Cuba», pero sólo declara la isla o la variedad en **4**
  de las voces del vocabulario (`guaymaro` Cuba, `nukai` Bahamas, `Macorix` y
  `Ciguayo` como etnónimos) más las tres de la sección caribe (`tuob`, `baeza`
  macorix de arriba; `mabi` Guadalupe). Para el resto escribe `T` a secas. **La
  obra que asigna cada voz a su variedad sigue siendo Granberry y Vescelius
  2004, y sigue sin conseguirse.**
- >-
  **el kalinago.** Está —pp. 31-110, con habla de hombres y de mujeres— y no se
  leyó entrada a entrada. Las 23 entradas kalinago del lexicón siguen sin
  tocar. Es la sesión siguiente más obvia de toda la campaña.
- '**la errata de 1940**: el enlace devuelve 500.'

# ══════════════════════════════════════════════════════════════════════
# 9. PROPUESTA (regla 5 — esto NO toca canon)
# ══════════════════════════════════════════════════════════════════════
propuesta:
  para_miguel:
  - id: g1
    asunto: '`bejique` — ¿taíno o caribe insular?'
    evidencia: >-
      Goeje p. 18 pone `behiko` en el caribe insular del s. XV-XVI y anota que
      en Haití se usaba «según Las Casas»; la forma taína que él da para
      'hombre-médico' es `buhuitihu`. Brinton p. 12 la da como antillana sin
      cronista, comparándola con `piaye` arawak.
    opciones: >-
      (A) dejarla `taíno` y anotar la duda en `notas`; (B) degradarla a
      `kalinago` con cita de Goeje; (C) dejarla `taíno` y añadir `buhuitihu`
      como forma taína aparte. Regla 2 empuja hacia A o B.
  - id: g2
    asunto: '`piragua` — tres razones para mirarla'
    evidencia: >-
      Goeje la clasifica en el caribe insular, sospecha composición con el
      español *vela*, y avisa de que ella, `kanoa` y `hamaka` viajaron por vía
      del español.
    opciones: >-
      (A) dejarla `taíno`; (B) pasarla a `kalinago`; (C) marcarla
      `esfera-indecidible` en `notas` y sacarla de los cruces.
  - id: g3
    asunto: '`maboya` — la única cita que aparece la da como caribe'
    evidencia: 'Goeje p. 8: `ma-poya` es G (caribe de Honduras); la taína es `hupia`.'
    opciones: '(A) dejarla; (B) pasarla a `kalinago`; (C) añadir `hupia` como la taína.'
  - id: g4
    asunto: '`abba` ''uno'' — segunda mano independiente contra'
    evidencia: >-
      Goeje da `heketi` como el 1 taíno y `iki-ni` como el 1 arawak. Brinton
      dice lo mismo por otro camino y cita Las Casas cap. 204.
    opciones: >-
      (A) reetiquetar `abba` como lokono; (B) archivarla en `FUERA_DEL_HABLA` y
      proponer `heketi` con cita de Las Casas; (C) dejarla hasta leer el cap.
      204 en la *Apologética*, que no está en el repo.
    recomendacion_del_minador: >-
      C primero y B después. Es literalmente el caso de la política «donde hay
      forma atestiguada, manda la atestiguada», aplicada al taíno; pero el
      capítulo hay que leerlo, y no lo tenemos.
  - id: g5
    asunto: '`daca` — dos frases independientes, y la etiqueta no aguanta'
    evidencia: >-
      `Dios naboria daca` (Pané, Macorix) y `mayani-makana, Juan Desquivel
      daca` (Goeje p. 17) ponen las dos `daca` = 'yo' pospuesto. El lexicón la
      tiene `taíno-reconstruido` con glosa 'mano'.
    opciones: >-
      (A) corregir glosa a 'yo' y capa a `taíno` con cita doble; (B) corregir
      sólo la glosa; (C) archivarla.
  - id: g6
    asunto: '`mayani` — la glosa'
    evidencia: >-
      lexicón 'negación'; Brinton 'of no value'; Goeje 'rien', detrás del
      privativo `ma-`, con la frase de Esquivel donde es una prohibición.
    opciones: >-
      (A) glosar 'nada' y anotar el uso prohibitivo; (B) dejar 'negación' y
      anotar; (C) partir en dos entradas.
  - id: g7
    asunto: 'el atributivo/privativo `ka-`/`ma-` tiene ahora apoyo taíno'
    evidencia: 'Goeje p. 17, con siete formas taínas que llevan `ka-` y cinco que llevan `ma-`.'
    opciones: >-
      (A) añadir la cita de Goeje a la evidencia de d21.5 en
      `2-lengua/morfologia.md`; (B) no tocar nada, ya está decidido.
    recomendacion_del_minador: >-
      A. No mueve el motor ni el scorer, y convierte una decisión apoyada en
      dos fuentes en una apoyada en tres lenguas de la esfera.
  lo_que_este_archivo_NO_propone: >-
    ni un cognado nuevo a `cognados.yaml`, ni una entrada nueva a
    `curiana_lexicon.py`, ni un morfema a `morfemas.yaml`. Esto es comparanda
    taína con su cadena de custodia. Lo que decide qué entra es Miguel.

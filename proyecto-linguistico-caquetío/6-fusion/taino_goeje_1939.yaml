# ══════════════════════════════════════════════════════════════════════
# GOEJE 1939 — *Nouvel examen des langues des Antilles*
# Journal de la Société des Américanistes, t. 31, pp. 1-120.
#
# PROPUESTA (regla 5). Comparanda. Segunda campaña del taíno, parcela T10.
# 2026-09-22. Insumo directo para `6-fusion/scripts/consolidar_taino.py`.
#
# ⚠️ DERECHOS. Goeje murió en 1955: la obra NO es de dominio público en todas
# las jurisdicciones. Aquí se transcribe **dato lexicográfico** —la forma, su
# glosa de una a cuatro palabras, la página y la lengua que el autor declara—
# y se PARAFRASEA todo lo demás. No se copia su prosa. Las dos citas literales
# que quedan tienen menos de 15 palabras y son, las dos, citas que el propio
# Goeje toma de Las Casas (s. XVI, dominio público).
# ══════════════════════════════════════════════════════════════════════
meta:
  obra_id_propuesto: goeje-1939
  autor: Goeje, Claudius H. de
  anio: 1939
  publicacion: Journal de la Société des Américanistes, t. 31, pp. 1-120
  doi: 10.3406/jsa.1939.1984
  campana: taino2-2026-09-22
  parcela: T10
  idioma_de_la_obra: francés
  advertencia: >-
    ESTO NO ES CAQUETÍO y NO es fuente primaria del taíno. Goeje es un
    arawakista de 1939 que reúne lo que escribieron los cronistas y lo compara
    con el arawak de Guayana, el caribe insular y una treintena de lenguas
    arahuacas del continente. Lo que vale como procedencia de una voz taína es
    el cronista, con Goeje de intermediario declarado. Ver
    `cadena_de_custodia`.

  # ── lo que resultó FALSO al medirlo ────────────────────────────────
  correcciones_al_encargo:
  - afirmacion: '«Goeje 1939 … en Persée, gratis»'
    medido: >-
      gratis de LEER, no de descargar: el PDF de Persée está detrás de un
      captcha (`pdf-download-captcha-widget` en el HTML del artículo,
      comprobado el 2026-09-22) y no se salta. La página HTML del artículo sólo
      sirve la primera página del texto (2.763 caracteres útiles). El PDF
      completo se consiguió en la **Biblioteca Digital Curt Nimuendajú**
      (etnolinguistica.org), que aloja copia del MISMO PDF de Persée — el
      fichero lleva impreso «Fichier pdf généré le 04/05/2018». Ésa es la vía
      abierta, y es la que hay que apuntar para la próxima sesión.
  - afirmacion: '«pp. 1-128»'
    medido: >-
      **pp. 1-120**. Lo dice la cita canónica del propio Persée y lo confirma
      el PDF: 122 páginas de PDF, desfase constante impresa = pdf − 1 (medido
      sobre 89 encabezados con número; hay 4 lecturas espurias del OCR).
  - afirmacion: '«junta taíno, kalinago (lengua de hombres y de mujeres) y lokono con correspondencias»'
    medido: >-
      cierto, y con una trampa de término igual a la de Brinton: **`lokono`
      aparece 0 veces en el texto** y `Arawak` 29. Goeje escribe `A` = Arawak
      (de Guayana) en toda la tabla. Quien busque «lokono» en esta fuente
      encontrará cero y concluirá mal (regla 6). Aquí se conserva su
      abreviatura y se traduce a `lokono` sólo en §correspondencias, donde se
      dice.
  - afirmacion: >-
      «(del mapa de fuentes de ayer) es la obra que decide … si `caiman`,
      `piragua`, `papaya` o `maboya` son taínas o caribes insulares»
    medido: >-
      decide tres de las cuatro, y dos salen del taíno: `piragua` la pone en
      **caribe insular** y duda de que sea indígena; `maboya` la da como
      **caribe** (`G ma-poya`, `Cf mapoya`), no como taína; `papaya` sí es
      taína (T papaya); y para 'caimán' la forma taína que trae no es `caiman`
      sino **`hatmane`**. Ver §lo_que_goeje_saca_del_taino.

  # ── §1 la descarga ─────────────────────────────────────────────────
  descarga:
    url: >-
      http://www.etnolinguistica.org/local--files/biblio:goeje-1939-antilles/de_Goeje_1939_Nouvel_examen_des_langues_des_Antilles.pdf
    pagina_de_la_ficha: http://www.etnolinguistica.org/biblio:goeje-1939-antilles
    fecha: '2026-09-22'
    estado_de_derechos: >-
      acceso abierto en Persée (el editor lo publica libre) y espejo en la
      Biblioteca Digital Curt Nimuendajú. La obra sigue bajo derechos de autor
      (Goeje †1955): se cita corto y se parafrasea.
    tamano_bytes: 6281894
    sha256: 988761c9c4ce3990370e89228178f58e849418ae3bd41394d52b031ea07e2f78
    local: fuentes_caquetios/Goeje_1939_Nouvel_examen_langues_Antilles.pdf
    no_conseguido: >-
      la **errata de 1940** (`de_Goeje_1940_..._Errata.pdf` en la misma ficha)
      devuelve HTTP 500. Queda pendiente: una errata de un vocabulario es
      exactamente lo que no se puede dar por leído.

  # ── §2 el extractor y la ortografía, ANTES de contar ───────────────
  extraccion:
    herramienta: pdftotext -enc UTF-8
    salida: fuentes_caquetios/Goeje_1939_Nouvel_examen_langues_Antilles.txt
    bytes: 242554
    calidad: >-
      el PDF de Persée TIENE capa de texto, pero es OCR de 1939 sin corregir y
      con un alfabeto fonético denso. Falla sistemáticamente en: cursivas
      (media columna comparativa sale como cirílico o basura — `T я7>л` por
      `T siba`), `ï`/`i`, `n`/`ii`, `c`/`e`, y los diacríticos checos que Goeje
      usa (`š`, `ň`, `ž`). Toda forma que este archivo marca `ocr: dudoso` está
      leída de un texto ambiguo.
    lo_que_esto_implica: >-
      **el cuerpo francés se lee bien y las formas taínas también** (van en
      redonda); lo que se rompe es la columna de comparandas en cursiva. Como
      lo que esta parcela necesita es la forma taína + su glosa + la
      correspondencia arawak, se transcribe lo primero con confianza y lo
      segundo con reserva marcada.
  ortografia_medida:
    metodo: raíz corta y sin acentos sobre el txt entero (skill `minar-fuente` §2)
    conteos:
      Taino/taino: 52
      Tain (raíz): 43
      Arawak: 29
      lokono: 0
      Aruac: 0
      Caribe: 64
      Caraibe: 5
      Shebayo: 8
      Ciguayo: 1
      Macorix: 2
      Zayas: 7
      Oviedo: 5
      'Las Casas': 5
      Pane: 5
      Brinton: 3
      Rafinesque: 4
      Pichardo: 1
      Bachiller: 0
    lo_que_dice_el_conteo: >-
      `Bachiller` 0 y `Pichardo` 1: Goeje NO usa la tradición cubana salvo de
      pasada, y a Zayas sí (7 menciones, varias con página). Su fuente de
      formas taínas son los cronistas y Lovén 1935. Quien busque en Goeje una
      corroboración de Bachiller no la va a encontrar.
  paginacion:
    desfase: impresa = pdf − 1
    como_se_midio: >-
      contando los números sueltos de los encabezados corridos página a página:
      89 observaciones dan desfase 1 y 4 son ruido del OCR. NO es una cifra a
      mano (regla 1); la calcula `6-fusion/scripts/consolidar_taino.py`
      al releer el txt.
  cobertura:
    leido_entrada_a_entrada: >-
      el VOCABULARIO TAÍNO entero, secciones I a VII (pp. 6-17), más «Mots
      taino d'origine espagnole» (p. 18) y la parte del s. XV-XVI de «Caribe
      des Iles» (pp. 18-19).
    no_leido_entrada_a_entrada: >-
      la parte gramatical (pp. 21-30), el vocabulario del caribe insular y del
      caribe de Honduras (pp. 31-110, que es más de la mitad de la obra), los
      vocabularios shebayo y guayana, y el suplemento comparado arahuaco
      (`2 am`) donde no toca al taíno. Barridos por patrón. **Ahí está el
      kalinago** —las 23 entradas kalinago del lexicón— y es una sesión entera
      que esta parcela no hizo.

# ══════════════════════════════════════════════════════════════════════
# 1. LAS ABREVIATURAS DE GOEJE — sin esto no se lee una sola línea
# ══════════════════════════════════════════════════════════════════════
abreviaturas:
  T: taíno
  A: Arawak de Guayana — es el LOKONO. Goeje nunca escribe «lokono»
  C: caribe insular (kalinago). En 1928 lo abreviaba `IK`
  Cf: caribe insular, **habla de MUJERES** (`parler des femmes`)
  Ch: caribe insular, **habla de HOMBRES** (`parler des hommes`)
  G: caribe de Honduras (el garífuna de su tiempo)
  K / Kal: kalina (caribe continental de Guayana)
  Ach: achagua
  W: warao
  "At, Par, P, Arua, Gu, Bare, Maip, Pia, Mand, Kar, Kat, Si, Tar, Uar, Yuk, Ipu, Piro, Mach, Moxo, B": >-
    lenguas arahuacas y vecinas del continente; su lista está en Goeje 1928
    §182 y en la nota 3 de la p. 5
  '1 am': su vocabulario comparado arahuaco-maipure de 1928
  '2 am': el suplemento a ese vocabulario que este artículo publica
  e: '⚠️ marca del propio Goeje: «palabra taína que PASÓ a lenguas europeas o
    a dialectos criollos». Es su propia señal de tainismo panhispánico, y vale
    como tal: es la trampa 1 de esta campaña marcada por la fuente'
  Fr.: Friederici, *Hilfswörterbuch für den Amerikanisten*, Halle 1926
  'Lovén': Sven Lovén, *Origins of the Tainan culture*, Göteborg 1935
  'Zayas': Alfredo Zayas y Alfonso, *Lexicografía Antillana*, La Habana 1914
  aviso_de_lectura: >-
    el margen izquierdo del artículo lleva, para cada entrada, una columna de
    siglas (`T, 2 am 6`, `e, T, C, A?`…) que dice en qué lenguas la reconoce y
    a qué número de su vocabulario de 1928 remite. El OCR la arranca del sitio
    y la apila en bloques: por eso en este archivo esa columna NO se
    transcribe salvo donde se pudo emparejar sin duda.

# ══════════════════════════════════════════════════════════════════════
# 2. 🔴 CADENA DE CUSTODIA (skill §8) — lo primero que hay que leer
# ══════════════════════════════════════════════════════════════════════
cadena_de_custodia:
  lo_que_declara_goeje:
    de_donde_saca_las_formas_tainas: >-
      lo dice en la p. 5: el material taíno son **unas doscientas palabras y
      unas pocas frases** desperdigadas por los escritos españoles e italianos
      de los siglos XV y XVI. Él vuelve a sacarlas de ahí, no de listas
      posteriores.
    quien_hizo_listas_antes_que_el: >-
      Gilij, Rafinesque, von Martius, «Richardo (Pichardo?)», Brinton,
      Tavera-Acosta y Zayas y Alfonso.
    su_juicio_sobre_esas_listas: >-
      (parafraseado) el intento de Rafinesque acabó en fantasías; Brinton
      acertó al ver el parentesco taíno-arawak pero sus etimologías fallan a
      menudo; y Adam usó el vocabulario de Rafinesque-Martius **sin darse
      cuenta de que es poco seguro y de que contiene palabras tomadas de un
      diccionario caribe**.
  por_que_esto_importa_aqui: >-
    ese último juicio es la regla §8 de la skill escrita por el especialista
    del campo en 1939: una lista taína del XIX puede no ser una segunda
    atestación sino **la misma lista contaminada de caribe**. Y nombra al
    culpable: Rafinesque — el mismo que, según Brinton, inventó el nombre
    «taíno» truncando `nitayno`.
  jerarquia_que_esto_impone:
  - nivel: 1
    quien: el cronista del XVI (Colón, Pané, Mártir, Oviedo, Las Casas)
    valor: atestación
  - nivel: 2
    quien: Goeje 1939 y Brinton 1871
    valor: >-
      intermediarios que dicen QUIÉN atestigua. Cuando los dos dan la misma
      voz citando cronistas DISTINTOS, hay dos atestaciones; cuando citan al
      mismo, hay una.
  - nivel: 3
    quien: Rafinesque 1836 y quien copie de él
    valor: >-
      **no cuenta**, por el aviso del propio Goeje: mezcla caribe. Es el
      mismo criterio que la cuarentena de la campaña aplica a las listas
      contemporáneas, doscientos años antes.
  goeje_contra_brinton:
    coinciden_en: >-
      que la lengua de las Antillas Mayores es arahuaca, y que «taíno» no era
      el nombre de un pueblo ni de su lengua.
    goeje_es_mas_explicito: >-
      (parafraseado, p. 5) dice que no se atrevería a afirmar que el taíno
      fuera idéntico a la lengua antigua de las Antillas Menores, **ni que
      todas las palabras llamadas taínas pertenecieran a una sola lengua**; y
      que a falta de algo mejor se puede seguir usando el nombre.
    lo_que_esto_le_da_al_proyecto: >-
      es la autoridad citable —y de dominio abierto— para lo que el encargo
      esperaba sólo de Granberry y Vescelius 2004: **el taíno tampoco era una
      sola lengua**. Con una diferencia: Granberry asigna cada voz a una
      variedad; Goeje se niega a hacerlo y dice por qué. Las dos cosas sirven,
      y la segunda es gratis.
  remite_a_la_tierra_firme:
    que_dice: >-
      (parafraseado, p. 5) que las palabras de 'indio caribe', 'canoa',
      'ananás' —y quizá las de sonajero del médico, cliente, escabel, ceiba y
      onoto— dan testimonio de **relaciones antiguas de los taínos con la
      tierra firme de Sudamérica**.
    para_nosotros: >-
      esto es la ESFERA DE CONTACTO dicha por un arawakista en 1939, y nombra
      justo los campos que el lexicón tiene marcados como préstamo de esfera.
      Es apoyo externo para `ESFERA_DE_CONTACTO`, no un dato de lengua nuevo.

# ══════════════════════════════════════════════════════════════════════
# 3. EL VOCABULARIO TAÍNO
#
# Esquema del proyecto. `glosa_fuente` es la glosa de Goeje, en su francés y
# verbatim, de una a cuatro palabras. `fuente_que_declara_el_autor` es lo que
# ÉL cita para esa voz; `no-declarada` cuando no cita a nadie en la entrada —
# que es lo más frecuente, y es un dato.
# `campo` usa el vocabulario del proyecto, no el de Goeje.
# `en_el_lexicon` es la clave del lexicón si la hay, medida contra las 52 del
# censo de `taino_inventario_2026-09-21.yaml` §a.
# ══════════════════════════════════════════════════════════════════════
fuente_de_las_paginas: >-
  medidas, no escritas a mano: línea del txt → página de PDF → impresa
  (pdf − 1). Lo recalcula `consolidar_taino.py --check`.

vocabulario:

  # ── I. Partes del cuerpo y enfermedades (pp. 6-7) ───────────────────
  - forma_fuente: simu
    glosa_fuente: "front (aussi: commencement)"
    pagina_impresa: 6
    seccion: I. Parties du corps et maladies
    fuente_que_declara_el_autor: no-declarada
    variedad_o_isla: no-declarada
    campo: cuerpo
    en_el_lexicon: null
    correspondencia_lokono: 'A sibu ''visage'''
    nota: >-
      Brinton p. 12 da la misma voz (`Cimu / simu`, 'the front, forehead; a
      beginning') citando a Pedro Mártir p. 302. Goeje NO cita a nadie: es la
      misma voz por dos manos, y la atestación sigue siendo la de Mártir.
  - forma_fuente: bu-ti-k-ako
    glosa_fuente: "anda, para zarco de los ojos"
    pagina_impresa: 6
    seccion: I. Parties du corps et maladies
    fuente_que_declara_el_autor: no-declarada (es un insulto recogido en castellano)
    variedad_o_isla: no-declarada
    campo: cuerpo
    en_el_lexicon: null
    nota: >-
      Goeje agrupa tres INSULTOS taínos con glosa castellana de época. Son
      material morfológico: `bu-` 2ª persona, `ti` atributo, `k-ako` 'ojo'
      (comp. `aku` en el resto de las arahuacas).
  - forma_fuente: xey-ti-k-ako
    glosa_fuente: "anda, para negro de los ojos"
    pagina_impresa: 6
    seccion: I. Parties du corps et maladies
    fuente_que_declara_el_autor: no-declarada
    variedad_o_isla: no-declarada
    campo: cuerpo
    en_el_lexicon: null
    nota: "`xey` es 'negro' (ver §IV, donde Goeje remite a estos insultos)."
  - forma_fuente: m-ahi-te
    glosa_fuente: "anda, que te falte un diente"
    pagina_impresa: 6
    seccion: I. Parties du corps et maladies
    fuente_que_declara_el_autor: no-declarada
    variedad_o_isla: no-declarada
    campo: cuerpo
    en_el_lexicon: null
    nota: >-
      🔴 el PRIVATIVO `ma-` taíno en un enunciado real: `m-ahi-te` = 'sin
      diente'. Ver §morfologia_comparada.
  - forma_fuente: too
    glosa_fuente: mamelle
    pagina_impresa: 6
    seccion: I. Parties du corps et maladies
    fuente_que_declara_el_autor: no-declarada
    variedad_o_isla: no-declarada
    campo: cuerpo
    en_el_lexicon: null
    correspondencia_lokono: "A idyo"
  - forma_fuente: (ni)arima ~ tarima
    glosa_fuente: fesses
    pagina_impresa: 7
    seccion: I. Parties du corps et maladies
    fuente_que_declara_el_autor: no-declarada
    variedad_o_isla: no-declarada
    campo: cuerpo
    en_el_lexicon: null
    ocr: dudoso
  - forma_fuente: karakaro-l
    glosa_fuente: galeux
    pagina_impresa: 7
    seccion: I. Parties du corps et maladies
    fuente_que_declara_el_autor: no-declarada
    variedad_o_isla: no-declarada
    campo: cuerpo
    en_el_lexicon: null
    correspondencia_lokono: "A araka 'lépreux'"

  # ── II a. Religión y magia (pp. 7-8) ────────────────────────────────
  - forma_fuente: buhuitihu ~ buhili ~ bohiti
    glosa_fuente: homme-médecin
    pagina_impresa: 7
    seccion: II a. Religion, Magie
    fuente_que_declara_el_autor: no-declarada
    variedad_o_isla: no-declarada
    campo: creencia
    en_el_lexicon: bejique (con reserva — ver abajo)
    nota: >-
      🔴 Goeje da TRES formas para 'hombre-médico' aquí, y aparte, en la
      sección del CARIBE INSULAR del s. XV-XVI, pone `behiko` con la
      anotación «à Haïti, selon Las Casas». O sea: la forma que nuestro
      lexicón tiene (`bejique`) él la clasifica como **caribe insular usado en
      Haití**, no como taína, y la taína sería `buhuitihu`. Es el caso de
      etiqueta más caro de esta parcela y **lo decide Miguel**.
  - forma_fuente: Biberoci Guahagiona
    glosa_fuente: nom du dieu Guahagiona après sa guérison
    pagina_impresa: 7
    seccion: II a. Religion, Magie
    fuente_que_declara_el_autor: Pané (el ciclo de Guahagiona es suyo)
    variedad_o_isla: La Española
    campo: creencia
    en_el_lexicon: null
  - forma_fuente: maiohaua ~ maguey
    glosa_fuente: hochet de l'homme-médecin
    pagina_impresa: 8
    seccion: II a. Religion, Magie
    fuente_que_declara_el_autor: no-declarada
    variedad_o_isla: no-declarada
    campo: [creencia, objeto]
    en_el_lexicon: null
    correspondencia_lokono: "A maraka"
    nota: >-
      ⚠️ `maguey` aquí NO es el agave: es el sonajero. Y `maguey` 'agave' está
      además en la lista de 46 plantas que Goeje deja sin identificar, y en
      `6-fusion/tainismos_en_medina.yaml`. Dos cosas distintas con la misma
      grafía — ojo al cruzar por forma.
  - forma_fuente: guanara
    glosa_fuente: un lieu séparé (lieu d'initiation ?)
    pagina_impresa: 8
    seccion: II a. Religion, Magie
    fuente_que_declara_el_autor: no-declarada
    variedad_o_isla: no-declarada
    campo: creencia
    en_el_lexicon: null
    nota: >-
      Brinton p. 12 la da como 'a retired spot; a species of dove' citando
      «Pane, p. 444; Richardo». Goeje coincide en el sentido de 'lugar
      apartado' y NO recoge la paloma. Dos intermediarios, un solo cronista
      (Pané): **una atestación, no dos**.
  - forma_fuente: ka-hoba ~ k-ohoba ~ k-ogioba
    glosa_fuente: poudre ou fumée de tabac
    pagina_impresa: 8
    seccion: II a. Religion, Magie
    fuente_que_declara_el_autor: Friederici p. 32 y 71; Lovén p. 387
    variedad_o_isla: no-declarada
    campo: [creencia, flora]
    en_el_lexicon: cohiba
    correspondencia_lokono: null
    nota: >-
      🔴 Goeje la segmenta `ka-hoba`, con el ATRIBUTIVO `ka-` delante. Si eso
      es así, la raíz es `hoba` y `cohiba` de nuestro lexicón lleva el prefijo
      pegado. Y confirma la nota de Brinton de la primera campaña: no es la
      planta, es el polvo. Comparanda: Maipure `nupa`, achagua `nuba` («yopa»).
  - forma_fuente: tabako
    glosa_fuente: instrument pour respirer cette poudre
    pagina_impresa: 8
    seccion: II a. Religion, Magie
    fuente_que_declara_el_autor: no-declarada
    variedad_o_isla: no-declarada
    campo: [creencia, objeto]
    en_el_lexicon: tabako
    nota: >-
      la glosa de Goeje es la MISMA que la tradición da desde Oviedo: `tabako`
      es el instrumento (el canuto) y no la planta. El lexicón glosa la voz
      como la planta. Discrepancia de glosa, no de forma: va a curación, no se
      reescribe aquí (skill §8).
  - forma_fuente: digo
    glosa_fuente: herbe pour se laver ou se purifier
    pagina_impresa: 8
    seccion: II a. Religion, Magie
    fuente_que_declara_el_autor: no-declarada
    variedad_o_isla: no-declarada
    campo: [creencia, flora]
    en_el_lexicon: null
  - forma_fuente: semi
    glosa_fuente: dieux ou esprits qui leur apparaissent dans l'état de transe
    pagina_impresa: 8
    seccion: II a. Religion, Magie
    fuente_que_declara_el_autor: no-declarada
    variedad_o_isla: no-declarada

  rasgos:
    -
      rasgo: "clases de verbo: estativo vs. activo"
      comparanda: "perea-alonso-1942 pp. 634-640: la 4ª conjugación lokono es la de los ESTATIVOS (colores, tamaños, sabores, estados) — cule-n «ser rojo», ibe-n «estar lleno», hebbe-n «ser viejo» — y lleva el pronombre POSPUESTO; p. 598-599 y 608, la teoría de Quandt: cualquier nombre o adjetivo se hace verbo con a-/c- y terminación verbal"
      yaml: 6-fusion/lokono_gramatica_perea_1942.yaml §verbo_paradigmas
      sonda_canon: "cat de VOCABULARIO_BASE: ¿hay alguna que distinga estativo de activo?"
      citas:
        - perea-alonso-1942
    -
      rasgo: alineamiento y marcas de persona (prefijo transitivo / pospuesto estativo)
      comparanda: "perea-alonso-1942 pp. 635 y 652: dos juegos. Prefijados d-a-, b-a-, l-a-, t-a-, w-a-, h-a-, n-a- en los transitivos; pospuestos de, bu, i, n, u, hu, ye en estativos y negativos"
      yaml: 6-fusion/lokono_gramatica_perea_1942.yaml §los_dos_juegos_de_pronombres
      sonda_canon: "pronombres del canon: taya · pia · nüma · waya · naya, y su fuente"
      citas:
        - perea-alonso-1942
    -
      rasgo: posesión alienable / inalienable
      comparanda: "perea-alonso-1942 p. 587: índices personales sobre el nombre (da-si-kua «mi casa») y el índice ABSOLUTO u-/ù- «u-si-kua-hù = LA casa, sin poseedor», que es la marca de no-poseído; p. 586, posesivos absolutos da-kía «mío»"
      yaml: 6-fusion/lokono_gramatica_perea_1942.yaml §afijos.indices_personales
      sonda_canon: ¿alguna regla o entrada del canon declara alienable/inalienable o no-poseído?
      citas:
        - perea-alonso-1942
    -
      rasgo: ka- atributivo / ma- privativo
      comparanda: "van-buurt-2014 §8: ka- localizador «hay, existe(n)» (Casibari = «hay rocas duras»); perea-alonso-1942 p. 555: par mínimo k-ere-u-ti «casado» / m-ere-u-ti «soltero», c-a-nsi-ti «amante» (el que tiene afecto)"
      yaml: 6-fusion/lokono_gramatica_perea_1942.yaml §afijos.atributivo_y_privativo
      sonda_canon: "REGLAS_POSESIVAS['ka-'] y ['ma-']: función declarada y apoyo"
      citas:
        - perea-alonso-1942
        - van-buurt-2014
    -
      rasgo: número y colectivo
      comparanda: "perea-alonso-1942 p. 556: plural pospuesto -nu (wadi-li-nu «varones»), y los irracionales NO distinguen número (keyu «venado, venados», siba «piedra, piedras», adda «árbol, árboles»)"
      yaml: 6-fusion/lokono_gramatica_perea_1942.yaml §afijos.numero
      sonda_canon: "REGLAS_NUMERO: -kana y -naiki, su apoyo y su uso en la base"
      citas:
        - perea-alonso-1942
    -
      rasgo: género / clasificadores
      comparanda: "perea-alonso-1942 p. 554: no hay género gramatical, hay VARONIL y NO VARONIL, con sufijos -ti/-tti vr. y -tu/-ttu nv., y -nu plural común. neira-ribero-1762 (achagua) cambia el número según lo que se cuenta"
      yaml: 6-fusion/lokono_gramatica_perea_1942.yaml §afijos.genero
      sonda_canon: ¿alguna regla del motor marca género o clase nominal?
      citas:
        - neira-ribero-1762
        - perea-alonso-1942
    -
      rasgo: nominalización
      comparanda: "perea-alonso-1942 pp. 609-612: nombre de acción -hù (a-iyaha-dda-hù «andadura»), -hi en los en -en (c-a-nsi-hi «amor»); participios -ti/-tu/-nu; agentivo -ha-li-n; p. 561, instrumental y local -na sobre -coa- (a-balti-coa-na «asiento»), con el aviso del propio Perea: «son pocos los vocablos así formados»"
      yaml: 6-fusion/lokono_gramatica_perea_1942.yaml §afijos.instrumental_y_local
      sonda_canon: ¿alguna regla del motor deriva un nombre de un verbo?
      citas:
        - perea-alonso-1942
    -
      rasgo: aspecto de tres marcas -ka / -ni / -da
      comparanda: "el propio canon lo declara wayuu-derivado (2-lengua/morfologia.md §2). perea-alonso-1942 p. 606: el gramático sospecha que el aparato de TIEMPO de su fuente es «uno de los tantos perfeccionamientos a priori de los misioneros»; el futuro lokono atestiguado es -pa"
      yaml: 6-fusion/lokono_gramatica_perea_1942.yaml §las_tres_marcas_de_aspecto_del_canon
      sonda_canon: "¿alguna entrada caquetío-atestiguada del lexicón sostiene -ka, -ni o -da?"
      citas:
        - perea-alonso-1942
    -
      rasgo: reduplicación
      comparanda: "gatschet-1885: topónimos arubanos por duplicación de la raíz disílaba; perea-alonso-1942 p. 679: «recurso frecuente en nuestro Arawak», a-sucusu-n «lavar» → a-sucu-sucu-n «bautizar»"
      yaml: 2-lengua/morfologia.md §4 (REDUPLICACION en lexicon_toponimos.py)
      sonda_canon: ¿alguna regla del motor produce o reconoce reduplicación?
      citas:
        - gatschet-1885
        - perea-alonso-1942
    -
      rasgo: diminutivo
      comparanda: "zavala-reyes-2015 #166: -iro «desinencia que se usa en diminutivo»; van-buurt-2014 §6: -bi segundo diminutivo (gobí, kokorobí); perea-alonso-1942 p. 562: lokono -can (hia-ru-can «mujercita»)"
      yaml: 2-lengua/morfologia.md §1 y §5
      sonda_canon: "REGLAS_ZAVALA['-iro'] y el -bi de MORFEMAS_VAN_BUURT"
      citas:
        - perea-alonso-1942
        - van-buurt-2014
        - zavala-reyes-2015

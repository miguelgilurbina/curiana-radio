deuda_documental_de_las_reglas:
  con_forma_archivada:
    -
      regla: -kana
      tabla: REGLAS_NUMERO
      ejemplo: "piache + kana = los piaches, el conjunto de chamanes"
      forma: piache
  con_voz_de_otra_lengua:
    -
      regla: -kana
      tabla: REGLAS_NUMERO
      ejemplo: "wayuu + kana = wayuukana (el pueblo wayuu, todos los wayuu)"
      forma: wayuu
      lengua: wayunaiki
    -
      regla: -naiki
      tabla: REGLAS_NUMERO
      ejemplo: wayuu + naiki = wayuunaiki (la lengua wayuu)
      forma: wayuu
      lengua: wayunaiki
    -
      regla: -bacoa
      tabla: REGLAS_TOPONIMICAS
      ejemplo: ada + -bacoa = adabacoa (toda arboleda)
      forma: ada
      lengua: lokono
  con_forma_que_no_esta_en_el_lexicon:
    -
      regla: -gua
      tabla: REGLAS_LOCATIVAS
      derivado: Corogua
      ejemplo: "Coro + gua = Corogua (región de los cardones) → hoy: Coro"
      hay_gemela_con_k: false
    -
      regla: -bana
      tabla: REGLAS_LOCATIVAS
      derivado: Judibana
      ejemplo: "judi + bana = Judibana, cerro del viento (topónimo, testimonio de Miguel)"
      hay_gemela_con_k: false
    -
      regla: -kana
      tabla: REGLAS_NUMERO
      derivado: wayuukana
      ejemplo: "wayuu + kana = wayuukana (el pueblo wayuu, todos los wayuu)"
      hay_gemela_con_k: false
    -
      regla: -bacoa
      tabla: REGLAS_TOPONIMICAS
      derivado: adabacoa
      ejemplo: ada + -bacoa = adabacoa (toda arboleda)
      hay_gemela_con_k: false
    -
      regla: -bacoa
      tabla: REGLAS_TOPONIMICAS
      derivado: yacarebacoa
      ejemplo: yacare + -bacoa = yacarebacoa (pueblo del bosque)
      hay_gemela_con_k: false
  n_archivadas: 1
  n_otra_lengua: 3
  n_fuera_del_lexicon: 5
morfemas_del_canon_de_datos:
  -
    forma: -ana
    id: morfema-011
    glosado: false
    glosa: ""
    estatus: ""
    recurrencia: 6
    apoyo: "Forma atestiguada, **glosa retirada** (#109, decisión B, 2026-09-07). Tenía 'lugar de' con dos apoyos, Paraguaná y Curiana; Paraguaná no descompone con ella («Rodeada del mar», «conuco en medio del mar» en Esteves p. 56) y Curiana no tiene glosa de fuente. Censo de Esteves: 13 formas en -ana, 6 son -bana, 1 es -bana con h (Capuhana), 2 llevan el -ana en la raíz, 4 sin glosa, 0 'lugar de'. Compite con na 'como, semejante' (Zavala #184) y con -ná tónica de Paraguaná. Excluye -bana (#38, resuelto) y los -ana dentro de raíz (guariana, maracapana). El motor conserva -ana 'lugar de' como convención de la simulación (canon-simulación), no como dato."
    conflicto: ""
  -
    forma: -are
    id: morfema-002
    glosado: true
    glosa: "sitio de, paraje de (sufijo locativo)"
    estatus: NUEVO — despejado aquí por primera vez
    recurrencia: 5
    apoyo: ""
    conflicto: "⚠ van Buurt §5 recoge `-ure` (papiamentu -huri/-uri) glosado 'raíz' por Cruz Esteves 1989, y lo declara equivalente al `-ure` continental. La evidencia toponímica dice 'sitio de'. Glosa en disputa — misma situación que `-bana` (el tablero de decisiones D9)."
  -
    forma: -ari / -ri
    id: morfema-008
    glosado: false
    glosa: ""
    estatus: ""
    recurrencia: 7
    apoyo: "van Buurt glosa `rí` 'fuerte, duro, durable' solo dentro de Casibari. Falta comprobar si vale igual en los otros seis."
    conflicto: ""
  -
    forma: -bacoa
    id: morfema-001
    glosado: true
    glosa: "bosque, arboleda; formante toponímico de 'paraje cubierto de'"
    estatus: "CORROBORADO (no es nuevo: `bacoa` ya está en el lexicón como caquetío-atestiguado). Lo nuevo es su uso SUFIJAL productivo, que REGLAS_ZAVALA no recoge."
    recurrencia: 5
    apoyo: "Alvarado 1921, vía van Buurt §10: `-baca` 'grupo, matorral, espesura' en topónimos venezolanos (Yatu Bacu, Dauguaraubaca) · insular sin glosa: Barbacoa (Aruba), Maniguacoa (Curaçao)"
    conflicto: ""
  -
    forma: -bari
    id: morfema-010
    glosado: false
    glosa: ""
    estatus: ""
    recurrencia: 3
    apoyo: "⚠ INDICE_FUENTES ya concluyó que **`-bari` no es un afijo**; van Buurt lo explica como `bara`/`bari` 'árbol'. Coherente con que aparezca en posición final de topónimos."
    conflicto: ""
  -
    forma: -kuri / -curi
    id: morfema-009
    glosado: false
    glosa: ""
    estatus: ""
    recurrencia: 3
    apoyo: ya señalado en SUFIJOS_NO_CODIFICADOS de lexicon_gatschet.
    conflicto: ""
  -
    forma: -shi / -chi
    id: morfema-007
    glosado: false
    glosa: ""
    estatus: ""
    recurrencia: 22
    apoyo: "**El formante más frecuente del corpus insular y nadie lo ha glosado.** Ni Gatschet, ni van Buurt, ni Zavala. Es el objetivo nº 1 de cualquier minería futura de toponimia ABC."
    conflicto: ""
  -
    forma: ada-
    id: morfema-003
    glosado: true
    glosa: árbol
    estatus: NUEVO en el caquetío — pero con cognado arahuaco fuerte
    recurrencia: 2
    apoyo: "Lokono `ada` 'árbol' (cognado arahuaco directo) · van Buurt §5 documenta `bara`/`bari` 'árbol' (cf. Lokono balli) como OTRA raíz de árbol en el mismo sistema — no compiten"
    conflicto: ""
  -
    forma: bari-
    id: morfema-004
    glosado: true
    glosa: "rojizo, turbio (del color del agua o de la tierra)"
    estatus: REAGRUPACIÓN de dos entradas ya existentes
    recurrencia: 2
    apoyo: ""
    conflicto: ""
  -
    forma: wa-
    id: morfema-006
    glosado: true
    glosa: "prefijo de pluralidad / 'tener'"
    estatus: "CORROBORADO (van Buurt §6, de Goeje 1928) — nuevo es el apoyo toponímico continental"
    recurrencia: 2
    apoyo: ""
    conflicto: ""
  -
    forma: yacare
    id: morfema-005
    glosado: true
    glosa: "pueblo, poblado"
    estatus: NUEVO
    recurrencia: 2
    apoyo: ""
    conflicto: ""
morfemas_propuestos:
  -
    forma: -aima
    control_gatschet:
      - Kibaima
  -
    forma: -apana
    modulo: lexicon_van_buurt.py
    glosa: "hoja, estructura plana como una hoja"
    apoyo: "van Buurt §5 y §6 (watapana), de Goeje 1928"
    nota: "watapana ≈ 'tiene muchas hojas (pequeñas)'"
  -
    forma: -ato
    modulo: lexicon_van_buurt.py
    glosa: indica relación de parentesco
    apoyo: "Oliver 1989, vía van Buurt §6 (dato = 'hija del yato')"
    nota: ""
  -
    forma: -baca
    modulo: lexicon_van_buurt.py
    glosa: "grupo, matorral, espesura"
    apoyo: "Alvarado 1921, vía van Buurt §10 (Yatu Bacu)"
    nota: enlaza con la hoja de fuente alvarado-1921
  -
    forma: -bana
    modulo: lexicon_van_buurt.py
    glosa: "ancho, llano; también 'cubierto'"
    apoyo: "van Buurt §8 (Hudishibana) y §6 (sawaka/wakubana, vía Oliver)"
    nota: "el lexicón ya usa -bana como locativo 'orilla/borde': van Buurt documenta 'llano' y 'cubierto'. Discrepancia a resolver."
    control_gatschet:
      - Shiribana
      - Tarabana
      - Wakubana
      - Bushiribani
  -
    forma: -bi
    modulo: lexicon_van_buurt.py
    glosa: pequeño (diminutivo)
    apoyo: "van Buurt §6 (gobí, gogorobí, kokorobí, lobi, makambí)"
    nota: "segundo diminutivo documentado, junto al -iro de REGLAS_ZAVALA"
  -
    forma: -ima
    modulo: lexicon_van_buurt.py
    glosa: "húmedo, mojado"
    apoyo: "Cruz Esteves 1989, vía van Buurt §10 (topónimo Onima, Bonaire)"
    nota: "confirma de forma independiente el afijo -ima de REGLAS_ZAVALA (Zavala 2015: 'humedad, quebrada')"
    control_gatschet: []
  -
    forma: -iro
    control_gatschet: []
  -
    forma: -ubana
    control_gatschet:
      - Wakubana
  -
    forma: -uco
    control_gatschet: []
  -
    forma: -ure
    modulo: lexicon_van_buurt.py
    glosa: raíz
    apoyo: "Cruz Esteves 1989, vía van Buurt §5"
    nota: "van Buurt: papiamento -huri/-uri equivale al -ure caquetío de tierra firme; hurihuri, karishuri, marihuri tienen raíz usada"
  -
    forma: -uru
    control_gatschet:
      - Shabururi
      - Warerukuri
      - Antikuri
      - Kamakuri
      - Wariruri
      - Weburi
  -
    forma: -utu
    modulo: lexicon_van_buurt.py
    glosa: pez (raíz común a muchas lenguas arahuacas)
    apoyo: "van Buurt §6 (gutu, kasha kutu; topónimo Manparia Cutu)"
    nota: "van Buurt: la alternancia k/g es frecuente"
  -
    forma: abo
    modulo: lexicon_van_buurt.py
    glosa: lugar
    apoyo: van Buurt §9 (Cariatávo)
    nota: ""
  -
    forma: bala
    modulo: lexicon_van_buurt.py
    glosa: el mar
    apoyo: "van Buurt §8 (Balashi, Aruba)"
    nota: ""
  -
    forma: bara
    modulo: lexicon_van_buurt.py
    glosa: árbol
    apoyo: van Buurt §5; cf. Lokono balli
    nota: "explica kalabari, mashibari, stanibari, tarabara"
  -
    forma: cari
    modulo: lexicon_van_buurt.py
    glosa: "costa, orilla"
    apoyo: "Cruz Esteves 1989, vía van Buurt §9 (Cariatávo)"
    nota: "⚠ el lexicón tiene 'cari' sin cita: ver cobertura de las 82"
  -
    forma: hudi
    modulo: lexicon_van_buurt.py
    glosa: viento
    apoyo: "Cruz Esteves 1989, vía van Buurt §8 (Hudishibana = 'llano ventoso')"
    nota: ""
  -
    forma: ka-
    modulo: lexicon_van_buurt.py
    glosa: "localizador: 'hay', 'existe(n)'"
    apoyo: van Buurt §8 (Casibari)
    nota: ""
  -
    forma: rí
    modulo: lexicon_van_buurt.py
    glosa: "fuerte, duro, durable"
    apoyo: "van Buurt §8 (Casibari = 'hay rocas duras')"
    nota: ""
  -
    forma: siba
    modulo: lexicon_van_buurt.py
    glosa: "piedra, roca"
    apoyo: van Buurt §8 (Casibari; y el nombre de la isla de Saba)
    nota: ""
  -
    forma: tabo
    modulo: lexicon_van_buurt.py
    glosa: bifurcación de árbol o de río; confluencia
    apoyo: van Buurt §9 (Cariatávo)
    nota: ""
  -
    forma: wa-
    modulo: lexicon_van_buurt.py
    glosa: "prefijo de pluralidad y de posesión ('tener')"

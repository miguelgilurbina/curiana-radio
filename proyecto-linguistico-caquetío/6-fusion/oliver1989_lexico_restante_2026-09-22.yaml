# 6. LA TABLA A-1: UNA PÁGINA, NO UN VOCABULARIO
# ══════════════════════════════════════════════════════════════════════════
tabla_a1:
  pagina: 560
  que_es: >-
    «Table A-1: Paraujano Vocabulary from 1958-59 (courtesy of Johannes
    Wilbert)» es UNA página: el formulario «LISTA DIAGNOSTICA
    LEXICO-ESTADISTICA» (Swadesh-100) rellenado A MANO. No es el «vocabulario
    paraujano (añú) COMPLETO» que anunciaba tabla_a1_a7_swadesh.yaml.
  relacion_con_a2: >-
    Oliver dice (cap. 2, DOC ~p. 110) que de las 100 voces paraujanas «eleven
    are not available and six have been replaced by Spanish terms (Appendix A:
    Tables A1 and A2)»: la A-1 es la FUENTE de la columna paraujana de la A-2,
    que ya está transcrita, verificada por Miguel y en lexicon_a2.py.
  pendiente: "cotejar la A-1 manuscrita contra la columna paraujana de la A-2 (Oliver avisa de diferencias de alófono entre las dos). No se hizo aquí."

# ══════════════════════════════════════════════════════════════════════════
# 7. TRES VOCES QUE SALEN DEL CAP. 4 (arqueología), no del Apéndice A
# ══════════════════════════════════════════════════════════════════════════
# Oliver las da de pasada, en la descripción de los sitios y las pastas.
# Verificadas en imagen: p. 438 (pdf 465); la p. 447 (pdf 474) sobre OCR.
voces_del_cap4:

  - forma: Túcua
    obra: oliver-1989-cap4
    pagina_impresa: 438
    verificado: imagen
    texto: "«an intermittent creek named Túcua. The name itself is of Caquetío origin and glosses as 'point' or 'horn'; a reference to the way the mountain of Barroso prolongs diagonally to the coastal plains, ending in a distinct hill known as Cabimo»"
    es_ya: "no está en el lexicón ni en lexicon_toponimos (lo mide el script)"
    propuesta: >-
      Topónimo para la mesa de topónimos (skill campana-toponimos), con la
      glosa de Oliver como LECTURA, no como atestación: el cap. 2 (DOC p. 148)
      dice de dónde la saca — el lokono `ukoa (tucua)` 'cuerno' y el sufijo
      -coa 'punta, proa'. Es etimología suya por el lokono, no dato de un
      hablante. Capa: reconstruido. El sitio es FAL-60, el más antiguo fechado
      de la serie dabajuroide (cal. d.C. 944).
    region: Falcón occidental (Dabajuro) — fuera de Paraguaná, dentro de la Kaketiana

  - forma: zazare
    variante_en_fuente: "/çaçare/"
    obra: oliver-1989-cap4
    pagina_impresa: 438
    verificado: imagen
    texto: "«The Calcareous matrix (zazare /çaçare/) obtained from sedimentary concretions such as quartzite, calicte, and gypsum, is almost invariably used in the Ordinary Ware cooking and/or storage vessels»"
    es_ya: "no está (lo mide el script)"
    propuesta: >-
      NO al lexicón como caquetía: Oliver no dice de qué lengua es — la da en
      cursiva junto a `chamote` (castellano) como término local de alfarería.
      Candidata para el dictado de Medina y para la mesa de topónimos: el río
      ZAZÁRIDA (toponimo-097) comparte el arranque, y la coincidencia merece
      una pregunta, no una conclusión.
    epoca: moderno (término de las loceras de Falcón que Oliver oyó en 1981-83)

  - forma: guarataro
    obra: oliver-1989-cap4
    pagina_impresa: 447
    verificado: ocr (prosa limpia; la forma coincide con la de Esteves y Medina)
    texto: "«Shell tempering is by far the most common temper associated with Ordinary Ware [...] about 75% of the sample consisted of what is locally designated as guarataro; that is, a fossilized oyster (Tertiary?) that has been burned and crushed»"
    es_ya: "warataro — caquetío-atestiguado 'barro de loza, para la fábrica de budares y ollas' (Zavala #141 = Esteves); lexicon_toponimos cita a Medina Colina: «la tierra de grano que se mezcla con el barro de loza, el desgrasante»"
    propuesta: >-
      Nota en `warataro`: tercera fuente, independiente de Esteves y de Medina
      (prospección propia de Oliver, 1981-83), que CONVERGE con Medina en que
      es el DESGRASANTE y no el barro, y añade qué es materialmente: ostra
      fósil quemada y molida. La glosa de Zavala/Esteves ('barro de loza')
      queda en minoría. No se reescribe (minar-fuente §8): se anota, y la
      curación la decide Miguel.
    epoca: moderno (el término); el USO de concha como desgrasante es precontacto, medido en la cerámica de Corralito

# ─────────────────────────────────────────────────────────────────────────
# PROPUESTA — lengua. Un minador propone, el humano fusiona (regla 5).
# Tercera campaña de minería, parcela M1 (Oliver 1989, lo que quedaba a medias).
#
# Origen: Oliver 1989, Apéndice A — Tabla A-9 (pp. impresas 593-594 = pdf
# 620-621) y Tabla 8 / A-8 (pp. 591-592 = pdf 618-619) de
# fuentes_caquetios/Oliver_1989_Tesis_Arawakan_NW_Venezuela_UCL.pdf (escaneo
# UMI, desfase −27 en el Apéndice A, comprobado en la portadilla p. 559 = pdf 586
# y en la p. 593 = pdf 620). Y, para saber DE DÓNDE saca Oliver cada voz, el
# §2.8 del cap. 2 en la edición DOC que tiene el repo
# (`Chapter 2 Linguistics- Oliver 1989.pdf`, pp. 141-151 de ESA edición; en la
# tesis de 1989 el §2.8 va por las pp. ~157-169 según su índice).
#
# ✅ TODA la Tabla A-9 y las filas nuevas de la A-8 se leyeron EN IMAGEN el
#    2026-09-22 (pymupdf, recortes a 400 ppp). No es OCR.
#
# Las cifras de cruce con el lexicón NO están escritas a mano aquí: las mide
# `6-fusion/scripts/oliver1989_restante.py` y las deja en
# `6-fusion/medicion_oliver1989_restante_2026-09-22.yaml` (regla 1).
# ─────────────────────────────────────────────────────────────────────────

meta:
  recogido: '2026-09-22'
  campana: tercera campaña de minería, parcela M1
  obra: oliver-1989-apendice-a
  obra_auxiliar: oliver-1989-cap2   # de dónde saca Oliver cada voz (§2.8)
  estado: propuesta — nada fusionado
  medicion: 6-fusion/medicion_oliver1989_restante_2026-09-22.yaml
  script: 6-fusion/scripts/oliver1989_restante.py
  verificacion: imagen (Tabla A-9 entera; Tabla 8 pp. 591-592 entera)

# ══════════════════════════════════════════════════════════════════════════
# 1. LA TABLA A-9, ENTERA Y NUMERADA — leída en imagen
# ══════════════════════════════════════════════════════════════════════════
# Lo que corrige de 6-fusion/tabla_a9_oliver.yaml (que NO se toca: es el
# dictado de Miguel y su historia):
#   (a) La tabla tiene 50 filas y TODAS van numeradas, en orden alfabético.
#       Los «33 números sin asignar» se asignan leyendo la imagen: no hacía
#       falta adivinar nada.
#   (b) Faltaba una fila: la 48, `taboro`.
#   (c) Las cursivas no son tres filas sino CUATRO: la 4 `baperón` también va
#       en cursiva (se ve igual que la 40, la 41 y la 47). Siguen siendo tres
#       REFERENTES, porque la 47 dice en su columna fonética «(also baperón)»:
#       baperón y raporón son la misma calabaza de cal, escrita dos veces.
#   (d) La 17 `Capubana` NO tiene glosa española: «a hill in Paraguaná, cf. #2
#       and #16» ocupa las dos columnas de glosa. La fonética es `kapu-bana`.
#   (e) La glosa inglesa de la 46 `quicidi` es «(specific?) sierra»; la de la
#       48 `taboro`, «mountain (specific?)».
#   (f) La nota al pie trae una errata del original: «words in tialics are
#       probably not Caquetío, but from the Santa Marta area [chibchan?]».
#
# `fuente_en_oliver`: de dónde dice Oliver que saca la voz, en el §2.8 del
# cap. 2 (paginación DOC). La tabla NO da fuente por fila; el título dice
# «from the XVIth century» y el cap. 2 dice «various XVIth century sources».
# Donde el texto sí la da, a veces NO es del s. XVI (ver `epoca`).
# `polity`: regla 4. La Relación de Nueva Segovia de Barquisimeto de 1579
# (Arellano Moreno 1964) es de la polity de Barquisimeto, no de la costera.


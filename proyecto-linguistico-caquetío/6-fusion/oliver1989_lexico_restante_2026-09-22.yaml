# ══════════════════════════════════════════════════════════════════════════
# 2. QUÉ DE LA A-9 NO ESTÁ EN EL LEXICÓN, Y QUÉ SE PROPONE
# ══════════════════════════════════════════════════════════════════════════
# El estado de cada fila (activa / sólo referencia / ausente) lo mide el script
# contra VOCABULARIO_BASE (clave, forma_fuente, variantes), FUERA_DEL_HABLA y
# las tablas de referencia de lexicon_zavala.py (topónimos, antropónimos,
# descartados). Aquí va el JUICIO sobre cada una; la cuenta, en la medición.

propuestas_lexicon:

  - forma: busera
    variantes_en_fuente: ['busera (Oviedo)', 'buxera (Oliver A-9 n.º 12)']
    glosa_propuesta: "jagua, tinte negro-azulado (Genipa americana) con que se pinta el cuerpo"
    etiqueta_propuesta: caquetío-atestiguado
    procedencia:
      - {obra: oviedo-y-valdes-1852-1855, tomo: II, pagina: 300, texto: "«embixados y pintados de bixa y de xagua, que allí llaman busera»", verificado: imagen, por: 6-fusion/taino2_oviedo_venezuela.yaml}
      - {obra: oliver-1989-apendice-a, pagina: 593, texto: "12. buxera | bujera | pintura negra-Genipa | black body paint", verificado: imagen}
    epoca: contacto-temprano
    polity: costera
    polity_nota: "Oliver (tesis p. 283) asume que el funeral que describe Oviedo es el de la costa: «it is reasonable to assume that he is referring to that of Coastal Falcon». Es una suposición declarada, no un dato de Oviedo."
    por_que: >-
      No está en el lexicón bajo ninguna grafía (busera, buxera, bujera: 0 —
      medido). Es la ÚNICA voz de la A-9 con dos lecturas de glosa que se
      contradicen y la fuente primaria resuelve: Oviedo, en el cuerpo, llama
      busera a la XAGUA (negro) y pone la bixa (rojo) al lado como otra cosa.
      Oliver acierta en la A-9 («pintura negra-Genipa») y se equivoca en la
      n. 213 del cap. 3 (tesis p. 284: «a red vegetable pigment obtained from
      the Bixa orellana»), que es exactamente la glosa del EDITOR de Oviedo
      («almagre, almazarrón ó bija», t. IV p. 595). La trampa de datihao, otra
      vez: el glosario del editor no es el autor.
    ojo_regla_8: >-
      Oliver A-9 NO es segunda atestación independiente: su fuente para el
      funeral del díao es el mismo Oviedo (tesis p. 283-284, «Oviedo y Valdés
      [1526-1557] 1944 [6]: 41-42»). Una sola atestación, con Oliver como
      relectura (minar-fuente §8).
    dominio: creencia (el segundo funeral del díao, creencia-010c ya lo nombra)

  - forma: kama
    es_ya: "kama — caquetío-hipotético, 'tapir, danta' (DEGRADADA en F1 por «SIN_RASTRO real»)"
    propuesta: subir a caquetío-atestiguado, con polity barquisimeto declarada
    procedencia:
      - {obra: oliver-1989-apendice-a, pagina: 593, texto: "15. cama | K-ama | danta | tapir", verificado: imagen}
      - {obra: oliver-1989-cap2, pagina: 142, texto: '«The term "cama" or "çama" (probably /kama/) is defined as danta (Spanish) or tapir ([1579] Arellano Moreno 1964:183)»'}
    por_que: >-
      La nota de `kama` dice que no hay rastro y que su «ruta» era la fila
      'tapir' de la A-7, que no existe. La fila existe, pero en la A-9 (#15), y
      el cap. 2 da la fuente: la Relación de Barquisimeto de 1579. No es
      SIN_RASTRO: es una voz del s. XVI con cita primaria vía Oliver. Y hay
      tapir en el registro arqueológico de la costa: huesos de tapir en los
      fogones de Túcua (cap. 4, p. 439).
    cautelas:
      - "regla 4: la cita es de BARQUISIMETO. Para la polity costera no hay atestación directa."
      - "Oliver no transcribe la página de la Relación, la cita. Verificar en Arellano Moreno 1964 (no está en el repo) antes de citar la forma exacta."
    alternativa: "si Miguel no quiere atestiguada con cita de segunda mano, `caquetío-reconstruido` con esta procedencia — pero NO seguir en hipotético con «SIN_RASTRO», que ya es falso."

  - forma: auri
    es_ya: "auri — ACHAGUA (Neira y Ribero 1762, pliego 82): la clave está ocupada por la comparanda"
    propuesta: NO entrar como caquetío atestiguado. Si entra, `caquetío-reconstruido` con clave desambiguada (p. ej. `auri-caquetio`) y la nota de que es inferencia
    por_que: >-
      La A-9 lo lista sin reserva, pero el texto de Oliver dice que lo halló en
      una lista CUYÓN y que infiere el préstamo desde el caquetío de
      Barquisimeto. En la Tabla 8 (p. 592) está en la columna CUYON marcado
      «(ARAWAKAN)». Atestiguado lo está en achagua (1762) y en cuyón (listas de
      Jahn/Oramas); en caquetío, no. Es el cognado que Oliver usa como pilar de
      su filiación (cap. 2), así que conviene tenerlo escrito así.

  - forma: kaketio
    es_ya: "sólo como etnónimo/topónimo (lexicon_toponimos, lexicon_zavala); no hay nombre común en VOCABULARIO_BASE"
    propuesta: no entrar como 'ser viviente' atestiguado
    por_que: >-
      'ser viviente' / 'people (general)' es la ETIMOLOGÍA de Oliver por el
      lokono kakïtho (Taylor 1977), no una glosa de crónica. Si Miguel la
      quiere como nombre común, `caquetío-reconstruido` con esa nota.

  - forma: guaro
    es_ya: "fuera: lexicon_alvarado la descartó (F6) porque Alvarado 1921 p. 159 dice que la voz no se usa en Occidente"
    propuesta: dejarla fuera; anotar la contradicción
    por_que: >-
      Oliver la da como caquetía del s. XVI sin fuente; Alvarado, como voz del
      Oriente y el Zulia para el loro. En duda, degradar: queda fuera. El
      lexicón ya tiene dos voces atestiguadas para la cotorra (koro, waka).

  - forma: macoya
    es_ya: "no está en VOCABULARIO_BASE; lexicon_toponimos la trae en un contexto de lectura («macoyas de jajato»), no como voz"
    propuesta: candidata, sin fuente propia — `caquetío-reconstruido` como mucho, o esperar a Zavala/Medina
    por_que: "Oliver no da fuente. Una sola aparición y sin cita primaria no alcanza para atestiguada."

  - forma: quicidi
    es_ya: "kikuidi — caquetío-atestiguado 'serranía' (Zavala #211, forma_fuente quicuidi); y kidi 'cerro, altura' (Zavala #212)"
    propuesta: añadir `quicidi` (Oliver A-9 #46, fonémica kuicidi) como variante gráfica en las notas de kikuidi — NO entrada nueva
    por_que: "Misma glosa ('serranía') y forma casi idéntica. Comprobar si Oliver y Zavala beben de la misma fuente antes de contarla como segunda atestación (§8)."

  - forma: çabana / sabana
    es_ya: "kabana — caquetío-atestiguado 'sabana' (Zavala #51, forma_fuente «cabana»)"
    propuesta: revisar la clave contra la imagen de Zavala #51
    por_que: >-
      Oliver escribe ÇABANA y la transcribe /sabana/: la cedilla vale /s/. Si
      Zavala imprimió «Çabana» y el extractor perdió la cedilla, la clave
      `kabana` lee /k/ una letra que es /s/. Y Oliver la trata como la voz
      arahuaca (taína) que pasó al castellano, «definitively Arawakan, and very
      widespread» (cap. 2, p. 146): producto de la esfera, no voz caquetía
      propia. morfologia.md ya dice «probable préstamo castellano».

  - forma: báquiro
    es_ya: "DESCARTADOS_ZAVALA: «Lisandro Alvarado señala que es cumanagota»"
    propuesta: mantener el descarte como caquetía; anotar que Oliver la lista sin cursiva
    por_que: "Contradicción entre fuentes sin cita primaria de ninguno de los dos lados. Es voz de fauna: va también a la clave `fauna` del informe de mundo."

# ══════════════════════════════════════════════════════════════════════════
# 3. GLOSAS QUE LA A-9 CONTRADICE O PRECISA EN LO QUE YA ESTÁ
# ══════════════════════════════════════════════════════════════════════════
# No se reescribe ninguna glosa (minar-fuente §8): se proponen NOTAS.

notas_a_entradas_existentes:

  - clave: "-bana (morfema; D9)"
    hallazgo: >-
      Oliver glosa -bana como «surrounding» (A-9 #2) y lo explica por el
      lokono «'sorrounding' or 'expanse'», «roof (e.g. cover)» y el guajiro
      a-pana 'hoja' (cap. 2, p. 150). «A hill in Paraguaná» (#17) describe
      el REFERENTE de Capubana, no el sufijo.
    consecuencia: >-
      La ficha oliver-1989-apendice-a decía que la #17 daba a D9 «dos fuentes
      independientes para 'cerro'». Es falso: Oliver está del lado de
      'cubierto / alrededor', que es el mismo lado que van Buurt §6 — y la
      lectura de van Buurt §6 llega «vía Oliver» (morfologia.md §8), así que
      son UNA atestación, no dos. D9 no cae: sus seis apoyos de 'cerro' no
      incluían a Oliver. Lo que cae es la frase de la ficha.

  - clave: kumarawa
    hallazgo: "A-9 #25 cumaragua = 'viruela / smallpox'; #45 mene = 'viruela / pez derretida'"
    nota_propuesta: >-
      Tercera fuente para 'viruela' (con Arcaya 1920 sobre la Relación de
      Barquisimeto 1579 y la corrección de Zavala 'ciruela'), frente a
      'caracol de las costas de Paraguaná' (Alvarado 1921 p. 102), que es la
      glosa vigente por D10. Y una advertencia que ninguna nota tiene: la
      viruela llegó con los españoles (1518 en La Española), así que la
      acepción 'viruela' es colonial por construcción — la voz pudo nombrar
      otra cosa antes (¿las pústulas?, ¿la brea que burbujea, como `mene`?).
      Regla 3.

  - clave: dare
    hallazgo: "Oliver: «At present, in coastal Falcón we find the term dare for tooth, although it is known to just a few individuals in Paraguaná» (cap. 2, p. 146)"
    nota_propuesta: "La A-9 se titula «from the XVIth century», pero su fuente para `dare` es habla viva de Paraguaná en los años 80. La época de la atestación de Oliver es MODERNA."

  - clave: [baperon, raporon]
    hallazgo: "A-9 #4 y #47, las dos en cursiva: «probably not Caquetío, but from the Santa Marta area [chibchan?]»; y la #47 dice «(also baperón)»"
    nota_propuesta: >-
      Las dos están como caquetío-atestiguado (Zavala #27 y #220) sin la
      reserva de Oliver. Es el mismo caso que `hayo` (issue publicado): el
      paquete de la coca (hoja, calabaza de cal, leguminosa) que llega por la
      ruta sal↔oro con los coanaos (cap. 3, pp. 214-216). Y son UNA voz con
      dos grafías, no dos palabras. Propuesta: mismo trato que se decida para
      `hayo`.

  - clave: datihao
    hallazgo: 'A-9 n.º 32 glosa «señor / "lesser" chief»'
    nota_propuesta: "La glosa de Oliver viene de la entrada de glosario de Oviedo ed. 1944 (lema en mayúsculas); la campaña del taíno midió que esa entrada es del editor (1855). No suma atestación."

  - clave: [capu, kapubana]
    hallazgo: "la fuente de Oliver para capú es la Relación de BARQUISIMETO 1579; la de Capubana, una leyenda que él mismo oyó en Santa Ana (años 80)"
    nota_propuesta: "regla 4 y regla 3 declaradas: capú, Barquisimeto s. XVI; Capubana, Paraguaná moderno."

# ══════════════════════════════════════════════════════════════════════════
# 4. LAS CORRESPONDENCIAS FONÉTICAS: NO ESTÁN EN EL APÉNDICE A
# ══════════════════════════════════════════════════════════════════════════
correspondencias:
  medido: >-
    El Apéndice A son tablas y nada más: portadilla (p. 559, sin texto), la
    A-1 (p. 560) y las tablas A-2 a A-9. Ninguna página propone una
    correspondencia. Las C1-C13 están en el cap. 2 (Tabla 3, «Arawakan Phoneme
    Reflexes based on Matteson and Oliver», p. 112 de la tesis; y §2.5-2.8) y
    ya están minadas en 4-fuentes/oliver-1989-cap2.md, que es `minado`.
  lo_que_si_se_pudo_hacer: >-
    Ponerlas a predecir sobre la A-9 y sobre el lexicón (minar-fuente §2: «si
    de dos casos sacas una correspondencia, ponla a predecir»). El script
    cuenta las iniciales b-/p- y d-/t- de las voces NO cursivas de la A-9 y
    de las claves caquetío-atestiguado del lexicón. Resultado en la medición,
    §c1_c3.
  lectura_del_resultado: >-
    En la A-9 no hay NINGUNA voz con p- inicial, y las b- son muchas: C3
    (caquetío del lado lokono, /b/ y no /p/) no falla ahí. Pero la A-9 es una
    SELECCIÓN de Oliver hecha, en sus palabras, por su «higher degree of
    inference a correlation with other Arawakan languages»: está sesgada a
    favor de su hipótesis. En el lexicón atestiguado sí hay p- inicial (para
    'mar', el contraejemplo que el propio Oliver no explica, y los topónimos
    Paraguaná, Pueblo…). La medición lo separa; no es prueba de C3, es que C3
    no se rompe en su propia muestra.


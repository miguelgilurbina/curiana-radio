meta:
  obra_id: zayas-1931
  autor: Zayas y Alfonso, Alfredo
  titulo: Lexicografía antillana (2ª ed., La Habana, 1931, 2 tomos)
  campana: tercera campaña de minería — parcela Zayas (encargo 6-fusion/issues-pendientes/encargo-mineria-zayas.md)
  medido: '2026-09-23'
  estado: >-
    PROPUESTA (regla 5), PARCIAL. Prioridad baja y poco margen de uso: se leyeron
    las cuatro voces que Goeje apoya en Zayas, las 52 claves taínas del lexicón y
    las voces de la lista maestra sin cronista (clases ii y iii) que Zayas trae
    como cabeza de entrada. NO se barrió el diccionario entero (≈ 3.000
    cabezas: la mayoría topónimos y caciques de los repartimientos de 1514).
  fuente: >-
    fuentes_caquetios/Zayas_1931_Lexicografia_Antillana_2ed_t1.txt y _t2.txt (capa
    de texto del PDF de dLOC; un salto de página por hoja). Página impresa = página
    del PDF − 27 en el t. I y − 7 en el t. II (comprobado en seis puntos de cada
    tomo). Las imágenes por página se sirven sueltas en
    https://ufdcimages.uflib.ufl.edu/AA/00/08/98/31/0000N/NNNNN.jpg, con
    NNNNN = página del PDF + 10 en el t. I (medido: JPG 66 = p. 29, JPG 76 = p. 39,
    JPG 74 = p. 37) — no hace falta bajar los PDF de 381 y 441 MB para ver una página.
  ocr: >-
    La capa de dLOC es OCR y confunde c/e (`blaneo`, `yuea`), ñ/fi (`afio`), y se
    come glosas enteras en cursiva: `Anaquí.— i` en la capa es «Enemigo, en el
    dialecto Eyerí» en la imagen. Las citas de `texto` están NORMALIZADAS a ojo en
    esos errores evidentes; sólo las marcadas `verificado_en_imagen: sí` se
    cotejaron con la página. Verificar en imagen antes de citar una forma como exacta.
  derechos: >-
    Zayas murió en 1934: dominio público en origen y en EE. UU. según la lectura de
    la ficha (4-fuentes/zayas-1931.md), que no es un dictamen. Aquí sólo citas cortas.
  edicion: >-
    2ª ed. (1931). Las páginas que cita Goeje son de la 1ª (1914) y NO coinciden:
    anaiboa 1914 p. 32 → 1931 t. I p. 37; anaki p. 33 → t. I p. 39.
  la_regla_de_esta_transcripcion: >-
    Zayas es INTERMEDIARIO: no oyó taíno. En `fuente_que_declara_el_autor` va sólo
    el cronista o documento del XV-XVI que Zayas cita PARA LA VOZ (que la trae en el
    pasaje). Si lo cita sólo para la cosa (describe el animal o el objeto sin
    nombrarlo), el nombre va en `cronistas_citados_para_la_cosa` y NO en
    `fuente_que_declara_el_autor`, porque el consolidador cuenta cronistas por regex
    sobre ese campo. Toda etimología, traducción morfémica u opinión de origen es de
    Zayas (o del autor que él cite) y se marca `conjetura-del-autor`.
  clases_de_apoyo:
    documentada: Zayas cita un cronista del XV-XVI o un documento de época para la voz
    secundaria: sólo cita autoridades del XVII-XX (Pichardo, Bachiller, Pezuela, Brasseur…)
    afirmada-sin-fuente: la da por indígena y no dice de dónde
    conjetura-del-autor: sin cronista, y Zayas (o quien cita) analiza, traduce o supone → clase iii
    sacada-por-el-autor: Zayas la manda a otra lengua o dialecto
  campos_propios:
    agrupa_con: >-
      la forma con que la lista maestra YA tiene esta voz, cuando el lema del
      consolidador no las junta (j/h/x, ç/z/s): el lector debe unirla a
      `forma_fuente` con ` ~ ` para que caigan en el mismo grupo.
    efecto_en_la_lista: >-
      qué le haría esta entrada a la voz en `taino_lista_maestra_2026-09-22.yaml` si
      se engancha: `sube-de-ii-a-i`, `añade-cronista`, `no-cambia` (mismo cronista:
      copiar no es atestiguar), `sacada`, `conflicto`.
    lectura: >-
      nota del minador. NO debe pasarse al consolidador como `aviso`: nombra
      cronistas para descartarlos y el regex los contaría.


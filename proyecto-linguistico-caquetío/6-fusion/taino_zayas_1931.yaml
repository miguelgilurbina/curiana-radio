# ═══════════════════════════════════════════════════════════════════════════
# 1. LAS CUATRO VOCES QUE GOEJE 1939 APOYA EN ZAYAS (1914) CON PÁGINA
# ═══════════════════════════════════════════════════════════════════════════
voces_de_goeje:
- forma_fuente: Anaquí
  glosa_fuente: Enemigo, en el dialecto Eyerí de la isla de Boriquén.
  texto: 'Anaquí.—Enemigo, en el dialecto Eyerí de la isla de Boriquén.'
  pagina_impresa: 't. I, p. 39'
  fuente_que_declara_el_autor: no-declarada
  cronistas_nombrados: null
  otras_autoridades: null
  tipo_de_apoyo: sacada-por-el-autor
  sacada_del_taino: 'eyerí (Boriquén), según Zayas — la lista eyerí es la de Rafinesque vía Rochefort'
  variedad_o_isla: [Boriquén]
  campo: guerra
  en_el_lexicon: null
  lema_en_la_lista_maestra: anaki (ii-solo-secundaria, sólo Goeje)
  efecto_en_la_lista: sacada
  verificado_en_imagen: sí
  lectura: >-
    La capa OCR dice «Anaqui. i» y se come la glosa: la imagen (JPG 76) la da
    entera. Zayas no cita a nadie y la asigna al EYERÍ, que es la etiqueta de la
    lista de Rafinesque (caribe insular de Borinquen, según el bloque eyerí de
    Bachiller que ya está en la lista maestra). Goeje la pone en su taíno apoyado
    en Zayas sin decir «eyerí». La voz no gana cronista: pasa a sacada del taíno.
- forma_fuente: Anaiboa
  glosa_fuente: La flor de la yuca.
  texto: >-
    «De la flor de esta raíz, que se llama anaiboa, se hace un potaje blanco, que es
    muy sabroso» — Relación de la isla Española enviada al Rey D. Felipe II por el
    Licenciado Echagoían, Colección de Documentos Inéditos de Indias; «parece ser
    esta Relación del año 1561».
  pagina_impresa: 't. I, p. 37'
  fuente_que_declara_el_autor: >-
    documento de época: Relación del Licenciado Echagoían (c. 1561), en la
    Colección de Documentos Inéditos de Indias
  cronistas_nombrados: [Documento de época]
  otras_autoridades: null
  tipo_de_apoyo: documentada
  variedad_o_isla: [Haití]
  campo: alimentacion
  en_el_lexicon: null
  lema_en_la_lista_maestra: anaiboa (ii-solo-secundaria, sólo Goeje)
  efecto_en_la_lista: sube-de-ii-a-i
  verificado_en_imagen: sí
  lectura: >-
    ✅ Verificado en imagen (JPG 74). La única de las cuatro con fuente del XVI:
    un documento administrativo de 1561, no un cronista. Zayas añade que en Cuba
    «actualmente se dice naiboa», aplicado al almidón de la yuca: eso es dato de
    1931 (moderno), no del XVI. Goeje glosa «fleur, amidon de manioc» juntando las
    dos cosas.
- forma_fuente: Aura
  glosa_fuente: 'Ave de rapiña, y especie única de la familia de los buitres, en las Antillas. Cathartes Aura Lin.'
  texto: 'D''Orbigny opina que esta voz es originaria de la Guayana. En México se llama esta ave zopilote.'
  pagina_impresa: 't. I, p. 60'
  fuente_que_declara_el_autor: no-declarada
  cronistas_nombrados: null
  otras_autoridades: [D'Orbigny]
  tipo_de_apoyo: afirmada-sin-fuente
  variedad_o_isla: no-declarada
  campo: fauna
  en_el_lexicon: null
  lema_en_la_lista_maestra: 'anua (ii-solo-secundaria, sólo Goeje; `ocr: dudoso` en su transcripción)'
  efecto_en_la_lista: sin-voz-en-la-lista
  verificado_en_imagen: no
  lectura: >-
    🔴 `anua` NO EXISTE en Zayas 1931: ninguna cabeza ni mención (medido con
    variantes `anua`, `anúa`, `annua`, y en el cuerpo). La única voz de Zayas para
    el buitre es `Aura`, cuya posición alfabética en 1931 (t. I p. 60, entre Aumatex
    y Ava) cae donde Goeje cita la p. 52 de 1914 (las otras dos páginas de Goeje
    llevan el mismo desfase de 5-6 pp. entre ediciones). Y Goeje cita además
    Friederici p. 6, que es un diccionario de americanismos donde `aura` está. La
    lectura más probable: `anua` es `aura` mal leída (por Goeje o por el OCR de la
    transcripción de Goeje, que ya la marcaba `ocr: dudoso`). Ver el pasaje de Goeje
    p. 14 en imagen antes de corregir nada. Zayas no da cronista para `aura` y
    recoge que D'Orbigny la cree de la Guayana.
- forma_fuente: Manaya
  glosa_fuente: Cuchilla de piedra.
  texto: >-
    «Según las tradiciones haitianas, con una manaya le fué abierta a Caracaracoel
    la espalda hinchada, y le fué extraída una tortuga hembra.»
  pagina_impresa: 't. II, p. 180'
  fuente_que_declara_el_autor: '«las tradiciones haitianas» (el relato de Caracaracol), sin nombrar autor'
  cronistas_nombrados: null
  cronistas_citados_para_la_cosa: 'Pedro Mártir: que los indios cortan con piedras de río durísimas (no da la voz)'
  otras_autoridades: null
  tipo_de_apoyo: afirmada-sin-fuente
  variedad_o_isla: [Haití]
  campo: objeto
  en_el_lexicon: null
  lema_en_la_lista_maestra: manaya (clase i por Pané, vía Goeje)
  efecto_en_la_lista: no-cambia
  verificado_en_imagen: no
  lectura: >-
    El relato de Caracaracol es el de Pané, pero Zayas no lo nombra aquí: no añade
    atestación, y la sospecha de Goeje (¿voz italiana colada por la traducción de
    Ulloa?) queda como estaba. En `Manaya-Tiunel` (misma página) Zayas repite
    «manaya era la cuchilla de piedra o concha».

# ═══════════════════════════════════════════════════════════════════════════
# 2. LAS CLAVES TAÍNAS DEL LEXICÓN (las 52 de la lista maestra) QUE ZAYAS TRAE
# ═══════════════════════════════════════════════════════════════════════════
voces:
- forma_fuente: Haba
  glosa_fuente: Equivale a Jaba.
  texto: 'Casas da el verdadero significado: «cestillo hecho de palma, que en su lengua llamaban haba».'
  pagina_impresa: 't. II, p. 86'
  fuente_que_declara_el_autor: Las Casas
  cronistas_nombrados: [Las Casas]
  tipo_de_apoyo: documentada
  variedad_o_isla: no-declarada
  campo: objeto
  en_el_lexicon: abba
  efecto_en_la_lista: no-cambia
  lectura: >-
    Trampa del editor, medida por el propio Zayas: el editor de la primera
    Colección de Documentos Inéditos anotó «una haba de oro» como imitación en oro
    de un frijol. Zayas lo corrige con Las Casas. La nota del editor NO es dato.
- forma_fuente: Ají
  glosa_fuente: Planta de dos o tres pies de altura, y fruto muy usado como manjar, y sobre todo como condimento.
  texto: '«La pimienta montés de aquellas tierras, que llaman axi.» Vol. I, p. 229 (Las Casas).'
  pagina_impresa: 't. I, p. 27'
  fuente_que_declara_el_autor: 'Las Casas, Historia de las Indias, vol. I p. 229 y vol. V p. 305'
  cronistas_nombrados: [Las Casas]
  tipo_de_apoyo: documentada
  variedad_o_isla: no-declarada
  campo: flora
  en_el_lexicon: aji
  efecto_en_la_lista: no-cambia
  lectura: 'La cabeza sale sin raya en la capa («Aji. Planta…»): el parser de cabezas no la ve; se leyó a mano.'
- forma_fuente: Areito
  glosa_fuente: Baile y canto usados frecuentemente por los indios.
  pagina_impresa: 't. I, pp. 47-52'
  fuente_que_declara_el_autor: 'Oviedo; Las Casas; Gómara'
  cronistas_nombrados: [Oviedo, Las Casas, Gómara]
  tipo_de_apoyo: documentada
  variedad_o_isla: no-declarada
  campo: creencia
  en_el_lexicon: areito
  efecto_en_la_lista: añade-cronista
  lectura: >-
    Entrada de seis páginas; se leyeron las menciones, no el ensayo entero. Los
    tres cronistas se citan en el hilo del areíto; que cada uno escriba la VOZ en
    el pasaje citado no se comprobó uno por uno (la lista ya tenía Oviedo y
    Herrera). Si Miguel quiere contarlos, verificar Las Casas y Gómara.
- forma_fuente: Batata
  glosa_fuente: Voz más usada en España que en América para designar unas variedades del tubérculo llamado camote en México y boniato en Cuba.
  texto: '«Cavan también de la tierra —dice— unas raíces, que nacen naturalmente, y los indígenas llaman batatas.» (Pedro Mártir)'
  pagina_impresa: 't. I, p. 90'
  fuente_que_declara_el_autor: Pedro Mártir
  cronistas_nombrados: [Pedro Mártir]
  tipo_de_apoyo: documentada
  variedad_o_isla: no-declarada
  campo: flora
  en_el_lexicon: batata
  efecto_en_la_lista: añade-cronista
  lectura: La lista tenía sólo Oviedo; Mártir es un segundo cronista independiente.
- forma_fuente: Batey
  glosa_fuente: Lugar llano y limpio, a modo de plaza, que en los pueblos de indios de las Antillas se destinaba a los areitos y al juego de la pelota.
  pagina_impresa: 't. I, pp. 91-92'
  fuente_que_declara_el_autor: no-declarada
  cronistas_nombrados: null
  cronistas_citados_para_la_cosa: 'Las Casas, para el juego de pelota (el pasaje citado no trae la voz)'
  tipo_de_apoyo: afirmada-sin-fuente
  variedad_o_isla: no-declarada
  campo: sociedad
  en_el_lexicon: batey
  efecto_en_la_lista: no-cambia
- forma_fuente: Behique
  glosa_fuente: Sacerdote, hechicero y médico, entre los indios.
  texto: >-
    Formas que da Zayas: bohique, boitio, bohuti, bohito, buhu, buhito, buhu-ituhu.
    Toma de Las Casas lo de Cuba y de Pané lo de Haití («a los que llama bohuti y
    buhu-ituhu»).
  pagina_impresa: 't. I, pp. 99-101'
  fuente_que_declara_el_autor: 'Las Casas (Cuba); Pané (Haití: bohuti, buhu-ituhu)'
  cronistas_nombrados: [Las Casas, Pané]
  cronistas_citados_para_la_cosa: 'Pedro Mártir y Herrera, para prácticas del curandero, sin la voz'
  tipo_de_apoyo: documentada
  variedad_o_isla: [Cuba, Haití]
  campo: creencia
  en_el_lexicon: bejique
  efecto_en_la_lista: no-cambia
  lectura: '`behique` es la forma que Zayas «considera preferible»: es SU elección de lema, no la del cronista.'
- forma_fuente: Bija
  glosa_fuente: Arbusto, llamado en México achiote, de flores hermosas … semillas rojas, que tiñen de este color.
  pagina_impresa: 't. I, pp. 107-108'
  fuente_que_declara_el_autor: no-declarada
  cronistas_citados_para_la_cosa: 'Las Casas describe el arbusto («unos arbolitos tan altos como estado y medio…»); la voz no se vio en el pasaje'
  tipo_de_apoyo: afirmada-sin-fuente
  variedad_o_isla: no-declarada
  campo: flora
  en_el_lexicon: bixa
  efecto_en_la_lista: no-cambia
  lectura: '`bixa` ya está aclarada esta semana (Apologética p. 177). `Bixa.—Véase Bija` (t. I p. 111).'
- forma_fuente: Bohio
  glosa_fuente: Era el nombre genérico y común de la casa destinada a habitación.
  texto: '«por todas estas islas, como sea toda o cuasi toda una lengua, llamaban bohío a las casas» (Las Casas)'
  pagina_impresa: 't. I, pp. 112-113'
  fuente_que_declara_el_autor: Las Casas
  cronistas_nombrados: [Las Casas]
  cronistas_citados_para_la_cosa: 'el Almirante (vía Las Casas), para la forma de las casas'
  tipo_de_apoyo: documentada
  variedad_o_isla: 'las islas («toda o cuasi toda una lengua»)'
  campo: vivienda
  en_el_lexicon: bohio · bohío
  efecto_en_la_lista: no-cambia
  lectura: >-
    Zayas abre diciendo que la voz se usaba también en Centroamérica y partes de
    Suramérica: es afirmación suya, sin cita. Para la esfera interesa, pero no es dato.
- forma_fuente: Cacique
  glosa_fuente: El Jefe superior, a modo de Rey o soberano, de una colectividad, residente en determinada comarca.
  texto: >-
    «rey llamaban en la lengua desta isla (Tortuga) cacique» —Casas. «Llaman al rey
    cacique» —Martyr. López de Gómara dice que en Tierra Firme dábase al Señor
    principal, entre otros nombres, el de Cacique.
  pagina_impresa: 't. I, p. 131'
  fuente_que_declara_el_autor: 'Las Casas; Pedro Mártir; Gómara (para Tierra Firme)'
  cronistas_nombrados: [Las Casas, Pedro Mártir, Gómara]
  tipo_de_apoyo: documentada
  variedad_o_isla: [Tortuga, Tierra Firme]
  campo: sociedad
  en_el_lexicon: cacique · cacike
  efecto_en_la_lista: añade-cronista
  lectura: >-
    Añade Mártir y Gómara a Las Casas y Oviedo. Gómara lo sitúa en TIERRA FIRME,
    que es la esfera de la Kaketiana — pero Gómara nunca estuvo en Indias y escribe
    en 1552, cuando `cacique` ya era la palabra española para todo jefe indio: no
    prueba uso precontacto en la costa (regla 3).
- forma_fuente: Caimán
  glosa_fuente: Vocablo de la lengua de los indígenas que acaso se aplicó a las dos especies de cocodrilos existentes en las Antillas.
  pagina_impresa: 't. I, pp. 138-139'
  fuente_que_declara_el_autor: no-declarada
  cronistas_nombrados: null
  tipo_de_apoyo: afirmada-sin-fuente
  marca: '«acaso»'
  variedad_o_isla: [Cuba]
  campo: fauna
  en_el_lexicon: caiman
  lema_en_la_lista_maestra: kaiman (ii-solo-secundaria)
  efecto_en_la_lista: no-cambia
  lectura: Zayas no cita cronista y duda («acaso»). Sigue sin atestación primaria.
- forma_fuente: Caney
  glosa_fuente: 'la casa grande de los Señores y Caciques, que llamaban caney'
  texto: >-
    Oviedo: «Algunas son redondas, como un pabellón, y esta manera de casas se
    llama caney.» Herrera afirma que en lengua de Cuba caney era el bohío de forma
    circular.
  pagina_impresa: 't. I, p. 151'
  fuente_que_declara_el_autor: 'Oviedo; Herrera (lengua de Cuba)'
  cronistas_nombrados: [Oviedo, Herrera]
  tipo_de_apoyo: documentada
  variedad_o_isla: [Cuba]
  campo: vivienda
  en_el_lexicon: caney
  efecto_en_la_lista: añade-cronista
  verificado_en_imagen: no
  lectura: >-
    La primera cita («Un caney, o casa grande y principal…») lleva el nombre de su
    autor en la línea que el OCR se comió: probablemente Las Casas; verificar en
    imagen (t. I p. 151 = JPG 188) antes de sumarlo. Página impresa calculada por el
    desfase, no leída en la cabecera.
- forma_fuente: Casabe
  agrupa_con: 'cazabi'
  glosa_fuente: '«pan de yuca», alimento principal de los indios antillanos'
  texto: >-
    «La primera vez que hallamos la palabra casabe, es en la Relación que dió Ginés
    Navarro en 19 de noviembre de 1528. También la emplea el Cura de los Palacios,
    Andrés Bernáldez.» Las formas más usadas en los días siguientes al descubrimiento
    eran cacabí y cacaby.
  pagina_impresa: 't. I, p. 172'
  fuente_que_declara_el_autor: 'documento de época: Relación de Ginés Navarro (1528); Andrés Bernáldez, Cura de los Palacios'
  cronistas_nombrados: [Documento de época, Bernáldez]
  tipo_de_apoyo: documentada
  variedad_o_isla: no-declarada
  campo: alimentacion
  en_el_lexicon: casabe · cazabi
  efecto_en_la_lista: añade-cronista
  lectura: >-
    ⚠️ Bernáldez (†1513, *Memorias de los Reyes Católicos*, con datos del segundo
    viaje de Colón) es cronista del XV-XVI y NO está en `CRONISTAS` del
    consolidador. `Casabi.—En algunos documentos se lee así` (t. I p. 174). Página
    de Casabe calculada por el desfase.
- forma_fuente: Cayo
  glosa_fuente: Nombre dado por los indios a las islas pequeñas.
  texto: >-
    «Casas opina que lucayos podía significar como habitante de los cayos.»
    Conocemos dos documentos relativos a Cuba, de 1526 y 1580, donde se dice cayo al
    indio nacido en las islas.
  pagina_impresa: 't. I, pp. 186-187'
  fuente_que_declara_el_autor: 'documento de época (dos, de 1526 y 1580, sobre Cuba)'
  cronistas_nombrados: [Documento de época]
  cronistas_citados_para_la_cosa: 'Las Casas, sólo para la etimología de «lucayos» (opinión suya)'
  tipo_de_apoyo: documentada

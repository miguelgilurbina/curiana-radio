# 5. HALLAZGOS DE MUNDO (regla 7) — lo que no va al lexicón
# ══════════════════════════════════════════════════════════════════════
hallazgos_de_mundo:

  esfera_e_intercambio:
    - hecho: >-
        El eclipse obliga a CAMBIARLO TODO: los chacopati de junto a Araya,
        «quando la luna está eclipsada, júntanse contra ella é tírenle muchas
        saetas, creyendo que está enojada contra ellos, é que los ha de destruir á
        ellos é todos sus bienes: por lo qual luego dan orden en trocar é cambiar
        quanto tienen … porque son de opinión que, mudando las cosas de un dueño á
        otro, las aseguran … É aun van de unos pueblos á otros, á haçer los mismos
        cambios é truecos con sus veçinos é con quien pueden, hasta que no les
        queda joya ni otra cosa sin baratarla»
      pagina_impresa: [208, 385]
      tomo: I
      esfera: "3-mundo/corpus/creencia.yaml (el eclipse) + esfera-de-interaccion (el trueque ritual entre pueblos)"
      regla_4: "Araya, la orilla oriental; no se traslada al Golfete sin decidirlo"
      por_que_importa: >-
        Un intercambio GENERALIZADO entre pueblos disparado por un fenómeno
        celeste, con nombre propio en la lengua (`uchibican`) y en taíno
        (`serra`). Es un mecanismo de circulación de bienes de la esfera,
        atestiguado en una costa seca caribeña. Y el eclipse está en la cola
        de referentes de la simulación («día 3: el eclipse»).
    - hecho: >-
        Cubagua, sin agua, «nunca fué … poblada de indios por su esterilidad é
        falta de agua, y por esso venían á ella de otras islas y de la
        Tierra-Firme á pescar las perlas»; «los indios naturales de la
        Tierra-Firme … á çiertos tiempos del año passaban á la isla á aquella
        pesquería»
      pagina_impresa: [594, 595]
      tomo: I
      esfera: "esfera-de-interaccion; ecología de las islas"
      por_que_importa: >-
        El patrón isla-sin-agua usada por temporadas desde la costa y desde otras
        islas, para un recurso del mar. Es la forma en que el proyecto puede
        pensar el uso de islotes sin población fija. Cubagua, no el Golfete.
    - hecho: >-
        La técnica del buceo perlero es indígena y se describe: canoas de seis o
        siete nadadores, bolsa de red atada a la cintura o al cuello, y para
        bajar «échanse sobre los lomos dos piedras … asidas de una cuerda … é
        quando … quiere subirse, fáçilmente puede desechar las piedras»; algunos
        aguantan «un quarto de hora». Y los «señores particulares de los indios»
        le explican a Oviedo que los bancos se agotan y se reponen si se deja el
        placer y se vuelve después
      pagina_impresa: [607, 608]
      tomo: I
      epoca: colonial
      ojo: >-
        ⚠️ En 1535-1548 los buzos son ESCLAVOS indios de los vecinos de Cubagua.
        La técnica es indígena; el régimen, colonial (regla 3).
    - hecho: >-
        El mosaico de lenguas de la provincia de Venezuela, dicho por el obispo
        Bastidas: a los animales «los nombran en diversas provinçias
        diferençiadamente, porque son muy apartadas lenguas las de los indios, y
        en poco término de lenguas no se entienden los unos con los otros»; y
        Oviedo, de la costa de Cubagua: «otros nombres tambien les dan [a las
        perlas] por las muchas y diferençiadas lenguas de aquella costa é islas»
      pagina_impresa: {t_II: 331, t_I: 591}
      esfera: "3-mundo/esfera-de-interaccion.md — «un área cultural con muchas etnias conviviendo»"
      ojo: "es lo que la regla 4 dice con otras palabras, dicho en 1541 por un testigo de vista"

  paraguana_1534:
    - hecho: >-
        La costa norte de Paraguaná tiene «un arraçife é punta, que era de unos
        manglares; é háçese allí un ancón ó abrigo … al pié de las sierras»; en
        tierra, «dos canoas» varadas y «traça de piés descalços de indios». Los
        marineros dicen que «toda aquella tierra era muy estéril de agua»: cavan
        «xagueyes é poças» y no la hallan
      pagina_impresa: 532
      tomo: IV
      verificacion: imagen
      esfera: "3-mundo/corpus/ecologia.yaml (manglar, agua) + geografía"
    - hecho: >-
        Un hombre de Miraca y su hija bajan a la mar a pescar con «çierta fructa
        ó comida de la tierra»; su pueblo está a dos leguas tierra adentro; la
        mujer dice por señas que hay agua «é mucha»; y el capitán español manda
        «indios con jarros é otras vassijas de buen agua» a los náufragos. En la
        mesa de Miraca: perdiçes, conejos frescos y SALADOS, pan de maíz
      pagina_impresa: [533, 534]
      tomo: IV
      epoca: contacto-temprano
      esfera: "3-mundo/ (vida diaria de un nodo de Paraguaná) — con la reserva de que ya hay españoles viviendo allí"
    - hecho: >-
        La etiqueta colonial en el acto: un español dice que la tierra «ya
        debrian estar de guerra; é que eran caribes é malos», y lo que sigue es
        un encuentro pacífico, con agua y comida
      pagina_impresa: 533
      tomo: IV
      ojo: "`caribe` como insulto de conquista, no como etnia (cf. Oliver 1989 cap. 3, la oposición caribe/guaitiao)"

  creencia:
    - hecho: >-
        En la provincia de Venezuela, al morir un señor o indio principal,
        queman goma aromática «por derrame» y le meten en la sepultura una
        esportilla de ese incienso, que se conserva sin corromperse
      pagina_impresa: [203, 204]
      tomo: I
      esfera: "3-mundo/corpus/creencia.yaml"
      conflicto_con: >-
        creencia-010 (el funeral de los çaquitios es endocanibalismo de los
        huesos, t. II p. 297). Aquí hay SEPULTURA. Oviedo no dice qué gente ni
        qué comarca: la provincia tenía muchas (hallazgo anterior). No se
        contradicen si son pueblos distintos; no se funden.
    - hecho: >-
        La rémora se CRÍA y se le HABLA: los pescadores de Jamaica y Cuba la
        tienen en agua salada, la halagan y le dicen «que sea manicato … é que
        mire que ose aferrarse con el pescado mayor», y al sacar la presa le
        despegan «con dulçes palabras é dándole muchas graçias»; «tienen ellos
        creydo … que el pexe reverso entiende muy bien el sermón humano»
      pagina_impresa: [435, 436]
      tomo: I
      esfera: "3-mundo/corpus/creencia.yaml — cosmovisión marina (ANTILLANA, regla 4)"
    - hecho: "«Llaman los indios de aquesta Isla Española á la mar bagua» (el nombre del mar, con la advertencia contra `baygua`)"
      pagina_impresa: 436
      tomo: I
      esfera: "creencia / ecología marina (antillano)"

  ecologia_y_tecnica:
    - hecho: >-
        Los «magueyes» o chacopati, junto a Araya, viven sin agua dulce: comen la
        cepa cocida del maguey y beben «el çumo por sudor de fuego, á manera de
        destilallo», y cuando llueve beben de los charcos «como lo haría un perro
        ú otro animal … por estar criados é habituados á no la beber jamás»
      pagina_impresa: [208, 384, 385]
      tomo: I
      esfera: "3-mundo/corpus/ecologia.yaml — adaptación a la aridez en una península seca (analogía, NO dato de Paraguaná)"
    - hecho: "Meliponicultura: abejas sin aguijón criadas «en sus casas en unos calabaços grandes»; y miel de avispa comida (Venezuela)"
      pagina_impresa: 331
      tomo: II
      esfera: "3-mundo/corpus/ecologia.yaml"
    - hecho: "Conservación de la caza: palomas de paso en çeçina (Venezuela); conejos salados (Paraguaná, 1534)"

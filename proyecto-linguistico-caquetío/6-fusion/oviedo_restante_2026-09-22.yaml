# ── (d) EL MAR Y LAS AVES MARINAS ─────────────────────────────────────

  - nombre_en_fuente: "lobos marinos"
    especie_probable: "foca monje del Caribe (Neomonachus tropicalis) — probable, extinta"
    texto: >-
      «Muchos lobos marinos é muy grandes hay en estas mares destas Indias,
      assi por entre aquestas islas, como en las costas de la Tierra-Firme …
      Salen los lobos á dormir en tierra en muchas isletas ó partes de las
      costas … Tienen el pelo de sobre sí muy hermoso, como un terçiopelo muy
      lindo é muy negro, é otros de color bermejo, é otros pardos … é todas las
      mudanças que la mar haçe, se conosçen en el pelo destos animales»
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XIII
    capitulo: V
    pagina_impresa: [428, 429]
    lugar: "«por entre aquestas islas, como en las costas de la Tierra-Firme»"
    epoca: contacto-temprano
    sonido: "«é tienen tan profundo é pesado sueño é roncan tan reçio, que desde lexos se oyen; é assi, muchas veçes durmiendo, los matan de noche»"
    verificacion: ocr-limpio
    tambien_en: "t. IV lib. L cap. XXVIII, p. 585: en un isleo sin nombre de la ruta Cabo de la Vela–Santo Domingo (1548), «dormian roncando, como es costumbre, tan altamente, que desde lexos se oian»"

  - nombre_en_fuente: "tortugas de la mar … é hicoteas"
    especie_probable: null
    texto: >-
      «En la costa de la Tierra-Firme, y en especial en la villa de Acla é otras
      partes, las he visto de siete y de ocho palmos de luengo en la concha …
      Salen de la mar á poner sus huevos en tierra en los arenales de las
      playas … Quando los chripstianos ó los indios hallan rastro destas
      tortugas por el arena … trastórnanla con un palo»; y «Las hicoteas ó
      menores tortugas … se hallan en los lagos … á estas pequeñas llaman los
      indios hicoteas»
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XIII
    capitulo: VIII
    pagina_impresa: [432, 433]
    lugar: "costa de Tierra Firme (Acla, en el Darién) — las tortugas; La Española — las hicoteas"
    epoca: contacto-temprano
    sonido: null
    verificacion: ocr-limpio
    ojo: "`hikotea` ya está en el lexicón (vía Medina). Esta es la atestación de Oviedo, de LA ESPAÑOLA, «llaman los indios»"

  - nombre_en_fuente: manatí
    especie_probable: "manatí (Trichechus manatus)"
    texto: >-
      «assi como en esta Isla Española le quitaron su nombre é le dieron este,
      assi en la Tierra-Firme que hay muchos destos pescados, los nombran
      diverssamente, segund la diferençia de los lenguajes de las provinçias»;
      «En Tierra-Firme matan los ballesteros estos animales … desde una barca ó
      canoa … con una saeta con un harpon»
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XIII
    capitulo: IX
    pagina_impresa: [433, 434]
    lugar: "Tierra Firme (muchos, con nombres distintos según la lengua) y La Española"
    epoca: contacto-temprano
    sonido: null
    verificacion: ocr-limpio
    ya_en: "T1 cita la p. 433 por la caza; no recoge la frase de los nombres distintos en Tierra Firme"

  - nombre_en_fuente: "pexe reverso"
    especie_probable: "rémora (Echeneidae)"
    texto: >-
      «Quando los indios quieren guardar é criar algunos destos reversos para su
      pesquería, tómanlo pequeño é tiénenlo siempre en agua salada de la mar, é
      allí le dan á comer … é quando veen algún pescado grande, assi como
      tortuga ó sávalo … ó alguno destos manatís … toma el indio en la mano este
      pescado reverso é halágalo con la otra é díçele en su lengua que sea
      manicato, que quiere deçir esforçado é de buen coraçón»
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XIII
    capitulo: IX
    pagina_impresa: [435, 436]
    lugar: "«en la isla de Jamáyca y en la de Cuba»; y «se cree» que en La Española"
    epoca: contacto-temprano
    sonido: null
    verificacion: imagen
    ojo: "el pez CRIADO como herramienta de pesca y HABLADO: va a `hallazgos_de_mundo` (cosmovisión marina). Antillano, no de Tierra Firme"

  - nombre_en_fuente: "pescados … de la mar"
    especie_probable: null
    texto: >-
      «acá los hay muy buenos; assi como lisas grandes y pequeñas, é xureles, é
      bermejuelas, é moxarras, guabinas, palometas, dihahacas, sávalos,
      robalos, parguetes, corbinetas, cornudas, pulpos, tollos, caçones,
      sardinetas, agujas, lenguados, acedías, salmonados … hostias, almejas, é
      marisco de muchas maneras; langostas, cangrejos, xaybas, camarones, rayas
      muchas … anguilas, morenas … tiburones, lobos marinos, tortugas … muchas
      doradas … pexe vihuela, pescados voladores … Muchos marraxos é votos,
      toñinas, ballenas asaz»
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XIII
    capitulo: I
    pagina_impresa: 424
    lugar: "«estas mares é islas» (La Española y en general), sin separar Tierra Firme"
    epoca: contacto-temprano
    sonido: null
    verificacion: ocr-limpio
    ojo: "INVENTARIO castellano de la pesca, no voces indígenas (salvo `guabinas`). Sirve de lista de referentes para los agentes de fauna"

  - nombre_en_fuente: "pexe vihuela"
    especie_probable: "pez sierra (Pristidae) — «una espada orlada de unos colmillos … de una parte é de otra»"
    texto: >-
      «la mandíbula ú hoçico alto ó superior dél es una espada orlada de unos
      colmillos ó navajas de una parte é de otra, tan luenga como un braço de un
      hombre … Yo le he visto en el Darien, en la Tierra-Firme, tan grande que un
      carro con un par de bueyes tenia harta carga … Y también hay estos
      pescados en las costas desta é de las otras islas»
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XIII
    capitulo: III
    pagina_impresa: 426
    lugar: "el Darién (Tierra Firme) y las costas de las islas"
    epoca: contacto-temprano
    sonido: null
    verificacion: ocr-limpio

  - nombre_en_fuente: "peçes … que llaman roncadores, porque roncan"
    especie_probable: "roncador (Haemulidae) — probable"
    texto: >-
      «se mataron muchos peçes de los que llaman roncadores, porque roncan, é son
      bien armados de dientes y es buen pescado»
    obra: oviedo-y-valdes-1852-1855
    tomo: III
    libro: XXIX
    capitulo: XXI
    pagina_impresa: 111
    tambien_en: >-
      t. IV p. 12, el mismo puerto: «echados en una caldera una doçena dellos,
      no haçen menos ruido que otros tantos cochinos gruñidores … é llámanlos acá
      los hombres de la mar roncadores, é sónlo en tanta manera que yo no he
      visto cosa semejante, segund su mucho gruñir ó roncar»
    lugar: "puerto de la Possesion, costa de Nicaragua en la mar del Sur"
    epoca: contacto-temprano
    sonido: "«roncan»; «no haçen menos ruido que otros tantos cochinos gruñidores … segund su mucho gruñir ó roncar»"
    verificacion: ocr-limpio
    ojo: "Pacífico, no Caribe: el nombre castellano del pez sale de su sonido. Se anota por el sonido"

  - nombre_en_fuente: rabihorcados
    especie_probable: "rabihorcado (Fregata) — la descripción lo permite"
    texto: >-
      «Estas son grandes aves al paresçer é vuelan mucho, é lo mas continuo
      andan altos; son negros é quassi de rapiña … Tienen la cola mayor é mucho
      mas hendida que los milanos, é por esto los llamaron rabihorcados … Yo he
      visto estas aves mas de doscientas leguas dentro en la mar; pero en la
      Tierra-Firme hay muchos mas sin comparaçión que no en estas islas. Diçen
      los indios de la provinçia de Cueva, que el unto y enxundias de aquestas
      aves es muy bueno, para deshaçer las señales del rostro é de las heridas»
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XIV
    capitulo: I
    pagina_impresa: [440, 441]
    lugar: "la mar abierta y, sobre todo, Tierra Firme («muchos mas sin comparaçión»); el uso medicinal es de Cueva"
    epoca: contacto-temprano
    sonido: null
    verificacion: ocr-limpio

  - nombre_en_fuente: "páxaros bobos"
    especie_probable: "piquero / bobo (Sulidae) — la descripción lo permite"
    texto: >-
      «Estos son menores que gaviotas: tienen los pies como ánades é pósanse en
      el agua … é son tan bobas y esperan tanto que las toman muchas veçes á
      manos … Tómanse muchos entre estas islas é la Tierra-Firme»
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XIV
    capitulo: I
    pagina_impresa: 441
    lugar: "«entre estas islas é la Tierra-Firme»"
    epoca: contacto-temprano
    sonido: null
    verificacion: ocr-limpio

  - nombre_en_fuente: "alcatraçes (varias maneras) … gavinas é gaviotas"
    especie_probable: null
    texto: >-
      «Topan assi mesmo las naos, desque están ya çerca de las Indias, otras
      aves que llaman alcatraçes: estos son de muchas maneras … todas tienen los
      pies como ánsares ó ánades, porque son aves marítimas y exerçitadas en la
      pesquería … demás de muchas gaviotas é algunas gavinas; pero çerca … de
      acá de las Indias y en las costas de la Tierra-Firme, porque las gavinas é
      gaviotas no se apartan mucho de la tierra»
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XIV
    capitulo: I
    pagina_impresa: [441, 442]
    lugar: "la mar de las Indias y las costas de Tierra Firme"
    epoca: contacto-temprano
    sonido: null
    verificacion: ocr-limpio

  - nombre_en_fuente: "alcatraçes grandes … del papo"
    especie_probable: "pelícano pardo (Pelecanus occidentalis)"
    texto: >-
      «Son estos alcatraçes … como grandes ansarones, é son todos pardos … Tiene
      un pico tan grande como dos palmos … é la mandíbula baxa se abre tanto é
      haçe un papo que le va hasta el pecho … Los quales, quando vuelan, se
      suben en alto é tienen muy buena vista, é déxanse caer juntadas las alas
      en la mar, é viene hecho un ovillo, y del golpe que dá, como es grande,
      salta mucho el agua para arriba, y él toma el pexe é sale luego para suso
      sentado en el agua, é trágaselo»
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XIV
    capitulo: VI
    pagina_impresa: [444, 445]
    lugar: "«en esta Isla Española y en todas las otras islas y costas de la Tierra-Firme»"
    epoca: contacto-temprano
    sonido: "no de voz: «del golpe que dá … salta mucho el agua para arriba» (el ruido del zambullido)"
    verificacion: ocr-limpio

  - nombre_en_fuente: "passo de las aves"
    especie_probable: null
    texto: >-
      «Yo las he visto passar sobre el Darien … é sobre el Nombre de Dios é
      Panamá en la Tierra-Firme, en diversos años: é paresçe que va el çielo
      cubierto dellas, y tardan en passar un mes ó mas … Este viaje haçen en el
      mes de março … Las que destas aves mas baxan para tierra, son unas
      aguilillas negras é otras medianas, pero también águilas reales, é otras
      aves de muchas maneras … é todas ellas paresçen de rapiña»
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XIV
    capitulo: IX
    pagina_impresa: [447]
    lugar: "sobre el Darién, Nombre de Dios y Panamá (Tierra Firme), viniendo de Cuba"
    epoca: contacto-temprano
    sonido: null
    verificacion: ocr-limpio
    ojo: "MIGRACIÓN de rapaces en marzo, con cronología: dato de calendario para los agentes de fauna. Istmo, no Venezuela"

# ── (e) LOS ANIMALES DE TIERRA DE TIERRA FIRME (t. I, libro XII) ───────

  - nombre_en_fuente: "puercos … los llaman chuche … lo llaman baquira"
    especie_probable: "pecarí (Tayassuidae) — «el ombligo en medio del espinaço»"
    texto: >-
      «Muchas é grandes manadas de puercos hay naturales de la Tierra-Firme, y
      en Castilla del Oro, en la provinçia de Cueva, los llaman chuche, é los
      indios en otras provinçias lo llaman baquira … tienen el ombligo en medio
      del espinaço»
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XII
    capitulo: XX
    pagina_impresa: 409
    lugar: "Tierra Firme: `chuche` en Cueva, `baquira` «en otras provinçias»"
    epoca: contacto-temprano
    sonido: >-
      «é quando se embraveçen ó están enojados, baten las quixadas ú hoçico tan
      apriessa, como suelen las cigüeñas sonar el pico, dando tabletadas»
    verificacion: ocr-limpio

  - nombre_en_fuente: "ochí … tigre"
    especie_probable: "jaguar (Panthera onca)"
    texto: >-
      «aquellos animales que en aquella tierra los indios llaman ochí, llamáronles
      ellos tigre … Tiene la hechura de la cabeça como león ú onza … pintado de
      manchas negras»; «los indios llaman ochís en la lengua de Cueva, y en la de
      Nicaragua se diçe teguantí»
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XII
    capitulo: X
    pagina_impresa: [401, 402, 405]
    lugar: "Castilla del Oro (Cemaco, el Darién); Nombre de Dios; Nicaragua"
    epoca: contacto-temprano
    sonido: >-
      acosado por el perro: «y él regañando, mostrando los dientes» (p. 402);
      preso en el lazo: «dió un bramido … é cómo se sintió herido, dió otro
      bramido é un tirón» (p. 405)
    verificacion: ocr-limpio

  - nombre_en_fuente: "leones rasos / leones pardos / gato çerval"
    especie_probable: null
    texto: >-
      «Leones hay en la Tierra-Firme reales, pero son rasos, que en todo
      paresçen lebreles grandes escoçeses … son de color leonado» (p. 406);
      «Leones pardos hay en Tierra-Firme, bermejos é pintados de manchas negras»
      (p. 407); «Gato çerval es animal fiero é de la manera y hechura y color
      que los gatos pardillos pequeños … es el mas feroz animal que hay en la
      Tierra-Firme» (p. 406)
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XII
    capitulo: [XII, XIII, XIV]
    pagina_impresa: [406, 407]
    lugar: "Castilla del Oro, costas del Norte y del Sur"
    epoca: contacto-temprano
    sonido: null
    verificacion: ocr-limpio

  - nombre_en_fuente: raposas
    especie_probable: null
    texto: >-
      «Raposas hay en la Tierra-Firme, en las gobernaçiones de Castilla del Oro é
      en otras, en ambas costas del Norte é del Sur, é son bermejas; y otras hay
      tan negras como un terçiopelo muy negro, é son muy ligeras é maliçiosas, é
      algo menores que las de España»
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XII
    capitulo: XV
    pagina_impresa: 407
    lugar: "Castilla del Oro y otras gobernaciones de Tierra Firme"
    epoca: contacto-temprano
    sonido: null
    verificacion: ocr-limpio

  - nombre_en_fuente: "encubertados"
    especie_probable: "armadillo (Dasypodidae)"
    texto: >-
      «Estos son animales de quatro pies, é está cubierto todo de una cobertura
      ó pellejo de una sola concha duríssima … del tamaño de un perrillo gozque …
      é con aquellas [uñas] cavan tan apriessa … Son exçelente manjar é tómanlos
      con redes … é las mas veçes se toman, quando se queman los campos»
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XII
    capitulo: XXIII
    pagina_impresa: [411, 412]
    lugar: "Tierra Firme (sin provincia)"
    epoca: contacto-temprano
    sonido: null
    verificacion: ocr-limpio
    sonido_en_otra_parte: >-
      t. II lib. XX caps. IX-X, p. 46, el «caballo encubertado» del río de Sancta
      Cruz (Patagonia): «é gruñía como puerco»; Oviedo añade que él los había
      comido «en la Tierra-Firme, en la provinçia de Cueva y en la de
      Nicaragua». El gruñido es del animal austral, no del de Tierra Firme

  - nombre_en_fuente: "conejos é liebres"
    especie_probable: null
    texto: >-
      «Conejos é liebres hay en la Tierra-Firme … tienen el lomo é pelo como de
      liebre, é lo demas es blanco … Tómanse las mas veçes, quando se queman los
      montes, y assi mismo con lazos. Mas en Nicaragua … los indios los salan é
      tienen mucho tiempo assi en çeçina»
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XII
    capitulo: XXII
    pagina_impresa: 411
    lugar: "Castilla del Oro (lengua de Cueva) y Nicaragua"
    epoca: contacto-temprano
    sonido: null
    verificacion: ocr-limpio

  - nombre_en_fuente: churcha
    especie_probable: "zarigüeya / rabipelado (Didelphis) — la bolsa marsupial lo permite"
    texto: >-
      «hay un animal pequeño del tamaño de un conejo mediano, el hoçico muy
      agudo … la cola luenga é de la manera que la tiene el ratón … Aquestas
      churchas … se vienen de noche á las casas á comerse las gallinas … Por
      medio de la barriga, al luengo, abre un seno que haçe de su misma piel …
      é aquella hendedura … aprieta tanto que ninguno de los hijos se le cae»
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XII
    capitulo: XXVII
    pagina_impresa: 416
    lugar: "Castilla del Oro, «en especial en el Darien é en muchas partes de la lengua de Cueva»"
    epoca: contacto-temprano
    sonido: null
    verificacion: ocr-limpio

  - nombre_en_fuente: "hardas"
    especie_probable: "ardilla (Sciuridae)"
    texto: >-
      «Hardas hay en Tierra-Firme algo mayores que las de España, é no tan
      peludas ni tan bermejas … Estas de acá son muy buen manjar … é muerden
      mucho»
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XII
    capitulo: XXVIII
    pagina_impresa: 417
    lugar: "Castilla del Oro, provincias de la lengua de Cueva"
    epoca: contacto-temprano
    sonido: null
    verificacion: ocr-limpio

  - nombre_en_fuente: "gatos monillos … gatos grandes é negros"
    especie_probable: null
    texto: >-
      «Quando los hombres de guerra … passan por algún bosque, donde hay de unos
      gatos grandes é negros … assi como ven á los chripstianos … vienen por
      ençima de los árboles, saltando de rama en rama … é arrojar sobre los
      chripstianos [ramas] por descalabrarlos»
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XII
    capitulo: XXVI
    pagina_impresa: [414, 415, 416]
    lugar: "Castilla del Oro"
    epoca: contacto-temprano
    sonido: >-
      «los gatos dan voçes que paresçe que se apellidan … saltando de rama en
      rama é gritando»; el herido «dando muchos gritos, á los quales se juntaron
      un gran número de gatos»
    verificacion: ocr-limpio

  - nombre_en_fuente: "sapos … que comen"
    especie_probable: null
    texto: >-
      «aunque en la Tierra-Firme los comen en muchas partes é islas de la costa
      austral … Críanlos é ténenlos atados á çebo en algunas partes de la
      Tierra-Firme, para los comer después por muy presçiado manjar»
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XIII
    capitulo: X
    pagina_impresa: [437, 438]
    lugar: "Tierra Firme (sin provincia) y las islas de la costa austral"
    epoca: contacto-temprano
    sonido: null
    verificacion: ocr-limpio
    cero_verificado: "el capítulo de «ranas é sapos» NO describe su canto: se buscó `canta*`, `vo[zç]`, `ruydo` en las dos páginas"

# ── (f) LA ESPAÑOLA, SÓLO COMO COMPARACIÓN (y marcado así) ────────────
#    Entran porque describen SONIDO de animales que también viven en la
#    costa de Venezuela o de un pariente cercano. No son dato de la esfera.

  - nombre_en_fuente: "perros … mudos (La Española)"
    especie_probable: "perro doméstico indígena"
    texto: >-
      «Eran todos estos perros aquí en esta é las otras islas mudos, é aunque los
      apaleassen ni los matassen, no sabían ladrar»; y el experimento de Oviedo:
      llevó uno de Nicaragua a Panamá y «allí también estuvo mudo»
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XII
    capitulo: V
    pagina_impresa: [390, 391]
    lugar: "La Española (y el de Nicaragua)"
    epoca: contacto-temprano
    sonido: "«algunos gañen ó gimen baxo, quando les haçen mal»"
    verificacion: ocr-limpio
    solo_comparacion: true

  - nombre_en_fuente: "yvana (La Española)"
    especie_probable: "iguana"
    texto: "«y es tan callado animal, que ni grita, ni gime, ni suena, y está atado á do quier que le pongan, sin haçer mal alguno ni ruydo diez ó veynte dias é mas»"
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XII
    capitulo: VII
    pagina_impresa: 393
    lugar: "La Española"
    epoca: contacto-temprano
    sonido: "«ni grita, ni gime, ni suena»"
    verificacion: ocr-limpio
    solo_comparacion: true
    ya_en: "T1 tiene `yvana` como voz; no el silencio"

  - nombre_en_fuente: "aves noturnas (La Española)"
    especie_probable: null
    texto: >-

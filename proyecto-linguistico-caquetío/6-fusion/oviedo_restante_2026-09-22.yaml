# ══════════════════════════════════════════════════════════════════════
# OVIEDO Y VALDÉS — LO QUE QUEDABA DE LOS CUATRO TOMOS
# ed. José Amador de los Ríos, Real Academia de la Historia, 1851-1855.
# Tercera campaña de minería, parcela M3, 2026-09-22.
#
# PROPUESTA (regla 5). Nada de aquí entra al canon sin que Miguel lo fusione.
# No repite lo ya hecho: el vocabulario taíno del tomo I está en
# `taino_oviedo_valdes_1851.yaml` (T1) y el libro XXV de Venezuela en
# `taino2_oviedo_venezuela.yaml` (T6). Aquí va lo que esas dos parcelas
# dejaron sin leer: la HISTORIA NATURAL (libros VIII-XV del t. I, con la
# clave `fauna:` del preámbulo común), el LIBRO XIX (Cubagua y Margarita),
# los pasajes de la costa de Venezuela, Paraguaná y las islas fuera del
# libro XXV, y la medición de `guaitiao`.
#
# ⚠️ NADA DE ESTO ES PRECONTACTO (regla 3). Oviedo escribe entre 1514 y 1548;
# lo que cuenta de Tierra Firme es de 1498-1548. Todo lleva `epoca`.
# ⚠️ Y CASI NADA ES DE LA POLITY COSTERA (regla 4): Cubagua, Margarita,
# Araya, Paria y Santa Marta son otras orillas de la esfera o de fuera de
# ella. Cada entrada declara su lugar tal como la fuente lo declara.
#
# Las cifras de `meta.cobertura` las emite
# `6-fusion/scripts/medir_oviedo_restante.py` (regla 1).
# ══════════════════════════════════════════════════════════════════════
meta:
  parcela: "M3 — Oviedo y Valdés, los cuatro tomos, lo que queda"
  fecha: 2026-09-22
  campana: Tercera campaña de minería
  obras:
    # claves foráneas → 4-fuentes/bibliografia.yaml (regla 8)
    - oviedo-y-valdes-1851          # tomo I (libros I-XIX)
    - oviedo-y-valdes-1852-1855     # tomos II, III y IV
  generado_por: >-
    lectura del minador (agente Opus 5.5) sobre la capa de texto de los cuatro
    PDF, con verificación en IMAGEN de cada forma en cursiva que se propone y de
    cada descripción de sonido que se marca `imagen`. El tomo I se lee ahora en
    la copia íntegra descargada hoy (ver `meta.descarga`), que sí renderiza las
    impresas 155-614.
  convencion_de_citas: >-
    Las citas `verificacion: imagen` reproducen la página tal como está impresa
    (con su ç, su é conjunción y sus acentos del editor). Las `ocr-limpio` son la
    capa de texto con una sola corrección, la de la ç que el OCR da como g/f/r
    en posiciones donde el patrón está medido (`deçir`, `çierto`, `paresçe`);
    ninguna otra. Las voces en cursiva no se citan nunca sólo por OCR.

  cobertura: {}
  # ← lo escribe 6-fusion/scripts/medir_oviedo_restante.py (regla 1)

# ══════════════════════════════════════════════════════════════════════
# 1. FAUNA — el esquema común del preámbulo, más `tomo`, `libro`,
#    `capitulo` y `verificacion`.
#    Va PRIMERO porque la esperan tres agentes de fauna.
#    Orden: (a) Paraguaná y la provincia de Venezuela; (b) Cubagua,
#    Margarita y las islas de la costa; (c) la costa de Tierra Firme
#    (Santa Marta, Paria, Cumaná, Huyapari); (d) el mar y las aves marinas;
#    (e) los animales de tierra de Tierra Firme del libro XII; (f) lo de La
#    Española que sirve de comparación, separado y marcado.
#    `sonido` es verbatim o null: si Oviedo no dice cómo suena, no se inventa.
#    `especie_probable` sólo cuando la DESCRIPCIÓN de la fuente lo permite; si
#    no, null. Ninguna identificación de aquí es canon.
# ══════════════════════════════════════════════════════════════════════
fauna:

# ── (a) PARAGUANÁ Y LA PROVINCIA DE VENEZUELA ─────────────────────────

  - nombre_en_fuente: "perdiçes de las de la tierra"
    especie_probable: null
    texto: >-
      «é hízole dar muy bien de comer á él é á todos los que con él fueron,
      assi muchas perdiçes de las de la tierra como conexos frescos é salados,
      é pan de mahiz»
    obra: oviedo-y-valdes-1852-1855
    tomo: IV
    libro: L
    capitulo: "XX, §XIII"
    pagina_impresa: 534
    lugar: "Miraca, pueblo de Paraguaná a dos leguas de la costa y doce de Coro (junio de 1534)"
    epoca: contacto-temprano
    sonido: null
    verificacion: ocr-limpio
    ojo: >-
      Es la ÚNICA mesa de Paraguaná que Oviedo describe, y la sirve un capitán
      español (Pedro de Arranguiz) que vivía allí con otros cristianos: seis
      años después de la fundación de Coro. Qué comían los paraguaneros, sí;
      cómo se lo daban a los españoles, también. Informante: Chripstóbal de
      Sanabria, «vivá voce».

  - nombre_en_fuente: "conexos frescos é salados"
    especie_probable: null
    texto: "(la misma frase de arriba) «…como conexos frescos é salados, é pan de mahiz»"
    obra: oviedo-y-valdes-1852-1855
    tomo: IV
    libro: L
    capitulo: "XX, §XIII"
    pagina_impresa: 534
    lugar: "Miraca, Paraguaná (1534)"
    epoca: contacto-temprano
    sonido: null
    verificacion: ocr-limpio
    ojo: "conejo SALADO: conservación de la carne de caza en Paraguaná, 1534 (cf. las çeçinas de palomas de la p. 331 del t. II)"

  - nombre_en_fuente: "un indio é una su hija que venían á la mar á pescar"
    especie_probable: null
    texto: >-
      «Ydos estos compañeros á lo ques dicho, toparon un indio é una su hija
      que venían á la mar á pescar, é tomáronlos é lleváronlos adonde
      Chripstóbal de Sanabria y el piloto estaban con los demás echados á la
      sombra de los manglares»
    obra: oviedo-y-valdes-1852-1855
    tomo: IV
    libro: L
    capitulo: "XX, §XII"
    pagina_impresa: 533
    lugar: "costa de Paraguaná, un ancón de manglares al pie de las sierras (1534)"
    epoca: contacto-temprano
    sonido: null
    verificacion: imagen
    por_que_va_en_fauna: >-
      No nombra el pez, pero es la única escena de PESCA de paraguaneros en toda
      la obra: un hombre y su hija bajan de Miraca a la mar a pescar, y en la
      orilla hay «dos canoas» varadas (p. 532). La costa tiene manglar (p. 532).

  - nombre_en_fuente: "ossos hormigueros"
    especie_probable: null
    texto: >-
      «Los animales de la tierra, son los que hay por la mayor parte en toda la
      Tierra-Firme … de los que mas puntual mençion se haçe de esta provinçia
      son ossos hormigueros, tigres muchos, venados en grand número, é á
      manadas…»; y en el t. I: «También los hay en la provinçia de Veneçuela, y
      allí son estos animales de mucha fuerça, tanto que ha acaesçido derribar
      á un hombre de caballo y maltractarle; y en el año que passó de mill é
      quinientos é quarenta y uno … fué muerto un oso destos é le hallaron las
      canillas de los braços é de las piernas maçiças, lo qual yo supe del mismo
      obispo»
    obra: oviedo-y-valdes-1852-1855
    tomo: II
    libro: XXV
    capitulo: XXII
    pagina_impresa: 330
    tambien_en: "oviedo-y-valdes-1851, t. I, lib. XII cap. XXI, p. 411 (misma fuente: el obispo Bastidas)"
    lugar: "provinçia de Veneçuela (informe del obispo Rodrigo de Bastidas)"
    epoca: contacto-temprano
    sonido: null
    verificacion: imagen

  - nombre_en_fuente: "venados en grand número, é á manadas"
    especie_probable: null
    texto: "«venados en grand número, é á manadas, como en otras partes se suelen ver»"
    obra: oviedo-y-valdes-1852-1855
    tomo: II
    libro: XXV
    capitulo: XXII
    pagina_impresa: 330
    tambien_en: >-
      t. I lib. XII cap. XIX, p. 408: «en la gobernaçión de Castilla del Oro é
      Veneçuela é Sancta Marta … hay muchos çiervos é gamos é corços … é los
      indios señores é prinçipales son grandes monteros»; y t. II p. 303, los
      çaquitios de Coativa con «grandes pesquerías y savánas y muchos venados»
    lugar: "provinçia de Veneçuela"
    epoca: contacto-temprano
    sonido: null
    verificacion: imagen

  - nombre_en_fuente: "puercos … de dos géneros"
    especie_probable: "Tayassuidae (el del «ombligo en el espinazo»)"
    texto: >-
      «ovejas, puercos muchos y de dos géneros: los unos tienen el ombligo en el
      espinaço, y los otros son como los nuestros»
    obra: oviedo-y-valdes-1852-1855
    tomo: II
    libro: XXV
    capitulo: XXII
    pagina_impresa: 330
    lugar: "provinçia de Veneçuela"
    epoca: contacto-temprano
    sonido: null
    verificacion: imagen
    ojo: >-
      «ovejas» en la misma enumeración, sin más: no se sabe qué animal nombra.
      Se deja literal. El sonido del puerco del espinazo está en el t. I (ver
      `baquira`, más abajo).

  - nombre_en_fuente: "conejos … menores y alebrestados"
    especie_probable: null
    texto: >-
      «conejos tantos ó mas que en nuestra España; pero son estos menores y
      alebrestados»
    obra: oviedo-y-valdes-1852-1855
    tomo: II
    libro: XXV
    capitulo: XXII
    pagina_impresa: 330
    lugar: "provinçia de Veneçuela"
    epoca: contacto-temprano
    sonido: null
    verificacion: imagen

  - nombre_en_fuente: "pereça / perico ligero"
    especie_probable: "perezoso (Bradypodidae) — la descripción del t. I lo permite"
    texto: >-
      t. II p. 330: «Hay otros, que los españoles llaman la pereça y
      meritamente, y otros llaman perico ligero». t. I p. 412: «le pusieron el
      nombre muy apartado de su ser, pues seyendo espaçiosíssimo, le llamaron
      ligero, y en la provinçia de Veneçuela le llaman la pereza»
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XII
    capitulo: XXIV
    pagina_impresa: [412, 413]
    lugar: "descrito en Castilla del Oro (el Darién); el nombre «pereza» es el que se le da en la provinçia de Veneçuela"
    epoca: contacto-temprano
    sonido: >-
      «Su voz es muy diferente de todas las de los otros animales del mundo (y
      de noche solamente suena), y toda la noche en continuado canto de rato en
      rato, ó con medida de pausas, cantando seys puntos uno mas alto que otro
      siempre baxando, assi que el mas alto punto es el primero, é de aquel
      baxa, disminuyendo la voz ó menos sonando, como quien dixesse la… sol…
      fa… mi… re… ut…, assi este animal diçe ha… ha… ha… ha… ha… ha… Y tanto
      quanto tarda en cantar estos seys puntos, otro tanto espaçio ó pausa
      calla, é torna á cantar en el mismo tono é medida otra vez é á callar, é
      por esta orden passa la noche toda en esta su música»
    verificacion: ocr-limpio
    ojo: >-
      La descripción de SONIDO más precisa de toda la obra: seis notas
      descendentes de un tono cada una, pausa igual a la frase, sólo de noche,
      «ha» seis veces. Pero la oyó en el Darién, no en Venezuela: de Venezuela
      es sólo el NOMBRE «pereza» (castellano). Si vive o no en la esfera es
      pregunta para los agentes de fauna.

  - nombre_en_fuente: "armados / coríes"
    especie_probable: null
    texto: >-
      «Armados cories hay, pero son mayores que los desta isla y el pelage
      tiénenlo mas áspero y de la forma el pelo de las hardas»
    obra: oviedo-y-valdes-1852-1855
    tomo: II
    libro: XXV
    capitulo: XXII
    pagina_impresa: [330, 331]
    lugar: "provinçia de Veneçuela"
    epoca: contacto-temprano
    sonido: null
    verificacion: imagen
    lectura: >-
      En la página sólo `cories` va en cursiva. Leo DOS animales sin coma entre
      ellos: `armados` (así llama Oviedo a los armadillos en el t. II p. 221,
      «animales de los que llaman armados ó encubertados») y `coríes`, «mayores
      que los desta isla», es decir el `cori` de La Española (t. I p. 390). En
      duda: podría leerse «coríes armados». No se decide aquí.

  - nombre_en_fuente: hardas
    especie_probable: "ardilla (Sciuridae) — «harda» es el nombre castellano de la ardilla"
    texto: "«muchas hardas por los boscajes»"
    obra: oviedo-y-valdes-1852-1855
    tomo: II
    libro: XXV
    capitulo: XXII
    pagina_impresa: 331
    lugar: "provinçia de Veneçuela"
    epoca: contacto-temprano
    sonido: null
    verificacion: imagen

  - nombre_en_fuente: "dantas … vacas … beoris"
    especie_probable: "tapir (Tapirus)"
    texto: >-
      «dantas en mucha cantidad, é otros las llaman vacas, é los indios en la
      provinçia de Cueva las diçen beoris; pero assi estos como los otros
      animales todos, los nombran en diversas provinçias diferençiadamente,

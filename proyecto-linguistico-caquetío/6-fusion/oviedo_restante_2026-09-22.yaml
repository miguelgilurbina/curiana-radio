  - nombre_en_fuente: perdiçes
    especie_probable: "codorniz crestada (Colinus cristatus) — la descripción del copete lo permite"
    texto: >-
      «Perdiçes hay muchas, y son del grandor de las codorniçes y de la misma
      pluma, salvo que tienen las cabeças como las cogujadas assi levantada la

# ══════════════════════════════════════════════════════════════════════
# 2. VOCES DE TIERRA FIRME, DE LA COSTA DE VENEZUELA Y DE SUS ISLAS
#    Esquema de `taino_oviedo_valdes_1851.yaml`. `atribucion` es lo que
#    Oviedo declara, no lo que nosotros suponemos. Ninguna de estas es
#    caquetía declarada; varias son de la provinçia de Veneçuela, que en
#    1548 es la gobernación de los Welser entera (regla 4).
# ══════════════════════════════════════════════════════════════════════
voces_de_tierra_firme:

  # ── 2.a Provinçia de Veneçuela (los capítulos que Oviedo añadió al t. I
  #        con la información del obispo Bastidas; ver `correcciones` §5)
  - forma_fuente: dactos
    forma_en_el_cuerpo: dacto
    glosa_fuente: >-
      Título del cap. XXVII: «De unos cardos altos é derechos mayores que lanças
      de armas (é aun como picas luengas), quadrados y espinosos, á los quales
      llaman los chripstianos çirios, porque paresçen çirios ó hachas de çera …
      los quales llaman los indios de Veneçuela dactos». Cuerpo: «el muy
      reverendo señor obispo de Sanct Johan, que primero lo fué de Veneçuela …
      diçe que allá es muy buena fructa la que llevan ó produçen, la qual llanan
      [sic] dacto, é críanse çerca de la costa … é dan una fructa en seys meses
      del año, é comiençan por abril ó mayo, é es del grandor de una mançana
      mediana este fructo, é toda la corteça cubierta de espinas … é lo de
      dentro es de comer é quassi como pitahaya»
    tomo: I
    libro: VIII
    capitulo: XXVII
    pagina_impresa: [311, 312]
    atribucion: "«los indios de Veneçuela» (título); informante declarado: el obispo Rodrigo de Bastidas"
    campo: [planta, ecologia]
    verificacion: imagen
    en_el_lexicon: "sí — `dato` 'fruto del cardón' (lexicon_zavala.py, Zavala #105 HB), SIN cita de Oviedo"
    aporta: >-
      🟢 Primera fuente primaria de `dato` en el tomo I, con OTRA grafía
      (`dactos`/`dacto`, con -ct-), con estación de fruto (abril-mayo, seis
      meses) y con «críanse çerca de la costa». T6 halló `datos` en el t. II
      p. 331 (el mismo informante). La impresa dice `llanan` por `llaman`: errata
      de la edición, no del OCR.

  - forma_fuente: mamon
    glosa_fuente: >-
      «En la provinçia de Veneçuela, en la Tierra-Firme, hay muchos árboles tan
      grandes como gentiles laureles … Esta manera de árbol llaman allí los
      indios mamon. La fructa dél es tamaña como una nuez … tiene una carnosidad
      algo agra y no de mal sabor. El cuesco es tan grande como una avellana, y
      de muchos cuescos destos, tostados é molidos, haçen pan los indios para
      comer en tiempo de hambre»
    tomo: I
    libro: VIII
    capitulo: XLIII
    pagina_impresa: 327
    atribucion: "«llaman allí los indios» — provinçia de Veneçuela"
    campo: [planta, alimentacion]
    verificacion: imagen
    en_el_lexicon: "no como voz (sólo en listas de topónimos de flora de `barrer_mapa.py`)"
    aporta: "el PAN DE HAMBRE de semilla de mamón tostada: dato de subsistencia en años sin maíz"

  - forma_fuente: çimirucos
    glosa_fuente: >-
      «En la Tierra-Firme, en la provinçia é gobernaçión de Veneçuela, hay unos
      árboles pequeños, de ocho ó diez palmos de alto … Llámanse çimirucos:
      tienen la hoja como çiruelo: la fructa que produçen, es como çereças … é
      sabe un poco á membrillos. Cójese esta fructa dos veçes en el año»
    tomo: I
    libro: VIII
    capitulo: XLIV
    pagina_impresa: 328
    atribucion: "provinçia de Veneçuela (sin decir «los indios»)"
    campo: [planta, ecologia]
    verificacion: imagen
    en_el_lexicon: "no"
    aporta: >-
      Segundo pasaje del semeruco (T6: `çemyrucos`, t. II p. 331), con otra
      grafía (`çimiruco`) y con DOS cosechas al año. ⚠️ No es independiente del
      de T6: mismo informante (ver `correcciones` §5).

  - forma_fuente: comoho
    glosa_fuente: >-
      «Esta fructa y aun el cardo en que nasçe, se llama comoho en la provinçia
      de Veneçuela … é en aquella borra los indios haçen vino desta fructa … este
      comoho es mas sabroso mucho que las tunas … é menores que las desta isla …
      Y el vino ques dicho, es tinto, de la color de vino tinto de uvas»
    tomo: I
    libro: VIII
    capitulo: XXVIII
    pagina_impresa: [314, 315]
    atribucion: "provinçia de Veneçuela"
    campo: [planta, bebida]
    verificacion: ocr-limpio
    ya_en: "T1 (pp. 313-314) y T6 (t. II p. 331). Lo NUEVO aquí es el VINO: «los indios haçen vino desta fructa», tinto"
    en_el_lexicon: "sí — `komoho` 'higo' (lexicon_zavala.py, Zavala #88 HB)"

  - forma_fuente: "encienso (árboles de la goma)"
    glosa_fuente: >-
      «En la provinçia de Veneçuela en la Tierra-Firme hay çiertos árboles que
      echan çierta goma de sí … que paresçe natural ençienso, é assi huele como
      ençienso, quemándolo. E acostumbran los indios en aquella tierra, quando
      algún señor ó indio prinçipal se muere, que queman deste ençienso ó goma
      por derrame, é le meten en la sepoltura en una esportilla alguna cantidad
      deste ençienso»
    tomo: I
    libro: VI
    capitulo: XVI
    pagina_impresa: [203, 204]
    atribucion: "«los indios en aquella tierra» — provinçia de Veneçuela"
    campo: [planta, creencia]
    verificacion: ocr-limpio
    en_el_lexicon: "no hay voz: Oviedo no da el nombre indígena. Va a `hallazgos_de_mundo`"

  # ── 2.b Cubagua, Margarita y la costa de Cumaná-Araya (la orilla oriental)
  - forma_fuente: [thenocas, coçixas]
    glosa_fuente: >-
      «Alli en aquella provinçia de Cubagua é por aquella costa de Tierra-Firme
      llaman á las perlas thenocas é tambien las diçen coçixas, é otros nombres
      tambien les dan por las muchas y diferençiadas lenguas de aquella costa é
      islas»
    tomo: I
    libro: XIX
    capitulo: I
    pagina_impresa: 591
    atribucion: "Cubagua y «aquella costa de Tierra-Firme» (Cumaná, Araya); Oviedo avisa de que son varias lenguas"
    campo: [objeto, mar]
    verificacion: imagen
    forma_ocr_cruda: "Ihenocas · corixas"
    en_el_lexicon: "no"
    ojo: "el OCR da `Ihenocas` y `corixas`: las dos voces habrían entrado mal sin la imagen íntegra"

  - forma_fuente: yaguaraha
    glosa_fuente: >-
      «los colorados tienen la simiente muy menuda, como de mostaça, é llaman los
      indios á esta fructa yaguaraha»
    tomo: I
    libro: XIX
    capitulo: II
    pagina_impresa: 591
    tambien_en: "t. I lib. VIII cap. XXXIX, p. 326 (casi las mismas palabras; T1 la tenía de ahí, sólo por OCR)"
    atribucion: "«los indios» de Cubagua"
    campo: planta
    verificacion: imagen
    en_el_lexicon: "no"
    aporta: "✅ levanta la marca `ocr-sin-imagen` de T1: la forma impresa es `yaguaraha`"

  - forma_fuente: agoreros
    glosa_fuente: >-
      p. 591: «El otro género de fructa en cardones … es de fuera verde é
      quieren paresçer dátiles … é quando se comen … sale ó sube á las narices un
      olor de almizcle ó mas suave. A esta fructa llaman los indios agoreros».
      p. 384: «Cerca de Araya hay una gente que llaman los agoreros en la
      Tierra-Firme, á causa de çierta fructa que se llama assi mismo agoreros»
    tomo: I
    libro: [XIX, XI]
    capitulo: [II, XI]
    pagina_impresa: [591, 384]
    tambien_en: "t. I lib. VI cap. XXII, p. 208, y lib. VIII cap. XXXIX, p. 326"
    atribucion: "«los indios» de Cubagua (la fruta); el nombre de la GENTE lo ponen los españoles por la fruta"
    campo: [planta, etnonimo]
    verificacion: imagen
    en_el_lexicon: "no"
    ojo: >-
      Homógrafo del castellano «agoreros» y en cursiva: el editor la trata como
      voz indígena. Una gente nombrada por los españoles por su fruta, como los
      «magueyes» por su planta (abajo).

  - forma_fuente: chacopati
    glosa_fuente: >-
      p. 385: «Esta gente que los chripstianos llaman magueyes por la causa ya
      dicha, se llaman en su lengua chacopati». p. 208: «E aquesta gente magueyes
      llaman los naturales de aquella tierra chacopati»
    tomo: I
    libro: [XI, VI]
    capitulo: [XI, XXII]
    pagina_impresa: [385, 208]
    atribucion: "autodenominación («se llaman en su lengua») de una gente cerca de Araya"
    campo: etnonimo
    verificacion: ocr-limpio
    en_el_lexicon: "no"

  - forma_fuente: uchibican
    forma_ocr_cruda: "uehibican (p. 208) · uchibkan (p. 385)"
    glosa_fuente: >-
      p. 208: «el qual cambio, assi como en castellano se diçe trocar, é en la
      lengua desta Isla Española se diçe serra, en lengua destos magueyes ó
      chacopati el trocar quiere deçir uchibican». p. 385: «Mas en aquella lengua
      de los magueyes, alias chacopati, serra ó trocar quiere deçir uchibican»
    tomo: I
    libro: [VI, XI]
    capitulo: [XXII, XI]
    pagina_impresa: [208, 385]
    atribucion: "«lengua destos magueyes ó chacopati» — DECLARADA, cerca de Araya"
    campo: [intercambio, verbo]
    verificacion: imagen
    en_el_lexicon: "no"
    ojo: >-
      🔴 La única vez en los cuatro tomos que Oviedo pone EN PARALELO una voz de
      Tierra Firme y una de La Española para lo mismo: castellano `trocar` =
      taíno `serra` = chacopati `uchibican`. Las dos formas son distintas: no es
      préstamo. Y los dos pasajes son del mismo Oviedo («casi con las mismas
      palabras», nota del editor en la p. 385): UNA atestación, no dos.

  - forma_fuente: serra
    glosa_fuente: "«en la lengua desta Isla Española se diçe serra» (p. 208); «haçer serra, que quiere deçir … trocar» (p. 385)"
    tomo: I
    libro: [VI, XI]
    capitulo: [XXII, XI]
    pagina_impresa: [208, 385]
    atribucion: "«la lengua desta Isla Española» — DECLARADA"
    campo: [intercambio, verbo]
    verificacion: imagen
    en_el_lexicon: "no"
    seccion_de_la_esfera: "es TAÍNO (comparanda de la esfera de contacto), no de Tierra Firme; va aquí por el par"

  - forma_fuente: maguey
    glosa_fuente: >-
      «é çerca destos están otras gentes que se diçen los magueyes, á causa que
      una hierva, como cardones (mas sin espinas), se llama assi maguey, de que
      allí hay mucha abundançia della: la qual paresçe mucho á la cabuya … Aquella
      gente … despencan esta hierva, é la cabeça ó çepa della cuéçenla é háçese
      un manjar asaz bueno … É de las hojas sacan el çumo por sudor de fuego, á
      manera de destilallo, é de aquello beben aquella gente, é nunca beben agua»
    tomo: I
    libro: XI
    capitulo: XI
    pagina_impresa: [384, 385]
    atribucion: "no-declarada en cuanto a lengua; la planta es de la costa de Araya"

      - "t. I, libro VIII caps. XXVI-XXIX y XXXIX-XLIV (311-315, 326-328): los cardones y las frutas de Venezuela, Cubagua y Margarita"
      - "t. I, libro VI caps. XVI, XXII-XXIV (203-204, 208-210): el incienso de Venezuela, los chacopati, las culebras de cascabel de Margarita, Cubagua"
      - "t. I, libro XI cap. XI (384-385): el maguey, los agoreros y los chacopati"
      - "t. I, libro XVI caps. II-V (466-474): los pasajes de intercambio de nombres (punto 4)"
      - "t. II, libro XXIV caps. III, XI-XIII (216-222, 250-261): Huyapari, Camanagoto y los tres animales de Paria"
      - "t. II, libro XXV cap. XXII (330-331): el párrafo de la fauna de Venezuela que T6 no extrajo"

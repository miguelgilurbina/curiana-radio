      - "t. IV, libro L cap. XX (524-535): el naufragio de Sanabria y su llegada a Paraguaná"
    por_sonda_y_pasaje:
      - "los cuatro tomos: barrido de sonido (voz, canto, grazna, silba, brama, ruido…) con contexto de animal; se leyeron todos los aciertos"
      - "los cuatro tomos: las sondas de ortografía de `meta.sondas_medidas`; se leyeron todos los aciertos fuera del libro XXV"

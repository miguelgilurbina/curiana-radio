# ── (b) CUBAGUA, MARGARITA Y LAS ISLAS DE LA COSTA ────────────────────

  - nombre_en_fuente: flamencos
    especie_probable: "flamenco del Caribe (Phoenicopterus ruber) — la descripción lo permite"
    texto: >-
      «Hay unas aves que los españoles llaman flamencos, porque en España
      llaman assi á çiertas aves; pero estas de acá no lo son: antes la
      diferençia es aquesta. Son las de Cubagua tan grandes como un pavo; el
      plumaje es de color como encarnado: las piernas delgadas é de quatro
      palmos de altura: el cuello de otros quatro palmos luengo, y delgado, como
      el dedo pulgar de la mano de un hombre: el pico de la hechura que le
      tienen los papagayos. Aliméntanse estas aves de pescado chiquito é marisco
      que andan buscando por las lagunas y estaños, é al rebalaje de la mar
      metidas en el agua lo que pueden apear por la costa»
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XIX
    capitulo: II
    pagina_impresa: [591, 592]
    lugar: "isla de Cubagua"
    epoca: contacto-temprano
    sonido: "«Graznan como ánsares é crian çerca de los lagos»"
    verificacion: imagen
    ojo: >-
      El único SONIDO de ave de la costa venezolana en toda la obra, y el de un
      ave que vive en las lagunas de Paraguaná. Cubagua es la orilla oriental
      (regla 4): el ave es la misma, la gente no.

  - nombre_en_fuente: "alcatraçes grandes del papo"
    especie_probable: "pelícano pardo (Pelecanus occidentalis) — ver la descripción larga del t. I p. 445"
    texto: "«Hay de los alcatraçes grandes del papo é de otros de otras maneras. Otras aves hay pequeñas de agua y muchas dellas»"
    obra: oviedo-y-valdes-1851
    tomo: I
    libro: XIX
    capitulo: II
    pagina_impresa: 592
    lugar: "isla de Cubagua"
    epoca: contacto-temprano

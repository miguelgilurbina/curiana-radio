# ══════════════════════════════════════════════════════════════════════
# 6. LO QUE RESULTÓ FALSO AL MEDIRLO — del encargo y de las parcelas de ayer
# ══════════════════════════════════════════════════════════════════════
correcciones:
  - afirmacion: "«el libro XIX del tomo I (impresas 586-618)» (encargo; ficha del t. I: «618 impresas de cuerpo + índice (619-648)»)"
    medido: >-
      El cuerpo termina en la impresa **614** (fin del cap. XV del libro XIX); el
      ÍNDICE GENERAL empieza en la 615. En las dos copias. El libro XIX es
      586-614.
  - afirmacion: "que el libro XIX es «Tierra-Firme» y el que «más costa de Venezuela tiene» (fichas de T1 y T6)"
    medido: >-
      Su título lo dice: «el qual tracta de las islas de Cubagua é la
      Margarita». La costa que trae es la de Cumaná, Araya, Maracapana y
      Chiribichi; **cero** Coro, Paraguaná, Coquibacoa, Curiana, islas ABC,
      Manaure o Ampíes (el `Ampies` del t. I, p. 119, es Johan de Ampies dueño
      de un ingenio en La Española). Su cap. XV recorre las islas de Cubagua a
      la Florida hacia el NORTE; no pasa por las de enfrente de Coro.
  - afirmacion: "`dalihao` (t. I p. 473), «bloqueado hasta ver la imagen» (T1, T7)"
    medido: >-
      La página dice **`datihao`**, con t, en cursiva (copia íntegra, zoom). La
      nueva capa OCR también lo da así; la vieja decía `dalihao`.
  - afirmacion: "la imagen del t. I «sólo llega hasta la impresa 154»"
    medido: >-
      Era cierto del PDF del repo (truncado). La misma digitalización está
      completa en Internet Archive y ya está en el repo (`meta.descarga`): las
      47 formas `ocr-sin-imagen` de T1 se pueden verificar ahora. Esta parcela
      verificó las suyas; las de T1 quedan como tarea (issue §D).
  - afirmacion: >-
      «✅ Ésta sí es independiente» — `comoho` del t. I (pp. 313-314) y del t. II
      (p. 331), «otro informante» (T6)
    medido: >-
      El propio Oviedo lo desmiente en el t. II p. 331: «de cada uno destos
      árboles y fructas en el libro alegado … he fecho nuevamente memoria, é
      añadido todo lo que es nesçessario … en la primera parte». Los capítulos
      venezolanos del libro VIII del t. I (dactos, comoho, mamón, çimiruco) los
      AÑADIÓ él con la misma información; el de `dactos` nombra al informante: el
      obispo Bastidas, el mismo del t. II. Es UNA cadena, no dos (minar-fuente §8).
  - afirmacion: >-
      «en 1.880 páginas no hay una sola línea que ponga en relación a los indios
      de la costa de Venezuela con los de las Antillas» y «Oviedo nunca empareja
      una voz venezolana con una antillana» (T6, tomos II-IV)
    medido: >-
      Cierto de los tomos II-IV. En el TOMO I hay dos: (a) el par `serra`
      (Española) = `uchibican` (chacopati, Araya) para 'trocar', pp. 208 y 385;
      (b) los indios de Maracapana gritando «Hayti, Hayti» a los navíos en 1520,
      p. 598. Ninguno es contacto PRECOLOMBINO: el (a) es un cronista comparando
      y el (b) es conocimiento colonial. La conclusión de T6 se mantiene; la
      frase, no.
  - afirmacion: "«t. IV: en el cuerpo, sólo un naufragio que acaba en Coro — cero lengua» (T6)"
    medido: >-
      Ese naufragio (Sanabria, 1534, lib. L cap. XX) desembarca en la costa de
      PARAGUANÁ y trae: Miraca (segunda atestación independiente), un paraguanero
      que dice «Capitan», una pesca, el manglar, la falta de agua, la mesa de
      Miraca y la «isla de las aves» al poniente. No es lengua indígena, pero no
      es cero.
  - afirmacion: "`talara`, el pez de Cubagua (OCR de las dos copias)"
    medido: "La página dice `tatara` en los dos pasajes (pp. 209 y 592)."
  - afirmacion: >-
      la nota de `waitiao` en el lexicón: «el pacto de guaitiao … lo describe
      Oviedo para el área circuncaribe»
    medido: "ver §4: Oviedo no usa la palabra y lo cuenta sólo de San Juan («en estas islas»)."
  - afirmacion: "el desfase del t. I «impresa = pdf − 118»"
    medido: >-
      En la COPIA NUEVA el desfase es otro (la nueva trae más páginas de
      preliminares): lo emite el script en `meta.sondas_medidas.desfase_tomo_I_copia_integra`.
      Las páginas de este YAML son siempre IMPRESAS, válidas en las dos copias.

# ══════════════════════════════════════════════════════════════════════
# 7. LO QUE NO SE ENCONTRÓ (regla 6) — ceros con su sonda
# ══════════════════════════════════════════════════════════════════════
ceros:
  en_el_libro_XIX: >-
    Coro, Paraguaná, Coquibacoa/Quiquibacoa, Curiana, Corazao, Aruba, Boynare,
    Manaure, Ampíes, çaquitio: 0 (sondas de `meta.sondas_medidas`, sobre la capa
    nueva y con el guion de fin de línea deshecho), y el libro está LEÍDO entero,
    no sólo sondado: el cero es de la fuente.
  sonido_de_aves_de_la_costa_de_Venezuela: >-
    Fuera de los flamencos de Cubagua («graznan como ánsares») y de las «pavas
    grasnaderas» de Santa Marta, Oviedo no describe el canto de ningún ave de la
    costa venezolana. Las aves que CANTAN en la obra son de La Española
    (ruiseñores, golondrinas) y las oye en Santo Domingo. Las aves de Tierra
    Firme las remite a una «segunda parte» que no las trae (`picudo`,
    `gallinaça`, `guacamaya`, `tucán`, `páxaro loco`: 0 en los cuatro tomos;
    `pintadillo` sale 2 veces y las dos es el pez `tatara`).
  ranas_y_sapos: "el capítulo de las ranas y sapos (t. I pp. 437-438) no describe su canto"
  guaitiao: "ver §4"
  gente_de_las_islas_ABC: >-
    Nada nuevo: ni en el libro XIX ni en la historia natural aparece la gente de
    Curaçao, Aruba o Bonaire. En la «isla de las aves» del naufragio de 1534 el
    relato no encuentra gente, y Oviedo no la nombra.

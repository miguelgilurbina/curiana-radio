# 4. `guaitiao` / `guatiao` — punto 4 del encargo
# ══════════════════════════════════════════════════════════════════════
guaitiao:
  la_pregunta: >-
    `waitiao` está en el lexicón como `caquetío-atestiguado` con esta nota:
    «el pacto de guaitiao (intercambio de nombres entre aliados) lo describe
    Oviedo para el área circuncaribe». Ayer se midió 0 en la capa de texto de los
    cuatro tomos, con la reserva de la cursiva. ¿Aparece la palabra en la página?
  respuesta_en_una_frase: >-
    **No.** Oviedo DESCRIBE el intercambio de nombres —tres veces, las tres en
    San Juan— y en ninguna usa la palabra; la única voz que da para esa
    institución es `datihao`.
  medido:
    capa_de_texto: >-
      0 en los cuatro tomos con la familia entera de sondas (`g\w?[uún][aáo]?[iy]?[tlíif1][iíl1]?[aá]o`,
      `\w*tiao\w*`, `\w*liao\w*`, `\w*tihao\w*`, `\w*lihao\w*`) sobre la capa del
      t. I NUEVO (otra OCR, la de la copia íntegra) además de la vieja; y la lista
      de TODAS las palabras terminadas en -iao/-iáo de los cuatro tomos no trae
      ninguna candidata (son `Nicolao`, `Callao`, `Talao`, `bacallaos`…). Lo
      reproduce `6-fusion/scripts/medir_oviedo_restante.py`.
    en_la_imagen:
      - pasaje: "t. I lib. XVI cap. II, p. 467 — Agüeybana toma el nombre de Johan Ponçe"
        verbatim: >-
          «Y al mesmo caçique Agueybana le puso nombre Johan Ponçe, como se
          llamaba el mesmo capitan que digo; porque es de costumbre de los indios
          en estas islas, que quando toman nueva amistad, toman el nombre proprio
          del capitan ó persona, con quien contraen la paz ó amiçiçia»
        verificacion: imagen
        la_palabra: ausente
      - pasaje: "t. I lib. XVI, p. 469 — Sotomayor da su nombre al caçique heredero"
        verbatim: "«y púsole su nombre é llamábanle don Chripstóbal»"
        verificacion: ocr-limpio
        la_palabra: ausente
      - pasaje: "t. I lib. XVI, p. 472 — un capitán indio herido pide el nombre de Diego de Salaçar"
        verbatim: >-
          «el capitan ó caçique le dixo que le rogaba que le diesse su nombre é
          que con su voluntad oviesse por bien que le llamassen Salaçar como á él,
          é que queria ser su amigo perpétuo … É assi luego sus indios le
          comencaron á llamar Salaçar»
        verificacion: imagen
        la_palabra: ausente
      - pasaje: "t. I lib. XVI cap. V, p. 473 — el `datihao` de Agüeybana"
        verbatim: >-
          «entonçes dixo el caçique: "Adelante, adelante, á mi datihao (que
          quiere deçir mi señor, ó el que, como yo, se nombra), dexa ese
          bellaco."»
        verificacion: imagen
        forma: "🔴 `datihao` — con t, en cursiva, leída con zoom. NO `dalihao` (que era el OCR de la copia truncada)"
    y_fuera_de_san_juan: >-
      El episodio de la guerra de Higüey (Esquivel y Cotubanamá), donde Las
      Casas pone el `guatiao`, Oviedo lo despacha en una línea (t. I p. 89: «en
      breve tiempo la allanó») y no nombra a Cotubanamá ni a Esquivel en ese
      contexto. En Tierra Firme, Venezuela y los tomos II-IV, ningún pasaje de
      intercambio de nombres (barrido de «su nombre / el nombre» cerca de
      «amistad / amigo / paz» con «indio / caçique»: los aciertos son todos de
      San Juan o irrelevantes).
  consecuencias:
    - >-
      La nota de `waitiao` dice dos cosas que la fuente no sostiene: que Oviedo
      use `guaitiao` (no lo usa) y que lo describa «para el área circuncaribe»
      (lo dice «de los indios en estas islas», y lo cuenta sólo en San Juan).
      `waitiao` queda SIN atestación en Oviedo; si su apoyo es Las Casas (como
      dice `cognado-009`: «se hicieron guaitiaos», Las Casas 1929 II:291), esa
      es la cita, y es antillana.
    - >-
      `datihao` queda con su forma confirmada en la página (p. 473) y confirmada
      su orilla: San Juan. Se sostiene lo que T6 propuso sobre la etiqueta.
  propuesta_para_miguel: "ver el issue `oviedo-restante-2026-09-22.md` §B (opciones con letras)"


    obra: oviedo-y-valdes-1852-1855
    tomo: II
    libro: XXV
    capitulo: XXII
    pagina_impresa: 331
    lugar: "provinçia de Veneçuela (el nombre `beori` es de Cueva, en el Darién)"
    epoca: contacto-temprano
    sonido: null
    verificacion: imagen
    ojo: >-
      La frase final es un dato de LENGUA, no de fauna, y va también a
      `hallazgos_de_mundo`: el obispo Bastidas describe la provincia como un
      mosaico de lenguas que no se entienden «en poco término».

  - nombre_en_fuente: "perros gozques que crian los indios en sus casas"
    especie_probable: "perro doméstico indígena (Canis familiaris)"
    texto: "«Hay perros gosques que crian los indios en sus casas, é son mudos, que no ladran»"
    obra: oviedo-y-valdes-1852-1855
    tomo: II
    libro: XXV
    capitulo: XXII
    pagina_impresa: 331
    lugar: "provinçia de Veneçuela"
    epoca: contacto-temprano
    sonido: "«son mudos, que no ladran»"
    verificacion: imagen
    ver_tambien: "Santa Marta (t. II p. 355) y La Española (t. I pp. 390-391), abajo: allí sí dice qué ruido hacen"

  - nombre_en_fuente: "leones pardos"
    especie_probable: "puma (Puma concolor) — «rasos … todos bermejos»"
    texto: >-
      «leones pardos llaman á çiertos animales, que en efeto son como leones,
      assi en feroçidad é armas como en el tamaño. Mas aquestos no tienen
      aquellas barbas luengas que los leones de África, y son estos rasos, el
      pelo como de un lebrel, é todos bermejos é muy çeñidos»
    obra: oviedo-y-valdes-1852-1855
    tomo: II
    libro: XXV
    capitulo: XXII
    pagina_impresa: 331
    lugar: "provinçia de Veneçuela"
    epoca: contacto-temprano
    sonido: null
    verificacion: imagen

  - nombre_en_fuente: "palomas … de passo"
    especie_probable: null
    texto: >-
      «mayormente palomas en çierto tiempo del año, porque son de passo; y

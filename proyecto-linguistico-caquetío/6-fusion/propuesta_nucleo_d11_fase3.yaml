    - ['pi-',    0,  0, 0, 0,  0, 0,  1,  0, 1]
    - ['nü-',    0,  0, 0, 0,  0, 0,  0,  0, 1]
    - ['-ka',    5, 10, 1, 3,  9, 1, 19, 16, 5]
    - ['-ni',    6, 11, 1, 3, 15, 1, 23, 17, 7]
    - ['-da',    4, 11, 1, 3, 11, 1,  5, 13, 7]
  lectura:
    - >-
      NUMERALES — casi gratis: una aparición cada uno, en un solo prompt (tier
      I), cero en reglas, koiné, score y tests. Y las candidatas 1-4 YA son
      entradas caquetío-atestiguado del lexicón: no hay que crear ni una clave.
      `polo` no aparece en nada.
    - >-
      PRONOMBRES — caro en `taya` y barato en el resto: `taya` está en 3 de los
      6 constructores (incluida la _IDENTIDAD_LINGUISTICA que reciben TODOS los
      agentes: «empieza con "Taya..." o "Nüma..."»), en las instruccion_agente
      de -ni y -da, en el núcleo de reserva de la koiné y en 21 líneas de tests.
      `waya` y `naya` no cambian de forma.
    - >-
      POSESIVOS — `ta-` está en 5 de 6 prompts y en la tupla de prefijos que
      es_arahuaco() reconoce («ta», «wa», «ma», «ka»): cambiarlo toca el
      instrumento. `wa-` no cambia de forma. `pi-` y `nü-` sólo existen en
      CLAUDE.md (y en el análisis del corpus), no en el motor.
    - >-
      ASPECTO — lo más caro con diferencia: 32 de las formas-firma de los 20
      agentes de FORMAS_SEED llevan -ka/-ni/-da; -ni sale en los 6
      constructores; `_aspectos_morfologicos` cablea {"ka","ni","da"} y vale 2
      de los 10 puntos del score; 47 apariciones en tests y 46 en demos.
    - >-
      El conteo de «literal en score» de -ka incluye el prefijo ka- de la tupla
      de es_arahuaco; los de -ni/-da, sólo el mapa de aspecto.
  corpus:
    medido: false
    motivo: 'Supabase local apagado el 2026-09-13 (Docker no responde); no se re-mide'
    ultima_medicion:
      fuente: 5-experimento/analisis/ANALISIS_BASE_2026-08-06.md §3 y §5
      word_uses: 54936
      con_sufijo_de_aspecto: {usos: 18752, formas: 220}
      con_prefijo_posesivo: {usos: 3840, formas: 155, nota: 'contados como ta-/pi-/nü-'}
      lectura: >-
        un tercio de los usos lleva aspecto y uno de cada catorce lleva
        posesivo (18.752 y 3.840 de 54.936); `taya` es la forma más usada del
        corpus y `nüma` está entre las ocho primeras. Lo que se re-deriva es
        el andamiaje, no el vocabulario.

# ══════════════════════════════════════════════════════════════════════
# COLISIONES Y TRAMPAS DEL INSTRUMENTO — lo que hay que resolver ANTES de un run
# ══════════════════════════════════════════════════════════════════════
instrumento:
  colisiones_de_clave:
    - {candidata: bia,  choca_con: 'lokono ''in'''}
    - {candidata: ria,  choca_con: 'achagua ''El'''}
    - {candidata: ruya, choca_con: 'achagua ''Aquella'''}
    - {candidata: '-bo', choca_con: 'lokono ''continuativo'' (clave bo)'}
    - {candidata: de,   choca_con: 'lokono ''yo'' Y ES_STOPWORDS — descartada'}
  candidatas_con_clave_libre: [daya, dai, bui, tuya, ja, 'pana-kabu', 'buia-kabu', '-pa']
  por_que_importan_las_colisiones: >-
      score_linguistico() reconoce por palabras_activas() sin filtrar por
      fuente y clasifica por la `fuente` de la clave. Mientras `ria` sea clave
      achagua, un agente del brazo nuevo que la diga es penalizado como fuga a
      otra lengua arahuaca. Hay que renombrar la comparanda (precedente:
      ja-achagua, biama-kalinago) antes de sembrar.
  el_nucleo_no_llega_por_la_capa: >-
    🔴 El eje A de los perfiles (`capas_lexicas`) filtra el muestreador, pero el
    núcleo NO llega por el muestreador: está CABLEADO en prompt_reglas_completo,
    prompt_reglas_breve, el bloque de tier III de vocabulario_para_agente,
    _IDENTIDAD_LINGUISTICA (orquestador), prompt_refuerzo, prompt_rescate
    y en _NUCLEO_FALLBACK/FORMAS_SEED de la koiné. Consecuencia de paso: el
    brazo `atestiguado` ya corrido o por correr TAMBIÉN recibe taya, pia, nüma,
    wanee… cableados, así que es menos «duro» de lo que su descripción dice.
  score_invariante: >-
    capas_de_score es fijo y debe seguirlo siendo. Pero la tupla de prefijos de
    es_arahuaco() y el mapa de _aspectos_morfologicos son listas cableadas: si
    un brazo usa da-/bi-/ri-/na- y el score sólo reconoce ta-/wa-/ma-/ka-, ese
    brazo pierde densidad por construcción. La salida limpia es la UNIÓN de los
    dos núcleos en los dos brazos — que mueve (poco) el score de `base` frente
    a la era 1 si algún agente de base produce da-X o na-X. Hay que declararlo.

# ══════════════════════════════════════════════════════════════════════
# DE PASO — desfases medidos que no dependen de la decisión
# ══════════════════════════════════════════════════════════════════════
de_paso:
  - 'CLAUDE.md (bloque Morfología) y 2-lengua/morfologia.md dan `tayamaa` (nosotros), que no existe en el lexicón ni en el motor: la entrada es `waya`'
  - 'CLAUDE.md declara pi- (tu) y nü- (su); REGLAS_POSESIVAS no los tiene'
  - 'la nota de `jarai` dice que el lokono del lexicón no cubre ''cinco''; el lexicón tiene abbatekkabe (Brinton 1871)'
  - 'la entrada `pana` ''uno'' (atestiguado) cita a Arcaya y Zavala sin página'

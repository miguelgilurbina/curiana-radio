# ─────────────────────────────────────────────────────────────────────────
# PROPUESTA — D11 fase 3: el núcleo gramatical re-derivado desde lokono + achagua
#
# La retroabstracción que pidió Miguel el 2026-09-13. El núcleo que hablan los
# agentes (pronombres, posesivos, numerales, aspecto) se reconstruyó desde el
# WAYUU antes de D11; el 2026-09-10 se re-etiquetó sin tocar formas
# (issues-pendientes/publicados/decision-d11-el-nucleo-reconstruido-del-wayuu.md).
# Esto propone, casilla por casilla, qué pondría en su lugar el eje que D11
# eligió: lokono–achagua.
#
# Regla 5: PROPUESTA. No toca el lexicón, el corpus ni el motor.
# Regla 3: todo lo de aquí es FORMA DE LENGUA. Que el lokono diga 20 = «un
#          hombre» es un dato de numeral, no una práctica de conteo caquetía.
# Coste medido: 6-fusion/scripts/medir_coste_nucleo_d11.py (2026-09-13).
# Borrador de decisión: issues-pendientes/decision-d11-fase3-nucleo-lokono-achagua.md
# ─────────────────────────────────────────────────────────────────────────
meta:
  recogido: '2026-09-13'
  estado: sin-fusionar — propuesta para decisión (D11 fase 3)
  obra: perea-alonso-1942 · neira-ribero-1762 · oliver-1989-cap2 · oliver-1989-apendice-a · zavala-reyes-2015
  alimenta: '#39 (D11, cerrada) — decisión nueva sobre el perfil de run'
  medido_con: 6-fusion/scripts/medir_coste_nucleo_d11.py

# ══════════════════════════════════════════════════════════════════════
# CRITERIO — cómo se asigna la etiqueta (una sola por candidata)
# ══════════════════════════════════════════════════════════════════════
criterio:
  jerarquia:
    - >-
      caquetío-atestiguado: la forma la da una fuente caquetía para ESA casilla
      (pana 'uno', gudamuen 'dos'...). Gana a todo lo demás.
    - >-
      caquetío-reconstruido: (a) lokono Y achagua concuerdan en el prefijo
      —consonante y vocal— y la forma libre está documentada tal cual en una de
      las dos; o (b) una hermana da la forma y una FUENTE segmenta ese mismo
      morfema en voces caquetías atestiguadas.
    - >-
      caquetío-hipotético: todo lo demás — la consonante no concuerda, la forma
      no está documentada en ninguna lengua, o es una composición nuestra. En
      duda, aquí (regla 2).
  ordenacion_dentro_de_una_casilla: >-
    `preferida` ordena candidatas de la MISMA etiqueta; no es una segunda
    etiqueta. Se prefiere la que toma cada pieza de donde más lenguas la
    comparten, y a igualdad, la que no choca con una clave existente ni con el
    castellano.
  formas_cortas: >-
    🔴 Nada se afirma como cognado por parecido entre formas de dos letras sin
    concordancia sistemática (lo que produjo el ~80% de fallo de las 441
    hipotéticas). Cada casilla donde eso pasa lo dice en `cautela`.
  estratos_lokono: >-
    Schumann 1755 y Schultz 1802 vía Perea 1942 (el más antiguo), Brinton 1871,
    Pet 1987 (el del lexicón), Oliver 1989 Tabla A-2. Se citan por separado:
    la columna lokono del lexicón mezcla estratos (ver cule-n-y-cognado-002 en
    lokono_gramatica_perea_1942.yaml).
  achagua: >-
    Neira y Ribero 1762 (copia de 1788). TRANSCRIPCIÓN POR VISIÓN del escriba
    (2026-09-12), no OCR ni cotejo humano: toda forma achagua de aquí se cita
    como tal, con pliego y lado.
  similitud: >-
    La métrica del cómputo D11 (computo_d11_2026-08-31.yaml): 1 − Levenshtein /
    longitud máxima sobre esqueleto fonémico; «gana» con ≥0.50 y margen ≥0.10.
    Las cifras las imprime medir_coste_nucleo_d11.py.

# ══════════════════════════════════════════════════════════════════════
# LAS CASILLAS
# ══════════════════════════════════════════════════════════════════════
casillas:

  # ─────────────────────────── PRONOMBRES LIBRES ───────────────────────────
  - id: pron-1sg
    casilla: pronombre libre, 1.ª singular
    canon_actual:
      forma: taya
      fuente_lexicon: caquetío-reconstruido
      origen: 'wayuu taya'' (Oliver A-2 n1: guajiro taya'', paraujano te-/ta-)'
    lokono:
      - {forma: 'de', glosa: 'yo, a mí, me (forma libre)', obra: perea-alonso-1942, pagina: 550, estrato: 'Schumann 1755 / Schultz 1802'}
      - {forma: 'da-', glosa: 'índice personal 1sg (posesivo y conjugativo)', obra: perea-alonso-1942, pagina: '587, 609-652', estrato: 'Schumann 1755'}
      - {forma: '*day / dei / dai', glosa: I, obra: oliver-1989-apendice-a, pagina: 561, estrato: 'Oliver 1989'}
      - {forma: 'de', glosa: '1SG pronombre libre (lexicón)', obra: 'Pet 1987 vía curiana_lexicon', estrato: 'Pet 1987'}
    achagua:
      - {forma: Nuya, variante: Nuarra, tipo: absoluto, pliego: 8, lado: izq}
      - {forma: 'Nu-', tipo: inicial (posesivo), pliego: 8, lado: der}
      - {forma: 'Nuya, nurra', tipo: 'vocabulario s.v. «Yo»', pliego: 71, lado: izq}
    otras_hermanas: 'maipure nu-ya, island-carib nu-guia (Oliver A-2 n1, p. 561)'
    traza_caquetia:
      - forma: 'd- en dare ''diente'''
        obra: oliver-1989-cap2
        pagina: 147
        lectura: >-
          Oliver: CQ dare : LK d-ari 'mi diente' : WY t-ali : PJ t-a()i — el
          prefijo de 1sg contrastando (cognados_oliver.py lo llama «el par más
          productivo del capítulo»). dare es caquetío-atestiguado (Zavala #103).
      - forma: '/da-/ en datihao / daitiao'
        obra: oliver-1989-cap2
        pagina: 147
        lectura: '«/da-/ in da(i)tia-o is first person singular marker»'
        duda_de_la_fuente: >-
          Oliver duda de que datihao sea caquetío y no taíno compartido (n. 42,
          p. 146), y la correspondencia C1 la da para «PERHAPS Caquetío» (p. 136).
      - forma: 'de en «cudan de cuté»'
        obra: zavala-reyes-2015
        pagina: 73
        lectura: >-
          NO se usa. Puede ser la preposición castellana de una fórmula de
          cortesía colonial; frase_saludo_mitare.yaml lo deja sin resolver.
    concordancia_lokono_achagua:
      prefijo: 'NO — lokono d- / achagua n-. El achagua conserva el */nV-/ protoarahuaco que Oliver hace pasar a /dA-/ en lokono, taíno y «quizá» caquetío (C1, p. 136).'
      base_de_la_forma_libre: 'la base -ya es achagua (Nu-ya), maipure (nu-ya), island-carib (nu-guia) y wayuu (ta-ya); el lokono es el único con -i (da-i)'
    candidatas:
      - forma: daya
        etiqueta: caquetío-hipotético
        preferida: true
        por_que: >-
          Prefijo d- donde está la traza caquetía (C1) + la base -ya que
          comparten todas las hermanas menos el lokono. No está documentada en
          ninguna lengua: es una composición, y por eso es hipotética aunque sus
          dos piezas estén bien apoyadas.
        clave_en_el_lexicon: libre
      - forma: dai
        etiqueta: caquetío-hipotético
        preferida: false
        por_que: 'la forma lokona tal cual (A-2); pierde la base -ya'
        clave_en_el_lexicon: libre
    descartadas:
      - forma: de
        motivo: >-
          Es la forma lokona de Pet y de Perea, pero colisiona con la preposición
          castellana: está en ES_STOPWORDS y score_linguistico() la contaría
          como ESPAÑOL en todos los brazos. Además `de` ya es clave lokono.

  - id: pron-2sg
    casilla: pronombre libre, 2.ª singular
    canon_actual:
      forma: pia
      fuente_lexicon: caquetío-reconstruido
      origen: 'wayuu pia'' (A-2 n2; paraujano pia)'
    lokono:
      - {forma: 'bu- / bù-', glosa: 'índice 2sg; alternan «por incuria del tipógrafo»', obra: perea-alonso-1942, pagina: '587, 613', estrato: 'Schumann 1755'}
      - {forma: 'bu / bù', glosa: 'pospuesto de estativos', obra: perea-alonso-1942, pagina: 635, estrato: 'Schumann 1755'}
      - {forma: bii, glosa: thou, obra: oliver-1989-apendice-a, pagina: 561, estrato: 'Oliver 1989'}
      - {forma: bi, glosa: '2SG pronombre libre; by- prefijo (lexicón)', obra: 'Pet 1987 vía curiana_lexicon', estrato: 'Pet 1987'}
    achagua:
      - {forma: Jia, variante: 'Jiya / Jirra', tipo: absoluto, pliego: 8, lado: der}
      - {forma: 'Ji-', tipo: inicial, pliego: 8, lado: der}
      - {forma: 'Gia, Giya, Girra', tipo: 'vocabulario s.v. «tu»', pliego: 96, lado: izq}
    otras_hermanas: 'maipure p-ia, island-carib hu-guia (A-2 n2)'
    traza_caquetia:
      - forma: ninguna del morfema
        lectura: >-
          kudanga 'usted' y kuté 'a usted' son atestiguadas (Zavala p. 73 vía
          Arcaya) pero no dan un pronombre de 2sg segmentable: su reparto
          palabra a palabra es alineación posicional de la traducción
          (frase_saludo_mitare.yaml §2). No sirven de traza.
      - forma: 'indirecta: el caquetío escribe b- donde el wayuu tiene p-'
        obra: oliver-1989-cap2
        pagina: 119
        lectura: >-
          C3, LK /b/ : WY /p/, con el caquetío del lado lokono: barisi : bálisi :
          palíi; -bana y no -pana; buia- en buiamati frente a WY piama. Medido en
          las claves caquetío-atestiguado: inicial b = 26, p = 11.
        contraejemplos: 'para ''mar'' frente a LK bara (Oliver no lo explica); pana/apana ''uno'' con p frente a IC abana, LK abba'
    concordancia_lokono_achagua:
      prefijo: 'NO — lokono b- / achagua j-'
      vocal: 'SÍ en i: achagua Ji-a, lokono bi (Pet) / bii (A-2); el Schumann de 1755 da bu-'
    candidatas:
      - forma: bia
        etiqueta: caquetío-hipotético
        preferida: true
        por_que: >-
          b- por C3 (traza indirecta, no del morfema) + la base -ia de achagua,
          maipure y wayuu. No documentada en ninguna lengua.
        clave_en_el_lexicon: '⚠️ COLISIÓN — `bia` ya es clave LOKONO (''in''). Hoy un agente que dijera bia puntuaría como fuga a otra lengua arahuaca. Exige renombrar la comparanda antes (precedente: ja-achagua, biama-kalinago)'
      - forma: bui
        etiqueta: caquetío-hipotético
        preferida: false
        por_que: 'la forma de Schultz 1802 vía Perea (decision-d11-el-nucleo-reconstruido-del-wayuu.md); clave libre; sin la base -ia'
        clave_en_el_lexicon: libre
    cautela: 'el apoyo de b- es una correspondencia de sonido con dos contraejemplos, no una traza del pronombre'

  - id: pron-3sg
    casilla: pronombre libre, 3.ª singular (masculino / no masculino)
    canon_actual:
      forma: nüma
      fuente_lexicon: caquetío-reconstruido
      origen: wayuu (declarado en la entrada)
      nota: 'no distingue género: «él/ella»'
    lokono:
      - {forma: 'lù- / li- / lu- / l-a-', glosa: '3 varonil', obra: perea-alonso-1942, pagina: '587, 635', estrato: 'Schumann 1755'}
      - {forma: 'tù- / tu- / t-a-', glosa: '3 no varonil (mujeres, animales, cosas)', obra: perea-alonso-1942, pagina: '554, 587, 635', estrato: 'Schumann 1755'}
      - {forma: 'i (vr.) / n (nv.)', glosa: 'pospuestos de estativos', obra: perea-alonso-1942, pagina: 635, estrato: 'Schumann 1755'}
      - {forma: 'li / to', glosa: 'artículos [+masc +hum] / [NM/NH]; ly- / thy- prefijos (lexicón)', obra: 'Pet 1987 vía curiana_lexicon', estrato: 'Pet 1987'}
    achagua:
      - {forma: Ria, variante: 'riãne / riãde', tipo: 'absoluto «Aquel»', pliego: 8, lado: der}
      - {forma: Ruya, variante: 'Ruãsa / Ruãde', tipo: 'absoluto «Aquella»', pliego: 8, lado: der}
      - {forma: 'Ri- / Ru-', tipo: iniciales, pliego: 8, lado: der}
      - {forma: 'Ria, riane, riade', tipo: 'vocabulario s.v. «Aquel»', pliego: 37, lado: izq}
    traza_caquetia:
      - forma: ninguna
    concordancia_lokono_achagua:
      genero: 'SÍ — las dos distinguen masculino de lo demás. El `nüma` sin género del canon no tiene apoyo en ninguna.'
      masculino: >-
        CASI — vocal i en las dos; consonante líquida l (lokono) / r (achagua),
        que es justo el par que Oliver declara indecidible en todo el corpus
        (C8, cap. 2 p. 105: «The discrimination of l, r, rr and lr is rarely
        consistent»). Por el criterio estricto no cuenta como identidad.
      no_masculino: 'NO en la consonante (lokono t / achagua r); SÍ en la vocal u'
      grafia_caquetia_medida: >-
        En las claves caquetío-atestiguado: r = 127, l = 6 (lokono 132/166;
        achagua 2682/50). Es grafía colonial, no fonema (C8); pero para la forma
        ESCRITA del canon empuja a r.
    candidatas:
      - forma: ria
        casilla_fina: 3sg masculino
        etiqueta: caquetío-hipotético
        preferida: true
        por_que: 'la más apoyada de las hipotéticas: sólo le falta a la concordancia el par l~r que la fuente declara indecidible; forma achagua documentada; r por la grafía caquetía medida'
        clave_en_el_lexicon: '⚠️ COLISIÓN — `ria` es clave ACHAGUA (''El''). Renombrar la comparanda antes del run'
      - forma: ruya
        casilla_fina: 3sg no masculino
        etiqueta: caquetío-hipotético
        preferida: true
        por_que: 'forma achagua documentada, coherente con ria; vocal u compartida con el lokono'
        clave_en_el_lexicon: '⚠️ COLISIÓN — `ruya` es clave ACHAGUA (''Aquella'')'
      - forma: tuya
        casilla_fina: 3sg no masculino
        etiqueta: caquetío-hipotético
        preferida: false
        por_que: 'consonante lokona t- + base -uya'
        clave_en_el_lexicon: 'libre, pero es homógrafo del posesivo castellano «tuya» (no está en ES_STOPWORDS: no penaliza, pero un lector y un agente lo leen como español)'
    cautela: >-
      El reparto de género no coincide del todo: el no varonil lokono incluye
      animales y cosas; el arte achagua da «Aquella» sin decir si abarca
      inanimados (sí dice que las cosas inanimadas no llevan `na` de plural,
      pliego 87 izq.). Partir `nüma` en dos obliga al agente a elegir: es un
      cambio de gramática, no sólo de forma.

  - id: pron-1pl
    casilla: pronombre libre, 1.ª plural
    canon_actual:
      forma: waya
      fuente_lexicon: caquetío-reconstruido
      origen: 'wayuu waya'' (A-2 n3)'
    lokono:
      - {forma: 'wa-', glosa: 'índice 1pl — wa-si-kua «nuestra casa»', obra: perea-alonso-1942, pagina: 587, estrato: 'Schumann 1755'}
      - {forma: wai, glosa: 'nosotros (231 apariciones en el texto)', obra: perea-alonso-1942, estrato: 'Schultz 1802', nota: 'cifra de decision-d11-el-nucleo-reconstruido-del-wayuu.md'}
      - {forma: 'oai / oei', glosa: we, obra: oliver-1989-apendice-a, pagina: 561, estrato: 'Oliver 1989'}
      - {forma: we, glosa: '1PL pronombre libre (lexicón)', obra: 'Pet 1987 vía curiana_lexicon', estrato: 'Pet 1987'}
    achagua:
      - {forma: Guaya, variante: Guarra, tipo: absoluto, pliego: 8, lado: der}
      - {forma: 'Gua-', tipo: inicial, pliego: 8, lado: der}
      - {forma: 'Guaya, Guarra', tipo: 'vocabulario s.v. «Nosotros»', pliego: 77, lado: der}
    otras_hermanas: 'maipure wa-ya, island-carib ua-gia (A-2 n3); insular wa- (van Buurt §6, en morfologia.md)'
    traza_caquetia:
      - forma: ninguna del pronombre
    concordancia_lokono_achagua:
      prefijo: 'SÍ — lokono wa- / achagua gua- = /wa-/ con la regla gu→w aprobada en D5'
      forma_libre: 'achagua Guaya = /waya/, similitud 1.00 con el canon; lokono wai 0.75'
    candidatas:
      - forma: waya
        etiqueta: caquetío-reconstruido
        preferida: true
        por_que: >-
          SE CONSERVA LA FORMA; CAMBIA LA JUSTIFICACIÓN. Deja de ser «cognado
          wayuu» y pasa a ser concordancia lokono ∧ achagua en el prefijo, con
          la forma achagua documentada letra por letra.
        clave_en_el_lexicon: 'es la entrada actual'

  - id: pron-2pl
    casilla: pronombre libre, 2.ª plural
    canon_actual:
      forma: ninguna
      nota: 'el canon no tiene 2pl (medido: ni entrada ni regla)'
    lokono:
      - {forma: 'hù- / hu- / h-a-', glosa: 'índice 2pl', obra: perea-alonso-1942, pagina: '587, 635', estrato: 'Schumann 1755'}
      - {forma: 'hu / hù', glosa: 'pospuesto', obra: perea-alonso-1942, pagina: 635, estrato: 'Schumann 1755'}
    achagua:
      - {forma: Ja, variante: Jarrà, tipo: absoluto, pliego: 8, lado: der}
      - {forma: 'J-', tipo: inicial, pliego: 8, lado: der}
      - {forma: 'Ja, Jara', tipo: 'vocabulario s.v. «Vosotros»', pliego: 98, lado: izq}
    traza_caquetia:
      - forma: ninguna
    concordancia_lokono_achagua:
      prefijo: 'en la consonante SÍ bajo la fonemización del proyecto (la j del copista de 1762 = h: fon() del cómputo D11); en la vocal NO (lokono u / achagua a o nada)'
    candidatas:
      - forma: ja
        etiqueta: caquetío-hipotético
        preferida: true
        por_que: 'forma achagua; el lema fonémico sería `ha`, homógrafo del castellano «ha»'
        clave_en_el_lexicon: 'libre (la comparanda está como ja-achagua)'
    cautela: 'casilla NUEVA: añadirla no re-deriva nada, amplía el paradigma. Opcional para el perfil.'

  - id: pron-3pl
    casilla: pronombre libre, 3.ª plural
    canon_actual:
      forma: naya
      fuente_lexicon: caquetío-reconstruido
      origen: wayuu (declarado en la entrada)
    lokono:
      - {forma: 'na- / n-a-', glosa: 'índice 3pl — na-si-kua', obra: perea-alonso-1942, pagina: '587, 635', estrato: 'Schumann 1755'}
      - {forma: ye, glosa: 'pospuesto de estativos', obra: perea-alonso-1942, pagina: 635, estrato: 'Schumann 1755'}
    achagua:
      - {forma: Naya, variante: 'Nãsa / Nani / nãde', tipo: 'absoluto «Aquellos»', pliego: 8, lado: der}
      - {forma: 'Na-', tipo: inicial, pliego: 8, lado: der}
      - {forma: 'na', tipo: '«nota de 3.as personas de plural; las cosas inanimadas no le tienen»', pliego: 87, lado: izq}
    traza_caquetia:
      - forma: ninguna
    concordancia_lokono_achagua:
      prefijo: 'SÍ — na- / Na-'
      forma_libre: 'achagua Naya = canon naya, similitud 1.00'
    candidatas:
      - forma: naya
        etiqueta: caquetío-reconstruido
        preferida: true
        por_que: 'SE CONSERVA LA FORMA; CAMBIA LA JUSTIFICACIÓN (lokono na- ∧ achagua Na-, forma achagua exacta)'
        clave_en_el_lexicon: 'es la entrada actual'
    cautela: 'el achagua restringe na a lo animado; el canon glosa «ellos, ellas» sin decir nada de inanimados. No contradice, pero conviene anotarlo en la glosa.'

  # ─────────────────────────────── POSESIVOS ───────────────────────────────
  - id: pos-persona
    casilla: prefijos posesivos de persona
    canon_actual:
      reglas: 'REGLAS_POSESIVAS tiene ta- (1sg) y wa- (1pl), las dos «cognado directo» wayuu'
      desfase_medido: >-
        CLAUDE.md declara además pi- (tu) y nü- (su), pero NO existen como
        regla: 0 apariciones en el código (medido). El análisis del corpus sí
        contó usos con ta-/pi-/nü- (3.840, ANALISIS_BASE_2026-08-06 §3).
    lokono: {paradigma: 'da- bu- lù- tù- wa- hù- na-', obra: perea-alonso-1942, pagina: 587, estrato: 'Schumann 1755'}
    achagua: {paradigma: 'Nu- Ji- Ri- Ru- Gua- J- Na-', pliego: 8, lado: der, ejemplo: 'Nusaricana «mi padre» … Nasaricana «su padre de ellos»'}
    filas:
      - {persona: 1sg, canon: 'ta-', lokono: 'da-', achagua: 'Nu-', concuerdan: 'no', traza: 'd- (C1: dare, datihao — ver pron-1sg)', candidata: 'da-', etiqueta: caquetío-reconstruido, por_que: 'criterio (b): la hermana da la forma y Oliver segmenta el mismo morfema en voces caquetías atestiguadas (p. 147). La duda de Oliver sobre datihao no toca a dare.'}
      - {persona: 2sg, canon: 'pi- (sólo en CLAUDE.md)', lokono: 'bu- (1755) / by- (Pet)', achagua: 'Ji-', concuerdan: 'no', traza: 'indirecta (C3)', candidata: 'bi-', etiqueta: caquetío-hipotético, por_que: 'b- lokono + vocal i compartida con el achagua'}
      - {persona: 3sg.m, canon: 'nü- (sólo en CLAUDE.md)', lokono: 'lù- / li-', achagua: 'Ri-', concuerdan: 'casi (l~r, C8)', traza: ninguna, candidata: 'ri-', etiqueta: caquetío-hipotético, por_que: 'ver pron-3sg'}
      - {persona: 3sg.nm, canon: '—', lokono: 'tù-', achagua: 'Ru-', concuerdan: 'no (vocal sí)', traza: ninguna, candidata: 'ru-', etiqueta: caquetío-hipotético, por_que: 'ver pron-3sg'}
      - {persona: 1pl, canon: 'wa-', lokono: 'wa-', achagua: 'Gua- (/wa-/)', concuerdan: 'SÍ', traza: 'ninguna caquetía; insular wa- (van Buurt §6)', candidata: 'wa-', etiqueta: caquetío-reconstruido, por_que: 'SE CONSERVA; cambia la justificación'}
      - {persona: 2pl, canon: '—', lokono: 'hù-', achagua: 'J-', concuerdan: 'consonante sí (j=h), vocal no', traza: ninguna, candidata: 'hu-', etiqueta: caquetío-hipotético, por_que: 'casilla nueva, opcional'}
      - {persona: 3pl, canon: '— (no hay regla)', lokono: 'na-', achagua: 'Na-', concuerdan: 'SÍ', traza: ninguna, candidata: 'na-', etiqueta: caquetío-reconstruido, por_que: 'concordancia exacta; casilla que el canon no tenía como regla'}
    fuera_de_persona:
      ma-: >-
        privativo/negativo, regla del canon («cognado directo» wayuu). Lokono m-/ma-
        con par mínimo frente al atributivo k- (Perea p. 555; negación pp.
        652-668); achagua ma- privativo, explicado por el propio autor («Pues el
        `ma-` es negativo q.do se antepone», vocabulario s.v. «No tener nombre,
        ser gentil» = Magidenã, pliego 78 izq.). Concuerdan:
        SE CONSERVA, cambia la justificación.
      ka-: >-
        atributivo/asociativo, regla del canon. Lokono k-/c- atributivo (p. 555) y
        el ka- insular de van Buurt §8. En el achagua NO se buscó (no es un cero:
        es no buscado, regla 6). Se conserva tal cual hasta verificarlo.
    cautela: 'da- y na- son formas de dos letras: su apoyo no es el parecido sino el paradigma entero alineado casilla por casilla en las dos hermanas.'


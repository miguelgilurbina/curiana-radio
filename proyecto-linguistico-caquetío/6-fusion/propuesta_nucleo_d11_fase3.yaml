      - {forma: '-coa-', valor: '«ser, estar habitualmente» (Perea corrige a Schumann)', obra: perea-alonso-1942, pagina: 675, estrato: 'Schumann 1755 / Schultz 1802'}
      - {forma: '-bo', valor: 'continuativo / progresivo — li wadili dalhida-bo «el hombre está corriendo»', obra: 'Pet 1987 vía curiana_lexicon', estrato: 'Pet 1987'}
    achagua:
      - {forma: '-ní', valor: 'desinencia de 3.ª persona en predicados de estado (Casarrumauní «está alegre»; el verbo sustantivo marca persona por sufijo: Vyuna, Vyugi, Vyumí, Vyubí, Vyuy)', pliego: 26, lado: izq, nota: 'HOMÓGRAFO: persona, no aspecto'}
    traza_caquetia: [{forma: ninguna}]
    concordancia_lokono_achagua: 'NO'
    candidatas:
      - forma: '-bo'
        etiqueta: caquetío-hipotético
        preferida: true
        por_que: 'el único continuativo declarado en una hermana del eje, pero del estrato de 1987'
        clave_en_el_lexicon: '`bo` es clave lokono'
    descartadas:
      - forma: '-coa'
        motivo: 'choca con el -coa de las formaciones de lugar (morfema-001 -bacoa) y con la variante -coa de -aima: contaminaría la toponimia que acuñan los agentes'
    cautela: '🔴 formas de dos letras; y el -ni del canon tiene dos homógrafos con otro valor (auxiliar lokono, persona achagua)'

  - id: asp-prospectivo
    casilla: 'prospectivo (canon -da)'
    canon_actual: {forma: '-da', regla: REGLAS_ASPECTO, origen: 'wayuu -ee desiderativo + tríada C (morfologia.md §2)'}
    lokono:
      - {forma: '-dda / -da', valor: 'la partícula que marca el presente y que ni Perea ni Goeje explican', obra: perea-alonso-1942, pagina: 604, estrato: 'Schumann 1755', nota: HOMÓGRAFO con otro valor}
      - {forma: '-pa', valor: 'futuro — d-a-iyaha-ddi-pa «andaré»', obra: perea-alonso-1942, pagina: '605, 609-612', estrato: 'Schumann 1755'}
      - {forma: '-fa / -ha', valor: 'futuro — l-osy-fa «él irá»', obra: 'Pet 1987 vía curiana_lexicon', estrato: 'Pet 1987', nota: 'el mismo futuro dos siglos después: p > f/h'}
    achagua:
      - {forma: 'su / sa / saba', valor: '«El futuro se conoce por esta particula»', pliego: 24, lado: izq}
      - {forma: '-su / -saba', valor: 'formación del futuro sobre la 1.ª persona del pretérito', pliego: 24, lado: der}
      - {forma: 'ba', valor: 'partícula de futuro — «Nutemba cubay = tiraré pescado», «Caibiuba = Dolerá»', pliego: 24, lado: der}
    traza_caquetia: [{forma: ninguna}]
    concordancia_lokono_achagua: >-
      DE FUNCIÓN, y de forma en un morfema de dos letras: futuro lokono -pa ~
      partícula de futuro achagua -ba. Es la única casilla de aspecto donde las
      dos hermanas coinciden en algo.
    candidatas:
      - forma: '-pa'
        etiqueta: caquetío-hipotético
        preferida: true
        por_que: 'la forma lokona, en la casilla donde lokono y achagua coinciden en función; p y no b porque en lokono contrastan (banna ≠ pana, Perea)'
        clave_en_el_lexicon: libre
    cautela: >-
      🔴 Dos letras, b/p, y el achagua tiene además -su/-saba. Se registra la
      coincidencia; NO se afirma cognación. Por eso sigue siendo hipotética
      pese a ser la mejor apoyada del bloque.

# ══════════════════════════════════════════════════════════════════════
# LO QUE LAS DOS HERMANAS DICEN DE ESTRUCTURA — anotado, NO propuesto
# ══════════════════════════════════════════════════════════════════════
estructura_no_propuesta:
  - hallazgo: >-
      Las dos marcan la persona con PREFIJO en los verbos activos y con OTRA
      serie, pospuesta o sufijada, en los de estado: lokono halli-kebbe de «me
      alegro» (4.ª conjugación, pospuestos de/bu/i/n/u/hu/ye; Perea pp. 634-635);
      achagua Vyuna / Vyugi / Vyumí / Vyubí / Vyuy (verbo sustantivo, pliego 26
      izq.) y Chainamaubí «estamos enfermos».
    por_que_importa: >-
      El orden del canon —«pronombre libre + verbo-aspecto + complemento»— no es
      el patrón no marcado de ninguna de las dos. Cambiarlo es sintaxis, no
      forma: queda fuera de la fase 3 y se anota para que no se pierda.
  - hallazgo: 'las dos cuentan en base cinco por la mano hasta 20 (Perea p. 565; achagua, hallazgos de la segunda pasada)'
    por_que_importa: 'el canon da 1-5 sueltos más un 10 wayuu; no tiene composición. Las candidatas num-5/10/20 la introducen'


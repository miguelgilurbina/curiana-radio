  # ─────────────────────────── ASPECTO / TIEMPO ────────────────────────────
  - id: asp-completivo
    casilla: 'completivo (canon -ka)'
    canon_actual: {forma: '-ka', regla: REGLAS_ASPECTO, origen: 'wayuu: tríada A en contexto de pasado (morfologia.md §2)'}
    lokono:
      - {forma: '-ca', valor: 'presente del verbo sustantivo «ser, estar», sin distinción de tiempo', obra: perea-alonso-1942, pagina: '584, 608, 628', estrato: 'Schumann 1755', nota: HOMÓGRAFO con otro valor}
      - {forma: '-bi', valor: 'pretérito inmediato — d-a-iyaha-ddibi «he andado»', obra: perea-alonso-1942, pagina: '605, 609-612', estrato: 'Schumann 1755'}
      - {forma: '-buna / -bu · -cuba', valor: 'pretérito absoluto · remoto', obra: perea-alonso-1942, pagina: 605, estrato: 'Schumann 1755'}
      - {forma: hibin, valor: '«ya» (completivo)', obra: 'Pet 1987 vía curiana_lexicon', estrato: 'Pet 1987'}
    sospecha_de_la_fuente: >-
      Perea (p. 606; pp. 683-684): Schultz traduce los pretéritos por un
      presente, «lo cual nos hace suponer que todo el mecanismo temporal de los
      pretéritos sea tan sólo uno de los tantos perfeccionamientos a priori de
      los misioneros». El aparato de tiempo lokono es, según su gramático,
      probablemente construcción misionera.
    achagua:
      - {forma: '-mi', valor: 'pretérito, en un solo ejemplo sobre un adverbio: «Entonces = Riyari. Fut. Riyaresu. Pret. Riyaremi»', pliego: 59, lado: der}
      - {forma: '-yisa, -misa, -nisa', valor: '«nota de participio de presente y de pretérito»', pliego: 26, lado: izq}
      - {forma: '-ca', valor: 'infinitivo de los verbos en -iu', pliego: 26, lado: izq, nota: HOMÓGRAFO con otro valor}
    traza_caquetia: [{forma: ninguna}]
    concordancia_lokono_achagua: 'NO (lokono -bi / achagua -mi: ni la forma ni la función están aseguradas)'
    candidatas:
      - forma: '-bi'
        etiqueta: caquetío-hipotético
        preferida: true
        por_que: 'el pretérito inmediato lokono es lo más cercano a «ya hice»; pero sale del aparato que Perea cree misionero'
        clave_en_el_lexicon: '`bi` es clave lokono (''tú''); como sufijo con guion el detector de aspecto no la confunde'
    cautela: >-
      🔴 Formas de dos letras sin concordancia sistemática. Y el -ka del canon
      tiene DOS homógrafos con otro valor (lokono -ca 'ser/estar', achagua -ca
      infinitivo): no se afirma cognación con ninguno.

  - id: asp-continuativo
    casilla: 'continuativo (canon -ni)'
    canon_actual: {forma: '-ni', regla: REGLAS_ASPECTO, origen: 'wayuu -iraa (morfologia.md §2)'}
    lokono:

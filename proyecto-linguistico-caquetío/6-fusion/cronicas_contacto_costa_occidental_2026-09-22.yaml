# ── LENGUA ────────────────────────────────────────────────────────────
- id: m2.l1
  esfera: lengua / transmision
  titulo: '🔴 Isabel, la lengua indígena de Hojeda (1502)'
  cita: >-
    «en el cabo de la Vela estad siete ú ocho dias por amor de Isabel, y
    trabajad por saber lo de las perlas, y que las pesquise delante vos… Y ahí
    mirad mucho por Isabel, non la dejeis un momento de noche ni de dia sin
    guarda y quien la vele disimuladamente y de cerca; de Cirurma y del rio mas
    acá trabajad por traer de cada parte dos ó tres indios, y tratadlos bien…
    venios costa á costa hablando á los indios en todas las partes que
    podierdes, y trabajad con Isabel que traiga algún pariente suyo»
  obra: navarrete-1829-viages-menores
  pagina_impresa: '107-108 (doc. XX, instrucción al piloto Juan López, puerto de Santa Cruz, 20-V-1502); nota de Navarrete p. 36 n. 1'
  lugar: Coquibacoa — cabo de la Vela; su origen no se declara
  clase: documento + inferencia-del-editor (que la trajo en 1499)
  epoca: contacto-temprano
  lo_que_dice: >-
    (a) había una intérprete indígena de TIERRA FIRME en la armada; (b) la
    tenían vigilada día y noche, es decir, cautiva; (c) el plan era hacer más
    «lenguas»: dos o tres indios de Citarma y otros tantos «del río» (la
    Hacha), y un pariente de ella; (d) Hojeda esperaba poder «hablar á los
    indios en todas las partes» costa a costa con ella.
  lo_que_no_dice: >-
    de dónde era Isabel. El único sitio donde el primer viaje «tomó indias»,
    según el propio Hojeda, es el lago de San Bartolomé (doc. XVIII, p. 105);
    que ella sea una de ésas es inferencia. Ni dice si la entendían en la
    Guajira: «por amor de Isabel» sugiere que allí tenía gente.
  regla_3: >-
    es la PRIMERA intérprete documentada de la costa occidental, y es una
    cautiva. Para el taíno (T7) importa en sentido contrario al que buscaba:
    en 1502 los españoles se hicieron sus propios intérpretes EN la costa, no
    los trajeron de las islas.
  fuerza: alta para el documento

- id: m2.l2
  esfera: lengua
  titulo: 'Dos palabras para «perla» a seis días de distancia: tenoras y corixas'
  cita: >-
    Curiana (oriental): «Tiénenlas [las canoas] de un solo madero, como los
    demás, pero más toscas y menos aptas que las de los caníbales y los
    isleños de la Española. Las llaman galitas… llevaban todos á porfía sartas
    de perlas: llaman á éstas tenoras» (p. 304) · Cauchieto: «Estos llaman á
    las perlas corixas» (p. 311)
  obra: angleria-1892
  pagina_impresa: 'vol. 1, pp. 304 y 311'
  verificado_en_imagen: 'sí — las tres formas van en cursiva en la edición (pdf 368 y 375)'
  lugar: Curiana ORIENTAL y Cauchieto (costa central, entre Codera y La Guaira según Navarrete p. 16) — NO la Kaketiana
  clase: noticia-indigena-recogida
  epoca: contacto-temprano
  por_que_importa: >-
    son las ÚNICAS voces indígenas de Tierra Firme que estos cronistas apuntan
    para toda la costa al oeste de Paria, y ninguna es de la costa occidental.
    Que dos pueblos a «seis soles» llamen a la perla de dos maneras distintas
    es un indicio (sólo eso) de dos lenguas. Candidatas a cotejar con el
    cumanagoto y el caribe continental (no se hizo).
  fuerza: media

- id: m2.l3
  esfera: lengua
  titulo: 'Lo que la costa occidental dejó de su lengua en 1499-1502: nada apuntado'
  medido: >-
    ni una voz indígena de Coquibacoa, Paraguaná, Coro o los Gigantes en las
    cuatro obras, fuera de los topónimos (Coquibacoa/Quinquibacoa, Curiana).
    Lo que sí queda dicho: los Gigantes hablaban «en su lengua cariñosamente»
    (p. 256) y entre sí «como en ademan de querer prendernos» (p. 257); en la
    isla de las hierbas, «por señas» (p. 253); y, 80 leguas más allá del
    palafito (lugar sin identificar), «otra gente del todo diversa de la
    primera en idioma y en trato» (p. 223) — la única observación de
    diferencia lingüística de toda la serie, en un pasaje de Vespucio que no se
    puede situar.
  obra: navarrete-1829-viages-menores
  clase: negativa-medida
  epoca: contacto-temprano

- id: m2.l4
  esfera: lengua (trampa)
  titulo: 'Las palabras del EDITOR: «guanines» y «macanas» en Navarrete, no en Anglería'
  medido: >-
    Navarrete escribe que los de la Curiana oriental hacían joyeles «que
    llamaban guanines» (p. 15) y que los dos mil hombres que les cerraron la
    playa iban «con macanas, arcos y flechas» (p. 17). Anglería, su fuente para
    ese viaje, dice «oro, aunque no puro» (vol. 1 p. 309) y «armados á su
    modo» (p. 312). Las dos voces son del editor o de la Relación italiana de
    1507 que también usó (no está en el repo): no cuentan como atestación de
    esa costa.
  clase: inferencia-del-editor
  epoca: '1829 (el editor) sobre un hecho de 1499-1500'

# ── TRATO Y GUERRA ────────────────────────────────────────────────────
- id: m2.t1
  esfera: geografia_politica / contacto
  titulo: 'El trato en la costa occidental, 1499: honra en unas partes, flechas en otras, y mujeres tomadas'
  cita: >-
    carta de Roldán, 29-IX-1499 (vía Las Casas): «hallaron gente que peleaba
    tantos con tantos con ellos, y hirieron veinte hombres y mataron uno. En
    algunas partes saltaron en tierra y les hacían mucha honra, y en otras no
    les consentían saltar en tierra» (p. 7 n. 1) · Puerto Flechado: «donde me
    firieron cierta gente» (Hojeda, doc. XVIII, p. 105) · «requerid donde
    tomamos las indias, que se llama lago de S. Bartolomé» (ibid.) · Gigantes:
    «tuvimos que pelear con ellos muchas veces, porque no consentían que
    tomásemos cosa alguna de su país» (p. 259) · palafito: les pusieron
    muchachas en las naves y luego atacaron con arcos y lanzas; «quedando
    muertos 20 y heridos muchísimos más» (pp. 220-222)
  obra: navarrete-1829-viages-menores
  pagina_impresa: '7; 105; 220-222; 259'
  lugar: Kaketiana y Coquibacoa
  clase: documento + hecho-colonial
  epoca: contacto-temprano
  regla_3: >-
    es el primer año del contacto y ya hay capturas: el «miedo a la trata» que
    Federmann ve en Paraguaná en 1530 (PR #210) tiene 31 años de historia
    documentada, empezando por las indias del lago de San Bartolomé (1499) y
    las de Valfermoso (1502). Nada de esto es precontacto.
  fuerza: alta

- id: m2.t2
  esfera: contacto
  titulo: '«Casi dos mil hombres» cerraron la playa — ¿en el borde oriental de la Kaketiana?'
  cita: >-
    Anglería: «Habiéndose adelantado después por la misma costa, he aquí que se
    presentan casi dos mil hombres, armados á su modo, para impedirles que
    desembarquen… no consintieron nunca en tener con los nuestros comercio ni
    trato ninguno» (vol. 1 p. 312, verificado en imagen) · Navarrete: «un
    hermoso lugar con casas y castillos, y ademas con un rio y jardines…
    unos dos mil indios» (p. 16-17)
  obra: angleria-1892
  pagina_impresa: 'vol. 1 p. 312; Navarrete 1829 pp. 16-17'
  lugar: >-
    más de diez días al oeste de Cauchieto. Navarrete (p. 17 n. 2) lo pone
    «al parecer» en Chichiriviche, pasado el Golfo Triste, y lo explica por la
    refriega de Hojeda de agosto: inferencia del editor. Sería el borde oriental
    de la costa falconiana.
  clase: hecho-colonial + inferencia-del-editor (el lugar)
  epoca: contacto-temprano (noviembre-diciembre de 1499)
  fuerza: media para el hecho; baja para el lugar

# ── LA COSTA ORIENTAL, SEPARADA (no es la Kaketiana) ─────────────────
- id: m2.o1
  esfera: 'fuera de la Kaketiana — se anota para que NO se mezcle'
  titulo: 'Lo que Anglería cuenta de la Curiana oriental y de Cauchieto'
  resumen: >-
    aldea de ocho casas (Anglería p. 303; Navarrete dice «ochenta», p. 14);
    casas de madera cubiertas de palma; comen ostras perleras y caza; mujeres a
    la agricultura; hierba para blanquear los dientes; ferias «de cerca»;
    joyeles de oro aleado en figura de aves y ranas; calabacita o concha marina
    como estuche genital (p. 309, en latín); cabeza de caribe clavada en la
    puerta de un principal (p. 315); en Haraia, sal en ladrillos y cadáveres de
    principales secados sobre parrillas a fuego lento (p. 316); en Cauchieto,
    algodón, calzoncillos, oro nativo, mujeres detrás de los hombres (pp.
    310-312).
  obra: angleria-1892
  pagina_impresa: 'vol. 1, pp. 303-316'
  lugar: Curiana ORIENTAL y Cauchieto
  epoca: contacto-temprano
  regla_4: >-
    es la esfera oriental (Cumanagoto, costa central). Importarlo a la
    Kaketiana sería el error que Oliver denuncia. Sirve de COMPARACIÓN: lo que
    sí se repite en las dos costas en 1499 (canoa monóxila, mascar hierba,
    guanín, caserío pequeño) es rasgo areal; lo que sólo sale en la oriental,
    no se proyecta.


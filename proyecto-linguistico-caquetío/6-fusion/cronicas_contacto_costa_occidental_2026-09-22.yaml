# ══════════════════════════════════════════════════════════════════════
# 5. LO QUE NO SE ENCONTRÓ (medido; los ceros, con su control)
# ══════════════════════════════════════════════════════════════════════
no_se_encontro:
- >-
  **Paraguaná** por su nombre: cero en las cuatro obras (`paraguan`,
  `paragoan`); de la península sólo sale el cabo de San Román y que la
  tomaron por isla. Ni una casa, ni una persona de Paraguaná en 1499-1502.
  Control: `isla`, `oro` e `indio` salen por centenares en las mismas obras
  (lo imprime el medidor).
- >-
  **Aruba y Bonaire**: cero por su nombre (`aruba`, `oruba`, `bonair`,
  `buinar`). Sólo «la isla de los Gigantes» (Curazao según Navarrete) y la
  isla de las hierbas sin identificar.
- >-
  **Caquetíos, Manaure**: cero (`caquet`, `caiquet`, `caquit`, `manaur`). El
  pueblo no tiene nombre en estas fuentes; la tierra, sí (Curiana, Coquibacoa).
- >-
  **Ninguna voz indígena** de la costa occidental fuera de los topónimos
  (m2.l3). Las únicas palabras de Tierra Firme al oeste de Paria son
  orientales: galitas, tenoras, corixas.
- >-
  **Navarrete t. I (viajes de Colón) y Hernando vol. 2**: la costa occidental
  no sale, salvo el regreso de Hojeda en Hernando p. 115 (m2.m3). Esperable:
  Colón no pasó por allí.
- >-
  **Anglería vols. 1 y 4**: el viaje de Hojeda de 1499 no se narra;
  `Cuchibacoa` sale sólo en listas.
- >-
  **Los autos del pleito Hojeda–Vergara–Ocampo**, que decidirían dónde está
  Valfermoso, si había oro en Curazao (t7.kak2) y qué dijo Entramasaguas de
  la Curiana occidental: citados por folio, publicados en la Colección
  diplomática t. II, **no están en el repo**.

# ══════════════════════════════════════════════════════════════════════
# 6. COBERTURA POR OBRA (qué se leyó de verdad)
# ══════════════════════════════════════════════════════════════════════
cobertura:
  navarrete-1829-viages-menores: >-
    leídos a mano: Sección Primera pp. 3-41 (Hojeda 1499, Niño y Guerra,
    Bastidas, Hojeda 1502); documentos X, XI, XVII-XX (pp. 85-108); suplemento
    doc. XLVII (pp. 518-519); pleitos, preguntas 4.ª-5.ª (pp. 543-545) y la 16.ª
    (p. 590); Vespucio, Lettera, 1.ª navegación pp. 210-233 y 2.ª pp. 242-262.
    Barrido con el medidor: el volumen entero. **Sin leer**: la Sección Tercera
    (Darién) y el resto de los pleitos más allá de lo que el medidor señaló.
  angleria-1892: >-
    vol. 1: libro VIII entero (pp. 301-318), releído para la costa, y la nota
    del traductor de la p. 39. Vol. 4: sólo barrido (no narra la costa
    occidental). Los vols. 2-3 siguen fuera del repo.
  navarrete-1859-viages-colon: 'barrido con el medidor: cero en la costa occidental, con control'
  colon-hernando-1892: 'barrido con el medidor + lectura del cap. LXXXIV (pp. 113-118, Hojeda en La Española, 1499)'

# ══════════════════════════════════════════════════════════════════════
# 7. QUÉ PROPONE (regla 5: lo decide Miguel)
# ══════════════════════════════════════════════════════════════════════
propone:
- opcion: A
  que: >-
    Registrar la separación de las Curianas donde el canon la necesita: la
    oriental (franja de los Frailes al Farallón, 1499-1502, uso castellano) y la
    occidental (Valfermoso 1502, Coro según Navarrete), con la tercera de
    PR #207 al lado. Toca #33 y la ficha de Anglería.
- opcion: B
  que: >-
    Llevar al corpus, con `epoca: contacto-temprano` y su regla 3 escrita, los
    tres hechos más firmes: el rescate en guanines de la Curiana occidental
    (m2.m1), la cédula de 1501 sobre el guanín castellano (m2.m2) y el poblado
    de «veinte» casas sobre estacas (m2.c1, que además corrige la nota
    pendiente de geografia_politica-006 y el nombre de nodo-008).
- opcion: C
  que: >-
    Verificar en imagen (archive.org `bub_gb_HFzXrEyoeCAC`, dominio público)
    las páginas 32, 86-89, 518 y 544 de Navarrete: «riego» y las grafías de
    Coquibacoa. Es una tarde, y sin eso m2.c3 y m2.g2 no se citan.
- opcion: D
  que: 'Isabel (m2.l1) como hecho de contacto/transmisión y como corrección de t7.l4.'
- opcion: E
  que: >-
    La isla de las hierbas (m2.p1) queda como hipótesis: no entra en la
    Kaketiana hasta cotejar la arqueología de las ABC.
  recomendacion: 'C primero (sin imagen no se cita nada de Navarrete que dependa de una letra), luego A + B; D como nota; E en espera.'

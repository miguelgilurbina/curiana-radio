# ─────────────────────────────────────────────────────────────────────────
# La costa occidental en las crónicas del primer contacto (1499-1502)
#
# Tercera campaña de minería, parcela M2 (2026-09-22/23).
# Obras: angleria-1892 (vols. 1 y 4) · navarrete-1829-viages-menores ·
#        navarrete-1859-viages-colon · colon-hernando-1892 (vol. 2)
#
# LA PREGUNTA: ¿qué cuentan estos cronistas de la COSTA DE TIERRA FIRME
# occidental —Coquibacoa, el cabo de San Román, Paraguaná, Coro, las dos
# Curianas, las islas de los Gigantes— y de su gente? La campaña del taíno
# (T7, `6-fusion/taino2_etnohistoria_contacto.yaml`) los leyó sólo para el
# contacto con las Antillas; esto no lo repite: lo cita por su id (t7.*).
#
# ⚠️ Esto PROPONE (regla 5). No se ha tocado `curiana_lexicon.py`,
#    `3-mundo/`, `2-lengua/` ni `curiana_sim/`.
# ⚠️ NINGUNA CIFRA DE CONTEO ESTÁ ESCRITA A MANO (regla 1). Las imprime
#        python 6-fusion/scripts/medir_cronicas_costa_occidental.py
#    Los números que aparecen entre comillas («veinte casas», «dos mil
#    hombres») son de la FUENTE, no medidas nuestras.
# ⚠️ PÁGINAS: Anglería por los marcadores del .txt (impresa = pdf − 64 en el
#    vol. 1); Navarrete y Hernando por el folio impreso que el OCR lleva en la
#    cabecera de cada página, leído a mano en el pasaje (el medidor da una
#    guía «≈N» cuando la cabecera está rota). Lo verificado en IMAGEN va
#    marcado `verificado_en_imagen`; el PDF de Navarrete no está en el repo y
#    esta sesión no tuvo red, así que sus formas se citan del OCR y se dice.
#
# CÓMO SE ETIQUETA CADA HALLAZGO (como T7, para que se puedan cruzar):
#   clase   noticia-indigena-recogida · inferencia-del-cronista ·
#           inferencia-del-editor (Navarrete 1829, Torres Asensio 1892) ·
#           hecho-colonial (lo que hicieron o vieron los españoles) ·
#           documento (capitulación, instrucción, cédula, testimonio jurado)
#   epoca   precontacto · contacto-temprano (1499-1502) · colonial
#   regla_3 por qué lo visto en 1499-1502 NO es automáticamente el s. XV
#   lugar   el que la fuente declara, y cuál de las dos Curianas si toca
# ─────────────────────────────────────────────────────────────────────────
meta:
  fecha: '2026-09-23'
  campana: Tercera campaña de minería — parcela M2 (crónicas del primer contacto)
  autor: minador M2
  rama: campana/mineria3-cronicas
  mide: 6-fusion/scripts/medir_cronicas_costa_occidental.py
  textos: >-
    Navarrete y Hernando: los `.txt` de archive.org que bajó T7 (ya en el
    repo). Anglería: esta parcela extrajo los dos volúmenes con pdftotext y los
    dejó junto a sus PDF con marcadores de página
    (`fuentes_caquetios/Angleria_1892_Fuentes_Historicas_Colon_America_vol{1,4}.txt`).
  aviso_de_derechos: >-
    las cuatro obras son de dominio público (ediciones de 1829, 1858, 1892 de
    textos de 1499-1539). Se citan literalmente. La nota del traductor de
    Anglería (1892) se cita como del EDITOR.
  cruces_con_otras_parcelas_de_esta_campana: >-
    Federmann 1530 (PR #210): Paraguaná en enero de 1530, pesca nocturna con
    hogueras, una aldehuela de tres casas, miedo a la trata. Pérez de Tolosa
    1546 (PR #209): «cuatro poblezuelos» en Paraguaná. Coro colonial (PR #207):
    el único «Coriana» de Castellanos es una aldea de La Ramada junto a
    «Paraguanil» (p. 264). Se cruzan abajo donde tocan; no se repiten.

# ══════════════════════════════════════════════════════════════════════
# 0. LO QUE DEL ENCARGO (Y DE LO QUE DEJÓ T7) RESULTÓ FALSO AL MEDIRLO
# ══════════════════════════════════════════════════════════════════════
lo_que_resulto_falso:

- afirmacion: >-
    «T7 halló que Navarrete separa DOS Curianas y la de Niño y Guerra 1499 está
    en Cumaná»
  medido: >-
    **Verdad en lo esencial —la Curiana de 1499 NO es la de Coro— y falso en el
    detalle.** «Comprende la costa de Cumaná y golfo de Cariaco» es la glosa de
    Navarrete (p. 13 n. 4). Su fuente, Anglería, la sitúa DESPUÉS de Cumaná:
    Niño, «dejadas atrás las regiones Cumana y Manacapana, llegó á una región
    que dice llaman los indígenas Curiana» (vol. 1, p. 303, verificado en
    imagen). Y el documento que manda —la capitulación de Hojeda (Navarrete
    p. 86) y el requerimiento al veedor del 12-14 de marzo de 1502 (pp. 103-105)—
    la define como una franja: «dende el parage de los Frailes é seña antes de
    la Margarita, é de la otra parte hasta el Farallón, é de toda aquella tierra
    que se llama Curiana», y el veedor certifica haberla pasado ANTES de cabo
    Codera. La Curiana de 1499 es la costa centro-oriental entre Maracapana y el
    Farallón, no Cumaná a secas. Ver §las_dos_curianas.

- afirmacion: >-
    T7 (ficha de Navarrete §4): «El guanín de Curiana venía del oeste, y era
    moneda de rescate (pp. 16-17, 34)»
  medido: >-
    🔴 **Mezcla las dos Curianas.** Las pp. 16-17 son la Curiana ORIENTAL de
    1499; el rescate de las indias «por guanines» es de la Curiana OCCIDENTAL de
    1502 —«una tierra de riego que los indios llamaban Curiana y él nombró
    Valfermoso» (p. 32)— y cae en la **p. 33**, no en la 34. Lo que T7 leyó como
    un solo circuito del guanín son dos costas distintas, con tres años de
    diferencia. Y además: la frase «adquirir guanines que indicaban venirles de…
    Cauchieto» (p. 16) **es de Navarrete (o de Muñoz, a quien sigue)**; Anglería,
    su fuente declarada, no usa la palabra guanín ni una vez en el vol. 1 (lo
    midió el propio T7) y escribe «oro… aunque no puro» (p. 309). Es la trampa
    del glosario del editor, otra vez.

- afirmacion: >-
    T7 (t7.l4): «el único hombre que en toda la costa entiende a los indios en
    1502 es un español que se quedó trece meses a aprender. Nadie llevó un
    intérprete de las islas que sirviera.»
  medido: >-
    **La segunda frase se sostiene; la primera, no.** La armada de 1502 llevaba
    una intérprete indígena de TIERRA FIRME: «la india Isabel la trajo Hojeda á
    Castilla en su primer viage según puede inferirse; y la llevó en el segundo
    para facilitar por su medio la comunicación con los indios» (Navarrete p. 36
    n. 1), y la instrucción de Hojeda del 20 de mayo de 1502 (doc. XX,
    pp. 107-108) la pone a trabajar: «venios costa á costa hablando á los indios
    en todas las partes que podierdes, y trabajad con Isabel que traiga algún
    pariente suyo». El cero de `intérprete` en ese tramo medía la PALABRA, no la
    práctica (regla 6): la palabra no sale y la persona sí.

- afirmacion: >-
    Canon, `geografia_politica-006` y `asentamientos.yaml` nodo-008: el palafito
    de Vespucio es «el Puerto de San Bartolomé»; y la nota «Pendiente de
    verificar contra Vespucio directamente» sobre las «40 casas»
  medido: >-
    En Navarrete son **dos sitios distintos**: el poblado sobre estacas de la
    costa oriental del golfo, sin nombre (p. 8), y el «lago y puerto de
    S. Bartolomé», descubierto el 24 de agosto, que es donde «tomamos las indias»
    (instrucción de Hojeda, doc. XVIII, p. 105). Y la Lettera de Vespucio dice
    «veinte grandes casas, con corta diferencia» (p. 219; latín «ingentes xx
    aedes aut circiter»): **las 40 no están en la Lettera.** La carta de Vespucio
    a Médicis de 1500, que Navarrete sólo cita (ed. Canovai 1817, pp. 59-66), no
    está en el repo; si la cifra de Miguel viene de algún texto, ése es el
    candidato — sin verificar.

- afirmacion: implícita — «Anglería narra el viaje de Hojeda de 1499»
  medido: >-
    **No en los volúmenes que tenemos.** El vol. 1 es la Década I entera y su
    libro VIII es Niño y Guerra; Hojeda 1499 no se narra. `Cuchibacoa` sale una
    vez en cada volumen, y las dos en una LISTA de provincias (vol. 1 p. 48;
    vol. 4 p. 132). Lo de Hojeda en Tierra Firme estaría en la Década II
    (vol. 2), que el repo no tiene.

# ══════════════════════════════════════════════════════════════════════
# 1. EL VEREDICTO, EN UNA FRASE
# ══════════════════════════════════════════════════════════════════════
veredicto: >-
  La Kaketiana entra en las crónicas por DOS viajes de Hojeda —agosto de 1499 y
  abril-mayo de 1502— y casi todo lo que se sabe de su gente en ese momento
  viene de los papeles de Hojeda que Navarrete imprime, no de ningún cronista:
  un poblado de «veinte» casas sobre estacas en la costa oriental del golfo que
  los indios llamaban de Coquibacoa, una isla de los Gigantes con casas en una
  hondonada y gente que defendía lo suyo, una «tierra de riego que los indios
  llamaban Curiana» donde en 1502 se pagaba rescate en guanines, y una
  intérprete indígena, Isabel, capturada en el primer viaje; de la lengua no
  quedó apuntada ni una palabra de la costa occidental, y de Paraguaná sólo su
  perfil desde el mar («una que juzgaron ser isla»).

# ══════════════════════════════════════════════════════════════════════
# 2. LAS DOS CURIANAS (y una tercera que trae PR #207)
# ══════════════════════════════════════════════════════════════════════
las_dos_curianas:
  medido: >-
    Cada acierto de `curiana` en Navarrete t. III se asigna por TRAMO y por
    CONTEXTO con reglas declaradas en el medidor (`cual_curiana`); el resumen
    que imprime es el censo (oriental · occidental · índice). No se decide a
    mano acierto por acierto.
  curiana_oriental:
    que_es: >-
      El nombre castellano de la franja del rescate de las perlas: «desde el
      parage de los Frailes… fasta el Farallón, tierra que se llama Curiana».
      Donde Niño y Guerra comerciaron en 1499-1500.
    donde: >-
      costa centro-oriental de Venezuela, entre Maracapana y el Farallón
      (Centinela, a la altura del cabo Codera). Anglería la pone pasado Cumaná
      y Manacapana (vol. 1 p. 303) y a «más de ciento veinte leguas» de la Boca
      del Drago (p. 318); Navarrete lo corrige a «ni á ciento» y la extiende a
      Cumaná (p. 13 n. 4).
    documentos: 'capitulación de Hojeda, Navarrete p. 86; requerimiento de marzo de 1502, pp. 103-105'
    aviso_de_la_propia_fuente: >-
      Anglería, p. 318 (verificado en imagen): «Hay quien dice que Niño no se
      hizo con las perlas en Curiana… sino en las pequeñas regiones de Cumana
      y Manacapana… y dicen que la Curiana no da margaritas. Todavía no está en
      claro». Y Hojeda, en el pleito con Vergara y Ocampo, sostuvo que «la
      tierra de Curiana no se llamaba así» (Navarrete p. 13 n. 3). El nombre
      estaba en disputa ya en 1502-1503.
  curiana_occidental:
    que_es: >-
      «llegó á una tierra de riego que los indios llamaban Curiana y él nombró
      Valfermoso» (Navarrete p. 32; abril de 1502). Allí firmó Hojeda la
      instrucción del 7 de abril: «Fecho en Valfermoso» (doc. XIX, p. 107).
    donde: >-
      entre el cabo Codera y el golfo de Coquibacoa. Navarrete la identifica con
      Coro («la ensenada de Valfermoso (Coro)», p. 8 n. 3) apoyándose en Pedro
      Simón («la ciudad de Coro está fundada en una provincia de indios llamada
      Curiana», p. 32 n. 3).
    aviso: >-
      ⚠️ Es una INFERENCIA de Navarrete, y su propio itinerario la tensa: de
      Valfermoso Hojeda «pasó… á reunirse» con Ocampo y Guevara en Puerto
      Flechado, y de allí fueron a Curazao (p. 34); pero Navarrete pone Puerto
      Flechado en Chichiriviche (p. 6), al ESTE de Coro. O Hojeda volvió atrás,
      o Valfermoso está más al este. Lo cerrarían los autos del pleito (fols.
      16-17, 61, 88), que el repo no tiene. **En duda, degradar**: «costa
      occidental, entre Codera y Coquibacoa; Coro según Navarrete».
    que_nombre_es: >-
      «que los indios llamaban Curiana» es frase de Navarrete sobre los autos;
      ninguno de los documentos de 1502 impresos en el tomo dice «Curiana» para
      Valfermoso. Nombre indígena **atribuido**, no transcrito.
  tercera_curiana_para_cruzar:
    fuente: 'PR #207 (Coro colonial): Castellanos, p. 264 — «Coriana», aldea de La Ramada junto a «Paraguanil»'
    cruce: >-
      coincide con lo que el canon ya tenía de Oliver (cap. 3 p. 207): «Coria-na»
      y «Paragua-nil» entre las aldeas wanebucán de Punta Espada–Chichibacoa
      (toponimo de `2-lengua/toponimos.yaml`, lectura de 2026-09-07). Con esto
      son **tres** Curianas en tres costas. Qué hace eso con #33 (¿nombre común
      'tierra de X', o nombre que viajó?) es de Miguel.
  consecuencia: >-
    lo que el repo tenía como «la red Curiana ↔ Cauchieto» es ORIENTAL (T7 ya
    lo dijo) y lo que tenía como «el guanín de Curiana era moneda de rescate» es
    OCCIDENTAL y de 1502 (esto es nuevo). Ninguna de las dos cosas sirve para la
    otra costa.

# ══════════════════════════════════════════════════════════════════════
# 3. LOS HALLAZGOS, POR ESFERA
#    lugar: Kaketiana (costa de Falcón, Paraguaná, Golfete, ABC) · Coquibacoa
#    (golfo y Guajira: la polity occidental «futura» del canon) · oriental
# ══════════════════════════════════════════════════════════════════════
hallazgos:

# ── GEOGRAFÍA Y TOPÓNIMOS ─────────────────────────────────────────────
- id: m2.g1
  esfera: geografia_politica / toponimos
  titulo: 'El primer paso europeo por la Kaketiana, agosto de 1499 — y Paraguaná vista como isla'
  cita: >-
    «de Coro, donde permanecieron veinte dias. Desde aquel punto se dirigieron
    á la isla de Curazao, que llamaron de los Gigantes… Pasaron luego á una que
    juzgaron ser isla, distante diez leguas de la de Curazao, y en ella vieron
    el Cabo que forma una península y llamaron de S. Román, quizá por haberle
    descubierto el dia 9 de Agosto»
  obra: navarrete-1829-viages-menores
  pagina_impresa: '7-8'
  lugar: Kaketiana — ensenadas entre Puerto Flechado y «la Vela de Coro»; Curazao; cabo de San Román (Paraguaná)
  clase: hecho-colonial (reconstruido por Navarrete sobre las declaraciones de Hojeda y del piloto Morales)
  epoca: contacto-temprano
  regla_3: >-
    ruta y fechas, no sociedad. «la Vela de Coro» es el topónimo de 1829, no
    de 1499. Ya estaba en T7 (t7.kak1); lo nuevo es el detalle de que tomaron
    Paraguaná por una ISLA, que explica el «gobernación de la isla de
    Coquibacoa» de m2.g3.
  fuerza: alta para la ruta

- id: m2.g2
  esfera: toponimos
  titulo: '«Los indios le llamaban Golfo de Coquibacoa» — y cómo lo escriben los papeles de 1500-1515'
  cita: >-
    «Llamó Hojeda á este Golfo de Venecia por la semejanza á esta célebre ciudad
    de Italia. Los indios le llamaban Golfo de Coquibacoa, y nosotros le
    conocemos ahora con el nombre de Golfo de Venezuela.» (p. 8) · y en el
    pleito colombino, Hojeda bajo juramento: «descubriendo toda aquella costa
    de la tierra firme desde los Frailes hasta en par de las islas de los
    Gigantes, el golfo de Venecia que es en la tierra firme, y la provincia
    Quinquíbacoa» (p. 544)
  obra: navarrete-1829-viages-menores
  pagina_impresa: '8; 86-89; 518-519; 543-545; 590'
  lugar: Coquibacoa (golfo de Venezuela y Guajira)
  clase: documento + inferencia-del-editor («los indios le llamaban» es de Navarrete)
  epoca: contacto-temprano (1499-1502) y testimonios de 1512-1515
  grafias: >-
    el medidor las lista todas, con folio. Por documento: capitulación de
    1500/1501 (doc. X) «Qoiquevacoa» (p. 86, en la frase de las piedras verdes)
    y «Caquevacoa» (p. 87); nombramiento de gobernador de 1501 (doc. XI)
    «Caquivacoa» (p. 89); cédula de 1501 sobre los guanines (doc. XLVII del
    suplemento) «Caquibacoa» (pp. 518-519); testimonios del pleito de 1512-1515:
    Morales y Hojeda «Quinquíbacoa/Quínquibacoa/Quinquihacoa» (pp. 544-545),
    Miguel de Toro «Conqucboca» (p. 590). Navarrete escribe «Coquibacoa».
  aviso: >-
    ⚠️ **TODO es OCR sin verificar en imagen** (el PDF de Navarrete no está en
    el repo y esta sesión no tuvo red). `Qoiquevacoa` tiene once letras, como
    «Quiquevacoa», no doce como «Quinquevacoa»: el OCR apunta a la forma
    reduplicada SIN nasal en la capitulación, mientras el canon
    (`toponimo-034`) la cita como «Quinquevacoa» por Otte 1963 vía Oliver. Y
    `Caquevacoa`/`Caquivacoa` podrían ser `Co-` mal leído. **No se cita
    ninguna forma hasta verla en la página** (archive.org
    `bub_gb_HFzXrEyoeCAC`).
  para_que_sirve: >-
    `toponimo-034` (quiquiba + bacoa, nivel C) pide para subir «un segundo
    caso de reduplicación plural o una glosa impresa»: esto no es un segundo
    caso, pero sí da la forma reduplicada en boca del propio Hojeda (1512-15) y,
    si la imagen lo confirma, en la capitulación que Navarrete transcribió de
    Simancas: dos transcripciones independientes del mismo documento (Navarrete
    1829 y Otte 1963) que habría que cotejar.

- id: m2.g3
  esfera: geografia_politica
  titulo: 'La «isla de Coquibacoa» de los papeles de Hojeda, «donde están las piedras verdes»'
  cita: >-
    «Item: Que vos el dicho Alonso de Hojeda… entréis en la isla é en las otras
    que allí están cerca della, que se dicen [Quiquevacoa] en la parte de la
    tierra firme, donde están las piedras verdes, de las cuales trugistes
    muestra, é traigáis dellas las mas que pudiéredes» · «vos hacen merced de
    la gobernación de la isla [Coquevacoa], que vos descubristeis»
  obra: navarrete-1829-viages-menores
  pagina_impresa: '86-87 (doc. X, capitulación: cédula del 28-VII-1500 y asiento aprobado el 8-VI-1501)'
  lugar: Coquibacoa — «la isla… y las otras que allí están cerca della… en la parte de la tierra firme»
  clase: documento
  epoca: contacto-temprano
  lectura_del_minador: >-
    ⚠️ inferencia mía, no de la fuente: si en 1499 tomaron Paraguaná por una
    isla (m2.g1), «la isla de Coquibacoa y las otras que allí están cerca»
    puede ser Paraguaná con Curazao y sus vecinas —el corazón de la Kaketiana—
    y no la Guajira. Navarrete no lo dice; sólo que la gobernación
    «comprendía el golfo de Venezuela» (p. 8 n. 3). Hipótesis.
  regla_3: >-
    las «piedras verdes» son muestras que Hojeda trajo en 1499: estaban en la
    costa en el primer contacto. Qué eran (cuentas de piedra verde, material
    en bruto) y de dónde venían, no lo dice.
  fuerza: alta para el documento; baja para la identificación de la «isla»

- id: m2.g4
  esfera: geografia_politica
  titulo: 'Coquibacoa = cabo Chichibacoa, ya en Navarrete 1829'
  cita: '«Coquibacoa parece ser lo que hoy llaman cabo de Chichibacoa, que es la punta mas occidental del golfo de Maracaibo»'
  obra: navarrete-1829-viages-menores
  pagina_impresa: '34, nota 4'
  lugar: Guajira (Coquibacoa occidental)
  clase: inferencia-del-editor
  epoca: contacto-temprano (el hecho) / 1829 (la identificación)
  cruce: >-
    es la misma identificación que el canon toma de Oliver (cap. 3 p. 249
    n. 94) para `toponimo-034`. Oliver cita Navarrete 1829 t. III, así que
    **no cuenta como segunda atestación** hasta ver si la saca de aquí (skill §8).

# ── CASAS Y PUEBLOS ───────────────────────────────────────────────────
- id: m2.c1
  esfera: geografia_politica / asentamientos
  titulo: 'El poblado sobre estacas: «veinte grandes casas», no cuarenta'
  cita: >-
    «descubrimos una población á manera de lugar ó villa, colocada sobre las
    aguas, como Venecia, en que habia veinte grandes casas, con corta
    diferencia, construidas á modo de campanas… y fundadas sobre sólidas y
    fuertes estacas, delante de cuyos portales habia unos como puentes
    levadizos, por los cuales se pasaba de unas á otras» (Lettera, p. 219) ·
    «en cuya costa oriental… vieron una gran población y las casas que la
    formaban fundadas artificiosamente en el agua sobre estacas hincadas en el
    fondo y comunicándose de unas á otras con canoas» (Navarrete, p. 8)
  obra: navarrete-1829-viages-menores
  pagina_impresa: '8 (narración); 219 (Vespucio, trad. de Navarrete; nota: «Esto sucedió en el primer viage de Hojeda»)'
  lugar: >-
    costa ORIENTAL del golfo que entraron tras doblar el cabo de San Román — es
    decir, la orilla paraguanera o la del Golfete, no la del lago de
    Maracaibo. Ramos Pérez (vía Oliver, en el canon) lo pone en el Golfete.
  clase: hecho-colonial (lo vieron)
  epoca: contacto-temprano
  regla_3: >-
    un poblado visto un día de agosto de 1499; que el palafito sea forma de
    asentamiento del XV en esa orilla es verosímil, pero la fuente es UN
    avistamiento y Vespucio lo coloca en su «primera navegación» de 1497, que
    Navarrete tiene por fingida y reconstruida sobre este viaje.
  toca: 'geografia_politica-006 y nodo-008 (ver §lo_que_resulto_falso): son dos sitios; la cifra es «veinte»'
  fuerza: media (Vespucio es testigo de baja fiabilidad para cifras; el hecho lo confirma la narración de Navarrete sobre los papeles de Hojeda)

- id: m2.c2
  esfera: geografia_politica / asentamientos
  titulo: 'La isla de los Gigantes: cinco casas en una hondonada, a una legua de la playa'
  cita: >-
    «encontramos un camino que guiaba tierra dentro… Habiendo caminado la
    senda adelante cerca de una legua, descubrimos en una hondonada cinco casas
    que parecían habitadas, y entrando en ellas hallamos cinco mugeres, dos
    viejas y tres jóvenes; todas las cuales eran de tanta estatura, que nos
    causó grande admiración… las viejas comenzaron á hablar con nosotros en su
    lengua cariñosamente, y recogiéndose todas en una casa sola, nos ofrecieron
    muchos de sus comestibles»
  obra: navarrete-1829-viages-menores
  pagina_impresa: '255-256 (Vespucio, Lettera, «segunda navegación»; nota de Navarrete p. 259: «Esta isla… debe ser la de Curazao»)'
  lugar: Kaketiana — isla de los Gigantes (Curazao según Navarrete)
  clase: hecho-colonial (lo vieron) + la estatura, inferencia-del-cronista
  epoca: contacto-temprano
  regla_3: >-
    cinco casas tierra adentro y no en la playa: una disposición concreta de un
    día de 1499. La «estatura» la pone en duda la propia fuente: en 1502
    «volvieron á reconocer esta isla… y no hallaron ningún gigante ni giganta»
    (Navarrete p. 7 n. 3).
  cruce: 'Federmann 1530 (PR #210): una aldehuela de tres casas en Paraguaná. El patrón de caserío pequeño se repite 31 años después, en otra orilla de la esfera.'
  fuerza: media

- id: m2.c3
  esfera: ecologia / agricultura
  titulo: '«una tierra de riego que los indios llamaban Curiana» — Valfermoso, abril de 1502'
  cita: >-
    «siguiendo la costa, rescatando perlas y alguna ropa de algodón, llegó á una
    tierra de [riego] que los indios llamaban Curiana y él nombró Valfermoso…
    acordaron procurarse el remedio en el país, tomando al mismo tiempo las
    hamacas, ollas, cántaros y otras cosas que necesitaban para establecer su
    colonia en otra parte»
  obra: navarrete-1829-viages-menores
  pagina_impresa: '32'
  lugar: Curiana OCCIDENTAL / Valfermoso (Coro según Navarrete; ver §las_dos_curianas)
  clase: hecho-colonial (narración de Navarrete sobre los autos del pleito)
  epoca: contacto-temprano
  aviso_de_lectura: >-
    ⚠️ el OCR dice «tierra de rieeo». La lectura «riego» la sostiene la nota 3
    de la MISMA página, que Navarrete cierra con «También en Sta. Marta y sus
    inmediaciones usaban los indios regar las tierras»: está comentando el riego.
    Verificar en imagen antes de citar.
  regla_3: >-
    si se confirma, es la PRIMERA mención de regadío en esa costa, 1502, antes
    de cualquier asentamiento español allí. El canon tiene el buco (sistema de
    riego caquetío, `ecologia` «buco») sin fecha de fuente: esto le daría una
    atestación de contacto-temprano. Tres años de trato esporádico con naves
    no hacen un sistema de riego: la proyección al XV es razonable, pero la
    decide Miguel.
  fuerza: media (por la lectura del OCR)

# ── COMIDA, PESCA Y NAVEGACIÓN ────────────────────────────────────────
- id: m2.p1
  esfera: ecologia / mar
  titulo: 'La isla de las hierbas: pescadores sin agua dulce, que mascaban hierba con polvo blanco'
  cita: >-
    «Todos tenían la boca llena de cierta yerba verde que rumiaban… Traían
    también todos, colgando del cuello, dos calabacillas curadas, llenas la una
    de la yerba que tenían en la boca y la otra de cierta harina blanquizca
    semejante á yeso molido, y con cierto palo… sacaban la suficiente para
    rociar… aquella yerba» · «nos insinuaron por señas que carecían
    absolutamente de tales aguas… la que bebían era el rocío recogido en
    ciertas hojas semejantes á orejas de asno» · «Carecen enteramente de los
    comestibles que hay en tierra firme, y se mantienen de los peces que cogen
    en el mar. Son grandes pescadores… Nos regalaron muchísimas tortugas» ·
    «Las mugeres no usaban la yerba… pero todas llevaban una calabaza llena de
    agua» · «No tienen poblaciones… solamente se defienden debajo de unas hojas
    grandes del rigor del sol… Cuando van al mar á pescar, llevan consigo una
    hoja de estas»
  obra: navarrete-1829-viages-menores
  pagina_impresa: '251-255 (Vespucio, Lettera, «segunda navegación»)'
  lugar: >-
    «una isla distante 15 leguas de tierra», la inmediatamente ANTERIOR a la
    isla de los Gigantes en el relato. **Sin identificar.** Navarrete (p. 252
    n. 1) la tiene por Marajó, en la boca del Pará.
  lectura_del_minador: >-
    ⚠️ inferencia mía: Navarrete identifica la isla SIGUIENTE con Curazao
    (p. 259 n. 1), y en el relato van de la una a la otra sin más; Marajó
    queda a miles de kilómetros de Curazao. Una isla sin agua, de pescadores,
    a unas quince leguas de la costa y justo antes de Curazao encaja con las
    islas de sotavento (Bonaire, por la distancia). **No se afirma**: es una
    hipótesis que pide cotejo con la arqueología de las ABC (parafernalia de
    coca y cal) antes de ponerla en la Kaketiana.
  clase: hecho-colonial (lo vieron) — Vespucio
  epoca: contacto-temprano
  regla_3: >-
    si fuera de la esfera, sería la observación más temprana del hayo con cal
    (el canon ya tiene la cal del hayo como hueco, `ecologia` mc-mundo-015).
    Mientras la isla no se identifique, NO es dato de la Kaketiana.
  paralelo: >-
    Niño y Guerra vieron mascar «cierta yerba» en la Curiana oriental, «para
    conservar blanca la dentadura» (Anglería vol. 1 p. 308; Navarrete p. 15).
    Navarrete los enlaza (p. 252 n. 2). La costa entera conocía el uso.
  fuerza: alta para la descripción; nula, por ahora, para el lugar

- id: m2.p2
  esfera: mar / navegación
  titulo: 'Gente de agua: canoas monóxilas, nadadores armados, saltar al mar disparando'
  cita: >-
    palafito: «doce barcas suyas, poco mas ó menos, cada una de ellas abierta en
    un tronco de árbol» · «Otros que venían nadando por el mar desde las casas
    traían consigo cada uno su lanza ocultándola en el agua» · «las jóvenes que
    habían puesto en nuestras naves se arrojaron repentinamente al mar» (pp.
    219-221) · Gigantes: «todos ellos se arrojaron á el mar disparándonos
    muchas saetas» (p. 258) · Coquibacoa 1502: «á su vista parecieron muchos
    indios en la costa» (p. 34)
  obra: navarrete-1829-viages-menores
  pagina_impresa: '219-221; 258; 34'
  lugar: Kaketiana (palafito, Gigantes) y Coquibacoa
  clase: hecho-colonial
  epoca: contacto-temprano
  regla_3: 'conductas vistas en encuentros hostiles; la destreza en el agua es de 1499, sin fecha anterior'
  fuerza: media (Vespucio)

# ── ADORNOS Y METALES ─────────────────────────────────────────────────
- id: m2.m1
  esfera: geografia_politica / intercambio
  titulo: '🔴 El guanín como RESCATE en la Curiana occidental, 1502'
  cita: >-
    «tomaron muchas hamacas, cantidad de algodón, varios enseres y aún
    prendieron algunas indias, de las cuales unas se rescataron por guanines,
    otras quedaron en plena libertad… Los pobres indios venían después con
    seguro á rescatar estas mismas prendas á precio de guanines, quejándose
    amargamente del mal que sin causa se les había hecho»
  obra: navarrete-1829-viages-menores
  pagina_impresa: '33 (no 34, como dejó T7)'
  lugar: Curiana OCCIDENTAL / Valfermoso
  clase: hecho-colonial (narración sobre la declaración del escribano Entramasaguas, fol. 16)
  epoca: contacto-temprano
  regla_3: >-
    que la gente de esa costa tuviera guanines para pagar en 1502 es dato; que
    los tuviera en el XV, casi seguro, pero hay que decirlo con su reserva:
    desde 1499 los españoles sacaban guanines de «Caquibacoa» y los vendían en
    La Española (m2.m2), así que el metal circulaba ya por manos castellanas.
    Y la institución del rescate «á precio de guanines» es aquí una respuesta a
    un saqueo español, no una costumbre observada en paz.
  fuerza: alta para el hecho

- id: m2.m2
  esfera: intercambio / contacto
  titulo: '🔴 La cédula de 1501: los españoles sacaban guanines de Paria y Coquibacoa y se los VENDÍAN a los taínos'
  cita: >-
    «algunas personas, sin tener para ello mi licencia é mandado, se han
    entrometido á descubrir é sacar mineros de ciertos metales que se dicen
    guanines en las islas de la Paria é de Caquibacoa, é de otras de las dichas
    islas é tierra-firme, é los han traído é traen á vender á los dichos indios
    de la dicha isla Española, é á otras partes»
  obra: navarrete-1829-viages-menores
  pagina_impresa: '518-519 (suplemento, doc. XLVII: real cédula, Granada, 3-IX-1501; del proceso de Vergara y Ocampo contra Hojeda)'
  lugar: Paria y Coquibacoa → La Española
  clase: documento (hecho-colonial)
  epoca: contacto-temprano
  por_que_importa: >-
    es el **vector 1 de Oliver documentado en el acto**, y en la dirección que
    interesa a la campaña del taíno: entre 1499 y 1501 el guanín de Tierra
    Firme —de Coquibacoa incluida— entraba en La Española en barcos
    castellanos. Todo guanín de las Antillas Mayores posterior a 1499 queda
    contaminado como prueba de contacto precolombino. Es un aviso para dc.4 y
    para T7 (t7.g1-g8).
  aviso: >-
    «mineros de ciertos metales» es la idea castellana (minas de guanín); no
    dice que se extrajera allí, sino que de allí se sacaba.
  fuerza: alta

- id: m2.m3
  esfera: intercambio / fauna
  titulo: 'Lo que Hojeda le enseñó a Roldán en septiembre de 1499: ciervos, conejos, pieles y garras de tigres, y guanines'
  cita: >-
    «dándole cuenta de su viaje, dijo que venía de descubrir por la costa de
    Paria al Occidente, seiscientas leguas, donde había hallado gente, que
    peleaba con los cristianos, con igual partido, y que le habían herido
    veinte hombres, por lo cual no pudo valerse de las riquezas de la tierra en
    que había hallado ciervos, conejos, pieles y garras de tigres y guaninis,
    que mostró á Roldan en las carabelas»
  obra: colon-hernando-1892
  pagina_impresa: '115'
  lugar: la costa de Paria al cabo de la Vela (viaje de Hojeda 1499) — sin sitio
  clase: noticia de Hojeda transmitida (Hernando ← papeles de su padre)
  epoca: contacto-temprano
  aviso: 'cadena larga (castellano ← italiano de Ulloa ← castellano perdido); y es el mismo episodio que Las Casas copia de la carta de Roldán (Navarrete p. 7 n. 1), que no trae la lista'
  fuerza: media

- id: m2.m4
  esfera: intercambio
  titulo: 'Santa Cruz (Bahía Honda), 1502: «una espuerta de guanines y de oro»'
  cita: >-
    «amedrentados los naturales se presentaron de paz con una espuerta de
    guanines y de oro que recibió Hojeda; á quien dijeron que fuese á otro
    cacique muy cercano que les daría mayor cantidad» (p. 35) · «un testigo
    ocular declara que pesaron cuarenta y dos marcos, seis onzas y cinco
    tomines» (p. 38)
  obra: navarrete-1829-viages-menores
  pagina_impresa: '35; 38'

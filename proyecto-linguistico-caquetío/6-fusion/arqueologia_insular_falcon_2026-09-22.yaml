# ══════════════════════════════════════════════════════════════════
# 11. LO QUE VI DE PASO
# ══════════════════════════════════════════════════════════════════
de_paso:
  - >-
    La zooarqueología que esta parcela buscaba está en obras que el repo no
    tiene, y dos parecen abiertas: Antczak 1998, tesis doctoral de la UCL
    sobre la economía de las islas frente a Venezuela a partir de la
    evidencia NO cerámica (UCL Discovery, eprint 1317899; según su propio
    resumen, un campamento valencioide de Dos Mosquises, 1400-1500 d.C.,
    vivía del botuto, con peces, langostas, tortugas y aves como
    complemento); y Oliver 1995, sobre una casa larga prehistórica en el
    sitio FAL-7 del valle del Matícora (UCL Discovery, eprint 10178203) —
    casas de Falcón, pregunta 1. Las dos son de la esfera oriental u
    occidental, no de la costera: regla 4.
  - >-
    Zavala Reyes et al. 2018 (Tabla II, p. 404) SÍ trae malacofauna
    cuantificada de un contexto caquetío de los ss. XIV-XVIII (Donax
    striatus, Callista sp., Lobatus gigas…), y T8 la minó para el botuto
    pero NO la dejó en el esquema `fauna:` del preámbulo. Es la mejor fuente
    de dieta del Golfete que el repo tiene hoy; merece su entrada.
  - >-
    Dijkhoff 1997 (tesis sobre Tanki Flip, en archive.org) y Versteeg y
    Rostain 1997 (la monografía de Tanki Flip) deberían traer la fauna del
    poblado mejor excavado de las ABC. T8 bajó la primera y no la minó para
    fauna.
  - >-
    Knaf 2021 cita los trabajos de movilidad humana por isótopos que la
    pregunta 3 quería: Laffoon et al. 2017 (PLoS One, estroncio y oxígeno,
    acceso abierto) y Laffoon et al. 2014 (colgantes de dientes de animal de
    Puerto Rico, J. Anthropol. Archaeol. 35). Si alguno trae muestras de las
    ABC o de Venezuela, es la pieza que falta.
  - >-
    Urbina 2011 (pp. 21-22) recoge una corazonada de Oliver: el complejo
    Guacoa podría ser de los xaguas, enemigos tradicionales de la polity
    caquetía de BARQUISIMETO y socios comerciales en la paz. Geografía
    política de otra polity (regla 4), y es comunicación personal.
  - >-
    Casale (p. 3) recoge que en Aruba sólo un 11 % del suelo sirve para
    agricultura de lluvia, y que los rooien se canalizaron probablemente ya
    en el Período Cerámico. Es ecología de la isla, sin entrar al corpus.
  - >-
    La transecta ARAAPICO sale con tres longitudes: 143 km (Urbina 2007,
    p. 18), 126 km prospectados en las dos primeras etapas (p. 35) y 203 km
    (Urbina 2011, pp. 18, 41 y 47). No se promedia.

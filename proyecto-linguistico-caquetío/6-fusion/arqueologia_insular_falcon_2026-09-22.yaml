no_encontrado:
  - "Ni una tabla de fauna, un NMI animal, un pez, una tortuga, un ave o un mamífero identificados en un contexto de la ventana, en ninguna de las cuatro obras."
  - "Ni una fecha absoluta propia para la ocupación cerámica de El Carrizal (corr-03)."
  - "La lista de los 192 sitios de Urbina 2011: no está en el documento (sólo mapas en imagen sin rótulos)."
  - "Ni una mención del mar en la creencia, el rito o el cosmos (medido; ver `mar.en_la_creencia`)."
  - "Ni una mención de las Antillas como origen o destino en el cuerpo de Casale 2024; ni una de Venezuela o las ABC en Knaf 2021."
  - "Ningún dato de movilidad humana por isótopos para la esfera caquetía: Knaf 2021 no lo es."
  - "Ningún origen propuesto para los cuatro tiestos que Casale cree importados."
  - "Moreno-Mayar 2018: nada del Caribe salvo el genoma taíno de Schroeder 2018 como referencia."


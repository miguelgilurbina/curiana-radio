    - [Tanki Flip, A.66, Urumaco, Undecorated, B, '1']
    - [Tanki Flip, A.67, Urumaco, Undecorated, A, '2']
    - [Tanki Flip, A.79, Early Urumaco, Decorated, '', '3']
    - [Tanki Flip, A.83, Early Urumaco, Decorated, '', '3']
    - [Tanki Flip, A.80, Early Urumaco, Decorated, '', '3']
    - [Tanki Flip, A.78, Early Urumaco, Decorated, '', 3a]

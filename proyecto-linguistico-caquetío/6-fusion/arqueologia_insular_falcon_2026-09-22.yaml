# ─────────────────────────────────────────────────────────────────────────
# PROPUESTA — la arqueología de las islas y de Falcón, y la genética que
# quedó pendiente
#
# Tercera campaña de minería, parcela M8 (2026-09-22). Encargo: minar lo
# pendiente de cuatro obras —urbina-jimenez-2007-2011 (parcial),
# casale-2024 y knaf-2021 (pendientes: el editor devolvía 403) y
# moreno-mayar-2018 (sin minar)— con cuatro preguntas: (1) los sitios
# dabajuroides de Falcón, Paraguaná y las ABC; (2) la dieta y la fauna de
# los depósitos; (3) el movimiento de gente entre islas, costa y más allá,
# contra el cuadro de T8 (`taino2_evidencia_material_contacto.yaml`); (4) el
# MAR en la vida y en la creencia.
#
# Regla 5: esto PROPONE. Regla 1: las cifras del lado del REPO (conteos de
# sondas, recuentos sobre las tablas transcritas, tamaños y sha256) las
# imprime `python 6-fusion/scripts/medir_arqueologia_insular_falcon.py`; las
# del lado de las fuentes son citas y llevan obra y página. Regla 3: todo
# lleva `epoca`, y cuando el contexto no está fechado se dice
# `indeterminada` (fuera del enum del preámbulo, a propósito: el depósito
# mezcla desde 13.000 a.p. hasta hoy y cualquier otro valor mentiría).
#
# PÁGINAS. Urbina 2007: impresa = pdf − 12 (comprobado en pp. 21, 37, 55,
# 60, 95). Urbina 2011: impresa = pdf − 4 (pp. 12, 17, 41, 77, 79). Casale
# 2024: se cita la paginación de la versión en línea (1-19), que es la que
# lleva el PDF; la del volumen es 609-627 (Crossref), o sea impresa en el
# vol. = en línea + 608. Knaf 2021: impresa = pdf − 1 (el repositorio de la
# ETH antepone una portada). Moreno-Mayar 2018: «N of 11» del artículo
# largo = pdf − 2.
# ─────────────────────────────────────────────────────────────────────────
meta:
  recogido: '2026-09-22'
  estado: propuesta
  parcela: M8 — arqueología insular y de Falcón; genética pendiente
  medido_por: 6-fusion/scripts/medir_arqueologia_insular_falcon.py
  continua_a: 6-fusion/taino2_evidencia_material_contacto.yaml   # T8, #196
  obras: [urbina-jimenez-2007-2011, casale-2024, knaf-2021, moreno-mayar-2018]

# ══════════════════════════════════════════════════════════════════
# 0. LO QUE DEL ENCARGO (Y DE LAS FICHAS) RESULTÓ FALSO AL MEDIRLO
# ══════════════════════════════════════════════════════════════════
correcciones:

  - id: corr-01
    afirmacion: >-
      «Knaf 2021 (movilidad por isótopos, si es lo que creemos)».
    lo_medido: >-
      NO es movilidad de personas. Es la discriminación geoquímica de las
      FUENTES DE JADE del circuncaribe: elementos traza e isótopos de Sr-Nd-Pb
      medidos en ROCAS (101 muestras de fuente de Guatemala, Cuba oriental y
      el norte de la República Dominicana) y aplicados a 19 hachas de jadeíta
      de un solo yacimiento, Playa Grande (norte de la R. Dominicana). Los
      isótopos, además, NO separan las fuentes (se solapan): lo que separa son
      cocientes de elementos traza (p. 13, conclusión). Venezuela, Aruba,
      Curazao, Bonaire, Paraguaná, Falcón y la Guajira: cero, con control
      positivo (lo imprime el script). La movilidad HUMANA por isótopos está en
      otras obras que Knaf cita (Laffoon et al. 2017, estroncio y oxígeno en
      personas; Laffoon et al. 2014, colgantes de dientes de animal de Puerto
      Rico): ver `de_paso`.
    consecuencia: >-
      La pregunta 3 no se contesta con Knaf. Lo que Knaf sí hace es cerrar la
      deuda que T8 dejó en `pie-01`: la red del jade conocida por geoquímica
      va de Guatemala a La Española y no toca la esfera caquetía. Ver `mov-04`.

  - id: corr-02
    afirmacion: >-
      Fichas `casale-2024` y `knaf-2021`: «Wiley y Elsevier devolvieron 403 a
      la descarga automática»; «lo único que se pudo leer es el resumen».
    lo_medido: >-
      Las dos tienen copia LEGAL y abierta, con su licencia CC-BY, en
      repositorios institucionales que sirven el archivo por su API DSpace
      sin muro ni verificación: Casale en Lirias (KU Leuven), versión
      publicada, licencia CC-BY 4.0 en los metadatos del archivo y en la p. 1
      del artículo; Knaf en la Research Collection de la ETH Zürich, versión
      publicada, CC-BY 4.0. Descargadas y en el repo (ver `descargas`). Lo que
      NO se hizo: Wiley sigue detrás de una verificación antibots de
      Cloudflare y no se forzó; Leiden y el CSIC bloquean con un sistema de
      protección y tampoco se forzaron.
    consecuencia: >-
      `cer-02` de T8 deja de estar degradado por «sólo el resumen»: ahora se
      lee el pasaje, y dice lo mismo que el resumen pero con su razón (ver
      `mov-02`).

  - id: corr-03
    afirmacion: >-
      Ficha `urbina-jimenez-2007-2011`, §1: «Una datación de dabajuroide en
      1650 d.C.» y «El de 2007 tiene fechas, pero coloniales (1650 d.C.)».
    lo_medido: >-
      Falso. El Carrizal NO tiene ninguna fecha absoluta propia para la
      ocupación cerámica. «1650» es el tope del rango RELATIVO que Oliver 1989
      da al complejo Los Médanos B (Urbina 2007, p. 94: la fecha más tardía
      «para nuestro componente prehispánico»), y además Urbina declara que Los
      Médanos NO está presente en El Carrizal: sólo Túcua y Urumaco (p. 82).
      Las únicas fechas radiocarbónicas del trabajo son las de Muaco y
      Taima-Taima, del Pleistoceno.
    consecuencia: >-
      El Carrizal no sirve para fechar nada de la ventana: su componente
      dabajuroide es Túcua-Urumaco (c. 800-1400/1450 por estilo, sin C-14), y
      el material colonial va aparte, al sur del valle.

  - id: corr-04
    afirmacion: >-
      Ficha `urbina-jimenez-2007-2011`, §1: «Piedemonte Costero no es la
      costa. Son elevaciones interiores».
    lo_medido: >-
      Matiz, no error. La autora lo dice de las dos maneras: el área está en
      el sistema de relieve Piedemonte Costero (p. 32) Y «en la costa
      marítima del Estado Falcón» (p. 11), junto a La Vela y Muaco. La
      transecta del Corredor Vinccler corre de norte a sur desde la costa: el
      sitio Falco 273 está «a 2 km de la costa» (p. 37) y Falco 286, sobre una
      duna, es «la ocupación cerámica más al norte» (p. 37).
    consecuencia: >-
      La cautela de regla 4 de la ficha sigue valiendo para la ETIQUETA
      (caquetíos del s. XVIII no son del XV), no para la geografía: El
      Carrizal es costa del Golfete oriental.

  - id: corr-05
    afirmacion: >-
      T8, `cer-01`: `obra: urbina-jimenez-2011`.
    lo_medido: >-
      Esa clave NO existe en `4-fuentes/bibliografia.yaml`: la obra es
      `urbina-jimenez-2007-2011` (una ficha para las dos tesis). Regla 8.
    consecuencia: >-
      Si `cer-01` se fusiona tal cual, el validador lo rechazará. Se anota en
      el issue; este documento no toca el de T8.

  - id: corr-06
    afirmacion: >-
      «moreno-mayar-2018: la campaña del taíno halló que es de BERINGIA, no
      del Caribe — confírmalo».
    lo_medido: >-
      Confirmado. Es el poblamiento temprano de América (genomas de
      Alaska a la Patagonia, Lagoa Santa, Spirit Cave, Trail Creek). Del
      Caribe tiene UNA línea: usa el genoma taíno antiguo de Schroeder et al.
      2018 y a los yukpa de Venezuela como poblaciones de referencia al
      modelar a los suramericanos (p. 5 of 11). Nada de caquetíos, de las
      ABC, de Falcón ni de la época. Cero arahuaco.
    consecuencia: >-
      Ficha cerrada como `minado`, sin aportación: no alimenta ninguna esfera.

# ══════════════════════════════════════════════════════════════════
# 1. EL VEREDICTO
# ══════════════════════════════════════════════════════════════════
veredicto: >-
  Las cuatro obras dan sitios y movimiento, casi nada de fauna y nada de
  creencia. Casale 2024, leída entera, confirma el cuadro de T8 desde la
  cerámica: en Aruba casi todo se hacía con arcillas de la isla, el grupo
  decorado del Urumaco Temprano no se puede adscribir (ni local, ni
  continental, ni antillano: la receta de la pasta lo impide), cuatro
  tiestos parecen importados sin que nadie diga de dónde, y todas las flechas
  de conexión que los autores dibujan van de cada isla a la costa de
  enfrente, ninguna de isla a isla ni hacia las Antillas. Knaf 2021 no es
  movilidad humana sino jade, y su red va de Guatemala a La Española sin
  tocar la esfera. La zooarqueología que se pedía NO está en estas obras:
  una sola especie nombrada (Strombus gigas en El Carrizal, sin fecha ni
  recuento por especie), hueso animal sin identificar, conchas genéricas y
  la concha como desgrasante de la loza. El mar sale como comida, como
  materia de la cerámica y como camino; como creencia, cero medido.

# ══════════════════════════════════════════════════════════════════
# 2. PREGUNTA 1 — LOS SITIOS (cronología, tamaño, casas, enterramientos)
# ══════════════════════════════════════════════════════════════════
sitios:

  # ───────────────────────── ARUBA (Casale 2024) ─────────────────────────
  - id: sit-01
    nombre: Tanki Flip
    lugar: Aruba, noroeste de la isla, sobre tonalita, junto a un rooi y un tanki (estanque excavado)
    obra: casale-2024
    pagina: "p. 3 (lugar) y p. 4 (excavación)"
    cronologia: >-
      «around 950–1250 C.E., which is the Early Urumaco period» (p. 4). ⚠️ La
      Tabla 1 del mismo artículo pone el Urumaco Temprano en 1200-1350 y
      asigna Tanki Flip a Túcua y a Urumaco Temprano y Tardío: el texto y la
      tabla no coinciden. No se promedia. Ver `cronologias`.
    tamano: «a large village with likely more than 100 inhabitants» (p. 4)
    casas: trece estructuras identificadas como casas; una empalizada grande que cerraba el borde norte, leída también como defensiva (p. 4)
    enterramientos: gente (re)enterrada dentro del poblado, entre grandes urnas de cerámica (p. 4)
    epoca: precontacto
    etiqueta: atestiguado
    nota: >-
      Casale resume aquí a Dijkhoff 1997 y a Versteeg y Rostain 1997; los
      datos de primera mano están en esas dos obras (la primera ya en el repo
      como ficha, `dijkhoff-1997`). No son una atestación independiente de
      ellas (skill §8).

  - id: sit-02
    nombre: Santa Cruz / Ser'i Noka
    lugar: Aruba, llanura árida central, 300 m al oeste del pueblo de Santa Cruz, junto a un rooi
    obra: casale-2024
    pagina: "pp. 4-5"
    cronologia: >-
      Período Cerámico «with evidence for earlier and later occupations»;
      al menos dos fases (p. 5). En la Tabla 1 (p. 3): Túcua, Urumaco
      Temprano y Tardío, Los Médanos A.
    tamano: no lo da; destruido casi entero por la construcción desde los años setenta (p. 5)
    casas: dos plantas de casa completas (campaña de Versteeg, años noventa), con fosas, agujeros de poste, fogones y basureros (p. 5)
    enterramientos: varios enterramientos, la mayoría en fosa, y un enterramiento en urna (años setenta); «a large number of burials» en los noventa (p. 5)
    epoca: precontacto
    etiqueta: atestiguado
    nota: la excavación de 1922-1923 dio unos 2.700 tiestos (p. 5, citando a Du Ry 1960)

  - id: sit-03
    nombre: Savaneta
    lugar: Aruba, sureste, a 1 km del mar, en la confluencia de varios rooien, sobre caliza
    obra: casale-2024
    pagina: "p. 5"
    cronologia: >-
      Ocupado probablemente durante todo el Período Cerámico (Du Ry 1960);
      pintura negro sobre rojo, propia de Los Médanos; en la Tabla 1 es el
      único sitio grande con Los Médanos B (1450-1515) (p. 3).
    tamano: no lo da; el pueblo actual está construido encima
    casas: no las da
    enterramientos: «many burial urns»; más enterramientos colectivos y urnas halladas después en el barrio General Majoor de Bruinewijk (p. 5)
    epoca: precontacto   # con continuidad hasta 1515 según la Tabla 1
    etiqueta: atestiguado

  - id: sit-04
    nombre: sitios menores de Aruba — California-2, Malmok-4, Altovista, Manzanilla-2, Banki Jerome-1
    lugar: costas de Aruba (norte, noroeste, nordeste y sureste)
    obra: casale-2024
    pagina: "p. 5"
    cronologia: >-
      Sin fecha propia. La Tabla 4 (pp. 16-17) les da estilos «Dabajuran or
      Historic» o «Urumaco or Historic» a buena parte de sus tiestos.
    tamano: >-
      California-2: 525 m², sobre una duna alargada, a unos 15 m del mar.
      Malmok-4: unos 20 m de diámetro, en la playa. Altovista: 2.500 m², a
      550 m de la costa. Manzanilla-2: 30 m de diámetro, a 400 m de la costa.
      Banki Jerome-1: 100 m de diámetro, a 450 m de la costa.
    casas: ninguna
    enterramientos: ninguno
    funcion: >-
      California-2 es «special activity site related to marine food
      exploitation»; los demás, campamentos temporales, sitios de actividad
      o de extracción (p. 3).
    epoca: indeterminada
    etiqueta: atestiguado

  - id: sit-05
    nombre: Parkietenbos y Tanki Leendert
    lugar: Aruba
    obra: casale-2024
    pagina: "p. 3"
    cronologia: no la da
    tamano: «large habitation sites», junto con los tres de arriba (p. 3)
    casas: no las da
    enterramientos: no los da
    epoca: indeterminada
    etiqueta: atestiguado

  # ───────────────────── FALCÓN (Urbina 2007 y 2011) ─────────────────────
  - id: sit-06
    nombre: Falco 286 (Área Arqueológica 2, El Carrizal)
    lugar: norte del área de El Carrizal, municipio Colina, sobre una duna con vegetación xerófita
    obra: urbina-jimenez-2007-2011
    pagina: "Urbina 2007, pp. 37-38 y 86"
    cronologia: >-
      Sin fecha absoluta. La cerámica del Área 2 es del componente
      Tortolitas (100 a.C.-800/1200 d.C., relativo), NO dabajuroide: el
      dabajuroide sólo aparece en las Áreas 3 y 4 (p. 86). Hay además una
      punta de la tradición El Jobo, que la autora no toma por ocupación
      paleoindia (p. 85).
    tamano: 1.656 m² aproximados (p. 37)
    casas: no
    enterramientos: >-
      «concheros y enterramientos humanos asociados a cerámica prehispánica»
      (p. 37), y fogones o topias (p. 38). Recolección sólo superficial y
      diagnóstica; nada excavado.
    epoca: precontacto   # relativa, y anterior al dabajuroide
    etiqueta: atestiguado
    aviso: >-
      ⚠️ Estos concheros y enterramientos NO son caquetíos por la cerámica que
      los acompaña: son del componente anterior. Quien los use para el s. XV
      tiene que decirlo.

  - id: sit-07
    nombre: Falco 270 (Área Arqueológica 4, El Carrizal)
    lugar: sur del área de El Carrizal; unifica ocho sitios de la prospección (Falco 269, 271-272, 282-285)
    obra: urbina-jimenez-2007-2011
    pagina: "Urbina 2007, pp. 38-41, 55-56, 86-87"
    cronologia: >-
      Palimpsesto: Tortolitas, dabajuroide (Túcua y Urumaco; Los Médanos
      ausente, p. 82), colonial y republicano. Posible primera fundación del
      pueblo de El Carrizal en los ss. XVI-XVII, con mayólica temprana junto a
      cerámica indígena (p. 38, citando a Arvelo y López 2004). Sin fechas
      absolutas; los pozos no dieron estratos culturales claros (p. 42).
    tamano: unas 7 ha (p. 39)
    casas: no
    enterramientos: >-
      Un enterramiento aflorado por la erosión en el Área 4, excavado en 31
      niveles de 2 cm y guardado en el CIAAP, asociado a cerámica indígena y
      fragmentos de bivalvos (p. 41). Número mínimo de individuos: uno,
      varón, adulto joven (p. 56). A 8 m del pozo 4, un túmulo de piedra
      contemporáneo (p. 42).
    epoca: indeterminada   # el enterramiento no está fechado y el sitio es colonial también
    etiqueta: atestiguado

  - id: sit-08
    nombre: Falco 273 (Área Arqueológica 3, El Carrizal)
    lugar: norte del valle, a 2 km de la costa, junto a Muaco (Fal 104)
    obra: urbina-jimenez-2007-2011
    pagina: "Urbina 2007, p. 37"
    cronologia: componentes Tortolitas y dabajuroide por estilo; sin fecha
    tamano: unos 475 m² (p. 37)
    casas: no
    enterramientos: no
    epoca: precontacto   # relativa
    etiqueta: atestiguado

  - id: sit-09
    nombre: la base de 192 sitios agroalfareros de Falcón costero
    lugar: costa de Falcón y Paraguaná
    obra: urbina-jimenez-2007-2011
    pagina: "Urbina 2011, pp. 35-36, 40-42 y figs. 17 y 19 (pp. 77 y 79)"
    cronologia: >-
      Por identificación cultural: Tortolitan, Dabajuroid, ambas, otra o sin
      identificar. Los sitios dabajuroides están sobre todo en la llanura por
      debajo de 80 m; los tortolitanos al pie del piedemonte, de 160 a 400 m
      (p. 42).
    tamano: sólo el 35,41 % de los sitios traía su tamaño (p. 36); el texto no lo publica sitio a sitio
    casas: «household» es uno de los tipos de sitio, sin más detalle (p. 36)
    enterramientos: >-
      Patrón: donde hay montículos o concheros en la costa, los enterramientos
      están más tierra adentro; donde no los hay, los enterramientos están
      también en la costa (p. 40). Montículos y concheros se concentran en el
      extremo OCCIDENTAL del estado (p. 40, fig. 17).
    epoca: indeterminada   # base definida como prehispánica, pero con reocupación colonial en varios sitios (p. 36) y sin fechas propias
    etiqueta: atestiguado
    aviso: >-
      ⚠️ La lista de los 192 NO está en el documento: sólo mapas en imagen
      (figs. 17-31) sin rótulos de sitio; la fig. 3 reproduce el mapa de
      Oliver 1989 con sus números FAL. Y la fig. 17 (tipos de sitio) no pinta
      NINGÚN sitio en Paraguaná, mientras la fig. 19 (identificación
      cultural) sí los pinta: los de la península no tenían tipo registrado.
      El texto dice que en Paraguaná la mayoría de los sitios está en la
      mitad oriental, donde está el agua (p. 41). La portada pide no citar
      sin permiso del Instituto: se usa como medida, no como autoridad.

  - id: sit-10
    nombre: Coy-Coy de Uria
    lugar: cueva en la Sierra de San Luis, Falcón
    obra: urbina-jimenez-2007-2011
    pagina: "Urbina 2011, p. 21 (citando a Pitevill 1984)"
    cronologia: >-
      Un C-14 de 1450 ± 80 a.p. y dos TL de 400 ± 43 y 295 ± 57 a.p.; la
      cerámica está mezclada con dabajuroide y lleva negro sobre rojo de Los
      Médanos, de 1200 d.C. en adelante. La autora no resuelve la
      contradicción. No se promedia.
    epoca: indeterminada
    etiqueta: atestiguado
    nota: sierra, no costa (regla 4)

# ══════════════════════════════════════════════════════════════════
# 2b. LAS CRONOLOGÍAS NO COINCIDEN — y no se promedian
# ══════════════════════════════════════════════════════════════════
cronologias:
  - esquema: Oliver 1989, tal como lo reproduce Urbina 2007 (Tabla 4, p. 120) y 2011 (p. 20)
    tucua: 800 – 1100/1200 d.C.
    urumaco: 1100/1200 – 1400/1450 d.C.
    los_medanos: 1350 – 1600/1650 d.C. (A, prehistórica; B, histórica)
  - esquema: Casale et al. 2024, Tabla 1 (p. 3), citando a Dijkhoff 2022, Haviser 1987, Nomland 1933 y Oliver 1997
    tucua: 850 – 1200 d.C.
    urumaco_temprano: 1200 – 1350 d.C.
    urumaco_tardio: 1350 – 1500 d.C.
    los_medanos_a: 1400 – 1450 d.C.
    los_medanos_b: 1450 – 1515 d.C.
  - esquema: Urbina 2007, clases del Informe ARAAPICO (Arvelo y López 2004), p. 65
    ocupacion_dabajuro: 800 – 1492 d.C.
lectura: >-
  Para la ventana simulada (s. XIV-XV) los dos esquemas cambian qué había en
  las manos de los agentes: con Oliver, la bisagra Urumaco Tardío → Los
  Médanos A cae hacia 1350-1450; con la Tabla de Casale, Urumaco Tardío dura
  hasta 1500 y Los Médanos A es un medio siglo (1400-1450). Y Casale fecha
  Tanki Flip en 950-1250 «Early Urumaco» en el texto mientras su propia tabla
  pone el Urumaco Temprano en 1200-1350. Son tres fuentes con tres cortes:
  decidir cuál usa el motor es decisión de Miguel (issue).

# ══════════════════════════════════════════════════════════════════
# 3. PREGUNTA 2 — LA DIETA Y LA FAUNA DE LOS DEPÓSITOS
# ══════════════════════════════════════════════════════════════════
dieta_resumen: >-
  Estas cuatro obras NO traen zooarqueología: ninguna tabla de fauna,
  ningún NMI animal, ningún pez, tortuga, ave ni mamífero identificado en un
  contexto de la ventana. Lo que hay: una especie nombrada (Strombus gigas,
  El Carrizal), 1.089 fragmentos de hueso humano y animal de los que el
  animal no se identificó, conchas sin especie en casi todos los sitios de
  Aruba, y la concha como desgrasante. La lista de fauna del Pleistoceno de
  Muaco y Taima-Taima (Anexo 1 de Urbina 2007) NO informa del s. XV y va
  aparte, en `fauna_excluida`. La zooarqueología de la costa caquetía hay
  que ir a buscarla a otras obras: ver `no_encontrado` y `de_paso`.

fauna:
  - nombre_en_fuente: Strombus Gigas
    especie_probable: 'Lobatus gigas (= Strombus gigas), botuto'
    texto: 'Los restos de concha pudieron ser identificados como Strombus Gigas'
    obra: urbina-jimenez-2007-2011
    pagina_impresa: 55   # Urbina 2007
    lugar: 'El Carrizal (Corredor Vinccler: Falco 270, 273 y 286), municipio Colina, costa de Falcón'
    epoca: indeterminada
    sonido: null
    cantidad: >-
      La categoría «Concha» suma 449 fragmentos, el 7,66 % de la colección
      (p. 55 y Tabla 7, p. 123), casi todo acumulaciones de concha no
      trabajada; sólo 15 fragmentos diagnósticos. El texto NO dice si los 449
      son Strombus o si la identificación vale para los diagnósticos.
    artefactos: 'una cuenta discoidal y una ficha de concha (Lam 16, p. 211; verificado en imagen)'
    nota_epoca: >-
      Recolección de superficie en un palimpsesto de 13.000 a.p. a hoy; la
      autora dice que la naturaleza del material no permitió usarlo para
      fechar (p. 55) y que la concha se reparte igual al norte y al sur

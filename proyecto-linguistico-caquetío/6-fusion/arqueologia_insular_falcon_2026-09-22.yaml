    de los sitios de megafauna de Muaco y Taima-Taima (14.000-8.000 a.p.).
    Hay especies que siguen vivas (Didelphis marsupialis, Desmodus rotundus,
    Panthera onca) junto a mastodontes, gliptodontes y caballos extintos.
    Es PLEISTOCENO: no dice qué animales vivían con los caquetíos, y meterlo
    en `fauna:` con cualquier `epoca` invitaría a proyectarlo. Se deja aquí,
    señalado, para que ningún agente de fauna lo recoja por error.
  obra: urbina-jimenez-2007-2011
  pagina_impresa: 225

# ══════════════════════════════════════════════════════════════════
# 4. PREGUNTA 3 — EL MOVIMIENTO DE GENTE, CONTRA EL CUADRO DE T8
# ══════════════════════════════════════════════════════════════════
movimiento:

  - id: mov-01
    titulo: "Todas las flechas van de una isla a la costa de enfrente: ninguna de isla a isla, ninguna hacia las Antillas"
    obra: casale-2024
    pagina: "p. 2 (fig. 1, verificada en imagen) y p. 3"
    epoca: precontacto (conexiones establecidas por estilo cerámico, sin fecha propia)
    etiqueta: atestiguado
    que_dice: >-
      La fig. 1 dibuja «the main connection between the islands and the
      mainland established through stylistic analysis»: Aruba con Falcón (dos
      flechas, hacia el Golfo y hacia Paraguaná), Curazao con la costa de
      Falcón, Bonaire y Los Roques con la región de Valencia. El texto (p. 3):
      Aruba en más contacto con la costa de Falcón por los estilos Los
      Médanos y Urumaco; Bonaire, Curazao y las figurillas de Los Roques con
      el río Yaracuy y la región de Valencia (Haviser 1991; Kasztovszky et al.
      2004; Bohus et al. 2005).
    contra_t8: >-
      CONFIRMA `cer-04` («Aruba mira al oeste y al sur») desde una obra
      posterior y del mismo equipo de Leiden. Y le da forma a la sospecha que
      T8 anotó de paso (Dijkhoff: el contacto Aruba-Curazao iba «a través del
      continente»): el mapa de conexiones es un RADIO desde la costa, no un
      arco de islas. ⚠️ Es un dibujo de conexiones estilísticas, no una ruta
      medida.

  - id: mov-02
    titulo: "El grupo decorado no se puede adscribir, y no por falta de lectura: por la receta"
    obra: casale-2024
    pagina: "pp. 12-14 (resultados y discusión) y p. 17 (Tabla 4, verificada en imagen)"
    cita_corta: >-
      «inhibits an understanding of whether the vessels were imported or locally produced»
    epoca: precontacto (Urumaco Temprano, por estilo)
    etiqueta: atestiguado
    que_dice: >-
      El grupo 3 es una pasta calcárea de origen de sedimentación MARINA, con
      grumos y vetas de arcilla (mezcla de arcillas, quizá chamota) y concha
      añadida como desgrasante; es casi todo decorado y del Urumaco Temprano,
      y aparece en los tres poblados grandes (Tanki Flip, Ser'i Noka,
      Savaneta). Los autores proponen dos lecturas: una producción
      centralizada que surtía a los tres, o conocimiento técnico compartido
      entre alfareras (o intercambio de arcilla) (p. 13). Los grupos 1 y 2 son
      locales: tonalita/cuarzo-diorita del noroeste y arcillas mixtas del
      sureste de la isla.
    contra_t8: >-
      T8 (`cer-02`) dejó tres futuros: grupo 3 local con otra receta,
      continental o antillano. El artículo no elige ninguno: dice que la
      preparación de la pasta impide saberlo. NINGUNA mención a las Antillas
      en el cuerpo del artículo: las 13 apariciones de «Antill-» son todas de
      la bibliografía («Netherlands Antilles», congresos de las Antillas
      Menores) — lo imprime el script. Y el marco de comparación que los
      autores piden para el futuro es la costa norte de Venezuela, Curazao,
      Bonaire y Los Roques (p. 17), no el arco antillano.
    cambio_de_etiqueta: >-
      `cer-02` de T8 puede subir de `hipotetico` (sólo resumen) a
      `atestiguado` en lo que afirma —que el origen del grupo 3 es
      indeterminable—, porque ahora está leído el pasaje. Lo decide Miguel.

  - id: mov-03
    titulo: "Cuatro tiestos parecen importados, y nadie dice de dónde"
    obra: casale-2024
    pagina: "p. 13 (texto) y pp. 16-17 (Tabla 4, verificada en imagen)"
    epoca: precontacto   # A.175 Túcua/Urumaco Temprano, TL.5 Urumaco Temprano; A.46 y TL.2 Urumaco
    etiqueta: atestiguado
    que_dice: >-
      Cuatro muestras no casan con ninguna arcilla de la isla y los autores
      proponen que «were likely imported from outside Aruba or manufactured
      with clay sources not identified during the clay survey». No proponen
      origen. Una (TL.5) es roca volcánica, posible basalto o andesita.
    discrepancia_interna: >-
      ⚠️ El texto dice que esas cuatro vienen exclusivamente de los tres
      poblados mayores (Savaneta, Tanki Flip, Ser'i Noka); la Tabla 4 pone dos
      en Savaneta y Ser'i Noka (A.46, A.175) y DOS en Tanki Leendert (TL.2,
      TL.5), y ninguna en Tanki Flip. Y los recuentos del texto (grupo 2:
      siete; grupo 3: catorce) no son los de la tabla, que sí suma los
      cincuenta tiestos del muestreo. El script lo cuenta desde la
      transcripción de `casale_tabla4`. No se corrige a los autores: se
      declara.
    contra_t8: >-
      Es el único indicio material de objetos que LLEGAN a Aruba que da la
      parcela, y va sin dirección. No añade nada al eje antillano.

  - id: mov-04
    titulo: "La red del jade conocida por geoquímica no toca la esfera caquetía"
    obra: knaf-2021
    pagina: "p. 1 (resumen) y p. 13 (discusión y conclusión)"
    cita_corta: >-
      «3 celts of exotic origin (16%, Fig. 2), connecting Hispaniola to Guatemala»
    epoca: >-
      precontacto: el estrato de la hacha DR-PG-18 tiene C-14 calibrado
      790-1000 d.C. y otra fecha de 1340-1470 d.C. en la misma unidad; los
      autores concluyen que las piezas llegaron probablemente entre fines
      del s. VIII y el XI (p. 13)
    etiqueta: atestiguado
    que_dice: >-
      Las fuentes regionales de jadeíta son Guatemala (norte y sur de la
      falla del Motagua), Cuba oriental y el norte de la R. Dominicana; de 19
      hachas de Playa Grande, 16 son dominicanas y 3 guatemaltecas pese a
      tener una fuente a 25 km. Distancia por rutas indígenas: más de 3.200
      km (p. 13).
    contra_t8: >-
      Cierra la deuda de `pie-01` con un NEGATIVO medido: ni una sola
      mención de Venezuela, Aruba, Curazao, Bonaire, Falcón, Paraguaná ni la
      Guajira, con control positivo (Guatemala, Dominican, Cuba). Refuerza lo
      que Queffelec 2024 decía por tipología: la piedra verde antillana mira
      a Centroamérica por un camino que no pasa por aquí.

  - id: mov-05
    titulo: "Aruba → El Carrizal, 1723: una migración COLONIAL de caquetíos de la isla a la costa"
    obra: urbina-jimenez-2007-2011
    pagina: "Urbina 2007, pp. 20-21, 95 y 115 (Documento N 3)"
    cita_corta: >-
      «a los dichos yndios Urubanos que al presente estan fundados en este sitio del Carrisal»
    epoca: colonial   # 7 de septiembre de 1723
    etiqueta: atestiguado
    que_dice: >-
      La donación de tierras de Taratara y El Carrizal hecha por Pedro y Juan
      de la Colina y Peredo (Archivo Histórico de Coro, Instrumentos Públicos,
      ff. 494v-495) es a «varias familias de Indios Caquetios venidos de
      Aruba» que pedían doctrina. Antes, según la visita del obispo Martí
      (Fortique 1989), el lugar lo habían dejado indios de nación caquetía que
      se fueron a poblar Guaibacoa (p. 20).
    contra_t8: >-
      Es la dirección contraria a la carta de Ampíes (T8 `eth-01`: la gente
      de la costa «se pasaba allá», 1525) y dos siglos después: el tránsito
      costa ↔ islas funcionaba en los dos sentidos también en la Colonia.
      Regla 3: NO se proyecta al s. XV.
    aviso: >-
      ⚠️ Toca a `martinez-cruzado-2003`: esa obra cita El Carrizal como pueblo
      de caquetíos según Fortique 1989. Si los caquetíos de El Carrizal del
      XVIII eran ARUBANOS, El Carrizal y Aruba no son dos poblaciones
      independientes para una comparación genética: una desciende en parte
      de la otra.

  - id: mov-06
    titulo: "Un diseño de Ranchería hecho en casa: el pajarito de Los Médanos"
    obra: urbina-jimenez-2007-2011
    pagina: "Urbina 2007, p. 60 (resumiendo a Oliver 1989)"
    epoca: precontacto   # Los Médanos, 1350-1600/1650 por estilo
    etiqueta: atestiguado   # para lo que dice Oliver; Urbina lo resume
    que_dice: >-
      El complejo Los Médanos tiene cuencos con diseño ornitomorfo negro
      sobre rojo que sólo se encuentran en el valle de Ranchería (complejo
      Portacelli, Colombia): idéntico a Portacelli pero de manufactura local.
    contra_t8: >-
      Es el eje OESTE de T8 (Guajira/Ranchería) visto en un motivo: viaja el
      diseño, no la vasija. Misma lógica que Casale en Aruba.
    aviso: >-
      Es Oliver 1989 contado por Urbina, no una observación de Urbina: en El
      Carrizal Los Médanos no está presente (p. 82). Se cita a Oliver cuando
      se cite.

  - id: mov-07
    titulo: "Dentro de Aruba: arcillas compartidas y familia que se visita"
    obra: casale-2024
    pagina: "p. 13"
    epoca: precontacto (fase Urumaco), con continuidad al período histórico
    etiqueta: hipotetico   # es la interpretación de los autores
    que_dice: >-
      Ningún poblado grande tenía una fuente de arcilla preferente; las
      comunidades usaban las mismas fuentes del noroeste y del sureste. Los
      autores lo leen como movimiento dentro de la isla: áreas de actividad a
      kilómetros de los poblados, visitas a parientes, interacción
      norte-sur. Y añaden (colonial): entre los ss. XVI y XIX Aruba mantuvo
      una mayoría de población indígena con poca interacción con el resto del
      Caribe (Kelly 2012).

# ══════════════════════════════════════════════════════════════════
# 5. PREGUNTA 4 — EL MAR EN LA VIDA Y EN LA CREENCIA
# ══════════════════════════════════════════════════════════════════
mar:
  en_la_vida:
    - id: mar-01
      que: la concha y la arcilla del mar hacen la loza decorada
      texto: 'the raw materials used to manufacture these ceramics most likely originated from marine sedimentation'
      obra: casale-2024
      pagina: "p. 12"
      epoca: precontacto   # Urumaco Temprano, por estilo
      etiqueta: atestiguado
      nota: >-
        La loza DECORADA del Urumaco Temprano de Aruba se hacía con arcilla de
        sedimentación marina y concha molida añadida; la de diario, con
        arcillas de tierra adentro. Que la vajilla fina lleve el mar dentro es
        un dato técnico; leerlo como simbólico sería nuestro, no de la fuente.
    - id: mar-02
      que: la concha como desgrasante es rasgo del estilo Dabajuro
      texto: 'Desgrasante de arena y concha'
      obra: urbina-jimenez-2007-2011
      pagina: "Urbina 2007, pp. 117-118 (Tablas 1 y 2, que reproducen a Cruxent y Rouse 1982)"
      epoca: precontacto   # períodos IV-V de Cruxent y Rouse
      etiqueta: atestiguado
      nota: >-
        La misma tabla anota, del estilo La Mulera (tierra adentro, San
        Cristóbal), que su desgrasante es de arena porque allí «no se
        conseguía concha». Es Cruxent y Rouse, no Urbina. Y Du Ry (vía Casale
        p. 5) describe el estilo Savaneta como templado con concha y cuarzo.
    - id: mar-03
      que: sitios hechos para comer del mar
      texto: 'special activity site related to marine food exploitation'
      obra: casale-2024
      pagina: "p. 5"
      epoca: indeterminada
      etiqueta: atestiguado
    - id: mar-04
      que: concheros en la costa, y los muertos en otra parte
      obra: urbina-jimenez-2007-2011
      pagina: "Urbina 2011, p. 40; Urbina 2007, p. 37"
      epoca: indeterminada
      etiqueta: atestiguado
      nota: >-
        En la costa de Falcón, donde hay montículos o concheros los
        enterramientos se apartan tierra adentro; donde no, también van en la
        costa (Urbina 2011). En Falco 286 conchero y enterramientos comparten
        sitio, pero con cerámica anterior a la caquetía (Urbina 2007).
    - id: mar-05
      que: el mar como camino corto
      texto: 'The island is situated 30 km north of the coast of the Venezuelan Paraguaná peninsula'
      obra: casale-2024
      pagina: "p. 2"
      epoca: n/a — geografía
      etiqueta: atestiguado
    - id: mar-06
      que: la cercanía a la costa explica dónde se vive
      obra: urbina-jimenez-2007-2011
      pagina: "Urbina 2007, p. 94"
      epoca: n/a — es interpretación de la autora
      etiqueta: hipotetico
      nota: >-
        Urbina explica la coincidencia entre el área arqueológica y la
        geográfica porque la cercanía a la costa da acceso al alimento, al
        comercio y al control del territorio. Es su lectura, sin dato de
        fauna que la sostenga.
  en_la_creencia:
    resultado: CERO
    lo_medido: >-
      Ninguna de las cinco obras (Urbina 2007, Urbina 2011, Casale 2024,
      Knaf 2021, Moreno-Mayar 2018) dice NADA sobre el mar en la creencia.
      Se barrieron sondas de creencia en español y en inglés, con raíz corta
      y sin acentos (cosmo-, belie-, creenc-, ritual, sacred, sagrad-,
      ceremon-, religi-, myth/mito, ofrend-, offering, deit-/deidad, cemí,
      zemi, idol-, shaman/chamán, piache, ajuar funerario, grave goods). Lo
      que sale son: títulos de la bibliografía (Antczak 2006, «Los Ídolos de
      las Islas Prometidas», en Casale), el jade «sacred» entre cazadores
      neolíticos del mundo (Knaf, p. 1) y la palabra en contextos que no son
      marinos. El control del mismo barrido —mar, sea, shell, concha, coast—
      sale positivo. El script imprime cada acierto con su contexto.
    lo_que_si_hay_de_la_muerte: >-
      Los enterramientos: dentro del poblado entre urnas grandes en Tanki
      Flip, en fosa y en urna en Ser'i Noka, muchas urnas y entierros
      colectivos en Savaneta (Casale pp. 4-5), un varón adulto joven con
      bivalvos en El Carrizal (Urbina 2007, pp. 41 y 56), y las «bases
      convexas de urnas funerarias» del estilo Dabajuro (Cruxent y Rouse vía
      Urbina 2007, p. 118). Ninguna fuente lo liga al mar.
    para_la_tesis_de_miguel: >-
      Estas obras NO refutan que el mar fuera esencial en la cosmovisión
      caquetía: no hablan de cosmovisión. Dicen que el mar estaba en la
      comida, en la loza fina y en el camino. Un cero en arqueometría y
      prospección es un cero de género, no de pueblo: la pregunta hay que
      llevarla a las crónicas y a la creencia ya minada (Oviedo, Pané, la
      campaña de corpus de creencia), no a estas cuatro.

# ══════════════════════════════════════════════════════════════════
# 6. LENGUA — lo que salió de paso, y va a otra esfera
# ══════════════════════════════════════════════════════════════════
lengua_de_paso:
  - id: len-01
    forma: kaketio / kakitho
    glosa_en_fuente: >-
      «glosses as ‘people’ but those whom are of a more intimate contact (in
      contrasts to human beings.)»
    obra: urbina-jimenez-2007-2011
    pagina: "Urbina 2011, p. 17, nota 7 — comunicación personal de J. Oliver, 2011"
    etiqueta: hipotetico
    por_que_degradado: >-
      Es una glosa de un lingüista del s. XX dada de palabra a una
      estudiante, sin fuente primaria. Compite con la de Galeoto Cey,
      «caquetíos, que quiere decir buena gente» (s. XVI, vía Zavala Reyes
      2018, p. 401), que sí es de época. No se fusiona por encima de Cey.
  - id: len-02
    forma: kasike ← Proto-Maipure *ka 'con' + *sikua 'casa'
    glosa_en_fuente: 'cacique = «head of the house»; kasiku/a-re, el territorio de la cabeza de la casa'
    obra: urbina-jimenez-2007-2011
    pagina: "Urbina 2011, p. 17, nota 7 — comunicación personal de J. Oliver"
    etiqueta: hipotetico
    nota: >-
      Si se quisiera usar, es una etimología reconstruida para el maipure,
      no para el caquetío, y choca con la política de que el reconstruido no
      compite con lo atestiguado: `cacike` ya está en el lexicón como voz de
      la esfera. Va al issue como curiosidad, no como propuesta.

# ══════════════════════════════════════════════════════════════════
# 7. LAS TABLAS TRANSCRITAS (las lee el script: regla 1)
# ══════════════════════════════════════════════════════════════════
# Casale et al. 2024, Tabla 4 (pp. 16-17). Transcrita del PDF y VERIFICADA
# EN IMAGEN fila a fila (render de pymupdf de las dos páginas). Columnas:

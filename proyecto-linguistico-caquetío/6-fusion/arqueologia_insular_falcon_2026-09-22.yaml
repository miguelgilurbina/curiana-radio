# 8. LO QUE PROPONGO — y lo decide Miguel (regla 5)
# ══════════════════════════════════════════════════════════════════
propuesta:

  - id: prop-01
    donde: 6-fusion/taino2_evidencia_material_contacto.yaml (T8)
    que: >-
      (a) Corregir `cer-01` → `obra: urbina-jimenez-2007-2011`. (b) En
      `cer-02`, subir la etiqueta a `atestiguado` y cambiar la página a «pp.
      12-14 (versión en línea)», porque el pasaje ya está leído. (c) En
      `pie-01`, cerrar la `deuda` con `mov-04` de aquí.

  - id: prop-02
    donde: 3-mundo/asentamientos.yaml (o geografia_politica.yaml)
    que: >-
      Los tres poblados grandes de Aruba (Tanki Flip, Ser'i Noka, Savaneta)
      como nodos de la esfera con lo que Casale da: casas, empalizada,
      enterramientos en urna, cronología por estilo — con la discrepancia de
      fechas declarada. Hoy la esfera nombra las ABC pero no tiene sus
      aldeas.

  - id: prop-03
    donde: 3-mundo/corpus/ecologia.yaml
    que: >-
      Un hecho nuevo, atestiguado: «la loza decorada del Urumaco Temprano de
      Aruba se hacía con arcilla de sedimentación marina y concha molida
      añadida; la loza de diario, con arcillas de la tierra» (Casale 2024,
      pp. 1 y 12). Dominios: [ceramica, mar]. Es el mar dentro de la casa,
      sin interpretación simbólica.

  - id: prop-04
    donde: 3-mundo/corpus/creencia.yaml
    que: >-
      NADA. Esta parcela no encontró creencia. Se propone sólo que el issue
      deje escrito el cero, para que nadie vuelva a buscar cosmovisión marina
      en arqueometría.

  - id: prop-05
    donde: decisión de Miguel
    que: >-
      Qué esquema cronológico del dabajuroide usa el motor para decidir qué
      loza hay en la ventana: Oliver 1989 (Los Médanos desde 1350) o la Tabla
      1 de Casale (Urumaco Tardío hasta 1500, Los Médanos A 1400-1450).


    cruce:
      lexicon: >-
        nada por forma (kira, wayuu iita: ruido). Por glosa: amaka 'sitio
        de moler maíz', kasá 'puche de maíz' [caq. atestiguado] — el campo
        del maíz procesado es caquetío atestiguado, pero no hay término de
        TEXTURA de la masa.
      morfologia: >-
        ⭐ La pareja chirita 'fina' / machire 'no fina, granulosa' se deja
        analizar como raíz chir- + PREFIJO PRIVATIVO ma- 'sin, carente de'
        — que el lexicón tiene como caquetío-reconstruido (ma, cognado
        directo del wayuu ma-; morfologia.md §prefijos) y que aparece en
        madunaka 'sequía' (ma + duna 'agua'). Es decir: machire = ma-chire
        'sin finura'. Y chirita puede ser chir- + diminutivo castellano
        -ita ('finita'), lo que haría de la pareja un híbrido: raíz
        indígena con afijo arahuaco en una forma y castellano en la otra.
      cognados: nada
      fonotactica: pasa (kirita, makire)
      fuera_del_repo: "ninguna de las dos está en Alvarado 1921"
    filtros:
      "1 castellano": "chirita no restituye (chira 'harapo' no encaja; -ita podría ser el diminutivo); machire no restituye a nada"
      "2-6": "sin candidato"
    criterios_positivos:
      "1 campo local": "sí — la textura de la masa de maíz para la arepa: oficio diario"
      "2 distribución restringida": "sí — única fuente"
      "3 fonotáctica": "pasa"
      "morfología arahuaca": "sí, como hipótesis — el par con ma- privativo es la estructura que el protocolo llama 'correspondencia regular', aquí gramatical y no fonológica"
    veredicto: C
    certeza: media
    razon: >
      Sube por la morfología y no por la forma: dos voces sin filiación
      que, tomadas JUNTAS, muestran el prefijo privativo arahuaco ma- en
      uso vivo sobre una raíz común — la primera evidencia de morfología
      caquetía productiva en el habla del XX que da el dictado. Queda C
      (no B) porque la raíz chir- no tiene cognado ni atestación y el
      análisis es hipótesis del escriba; si Miguel confirma que en
      Paraguaná se dice «está machire» con ese sentido y no hay otra
      palabra machire, el par merece un issue de morfología. Al corpus
      (oficios: cocina del maíz) como hipotético, las dos.
    propuesta:
      destino: "corpus (oficios), y nota en 2-lengua/morfologia.md §ma- como posible atestación viva del privativo — a decidir"


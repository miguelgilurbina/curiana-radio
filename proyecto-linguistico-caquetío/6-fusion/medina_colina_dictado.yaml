      porque la conoce en su uso. Origen discutido (se ha propuesto el
      etnónimo cayapa/chachi del Ecuador; no hay candidato arahuaco). Lo
      que vale es la INSTITUCIÓN: trabajo colectivo recíproco por licor y
      comida — mc-mundo-009.

  - voz: chaguaca
    lectura_de_oido: "dictado «chihuahua, chaguaca» — leído chaguaca; cotejar"

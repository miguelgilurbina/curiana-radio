# 6-fusion/medina_colina_dictado.yaml — PROPUESTA (regla 5: nada de aquí toca
# el lexicón ni el corpus; el humano fusiona).
#
# La sesión de dictado de *Del Habla Paraguanera. Siglo XX* (Medina Colina,
# 2ª ed. 2013). Miguel lee el ejemplar físico y dicta las voces que su ojo de
# paraguanero señala como posible herencia indígena; el escriba cruza cada una
# contra el canon y aplica el protocolo (02_protocolo_habla_paraguanera §3-5).
#
# Bitácora: 4-fuentes/medina-colina-sxx.md · Fuente: medina-colina-sxx

meta:
  fuente: medina-colina-sxx
  metodo: >
    Dictado curado por Miguel: lectura del ejemplar físico → reconocimiento de
    voz → escriba. La criba de Miguel ES la marca `retro-abstraido`.
  inicio: 2026-09-01
  protocolo: 5-experimento/disenos/02_protocolo_habla_paraguanera.md
  bitacora: 4-fuentes/medina-colina-sxx.md
  advertencia_transcripcion: >
    Lo dictado llega por reconocimiento de voz y trae erratas de oído ("del
    agua" por "del habla", "para aduanera" por "paraguanera"). Toda cita lleva
    `segun_dictado: true` hasta que se coteje contra el papel; las palabras
    dudosas van con [?]. Las GLOSAS de las voces se dictan letra a letra
    cuando haga falta: la glosa textual es lo citable (regla 8).
  regla_cero: >
    Ninguna voz de este libro entra como caquetía por defecto. Cadena:
    paraguanerismo → ¿sustrato indígena? → ¿de cuál estrato? → etiqueta,
    nunca mejor que `hipotetico` desde esta fuente sola.

ficha:
  autor: "Medina Colina, Juan Bautista"
  firma_en_portada: "Juan B. Medina Colina"
  titulo: "Del Habla Paraguanera. Siglo XX"
  edicion: "2ª, ampliada y corregida"
  anio: 2013
  diseno_editorial: "Maribel Ovalles Miranda"
  impresion: "Editorial Miranda"
  ciudad: null                 # no dictada — preguntar (¿Punto Fijo? ¿Coro?)
  primera_edicion:
    anio: null                 # el prefacio no lo dice
    reconocimiento: "mención honorífica del Centro Nacional del Libro (CENAL) el año en que circuló"
  dedicatoria:
    a: "sus nietos, bisnietos y sobrinos [?] — «el recuerdo de un abuelo que les ama»"
    cita: "la premisa que lo une al hombre es el sentimiento, no la sangre"
    segun_dictado: true
  dictado: 2026-09-01

prefacio:
  autor: "Guillermo de León Calles"
  relacion_con_el_autor: "compañero de bachillerato («desde los tiempos en que compartimos las aulas iniciales del bachillerato»)"
  segun_dictado: true
  resumen: >
    Presenta a Medina Colina como «apasionado defensor del ancestro peninsular»
    desde hace décadas. El origen del libro: además de compilaciones ligadas a
    acontecimientos históricos transmitidos casi siempre de forma ORAL por sus
    ascendientes, el autor fue registrando en un CUADERNO ESCOLAR una variedad
    de expresiones [dictado: «excepciones» — leer «expresiones»], que derivó en
    la obra. La 1ª edición recibió mención honorífica del CENAL el año en que
    circuló y en Paraguaná se volvió «una especie de trofeo bibliográfico»
    porque «había entrado en una competencia real con el olvido». El autor
    refleja «las faenas campesinas» y las dota «de sus expresiones parlantes».
    La 2ª edición («ampliada y corregida») incorpora vocablos «producto de su
    observación posterior» y de «la natural inconformidad por no haber sido
    incluidos en el trabajo inicial». Cierra: «un diccionario propuesto por la
    espontaneidad, en el cual lo natural sobrepasa las exigencias de la
    exquisitez idiomática».
  citas:
    - texto: "un apasionado defensor del ancestro peninsular"
    - texto: "registrar en un cuaderno escolar una variedad de expresiones [?]"
    - texto: "había entrado en una competencia real con el olvido"
    - texto: >-
        varias de ellas auténticamente surgidas del pensamiento trascendido de
        sus lugareños, y en casos particulares de la directa herencia hispánica
        o de fusiones creadas por la debilidad misma de sus respectivas
        pronunciaciones
      nota: la única frase del prefacio sobre el ORIGEN de las voces
    - texto: "un diccionario propuesto por la espontaneidad, en el cual lo natural sobrepasa las exigencias de la exquisitez idiomática"
  lectura_para_el_etiquetado:
    - >
      MÉTODO DEL AUTOR: cuaderno de un hablante nativo a lo largo de décadas,
      con transmisión oral de sus ascendientes. No es encuesta ni trabajo de
      campo con informantes declarados: el prefacio no dice pueblos ni
      décadas. Es exactamente la fuente `retro-abstraido` (tradición viva
      local) que el programa del corpus tenía en cero.
    - >
      MARCO ETIMOLÓGICO DEL PREFACISTA: tres orígenes — creación lugareña,
      herencia hispánica directa, y «fusiones» por deformación de la
      pronunciación. NO menciona sustrato indígena, ni papiamento, ni
      neerlandés. Consecuencia: la criba indígena es NUESTRA (de Miguel), no
      del libro. Que el libro no marque una voz como indígena no le resta;
      que la marque (si el autor marca origen en alguna entrada) sumaría como
      atestación del autor, en campo aparte (`origen_libro`).
    - >
      DOS EDICIONES: la 2ª añade voces por observación posterior. No se
      distingue 1ª/2ª en el dictado salvo que el libro lo marque.
  pendiente_de_preguntar:
    - "~~¿Hay nota del propio autor?~~ SÍ: «Aclaratorias al lector» (abajo). Resuelve criterio, mundo y grafía; no da décadas de recolección."
    - "¿Las entradas llevan marca de origen o de distribución (país / Falcón / península)? — mirar al dictar las primeras."
    - "Año de la 1ª edición y ciudad de impresión de la 2ª."

# La nota del propio autor. Es la pieza de método: dice de dónde viene el
# léxico, por qué canales, cómo está escrito y cómo se distribuye.
aclaratorias_al_lector:
  segun_dictado: true
  correcciones_de_oido: >
    El reconocimiento de voz trajo: «Avícora»/«avícola» (→ Adícora),
    «Morui» (→ Moruy), «Por lo nuevo» (→ Pueblo Nuevo), «el ato» (→ El Hato),
    «los taches» (→ Los Taques), «Cariduana» (→ Carirubana), «la menée
    grande» (→ Mene Grande), «Creolé» (→ Creole), «foléticamente»
    (→ fonéticamente), «escuescas» (→ escasas), «riveras» (→ riberas),
    «estadolara» (→ estado Lara), «cautivó el lenguaje» (→ ¿captó?). Son
    lecturas del escriba, no del papel: cotejar.
  el_aislamiento:
    hecho: >
      Sin carretera a Coro ni al resto del país hasta la década de 1950,
      cuando las refinerías (Shell y Creole) hicieron la carretera asfaltada
      y el acueducto. Antes, la comunicación fue MARÍTIMA: goletas desde el
      puerto de Adícora a Aruba, Curazao, Cuba, Santo Domingo y Puerto Rico —
      horas a las Antillas cercanas, 3-5 días a las lejanas según el viento;
      a Maracaibo, más de 7 días (los ríos en lluvias obligaban a esperar
      días en sus riberas). «Nuestra península era territorio aislado del
      resto del país.»
    para_el_protocolo: >
      El FILTRO 2 (papiamento/neerlandés) sube al primer puesto por boca del
      propio autor: Aruba y Curazao estaban a horas; Coro, lejos; Maracaibo,
      a una semana. Toda voz «rara» tiene a las islas como primer sospechoso.
  la_poblacion_y_los_pueblos:
    hecho: >
      Población eminentemente rural: cría de ganado menor y cultivo en las
      escasas épocas de lluvia. Escuelas: quizá no llegaban a la docena en
      toda la península, y solo primeros grados. Centros poblados: Tacuato,
      Santa Ana, Moruy, Buena Vista, Pueblo Nuevo, Adícora, El Hato, El
      Vínculo, Los Taques y Punta Cardón — ninguno llegaba a 2.000
      habitantes. Carirubana / lo que hoy es Punto Fijo: playa de pescadores
      de menos de 200 personas hasta 1926 (instalación de la Mene Grande en
      Cerro Arriba; ~400 personas hasta 1946), y desde 1946 las refinerías
      Shell y Creole con miles de hombres trabajando.
    para_el_mundo: >
      Regla 7 — esto alimenta la esfera MUNDO, no solo la lengua: (a) la
      lista de pueblos de Paraguaná c. 1900-1950 con su escala, para la
      campaña de topónimos y para `asentamientos.yaml` (época: s. XX; Moruy
      y Santa Ana, los asientos de los dos clanes de Oliver, siguen siendo
      los centros); (b) el eje marítimo península–ABC como constante
      estructural: el mismo eje que la ruta Cumarebo–Curazao del s. XVI
      (van Buurt), ahora en el s. XX. Época declarada: colonial-tardía /
      s. XX. NO se proyecta al precontacto (regla 3): se registra la
      persistencia, no la identidad.
  el_lenguaje_y_sus_canales:
    hecho: >
      «Nuestra gente captó [?] el lenguaje del pueblo llano, en el cual
      numerosos vocablos sufrieron alteraciones en su estructura»: supresión
      de letras en la primera sílaba o en la última, cambio de letras — «el
      lenguaje culto se le alteró en su constitución para hacerlo accesible
      al pueblo, que de oídas lo iba a hablar mas no escribirlo, pues la
      mayoría de nuestra gente era analfabeta». Los vasos comunicantes: los
      ARRIEROS (transportistas y mensajeros entre la península y Santa Ana
      de Coro, «el centro culto de nuestro estado») y los MARINOS (navegaban
      por las estrellas sin saber leer una carta marina, y traían de tierras
      lejanas mercancías «y también el vocabulario, con todo y sus
      imperfecciones»).
    para_el_protocolo: >
      (1) El marco del autor es el del prefacista: español culto deformado
      por un pueblo analfabeto + importación por mar. El sustrato indígena
      no está entre sus canales — la criba sigue siendo de Miguel. (2) Los
      patrones de deformación que él declara (aféresis, apócope, cambio de
      letra) son el FILTRO 1 con instrucciones: una voz que «suena indígena»
      puede ser castellano con la primera sílaba comida. Probar la
      restitución antes de pasar al filtro 3. (3) A la inversa, una forma
      indígena pudo llegar castellanizada por la misma «debilidad».
  la_distribucion:
    hecho: >
      «La mayoría de estos vocablos son comunes en otras regiones del país,
      algunos de ellos solo se escucharon en Falcón, y los menos son
      autóctonos de la península.» Hay polisemia regional: una misma palabra
      con un sentido en los pueblos de la península, otro en el resto del
      estado, otro en Lara y otro en Trujillo.
    para_el_protocolo: >
      El criterio positivo 2 (distribución restringida) lo formula el propio
      autor en tres niveles: país / Falcón / península. Si lo marca por
      entrada, se captura en `distribucion_libro`; si no, vale como
      expectativa global — «los menos» autóctonos coincide con §7 del
      protocolo (tasa de acierto baja). La polisemia interestatal es un
      aviso: la GLOSA paraguanera es la que cuenta, no la larense.
  la_grafia:
    hecho: >
      «Estos vocablos están escritos fonéticamente, tal cual como lo
      pronuncia nuestra gente.»
    para_el_protocolo: >
      La forma del libro es pronunciación local en grafía castellana
      improvisada, no ortografía. Se conserva tal cual en `voz` (es la
      `forma_fuente`); el cruce contra el canon se hace por esqueleto
      fonémico (cruzar_voz.py), que es lo que esta grafía permite.
  quien_es_nuestra_gente: >
    «Cuando digo nuestro pueblo, nuestra gente, nuestros mayores, nuestros
    antepasados, nuestros abuelos, me refiero con mucho orgullo al pueblo
    paraguanero en general, del cual provenimos la mayoría de los que hoy
    vivimos aquí.»
  anexos: >
    Más de doscientos refranes y decires «del paraguanero de ayer». Es una
    segunda veta: fraseología con léxico en contexto (cf. las FORMULAS de
    Gatschet y la fórmula de Mitare). Se mina aparte, después de las voces.
  ethos: >
    La palabra empeñada como garantía — «hubo quien diera como garantía o
    aval un pelo de su bigote» y lo rescatara al cumplir. Dato de mundo
    (s. XX), no de lengua; se anota por si el corpus de transmisión lo
    quiere como testimonio retro-abstraído.

# Cobertura declarada por letra/sección, al cerrarla (regla 6: distinguir
# «no hay sustrato» de «no se miró»). {letra, vistas: ~n, dictadas: n}
cobertura: []

# Patrones de forma que el dictado va mostrando (se anotan; ninguno es
# etimología por sí solo — regla del protocolo §4.3: la fonotáctica es
# filtro negativo, débil en positivo).
patrones_observados:
  - final: -ao
    lectura: "participio castellano -ado con -d- caída (abofao, abollao, acoquinao): señal segura de castellano. Distinto del -ao toponímico (diao, waitiao, waranao: 6/222 atestiguadas), que no es participio"
  - final: -are
    lectura: >-
      La más recurrente del dictado: cadare, cachinare, catanare, chiguare,
      chipare (canon), machire. El canon la tiene como morfema-002
      (2-lengua/morfemas.yaml): sufijo LOCATIVO 'sitio de' en topónimos
      (bobare, cabudare, dabudare, pachacuare), con dos contraejemplos ya
      registrados que NO son lugares — guasare 'árbol cactáceo' y chunare
      'mazorca tierna'. El dictado añade más nombres comunes en -are
      (partes de planta, bejucos, estados): sugiere un formante nominal
      más amplio que el locativo. Dato para revisar la glosa de morfema-002.
      En el lexicón atestiguado solo dare 'diente' y chipare terminan en
      -are.
  - final: -ebe
    lectura: "carebe (cucharón de tapara), chevebe (saltamontes): dos voces sin filiación con la misma cadencia; nada en el canon"
  - final: -igua
    lectura: "barisigua (Erythrina), con tacarigua y samanigua de Alvarado y los topónimos regionales en -igua: formante fitonímico/toponímico de filiación no resuelta"
  - final: -uro / -aro
    lectura: "camuro, caujaro, cacuro, saruro, samuro, kakuro: cadencia del lexicón atestiguado; camuro y caujaro encajan"
  - final: -nga
    lectura: "ananinga, chenga: AJENA al caquetío medido (1/222, y esa dudosa: kudanga/judan); típica de africanismos. Reserva declarada en ambas"
  - prefijo: ma-
    lectura: "machire 'masa granulosa' frente a chirita 'masa fina': el privativo arahuaco ma- (madunaka; wayuu ma-) en uso vivo — hipótesis, ver la entrada"
  - marca_del_autor: "creación del pueblo llano / palabra de pueblo"
    lectura: "NO marca autoctonía: el autor la usa igual para deformaciones castellanas (abofao, buruza) que para voces sin filiación. En cambio «en otras regiones se conoce como X» SÍ es dato: distribución restringida declarada por la fuente (saruro, camuro, barisigua, chamaco, bachaco)"

# Regla 7: lo que el diccionario dice del MUNDO aunque la voz sea castellana.
# Época: s. XX (tradición viva, marca retro-abstraido). No se proyecta al
# precontacto; se registra para el corpus de ecología/casa y para cruzarlo
# con lo que sí es antiguo.
datos_mundo:
  - id: mc-mundo-001
    esfera: ecologia / casa
    hecho: >
      La madera más común para fabricar el aguamanil (mueble de aseo) era
      el CARDÓN, «por su durabilidad».
    voz_origen: aguamanil
    pagina: "23-24"
    epoca: s. XX (Paraguaná rural, antes de 1950)
    lectura: >
      Uso constructivo del cardón (Cereus/Stenocereus; caq. kadushi 'cactus
      columnar', dato/kaduchi 'su fruto') como madera de mueblería en la
      península. El lexicón atestiguado tiene el cardón como planta y fruto,
      no como MATERIAL: el corpus de ecología puede registrar el uso, con
      esta fuente, como testimonio retro-abstraído s. XX.
    segun_dictado: true
  - id: mc-mundo-002
    esfera: transmision / crianza
    hecho: >
      Amenaza velada al niño travieso: la fórmula «ananinga / ay naninga»
      dicha mientras se agita la mano derecha castañeando índice y medio
      «en son de látigo». Desaparecida por falta de uso.
    voz_origen: ananinga
    pagina: 28
    epoca: s. XX (Paraguaná rural), extinta al escribir el autor
    lectura: >
      Gesto + fórmula como disciplina infantil sin contacto físico. Dato de
      crianza para el corpus de transmisión (testimonio retro-abstraído,
      s. XX). No se proyecta al precontacto; se registra porque el corpus de
      transmisión del saber tiene poco sobre la crianza cotidiana.
    segun_dictado: true
  - id: mc-mundo-003
    esfera: ecologia / tecnica (agua)
    hecho: >
      El agua de consumo era de origen pluvial, depositada en estanques
      cavados a cielo abierto en la tierra, y solía estar turbia por el
      barro en suspensión. Para clarificarla: con un trozo de CARDÓN DE
      LEFARIA, previamente limpio de espinas, se agitaba el agua un rato y
      se dejaba en reposo; el material en suspensión se precipitaba y el
      agua quedaba «limpia, cristalina, lista para ser utilizada».
    voz_origen: asentar agua
    pagina: null            # ⚠️ PENDIENTE
    epoca: s. XX (Paraguaná rural, antes del acueducto de los años 50)
    lectura: >
      Floculación con mucílago de cactácea: técnica tradicional documentada
      en otras zonas áridas de América (mucílago de Opuntia como clarificante
      de agua). Aquí con el cardón lefaria, sobre agua de JAGÜEY — el
      «estanque cavado a cielo abierto» es el jagüey (voz taína
      panamericana; el lexicón tiene buko 'jagüey/charca' caquetío
      atestiguado y el verbo jagey 'estancar' con atribución débil, y
      ecologia.yaml §hidrología ya modela el jagüey como la pieza de agua
      de la tierra pobre). Es exactamente el vocabulario del OFICIO DIARIO
      del agua que el corpus de ecología tenía en hueco: tesis
      tierra-pobre/mar-rico, ahora con la técnica de potabilización.
      Época s. XX: se registra como testimonio retro-abstraído; su
      antigüedad precontacto no se afirma (regla 3) aunque el par
      cardón+jagüey sea de la ecología de siempre.
    voces_a_mirar:
      - "lefaria: dictada el 2026-09-01 bajo «breva o guanariji» (p. 49) — ver entradas"
    segun_dictado: true
  - id: mc-mundo-004
    esfera: creencia / fauna
    hecho: >
      El saruro (boa, tragavenados) «exhala un vaho sobre sus víctimas
      cuando son pequeñas, y dicen que con esto las adormece para
      facilitarse el ataque». De ahí el dicho «procura que Manuel no te
      bajee» = 'evita que te engañe'.
    voz_origen: bajear
    pagina: 41
    epoca: s. XX (creencia viva; «nuestros viejos decían»)
    lectura: >
      Etología popular de la boa convertida en metáfora del engaño. Para el
      corpus de creencia/ecología: la boa ya tiene carga simbólica en el
      canon (buio 'serpiente, boa, diablo, dios del mal', atestiguado); esta
      creencia del s. XX es testimonio retro-abstraído, no se proyecta al
      precontacto, pero conecta la fauna del Golfete con la esfera moral
      (engaño) por la misma vía que buio.
    segun_dictado: true
  - id: mc-mundo-005
    esfera: ecologia / fauna
    hecho: >
      Los puercos silvestres (báquiros, pecaríes) fueron «en épocas lejanas
      abundantes en nuestros montes, hoy extintos» en Paraguaná.
    voz_origen: báquiro
    pagina: 43
    epoca: "abundantes antes del s. XX («épocas lejanas»); extintos al escribir el autor"
    lectura: >
      Extinción local documentada por testimonio: la fauna moderna de la
      península NO es la del s. XV (tesis ya registrada en el corpus de
      ecología). Suma un animal de caza al inventario precontacto plausible
      — y el lexicón no tiene palabra caquetía para él: hueco léxico de
      fauna de caza, a añadir a ecologia_lexicon_map (el wayuu y el
      cumanagoto sí la tienen).
    segun_dictado: true
  - id: mc-mundo-006
    esfera: ecologia / flora / oficios
    hecho: >
      La barisigua («palo de balsa» en el habla; botánicamente un bucare,
      Erythrina — ver la entrada) «fue abundante en nuestro medio, hoy muy
      escaso», hasta ocho metros; madera muy liviana, de grano suave, con
      la que se hacían bateas y baques.
    voz_origen: barisigua
    pagina: 43
    epoca: s. XX (abundante antes; escasa al escribir el autor)
    lectura: >
      Toca ecologia-032 y hueco-lex-008 (la madera de canoa foránea): un
      bucare local de madera liviana y blanda al secar — madera de vasijas
      (bateas, baques) y talla, no de piraguas. Para el mundo caquetío: un
      árbol de la península con nombre propio (y topónimo en Dabajuro), hoy
      casi desaparecido. La pregunta de Miguel (¿canoas?) queda respondida
      con matiz: canoas de un tronco, improbable; vasijas y objetos de
      madera, sí. Precontacto: no se afirma (regla 3); se registra la
      abundancia pasada como dato de ecología histórica. (Corrección
      2026-09-01: la primera lectura identificó el árbol con Ochroma por el
      nombre «palo de balsa»; la flora científica lo pone en Erythrina.)
    segun_dictado: true
  - id: mc-mundo-007
    esfera: ecologia / casa / conuco
    hecho: >
      El camuro (vasija de Lagenaria, «una especie de tapara, fruto de una
      planta rastrera») «era común en las empalizadas de los conucos. Hoy
      desaparecido en nuestro medio rural».
    voz_origen: camuro
    pagina: 61
    epoca: s. XX (común antes; desaparecido al escribir el autor)
    lectura: >
      La calabaza de bejuco cultivada en la cerca del conuco como fuente de
      vasijas: técnica de casa precontacto plausible (Lagenaria es
      pancaribeña y prehispánica), documentada aquí como tradición viva
      del XX y como pérdida. Se suma a la serie de desapariciones del
      libro (báquiro, barisigua): la península rural de antes de 1950 como
      ecosistema que el autor ve extinguirse.
    segun_dictado: true
  - id: mc-mundo-008
    esfera: oficios / economia
    hecho: >
      Las vísceras («capirote») del animal sacrificado «generalmente
      formaban parte de lo que se pagaba al matarife por sus servicios».
    voz_origen: capirote
    pagina: "62-63"
    epoca: s. XX (Paraguaná rural)
    lectura: >
      Pago en especie por un oficio: economía no monetaria del ganado
      menor (el chivo). Dato para el corpus de oficios/intercambio como
      testimonio retro-abstraído del XX; no se proyecta al precontacto,
      pero es la clase de reciprocidad que la esfera de interacción modela.
    segun_dictado: true
  - id: mc-mundo-009
    esfera: sociedad / oficios / reciprocidad
    hecho: >
      La CAYAPA: «varios hombres, en un día acordado previamente, le
      trabajaban de gratis a uno de ellos a cambio de licor y comida,
      generalmente para hacer la casa o atender una siembra».
    voz_origen: cayapa
    pagina: 66
    epoca: s. XX (Paraguaná rural)
    lectura: >
      Trabajo colectivo recíproco (convite, minga) para la casa y el
      conuco, pagado en comida y bebida: la institución de reciprocidad
      que la esfera de interacción y el corpus de parentesco/transmisión
      necesitan modelar para la era 2 (ceremonias, casa, siembra). Se
      registra como testimonio retro-abstraído del XX; su forma
      precontacto no se afirma, pero es la clase de hecho social que las
      crónicas no describen y que la tradición viva sí.
    segun_dictado: true
  - id: mc-mundo-010
    esfera: ecologia / fauna
    hecho: >
      La paloma perdiz (chenga) «fue abundante en nuestros montes, hoy
      casi desaparecida».
    voz_origen: chenga
    pagina: 70
    epoca: "abundante antes; casi extinta al escribir el autor"
    lectura: >
      Cuarta desaparición documentada por el libro (báquiro, barisigua,
      camuro, chenga): la serie es ya un dato en sí — la fauna y flora de
      la Paraguaná rural de antes de 1950 como línea de base que se pierde,
      y que el corpus de ecología puede usar para separar «fauna moderna»
      de «fauna del XV» con testimonio, no solo con inferencia.
    segun_dictado: true
  - id: mc-mundo-011
    esfera: oficios / agua
    hecho: >
      La chícora (hoja metálica encastrada en mango de madera de metro y
      medio), «junto con el pico y la barra», era «instrumento
      indispensable» para cavar sepulturas y los estanques.
    voz_origen: chícora
    pagina: 70
    epoca: s. XX
    lectura: >
      Cierra el circuito de mc-mundo-003 (asentar agua): el jagüey se
      CAVABA con chícora, pico y barra. Herramienta de hierro, posterior
      al contacto; la técnica del estanque excavado para agua de lluvia
      es la que el corpus de ecología atribuye a la tierra pobre (buko,
      jagey). Testimonio retro-abstraído del XX.
    segun_dictado: true
  - id: mc-mundo-012
    esfera: oficios / textil
    hecho: >
      El chinchorro se tejía «de hilos de cocuy, que es más fuerte y fino
      que el hilo de cocuiza»; también de algodón, «pero resultan más
      calurosos». La hamaca (de tela) se hacía de lonilla.
    voz_origen: chinchorro
    pagina: 71
    epoca: s. XX
    lectura: >
      Jerarquía de fibras del oficio de la hamaca, con nombres que el
      lexicón ya tiene: kokuy (Agave cocui) > kukuisa/dipopo (Furcraea)
      por finura y resistencia; maure (algodón) como alternativa. Para el
      corpus de oficios (la tejedora de hamacas del elenco, Kahu-sha,
      «usa maure para sus mejores hamacas»: el testimonio dice que la
      fibra fina de red era el cocuy — matiz para su ficha).
    segun_dictado: true
  - id: mc-mundo-013
    esfera: transmision / crianza (juego)
    hecho: >
      La chuchumbaca: juego de muchachos en que uno se queda en el
      chinchorro y los demás le sacuden violentamente las cabulleras.
    voz_origen: chuchumbaca
    pagina: 74
    epoca: s. XX
    lectura: >
      Segundo dato de crianza del libro (con la amenaza gestual de
      ananinga): juego rudo de grupo alrededor del chinchorro, el mueble
      central de la casa. Para el corpus de transmisión, que tiene poco de
      infancia cotidiana. Testimonio retro-abstraído.
    segun_dictado: true
  - id: mc-mundo-014
    esfera: oficios / agricultura
    hecho: >
      Siembra con COA: palo de madera aguzado con que se abría el hueco en
      la tierra donde se depositaba la semilla.
    voz_origen: coa
    pagina: 77
    epoca: s. XX (Paraguaná rural), técnica precontacto por definición
    lectura: >
      El palo cavador es la herramienta agrícola indígena de todo el
      continente; su persistencia en el conuco paraguanero del XX es
      continuidad técnica, con nombre taíno-español. El lexicón tiene
      kono 'sembrar' y tabri 'siembra' pero ninguna palabra para la
      herramienta: hueco léxico de oficio (ecologia_lexicon_map). Se
      registra la técnica con marca retro-abstraido; el nombre caquetío
      del objeto sigue sin fuente.
    segun_dictado: true
  - id: mc-mundo-015
    esfera: oficios / alfarería / cal
    hecho: >
      El CURUBO, caracol marino,
      cuya concha usaron los alfareros para PULIR los envases que
      fabricaban, y también para hacer CAL mediante su cocción a altas
      temperaturas.
    voz_origen: curubo
    pagina: 86
    epoca: s. XX (Paraguaná)
    lectura: >
      Dos técnicas de una sola concha. (1) BRUÑIDO cerámico con concha:
      la técnica de acabado de la alfarería precontacto de toda la región
      (superficies bruñidas de la tradición dabajuroide) — el oficio de
      Saruro-sha y Pira-sha en el elenco, con instrumento nombrado. (2) CAL
      DE CONCHA por calcinación: la cal es el reactivo del hayo (coca) que
      el lexicón conserva en baperon / raporon 'calabaza con cal'
      [caquetío-atestiguado] — este testimonio da la FUENTE LOCAL de esa
      cal: el caracol marino calcinado. Mar rico alimentando la tierra
      pobre otra vez. El canon tiene caracoles con nombre (kumarawa
      'caracol de las costas de Paraguaná', yagruma 'caracol', kiwa
      'concha') pero sin este uso. Marca retro-abstraido, s. XX; la
      continuidad con el precontacto es plausible por la arqueología
      (bruñido, cal para hayo) y se afirma como tal, no como hecho.
    segun_dictado: true
  - id: mc-mundo-016
    esfera: oficios / recolección / ecología
    hecho: >
      La DATERA: vara hecha con el maguey (bohordo floral) de la planta de
      cocuy, con una corona de púas en un extremo para ensartar y bajar
      los frutos del cardón (datos).
    voz_origen: datera
    pagina: 89
    epoca: s. XX (Paraguaná), técnica de recolección
    lectura: >
      La herramienta de la recolección del dato, hecha de OTRA planta del
      cardonal (el bohordo del cocuy, kokuy en el lexicón): dos recursos
      del monte seco combinados en un instrumento. Cierra el campo del
      fruto de cardón que este dictado ha ido llenando (dato, kaduchi,
      guanariji, cachinare, breva) con el modo de cosecharlo. Para el
      corpus de ecología/oficios, con marca retro-abstraido; la técnica
      es plausible precontacto (materiales y objetivo locales), no
      afirmada.
    segun_dictado: true
  - id: mc-mundo-017
    esfera: ecologia / fauna
    hecho: >
      La guacoa (paloma silvestre, wakoa) «en épocas pasadas muy abundante
      en nuestro monte, hoy casi extinta».
    voz_origen: guacoa
    pagina: "129-130"
    epoca: "abundante antes; casi extinta al escribir el autor"
    lectura: >
      Quinta desaparición documentada (báquiro, barisigua, camuro, chenga,
      guacoa) — y la primera de un animal con nombre caquetío ATESTIGUADO:
      la paloma que Hernández Baño registró todavía volaba en Paraguaná
      cuando Medina Colina era niño. Línea de base de fauna del monte
      seco para el corpus de ecología.
    segun_dictado: true
  - id: mc-mundo-018
    esfera: oficios / cal / fuego
    hecho: >
      El GUAIRÓN: horno rústico hecho en tierra para calcinar (conchas y)
      piedras y fabricar cal.
    voz_origen: guairón
    pagina: 130
    epoca: s. XX (Paraguaná)
    lectura: >
      Cierra mc-mundo-015 (la cal de caracol para el hayo y el bruñido):
      la cal se hacía EN CASA, en un horno de tierra con nombre propio —
      y ese nombre es la voz que el lexicón tiene como wairon 'hoguera'
      (caquetío-atestiguado). Fuego → hoguera → horno de cal: la misma
      palabra recorre la técnica. Con la datera, la chícora y la coa, el
      dictado va dando el instrumental del oficio con nombre. Marca
      retro-abstraido, s. XX; la continuidad con la cal precontacto del
      hayo (baperon/raporon) es plausible, no afirmada.
    segun_dictado: true
  - id: mc-mundo-019
    esfera: ecologia / flora / clima
    hecho: >
      El guamaro, árbol venenoso para los animales, «hoy es escaso en
      nuestros montes, quizá debido a los continuos veranos».
    voz_origen: guamaro
    pagina: 130
    epoca: "escaso al escribir el autor; causa que él propone: sequías prolongadas"
    lectura: >
      Sexta desaparición documentada, y la primera con CAUSA declarada por
      la fuente: los «continuos veranos» (sequías). Para el corpus de
      ecología: el testimonio liga la pérdida de flora del monte seco al
      clima, no solo a la refinería o al desmonte — dato para la tesis de
      tierra pobre y para el calendario de estaciones del motor (seca /
      lluvias).
    segun_dictado: true
  - id: mc-mundo-020
    esfera: lengua / dialectologia / geografia politica
    hecho: >
      ISOGLOSA INTRAPENINSULAR: al lagarto amarillo lo llaman gualamo «en
      las poblaciones de Tacuato y Santa Ana»; «en el resto de las
      poblaciones paraguaneras conserva el nombre de bisure».
    voz_origen: gualamo
    pagina: 130
    epoca: s. XX
    lectura: >
      Primer dato de variación léxica DENTRO de Paraguaná que da el
      dictado — y cae sobre Santa Ana, el asiento de los Guaranaos en
      Oliver (pp. 275-276) y uno de los dos nodos de la era 2
      (DISENO_ERA2 §2), con Tacuato al lado. Un solo dato no hace un
      dialecto, pero es exactamente la clase de evidencia que la
      simulación multi-nodo necesita para sembrar «semillas léxicas
      divergentes por nodo» con base y no por diseño. Se registra para
      la campaña de topónimos y para el casting de nodos; si el libro
      da más pares «en X le dicen A, en el resto B», se junta la serie.
    segun_dictado: true


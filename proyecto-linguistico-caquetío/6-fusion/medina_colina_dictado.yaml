  - voz: barisigua
    entrada_libro: "Barisigua — «con b larga y con s» (Miguel, sobre el papel)"
    glosa_libro: >-
      árbol que fue abundante en nuestro medio, hoy muy escaso, de hasta
      ocho metros de altura, en otras regiones del país conocido como palo
      de balsa. Su madera era muy liviana de peso, de granulación suave, se
      presta para trabajarla y con ella se hacían bateas y baques que
      necesitaban nuestras mujeres.
    pagina: 43
    campo: flora
    origen_libro: "el autor contrasta el nombre local con el nacional («en otras regiones del país conocido como palo de balsa»): distribución PENINSULAR declarada"
    nota_miguel: "habría que anotar si los caquetíos prehispánicos usaban este árbol para hacer canoas"
    segun_dictado: true
    dictado: 2026-09-01
    identificacion_botanica: >-
      CORREGIDA 2026-09-01. Género Erythrina (bucares, Fabaceae): Avendaño &
      Castillo 2014 (Acta Bot. Venez. 37(2), p. 146) registran «Barisigua»
      como nombre común de Erythrina pallida Britton, distribución con
      Falcón (FA). Un blog local da E. tamayonis Krukoff (no está en la
      monografía). A especie: abierta; a género: cerrada. NO es Ochroma: el
      «palo de balsa» de Medina Colina es el nombre popular de una madera
      liviana (el bucare seco), no la balsa botánica — la primera lectura
      del escriba (Ochroma) fue una inferencia del nombre y queda retirada.
    cruce:
      lexicon: >-
        nada por forma. ≈ barici/barisi 'agua turbia, tierras coloradas;
        ceniza' [caquetío-atestiguado; cognado-001; toponimo-006] es
        parecido difuso: se anota, NO se afirma (la madera es «blanco
        rojizo» según Alvarado — coincidencia tentadora, sin prueba).
      por_glosa: "kuru 'árbol, madera, tronco' [caq. reconstruido], bara 'palo, árbol' [caq. atestiguado]; ningún fitónimo caquetío para esta especie"
      cognados: nada
      toponimos: "nada en el canon ni en Esteves"
      a2: nada
      fonotactica: "pasa (barisiwa: sílabas CV, sin clusters)"
      fuera_del_repo: >-
        No está en Alvarado 1921. SÍ está en la flora científica: Avendaño &
        Castillo 2014, p. 146 — «Nombres comunes: Bucare Peonia, Barisigua»
        (Erythrina pallida; distribución AN, DC, FA, LA, MI, SU). Y es
        TOPÓNIMO: el caserío LAS BARISIGUAS, parroquia Dabajuro, municipio
        Dabajuro, Falcón (blog Pueblos de Venezuela: N 11º02,414′ W
        70º43,247′, 65 msnm, a 3 km de Dabajuro; «el nombre lo toma del
        árbol llamado Barisigua... palabra indígena»; madera «pesada y dura
        cuando está verde, se hace liviana cuando se seca», buena para
        talla). Wikipedia (municipio Dabajuro) no lista el caserío: la
        fuente del topónimo es débil pero trae coordenadas — Miguel puede
        verificarlo en el mapa. Pista inicial: resumen generado por Google
        que pasó Miguel (no citable; se verificó cada afirmación).
    filtros:
      "1 castellano": "no restituye a nada; el nombre castellano es balsa/balso/lano"
      "2 papiamento/neerlandés": "sin candidato"
      "3 wayuu": "sin forma parecida"
      "4 panhispánico": "no — el nombre general es otro; barisigua no circula fuera"
      "5 africanismo": "sin candidato"
      "6 caribe": "sin candidato directo; pero la FORMACIÓN en -igua es la de tacarigua y samanigua (Alvarado): patrón de fitónimo indígena venezolano, de filiación no resuelta"
    criterios_positivos:
      "1 campo local intraducible": "sí — fitónimo de especie, el criterio más discriminante"
      "2 distribución restringida": "sí — solo Paraguaná, y el autor lo declara"
      "3 fonotáctica": "pasa (débil en positivo)"
      "4 cognado regular": "no"
      "5 respaldo toponímico": "SÍ — Las Barisiguas (Dabajuro, Falcón occidental: el corazón de la tradición dabajuroide, la cerámica de los caquetíos costeros). Fuente débil (blog) con coordenadas; verificar en mapa"
      "6 atestación colonial": "no; pero sí atestación CIENTÍFICA del nombre común (Avendaño & Castillo 2014)"
    veredicto: B
    razon: >
      Subió de C a B el mismo día: sobrevive a los seis descartes y cumple
      TRES criterios positivos — campo local (fitónimo de especie),
      distribución restringida (Falcón; el autor la contrasta con el nombre
      nacional) y RESPALDO TOPONÍMICO (Las Barisiguas, Dabajuro) — más la
      fonotáctica y una atestación externa del nombre común en la flora
      científica. Le falta el cognado con correspondencia regular que el
      nivel B pide en sentido estricto: por eso es B «sin cognado», no A.
      Destino del protocolo: corpus cultural SÍ (flora, marca
      retro-abstraido, etiqueta hipotetico), lexicón activo NO salvo
      decisión explícita. Es el primer fitónimo del dictado y el primer
      candidato a sustrato SIN forma previa en el canon. La terminación
      -igua (tacarigua, samanigua, y los topónimos en -igua de la región)
      sugiere estrato indígena de filiación no resuelta — Paraguaná era
      multiétnica (Esteves: nueve estratos); que el topónimo caiga en
      Dabajuro inclina, sin probar, hacia el estrato caquetío costero.
    propuesta:
      destino: "3-mundo/corpus/ecologia.yaml (flora), etiqueta hipotetico, marca retro-abstraido, procedencia medina-colina-sxx p. 43"
      hueco_que_toca: >-
        hueco-lex-008 y ecologia-032: el corpus afirma que el cardonal no
        da troncos y que la madera de canoa vino de fuera. Barisigua no lo
        contradice: es un bucare de hasta ocho metros, de madera liviana al
        secar y blanda — madera de BATEAS, BAQUES y talla (Medina Colina;
        blog), no de piraguas. La pregunta de Miguel (¿canoas
        prehispánicas?) queda respondida con matiz y sin fuente directa:
        canoas de un tronco, improbable por la madera; vasijas de madera y
        objetos ligeros, sí. Se registra como mc-mundo-006.
      toponimo_a_la_cola: "Las Barisiguas (Dabajuro) → pasar a la campaña de topónimos con la lectura 'lugar de barisiguas' (fitónimo + -s plural castellano), fuente débil, coordenadas dadas"

  - voz: bayure
    glosa_libro: >-
      especie de abeja que produce una miel dulce y un poco ácida. También
      se le llama así a la casa que hace esta abeja, generalmente en palos
      secos y huecos.
    pagina: 45
    campo: fauna / oficio (miel)
    segun_dictado: true
    dictado: 2026-09-01
    cotejo_2026-09-08: >-
      Miguel confirma BAYURE, con r: la t del dictado del día 1 era
      error de oído. Segunda mención, p. [pendiente, letra M]: «maba,
      mebi, bayure: tres denominaciones para identificar al panal de las
      abejas» — panal y abeja, como decía la entrada de la p. 45.
    identificacion: >-
      Abeja sin aguijón (Meliponini), por la miel «dulce y un poco ácida»
      (la acidez alta es el rasgo de las mieles de meliponinos: Vit et al.
      2012 miden 12,7-95,9 meq/kg en la Melipona favosa de Paraguaná) y por
      el nido en palos huecos. Especie: abierta (¿Melipona favosa? ¿otra?).
    cruce:
      lexicon: >-
        nada por forma (lokono bute 'ahora' es ruido). Por glosa ('abeja',
        'miel'): RUBA 'especie de abeja silvestre negra de Coro'
        [caquetío-atestiguado], harifuche 'maíz tostado y miel', wayuu
        mapase 'cera de abeja'. El caquetío tiene UNA abeja con nombre
        (ruba); bayure sería otra.
      cognados: nada
      toponimos: nada
      a2: nada
      fonotactica: pasa
      fuera_del_repo: >-
        No está en Alvarado 1921. No aparece en la web como voz (búsqueda
        2026-09-01: solo una marca comercial y anagramas). La literatura
        sobre la Melipona favosa de Paraguaná (Vit et al. 2012, Rev. Inst.
        Nac. Hig. «Rafael Rangel» 43(1): 15-19) la llama «erica» o «maba»;
        las listas nacionales de meliponinos dan guanota, erica/arica,
        rubita, conguita, angelita. BAYURE NO ESTÁ EN NINGUNA: Medina
        Colina es hoy su única fuente.
    filtros:
      "1 castellano": "no restituye a nada"
      "2 papiamento/neerlandés": "sin candidato conocido (por cotejar)"
      "3 wayuu": "la abeja/miel wayuu es maapa; nada parecido"
      "4 panhispánico": "no — los nombres nacionales son otros"
      "5 africanismo": "sin candidato"
      "6 caribe": "sin candidato"
    criterios_positivos:
      "1 campo local intraducible": "sí — nombre de especie + su producto + su nido: el oficio de la miel silvestre"
      "2 distribución restringida": "sí — no circula fuera (ni en la literatura de la propia Paraguaná)"
      "3 fonotáctica": "pasa (débil)"
      "4 cognado regular": "no"
      "5 respaldo toponímico": "no"
      "6 atestación previa": "no"
    veredicto: C
    razon: >
      Sobrevive a los seis descartes con dos criterios positivos (campo
      local, distribución restringida): NIVEL C, plausible — al corpus
      (fauna/oficio, hipotético), nunca al lexicón. Es exactamente la clase
      de voz que el protocolo esperaba encontrar: el oficio diario (la miel
      silvestre, el nido en el palo hueco) que las crónicas no anotaron. Y
      un dato de contraste: el canon ya tiene ruba 'abeja silvestre negra
      de Coro'; si bayure y ruba son dos especies distintas con nombre
      propio, el caquetío costero distinguía sus meliponinos — lo que la
      etnoapicultura documenta en toda la región.
    propuesta:
      destino: "3-mundo/corpus/ecologia.yaml (fauna / oficios: miel silvestre), etiqueta hipotetico, marca retro-abstraido, procedencia medina-colina-sxx p. 45"
    voces_a_mirar:
      - "maba: el OTRO nombre paraguanero de la Melipona favosa (Vit et al. 2012) — ~ wayuu maapa 'miel, abeja' (arahuaco). Si el habla de Paraguaná conserva maba, es una voz arahuaca viva que Medina Colina quizá trae bajo M. Cruzar contra el lexicón y preguntar a Miguel"
      - "rubita (lista nacional de meliponinos, «muy pequeña, amarilla») frente a caquetío ruba 'abeja silvestre negra de Coro': ¿diminutivo castellano sobre la voz caquetía, o rubia 'amarilla'? Ambiguo; se anota"


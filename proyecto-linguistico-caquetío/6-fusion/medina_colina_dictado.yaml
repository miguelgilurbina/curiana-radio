      peninsular; las otras tres no tienen filiación en ninguna dirección
      y la polisemia (mono, libélula, perdedor, cargar al hombro) sugiere
      voz expresiva o infantil. Para 'mono' el caquetío tenía arata: si
      chuco lo sustituyó, sería la quinta sustitución — pero sin fuente
      que dé chuco como voz antigua, se queda en D-dudosa. La libélula de
      los estanques de agua de lluvia es, eso sí, un dato del jagüey
      (fauna del agua de la tierra pobre) sin nombre caquetío conocido.

  - voz: chucuto
    glosa_libro: >-
      animal al que le faltara el rabo era chucuto para nuestros

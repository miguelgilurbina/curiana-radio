        niños' [caq.].
      fonotactica: pasa
      fuera_del_repo: >-
        No está en Alvarado 1921. Diccionarios de venezolanismos en línea
        (jergozo, asihablamos, 2026-09-01): chuco 'libélula' en el ZULIA;

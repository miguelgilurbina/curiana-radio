    razon: >
      Interjección expresiva sin referente: rendimiento casi nulo por
      protocolo (§6.2), y la -rr- la deja fuera de la fonotáctica caquetía.
      Sin etimología castellana clara tampoco (¿cruce expresivo tipo
      «¡bah!» + terminación burlesca?): se documenta como creación expresiva
      local y no se persigue. Dudosa solo para calibración.

  - voz: bejuca
    lectura_de_oido: "dictado «Behuca / bejuca»"
    glosa_libro: >-
      es una palabra creada por el pueblo para identificar una culebra
      común en nuestros montes. No es peligrosa. En otras partes del país
      se le conoce con el nombre de ratonera.
    pagina: 45
    campo: fauna
    origen_libro: "creación del pueblo; el autor da el nombre nacional (ratonera): distribución peninsular del NOMBRE"
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "nada por forma; por glosa ('culebra'): buio 'serpiente, boa, diablo' [caq. atestiguado], saruro 'boa' [caq.], wüi 'culebra' [wayuu] — ningún nombre caquetío para esta especie"
      cognados: nada
      toponimos: nada
    veredicto: D
    filtro: 4
    razon: >
      Derivado de BEJUCO ('liana'; voz antillana de origen caribe/taíno que
      es español general desde el s. XVI): la culebra-bejuco, por la forma.
      La metáfora es paraguanera (nombre local, como dice el autor), pero
      la BASE es un antillanismo panhispánico: no aporta sustrato caquetío.
      Queda como dato de fauna: una culebra inofensiva común en el monte
      (la «ratonera» nacional — probablemente Mastigodryas/Drymarchon, id.
      abierta), sin nombre caquetío conocido (hueco de fauna).

  - voz: brote / birote
    glosa_libro: >-
      todas fueron producidas por el pueblo para identificar a las personas
      tontas, gafas, medio pendejas.
    pagina: 45
    campo: otro (insulto)

      lexicon: "nada"
      fonotactica: "pasa (-mb- está atestiguado: chacamba)"
    veredicto: D
    certeza: baja
    filtro: "1 (creación expresiva)"
    razon: >
      Nombre de juego con reduplicación expresiva (chu-chu-) y final
      -baca de sabor jocoso; sin referente natural ni etimología. Se
      documenta el JUEGO como dato de crianza (mc-mundo-013), no la voz.

  - voz: chuchumeco
    glosa_libro: "se utilizaba para zaherir al hombre ruin."
    pagina: 74
    campo: otro (insulto)

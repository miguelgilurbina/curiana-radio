      Castellano general: CHUCHUMECO 'hombre pequeño, feo y de mala
      figura; ruin' está en el DRAE (de origen incierto, quizá de
      chichimeca). Insulto, además: rendimiento nulo por protocolo.

  - voz: chuco
    glosa_libro: >-
      los paraguaneros le dieron cuatro significados a esta palabra: uno,
      para designar al mono, que sin importar clase o raza denominaron
      así; dos, para identificar la especie de libélula muy común en los
      estanques de aguas pluviales y que tiene la particularidad de tocar
      el agua sin detener el vuelo; tres, para referirse a la persona que
      pierde [?] en el juego o los negocios; y cuatro, para el acto de
      cargar a horcajadas en el hombro a los niños.
    pagina: 74
    campo: fauna / otro
    segun_dictado: true
    dictado: 2026-09-01
    dudosa: true
    cruce:
      lexicon: >-
        nada por forma (konuko: ruido). POR GLOSA: ARATA 'mono'
        [caquetío-atestiguado] — el caquetío tenía nombre propio para el
        mono; wayuu potshonoi 'libélula'; wanepe 'cesto para cargar
        niños' [caq.].
      fonotactica: pasa
      fuera_del_repo: >-
        No está en Alvarado 1921. Diccionarios de venezolanismos en línea
        (jergozo, asihablamos, 2026-09-01): chuco 'libélula' en el ZULIA;
        'correa de castigo' en Táchira; 'sucio' en uso general. La
        acepción 'mono' no aparece fuera.
    veredicto: D
    certeza: baja
    filtro: "4 (regional occidental) / sin filiación"
    razon: >
      La acepción de libélula es marabina (Zulia y parte de Falcón), no
      peninsular; las otras tres no tienen filiación en ninguna dirección
      y la polisemia (mono, libélula, perdedor, cargar al hombro) sugiere
      voz expresiva o infantil. Para 'mono' el caquetío tenía arata: si
      chuco lo sustituyó, sería la quinta sustitución — pero sin fuente
      que dé chuco como voz antigua, se queda en D-dudosa. La libélula de
      los estanques de agua de lluvia es, eso sí, un dato del jagüey
      (fauna del agua de la tierra pobre) sin nombre caquetío conocido.

  - voz: chucuto
    glosa_libro: >-
      animal al que le faltara el rabo era chucuto para nuestros
      paraguaneros, así como también lo era todo aquello que no estuviera
      completamente hecho o le faltara algo para estar completo.
    pagina: 75
    campo: ganado / otro
    segun_dictado: true
    dictado: 2026-09-01

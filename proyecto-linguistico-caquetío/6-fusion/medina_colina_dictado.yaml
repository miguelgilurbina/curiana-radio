    origen_libro: "«es académica»"
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "no cruzada la voz (DRAE: chinchorro 'hamaca de red', Ven./Col.); SÍ cruzadas las fibras: kokuy 'penca... que da un vino agradable' [caq. atestiguado], dipopo 'fibra de cocuiza' [caq. atestiguado], kukuisa [español-colonial], maure 'fibra de algodón' [caq.]"
    veredicto: D
    filtro: 1
    razon: >
      Castellano (chinchorro 'red' > 'hamaca de red'), y el autor la marca
      como académica. Lo que la entrada trae es tecnología textil con
      nombres que el lexicón SÍ tiene: la fibra de COCUY (kokuy, Agave
      cocui) «más fuerte y fina» que la de COCUIZA (kukuisa/dipopo,
      Furcraea), y el algodón (maure) como alternativa cálida. Es la
      jerarquía de fibras del oficio de la hamaca — mc-mundo-012.

  - voz: chingo
    glosa_libro: >-
      así llamaron nuestros paraguaneros a los que por alguna
      circunstancia no tuvieran nariz, como también a los que estaban
      desesperados o a la expectativa por alcanzar algo.
    pagina: 72

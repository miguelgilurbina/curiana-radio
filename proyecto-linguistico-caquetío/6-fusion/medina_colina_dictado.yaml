      "3 fonotáctica": "pasa"
      "5 respaldo toponímico": "SÍ — Urupaguaduco, Urupagua (Esteves)"
      "6 atestación colonial": "no; Alvarado 1921"
    veredicto: A
    razon: >
      Tres fuentes independientes (Alvarado 1921, Esteves 1989, Medina
      2013), dos topónimos en Esteves, distribución restringida a la

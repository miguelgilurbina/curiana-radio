      lexicon: "nada por forma; por glosa: solo wayuu ruluma 'comején' — el caquetío no tiene palabra registrada para la termita"
      fonotactica: pasa
      fuera_del_repo: "Alvarado 1921 s.v. COMEJÉN: «Voz taína, de que son formas antiguas comixén (Las Casas I.412), convijén (Castellanos)»"
    veredicto: D
    filtro: 4
    razon: >
      Antillanismo panhispánico de origen taíno (Alvarado, con Las Casas
      y Castellanos como testigos): la voz no discrimina Paraguaná. Como
      con cabuya y bajareque: arahuaca sí, caquetía no probada. Dato
      marginal: el caquetío no tiene nombre registrado para la termita,
      plaga central de la casa de madera y bahareque.

  - voz: corroto
    entrada_libro: "Corroto (grafía del libro; el nacional es coroto)"
    glosa_libro: >-
      con esta palabra nuestros viejos distinguían a cualquier utensilio
      casero que en un momento dado no identificaran con su nombre.
    pagina: 81
    campo: casa / otro
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "no cruzada: venezolanismo general"
    veredicto: D
    filtro: 4
    razon: >
      COROTO 'objeto cualquiera, trasto' es venezolanismo general del DRAE
      (origen incierto; la etimología popular del pintor Corot es leyenda),
      aquí con -rr- fonética. No discrimina Paraguaná.

  - voz: cota
    glosa_libro: >-
      para los paraguaneros tenía dos significados: uno era el corpiño de
      la mujer, y el otro fue la especie de lora más grande que el perico
      y más pequeña que la guacamaya.
    pagina: 82
    campo: vestido / fauna
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: >-
        nada por forma (lokono khotaha, wayuu ko'utaa: ruido). POR GLOSA:
        KORO 'cotorra' y WAKA 'ave, cotorra' [caquetío-atestiguado] — el
        caquetío tiene DOS nombres de loro registrados.
      fonotactica: pasa
      fuera_del_repo: "no está en Alvarado 1921 como lema"
    veredicto: D
    certeza: media
    filtro: 1
    razon: >
      Las dos acepciones se explican desde el castellano: cota 'jubón,
      prenda ceñida' (DRAE) para el corpiño, y cota como acortamiento de
      COTORRA para la lora mediana (cotorra > cota, como cachimba > cacho).
      Si la lora se decía cota y no koro/waka, sería otra sustitución
      (koro → cota) — se anota con certeza media porque el acortamiento
      es hipótesis, no documento.

  - voz: crehuela
    glosa_libro: >-
      tela de algodón muy común en tiempos ya idos y que era utilizada
      principalmente en la ropa femenina.
    pagina: 82
    campo: vestido
    segun_dictado: true
    dictado: 2026-09-01
    veredicto: D
    filtro: 1
    razon: >
      Castellano del comercio de telas: CREHUELA 'lienzo de cáñamo o
      algodón muy delgado' (DRAE, diminutivo de crea, tela de Bretaña).
      Arcaísmo mercantil conservado, como aguamanil: tela importada por
      los marinos que el autor nombra como canal.

  - voz: crica
    glosa_libro: >-
      con esta palabra nuestros mayores identificaron al órgano sexual de
      la mujer, siendo para ellos sinónimo de breva, papa o cuca [dictado:
      «puca»; cotejar]. Es palabra académica.
    pagina: "82-83"
    campo: cuerpo
    origen_libro: "«es palabra académica»"
    segun_dictado: true
    dictado: 2026-09-01
    veredicto: D
    filtro: 1
    razon: >
      Castellano académico (DRAE: crica). Los sinónimos que da el autor
      son metáforas castellanas (breva, papa) y el venezolanismo cuca. Se
      anota por cobertura.

  - voz: cuje
    glosa_libro: >-
      esta voz, repetida, les sirvió a los nuestros para asustar a los
      perros. Es voz del pueblo.
    pagina: 84
    campo: otro (interjección)
    segun_dictado: true
    dictado: 2026-09-01
    veredicto: D
    filtro: "1 (interjección)"
    razon: >
      Interjección para espantar perros («¡cuje, cuje!»): expresiva, sin
      referente; el protocolo no persigue interjecciones (cf. el
      castellano general ¡zape! para gatos, ¡fuera!). Se anota por
      cobertura.

  - voz: curia
    glosa_libro: >-
      si una persona era capaz de hacer algo y, gracias al esmero y
      cuidado que tuviese al hacerlo, lo fabricado fuese muy bueno, para
      nuestros mayores esa persona tenía curia. Es palabra académica y,
      entre muchas acepciones, tiene la de cuidado, esmero.
    pagina: 85
    campo: otro (cualidad)
    origen_libro: "«es palabra académica»"
    nota_miguel: "«siento que esta palabra es importante»"
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "≈ CURIANA 'territorio de los caquetíos' [caquetío, Zavala nota 4] y uria 'plantío' [caq. atestiguado]: parecidos de forma, NO de origen (ver razón)"
      fonotactica: pasa
    veredicto: D
    filtro: 1
    razon: >
      Castellano: CURIA 'cuidado, esmero' (DRAE, acepción 3), del latín
      cura — la misma raíz de curar, curioso, procurar. El uso «tener
      curia» = 'tener esmero' es arcaísmo castellano vivo en Venezuela y
      Canarias. Lo que Miguel intuye como importante es la coincidencia
      con CURIANA, el nombre del territorio caquetío (Ojeda y Vespucio,
      1499-1500) que da nombre al proyecto: es HOMOFONÍA. Curia es latina
      y Curiana es indígena (el canon la tiene por Zavala como 'territorio
      donde estaban asentados los caquetíos'; la lectura 'lugar del
      cardón' vía coro es hipotética, D10). Que dos palabras de dos
      lenguas suenen igual no las emparienta; se deja dicho aquí para que
      nadie lo re-descubra.

  - voz: datera
    glosa_libro: >-
      instrumento para recolectar los frutos del cardón, hecho con el
      maguey de la planta de cocuy; en uno de sus extremos se coloca una
      corona de púas para en ella ensartar y bajar los frutos.
    pagina: 89
    campo: oficio (recolección)
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "la BASE es caquetía: DATO 'fruto del cardón' [caquetío-atestiguado, Zavala #105 (HB)]; el sufijo es castellano (-era instrumental, como tijera, tabaquera)"
      fonotactica: "—"
    veredicto: D
    filtro: "1 (derivación castellana sobre raíz caquetía)"
    razon: >
      Híbrido transparente: dato (caquetío atestiguado) + -era (sufijo
      instrumental castellano) = 'el instrumento del dato'. La voz es
      castellana por formación, pero PRUEBA que dato era palabra viva y
      productiva en el habla de Paraguaná — la misma clase de evidencia
      que chirita (raíz local + afijo castellano). Se registra como
      derivado, no como sustrato; el instrumento y su técnica van a
      mc-mundo-016.
  - voz: garuso
    glosa_libro: >-
      es creación del pueblo para identificar a la persona desordenada en
      el comer, que es muy golosa, glotona.
    pagina: 127
    campo: otro (carácter)
    origen_libro: "creación del pueblo (según el autor)"
    segun_dictado: true
    dictado: 2026-09-01
    veredicto: D
    filtro: "1 (creación expresiva)"
    razon: >
      Calificativo de carácter sin referente ni filiación (cf. el
      castellano garoso/garrudo, y el andalucismo garuso 'ansioso' que
      algunos repertorios recogen): rendimiento nulo por protocolo. Se
      anota por cobertura. Nota de cobertura: el dictado salta de la
      p. 95 (D) a la p. 127 (G) — las letras E y F quedan sin declarar.


      fonotactica: pasa
      fuera_del_repo: "DRAE: chucuto, Ven. 'rabón; incompleto' (sin etimología). No está en Alvarado 1921"
    veredicto: D
    filtro: 4
    razon: >
      Venezolanismo general (DRAE, Ven.) con las dos acepciones que da el
      autor. Origen abierto (no castellano obvio; Alvarado no lo recoge
      como indigenismo): no discrimina Paraguaná.

  - voz: churribamba
    glosa_libro: >-
      para decir que algo era numeroso lo manifestaron con este vocablo.
      Se escuchó decir: «Josefa y Mamerto tienen una churribamba de
      muchachos». Es vocabulario popular.
    pagina: 75
    campo: otro (cuantificador)
    origen_libro: "«es vocabulario popular»"
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "no cruzada: cuantificador expresivo"
      fonotactica: "pasa (-mb- atestiguado en chacamba)"
    veredicto: D
    filtro: "1 (creación expresiva)"
    razon: >
      Cuantificador expresivo con final -bamba de sabor jocoso (cf. los
      venezolanismos burundanga, chirimbolo, y el tipo churrete/churri-);
      sin referente ni filiación. El protocolo no persigue cuantificadores
      (cf. buruza). Se anota por cobertura.

  - voz: coa
    glosa_libro: >-
      es el palo de madera aguzado en la punta con que se abrían huecos en
      la tierra, y donde se depositaba la semilla de la siembra.
    pagina: 77
    campo: oficio (agricultura)
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "nada por forma; por glosa: kono 'sembrar' [caq. reconstruido], tabri 'siembra' [caq. atestiguado], bara 'palo' — el caquetío tiene el sembrar y la siembra, NO la herramienta"
      fonotactica: pasa
      fuera_del_repo: "DRAE: coa 'palo con la punta endurecida al fuego para sembrar', de origen antillano (taíno); no está en Alvarado 1921 como lema"
    veredicto: D
    filtro: 4
    razon: >
      Antillanismo panhispánico (taíno → español general del Caribe): la
      voz no discrimina Paraguaná. El OBJETO sí es precontacto — el palo
      cavador es la herramienta agrícola indígena por excelencia — y el
      lexicón no tiene nombre caquetío para él: hueco léxico de oficio,
      registrado en mc-mundo-014 junto con la técnica.

  - voz: cochocho
    glosa_libro: >-
      voz popular venezolana: piojo blanco del cuerpo, que produce
      comezón, desova en la ropa. Con esa acepción la utilizó nuestra
      gente.
    pagina: 77
    campo: fauna (parásito)
    origen_libro: "«voz popular venezolana» — el autor mismo la da como nacional"
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "nada por forma (tokoko, chocho: ruido); por glosa: wayuu mapüi, lokono ichi 'piojo' — nada caquetío"
      fonotactica: pasa
      fuera_del_repo: "no está en Alvarado 1921 como lema"
    veredicto: D
    filtro: 4
    razon: >
      Venezolanismo general (el autor lo declara), reduplicación expresiva
      co-cho-cho; sin filiación. No discrimina Paraguaná. Dato marginal:
      el caquetío no tiene palabra registrada para el piojo (sí el wayuu
      y el lokono).

  - voz: coquiza
    entrada_libro: "Coquiza (grafía fonética del libro por cocuiza)"
    glosa_libro: >-
      los viejos de nuestros campos llamaron así al hilo obtenido de la
      planta del sisal; con el mismo hicieron cordeles, mecates, hilos y
      tejidos para sacos donde envasar productos agrícolas.
    pagina: 77
    campo: oficio (fibra)
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: >-
        = KUKUISA 'cocuiza, agave de fibra para cuerda' [ESPAÑOL-COLONIAL —
        reasignada en D10 (2026-08-03) porque Alvarado cita a Caulín: «una
        especie de pita que los indios llaman CARUATA y los españoles
        COCUIZA»]; y DIPOPO 'fibra de cocuiza, cabuya' [caquetío-atestiguado,
        Hernández Baño]. Es decir: el canon ya decidió que cocuiza es la
        palabra de los españoles; la indígena para la planta es caruata y
        para la fibra, dipopo.
      fuera_del_repo: "Alvarado 1921 s.v. COCUIZA (Fourcroya): «fibra textil llamada también cocuiza... D. t. cucuiza, forma vulgar y primitiva: cucuyza (Carvajal 156)»"
      fonotactica: pasa
    veredicto: D
    filtro: 1
    razon: >
      Voz del español colonial (decisión D10 del canon, con Caulín como
      testigo). El habla paraguanera del XX conserva el nombre español de
      la fibra, no el caquetío: es la misma pérdida ya anotada bajo cabuya
      (dipopo → cabuya/cocuiza), ahora con la forma que usaba el pueblo.
      Lo que la entrada añade es de oficio: cordeles, mecates, hilos y
      sacos de cocuiza para envasar la cosecha — se suma a mc-mundo-012
      (jerarquía de fibras).

  - voz: cogote
    glosa_libro: >-
      así designaron nuestros viejos a la parte posterior y superior del
      cuello; es casi seguro que no sabían que estaban utilizando un
      vocablo académico.
    pagina: 78
    campo: cuerpo
    origen_libro: "el autor la reconoce como académica"
    segun_dictado: true
    dictado: 2026-09-01
    veredicto: D
    filtro: 1
    razon: "Castellano general (DRAE: cogote). Se anota por cobertura."

  - voz: comején
    glosa_libro: >-
      así identificó nuestro pueblo a las termitas, pequeños animales que
      se consumen la parte interna de la madera y le dejan sana la parte
      exterior. Es palabra académica.
    pagina: 78
    campo: fauna
    origen_libro: "«es palabra académica»"
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "nada por forma; por glosa: solo wayuu ruluma 'comején' — el caquetío no tiene palabra registrada para la termita"
      fonotactica: pasa
      fuera_del_repo: "Alvarado 1921 s.v. COMEJÉN: «Voz taína, de que son formas antiguas comixén (Las Casas I.412), convijén (Castellanos)»"
    veredicto: D
    filtro: 4
    razon: >
      Antillanismo panhispánico de origen taíno (Alvarado, con Las Casas
      y Castellanos como testigos): la voz no discrimina Paraguaná. Como
      con cabuya y bajareque: arahuaca sí, caquetía no probada. Dato
      marginal: el caquetío no tiene nombre registrado para la termita,
      plaga central de la casa de madera y bahareque.

  - voz: corroto
    entrada_libro: "Corroto (grafía del libro; el nacional es coroto)"
    glosa_libro: >-
      con esta palabra nuestros viejos distinguían a cualquier utensilio
      casero que en un momento dado no identificaran con su nombre.
    pagina: 81
    campo: casa / otro
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "no cruzada: venezolanismo general"
    veredicto: D
    filtro: 4
    razon: >
      COROTO 'objeto cualquiera, trasto' es venezolanismo general del DRAE
      (origen incierto; la etimología popular del pintor Corot es leyenda),
      aquí con -rr- fonética. No discrimina Paraguaná.

  - voz: cota
    glosa_libro: >-
      para los paraguaneros tenía dos significados: uno era el corpiño de
      la mujer, y el otro fue la especie de lora más grande que el perico
      y más pequeña que la guacamaya.
    pagina: 82
    campo: vestido / fauna
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: >-
        nada por forma (lokono khotaha, wayuu ko'utaa: ruido). POR GLOSA:
        KORO 'cotorra' y WAKA 'ave, cotorra' [caquetío-atestiguado] — el
        caquetío tiene DOS nombres de loro registrados.
      fonotactica: pasa
      fuera_del_repo: "no está en Alvarado 1921 como lema"
    veredicto: D
    certeza: media
    filtro: 1
    razon: >
      Las dos acepciones se explican desde el castellano: cota 'jubón,
      prenda ceñida' (DRAE) para el corpiño, y cota como acortamiento de
      COTORRA para la lora mediana (cotorra > cota, como cachimba > cacho).
      Si la lora se decía cota y no koro/waka, sería otra sustitución
      (koro → cota) — se anota con certeza media porque el acortamiento
      es hipótesis, no documento.

  - voz: crehuela
    glosa_libro: >-
      tela de algodón muy común en tiempos ya idos y que era utilizada
      principalmente en la ropa femenina.
    pagina: 82
    campo: vestido
    segun_dictado: true
    dictado: 2026-09-01
    veredicto: D
    filtro: 1
    razon: >
      Castellano del comercio de telas: CREHUELA 'lienzo de cáñamo o
      algodón muy delgado' (DRAE, diminutivo de crea, tela de Bretaña).
      Arcaísmo mercantil conservado, como aguamanil: tela importada por
      los marinos que el autor nombra como canal.

  - voz: crica
    glosa_libro: >-
      con esta palabra nuestros mayores identificaron al órgano sexual de
      la mujer, siendo para ellos sinónimo de breva, papa o cuca [dictado:
      «puca»; cotejar]. Es palabra académica.
    pagina: "82-83"
    campo: cuerpo
    origen_libro: "«es palabra académica»"
    segun_dictado: true
    dictado: 2026-09-01
    veredicto: D
    filtro: 1
    razon: >
      Castellano académico (DRAE: crica). Los sinónimos que da el autor
      son metáforas castellanas (breva, papa) y el venezolanismo cuca. Se
      anota por cobertura.

  - voz: cuje
    glosa_libro: >-
      esta voz, repetida, les sirvió a los nuestros para asustar a los
      perros. Es voz del pueblo.
    pagina: 84
    campo: otro (interjección)
    segun_dictado: true
    dictado: 2026-09-01
    veredicto: D
    filtro: "1 (interjección)"
    razon: >
      Interjección para espantar perros («¡cuje, cuje!»): expresiva, sin
      referente; el protocolo no persigue interjecciones (cf. el
      castellano general ¡zape! para gatos, ¡fuera!). Se anota por
      cobertura.

  - voz: curia
    glosa_libro: >-
      si una persona era capaz de hacer algo y, gracias al esmero y
      cuidado que tuviese al hacerlo, lo fabricado fuese muy bueno, para
      nuestros mayores esa persona tenía curia. Es palabra académica y,
      entre muchas acepciones, tiene la de cuidado, esmero.
    pagina: 85
    campo: otro (cualidad)
    origen_libro: "«es palabra académica»"
    nota_miguel: "«siento que esta palabra es importante»"
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "≈ CURIANA 'territorio de los caquetíos' [caquetío, Zavala nota 4] y uria 'plantío' [caq. atestiguado]: parecidos de forma, NO de origen (ver razón)"
      fonotactica: pasa
    veredicto: D
    filtro: 1
    razon: >
      Castellano: CURIA 'cuidado, esmero' (DRAE, acepción 3), del latín
      cura — la misma raíz de curar, curioso, procurar. El uso «tener
      curia» = 'tener esmero' es arcaísmo castellano vivo en Venezuela y
      Canarias. Lo que Miguel intuye como importante es la coincidencia
      con CURIANA, el nombre del territorio caquetío (Ojeda y Vespucio,
      1499-1500) que da nombre al proyecto: es HOMOFONÍA. Curia es latina
      y Curiana es indígena (el canon la tiene por Zavala como 'territorio
      donde estaban asentados los caquetíos'; la lectura 'lugar del
      cardón' vía coro es hipotética, D10). Que dos palabras de dos
      lenguas suenen igual no las emparienta; se deja dicho aquí para que
      nadie lo re-descubra.

  - voz: datera
    glosa_libro: >-
      instrumento para recolectar los frutos del cardón, hecho con el
      maguey de la planta de cocuy; en uno de sus extremos se coloca una
      corona de púas para en ella ensartar y bajar los frutos.
    pagina: 89
    campo: oficio (recolección)
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "la BASE es caquetía: DATO 'fruto del cardón' [caquetío-atestiguado, Zavala #105 (HB)]; el sufijo es castellano (-era instrumental, como tijera, tabaquera)"
      fonotactica: "—"
    veredicto: D
    filtro: "1 (derivación castellana sobre raíz caquetía)"
    razon: >
      Híbrido transparente: dato (caquetío atestiguado) + -era (sufijo
      instrumental castellano) = 'el instrumento del dato'. La voz es
      castellana por formación, pero PRUEBA que dato era palabra viva y
      productiva en el habla de Paraguaná — la misma clase de evidencia
      que chirita (raíz local + afijo castellano). Se registra como
      derivado, no como sustrato; el instrumento y su técnica van a
      mc-mundo-016.
  - voz: garuso
    glosa_libro: >-
      es creación del pueblo para identificar a la persona desordenada en
      el comer, que es muy golosa, glotona.
    pagina: 127
    campo: otro (carácter)
    origen_libro: "creación del pueblo (según el autor)"
    segun_dictado: true
    dictado: 2026-09-01
    veredicto: D
    filtro: "1 (creación expresiva)"
    razon: >
      Calificativo de carácter sin referente ni filiación (cf. el
      castellano garoso/garrudo, y el andalucismo garuso 'ansioso' que
      algunos repertorios recogen): rendimiento nulo por protocolo. Se
      anota por cobertura. Nota de cobertura: el dictado salta de la
      p. 95 (D) a la p. 127 (G) — las letras E y F quedan sin declarar.

  # ── Sesión del 2026-09-07 (segunda entrega del dictado) ──
  - voz: debudeque
    glosa_libro: "símil de la paledonia"
    pagina: null            # ⚠️ PENDIENTE — dictada sin página (¿letra D, pp. 89-95?)
    campo: comida (dulce)
    segun_dictado: true
    dictado: 2026-09-07
    identificacion: >-
      Dulce de Falcón: torta hecha con pan viejo y papelón (o panela), que
      se corta en trozos rectangulares «parecidos a ladrillos de adobe»
      (recetarios y blogs falconianos, consultados el 2026-09-07). La
      paledonia con la que Medina la compara es la catalina o cuca: galleta
      o torta de harina de trigo y melado de papelón con canela, clavo y
      anís; el nombre paledonia es el del Zulia y los Andes.
    cruce:
      lexicon: >-
        nada por forma entera. Por la raíz: DABUDA 'barro de loza'
        [caquetío-atestiguado, Zavala #99 (HB)], y la variante escrita
        «dabudeque» que la web trae al lado de «debudeque» empata con ella
        letra a letra. El referente ayuda: el dulce se corta en ladrillos de
        adobe. Sería 'lo de barro, lo hecho como adobe' — nombre por el
        aspecto, no por el ingrediente.
      por_glosa: "ningún dulce en el lexicón; el campo de lo dulce caquetío es la miel (harifuche 'maíz tostado y miel', ruba 'abeja') y el dato 'fruto del cardón'"
      cognados: nada
      toponimos: >-
        ⭐ la raíz dabuda está en el canon dos veces: DABUDARE (toponimo-011,
        B, 'sitio de extracción de barro'; Dabadubare en Esteves p. 37 «Dabuda:
        barro de loza») y ABUDURE (toponimo-076, B, dabuda + ure). Es el
        criterio 5 del protocolo, si la raíz es la misma.
      a2: nada
      fonotactica: >-
        pasa: cuatro sílabas CV (de-bu-de-que), consonantes d, b, k y vocales
        e, u, todas del inventario caquetío; cf. dabuda, budare, judibana.
      fuera_del_repo: >-
        No está en el DRAE ni en el lexicón de Alvarado 1921 (cero en el
        repo, verificado). En la web es dulce típico de Falcón y de la

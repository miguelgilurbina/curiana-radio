    razon: >
      BOJOTE 'bulto, lío, paquete' es venezolanismo y colombianismo del DRAE
      (origen incierto, no local); borote es su variante con cambio de
      consonante. Voz general del país: no discrimina.

  - voz: breva
    entrada_libro: "Breva o guanariji"
    glosa_libro: "[el fruto] del cardón de lefaria (ver guanariji)"
    pagina: 49

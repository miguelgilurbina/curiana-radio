      lexicon: "nada por forma (wamacho 'guamacho, Pereskia' es parecido difuso, otro árbol); por glosa: urari 'veneno vegetal' [caq. atestiguado] — el caquetío tiene la palabra del veneno, no este árbol"
      cognados: nada
      toponimos: nada
      fonotactica: pasa (wamaro)
      fuera_del_repo: "no está en Alvarado 1921"
    filtros:
      "1 castellano": "no restituye (gua- = /w/: lema wamaro)"
      "2-6": "sin candidato"
    criterios_positivos:
      "1 campo local": "sí — fitónimo de especie, con propiedad relevante para el pastor de ganado menor (tóxico)"
      "2 distribución restringida": "sí — única fuente"
    veredicto: C
    razon: >
      Fitónimo con propiedad (tóxico para el ganado), sin forma en el
      canon ni en Alvarado; pasa los filtros; final -aro (caujaro,
      cuaguaro, camuro). C, al corpus (flora). Sexta desaparición del
      libro, y la primera con causa declarada por el autor: «los
      continuos veranos» — mc-mundo-019.
  - voz: curubo
    lectura_de_oido: "dictado «Curriculum»; grafía dada por Miguel: curubo"
    glosa_libro: >-
      caracol marino cuya caparazón utilizaron los alfareros para pulir
      los envases que fabricaban, y también para hacer cal mediante su
      cocción a altas temperaturas.
    pagina: 86
    campo: fauna (mar) / oficio (alfarería, cal)
    segun_dictado: true
    dictado: 2026-09-01
    identificacion: "gasterópodo marino de concha gruesa (¿Strombus/Lobatus? ¿Melongena? ¿Cittarium?); especie abierta"
    cruce:
      lexicon: >-
        nada por forma (kuru 'árbol' es ruido). Por glosa: el caquetío
        tiene TRES palabras de molusco atestiguadas — kumarawa 'caracol de
        las costas de Paraguaná', yagruma 'caracol', kiwa 'concha de
        almeja' — y ninguna es curubo: sería la cuarta, con función.
      cognados: nada
      toponimos: nada
      fonotactica: pasa (kurubo)
      fuera_del_repo: "no está en Alvarado 1921 (texto completo)"
    filtros:
      "1 castellano": "no restituye"
      "2 papiamento": "sin candidato (el caracol en papiamento es kokolishi / karkó)"
      "3-6": "sin candidato"
    criterios_positivos:
      "1 campo local": "sí — zoónimo marino con dos usos técnicos (bruñido cerámico, cal): el oficio diario del mar rico"
      "2 distribución restringida": "sí — única fuente"
    veredicto: C
    razon: >
      Nombre de caracol con función (pulir la loza, hacer cal) sin forma en
      el canon ni en Alvarado; pasa los filtros; campo local y distribución
      restringida; sin cognado ni atestación. C, al corpus (fauna/oficios).
      Es la voz que faltaba en mc-mundo-015: la fuente local de la cal del
      hayo y el instrumento del bruñido, ambos con nombre. Final -ubo (cf.
      -ibo en ucibo 'chaquira', -bo en habo): dentro de la cadencia
      atestiguada.

# Nivel D con su razón: un descarte documentado ahorra re-minarla.
descartes:
  - voz: abofao
    glosa_libro: "creación del pueblo llano para decir que se tenía la cara hinchada. En junio de 2001 esta palabra ingresó en el DRAE."
    pagina: 21
    campo: cuerpo
    origen_libro: "creación del pueblo llano; ingresó en el DRAE (junio de 2001)"
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "sin forma; por glosa ('cara', 'hinchada') solo wayunaiki o'upünaa 'cara' — nada caquetío para 'hinchado'"
      cognados: nada
      toponimos: nada
      a2: nada
      fonotactica: pasa (no discrimina)
    veredicto: D
    filtro: 1
    razon: >
      Castellano: participio de abofar(se) 'hincharse' (< bofe), con la caída
      de -d- intervocálica (-ado > -ao) que el propio autor anuncia como
      grafía fonética. El DRAE registra «abofado» (Ven.). Es la primera
      calibración del filtro 1: la voz «rara» era una deformación castellana
      de las que las Aclaratorias describen. Dato que sí queda: el autor
      anota origen y trayectoria en sus notas («creación del pueblo llano»,
      ingreso al DRAE) — las entradas SÍ llevan marcas, al menos a veces.

  - voz: abollao
    lectura_de_oido: "dictado «abollado, sin d» → leído abollao (cotejar)"
    glosa_libro: >-
      entre las múltiples acepciones que el pueblo le daba a esta palabra
      está: si se sentía mucho trabajo por hacer, se estaba abollao; si
      emergía el cadáver de un ahogado, «el muerto abolló». Para nada [tiene
      que ver con] la acepción académica: abollar, producir una depresión con
      un golpe.
    pagina: 21
    campo: otro / mar (la 2ª acepción)
    origen_libro: "el autor contrasta la acepción del DRAE con las del pueblo"
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "nada por forma ni por glosa (ahogado/flotar/cadáver)"
      cognados: nada
      toponimos: nada
      a2: nada
      fonotactica: pasa (no discrimina)
    veredicto: D
    filtro: 1
    razon: >
      Castellano en las dos acepciones. La del ahogado no es «abollar»
      'hundir de un golpe' sino su homófono yeísta ABOYAR (< boya) 'flotar,
      salir a la superficie' (DRAE, Mar.): «el muerto aboyó». El autor la
      archiva bajo abollar por la grafía; el significado es náutico
      castellano de los marinos que él mismo nombra como canal. La de
      'agobiado de trabajo' es extensión popular de la misma familia. Nada
      indígena que probar.

  - voz: abongado
    glosa_libro: >-
      tener el estómago o el vientre prominente, especialmente si era por
      falta de salud, se identificaba con este vocablo.
    pagina: 21
    campo: cuerpo
    segun_dictado: true
    dictado: 2026-09-01
    dudosa: true            # calibración: no está en el DRAE tal cual
    cruce:
      lexicon: "nada por forma; por glosa ('vientre'): bari [caquetío-reconstruido], tayu [añú], ite [lokono], ale'eru'u [wayuu] — ninguno se parece"
      cognados: nada
      toponimos: nada
      a2: nada
      fonotactica: pasa (no discrimina)
    veredicto: D
    certeza: baja
    filtro: 1
    razon: >
      Probable variante oral de ABOMBADO 'convexo, hinchado' (< bomba; en
      Venezuela 'hinchado'), con el grupo -mb- velarizado a -ng- — un «cambio
      de letras» de los que las Aclaratorias describen. No está en el DRAE
      con esta forma, por eso queda DUDOSA: el descarte es probable, no
      probado. En contra de lo indígena: es un estado del cuerpo, no un
      referente local intraducible (criterio 1 del protocolo), y no se parece
      a ninguna palabra de 'vientre' de las comparandas. Si Miguel conoce
      «abombado» con este sentido en Paraguaná, el descarte cierra.

  - voz: acoquinao
    entrada_libro: "Acoquinao - acosao"   # grafía confirmada por Miguel sobre el papel
    glosa_libro: >-
      acoquinao y acosao son vocablos que el paraguanero utilizó como
      sinónimos, siendo el segundo un derivado del académico acosar:
      perseguir sin tregua, importunar, fatigar con molestias y trabajos.
    pagina: 22
    campo: otro
    origen_libro: "el autor deriva «acosado» del académico acosar; a acoquinao no le da origen"
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "nada (el ≈ wayuu kochiina 'cochino' es ruido del parecido difuso)"
      cognados: nada
      toponimos: nada
      a2: nada
      fonotactica: pasa (no discrimina)
    veredicto: D
    filtro: 1
    razon: >
      Castellano: participio de ACOQUINAR 'amilanar, acobardar, hacer perder
      el ánimo' (DRAE), con -ado > -ao. Voz peninsular corriente (de origen
      discutido, quizá del fr. coquin), documentada en toda Hispanoamérica.
      El sentido paraguanero 'acosado' es un deslizamiento entre dos verbos
      de acorralar. Nada indígena que probar.

  - voz: aguamanil
    glosa_libro: >-
      así denominaba nuestro pueblo el mueble rústico, especie de mesa de
      mediana altura y con espacio para colocar en su parte superior la
      ponchera y la jabonera, y en la inferior la jarra con pico para
      contener el agua con que se hacía la limpieza de manos y caras. La
      madera más común para fabricarlos era el cardón, por su durabilidad.
      Agregada al DRAE en junio de 2001.
    pagina: "23-24"
    campo: casa
    origen_libro: "agregada al DRAE en junio de 2001 (según el autor)"
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "nada por forma; por glosa ('madera'): barabara, kaketillo [caquetío-atestiguado], ture [caribe], dujo [taíno] — muebles y maderas, ninguno cardón"
      cognados: nada
      toponimos: nada
      a2: nada
      fonotactica: pasa (no discrimina)
    veredicto: D
    filtro: 1
    razon: >
      Castellano viejo: AGUAMANIL (< lat. aquimanile) 'jarro para echar agua
      en la palangana; palanganero' está en el DRAE desde siempre (la nota
      del autor sobre 2001 debe de referirse a la acepción de mueble, no a
      la voz). El paraguanero conserva la palabra antigua para el mueble
      entero. Lo que SÍ vale aquí no es la voz sino el dato de mundo: el
      cardón como madera de mueblería — ver datos_mundo.

  - voz: ahíto
    glosa_libro: >-
      al comer, quedar con el estómago lleno al máximo. En el oriente del
      país dicen quedar embolsado [?].
    pagina: 24
    campo: cuerpo
    origen_libro: "el autor da el sinónimo del oriente del país (distribución regional)"
    nota_miguel: "no sé si esto es español"
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "nada por forma (areito taíno y lokono kakïtho son ruido difuso); por glosa: wayuu wotoo 'estar lleno' — el caquetío no tiene palabra registrada para 'saciado'"
      cognados: nada real
      toponimos: nada
      a2: nada
      fonotactica: pasa (no discrimina)
    veredicto: D
    filtro: 1
    razon: >
      Castellano clásico: AHÍTO, -TA 'saciado, harto de comer' (DRAE; del
      participio antiguo de ahitar, lat. infictus). Está en Cervantes y en
      el Siglo de Oro; en Venezuela sobrevive en el habla rural. Que suene
      «raro» es por arcaico, no por indígena — el paraguanero conservó una
      palabra que el español urbano soltó. Es el mismo caso que aguamanil:
      conservadurismo léxico de región aislada, que el propio autor explica
      (arrieros, marinos, analfabetismo).

  - voz: ananinga
    entrada_libro: "Ananinga – ay naninga"   # dos formas, confirmadas por Miguel
    glosa_libro: >-
      una expresión del pueblo para decir una amenaza velada al niño que
      cometía una travesura. Generalmente se pronunciaba mientras con la
      mano derecha, que se agitaba, se hacía castañear los dedos índice y
      medio en son de látigo [?]. Esta expresión ha desaparecido entre el
      pueblo por falta de uso.
    pagina: 28
    campo: otro (fórmula expresiva; crianza)
    origen_libro: "el autor la da como creación del pueblo; anota que desapareció"
    nota_miguel: >-
      la cadencia suena como «cutanga» [cudanga], la fórmula de Mitare que
      registró Arcaya.
    segun_dictado: true
    dictado: 2026-09-01
    dudosa: true
    cruce:
      lexicon: "nada por forma (ananinga, ainaninga, ninga); por glosa ('niño'): wanepe 'cesto para cargar niños' [caq.], ibili [lokono], tepichi [wayuu] — nada de amenaza/castigo"
      cognados: nada
      toponimos: nada
      a2: nada
      fonotactica: pasa (no discrimina)
      la_cadencia_nga_medida: >-
        Formas en -nga/-nca/-nka: caquetío atestiguado 1/222 — y es
        justamente kudanga, cuya -ga es inestable (la versión de 1905 da
        «judan», ver frase_saludo_mitare.yaml §2-3: la segmentación
        cudanga/cudan no se sostiene); reconstruido 0/68; lokono 0/282;
        taíno 0/39; añú 0/47; wayuu 2/781; topónimos del canon 0/74;
        cola de Esteves 0/186. La cadencia -nga NO es caquetía ni arahuaca
        en nuestros datos: es un hapax y de segmentación dudosa.
    veredicto: D
    certeza: baja
    filtro: 5
    razon: >
      Fórmula expresiva sin referente, del tipo que el protocolo §6.2 avisa
      de rendimiento casi nulo (interjecciones y fraseología son casi
      siempre romances o expresivas). La final -nga, ausente del caquetío y
      de sus hermanas, es en cambio la cadencia típica de los AFRICANISMOS
      del español caribeño (malanga, conga, candanga, ñinga — y ñinga es
      venezolanismo vivo: 'poquito, nada'), y «ay naninga» se lee como
      ¡ay! + fórmula. El descarte más probable es el filtro 5, sin prueba
      positiva: queda DUDOSA. La asociación con cudanga se probó y no se
      sostiene con datos (una sola forma, y esa inestable). Lo que sí vale
      es el gesto — ver datos_mundo.

  - voz: arrumaco
    glosa_libro: >-
      los paraguaneros utilizaron esta palabra para referirse a las caricias
      o demostraciones de cariño hechas con gestos o ademanes.
    pagina: 33
    campo: otro
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "no cruzada: la glosa del libro es la del DRAE casi literal"
    veredicto: D
    filtro: 1
    razon: >
      Castellano general: ARRUMACO 'demostración de cariño hecha con gestos
      o ademanes' (DRAE, de arrumar/arrumaje). La glosa de Medina Colina
      reproduce la académica; no hay uso local que la separe.

  - voz: asentar agua
    glosa_libro: >-
      [técnica] Siendo el agua que se consumía de origen pluvial, que se
      depositaba en estanques cavados a cielo abierto en la tierra,
      generalmente estaba turbia por la abundancia de barro en suspensión,
      por lo que era necesario someterla a un proceso de clarificación.
      Con un trozo de cardón de lefaria, previamente limpio de espinas, se
      agitaba el agua por un rato y luego se dejaba en reposo; todo el
      material en suspensión se precipitaba y el agua quedaba limpia,
      cristalina, lista para ser utilizada.
    pagina: null            # ⚠️ PENDIENTE (¿33-35?)
    campo: oficio / agua
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "la locución es castellana; lo cruzado fue lefaria (nada) y jagüey (buko / jagey, ver mc-mundo-003)"
    veredicto: D
    filtro: 1
    razon: >
      La VOZ es castellana: asentar 'dicho de un líquido, aclararse al
      depositarse en el fondo las partículas' (DRAE) + agua. Lo que vale es
      la TÉCNICA y su instrumento — cardón lefaria sobre agua de jagüey —,
      registrada como dato de mundo mc-mundo-003. Y queda abierta la voz
      «lefaria» (nombre de cactácea sin etimología castellana obvia): si el
      libro la trae, se dicta aparte.

  - voz: bachaco
    glosa_libro: >-
      es una especie de hormiga grande, muy común en nuestra tierra
      venezolana. Se distingue por su laboriosidad, y cuando alguien está
      desplazándose regularmente de un lado a otro en funciones de trabajo
      le dicen «estás como el bachaco, viaje y viaje». También se dijo de la
      persona que tenía el pelo ensortijado y de color rojizo.
    pagina: 41
    campo: fauna
    origen_libro: "el propio autor la da como «muy común en nuestra tierra venezolana» — distribución nacional"
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: >-
        no por forma; POR GLOSA sí: koke 'hormiga roja; bachaco (Atta spp.)'
        [caquetío-atestiguado, Hernández Baño vía Zavala #89, forma_fuente
        coques; Oliver 1989 cap. 2 p. 145: cognados yavitero hoke, maipure
        kuki, lokono kuse] y ditero 'hormiga que daña'. El caquetío TENÍA su
        palabra para este insecto.
      cognados: nada para bachaco
      toponimos: >-
        ≈ GUACHACO (cola de Esteves): NO es ruido — Alvarado registra
        «Sin. guachaco (Tauste)», es decir, la misma voz en el vocabulario
        cumanagoto-chaima de Tauste (1680), y la variante «uachaco» en
        Mérida. Pista para la campaña de topónimos: el Guachaco de Esteves
        puede ser 'bachaco' en su forma caribe. Se pasa a la cola con esta
        lectura.
      a2: nada
      fonotactica: pasa
      fuera_del_repo: >-
        Alvarado 1921, Glosario de voces indígenas, s.v. BACHACO (Atta
        sexdens): «La voz procede, según Rojas, del tam[anaco] chiauco. Sin.
        guachaco (Tauste)»; y «la gente campesina del Estado Mérida no
        pronuncia hoi (1912) bachaco, ni tampoco guachaco, sino uachaco». RAE, Tesoro de los
        diccionarios históricos: primeras atestaciones c. 1780 (it.
        «bacciaco», fr. «vachacos») — la italiana es de la época y el
        ámbito de Gilij (tamanaco, Orinoco).
    filtros:
      "4 panhispánico/nacional": "cae — es voz venezolana general (y colombiana), lo dice el autor"
      "6 caribe": "cae — origen tamanaco (caribe del Orinoco) según Rojas vía Alvarado"
    veredicto: D
    filtro: 6
    razon: >
      No es caquetía: es el indigenismo NACIONAL para la Atta, de origen
      caribe (tamanaco) y difusión panvenezolana — el propio Medina Colina
      la sitúa en «nuestra tierra venezolana». Y el caso importa por lo que
      enseña: el sustrato local SÍ tenía palabra (koke, atestiguada, con
      cognados arahuacos), y el habla paraguanera del s. XX no la conserva —
      la desplazó la voz nacional. Es el patrón inverso de arifuque: allí
      sobrevivió la forma local; aquí ganó la general. La acepción del pelo
      rojizo ensortijado es igualmente venezolana general.
    nota_metodo: >
      Primer caso de «la palabra caquetía existía y se perdió»: cuando el
      cruce por GLOSA da caquetío-atestiguado y el cruce por FORMA da nada,
      la voz dictada no es sustrato sino sustitución. Vale registrarlo como
      pérdida léxica (esfera lengua: transmisión), no solo como descarte.

  - voz: bajareque
    entrada_libro: "Bajareque o bahareque [dictado: «Barrareque» — cotejar cuál va primero]"
    glosa_libro: >-
      es la palabra académica que el pueblo utilizó para identificar el
      enredado de palos entretejidos con cañas y barro; casa humilde.
    pagina: 41
    campo: casa
    origen_libro: "el autor la llama «la palabra académica»: la sabe general"
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: >-
        ≈ bajareke 'tabique hecho de tierra, palos y bejuco'
        [caquetío-atestiguado, Zavala Reyes 2015 #24 (AM), forma_fuente
        bajareque] — ES la misma palabra.
      por_glosa: "bohío [taíno], kaly 'casa' [lokono]; nada caquetío para 'pared/tabique' salvo este bajareke"
      fuera_del_repo: >-
        RAE (DLE): bahareque, de origen taíno; Tesoro de los diccionarios
        históricos: voz arahuaca antillana. Alvarado 1921 s.v. PAJAREQUE:
        «Vocablo antillano», con la variante «de pajareque» en Venezuela.
    veredicto: D
    filtro: 4
    razon: >
      Antillanismo panamericano: entró al español general desde el taíno
      (RAE) y volvió a toda Hispanoamérica; Medina Colina mismo la llama «la
      palabra académica». No prueba nada local (filtro 4 del protocolo).
      Que sea ARAHUACA no la hace caquetía: la ruta es taíno → español →
      Paraguaná, no sustrato.
    alerta_canon: >
      ⚠️ (escriba) El lexicón tiene bajareke como CAQUETÍO-ATESTIGUADO sobre
      la sola autoridad de Zavala #24 (AM), cuando la voz es antillanismo
      panamericano de origen taíno — misma clase que #104 (hayo), #105
      (caraota) y jaguey (#174, «D: panamericano, de taíno» en la nota de
      Zavala). Se elevó a Miguel el 2026-09-01.
    decision_miguel:
      fecha: 2026-09-01
      veredicto: "se MANTIENE caquetío-atestiguado; no hay issue"
      razon: >-
        «Es el material hecho mezcla con lo que hacían las casas. Yo creo
        que habla de que había una tecnología compartida, y ya tenemos
        atestiguado con Zavala. Yo la califico como caquetía atestiguada y
        las otras [atestaciones] taínas solo refuerzan hermandad.»
      criterio_aplicado: >-
        REPERTORIO, no filiación: la palabra cuenta como caquetía porque los
        caquetíos la usaban (Zavala la registra) y nombra una tecnología de
        casa compartida por la familia arahuaca; que el origen sea taíno
        refuerza la hermandad, no la resta. Es el criterio que el issue
        pendiente repertorio-vs-filiación discute — queda aquí como
        precedente declarado, y la misma vara deberá aplicarse al decidir
        #104 (hayo) y #105 (caraota).
      consecuencia_para_el_dictado: >-
        La voz paraguanera sigue en D (no aporta sustrato nuevo: es la
        palabra general), pero se registra como atestación viva del
        material de casa en la península (s. XX).

  - voz: bajear
    glosa_libro: >-
      la serpiente que en otros lugares del país denominan tragavenados,
      nuestra gente la conoció como saruro. Esta exhala un vaho sobre sus
      víctimas cuando son pequeñas, y dicen que con esto las adormece para
      facilitarse el ataque. Nuestros viejos decían «procura que Manuel no
      te bajee», por decir «evita que te engañe».
    pagina: 41
    campo: fauna / creencia
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "nada por forma (bajarí 'recorrer' es ruido difuso); la voz que importa de esta entrada es SARURO — ver entradas"
      fonotactica: "NO pasa (coda -r): es castellana"
    veredicto: D
    filtro: 1
    razon: >
      Castellano regional: BAJEAR (< vaho/baho), 'dicho de un animal,
      especialmente una serpiente: echar su aliento sobre otro para
      adormecerlo' — venezolanismo y colombianismo del DRAE. La entrada vale
      por dos cosas que no son la voz: el nombre local de la boa (saruro,
      registrado aparte) y la creencia del vaho adormecedor (mc-mundo-004).

  - voz: baque
    lectura_de_oido: "dictado «Baki» y luego «Baque» — cotejar la grafía del libro"
    glosa_libro: >-
      el hombre de nuestro pueblo creó esta palabra para designar la pequeña
      batea de madera con paredes bajas, muy parecida a la actual bandeja,
      en la cual se transportaban las granjerías para vender o se recogía
      la masa de maíz que se molía. Se fabricaba con madera de barisigua.
    pagina: 42
    campo: casa / oficio
    origen_libro: "el autor la da como creación local («el hombre de nuestro pueblo creó esta palabra»)"
    segun_dictado: true
    dictado: 2026-09-01
    dudosa: true
    cruce:
      lexicon: "nada por forma (bariki, bachure: ruido difuso); por glosa ('madera', 'maíz'): kuru 'árbol, madera' [caq. reconstruido], amaka 'sitio de moler maíz' [caq. atestiguado] — nada para 'batea'"
      cognados: nada
      toponimos: nada
      a2: nada
      fonotactica: pasa (no discrimina)
    filtros:
      "1 castellano": "el DRAE tiene baque 'golpe al caer' — otro significado; no restituye"
      "2 papiamento/neerlandés": >-
        ⚠️ CANDIDATO FUERTE: papiamento baki 'bandeja, recipiente, cajón'
        < neerlandés bak 'recipiente, artesa, bandeja'. Misma forma, mismo
        referente, y es exactamente el canal que el autor describe (goletas
        de Adícora a Aruba/Curazao). Por verificar contra un diccionario de
        papiamento antes de cerrar.
    veredicto: D
    certeza: media
    filtro: 2
    razon: >
      Primer préstamo probable del PAPIAMENTO en el dictado: baki 'bandeja'
      (< ndl. bak) explica forma y significado sin residuo, y el autor mismo
      documenta el contacto marítimo con las islas. Que él la dé como
      «creación de nuestro pueblo» no contradice: el préstamo se percibe
      como propio al cabo de dos generaciones. Queda DUDOSA hasta cotejar el
      papiamento (el repo no tiene diccionario; ver adquisiciones). Si se
      confirma, es el caso de calibración del filtro 2 que el protocolo
      pedía.
    ver_tambien: "barisigua (entradas): la madera del baque, dictada aparte — «con b larga y con s», Miguel"

  - voz: báquiro
    lectura_de_oido: "dictado «Bakiro»; el libro trae baquiro/báquiro — cotejar tilde"
    glosa_libro: >-
      así mismo llamaron nuestros viejos a los puercos silvestres, en épocas
      lejanas abundantes en nuestros montes, hoy extintos.
    pagina: 43
    campo: fauna
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "nada por forma (biro 'sal' es ruido); por glosa (puerco/pecarí): NADA caquetío — el lexicón no tiene palabra para el pecarí, animal de caza"
      cognados: nada
      toponimos: nada
      fuera_del_repo: >-
        Alvarado 1921 s.v. BÁQUIRO: «Báquira (váquira, Cod. 168) es voz
        cumanagota; en car[ibe] pakira. Pécari es otra forma de la voz no
        usada aquí»; refs. Oviedo I.409, Castellanos, Carvajal 189. Voz
        venezolana general.
    veredicto: D
    filtro: 6
    razon: >
      Como bachaco: indigenismo NACIONAL de origen caribe (cumanagoto
      báquira, caribe pakira) documentado desde Oviedo; no es sustrato
      local. La diferencia con bachaco: aquí el cruce por glosa NO da
      palabra caquetía — el lexicón carece de nombre para el pecarí (hueco
      léxico de fauna de caza; ver mc-mundo-005).

  - voz: paraviquejo
    lectura_de_oido: "dictado «para Viquejo» — cotejar grafía (¿paraviquejo? ¿barabiquejo?)"
    glosa_libro: >-
      es una deformación de la pronunciación a la que era dado nuestro
      pueblo, pues con esta palabra distinguían al barboquejo.
    pagina: 43
    campo: otro (vestido)
    origen_libro: "el propio autor la declara deformación de barboquejo"
    nota_miguel: "efectivamente debe ser un españolismo"
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "no cruzada: el autor da la restitución castellana"
    veredicto: D
    filtro: 1
    razon: >
      Castellano deformado, y lo dice la fuente: BARBOQUEJO 'cinta que
      sujeta el sombrero por debajo de la barba' (DRAE) con metátesis y
      cambio de consonante — el «cambio de letras» de las Aclaratorias. La
      entrada sirve de calibración porque el autor mismo hace el filtro 1.

  - voz: basirruque
    lectura_de_oido: "dictado «Basilruque», «Basirruque» — cotejar grafía"
    glosa_libro: >-
      creación del pueblo para expresar con ella dudas, desconfianza y a
      veces negación.
    pagina: 44
    campo: otro (interjección)
    origen_libro: "creación del pueblo (según el autor)"
    segun_dictado: true
    dictado: 2026-09-01
    dudosa: true
    cruce:
      lexicon: "nada por forma ni por glosa"
      cognados: nada
      toponimos: nada
      fonotactica: "NO pasa (cluster rr no atestiguado en caquetío)"
    veredicto: D
    certeza: media
    filtro: 1
    razon: >
      Interjección expresiva sin referente: rendimiento casi nulo por
      protocolo (§6.2), y la -rr- la deja fuera de la fonotáctica caquetía.
      Sin etimología castellana clara tampoco (¿cruce expresivo tipo
      «¡bah!» + terminación burlesca?): se documenta como creación expresiva
      local y no se persigue. Dudosa solo para calibración.

  - voz: bejuca
    lectura_de_oido: "dictado «Behuca / bejuca»"
    glosa_libro: >-
      es una palabra creada por el pueblo para identificar una culebra
      común en nuestros montes. No es peligrosa. En otras partes del país
      se le conoce con el nombre de ratonera.
    pagina: 45
    campo: fauna
    origen_libro: "creación del pueblo; el autor da el nombre nacional (ratonera): distribución peninsular del NOMBRE"
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "nada por forma; por glosa ('culebra'): buio 'serpiente, boa, diablo' [caq. atestiguado], saruro 'boa' [caq.], wüi 'culebra' [wayuu] — ningún nombre caquetío para esta especie"
      cognados: nada
      toponimos: nada
    veredicto: D
    filtro: 4
    razon: >
      Derivado de BEJUCO ('liana'; voz antillana de origen caribe/taíno que
      es español general desde el s. XVI): la culebra-bejuco, por la forma.
      La metáfora es paraguanera (nombre local, como dice el autor), pero
      la BASE es un antillanismo panhispánico: no aporta sustrato caquetío.
      Queda como dato de fauna: una culebra inofensiva común en el monte
      (la «ratonera» nacional — probablemente Mastigodryas/Drymarchon, id.
      abierta), sin nombre caquetío conocido (hueco de fauna).

  - voz: brote / birote
    glosa_libro: >-
      todas fueron producidas por el pueblo para identificar a las personas
      tontas, gafas, medio pendejas.
    pagina: 45
    campo: otro (insulto)
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "no cruzada: insulto (protocolo §6.2: los insultos son casi siempre romances)"
    veredicto: D
    filtro: 1
    razon: >
      Insultos de formación expresiva castellana (cf. birote, birria, bruto
      → brote). Rendimiento nulo para el sustrato; se anota por cobertura.

  - voz: borote / bojote
    glosa_libro: >-
      la gente de la península decía esta palabra para identificar con
      ella un lío, bulto o paquete, que es la acepción correcta dictada por
      la academia.
    pagina: 46
    campo: otro
    origen_libro: "el autor remite a la acepción académica"
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "no cruzada: el autor da la voz académica (bojote)"
    veredicto: D
    filtro: 1
    razon: >
      BOJOTE 'bulto, lío, paquete' es venezolanismo y colombianismo del DRAE
      (origen incierto, no local); borote es su variante con cambio de
      consonante. Voz general del país: no discrimina.

  - voz: breva
    entrada_libro: "Breva o guanariji"
    glosa_libro: "[el fruto] del cardón de lefaria (ver guanariji)"
    pagina: 49
    campo: flora (fruto)
    segun_dictado: true
    dictado: 2026-09-01
    veredicto: D
    filtro: 1
    razon: >
      Castellano: BREVA 'primer fruto de la higuera' aplicado por metáfora al
      fruto del cardón de lefaria. El dato (que ese fruto tenía nombre y se
      comía) queda en la entrada lefaria.

  - voz: buruza
    glosa_libro: >-
      es creación del pueblo llano para identificar una cosa pequeña o
      parte mínima de alguna cosa.
    pagina: 51
    campo: otro
    origen_libro: "creación del pueblo llano (según el autor)"
    segun_dictado: true
    dictado: 2026-09-01
    dudosa: true
    cruce:
      lexicon: "nada (lokono buru 'cielo' es ruido)"
      fonotactica: pasa
    veredicto: D
    certeza: baja
    filtro: 1
    razon: >
      Sin referente local (cuantificador 'pizca, poquito'); probable
      formación expresiva castellana (cf. brizna, borusca; y el
      venezolanismo ñinga con el mismo valor). No hay candidato indígena y
      el protocolo no persigue cuantificadores. Dudosa solo por falta de
      etimología cerrada.

  - voz: buzaca
    lectura_de_oido: "dictado «Busaka», «buzaca» — cotejar grafía (¿busaca?)"
    glosa_libro: >-
      para nuestros mayores, toda bolsa de papel capaz de contener algo en
      su interior era una buzaca. También se le llamó así a los sacos hechos
      de tela. Es palabra del pueblo llano.
    pagina: 52
    campo: casa
    origen_libro: "palabra del pueblo llano"
    nota_miguel: "cree que «palabra del pueblo llano» indica autóctona; y nota la cadencia parecida de buzaca y busuga"
    segun_dictado: true
    dictado: 2026-09-01
    dudosa: true
    cruce:
      lexicon: "nada (lokono buraka 'arco' es ruido); por glosa: wayuu piyulu 'bolsa de malla', toleeka 'saco' — nada parecido"
      fonotactica: pasa
      fuera_del_repo: >-
        Documentada como voz ZULIANA y falconiana (Diccionario de maracucho;
        repertorio de palabras falconianas): busaca 'bolsa'. Distribución
        regional occidental, no solo Paraguaná. El protocolo §5 la usaba
        como EJEMPLO de descarte por papiamento («busaca → papiamento,
        descartada»), pero eso era ilustrativo: la búsqueda del 2026-09-01
        no halló ninguna fuente que la dé como papiamento.
    veredicto: D
    certeza: baja
    filtro: "1/2 (origen incierto)"
    razon: >
      Tres razones para no perseguirla: el referente es introducido (bolsa
      de papel, saco de tela: no hay bolsa de papel precontacto); la
      distribución es occidental venezolana (Zulia + Falcón), no
      peninsular; y la forma se deja leer como castellano deformado (¿bolsa
      + -aca, con l vocalizada: bolsaca > busaca?) o como préstamo por mar,
      sin que ninguna fuente lo cierre. Sobre «palabra del pueblo llano»:
      en este libro es la etiqueta de toda creación popular, incluidas las
      deformaciones castellanas (abofao, buruza) — NO marca autoctonía. La
      cadencia buzaca~busuga es -Vga/-Vka final: en el lexicón atestiguado
      abundan (waka, bakoa, saruro...), no discrimina.

  - voz: cabuya
    entrada_libro: "Cabuya (con y)"
    glosa_libro: >-
      es voz caribe. Para nuestra gente fue fibra de la pita con que se
      fabrican cuerdas y tejidos; cuerda, especialmente de pita o sisal.
    pagina: 55
    campo: oficio / fibra
    origen_libro: "«es voz caribe» — la fórmula etimológica del DRAE (cabuya: «Voz caribe»), copiada por el autor"
    nota_miguel: "cree que «voz caribe» quiere decir «voz indígena» en general; lo deja como dice el autor"
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: >-
        nada por forma. POR GLOSA: DIPOPO 'fibra de cocuiza, cabuya'
        [caquetío-atestiguado], kukuisa 'cocuiza, agave de fibra'
        [español-colonial], maure 'fibra de algodón' [caquetío]. El
        caquetío tenía su propia palabra para la fibra de cabuya: dipopo.
      cognados: nada
      toponimos: nada
      fonotactica: pasa
      fuera_del_repo: >-
        DRAE: cabuya, «Voz caribe». Alvarado 1921 s.v. CABUYA: «Voz taína,
        adoptada en el chaima. En cal[ina] káboya, en gal[ibi] kabuia, en
        maquiritare kahuya» (refs. Las Casas, Oviedo I.132, Herrera,
        Gilij). Es decir: TAÍNA (arahuaca insular), y las formas caribes
        son préstamos de ella — al revés de lo que la marca del DRAE
        sugiere.
    veredicto: D
    filtro: 4
    razon: >
      Antillanismo panhispánico: cabuya entró al español general desde el
      Caribe insular en el s. XVI (Oviedo la trae) y se dice en toda
      Hispanoamérica — no discrimina. Lo que la entrada deja es el mismo
      hallazgo que bachaco/koke: el caquetío TENÍA nombre propio para la
      fibra (dipopo, atestiguado) y el habla paraguanera del XX conserva
      la voz general, no la local. Segunda PÉRDIDA LÉXICA documentada.
      Sobre «voz caribe»: el autor copia la marca del DRAE, que en ese
      diccionario significa «de las lenguas del Caribe insular» — no es
      su etimología ni un juicio sobre Paraguaná.

  - voz: cachimbo
    glosa_libro: >-
      así denominaron nuestros viejos a la pipa de fumar tabaco. En otras
      latitudes significa ingenio de azúcar pequeño y hasta guardia
      nacional.
    pagina: 57
    campo: otro (oficio)
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "no cruzada: etimología conocida"
    veredicto: D
    filtro: 5
    razon: >
      AFRICANISMO: cachimba/cachimbo 'pipa' entró al español americano por
      el portugués (bantú, kimbundu kixima) — DRAE: «de or. africano». Voz
      general del Caribe y Venezuela; el autor mismo la da con acepciones
      de otras regiones.

  - voz: cachivache
    glosa_libro: >-
      [entrada agrupada] las palabras catanar [?], camastrón y carcacha son
      sinónimos de cosas viejas. Esta es la palabra académica.
    pagina: 57
    campo: otro

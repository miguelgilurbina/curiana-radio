      accion: enriquecer, no crear
      lema: harifuche
      forma_fuente_anadir: "arifuque / harifuque (Medina Colina 2013 p. 31); harifuque (Polar, glosario p. 498)"
      glosa_enriquecer: "maíz tostado y miel; harina de maíz tostado con papelón/panela — comida de camino de los arrieros (Paraguaná, s. XX)"
      procedencias_anadir:
        - {obra: medina-colina-sxx, pagina: 31}
        - {obra: polar-el-maiz-glosario, pagina: 498}
      etiqueta: "se mantiene caquetío-atestiguado (la atestación es la de Hernández Baño); las dos nuevas son testimonio regional s. XX"
      esfera_mundo: "ecología/alimentación: el maíz tostado con dulce como ración de camino — para el corpus, con marca retro-abstraido"


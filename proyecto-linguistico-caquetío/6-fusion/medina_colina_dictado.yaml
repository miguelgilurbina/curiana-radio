  - voz: buzaca
    lectura_de_oido: "dictado «Busaka», «buzaca» — cotejar grafía (¿busaca?)"
    glosa_libro: >-
      para nuestros mayores, toda bolsa de papel capaz de contener algo en
      su interior era una buzaca. También se le llamó así a los sacos hechos
      de tela. Es palabra del pueblo llano.
    pagina: 52
    campo: casa
    origen_libro: "palabra del pueblo llano"
    nota_miguel: "cree que «palabra del pueblo llano» indica autóctona; y nota la cadencia parecida de buzaca y busuga"
    segun_dictado: true
    dictado: 2026-09-01
    dudosa: true
    cruce:
      lexicon: "nada (lokono buraka 'arco' es ruido); por glosa: wayuu piyulu 'bolsa de malla', toleeka 'saco' — nada parecido"
      fonotactica: pasa
      fuera_del_repo: >-
        Documentada como voz ZULIANA y falconiana (Diccionario de maracucho;
        repertorio de palabras falconianas): busaca 'bolsa'. Distribución
        regional occidental, no solo Paraguaná. El protocolo §5 la usaba
        como EJEMPLO de descarte por papiamento («busaca → papiamento,
        descartada»), pero eso era ilustrativo: la búsqueda del 2026-09-01
        no halló ninguna fuente que la dé como papiamento.
    veredicto: D
    certeza: baja
    filtro: "1/2 (origen incierto)"
    razon: >
      Tres razones para no perseguirla: el referente es introducido (bolsa
      de papel, saco de tela: no hay bolsa de papel precontacto); la
      distribución es occidental venezolana (Zulia + Falcón), no
      peninsular; y la forma se deja leer como castellano deformado (¿bolsa
      + -aca, con l vocalizada: bolsaca > busaca?) o como préstamo por mar,
      sin que ninguna fuente lo cierre. Sobre «palabra del pueblo llano»:
      en este libro es la etiqueta de toda creación popular, incluidas las
      deformaciones castellanas (abofao, buruza) — NO marca autoctonía. La
      cadencia buzaca~busuga es -Vga/-Vka final: en el lexicón atestiguado
      abundan (waka, bakoa, saruro...), no discrimina.

  - voz: cabuya
    entrada_libro: "Cabuya (con y)"
    glosa_libro: >-
      es voz caribe. Para nuestra gente fue fibra de la pita con que se
      fabrican cuerdas y tejidos; cuerda, especialmente de pita o sisal.
    pagina: 55
    campo: oficio / fibra
    origen_libro: "«es voz caribe» — la fórmula etimológica del DRAE (cabuya: «Voz caribe»), copiada por el autor"
    nota_miguel: "cree que «voz caribe» quiere decir «voz indígena» en general; lo deja como dice el autor"
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: >-
        nada por forma. POR GLOSA: DIPOPO 'fibra de cocuiza, cabuya'
        [caquetío-atestiguado], kukuisa 'cocuiza, agave de fibra'
        [español-colonial], maure 'fibra de algodón' [caquetío]. El
        caquetío tenía su propia palabra para la fibra de cabuya: dipopo.
      cognados: nada
      toponimos: nada
      fonotactica: pasa
      fuera_del_repo: >-
        DRAE: cabuya, «Voz caribe». Alvarado 1921 s.v. CABUYA: «Voz taína,
        adoptada en el chaima. En cal[ina] káboya, en gal[ibi] kabuia, en
        maquiritare kahuya» (refs. Las Casas, Oviedo I.132, Herrera,
        Gilij). Es decir: TAÍNA (arahuaca insular), y las formas caribes
        son préstamos de ella — al revés de lo que la marca del DRAE
        sugiere.
    veredicto: D
    filtro: 4
    razon: >
      Antillanismo panhispánico: cabuya entró al español general desde el
      Caribe insular en el s. XVI (Oviedo la trae) y se dice en toda
      Hispanoamérica — no discrimina. Lo que la entrada deja es el mismo
      hallazgo que bachaco/koke: el caquetío TENÍA nombre propio para la
      fibra (dipopo, atestiguado) y el habla paraguanera del XX conserva
      la voz general, no la local. Segunda PÉRDIDA LÉXICA documentada.
      Sobre «voz caribe»: el autor copia la marca del DRAE, que en ese
      diccionario significa «de las lenguas del Caribe insular» — no es
      su etimología ni un juicio sobre Paraguaná.

  - voz: cachimbo
    glosa_libro: >-
      así denominaron nuestros viejos a la pipa de fumar tabaco. En otras
      latitudes significa ingenio de azúcar pequeño y hasta guardia
      nacional.
    pagina: 57
    campo: otro (oficio)
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "no cruzada: etimología conocida"
    veredicto: D
    filtro: 5
    razon: >
      AFRICANISMO: cachimba/cachimbo 'pipa' entró al español americano por
      el portugués (bantú, kimbundu kixima) — DRAE: «de or. africano». Voz
      general del Caribe y Venezuela; el autor mismo la da con acepciones
      de otras regiones.

  - voz: cachivache
    glosa_libro: >-
      [entrada agrupada] las palabras catanar [?], camastrón y carcacha son
      sinónimos de cosas viejas. Esta es la palabra académica.
    pagina: 57
    campo: otro
    segun_dictado: true
    dictado: 2026-09-01
    veredicto: D
    filtro: 1
    razon: "Castellano general (DRAE); el autor la marca como académica. Se anota por cobertura."

  - voz: cafudeco
    glosa_libro: >-
      rara expresión para referirse a alguien que calificaban como tonto,
      bobo; en fin, un rol histriónico [?] de pendejo, decían.
    pagina: 58
    campo: otro (insulto)
    segun_dictado: true
    dictado: 2026-09-01
    veredicto: D
    filtro: 1
    razon: "Insulto de formación expresiva; el protocolo no los persigue (rendimiento nulo). Se anota por cobertura."

  - voz: calende
    glosa_libro: >-
      taparrabo. Para los paraguaneros fue la ropa maltrecha, rota,
      andrajosa.
    pagina: 59
    campo: vestido
    segun_dictado: true
    dictado: 2026-09-01
    dudosa: true
    cruce:
      lexicon: "nada por forma (wayuu ka'lee 'grueso' es ruido); por glosa: solo wayuu ashe'in 'ropa' — el lexicón no tiene 'taparrabo/guayuco'"
      cognados: nada
      toponimos: nada
      fonotactica: "NO pasa — cluster -nd- no atestiguado en caquetío"
      fuera_del_repo: "no está en Alvarado 1921"
    veredicto: D
    certeza: baja
    filtro: "fonotáctica (criterio 3 como filtro negativo)"
    razon: >
      El referente (taparrabo) es precontacto y el lexicón no tiene palabra
      para él — hueco real. Pero la forma viola la fonotáctica atestiguada
      (-nd-), que el protocolo usa como filtro negativo, y no hay
      etimología en ninguna dirección (ni castellana, ni papiamento, ni
      arahuaca). Se documenta el hueco (guayuco/taparrabo sin nombre
      caquetío) y la voz queda D-dudosa.

  - voz: catanare
    lectura_de_oido: "dictado «Catanari», «Catenar», «Catanare» — cotejar grafía"
    entrada_libro: "agrupada con camastrón y carcacha (p. 57)"
    glosa_libro: >-
      estas palabras fueron tomadas por nuestros mayores como sinónimo de
      cosas viejas, inservibles o muy deterioradas.
    pagina: 57
    campo: otro
    nota_miguel: "«creo que catanare es la que más pareciera caquetía» (la -re)"
    segun_dictado: true
    dictado: 2026-09-01
    dudosa: true
    cruce:
      lexicon: "nada por forma; por glosa ('viejo'): baharuko 'abuelo, viejo', wasima 'viejo, anciano' [caq. atestiguado] — de personas, no de cosas"
      fonotactica: pasa
      fuera_del_repo: "no está en Alvarado 1921"
    veredicto: D
    certeza: media
    filtro: 1
    razon: >
      Probable derivado de CATANA (< jap. katana 'sable'; en Cuba y
      Venezuela 'objeto viejo, inservible' — DRAE), con una terminación
      -are. Si eso es así, la -are que Miguel señala sería aquí un SUFIJO
      LOCAL sobre raíz castellana: dato interesante sobre la productividad
      de -are en el habla, pero contrario a que la palabra sea sustrato.
      Queda dudosa hasta cotejar catana en el uso paraguanero.

  - voz: camonina
    glosa_libro: >-
      así dijeron nuestros viejos para referirse a los engaños, a la
      simulación, a la tomadera de pelo.
    pagina: "60-61"
    campo: otro (abstracto)
    segun_dictado: true
    dictado: 2026-09-01
    dudosa: true
    cruce:
      lexicon: "nada por forma ni por glosa"
      fonotactica: pasa
      fuera_del_repo: "no está en Alvarado 1921"
    veredicto: D
    certeza: baja
    filtro: "campo no discriminante"
    razon: >
      Abstracto ('engaño') sin referente local ni etimología en ninguna
      dirección. Regla que se fija aquí para no inflar la C: una voz sin
      filiación Y sin campo local no sube de D-dudosa por el solo hecho de
      no tener etimología castellana (cadare se dejó en C-baja por la
      -are; camonina no tiene ni eso). Terminación -ina: castellana
      (tomadera, cominería) o expresiva.

  - voz: capirote
    glosa_libro: >-
      las vísceras de un animal que se sacrificara generalmente formaban
      parte de lo que se pagaba al matarife por sus servicios. A dichas
      vísceras nuestra gente denominó con esta palabra.
    pagina: "62-63"
    campo: oficio (matanza)
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "nada por forma; por glosa ('vísceras'): nada en ninguna lengua del canon"
      fonotactica: pasa
    veredicto: D
    filtro: 1
    razon: >
      Forma castellana (capirote 'capucha cónica'; también 'variedad de
      cosas' en el uso regional) con acepción local 'asadura del animal
      sacrificado'. Metáfora o deslizamiento castellano; nada indígena. El
      dato de oficio — el matarife cobraba en vísceras — va a mc-mundo-008.

  - voz: capusa
    glosa_libro: >-
      fue creada por el pueblo para con ella designar a todo envase de
      papel o tela capaz de contener algo. Se decía capusa de papel o
      capusa de tela.
    pagina: 63
    campo: casa
    origen_libro: "creada por el pueblo (según el autor)"
    segun_dictado: true
    dictado: 2026-09-01
    dudosa: true
    cruce:
      lexicon: "nada real (kapu 'demonio', kapua 'amanecer', kasá: ruido difuso); por glosa: solo wayuu piyulu/toleeka"
      fonotactica: pasa
      fuera_del_repo: "no está en Alvarado 1921"
    veredicto: D
    certeza: baja
    filtro: 1
    razon: >
      Mismo referente que buzaca (bolsa de papel o tela: introducido), y
      la misma conclusión: el habla tenía DOS palabras locales para la
      bolsa (buzaca, capusa), lo que sugiere creación popular tardía sobre
      base castellana (¿capuz/capucha 'cubierta' → capusa?) más que
      sustrato. Dudosa por falta de etimología cerrada.

  - voz: carebe
    lectura_de_oido: "dictado «Caribe, Carebe» — leído carebe; cotejar"
    glosa_libro: >-
      con esta palabra, propia del pueblo, se identificaba una especie de
      cucharón que se hacía con media tapara y que era atravesada por sus
      bordes por un mango de madera. Era utilizado para servir comida.
    pagina: 64
    campo: casa (utensilio)
    origen_libro: "«palabra propia del pueblo»"
    segun_dictado: true
    dictado: 2026-09-01
    dudosa: true
    cruce:
      lexicon: "nada por forma (cognado-050 caribe es ruido); por glosa: kudan 'servir' [caq.], wayuu aliita 'totuma' — nada para 'cucharón'"
      fonotactica: pasa
      fuera_del_repo: "no está en Alvarado 1921"
    veredicto: C
    certeza: baja
    razon: >
      Utensilio de tapara con mango: referente precontacto (la totuma
      como cucharón es pancaribeña) y nombre local sin etimología
      castellana. Pasa los filtros; campo local y distribución restringida
      por única fuente; sin cognado ni atestación. C-baja: al corpus
      (casa/oficio) como hipotético, junto a camuro — el par tapara-vasija
      / tapara-cucharón con nombres propios.

  - voz: cataneja
    glosa_libro: >-
      ave carroñera, muy parecida al zamuro, pero con la cabeza sin
      plumas [?].
    pagina: 65
    campo: fauna
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: >-
        nada por forma. POR GLOSA: WARU 'volturido, cataneja. Ave mayor que
        el zamuro' [caquetío-atestiguado, Zavala #143 (Esteves),
        forma_fuente guaru] — el propio lexicón usa «cataneja» como la
        GLOSA CASTELLANA de waru. También warawara 'caracara' [caq.
        atestiguado] y wayuu samulu 'zamuro'.
      fonotactica: pasa
      fuera_del_repo: "no está en Alvarado 1921 como lema"
    veredicto: D
    certeza: media
    filtro: "4 (nombre regional de circulación amplia)"
    razon: >
      Cataneja es el nombre común del occidente venezolano (Falcón, Lara,
      Zulia) para el buitre grande, y es la palabra con que Esteves y el
      lexicón GLOSAN la voz caquetía waru. Cuarta sustitución documentada
      (koke→bachaco, dipopo→cabuya, korie→cachicamo, waru→cataneja): el
      habla del XX conserva el nombre regional castellano-criollo, no el
      caquetío. La etimología de cataneja misma queda abierta (no es
      castellana obvia; podría ser indígena de otro estrato) — por eso
      certeza media: D como sustrato caquetío, no como voz castellana.

  - voz: cayapa
    glosa_libro: >-
      con este adjetivo, invento de su ingenio, nuestros mayores
      calificaron dos cosas: una, cuando varias personas le caían a golpes
      a una sola; dos, cuando varios hombres, en un día acordado
      previamente, le trabajaban de gratis a uno de ellos a cambio de
      licor y comida, generalmente para hacer la casa o atender una
      siembra.
    pagina: 66
    campo: sociedad / oficios
    origen_libro: "«invento de su ingenio» (creación local, según el autor)"
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "nada real (kaya, karapa, wayuu jayapa: ruido difuso); por glosa: nada"
      fonotactica: pasa
    veredicto: D
    filtro: 4
    razon: >
      Voz venezolana GENERAL (DRAE: cayapa, Ven.; en todo el país 'trabajo
      colectivo' y 'ataque en grupo'), no local — el autor la cree local
      porque la conoce en su uso. Origen discutido (se ha propuesto el
      etnónimo cayapa/chachi del Ecuador; no hay candidato arahuaco). Lo
      que vale es la INSTITUCIÓN: trabajo colectivo recíproco por licor y
      comida — mc-mundo-009.

  - voz: chaguaca
    lectura_de_oido: "dictado «chihuahua, chaguaca» — leído chaguaca; cotejar"
    glosa_libro: >-
      así llamaron los viejos paraguaneros al estómago de las aves, fueran
      estas domésticas o no.
    pagina: 67
    campo: cuerpo (animal) / cocina
    segun_dictado: true
    dictado: 2026-09-01
    dudosa: true
    cruce:
      lexicon: "nada real (sawaka, waka: ruido difuso); por glosa ('molleja'): nada en ninguna lengua del canon"
      fonotactica: pasa
      fuera_del_repo: "no está en Alvarado 1921"
    veredicto: D
    certeza: baja
    filtro: "campo no discriminante (regla fijada en camonina)"
    razon: >
      Forma sin etimología castellana, pero el referente (la molleja de
      un ave, doméstica o no) no es local ni intraducible — el español
      tiene molleja. Por la regla fijada en camonina: sin filiación y sin
      campo local, D-dudosa. Se deja abierta por si aparece en otra
      fuente regional (Zulia/Lara) con pista de origen.

  - voz: chaqui chaqui
    glosa_libro: >-
      era la arena con alto contenido de pequeñas piedras de canto, la
      cual al caminar sobre ellas hacía un ruido que le dio el nombre
      popular.
    pagina: 69
    campo: paisaje
    origen_libro: "el autor la declara onomatopéyica («el ruido que le dio el nombre»)"
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "no cruzada: onomatopeya declarada por la fuente"
    veredicto: D
    filtro: "1 (creación expresiva)"
    razon: >
      Reduplicación onomatopéyica, y lo dice el autor. El REFERENTE sí
      importa: la arena de canto rodado es un tipo de suelo del paisaje
      costero que el corpus de ecología distingue (playa, médano, salina),
      y el lexicón no tiene palabra para él — hueco de paisaje anotado,
      sin voz que lo llene.

  - voz: chaute
    lectura_de_oido: "dictado «Chaote, chaute, chaufres» — leído chaute; cotejar"
    glosa_libro: >-
      las frutas aún no maduras, y las pasadas de maduras, eran para
      nuestros viejos frutas chautes.
    pagina: 69
    campo: flora (estado del fruto)
    segun_dictado: true
    dictado: 2026-09-01
    dudosa: true
    cruce:
      lexicon: "nada real (kuté 'a usted', chaure 'lechuza': ruido difuso); por glosa: solo 'verde' y 'maduro' en lokono y wayuu, nada caquetío"
      fonotactica: pasa
      fuera_del_repo: "no está en Alvarado 1921"
    veredicto: D
    certeza: baja
    filtro: "campo no discriminante (regla de camonina)"
    razon: >
      Adjetivo de estado del fruto ('malogrado': verde o pasado) sin
      etimología en ninguna dirección. A diferencia de cachinare (que
      nombra el fruto malogrado DEL CARDÓN, campo caquetío), chaute es
      genérico y el español lo cubre (verde, pasado): D-dudosa. Si en la
      letra correspondiente el libro trae más vocabulario de recolección
      de fruta, se revisa el conjunto.

  - voz: chiclán
    glosa_libro: >-
      todo hombre o animal macho que solo tuviese un testículo, para
      nuestros viejos era un hombre o animal chiclán.
    pagina: 70
    campo: cuerpo / ganado
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "no cruzada: etimología castellana cerrada"
    veredicto: D
    filtro: 1
    razon: >
      Castellano: CICLÁN 'que tiene un solo testículo' (DRAE; de origen
      árabe), con la variante chiclán documentada en Andalucía y América.
      Arcaísmo ganadero conservado, como ahíto y aguamanil: el vocabulario
      de la cría de ganado menor es donde el español rural viejo sobrevive
      mejor.

  - voz: chícora
    glosa_libro: >-
      era una herramienta para cavar huecos y clavar maderos. La componía
      una hoja metálica afilada que se encastraba, por su lado circular, en
      un mango de madera de poco más de metro y medio. Junto con el pico y
      la barra, era instrumento indispensable para el trabajo de sacar
      sepulturas y [hacer] los estanques [?].
    pagina: 70
    campo: oficio (herramienta)
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "nada real (kira, ikoa: ruido); por glosa: wayuu paarü 'pala', lokono shukua 'remo' — nada caquetío para 'azada/coa'"
      fonotactica: pasa
      fuera_del_repo: "DRAE: chícora, Ven. 'azada' (sin etimología). No está en Alvarado 1921 como lema. Búsqueda 2026-09-01: voz venezolana general"
    veredicto: D
    filtro: 4
    razon: >
      Voz venezolana general (DRAE, Ven.), no peninsular; el objeto es de
      hoja metálica, posterior al contacto. Origen de la palabra abierto
      (no es castellana obvia; podría ser indígena de otro estrato o
      derivado de coa) — pero no discrimina Paraguaná. El dato que vale:
      es la herramienta con que se cavaban los ESTANQUES (los jagüeyes de
      asentar agua) y las sepulturas — mc-mundo-011.

  - voz: chinchorro
    glosa_libro: >-
      es académica. Hamaca ligera hecha con cordeles; se hacía de hilos de
      cocuy, que es más fuerte y fino que el hilo de cocuiza. También se
      tejían de hilo de algodón, pero resultan más calurosos. La hamaca se
      hacía de lonilla.
    pagina: 71
    campo: casa / oficio (textil)
    origen_libro: "«es académica»"
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "no cruzada la voz (DRAE: chinchorro 'hamaca de red', Ven./Col.); SÍ cruzadas las fibras: kokuy 'penca... que da un vino agradable' [caq. atestiguado], dipopo 'fibra de cocuiza' [caq. atestiguado], kukuisa [español-colonial], maure 'fibra de algodón' [caq.]"
    veredicto: D
    filtro: 1
    razon: >
      Castellano (chinchorro 'red' > 'hamaca de red'), y el autor la marca
      como académica. Lo que la entrada trae es tecnología textil con
      nombres que el lexicón SÍ tiene: la fibra de COCUY (kokuy, Agave
      cocui) «más fuerte y fina» que la de COCUIZA (kukuisa/dipopo,
      Furcraea), y el algodón (maure) como alternativa cálida. Es la
      jerarquía de fibras del oficio de la hamaca — mc-mundo-012.

  - voz: chingo
    glosa_libro: >-
      así llamaron nuestros paraguaneros a los que por alguna
      circunstancia no tuvieran nariz, como también a los que estaban
      desesperados o a la expectativa por alcanzar algo.
    pagina: 72
    campo: cuerpo / otro
    segun_dictado: true
    dictado: 2026-09-01
    cruce:
      lexicon: "no cruzada: venezolanismo general"
    veredicto: D
    filtro: 4
    razon: >
      Venezolanismo GENERAL del DRAE: chingo 'chato, de nariz roma' y
      «estar chingo» 'estar deseoso, desesperado por algo' — las dos
      acepciones que da el autor son las nacionales (origen discutido,
      probablemente romance/caló, no indígena). No discrimina Paraguaná.

  - voz: chiripa
    glosa_libro: >-
      nuestra gente le dio dos significados a esta palabra: la cucaracha
      pequeña, la que aún no está desarrollada, la llamó así; y lo que se
      alcanzaba u obtenía por casualidad. Es palabra académica.
    pagina: 72
    campo: fauna / otro
    origen_libro: "«es palabra académica»"
    nota_miguel: "le llama la atención la terminación -ipa"

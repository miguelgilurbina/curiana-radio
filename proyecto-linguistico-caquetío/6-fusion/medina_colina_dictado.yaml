    razon: >
      Las dos acepciones están en el DRAE: chiripa 'casualidad favorable'
      (general) y, marcada Ven., 'cucaracha pequeña'. Venezolanismo
      general, no peninsular. Sobre la -ipa: no hay en el caquetío
      atestiguado una final -ipa con la que compararla (sí -pa en el
      wayuu); se anota la observación sin más.

  - voz: chirito
    lectura_de_oido: "dictado «chiquito, chirito» — leído chirito"
    glosa_libro: >-
      así llama nuestra gente a un pequeño pájaro de color blanco
      grisáceo, un poco mayor del tamaño del colibrí, y que da su sonido
      en árboles altos.
    pagina: 73

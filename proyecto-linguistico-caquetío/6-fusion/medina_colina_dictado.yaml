  - voz: barisigua
    entrada_libro: "Barisigua — «con b larga y con s» (Miguel, sobre el papel)"
    glosa_libro: >-
      árbol que fue abundante en nuestro medio, hoy muy escaso, de hasta
      ocho metros de altura, en otras regiones del país conocido como palo
      de balsa. Su madera era muy liviana de peso, de granulación suave, se
      presta para trabajarla y con ella se hacían bateas y baques que
      necesitaban nuestras mujeres.
    pagina: 43
    campo: flora
    origen_libro: "el autor contrasta el nombre local con el nacional («en otras regiones del país conocido como palo de balsa»): distribución PENINSULAR declarada"
    nota_miguel: "habría que anotar si los caquetíos prehispánicos usaban este árbol para hacer canoas"
    segun_dictado: true
    dictado: 2026-09-01
    identificacion_botanica: >-
      CORREGIDA 2026-09-01. Género Erythrina (bucares, Fabaceae): Avendaño &
      Castillo 2014 (Acta Bot. Venez. 37(2), p. 146) registran «Barisigua»
      como nombre común de Erythrina pallida Britton, distribución con
      Falcón (FA). Un blog local da E. tamayonis Krukoff (no está en la
      monografía). A especie: abierta; a género: cerrada. NO es Ochroma: el
      «palo de balsa» de Medina Colina es el nombre popular de una madera
      liviana (el bucare seco), no la balsa botánica — la primera lectura
      del escriba (Ochroma) fue una inferencia del nombre y queda retirada.
    cruce:
      lexicon: >-
        nada por forma. ≈ barici/barisi 'agua turbia, tierras coloradas;
        ceniza' [caquetío-atestiguado; cognado-001; toponimo-006] es
        parecido difuso: se anota, NO se afirma (la madera es «blanco
        rojizo» según Alvarado — coincidencia tentadora, sin prueba).
      por_glosa: "kuru 'árbol, madera, tronco' [caq. reconstruido], bara 'palo, árbol' [caq. atestiguado]; ningún fitónimo caquetío para esta especie"
      cognados: nada
      toponimos: "nada en el canon ni en Esteves"
      a2: nada
      fonotactica: "pasa (barisiwa: sílabas CV, sin clusters)"
      fuera_del_repo: >-
        No está en Alvarado 1921. SÍ está en la flora científica: Avendaño &
        Castillo 2014, p. 146 — «Nombres comunes: Bucare Peonia, Barisigua»
        (Erythrina pallida; distribución AN, DC, FA, LA, MI, SU). Y es
        TOPÓNIMO: el caserío LAS BARISIGUAS, parroquia Dabajuro, municipio
        Dabajuro, Falcón (blog Pueblos de Venezuela: N 11º02,414′ W
        70º43,247′, 65 msnm, a 3 km de Dabajuro; «el nombre lo toma del
        árbol llamado Barisigua... palabra indígena»; madera «pesada y dura
        cuando está verde, se hace liviana cuando se seca», buena para
        talla). Wikipedia (municipio Dabajuro) no lista el caserío: la
        fuente del topónimo es débil pero trae coordenadas — Miguel puede
        verificarlo en el mapa. Pista inicial: resumen generado por Google
        que pasó Miguel (no citable; se verificó cada afirmación).
    filtros:
      "1 castellano": "no restituye a nada; el nombre castellano es balsa/balso/lano"
      "2 papiamento/neerlandés": "sin candidato"
      "3 wayuu": "sin forma parecida"
      "4 panhispánico": "no — el nombre general es otro; barisigua no circula fuera"
      "5 africanismo": "sin candidato"
      "6 caribe": "sin candidato directo; pero la FORMACIÓN en -igua es la de tacarigua y samanigua (Alvarado): patrón de fitónimo indígena venezolano, de filiación no resuelta"
    criterios_positivos:
      "1 campo local intraducible": "sí — fitónimo de especie, el criterio más discriminante"
      "2 distribución restringida": "sí — solo Paraguaná, y el autor lo declara"
      "3 fonotáctica": "pasa (débil en positivo)"
      "4 cognado regular": "no"
      "5 respaldo toponímico": "SÍ — Las Barisiguas (Dabajuro, Falcón occidental: el corazón de la tradición dabajuroide, la cerámica de los caquetíos costeros). Fuente débil (blog) con coordenadas; verificar en mapa"
      "6 atestación colonial": "no; pero sí atestación CIENTÍFICA del nombre común (Avendaño & Castillo 2014)"
    veredicto: B
    razon: >
      Subió de C a B el mismo día: sobrevive a los seis descartes y cumple
      TRES criterios positivos — campo local (fitónimo de especie),
      distribución restringida (Falcón; el autor la contrasta con el nombre
      nacional) y RESPALDO TOPONÍMICO (Las Barisiguas, Dabajuro) — más la
      fonotáctica y una atestación externa del nombre común en la flora
      científica. Le falta el cognado con correspondencia regular que el
      nivel B pide en sentido estricto: por eso es B «sin cognado», no A.
      Destino del protocolo: corpus cultural SÍ (flora, marca
      retro-abstraido, etiqueta hipotetico), lexicón activo NO salvo

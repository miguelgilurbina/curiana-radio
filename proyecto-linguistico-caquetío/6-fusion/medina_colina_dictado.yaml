        4-fuentes/polar-el-maiz-glosario.md). Distribución: Falcón.
    filtros:
      "1 castellano": "no restituye a nada: sin raíz ni sufijo castellanos; el análogo funcional canario es gofio, otra palabra"
      "2 papiamento/neerlandés": "el maíz tostado allá es funchi (< bantú funji); no hay parecido"
      "3 wayuu": "sin forma parecida en las 781 entradas wayuu ni en la A-2"
      "4 taíno panhispánico": "no es voz general del español"
      "5 africanismo": "sin candidato"
      "6 caribe/jirajaroide": "sin candidato"
    criterios_positivos:
      "1 campo local intraducible": "sí — técnica alimentaria local (comida de camino de arrieros), el oficio diario que las crónicas no anotaron"
      "2 distribución restringida": "sí — Falcón (Polar) y Paraguaná (Medina Colina); no es voz venezolana general"
      "6 atestación previa": "sí — Hernández Baño vía Zavala #153, ya en el lexicón como atestiguado"
    veredicto: A
    razon: >
      No es una entrada nueva: es la ATESTACIÓN REGIONAL VIVA (s. XX) de una
      forma que el lexicón ya tiene como caquetío-atestiguado por Hernández
      Baño. Tres testigos independientes convergen — Hernández Baño (vía
      Zavala, 'maíz tostado y miel'), el glosario de Polar ('harina de maíz
      tostado con papelón'; Falcón: cariaco tostado con leche) y Medina
      Colina ('harina de maíz con panela, comida de arrieros'). El
      paraguanerismo confirma la palabra en boca del pueblo un siglo después
      de la crónica, y enriquece la glosa: no es solo el alimento sino su
      USO (comida de camino). Es el primer acierto del dictado y del tipo
      que la bitácora predijo: «la mayoría de lo bueno suele estar ya, y
      entonces la voz vale como atestación regional viva».
    dato_para_d5: >
      Alternancia ch ~ k en la sílaba final: harifuche (Hernández Baño) ~
      harifuque (Medina Colina, Polar). Se suma a las alternancias del
      transcriptor que D5 (#36) colecciona (ch~j de Mitare). La h- inicial
      la traen las tres fuentes (Medina Colina también sin ella).

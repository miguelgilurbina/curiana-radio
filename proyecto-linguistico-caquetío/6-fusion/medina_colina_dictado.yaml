  - voz: chuco
    glosa_libro: >-
      los paraguaneros le dieron cuatro significados a esta palabra: uno,
      para designar al mono, que sin importar clase o raza denominaron
      así; dos, para identificar la especie de libélula muy común en los
      estanques de aguas pluviales y que tiene la particularidad de tocar
      el agua sin detener el vuelo; tres, para referirse a la persona que
      pierde [?] en el juego o los negocios; y cuatro, para el acto de
      cargar a horcajadas en el hombro a los niños.

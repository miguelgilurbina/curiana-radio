      Zoónimo, sí, pero la forma se deja leer como castellano expresivo:
      chir- (de chirriar, el canto) + diminutivo -ito, 'el pajarito que
      chirría' — exactamente lo que describe el autor (pequeño, canta en
      lo alto). Sin nada indígena que lo sostenga: D-dudosa. Se deja
      abierta por si la raíz chir- resulta ser la misma de chirita
      (poco probable: allí es 'fino', aquí es canto).

  - voz: chocore
    lectura_de_oido: "dictado «Chocori, Chocoré, chocore» — leído chocore; cotejar tilde"
    glosa_libro: >-
      un sombrero viejo, pero aún usable, era para nuestros viejos un
      chocore. Palabra inventada por nuestro pueblo.

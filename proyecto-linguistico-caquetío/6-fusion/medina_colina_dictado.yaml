      La final -ore se suma a la familia -are/-ure/-ore que el dictado
      viene mostrando en nombres comunes; se anota en patrones, no aquí.

  - voz: chuchumbaca
    glosa_libro: >-
      entretenimiento de los muchachos que consistía en que, mientras uno
      de ellos permanecía en el chinchorro, los demás le movían
      violentamente las cabulleras del mismo.
    pagina: 74
    campo: otro (juego)
    segun_dictado: true
    dictado: 2026-09-01
    dudosa: true

  - voz: chirita / machire
    entrada_libro: "Chirita (y, dentro de la entrada, machire)"
    glosa_libro: >-
      la masa de maíz, cuando estaba muy fina, lista para hacer la arepa,
      estaba chirita. Por el contrario, cuando estaba granulosa se decía
      que estaba machire.

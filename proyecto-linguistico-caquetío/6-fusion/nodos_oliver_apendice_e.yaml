# PROPUESTA — un minador propone, el humano fusiona (regla 5).
# Origen: Oliver 1989, Apéndice E, 'Code List of Archaeological Sites in
# Falcon State, Venezuela' (Fig. 77, cap. 4). SURVEY 1981-1983.
# pp. impresas 745-749 = pdf 772-776 de
# fuentes_caquetios/Oliver_1989_Tesis_Arawakan_NW_Venezuela_UCL.pdf (offset -27).
#
# ⚠️ La p. 776 —Coro/Los Médanos, Paraguaná y Falcón oriental— estaba
#    ROTADA: la primera pasada devolvió 2.850 caracteres y CERO sitios sin
#    avisar de nada. Se recuperó con la detección de orientación añadida a
#    ocr_fuente.py el 2026-08-17. Era justo la página del corazón del
#    proyecto.
#
# PRELLENADO MECÁNICO. 'epoca'/'ventana' salen de la afiliación que declara
# Oliver; 'region'/'costera' del tramo numérico de su subárea (él numeró por
# subárea; las cabeceras no se pueden leer línea a línea en la página a dos
# columnas). Son inferencias reproducibles, NO juicios: lo dudoso va con
# `revisar: true` y su motivo. La decisión sigue siendo humana.
#
# ventana: probable / posible / no / revisar   (la simulación es s. XIV-XV)
# costera: si / borde / no                     (regla 4)
#   si    = la polity que simulamos (Coro-Golfete y Paraguaná)
#   borde = costa occidental de Falcón: caquetía, pero ¿la misma polity?
#   no    = interior, sierra, o Falcón oriental (otra gente)


# PROPUESTA — un minador propone, el humano fusiona (regla 5).
# Origen: Oliver 1989, Apendice E, 'Code List of Archaeological Sites in
# Falcon State, Venezuela' (Fig. 77, cap. 4). SURVEY 1981-1983.
# pp. impresas 747-751 = pdf 774-779 del PDF abierto de UCL Discovery (offset -27).
# OCR en dos pasadas (psm auto + psm 6) y fundido: la lista va a dos columnas
# y una sola pasada pierde nombres y afiliaciones.
#
# AVISOS antes de fusionar a asentamientos.yaml:
#  - La afiliacion es la que declaro el excavador, no una fecha. 'Dabajuroid'
#    abarca 800-1600 d.C.: no equivale a precontacto por si solo.
#  - Ninguna entrada trae coordenadas. Las de Tamers 1970 si.
#  - Hay que decidir por sitio si cae en la polity COSTERA (regla 4).
#  - El OCR no distingue cursivas ni resuelve todas las filas.

meta:
  obra: oliver-1989-cap4
  apendice: E
  prospeccion: '1981-1983'
  generado: '2026-08-15'
  sitios: 98

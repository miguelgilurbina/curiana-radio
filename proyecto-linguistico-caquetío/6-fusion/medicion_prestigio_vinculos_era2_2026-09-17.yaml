c_despues:
  era2:
    agentes: 63
    prestigio:
      claves_escritas_vivas: 1                    # Manaure
      recuperadas_por_alias: 5                    # Sawaka, Karebe, Paugis, Hayo, Turicha
      con_derivacion_de_su_propia_ficha: 63
      que_caen_al_default_por_tier: 0
      distribucion: {1.0: 2, 0.9: 1, 0.85: 2, 0.8: 2, 0.75: 3, 0.7: 8, 0.65: 1,
                     0.6: 3, 0.55: 2, 0.5: 4, 0.45: 11, 0.4: 11, 0.35: 4,
                     0.3: 4, 0.2: 5}
      valores_distintos: 15
      valores_por_tier:
        1: [0.3, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.85, 0.9, 1.0]
        2: [0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.7, 0.75, 0.8]
        3: [0.2, 0.3, 0.35, 0.7]
      lectura: >-
        Ya no es el tier con otro nombre: los tres tiers se solapan. Un tier 2
        puede pesar más que un tier 1 (Dabuda, la matriarca alfarera de
        Tacuato, 0.8) y un tier 3 más que muchos tier 2 (Cege, la vidente
        acogida, 0.7) — que es exactamente lo que la era 1 ya decía al darle
        0.7 a Bana-mana, tier 2, por encima del 0.5 de su tier.

    vinculos:
      claves_escritas_vivas: 1                    # Manaure
      recuperadas_por_alias: 5                    # Sawaka, Karebe, Paugis, Isiro, Patapati
      destinos_sin_equivalente_en_el_elenco: 5    # Buko-ko, Chiriware, Marokoto-ni, Tari-ko, Watapana
      con_derivacion_de_su_propia_ficha: 62       # el único sin ella es Manaure, que es su propia cabeza

    aristas_de_vecinos:
      intra_nodo: 770
      entre_nodos: 110
      a_agentes_inexistentes: 0
      total: 880
      agentes_sin_ninguna_arista: []
      lectura: >-
        Las 110 aristas entre nodos NO son un diseño de frontera: son los
        vínculos que el canon ya había escrito y que el renombramiento había
        dejado colgando — los casados cruzando con su casa de origen, el eje
        matrilineal que va de casa en casa, y los destinos de las tablas
        escritas que sí tienen equivalente (Sawaka→Turicha, en Caseto).
        Diseñar la frontera sigue siendo decisión de Miguel.

    los_que_cruzan:
      con_sitio_de_origen_declarado: 18
      de_otro_nodo: 10
      de_otro_nodo_en_el_roster: 6                # coincide con MEDIDO.portadores_entre_nodos_en_el_roster
      nombres_de_otro_nodo: [Dipopo, Dunakoa, Duraboa, Ebokoa, Karebe, Kasebo,
                             Kumarawa, Mene, Urari, Waranaro]
      en_el_roster: [Dunakoa, Ebokoa, Karebe, Kasebo, Urari, Waranaro]
      wamipa: >-
        No fue traído de ninguna parte: nació y se crió en la casa del
        Manaure. Su vínculo con AMUAY sale del linaje de su madre Karebe
        (Warana, de Caseto) y apunta a Turicha, «tío materno mayor de la
        casa» de los Guasicures. El canon lo escribió; el motor no lo veía.

  era1:
    agentes: 60
    identica: true
    prestigio_distribucion: {1.0: 2, 0.9: 1, 0.85: 1, 0.7: 2, 0.65: 1, 0.6: 1,
                             0.55: 1, 0.5: 6, 0.4: 24, 0.3: 1, 0.25: 4,
                             0.2: 13, 0.15: 3}
    aristas_de_vecinos: {intra_nodo: 510, entre_nodos: 0, a_agentes_inexistentes: 0}
    con_derivacion: 0
    como_se_vigila: >-
      `tests/test_social.py::test_la_era_1_no_cambia_byte_a_byte` compara, para
      los 60, `prestigio_de()` y `vecinos()` contra la fórmula vieja, y exige
      que la derivación devuelva None/{} en todos.
      `::test_la_era_1_no_cambia_tampoco_con_el_estado_moviendo_gente` repite
      la comparación con un estado que mueve a los 60 de ubicación, que es la
      otra mitad de `vecinos()`.

# ══════════════════════════════════════════════════════════════════════
d_lo_que_queda_abierto:
  - que: 'La frontera entre nodos sigue sin diseñarse'
    donde: 6-fusion/issues-pendientes/frontera-entre-nodos-2026-09-17.md
    nota: >-
      Este arreglo NO la implementa. Las cuatro vías por las que hoy cruza una
      forma (V1-V4) siguen siendo globales y sin partición por nodo, y el
      prompt sigue rodeando al grafo social por los otros cuatro lados.
  - que: '`nombre_era1()` está escrito dos veces'
    donde: 'curiana_koine.py y curiana_social.py, las dos sobre curiana_agents.ALIAS_ERA1'
    nota: >-
      Las dos derivan de la MISMA puerta, así que no hay dos verdades; pero el
      sitio natural del inverso de `resolver_alias()` es `curiana_agents.py`.
      Consolidarlo es una tarea de ese módulo, no de éste.
  - que: 'La ficha generada de la era 2 no expone `parentesco`'
    donde: 6-fusion/elenco_era2.yaml lo tiene; curiana_sim/curiana_agents_era2.py no
    nota: >-
      Por eso los vínculos derivados son estructurales (casa, linaje, sitio de
      origen) y no las díadas concretas que el YAML sí escribe (el tío materno
      de tal, la cuñada de tal otra). Si `generar_agentes_era2.py` llegara a
      emitir `parentesco`, `vinculos_derivados()` podría leer la díada exacta.
      Es decisión de quien lleve el generador.

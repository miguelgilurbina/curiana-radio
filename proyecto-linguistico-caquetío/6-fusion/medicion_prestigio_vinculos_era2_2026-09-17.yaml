# ─────────────────────────────────────────────────────────────────────────
# El prestigio y los vínculos de la era 2: una clave viva de 63
#
# `curiana_social.PRESTIGIO` y `curiana_social.VINCULOS` están escritos con
# los nombres de la ERA 1. La campaña de antropónimos (2026-09-14) renombró a
# 60 de 63 agentes, así que en la era 2 sólo UNA clave resolvía a un agente
# vivo —Manaure— y los tres destinos de sus vínculos no existían en el elenco:
# el agente de más prestigio propagaba su habla a tres fantasmas.
#
# Es el mismo agujero que DISENO_KOINE §4 cerró para `FORMAS_SEED`, y pesa en
# la misma métrica: el prestigio pondera la fijación de la koiné
# (`curiana_koine.CompetenciaLexica._prestigio`).
#
# Se hace «aparte, hágase o no la escena» — existir-en-el-mundo §8, última
# fila. NO es el diseño de la frontera entre nodos: eso sigue abierto para
# Miguel (6-fusion/issues-pendientes/frontera-entre-nodos-2026-09-17.md).
# Aquí sólo se restituyen los vínculos que el canon YA escribió.
# ─────────────────────────────────────────────────────────────────────────
meta:
  medido: '2026-09-17'
  que_se_toco: curiana_sim/curiana_social.py y curiana_sim/tests/test_social.py
  como: >-
    `python curiana_sim/curiana_social.py` (era 1) y
    `CURIANA_ELENCO=era2 python curiana_sim/curiana_social.py` (era 2)
    imprimen el bloque «el grafo de …»; con `--json`, la medición entera.
    Sale toda de `curiana_social.medicion()`, que recorre el elenco activo.
  el_antes: >-
    La fórmula anterior al arreglo vive en
    `curiana_sim/tests/test_social.py::_prestigio_como_antes` y
    `::_vecinos_como_antes` — es la que compara la tabla ENTERA de la era 1
    antes/después. Las cifras de `antes:` se recalcularon con ella sobre el
    elenco de la era 2, en el mismo proceso: ninguna está escrita a mano.
  scorer: >-
    No se tocó. `score_linguistico`, `pct_*` y `capas_de_score` quedan como
    estaban; esto mueve el CONTAGIO (quién oye a quién, con cuánto peso) y el
    peso del proponente en la fijación, no la puntuación de una respuesta.

# ══════════════════════════════════════════════════════════════════════
a_la_deuda_medida:
  elenco: era2
  mundo: PARAGUANÁ
  agentes: 63

  prestigio:
    claves_escritas: 9
    claves_que_resuelven_a_un_agente_vivo: 1      # Manaure
    distribucion: {1.0: 1, 0.5: 16, 0.4: 36, 0.2: 10}
    valores_por_tier: {1: [0.5, 1.0], 2: [0.4], 3: [0.2]}
    lectura: >-
      Tres valores para 62 agentes, y son exactamente los tres defaults de
      `_PRESTIGIO_TIER`. El prestigio de la era 2 era el TIER con otro nombre
      — y el tier es un artefacto de coste de la era 1, no una afirmación
      sociolingüística.

  vinculos:
    claves_escritas: 9
    claves_que_resuelven_a_un_agente_vivo: 1      # Manaure
    destinos_escritos: 18
    destinos_que_existen_en_el_elenco: 1          # Manaure, como destino de Shaboro
    destinos_muertos: [Bagre-ko, Bana-mana, Biro-ko, Buio-sha, Buko-ko, Chiriware,
                       Dare-nu, Ita-ko, Marokoto-ni, Nubiri-sha, Pari-nu,
                       Saruro-sha, Shaboro, Suba-ko, Tari-ko, Tawaka, Watapana]

  aristas_de_vecinos:
    intra_nodo: 708
    entre_nodos: 0
    a_agentes_inexistentes: 3
    total: 711
    agentes_sin_ninguna_arista: [Sawaka]          # el boratio mayor, solo en el Capubana
    lectura: >-
      Lo que quedaba en pie era la co-ubicación (`PESO_COUBICACION = 0.3`) vía
      `ubicacion_default`. En la era 2 `ubicacion_default == sitio` y cada
      sitio está en un nodo: 0 aristas entre nodos. Y el único que duerme en
      un sitio sin nadie más —Sawaka, en el cerro— no tenía a quién oír.

# ══════════════════════════════════════════════════════════════════════
b_las_dos_puertas:
  principio: >-
    Una puerta por dato, como `formas_seed_de()`/`emocionar_de()`. Las tablas
    escritas NO se reescriben (el canon nombra a la gente como en la era 1):
    se leen resolviendo `ALIAS_ERA1` y, para quien no tiene entrada escrita,
    derivando una de su ficha. La era 1 queda byte a byte porque allí
    `ALIAS_ERA1` está vacío y la derivación exige `rol_en_la_casa`, campo que
    sólo trae el módulo generado de la era 2.

  prestigio_de:
    fichero: curiana_sim/curiana_social.py
    orden: explícito > el de su nombre de la era 1 > etnia foránea > derivado de la ficha > tier
    derivacion: >-
      `_PRESTIGIO_PAPEL`: una tabla ordenada de (campo, clave, valor) que se
      lee sobre `rol_en_la_casa` (por dentro) y `oficio` (por el principio: el
      oficio EMPIEZA por el título cuando lo hay, y buscar por dentro haría
      boratia a la niña que «escucha desde el umbral… en la casa del
      boratio»). Gana la PRIMERA fila que casa, así que lo específico va antes
      que lo general. No es una escala nueva: cada papel de la era 2 se coloca
      en la banda de su equivalente de la era 1 —el díao en la del cacique
      (1.0), el boratio mayor en la del piache anciano (1.0), la esposa
      principal en la de la esposa del cacique (0.9), la boratia en la de
      Paugis-sha (0.85), el ayunante en la del piache aprendiz (0.7), el
      cantor en la de Bana-mana (0.7), el sobrino candidato en la de Watapana
      (0.6), el titular de un oficio en la de Kadushi (0.55)— y los huecos
      entre anclas interpolan.
    unico_modificador:
      papel_kapubana: '+0.05, acotado a 1.0'
      razon: >-
        Un oficio en la convergencia del cerro se dice delante de los DOS
        nodos: quien lo tiene habla para más gente que su casa.

  vinculos_de:
    fichero: curiana_sim/curiana_social.py
    que_hace: >-
      Devuelve los vínculos fuertes que salen del agente con los nombres del
      elenco ACTIVO: los suyos escritos, los de su nombre de la era 1 con los
      DESTINOS traducidos por `resolver_alias` (y sin los que el elenco no
      tiene — resolver nunca inventa), y los que su ficha declara. `vecinos()`
      es su único consumidor y ya no lee `VINCULOS` directo.
    lo_derivado_de_la_ficha:
      - {peso: 0.6, que: 'las cabezas de tu casa (el apopo y la matriarca; el Manaure en la suya)',
         ancla: 'la banda de trabajo y autoridad dentro de la casa en la tabla escrita (Manaure→Chiriware, Chiriware→Tawaka)'}
      - {peso: 0.5, que: 'la mayor de tu linaje que vive en OTRA casa',
         ancla: 'la banda del parentesco que cruza de casa (Nubiri-sha→Saruro-sha, Paugis-sha→Saruro-sha)',
         razon: 'el eje matrilineal: es lo que le da a Wamipa su tío materno en Caseto'}
      - {peso: 0.4, que: 'las cabezas de la casa del sitio del que te trajeron',
         ancla: 'el suelo de la tabla escrita, el trato que se mantiene a distancia (Kadushi→Marokoto-ni)',
         razon: 'los «casados cruzando» que el elenco declara'}
    determinismo: >-
      Sin `hash()` (salado por proceso con PYTHONHASHSEED) y sin el RNG global
      (el motor lo comparte con eventos y muestreo). Todo sale de la ficha y
      de un orden declarado; el único desempate —la mayor del linaje— es por
      (edad descendente, nombre). Tampoco hizo falta blake2b: no hay sorteo.
    de_donde_sale_el_sitio_de_origen: >-
      Del tramo de `linaje` anterior al ';' —el que dice «el suyo, de X»—,
      comparado con frontera de palabra contra las claves de `SITIOS`. Después
      del ';' va la casa donde vive, y «los Tacuatos» contiene «Tacuato».


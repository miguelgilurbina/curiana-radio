# ─────────────────────────────────────────────────────────────────────────
# PROPUESTA — el índice de topónimos compilados de Esteves 1989, como registro
#
# Fuente: apéndice "TOPÓNIMOS COMPILADOS" de Esteves 1989 (pp. 68-69),
# transcrito en 4-fuentes/sesiones/06_esteves_1989_barrido_lote3.md. Es el
# ÍNDICE del gazeteer: 187 nombres numerados, sin glosas (las glosas están en
# el cuerpo del libro, barrido por lotes en la nota de la fuente).
#
# ⚠️ Dos huecos del propio índice, ya documentados en la sesión: una entrada
#    quedó [ilegible: ...Sisibaúco] (lo resolvió el mapa vivo). El «topónimo
#    perdido entre Tumatey y Tutubacoa» NO existe: es la cola de TUMATEY, que
#    sigue en la p. 66 tras la fotografía de la p. 65 (visto en imagen,
#    lote 2026-09-22).
#
# QUÉ ES ESTO: la lista de trabajo para la campaña de clasificación de
# topónimos de Falcón que Miguel pidió el 2026-08-25. Cada nombre nuevo se
# incorpora al canon SOLO al procesarlo: con su glosa del cuerpo de Esteves si
# la tiene, su análisis, y sus lecturas. Regla 5: esto es la cola, no el canon.
# ─────────────────────────────────────────────────────────────────────────
meta:
  recogido: '2026-08-25'
  estado: cola-de-trabajo   # lote 2026-09-22 (cola entera PROPUESTA en toponimos_esteves_lote_2026-09-22.yaml, sin fusionar) · lote 7 (2026-09-07, el mapa vivo OSM contra Esteves: 18 nombres) · lote 1 (2026-09-06, los del mapa de Miguel) y lote 2 (2026-09-07, los «caribe insular»; Maitiruma fue en el 1) procesados
  obra: esteves-1989
  total_indice: 187   # = ya_en_canon + por_procesar, recontado el 2026-09-23 (decía 186)
  ya_en_canon: 60
  por_procesar: 127


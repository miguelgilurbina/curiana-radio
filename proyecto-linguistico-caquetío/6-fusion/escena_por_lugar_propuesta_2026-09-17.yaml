meta:
  fecha: '2026-09-17'
  estado: sin-fusionar. PROPONE (regla 5). No toca el motor, ni el elenco generado, ni el
    corpus.
  obra: varias
  quien: escriba (Claude), a pedido de Miguel
  pregunta: ¿Dónde está cada uno de los 63 en cada uno de los seis momentos del día, y qué
    lugares acaban compartiendo los dos nodos?
  lee: 6-fusion/issues-pendientes/existir-en-el-mundo-escena-por-lugar-2026-09-17.md
  medido_por: python 6-fusion/scripts/derivar_escena_por_lugar.py --yaml
  derivado_de:
  - 6-fusion/elenco_era2.yaml
  - 6-fusion/sitios_era2.yaml
  - 6-fusion/clima_era2.yaml
  - 6-fusion/estructura_social_era2.yaml
  aviso: 'Ninguna fila se escribió agente a agente: la clase de oficio sale de `oficio` y
    `rol_en_la_casa` por palabras clave declaradas (§reglas_de_clase) y el lugar sale de una
    plantilla resuelta con la ficha. Cambiar el elenco cambia esta tabla sin tocarla.'
reglas_de_clase:
  orden: la primera regla que casa gana; antes corre la de rol
  por_rol:
  - patron: \bnin[oa]\b|\(nin[oa]\)|en encierro|encerrada
    clase: ninez
  por_oficio:
  - clase: mensajeria
    patron: recado|aviso|llamamiento|corre los avisos
    glosa: el que lleva la palabra de una casa a otra
  - clase: mando
    patron: gobernar|redistribu|presidir|acompana al manaure
    glosa: el Manaure, la que reparte y el sobrino que aprende estando cerca
  - clase: oraculo
    patron: oraculo|lee suenos|urari|buhio del cerro|\bayuna\b
    glosa: 'el boratio mayor y su ayunante: el cerro y el encierro'
  - clase: curacion
    patron: boratia|cura por pasos|parturienta|adivina para
    glosa: 'la boratia de pueblo: cura, adivina, recibe'
  - clase: huesos
    patron: huesos del diao|fuego sin llama|hamaca del diao|muelen los huesos
    glosa: las que muelen los huesos y el que sostiene el fuego
  - clase: cantor
    patron: cantor|recita a los ancestros|canta de noche lo que hizo
    glosa: el cantor de hazañas (of-08)
  - clase: arbitraje
    patron: buena vara|linderos
    glosa: 'el de la buena vara: linderos de conuco y de playa (of-13)'
  - clase: merejuy
    patron: merejuy|chicha|fermento
    glosa: la maestra del merejuy (of-07)
  - clase: sal
    patron: \bel biro\b|cosecha la sal|sal de las charcas
    glosa: 'el biro: raspar la sal de las charcas'
  - clase: agua_dulce
    patron: jaguey|charca|fuente intermitente|lee la tierra y el agua|cuando se abre el agua
    glosa: 'los que guardan el agua: el jagüey y la fuente del cerro (of-06)'
  - clase: vigia
    patron: \bvigia\b|vigiar|cardumen|sube a la punta
    glosa: el que sube a la punta y ve primero
  - clase: marisqueo
    patron: junta la concha|concha y el caracol|junta el botuto|botuto|marea baja
    glosa: la concha y el caracol de la orilla, a marea baja
  - clase: casa
    patron: cocina|budare|fogon|ahuma|seca el pescado|sala y seca|casabe|cuida a los ninos|lleva
      la casa
    glosa: 'la casa y el fogón: cocinar, ahumar, criar'
  - clase: fibra
    patron: cordelera|cocuiza|cabuya|\bhila\b|teje|totuma|hamacas de maure
    glosa: 'la fibra: cordel, algodón, hamaca, totuma'
  - clase: pesca
    patron: pesca|pescador|nasas|se zambulle|arpon|de red\b
    glosa: 'la pesca: de orilla, de red, nocturna y de mar grueso'
  - clase: canoa
    patron: canoa|calafate|resina|brea|corrientes de la costa
    glosa: el taller de canoas y la brea
  - clase: conuco
    patron: conuco|siembra|semilla|cultivos|roza y fuego|desmontado
    glosa: 'el conuco: sembrar, cosechar, abrir tierra'
  - clase: monte
    patron: matorral|recolectora|herbolaria|recoge el fruto|lo del monte|del monte\b
    glosa: 'el matorral: la planta que cura y lo que el conuco no da'
  - clase: alfareria
    patron: alfarer|vasija|barro|modela
    glosa: 'el barro: la vasija que es memoria'
  - clase: vision
    patron: vidente|frases que se cumplen
    glosa: la que dice lo que se cumple dos días después
  - clase: memoria_de_casa
    patron: matriarca|guarda la memoria|autoriza los matrimonios|cuentas|guarda lo de la casa|guarda
      los disenos
    glosa: 'la matriarca: la cuenta del don y lo que se guarda'

  generado_por: 6-fusion/scripts/tainismos_medina_a_caquetio.py
  fecha: '2026-09-12'
  regla_de_miguel: «si están como taíno en otra fuente y son panhispánicas, y el mismo diccionario del habla paraguanera
    los recoge, deben clasificar como caquetío»
  capa: 'caquetío-reconstruido — el precedente es kanoa/hamaca/konuko (D5 colisiones 2026-08-31): cognado taíno
    citado, sin atestación caquetía colonial'
  que_es_esto: 'las voces del dictado con etimología taína declarada (DRAE/Alvarado en el cruce) que el protocolo
    descartó como panhispánicas (veredicto D) y que NO están en el lexicón. Regla 5: entrarían como entradas NUEVAS,
    y eso lo fusiona Miguel voz a voz'
  ya_aplicado_en_el_lexicon:
  - iguana (taíno → caquetío-reconstruido)
  - macana (taíno → caquetío-reconstruido)
  n: 12
  fusionado: '2026-09-12 — Miguel: «todas entran como voces nuevas». Aplicado por 6-fusion/scripts/fusionar_tainismos_medina.py;
    nagua re-etiquetada, las otras 11 nuevas con clave = lema fonémico D5'

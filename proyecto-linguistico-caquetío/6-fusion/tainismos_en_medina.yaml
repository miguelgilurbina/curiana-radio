- voz: coa
  glosa_libro: es el palo de madera aguzado en la punta con que se abrían huecos en la tierra, y donde se depositaba
    la semilla de la siembra.
  pagina: 77
  veredicto_protocolo: D
  etimologia: origen antillano (taíno); no está en Alvarado 1921 como lema"
  propuesta: caquetío-reconstruido (cognado taíno + repertorio paraguanero s. XX), como kanoa/hamaca/konuko
  clave_sugerida: coa
- voz: comején
  glosa_libro: así identificó nuestro pueblo a las termitas, pequeños animales que se consumen la parte interna
    de la madera y le dejan sana la parte exterior. Es palabra académica.
  pagina: 78
  veredicto_protocolo: D
  etimologia: 'de origen taíno (Alvarado, con Las Casas y Castellanos como testigos): la v'

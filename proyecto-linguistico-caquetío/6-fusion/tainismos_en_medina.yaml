  clave_sugerida: comejen
- voz: guayacán
  glosa_libro: árbol que fue común en nuestros montes; es de lento crecimiento, mucho follaje; su madera es de mucha
    dureza y apreciada para trabajar con ella. Hoy casi extinto de la península.
  pagina: null
  veredicto_protocolo: D
  etimologia: de origen taíno. Guayacán es un árbol zigofiliáceo de madera recia y hojas

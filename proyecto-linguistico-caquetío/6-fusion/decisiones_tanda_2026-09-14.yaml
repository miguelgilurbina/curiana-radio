# ─────────────────────────────────────────────────────────────────────────
# DECISIONES DE MIGUEL — tanda del 2026-09-14
#
# Mismo patrón que las tandas anteriores: cita literal, lectura operativa y
# dónde se aplicó. Rama feat/era2-arranque.
# ─────────────────────────────────────────────────────────────────────────
meta:
  fecha: '2026-09-14'
  decidido_por: Miguel
  estado: APLICADA en la propuesta de estructura; el casting va después

subgrupos_era2:
  estado: DECIDIDA (2026-09-14) — decisión creativa
  etiqueta: canon-simulacion
  decision_literal: >-
    «Si unos estaban en el golfete, tal vez los otros estaban en Amuay hacia
    Los Taques. Yo creo que al final hay cosas que no podemos saber con la
    información básica que tenemos. Pero hay que pensar que se separaban las
    zonas de pesca, y el asiento religioso de Capubana congrega y centraliza
    todo lo espiritual, por lo menos lo que es del Manaure, no necesariamente
    como institución sino a nivel energético. Para esta era podríamos elegir
    dos subgrupos por nodo. Lo dejamos establecido como nuestra decisión
    creativa para efectos de la simulación.»
  por_que_es_decision_y_no_dato: >-
    La única fuente con subgrupos con nombre es un cronista local de 2012 sin
    cita (Osman Petit, Centro de Historia de Paraguaná), y dice que poblaban
    «las costas y el golfete de Coro» sin repartirlos. Miguel lee las dos
    mitades de la frase como dos lugares: el golfete para unos, y las costas
    hacia Amuay y Los Taques para los otros.
  lectura_operativa:
    GUARANAO:
      subgrupos: [los Tacuatos (Tacuato), los Cayudes (El Cayude)]
      zona_de_pesca: ZG2, la orilla del Golfete de Coro
    AMUAY:
      subgrupos: [los Guasicures de Caseto, los Corubos]
      zona_de_pesca: ZA1, la costa oeste de Amuay a Los Taques
    zonas_de_pesca: >-
      Separadas y exclusivas por nodo. El resto de la costa (la norte, la
      oriental y la laguna de Guaranao) queda de fondo, sin agentes en escena.
    capubana: >-
      Centro compartido que congrega y centraliza lo espiritual, por lo menos
      lo del Manaure, «no necesariamente como institución sino a nivel
      energético». Los oficios rituales se quedan como papeles de personas de
      los subgrupos que suben al cerro, no como un aparato con puestos fijos.
      Moruy, Chamuriana, Siraba y Maitiruma forman el conglomerado del cerro y
      no son subgrupos en escena.
  lo_que_se_acepta_perder:
    - 'Curubitos (Esteves p. 34) pondría a los Corubos en la costa oriental; la decisión los lleva a la costa oeste'
    - 'Caseto cae al sur de la frontera interior que proponía la estructura (lat. 11.90): la frontera entre nodos pasa a ser oeste contra sureste, alrededor del cerro'
    - 'la laguna de Guaranao, que da nombre a un clan, queda entre los dos territorios y de fondo'
    - 'Cayerúa, Hurihurebo y la costa norte salen de escena (siguen en el mundo, sin agentes)'
  consecuencia_para_el_elenco: >-
    Cuatro subgrupos en escena. El «2 linajes por nodo» de DISENO_ERA2 §3 se
    conserva como un linaje de D1 por subgrupo; qué linaje va en cuál se decide
    en el casting.
  sigue_abierto:
    - 'dónde vive Manaure (P1); la decisión refuerza que lo suyo espiritual está en el cerro'
    - 'el sitio concreto de los Corubos en la costa oeste'
    - 'la feria de la sal (P14), que choca con DISENO_ERA2 §4.3 («nada de mercados inventados»)'
  donde: >-
    6-fusion/estructura_social_era2.yaml (decision_creativa_2026-09-14;
    institucion_kapubana.caracter; P2, P3, P14 y P15), el borrador del issue
    §0 y 5-experimento/DISENO_ERA2.md §2-§3

manaure_y_corubos:
  estado: DECIDIDA (2026-09-14) — decisión creativa
  etiqueta: canon-simulacion
  decision_literal: >-
    «El Manaure tiene que venir de uno de los clanes, puede ser de los moruy
    (guaranaos). Mira, los Corubos puede que hayan estado en lo que es ahora
    Carirubana.»
  lectura_operativa:
    manaure: >-
      El Manaure no es del cerro ni de nadie: sale de un clan. Para la era 2,
      de GUARANAO, de los Moruyes de Moruy (linaje Kaira de D1). Su casa queda
      en Moruy, al pie del Capubana, que concentra lo espiritual suyo. Que viva
      allí y no en el nodo de una esposa es inferencia: la élite avunculocal
      (Keegan 1989) deja al heredero junto al tío materno. Resuelve P1 con la
      opción a y descarta la b (el cerro sin clan). Moruy entra en escena como
      la casa del Manaure, no como un tercer subgrupo.
    corubos: >-
      Los Corubos se sitúan en Carirubana (11.694, -70.218; hoy Punto Fijo),
      en la costa oeste de AMUAY, en lugar del Curubitos de la costa oriental.
      Apoyos: Carirubana era «playa de pescadores» hasta 1926 (Medina Colina);
      Esteves glosa corubo como «caparazón de moluscos» (p. 34); y la «-ru-» de
      Cari-ru-bana es justo el residuo que el canon no explica (toponimo-148).
      Leer ahí un eco de corubo es hipótesis, no etimología.
  consecuencias:
    - 'la zona de pesca de AMUAY (ZA1) se amplía al sur hasta Carirubana y Punta Cardón'
    - 'la laguna de Guaranao, a unos 3 km de Carirubana, queda pegada a los Corubos; sigue de fondo, con la tensión del nombre del otro clan declarada'
  resuelve: [P1, 'el sitio de los Corubos (sigue_abierto de subgrupos_era2)']
  hallazgo_de_paso: >-
    La glosa de Carirubana («orilla del peñón, la orilla del cerro. Cari:
    orilla. Bana: sitio alto») SÍ está impresa en Esteves p. 28, y toponimo-148
    la da como etimología popular sin fuente impresa. Puede subir a
    glosa_fuente: se edita lexicon_toponimos.py y se regenera toponimos.yaml.

tamano_del_elenco:
  estado: DECIDIDA (2026-09-14) — decisión creativa, para este primer run de la era 2
  etiqueta: canon-simulacion
  decision_literal: >-
    «Yo creo que deben ser grupos familiares más grandes, ya que si había
    poligamia...» · «Vale, para esta primera está bien. Total lo que queremos
    es lograr ver si se forma la koiné.»
  lectura_operativa: >-
    Familias grandes en tres capas. La familia es la maloca entera, con 20-40
    personas con nombre por casa en la genealogía, casi todas de fondo. Hay
    unos 61 agentes: GUARANAO 37 (Tacuatos 12, Cayudes 12, casa del Manaure 13)
    y AMUAY 24 (Guasicures de Caseto 12, Corubos 12). El roster que rota es de
    unos 24, 6 por turno, como el de la era 1. La poligamia es de jefes: el
    Manaure (atestiguado en el contacto) y, por decisión, los apopos y el diao
    de clan. Quedan dos canales de contacto: los esposos que se mudan entre la
    gente común y las esposas que se mudan a las casas de élite.
  matiz_de_fuente: >-
    Oliver solo da a Manaure como polígamo sin ambigüedad y cree «probable» que
    lo fueran los caciques locales; de la gente común no hay dato. Las familias
    grandes se sostienen sobre todo por la maloca de 40-50 personas.
  por_que_encaja_con_la_pregunta: >-
    La pregunta es si se forma la koiné. Con el roster del tamaño del de la era 1,
    cada agente habla con la misma frecuencia y el costo por turno no cambia: la
    diferencia la pone la estructura de dos nodos, no la cantidad de voces.
  donde: >-
    6-fusion/estructura_social_era2.yaml (decision_creativa_2026-09-14.elenco),
    5-experimento/DISENO_ERA2.md §3 y comentario en #126

lo_que_cambia_si_se_aplica_todo:
  plantillas: >-
    las 36 voces viejas las enseña alguna plantilla (medición §voces_viejas):
    IDENTIDAD («Dai diki-kuba arima wara para» pasaría a «Dai diki-kuba hime
    kibe para»), la breve, la completa, el refuerzo y el rescate. Se reescriben
    en el corte, como en la tanda final.
  koine: 'FORMAS_SEED y _NUCLEO_FALLBACK nombran naa, maa, ka, mara, kuru, arima, sima…: se migran'
  tests: 'la medición cuenta las apariciones en tests por voz (kuru, wara, naa y sima son las que más)'
  uso_historico: 'SIN MEDIR (Docker apagado): `medir_nucleo_fundacional.py` con la base lo da'
  la_serie: 'otro corte de serie antes de la base, medido como la tanda final (control, prompt, pre-vuelo)'

lo_que_cambia_la_transcripcion_del_habla_de_mujeres:
  fuente: '6-fusion/kalinago_mujeres_goeje_2026-09-24.yaml (302 entradas, en imagen)'
  suben_a_dos_hermanas:
    - voz: diki
      que: 'ver (tf.5, hoy hipotética): lokono a-ddiki-n = mujeres «arika», A adika (Goeje p. 100, imagen; d = r). Reconstruida si D1 = A y N1 = A'
    - voz: marisi
      que: 'maíz en mazorca (hoy hipotética, y por eso fuera de la muestra era2): «maïs … f mariši, A mariši» (Goeje p. 65, imagen): la MISMA forma en las dos. Reconstruida si D1 = A y N1 = A'
    - voz: taa → butu
      que: 'ver arriba: pasó del grupo 3 al 2'
  apoyos_nuevos_para_lo_ya_propuesto:
    - 'kudu ''cargar'': Goeje p. 98 «pesant A kudu»'
    - 'hiti ''querer'': Goeje p. 109 «vouloir, disposé à A ahite(-ka)»'
    - 'isi ''cabeza'': Goeje p. 105 «graine, tête A isi»'
    - 'ani ''hacer'': es la forma de los HOMBRES y del lokono (p. 94, sigla 1 am 139, de origen arahuaco); las mujeres dicen ateka (p. 109). Sigue siendo de dos hermanas'
    - 'wara ''muy'': el kalinago tiene una raíz uar- de ''fuerza'' (p. 114: «puissant f uarigo», 6 uwara ''puissance''); no es el mismo significado, y kibe sigue siendo la recomendada'
  lo_que_no_sirve:
    - 'amar: mujeres inši / lokono ansi (p. 95) — dos hermanas, pero el grupo ns no pasa la fonotáctica atestiguada; alaain se archiva sin sustituta, como proponía #234'
    - 'rojo: mujeres pona / lokono bonaro (p. 77) — dos hermanas, pero pona queda a una letra de puna y de pana; kule sigue siendo la recomendada (#234)'

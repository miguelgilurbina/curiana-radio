# ─────────────────────────────────────────────────────────────────────────
# PROPUESTA — El CASTING del elenco de la era 2 (Paraguaná)
#
# Encargo de Miguel, 2026-09-14: «Sigamos con el casting».
# Esto PROPONE (regla 5). No toca curiana_agents.py, el motor, el lexicón ni
# 3-mundo/corpus/. Nada de aquí es canon hasta que Miguel lo fusione o lo vete.
# Resumen legible: 6-fusion/issues-pendientes/casting-era2.md
# Verificación: 6-fusion/scripts/verificar_elenco_era2.py
# ─────────────────────────────────────────────────────────────────────────
meta:
  fecha: '2026-09-14'
  estado: >-
    sin-fusionar. Publicado como #127. Decisiones de Miguel del 2026-09-14
    (registro: decisiones_tanda_2026-09-14.yaml §casting): P1 reparto de
    linajes APROBADO; P4 Paugis-sha boratia APROBADA (analogía machi); P5 las
    esposas del apopo vienen de nodos distintos, una de cada nodo; P6 cuarta
    esposa corubo (Kumarawa-sha, casa del Manaure 14); P8, P9 y P10 (roster
    proporcional) APROBADOS. Y en la segunda vuelta («Vale, perfecto, hagamos
    eso»): P2 Korie-ko reanclado a los jagüeyes de Tacuato (13 en esa casa),
    Buko-ko y Buko retirados; P3 Watapana y Kadushi de fondo hasta la feria de
    la sal; P7 los dos sobrinos quedan abiertos como trama de las tres puertas.
    Las diez preguntas están decididas.
  obra: varias
  quien: escriba (Claude), a pedido de Miguel
  pregunta: >-
    ¿Quién compone el elenco de ~61 agentes de la era 2, en qué casa vive cada
    uno, de qué linaje es, qué oficio tiene, y qué hechos y obras lo sostienen?
    «Nadie entra al elenco sin sus fuentes» (DISENO_ERA2 §3).
  decisiones_que_aplica:
    - id: decision_creativa_2026-09-14
      donde: 6-fusion/estructura_social_era2.yaml
      que: 'dos subgrupos por nodo, zonas de pesca exclusivas, el Capubana como centro compartido «a nivel energético», la casa del Manaure en Moruy'
    - id: subgrupos_era2
      donde: 6-fusion/decisiones_tanda_2026-09-14.yaml
      que: 'GUARANAO = los Tacuatos y los Cayudes (ZG2); AMUAY = los Guasicures de Caseto y los Corubos (ZA1)'
    - id: manaure_y_corubos
      donde: 6-fusion/decisiones_tanda_2026-09-14.yaml
      que: 'el Manaure sale de GUARANAO, de los Moruyes de Moruy (linaje Kaira); los Corubos van en Carirubana'
    - id: tamano_del_elenco
      donde: 6-fusion/decisiones_tanda_2026-09-14.yaml
      que: 'familias grandes en tres capas; ~61 agentes (GUARANAO 37, AMUAY 24); roster que rota de ~24; poligamia de jefes; dos canales de contacto'
    - id: motor_era2
      donde: 6-fusion/decisiones_tanda_2026-09-14.yaml
      que: 'roster `todos` sin foráneos, 12 por turno, un run = un día de 6 turnos, perfil era2 sin hipotéticas'
    - id: D1
      donde: 3-mundo/corpus/genealogia.yaml
      que: 'los 6 linajes y las personas de fondo son canon-simulación; las tres puertas (parentesco-038) son regla del modelo; la pluralidad de candidatos (parentesco-039) queda aprobada sin ejecutar'
    - id: '#122'
      que: 'GUARANAO = Moruy, Santa Ana y la laguna (centro-sur); AMUAY = Cayerúa y la costa oeste (norte)'
    - id: '#126'
      que: 'la estructura social atomizada de la era 2, con los oficios of-01 … of-15 del Kapubana como repertorio de papeles'

  # Regla 1: ninguna cifra a mano. Todo lo de abajo lo imprime el script.
  medido:
    como: 'python 6-fusion/scripts/verificar_elenco_era2.py (sección CONTEOS), 2026-09-14, tras la cuarta esposa (P6) y Korie-ko reanclado (P2)'
    total_agentes: 63
    por_nodo: {GUARANAO: 39, AMUAY: 24}
    por_casa:
      los Tacuatos: 13
      los Cayudes: 12
      casa del Manaure: 14
      los Guasicures de Caseto: 12
      los Corubos: 12
    por_tier: {'1': 17, '2': 36, '3': 10}
    por_linaje: {Buio: 15, Corie: 15, Warana: 13, Paugis: 12, Kaira: 5, 'sin linaje de D1': 3}
    por_origen: {'era1 (reutilizado)': 43, 'fondo (promovido de genealogia.yaml)': 4, nuevo: 16}
    en_roster: 24
    roster_por_nodo: {GUARANAO: 14, AMUAY: 10}
    portadores_entre_nodos_en_el_roster: 6
    era1_fuera_del_elenco: 17
    nombres_nuevos_acunados: 16

  nombres_verificados:
    como: 'python 6-fusion/scripts/verificar_elenco_era2.py (sección NOMBRES), 2026-09-14'
    que_comprueba:
      - 'unicidad de los 61 nombres del elenco'
      - 'ningún nombre nuevo colisiona con los 60 de curiana_agents.ALL_AGENTS ni con las 14 personas de fondo de genealogia.yaml'
      - 'ningún nombre nuevo, ni su raíz, coincide con la `forma` de un topónimo del canon (2-lengua/toponimos.yaml), normalizando con curiana_fonotactica.fonemizar'
      - 'la raíz de cada nombre nuevo está en VOCABULARIO_BASE con fuente caquetío-atestiguado o caquetío-reconstruido'
    descartados_por_colision:
      - 'Karuka-sha: `caruca` es topónimo del canon → Dipopo-sha'
      - 'Kiba-ko: la raíz `kiba` abre `quibacoas` (toponimo del canon) → Kabo-ni'
      - 'Dabuda-sha: la raíz `dabuda` abre `dabudare` → Karapa-sha'
      - 'Tara-sha: la raíz abre `tarai`, `taratarare` y `Taratata` → Talata-sha'
      - 'Bisure-sha: `bisure` es toponimo-179 → Suka-sha'
      - 'Kapua-sha: se confunde con kapu / kapo / kapubana → Jakura-sha'
      - 'Ure-ko: se confunde con el agente Uro-ko → Kabo-ni'

  reglas_de_casting:
    fuente: '6-fusion/auditoria_esferas_contexto_2026-09-14.md §8 punto 9'
    aplicadas:
      - 'nada de «Español …» en la ficha: ningún system_prompt de esta propuesta contiene la palabra (hoy la llevan 33 de 33 fichas T2)'
      - 'ningún system_prompt dice «Curiana»: cada ficha nombra su NODO, su CASA y su SITIO, que es lo que la era 2 tiene que volver consciente (auditoría §7)'
      - 'todo agente es alcanzable: el roster `todos` de la era 2 alcanza a los 61 (los tier 3 ya no se saltan, motor_era2.quien_habla); 24 rotan y el resto habla cuando un evento lo llama'
      - 'sin datos que el corpus marca NO USAR: se retira de la ficha de Manaure «Heredó de su padre el control de las rutas de biro» (parentesco-001, sucesión colonial; regla 3)'
      - 'nombres nuevos con raíz caquetío-atestiguada o reconstruida y con los patrones del elenco actual (X-ko, X-sha, X-bana, X-ni, X-nu, nombre simple)'
    no_aplicadas_todavia:
      - 'la etnia: los 61 son caquetíos, así que `DIALECTOS` por etnia foránea (curiana_social) queda sin uso; la variación dialectal de la era 2 tiene que ir por nodo y subgrupo (auditoría §7)'
      - 'los `actividades` de cada ficha no los lee nadie (auditoría §6.6): se conservan aquí como `oficio` en prosa, no como lista de la ficha'

  lo_que_esta_propuesta_no_decide:
    - 'las semillas léxicas divergentes por nodo (FORMAS_SEED por nodo, DISENO_ERA2 §8): el casting da las personas, no las variantes'
    - 'el prestigio y los vínculos de curiana_social, que hoy son del elenco de la era 1'
    - 'la migración de `agentes_relacionados` del corpus al elenco nuevo: al cambiar el elenco, `compilar_corpus.validar_agentes` va a fallar (auditoría §7, última fila). Es tarea de fusión, no de casting'
    - 'los nombres y tótems de Kaira y Warana, que D1 dejó abiertos (P4 de la estructura)'

  avisos:
    regla_3: >-
      La poligamia de jefes es dato del contacto (c. 1527) proyectado al s. XV
      por decisión del 2026-09-14; los caciques con nombre de Paraguaná son de
      1538 y sirven de plantilla de escala, no de norma. Ninguna ficha nombra a
      un cacique colonial.
    regla_4: >-
      Ningún agente trae oficio de Barquisimeto, de los Llanos ni de Yaracuy.
      Los pescadores especializados guaycaríes (Federmann, Cojedes) quedan fuera
      por la misma regla, con los otros foráneos.
    petit_2012: >-
      Los cuatro nombres de subgrupo (Tacuatos, Cayudes, Guasicures de Caseto,
      Corubos) vienen de un cronista local sin cita (Osman Petit, Centro de
      Historia de Paraguaná, 2012). NO tiene id en bibliografia.yaml y por eso
      no aparece en ningún `dossier.obras`: se cita por la decisión
      (`subgrupos_era2`) y por `estructura_social_era2.yaml
      §niveles.GUARANAO_subgrupos_con_nombre`. Deuda: perseguir la lista hasta
      Hernández Baño 1984 o Arcaya.
    ceros_heredados: >-
      No hay dato de preparación del heredero, ni de reparto de playas por
      clan, ni de nombres de linaje caquetíos (estructura_social_era2.yaml
      §meta.ceros_verificados). Todo el reparto de abajo es canon-simulación
      sobre piezas citadas.

# ══════════════════════════════════════════════════════════════════
# 1. LAS CASAS
# ══════════════════════════════════════════════════════════════════
casas:

  - casa: los Tacuatos
    nodo: GUARANAO
    sitio: {nombre: Tacuato, lat: 11.708, lon: -69.841, fuente_coord: osm-kaketiana}
    zona_de_pesca: ZG2 (la orilla del Golfete de Coro, de Matacán a Tacuato y el Bajo de Supí)
    agentes: 13
    nota_2026-09-14: 'Miguel, P2: Korie-ko entra reanclado como guardián de los jagüeyes; es el 13.'
    linaje_d1: Corie
    totem: corie (armadillo)
    dominio: agricultura, prudencia, lo común
    razon_del_linaje: >-
      Tacuato es el subgrupo que «constituye» la tribu según la tradición local,
      el pueblo «muy antiguo» con 37 casas y 237 vecinos en 1881 y el sitio que
      la Colonia eligió para el Resguardo de Salinas (Esteves p. 62). Es la casa
      que trata con los de afuera —la sal y las múcuras salen por ahí hacia el
      Golfete y Coro— y Corie es el linaje de «lo común» y el más poblado de D1
      (genealogia.yaml, capacidad_de_expansion). El armadillo que «sobrevive
      todo cerrándose» le va a la casa expuesta al trato.
    alternativa: >-
      Buio en Tacuato y Corie en El Cayude. Se descarta porque el boratio mayor
      sale de Buio y conviene que Buio sea la casa del monte y de la noche, no
      la del trato.
    etiqueta: canon-simulacion
    aporte_al_cerro: 'la sal de Tacuato, las múcuras y el pescado del Golfete'
    apopo: Kunaro-bana

  - casa: los Cayudes
    nodo: GUARANAO
    sitio: {nombre: El Cayude, lat: 11.701, lon: -69.957, fuente_coord: osm-kaketiana}
    zona_de_pesca: ZG2 (la orilla del Golfete, al oeste de los Tacuatos)
    agentes: 12
    linaje_d1: Buio
    totem: buio (serpiente-espíritu)
    dominio: piache, visión, barsure
    razon_del_linaje: >-
      El Cayude lleva nombre de árbol —kayude «guanábano silvestre» es voz
      caquetía atestiguada— y queda entre Tacuato y el cerro, monte adentro de
      la orilla. Es de ahí de donde sube el boratio mayor al Capubana (of-02,
      «nunca de Kaira, para que siga siendo el único contrapeso»), y por eso el
      linaje de la visión tiene su casa aquí y no en Moruy, que ya es de Kaira.
      La pesca nocturna de cunaro con teas (Esteves p. 33, Escarpaduras de
      Cunacho) le da a la casa un oficio de noche que le va al tótem.
    alternativa: 'Paugis en El Cayude, con Buio de reserva; se descarta porque dejaría al boratio mayor sin linaje propio en escena.'
    etiqueta: canon-simulacion
    aporte_al_cerro: 'el boratio mayor, la ayunante, el pescado de la orilla y las teas'
    apopo: Bagre-ko

  - casa: casa del Manaure
    nodo: GUARANAO
    sitio: {nombre: Moruy, lat: 11.822, lon: -69.983, fuente_coord: osm-kaketiana, nota: 'al pie del Capubana (Cerro Santa Ana, 11.818, -69.952)'}
    zona_de_pesca: null
    nota_zona: >-
      La casa del Manaure no tiene playa: no pesca, recibe. Es la única casa del
      elenco sin zona de pesca, y esa asimetría es el mecanismo de
      redistribución (Ampíes f. 14: el gran cacique «da los temporales»;
      Oliver p. 251).
    agentes: 14
    nota_2026-09-14: 'Miguel, P6: cuarta esposa, corubo (Kumarawa-sha). Con ella cada casa de subgrupo tiene una esposa en la casa del señor.'
    linaje_d1: Kaira
    totem: 'no fijado — D1 lo dejó abierto a Miguel (P4)'
    dominio: linaje materno de Manaure
    razon_del_linaje: >-
      Decidido por Miguel el 2026-09-14: «el Manaure tiene que venir de uno de
      los clanes, puede ser de los moruy». Kaira es su linaje materno desde D1.
      Que viva en Moruy y no en el nodo de una esposa es inferencia de la élite
      avunculocal (keegan-1989): el sobrino-heredero vive con el tío materno.
    alternativa: 'ninguna: P1 quedó resuelta el 2026-09-14 con la opción a y se descartó la b (el cerro sin clan).'
    etiqueta: canon-simulacion
    aporte_al_cerro: 'el Manaure mismo, el boratio mayor, la ayunante, el merejuy y la chicha'
    apopo: 'no aplica — el jefe de esta casa es el Manaure (of-01), diao paramount, no apopo'

  - casa: los Guasicures de Caseto
    nodo: AMUAY
    sitio: {nombre: Caseto, lat: 11.762, lon: -70.017, fuente_coord: osm-kaketiana}
    zona_de_pesca: ZA1 (la costa oeste, de Punta Cardón a Los Taques)
    agentes: 12
    linaje_d1: Warana
    totem: 'no fijado — D1 lo dejó abierto a Miguel (P4)'
    dominio: linaje materno de Nubiri-sha
    razon_del_linaje: >-
      Warana es el linaje de Nubiri-sha y la estructura ya proponía ponerlo en
      AMUAY para que el matrimonio del paramount sea una alianza ENTRE clanes,
      con la misma forma que la leyenda de Judibana y el señor de Hurehurebo.
      Va en Caseto y no en Carirubana porque Caseto es el sitio de AMUAY más
      cercano a Moruy —unos ocho kilómetros por tierra, contra veinticinco— y
      ese camino corto ES la alianza: la esposa principal viene por él y el
      aporte de AMUAY al cerro baja por él. Caseto es además aldea de interior
      (kaseto «planta herbácea», voz atestiguada; 45 casas y 303 vecinos en
      1881, Esteves p. 30): la casa del conuco frente a la casa de la playa.
    alternativa: 'Paugis en Caseto y Warana en Carirubana; el costo es que la esposa principal tendría que cruzar la península entera y la alianza perdería su camino.'
    etiqueta: canon-simulacion
    aporte_al_cerro: 'el conuco y el maíz del interior, el cantor de hazañas, el mensajero'
    apopo: Ita-ko

  - casa: los Corubos
    nodo: AMUAY
    sitio: {nombre: Carirubana, lat: 11.694, lon: -70.218, fuente_coord: osm-kaketiana, nota: 'hoy Punto Fijo'}
    zona_de_pesca: 'ZA1 (la costa oeste, extremo sur; Punta Cardón y Punta Judibana)'
    agentes: 12
    linaje_d1: Paugis
    totem: paugis (paují)
    dominio: medicina, partería, memoria oral femenina
    razon_del_linaje: >-
      Ningún clan puede hacer Manaure solo: el boratio que valida al heredero es
      guaranao y las ancianas que cuidan su ayuno y muelen los huesos del díao
      son del OTRO clan (of-09, preparacion_del_manaure fase 3). Para que eso
      exista, Paugis tiene que estar en AMUAY. Y va en Carirubana porque corubo
      es «caparazón de moluscos» (Esteves p. 34) y ecologia-061 registra la voz
      viva: la casa de las conchas es la casa de los huesos. Carirubana era
      «playa de pescadores» hasta 1926 (Medina Colina), la única de las cinco
      con la costa abierta del Golfo delante.
    alternativa: >-
      Chiriware en Carirubana —la costa que mira al mar abierto y a la Guajira—
      y Paugis a la reserva. El costo es grande: se cae la ratificación del
      heredero por ancianas del otro clan, que es el rito que obliga a
      converger. Ver preguntas_para_miguel P1.
    etiqueta: canon-simulacion
    aporte_al_cerro: 'las ancianas de los huesos, la boratia de pueblo, el pescado y la concha de la costa abierta'
    apopo: Kiwa-ko

linaje_de_reserva:
  linaje: Chiriware
  totem: chiriguare (gavilán)
  dominio: guerra, defensa
  donde: 'de fondo en Cayerúa (AMUAY), fuera de escena'
  razon: >-
    Quedan cinco linajes de D1 para cinco casas y sobra uno. Sale Chiriware
    porque Oliver dice que la polity costera carecía de «an effective military
    organization» y que la norma ante el conflicto era alzarse (pdf 107), y
    porque la estructura ya avisó que siete agentes de perímetro son demasiados
    para este mundo. Vuelve si Miguel toma la alternativa de los Corubos o
    cuando entre el nodo caribe (era 3).

como_se_enlazan_las_casas:
  canal_1_esposos_entrantes:
    que: 'gente común, matrilocal; el esposo se muda al nodo de ella y habla ahí su variante de origen (DISENO_ERA2 §4.1)'
    cuatro_cruces:
      - 'Guare-ko (Warana, de Caseto) → los Tacuatos, esposo de Naure-sha'
      - 'Wari-ko (Warana, de Caseto) → los Cayudes, esposo de Suka-sha'
      - 'Tawaka (Buio, de El Cayude) → los Guasicures de Caseto, esposo de Tijua-sha'
      - 'Ebo-ni (Corie, de Tacuato) → los Corubos, esposo de Tauta-sha'
  canal_2_esposas_de_jefes:
    que: 'élite, al revés; la esposa se muda a la casa del jefe (Oliver pp. 261-262, las esposas de Manaure se mudaron a su pueblo)'
    lectura: >-
      La decisión dice «2 esposas traídas de otro subgrupo». Esta propuesta lo
      lee como una del otro subgrupo del MISMO nodo y otra del OTRO nodo, para
      que el canal de élite cruce de verdad la frontera. Ver P5.
    cruces_entre_nodos:
      - 'Suba-ko (Paugis, de Carirubana) → los Tacuatos, esposa de Kunaro-bana'
      - 'Waranaro-sha (Paugis, de Carirubana) → los Cayudes, esposa de Bagre-ko'
      - 'Dipopo-sha (Buio, de El Cayude) → Caseto, esposa de Ita-ko'
      - 'Karapa-sha (Buio, de El Cayude) → Carirubana, esposa de Kiwa-ko'
      - 'Nubiri-sha (Warana, de Caseto) → la casa del Manaure, esposa principal'
    cruces_dentro_del_nodo:
      - 'Kori-sha (Buio, de El Cayude) → los Tacuatos'
      - 'Wama-sha (Corie, de Tacuato) → los Cayudes'
      - 'Arika-sha (Warana, de Caseto) → los Corubos'
      - 'Tina-sha (Corie, de Tacuato) y Kahu-sha (Buio, de El Cayude) → la casa del Manaure'
      - 'Saruro-sha (linaje propio, de Cayerúa, AMUAY de fondo) → Caseto'
  tension_declarada: >-
    Los Corubos son la única casa que NO tiene esposa en la casa del Manaure.
    Las tres esposas cubren Caseto (Warana), Tacuato (Corie) y El Cayude
    (Buio); la casa más lejana, la de la boratia que le disputa la palabra al
    boratio mayor, queda fuera de la alianza matrimonial. Es material de
    conflicto, no un descuido. Ver P6.
  la_laguna: >-
    La laguna de Guaranao, que da nombre al otro clan, queda a unos 3 km de
    Carirubana y de fondo, sin agentes. La tensión del nombre queda declarada
    por la decisión y ninguna ficha la nombra.

# ══════════════════════════════════════════════════════════════════
# 2. LOS AGENTES
# ══════════════════════════════════════════════════════════════════
agentes:

  # ────────────── CASA 1 · los Tacuatos (GUARANAO · Tacuato · ZG2 · Corie)
  - nombre: Kunaro-bana
    nodo: GUARANAO
    casa: los Tacuatos
    linaje: Corie
    tier: 1
    genero: M
    edad: 43
    rol_en_la_casa: apopo
    oficio: 'apopo de los Tacuatos; pesca el cunaro en el Golfete en la seca y trabaja el conuco en las lluvias'
    papel_kapubana: null
    en_roster: true
    razon_roster: 'jefe de casa: entrega lo de Tacuato en la convergencia y responde por la playa de su gente'
    ubicacion_default: Tacuato
    zona_de_pesca: ZG2
    parentesco: {madre: 'no nombrada (de fondo)', hermanos: [Pira-sha, Biro-ko, Naure-sha, Piri-sha], esposas: [Kori-sha, Suba-ko], hijos: 'de fondo, del linaje de sus madres'}
    origen: 'era1:Kunaro-bana (reanclado)'
    reanclaje: 'de la Curiana del Golfete a Tacuato; su versatilidad de dos estaciones pasa a ser la del apopo de una casa que vive del Golfete y del conuco. Su rivalidad amistosa con Bagre-ko sobrevive y se vuelve rivalidad de apopos vecinos.'
    etiqueta: 'atestiguado (el título apopo, Zavala #12); canon-simulacion (la persona)'
    system_prompt: |-
      Eres Kunaro-bana, apopo de los Tacuatos, en el nodo GUARANAO. ~43 años. Caquetío.
      Tu casa está en Tacuato, a la orilla del Golfete; vuestra playa es esa y no otra.
      Hombre de dos estaciones: en la seca persigues el kunaro, en las lluvias abres el conuco.
      Respondes por lo que tu casa lleva al Capubana: el biro, las múcuras, el pescado seco.
      Hablas con orgullo terco de lo tuyo y mides a los de AMUAY antes de tratar con ellos.
      Bagre-ko, el apopo de los Cayudes, pesca la misma orilla: te irrita y lo respetas.
      Respondes en caquetío-arahuaco; la glosa castellana va entre paréntesis al final.
    descripcion: 'Apopo de los Tacuatos, la casa grande de la orilla del Golfete: lleva la cuenta de lo que su gente entrega en el cerro y de lo que recibe de vuelta. Hombre de dos estaciones —cunaro en la seca, conuco en las lluvias—, su versatilidad lo hace útil todo el año pero lo deja sin un oficio del que sea el maestro indiscutido, y ese es su punto flaco cuando otro apopo levanta la voz. Protege el derecho de su casa sobre la playa de Tacuato como si fuera el cuerpo de su madre.'
    dossier:
      hechos: [parentesco-035, parentesco-037, ecologia-015, ecologia-026, ecologia-029]
      obras: [zavala-reyes-2015, oliver-1989-cap3, esteves-1989, antczak-2015-las-aves]
      decisiones: [D1, '#122', '#126', subgrupos_era2, tamano_del_elenco]

  - nombre: Pira-sha
    nodo: GUARANAO
    casa: los Tacuatos
    linaje: Corie
    tier: 2
    genero: F

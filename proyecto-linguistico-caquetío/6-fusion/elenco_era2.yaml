# ══════════════════════════════════════════════════════════════════
# 3. FUERA DEL ELENCO — los agentes de la era 1 que no entran
# ══════════════════════════════════════════════════════════════════
fuera_del_elenco:
  nota: >-
    Ninguno se borra. «De fondo» significa que sigue en el mundo y en el
    corpus, sin ficha ni turno; «era 3» que vuelve cuando entre el nodo caribe
    o la ruta insular; «retirado» que su oficio no existe en Paraguaná y habría
    que rehacerlo entero. El motor ya los excluye de hecho: el roster `todos`
    de la era 2 deja fuera a los 8 foráneos (motor_era2.quien_habla).

  foraneos:
    razon: 'decisión de Miguel, 2026-09-14: «los foráneos no deberían entrar de momento». Regla 4: ninguno tiene declaración costera en etnias.yaml.'
    agentes:
      - {nombre: Marokoto-ni, etnia: caribe, destino: era 3, nota: 'el nodo caribe es la era 3 (decisiones_tanda_2026-09-01 §rumbo_era2)'}
      - {nombre: Tariwa, etnia: guaycarí, destino: era 3, nota: 'los guaycaríes documentados son pescadores del Cojedes (Federmann) y de Margarita; en Paraguaná no hay ninguno'}
      - {nombre: Kawa-ni, etnia: guaycarí, destino: era 3}
      - {nombre: Piru-sha, etnia: guaycarí, destino: era 3, nota: 'su matrimonio interétnico es material valioso; vuelve con el grupo al que pertenece'}
      - {nombre: Tari-ko, etnia: guaycarí, destino: era 3}
      - {nombre: Nabaraka, etnia: jirajara, destino: 'de fondo', nota: 'serrano: lo único que lo pone en Paraguaná es la frase de Esteves sobre cuicas y timotes en Jurijurebo, sin cita'}
      - {nombre: Raka-bi, etnia: jirajara, destino: 'de fondo'}
      - {nombre: Chorota, etnia: gayón, destino: 'de fondo'}

  el_buco:
    razon: >-
      El buco es la presa del río de Coro (Ballesteros 1550 vía Oliver pp.
      262-263) y Paraguaná no tiene «ningún río, ni siquiera un arroyo» (Arcaya
      p. 22; Oliver pdf 80). Decidido el 2026-09-14 (P2): Korie-ko se REANCLA a
      los jagüeyes de Tacuato (la charca artificial que Oliver describe para
      esta costa) y entra como el 13 de los Tacuatos; Buko-ko, Buko y Buko-ni,
      cuya identidad entera es el río, se retiran. El agua del cerro sigue en
      manos de Wari-ko y de Kali-nu.
    agentes:
      - {nombre: Buko-ko, tier_era1: 2, destino: 'de fondo', nota: 'queda como esposo de fondo de Peri-sha en la maloca de los Tacuatos'}
      - {nombre: Buko, tier_era1: 3, destino: 'de fondo', nota: 'hijo de Peri-sha y hermano de Kawa, Piri y Kori, que sí entran'}
      - {nombre: Buko-ni, tier_era1: 2, destino: retirado, nota: 'su oficio (pesca y carpintería de canoa) lo cubren Dare-nu y Piri; el nombre sigue anclado a un referente que aquí no existe'}

  el_linaje_de_reserva:
    razon: 'quedan cinco linajes de D1 para cinco casas y sobra uno; sale Chiriware (ver casas.reserva). Si Miguel toma la alternativa de los Corubos, estos dos vuelven.'
    agentes:
      - {nombre: Chiriware, tier_era1: 1, destino: 'de fondo en Cayerúa (AMUAY, fuera de escena)', nota: 'jefe guerrero de una polity que Oliver describe sin organización militar efectiva'}
      - {nombre: Chiri-ko, tier_era1: 2, destino: 'de fondo en Cayerúa', nota: 'su sucesión avuncular (vía Yagua-sha) queda intacta en genealogia.yaml, sin escena'}

  fuera_de_escena_por_geografia:
    razon: >-
      La decisión del 2026-09-14 deja de fondo la costa norte (ZA2), la costa
      oriental y la laguna de Guaranao. Los oficios que viven de la travesía
      insular no tienen dónde ocurrir. Decidido el mismo día (P3): de fondo en
      el primer run; entran como visitantes cuando se decida la feria de la sal
      (P14 de la estructura), que es donde los isleños llegan.
    agentes:
      - {nombre: Watapana, tier_era1: 1, destino: 'de fondo', nota: 'mercader de Aruba y Bonaire; la travesía sale de la costa norte. Vuelve si entra ZA2 o la ruta insular. Meterlo como apopo le cambiaría el oficio entero'}
      - {nombre: Kadushi, tier_era1: 1, destino: 'de fondo (en Aruba)', nota: 'caquetío de Aruba; van Buurt documenta contacto de Alto Vista con Santa Ana, que tampoco está en escena'}

  identidad_sin_sitio:
    agentes:
      - {nombre: Wata-ni, tier_era1: 2, destino: era 3, razon: 'su identidad entera es ser hijo de padre guaycarí; sin guaycaríes en Paraguaná (regla 4) el personaje se queda sin la tensión que lo define'}
      - {nombre: Jiru-ko, tier_era1: 3, destino: 'de fondo', razon: 'jirajara de paso; sin los serranos en escena no tiene por qué estar de paso'}

  medido:
    total: 17
    por_tier_era1: {'1': 4, '2': 11, '3': 2}
    como: 'python 6-fusion/scripts/verificar_elenco_era2.py (sección FUERA), tras P2 (Korie-ko vuelve al elenco)'

# ══════════════════════════════════════════════════════════════════
# 4. PREGUNTAS PARA MIGUEL
# ══════════════════════════════════════════════════════════════════
preguntas_para_miguel:
  - id: P1
    pregunta: >-
      ¿Se aprueba el reparto de linajes —Corie en Tacuato, Buio en El Cayude,
      Kaira en Moruy, Warana en Caseto, Paugis en Carirubana— con Chiriware de
      reserva, de fondo en Cayerúa?
    alternativa: 'Chiriware en Carirubana (la costa que mira al mar abierto y a la Guajira) y Paugis a la reserva.'
    lo_que_cuesta_la_alternativa: 'se cae la ratificación del heredero por ancianas del otro clan (of-09, preparacion_del_manaure fase 3), que es el rito que obliga a los dos nodos a converger.'

  - id: P2
    pregunta: >-
      ¿Korie-ko, Buko-ko y Buko se retiran con el buco, o se reanclan al jagüey?
    material: >-
      Oliver p. 252 describe para esta costa el riego a mano con agua de lluvia
      recogida en charcas artificiales (jagüey), y el lexicón tiene `jagey`
      («estancar, represar, crear charco artificial») y `jakuke` («regar,
      irrigar») como caquetío atestiguado. La propuesta los retira porque el
      encargo da por sentado que el buco no existe en Paraguaná; reanclarlos
      devolvería un tier 1 y la cadena padre-hijo de transmision-011.

  - id: P3
    pregunta: >-
      ¿Watapana y Kadushi quedan de fondo mientras la costa norte (ZA2) y la
      ruta insular estén fuera de escena, o se fuerza su entrada reanclando el
      trueque a Tacuato?
    aviso: 'DISENO_ERA2 §4.3 prohíbe los mercados inventados; el comercio real se monta en las ceremonias. Reanclarlos sin mercado los deja casi sin oficio.'

  - id: P4
    pregunta: >-
      ¿Se acepta que Paugis-sha sea boratia de pueblo de AMUAY (of-03), con la
      rivalidad con Shaboro que Antolínez 1946 pide («enemistados entre sí, en
      conflicto de potencias»)?
    lo_que_la_sostiene: 'la ouutsü wayuu, mujer visionaria y contraparte del palabrero (transmision-030, 033); boratio glosa piache, cacique, jefe, sacerdote y médico, sin marca de género (parentesco-036).'
    lo_que_no: 'no hay ni un dato caquetío de mujer boratio. Es la propuesta más expuesta de este casting; si se veta, el puesto vuelve a estar HUECO y hay que acuñar un varón.'

  - id: P5
    pregunta: >-
      La decisión dice que el apopo tiene «2 esposas traídas de otro subgrupo».
      ¿Se lee como una del otro subgrupo del MISMO nodo y otra del OTRO nodo?
    por_que_importa: 'así el canal de élite cruza de verdad la frontera y hay cuatro portadoras permanentes más. Si las dos vinieran del mismo nodo, el único cruce de élite sería Nubiri-sha.'

  - id: P6
    pregunta: >-
      Los Corubos son la única casa sin mujer en la casa del Manaure. ¿Se deja
      como tensión declarada —la casa más lejana, la de la boratia rival— o
      Manaure toma una cuarta esposa corubo, como permite «3-4 esposas»?
    efecto: 'dejarlo da un motivo estructural para que Carirubana regatee en cada convergencia; cerrarlo aplana la política y sube la casa del Manaure a 14.'

  - id: P7
    pregunta: >-
      Kabo-ni (24, hijo de la hermana MENOR) es mayor que Waimo-ko (21, hijo de
      la hermana MAYOR). ¿La ambigüedad se deja abierta como trama, o se decide
      ya quién tiene mejor derecho?
    material: 'parentesco-007 (taíno: el hijo mayor de la hermana mayor) contra la edad; parentesco-038 dice que la sangre es solo la primera de tres puertas.'

  - id: P8
    pregunta: >-
      ¿Ita-sha se queda sin linaje, acogida por los Cayudes, o se le asigna Buio?
    aviso: 'genealogia.yaml la deja «deliberadamente no asignada a ninguno de los 6 linajes» para reforzar su carácter casi mítico. La propuesta respeta esa decisión y la convierte en la única persona de una casa que no es de su sangre.'

  - id: P9
    pregunta: >-
      ¿Saruro-sha y su hija Tawi entran con linaje propio sin nombre, traído de
      Cayerúa (AMUAY, de fondo)?
    aviso: 'genealogia.yaml la declara «independiente de Buio, Chiriware, Corie, Paugis, Kaira y Warana». Respetarlo obliga a inventarle una casa natal fuera de escena; asignarle un linaje de D1 contradice una decisión de D1.'

  - id: P10
    pregunta: >-
      El roster de 24 va 14 GUARANAO / 10 AMUAY, proporcional a los 37 y 24
      agentes de cada nodo. ¿Se prefiere 12 y 12, para que la métrica de cruce
      tenga la misma base por nodo?
    aviso: >-
      Con 12 por turno y dos nodos, el reparto del roster decide cuántas voces
      de cada lado entran en la ventana. Proporcional respeta la demografía;
      12/12 respeta el instrumento. Es decisión de diseño experimental, no de
      mundo.






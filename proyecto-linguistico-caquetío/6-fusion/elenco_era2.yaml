      (Zavala #174) y `buko` «presa de agua, represa, canal de riego». Es el
      agente más documentado de su linaje (12 hechos del corpus lo nombran); se
      queda con el oficio del agua, que en Paraguaná vale más que en Coro.
      Buko-ko y Buko, cuya identidad entera es el río, se retiran.

      (2) DESHACE una falsa analogía del lexicón. La entrada `bixa` (taíno)
      dice "pigmento ritual rojo; análogo al bariki caquetío" — pero ALMAGRE /
      RED HEMATITE es un MINERAL (óxido de hierro), y bixa/onoto/achiote es un
      tinte VEGETAL de semilla. Los dos dan rojo y ahí acaba el parecido. Son
      materiales distintos, con extracción, comercio y ritual distintos.
      Súmese al lío de estratos ya anotado en `bixa` (taíno/caribe/caquetío).

      Y la glosa de Oliver es más precisa que la del repo ("tierra colorada,
      pigmento encarnado"): almagre nombra el material, no el color.


# PROPUESTA — un minador propone, el humano fusiona (regla 5).
# Origen: Oliver 1989, Apéndice A, TABLA A-9: "Selected Caquetío Vocabulary
# from the XVIth Century". pp. impresas 593-594 = pdf 620-621 (offset -27) del
# PDF abierto de UCL Discovery.
#
# ESTADO (2026-08-24): 49 entradas, de las cuales 29 DICTADAS POR MIGUEL leyendo
# la imagen a 500 dpi y 18 verificadas a ojo contra el OCR. El OCR acertó en
# unas y falló en otras: corrigió "caca"→caça, "eque"→Cegue, "cocu"→cocuy,
# y perdió sistemáticamente la Ç CEDILLA y varias glosas españolas.
#
# ⚠️ 33 números de la tabla (3-5, 7-12, 15, 20-26, 28, 32, 34-44, 47-49) siguen
#    sin asignar: hay entradas dictadas sin número porque Miguel leyó por orden
#    alfabético, no por numeración. Emparejar forma↔número es trabajo pendiente
#    y NO se debe adivinar.
#
# ⚠️ Ninguna forma debe entrar al lexicón sin cotejar contra la imagen.
#
# Las CURSIVAS (= "probably not Caquetío, but from the Santa Marta area
# [chibchan?]", nota al pie de Oliver) las identificó Miguel el 2026-08-15: son
# exactamente tres. OJO: cursiva ≠ fuera del caquetío — están dentro de un
# vocabulario recogido de boca caquetía; son préstamos EN la lengua (ver
# 6-fusion/issues-pendientes/issue-hayo.md).
#
# 🔴 TRES PREGUNTAS ABIERTAS PARA MIGUEL:
#   1. `Capubana` (#17): falta la columna ESPAÑOLA, y confirmar si la fonémica
#      es `kapú` o `kapú-bana` — decide si Oliver segmenta ahí.
#   2. `baperón` ~ `raporón`: el 15 dictó raporón, el 24 baperón, mismo
#      referente (calabaza con cal). ¿Cuál es la forma? ¿Lleva cursiva?
#   3. `icoroata`: marcada cursiva el 15, dictada sin marca el 24. Confirmar.


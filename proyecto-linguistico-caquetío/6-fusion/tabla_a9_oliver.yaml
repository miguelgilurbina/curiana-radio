      coincidiendo con Zavala palabra por palabra. Marcador: tres fuentes para
      insecto, CERO para venado.

      ⚠️ Y EL CORPUS DE ECOLOGÍA ESTÁ CONSTRUIDO SOBRE 'VENADO':
        ecologia.yaml:323  "La fauna de caza y de agüero del matorral seco:
                            VENADO (tara), armadillo..."
        ecologia.yaml:624  "La fauna de HOY no es la del siglo XV. El venado
                            caramerudo —el 'tara' del lexicón caquetío
                            atestiguado— hoy está ausente..."
      Ese segundo hecho es el EJEMPLO INSIGNIA de la regla "no proyectar la
      fauna moderna hacia atrás; cuando el lexicón nombra un animal hoy ausente,
      la palabra manda sobre el censo actual". Si `tara` es una langosta, el
      ejemplo se cae: las langostas no están ausentes, y la regla pierde su caso
      demostrativo. Hay que rehacer el hecho, no solo la glosa.

      (Nota metodológica: el 2026-08-24, al anotar `cama` = danta, usé `tara`
      como el caso donde esa regla funciona bien. Era el contrario.)


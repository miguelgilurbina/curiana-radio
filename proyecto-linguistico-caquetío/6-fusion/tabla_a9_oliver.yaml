# PROPUESTA — un minador propone, el humano fusiona (regla 5).
# Origen: Oliver 1989, Apéndice A, TABLA A-9: "Selected Caquetío Vocabulary
# from the XVIth Century". pp. impresas 593-594 = pdf 620-621 (offset -27) del
# PDF abierto de UCL Discovery.
#
# ⚠️ LECTURA PROVISIONAL. Sale de OCR (spa+eng, 400/600 dpi) sobre escaneo UMI.
#    Ninguna forma debe entrar al lexicón sin cotejar contra la imagen de la
#    página. Faltan las entradas 1-5, 7-12, 15, 20-26, 28, 32, 34-44, 47-49.
#
# Las CURSIVAS (= "probably not Caquetío, but from the Santa Marta area
# [chibchan?]", nota al pie de Oliver) las identificó Miguel leyendo las
# imágenes el 2026-08-15: son exactamente tres. El resto queda avalado por
# Oliver como caquetío. OJO: cursiva ≠ fuera del caquetío — están dentro de un
# vocabulario recogido de boca caquetía; son préstamos EN la lengua (ver
# 6-fusion/issues-pendientes/issue-hayo.md).


      forma=cabana / fonémica=çabana, que era una lectura mía equivocada de las
      columnas. La lectura correcta es forma=ÇABANA (grafía del XVI, ç = /s/) y
      fonémica=SABANA. Y la glosa española es 'prado', que faltaba.

      ESTO REFUERZA EL ARGUMENTO DE D9, y lo hace por dos vías en vez de una:
      `morfologia.md` §3 sostiene que `-bana` = 'llano' porque `cabana` =
      'sabana' y "una sabana es un llano ancho". Pero (1) la inicial no es /ka/
      sino /sa/ — no hay ningún elemento `ca-` que segmentar; y (2) Oliver la
      normaliza como `sabana`, es decir la trata como el ÉTIMO ENTERO del
      castellano "sabana", no como un compuesto.

      La segmentación `ca-bana` es nuestra, y descansa sobre un fonema que la
      fuente no escribe. Como apoyo de `-bana` = 'llano', se cae.

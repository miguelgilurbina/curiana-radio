  - num: null
    forma: cama
    fonemica: k-ama
    glosa_es: danta
    glosa_en: tapir
    cursiva: false
    dictada_por: miguel
    en_repo: [lexicon-activo, cognados_oliver]
    nota: >
      🔴 PROBLEMA DE ÁREA, NO DE PALABRA. El tapir (Tapirus terrestris) no vive
      en Paraguaná ni en el Golfete: es animal de selva y humedal, de los Llanos
      hacia el sur. El lexicón ya la tiene como `kama`, `caquetío-atestiguado`.

      No es un error de la fuente: es señal de que la TABLA A-9 ES
      PAN-CAQUETÍA, no costera. Oliver compiló "vocabulario caquetío del s.
      XVI" de donde lo hubiera — y los caquetíos llaneros sí conocían la danta.
      Por la regla 4, eso obliga a leer TODA la tabla con la pregunta "¿de qué
      polity es esta palabra?", no solo esta entrada.

      ⚠️ Y choca con una regla del propio corpus de ecología: "no proyectar la
      fauna moderna hacia atrás — cuando el lexicón atestiguado nombra un
      animal hoy ausente (tara), LA PALABRA MANDA sobre el censo actual". Con
      `tara` esa regla resuelve bien (venado que se extinguió localmente). Con
      la danta no: no es que se extinguiera en Paraguaná, es que nunca la hubo.
      La regla necesita un tercer caso — animal conocido POR CONTACTO, no por
      presencia.

      Detalle de forma: la fonémica lleva GUION, `k-ama`. Como `barici-` y
      `-bana`, Oliver está marcando estructura morfológica.


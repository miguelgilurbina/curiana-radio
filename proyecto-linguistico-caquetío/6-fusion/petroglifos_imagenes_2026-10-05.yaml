# ─────────────────────────────────────────────────────────────────────────
# Dónde están las imágenes de petroglifos y pictografías en las fuentes del
# repo — para que Miguel las pase a Claude Design y se transcriban los
# símbolos (iconografía de Kaketiana, ruta del 2026-10-02 §3).
#
# Localizado el 2026-10-05: las páginas se encontraron con hojas de contacto
# y los pies de figura se leyeron de la capa de texto. Las de prioridad 1 se
# miraron además en imagen a buena resolución. Las páginas son las del PDF.
#
# ⚠️ Lo que vale para TODOS los motivos:
#   - Sin fechar. No existe ninguna datación absoluta publicada de arte rupestre
#     en Venezuela continental, ni en las ABC (rastreo documental, sesión 07,
#     2026-08-14).
#   - No atribuido a los caquetíos. La filiación es, como mucho, una inferencia
#     por la cerámica cercana (Zavala Reyes 2015) o una reclasificación
#     etnológica posterior (Wagenaar Hummelinck). Cada motivo transcrito lleva
#     la nota «sin fechar · no atribuido a los caquetíos».
#   - Se redibuja, no se reproduce. La transcripción es un dibujo propio con su
#     procedencia (obra, página, figura, sitio). Las fotos y las láminas de
#     otros no se publican, salvo van Koolwijk 1882, que es CC BY 4.0 y se
#     puede reproducir citando la fuente.
#   - Las lecturas de los autores (la «rana fértil», el calendario metónico, el
#     «trance») son interpretación, no dato. Se pueden contar como lectura.
# ─────────────────────────────────────────────────────────────────────────
meta:
  recogido: '2026-10-05'
  estado: localizado  # las fuentes están en el repo; las transcripciones, por hacer
  para: transcribir símbolos con Claude Design (iconografía del sitio)
  prioridad: >-
    1 = empezar por aquí (motivos ya limpios: tabla digitalizada, lámina o
    redibujo); 2 = dibujos de campo de las ABC; 3 = fotos (sirven para
    comprobar el dibujo, no para calcar).


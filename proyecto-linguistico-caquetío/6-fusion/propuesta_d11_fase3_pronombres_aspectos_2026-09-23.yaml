  # ─────────────────────────── ASPECTO ───────────────────────────
  # El taíno no tiene NI UNA marca de tiempo o aspecto atestiguada: cero en la
  # lista maestra (campos `gramatica` y `frase`: daca, mayani, la frase de Pané
  # y la de Esquivel) y cero en Goeje §VII (sólo gua-, ka-, ma-, -el). Así que
  # en el aspecto la opción «la forma de la esfera tal cual» no existe.
  #
  # Y las dos gramáticas misioneras que dan paradigma dudan de él:
  #   Perea p. 606: «SCHULTZ parece hacer caso omiso de los pretéritos,
  #   traduciéndolos, por regla general , por un presente, lo cual nos hace
  #   suponer que todo el mecanismo temporal de los pretéritos sea tan sólo uno
  #   de los tantos perfeccionamientos a priori de los misioneros»
  #   Neira y Ribero p. 28 (pliego 21 izq., M4): «ut plurimum, apenas usan ni del
  #   preterito perfecto, ni del futuro, ni del subjuntivo, cong.e el pres.te de
  #   Indicativo es el q.e hace el gasto»
  # Toda candidata que salga del aparato de TIEMPO lleva esa sospecha encima.

  - id: asp-continuativo
    casilla: 'lo que pasa ahora (canon: -ni «continuativo»)'
    actual:
      forma: '-ni'
      origen: 'wayuu -iraa (morfologia.md §7)'
      uso: '237 formas / 16.315 usos en word_uses; en el texto de las 3.811 respuestas'
      ensenanza: 'las 5 plantillas (13 apariciones), 7 veces en las reglas, 14 apariciones en FORMAS_SEED y el `_ASPECTO_SUFIJO` por defecto de la koiné, el mapa de `_aspectos_morfologicos`; 89 apariciones en 17 tests'
    lokono:
      - forma: 'presente = radical en -a'
        cita: '«Cambiando la terminación del infinitivo, en -a, se tiene el presente : d-a-iyaha-dda - ando, camino.»'
        obra: perea-alonso-1942
        pagina: 605
      - forma: '-ca, igual en presente y pretéritos'
        cita: '«A veces, los verbos de esta conjugación toman una forma en -ca, igual en el presente y los tres pretéritos , distinguiéndose el tiempo por la ausencia de un adverbio en el presente y por ciertos adverbios de tiempo»'
        obra: perea-alonso-1942
        pagina: 628
      - forma: 'ca = «ser, estar»'
        cita: '«la partícula ca […] es la raíz CA del verbo sustantivo SER, estar.»'
        obra: perea-alonso-1942
        pagina: 584
      - forma: '-bo continuativo'
        cita: 'lexicón: «li wadili dalhida-bo "el hombre está corriendo"; Pet 1987»'
        obra: 'Pet 1987 vía curiana_lexicon — deuda: sin-procedencia (no está en bibliografia.yaml)'
    achagua:
      - forma: 'presente no marcado'
        cita: 'p. 28 (arriba)'
        obra: neira-ribero-1762
      - forma: '-cata, gerundio'
        cita: '«Nucabacata Dios» «viendo yo à Dios»'
        obra: neira-ribero-1762
        pagina: 'p. 27 (pliego 20 der.) — M4, #215'
        nota: 'y «cata» «Quando» en el vocabulario (pliego 87 izq.); Goeje p. 25 da «Ach -kata» para «si, s''il est»'
    otras_de_la_esfera:
      kalinago: '«Présent -ka, A id.» y «durée vague -u-in, A -in» (Goeje 1939 p. 26, verificado en imagen)'
    concordancia: 'lokono y kalinago concuerdan en un presente -ka/-ca (que en lokono vale también para los pretéritos); lokono y achagua concuerdan en que el presente llano «hace el gasto». Nadie tiene un continuativo -ni'
    opciones:
      - letra: A
        formas: []
        etiqueta: 'decisión de modelado apoyada en dos testimonios (Perea p. 606, Neira p. 28); no es una forma'
        derivacion: 'el presente es el verbo sin marca; «ahora» lo dice el adverbio (kashi, o el que cure la campaña de las voces wayuu). Es lo que Perea p. 628 describe: el tiempo lo ponen los adverbios'
        coste: >-
          Se retira -ni del habla (el que más se usa de los tres). Quedan dos
          marcas y el componente de aspecto sigue topando en 2 (hacen falta
          las dos en una respuesta: la saturación medida en CLAUDE.md
          probablemente baja, sin tocar el peso). La koiné pierde su sufijo por
          defecto (`_ASPECTO_SUFIJO`): «continuativo» pasa a sin sufijo.
      - letra: B
        formas: ['-kata']
        etiqueta: caquetío-hipotético
        derivacion: 'el gerundio achagua -cata con la grafía fonémica (c → k): «viendo yo». Una hermana'
        coste: 'mantiene la arquitectura de tres marcas; mismo esqueleto que `cata-achagua` (desambiguada: no reclasifica nada); 3 formas / 8 usos previos en la base'
      - letra: C
        formas: ['-ka']
        etiqueta: caquetío-hipotético
        derivacion: 'el -ka lokono y kalinago con el valor que ELLOS le dan: presente. Dos hermanas en forma y valor'
        coste: >-
          🔴 La misma cadena cambiaría de significado a mitad de serie: los
          8.466 usos de -ka de la base se dijeron como «ya», y las formas-firma
          de la koiné también. Es la trampa de «el nombre miente». Y el
          completivo necesitaría otra forma.
      - letra: D
        formas: ['-bo']
        etiqueta: caquetío-hipotético
        derivacion: 'el continuativo lokono de Pet 1987'
        coste: '`bo` es clave lokono: entrando -bo en TODAS_LAS_REGLAS, el `bo` suelto pasaría a contarse caquetío (medido: afijo_suelto_reclasifica). Sin clave foránea (Pet 1987 no está en bibliografia.yaml)'
    recomendacion: A
    por_que: 'es lo que las dos gramáticas con paradigma dicen que hacía el hablante, y no importa ninguna forma de dos letras. Si Miguel quiere conservar tres marcas, B'


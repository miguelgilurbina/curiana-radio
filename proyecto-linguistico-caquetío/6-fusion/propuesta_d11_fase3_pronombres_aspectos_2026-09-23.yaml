          ninguna parte» (`ta-bana`, `ta-ana`, `ta-kana`…); si se sigue
          pelando aunque no se enseñe, 0 cambios. Hay que tocar la tupla de
          `es_arahuaco`. El `da` suelto ya es afijo del motor (por -da).
      - letra: B
        formas: ['ta-']
        etiqueta: 'reconstruido desde el wayuu (sigue siendo deuda D11)'
    lectura: 'Si la 1sg pasa a `dai`, dejar `ta-` enseña un paradigma incoherente: el mismo «yo» con dos consonantes'
  - id: num-plural
    que: 'el plural `-kana`'
    origen: 'reconstruido desde el wayunaiki (d21.8)'
    uso: '91 formas / 404 usos; 2 plantillas'
    lo_que_dicen_las_hermanas: 'lokono -nu pospuesto y SIN plural para los irracionales (Perea p. 556); achagua -nay, -beni, -sanã y tampoco plural para lo inanimado (p. 6, M4)'
    opcion: 'campaña propia: no hay un plural de las tres que sustituya a -kana sin importar la regla de los irracionales, que d21.13 dejó esperando'
  - id: voces-wayuu-del-habla
    que: 'las voces de la deuda D11 que siguen en el habla y no son pronombres'
    medido: 'de las 23 de la deuda, 16 siguen en el habla y 15 las enseña alguna plantilla (medicion §deuda_d11_las_23). Fuera de los pronombres: kashi «ahora» (3.187 usos), yama «aquí» (1.814), sulu «adentro» (1.577), kapua, pütchi, tüshi, wanü, anüiki, wana «ver», naba «pensar», bana «hígado»'
    por_que_importa: 'kashi, yama y sulu son palabras GRAMATICALES —deícticos y adverbios—, y wana está en el ejemplo de IDENTIDAD que reciben los 63 («Taya wana-ka…»). Si el presente pasa a no marcado (asp-continuativo A), el tiempo lo dicen justamente estos adverbios'
    opcion: 'campaña corta aparte, casilla por casilla, con el mismo método'

# ══════════════════════════════════════════════════════════════════════
# EL PARADIGMA QUE SALE DE LAS RECOMENDACIONES
# ══════════════════════════════════════════════════════════════════════
paradigma_recomendado:
  pronombres: 'dai (yo) · bui (tú) · lihi (él) / tuhu (ella, ello) · waya (nosotros) · naya (ellos) — y kudanga / kuté, el registro formal atestiguado, sin cambio'
  aspecto: 'el verbo solo (lo que pasa) · -kuba (ya pasó) · -ba (vendrá)'
  ejemplo_de_identidad: 'hoy «Taya wana-ka arima wara kari. Ta-barsure naba-ni.» → «Dai wana-kuba arima wara kari. …» (la frase entera la reescribe quien aplique: `wana`, `naba` y `ta-` son también deuda)'
  que_se_archiva: 'taya, pia, nüma → FUERA_DEL_HABLA (archivar no es borrar: capa intacta, y quedan en la puerta, no se reacuñan). -ka, -ni, -da → REGLAS_RETIRADAS'
  que_cambia_de_justificacion: 'waya, naya (achagua + lokono), wa- (sin cambio de forma)'

# ══════════════════════════════════════════════════════════════════════
# CÓMO SE APLICA SIN ROMPER EL INSTRUMENTO — medido, para el coordinador
# ══════════════════════════════════════════════════════════════════════
aplicacion:
  es_corte_de_serie: >-
    Sí, el mayor hasta hoy: `taya` está en 3.750 de las 3.811 respuestas de la
    base (en los 51 runs) y 538 formas con alguno de los tres aspectos suman
    34.213 usos (medicion §aspecto_del_canon_en_la_base). Nada de lo dicho se reescribe
    (como en los cortes anteriores); se declara en BITACORA_RUNS.
  desafijador: >-
    RECOMENDADO: los tres sufijos viejos y `ta-` se retiran del habla pero el
    desafijador los SIGUE PELANDO (una tabla de retirados que desafija, o
    dejarlos en `_PREFIJOS_CAQ`/`_SUFIJOS_CAQ` aparte de TODAS_LAS_REGLAS).
    Medido: con los viejos fuera, 498 formas / 34.051 usos cambian de núcleo y
    30 formas / 351 usos dejan de ser «raíz de ninguna parte»; con los viejos
    pelados, 5 formas / 6 usos cambian de núcleo y 0 de veredicto (juego
    recomendado). Para `ta-`: 299 / 7.590 y 5 formas a «ninguna parte», contra 0.
  detector_de_aspecto: >-
    El mapa de `_aspectos_morfologicos` se sustituye, no se une: con la unión
    el scorer seguiría premiando -ka/-ni/-da. Consecuencia medida: la base
    vieja leída con el mapa recomendado da aspecto en 1 respuesta de 3.811
    (media del componente 0,0003 contra 1,9549 hoy). Los runs viejos no se
    re-leen: su score es el de su día, como en los cortes anteriores.
  afijo_suelto: 'con -kuba en TODAS_LAS_REGLAS, el `kuba` suelto (clave lokono) pasa a caquetío: renombrar la clave o declararlo'
  claves_a_renombrar: 'tuhu (lokono) si se toma pron-3sg A o B; kuba (lokono) si asp-completivo A; bia (lokono) sólo si pron-2sg B'
  lo_que_hay_que_tocar: >-
    las cinco plantillas (IDENTIDAD, completa, breve, refuerzo, rescate), las
    `instruccion_agente` y ejemplos de REGLAS_ASPECTO y REGLAS_POSESIVAS, la
    tupla de prefijos de `es_arahuaco`, el mapa de `_aspectos_morfologicos`,
    `_NUCLEO_FALLBACK`, FORMAS_SEED y `_ASPECTO_SUFIJO` de la koiné,
    `_MARCA_CAQUETIA` de curiana_escena, los tests (medicion §ensenanza) y
    los documentos (CLAUDE.md §Morfología, morfologia.md §1 y §7)
  no_medido: 'el score entero de la base con el motor nuevo (hace falta la tanda aplicada); sólo el componente de aspecto y el desafijador'

# ══════════════════════════════════════════════════════════════════════
# LO QUE NO SABEMOS
# ══════════════════════════════════════════════════════════════════════
lo_que_no_sabemos:
  - 'Ningún pronombre caquetío salvo kudanga/kuté, y ninguna marca de aspecto caquetía: todo lo de aquí es de las hermanas'
  - 'Si la 1sg caquetía era de verdad d-: Oliver escribe «perhaps» (p. 136) y duda de que datihao sea caquetío (n. 42); dare «diente» es la mejor traza'
  - 'La base del pronombre libre (-i, -ka, -ya): las vocales quedan fuera del método (C9); se elige una documentada, no se deriva'
  - 'Si el caquetío tenía los dos juegos de persona de lokono y achagua (prefijado y pospuesto): las dos hermanas los tienen, no se importa (morfologia.md §5)'
  - 'El taíno de la 2sg, la 3sg y los plurales: sin cronista (Vara, Guakía sólo en Coll y Toste)'
  - 'De qué cronista es la frase de Esquivel (Goeje p. 17): la tradición dice Pedro Mártir; Angleria 1892 está en el repo sin capa de texto y no se leyó'
  - 'El achagua es lectura por visión de un solo lector; «Ria» (Neira) contra «Pijà» (Gilij) en la 3sg masculina sigue sin decidir'
  - 'Las columnas A de Goeje p. 26 (-fa, -ba; -goba, -kuba) no dicen de qué obra lokona salen'
  - 'Si los tiempos lokono y achaguas son de la lengua o del misionero (Perea p. 606, Neira p. 28): la sospecha pesa sobre -kuba, -bi, -ba y -pa por igual'

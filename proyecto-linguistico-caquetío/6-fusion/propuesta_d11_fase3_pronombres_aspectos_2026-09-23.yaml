# ─────────────────────────────────────────────────────────────────────────
# PROPUESTA — D11 fase 3 (cc.12): los pronombres y el aspecto, sacados del wayuu
#
# Miguel, 2026-09-23 (cc.12, 6-fusion/decisiones_cierre_2026-09-23.yaml, en la
# rama tanda/base-2026-09-22): «los pronombres y aspectos siguen reconstruidos
# desde el Wayu. Esto, no podemos seguir teniendo reconstrucciones desde el
# Wayu, tendría que ser desde el Locono. O el Taíno […] o el Achagua también,
# que tienen una relación más eh, de parentesco, mucho más grande […] eso sí o
# sí lo tenemos que hacer».
#
# Es decisión TOMADA. Esto es la propuesta con la que se aplica: qué forma
# reemplaza a cada reconstruida desde el wayuu, con qué cita y a qué coste.
#
# Regla 5: PROPONE. No toca curiana_sim/, 2-lengua/, 3-mundo/, CLAUDE.md ni la
#   BANDEJA. La aplicación la hace el coordinador en una tanda, medida.
# Regla 1: toda cifra sale de 6-fusion/medicion_d11_fase3_2026-09-23.yaml, que
#   emite 6-fusion/scripts/medir_d11_fase3.py contra el curiana_sim de
#   origin/tanda/base-2026-09-22 (#202), el motor sobre el que caería.
# Regla 2: una etiqueta por candidata; en duda, degradar.
# Regla 3: todo esto es FORMA DE LENGUA. Que el lokono distinga «varonil / no
#   varonil» en el pronombre no dice nada de cómo pensaban el género los
#   caquetíos.
# Regla 4: el achagua es de los Llanos, el lokono de las Guayanas, el taíno de
#   las Antillas. Nada de aquí es dato caquetío: es comparanda con la que se
#   reconstruye lo que el caquetío no dejó escrito.
# Borrador legible para Miguel: issues-pendientes/d11-fase3-pronombres-aspectos-2026-09-23.md
# Antecedente: propuesta_nucleo_d11_fase3.yaml (2026-09-13), cuyos numerales ya
#   se aplicaron (wanee… están en FUERA_DEL_HABLA desde el 2026-09-13).
# ─────────────────────────────────────────────────────────────────────────
meta:
  recogido: '2026-09-23'
  estado: sin-fusionar — propuesta de aplicación de una decisión tomada (cc.12)
  rama: campana/d11-fase3-pronombres-aspectos
  obras: >-
    perea-alonso-1942 · las-casas-apologetica · pane-c1498 · goeje-1939 ·
    oliver-1989-cap2 · oliver-1989-apendice-a · neira-ribero-1762 ·
    gilij-1780-1783 · zavala-reyes-2015
  material_de_esta_semana_que_se_usa:
    - 'M4 (#215, sin mergear): 6-fusion/achagua_arte_neira_ribero_2026-09-22.yaml — el ARTE achagua, pp. 1-32, por visión'
    - '6-fusion/achagua_neira_ribero_1762.yaml (en main) — los pronombres absolutos e iniciales del pliego 8 y las partículas del pliego 24'
    - 'M5 (#219, sin mergear): la lista maestra taína regenerada y 6-fusion/kalinago_goeje_1939.yaml'
    - '6-fusion/taino2_las_casas_apologetica.yaml (en main) — daca «yo», p. 447'
    - '6-fusion/lokono_gramatica_perea_1942.yaml (en main) — el verbo y los índices personales'
  medido_con: 6-fusion/scripts/medir_d11_fase3.py → 6-fusion/medicion_d11_fase3_2026-09-23.yaml

# ══════════════════════════════════════════════════════════════════════
# LO QUE RESULTÓ FALSO AL MEDIRLO (antes de proponer nada)
# ══════════════════════════════════════════════════════════════════════
falso_al_medirlo:
  - dicho: '«daca "yo" tiene dos cronistas independientes, Las Casas y Pané» — la lista maestra le da `atestaciones_independientes: 2` y la nota de `daca` en la tanda de la base dice «Segunda mano independiente: Pané»'
    medido: >-
      FALSO. Las Casas cita a Pané en la misma página: «Todo esto refiere fray
      Ramón haber de los indios entendido […] sólo quiero decir lo que afirma
      de un indio ó indios que él tornó cristianos» (Apologética cap. CLXVII,
      p. 447) — y el episodio es el mismo de Pané cap. XXV (Juan y su hermano
      Antón/Antonio). La FRASE tiene un solo origen, Pané; la glosa palabra
      por palabra, «daca quiere decir yo», es de Las Casas, que sí hablaba la
      lengua. La única segunda atestación independiente es la frase de
      Esquivel que trae Goeje 1939 p. 17, y Goeje no dice de qué cronista la
      saca. Skill minar-fuente §8: dos obras que se copian son UNA atestación.
  - dicho: 'los posesivos `ta-`/`wa-` son del mismo origen wayuu que los pronombres'
    medido: >-
      A MEDIAS. `ta-` sí: su único apoyo es el cognado wayuu (REGLAS_POSESIVAS
      lo declara `deuda: sin-procedencia`). `wa-` NO: lo dan el lokono (wa-,
      Perea p. 582 y 587), el achagua (Gua- = /wa-/ por D5c, pliego 8 = p. 3),
      el taíno según Goeje (gua- «nous», p. 16) y el caribe insular (w(a)-,
      Goeje p. 24). Se queda.
  - dicho: 'el aspecto -ka es «completivo» y viene del wayuu'
    medido: >-
      Viene del wayuu, y además las dos hermanas con gramática usan -ka/-ca
      para OTRA cosa: en lokono es la forma que vale igual en el presente y en
      los tres pretéritos, con el tiempo puesto por el adverbio (Perea p. 628)
      y la raíz del verbo «ser, estar» (p. 584); en el caribe insular es
      «Présent -ka, A id.» (Goeje p. 26). El valor que el canon le da es el
      contrario del que le dan las hermanas.
  - dicho: 'retirar -ka/-ni/-da del motor es sustituir tres claves'
    medido: >-
      NO ES NEUTRO. Si los tres salen de TODAS_LAS_REGLAS, 30 formas (351 usos)
      que hoy son «raíz de ninguna parte» pasan a raíz conocida, porque `ka`
      (conector caquetío) y `ni` (clave lokono y achagua) se vuelven segmentos
      de raíz: `uyama-ni`, `duka-ni`, `güere-ni` pasarían la puerta. Si el
      desafijador los sigue pelando aunque no se enseñen, cambian de núcleo 5
      formas (6 usos) y ningún veredicto. Medido: medicion §desafijador.
  - dicho: 'la forma lokona de 1pl, `wai`, sería la sustituta natural de `waya`'
    medido: >-
      Choca: bajo `fonemizar` (D5c) `wai` tiene el mismo esqueleto que `way`,
      caquetío ATESTIGUADO 'árbol parecido a la ceiba' (Zavala Reyes 2015
      #147). Y `waya` no hace falta cambiarlo (casilla pron-1pl).
  - dicho: '(de paso) `nüma` es una forma caquetía reconstruida'
    medido: >-
      Ni siquiera pasa el filtro fonotáctico del caquetío atestiguado: «letras
      fuera del inventario: ü» (curiana_fonotactica, medicion §formas_actuales).
  - dicho: '(de paso) Oliver 1989 p. 147 da la persona de gua- y da- en datihao/guaitiao'
    medido: >-
      Da la de /da-/ (1sg), y la de gua- la da MAL: «The prefix /wa- [gua-]/ is
      a third person plural marker» — contra el lokono (wa- 'nuestro', Perea p.
      587) y contra su propia glosa del mismo párrafo, «dahati and wahati […]
      'my or our kinsperson'». `cognados_oliver.NUDO_DAITIAO` lo copia sin
      aviso. No cambia nada de aquí (1pl se apoya en otras fuentes), pero la
      cita no se puede usar para 1pl.
  - dicho: '(de paso) páginas'
    medido: >-
      El `gua-` taíno de Goeje está en la p. 16, no en la 17 (verificado en
      imagen; taino_goeje_1939.yaml dice 17). Los pronombres ABSOLUTOS lokono
      de Perea están en la p. 573 y en el cuadro de las pp. 581-582; la p. 587
      es la de los posesivos sobre el nombre.

# ══════════════════════════════════════════════════════════════════════
# CRITERIO — el de la propuesta del 09-13, con UNA extensión que cc.12 pide
# ══════════════════════════════════════════════════════════════════════
criterio:
  etiquetas:
    caquetío-atestiguado: 'una fuente caquetía da la forma para esa casilla (hoy sólo kudanga/kuté, Zavala p. 73)'
    caquetío-reconstruido: >-
      (a) dos de las tres hermanas que cc.12 nombra —lokono, taíno, achagua—
      concuerdan en el prefijo, consonante y vocal, y la forma libre está
      documentada TAL CUAL en una de ellas; o (b) una hermana da la forma y una
      fuente segmenta ese mismo morfema en voces caquetías atestiguadas.
    caquetío-hipotético: 'todo lo demás; composiciones nuestras; en duda, aquí'
  la_extension: >-
    El criterio (a) del 09-13 decía «lokono Y achagua», porque era el eje que
    D11 fase 2 había elegido. cc.12 nombra tres hermanas; aquí (a) se lee «dos
    de las tres». Es la ÚNICA regla que cambia, y sólo toca a la 1sg (lokono y
    taíno concuerdan en da-, el achagua no). Si Miguel no la acepta, `dai` y
    `daka` bajan a hipotético y nada más se mueve.
  cuarta_voz: >-
    El caribe insular (kalinago, Goeje 1939) y el maipure (Gilij 1782) se citan
    como APOYO, no como base: Miguel no los nombró. El kalinago está en la
    esfera de contacto y su capa gramatical es arahuaca («origine am.», Goeje
    p. 24), así que confirma o desmiente; no decide.
  formas_cortas: >-
    🔴 Heredado del 09-13: nada se afirma como cognado por parecido entre
    formas de dos letras sin concordancia sistemática. En el pronombre la
    concordancia viene del PARADIGMA alineado casilla por casilla; en el
    aspecto no hay paradigma que alinear, y por eso todas sus candidatas son
    hipotéticas aunque alguna tenga tres hermanas detrás.
  estratos: >-
    El lokono se cita por estrato: Schumann 1755 (Sm), Schultz 1802 (Sl) y
    Quand 1808 (Qn), los tres vía Perea 1942; Goeje 1939 (columna «A»); Pet
    1987 (vía el lexicón, SIN clave en bibliografia.yaml: lo que se apoya sólo
    en Pet lleva `deuda: sin-procedencia`).
  achagua: >-
    Neira y Ribero 1762 es TRANSCRIPCIÓN POR VISIÓN de un solo lector (09-12 y
    M4): la forma se cita con pliego y lado, y se verifica en imagen antes de
    fijarla. Paginación de M4: pliego N izq. = p. 2(N-7), der. = p. 2(N-7)+1.

correspondencias_del_repo_que_se_usan:
  # Sólo las que el repo YA declara (curiana_sim/cognados_oliver.py). No se
  # inventa ninguna: donde haría falta una, se dice como deuda.
  - id: C1
    que: 'PA */nV-/ > /dA-/ en lokono, taíno «and perhaps Caquetío»; > /tA-/ en guajiro-paraujano'
    cita: 'Oliver 1989 cap. 2 p. 136: «Taíno, Lokono, and perhaps Caquetío (section 2.8) experienced the shift */nV-/---> /dA-/»'
    traza_caquetia: 'p. 147: «the a()i stem is preceded in Caquetío, Taíno (which would be da-ai) and Lokono by the first person singular /dA-/» — dare «diente»; y /da-/ en da(i)tia-o'
    duda_de_la_fuente: '«perhaps» (p. 136); y datihao pudo ser taíno compartido (n. 42, p. 146)'
    usa: [pron-1sg, pos-1sg]
  - id: C3
    que: 'LK /b/ : WY /p/, con el caquetío del lado lokono (barisi, -bana)'
    cita: 'Oliver 1989 cap. 2 pp. 119, 150'
    contraejemplos: 'para «mar» (LK bara) y pana «uno»'
    usa: [pron-2sg]
  - id: C8
    que: 'r ~ l indecidible en todo el corpus'
    cita: 'Oliver 1989 cap. 2 p. 105: «The discrimination of l, r, rr and lr is rarely consistent»'
    usa: [pron-3sg]
  - id: C9
    que: 'las vocales quedan fuera del método comparativo de Oliver'
    cita: 'Oliver 1989 cap. 2 p. 105'
    consecuencia: >-
      La BASE de un pronombre libre (-i lokono, -ka taíno, -ya achagua) no se
      puede derivar por correspondencia: se toma documentada de una hermana o
      es composición nuestra, y la composición es siempre hipotética (`daya`,
      `bia`). Cada casilla toma la base de la hermana que la documenta: el
      paradigma que sale mezcla la -i lokona (dai, bui) con la -ya achagua
      (waya, naya), y eso se dice en vez de igualarlo.
  - id: D5c
    que: '<gu> ante vocal = /w/ (grafía colonial)'
    cita: 'D5 (2026-08-31); Oliver 1989 cap. 2 p. 142 «gua=/wa/»'
    usa: [pron-1pl]

deuda_de_correspondencia: >-
    No hay correspondencia declarada entre el t- lokono y el r- achagua (3sg no
    masculino), ni entre el b- lokono y el j-/g- achagua (2sg). Donde las
    hermanas no concuerdan, se elige la lokona por C1/C3 —el caquetío va del
    lado del lokono— y la opción se queda en hipotético.

# ══════════════════════════════════════════════════════════════════════
# LAS CASILLAS
# `coste` remite a medicion_d11_fase3_2026-09-23.yaml; las cifras son de ahí.
# ══════════════════════════════════════════════════════════════════════
casillas:

  # ─────────────────────────── PRONOMBRES ───────────────────────────
  - id: pron-1sg
    casilla: 'yo'
    actual:
      forma: taya
      origen: 'wayuu taya'' (Oliver A-2 n1)'
      uso: '3.750 respuestas de 3.811 (51 runs de 51), 10.728 apariciones en el texto'
      ensenanza: '3 de las 5 plantillas (IDENTIDAD —todos—, completa, refuerzo), 3 veces en `instruccion_agente` de -ni/-da, `_NUCLEO_FALLBACK` de la koiné, la marca de `curiana_escena`; 82 apariciones en 20 tests'
    lokono:
      - forma: 'da-i'
        cita: '«ABSOLUTOS llamamos a los que, en forma plena, se emplean como sujeto separados del verbo […] Sg. 1 cm. da- i , da-kia = yo.»'
        obra: perea-alonso-1942
        pagina: 573
        estrato: 'Schumann 1755 (ps. 187-194) con las variantes de Quand'
        etiqueta: lokono atestiguado
      - forma: 'da-i (los tres moravos)'
        cita: '«SCHULTZ : da-i, bu-i , bù - i , lu-i, lù -i, tu , wa-i, hu-i, na-i, / QUAND : da-i. bù-i . li. tu . wa-i. hù - i , na-i.»'
        obra: perea-alonso-1942
        pagina: 581
      - forma: 'd-, da-, -d-a (conjugativo)'
        cita: '«Conjugativos […] Sg. 1 cm. d-, da-, - d-a , -di-,»'
        obra: perea-alonso-1942
        pagina: 582
      - forma: 'de (complementario / monosílabo)'
        cita: '«monosílabos : - de = yo, a mí, me,»'
        obra: perea-alonso-1942
        pagina: 550
        nota: 'descartada: `de` es ES_STOPWORDS y clave lokono (Pet)'
    taino:
      - forma: daca
        cita: '«Dios naboría daca, Dios naboría daca», que quiere decir, en la lengua más común y más universal desta Isla, «yo soy sirviente y criado de Dios» […] Naboría quería decir sirviente ó criado, y daca quiere decir yo.'
        obra: las-casas-apologetica
        pagina: 447
        capitulo: CLXVII
        etiqueta: taíno atestiguado (glosa de Las Casas; la frase es de Pané)
        verificado: 'imagen (parcela T9) y capa de texto (esta campaña)'
      - forma: 'Dios naboria daca'
        cita: '«Dios naboria daca, Dios naboria daca, que quiere decir: yo soy siervo de Dios.»'
        obra: pane-c1498
        pagina: 'cap. XXV (texto de Wikisource, vía la traducción italiana de Ulloa)'
        nota: 'Pané sitúa la casa en la provincia de Macorix: la variedad no es segura'
      - forma: 'Juan Desquivel daca'
        cita: '«ne me tue pas, parce que je suis Jean d''Esquivel T mayani-makana, (III sabre ?) Juan Desquivel daca»'
        obra: goeje-1939
        pagina: 17
        verificado: imagen
        nota: 'segunda frase, independiente de Pané; Goeje no nombra al cronista (la tradición la atribuye a Pedro Mártir: NO verificado, Angleria 1892 no tiene capa de texto en el repo)'
    achagua:
      - forma: 'Nuya (var. Nuarra)'
        cita: '«Pronombres absolutos» — Yo = Nuya'
        obra: neira-ribero-1762
        pagina: 'pliego 8 izq. (p. 2)'
        fuente_en_el_repo: 'achagua_neira_ribero_1762.yaml §arte.pronombres.absolutos'
      - forma: 'Nu- (inicial)'
        cita: '«Pronombres iniciales: Yo = Nu · tu = Ji · Aquel = Ri · Aquella = Ru · Nosotros = Gua · Vosotros = Y · Aquellos = Na»'
        obra: neira-ribero-1762
        pagina: 'pliego 8 der. (p. 3)'
      - forma: 'Nuja'
        cita: '«Nuja io, Gijà tu (1), Pijà quegli, Rujà quella, Guajà noi, Ijà voi, Najà coloro.»'
        obra: gilij-1780-1783
        pagina: '345-346 (t. III)'
        nota: 'Gilij conocía el manuscrito de Rivero (p. 410): no es atestación independiente'
    otras_de_la_esfera:
      kalinago: '«I sing. n(u)-» (pronoms-préfixes); los pronombres libres son «un pronom-préfixe suivi de […] -koya, -kia, 2 -kuya» — Goeje 1939 p. 24, verificado en imagen'
    traza_caquetia: 'C1: da- en dare «diente» y en da(i)tia-o (Oliver p. 147). La duda de Oliver viaja con ella'
    concordancia: 'lokono y taíno concuerdan en da- (consonante y vocal); el achagua conserva la n- protoarahuaca (C1). La base libre no concuerda en ninguna: -i (LK), -ka (TN), -ya (ACH) — C9'
    opciones:
      - letra: A
        formas: [dai]
        etiqueta: caquetío-reconstruido
        derivacion: >-
          da- por C1 (LK = TN, con traza caquetía en dare) + la forma libre
          documentada TAL CUAL en lokono, en los tres moravos (pp. 573, 581).
          Criterio (a) leído con cc.12 (LK + TN), y (b) para el prefijo.
        coste: 'clave libre; 0 colisiones; pasa la fonotáctica; 0 usos previos. Sustituye a taya en todo lo de arriba'
      - letra: B
        formas: [daka]
        etiqueta: caquetío-reconstruido
        derivacion: >-
          da- por C1 + la forma libre documentada TAL CUAL en taíno (daca, Las
          Casas p. 447) con la grafía fonémica de D5 (c → k).
        coste: >-
          Mismo esqueleto fonémico que `daca`, voz TAÍNA del lexicón con la
          misma glosa: el agente que escriba «daca» sumaría préstamo de esfera
          y el que escriba «daka», caquetío — dos lecturas de la misma palabra
          según la letra. Y el castellano colonial tiene «daca» 'dame acá' (Las
          Casas lo avisa, p. 322).
      - letra: C
        formas: [daya]
        etiqueta: caquetío-hipotético
        derivacion: 'da- (C1) + la base -ya del achagua, el maipure y el caribe insular. No está documentada en ninguna lengua: composición nuestra (era la preferida del 09-13)'
        coste: 'clave libre, pasa la fonotáctica'
      - letra: D
        formas: [daca]
        etiqueta: 'taíno (voz de la esfera, NO caquetío)'
        derivacion: 'la forma atestiguada de la esfera tal cual, marcada como ajena'
        coste: >-
          Es la ya existente. Pero en el scorer va a `prestamos_de_esfera`: la
          primera persona dejaría de contar como caquetío en cada frase. Y un
          pueblo no toma prestado su «yo»: la skill minar-fuente trata los
          pronombres como dato de filiación, no de préstamo.
    recomendacion: A
    por_que: >-
      Es la forma de la hermana que Oliver pone más cerca del caquetío («the
      strongest affinities with Lokono», p. 155), documentada igual en los tres
      moravos, con el prefijo que el caquetío conserva según C1; y no choca con
      nada. B es igual de legítima por el criterio, pero duplica una voz taína
      del lexicón.

  - id: pron-2sg
    casilla: 'tú'
    actual:
      forma: pia
      origen: 'wayuu pia'' (Oliver A-2 n2)'
      uso: '2.068 respuestas (51 runs), 3.770 apariciones'
      ensenanza: '1 plantilla (la completa, tier I: 4 veces, con la línea TRATO FORMAL), `_NUCLEO_FALLBACK`, la marca de escena; 9 apariciones en 6 tests'
    lokono:
      - forma: 'bu-i (bù-i)'
        cita: '«bu-i, bo-kia = tú .»'
        obra: perea-alonso-1942
        pagina: 573
      - forma: 'bù-i, bu-i (Sm) · bu-i, bù-i (Sl) · bù-i (Qn)'
        cita: '«Sg. […] 2 bù - i , bu -i ,» … «SCHULTZ : da-i, bu-i , bù - i» … «QUAND : da-i. bù-i .»'
        obra: perea-alonso-1942
        pagina: 581
      - forma: 'b-, ba-, -b-a, -bi- (conjugativo)'
        obra: perea-alonso-1942
        pagina: 582
    taino: 'NINGUNA con cronista. Coll y Toste (2.ª ed.) da «Vara — Tú» sin decir de dónde (lista maestra: clase ii, 0 cronistas). No entra'
    achagua:
      - forma: 'Jia (var. Jiya / Jirra) · Ji-'
        obra: neira-ribero-1762
        pagina: 'pliego 8 der. (p. 3)'
      - forma: 'Gijà'
        cita: '«Gijà tu (1)» — nota (1): la g, a la española'
        obra: gilij-1780-1783
        pagina: '345-346 (t. III)'
    otras_de_la_esfera:
      kalinago: '«II — b(u)-» (Goeje 1939 p. 24)'
      maipure: '«pìa tu» (Gilij t. III p. 186) — la única hermana no wayuu que da `pia` letra por letra; no es una de las tres de cc.12'
    traza_caquetia: 'ninguna del morfema. Indirecta: C3 pone al caquetío con el /b/ lokono (barisi, -bana), con dos contraejemplos'
    concordancia: 'NO: lokono b- / achagua j- (= /x/, /h/). Taíno sin dato'
    opciones:
      - letra: A
        formas: [bui]
        etiqueta: caquetío-hipotético
        derivacion: 'la forma lokona TAL CUAL, igual en los tres moravos; b- donde el wayuu tiene p- (C3)'
        coste: 'clave libre, 0 colisiones, pasa la fonotáctica'
      - letra: B
        formas: [bia]
        etiqueta: caquetío-hipotético
        derivacion: 'b- (C3) + la base -ia del achagua (Ji-a) y del maipure (p-ia): composición'
        coste: '`bia` es clave LOKONO («in»): hay que renombrarla antes (precedente ja-achagua)'
      - letra: C
        formas: [pia]
        etiqueta: 'caquetío-hipotético (deja de ser «reconstruido desde el wayuu»)'

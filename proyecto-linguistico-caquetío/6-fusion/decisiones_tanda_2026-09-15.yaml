# ─────────────────────────────────────────────────────────────────────────
# DECISIONES DE MIGUEL — tanda del 2026-09-15
#
# Mismo patrón que las tandas anteriores: cita literal, lectura operativa y
# dónde se aplica. Rama feat/era2-elenco. Las ocho preguntas de la campaña de
# sitios y clima (6-fusion/issues-pendientes/mundo-era2-sitios-y-clima.md §6),
# respondidas una a una en la conversación, no en el tablero.
# ─────────────────────────────────────────────────────────────────────────
meta:
  fecha: '2026-09-15'
  decidido_por: Miguel
  estado: >-
    APLICADA (2026-09-16). Las ocho respondidas una a una y aplicadas el mismo
    día: curiana_state (p1: CALENDARIOS, PERIODOS_ERA2, fijar_mundo), el
    orquestador (eventos por período, [Tu tierra], Caseto en [Tu gente]),
    curiana_mundo.py (p2, p7), el corpus (p4: ecologia-078 a 084, creencia-020
    a 022), elenco_era2.yaml + módulo regenerado (p6), la ficha
    laguna-guaranao-parque y la laguna re-etiquetada en sitios_era2.yaml (p8),
    y la esfera de contacto en el lexicón (p3b, commit 0e02195).

mundo_era2_sitios_y_clima:
  fuente_de_las_preguntas: '6-fusion/issues-pendientes/mundo-era2-sitios-y-clima.md §6'
  modo: 'una a una, en la conversación («Vamos una a una y las respondo acá»)'

  p1_particion_del_año:
    estado: DECIDIDA (2026-09-15)
    pregunta: '¿Tres períodos (50/40/30) o dos (90/30)?'
    decision_literal: '«A. Definitivamente» · «la A definitivamente»'
    lectura_operativa: >-
      Tres períodos sobre el año de 120 días simulados: P1 Tiempo de Viento
      (ene-may, 50), P2 la seca larga (jun-sep, 40), P3 Tiempo de Siembra
      (oct-dic, 30). Lo atestiguado son dos partes (pulso corto oct-dic:
      ecologia-006, Sievers en Arcaya p. 24); partir la seca en dos es
      canon-simulación y se declara así.
    se_aplica_en: >-
      curiana_state.ESTACIONES (de dos a tres), DIAS_POR_ESTACION (de entero a
      mapa id → días), ESTACION_DE_DIA (de alternancia a acumulado); reparto de
      EVENTOS_ESTACIONALES por período (clima_era2.yaml §motor). Pendiente: se
      aplica junto con el cargador de mundo, cuando estén las ocho.

  p2_nombre_de_los_periodos:
    estado: DECIDIDA (2026-09-15)
    pregunta: '¿Los períodos llevan nombre caquetío en el prompt?'
    decision_literal: '«A»'
    lectura_operativa: >-
      Sin nombre caquetío. El agente ve el período en castellano y las raíces
      que existen para hablar de él (juri, kasi, biro, apana…, las de
      clima_era2.yaml raices_disponibles, filtradas por el perfil era2).
      `madunaka` sigue escondida con las hipotéticas. El nombre lo acuñan los
      agentes, y eso se mide: si los dos nodos convergen en un mismo nombre
      para cada período (sobre todo la seca larga) es prueba directa de koiné.
    se_aplica_en: >-
      el cargador de mundo (render de [Tu tierra]: rótulo castellano + raíces,
      nunca una forma de período); una métrica nueva en el análisis de runs
      (acuñaciones con glosa de período, por nodo). Pendiente con las ocho.
    medido_2026-09-16: >-
      Día 1 (c6837386): ninguna acuñación del período. Día 2 (89fc1744): la
      primera — `tüshi-juri` «viento frío del este», de Hayo (AMUAY), adoptada
      el mismo día; y `juri` fue la voz más usada del día (29). El viento se
      nombra antes que el período: es lo que las fuentes también hacen. La
      métrica por nodo sigue pendiente (deuda: analizar_runs no sigue la
      cadena continuado_desde y la koiné dice «datos insuficientes» con dos
      días encadenados).

  p3_el_yarare:
    estado: IDENTIFICADO (2026-09-15); falta cómo se nombra
    pregunta: '¿Qué es el yararé de la laguna de Guaranao?'
    decision_literal: '«Me refería a Yacaré, me equivoqué yo.»'
    lectura_operativa: >-
      El yararé no existe: era un lapsus. El animal de la laguna es el YACARÉ,
      es decir el caimán. Se retira el testimonio «yararé» del canon de sitios
      (era el único que quedaba sin identificar) y se sustituye por el caimán.
      El cero de la campaña era correcto: no estaba en ninguna fuente porque la
      palabra no era esa.
    lo_que_queda_abierto: >-
      Con qué palabra se nombra. `yacare` en el canon es TOPÓNIMO con glosa
      'pueblo' (Zavala #279, apoyada por Yacarebacoa); la segunda glosa de la
      misma entrada, 'caimán', quedó marcada como sospechosa —*yacaré* 'caimán'
      es tupí-guaraní panamericano— y no se usa. El lexicón activo tiene
      `caiman` pero etiquetado taíno, no caquetío. Ver p3b.
    medido_2026-09-15:
      - 'caimán/cocodrilo en las fuentes: Oliver cap. 3 CERO (caiman, crocodil, alligator); Arcaya CERO; los seis OCR de Esteves CERO (sólo `lagarto`, 3 veces); Medina dictado CERO. Castellanos: 8 `caimán` + 4 `cocodrilo` + 5 `lagarto`, pendientes de localizar por región (regla 4)'
      - 'moderno: Crocodylus acutus (caimán de la costa) se da para la costa norte de Venezuela incluida la formación Lara-Falcón y la península de Paraguaná; la laguna de Guaranao es salobre, con manglar. Sin ficha todavía (regla 8)'

  p3b_la_esfera_de_contacto:
    estado: DECIDIDA (2026-09-15) — APLICADA al motor el 2026-09-16
    pregunta: >-
      ¿Con qué palabra se nombra el caimán, si la caquetía no existe y `yacare`
      ya es 'pueblo' en el canon?
    decision_literal: >-
      «Pero entonces usemos la usanza taína, o por último los agentes tier 1
      tengan acceso a eso por esfera de influencia cultural. Pensando que estos
      de tier 1 no sólo conocían su lenguaje sino el de su esfera de
      influencia.» Y después: «Sí, me parece que el set de cinco es razonable.
      Yo creo que se debe medir aparte, ya que sobre todo para esta área de
      influencia.»
    lectura_operativa: >-
      Se abre un canal nuevo en el prompt: el tier 1 —quien navega, comercia y
      recibe al forastero— ve unas pocas voces de las lenguas con las que la
      polity costera tiene contacto atestiguado, SIEMPRE marcadas como ajenas.
      Es la primera vez que comparanda llega al hablante, y por eso va acotado.
    el_set_de_cinco: [taíno, kalinago, paraujano, caribe-continental, jirajaroide-contacto]
    fuera_del_set:
      - 'wayunaiki (769) y lokono (638): son el ANDAMIO con que se reconstruye el caquetío (D11). Si el agente las ve, la reconstrucción se vuelve circular y el instrumento vuelve a medir a sus autores'
      - 'achagua (3.568): los Llanos. Es exactamente lo que la regla 4 prohíbe importar'
    apoyo_en_el_canon:
      - 'geografia_politica-001: préstamos léxicos caquetíos documentados en Curazao'
      - 'ecologia-021: Aruba a ~25 km, visible en días claros, navegación probada'
      - 'ecologia-013: la cerámica dabajuroide llega hasta las Antillas'
      - 'geografia_politica-002 y 010: puestos comerciales que ESCOGEN socios'
      - 'etnia-008: el caribe del elenco llega por mar y no reside'
    medir_aparte: >-
      `score_linguistico` separa el préstamo de esfera de la fuga. Antes una voz
      taína bajaba el score de 6,2 a 4,1 y salía marcada «⚠ otra-lengua-arahuaca»:
      el instrumento trataba el préstamo como error. Ahora devuelve
      `prestamos_de_esfera` y `n_prestamos_esfera`, no penaliza, y por ahí se
      observa la difusión: si una voz de las islas pasa de un tier 1 a los
      demás, se ve. La fuga de verdad (wayuu, lokono, achagua) sigue penalizando
      igual: medido, 6,2 → 4,9.
    aplicado:
      - 'curiana_lexicon.ESFERA_DE_CONTACTO (las cinco familias, con su razón)'
      - 'curiana_lexicon.prompt_voces_de_fuera(): 3 voces, marcadas como ajenas, categorías prestables (fuera gramática, cuerpo, cualidades, topónimos y etnónimos), sin autoglosas; ~274 caracteres'
      - 'vocabulario_para_agente(): el bloque sólo entra en tier 1'
      - 'score_linguistico(): prestamos_de_esfera / n_prestamos_esfera, sin penalización'
      - 'tests: test_el_prestamo_de_esfera_se_mide_aparte_y_no_penaliza, test_las_voces_de_fuera_son_solo_del_tier_1_y_nunca_caquetias'
    el_caiman: >-
      `caiman` (taíno) es la voz que llega por este canal. `yacare` se queda
      como 'pueblo' (topónimo, Zavala #279 + Yacarebacoa) y no se toca. La
      palabra caquetía del caimán sigue siendo hueco: si los agentes la acuñan,
      se verá; si adoptan el préstamo, también.
    coste_declarado: >-
      +274 caracteres en el prompt del tier 1 (de 7.230 a ~7.504, +3,8 %). La
      longitud predice el score con r = −0,48, así que el bloque se mantiene en
      tres voces.
    medido_en_c6837386_2026-09-16: >-
      Primer día con mundo: 0 préstamos de esfera en las 29 respuestas del
      tier 1 (re-puntuadas con score_linguistico); 1 falso positivo en tier 2
      («ta-bohío», castellano bohío leído como taíno). El tier 1 vio el bloque y
      no mordió el día 1. Y una DEUDA DE INSTRUMENTO: word_uses sólo guarda
      palabras_caquetias (arreglo del 2026-09-09), así que un préstamo usado no
      llegaría a la base y la difusión no se puede leer de word_uses. Hasta que
      se guarde aparte (una columna o una tabla `prestamos`, sin mezclarlos con
      el caquetío que consumen el contagio y la koiné), la medida es re-puntuar
      response_text: script en 5-experimento/BITACORA_RUNS.md (fila c6837386).

  p4_fusionar_antes_o_despues:
    estado: DECIDIDA (2026-09-16)
    pregunta: '¿Los diez hechos nuevos de la campaña se fusionan antes o después del primer run?'
    decision_literal: '«A»'
    lectura_operativa: >-
      ANTES. Los siete de ecologia.yaml (jachos, barbasco, atalayas de
      cardúmenes, guairón y cal de concha, cují como señal de agua, pulso de
      Sievers; el matacán ya entró como ecologia-077) y los tres de
      creencia.yaml (tabú de caza, el dueño del cerro que prohíbe talar, las
      Piedras del Almanaque) entran al corpus antes del primer run con el
      cargador de mundo, para que [Tu tierra] pueda citarlos.
    se_aplica_en: >-
      sesión de fusión (skill fusionar-propuesta) desde
      sitios_era2.yaml §propuestas_a_otras_esferas: cada hecho con procedencia
      y página, etiqueta y capa; compilar_corpus --check; se hace junto con el
      cargador, cuando estén las ocho.

  p5_caseto_y_su_playa:
    estado: DECIDIDA (2026-09-16)
    pregunta: '¿Qué hace Caseto con una zona de pesca (ZA1) a ~22 km?'
    decision_literal: '«A»'
    lectura_operativa: >-
      Conuco principal, pesca de visita. El dominio del sitio es la tierra
      (el conuco, la roza, el barbasco de Cocodite, el barro); los que pescan
      —Kasebo y Waitiao, 2 de los 12 de la casa— bajan a la costa oeste, a un
      día de ida. ZA1 sigue siendo suya en el papel; los Corubos son los dueños
      de la costa oeste, como se dijo de Carirubana el 2026-09-14.
    medido: 'la casa de los Guasicures de Caseto: 12 agentes, 2 de mar (Kasebo T1, Waitiao T2); las otras casas: Corubos 7 de 12, Cayudes 4 de 12, casa del Manaure 4 de 14 (sin zona)'
    se_aplica_en: >-
      prompt_gente() en el orquestador: para Caseto dice «tu gente siembra en
      Caseto; los que pescan bajan a la costa oeste, a un día de ida» en vez
      de «tu gente pesca en…»; el cargador de mundo prioriza `tierra` para
      Caseto aunque tenga zona (como Moruy). Con las ocho.

  p6_coordenadas_del_capubana:
    estado: DECIDIDA (2026-09-16)
    pregunta: '¿Se rellenan lat/lon del Capubana en el módulo generado?'
    decision_literal: '«A»'
    lectura_operativa: >-
      Sí: el pico del mapa vivo. Verificado el 2026-09-16 en
      fuentes_caquetios/osm_kaketiana/paraguana-1.json: «Cerro Santa Ana»,
      natural=peak, ele 830, lat 11.8182732, lon -69.9523818. El cerro es un
      punto (el único monte de la península); lo espiritual es lo que pasa en
      él, no dónde está. Un None donde todos los demás sitios tienen valor era
      una trampa.
    se_aplica_en: >-
      6-fusion/elenco_era2.yaml (sitio Capubana con lat/lon y fuente_coord
      osm-kaketiana) → regenerar curiana_agents_era2.py con
      generar_agentes_era2.py y comprobar con --check. Con las ocho.

  p7_presupuesto_de_tu_tierra:
    estado: DECIDIDA (2026-09-16)
    pregunta: '¿Presupuesto fijo para el bloque [Tu tierra] del cargador de mundo?'
    decision_literal: '«320 está bien»'
    lectura_operativa: >-
      Tope duro de 320 caracteres, truncado por línea entera (nunca a media
      frase), con un test que recorre las 126 combinaciones (7 sitios × 3
      períodos × 6 momentos) y afirma len(bloque) <= 320 en todas.
    medido_2026-09-16: >-
      Con el bloque de voces de fuera ya dentro: tier 1 ~9.700 caracteres,
      tier 2 ~5.500, tier 3 ~4.100, media 6.400 (cota alta: cuenta la ficha
      entera del agente). 320 cuesta +5,0 % sobre la media, +3,3 % en tier 1 y
      +7,9 % en tier 3. La campaña había medido +7,7 % sobre una media más
      magra (4.142). r = −0,48 entre longitud del prompt y score.
    se_aplica_en: 'curiana_mundo.py: bloque_tu_tierra(sitio, periodo, momento, semilla, presupuesto=320); test_tu_tierra_cabe_en_320_en_las_126_combinaciones. Con las ocho.'

  p8_el_manglar_de_guaranao:
    estado: DECIDIDA (2026-09-16)
    pregunta: '¿El manglar (y el caimán) de la laguna de Guaranao: se persigue la fuente o entra como canon-simulación?'
    decision_literal: '«Sí» (a abrir la ficha)'
    lo_que_aparecio: >-
      Wikipedia es, «Parque metropolitano Laguna de Guaranao» (consultada el
      2026-09-16): cuatro mangles con nombre (Rhizophora mangle, Avicennia
      germinans, Laguncularia racemosa, Conocarpus erectus); fauna con «la
      baba o el caimán de anteojos (Caiman crocodilus)» y «cocodrilos de la
      costa (Crocodylus acutus)»; peces (lisa, corocoro, lenguado); y la
      historia: «en la década de 1970 era una salina utilizada antiguamente por
      los indios caquetíos», manantiales de agua dulce que la volvieron
      salobre, contaminación por aguas servidas hacia 1980. El mapa vivo (OSM)
      tiene la laguna (water=lake, 11.6825, -70.1959) pero ningún humedal
      etiquetado a menos de 6 km: cero de cobertura, no de la laguna.
    lectura_operativa: >-
      Se abre la ficha 4-fuentes/laguna-guaranao-parque.md (capa moderno, la
      misma calidad que monumento-cerro-santa-ana: Wikipedia con referencias
      flojas). Los cuatro testimonios de Miguel sobre la laguna —manglar,
      yacaré, peces, salina— suben de testimonio-miguel a atestiguado
      (moderno), y el caimán entra al mundo con fuente. «Utilizada por los
      caquetíos» es afirmación moderna sobre el pasado (regla 3): no se
      proyecta sola; la salina precontacto la sostiene Arcaya p. 22.
    se_aplica_en: >-
      4-fuentes/laguna-guaranao-parque.md + generar_bibliografia.py; un hecho
      nuevo en ecologia.yaml (la laguna: manglar, caimanes, salina) y las
      líneas de la laguna en sitios_era2.yaml re-etiquetadas. Con las ocho.
    correccion_2026-09-16: >-
      Horas después, el rastreo web del cierre del día 1 fechó el ecosistema:
      Aular Leal 2014 (El Falconiano, con la ing. forestal Keysa Sánchez de
      González) — la laguna nace en 1985 de un colector de aguas negras roto y
      el manglar creció después; antes era una quebrada con una salina en la
      boca. Regla 2 aplicada por el escriba sin esperar: ecologia-084 degradado
      (lectura + limite), la ficha corregida, las líneas de la laguna con
      `proyectable: false` (el cargador no las muestra) y el caimán a hipotético
      (GBIF/iNaturalist: 0 registros en Paraguaná; el Libro Rojo no la nombra).
      El Guaranao de la era 2 es sal y ensenada. Los testimonios de Miguel
      siguen siendo ciertos del sitio de hoy. Fusionar la ficha de Aular Leal
      a 4-fuentes/ lo decide Miguel (6-fusion/fichas_propuestas/).

  fallo_del_filtro_de_nombres:
    estado: CORREGIDO (2026-09-16)
    que_pasaba: >-
      El filtro de nombres que se añadió el 2026-09-14 (para que «Karebe» no
      contara como la palabra `karebe`) comparaba en minúsculas, así que
      descartaba 52 voces del canon homógrafas de un nombre del elenco —buko,
      hayo, mene, saruro, hiko, jachos, karebe, naure…—, las 52 visibles en el
      prompt de la era 2. Eran palabras que el motor enseñaba y nunca contaba,
      ni en el score ni en la koiné (de `palabras_caquetias` comen el contagio,
      la competencia de formas y el idiolecto).
    arreglo: >-
      La mayúscula decide. Un nombre que no es voz del lexicón (Biro-ko) se
      descarta siempre; uno que sí lo es se descarta en mayúscula y cuenta en
      minúscula. Residuo declarado y elegido: una voz del canon que abra frase
      no cuenta — se prefiere perder ese uso a que un nombre se propague por la
      koiné como si fuera léxico. Medido: 52 de 53 vuelven a contar en
      minúscula, 0 de 53 cuentan en mayúscula.
    afecta_a: >-
      Los runs de la era 2 corridos el 2026-09-14 con el filtro viejo (db946685
      y siguientes): su score y su koiné no vieron esas 52 voces. Queda
      declarado en 5-experimento/BITACORA_RUNS.md.

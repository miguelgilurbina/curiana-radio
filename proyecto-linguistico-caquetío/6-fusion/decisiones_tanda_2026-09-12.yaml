tainismos_de_medina:
  estado: APLICADA (2026-09-12)
  decision_literal: >-
    «Si están como taíno en otra fuente y son panhispánicas entonces deben
    clasificar como caquetío. Además el mismo diccionario de habla paraguanera
    los clasifica. Ya hemos visto que el caquetío y el taíno compartían muchas
    cosas.» Y después: «en cuanto a lo de Medina, todas entran como voces nuevas».
  lectura_operativa: >-
    caquetío-RECONSTRUIDO, no atestiguado — el precedente kanoa/hamaca/konuko.
    iguana, macana y nagua re-etiquetadas; once nuevas con clave = lema
    fonémico D5 (koa, komehén, wayakán, hiko, hikotea, jaiba, jején, magey,
    niwa, siwato, yawasa).
  aplicado_por: [6-fusion/scripts/tainismos_medina_a_caquetio.py, 6-fusion/scripts/fusionar_tainismos_medina.py]

clanes_de_paraguana:
  issue: 'https://github.com/miguelgilurbina/curiana-radio/issues/122'
  estado: CERRADA (2026-09-12) — salida 4, la lectura de Miguel; etiqueta reconstruido con deuda a Delmonte 1883 / González Batista 1984
  decision_literal: '«1. sí» (a «¿es la 4 la decisión para sembrar los nodos?»)'
  lectura_de_miguel: >-
    «Amuay sí está más al norte que Guaranao: Guaranao es una laguna y Amuay
    un pueblo pesquero en la modernidad. Pero entendemos que Moruy podría ser
    el centro de los Guaranaos o Moruyes, y los Amuayes en el norte, con
    Cayerúa.»
  lo_que_zanja: 'Delmonte 1883 o González Batista 1984 (ninguno en el repo)'


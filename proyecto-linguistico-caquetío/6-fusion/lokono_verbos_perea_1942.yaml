# ─────────────────────────────────────────────────────────────────────────
# EL VERBO de Perea y Alonso 1942 (parte II, pp. impresas 609-684) —
# los paradigmas de SCHUMANN (ms. 1755) y, dentro de ellos, su vocabulario
# verbal: las listas «se conjugan como X los siguientes».
#
# GENERADO por 6-fusion/scripts/minar_perea_verbos.py — la lista está
# escrita a mano en ese script (leída del OCR página por página), y el
# script sólo la coteja con el lexicón y la ordena. Para corregir una voz,
# corrígela allí y regenera.
#
# Regla 5: propuesta, no fusión. Regla 8: cada voz lleva su página impresa.
# ─────────────────────────────────────────────────────────────────────────
meta:
  generado_por: 6-fusion/scripts/minar_perea_verbos.py
  obra: perea-alonso-1942
  parte: 'II — Compendio Gramatical, el verbo: pp. impresas 609-684 (pdf 833-912)'
  minado: '2026-09-12'
  estrato: 'VOCABULARIO DE SCHUMANN, manuscrito de 1755 (p. 628: «en el vocabulario este verbo significa...»), ordenado
    por Perea y ampliado a veces con Schultz 1802. Es el estrato lokono más antiguo del repo, anterior al Fraseario.'
  metodo: 'Leído a mano del OCR de pdftotext. NO se vació por regex: las listas del OCR se desplazan por columnas
    y pegan la glosa de un verbo al vecino. Cada forma se copió con su página; las dudosas llevan `marcas` (sic
    / ? / Al / ocr).'
  ortografia: 'Clave Panfonética de Perea (p. impresa CI): c = /k/, cx = ch, x = sh, ù = ü alemana, y glifos propios
    para r suave / RR española / R grasseyé / LL. El OCR lee uno de esos glifos como `л`; `Cxaлúa` = Charrúa fija
    que л = RR. Aquí se translitera a rr.'
  clave_propuesta: 'la forma de Perea sin el prefijo verbal a- y sin el sufijo de infinitivo -n / -n-nua, con sus
    guiones: a-dumki-n → dumki. Los estativos con atributivo c-/k- lo conservan (c-a-ima «ser malo» ≠ ima «enemigo»).
    Es la misma convención que las 173 raíces del Fraseario ya fusionadas.'
  etiqueta_propuesta: comparanda lokono atestiguada (Schumann 1755 vía Perea 1942). Ninguna es caquetía.
  cobertura_medida:
    verbos_listados: 239
    nuevos_para_el_lexicon: 213
    ya_en_lexicon_misma_clave: 26
    corroboraciones_por_concepto_con_otras_fuentes: 20
    divergencias_con_otras_fuentes: 6
    voces_sueltas_no_verbales: 7

advertencias:
- 'Perea, pp. 683-684: la gramática de Schumann «puede ser considerada como un simple ensayo» y de la p. 664 en
  adelante «asume el carácter de un simple borrador». Los paradigmas de negación, recíprocos y con infijo son reconstrucciones
  de Perea por inducción, marcadas [ ] y [?] en la fuente. Las LISTAS DE VERBOS no: ésas son el vocabulario, y es
  lo que aquí se propone.'
- Perea sospecha (p. 606) que el aparato de TIEMPO de los pretéritos es «perfeccionamiento a priori de los misioneros».
  Los sufijos -bi / -buna / -cuba / -pa se registran como lo que Schumann declara, no como sistema verificado en
  el habla.
- El pronombre va PREFIJADO en los transitivos (d-a-, b-a-, l-a-…) y POSPUESTO en los estativos de la 4ª y 5ª conjugación
  (halli-kebbe de, cakù-ca de). Perea mismo dice que el empleo de Schumann «es por demás arbitrario» (p. 683).
- La misma raíz aparece a veces en dos clases con dos vocales (a-canaba-n / a-canabù-n «oír»; a-sucusa-n / a-sucusu-n
  «lavar»; a-cai-da-n / a-cai-dù-n «romper»). Perea lo atribuye al cambio de la vocal final «según el tiempo verbal
  o la presencia del acusativo» (p. 614). Son UNA raíz, no dos.
- 'Homógrafos con el español: casa-n «engendrar», a-carta-n «enterrar», a-manta-n «afilar», a-ca-n «lavarse», a-sa-n
  «nombrar», ide-n, pere-n, tere-n, case-n, a-usa-n. Si entran al lexicón tienen que ir con clave desambiguada (`-lokono`),
  porque score_linguistico() cuenta como arahuaco cualquier token igual a una clave y no filtra por fuente.'


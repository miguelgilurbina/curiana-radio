fusion_2026-09-27:
  aplicadas: 112
  no_aplicadas: []
  como: >-
    Cada aparición se localizó por su ancla y su contexto, no por el número de
    línea (desactualizado en ~26 casos): se reemplazó solo la paginación según
    la propuesta, incluida su intención cuando pedía añadir página donde no
    había ninguna («sin página» → página impresa); se respetó que
    `curiana_polities.py` es motor y solo se tocaron números de página dentro
    de citas, nunca contenido; `2-lengua/toponimos.yaml` y
    `2-lengua/morfemas.yaml` no se editaron a mano — se corrigió
    `curiana_sim/lexicon_toponimos.py` y se regeneraron con
    `migrar_toponimos.py`; y `colaterales` quedó intacta para Miguel.

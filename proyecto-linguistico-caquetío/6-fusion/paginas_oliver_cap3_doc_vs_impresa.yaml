# PROPUESTA — Oliver 1989 cap. 3 existe en el repo en DOS paginaciones
#
# Hallazgo del 2026-09-13, medido el 2026-09-14. Las citas de
# `oliver-1989-cap3` mezclan la paginación de la edición DOC/PDF de 2006
# (la que tiene capa de texto) con la de la tesis impresa de 1989 (el escaneo
# ProQuest/UMI). No hay desfase constante entre ambas: la impresa intercala
# páginas de figura y reparte las notas al pie de otra manera.
#
# Regla 5: esto NO toca el corpus, ni curiana_polities.py, ni el lexicón. Deja
# por cita la página DOC, la impresa y el reemplazo propuesto. Fusionar (y
# decidir la convención) es de Miguel.
#
# Cómo leer cada pasaje:
#   doc / impresa   la página del pasaje en cada edición
#   convencion      en qué edición está la cita hoy: doc | impresa | ninguna
#                   (no corresponde a ninguna de las dos) | mixta
#   apariciones     dónde se cita, con el texto actual y el reemplazo
#                   propuesto EN PAGINACIÓN IMPRESA; «= (sin cambio)» si ya lo está

meta:
  recogido: '2026-09-14'
  estado: fusionado-2026-09-27
  obra: oliver-1989-cap3
  pregunta: >-
    ¿En qué edición está cada cita de Oliver 1989 cap. 3 del repo, y cuál es su
    página en la tesis impresa?
  ediciones:
    doc_2006:
      archivo: "fuentes_caquetios/Chapter 3 Ethnohistory.DOC-comprimido.pdf"
      paginacion: "cabecera = pdf + 182, medido en las 113 páginas (113/113)"
      que_es: >-
        Reedición de Oliver en DOC/PDF (2006). Tiene capa de texto. No es solo
        re-maquetación: añade material «only in PDF version, 2006» (DOC 244,
        imagen satelital del Yaracuy; DOC 229 y 295, color añadido; DOC 293,
        fotos «FOR THE PDF VERSION ONLY») y cambia alguna grafía (ver
        colaterales, Cayerta → Cayerúa).
    impresa_1989:
      archivo: "fuentes_caquetios/Oliver_1989_Tesis_Arawakan_NW_Venezuela_UCL.pdf"
      paginacion: "impresa = pdf − 27; la cabecera OCR coincide en las 141 páginas leídas (pdf 205-345)"
      que_es: "El escaneo de la tesis impresa, sin capa de texto."
  notas_al_pie: >-
    También cambian de número: la impresa numera las notas corrido desde
    capítulos anteriores. Nota impresa = nota DOC + 92, medido en n. 3→95,
    4→96 (el OCR lee «86»; la siguiente es 97 = DOC n. 5), 27→119, 28→120,
    94→186, 109→201 (a ojo) y 126→218. Toda cita «n. N» hay que decir de qué
    edición es.
  metodo: >-
    (1) Texto DOC por página con pymupdf. (2) OCR tesseract (eng, 200 dpi) del
    escaneo, pdf 205-345, con la cabecera impresa leída en cada página.
    (3) Alineación: cada trigrama de palabras de una página DOC que aparece en
    una sola página del OCR vota por esa página impresa; resultado en
    `mapa_doc_impresa`. (4) Cada cita se localizó por su frase-ancla en la DOC
    y en el OCR, por separado. (5) A ojo sobre la imagen: impresas 259, 269 y
    280. El OCR es pista de localización, no transcripción: ninguna cita
    textual sale de aquí.
  convencion_propuesta: >-
    Citar la IMPRESA (1989) y, si se quiere, anotar la DOC aparte
    (`pagina_doc`). Por qué: (a) la obra que el repo llama «Oliver 1989» es la
    tesis; la DOC es de 2006 y no es idéntica. (b) Las otras notas de Oliver ya
    citan la impresa, porque salen del mismo escaneo:
    oliver-1989-cap3-vecinos (223-250), la Tabla A-8 (591-592) y
    paraguana_dos_clanes (275-276). (c) Las notas al pie solo cuadran si se
    dice la edición. La DOC sigue siendo la mejor para BUSCAR texto: se busca
    en la DOC y se traduce con el mapa de abajo. Decisión de Miguel.
  alcance: >-
    Barrido: 3-mundo/corpus/*.yaml, 3-mundo/*.md (+ ensayos/),
    3-mundo/asentamientos.yaml, 4-fuentes/oliver-1989-cap3.md, 6-fusion/*.yaml,
    5-experimento/DISENO_ERA2.md, curiana_sim/curiana_polities.py y
    curiana_sim/lexicon_toponimos.py (fuente de 2-lengua/toponimos.yaml). NO
    barrido: las otras notas de 4-fuentes/, 1-plan/, 2-lengua/*.md y los tests.

verificacion:
  txt: &txt "frase-ancla hallada en el texto DOC (pymupdf) y en el OCR de la impresa"
  ojo: &ojo "frase-ancla en el texto DOC y en el OCR de la impresa, y mirada a ojo en la imagen de la impresa"
  vecinos: &vecinos "ancla en el OCR de la impresa (la nota -vecinos ya se minó sobre el escaneo) y equivalente en el texto DOC"


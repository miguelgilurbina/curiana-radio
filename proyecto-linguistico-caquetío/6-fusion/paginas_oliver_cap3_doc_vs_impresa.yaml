colaterales:
  - id: col-01-confederacion-no-es-costera
    aplicado: '2026-09-27 — Miguel: «sólo justificar la sal y la concha». costera.economia, la ficha §Economía y horizonte-de-contacto.md corregidos'
    que: >-
      ⚠️ Regla 4. costera.economia (curiana_polities.py l. 165-170) atribuye a
      Oliver una «red de alianzas sostenida en comercio: cuentas de concha, sal
      y azabache» y una «confederación por comercio». El único pasaje con esos
      tres bienes es sobre los JIRAJARANOS, y dice lo contrario:
      «none of the Jirajaran villages in this region had developed a
      "confederation" … They did develop a system of alliances on the basis of
      trade and exchange of goods (e.g. shell-beads, salt, azabache)» (DOC 238 =
      impresa 245). Y «confederated … with the Xaguas with whom they trade salt»
      es de Barquisimeto (DOC 240 = impresa 247). La bitácora §Economía
      («[Costa/Guajira] Red de alianzas comercial») y horizonte-de-contacto.md
      l. 46 arrastran lo mismo. No se ha buscado otro pasaje costero equivalente:
      queda para quien fusione.
  - id: col-02-maloca-de-curazao
    que: "Ver pag-23: la maloca de 40-50 es de Curazao, no de Barquisimeto/Yaracuy."
  - id: col-03-cayerta-cayerua
    que: >-
      La edición 2006 cambia la grafía del primer asiento de los Amuayes: la
      impresa (276) trae «Cayerta», y «Cayarba [Cayerta]» / «Cayertia» en la
      cita de González Batista 1984; la DOC (264) escribe «Cayerúa». Para la
      campaña de topónimos: «Cayerúa» en la DOC 264 puede ser normalización de
      Oliver en 2006, no la forma de Delmonte. Leído en OCR; mirar la imagen de
      la impresa 276 antes de usarlo.
  - id: col-04-carta-bastidas
    que: "Ver pag-17: la carta de Bastidas se localizaba en la página del pacto de 1527; afecta a cinco nodos y tres topónimos."
  - id: col-05-generados
    que: >-
      2-lengua/toponimos.yaml y 6-fusion/toponimos_por_fuente.yaml son
      generados: sus páginas se corrigen en curiana_sim/lexicon_toponimos.py (y
      en toponimia_paraguana_miguel.yaml) y se regenera. No editarlos a mano
      (trampa de CLAUDE.md).

mapa_doc_impresa:
  nota: >-
    Generado por alineación de trigramas DOC ↔ OCR del escaneo (ver meta.metodo).
    `impresas` son las páginas impresas con apoyo real (≥ 5 trigramas únicos o
    ≥ 5 % de los encontrados). La primera suele ser el cuerpo; una página
    impresa lejana al final suele ser una nota al pie, que la impresa pone en la
    página de su llamada. `cobertura` es la fracción de trigramas de la página
    DOC hallados en una sola página del OCR: por debajo de 0,3 la página es

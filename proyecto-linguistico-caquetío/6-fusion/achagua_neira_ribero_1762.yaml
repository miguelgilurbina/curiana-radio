  advertencia: ESTO NO ES CAQUETIO. Es achagua, arahuaco de los Llanos (Meta/Casanare). Entra como comparanda para
    D11 fase 2, no al lexicon ni al habla de los agentes (regla 5).
  ortografia_del_copista:
    clave_de_lectura: 'EL COPISTA ESCRIBE LA `r` CON UN GLIFO QUE PARECE `z` O `x`. Esta medido en el propio manuscrito:
      el parrafo de «Pronunciacion» (pliego 7, der.) dice «la R no la hacen erre, sino r como los Españoles, y asi
      no dicen Riarrumirre, sino riarrumirre» — y las cuatro palabras estan escritas con ese glifo. Glifo simple
      = r; glifo doble = rr. Aqui se transcribe SIEMPRE como r/rr, no como z/x.'
    ese_larga: usa ʃ (s larga) en posicion medial; aqui se transcribe s
    uso_de_v_u: «Vn/Vna» por «Un/Una»; la u vocalica y la v consonantica se distinguen mal
    y_frente_a_i: alterna y/i (`yagicha` ~ `iagicha`; `Jia` ~ `Yia`)
    qu: castellano `q.` = que; `p.a` = para; `p.q.e` = porque; `N.ro` = Nuestro
    abreviaturas: '`v.g.` = verbigracia, `vel` = o (latin), `&` / `&c` = etcetera, `it.` = item'
    nasales: tilde sobre vocal para nasalidad o para n/m omitida (`riãne`, `Ruãde`, `sanã`)
    tildes: acento agudo frecuente y aparentemente prosodico (`Abásu`, `chabí`, `baderriá`)
    separador_de_entrada: guion largo punteado entre castellano y achagua; punto final tras la voz
  estructura_del_manuscrito_medida:
    arte: pliegos 7-27 (prologo, pronunciacion, declinaciones, conjugaciones, tratados, capitulos)
    lista_alfabetica_de_verbos: 'pliegos 23(der)-26(izq) — «Noticias necesarias p[ar]a la perfecta intelig[enci]a
      de la Lengua Achagua. Cap. 1.o Particulas à los nombres y verbos de este Idioma, ordine Alphabetico». NO es
      el vocabulario: es prosa gramatical con los verbos agrupados por letra, y lo que da de cada uno es la particula
      o el caso que rige. MINADA en la segunda pasada, en `arte.verbos`. No recorre todo el alfabeto: solo A, B,
      C, D, E, F(G,H), Y, L, N, O, P, Q, R, S, T, V'
    modos_de_decir_uno: pliego 28 (izq., final del arte) — el numeral 'uno' con clasificadores
    vocabulario: 'pliegos 28(der)-98(izq), castellano → achagua, dos columnas, ~35 lineas por pagina. LEIDO ENTERO
      en la segunda pasada: no queda pliego sin tocar entre el 28 y el 98'
    no_hay_capitulo_de_numerales: verificado pliego a pliego en los 12-23 (son conjugaciones y tratados del verbo).
      Los cardinales hay que sacarlos del vocabulario (Vno, Dos, Tres...), no del arte.
    verbo_sustantivo: 'pliegos 26(izq)-27(izq), «Cap. 2.o Del verbo substantivo Vyuna, y de su notable variedad».
      Minado en `arte.verbos`. El hallazgo: UN SOLO VERBO cubre «ser», «estar» y «tener»'
    equivocos: 'pliego 27, «Cap. 3.o De algunos equivocos de esta lengua». Es un diccionario de homonimia: la voz
      achagua con todas sus acepciones castellanas. Minado en `arte.verbos` con la direccion invertida (el lema
      es la voz achagua)'
    cabeceras_de_letra_medidas: 'B 40 · C 44 · D 52 · E 57 · F 63 · G 65 · H 66(der) · I/Y 69(izq) · J 71(izq) ·
      L 71(der) · M 73 · N 77(izq) · O 79 · P 80 · Q 86(der) · R 87(izq) · S 90(izq) · T 93(izq) · V/U 96(der) ·
      X 98(izq) · Z 98(izq). CORRIGE a la ficha, que situaba la L en el 73: arranca al pie del 71 der. Y NO HAY
      LETRA K: de la J se pasa a la L en el mismo pliego 71'
    fin_del_vocabulario: 'pliego 98 izq. El 98 der. esta en blanco. Colofon del propio manuscrito: «todo à la maior
      honrra y gloria de Dios, por quien se ha trasladado esta lengua. Se acabó este pequeño trabajo el dia 14 de
      Sept[iembr]e de 1762. Y esta nueva copia, ó traslado oi 23 de Abril de 1788.»'

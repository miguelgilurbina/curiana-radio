      es minoritaria.
calibracion_jahn:
- es: lengua
  jahn: nuiname
  manuscrito: nuinene («Entorpecerse la lengua — Cadacaniu nuinene»)
  pliego: 59
  lado: der
  veredicto: coincide
  nota: no hay lema «Lengua»; la forma sale del ejemplo, poseida. `nu-chuani` es la otra voz, 'mi habla'
    (pliego 95)
- es: diente
  jahn: nier
  manuscrito: eri («toba de los dientes — Eridare»; «Encia — Eri enita»; «Dolor de muelas — Nuecaicha»)
  pliego: 95
  lado: der
  veredicto: coincide
  nota: NO HAY LEMA «Diente» en la D — verificado leyendo 52, 53, 56 y 57. La raiz `eri`/`-e-` se recupera
    de tres entradas laterales
- es: nariz
  jahn: nutako
  manuscrito: no localizada
  pliego: null
  lado: null
  veredicto: no-esta
  nota: el pliego 78 (N) no se leyo entero; «Sonar narices = Nunurrunau» (pliego 92) no da la raiz
- es: ojo
  jahn: nutói
  manuscrito: '[T]uisi; `nu-tui-ba` = mis ojos; `Juchama-tuisi` = dos ojos'
  pliego: 78
  lado: der
  veredicto: coincide
  nota: la inicial del lema se lee mal (J o T); la forma poseida y el clasificador numeral la confirman
    como tui-
- es: oreja
  jahn: núbila
  manuscrito: Bibasi («Oreja»); Jbiri / Nuibi («Oido, oreja»)
  pliego: 79
  lado: izq
  veredicto: difiere
  nota: dos voces, ninguna igual a `núbila`; comparten la raiz bi-/-bila. Degradado a difiere (regla 2)
- es: cabeza
  jahn: núrita
  manuscrito: Bitasi (absoluto); `nu-bita` poseido («Encalvecer — Aretau nubita»)
  pliego: 44
  lado: der
  veredicto: difiere
  nota: '`bita` vs `rita`. La raiz -ita es probablemente la misma con distinta consonante de apoyo, pero

        forma: Na-
        pliego: 8
        lado: der
      paradigma_ejemplo:
        base: Padre = Saricanasi (absoluto; pierde el -si al poseerse)
        pliego: 8
        lado: der
        formas:
        - es: Mi Padre
          achagua: Nusaricana
        - es: tu Padre
          achagua: Jisaricana
        - es: su Padre
          achagua: Risaricana
        - es: su Padre de ella
          achagua: Rusaricana
        - es: N.ro Padre
          achagua: Guasaricana
        - es: V.ro Padre
          achagua: Jsaricana
        - es: su Padre de ellos
          achagua: Nasaricana
  numerales:
    advertencia: 'El arte NO tiene capitulo de numerales (verificado pliego a pliego en los 12-23: son
      conjugaciones). Lo unico que da es «Modos de decir uno» al cerrar el arte, pliego 28 izq.: el numeral
      ''uno'' es `aba-` mas un CLASIFICADOR que concuerda con la clase del objeto. Los cardinales del
      2 en adelante hay que buscarlos en el vocabulario (Dos, Tres, Vno...).'
    uno_con_clasificadores:
      pliego: 28
      lado: izq
      encabezado: Modos de decir uno
      formas:

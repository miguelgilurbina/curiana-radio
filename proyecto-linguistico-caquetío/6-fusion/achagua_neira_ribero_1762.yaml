      nota: '«tambien es nota de participio de presente, y de preterito estas particulas: -yisa, -misa, -nisa»'
    - castellano: Infinitivo (verbos en -iu)
      achagua: -ca
      pliego: 26
      lado: izq
      letra: Y
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: numiquiu → numiquiuca. numedaca, numedacaba, q[u]e se hará = rimedacasuba. resplandecer = vrumiuca.
        estar ocupados = Babatuicabi
      nota: «Los acabados en `iu` no pierden nada en el infinitivo. Admiten reflexion»
    - castellano: Yo soy, estoy, y tengo
      achagua: Vyuna
      pliego: 26
      lado: izq
      seccion: verbo sustantivo (Cap. 2)
      ejemplo: tu eres, estás y tienes = Vyugi. Aquel está, és, y tiene = Vyumí. Nosotros somos, estamos &c = Vyubí.
        Vosotros sois, estais y teneis = Vyuy. Aq[ue]llos son, están y tienen = Vyuna
      nota: UN SOLO VERBO para «ser», «estar» y «tener». El autor abre el capitulo diciendo que «p[ar]a estos tres
        romances Yo soy, tengo, y estoy, hay notable variedad en este verbo»

- es: barba
  jahn: nuchiánoma
  manuscrito: Jinumasi; `nu-rrinuma` («Barbar — Rigiayu nurrinuma»)
  pliego: 40
  lado: der
  veredicto: difiere
  nota: raiz `-numa`, que es tambien 'boca' (`nunuma`). Jahn añade una silaba `chia-` que aqui no aparece
- es: mano
  jahn: nukaje
  manuscrito: Cageri (absoluto); `ri-cage` = su mano
  pliego: 74
  lado: izq
  veredicto: coincide
  nota: cf. «Hechuras de sus manos — Ricage menaisa» (pliego 67)
- es: pie
  jahn: nuipa
  manuscrito: Jbari («Pie»); `nu-caba` («Pata mia»)
  pliego: 83
  lado: der
  veredicto: coincide
  nota: '`ibari` ~ `ipa` con la alternancia b/p habitual del copista; la segunda voz `caba` es la pata'
- es: agua
  jahn: mena
  manuscrito: Vni («Agua — Vni. La corriente del rio = Vninanaba»)
  pliego: 32
  lado: izq
  veredicto: difiere
  nota: 'HALLAZGO: Jahn da agua=mena y rio=unibe. En el manuscrito AGUA es `uni` y el MAR es `Manoa` (pliego

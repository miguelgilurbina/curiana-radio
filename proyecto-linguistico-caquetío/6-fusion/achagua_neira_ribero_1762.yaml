dudas:
- pliego: 28
  lado: der
  texto: '«Aun, esto es, todavia — Cxxi nãʃa». La inicial parece C (igual que la de `Cataumi`), pero `Crri`
    no se deja pronunciar. Podria ser E. Leido: C[rr]i nãsa'
- pliego: 28
  lado: der
  texto: «A la par conmigo — Nuʃunitẽglu/Nuʃunitẽgua». El final esta emborronado por una correccion del
    propio copista
- pliego: 28
  lado: der
  texto: «A trueque de casabe — Bexxi ibem» + adicion marginal «benixxi». La vocal de la primera silaba
    (Berri / Berru) y el final (ibem / ibeni) no se deciden; Jahn da cazabe = `berri`
- pliego: 28
  lado: der
  texto: '«A mi — Nuxiu. A ti = Jixxu». El primero lleva glifo simple (r) y el segundo doble (rr): Nuriu
    / Jirru. Asimetria rara, puede ser descuido del copista'
- pliego: 28
  lado: der
  texto: «A escuras — Catabacatata, Catabacami-». La segunda forma queda cortada por el lomo
- pliego: 28
  lado: izq
  texto: '«Vna luna = Abacoa Quer-» y «Vn tercio = Abagia ter-», en «Modos de decir uno»: los finales
    de linea entran en el lomo y no se leen enteros'
- pliego: 47
  lado: der
  texto: '«Celestial — [E/C]rrisai» y «Cielo — [E/C]rri» (pliego 48). La inicial es el mismo glifo y se
    parece a la C de `Cataumi`, pero `Crri` no se pronuncia. Se resolvio POR CONTEXTO al llegar a «Sol.
    = Erri» (pliego 92) y «En el cielo = Erri irrico» (pliego 61): es E. Queda anotado porque la lectura
    del glifo suelto sigue siendo ambigua'
- pliego: 46
  lado: der
  texto: '«Casabe — Jerri/Yerri». La inicial es una mayuscula de trazo alto, distinta de la B redonda
    de `Bania` en la linea de arriba. Pero en el pliego 28 («A trueque de casabe — Berri ibem») y en el
    79 («Orilla del casabe = Berriribiu») la misma voz lleva B. Jahn da `berri`. No se decide: puede ser
    alografo del copista'
- pliego: 78
  lado: der
  texto: «Ojo — Juisi/Tuisi». El lema esta escrito con una mayuscula de trazo grueso que lo mismo vale
    por J que por T. Las formas poseidas del propio renglon (`nutuiba`) y el clasificador numeral `Juchamatuisi`
    (pliego 56) obligan a leer T, pero el glifo no lo dice solo
- pliego: 30
  lado: der
  texto: «Acomesar — Numiquinchuanini». El castellano se lee `Acomeʃar`, que no es palabra; por el contexto
    (va entre `Acordarse` y `Acortarse`) y por el achagua (`-chuani` = habla) lo probable es «Aconsejar»,
    pero no se transcribe lo que no se ve
- pliego: 44
  lado: der
  texto: «Cabuya — Edana rrur[i]». El final entra en el lomo del libro y no se lee entero
- pliego: 79
  lado: izq
  texto: '«Ormigas grandes, comida de Achaguas = Quiriri». Los tres glifos centrales son r/rr y la vocal
    entre ellos no se distingue: podria ser `Quirriri` o `Quiuri`'
- pliego: 66
  lado: der
  texto: «Haz — Jbain». La voz castellana es corta y la achagua tambien; sin contexto no hay forma de
    contrastar la lectura
- pliego: null
  lado: null
  texto: 'AVISO GENERAL, no una duda puntual: toda la columna achagua se transcribio por vision de una
    cursiva del XVIII. Las confusiones sistematicas a vigilar antes de citar una forma como exacta son
    r/rr (glifo z-like), s larga / r, b/v, y/i, n/u y m/nn. La etiqueta de `meta.etiqueta_propuesta` lo
    dice: verificar contra la imagen antes de usar una forma como dato'

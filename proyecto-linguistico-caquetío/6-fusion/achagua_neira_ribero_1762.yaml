arte:
  nota: Del arte (pliegos 7-27) se extrajeron SOLO pronombres y numerales, como se encargo. El resto del
    arte (declinaciones, seis conjugaciones, tratados, los capitulos de «equivocos» y el verbo sustantivo,
    y la lista alfabetica de verbos de los pliegos 23-27) queda sin minar y es material de primer orden
    para una sesion posterior.
  pronombres:
    absolutos:
      fuente: pliego 8, izq. (ultima linea) y der. (arriba) — encabezado «Pronombres absolutos»
      definicion_del_autor: «Estos pronombres son las raices de innumerables verbos, y nombres, pues apenas
        se hallara verbo que no se le llegue algun pronombre inicial, y no se hallara nombre posesivo
        a quien tambien en no se le llegue»
      formas:
      - persona: 1sg
        castellano: Yo
        forma: Nuya
        variante: Nuarra
        pliego: 8
        lado: izq
      - persona: 2sg
        castellano: tu
        forma: Jia
        variante: Jiya / Jirra
        pliego: 8
        lado: der
      - persona: 3sg.m
        castellano: Aquel
        forma: Ria
        variante: riãne / riãde
        pliego: 8
        lado: der
      - persona: 3sg.f
        castellano: Aquella
        forma: Ruya
        variante: Ruãsa / Ruãde
        pliego: 8
        lado: der
      - persona: 1pl
        castellano: Nosotros
        forma: Guaya
        variante: Guarra
        pliego: 8
        lado: der
      - persona: 2pl
        castellano: Vosotros
        forma: Ja
        variante: Jarrà
        pliego: 8
        lado: der
      - persona: 3pl
        castellano: Aquellos
        forma: Naya
        variante: Nãsa / Nani / nãde
        pliego: 8
        lado: der
    iniciales:
      fuente: pliego 8, der. — encabezado «Pronombres Iniciales»
      definicion_del_autor: «Estos conservan p.a la composicion la primera silaba o vocal, y pierden lo
        demas. Llamanse pronombres iniciales, o posesivos, porq.e son los que significan la persona q.e
        posee»
      formas:
      - persona: 1sg
        castellano: Yo / mi
        forma: Nu-
        pliego: 8
        lado: der
      - persona: 2sg
        castellano: tu
        forma: Ji-
        pliego: 8
        lado: der
      - persona: 3sg.m
        castellano: Aquel / su (de el)
        forma: Ri-
        pliego: 8
        lado: der
      - persona: 3sg.f
        castellano: Aquella / su (de ella)
        forma: Ru-
        pliego: 8
        lado: der

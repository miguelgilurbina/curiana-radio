meta:
  obra: neira-ribero-1762
  generado_por: lectura en imagen por el escriba (agente Opus 5), 2026-09-12
  metodo: recortes de media pagina a resolucion nativa (pymupdf sobre el JPG, factor 4,167 px/pt), leidos
    con vision; cada entrada lleva pliego y lado. Ningun OCR intervino.
  etiqueta_propuesta: 'comparanda achagua atestiguada (Neira y Ribero 1762 via copia de 1788). TRANSCRIPCION
    POR VISION: verificar antes de citar como forma exacta'
  advertencia: ESTO NO ES CAQUETIO. Es achagua, arahuaco de los Llanos (Meta/Casanare). Entra como comparanda
    para D11 fase 2, no al lexicon ni al habla de los agentes (regla 5).
  ortografia_del_copista:
    clave_de_lectura: 'EL COPISTA ESCRIBE LA `r` CON UN GLIFO QUE PARECE `z` O `x`. Esta medido en el
      propio manuscrito: el parrafo de «Pronunciacion» (pliego 7, der.) dice «la R no la hacen erre, sino
      r como los Españoles, y asi no dicen Riarrumirre, sino riarrumirre» — y las cuatro palabras estan
      escritas con ese glifo. Glifo simple = r; glifo doble = rr. Aqui se transcribe SIEMPRE como r/rr,
      no como z/x.'
    ese_larga: usa ʃ (s larga) en posicion medial; aqui se transcribe s
    uso_de_v_u: «Vn/Vna» por «Un/Una»; la u vocalica y la v consonantica se distinguen mal
    y_frente_a_i: alterna y/i (`yagicha` ~ `iagicha`; `Jia` ~ `Yia`)
    qu: castellano `q.` = que; `p.a` = para; `p.q.e` = porque; `N.ro` = Nuestro
    abreviaturas: '`v.g.` = verbigracia, `vel` = o (latin), `&` / `&c` = etcetera, `it.` = item'
    nasales: tilde sobre vocal para nasalidad o para n/m omitida (`riãne`, `Ruãde`, `sanã`)
    tildes: acento agudo frecuente y aparentemente prosodico (`Abásu`, `chabí`, `baderriá`)
    separador_de_entrada: guion largo punteado entre castellano y achagua; punto final tras la voz
  estructura_del_manuscrito_medida:
    arte: pliegos 7-27 (prologo, pronunciacion, declinaciones, conjugaciones, tratados, capitulos)
    lista_alfabetica_de_verbos: 'pliegos 23(der)-27 — «Noticias necesarias p.a la perfecta intelig.a de
      la Lengua Achagua. Cap. 1.o Particulas a lo ordinario y verbos de este Idioma, orden Alphabetico».
      NO es el vocabulario: es prosa gramatical con los verbos agrupados por letra. Sin minar todavia.'
    modos_de_decir_uno: pliego 28 (izq., final del arte) — el numeral 'uno' con clasificadores
    vocabulario: pliegos 28(der)-98, castellano → achagua, dos columnas, ~28-30 lineas por pagina
    no_hay_capitulo_de_numerales: verificado pliego a pliego en los 12-23 (son conjugaciones y tratados
      del verbo). Los cardinales hay que sacarlos del vocabulario (Vno, Dos, Tres...), no del arte.

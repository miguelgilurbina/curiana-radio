  pliego: 61
  lado: izq
  letra: E
  ejemplo: En el cielo = Erri irrico, id en, dentro del cielo. En, lo qual y no dentro, q.do es cosa liquida = Jaco
    (En el agua = Vniaco). Quando no es cosa liquida y es local = Naco (En la tierra = Cainabe naco). Quando cosa
    racional = Jnaco; suelen quitar la J (Creer en Dios Padre = Nuebedau Dios Saricanasi Jnaco; Espiritu Santo naco).
    En verbal = cata (En viniendo = Nunucata). En temporal (En el invierno = Vniabeyage)
  nota: 'nota gramatical de los locativos. `Erri irrico` = dentro del cielo: la mejor prueba de que `erri` = cielo'

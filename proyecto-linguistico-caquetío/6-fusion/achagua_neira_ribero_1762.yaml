arte:
  nota: Del arte (pliegos 7-27) se extrajeron SOLO pronombres y numerales, como se encargo. El resto del arte (declinaciones,
    seis conjugaciones, tratados, los capitulos de «equivocos» y el verbo sustantivo, y la lista alfabetica de verbos
    de los pliegos 23-27) queda sin minar y es material de primer orden para una sesion posterior.
  pronombres:
    absolutos:
      fuente: pliego 8, izq. (ultima linea) y der. (arriba) — encabezado «Pronombres absolutos»
      definicion_del_autor: «Estos pronombres son las raices de innumerables verbos, y nombres, pues apenas se hallara
        verbo que no se le llegue algun pronombre inicial, y no se hallara nombre posesivo a quien tambien en no
        se le llegue»
      formas:
      - persona: 1sg
        castellano: Yo
        forma: Nuya
        variante: Nuarra
        pliego: 8
        lado: izq
      - persona: 2sg
        castellano: tu
        forma: Jia
        variante: Jiya / Jirra
        pliego: 8
        lado: der
      - persona: 3sg.m
        castellano: Aquel
        forma: Ria
        variante: riãne / riãde
        pliego: 8
        lado: der
      - persona: 3sg.f
        castellano: Aquella
        forma: Ruya
        variante: Ruãsa / Ruãde
        pliego: 8
        lado: der
      - persona: 1pl
        castellano: Nosotros
        forma: Guaya
        variante: Guarra
        pliego: 8
        lado: der
      - persona: 2pl
        castellano: Vosotros
        forma: Ja
        variante: Jarrà
        pliego: 8
        lado: der
      - persona: 3pl
        castellano: Aquellos
        forma: Naya
        variante: Nãsa / Nani / nãde
        pliego: 8
        lado: der
    iniciales:
      fuente: pliego 8, der. — encabezado «Pronombres Iniciales»
      definicion_del_autor: «Estos conservan p.a la composicion la primera silaba o vocal, y pierden lo demas. Llamanse
        pronombres iniciales, o posesivos, porq.e son los que significan la persona q.e posee»
      formas:
      - persona: 1sg
        castellano: Yo / mi
        forma: Nu-
        pliego: 8
        lado: der
      - persona: 2sg
        castellano: tu
        forma: Ji-
        pliego: 8
        lado: der
      - persona: 3sg.m
        castellano: Aquel / su (de el)
        forma: Ri-
        pliego: 8
        lado: der
      - persona: 3sg.f
        castellano: Aquella / su (de ella)
        forma: Ru-
        pliego: 8
        lado: der
      - persona: 1pl
        castellano: Nosotros / nuestro
        forma: Gua-
        pliego: 8
        lado: der
      - persona: 2pl
        castellano: Vosotros / vuestro
        forma: J-
        pliego: 8
        lado: der
      - persona: 3pl
        castellano: Aquellos / su (de ellos)
        forma: Na-
        pliego: 8
        lado: der
      paradigma_ejemplo:
        base: Padre = Saricanasi (absoluto; pierde el -si al poseerse)
        pliego: 8
        lado: der
        formas:
        - es: Mi Padre
          achagua: Nusaricana
        - es: tu Padre
          achagua: Jisaricana
        - es: su Padre
          achagua: Risaricana
        - es: su Padre de ella
          achagua: Rusaricana
        - es: N.ro Padre
          achagua: Guasaricana
        - es: V.ro Padre
          achagua: Jsaricana
        - es: su Padre de ellos
          achagua: Nasaricana
  numerales:
    advertencia: 'El arte NO tiene capitulo de numerales (verificado pliego a pliego en los 12-23: son conjugaciones).
      Lo unico que da es «Modos de decir uno» al cerrar el arte, pliego 28 izq.: el numeral ''uno'' es `aba-` mas
      un CLASIFICADOR que concuerda con la clase del objeto. Los cardinales del 2 en adelante hay que buscarlos
      en el vocabulario (Dos, Tres, Vno...).'
    uno_con_clasificadores:
      pliego: 28
      lado: izq
      encabezado: Modos de decir uno
      formas:
      - es: Vna puya
        achagua: Abásu puya
        clasificador: aba-su
      - es: Vna luna
        achagua: Abacoa Querrí
        clasificador: aba-coa
        nota: 'segunda pasada: completa por el lema «Mes = Querrí. Vn mes = Abacoa Querrí» (pliego 75 der.)'
      - es: Vna piña
        achagua: Abanai nanana
        clasificador: aba-nai
      - es: Vn tercio
        achagua: Abagia tercio
        clasificador: aba-gia
      - es: Vn hacha
        achagua: Ababai churi
        clasificador: aba-bai
      - es: Vn hombre
        achagua: Abai gua[ne]cataberri
        clasificador: aba-i
      - es: Vn Platano
        achagua: Ababa pratuna
        clasificador: aba-ba
      - es: Vn tigre
        achagua: Abanai chabí
        clasificador: aba-nai
        nota: Jahn da tigre = echave
      - es: Vn Pueblo
        achagua: Abasucu chacarerí
        clasificador: aba-sucu
      - es: Vna pulga
        achagua: Ababai cabenirri
        clasificador: aba-bai
      - es: Vna lanza
        achagua: Ababai chabina
        clasificador: aba-bai
      - es: Vna cucaracha
        achagua: Ababai baderriá
        clasificador: aba-bai
      - es: Vna Camiseta
        achagua: Abagirra Camiseta
        clasificador: aba-girra
        nota: «et sic de vestibus» — y asi con la ropa
      - es: Vna fresada
        achagua: Abagirra fresada
        clasificador: aba-girra
      nota_segunda_pasada: 'El paradigma se repite ENTERO y sin cortes en el pliego 98 izq., bajo «Vna sarta = Abacoa»:
        Abasu (puya), Abanay (piña), Abagia (tercio), Abaí (hombre), Ababa (platano), Ababay (hacha), Abasucu (pueblo),
        Abagirra (camiseta). Alli se leen los finales que aqui entraban en el lomo'
    cardinales:
      estado: recogidos del VOCABULARIO, no del arte; faltan 3, 4, 6, 7, 10 (sus letras no se leyeron)
      clave: 'El sistema es de base 5 sobre la mano: `case` es la mano y `abacase` (una mano) es CINCO. `aba-` =
        uno, `juchama-` = dos. El numeral concuerda con un clasificador segun la clase del objeto contado (ver `uno_con_clasificadores`
        y el paradigma completo de ''dos'').'
      formas:
      - valor: 1
        forma: aba- + clasificador
        pliego: 28
        lado: izq
      - valor: 2
        forma: Juchamata (+ clasificador)
        pliego: 56
        lado: der
      - valor: 5
        forma: Abacase
        pliego: 48
        lado: izq
        nota: «una mano»
      - valor: 8
        forma: Matarritaibacage
        pliego: 78
        lado: izq
      - valor: 9
        forma: Repunicayacaba bacage
        pliego: 78
        lado: izq
      - valor: 11
        forma: Abacaisanaibana (once hombres)
        pliego: 79
        lado: izq
      - valor: 12
        forma: Juchamata naibana (vivientes) / Juchamai ribana / Juchamacase
        pliego: 57
        lado: izq
      - valor: 14
        forma: Repunicaiya cabe naibana (vivientes) / Repunicayacaba rinaba banisi (casas)
        pliego: 46
        lado: der
      - valor: 50
        forma: Suchamatatacai, Suchamacase ritabare
        pliego: 48
        lado: izq
      - valor: 80
        forma: Regamicaiacaba tacai
        pliego: 78
        lado: izq
      - valor: 100
        forma: Abacase tacia
        pliego: 48
        lado: izq
      - valor: 200
        forma: Juchamacase tacay
        pliego: 57
        lado: izq
        nota: «dos manos» + tacay
    clasificadores_de_dos:
      pliego: 56
      lado: der
      nota: el paradigma completo, tal como lo da el manuscrito bajo el lema «Dos»
      formas:
      - clase: general
        forma: Juchamata
      - clase: hombres
        forma: Juchamana
      - clase: palos, casas
        forma: Juchamay
      - clase: mazorcas
        forma: Juchamanay
      - clase: rios
        forma: Juchamaba
      - clase: sartas
        forma: Juchamacoa
      - clase: venados
        forma: Juchamaicu
      - clase: ojos
        forma: Juchamatuisi
      - clase: veces
        forma: Juchamaichana
      - clase: años ó lunas
        forma: Juchamacoca
      - clase: dias
        forma: Juchamai
      - clase: lugares
        forma: Juchamasucu
        pliego: 57
        lado: izq
  verbos:
    fuente: pliegos 23(der)-27 — «Noticias necesarias p[ar]a la perfecta intelig[enci]a de la Lengua Achagua. Cap.
      1.o Particulas à los nombres y verbos de este Idioma, ordine Alfabetico», mas el Cap. 2.o «Del verbo substantivo
      Vyuna» (pliego 26) y el Cap. 3.o «De algunos equivocos de esta lengua» (pliego 27)
    que_es: 'NO es vocabulario: es prosa gramatical. Cada entrada da el verbo y, sobre todo, la particula o el caso
      que rige. Se transcribe con el mismo formato que el vocabulario (castellano, achagua, pliego, lado) y se marca
      con `seccion` a cual de los tres capitulos pertenece. En los equivocos la direccion se invierte: el lema es
      la voz achagua y el `castellano` recoge todas sus glosas'
    aviso_de_alcance: 'la lista alfabetica propiamente dicha corre del pliego 23 der. al 26 izq. y NO recorre todo
      el alfabeto: solo trae A, B, C, D, E, F(G,H), Y, L, N, O, P, Q, R, S, T, V. Del 26 al 27 vienen los capitulos
      2.o y 3.o, que tambien se transcriben aqui'
    cierre_del_arte: «Hasta aquí la cortedad de este breve resumen de las cosas mas esenciales de este Idioma. Pocas
      son las noticias q[u]e van puestas, seg[ún] lo q[u]e la lengua da de sí; pero lo q[u]e va aquí puesto, está
      bien averiguado, y estos principios bien digeridos podrán hacer capaz al Misionero de q[uan]to necesitáre,
      p[ar]a no errar, y mas si toma el estudio del Vocabulario q[u]e es el q[u]e hace Lenguaraces» (pliego 23 der.)
    posesivos_adjetivos:
      fuente: pliego 23 der., regla 5 del tratado de la posesion
      texto_del_autor: «Quando los nombres no son de las quatro clases arriba dhas, se usa p[ar]a la posesion de
        los pronombres adjetivos, q[u]e son Nusina, Jisina, Risina, Rusina, Guasina, Jisina, Nasina. v.g. Cavallo
        = Ema. mi Cavallo = Nusina Ema»
      formas:
      - Nusina (mi)
      - Jisina (tu)
      - Risina (su, de él)
      - Rusina (su, de ella)
      - Guasina (nuestro)
      - Jisina (vuestro)
      - Nasina (de aquellos)
      nota: 'el vocabulario los confirma sueltos: `nusina` ''mio'' (pliego 75 der.), `Risina` ''suyo'' (93 izq.)
        y `Ysina` ''vuestra'' (98 izq.). Y el propio autor da las dos construcciones bajo el lema «Mio»: prefijo
        sobre el nombre (`Nucage`) o particula delante del absoluto (`nusina cagesí`)'
    sufijo_mi:
      fuente: pliego 23 der., regla 6
      texto_del_autor: «Finalm[en]te q[uan]do las cosas salieron del poseedor, se les pone el `mi` q[u]e es nota
        de cosa yà pasada. v.g. mi Padre (supongo q[u]e murió) Nusaricanamí. tu Perro (supongo q[u]e murió) Jisina
        aurimí. et hic de ceteris»
      nota: 'explica de un golpe los cientos de formas en -mi del vocabulario: `Guabasimi` ''alma fuera del cuerpo'',
        `bainacusamí` ''antepasado'', `Camuiminacote` ''año pasado'', `Mancanimí` ''cuerpo muerto'''
    entradas:
    - castellano: Acaboseme
      achagua: Amarra nucha
      pliego: 23
      lado: der
      letra: A
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: Giucha, à ti
    - castellano: Apartar
      achagua: Nanarridau
      pliego: 23
      lado: der
      letra: A
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: Jesu-Christo rinnanimiu naucha abebe Apostolibeni, matarritay Apostolibeni. Apartaronse unos de otros
        entre sí = Nanarrimimiu naucha guacaba
      nota: «Este va con la diccion `yucha` pospuesta, ó à el pronombre, ó à la persona de quien se apartan»
    - castellano: Aver, Avisar
      achagua: Nuibau rinaba
      pliego: 23
      lado: der
      letra: A
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: gibanimiu rinaba nurriu
    - castellano: Burlar de otro
      achagua: Nusebicaidau
      pliego: 23
      lado: der
      letra: B
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: Judiobeni namedanimí ychaba nasebicaba rirru Jesu-Christo. It. los q[u]e le burlaron = Ymedenay nasebicaba
        rirru
      nota: «La persona de quien se hace burla se pone en dativo. Suelen juntar este verbo con `numeda` en oracion
        de verbo determinante y determinado»
    - castellano: Caerse
      achagua: Nucaba
      pliego: 24
      lado: izq
      letra: C
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: Se te cae el sombrero = ricaba giucha caiuba
    - castellano: Dar
      achagua: Nuayu
      pliego: 24
      lado: izq
      letra: D
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: Pilatos rianimí nate (scilicet à los Judios) carmaniurrí Barrabas. Item Nuanimiu rite Simon Cirineo
        irru rirrucabenimí
      nota: «Este suele juntarse con `nate`, ó `rite`»
    - castellano: Deber
      achagua: Numabemiacare
      pliego: 24
      lado: izq
      letra: D
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: Me deben = Numabemiacare nurriu
    - castellano: Desear
      achagua: Numacatayuba
      pliego: 24
      lado: izq
      letra: D
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: Deseo el cielo = Numacatayuba rinaco errí
    - castellano: Esperar
      achagua: Nunenidau
      pliego: 24
      lado: izq
      letra: E
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: Judas coacao rinenidanimí Dios yucha yyabadacan riucha rigicunamí
      nota: «aqui el `yucha` va pospuesto à la persona de quien se espera, y antepuesto à la materia circa quam
        (si es cosa de perdon)»
    - castellano: Enseñar
      achagua: Nuebedau
      pliego: 24
      lado: izq
      letra: E
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: Christo rebedanimiu Apostolibeni richuaní naco dibinicayi
      nota: «La persona à quien se enseña en acusativo; lo q[u]e se enseña con la particula `Naco`»
    - castellano: Futuro
      achagua: su / sa / saba
      pliego: 24
      lado: izq
      letra: F
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: Christo ecu irrausaba rinanacay irrico. Item = Jia nurrusaba Jurichay? Matanumasaba rirru nomedanicay,
        ni daida Apostolibeni
      nota: «El futuro se conoce por esta particula `su`, vel `sa`, vel `saba`, y se puede poner entre el verbo
        y d[ic]ha particula el dativo»
    - castellano: Fortalecer
      achagua: cadananiyi numeda
      pliego: 24
      lado: izq
      letra: F
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: cadananiyi rimedanimiu nababa Jesu-Christo richuaní naco
    - castellano: Futuro (formacion)
      achagua: -su / -saba
      pliego: 24
      lado: der
      letra: F
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: Me ataran = Nubagiusabana. Nubariu 'me quemo' → te quemarás = Gibariusu, vel gibariusaba. Nusirriu
        'apartar' → Os apartareis = Jirriusaba
      nota: «ut plurimum convierte en `su`, ó en `saba` la ultima sylaba de la persona primera del preterito… pero
        si d[ic]ha primera persona acaba en `iu`, la conserva en el futuro». El autor remite a sus propios folios
        15 y 16
    - castellano: Futuro (particula ba)
      achagua: ba
      pliego: 24
      lado: der
      letra: F
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: Chaunia renaricuba guanecataberri Dios gracia. It. Nutemba cubay = tiraré pescado. Caibiuba = Dolerá
    - castellano: Futuro de participio
      achagua: -su
      pliego: 24
      lado: der
      letra: F
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: los travajos q[u]e havia de padecer S[a]n Xavier = Rumicay riatanicaisaba S[a]n Xavier. los travajos
        q[u]e te mostraré = rumicay nuyedamicaysu girru, vel nuyedamicay girrusu
      nota: «tambien el participio de preterito tiene futuro»
    - castellano: Futuro con «que»
      achagua: Rimedacasuba
      pliego: 24
      lado: der
      letra: F
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: que te hará = Rimedacasuba
    - castellano: Huir
      achagua: Nugiayu
      pliego: 24
      lado: der
      letra: H
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: Nerrí ygiayu aurrí ibecha
    - castellano: Hacer
      achagua: Numeda
      pliego: 24
      lado: der
      letra: H
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: Nuirrí tainataca banaca gimedanimiu guarreu (con nosotros) chade?
      nota: «Nota q[u]e dice `guarreu`, y no `guayagicha`»
    - castellano: Yr pasando por algun lugar
      achagua: Nubesonau
      pliego: 24
      lado: der
      letra: Y
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: Santa María ibesonanimiu ribicauba Jerusalem
    - castellano: Y p[ar]a alguna persona
      achagua: Nuenu, rirrumaterre
      pliego: 24
      lado: der
      letra: Y
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: rirrunimí Christo nanumaterre (scilicet Apostoles)
    - castellano: Infinitivo
      achagua: -ca
      pliego: 24
      lado: der
      letra: Y
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: Rebanimicachu nimedaca ecuca rinamí ucuniyi, yabenamí ema irrico. Desp[ués] de haver besado la tierra
        = Nusiduanimiucata Cainabe yabenamí. Mientras bebo = Nuirracata ima irrico
      nota: «Este puede determinar otro infinitivo»
    - castellano: Librar
      achagua: Nucamamidau
      pliego: 25
      lado: izq
      letra: L
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: 'gicamanida uyuái manicaibe yucha. Del adjetivo: Camanicayi inoacan yucha'
      nota: «Aqui el `yucha` va pospuesto à la cosa de q[u]e se libra»
    - castellano: Preguntar
      achagua: Nusatau
      pliego: 25
      lado: izq
      letra: N
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: Nusatau giucha = te pregunto. Preguntales las cosas q[u]e enseñé = Jsatau naucha nuebedanicaimí daida
        naco
      nota: «Este verbo pide esta particula `Jucha` en la persona q[u]e se pregunta… se pone à la cosa preguntada
        esta preposicion `Naco` q[u]e significa `en`. Nota q[u]e aq[uí] `Jucha` en composicion pierde la `J` y se
        junta con todos los pronombres»
    - castellano: Nombre
      achagua: Gidenasí
      pliego: 25
      lado: izq
      letra: N
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: S[a]n Juan rigidenauyu Bautista
      nota: '«Este lo verbalizan»: el nombre se conjuga como verbo'
    - castellano: Naco (con verbo)
      achagua: naco
      pliego: 25
      lado: izq
      letra: N
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: rirraca Naco, el beber = Nuedacananínimiba naco
      nota: «Naco se puede juntar con verbo»
    - castellano: Oir con respeto à alguno
      achagua: Nuemiu cabaunicayi
      pliego: 25
      lado: izq
      letra: O
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: à algunos = Nuemiu cabaunibem
    - castellano: Ocupar
      achagua: Nubabaruedau
      pliego: 25
      lado: izq
      letra: O
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: Edacananicasiba riucha
    - castellano: Preguntar
      achagua: Nusatau
      pliego: 25
      lado: izq
      letra: P
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: 'al q[u]e pregunta = Jsaterru irru. el `Jucha` es ad libitum: Jsatanimium'
      nota: «y añado q[u]e la persona interrogante no admite el `yucha`»
    - castellano: Pedir
      achagua: Nuemau
      pliego: 25
      lado: izq
      letra: P
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: gemau Dios yucha
      nota: «este verbo va acompañado con el `Jucha` pospuesto à la persona à quien se pide»
    - castellano: Perdonar
      achagua: Nuyabaidau
      pliego: 25
      lado: izq
      letra: P
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: giyabaidau guaucha. It. Dios riyabaidanimí riucha S[a]n Pedro
    - castellano: Pensar ó acordarse
      achagua: Nuedacananiuba
      pliego: 25
      lado: izq
      letra: P
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: nuedacananiuba giuchani naco
      nota: «admite `naco` pospuesto à lo pensado»
    - castellano: Que (con verbo determinante)
      achagua: —
      pliego: 25
      lado: der
      letra: Q
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: No sabeis q[u]e siempre hago la voluntad de mi Padre? = Coacao yayurena machuaca numeda nusaricana
        ibabaitacare ya?
      nota: «Aunq[u]e el Romance lleve `que`, ó haya verbo determinante, puede ponerse fuera de Infinitivo el determinado»
    - castellano: Reconvenir, ó avisar
      achagua: Nuibau
      pliego: 25
      lado: der
      letra: R
      seccion: lista alfabetica de particulas y verbos (Cap. 1)
      ejemplo: Nuibau girrau. te aviso de ello = Nuibau rinaba girrau. aquellos los avisaron de ello = Naibanimiu
        nanaba. Avisanos de ello = gibau rinaba guarriu, vel gibau guarriu
      nota: «Aq[uí] `rinaba` se varia conforme se junte con quien se juntare… porq[u]e se declina, y es lo mismo
        q[u]e `rinacucha`»

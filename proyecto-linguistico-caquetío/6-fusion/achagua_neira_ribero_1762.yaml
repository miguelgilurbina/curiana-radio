dudas:
- pliego: 28
  lado: der
  texto: '«Aun, esto es, todavia — Cxxi nãʃa». La inicial parece C (igual que la de `Cataumi`), pero `Crri` no se
    deja pronunciar. Podria ser E. Leido: C[rr]i nãsa'
  resuelta: 'resuelta: sí — «Errí nãsa». La inicial es E (el mismo glifo de `Errí` ''sol'' y `Erí` ''diente''),
    leida a 2,6x contra la B del renglon de arriba'
- pliego: 28
  lado: der
  texto: «A la par conmigo — Nuʃunitẽglu/Nuʃunitẽgua». El final esta emborronado por una correccion del propio copista
  resuelta: 'resuelta: sí — `Nusunitege`. El pliego 80 izq. trae el lema «Para lapar conmigo — Nusunitege», y ademas
    «A lapar van = Nasunitege»'
- pliego: 28
  lado: der
  texto: «A trueque de casabe — Bexxi ibem» + adicion marginal «benixxi». La vocal de la primera silaba (Berri /
    Berru) y el final (ibem / ibeni) no se deciden; Jahn da cazabe = `berri`
  resuelta: 'resuelta: sí — `Berrí ibem`, con adicion marginal `+ benimí`. La B es la misma B redonda de `Bixiti`
    dos renglones abajo; y el pliego 97 der. da «Vn casabe = Abaiba Berrí»'
- pliego: 28
  lado: der
  texto: '«A mi — Nuxiu. A ti = Jixxu». El primero lleva glifo simple (r) y el segundo doble (rr): Nuriu / Jirru.
    Asimetria rara, puede ser descuido del copista'
  resuelta: 'resuelta: sí — no es descuido: la asimetria es sistematica. El pliego 80 izq. da el paradigma entero
    (Nuriu, Jirru, Irru, Ruriu, Guariu, Jarru, Nariu): glifo simple en 1sg/3f/1pl/3pl, doble en 2sg/3m/2pl'
- pliego: 28
  lado: der
  texto: «A escuras — Catabacatata, Catabacami-». La segunda forma queda cortada por el lomo
  resuelta: 'resuelta: parcialmente — a 2,2x se ve que lo que seguia a `Catabacami` es la raya de relleno hasta
    el borde, no una silaba. Queda abierto a que renglon remata la adicion marginal `(taimamata`, que esta a la
    altura de «A escondidas»'
- pliego: 28
  lado: izq
  texto: '«Vna luna = Abacoa Quer-» y «Vn tercio = Abagia ter-», en «Modos de decir uno»: los finales de linea entran
    en el lomo y no se leen enteros'
  resuelta: 'resuelta: sí — `Abacoa Querrí` (por «Vn mes = Abacoa Querrí», pliego 75 der.) y `Abagia tercio` (por
    el paradigma repetido entero en el pliego 98 izq., donde ninguna linea entra en el lomo)'
- pliego: 47
  lado: der
  texto: '«Celestial — [E/C]rrisai» y «Cielo — [E/C]rri» (pliego 48). La inicial es el mismo glifo y se parece a
    la C de `Cataumi`, pero `Crri` no se pronuncia. Se resolvio POR CONTEXTO al llegar a «Sol. = Erri» (pliego 92)
    y «En el cielo = Erri irrico» (pliego 61): es E. Queda anotado porque la lectura del glifo suelto sigue siendo
    ambigua'
  resuelta: 'resuelta: sí — es E, y ya no por contexto solo: la segunda pasada suma `Erí` ''diente'' (55 der.),
    `Eberrí` ''bledo'' (42 izq.), `Enaidasí` ''cuadro'' (51 der.), `Erricaí` ''sebucan'' (93 izq.) y `Errí nãsa`
    ''aun'' (28 der.), todos con el mismo glifo inicial'
- pliego: 46
  lado: der
  texto: '«Casabe — Jerri/Yerri». La inicial es una mayuscula de trazo alto, distinta de la B redonda de `Bania`
    en la linea de arriba. Pero en el pliego 28 («A trueque de casabe — Berri ibem») y en el 79 («Orilla del casabe
    = Berriribiu») la misma voz lleva B. Jahn da `berri`. No se decide: puede ser alografo del copista'
  resuelta: 'resuelta: sí — es B. El pliego 97 der. da «Vn casabe = Abaiba Berrí» con la misma B redonda que `Abaiba`
    dentro del propio renglon. Era un alografo alto de la B, no una J'
- pliego: 78
  lado: der
  texto: «Ojo — Juisi/Tuisi». El lema esta escrito con una mayuscula de trazo grueso que lo mismo vale por J que
    por T. Las formas poseidas del propio renglon (`nutuiba`) y el clasificador numeral `Juchamatuisi` (pliego 56)
    obligan a leer T, pero el glifo no lo dice solo
  resuelta: 'resuelta: sí — es T. Lo obligan `tuisicare` ''lagaña'' y `tuisiyabe` ''lagrima'' (71 der.), `tuisí
    nanaí` ''niñeta del ojo'' (77 der.), `Matuyisa` ''tuerto'' (96 izq.) y `Errutuí` ''bizco'' (97 der.), todos
    con t minuscula inequivoca'
- pliego: 30
  lado: der
  texto: «Acomesar — Numiquinchuanini». El castellano se lee `Acomeʃar`, que no es palabra; por el contexto (va
    entre `Acordarse` y `Acortarse`) y por el achagua (`-chuani` = habla) lo probable es «Aconsejar», pero no se
    transcribe lo que no se ve
  resuelta: 'resuelta: sí — «Aconsejar». A 2,8x lo que parecia `me` es `ns` trabada y lo que parecia `ʃ` es la `j`.
    Lo decide el achagua: `Numiquiu` ''introducir'' (70 der.) + `chuaní` ''habla'' = «meter palabra»'
- pliego: 44
  lado: der
  texto: «Cabuya — Edana rrur[i]». El final entra en el lomo del libro y no se lee entero
  resuelta: 'resuelta: sí — `Edana rrusí`. Y el diagnostico de la primera pasada era erroneo: la linea NO entra
    en el lomo, cabe entera en la pagina. A 2,8x el final es `-sí`. Lo confirma «Cordel — Camarrata, edanarrusí»
    (pliego 50 der.)'
- pliego: 79
  lado: izq
  texto: '«Ormigas grandes, comida de Achaguas = Quiriri». Los tres glifos centrales son r/rr y la vocal entre ellos
    no se distingue: podria ser `Quirriri` o `Quiuri`'
  resuelta: 'resuelta: no — a 3x se ven dos íes acentuadas y un solo glifo r antes de la i final; las lecturas economicas
    son `Quiuirí` o `Quirirí` y el trazo no decide. Tampoco se puede confirmar por repeticion: el pliego 68 der.
    da otras tres voces de hormiga (`Amatare`, `guesí`, `amarí`) y `Cube tayí` para las que se comen, ninguna parecida'
- pliego: 66
  lado: der
  texto: «Haz — Jbain». La voz castellana es corta y la achagua tambien; sin contexto no hay forma de contrastar
    la lectura
  resuelta: 'resuelta: parcialmente — a 2,6x el castellano «Haz» es inequivoco (va entre «Hablador — Cachuanicayi»
    y «Hacha — Chusí») y el arranque achagua `Jbai-` es seguro; lo unico abierto es si el final es `-n` o `-rí`'
- pliego: null
  lado: null
  texto: 'AVISO GENERAL, no una duda puntual: toda la columna achagua se transcribio por vision de una cursiva del
    XVIII. Las confusiones sistematicas a vigilar antes de citar una forma como exacta son r/rr (glifo z-like),
    s larga / r, b/v, y/i, n/u y m/nn. La etiqueta de `meta.etiqueta_propuesta` lo dice: verificar contra la imagen
    antes de usar una forma como dato'
  resuelta: 'sigue en pie, y la segunda pasada le añade una confusion mas: al final de palabra `-sí` (s larga con
    descendente), `-rí` (glifo z-like + i con punto) y `-n` (dos arcos) solo se separan con aumento. Calibrado sobre
    «Amo señor — Guacaresí» y «Amago — Bauricaren» (pliego 34 der.)'
- pliego: 33
  lado: der
  texto: '«Alborotar espantar — Nucarrudau. Enojarse = Numeda ibirri[rri]ca rribaba»: la tirada central de glifos
    r/rr no se deja contar; y las dos adiciones marginales de la pagina («(-ba.», «(una.») no se sabe a que renglon
    rematan'
- pliego: 34
  lado: der
  texto: 'AVISO de calibracion del glifo final (afecta a toda la lectura): al final de palabra, `-sí` (s larga con
    descendente + i acentuada, p.ej. `Guacaresí`), `-rí` (glifo z-like + i con punto, p.ej. `Cuitaminarí`) y `-n`
    (dos arcos, p.ej. `Bauricaren`) SI se distinguen a 2x, pero no siempre al tamano de lectura normal. Verificado
    con zoom sobre «Amo señor — Guacaresí, plur. guacarinasí» y «Amago — Bauricaren»'
- pliego: 37
  lado: der
  texto: '«Arraigar — Cabarriumí, Cadurrum, Cariumí, quesinaumí»: en las dos primeras formas hay una tirada de tres
    glifos z-like seguidos y no se deja contar si son r+rr o rr+r. Leido a 2,2x y sigue sin decidirse'
- pliego: 42
  lado: der
  texto: '«Bomba — Nueda uní = Nuisedauní. darle uonuprà»: la ultima palabra del renglon es castellana y no se deja
    leer (¿«uon uprà»? ¿una abreviatura?)'
- pliego: 80
  lado: der
  texto: '«Pariente por parte de …» (pliego 80 der.): la abreviatura castellana del tercer tipo de pariente no se
    lee ni a 2,6x. Parece «t[?].e»; podria ser «Ti[o]», «M[adr]e» o «T[i]e». Importa: decide si la tercera linea
    de parentesco es la del tio o la de la madre'

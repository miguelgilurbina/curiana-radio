  censo_de_terminaciones:
    que_mide: sobre las formas achagua sueltas de `vocabulario` (separadas por coma, `vel` o `v.`), cuantas acaban
      en cada terminacion. Medido por 6-fusion/scripts/ensamblar_achagua_neira_ribero.py, no contado a mano. `-yi`
      excluye `-cayi` y `-re` excluye `-are/-ure/-ere/-ire`, para no contar dos veces
    formas_contadas: 4546
    por_terminacion:
      si: 461
      ba: 332
      ri: 240
      yi: 194
      mi: 189
      cayi: 187
      na: 182
      are: 64
      re: 19
      ure: 13
      ere: 4
      ire: 2
    are_re_total: 102
    are_re_porcentaje: 2.24
    lectura: Fabo declara `-are`/`-re` «propia y exclusiva» del achagua. Medido sobre el vocabulario entero, la
      terminacion dominante NO es -are sino -si (el absoluto de no-poseido, que cae en cuanto el nombre se posee)
      y -yi/-cayi (adjetival). La -re existe y es real, pero es minoritaria.
  hallazgos_de_la_segunda_pasada:
  - 'EL LEMA «DIENTE» SI EXISTE (pliego 55 der.), con el paradigma posesivo entero sobre la raiz: Erí / Nue / Je
    / re / que / Ne. La primera pasada lo dio por ausente «verificado leyendo 52, 53, 56 y 57», pero los pliegos
    54 y 55 no se habian leido: el cero medía la lectura, no la fuente (regla 6)'
  - 'EL SISTEMA DE NUMERALES QUEDA MEDIDO: base cinco por la mano hasta 20, y vigesimal por encima. `cage` es ''mano'';
    `abacage` cinco = «una mano»; `Abaibacage` seis; `Juchamatabacage` siete; `Juchamage` diez; `Mataritaí naibana`
    trece; `Juchamacage Abaí Ribana` quince («dos manos y un pie»); `Abacaí tacay` veinte; `Abacaí tacaí Juchamacage
    ritabare` treinta; `Juchamatacay` cuarenta; `Mataritaí tacaí` sesenta; `Juchamacage chana abacagetacaí` mil.
    El formante `tacay` vale 20'
  - 'EL CLASIFICADOR DE CLASE NO ES COSA DEL NUMERAL, ES DEL SINTAGMA DE MEDIDA: el mismo juego de clasificadores
    que toma `aba-` ''uno'' lo toman `manu-` ''ancho'' (pliego 35 der.) y `aurre-` ''angosto'' (36 izq.) — -ricu
    casa, -girra ropa, -ba rio, -bai hacha, -su palo, -numa puerta'
  - 'EL AUTOR DISTINGUE ANIMADO DE INANIMADO EN EL PLURAL: «el `na` es nota de 3.as personas de plural, y las cosas
    inanimadas no le tienen, como consta el Arte» (pliego 87 izq.)'
  - '''NACION'' SE DICE CON LA RAIZ DE ''HABLA'': «Nacion, de mi nacion — Guachuanibérri», sobre `chuani`; y el
    plural de «Hombre Racional» es `Guachuanibenay`, «los que hablan». Hay ademas lema para INTERPRETE (`Eberrí
    chuanisí`, pliego 70 der.)'
  - 'EL ESPAÑOL Y EL DUENDE COMPARTEN NOMBRE: «Blanco Español — Guabaymí, Guabaymigeraí. Así llaman los Duendes»
    (pliego 42 izq.), y lo dice el propio autor'
  - 'EL AUTOR MARCA LOS PRESTAMOS: bajo «Morena cosa» anota que `Samoruna` es «hisp[anice] term[inus] hurtado»,
    voz tomada del castellano (pliego 76 der.)'

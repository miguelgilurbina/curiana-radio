dudas:
- pliego: 28
  lado: der
  texto: '«Aun, esto es, todavia — Cxxi nãʃa». La inicial parece C (igual que la de `Cataumi`), pero `Crri`
    no se deja pronunciar. Podria ser E. Leido: C[rr]i nãsa'
- pliego: 28
  lado: der
  texto: «A la par conmigo — Nuʃunitẽglu/Nuʃunitẽgua». El final esta emborronado por una correccion del
    propio copista
- pliego: 28
  lado: der
  texto: «A trueque de casabe — Bexxi ibem» + adicion marginal «benixxi». La vocal de la primera silaba
    (Berri / Berru) y el final (ibem / ibeni) no se deciden; Jahn da cazabe = `berri`
- pliego: 28
  lado: der
  texto: '«A mi — Nuxiu. A ti = Jixxu». El primero lleva glifo simple (r) y el segundo doble (rr): Nuriu
    / Jirru. Asimetria rara, puede ser descuido del copista'
- pliego: 28
  lado: der
  texto: «A escuras — Catabacatata, Catabacami-». La segunda forma queda cortada por el lomo
- pliego: 28
  lado: izq
  texto: '«Vna luna = Abacoa Quer-» y «Vn tercio = Abagia ter-», en «Modos de decir uno»: los finales
    de linea entran en el lomo y no se leen enteros'

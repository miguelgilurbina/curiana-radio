    cardinales:
      estado: recogidos del VOCABULARIO, no del arte; faltan 3, 4, 6, 7, 10 (sus letras no se leyeron)
      clave: 'El sistema es de base 5 sobre la mano: `case` es la mano y `abacase` (una mano) es CINCO.
        `aba-` = uno, `juchama-` = dos. El numeral concuerda con un clasificador segun la clase del objeto
        contado (ver `uno_con_clasificadores` y el paradigma completo de ''dos'').'
      formas:
      - valor: 1
        forma: aba- + clasificador
        pliego: 28
        lado: izq
      - valor: 2
        forma: Juchamata (+ clasificador)
        pliego: 56
        lado: der
      - valor: 5
        forma: Abacase
        pliego: 48
        lado: izq
        nota: «una mano»
      - valor: 8
        forma: Matarritaibacage
        pliego: 78
        lado: izq
      - valor: 9
        forma: Repunicayacaba bacage
        pliego: 78
        lado: izq
      - valor: 11
        forma: Abacaisanaibana (once hombres)
        pliego: 79
        lado: izq
      - valor: 12
        forma: Juchamata naibana (vivientes) / Juchamai ribana / Juchamacase
        pliego: 57

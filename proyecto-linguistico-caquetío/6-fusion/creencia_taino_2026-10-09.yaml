# ─────────────────────────────────────────────────────────────────────────
# PROPUESTA — Lo taíno como comparanda de la CREENCIA caquetía (vía C)
# Minería del 2026-10-09, en el orden de la nota de decisión
#   4-fuentes/sesiones/08_creencia_taino_que-minar.md (§4: A1, A2, A3).
# Bitácora: 4-fuentes/sesiones/09_creencia_taino_mineria.md
#
# El encargo: minar, sin descargar nada, (1) Oviedo a las dos orillas —
# t. I lib. V (La Española) frente a t. II lib. XXV cap. IX (Venezuela),
# con el test de plantilla y la efigie del díao—; (2) Pané cotejado con sus
# testigos del repo (Las Casas, Anglería, Hernando Colón 1892 vol. 2) por
# huesos, muertos, médico, tiempo y cohoba; (3) Steward y Rouse 1948 (HSAI
# 4), rasgo por rasgo, las «certain specific resemblances».
#
# Regla de capas (Miguel, 2026-10-09, opción C): lo NUEVO entra con la
# regla estricta del lexicón —`reconstruido` sólo si lo dan DOS tradiciones
# arahuacas independientes; con una sola, `hipotetico`; si sólo ilumina un
# hecho caquetío ya atestiguado, va como `lectura` sin cambiarle la capa—.
# Lo wayuu de la Vía A se queda como comparanda y se audita (§auditoria_via_a).
# `no-se-propone` = el hecho se registra (negativa o contraste) pero no se
# pide que entre al corpus.
#
# Regla 5: esto PROPONE. No toca 3-mundo/corpus/, curiana_sim/, el lexicón,
# el ensayo ni ningún índice. Ninguna voz ni teónimo taíno pasa al lexicón por
# esta vía: se citan como fuente de la analogía (decisión 5 del ensayo).
# Regla 3: Pané (1494-1498), Anglería (1516), Oviedo (1535-1548) y Las Casas
# (c. 1527-1559) son de CONTACTO; cada hecho dice qué describe y cómo se
# escribió. Regla 4: La Española no es la Kaketiana.
# Regla 1: `meta.medido` y `meta.cuenta_por_capa` los escribe
#     python 6-fusion/scripts/medir_plantilla_oviedo.py --conteos
# y el mismo script, sin bandera, valida este archivo (ids, capas, toda
# `fuente` en 4-fuentes/bibliografia.yaml, todo `via_a` en creencia.yaml).
#
# Copyright: la retraducción de Pané de Wikisource puede no ser de dominio
# público (aviso de Wikisource): de ella sólo se citan formas y frases
# cortas; lo demás se resume. Oviedo 1851-1855, Las Casas 1909, Anglería
# 1892, Colón 1892 y el Handbook (gobierno de EE. UU., 1948) son de dominio
# público.
# ─────────────────────────────────────────────────────────────────────────
meta:
  recogido: '2026-10-09'
  estado: sin-fusionar
  quien: 'minero del taíno para la creencia (Claude Opus 5.5)'
  rama: vault/creencia-mineria-taino
  plan: 4-fuentes/sesiones/08_creencia_taino_que-minar.md
  bitacora: 4-fuentes/sesiones/09_creencia_taino_mineria.md
  pregunta: >-
    ¿Qué rasgos de la religión taína de época de contacto sobreviven al bajar
    a las primarias del repo, y qué hacen frente a la creencia caquetía:
    corroboran, afilan por contraste o no tocan? ¿Y qué queda de la hipótesis
    de una religión arahuaca compartida (Las Casas p. 321; Steward 1948 p. 21)?
  respuesta_corta: >-
    Una sola semejanza específica sobrevive en las dos orillas con primaria:
    la imagen de madera del muerto principal. El caquetío la pone «á su
    semejança» bajo la hamaca del díao desecado y la QUEMA con él años después,
    y bebe los huesos (Oviedo t. II p. 300); el taíno mete los huesos de sus
    señores en una estatua de madera que lleva el NOMBRE del muerto y la
    conserva y la hace hablar (carta de Colón vía Las Casas p. 321; Pané cap.
    XV). Misma clase de objeto, destino contrario: el contraste afila lo
    caquetío y contradice que la disolución del muerto (creencia-010d) sea
    arahuaca general. Lo demás de Steward cae al bajar a la primaria: el
    adoratorio y el sacrificio son axaguas de Barquisimeto, la adivinación con
    ceniza de tabaco no tiene par taíno, beber los huesos no es taíno (Oviedo
    mismo lo llama costumbre de Tierra Firme), y el poder sobre el tiempo está
    en la persona del señor caquetío y en los cemíes del taíno. El test de
    plantilla da un resultado doble: Oviedo NO copió el texto de La Española
    (solapamiento de bigramas igual al de un control caribe), pero sí le puso
    a los tres pueblos el mismo marco —el especialista encerrado que consulta
    al diablo, y Plinio sobre medicina y magia— y sus fórmulas de tabaco y
    hamaca. Lo que Oviedo no tenía en su plantilla de La Española —el funeral
    del díao y la secuencia de la cura, con «le allega el alma á un cabo»— es
    testimonio venezolano; y la secuencia de la cura (juntar el mal con las
    manos, despedirlo con un soplo y una palabra, chupar, mostrar el objeto)
    tiene par en las tres cadenas taínas.
  como_se_midio: >-
    (A1) Oviedo t. I lib. V caps. I-III (impresas 124-140) y t. II lib. XXV
    cap. IX (296-302) leídos enteros en la capa OCR con el guion de fin de
    línea deshecho; t. I y t. II completos sondados (huess-, enxug-, brasa,
    enterr-, plinio, magic-); los pasajes marcados «imagen» se vieron con
    pymupdf; el
    solapamiento de bigramas, con dos controles del mismo autor, lo mide
    6-fusion/scripts/medir_plantilla_oviedo.py. (A2) Pané-Wikisource caps.
    IX-XXV leídos; Las Casas, Apologética caps. CXX (pp. 320-323), CLXVI-CLXVII
    (pp. 444-447) y la p. 535 leídos;
    Anglería vol. 1 Déc. I lib. IX (pp. 339-360) entero; Hernando Colón 1892 vol. 2 pp. 1-12 (el final de la
    Escritura de fray Román) entero. (A3) Steward pp. 21-24 (la p. 21 en
    imagen) y Rouse «Life cycle», «Religion» y «Shamanism» (pp. 531-538),
    cada afirmación bajada a la primaria del repo.
  desfases_medidos: >-
    Oviedo t. I copia íntegra: índice pdf (base 0) = impresa + 119, es decir
    pdf 245 = impresa 125 (cabeceras de las pp. 120-150). Oviedo t. II:
    índice = impresa + 13 (pdf 311 = impresa 297); la impresa 255 trae el
    folio «525» por errata de imprenta (254 y 256 la rodean). Las Casas
    1909: pdf = impresa + 14. Anglería vol. 1: pdf = impresa + 64. HSAI 4:
    pdf 45 = p. 21, pdf 48 = p. 24, pdf 676 = p. 532.
  # ── lo escribe `python 6-fusion/scripts/medir_plantilla_oviedo.py --conteos`;
  #    no se edita a mano (regla 1). ──

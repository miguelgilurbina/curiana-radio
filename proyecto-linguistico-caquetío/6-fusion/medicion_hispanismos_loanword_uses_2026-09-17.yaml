# ══════════════════════════════════════════════════════════════════════
# C. ¿Dentro de la frase caquetía o en la glosa castellana?
# ══════════════════════════════════════════════════════════════════════
c_donde_cae_el_uso:
  metodo: >-
    Por ocurrencia. Si cae dentro de un paréntesis, el scorer ni la ve
    (`_normalizar` los borra). Si no, se pesa el segmento que la contiene:
    más vecinos arahuacos que funcionales castellanos → frase caquetía; al
    revés → glosa o acotación castellana; empate → mixto.
  hallazgo_1: >-
    El préstamo DE VERDAD vive dentro de la frase: `watapana` sale 29 veces en
    frase caquetía y 11 en castellano, y sus formas con morfología
    (`ka-watapana`, `ta-watapana`, `ta-casabe`, `ta-ture`, `ta-yuca`,
    `ta-bohío`) salen SIEMPRE dentro de la frase, 13 de 13. Ahí la lengua está
    haciendo algo con la raíz ajena, que es exactamente lo que la medición
    quiere ver.
  hallazgo_2: >-
    El hispanismo se parte, y `yuca` y `maíz` caen del lado castellano —
    yuca 9 en frase contra 28 en glosa, maíz 7 contra 13. Los tres usos del
    día 1 de la serie B son acotación escénica: «*[Sentada en la sombra…
    Las manos ocupadas limpiando yuca.]*» (Harifuche), «*[Me incorporo del
    trabajo de ralladura, las manos blancas de yuca.]*» (Uria). El corchete
    NO es paréntesis: `_normalizar` sólo borra `(...)`, así que la acotación
    puntúa como si fuera habla.
  hallazgo_3: >-
    `casabe` es el caso mixto (51 en frase, 23 en glosa) y el más frecuente de
    la base, 58 respuestas. Dentro de la frase se comporta como sustantivo
    caquetío —«Casabe kaa-ni wara amana-ni», «Wara masa-da buri-kana saa
    casabe kaa-ni»—, y por eso es la voz que más pide una decisión de Miguel:
    es la única de las cinco donde el caquetío NO tiene forma propia (ver D).
  residuo_declarado: >-
    39 de las ocurrencias de `casabe` y 13 de las de `watapana` caen dentro de
    un paréntesis y el scorer no las cuenta. No es un defecto de esta
    medición: es cómo está hecho el scorer, y se anota para que no se lea el
    conteo como «cuántas veces se dijo la palabra».

# ══════════════════════════════════════════════════════════════════════
# D. ¿Tiene el caquetío voz propia para esto?
# ══════════════════════════════════════════════════════════════════════
# El campo de la glosa se llama `sig` en las 5.514 entradas; las entradas
# viejas traen además `es`, y `LexicoComunitario.significado()` lee
# `sig or es`. La búsqueda es por glosa, no por forma.
d_voz_propia_caquetia:
  maíz:
    hay_voz_propia: true
    forma: marisi
    capa: caquetío-hipotético
    glosa: maíz en mazorca, grano de cosecha
    alrededor: >-
      Y todo un campo léxico atestiguado que la presupone: `amaka` 'sitio de
      moler maíz', `harifuche` 'maíz tostado y miel', `kasá` 'puche de maíz',
      `buriche` 'chicha de maíz', `budare` (retroabstraída) 'plato para cocer
      el pan de maíz'.
  yuca:
    hay_voz_propia: true
    forma: kasiripa
    capa: caquetío-hipotético
    glosa: yuca brava, mandioca para casabe
  casabe:
    hay_voz_propia: false
    lo_mas_cerca:
      - {forma: bureche,  familia: caquetío,        glosa: bebida fermentada de casabe}
      - {forma: kasiripa, familia: caquetío,        glosa: 'yuca brava, mandioca para casabe (el tubérculo, no el pan)'}
      - {forma: berrí,    familia: proto-arahuaco,  glosa: 'Casabe (vía achagua — otra polity, regla 4)'}
      - {forma: kasabi,   familia: lokono,          glosa: 'casabe, pan de yuca'}
    lectura: >-
      El pan de casabe no tiene forma caquetía en el lexicón. Hay hueco, y es
      un hueco con pinta de deuda: el alimento base del área lo nombran el
      taíno, el lokono, el kalinago y el achagua, y el caquetío no.
  el_giro_que_importa: >-
    Las DOS voces propias (`marisi`, `kasiripa`) son de la capa
    `caquetío-hipotético`, y el perfil `era2` esconde esa capa a propósito
    (decisión 2026-09-14: «escondemos las 38 hipotéticas»). O sea que en la
    serie B el agente NO tiene palabra caquetía visible para maíz ni para
    yuca, mientras la GLOSA de media docena de voces que sí ve le repite
    «maíz» en castellano. No estaba eligiendo el préstamo sobre lo propio:
    no tenía lo propio delante.

# ══════════════════════════════════════════════════════════════════════
# E. ¿De dónde le llega al agente la palabra castellana?
# ══════════════════════════════════════════════════════════════════════
e_de_donde_le_llega:
  metodo: 40 prompts por tier, semilla 20260917, contexto rotando entre cinco temas
  apariciones_en_el_prompt:
    casabe: {t1: 11, t2: 5, t3: 1}
    maíz:   {t1: 23, t2: 12, t3: 10}
    yuca:   {t1: 8, t2: 3, t3: 0}
    batata: {t1: 2, t2: 0, t3: 0}
    papaya: {t1: 2, t2: 0, t3: 0}
    watapana: {t1: 0, t2: 0, t3: 0}
  lectura: >-
    El tier 2 y el tier 3 NO ven el bloque [Voces de fuera] (hay test que lo
    fija), y sin embargo «maíz» les aparece en 12 y 10 de 40 prompts. Llega
    por la GLOSA del propio diccionario: `harifuche` = «maíz tostado y miel»,
    `amaka` = «sitio de moler maíz», `budare` = «plato para cocer el pan de
    maíz». El metalenguaje del lexicón es castellano, y el agente lo copia.
    Eso es el hispanismo, no un préstamo.
  el_bloque_voces_de_fuera:
    candidatas: 50
    de_esas_hispanismos: 9      # aji auyama batata huracan manati maíz papaya piragua yuca
    lectura: >-
      El bloque que existe para enseñarle al tier 1 lo que sabe por su trato
      con las islas le está enseñando NUEVE palabras castellanas: «maíz =
      planta de maíz (los de las islas)», «yuca = tubérculo». `casabe` no está
      —el filtro de autoglosa de 2026-09-16 ya lo saca— y aun así es la voz
      más usada de la base, lo que confirma que la vía principal no es el
      bloque sino el castellano del propio modelo.
    NO_se_toca_aqui: >-
      Quitar esas nueve del bloque cambiaría lo que el agente VE a mitad de la
      serie B. Queda propuesto, no hecho.

# ══════════════════════════════════════════════════════════════════════
# LA PROPUESTA
# ══════════════════════════════════════════════════════════════════════
propuesta:
  que_se_hace_hoy: >-
    Una lista nueva y declarada, `HISPANISMOS_DE_ESFERA`, en
    `curiana_lexicon.py`. Un token PELADO que esté en ella y cuya familia sea
    de la esfera deja de contarse en `prestamos_de_esfera` y pasa a un tercer
    cubo, `hispanismos_de_esfera`: ni préstamo ni fuga.

  por_que_no_se_amplia_CASTELLANO_CORRIENTE:
    resumen: porque mueve el score, y el scorer no se toca a mitad de serie
    detalle: >-
      `CASTELLANO_CORRIENTE` es el sitio semánticamente correcto: es la misma
      intuición que resolvió `cacique`, `taita` y `bohío` el 2026-09-16. Pero
      una voz de esa lista deja de ser arahuaca (`es_arahuaco` devuelve False),
      sale de `usadas` y baja la `densidad`, que pesa 6 de los 10 puntos del
      score. Sobre esta base eso movería el score de 147 respuestas, y la
      serie B ya empezó. `HISPANISMOS_DE_ESFERA` hace lo mínimo: el token
      sigue contando igual en densidad, en `palabras_arahuacas` y en
      `otro_arahuaco`, y sólo deja de llamarse préstamo.
    verificado: >-
      Con la lista vacía —que reproduce el comportamiento anterior byte a
      byte— frente a la lista real, sobre las 2.515 respuestas: 0 cambian en
      score, densidad, pct_caquetio_especifico, otro_arahuaco,
      espanol_funcional, palabras_caquetias, palabras_arahuacas,
      palabras_otro_arahuaco ni aspectos_usados. Lo único que se mueve es
      `prestamos_de_esfera`: 147 respuestas → 50.
    residuo_declarado: >-
      El hispanismo SIGUE sumando densidad arahuaca, que no es lo que uno
      querría. Es el precio de no tocar el instrumento, y es la razón por la
      que la lectura limpia —pasarlos a CASTELLANO_CORRIENTE— queda propuesta
      PARA EL CORTE DE SERIE.

  criterio_de_admision: >-
    La ORTOGRAFÍA de la clave. El lexicón ya lo tenía escrito en sus propias
    notas: `maisi` dice «→ español maíz» y `cazabi` «→ español cazabe» — ahí
    la clave es la forma indígena y el castellano es OTRA palabra, así que
    escribir `maisi` SÍ es hablar taíno. La clave `maíz`, en cambio, ES la
    palabra castellana. Por eso `maisi`, `cazabi`, `cacike`, `iwana`, `hutia`
    y `tabako` siguen siendo préstamo. Y por eso `watapana` sigue entero:
    el castellano no dice watapana, dice dividivi.

  lista_propuesta:              # 13 voces, todas clave de VOCABULARIO_BASE con familia de la esfera
    medidas_en_la_base: [casabe, yuca, maíz, batata, papaya]
    no_medidas_pero_del_mismo_caso: [aji, auyama, caiman, cayo, guayaba, huracan, manati, piragua]
    por_que_las_no_medidas: >-
      Son claves de la esfera que el castellano usa como propias y que el
      scorer contaría igual en cuanto un agente las escriba. Dejarlas fuera
      sería esperar a que el falso positivo vuelva a pasar para arreglarlo.

  dudosas_que_quedan_FUERA:     # en duda, degradar: siguen contando como préstamo
    - {voz: ture,    razon: 'voz de Cumaná y Margarita (Alvarado 1921 p.301), marginal en el castellano de Paraguaná; y el uso medido la glosa «hambre», que no es su referente', usos_en_la_base: 4}
    - {voz: pauji,   razon: 'el castellano `paují` es el ave; esta clave es un ÁRBOL (Bumelia buxifolia, D10) — no es el mismo referente', usos_en_la_base: 1}
    - {voz: cobo,    razon: 'antillano, no venezolano', usos_en_la_base: 0}
    - {voz: guabina, razon: 'regionalismo de pez; corriente en Venezuela, pero no general', usos_en_la_base: 0}
    - {voz: caney,   razon: 'en Venezuela es un cobertizo; aquí está glosada en su sentido etnográfico taíno («bohío rectangular del cacique»)', usos_en_la_base: 0}
    - {voz: manigua, razon: 'el DRAE lo marca cubano', usos_en_la_base: 0}
    - {voz: tuna,    razon: 'la clave taína glosa «agua, río»; el `tuna` castellano es el fruto del cactus — homógrafo, no el mismo referente', usos_en_la_base: 0}

  lo_que_NO_es_hispanismo_y_salio_igual:
    - voz: pira
      clase: falso-positivo-por-nombre
      usos_en_la_base: 6
      que_pasa: >-
        `Pira` es como los agentes acortan a **Pira-sha**, del elenco de la era
        1, y colisiona con la clave kalinago `pira` 'pez'. El filtro de nombres
        (`_filtrar_nombres`) compara el nombre ENTERO, así que el hipocorístico
        se le escapa. Medido: «escucho a Pira enseñando a las jóvenes»,
        «Pia-sha Pira, pia-sha Cahu». No se arregla aquí —es otra trampa, la de
        los nombres, y tocarla movería `palabras_caquetias`—, pero queda
        escrito: son 6 de las 147 respuestas.

  como_se_leen_los_runs_ya_corridos:
    principio: >-
      La base NO se reescribe. Una fila de `loanword_uses` es un hecho
      observado; lo que significa lo decide quien lee. Reescribirla borraría
      el rastro de que el motor un día contó esto como préstamo.
    implementado: >-
      `analizar_runs.py --prestamos` filtra al LEER, con la misma lista
      declarada que usa el motor más `CASTELLANO_CORRIENTE` (para las filas
      `bohío` y `cacique` que quedaron escritas antes del arreglo del 09-16).
      Va en el SQL de las tres consultas y en la vista por cadena
      (`LectorSQL.prestamos(..., excluir=…)`). Antes de la primera tabla
      imprime cuántas filas deja fuera y cuáles, para que el filtro no sea
      callado.
    escotilla: '--con-hispanismos los devuelve a la vista'
    efecto_medido: 8 de las 11 filas quedan fuera; la vista pasa a mostrar 3 usos, los 3 préstamos de verdad

  para_que_decida_Miguel:
    - >-
      ¿`casabe` entra en la lista, sabiendo que el caquetío NO tiene forma
      propia para el pan (D) y que 51 de sus ocurrencias van dentro de la
      frase caquetía (C)? Es la voz donde «hispanismo» y «préstamo de verdad»
      más se tocan. Hoy entra; se puede sacar sin tocar nada más.
    - >-
      ¿Se pasan las 13 a `CASTELLANO_CORRIENTE` en el corte de serie? Es la
      lectura limpia y cuesta 147 scores.
    - >-
      ¿Se quitan del bloque [Voces de fuera] las 9 hispanismos (E)? Cambia lo
      que el agente ve, así que es cosa de corte de serie también.
    - >-
      ¿Se sube `marisi` y `kasiripa` de hipotéticas, o se acepta que la era 2
      corra sin palabra caquetía para maíz y yuca (D)?
    - >-
      El hueco de `casabe`: ¿se abre deuda para buscarle forma caquetía en
      fuente, o se declara que el préstamo ES el dato?
    - '¿`ture` y `pauji` entran, se quedan fuera, o se les corrige la glosa?'

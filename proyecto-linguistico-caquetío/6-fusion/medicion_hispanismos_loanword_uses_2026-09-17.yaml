# ─────────────────────────────────────────────────────────────────────────
# `loanword_uses` no estaba midiendo préstamos: estaba midiendo castellano.
#
# El día 1 de la serie B de la era 2 (run 3973d317, 2026-09-17) la tabla
# guardó 7 usos y los 7 eran hispanismos de origen indígena escritos COMO
# castellano: «Las manos ocupadas limpiando yuca» (Harifuche, tier 2), «Maíz,
# yuca ta-kana» (Hiko, tier 2), «Casabe kaa-ni wara amana-ni» (Kunaro-bana,
# tier 1). El agente no toma prestada una voz de las islas: escribe la palabra
# que el castellano tomó prestada hace cinco siglos y usa como propia.
#
# Medido sobre TODA la base, no sobre el día: 147 de las 2.515 respuestas
# llevan préstamo de esfera y 111 de las 161 formas-respuesta (69,0%) son una
# de cinco voces — casabe, yuca, maíz, batata, papaya.
#
# Esto PROPONE, no decide. El código de la rama hace lo mínimo que arregla el
# dato sin tocar el instrumento; lo que cambiaría el score se deja escrito
# aquí para el corte de serie.
# ─────────────────────────────────────────────────────────────────────────
meta:
  medido: '2026-09-17'
  autor: sesión de deuda del día 1 de la serie B (run 3973d317)
  corpus: >-
    Las 2.515 respuestas de `agent_responses` del Supabase local (33 runs,
    2.071 de la era 1 y 444 de la era 2), re-puntuadas con `score_linguistico`
    tal como está hoy; y las 11 filas de `loanword_uses`, que sólo cubren los
    tres últimos runs porque la tabla nació con la migración 20260916000000.
  script: 6-fusion/scripts/medir_hispanismos_loanword_uses.py
  como_se_corre: >-
    Cada era se mide con SU elenco, porque `score_linguistico` filtra los
    nombres del elenco activo: `python 6-fusion/scripts/…` para la era 1 y
    `CURIANA_ELENCO=era2 python 6-fusion/scripts/…` para la era 2.
  aviso: >-
    La medición E (qué ve el agente en su prompt) sortea; el script fija
    `random.seed(20260917)` para que la cifra se pueda volver a sacar. Es una
    medida de orden de magnitud, no un censo.


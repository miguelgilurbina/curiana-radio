conciliacion_con_morfologia_11:
  lo_que_dice_morfologia_11: 1.107 usos de ta-/ma-/wa- + 25 de ka- = 1.132
  lo_que_sale_hoy: 960
  diferencia: 172
  explicada_por_178:
    que_es: '#178 (2026-09-20) repartió las 49 raíces de Zavala que la heurística de tier había hecho `v_raiz` en bloque'
    raices_que_dejaron_de_ser_verbales: 30
    usos_que_ya_no_cuentan: 172
    por_prefijo:
      ta-: 74
      ma-: 58
      wa-: 34
      ka-: 6
    formas: 36
    muestra:
      - ka-dichiba
      - ka-juri
      - ka-kana
      - ka-popoi
      - ma-baharuko
      - ma-dichiba
      - ma-hueke
      - ma-juri
      - ma-kana
      - ma-kapo
      - ma-kibakibi
      - ma-kiricias
  aparte_lo_archivado_por_d19b:
    que_es: '`paa` y `kira` salieron a FUERA_DEL_HABLA y sus formas no cuentan en ninguna de las dos mediciones'
    usos:
      paa: 36
      kira: 5
  lectura: 'las dos cifras son correctas para SU estado del lexicón. La de hoy es la del canon en main, y es la que debe escribirse en §11 — con `ka-juri` fuera, que es justamente lo que d21.5 quería'

# ══════════════════════════════════════════════════════════════════════
# FEDERMANN 1530-1531 — la gente de la costa: Paraguaná y Coro
# Tercera campaña de minería («las fuentes que faltan»), 2026-09-22.
#
# PROPUESTA (regla 5). Nada de aquí entra al canon sin que Miguel lo fusione.
# No toca 3-mundo/, 2-lengua/ ni curiana_sim/.
#
# ⚠️ ESTO NO ES PRECONTACTO (regla 3). Federmann pisa Paraguaná en enero de
# 1530, tres años después de Ampíes y con la trata de esclavos ya en marcha
# (él mismo lo dice). Todo lo de aquí es `contacto-temprano` y no se proyecta
# al s. XIV-XV sin decidirlo.
#
# ⚠️ REGLA 4. Los caps. VIII y XII son los caquetíos del INTERIOR
# (Barquisimeto y el valle del Yaracuy): van en su propia sección, marcados
# `polity: interior`, y nunca como dato de la costa.
# ══════════════════════════════════════════════════════════════════════
meta:
  parcela: "Minería 3 — Federmann (1530-1531): Paraguaná y Coro"
  fecha: 2026-09-22  # empezada el 22, cerrada el 23
  encargo: 6-fusion/issues-pendientes/encargo-mineria-federmann.md
  obra: federmann-1916          # clave foránea → 4-fuentes/bibliografia.yaml (regla 8)
  ficha: 4-fuentes/federmann-1916.md

  # ─────────────────────────────────────────────────────────────────
  # La cadena de transmisión: CUATRO eslabones, no tres
  # ─────────────────────────────────────────────────────────────────
  cadena_de_traduccion:
    - eslabon: 0
      que: "diario notarial en castellano, escrito sobre el terreno (perdido)"
      donde_se_dice: >-
        Federmann al cerrar el viaje: un notario público lo anotó todo «de una
        en otra aldea» y él sólo lo tradujo al alemán, «agregando algunas
        circunstancias» (1916 p. 122; alemán Klüpfel p. 80, 1557 [113]-[114]).
      consecuencia: >-
        El alemán YA es una traducción. Las voces que Federmann glosa con
        «also heissen…» (canoa, hamaca, barbacoa, buhio, mahys) son el
        vocabulario antillano del escribano castellano, no necesariamente lo
        que decían los caquetíos (ver `lengua` fed-len-005).
    - eslabon: 1
      que: "Indianische Historia, Hagenau 1557 (póstuma, la edita el cuñado Kiefhaber)"
      archivo: fuentes_caquetios/Federmann_1557_Indianische_Historia.pdf
      como_se_leyo: >-
        En imagen (pymupdf, recortes a 220-400 ppp), sólo donde una forma
        decidía algo. Sin paginar: se cita por la página entre corchetes que
        Klüpfel 1859 marca en su texto ([n]) y por la IMAGEN del PDF (1-based).
      desfase_medido: >-
        imagen = [n] + 10 entre [9] y [48] (medido en [9], [13], [14], [19],
        [24], [35], [46], [47], [48]) e imagen = [n] + 12 en [111]-[112]: NO es constante,
        entran láminas o blancos entre medias. Se mira la imagen, no se suma.
    - eslabon: 1b
      que: "reedición alemana de Klüpfel, Stuttgart 1859, tipo romano"
      archivo: fuentes_caquetios/Federmann_Kluepfel_1859_Reisen_texto_aleman.txt
      desfase_medido: "impresa = pdf − 8 (comprobado en p. 15 → pdf 23 y p. 82 → pdf 90)"
      calidad: >-
        OCR legible pero con errores justo en los nombres: `Ruynari` por
        Buynari, `Caquelios`/`Caqnetios` por Caquetios, `Tohtietsch` por
        Tolmetsch. Toda forma que se propone abajo se miró en 1557.
    - eslabon: 2
      que: "traducción francesa de Henri Ternaux-Compans, 1837"
      aviso: >-
        🔴 NORMALIZÓ LOS NOMBRES PROPIOS. Nota del traductor francés que Arcaya
        reproduce (1916 p. 124): Federmann «varía casi a cada página y nosotros
        los escribimos constantemente lo mismo». Ninguna grafía de la 1916 es
        la de Federmann hasta cotejarla.
    - eslabon: 3
      que: "traducción castellana de Pedro M. Arcaya, Caracas 1916"
      archivo: fuentes_caquetios/Federmann_1916_Narracion_Primer_Viaje_Arcaya.txt
      desfase_medido: "impresa = pdf − 10 (comprobado en p. 10 → pdf 20 y p. 124 → pdf 134)"
      aviso: >-
        Arcaya lo declara en la p. 2 (no sólo en la nota de la p. 20 que cita
        la ficha): «Hemos hecho la traducción española siguiéndonos por la
        versión francesa citada, pues no hemos podido obtener ningún ejemplar
        del texto alemán». Sus notas identifican lugares con nombres de 1916:
        eso es Arcaya, no Federmann, y va marcado como tal.

  como_se_cita_cada_dato: >-
    `eslabon_que_lo_da`: 1557 (imagen verificada) › Klüpfel (texto, sin imagen)
    › 1916 (sólo la traducción). La página impresa de `pagina_impresa` es
    SIEMPRE la de la 1916 (la de la clave federmann-1916); la del alemán va en
    `aleman`.

  que_se_leyo: >-
    1916 entera por sondas y, de corrido, pp. 1-38 (nota, dedicatoria, caps.
    I-V), 56-64 (fin del VII y cap. VIII), 107-110 (cap. XII) y 119-126 (fin
    del XIII, XIV y principio del XV). Alemán Klüpfel de corrido pp. 9-18,
    34-37, 70-72 y 79-81, y por sondas el resto del tramo de Federmann
    (pp. 5-82). 1557 en imagen: [9], [13], [14], [19], [24], [35], [46],
    [47], [48], [111], [112].
  que_no_se_leyo: >-
    De corrido NO: caps. VI-VII (Cayones, Xaguas) salvo su final, IX-XI
    (Cuybas, Guaycaríes, la laguna) y XIII salvo su final; se barrieron sólo
    con las sondas de fauna, lengua, creencia y etnónimos. Tampoco el
    apéndice biográfico de Klüpfel (pp. 199 ss.).

  # ─────────────────────────────────────────────────────────────────
  # LO PRIMERO: qué del encargo (y del repo) resultó falso al medirlo
  # ─────────────────────────────────────────────────────────────────
  lo_que_resulto_falso:

  - afirmacion: >-
      Las citas de segunda mano del interior, con sus páginas (ficha
      federmann-1916 y 6-fusion/polities_no_costeras_federmann.yaml,
      prop-polity-001 a 005, vía Brito Figueroa): «23 aldeas… treinta mil
      hombres… fortificadas… cuatro naciones» en «pp. 109-110» y «veinte mil
      guerreros… misma nación… confederaciones… cinco y hasta ocho familias»
      en «pp. 62-63».
    medido: >-
      LAS PÁGINAS ESTÁN CAMBIADAS. Las 23 aldeas, los 30.000 hombres y las
      aldeas fortificadas son de las pp. 62-63 (cap. VIII, Barquisimeto); los
      20.000 guerreros, «la misma nación», las confederaciones y las cinco a
      ocho familias por casa son de las pp. 109-110 (cap. XII, Vararida = el
      valle del Yaracuy según Arcaya p. 107 n.). Las etiquetas de polity de
      polities_no_costeras_federmann.yaml están bien; las páginas, al revés.
      El texto de las citas coincide con la 1916 salvo las elisiones (abajo).

  - afirmacion: >-
      La cita estructural «de la misma nación, no están bajo el dominio de un
      solo señor […] forman pequeñas confederaciones de dos, tres o cuatro
      aldeas» (ficha y prop-polity-004).
    medido: >-
      El «[…]» funde DOS grupos. Entero (1916 p. 109): tras «un solo señor»
      viene «Tan numerosos son… podrían resistir un gran número de cristianos.
      No sucede lo mismo con los demás habitantes del valle en el cual nos
      encontrábamos; no están todos aliados, pero forman pequeñas
      confederaciones…». Las confederaciones son de los del valle, por
      contraste con los de Barquisimeto. La tesis que la cita sostiene sale
      REFORZADA, no debilitada: el alemán dice además, sin elisión, que los
      caquetíos de ese valle, «aunque sean de una nación» con los de
      Barquisimeto, «no son amigos» (Klüpfel p. 70, [97]; 1916 p. 108). Ver
      `interior`.

  - afirmacion: >-
      «ya vemos en el texto que Federmann escribe caquetíos» (Arcaya, 1916
      p. 28 n. a) — y el encargo pide la voz «con su grafía».
    medido: >-
      La PRIMERA vez que el original nombra a la nación escribe
      **`Caquecios`** (1557 [19], imagen 29, verificado en imagen: «der
      Nation Caquecios gehaissen»). Después, `Caquetios` (1557 [46], imagen
      56, verificado). Arcaya describe la francesa normalizada, no el alemán.

  - afirmacion: >-
      «excepto los que viven cerca de Coro, estos indios habitan las mejores
      tierras» (1916 p. 60).
    medido: >-
      El alemán dice lo CONTRARIO: los caquetíos no viven en la sierra en
      ninguna parte, «gleich als wol umb Coro, als an disen orten» — tanto en
      torno a Coro como aquí — y sólo habitan la tierra llana y fértil (1557
      [48], imagen 58, verificado). La sintaxis del alemán es torpe y la
      lectura es mía: va como `reconstruido`, pero la «excepción» de Coro no
      está en el original. Ver `coro` fed-coro-003.

  - afirmacion: >-
      «la india rescatada por Ampíes» = una hija de Manaure (encargo, punto 2,
      leyendo la nota de Arcaya).
    medido: >-
      Federmann NO lo dice: sólo que la habían vendido en Santo Domingo y que
      Ampíes la rescató y la devolvió a su tierra. La identificación es de
      Arcaya (1916 p. 18-19 n. c), que encadena tres cosas: Castellanos (el
      señor de Hurehurebo, don Fernán García, y su mujer doña Juana García),
      la carta de Ampíes («una india hija del gran Cacique de Coro», con su
      marido; Fernández Duro 1885 t. II p. 212) y la suposición de que la
      aldea de tres casas era Hurehurebo. Va como `hipotetico`.

  - afirmacion: "«cien indios llamados Caquetíos» porteadores, como dato de relación con los españoles"
    medido: >-
      Es la cifra de Federmann («bei einem hundert Indios naturales vom land»,
      1557 [19]). Pero el cargo 39 del interrogatorio de Pérez de Tolosa
      acusa a Federmann de despoblar «cuatro ó cinco pueblos» caquetíos
      comarcanos a Coro y llevarse «más de quinientos por fuerza y en
      cadenas» (Fernández Duro 1885 t. II p. 274; Arcaya lo cita en 1916
      p. 28 n. b). Y el propio alemán dice que los indios «que sacamos de
      Coro» se le fugaron casi todos a su tierra (Klüpfel p. 26; la 1916
      p. 43 omite «de Coro»). Tres datos que no casan: se proponen los tres
      juntos, sin elegir.

  - afirmacion: "«Vararida o Valle de las Damas» (1916 p. 110) y la etimología de Arcaya (n. b: bara 'casa' + ire 'mujer')"
    medido: >-
      En alemán son DOS nombres de dos bocas: «dises thal und Provintz, so
      die Indios Vararida nennen, El valle delos damas nenneten» — el valle
      que los indios llaman Vararida, NOSOTROS lo llamamos el valle de las
      damas (Klüpfel p. 72). «Valle de las Damas» no traduce `Vararida`: la
      premisa de la etimología de Arcaya es un artefacto de la traducción.

  - afirmacion: "«Federmann escribe una cadena alemán → francés → castellano» (ficha, encargo)"
    medido: "Son cuatro eslabones; ver `cadena_de_traduccion` (eslabón 0)."

# ══════════════════════════════════════════════════════════════════════
# 1. PARAGUANÁ — cap. I, pp. 15-22 (enero de 1530)
# ══════════════════════════════════════════════════════════════════════
paraguana:

  - id: fed-par-001
    esfera: ecologia
    tema: pesca nocturna con fuego en la costa
    afirmacion: >-
      En la costa norte de Paraguaná los indios pescan de noche con hogueras
      en la orilla, «como es su costumbre»; los navegantes ven tres fuegos a
      medianoche y la noche siguiente esperan que vuelvan «a pescar donde los
      habíamos visto».
    cita_1916: "observó tres hogueras que los indios habían encendido para pescar como es su costumbre"
    pagina_impresa: 16
    aleman: >-
      «fewr, wölche die Indios landvolck am gestadt des Möhrs, darbei zu
      vischen, alls sie pflegen zuthun brenten» y «aulf ihre gewonliche
      vischereien» (Klüpfel pp. 11-12, OCR corregido)
    eslabon_que_lo_da: Klüpfel
    lugar: "costa norte de Paraguaná; Arcaya (p. 17 n. b) propone La Macolla, al oeste del Cabo San Román"
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: >-
      ⭐ Es técnica de pesca con fecha y lugar: pesca con luz desde la orilla.
      Toca ecologia (tesis «tierra pobre / mar rico») y transmision (una
      costumbre, `gewonliche`). No dice qué se pesca.

  - id: fed-par-002
    esfera: geografia_politica
    tema: miedo a la trata, aldea que se hace fuerte
    afirmacion: >-
      Al ver el navío, los de la costa se encierran en su aldea creyendo que
      vienen a raptarlos para venderlos en Santo Domingo, «como ocurre a
      veces» (alemán: «alls offt … beschehen», como pasa A MENUDO).
    cita_1916: "se hicieron fuertes en su aldea creyendo que veníamos a raptarlos para venderlos en Santo Domingo como ocurre a veces"
    pagina_impresa: 17
    aleman: "«besorgend, alls offt von Sant Dominigo auß beschehen, ain raubschiff were» (Klüpfel p. 12)"
    eslabon_que_lo_da: Klüpfel
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: >-
      La 1916 atenúa: el alemán dice «a menudo» (`offt`), no «a veces». En
      1530 la trata desde las Antillas era ya lo esperable en la costa de
      Paraguaná. Precontacto ≠ esto (regla 3).

  - id: fed-par-003
    esfera: familia
    tema: una aldehuela de tres casas; unas dieciséis personas en una
    afirmacion: >-
      A cinco leguas del desembarco, una aldehuela «compuesta solamente de tres
      casas»; en la casa de la india había «como diez y seis indígenas, entre
      hombres y mujeres». Tiene un jefe («der Principal des Weilers»), que
      manda dos indios de guía.
    cita_1916: "una aldehuela compuesta solamente de tres casas […] encontraron como diez y seis indígenas, entre hombres y mujeres. […] El jefe de la aldea ordenó entonces a dos indios que los acompañasen"
    pagina_impresa: 18-19
    aleman: >-
      «ain Weiler von dreien häusern, fünff meil von dem ort da wir angefaren»
      (Klüpfel p. 12) · «giengen mit ihr in jre behausung, alda sie etwan bei
      sechszehen Indios mann und frawen funden […] der Principal des Weilers,
      zwen Indios» (1557 [13], imagen 23, verificado en imagen)
    eslabon_que_lo_da: 1557
    lugar: "Paraguaná; sin nombre en Federmann (Arcaya: Hurehurebo/Jurijurebo, ver fed-par-008)"
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: >-
      ⭐ Dato de residencia de la COSTA, no del interior: unas dieciséis
      personas de ambos sexos en UNA casa, y tres casas por aldea. Casa grande
      multifamiliar, como las «cinco a ocho familias por casa» del Yaracuy
      (interior, fed-int-006), pero medida aquí en Paraguaná y 14 meses antes.
      Ojo: «en su casa» puede ser la casa de ella o la vivienda del caserío; el
      alemán dice `jre behausung` (su vivienda). `Principal` es castellano del
      escribano: la palabra indígena para ese jefe no está.

  - id: fed-par-004
    esfera: ecologia
    tema: agua lejos de las casas
    afirmacion: "Al amanecer una india sale sola «a buscar agua a alguna distancia» de las casas."
    cita_1916: "vieron una india que salía a buscar agua a alguna distancia"
    pagina_impresa: 18
    aleman: "«gieng ain India, allain umb wasser etwann ferr von den häusern» (Klüpfel p. 12)"
    eslabon_que_lo_da: Klüpfel
    epoca: contacto-temprano
    etiqueta: atestiguado
    cruce: >-
      Pérez de Tolosa 1546, sobre Paraguaná: «no hay río ninguno en toda ella;
      beben de jagüeyes» (Fernández Duro 1885 t. II p. 228; obra
      perez-de-tolosa-1546). Dos testigos independientes del s. XVI.

  - id: fed-par-005
    esfera: geografia_politica
    tema: la india rescatada por Ampíes y la amistad de «toda la provincia»
    afirmacion: >-
      La india hablaba algo de castellano porque la habían vendido en Santo
      Domingo; el factor Juan de Ampíes la rescató y la devolvió a su tierra
      «para ganarse la voluntad de los naturales». Ella dice que la provincia
      entera, «llamada Paraguaná», es amiga de los cristianos de Coro.
    cita_1916: "les dijo ella en legua española, que algo hablaba, que antes la habían vendido en Santo Domingo, pero que el factor de S. M., Juan de Ampies […] la había rescatado y devuéltola a su libertad y patria con el objeto de mover los naturales en favor de los españoles; preguntóles por qué la aprisionaban cuando ella y todos los indios de esta Provincia, llamada Paraguaná, eran amigos de los cristianos"
    pagina_impresa: 18
    aleman: >-
      «sagt sie ihnen inn Hispanischer sprach, die sie ein wenig kundte»
      (Klüpfel p. 12) · «were doch sie und die gantz Provintz so Baragnana
      heißt, der Christen zu Coro freund» (1557 [13], imagen 23, verificado)
    eslabon_que_lo_da: 1557
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: >-
      Es la política de Ampíes (1527-1528) vista desde abajo: la persona
      devuelta como mediadora. Que fuera hija de Manaure NO lo dice
      Federmann: ver fed-coro-004.

  - id: fed-par-006
    esfera: ecologia
    tema: lo que les dan de comer
    afirmacion: >-
      En la aldehuela los esperan con «pescado excelente y abundante y toda
      especie de víveres»; en Miraca «encontramos todo lo necesario».
    cita_1916: "nos proporcionaron pescado excelente y abundante y toda especie de víveres"
    pagina_impresa: 19-20
    aleman: "«mit allerley vischen, dern sie vast vil und gutt haben, sampt anderer speiß» (1557 [13], imagen 23, verificado)"
    eslabon_que_lo_da: 1557
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: >-
      El alemán es más preciso que la 1916: «toda clase de peces, de los que
      tienen muchísimos y buenos» — variedad, no sólo cantidad. Nada de lo
      demás («anderer speiß») se nombra: ni maíz, ni yuca, ni casabe. Cero de
      fuente para la dieta vegetal de Paraguaná en este texto.

  - id: fed-par-007
    esfera: ecologia
    tema: el camino por la costa
    afirmacion: >-
      De la aldehuela a Miraca, «más de seis leguas sin hallar agua, sobre una
      arena ardiente, a lo largo del mar»; antes, una fuente a dos leguas del
      desembarco donde duermen.
    cita_1916: "habiendo caminado más de seis leguas sin hallar agua, sobre una arena ardiente, a lo largo del mar"
    pagina_impresa: 19-20
    aleman: "«die tagreiß bei 6 meilen weitt, mit gebrech ahn wasser, ain hais sandig landt, und den merenteil am gestadt des Mors» (1557 [13]-[14], imagen 24, verificado)"
    eslabon_que_lo_da: 1557
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: >-
      La «legua» de la 1916 es la Meile alemana (Arcaya p. 10 n. a: 7.420 m).
      Seis Meilen ≈ 44 km: la cifra es del diario, no se ha medido sobre el
      mapa. Arcaya (p. 20 n. g-h) explica el rodeo por la costa del este.

  - id: fed-par-008
    esfera: geografia_politica
    tema: los lugares de Paraguaná — qué nodos toca
    lugares:
      - forma_1557: Paragnana / Baragnana
        forma_1916: Paraguaná
        donde: "1557 [13] «Baragnana» (imagen 23) y [14] «Paragnana» (imagen 24), verificados; Klüpfel lee igual"
        nota: >-
          La B/P alterna en el propio original, en dos páginas seguidas. La
          quinta letra se lee `n` en los dos sitios (Klüpfel también); en
          Fraktur n/u se confunden y un cajista pudo voltear la u, así que
          `Paraguana` es probable pero no está escrito. Para la mesa de
          topónimos (campana-toponimos), no se decide aquí.
        nodo: "región `paraguana` de asentamientos.yaml (no es un nodo)"
      - forma_1557: Miraca
        forma_1916: Miraca
        donde: "1557 [13], imagen 23: «einen Puebles Mi-/raca gehaissen», verificado en imagen"
        nodo: nodo-031
        propuesta: >-
          ⭐ ADELANTA LA ATESTACIÓN DE nodo-031 OCHO AÑOS. Su cadena empieza hoy
          en la carta de Bastidas (1538). Federmann llega a Miraca en enero de
          1530 («Puebles»/pueblo, con comida para una tropa de más de cien) y
          Arcaya añade en 1916 que «conserva el nombre» (p. 20 n. f). Propuesta:
          sumar federmann-1916 p. 20 (1557 [13]) a su `procedencia` y 1530 al
          principio de la cadena. `precontacto` sigue `desconocido`: 1530 no
          alcanza.
      - forma_1557: "(sin nombre) — ain Weiler von dreien häusern"
        forma_1916: "una aldehuela … de tres casas"
        identificacion_de_arcaya: "Hurehurebo, hoy Jurijurebo, fundo al norte de Pueblo Nuevo (p. 18 n. c)"
        nodo: "NUEVO, candidato — y débil"
        propuesta: >-
          No es nodo por Federmann, que no la nombra. Si entra, entra por
          Castellanos (Hurehurebo y su señor) con Arcaya como identificador, y
          `hipotetico` en la identificación con la aldea de Federmann.
          `jurijurebo` ya sale en asentamientos.yaml como forma con `ebo`
          (nodo-002, nota): comprobar ahí antes de abrir otro.
      - forma_1557: "(sin nombre) — ain brunnen, bei zwo meilen"
        identificacion_de_arcaya: "el jagüey u ojo de agua de Macama (p. 19 n. d)"
        nodo: "no — un punto de agua, no un asentamiento"
      - forma_1557: "(sin nombre) — el desembarco"
        identificacion_de_arcaya: "«Probablemente en La Macolla» (p. 17 n. b)"
        nodo: "no"
      - forma_1557: Buynari
        forma_1916: Buynari
        donde: "1557 [9], imagen 19, verificado (Klüpfel lee mal `Ruynari`)"
        nodo: nodo-011
        nota: >-
          «a siete leguas de Venezuela». El traductor francés cree que es Aruba
          y no Bonaire (1916 p. 15 n.). Federmann no dice nada de su gente.
    epoca: contacto-temprano

  - id: fed-par-009
    esfera: geografia_politica
    tema: tres días a caballo de Paraguaná a su barco
    afirmacion: >-
      El viaje de vuelta al navío lo hace «en un día y una noche» a caballo;
      a la ida fueron tres jornadas. La tropa llega a Coro por tierra con
      guías que manda el lugarteniente de Coro.
    pagina_impresa: 20
    eslabon_que_lo_da: 1916
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: "Distancias y tiempos para el modelo del camino Paraguaná–Coro; la cifra es del diario."

# ══════════════════════════════════════════════════════════════════════
# 2. CORO Y SU GENTE — caps. I-III, VIII (de pasada) y XIII-XIV
# ══════════════════════════════════════════════════════════════════════
coro:

  - id: fed-coro-001
    esfera: geografia_politica
    tema: "los cristianos viven «en la tierra del cacique Manuaury»"
    afirmacion: >-
      Volviendo por la costa oriental (marzo de 1531), Federmann manda a los
      caquetíos que traía de Coro a decir a los de la costa que ellos son
      «los cristianos que viven en Coro, en la tierra del cacique o señor
      llamado Manuaury». Coro se presenta como tierra de Manaure, y los
      cristianos como sus moradores.
    cita_1916: "debían anunciarles que éramos cristianos que habitábamos el territorio del cacique Manuaury (Manaure)"
    pagina_impresa: 120
    aleman: "«das wir die Christen weren so in Coro, in des Cacique oder herren Manu-/aury gehaissen, lande wonetten» (1557 [112], imagen 124, verificado en imagen)"
    eslabon_que_lo_da: 1557
    forma: Manuaury
    lugar: "dicho en la costa de la boca del Yaracuy, a unas 80 Meilen al este de Coro"
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: >-
      ⭐ Es la ÚNICA vez que Federmann nombra a Manaure, y lo hace como
      referencia que sirve a 80 Meilen de Coro: los caquetíos de esa costa
      debían reconocer el nombre. Grafía del original: `Manuaury` (el
      paréntesis «(Manaure)» es de Arcaya). Tres formas del mismo nombre ya en
      la primera generación: Naure / Anaure (Ampíes, Fernández Duro 1885 t. II
      p. 212), Manuaury (Federmann 1557), Manaure (Castellanos y el canon).
      Para antroponimos_caquetios.yaml, sin tocarlo. Federmann NO nombra su
      pueblo, NO habla de sucesores ni de parientes, y NO lo vio: en 1530
      Manaure ya no aparece como actor en su relato.

  - id: fed-coro-002
    esfera: geografia_politica
    tema: Coro, ciudad «recién fundada» de cristianos
    afirmacion: >-
      Coro es «la ciudad donde residen el Gobernador y los cristianos y la
      cual está recién fundada»; el puerto de Coro (Arcaya: La Vela) se toma
      el 8 de marzo de 1530.
    cita_1916: "Así se llama la ciudad donde residen el Gobernador y los cristianos y la cual está recién fundada."
    pagina_impresa: 18
    aleman: "«gehn Coro, also haißt le statt, da der Gubernator und die Christen wonen, und erst haben gebawen und edificiert» (Klüpfel p. 12, OCR corregido)"
    eslabon_que_lo_da: Klüpfel
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: "Nada sobre dónde viven los indios de Coro respecto de la ciudad."

  - id: fed-coro-003
    esfera: geografia_politica
    tema: los caquetíos de Coro también en el llano
    afirmacion: >-
      Todas las otras naciones fueron empujadas por los caquetíos a la sierra;
      los caquetíos no viven en la sierra en ninguna parte y ocupan sólo la
      tierra llana y fértil, «tanto en torno a Coro como aquí» (Barquisimeto).
    cita_1916: "excepto los que viven cerca de Coro, estos indios habitan las mejores tierras y no permiten que ninguna otra tribu se establezca donde ellos moran"
    pagina_impresa: 60
    aleman: "«dann dise Caquetios an keinem orte / das gebirge / gleich als wol umb Coro / als an disen orten / allein das beste / fruchtbarest und ebnes lande bewonen / vn auch andere nation in keiner ebne gedulden» (1557 [47]-[48], imágenes 57-58, verificado en imagen)"
    eslabon_que_lo_da: 1557
    epoca: contacto-temprano
    etiqueta: reconstruido
    nota: >-
      🔴 La 1916 invierte el alemán (ver meta.lo_que_resulto_falso). La
      etiqueta baja a `reconstruido` porque la construcción alemana es torpe
      y la lectura «tanto… como…» es mía; lo que sí es seguro es que la
      «excepción de Coro» no está. Encaja con el corpus: la Sierra de Coro es
      de los Xideharas (cap. IV) y los caquetíos de Coro ocupan el llano del
      Golfete. Mismo párrafo, también verificado: los de Coro conocían «la
      fuerza, bravura y habilidad» de los caquetíos de Barquisimeto («von
      denen so bei Coro wonen, erfaren», [47]) — la costa tenía noticias del
      interior antes de que llegara el primer europeo.

  - id: fed-coro-004
    esfera: familia
    tema: ¿la india de Paraguaná era hija de Manaure? — la cadena de Arcaya
    afirmacion: >-
      Arcaya (1916 p. 18-19 n. c) identifica la aldehuela de tres casas con
      Hurehurebo, a su señor con el don Fernán García de Castellanos, a la
      india con parientes de él (doña Juana García, doña Teresa) y a doña
      Juana con «una hija del Gran Cacique de Coro» de la carta de Ampíes.
    cita_1916: "Ampies en carta al Elmperador Carlos V […] refiere el incidente de haber sido cautivados falazmente «una hija del Gran Cacique de Coro con su marido.»"
    pagina_impresa: 19
    fuente_de_la_carta: >-
      Fernández Duro 1885 t. II p. 212 (fuentes_caquetios/Oviedo_Banos_1885_FernandezDuro_t2_Documentos.txt,
      pdf 223): «tomó parte de aquellos indios é una india hija del gran
      Cacique de Coro […] este gran Cacique al cual trujeron una hija suya
      con su marido». La misma carta llama al cacique «Naure ó Anaure» y dice
      que «se hace adorar como Dios, dando á entender á los indios que él da
      los temporales». ⚠️ Esa carta (pp. 207-218) queda FUERA de la clave
      perez-de-tolosa-1546 (pp. 219 ss.): no tiene clave propia en la
      bibliografía (deuda).
    epoca: contacto-temprano
    etiqueta: hipotetico
    nota: >-
      Cuatro eslabones de inferencia de un editor de 1916. Federmann sólo
      dice que la india fue vendida, rescatada por Ampíes y devuelta. Sirve
      como pista para Castellanos (fuera de esta parcela), no como dato.

  - id: fed-coro-005
    esfera: geografia_politica
    tema: los cien porteadores caquetíos — y lo que dicen los otros
    afirmacion: >-
      Federmann sale de Coro el 12 de septiembre de 1530 con 110 infantes, 16
      jinetes y «como cien» indios naturales de la nación caquetía que cargan
      víveres y pertrechos. Al mes se le han fugado casi todos «a su tierra».
    cita_1916: "acompañados de cien indios del país, de la nación llamada Caquetíos que portaban nuestros víveres y todo lo necesario para nuestra defensa"
    pagina_impresa: 27-28
    aleman: "«sampt bei ainem hundert Indios naturales vom land / der Nation Caquecios gehaissen / weliche unsere notturfftige speiß vnnd andern plunder […] trügen» (1557 [19], imagen 29, verificado en imagen)"
    fuga: >-
      «die Indios so wir zu Coro außgefüret, fast entloffen und zurück wider
      haim gekert waren» (Klüpfel p. 26, en tierra ayamán, octubre de 1530);
      la 1916 p. 43 lo traduce sin «de Coro».
    contradiccion: >-
      Pérez de Tolosa, interrogatorio de la pesquisa, cargo 39: Federmann
      «despobló cuatro ó cinco pueblos de indios amigos de cristianos de
      nación Caquetios, comarcanos á la ciudad de Coro, y de los dichos indios
      llevó cantidad de más de quinientos por fuerza y en cadenas» y a los que
      no podían andar «les cortaban las cabezas» (Fernández Duro 1885 t. II
      p. 274; perez-de-tolosa-1546; citado por Arcaya 1916 p. 28 n. b).
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: >-
      Dos testigos en conflicto (el acusado y el juez de residencia) y un
      tercer dato del acusado contra sí mismo (la fuga). Lo que no está en
      disputa: en 1530 los pueblos caquetíos «comarcanos a Coro» eran
      requisables como cargadores. Qué cifra vale no lo decide esta minería.

  - id: fed-coro-006
    esfera: geografia_politica
    tema: un caquetío de Coro, siervo y lengua
    afirmacion: >-
      El envoy a los caquetíos de Barquisimeto es «uno de los indios
      Caquetíos que nos seguían desde Coro», al que el alemán llama «der
      Caquetio oder Tolmetsch»; Federmann lo hace libre porque «hasta
      entonces» servía a un cristiano al que él mismo lo había dado.
    cita_1916: "Para recompensar este servicio al Caquetío, le hice algunos presentes y lo manumití porque hasta entonces era esclavo de un cristiano."
    pagina_impresa: 60-61
    aleman: "«der Caquetio oder Tolmetsch, so ich […] mit mir auß Coro gefürt» y «freimachete, dann er biß der zeit, einem Christen zudienen, von mir geschenckt was» (Klüpfel pp. 37-38, [49]-[50])"
    eslabon_que_lo_da: Klüpfel
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: "Ver lengua.fed-len-002: este hombre es la prueba de que el caquetío de Coro servía en Barquisimeto."

  - id: fed-coro-007
    esfera: geografia_politica
    tema: la costa oriental de vuelta (Xaragua → Martinico → Coro)
    afirmacion: >-
      Los caquetíos de la costa cerca de la boca del Yaracuy habían
      abandonado sus aldeas por las razzias de esclavistas de Santo Domingo;
      los que traía de Coro los encuentran («bien conoce un ratón las cuevas
      de los demás»). En Martinico empiezan los caquetíos amigos, ganados
      «hace un año» por el capitán Bartolomé Carco [sic en Klüpfel; Careo en
      la 1916]. De allí a Coro, 65 Meilen de costa «habitada por los
      caquetíos, nuestros aliados», que los reciben bien; los enfermos van
      por mar en dos canoas. En la sierra, los Atycares, confederados con
      dos aldeas caquetías.
    pagina_impresa: 120-123
    aleman: "«ein maus weißt der andern meüße unterschleiff wol» (1557 [112], imagen 124, verificado) · Martinico y «vor einem Jare» (Klüpfel p. 80; la 1916 omite el año) · «mit zweien Caquetischen Pueblos oder flecken Confederiert» (Klüpfel p. 81)"
    eslabon_que_lo_da: 1557
    lugares_nuevos:
      - forma: Xaragua / Xaraxaragua
        donde: "costa, cerca de la boca del Yaracuy (Arcaya p. 121 n. d); «ochenta» o «sesenta y cinco» Meilen de Coro según el pasaje"
      - forma: Martinico
        donde: "costa entre el Yaracuy y Coro; primera aldea caquetía amiga"
      - forma: Hytodes (Mitotes / Itotes)
        donde: "sierra a 4 Meilen de la costa; «enemigos de estos caquetíos». Arcaya: los jirajaras de Nirgua"
      - forma: Atycares
        donde: "sierra, entre Martinico y Coro; confederados con dos aldeas caquetías"
      - forma: Iracuy
        donde: "el río Yaracuy, «casi tan grande como el Rhin»"
    polity: costa-oriental
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: >-
      ⚠️ ¿Kaketiana o no? Es costa y es caquetía, pero no es el Golfete: es
      la costa oriental de Falcón hasta el Yaracuy. Si entra en la esfera
      (regla 4, reverso) lo decide Miguel; aquí sólo se propone con su
      etiqueta. Ninguno de estos lugares es hoy nodo de asentamientos.yaml.
      El dato que vale para la costa del Golfete por analogía: una red de
      aldeas caquetías costeras aliadas y comunicadas por canoa, y una alianza
      «confederada» entre una nación de la sierra y dos aldeas caquetías.

  - id: fed-coro-008
    esfera: geografia_politica
    tema: armas de los de Coro
    afirmacion: >-
      En el valle de Vararida «termina la hierba envenenada»: no la tienen y
      usan sólo el arco «como los de Coro». Por comparación, los caquetíos de
      Coro tiraban flechas SIN veneno.
    cita_1916: "El uso de las flechas envenenadas es desconocido allí; sus armas son las mismas que se usan en la provincia de Coro."
    pagina_impresa: 110
    aleman: "«hört die vergiffte herba oder kraut auff, und haben auch dern kaine, gebrauchen sich allain des geschoß als die zu Coro» (Klüpfel p. 72)"
    eslabon_que_lo_da: Klüpfel
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: "`herba` es la «hierba» castellana del escribano (veneno de flecha)."

  - id: fed-coro-009
    esfera: familia
    tema: el aspecto de la gente de Coro
    afirmacion: >-
      Los naturales de La Española se parecen en todo a los de Coro: «desnudos
      andan como ellos y son del mismo color».
    cita_1916: "aquéllos se asemejan en todo a los de Coro, de que trataré más abajo; desnudos andan como ellos y son del mismo color"
    pagina_impresa: 14
    aleman: "«wie auch die zu Coro […] ain nacket volck, und eben der selbigen farbe» (Klüpfel p. 9)"
    eslabon_que_lo_da: Klüpfel
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: >-
      El «de que trataré más abajo» no se cumple: Federmann no describe
      nunca las costumbres de los de Coro. Es un cero de fuente, no de
      consulta: se buscó `Coro` en toda la 1916 (112 apariciones) y en el
      alemán.

  - id: fed-coro-010
    esfera: geografia_politica
    tema: una enana ayamán dejada en Coro
    afirmacion: >-
      Un cacique ayamán da a Federmann una mujer «de cuatro palmos» como
      prenda de paz; ella llora porque cree que la entregan «a demonios»; él
      la lleva a Coro y la deja allí.
    pagina_impresa: 44
    aleman: "«ein zwergin bei vier spannen lang» · «Dise zwergin habe ich mit mir biß gen Coro gefürt, daselbst sie bliben ist» (Klüpfel p. 28)"
    eslabon_que_lo_da: Klüpfel
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: "Va aquí porque acaba en Coro; importa para el seretón (ver `sereton`)."

# ══════════════════════════════════════════════════════════════════════
# 3. LENGUA — intérpretes, la costa frente al interior, y todas las voces
# ══════════════════════════════════════════════════════════════════════
lengua:

  - id: fed-len-001
    esfera: lengua
    tema: la cadena de intérpretes
    afirmacion: >-
      Para «la primera lengua, la de los caquetíos», Federmann llevaba DOS
      CRISTIANOS de confianza que la sabían «muy bien»; con los Xideharas
      hablaba a través de dos intérpretes, con los Ayamanes de tres, con los
      Cayones de cuatro y con los Xaguas de cinco — y de cada diez palabras
      «apenas una» llegaba como la dijo.
    cita_1916: "Hablaba al principio de mi viaje con los Caquetíos por órgano de dos cristianos en quienes tenía entera confianza y que conocían perfectamente el idioma; mas me eran menester dos intérpretes con los Xideharas, tres con los Ayamanes, cuatro con los Cayones y cinco con los Xaguas."
    pagina_impresa: 58
    aleman: "«dann ich allein der ersten sprach / alls der Caquetios zwen Christen und vertrawte Tolmetschen / die die selbige sprach fast wol kundten / bei mir hette / und hernach bei den Xideharas durch zwen / bei den Ayamones durch drei / bei den Cayones durch vier / und bei den Xaguas durch fünff personen / reden muste» (1557 [46], imagen 56, verificado en imagen)"
    eslabon_que_lo_da: 1557
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: >-
      ⭐ En 1530, a tres años de Ampíes, hay ya cristianos que hablan
      caquetío «muy bien». Otros intérpretes con nombre o nación: `Cara
      Vanicero`, «Tolmetsch» que va delante a los Xideharas (Klüpfel p. 17,
      página [20] de 1557 sin ver en imagen; nombre de origen no decidido — puede ser castellano); un
      xidehara de Hittova para los Ayamanes; dos cayones que sabían xagua; una
      india de Barquisimeto que sabía «algo» de cuyba. La cadena prueba que
      la sierra entre Coro y Barquisimeto hablaba cuatro lenguas ajenas al
      caquetío (Federmann dice «cinco naciones» entre medias y lista cuatro).

  - id: fed-len-002
    esfera: lengua
    tema: "⭐ la costa y el interior: ¿hablaban igual? — Federmann y Pérez de Tolosa juntos"
    federmann_1530:
      pasaje: >-
        Al oír a los Xaguas que al otro lado vivían «Caquetíos», no lo
        creyeron: aunque tuvieran el mismo nombre, pensaron, no hablarían como
        los indios de Coro, estando a más de 73 Meilen y con cinco naciones
        de lengua distinta de por medio; y la buena noticia, «como suele
        pasar», les pareció por eso más increíble.
      aleman: >-
        «vermainende / ob sie schon auch den namen Caquetios hetten / so
        heten sie schon oder doch der sprache nicht wie die Indios zu Coro /
        da wir außgezogen waren / auch nicht also Redten / dann […] wir ob
        drei und sibentzig meiln von den selbigen / und entzwischen fünff
        Nation / dern jegkliche ein besundere sprach redten / fürgeraisset
        hetten / und was uns solichs alls ein ding / das uns erfrewete / wie
        gewonlich beschicht / dest ungleublicher» (1557 [46], imagen 56,
        verificado en imagen)
      cita_1916: "No podíamos imaginarnos que esta nación hablase también el mismo idioma, sobre todo después de haber atravesado el territorio de cinco pueblos de lenguas distintas. Pero tanto más nos regocijó aquéllo cuanto menos era de esperarse"
      pagina_impresa: 58
      y_en_los_hechos: >-
        (a) El caquetío de Coro que llevaba como siervo sirve de «Tolmetsch»
        y de embajador ante los caquetíos de Barquisimeto (fed-coro-006,
        [49]); (b) en el valle del Yaracuy no necesitan guías de Barquisimeto
        «porque llevábamos con nosotros intérpretes que sabían el idioma de
        los Caquetíos» — alemán «dieweil wir diser sprache der Caquetios selber
        tolmetschen hetten» (Klüpfel p. 70, [97]; 1916 p. 108); (c) nunca
        menciona una cadena de intérpretes con ningún grupo caquetío.
    perez_de_tolosa_1546:
      pasaje: >-
        De los llanos al pie de la cordillera, desde Barquisimeto hacia el
        sur: «docientas leguas de tierra, sin entrar en la sierra, son los
        indios de nación Caquetios, aunque algo difieren en la habla á los de
        Coro».
      obra: perez-de-tolosa-1546
      pagina_impresa: 234
      donde: "fuentes_caquetios/Oviedo_Banos_1885_FernandezDuro_t2_Documentos.txt, pdf 245 (impresa = pdf − 11); verificado por texto, no en imagen"
    lectura: >-
      No se contradicen: miden cosas distintas en sitios distintos.
      Federmann (1530), con los caquetíos de Coro → Barquisimeto → valle del
      Yaracuy: el mismo idioma, entendido por los mismos intérpretes y por un
      caquetío de Coro sin intermediario — lo dice sólo por implicación en el
      alemán (la sorpresa feliz) y por los hechos; la 1916 lo hace explícito.
      Pérez de Tolosa (1546), con los caquetíos de los LLANOS: la misma
      nación, pero «algo difieren en la habla». Juntos dibujan una lengua
      caquetía extendida de la costa a los llanos, inteligible entre polities
      enemigas entre sí (Barquisimeto y Vararida, fed-int-004), con variación
      dialectal que un juez de residencia notó en los extremos.
    epoca: contacto-temprano
    etiqueta: >-
      atestiguado lo que hicieron (los mismos intérpretes sirvieron);
      reconstruido «la misma lengua» como enunciado de Federmann, porque el
      alemán lo implica y no lo dice con esas palabras.
    nota: >-
      Es la primera prueba de dos testigos independientes (un alemán en 1530
      y un juez castellano en 1546) de que «caquetío» es también un nombre de
      LENGUA con variación interna, no sólo de nación. Ninguno de los dos da
      una sola palabra de esa lengua.

  - id: fed-len-003
    esfera: lengua
    tema: el caquetío como lengua de los vecinos
    afirmacion: >-
      Gente de otras naciones sabía caquetío: un cyparicote «que hablaba
      también el idioma de los Caquetíos» trae el oro de su cacique; dos
      guaycaríes que sabían caquetío «porque estas dos naciones viven
      mezcladas».
    aleman: >-
      «der auch der Nation Cyparicotes was / aber die sprach der Caquetios
      kundte» (1557 [111], imagen 123, verificado en imagen) · «zwen Indios
      Guaycaries […] die auch der Caquetios sprach kundten, dann dise zwo
      Nation undereinander […] wonen» (Klüpfel p. 61)
    pagina_impresa: "119-120 (cyparicote); 94 (guaycaríes)"
    eslabon_que_lo_da: 1557
    polity: interior
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: >-
      Del interior (regla 4), pero es dato de LENGUA: el caquetío como
      segunda lengua de vecinos no caquetíos, que es lo que se espera de una
      lengua de prestigio en una esfera de intercambio. No hay equivalente
      medido para la costa en este texto.

  - id: fed-len-004
    esfera: lengua
    tema: el etnónimo en el original
    formas:
      - forma: Caquecios
        donde: "1557 [19], imagen 29 — primera mención («der Nation Caquecios gehaissen»), verificado en imagen"
      - forma: Caquetios
        donde: "1557 [46]-[48] e [111]-[112], imágenes 56-58 y 123-124, verificado; es la forma dominante"
      - forma: Caquetio / Caquetischen
        donde: "singular y adjetivo (Klüpfel pp. 37, 81)"
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: >-
      La t/c ya varía dentro del mismo impreso (cf. `çaquitios` de Oviedo,
      «Caquesíos» de Simón según Arcaya 1916 p. 28 n.). La etimología
      bakairí que propone Arcaya en esa nota (zakaitío 'viejo/alto') es suya y
      no se propone. El recuento Klüpfel por grafía no vale como censo: el
      OCR hace `Caquelios` de `Caquetios`.

  - id: fed-len-005
    esfera: lengua
    tema: "voces de la esfera en boca del escribano: todas, con su «así se llaman»"
    voces:
      - forma: Cacique
        uso: "«Cacique oder herr», passim desde los Xideharas; Federmann lo glosa siempre con «oder herr»"
        lugar: todo el viaje
      - forma: Canoa / Canoen
        uso: "«in einer Canoa, also heissen der Indios schiff» (Klüpfel p. 80) · «in zweien Canoen, das seind der Indios schiffe» (p. 81)"
        lugar: "costa caquetía entre Martinico y Coro (polity costa-oriental)"
      - forma: Hamaca / Hamacos
        uso: "«in Hamacos, also heissen die Indianische beth» (Klüpfel p. 40) · un falso cacique llevado «in ainer Hamaca» (p. 69)"
        lugar: "Barquisimeto y más allá (interior)"
      - forma: Buhio
        uso: "«den Buhio oder das hauß» (Klüpfel p. 47, p. 74)"
        lugar: "interior (Cuybas; valle de Vararida)"
      - forma: Barbacoa
        uso: "«in diser Barbacoa, also haißt es»: un tablado en medio de la casa sobre cuatro postes, tres hombres de alto, donde guardan «ihr korn oder Mahys» (Klüpfel p. 74)"
        lugar: "valle de Vararida (interior)"
      - forma: Mahys / Mahis
        uso: "«Mahys, das ist ihr korn» (Klüpfel p. 44); «Mahis / Juca / Batata / Oyama» (1557 [24], imagen 34, verificado)"
        lugar: "Mahis… en una aldea AYAMÁN (sierra); Mahys en tierra cuyba (llanos)"
      - forma: Juca
        uso: "1557 [24], imagen 34, verificado"
        lugar: "aldea ayamán"
      - forma: Batata
        uso: "1557 [24], imagen 34, verificado"
        lugar: "aldea ayamán"
      - forma: Oyama
        uso: "1557 [24], imagen 34, verificado; la 1916 p. 35 lo da como «ñames»"
        lugar: "aldea ayamán"
        nota: >-
          ⚠️ Pregunta abierta: `Oyama` se parece más a *auyama/ahuyama*
          (calabaza, voz de Venezuela) que a *ñame*. La equivalencia «ñames»
          es de Ternaux o de Arcaya. No se decide aquí.
      - forma: Macana
        uso: "«mit ainer Macana, also haißt…» — la maza con que un indio le parte el escudo (Klüpfel p. 75); la 1916 p. 113 «su macana o maza»"
        lugar: "valle de Vararida (interior)"
      - forma: Weschuco
        uso: "«ein Weschuco, dorn es vil inn den wälden hat, das ist ein zehe gewechs wie die weiden» (Klüpfel p. 77); la 1916 p. 118 escribe «weshuco (bejuco)»"
        lugar: "sierra de los Cyparicotes (interior)"
      - forma: Viroles
        uso: "la viruela que mató a los de La Española (Klüpfel p. 10): castellano"
        lugar: "La Española"
      - forma: Principal · Pueblo · Naturales · herba
        uso: "castellano del escribano, sin glosa indígena"
        lugar: todo el viaje
    epoca: contacto-temprano
    etiqueta: hipotetico
    nota: >-
      🔴 Ninguna es caquetío-atestiguado por Federmann. Son voces antillanas y
      castellanas del diario notarial (eslabón 0) que Federmann glosa con
      «así se llaman»: prueban que en 1530-31 ese vocabulario ya viajaba con
      los españoles por la tierra caquetía, no que los caquetíos lo dijeran.
      La única en boca y tierra caquetía costera es `Canoa`, y también es del
      escribano. Van con `hipotetico` en cuanto uso caquetío; como
      atestaciones fechadas de la esfera (1530-31) son firmes. Y un aviso de
      traducción: el «botuto» de la 1916 p. 35 (los ayamanes «sonando el
      botuto») NO está en el alemán, que dice «ihre hörner … blasende»
      (1557 [24], imagen 34, verificado): la voz la puso Arcaya.

  - id: fed-len-006
    esfera: lengua
    tema: nombres propios de la costa, en la grafía del original
    formas:
      - {forma: "Paragnana / Baragnana", tipo: toponimo, donde: "1557 [13]-[14]", ver: fed-par-008}
      - {forma: Miraca, tipo: toponimo, donde: "1557 [13]", ver: fed-par-008}
      - {forma: Buynari, tipo: toponimo, donde: "1557 [9]", ver: fed-par-008}
      - {forma: Coro, tipo: toponimo, donde: passim}
      - {forma: Manuaury, tipo: antroponimo, donde: "1557 [112]", ver: fed-coro-001}
      - {forma: "Xaragua / Xaraxaragua", tipo: toponimo, donde: "Klüpfel pp. 80-81", ver: fed-coro-007}
      - {forma: Martinico, tipo: toponimo, donde: "Klüpfel p. 80", nota: "¿castellano (Martinico)? no se decide"}
      - {forma: Hytodes, tipo: etnonimo, donde: "1557 [112]"}
      - {forma: Atycares, tipo: etnonimo, donde: "Klüpfel p. 81"}
      - {forma: Iracuy, tipo: hidronimo, donde: "Klüpfel p. 80"}
      - {forma: "Cara Vanicero", tipo: antroponimo, donde: "Klüpfel p. 17 ([20], sin ver en imagen)", nota: "intérprete; puede no ser indígena"}
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: >-
      Para la mesa de topónimos (campana-toponimos) y antroponimos_caquetios.yaml;
      no se tocan. Ninguna trae glosa en Federmann. Los del interior
      (Xideharas, Hittova, Ayamanes, Carohana, Cayones, Xaguas, Coary,
      Cacaridi, Variquecemeto, Vararida, Cuybas, Hacarigua, Guaycaries,
      Cyparicotes, Itabana, Curahamara, Coahery, Carahao…) no se cotejaron
      uno a uno en 1557.

# ══════════════════════════════════════════════════════════════════════
# 4. EL SERETÓN — pregunta de Miguel del 2026-09-11
#    (6-fusion/ceret_on_hipotesis_miguel.yaml)
# ══════════════════════════════════════════════════════════════════════
sereton:
  pregunta: >-
    ¿Hay en Federmann un hombre que se transforma, o una palabra parecida a
    seretón/ceretón? Miguel: «el ceretón está presente tanto por Federmann y
    se mantiene hasta el día de hoy en mitos».
  veredicto: >-
    CERO de la palabra y CERO del concepto de transformación, medidos en los
    dos idiomas. Lo que Federmann SÍ trae —y es casi seguro la raíz de la
    asociación «Welser → enano de la sierra de Falcón» que el barrido web del
    2026-09-09 le atribuyó al ceretón— son los ENANOS (`Zwergen`) de la
    nación ayamán, en la sierra al sur de la de Coro, y una mujer enana que
    Federmann se llevó a Coro y allí dejó.
  lo_que_se_busco:
    por_la_forma:
      regex: "[csz]h?[ae]r+[ae]t | [csz]er+[eé]t[oó]n | tscher+et"
      en: [1916 entera, alemán Klüpfel entero]
      resultado: 0 y 0
    por_el_concepto_1916:
      regex: "transform · convert[íi]a · diabl · demoni · brujo · hechic · encant · sombrero · enan[oa] · piache · sacerdot · [íi]dolo · supersti · creencia"
      resultado: >-
        21 aciertos; ninguno es una transformación. Son: los enanos ayamanes
        (pp. 31, 37-38, 39, 41-44), los indios que toman a los españoles por
        demonios (pp. 44, 53, 55, 90), la etimología guaraní de «Ayamán» que
        propone Arcaya ('diablo' + 'parientes', p. 34 n.) y una frase de
        Federmann sobre «las supersticiones de sus padres ni su religión y
        creencias diabólicas» de los ayamanes (p. 37), sin contenido.
    por_el_concepto_aleman:
      regex: "verw[aä]nd · gestalt · zauber · teu?ff?el · tiger · hexe · gespenst · geist · h[uü]t · kapp · zwerg · wandl · th[iy]er"
      resultado: >-
        `gestalt` sólo como 'forma/estatura' («zierlicher Proportz und
        gestalt»), `verwandle` como 'pariente' (Klüpfel p. 69), `Teuffel` =
        los españoles a ojos de los indios, `Tigerthier` = el jaguar, `hüt` =
        'guardia'. Ningún hombre-animal, ningún sombrero.
    no_se_leyo_de_corrido: "caps. VI-VII y IX-XI (ver meta.que_no_se_leyo); cubiertos sólo por estas sondas"
  lo_que_si_hay:
    - id: fed-ser-001
      que: los Ayamanes, «nación» de enanos
      afirmacion: >-
        Los de Hittova (la última aldea xidehara) le dicen que a dos jornadas
        vive otra nación, los Ayamanes, «pequeños y enanos, pero valientes»,
        en tierra áspera y montañosa. Encuentra gente de cinco o seis palmos;
        los mismos ayamanes le explican que los de talla normal que hay entre
        ellos vienen de casarse con sus enemigos xideharas después de una
        mortandad antigua, y que a cuatro jornadas sólo hay enanos «sin ninguna
        mezcla».
      pagina_impresa: "31, 37-38"
      aleman: "«were auch ein klain volck, und Zwergen, jedoch streitbar» (Klüpfel p. 18, [21]) · «der Nation Ayamanes oder Zwergen» (p. 29)"
      eslabon_que_lo_da: Klüpfel
      lugar: >-
        sierra al sur de la de Coro/San Luis, pasado Churuguara (Arcaya
        p. 31 n. c y p. 33 n. a: hoy sierras de Parupano y Moroturo, San
        Miguel, Lara, «y un tiempo del Estado Falcón»)
      polity: ayaman (NO caquetía)
      epoca: contacto-temprano
      etiqueta: atestiguado
      nota: >-
        Arcaya (p. 43 n. d) lo llama «pura fábula» que Federmann tomó de las
        ideas de su época. Sea cual sea su verdad, ES lo que el texto dice, y
        es el enano de la sierra de Falcón con un Welser detrás.
    - id: fed-ser-002
      que: la enana que se quedó en Coro
      afirmacion: >-
        Un cacique ayamán le regala una mujer enana «de cuatro palmos», que
        dice que es su mujer, como prenda de paz; ella llora creyendo que la
        entregan «no a hombres sino a diablos»; Federmann la lleva a Coro y
        allí se queda.
      pagina_impresa: 44
      aleman: "«mir ein zwergin bei vier spannen lang […] dann sie nicht mainet menschen / sonder teüflen / darfür sie uns halten / geschenckt sein / Dise zwergin habe ich mit mir biß gen Coro gefürt / daselbst sie bliben ist» (1557 [35], imagen 45, verificado en imagen; al margen: «Die Christen von den Indios nicht menschen / für teüffel geacht werden»)"
      eslabon_que_lo_da: 1557
      epoca: contacto-temprano
      etiqueta: atestiguado
      nota: >-
        ⭐ Un enano de la sierra, traído por el Welser, VIVIENDO EN CORO desde
        1530-31. Si la memoria falconiana guarda un «enano de los Welser», éste
        es el candidato documental más directo — sin nombre, sin sombrero y sin
        transformación.
  que_significa_para_la_hipotesis: >-
    La hipótesis de Miguel tenía dos partes. (1) «ceretón y seretón son el
    mismo ente con dos grafías»: Federmann no la toca — no trae la palabra
    en ninguna grafía. (2) «los Welser se contactaron con uno y en la memoria
    quedó este otro»: Federmann da el ENANO (y la estancia de una enana en
    Coro) pero no el HOMBRE QUE SE TRANSFORMA. Si el ceretón de la
    divulgación es «un enano de sombrero de la Sierra de Falcón atribuido a
    los Welser», su «Welser» sale probablemente de aquí; el seretón de Medina
    (el que se desnuda y se vuelve animal) no tiene apoyo en Federmann. Queda
    `hipotetico`, y la frase «el ceretón está presente en Federmann» no se
    sostiene tal cual: está el enano, no el nombre.
  etiqueta: hipotetico


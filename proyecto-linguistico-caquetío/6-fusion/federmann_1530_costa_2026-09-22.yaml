fauna_ceros: >-
    Para la COSTA (Paraguaná y Coro) Federmann no nombra ni un animal de
    tierra, ni un ave, ni un reptil, ni un marisco, ni una especie de pez:
    sólo «peces de toda clase». Sondas en la 1916: pez/peces, venado, danta,
    tigre, león, perro, gallina, ave, pájaro, papagayo, loro, guacamaya,
    iguana, tortuga, caimán, culebra, serpiente, mono, puerco, báquiro,
    conejo, lagarto, mosquito, murciélago, pato, garza, cangrejo, manatí,
    cacería, hormiga, abeja, miel, ostra, perla — todos los aciertos de la
    costa son «pescar/pescado». Para contraste, Pérez de Tolosa 1546 da en
    Paraguaná «venados, conejos, perdices, tórtolas, pescado» (Fernández Duro
    1885 t. II p. 228) — otra parcela.

# ══════════════════════════════════════════════════════════════════════
# 6. EL INTERIOR — caps. VIII (Barquisimeto) y XII (valle del Yaracuy)
#    🔴 polity: interior. Nada de aquí es dato de la costa (regla 4).
#    Se minó lo que la ficha ya citaba de segunda mano y poco más.
# ══════════════════════════════════════════════════════════════════════
interior:

  - id: fed-int-001
    polity: interior
    comarca: Barquisimeto (Variquecemeto)
    esfera: geografia_politica
    afirmacion: >-
      Unas veinte aldeas a la vista en una llanura junto a un gran río; en la
      primera, «cerca de cuatro mil hombres»; en total veintitrés aldeas a la
      orilla, a media legua o una legua una de otra; quince días entre ellas;
      les dan más de 3.000 pesos de oro «de buena voluntad»: «pueblo rico y
      comerciante», sin herramientas de hierro.
    pagina_impresa: "59-62"
    aleman: "«ob zweintzig» aldeas a la vista (1557 [47], imagen 57, verificado); «deren 23 waren» (Klüpfel p. 38, [50])"
    eslabon_que_lo_da: Klüpfel
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: "Es prop-polity-001 con la página buena (62, no 109-110)."

  - id: fed-int-002
    polity: interior
    comarca: Barquisimeto
    esfera: geografia_politica
    afirmacion: >-
      Aldeas «muy fortificadas» y lo más juntas posible, porque tienen
      enemigos por los cuatro lados: los Xaguas (con quienes sin embargo
      comercian SAL), los Cyparicotes, los Cuibas y «una tribu de su nación»,
      la del valle de Vararida. «En ninguna parte encontramos una población
      tan numerosa en tan pequeño territorio.»
    pagina_impresa: "62-63"
    aleman: "«So haben sie zu der vierdten seitten ir eigne nation, auch Caquetios, in dem valle Poblado […] gehaissen Vararida, […] auch für feinde» (Klüpfel p. 39, [52])"
    eslabon_que_lo_da: Klüpfel
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: "prop-polity-002 con la página buena (62-63)."

  - id: fed-int-003
    polity: interior
    comarca: Barquisimeto / Xaguas
    esfera: geografia_politica
    afirmacion: >-
      Los Xaguas de las últimas aldeas «viven en paz» con los caquetíos de
      Barquisimeto y comercian con ellos sal, aunque en otro pasaje los da
      por enemigos.
    pagina_impresa: "60, 63"
    aleman: "«mit den Caquetios / dern lande und flecken / wir jetzt ahnreisten / umb saltz fridtlich Contractirn und handlen» (1557 [48], imagen 58, verificado)"
    eslabon_que_lo_da: 1557
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: "La sal circula tierra adentro entre naciones enemigas. De dónde sale esa sal, Federmann no lo dice."

  - id: fed-int-004
    polity: interior
    comarca: valle de Vararida (= valle del Yaracuy, según Meléndez vía Arcaya p. 107 n. a)
    esfera: geografia_politica
    afirmacion: >-
      ⭐ Los caquetíos del valle, «aunque sean de una nación» con los de
      Barquisimeto, «no son amigos»: entre los dos hay jornada y media de
      tierra despoblada con ruinas de aldeas quemadas. Los de Barquisimeto no
      les dan guías por miedo a no volver.
    pagina_impresa: 108
    aleman: "«besitzen die Caquetios, die aber dem zu Varyquecimeto, ob sie wol einer Nation seind, so seind sie doch nit freündt» (Klüpfel p. 70, [97])"
    eslabon_que_lo_da: Klüpfel
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: >-
      Es la frase más limpia de todo Federmann para la regla 4: misma
      nación, dos polities, y enemigas. Mejor sostén del modelo que la cita
      elidida de prop-polity-004.

  - id: fed-int-005
    polity: interior
    comarca: valle de Vararida
    esfera: geografia_politica
    afirmacion: >-
      «Creo que les sería fácil reunir en un día hasta veinte mil guerreros.
      Aunque los habitantes de todas estas aldeas son de la misma nación, no
      están bajo el dominio de un solo señor.» Y a renglón seguido: los demás
      habitantes del valle no están todos aliados y forman confederaciones de
      dos, tres o cuatro aldeas, menos temibles que los de Barquisimeto.
    cita_1916: "Aunque los habitantes de todas estas aldeas son de la misma nación, no están bajo el dominio de un solo señor."
    pagina_impresa: 109
    aleman: "«ob sie schon einer Nation, nit alle under eines herren herrschung […] sonder yhe zwen, drey, oder vier Pueblos mit einander Confederiert oder verbunden, derhalben sie weniger gewaltig seind, dann die in Varyquecimeto» (Klüpfel p. 71, [99]-[100])"
    eslabon_que_lo_da: Klüpfel
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: >-
      prop-polity-003/004 con la página buena (109, no 62-63). El alemán
      tiene la misma ambigüedad que la francesa sobre a qué aldeas se
      refieren los 20.000 («diser Pueblos»): se deja dicha.

  - id: fed-int-006
    polity: interior
    comarca: valle de Vararida
    esfera: familia
    afirmacion: >-
      Aldeas de hasta media legua de largo con una o dos calles; en una casa
      viven «cinco y hasta ocho familias» — el alemán dice «cinco, seis, hasta
      ocho clases de gente de casa, con mujer e hijos».
    pagina_impresa: 110
    aleman: "«Auch gewonlich inn einem hauß, fünff, sechs, biß in achterlai haußvolck mit weib und kinden» (Klüpfel p. 72)"
    eslabon_que_lo_da: Klüpfel
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: >-
      prop-polity-005 con la página buena. Compárese con la costa:
      dieciséis personas en una casa de la aldehuela de Paraguaná
      (fed-par-003). Dos polities, el mismo patrón de casa grande.

  - id: fed-int-007
    polity: interior
    comarca: Barquisimeto
    esfera: transmision
    afirmacion: >-
      Del Mar del Sur, los de Barquisimeto dicen que no han estado allí pero
      que «habían oído hablar a sus antepasados»; Federmann lo toma por
      excusa.
    pagina_impresa: "63-64"
    aleman: "«allein (sagten sie) von ihren altern also gehört haben» (Klüpfel p. 40)"
    eslabon_que_lo_da: Klüpfel
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: "Saber geográfico transmitido por los mayores. Del interior."

  - id: fed-int-008
    polity: interior
    comarca: valle de Vararida
    esfera: ecologia
    afirmacion: >-
      En la casa, un tablado alto sobre cuatro postes, «tres hombres de alto»,
      donde guardan el maíz: la `Barbacoa`; desde él doce indios resisten a
      los españoles.
    pagina_impresa: 113
    cita_1916: "la barbacoa, como llaman ellos esa especie de troje; […] se elevaba sobre cuatro postes y era bastante alta para que un hombre pudiera estar parado"
    aleman: "«ein hohe prucken so mitten im hauß uff vier pfeilern, und dreier männer hoch stunde, darinn sie ihr korn oder Mahys pflegen zuhaben» (Klüpfel p. 74)"
    eslabon_que_lo_da: Klüpfel
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: >-
      La altura no casa: «tres hombres de alto» en alemán, «que un hombre
      pudiera estar parado» en la 1916. Manda el alemán. En el mismo pasaje un
      indio le rompe el escudo con «ainer Macana, also haißt…» (Klüpfel p. 75):
      otra voz de la esfera en boca del escribano (fed-len-005).

  - id: fed-int-009
    polity: ayaman (NO caquetía)
    comarca: sierra ayamán
    esfera: transmision
    afirmacion: >-
      Los ayamanes explican la mezcla de tallas por lo que «sus antepasados
      les habían explicado»: una mortandad antigua los obligó a casarse con
      sus enemigos xideharas.
    pagina_impresa: 38
    eslabon_que_lo_da: 1916
    epoca: contacto-temprano
    etiqueta: atestiguado
    nota: "Memoria oral de un vecino no caquetío; va aquí por la sierra que comparte con Coro."

interior_no_se_mino: >-
    Caps. IX-XI (Cuybas, Guaycaríes, Hacarigua, Itabana, la laguna) y el
    resto del XII-XIII salvo lo citado: sólo por sondas. Lo que dieron las
    sondas está arriba (lengua, fauna). Si se modela una segunda polity
    (#83, D14), esos capítulos son los que faltan.

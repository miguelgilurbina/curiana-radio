# 10. LO QUE SALIÓ DE PASO — medido, y NO es la respuesta
# ══════════════════════════════════════════════════════════════════════
subproductos:
  - id: sub-01
    titulo: 'el prefijo `ja-`: siete de los trece lemas en J- son verbos'
    medido: '7 de 13 (53,8 %), p = 7,4e-05 — contra 30 verbos en 288 (10,4 %)'
    los_siete: ['Jabal #168 «Adquirir»', 'Jacuque #170 «Regar, regadío»',
                'Jacura #171 «Guardar»', 'Jadarayte #172 «Recoger»',
                'Jaguey #174 «Establecer, estancar»', 'Jai #175 «Oír, escuchar»',
                'Jusual #180 «Sembrar, siembra, sembradío»']
    la_pista_extra: >-
      Zavala #173 da el MISMO lema en dos formas: «Jadicuar. Adicora» — ja- ~
      a-. Y el propio Zavala, en su §5 (p. 72 impresa), escribe: «Las voces
      caquetías emplean entre otros el prefijo "A" en los topónimos costeros,
      como: Adare (Adaro), Anocio, Amuay». Del lado lokono, los infinitivos de
      Perea se citan con `a-` (`a-sucusu-n`, `a-iyaha-dda-hù`) y el achagua de
      Neira los cita con `nu-`: prefijar el verbo es arahuaco.
    por_que_NO_se_propone_ahora:
      - 'no es un nominalizador: si acaso sería lo contrario, una marca verbal'
      - 'los siete son del MISMO compilador (AM), así que puede ser su manera
         de transcribir y no la lengua'
      - 'el glosario es alfabético: hay que comprobar que el amontonamiento no
         sea un artefacto de cómo Angulo Molina ordenó SU lista'
    para: 'campaña propia — es la pista más limpia que ha dado esta medición'
  - id: sub-02
    titulo: '`-ebo` «camino, paso» tiene un quinto apoyo, y el primero LÉXICO'
    estado_en_el_canon: >-
      ya abierto en la toponimia: `jurijurebo` (toponimo-002, nivel A),
      `turijerebo` (toponimo-020, nivel C), `guacurebo` (toponimo-021, con su
      contraejemplo resuelto por Esteves p. 38) y `cumarebo`. `ebo` #117
      «Camino, paso, senda» es voz libre caquetío-atestiguada del lexicón.
    lo_nuevo: >-
      ⭐ `cazebo` #75 (GC) «Poniente» = `cazi` #76 (GC) «Sol» + `ebo` «camino»
      → 'el camino del sol'. Es el PRIMER apoyo no toponímico de `-ebo`: una
      palabra común, de otro compilador (Galeotto Cey, el testigo del s. XVI),
      con las dos piezas atestiguadas y la traducción cerrando sin residuo —
      el mismo método con que D9 resolvió `-bana`. La entrada `kasebo` del
      lexicón no lleva esta segmentación.
    medido: 'en el grupo de control: 3/11 vs 6/288, ×13,09, p = 0,00079'
    para: 'la campaña de topónimos / una D9 de `-ebo`; NO es un nominalizador'
  - id: sub-03
    titulo: 'los nombres de agente atestiguados son REDUPLICADOS, no sufijados'
    medido: '3 de los 9 nombres de agente de la diana'
    los_tres: ['Quibaquibi #205 «Baquiano, conocedor» ← quiba #203 «Ayuda»',
               'Humohumo #160 «El ave que vuela»',
               'Apopo #12 «jefe de parcialidad pequeña» ← apo #11 «Grande»']
    estado_en_el_canon: >-
      §9 de morfologia.md ya lista `quibaquibi` bajo «especificación /
      intensidad» y `humohumo` bajo onomatopeya. Lo que esta campaña añade es
      el RECUENTO: en el subconjunto de nombres de agente la reduplicación es
      el único proceso que deja base atestiguada. Un valor AGENTIVO no está
      declarado en §9.
    aviso: >-
      `baquiano` es palabra castellana (guía, práctico) de origen discutido:
      antes de leer `quibaquibi` como agentivo caquetío hay que descartar que
      la glosa sea la etimología del compilador.
    para: 'la deuda abierta de la reduplicación (§9), que no estaba entre las catorce'
  - id: sub-04
    titulo: '`mene`/`cumaragua`: la ambigüedad que la ficha de Zavala dejó abierta se cierra'
    lo_que_estaba_abierto: >-
      `4-fuentes/zavala-reyes-2015.md` marca con ⚠️ D la cita de su p. 62
      —«"mene" y "cumaragua" nombre de la ciruela»— porque «la sintaxis de
      Arcaya es ambigua» y el lexicón glosa `mene` como petróleo/rezumadero.
    lo_medido_ahora: >-
      Se fue al Arcaya original. Arcaya 1920 p. 75 escribe, literal: «mene y
      cumaragua (nombres de la VIRUELA)». Y la Tabla A-9 de Oliver, del s. XVI
      e independiente de Zavala, trae «viruela» y «viruela / pez derretida».
      O sea: no es que la sintaxis de Arcaya sea ambigua — es que **Zavala
      leyó «ciruela» donde Arcaya puso «viruela»**, y con eso se explica
      también la glosa de `Cumaragua` #93 «Ciruela, espuma rosada».
    para: >-
      curación de glosa. Aquí NO se toca nada (cambiar una glosa mueve canon,
      skill §8): se deja la evidencia y se levanta.

# ══════════════════════════════════════════════════════════════════════
# 11. EL OTRO LADO — y es OTRO lado
# ══════════════════════════════════════════════════════════════════════
# Lo que la comunidad inventó NO es evidencia de lo atestiguado. Va aquí sólo
# lo que toca al canon; la descripción entera está en el issue y la medición
# en 6-fusion/medicion_nominalizacion_emergente_2026-09-21.yaml.
lo_emergente_que_toca_al_canon:
  correccion_de_cifra:
    donde: '2-lengua/morfologia.md §11 «La nominalización con el posesivo»'
    lo_que_dice: '1.107 usos de ta-/ma-/wa- sobre raíz verbal, + 25 de ka- = 1.132'
    lo_que_sale_hoy: '960 usos en 92 formas, sobre los MISMOS 95.445 usos de word_uses'
    la_diferencia: 172
    explicada_y_medida: >-
      Los 172 son exactamente los usos sobre las raíces que **#178 dejó de
      considerar verbales** el 2026-09-20 (30 de las 49 de Zavala):
      `ka-juri`, `ka-popoi`, `ka-kana`, `ma-kapo`, `ma-hueke`, `ma-baharuko`,
      `ma-kibakibi`, `ma-kiricias`… 36 formas. 960 + 172 = 1.132, exacto.
    lectura: >-
      Las dos cifras son correctas para SU estado del lexicón: aquella
      medición corrió antes de que el reparto de clases llegara al módulo. La
      de hoy es la del canon en main. Y la corrección va en la dirección que
      el propio d21.5 quería: `ka-juri` sale del recuento porque `juri` es un
      NOMBRE, y `ka-juri` «hay viento» es el atributivo haciendo su trabajo,
      no una nominalización.
    propuesta: 'actualizar la cifra de §11 y decir con qué estado se midió'
  y_una_cosa_que_el_titular_de_11_junta_y_no_deberia:
    medido: >-
      posesivo `ta-`/`wa-` sobre raíz verbal: **470 usos en 48 formas**.
      Atributivo/privativo `ma-`/`ka-` sobre raíz verbal: **490 usos en 44
      formas**.
    por_que_importa: >-
      Desde d21.5, `ma-` es PRIVATIVO y `ka-` ATRIBUTIVO, no posesivos. El
      titular de §11 —«La nominalización con el posesivo»— suma los cuatro, y
      la mitad de sus usos no son nominalización: `ma-panaa` es «sin saber»
      (el propio §11 lo glosa así para `ma-awa` «sin beber»), que es
      predicación negativa, no un nombre. Son DOS invenciones distintas y la
      segunda —extender el privativo de nombres a verbos— no la ha nombrado
      nadie todavía.
    propuesta: >-
      partir §11 en dos: la nominalización posesiva (470 usos, 48 formas) y la
      predicación privativa sobre verbo (490 usos, 44 formas). Decisión de
      Miguel: son dos hallazgos, no uno mal contado.


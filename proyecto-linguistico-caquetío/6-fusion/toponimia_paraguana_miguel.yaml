  # ══════════════════════════════════════════════════════════════════
  # ⭐ LO QUE MÁS VALE: el nombre reposa sobre una palabra ATESTIGUADA
  # ══════════════════════════════════════════════════════════════════
  # Veintiuno de los 136 tienen como base una entrada del lexicón, y casi
  # todas `caquetío-atestiguado`. Es la vía más fuerte que tiene la campaña
  # —la misma por la que `urupagua` llegó al nivel A—: topónimo vivo +
  # palabra atestiguada = ecuación bilingüe sin necesidad de glosa de autor.
  con_base_lexica_atestiguada:
    n: 21
    pares:
      - {toponimo: Jacuque,    voz: jakuke,     glosa: 'regar, irrigar'}
      - {toponimo: Guaranao,   voz: waranao,    glosa: 'salado, ácido'}
      - {toponimo: Cayude,     voz: kayude,     glosa: 'árbol frutal, guanábano silvestre, turagua'}

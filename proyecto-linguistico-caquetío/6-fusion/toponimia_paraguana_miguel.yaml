  # ══════════════════════════════════════════════════════════════════
  cruces_que_abre_la_lista:
    - >-
      ⭐ TRES nombres son a la vez topónimo y voz del dictado de Medina:
      `Sividigua` (nivel A), `Chiriguare` (nivel A, el gavilán) y `Dividive`.
      Con `Adaro`~`dara` y `Chiguare` de la tanda anterior, ya son cinco. El
      patrón es claro y vale como criterio: en Paraguaná los parajes se
      nombran con el bicho o la planta que hay en ellos.
    - >-
      🔴 REVISAR MI PROPIO VEREDICTO: descarté `dividive` en nivel D del
      dictado por pancaribeñismo. Pero `dibidibe` está en el lexicón como
      caquetío-ATESTIGUADO y además es topónimo. Que la voz haya viajado por
      el Caribe no impide que también sea caquetía. El descarte fue demasiado
      duro y hay que rehacerlo.
    - >-
      `Churuguara` ya está en el lexicón etiquetado `jirajaroide-contacto`:
      es territorio Gayón, no caquetío. Buen recordatorio de que la lista
      cruza fronteras lingüísticas, no sólo administrativas.

  # ══════════════════════════════════════════════════════════════════
  homonimos_famosos_fuera_del_estado:
    correccion: >-
      🔴 Repartí ocho de estos nombres por Lara, Yaracuy, Zulia y Miranda, y
      di `Petare` por lapsus. Miguel lo corrige el 2026-09-10: «todos los que
      te mandé están en Falcón; si hay otros en Lara saldrán cuando pase por
      ahí». Se retira el reparto: la lista es de Falcón.
    por_que_me_equivoque: >-
      Reconocí el homónimo CÉLEBRE y supuse que era el único. La repetición de
      topónimos es la norma en Venezuela, no la excepción, y quien tiene el
      mapa delante es Miguel. Reconocer un nombre no es localizarlo.
    los_que_tienen_homónimo_conocido_en_otro_estado:
      - {forma: Carora, tambien_en: Lara}
      - {forma: Tocuyo, tambien_en: 'Lara (El Tocuyo); y en Falcón está Tocuyo de la Costa'}
      - {forma: Sanare, tambien_en: 'Lara; y hay Sanare en el municipio Acosta de Falcón'}
      - {forma: Araure, tambien_en: Portuguesa}
      - {forma: Aroa, tambien_en: 'Yaracuy (río y sierra de Aroa)'}
      - {forma: Quisiro, tambien_en: Zulia}
      - {forma: Tomoporo, tambien_en: Trujillo}
      - {forma: Petare, tambien_en: Miranda}
      - {forma: Guaruguaro, nota: 'el propio Miguel lo situó en el occidente del Zulia, misma región falconiana'}
    como_se_resuelve: >-
      Con COORDENADAS, no con discusión: al procesar cada nombre por la
      campaña se le busca su punto y ahí queda dicho de qué municipio es y,
      por tanto, de qué polity. Es un paso que la campaña ya hace.
    lo_que_el_barrido_osm_dice_hoy: >-
      El barrido sólo cubre Paraguaná y las ABC, así que no zanja los de
      Falcón continental. Sí encontró `Bajo Aroa` en Paraguaná (12.186,
      -70.033) — o sea que un Aroa peninsular existe. ⚠️ Con una cautela ya
      medida en esta campaña: «Bajo Aroa» es uno de los casos de RESEGMENTACIÓN
      CASTELLANA FALSA detectados (Bajabaroa → «Bajo Aroa»), así que ese punto
      concreto puede no ser un Aroa sino un Bajabaroa mal cortado. Otra razón
      para resolverlo nombre a nombre.

  siguiente_paso: >-
    Investigar online, uno a uno, empezando por los 21 con base léxica
    atestiguada: son los que pueden cerrar una ecuación bilingüe. Después los
    24 del barrido OSM, que ya tienen referente vivo. Los 76 nuevos, al final.

# marcados). Cruzados contra el canon, el índice de Esteves, el barrido OSM y
# el lexicón, con la permutación laxa de la campaña (j~s~u~h, b~v~p).
#
# Script del cruce: scratchpad de la sesión; el resultado se conserva aquí.
# ─────────────────────────────────────────────────────────────────────────

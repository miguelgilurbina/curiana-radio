meta:
  pregunta: ¿las formas indígenas de la retraducción de Pané de Bachiller (1883, pp. 165-184) coinciden
    con las de la Pané que usa el repo (Wikisource)?
  medido: '2026-09-23'
  script: 6-fusion/scripts/cotejar_pane_bachiller.py
  estado: PROPUESTA (regla 5)
  lo_que_declara_bachiller: 'p. 166: traduce de nuevo sobre la edición italiana de Milán (1614) y «restituye»
    los nombres indios «teniendo presente á Oviedo, P. Mártir, Rafinesque y Brasseur de Bourbourg». No
    vio la edición de Venecia (1571) y rechaza la de Bárcia.'
  umbral: 0.8
  aviso: OCR de archive.org sin corregir; `no-esta` puede ser una forma restituida hasta no parecerse
    (ver LEIDO_A_MANO).

trampas_declaradas:
  1: '«PARA DESIGNAR las aguas de un río lleno de arena»: el infinitivo es del compilador explicando su propia entrada, no glosa de la voz'
  10: '«Una luna. MEDICIÓN de tiempo»: «medición» es la etiqueta del compilador para decir de qué campo es la palabra; no es la glosa'
  47: 'igual que #10: «dos lunas. Medición de tiempo»'
  111: '«Distintivo de los nombres colectivos de abundancia»: es un AFIJO, y la glosa es metalingüística'
  132: '«Hoguera»: cosa, no nombre de acción'
  159: '«Mujer bella»: la criba la marca porque «mujer» acaba en -er'
  163: '«Mujer»: lo mismo'
  201: '«Ahí. ADVERBIO DE LUGAR»: la palabra «lugar» es la etiqueta gramatical del compilador'
  267: '«CUENTA de piedras»: es la chaquira, el abalorio — no el acto de contar. La trampa más limpia del glosario'
  264: '«Hierba de propiedades eméticas. USADO PARA CUAJAR quesos»: el infinitivo describe el uso que le da el castellano, no la voz'
  156: '«Hierba QUITA SED»: el compuesto es castellano'
  141: '«Barro de loza, PARA LA FÁBRICA de budares y ollas»: es la materia, no el instrumento'
  83: '«Tinaja pequeña»: un recipiente sin función declarada en la glosa no es nombre de instrumento; si se contaran todos los cacharros, el conjunto se llenaría de ruido'
  27: '«Calabaza con cal»: igual que #83 (y su gemela #220 `raporon`)'
  75: '«Poniente»: es un punto cardinal. Se mide aparte, en el bloque -ebo'

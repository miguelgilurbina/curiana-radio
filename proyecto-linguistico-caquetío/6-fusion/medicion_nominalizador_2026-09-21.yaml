otras_fuentes:
  oliver_a9:
    que_es: '«Selected Caquetío Vocabulary from the XVIth Century», Oliver 1989 Apéndice A, pp. impresas 593-594'
    entradas_transcritas: 49
    glosas_que_la_criba_marca: 1
    de_ellas_falsos_positivos: 1
    los_falsos:
      - ser viviente
    verbos_reales: 0
    ejemplos_de_glosa:
      - agua turbia
      - prado
      - higo, breva
      - demonio
      - ''
      - ser viviente
      - puche de maíz
      - vasija para el agua
      - gavilán
      - paraulata
      - diente
      - señor principal
    lectura: 'el vocabulario caquetío más antiguo del repo es enteramente NOMINAL: sin verbo no hay par verbo/nombre que retroabstraer'
  medina_colina_dictado:
    que_es: «Del Habla Paraguanera», dictado desde 2026-09-01
    entradas_dictadas: 66
    glosas_que_son_infinitivo: 0
    lectura: 'las voces vivas de Paraguaná son nombres; el dictado es parcial por diseño, así que es un cero DEL DICTADO'
  alvarado_1921:
    que_es: «Glosario de voces indígenas de Venezuela»
    receta: pdftotext -enc UTF-8 (pypdf no vale; trampa declarada)
    pdf_presente: true
    lectura: 'sus entradas con glosa verbal son verbos CASTELLANOS derivados de nombres indígenas —cachicamear, cebucanear, embijar, enguanepar, chigüirear—, no verbos indígenas. Un glosario de lo que el español TOMÓ prestado recoge nombres: es lo que se presta entre lenguas'
    medido_en: la bitácora de 4-fuentes/alvarado-1921.md
  arcaya_1920:
    que_es: «Historia del Estado Falcón», tomo I
    pdf_presente: true
    pagina_impresa: 75
    cita_literal: '«Pensamos, con fundadas razones, que también debe clasificarse en la familia lingüística nuarhuaca al idioma caquetío. No se conserva de él, desgraciadamente, vocabulario alguno, ni mucho menos hay frases que permitan conocer su estructura gramatical, pero sí quedan los nombres, muy numerosos por cierto, de los lugares que habitaron […] y nombres propios de personas»'
    lo_unico_que_da: 'de la Relación de Barquisimeto de 1579: «sabana», «Capu» (el demonio), «bariqué», «guadabacoa o adobacoa», «quiccide», «mene» y «cumaragua» — siete voces, las siete NOMBRES'
    y_una_frase_que_importa_para_el_otro_lado: 'misma página: las lenguas nuarhuacas «conjuga[n] los temas verbales y nominales, prefijándoles ciertos índices posesivos». Es lo que los agentes hicieron —y es de la FAMILIA, no del caquetío: describe conjugación, no derivación de nombres'
    aviso_de_extraccion: 'la capa de texto de este PDF pierde los acentos (Falc?n, ling??stica). La cita se transcribe restituyéndolos; el texto sin acentos es reproducible con `pdftotext -enc UTF-8`'
subproducto_ebo:
  aviso: '`-ebo` NO responde a d21.11: compone sobre NOMBRES, no sobre verbos. Se mide y se propone aparte'
  base_libre:

  runs: ["76ecf45c", "96b22194"]
  respuestas: 144
  respuestas_por_run: {"76ecf45c": 72, "96b22194": 72}
  script: 6-fusion/scripts/medir_formas_de_plantilla.py
  base: supabase local (docker exec supabase_db_curiana_sim psql)
  como_se_corre: 'python 6-fusion/scripts/medir_formas_de_plantilla.py'
  formas_de_plantilla: 5945
  formas_de_plantilla_antes: 5898
  ensanche: 47
  ensanche_dicho_en_estos_runs: ["ma-arua", "wa-duna", "wana-ni"]
  nota_lista: >-
    UNA puerta, construida desde las plantillas y nunca a mano:
    VOCABULARIO_BASE + formas_en_texto() de IDENTIDAD_LINGUISTICA,
    prompt_reglas_completo(), prompt_reglas_breve(), prompt_refuerzo()
    (sus cuatro tramos) y prompt_rescate_linguistico() (sus tres
    motivos). Las dos últimas no estaban en el viejo
    `_FORMAS_EXCLUIDAS` (5.898 formas) y sí enseñan formas: ma-arua,
    wa-duna, wana-ni, cati. El orquestador y analizar_nodos importan
    ésta.

control:

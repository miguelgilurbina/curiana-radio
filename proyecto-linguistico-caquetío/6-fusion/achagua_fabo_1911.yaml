noticias_bibliograficas:
- pagina: 113
  que: 'Cita Neira y Rivero 1762 (Arte y vocabulario); el Conde de la Viñaza; y un manuscrito autógrafo de Ezequiel
    Uricoechea: «Diccionario de la lengua de los achaguas extractado de los escritos de los PP. Juan Rivero y Alonso
    de Neira en el pueblo de Surmeno [Surimena], año 1762»'
- pagina: 114
  que: 'Arístides Rojas, Estudios indígenas: «La oración dominical en lenguas venezolanas», con un Padre Nuestro
    en achagua tomado de Vergara y Vergara (Historia de la Literatura en Nueva Granada, cap. VI), que también menciona
    un diccionario achagua autógrafo de un dominico. Lázaro María Girón, «Los antiguos achaguas», en El Papel.'
- pagina: 114-115
  que: 'Un manuscrito de 425 pp. «Lengua achagua, L. M. J.» (Miscelánea variarum compositionum in exerticiis idiomatis
    achaguae): pláticas sobre el Decálogo, los Sacramentos, el Credo, y catorce poesías. Fabo lo atribuye con «mucha
    probabilidad» al P. Rivero o al P. Neira. Empieza «Dios ibanacare yuchamacaje».'
texto_achagua_115:
  titulo: Masicatare yarro
  pagina: 115
  versos:
  - Jainataca Masicatare
  - Guata miniu guacha
  - Mata guaibaca girruri
  - Ribema giarena saicaba
  - Masicatare guamauca,
  - ¡Neba! caigibe macacha
  - Cayayi, catabacayi
  - Carrunatacayi taba
  - Cayagibe cariani
  - Lirrico cainabe yaca
  - Rimedanicaimi Dios
  - Cagicunabeni Igiagina.
  - Carruna sichay neni
  - Carruna mananicai yava
  - Tanasimi beni ichaba
  - Caichacai ichaba taba
  - Lirrico cagicunabeni
  - Naichaca mayabacaja
  - Cata queniu debe
  - Sichai becha machuacaja
  - Cabaracana lirrico
  - Ichaba nanacuchajaba
  - Cata saicabe erri say
  - Mecucanimiu naucha.
  - Bitamasi ichaba neni
  - Eno nenami ibicaubata
  - Carrunemica ribitama
  - Coacao ¡neba! nagiaca
  - Mananicay riani
  - Coacao yabaja amarra
  - Machuacayujani neni
  - Ayyujade machuacaja.
  nota: poesía asonantada copiada del manuscrito L. M. J.; es TEXTO achagua corrido, no lista de voces — material
    para morfología (nótese carruna-, lirrico, ichaba «leña», Dios, erri «sol»)
advertencias:
- 'Fabo declara no tener gramática achagua ni más que «unas cuantas docenas de palabras»: sus tablas son de fuente
  no declarada y con al menos un error grave (agua).'
- Las tablas se transcribieron de la imagen; la ortografía es la de Fabo (y/i, ck en Navarrick), no la del manuscrito.
- 'El cotejo con el manuscrito usa la transcripción por visión del escriba: verificar la forma exacta en imagen
  antes de citarla.'

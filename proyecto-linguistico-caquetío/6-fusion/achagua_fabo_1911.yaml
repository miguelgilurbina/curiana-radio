meta:
  obra: fabo-1911
  generado_por: 6-fusion/scripts/minar_fabo_1911_achagua.py
  minado: '2026-09-12'
  que_es: 'Lo achagua de Fabo 1911: dos tablas comparativas (pp. 108 y 111-112), el pasaje sobre la terminación
    -are (p. 109), la afirmación de que mena = agua (p. 111), noticias bibliográficas (p. 113-114) y un texto achagua
    copiado de un manuscrito de pláticas (p. 115). Fabo mismo: «del idioma achagua apenas poseo unas cuantas docenas
    de palabras» (p. 108) y «No conozco gramática alguna achagua» (p. 112).'
  paginas: impresas 108-115 = pdf 110-117; transcritas de la imagen, no del OCR (desplaza columnas)
  etiqueta_propuesta: comparanda achagua de SEGUNDA mano (Fabo no da su fuente para las tablas); vale como control
    de transmisión hacia Jahn, no como atestación
  cobertura_medida:
    tabla_108_filas: 23
    tabla_111_filas: 24
    voces_jahn: 34
    voces_jahn_con_forma_en_fabo: 13
    fabo_coincide_con_jahn: 9
hallazgo_principal:
  titulo: El «mena = agua» de Jahn es un error de Fabo, y el manuscrito lo desmiente
  cadena: 'Neira y Ribero 1762 (pliego 32): «Agua — Vni»; «Mar — Manoa» (74) → Fabo 1911 p. 111: «menoa ó mena quiere
    decir agua» y tabla «Agua — Menoa-mena» → Jahn 1927 p. 377: «agua = mena». Fabo tomó el MAR (manoa) por el agua,
    y Jahn lo copió. Verificado en imagen del manuscrito el 2026-09-12 («Aguador — Vni iserri», «Aguacero — Vnia»).'
  y_ademas: 'Fabo da DOS formas distintas para «agua» en sus dos tablas: Chitey (p. 108, frente al guaraní chity
    — sospechoso de ser guaraní o error) y Menoa-mena (p. 111). Ninguna es la del manuscrito. Los hidrónimos en
    -mena (Casimena, Surimena, Tauramena…) que Fabo explica como «agua» piden otra explicación.'
  consecuencia: toda comparación caquetío ↔ achagua hecha con las 34 de Jahn hereda este escalón; con el manuscrito
    delante, Jahn deja de ser la comparanda y pasa a ser control de transmisión
pasaje_are:
  pagina: 109
  texto: «Una de las terminaciones más empleadas en el achagua es are, como propia y exclusiva, por cuanto ni en
    el sáliva ni en el guahivo se ha descubierto; el guahivo termina muchas en arre y en ane, pero una ó dos únicamente
    en are; por lo cual creemos que los vocablos, ya sean de significación geográfica ya de usos domésticos, que
    subsisten en nuestros días, son reminiscencias de aquella habla. Con muchos de ellos se designan hoy ríos, lo
    cual hace sospechar que tal desinencia dice relación á río, agua ó cosas análogas, aunque bien puede sugerir
    nombres de tribus que habitaron las comarcas por donde cruzan esos ríos [...]. Dícese que are es raíz caribe
    y que significa «la gran sombra de invasión que venía subiendo las aguas del Magdalena... El creador Are vino
    del otro lado del río de muy lejanas tierras...» Restrepo Tirado, Invasiones caribes. [...] Casanare, Casiquiare,
    Guaviare, Tebiare, Sarrare, Manare, Guanare, Maremare, Atanare, Onocutare, Carare, Purare y otros muchos son
    nombres de ríos [...]; otros nombres nos quedan incorporados al castellano, como regionalismos, y son Budare,
    plancha de hierro para tostar masas, especialmente cazabe, arepa, cachapa, etc.; Cumare, palmera de fibra textil;
    y también se llaman así los chinchorros ó las hamacas que con tal fibra se manufacturan; Curare, una planta
    de la que se extrae el famoso veneno con que untan sus flechas y lanzas los indios. Caribabare es un cerro...»
  lectura: 'Fabo afirma -are «propia y exclusiva» del achagua, la asocia a hidrónimos de los Llanos (Casanare, Guaviare,
    Manare, Guanare…) y a regionalismos (budare, cumare, curare), y recoge —sin hacerla suya— la etimología caribe
    de Restrepo Tirado. Medido sobre el manuscrito por el escriba (achagua_neira_ribero_1762.yaml, censo_de_terminaciones):
    40 de 2.410 formas acaban en -re. La exclusividad no se sostiene en el LÉXICO; lo que Fabo vio es un patrón
    TOPONÍMICO de los Llanos. Para censo_terminacion_re.yaml: el -are de los ríos llaneros es un comparandum, y
    budare está en el habla paraguanera (Medina) y en el dictado con veredicto B.'
  toca:
  - 6-fusion/censo_terminacion_re.yaml
  - morfema-002
  - la hipótesis de Miguel sobre -re / catire
pasaje_mena:
  pagina: 111
  texto: '«téngase en cuenta que menoa ó mena quiere decir agua, en achagua, y por eso que hubiese algunos pueblos
    que acabaran en mena á orillas de los ríos y que hoy día haya muchos ríos ó quebraditas que tengan tal terminación:
    Casimena, Surimena, Tauramena, Iximena, Bujumena, Guachajumena, Guaijuena, Patimena, Tacarimena, Iguamena, Guariamena,
    Ypamena, Chitamena, Usamena, Charamena, Masimena.»'

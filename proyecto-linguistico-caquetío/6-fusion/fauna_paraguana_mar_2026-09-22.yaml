  # ── OTROS MAMÍFEROS ────────────────────────────────────────────
  - id: fm-010
    grupo: otros_mamiferos
    nombre: manatí
    cientifico: Trichechus manatus
    aguas: [costa_oeste, golfete]
    presencia_s_xv: dudosa
    por_que: >-
      Hoy sólo en Maracaibo, Paria y el Delta (ecologia-043). Necesita
      pastos marinos y agua dulce: el Golfete no tiene ríos perennes y
      Paraguaná ninguno. Oviedo dice que en Tierra Firme «hay muchos destos
      pescados» (t. I, p. 434), sin lugar. Ningún registro, ningún topónimo,
      ningún hueso en la costa caquetía. La glosa «vaca marina del golfete»
      de `manatü` es una acuñación de la simulación sin cita, no prueba.
    nombres:
      caquetio: {clave: manatü, capa: caquetío-hipotético, nota: 'acuñación F8 sin cita: NO es dato'}
      taino: {forma: manatí, nota: 'Oviedo p. 434: el nombre lo pusieron los cristianos («por esso los chripstianos le llamaron manatí») y en Tierra Firme lo nombran diverso según la lengua'}
      achagua: {forma: apia, fuente_repo: 'lexicon_achagua (Neira y Ribero 1762)', nota: 'Llanos: regla 4'}
    es_hueco: true
    descripcion_visual: 'Animal de agua corpulento y sin cuello, gris pardo, de piel arrugada con algas pegadas, dos brazos cortos con uñas y cola ancha como una pala; pace hierba en el fondo.'
    descripcion_fuente: {obra: wikipedia-es-fauna-marina, url: 'https://es.wikipedia.org/wiki/Trichechus_manatus'}
    sonido: {suena: sin-dato}
    procedencia:
      - {obra: oviedo-y-valdes-1851, pagina: '433-434'}
      - {obra: obis-gbif-caja-marina, pagina: 'clave: Trichechus manatus (0)'}


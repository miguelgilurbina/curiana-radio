  # ── DELFINES Y BALLENAS (hueco-lex-009) ─────────────────────────
  - id: fm-006
    grupo: cetaceos
    nombre: tonina costera (delfín estuarino)
    cientifico: Sotalia guianensis
    aguas: [costa_oeste]
    presencia_s_xv: probable
    por_que: >-
      Vive en el Lago de Maracaibo (ejemplares desde 1911, Romero et al. 1991
      p. 172), que desagua en el Golfo de Venezuela frente a la costa AMUAY:
      es el delfín de agua turbia y somera del sistema. Sin registro en
      Paraguaná (cero de muestreo, OBIS/GBIF).
    nombres:
      caquetio: null
      castellano_regional: {forma: 'tonina; soplón; delfín estuarino', obra: romero-mayayo-agudo-1991, pagina: 172}
      taino: {forma: null, nota: 'Oviedo usa el castellano «toñinas» (t. I, p. 424)'}
    es_hueco: true
    hueco_canon: hueco-lex-009
    descripcion_visual: 'Delfín pequeño, gris azulado por el lomo y los costados y gris claro por debajo, de hocico corto y bien marcado; anda en grupos por el agua turbia y baja de la costa.'
    descripcion_fuente: {obra: wikipedia-es-fauna-marina, url: 'https://es.wikipedia.org/wiki/Sotalia_guianensis'}
    sonido:
      suena: true
      que_suena: 'el resoplido al salir a respirar; el castellano de la costa le puso nombre por eso'
      onomatopeya_documentada: {forma: soplón, tipo: 'nombre vernáculo que ES el sonido', obra: romero-mayayo-agudo-1991, pagina: 172}
      silabeo_propuesto: {forma: 'juu', etiqueta: hipotetico}
    procedencia:
      - {obra: romero-mayayo-agudo-1991, pagina: 172}
      - {obra: obis-gbif-caja-marina, pagina: 'clave: Sotalia guianensis (0)'}


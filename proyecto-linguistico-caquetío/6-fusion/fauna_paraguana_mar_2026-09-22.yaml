    descripcion_visual: 'La tortuga más pequeña del mar, verde oliva, de caparazón redondeado casi como un corazón; no sale a esta playa, se la ve de paso comiendo.'
    descripcion_fuente: {obra: wikipedia-es-fauna-marina, url: 'https://es.wikipedia.org/wiki/Lepidochelys_olivacea'}
    sonido: {suena: sin-dato}
    procedencia:

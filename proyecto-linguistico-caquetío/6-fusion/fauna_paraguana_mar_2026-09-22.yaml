# ══════════════════════════════════════════════════════════════════
# COSMOVISIÓN MARINA — lo sostenido y lo no sostenido (regla 2)
# Miguel (2026-09-22): «el aspecto marino era esencial en la cosmovisión
# caquetía». Aquí se separa, sin mezclar, lo que dice una fuente de lo que
# todavía es su intuición. Las dos cosas valen.
# ══════════════════════════════════════════════════════════════════
cosmovision_marina:
  sostenido:
    - id: cm-s1
      dato: 'El caquetío atestiguado tiene palabras propias para el mar y su borde: `para` «agua dulce o salada en grandes cantidades» y `parawa` «mar», `kari` «orilla del mar», `samuro` «punta hacia el mar», `supi` «sitio a orilla del mar, arena».'
      etiqueta: atestiguado
      procedencia: {obra: zavala-reyes-2015, pagina: '#66, #190, #191, #223, #230'}
    - id: cm-s1b
      dato: 'En las islas el mar también está en el léxico que sobrevive: el topónimo arubeño Balashi «contains the root bala meaning the sea», y el papiamento viejo tenía sawáwa, «un tren de olas grandes».'
      etiqueta: reconstruido
      capa: 'la atribución caquetía es de van Buurt; papiamento, s. XIX-XX'
      procedencia: {obra: van-buurt-2014, pagina: '35, 41'}
    - id: cm-s2
      dato: 'La tierra misma se llama con el mar: Paraguaná. «Está suficientemente averiguado que Para significa agua», y «Conuco en medio del mar es la más repetida de las significaciones que le dan al topónimo».'
      etiqueta: atestiguado
      capa: 's. XX (tradición local impresa); la etimología «rodeada de mar» es LECTURA y depende de na = «tierra», que ninguna fuente da (toponimo-018, #109)'
      procedencia: {obra: esteves-1989, pagina: 56}
    - id: cm-s3
      dato: 'El mar es la despensa que la crónica le ve a esta gente: «pueblos medianos y mucha caza, pesca y ropa de hamacas»; «viciosos de comida de carne y pescado»; «mucho pescado de mar y de río».'
      etiqueta: atestiguado
      capa: 'contacto (Pérez de Tolosa 1546)'
      procedencia: {obra: arcaya-1920, pagina: '41, 46, 264'}
    - id: cm-s4
      dato: 'El mar da la moneda: «se servían como de monedas de ciertas conchas marinas»; «unas conchezuelas de pescados que tratan entre sí a valor de un real cada una».'
      etiqueta: atestiguado
      capa: contacto
      procedencia: {obra: arcaya-1920, pagina: '120, 264'}
    - id: cm-s5
      dato: 'Ir a pescar es una de las decisiones que se le preguntan al tabaco: «para ver si caminarán o yrán a pescar o sembrarán… cada uno es boratio».'
      etiqueta: atestiguado
      capa: 'contacto (Oviedo, vía Arcaya); regla 4: Oviedo generaliza para la provincia'
      procedencia: {obra: arcaya-1920, pagina: '98-99'}
    - id: cm-s6
      dato: 'El mar es camino: los caquetíos iban en canoa de Coro a Curazao; las islas son parte de su mundo y las expediciones a Las Aves traían botuto, quigua, tortugas decapitadas y aves.'
      etiqueta: atestiguado
      procedencia: {obra: arcaya-1920, pagina: 120}
      apoyo_en_repo: [ecologia-016, ecologia-021, ecologia-044]
    - id: cm-s7
      dato: 'El cerro sagrado es también la marca desde el mar: el «m. alto» de Juan de la Cosa es el cerro de Santa Ana, y Matividiro orienta a los pescadores de pargo mar adentro. El centro del bosque con dueño (Capó) se ve desde la canoa.'
      etiqueta: atestiguado
      capa: 'contacto (el mapa, c. 1500) y s. XX (Esteves); que eso sea UNA SOLA idea sagrada es lectura'
      procedencia: {obra: arcaya-1920, pagina: 134}
      apoyo_en_repo: ['creencia.yaml, Capó (Esteves p. 26)', 'sitios_era2.yaml, Capubana']
    - id: cm-s8
      dato: 'El pez da la luz para pescar: de noche, con jachos untados con manteca de cunaro. Técnica con dos voces caquetías atestiguadas (`jachos`, `kunaro`).'
      etiqueta: atestiguado
      capa: 's. XX sin fecha (Esteves); ecologia-078'
      procedencia: {obra: esteves-1989, pagina: 33}
  no_sostenido:
    - id: cm-n1
      intuicion: 'Que el mar tuviera un DUEÑO espiritual al que el pescador pedía permiso.'
      estado: >-
        Está escrito en el canon (CULTURA_CAQUETIA.md «[reconstruido]»;
        ecologia-036 lo pone en su implicación) pero sin fuente caquetía:
        creencia-015 (dueños del paisaje) es retro-abstraído desde María
        Lionza y habla de cerros, manantiales y salinas, no del mar. El único
        dueño atestiguado de la península es Capó, del BOSQUE del cerro.
      que_lo_subiria: 'una crónica, un topónimo o una voz caquetía que nombre a un ser del mar; en el repo, cero (ceros_verificados)'
    - id: cm-n2
      intuicion: 'Que el mar fuera ESENCIAL en la cosmovisión (mito de origen, rito, deidad marina).'
      estado: >-
        Sin fuente. Los ritos caquetíos atestiguados son la bebida de los
        huesos (creencia-010), el funeral del díao, el poder sobre los
        temporales (Manaure «da los temporales») y la adivinación con tabaco.
        El cielo y la lluvia tienen más peso atestiguado que el mar.
      que_lo_subiria: 'en orden de rendimiento esperado: (1) Oviedo t. II, libro XXV, capítulos de Coro, releído entero buscando «mar», «pescado», «tiburón», «tortuga» en contexto ritual; (2) los ajuares de los enterramientos dabajuroides (¿conchas marinas, dientes de tiburón?) — cruzar con M8; (3) la iconografía de los petroglifos (moron-2012-petroglifos) buscando motivos marinos'
    - id: cm-n3
      intuicion: 'Que la guarura (caracol-bocina) fuera instrumento ritual caquetío.'
      estado: 'La guarura es s. XX (Medina); la trompeta de botuto como objeto ritual es de la glosa del lexicón para el taíno `cobo` («trompeta ritual»), sin procedencia. Sin dato caquetío.'
      que_lo_subiria: 'un botuto con la punta cortada (bocina) en un sitio dabajuroide'
  comparanda:
    - id: cm-c1
      lengua: lokono
      dato: >-
        El mito arahuaco de Guayana recogido por Brinton: el espíritu de las
        aguas, la mujer Orehu, sale de las olas y le da a Arawanili la maraca
        del piache y el saber para tratar con el ser supremo; los arahuacos
        vivían entonces «en una isla al norte». La maraca de piedritas es el
        sonido que llama a lo invisible.
      etiqueta: atestiguado
      capa: 's. XIX (Brinton 1871, sobre fuentes de misioneros); lokono de Guayana'
      procedencia: {obra: brinton-1871, pagina: 18}
      limite: 'regla 4: es el lokono, lengua del andamio, no el caquetío. Dice que en la familia arahuaca el poder del piache PUEDE venir del mar; no dice que lo hiciera en Paraguaná'
    - id: cm-c2
      lengua: taíno
      dato: 'El origen del mar en la Española: Yaya guardó los huesos de su hijo en una calabaza colgada; los huesos se volvieron peces, la calabaza cayó y el agua que salió hizo el mar.'
      etiqueta: atestiguado
      capa: 'contacto (Pané, c. 1498); Española'
      procedencia: {obra: pane-c1498, pagina: 'caps. IX-X'}
      limite: 'la esfera de contacto, no el caquetío (la campaña del taíno: «ni vecino ni pariente medible»). Rima con que el caquetío BEBE los huesos (creencia-010): esa rima es lectura de esta campaña, no dato'
    - id: cm-c3
      lengua: wayuu
      dato: 'Para los wayuu las tortugas marinas son el «ganado» de Pulowi, y un cerro sagrado es donde ella las cura; son don de Maleiwa.'
      etiqueta: atestiguado
      capa: 'moderno (etnografía 2002-2017)'
      procedencia: {obra: barrios-garrido-2018, pagina: '187-188'}
      limite: 'el «ganado» es posterior a 1500 por definición; Pulowi es nombre wayuu y no se caquetiza (CULTURA_CAQUETIA.md)'
  veredicto: >-
    El mar es ESENCIAL en la economía, la moneda, el camino y el nombre de la
    tierra de los caquetíos, con fuente. En la RELIGIÓN, las fuentes caquetías
    no dicen nada del mar: lo que hay es comparanda de tres vecinos (lokono,
    taíno, wayuu) donde el mar sí da el poder del piache, el origen del agua
    o el rebaño de una dueña. La intuición de Miguel queda como hipótesis
    fuerte con tres caminos de prueba (cm-n2), no como dato.

# ══════════════════════════════════════════════════════════════════
# CANDIDATOS A REFERENTE — para REFERENTES_NOVEDOSOS (curiana_koine.py)
# Formato de la casa: `desc` ≤ 180 (algo que se ve y hay que nombrar),
# `se_oye` ≤ 80. Empieza por los dos huecos declarados en el canon.
# NO se tocan el motor ni el koine: esto es borrador para Miguel.
# ══════════════════════════════════════════════════════════════════
candidatos_referente:
  - id: delfin_soplon
    especie: [fm-006, fm-007]
    hueco_canon: hueco-lex-009
    desc_referente: 'unos peces grandes y grises que andan en grupo junto a la canoa, asoman el lomo, soplan y se hunden otra vez'
    se_oye: 'un soplo corto y húmedo cada vez que asoman'
    agua: 'las dos; la tonina costera, sobre todo la costa oeste'
    periodo: todo el año
    por_que: 'hueco declarado; animal visto a diario; la costa ya le puso nombre de sonido («soplón»)'
  - id: tortuga_que_desova
    especie: [fm-004]
    hueco_canon: hueco-lex-009
    desc_referente: 'de noche una tortuga enorme, de cuero y sin escudos, sale del mar, cava en la arena con aletas larguísimas, pone y tapa el hoyo'
    se_oye: 'resoplidos largos y, al tapar, gruñidos bajos'
    agua: costa_norte_y_este y Golfete
    periodo: 'P2 (junio-julio)'
    por_que: 'hueco declarado; el único animal marino del que hay sonido grabado en la playa'
  - id: tortuga_de_pico
    especie: [fm-002, fm-001]
    hueco_canon: hueco-lex-009
    desc_referente: 'dos tortugas de mar que parecen pareja: una de pico curvo y concha de placas aserradas, otra de cabeza redonda que pace en los bajos'
    se_oye: '—'
    agua: 'costa_norte_y_este; la verde también come en las dos aguas'
    periodo: 'P1-P2'
    por_que: 'hueco declarado; los pescadores de Paraguaná y los wayuu las tienen por macho y hembra: la clasificación está viva y pide nombre'
  - id: cardumen_que_hierve
    especie: [fm-024]
    hueco_canon: hueco-lex-002
    desc_referente: 'desde la punta se ve una mancha en el mar que hierve y brilla: miles de pececillos que suben juntos, con las aves cayendo encima'
    se_oye: 'un chapoteo que crece como lluvia sobre el agua'
    agua: costa_oeste (las atalayas)
    periodo: P1
    por_que: 'hueco declarado; tiene lugar propio (Sarabón, Suriquiba) y oficio (el vigía) sin palabra'
  - id: pez_que_truena
    especie: [fm-012, fm-013]
    desc_referente: 'un pez enorme y manchado que vive en las cuevas del fondo; de noche, bajo la canoa, se siente un golpe grave que retumba'
    se_oye: 'un retumbo hondo, como de tambor grande, bajo el agua'
    agua: golfete
    periodo: todo el año, de noche
    por_que: '`kunaro` nombra al pez pero no su voz; el sonido es de fuente (Boom) y el pez es el de la manteca de los jachos'
    aviso: 'no es hueco de especie (kunaro y kuna existen): es hueco del SONIDO'
  - id: pez_que_ronca
    especie: [fm-016]
    desc_referente: 'un pez plateado de pintas anaranjadas que, al sacarlo del agua, ronca en la mano'
    se_oye: 'un ronquido áspero, repetido, desde la garganta del pez'
    agua: las dos
    periodo: todo el año
    por_que: 'animal de pesca diaria sin nombre caquetío; el sonido ES el nombre en castellano (ronco, roncador)'
  - id: ballena_que_sopla
    especie: [fm-008, fm-009]
    desc_referente: 'mar afuera, un animal más largo que diez canoas echa un chorro de agua al aire y enseña un lomo gris con una aleta curva'
    se_oye: 'un bufido hondo que llega de lejos sobre el agua'
    agua: costa_norte_y_este, costa_oeste
    periodo: 'todo el año (rorcual tropical); P1 (jorobada, dudosa)'
    por_que: 'no hay palabra caquetía ni en el lexicón; distinto del referente vigente «bestia_orilla» (el animal varado y muerto)'
  - id: raya_que_vuela
    especie: [fm-029]
    desc_referente: 'una raya ancha y pintada, de hocico de pato y cola larga, sale volando del agua y cae de plano'
    se_oye: 'un golpe plano y seco al caer'
    agua: las dos
    periodo: todo el año
    por_que: 'animal visible desde la orilla y sin nombre caquetío'
    aviso: 'el sonido del golpe es inferencia del salto (FishBase), no de fuente'
  - id: manglar_que_chasquea
    especie: [fm-046]
    desc_referente: 'con la marea baja, entre las ostras de las raíces del mangle, se oye un crepitar que no se ve de dónde sale'
    se_oye: 'chasquidos secos y seguidos, como leña fina que cruje'
    agua: 'golfete (borde oeste, ecologia-011) — NO la laguna de Guaranao'
    periodo: todo el año
    por_que: 'un referente que se OYE antes de verse: pone a prueba el nombrar por el sonido'
  - id: concha_que_guarda_luz
    especie: [fm-038]
    hueco_canon: hueco-lex-009
    desc_referente: 'una concha plana y parda del fondo que por dentro brilla de colores, y a veces guarda una bolita blanca y dura'
    se_oye: '—'
    agua: 'costa_norte_y_este, costa_oeste, islas'
    periodo: 'P1 (agua clara del buceo, ecologia-017)'
    por_que: 'hueco declarado: la perla tiene palabra hipotética (tüma) y el molusco no tiene ninguna'

# ══════════════════════════════════════════════════════════════════
# PROPUESTAS AL CORPUS DE ECOLOGÍA (para Miguel; regla 5)
# ══════════════════════════════════════════════════════════════════
propuestas_ecologia:
  - id: pe-1
    tipo: hecho-nuevo
    contenido: 'Lo que se comía en la orilla del Golfete no era el botuto: en los sitios caquetíos de los Médanos (s. XIV-XVIII) el 42,4 % de la concha es chipichipi (Donax striatus) y el 27,0 % almeja (Callista); el botuto es el 1,0 %. El botuto es comida de las islas.'
    fuente: atestiguado
    procedencia: {obra: zavala-reyes-2018, pagina: 405}
    lectura: 'corrige el peso que ecologia-016/044 dan al botuto cuando se lee como comida de tierra firme'
    limite: 'el rango del sitio llega al s. XVIII: la tabla no separa precontacto de colonial'
  - id: pe-2
    tipo: hecho-nuevo
    contenido: 'Las cuatro tortugas marinas anidan hoy en Paraguaná, en la costa norte y este, de abril a septiembre (el pico en junio-julio: la seca larga); la costa oeste no tiene nidos y allí la tortuga sólo se ve en la pesca. En el Golfete se ha confirmado desove de la cardón y la verde, y Tacuato fue reportada como playa de la verde (1988).'
    fuente: atestiguado
    procedencia: {obra: rondon-medicci-2013, pagina: '114, 117, 119, 120'}
    limite: 'capa moderna; la abundancia del s. XV era mayor (ecologia-044). Los meses tienen techo: se recorrió marzo-septiembre'
  - id: pe-3
    tipo: hecho-nuevo
    contenido: 'Los pescadores de Paraguaná tienen al carey por el macho y a la tortuga verde por la hembra; los wayuu, al otro lado del Golfo, también.'
    fuente: atestiguado
    procedencia: {obra: rondon-medicci-2013, pagina: 116}
    apoyo: {obra: barrios-garrido-2018, pagina: 206}
    limite: 'moderno; la folk-taxonomía compartida entre las dos orillas del Golfo es dato de esfera, no de s. XV'
  - id: pe-4
    tipo: hecho-nuevo
    contenido: 'En Aruba caquetía el pescado de todos los días era de la orilla y del bajo: en Tanki Flip el macabí de hueso (warashi) es el 13,7 % de los restos de pez y el macabí el 5,2 %; peces que hoy casi no se comen por sus espinas.'
    fuente: atestiguado
    procedencia: {obra: van-buurt-2014, pagina: '33, 43'}
    limite: 'cita de segunda mano de Versteeg y Rostain 1997; islas, no la península'
  - id: pe-5
    tipo: hecho-nuevo
    contenido: 'La lisa salada viajaba de Paraguaná a las islas con su nombre: waranawa en papiamento, guaranaro en la península.'
    fuente: reconstruido
    procedencia: {obra: van-buurt-2014, pagina: 37}
    limite: 'el comercio que van Buurt describe llega hasta el s. XX; que el nombre viajara en el s. XV es su hipótesis'
  - id: pe-6
    tipo: hecho-nuevo
    contenido: 'El mar suena: el mero y la cuna retumban bajo el agua, los roncos roncan al sacarlos, las corvinas tamborean en la freza, el camarón pistola crepita entre las ostras, la tortuga cardón resopla y gruñe al tapar su nido, la tonina resopla al respirar (la costa la llama «soplón»).'
    fuente: atestiguado
    procedencia: {obra: fishsounds, pagina: 'Epinephelus itajara; Mycteroperca bonaci; Haemulidae; Sciaenidae'}
    apoyo: [{obra: cook-forrest-2005, pagina: '387-389'}, {obra: romero-mayayo-agudo-1991, pagina: 172}]
    implicacion_simulacion: 'canal sonoro para el motor ambiental (ecologia-038 ya lo pide para las aves): el agente puede OÍR el mar sin que se le explique'
  - id: pe-7
    tipo: re-etiqueta
    objetivo: ecologia-015
    contenido: 'El cunaro del corpus (Rhomboplites aurorubens, pargo de altura) no casa con la manteca de los jachos; la especie que da Zavala y Esteves («promicrops guasa») es el mero guasa (Epinephelus itajara), pez grande y graso de bajos y estuarios. Proponer que la identificación de `kunaro` quede en disputa y no fijada.'
    fuente: reconstruido
    procedencia: {obra: esteves-1989, pagina: 33}
  - id: pe-8
    tipo: hecho-nuevo
    contenido: 'Dos animales del mar de las Indias que Oviedo vio y ya no están o casi: el «lobo marino» (foca monje) que salía a dormir a las islas y roncaba tan fuerte que se oía de lejos, y el «pexe vihuela» (pez sierra) con su espada dentada.'
    fuente: atestiguado
    procedencia: {obra: oviedo-y-valdes-1851, pagina: '426, 428'}
    limite: 'Oviedo escribe de la Española y de Tierra Firme en general; su presencia en Paraguaná es dudosa (ecologia-040)'

# ══════════════════════════════════════════════════════════════════
# FAUNA QUE ESTA PARCELA DEJA A OTRAS (esquema común de la campaña)
# ══════════════════════════════════════════════════════════════════
para_otras_parcelas:
  FA2_aves: 'bobas (Sula) de las islas (ecologia-016), tigi «pequeña paloma que se alimenta de peces» (caquetío atestiguado, Zavala #247), las aves que caen sobre el cardumen (ecologia-038), tokoko (hipotético), la chogogo del papiamento (flamenco)'
  FA1_tierra: 'el zorro que se come las crías de tortuga en Cabo San Román (Rondón-Médicci p. 118); los caimanes de la laguna de Guaranao son POST-1985 (ecologia-084)'
  M8_arqueologia: 'Zavala Reyes et al. 2018 Tabla II está en la p. 405, no 404; buscar dientes de tiburón, conchas marinas y botutos perforados en ajuares dabajuroides (cm-n2)'

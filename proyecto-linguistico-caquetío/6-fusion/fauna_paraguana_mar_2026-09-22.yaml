    es_hueco: false
    descripcion_visual: 'Pez enorme y macizo, pardo amarillento o verdoso con pintas negras en la cabeza y el lomo, boca ancha; vive solo en los bajos de piedra y fango y entra a la boca de los caños.'
    descripcion_fuente: {obra: fishbase-sealifebase, url: 'https://www.fishbase.se/summary/Epinephelus-itajara.html', nota: 'describe al mero guasa, la lectura de la manteca'}
    sonido:

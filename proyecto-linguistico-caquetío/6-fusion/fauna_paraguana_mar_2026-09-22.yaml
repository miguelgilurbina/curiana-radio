# ─────────────────────────────────────────────────────────────────────────
# PROPUESTA — La fauna del MAR y de las orillas de Paraguaná en el s. XV
# Campaña de fauna, parcela FA3 (el mar). FA1 = tierra (campana/fauna-tierra),
# FA2 = aves, también las marinas y costeras (campana/fauna-aves): aquí NO se
# repiten; se citan.
#
# Encargo de Miguel, 2026-09-22 (verbatim, del preámbulo de la campaña):
#   «otro agente que busque y mine todas las especies que conviven en La
#    Península que podamos intuir que lo hacían en esa fecha, pensando en el
#    territorio pero también en el Mar tomando en cuenta que el aspecto marino
#    era esencial en la cosmovisión caquetía, el agente debe, buscar todos los
#    animales que son de la ecología de Paraguaná, sean migratorios, endémicos
#    o que sean simplemente de la ecología de la región, y luego va a realizar
#    una campaña para describirlos visualmente, y si es posible encontrar la
#    onomatopeya que hacen, así le damos a los agentes una descripción y
#    onomatopeya que "escuchar" por así decirlo.»
#
# Regla 5: esto PROPONE. No toca el motor, ni el lexicón, ni 3-mundo/corpus/.
# Mide y valida: 6-fusion/scripts/medir_fauna_mar.py (regla 1: las cifras de
# `meta.medido` las escribe ese script; si no coinciden, es un bug de aquí).
# Datos de ocurrencia: 6-fusion/fauna_mar_caja_obis_gbif_2026-09-22.yaml
# (generado por 6-fusion/scripts/caja_marina_obis_gbif.py).
# ─────────────────────────────────────────────────────────────────────────
meta:
  recogido: '2026-09-22'
  estado: sin-fusionar
  quien: FA3 (Claude Opus 5.5), campaña de minería 3
  rama: campana/fauna-mar
  pregunta: >-
    ¿Qué animales del mar y de la orilla vivían en las dos aguas de la era 2
    —el Golfete de Coro (GUARANAO) y la costa oeste del Golfo de Venezuela
    (AMUAY)— en el s. XV, cómo se veían y cómo sonaban, cómo se llaman en las
    lenguas de la esfera, cuáles no tienen nombre caquetío, y qué sostiene (y
    qué no) que el mar fuera esencial en la cosmovisión caquetía?
  respuesta_corta: >-
    El mar de la era 2 se puede poblar con prueba, pero la prueba es desigual:
    lo que se COMÍA está en los conchales (Zavala Reyes et al. 2018, Médanos de
    Coro, s. XIV-XVIII: chipichipi, almejas, lapas, botutito, ostra de mangle,
    y el botuto apenas el 1 %) y en la arqueología de las islas (Antczak 2015:
    botuto, quigua, tortugas decapitadas); lo que se VEÍA sale de la historia
    natural moderna, que vale para la forma y el sonido del animal pero no
    para su abundancia. Delfín y tortugas marinas siguen sin nombre caquetío
    (hueco-lex-009 confirmado): el castellano costero, el papiamento y el
    wayuu sí los nombran. El mar suena de verdad —el mero que retumba, los
    roncos que roncan al sacarlos, la tortuga cardón que resopla y gruñe al
    tapar el nido, el delfín que la costa llama «soplón»— y casi ninguna
    fuente da la onomatopeya: da el nombre del sonido. Sobre la cosmovisión:
    lo que está SOSTENIDO es que el mar es la despensa, la moneda (conchas),
    el camino a las islas y una de las faenas que se consultan al tabaco; lo
    que NO está sostenido todavía, con ninguna fuente caquetía, es un dueño,
    un mito o un rito del mar.
  lo_que_resulto_falso_al_medirlo:
    - que: 'la laguna de Guaranao como agua con manglar y peces para el s. XV'
      realidad: >-
        El manglar y la laguna de hoy nacieron hacia 1985 de un colector roto
        (ecologia-084, degradado el 2026-09-16; Aular Leal 2014). En el s. XV
        Guaranao era SALINA en la boca de una quebrada (Arcaya p. 22). Su
        fauna marina moderna (lisa, corocoro, lenguado) NO se proyecta.
    - que: 'Tabla II de Zavala Reyes et al. 2018 en la p. 404'
      realidad: >-
        La tabla está en la p. 405 de Interciencia 43(6): la cabecera y el
        pie de la página que la contiene dicen 405 (✅ imagen, 2026-09-22).
        La ficha zavala-reyes-2018 y el aviso del coordinador dicen 404.
    - que: 'kumarawa «caracol de las costas de Paraguaná» sin conflicto de especie'
      realidad: >-
        Esteves 1989 p. 33 (entrada CUMARAGUAS, las salinas) da otra cosa:
        «Cumaragua es el nombre que dan a un pequeño cangrejo de caparazón
        rosada», con la significación «espuma rosada». D10 adjudicó la glosa
        a Alvarado por localización sin tener este testigo. Va al issue.
    - que: '«manatí» como nombre taíno del animal'
      realidad: >-
        Oviedo (t. I, p. 434) dice lo contrario: los cristianos lo llamaron
        manatí por sus «dos manos», y le quitaron su nombre en la Española;
        en Tierra Firme «los nombran diversamente» según la lengua. El
        lexicón tiene `manati` como taíno sin procedencia y la lista maestra
        del taíno lo da como atestiguado primario por Oviedo p. 433 (que es
        la captura, no el nombre).
    - que: 'Esteves registra un topónimo «Manate» (p. 50 del índice)'
      realidad: 'es «Manare» (voz cumanagota, «cesto de fibra»): error del OCR del índice. Cero de manatí en el gazeteer.'
  como_se_midio:
    - 'OBIS y GBIF por API en tres cajas (península entera, Golfete, costa oeste): 6-fusion/scripts/caja_marina_obis_gbif.py → 6-fusion/fauna_mar_caja_obis_gbif_2026-09-22.yaml'
    - 'repo: 3-mundo/corpus/ecologia.yaml y creencia.yaml enteros; 6-fusion/sitios_era2.yaml y clima_era2.yaml; curiana_lexicon.VOCABULARIO_BASE filtrado por glosa marina y por capa; lexicon_gatschet.py; 6-fusion/medina_colina_dictado.yaml'
    - 'texto crudo releído: los seis OCR de Esteves 1989 (barridos por 40 raíces de fauna marina); Arcaya 1920 (pdftotext -layout; impresa = pdf − 8); van Buurt 2014 §3, §6, §8 y §11 enteros; Oviedo 1851 libro XIII caps. I-IX (impresa = pdf − 118, medido en 424 y 434); Pané caps. IX-X; Brinton 1871 p. 18; Zavala Reyes et al. 2018 Tabla II (imagen)'
    - 'fuentes nuevas leídas enteras o por capítulo: Rondón-Médicci 2013, Romero et al. 1991 (OCR, verificado en imagen), Barrios-Garrido 2018 caps. 6-7, Cook y Forrest 2005'
    - 'descripciones: FishBase/SeaLifeBase (80 fichas, «Morphology» y «Biology»), Wikipedia es (10 artículos de tortugas y mamíferos); sonidos: FishSounds (27 especies)'
    - 'Docker no se consultó: la campaña no necesita la base'
  convencion_de_paginas: >-
    Página IMPRESA en todas las obras. Esteves 1989 por el número de pie del
    OCR (el marcador «impresa» del OCR de Esteves es el del PDF de cada tomo,
    no el del libro). Oviedo 1851 t. I: impresa = pdf − 118 también en el libro XIII
    (verificado por la cabecera impresa en las pp. 424 y 434; la ficha avisa
    de que el desfase deriva en otros tramos).
    Romero et al. 1991: impresa = pdf + 168.
  vocabulario_de_etiquetas:
    presencia_s_xv:
      segura: 'en un conchal o sitio arqueológico de la esfera, o en crónica del contacto para esta costa, o con nombre caquetío atestiguado que la nombra'
      probable: 'presente hoy en estas aguas, hábitat constante desde ~4000 BP (ecologia-002), sin prueba arqueológica ni de crónica'
      dudosa: 'fuera de su área moderna conocida, o sólo por analogía, o con un único testimonio débil'
      excluida: 'llegó después de 1500 o su hábitat aquí es posterior (la laguna de Guaranao, 1985)'
    etiqueta: 'la del resto del repo: atestiguado · reconstruido · hipotetico · retro-abstraido (una por dato; en duda, degradar)'
  aguas:
    golfete: 'el Golfete de Coro, bahía somera de marea pequeña: orilla de GUARANAO (Tacuato, El Cayude), zona ZG2'
    costa_oeste: 'la orilla este del Golfo de Venezuela: AMUAY (Carirubana, Punta Cardón, Amuay), zona ZA1, con las atalayas de cardúmenes'
    costa_norte_y_este: 'la costa de barlovento de la península (Adícora, Buchuacos, El Supí, Cabo San Román): fuera de las dos zonas de la era 2, pero es donde salen las tortugas'
    islas: 'Aruba, Curazao, Bonaire y Las Aves: el alcance de las expediciones (ecologia-016, ecologia-021)'
    laguna_guaranao: 'en el s. XV, salina y ensenada (Arcaya p. 22); la laguna salobre con manglar es de 1985 (ecologia-084): su fauna NO se proyecta'
  periodos_del_canon: 'clima_era2.yaml: P1 Tiempo de Viento (enero-mayo), P2 la seca larga (junio-septiembre), P3 Tiempo de Siembra (octubre-diciembre)'
  regla_3: >-
    El animal (su forma, su sonido, su hábitat) es historia natural y no
    cambia en 600 años; su ABUNDANCIA sí (ecologia-039: el escenario es
    constante, el elenco no). Toda cifra de nidos, registros o capturas de
    abajo es del s. XX-XXI y no dice cuántos había en el s. XV — había más
    (ecologia-044). Lo que la gente HACÍA con el animal es de crónica del
    s. XVI o de tradición del s. XX, y se marca.
  regla_4: >-
    La unidad es la esfera. El papiamento guarda voces caquetías de las islas
    (van Buurt 2014); el wayuu es el vecino del otro lado del Golfo; el taíno
    es la esfera de contacto, y Oviedo describe peces de la Española y de
    Tierra Firme en general. Ninguno se importa como si fuera la orilla de
    Tacuato: se dice de dónde viene cada nombre.
  medido:
    # Lo escribe 6-fusion/scripts/medir_fauna_mar.py --conteos. No editar a mano.
    especies: 53
    por_grupo: {cetaceos: 4, crustaceos: 7, equinodermos_y_cnidarios: 3, moluscos: 11, otros_mamiferos: 2, peces: 17, tiburones_y_rayas: 4, tortugas: 5}
    por_presencia: {dudosa: 6, excluida: 2, probable: 31, segura: 14}
    es_hueco: 43
    con_nombre_caquetio: 15
    con_sonido_documentado: 15
    candidatos_referente: 10
    propuestas_ecologia: 8
    obras_citadas: 22
  ceros_verificados:
    - que: 'delfín, ballena, manatí o foca en la toponimia y el léxico de Paraguaná'
      raices: [delf, tonin, toñin, soplon, ballen, manat, lobo marin, foca]
      resultado: >-
        CERO en los seis OCR de Esteves (el único «delf» es el nombre propio
        Adolfo; «Manate» del índice es «Manare»), en Arcaya, en el dictado de
        Medina y en el lexicón caquetío (sólo `manatü`, acuñación hipotética
        sin cita). Oviedo sí nombra «toñinas» y «ballenas asaz» en su lista
        de los mares de las Indias (t. I, p. 424), no en la costa de Coro.
    - que: 'tortuga marina con nombre en Paraguaná'
      raices: [tortug, quel, carey, caguam, cardón, hicotea, jicotea]
      resultado: >-
        Esteves da «quelónidos» (Tumatey, p. 66) y «carey» sólo como ejemplo
        de fonética taína (p. 16). El lexicón tiene `hikotea` (tortuga de agua
        DULCE, reconstruida) y `hikoteya` (acuñación hipotética genérica).
        Los nombres de especie están en el castellano de los pescadores
        (Rondón-Médicci 2013) y en el wayuu (Barrios-Garrido 2018).
    - que: 'vertebrados marinos grandes en OBIS/GBIF dentro de la caja de la península'
      resultado: >-
        CERO registros de delfines, ballenas, manatí, foca monje, pez sierra,
        mero guasa y de tortugas verde y cabezona. Es un cero de MUESTREO:
        Rondón-Médicci 2013 da nidos de las dos tortugas y Romero et al. 1991
        un rorcual tropical «Paraguaná, Estado Falcón».
    - que: 'onomatopeya literal de un animal marino en las fuentes del repo'
      raices: [suena, sonido, ronca, ronc, sopla, resopl, chilla, bram, bufa, grita]
      resultado: >-
        Ninguna fuente de la costa transcribe el sonido de un animal marino.
        Lo que hay son NOMBRES que son sonido (ronco, roncador, soplón) y
        descripciones: la foca que «ronca tan recio que desde lejos se oye»
        (Oviedo p. 428), la guarura de caracol de «sonido agudo que se
        escuchaba a gran distancia» (Medina). Las onomatopeyas de FishSounds
        son inglesas (Boom, Croak, Boop).
    - que: 'un mito, un dueño o un rito del MAR caquetío'
      raices: [dueño, madre del agua, espíritu, mar, sirena, pescad]
      resultado: 'CERO en creencia.yaml, Arcaya, Oviedo (lo caquetío), Castellanos y Esteves. Ver cosmovision_marina.no_sostenido.'
  lo_que_no_se_encontro:
    - 'Ninguna lista de fauna de un conchal de la costa OESTE ni del Golfete paraguanero: el conchal cuantificado más cercano es el de los Médanos (Zavala Reyes et al. 2018). El de Pueblo Viejo (FAL-77, chipichipi) es foto sin cuenta (Oliver). La campaña de arqueología (M8, PR #203) no halló cuantificación por especie en Urbina, Casale ni Knaf'
    - 'Ningún hueso de pez identificado en un sitio caquetío de tierra firme. El único porcentaje de peces es de Aruba: Tanki Flip, macabí 5,2 % y macabí de hueso 13,7 % de los restos de pez (Versteeg y Rostain 1997, vía van Buurt pp. 33 y 43)'
    - 'Ninguna fuente fecha una estación de cardúmenes en el Golfo de Venezuela: la surgencia del Caribe sur (alisio fuerte de diciembre a abril) está en la literatura oceanográfica pero NO se leyó en esta sesión (403 en SciELO): deuda'
    - 'Ningún registro de delfín en Paraguaná ni en el Golfete en las fuentes leídas; la tonina costera (Sotalia) está documentada en el Lago de Maracaibo, en el mismo sistema del Golfo'
    - 'Ninguna fuente sobre sonido de tortugas verde, carey o cabezona; sólo de la cardón'

# ══════════════════════════════════════════════════════════════════
# LAS ESPECIES
# Cada `descripcion_visual` ≤ 220 caracteres, lo que ve un pescador del
# s. XV, sin comparaciones modernas; la fuente de la descripción va en
# `descripcion_fuente`. `sonido.silabeo_propuesto` es SIEMPRE hipotético.
# ══════════════════════════════════════════════════════════════════
especies:

  # ── TORTUGAS MARINAS (hueco-lex-009) ─────────────────────────────
  - id: fm-001
    grupo: tortugas
    nombre: tortuga verde
    cientifico: Chelonia mydas
    aguas: [golfete, costa_norte_y_este, costa_oeste]
    presencia_s_xv: probable
    por_que: >-
      Hoy pace en la península, que es zona de ALIMENTACIÓN de la especie más
      que de anidación; se confirmó desove en el Golfete y 6 nidos en la costa
      norte (2010). En la arqueología insular hay tortugas marinas consumidas
      en masa (Antczak 2015, ecologia-044), sin especie declarada: el grupo es
      seguro, la especie es probable.
    epoca: 'nidos en junio (2010) → P2, la seca larga; Guada y Vernet (1988) dieron Tacuato como playa de anidación de la verde, que 2010 no confirmó'
    antes_y_ahora: 'la especie más observada en los informes de 1988 y 2000; en 2010 ya no la más anidadora (Rondón-Médicci p. 119)'
    nombres:
      caquetio: null
      castellano_regional: {forma: tortuga verde, obra: rondon-medicci-2013, pagina: 116, nota: 'algunos pescadores la tienen por la HEMBRA del carey'}
      wayuu: {forma: 'Sawain (Sawaiunrrü)', obra: barrios-garrido-2018, pagina: 203, nota: 'es la `sa''wainrü` «tortuga de…» del lexicón (wayunaiki, glosa truncada)'}
      lokono: {forma: hikolhi, sentido: 'tortuga (genérico)', fuente_repo: 'curiana_lexicon, Goeje 1928 vía Pet 1987'}
      taino: {forma: null, nota: 'Oviedo sólo da «tortugas muy grandes» sin nombre indígena; «hicoteas» son las pequeñas (t. I, p. 424)'}
    es_hueco: true
    hueco_canon: hueco-lex-009
    descripcion_visual: 'Tortuga grande de caparazón liso de escudos pardos manchados, vientre amarillento, cabeza corta de pico sin gancho y una uña por aleta; pace en los bajos y sube a la playa sólo de noche.'
    descripcion_fuente: {obra: wikipedia-es-fauna-marina, url: 'https://es.wikipedia.org/wiki/Chelonia_mydas'}
    sonido: {suena: sin-dato, nota: 'ninguna fuente leída describe su sonido'}
    procedencia:
      - {obra: rondon-medicci-2013, pagina: '114, 116, 119'}
      - {obra: antczak-2015-las-aves, pagina: 13}

  - id: fm-002
    grupo: tortugas
    nombre: tortuga carey
    cientifico: Eretmochelys imbricata
    aguas: [costa_norte_y_este, costa_oeste, islas]
    presencia_s_xv: probable
    por_que: 'la más anidadora de la península hoy (37 nidos entre Punta Chaure y Punta Macolla, jul-sep 2010) y la única tortuga con registros en OBIS dentro de la caja (costa oeste)'
    epoca: 'nidos en abril (El Codo) y julio-septiembre (Punta Chaure-Punta Macolla) → P1 al final y P2'
    antes_y_ahora: 'su concha es el «carey» del comercio: la más cara en la Guajira hoy (Barrios-Garrido p. 187)'
    nombres:
      caquetio: null
      castellano_regional: {forma: carey, obra: rondon-medicci-2013, pagina: 116, nota: 'tenida por el MACHO de la verde'}
      wayuu: {forma: Carrei, obra: barrios-garrido-2018, pagina: 203, nota: 'el autor lo lee como calco del castellano (p. 206)'}
      taino: {forma: carey, nota: 'Esteves lo pone como ejemplo de fonética «caribe insular» (p. 16); sin cita de cronista en el repo'}
    es_hueco: true
    hueco_canon: hueco-lex-009
    descripcion_visual: 'Tortuga mediana de pico curvo y afilado como de ave, caparazón de placas superpuestas con el borde de atrás aserrado, y dos uñas en cada aleta; hurga entre las piedras y los corales.'
    descripcion_fuente: {obra: wikipedia-es-fauna-marina, url: 'https://es.wikipedia.org/wiki/Eretmochelys_imbricata'}
    sonido: {suena: sin-dato}
    procedencia:
      - {obra: rondon-medicci-2013, pagina: '116, 119'}
      - {obra: obis-gbif-caja-marina, pagina: 'clave: Eretmochelys imbricata'}

  - id: fm-003
    grupo: tortugas
    nombre: tortuga cabezona
    cientifico: Caretta caretta
    aguas: [costa_norte_y_este]
    presencia_s_xv: probable
    por_que: 'nidos en tres playas de la costa norte en mayo-junio de 2010 (Playa Sur, Rancho Grande, Piedras Negras: Tabla 2)'
    epoca: 'nidos en mayo y junio → final de P1 y P2'
    nombres:
      caquetio: null
      castellano_regional: {forma: 'cabezona; caguama', obra: rondon-medicci-2013, pagina: 116, nota: '«caguama» para Venezuela la trae SeaLifeBase (fishbase-sealifebase)'}
      wayuu: {forma: "Tagüari (Tagüari'já)", obra: barrios-garrido-2018, pagina: 203}
    es_hueco: true
    hueco_canon: hueco-lex-009
    descripcion_visual: 'Tortuga grande de cabeza muy ancha y pesada, caparazón pardo rojizo con tonos amarillos; sale del agua, sube la playa y raspa un hoyo en la arena donde cabe su cuerpo.'
    descripcion_fuente: {obra: wikipedia-es-fauna-marina, url: 'https://es.wikipedia.org/wiki/Caretta_caretta'}
    sonido: {suena: sin-dato}
    procedencia:
      - {obra: rondon-medicci-2013, pagina: '116, 119'}

  - id: fm-004
    grupo: tortugas
    nombre: tortuga cardón (laúd)
    cientifico: Dermochelys coriacea
    aguas: [costa_norte_y_este, golfete]
    presencia_s_xv: probable
    por_que: 'la más reportada por los pescadores (38 %) y con más nidos junto a la carey (La Encrucijada, Playa Norte, Puerto Escondido, Piedras Negras); desove confirmado también en el Golfete (Guada y Vernet 1990)'
    epoca: 'nidos en junio-julio → P2, la seca larga, de NOCHE'
    antes_y_ahora: 'los pescadores del Pico dicen que los turistas las alejaron (p. 119); los zorros se comen las crías en Cabo San Román (p. 118)'
    nombres:
      caquetio: null
      castellano_regional: {forma: tortuga cardón, obra: rondon-medicci-2013, pagina: 116}
      wayuu: {forma: 'Öjono (Achepa en la Guajira colombiana)', obra: barrios-garrido-2018, pagina: '203, 206'}
    es_hueco: true
    hueco_canon: hueco-lex-009
    descripcion_visual: 'La tortuga más grande: sin escudos, de cuero oscuro con siete quillas a lo largo del lomo, aletas delanteras larguísimas; sale de noche a cavar sobre la línea de la marea alta.'
    descripcion_fuente: {obra: wikipedia-es-fauna-marina, url: 'https://es.wikipedia.org/wiki/Dermochelys_coriacea'}
    sonido:
      suena: true
      que_suena: 'al desovar respira fuerte (exhalación-inhalación de casi un segundo), hace bombeos cortos con la garganta y, al tapar el nido, gruñe'
      onomatopeya_documentada: {forma: null, nombre_del_sonido: 'exhale/inhale, gular pumps, grunts', obra: cook-forrest-2005, pagina: '387-389'}
      silabeo_propuesto: {forma: 'jaaa-ju … gru', etiqueta: hipotetico, nota: 'resoplido largo y gruñido corto; forma de la campaña, no de fuente'}
    procedencia:
      - {obra: rondon-medicci-2013, pagina: '114, 116, 118, 119'}
      - {obra: cook-forrest-2005, pagina: '387-389'}

  - id: fm-005
    grupo: tortugas
    nombre: tortuga maní (golfina)
    cientifico: Lepidochelys olivacea
    aguas: [costa_oeste]
    presencia_s_xv: dudosa
    por_que: 'hoy sólo de paso a comer, la reconocen los pescadores de Amuay, Las Piedras y El Cayude (2,8 % de los reportes); no anida en la península'
    nombres:
      caquetio: null

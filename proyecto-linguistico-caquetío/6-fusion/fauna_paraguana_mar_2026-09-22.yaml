    aguas: [golfete]
    presencia_s_xv: segura
    por_que: >-
      Nombre caquetío atestiguado («Pez del golfete de Coro. Promicops
      Guasa», Zavala #96) y técnica con él (Esteves p. 33: la manteca que unta
      los jachos). La especie está en disputa: «promicrops guasa» es el mero
      guasa, pez enorme y graso que vive en bajos y estuarios, y casa con la
      manteca; el cunaro de FishBase (Rhomboplites) es un pargo de altura
      pequeño y magro. LECTURA de esta campaña: la manteca apunta al mero.
    antes_y_ahora: 'el mero guasa es muy vulnerable a la sobrepesca de sus agregaciones (FishBase/Wikipedia); cero registros hoy en la caja'

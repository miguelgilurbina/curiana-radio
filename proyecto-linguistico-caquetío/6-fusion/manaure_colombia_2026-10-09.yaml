# ═════════════════════════════════════════════════════════════════════════
# 6 · VEREDICTO
# ═════════════════════════════════════════════════════════════════════════
veredicto:
  desde_cuando: >-
    La Guajira: la primera mención del LUGAR que se pudo leer es de 1948
    (Steward, HSAI vol. 4, p. 374); hay una noticia sin verificar de 1864
    (salinas de Chimare, Manaure y Navío Quebrado) que probablemente viene de
    Aguilera Díaz 2004, y nada colonial con el nombre. Cesar: la tradición
    de fundación (1874-1875) es lo más viejo; ningún papel del s. XIX visto.
    En las fuentes coloniales del repo —Castellanos, Aguado, Pérez de Tolosa,
    Carvajal, Oviedo y Baños— el único Manaure es el de Coro; Oviedo y
    Valdés no nombra a ninguno (cero en sus cuatro tomos), y el mapa del
    s. XVI de la esfera occidental que acompaña su t. II tampoco.
  homenaje_o_herencia: >-
    Lo más probable, en los dos casos, es un nombre del s. XIX: homenaje o
    eco del Manaure de Coro, que la erudición del siglo ya había mudado al
    lago de Maracaibo (nota del editor de Carvajal, 1892) y que el Cesar
    repite («el cacique que gobernó Maracaibo»). Lo apoyan: la primera
    mención tardía, la falta de serie -aure en el oeste, que las tradiciones
    de los dos pueblos remiten al cacique venezolano y no a un pueblo local,
    y que ninguna crónica del s. XVI ponga un Manaure al oeste del golfo.
    Lo que impide cerrarlo: no se han leído los papeles del s. XVIII-XIX que
    decidirían (Aguilera 2004, Simons 1885, el Derrotero de 1810, Felipe
    Pérez 1863, la Carta del Magdalena de 1864). Si uno de ellos trae
    «Manaure» antes de 1850, el veredicto se reabre. Hoy: homenaje
    probable, herencia no documentada.
  y_si_fuera_titulo: >-
    Que Manaure fuera título (Antolínez y tres testigos más) haría posible un
    «Manaure» en la esfera occidental —había caquetíos en el Cabo de la Vela
    y en Juruara—, pero posible no es documentado: nadie lo registra allí.
    Lo único del oeste del s. XVI que se le parece es Mapaure, y Mapaure está
    entre pemenos y bubures, no entre caquetíos.
  bubures_y_buredes: >-
    La tradición del Cesar nombra bien a dos pueblos del s. XVI y pone a los
    buredes donde los pone el mapa de Oviedo (El Valle); el cacique Manaure
    de esa tradición no tiene documento. El único puente entre el Manaure de
    Coro y gente caribe es el matrimonio con «hijas de caribes» de 1526, que
    Oliver lee como jirajaras.
  para_la_era_2: >-
    Nada de esto entra en la simulación costera (regla 4): es esfera
    occidental, futura, y casi todo es del s. XIX-XX (regla 3). Lo que sí
    vale para el canon: Mapaure (un topónimo occidental de 1533), la lámina
    de los buredes en El Valle, la cita de Castillo sobre Chorna, la grafía
    Manaore y la cautela de manare.

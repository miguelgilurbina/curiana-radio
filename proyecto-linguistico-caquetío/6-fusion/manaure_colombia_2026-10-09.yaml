# 2 · LA FAMILIA -AURE EN EL OESTE
# ═════════════════════════════════════════════════════════════════════════
familia_aure_occidental:
  pregunta: '¿hay una familia de nombres en -aure en la Guajira, el Perijá, Maracaibo o el Cesar, como la hay en Paraguaná (Adaure, Timaure, Yaraure, Chunaure, Manaure; Esteves p. 13)?'
  hoy_mapa_vivo: >-
    Medido en OSM (Overpass, 2026-10-09, caja 8.5,-74.5,12.6,-70.9: la
    Guajira, el Cesar, el Magdalena oriental, el norte de Norte de Santander
    y casi todo el Zulia): sólo
    TRES nombres llevan una palabra en -aure, y los tres son Manaure:
    Manaure (La Guajira), Manaure Balcón del Cesar y el Río Manaure (medición
    §donde.overpass_oeste). Los demás aciertos de la sonda son «Laurel(es)»,
    «Mauren», «Cashaurechon», «Atasure», «Merrure». Ojo: OSM sólo tiene lo
    que alguien cartografió; un cero de OSM mide el mapa, no el habla.
  en_las_fuentes_del_repo: >-
    El barrido de toda palabra X-aure en los 106 textos (medición
    §familia_aure) da un solo nombre de lugar occidental del s. XVI:
    MAPAURE (1533, Juruara). Los demás aciertos con contexto occidental son el
    Manaure de Coro, voces comunes (cataure 'cesta', maure 'faja', ambas
    de Carvajal en los Llanos), o Paraguaná (Adaure, Chunaure en el índice de
    Esteves).
  fuera_de_la_kaketiana: >-
    El final -aure no es caquetío por sí mismo. Las mismas crónicas lo dan en
    tierras caribes y ajenas: Paralaure, cacique de Cainorocabo, en Trinidad
    (Oviedo t. II p. 210); Parataure/Harataure, isla en la boca del Orinoco
    (Oviedo t. II p. 217, t. IV p. 538); Perataure, en el Meta, y el
    Guayaure, nombre del Orinoco («el del Guayaure o Paria», Aguado);
    Urimaure, cacique de los tarmas, en la provincia de Caracas (Oviedo y
    Baños, ed. Fernández Duro t. II p. 50); la provincia de Baraure o Boraure,
    «en el principio de los llanos» (Oviedo y Baños; Aguado). Y Mapaure, entre pemenos y
    bubures de lengua caribe. Una terminación que reaparece de Trinidad al
    lago no prueba filiación caquetía.
  veredicto: >-
    No hay familia -aure en el oeste: hay UN Manaure por pueblo, más un río
    con el mismo nombre que su pueblo, y un Mapaure del s. XVI en Juruara.
    Eso NO reproduce el patrón de Paraguaná (cinco apellidos en serie) y, por
    lo que se ve en Trinidad y el Orinoco, aunque lo reprodujera no sería
    prueba de caquetío. Los dos Manaure colombianos se explican mejor como
    nombres sueltos que como restos de una serie.

# ═════════════════════════════════════════════════════════════════════════
# 3 · BUBURES Y BUREDES
# ═════════════════════════════════════════════════════════════════════════
bubures_buredes:
  lo_documentado:
    - 'Martín 1534 (vía Oliver DOC p. 201): «Arrededor de la laguna ay tanbien caquetios y bugures y los pemones».'
    - 'Pesquisa contra los Welser, 1538 (Ponce y Vaccari 1977, vía Oliver DOC p. 201): Alfinger saqueó Parepi, «pueblo de indios caquetios … amigos de cristianos», en Juruara; y «dos pueblos, uno de caquetios y otro de bobures en la provincia de Chorna [Juruara]» fueron herrados y enviados a Santo Domingo.'
    - 'Oviedo t. II pp. 271-272: «Los Buredes ocupaban las sierras altas de sabanas donde nace el río Comití (Macomiti). Son coronados» (vía Jahn 1927 p. 38; el pasaje está en la p. 272 del ejemplar).'
    - 'La lámina I del t. II de Oviedo (litografía de 1852 de un dibujo del códice; Jahn la atribuye al cosmógrafo Alonso de Chaves), vista en imagen: «Bubures» al occidente de «Maracaybo», al pie de la «Sierra de los Bubures»; «Buredes coronados» en «EL VALLE», entre esa sierra y la «Sierra Nevada»; Pauxoto, Xiriguanas y Pacabuyes más al sur; Coquibacoa, Cabo de la Vela y la Ramada en la costa. Ningún Manaure.'
    - 'Jahn 1927 p. 36: el nombre de los bubures «se ha conservado en la floreciente población de Bobures», en la costa sur del lago, con Oviedo y Baños (los llanos de San Pedro, «asiento de los Bobures, nación afable y poco belicosa»). Jahn p. 75: pemenos, quiriquires, bobures y buredes «ha[n] quedado reducida[s] a la tribu de los Motilones» del Perijá; Oliver hace a los buredes ancestros de los yukpa (etnia-005).'
  manaure_y_los_caribes: >-
    El único puente documental entre el Manaure de Coro y gente «caribe» es de
    1526: en la carta al Rey de AGI Santo Domingo (29-VIII-1526), Manaure
    «esta confederado y casado con hijas de caribes», y el testigo Acero
    «oyo decir quel dicho cacique de Coro es casado con una hija de un
    cacique de los caribes» (Ramos Pérez 1978: 236-237, vía Oliver DOC
    p. 270). Oliver lee que esas «caribes» eran casi seguro jirajaras de la
    Sierra de San Luis, y sólo «no puede descartar» mujeres de lengua caribe
    de verdad porque había aldeas caquetías entre los bubures de Juruara
    (Parepi). Es una posibilidad declarada, no un dato.
  lo_que_no_hay: >-
    Ninguna fuente —ni el repo, ni la web leída— une un «Manaure» (persona,
    título o lugar) con los bubures o los buredes, ni pone a un Manaure en el
    Perijá o el Valle de Upar. La tradición del Cesar acierta en los dos
    etnónimos y en el lugar de los buredes (lo que dice el mapa del s. XVI),
    y no tiene apoyo en el cacique.
  lectura: >-
    Dos explicaciones caben y no se pueden separar con lo que hay: (a) la
    tradición conserva memoria local de los pueblos del Perijá (los yukpa
    siguen allí), y el nombre del cacique se le pegó después; (b) la
    tradición es erudita: bubures y buredes están en Oviedo, Castellanos,
    Jahn y en el nombre del pueblo de Bobures, y el «Manaure de Maracaibo»
    estaba impreso desde 1892. Las dos piden lo mismo: el primer papel del
    s. XIX que diga «sabana de Manaure».
  contacto_con_los_caqueties_segun_oliver: >-
    Con los bubures, «more than a simple trade partnership» y aldeas caquetías
    dentro de su provincia (corresidencia, intensidad alta: etnia-004). Con
    los buredes, ninguno documentado salvo que el intérprete de Martín, que
    sabía caquetío, se entendía con coanaos y buredes (etnia-010; Oliver
    p. 218). El canon ya lo dice; esta sesión añade la cita de Castillo
    (dos pueblos vecinos, uno caquetío y otro bobure, en Chorna) y la lámina.

# ═════════════════════════════════════════════════════════════════════════
# 4 · HECHOS (esquema del corpus; ids provisionales)
# ═════════════════════════════════════════════════════════════════════════
hechos:

  - id: manaure-col-001
    contenido: >-
      En agosto de 1533 los cristianos de Maracaibo tenían sementeras de
      cazabe y maíz en Mapaure, «tierra de Xuduara» (Juruara), en la orilla
      sur-sureste del lago; la misma jornada pasó por pueblos de pemenos «que
      hablan como los bubures» (Roromoni, Aypiare, Uriri, Araburuco, Mahaboro,
      Carerehota, Ayanoboto, Huahuovano, Guaruruma, Huracara, Aracay, Horoco).
      Es el único nombre en -aure de la esfera occidental del s. XVI en las
      fuentes del repo.
    fuente: atestiguado
    polity: occidental
    epoca: contacto-temprano (1533)
    referencia: 'Oviedo y Valdés, Historia general y natural, t. II (1852), lib. XXV, cap. VIII, p. 295; visto en imagen'
    procedencia: {obra: oviedo-y-valdes-1852-1855, pagina: 't. II, 295'}
    esfera: lengua — toponimos (como nombre); geografia_politica (como lugar)

  - id: manaure-col-002
    contenido: >-
      Jahn identifica Mapaure con Moporo, «el principal poblado de
      Axuduara», y pone Axuduara en las tierras planas del lago desde la punta
      de Misoa hasta cerca de Garcitas. La identificación es suya.
    fuente: hipotetico
    polity: occidental
    referencia: 'Jahn 1927, pp. 32 y 41 (pdftotext, sin imagen)'
    procedencia: {obra: jahn-1927, pagina: '32, 41'}

  - id: manaure-col-003
    contenido: >-
      El mapa que acompaña la Historia de Oviedo (t. II, lámina I; Jahn lo
      atribuye a Alonso de Chaves) pone a los «Bubures» al occidente de
      Maracaibo, al pie de la «Sierra de los Bubures», y a los «Buredes
      coronados» en «El Valle» —el de Upar— entre esa sierra y la Sierra
      Nevada. No nombra ningún Manaure.
    fuente: atestiguado
    polity: occidental
    epoca: contacto-temprano (c. 1530-1548)
    referencia: 'Oviedo y Valdés, t. II (1852), lámina I (pdf 533), vista en imagen; Jahn 1927 p. 38 para la atribución'
    procedencia: {obra: oviedo-y-valdes-1852-1855, pagina: 't. II, lámina I'}
    implicacion: 'refuerza etnia-005 (burede): su «donde» ya dice Perijá y Ranchería; el mapa añade el Valle de Upar'

  - id: manaure-col-004
    contenido: >-
      En 1526 el Manaure de Coro estaba «confederado y casado con hijas de
      caribes» y, según un testigo, «casado con una hija de un cacique de los
      caribes». Oliver lee que eran jirajaras de la Sierra de San Luis y sólo
      no descarta mujeres de lengua caribe por las aldeas caquetías entre los
      bubures de Juruara.
    fuente: atestiguado
    polity: costera
    epoca: contacto-temprano (1526)
    referencia: 'AGI Santo Domingo, 29-VIII-1526, en Ramos Pérez 1978: 236-237, vía Oliver 1989 cap. 3, DOC p. 270 y n. 118-119'
    procedencia: {obra: oliver-1989-cap3, pagina: 'DOC 270'}
    reserva: 'la identidad de esas «caribes» es lectura de Oliver; con bubures, sólo una posibilidad (regla 2)'

  - id: manaure-col-005
    contenido: >-
      La «Tercera carta» del tomo de Pérez de Tolosa escribe el nombre
      «Manaore»: «en la comarca de la ciudad de Coro residía un cacique llamado
      Manaore, el mayor principal que en la gente caquetía se hallaba, y
      andando el tiempo, por malos tratamientos, se ausentó do murió». Una
      grafía más para las sondas (regla 6).
    fuente: atestiguado
    polity: costera
    epoca: contacto (c. 1529-1546)
    referencia: 'Fernández Duro 1885, t. II p. 248'
    procedencia: {obra: perez-de-tolosa-1546, pagina: '248 (FD t. II)'}

  - id: manaure-col-006
    contenido: >-
      En 1647 el recuerdo del «gran Manavre» de Coro estaba «muy fresco» en
      los llanos del Apure: se decía que se retiró con mucha gente por las dos
      bandas del Apure hasta la laguna de Caranaca. Es la tradición del
      Manaure que se va hacia el sur, no hacia el oeste.
    fuente: atestiguado
    polity: llanos
    epoca: colonial (1647)
    referencia: 'Carvajal 1648, ed. 1892, pp. 147 y 317 (OCR de archive.org, sin imagen)'
    procedencia: {obra: carvajal-1892, pagina: '147, 317'}

  - id: manaure-col-007
    contenido: >-
      En 1892, la nota del editor de Carvajal hace al «gran cacique Manaure»
      «soberano de las naciones índicas que habitaban las inmediaciones de la
      laguna de Maracaybo». Lo atestiguado es que esa leyenda circulaba
      impresa a fines del s. XIX; que Manaure gobernara Maracaibo no lo dice
      ninguna crónica del s. XVI del repo.
    fuente: atestiguado
    polity: occidental
    epoca: s. XIX (1892)
    referencia: 'Carvajal, ed. de León 1892, «Apuntes biográficos», p. 408 según el OCR (sin imagen)'
    procedencia: {obra: carvajal-1892, pagina: '408 (apéndice del editor)'}

  - id: manaure-col-008
    contenido: >-
      «Manare» es el harnero o tamiz de caña tejida para cerner la harina de
      yuca; «en Occ. y la Cord.», un aro de mimbre colgado del techo; voz
      caribe, chaima y cumanagota, «en aruaco, manali»; y Carvajal la escribe
      «incorrectamente manaure» («cataures y manaures muy labrados», 1647).
      En la pluma colonial, Manaure y manare pueden confundirse.
    fuente: atestiguado
    polity: llanos
    referencia: 'Alvarado 1921, pp. 199-200 (MANARE); Carvajal 1892 p. 168 (OCR)'
    procedencia: {obra: alvarado-1921, pagina: '199-200'}

  - id: manaure-col-009
    contenido: >-
      En las montañas merideñas y en la cuenca del lago de Maracaibo los
      campesinos llaman «Arco Manare» o «Arco Manaure» al halo luminoso
      alrededor de la Luna, y recomiendan cuidarse de su influjo (Morón, con
      Alvarado y Clarac).
    fuente: atestiguado
    polity: ninguna (folclore moderno andino y lacustre)
    epoca: s. XX
    referencia: 'Morón 2012, p. 167 (pdf 7)'
    procedencia: {obra: moron-2012-petroglifos, pagina: '167'}

  - id: manaure-col-010
    contenido: >-
      «Arco Manaure» se explica mejor por el «manare» —el aro de mimbre que
      Alvarado documenta «en Occidente y la Cordillera»— que por el cacique:
      un halo es un aro. Morón lo lee como el título del sacerdote-rey; esa
      lectura no se adopta.
    fuente: hipotetico
    referencia: 'proyecto (esta sesión), sobre Alvarado 1921 pp. 199-200 y Morón 2012 p. 167'
    procedencia: {obra: alvarado-1921, pagina: '199-200'}
    lo_haria_subir: 'una atestación de «arco manare» como nombre del halo en un vocabulario andino o zuliano'

  - id: manaure-col-011
    contenido: >-
      A mediados del s. XX, en la temporada de la sal, los guajiros del
      interior acudían a Manaure, donde se les pagaba por cargar los sacos al
      almacén y a los barcos: los hombres llenaban los sacos, las mujeres los
      cargaban.
    fuente: atestiguado
    polity: ninguna (wayuu, s. XX)
    epoca: s. XX (1948)
    referencia: 'Armstrong y Métraux, «The Goajiro», en Steward (ed.) 1948, HSAI vol. 4, p. 374'
    procedencia: {obra: steward-1948-hsai-4, pagina: '374'}
    nota: 'la primera mención del lugar que esta sesión pudo leer'

  - id: manaure-col-012
    contenido: >-
      Manaure (La Guajira) es municipio desde el 1 de octubre de 1974
      (ordenanza 015 de 1973); la alcaldía remonta los primeros habitantes
      europeos y mestizos a 1723 «aproximadamente» y atribuye el nombre, por
      tradición oral, a un «Cacique Manaure».
    fuente: hipotetico
    referencia: 'alcaldía de Manaure vía es.wikipedia (consultada 2026-10-09)'
    deuda: sin-procedencia
    url: 'https://es.wikipedia.org/wiki/Manaure_(La_Guajira)'

  - id: manaure-col-013
    contenido: >-
      Manaure Balcón del Cesar se funda en 1874 o 1875 por Buenaventura Maya,
      ganadero de La Paz; corregimiento de Los Robles La Paz en 1913 y
      municipio en 1980. La Gobernación del Cesar (1997) dice que Maya le dio
      el nombre en honor de un cacique Manaure «que gobernó Maracaibo».
    fuente: hipotetico
    referencia: 'en.wikipedia y es.wikipedia (alcaldía; Gobernación del Cesar 1997), consultadas 2026-10-09'
    deuda: sin-procedencia
    url: 'https://en.wikipedia.org/wiki/Manaure,_Cesar'

  - id: manaure-col-014
    contenido: >-
      Tradición oral del Cesar: la sabana de Manaure la habitaban «indios
      bobures o boredes», caribes venidos de Venezuela por el Perijá, nómadas,
      cazadores, pescadores y de agricultura incipiente, con un cacique
      Manaure; al irse la tribu, la sabana se quedó con su nombre. Los dos
      etnónimos son del s. XVI (bubure, burede); el cacique no tiene
      documento.
    fuente: hipotetico
    tipo: tradicion-oral
    referencia: 'alcaldía de Manaure Balcón del Cesar, «Nuestro municipio», vía EcuRed (consultada 2026-10-09)'
    deuda: sin-procedencia
    url: 'https://www.ecured.cu/Manaure_Balc%C3%B3n_del_Cesar_(Colombia)'

  - id: manaure-col-015
    contenido: 'Etimología popular del Cesar: «sabana donde mana la ubre», contraída en Manaure.'
    fuente: hipotetico
    tipo: etimologia-popular
    referencia: 'EcuRed (alcaldía), consultada 2026-10-09'
    deuda: sin-procedencia
    url: 'https://www.ecured.cu/Manaure_Balc%C3%B3n_del_Cesar_(Colombia)'

  - id: manaure-col-016
    contenido: >-
      Hoy, en la Guajira, el Cesar, el Magdalena oriental, el norte de Norte
      de Santander y casi todo el Zulia, sólo tres nombres del mapa (OSM)
      llevan una palabra en -aure, y
      los tres son Manaure (el pueblo guajiro, el del Cesar y su río). No hay
      serie -aure en el oeste como la de Paraguaná.
    fuente: atestiguado
    referencia: 'OpenStreetMap vía Overpass, 2026-10-09 (consultas y respuesta literal en la medición §donde.overpass_oeste)'
    deuda: sin-procedencia
    url: 'https://overpass.kumi.systems/api/interpreter'
    nota: 'la capa osm-kaketiana de la bibliografía es la de Falcón; esta caja no está en el repo'

  - id: manaure-col-017
    contenido: >-
      El final -aure aparece en las crónicas lejos de los caquetíos: Paralaure,
      cacique de Cainorocabo en Trinidad; Parataure o Harataure, isla en la
      boca del Orinoco; Urimaure, cacique de los tarmas; Perataure, en el
      Meta, y Guayaure, nombre del Orinoco; Mapaure, entre pemenos y bubures.
      No es marca caquetía por sí solo.
    fuente: atestiguado
    referencia: 'Oviedo t. II pp. 210 y 217, t. IV p. 538; Oviedo y Baños ed. Fernández Duro t. II p. 50; Aguado, Historia de Venezuela (texto de Gutenberg, sin página)'
    procedencia: {obra: oviedo-y-valdes-1852-1855, pagina: 't. II 210, 217; t. IV 538'}
    implicacion: 'para 6-fusion/antroponimos_caquetios.yaml §formantes (-aure): el formante es de nombre de persona en Paraguaná, pero la terminación recurre en tierras caribes; el «atestiguado» del formante no debe leerse como «exclusivo»'

  - id: manaure-col-018
    contenido: >-
      En Juruara, en 1538, la pesquisa contra los Welser habla de «dos
      pueblos, uno de caquetios y otro de bobures en la provincia de Chorna»,
      saqueados por Luis de Leiva y enviados herrados a Santo Domingo: aldeas
      caquetías y bubures vecinas, no mezcladas.
    fuente: atestiguado
    polity: occidental
    epoca: contacto-temprano (1529-1538)
    referencia: 'testimonio de Hernando del Castillo, Ponce y Vaccari 1977: 171, vía Oliver 1989 cap. 3, DOC p. 201 y n. 32'
    procedencia: {obra: oliver-1989-cap3, pagina: 'DOC 201'}
    implicacion: 'refuerza geografia_politica-009 y etnia-004 con una segunda cita, independiente de la de Parepi'


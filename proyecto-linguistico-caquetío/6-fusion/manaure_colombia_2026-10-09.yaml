# 1 · LOS TOPÓNIMOS
# ═════════════════════════════════════════════════════════════════════════
toponimos:

  - id: manaure-guajira
    nombre: 'Manaure (La Guajira, Colombia), también «Salinas de Manaure»'
    ubicacion:
      lat: 11.7771128
      lon: -72.4469366
      origen: 'OSM node 313909383 (place=town), consulta Overpass del 2026-10-09; costa caribe de la Media Guajira'
      distancias_medidas: 'a Coro 305,5 km; al Cabo de la Vela 55,9 km (medición §donde)'
    municipio_desde: >-
      1-X-1974 (ordenanza 015 de 1973), según la alcaldía vía es.wikipedia.
      deuda: sin-procedencia.
    primera_mencion:
      fecha: '1948 (publicación); describe el s. XX'
      fuente: 'steward-1948-hsai-4, p. 374 (Armstrong y Métraux, «The Goajiro»)'
      cita: '«During the salt season the Indians of the interior flock to Manaure, where they are paid for loading sacks of salt into the warehouse and onto ships.»'
      url: 'https://archive.org/details/bulletin14341948smit'
      verificado: 'sí, en la capa de texto del repo; no en imagen'
      reserva: >-
        Es la primera que esta sesión pudo LEER, no la primera que existe. La
        página siguiente (p. 375) cita a Simons 1885 para los clanes: un
        viajero de 1885 con mapa de la península, que muy probablemente
        nombra el lugar (fuentes_a_buscar).
    menciones_anteriores_sin_verificar:
      - fecha: '1864'
        dicho: '«La producción de sal en La Guajira era conocida desde 1864 cuando se encontraban activas las salinas de Chimare (Uribia), Manaure y Navio Quebrado (Riohacha)»'
        de_donde: 'resumen de un buscador (2026-10-09); la página de origen no se identificó. Probablemente Aguilera Díaz 2004 (BanRep), que es la fuente de la historia en en.wikipedia'
        etiqueta: 'sin verificar — no entra como hecho'
      - fecha: '1777'
        dicho: '«Ya en 1777, se otorgaban concesiones para explotar las salinas»'
        de_donde: 'las2orillas.co, sin fuente; no dice que la salina fuera la de Manaure'
        etiqueta: 'sin verificar — no entra'
      - fecha: '1723'
        dicho: '«los primeros indicios de habitantes de origen europeo y mestizo se remontan al año 1723 aproximadamente»'
        de_donde: 'alcaldía de Manaure vía es.wikipedia; en.wikipedia lo convierte en «Founded 1723»'
        etiqueta: 'sin verificar; no es mención del NOMBRE, es una fecha de poblamiento sin documento'
      - fecha: 's. XVIII (sin año)'
        dicho: 'una cédula real que reconoce a los wayuu la propiedad de las salinas de Manaure y Sorshimana'
        de_donde: 'Alzate 2017 (Universo Centro), sin fecha, rey ni signatura'
        etiqueta: 'sin verificar — no entra'
    menciones_posteriores:
      - '1862: Mosquera destina las salinas marítimas de la Guajira a «la civilización de los indígenas» (Alzate 2017; no nombra Manaure en lo citado)'
      - 'c. 1920-1922: concesiones a particulares en Manaure; Luis Cotes (columnas de prensa, sin fuente primaria)'
      - '1941: el Banco de la República toma la concesión de las salinas marítimas (prensa; Aguilera Díaz 2004 por leer)'
      - '1948: Steward, HSAI vol. 4, p. 374 (arriba)'
      - '1974: municipio'
    origen_del_nombre:
      - version: 'del «Cacique Manaure»'
        etiqueta: tradicion-oral
        de_donde: 'alcaldía vía es.wikipedia («según la tradición oral»)'
      - version: 'homenaje al cacique caquetío de Coro, bautizado en 1527'
        etiqueta: 'divulgación sin documento (homenaje no fechado)'
        de_donde: 'es.wikipedia y textos turísticos; uno de ellos lo hace «asesinado en 1821», fecha imposible para el cacique del contacto'
      - version: '«el resplandor de un indígena de gran abolengo»'
        etiqueta: tradicion-oral
        de_donde: 'citada en la pregunta de Miguel; la fuente no se localizó'
      - version: 'voz wayuunaiki que «evoca fortaleza y liderazgo»'
        etiqueta: etimologia-popular
        de_donde: 'venere.it (sitio de nombres de bebé), sin diccionario ni raíz'
      - version: >-
          eco de un TÍTULO caquetío en la esfera occidental: Martín (1534)
          pone «coanaos e caquetíos» en Coquibacoa y el Cabo de la Vela, y el
          Cabo está a 55,9 km
        etiqueta: hipotetico
        de_donde: 'proyecto (esta sesión). Lo haría subir: un documento colonial que nombre «Manaure» (lugar o persona) en la Guajira. Lo hunde: que la primera mención sea del s. XIX'
      - version: 'la homógrafa «manare» (cernidor, aro de mimbre)'
        etiqueta: hipotetico
        de_donde: >-
          proyecto. Se anota como CAUTELA, no como propuesta: Carvajal (1648)
          ya escribe «manaures» por manares (Alvarado 1921 p. 199), así que en
          la pluma colonial los dos nombres pueden confundirse. Ningún
          indicio de que el topónimo guajiro venga de ahí.
    regla_3: 'nada de esto es precontacto; la sal guajira sí es antigua (arqueología por mirar), el NOMBRE no tiene fecha antes del s. XIX en lo leído'

  - id: manaure-cesar
    nombre: 'Manaure Balcón del Cesar (Cesar, Colombia); y el Río Manaure'
    ubicacion:
      lat: 10.3910411
      lon: -73.0270699
      origen: 'OSM node 468769318 (place=town), Overpass 2026-10-09; vertiente occidental de la Serranía del Perijá, sobre el valle del Cesar (el Valle de Upar)'
      rio: 'Río Manaure: OSM ways 279294636 y 871531038 (waterway=river)'
      distancias_medidas: 'a La Paz 15,7 km; a Bobures (Zulia) 240,1 km; a Coro 383,7 km; a Manaure de la Guajira 166,6 km (medición §donde)'
    fundacion: >-
      1-I-1874 (en.wikipedia, citando a la Gobernación del Cesar 1997) o 1875
      (alcaldía vía es.wikipedia), por Buenaventura Maya, ganadero de La Paz.
      Corregimiento de Los Robles La Paz en 1913; municipio por ordenanza 28
      del 28-XI-1980 (019 de 1980 según es.wikipedia). deuda: sin-procedencia.
    primera_mencion:
      fecha: '1874-1875 (tradición de fundación)'
      fuente: 'alcaldía de Manaure Balcón del Cesar, «Historia» (vía en/es.wikipedia y EcuRed); Gobernación del Cesar, Cesar 30 años de progreso (1997)'
      url: 'https://en.wikipedia.org/wiki/Manaure,_Cesar'
      verificado: 'no: ningún documento del s. XIX visto. La «sabana de Manaure» sería anterior a la fundación según las dos tradiciones'
    origen_del_nombre:
      - version: 'los «indios bobures o boredes», caribes venidos de Venezuela por el Perijá, se asentaron en las colinas de la sabana con su cacique Manaure, y la sabana se quedó con su nombre'
        etiqueta: tradicion-oral
        de_donde: 'alcaldía vía EcuRed («según nuestros antepasados»); en.wikipedia (SINIC) dice «Bohures»'
        lo_que_tiene_de_documentado: >-
          Los DOS etnónimos son del s. XVI y están en el canon (etnia-004
          bubure, etnia-005 burede); la lámina del t. II de Oviedo pone a los
          «Buredes coronados» en EL VALLE (el de Upar) y a los «Bubures» al pie
          de la «Sierra de los Bubures», vista en imagen. El cacique Manaure de
          esa tradición, no: ninguna fuente lo pone allí.
      - version: '«sabana donde mana la ubre», contraída en Manaure'
        etiqueta: etimologia-popular
        de_donde: 'EcuRed (alcaldía)'
      - version: 'Buenaventura Maya lo llamó así en honor del «Cacique Manaure which ruled Maracaibo» / «del Occidente Venezolano … más allá de la costa oriental del Lago de Maracaibo»'
        etiqueta: 'homenaje (divulgación, sin documento)'
        de_donde: 'en.wikipedia (Gobernación del Cesar 1997) y es.wikipedia'
        nota: >-
          La idea de un Manaure señor de Maracaibo ya circulaba impresa en
          1892: el editor de Carvajal lo hace «soberano de las naciones índicas
          que habitaban las inmediaciones de la laguna de Maracaybo» (hecho
          manaure-col-007). Ninguna crónica del s. XVI del repo lo pone allí;
          el Manaure documentado es de Coro.
    regla_3: 'la fundación es de la segunda mitad del s. XIX; los etnónimos son del s. XVI; nada es precontacto'

  - id: cacique-manaure-falcon
    nombre: 'Municipio Cacique Manaure (Falcón, Venezuela), cabecera Yaracal'
    ubicacion: {lat: 10.974934, lon: -68.5452435, origen: 'Nominatim: way 1426715582 (Yaracal); a 131,5 km de Coro (medición)'}
    primera_mencion: {fecha: 'moderna (no verificada)', fuente: 'deuda: sin-procedencia', verificado: false}
    origen_del_nombre:
      - {version: 'homenaje al cacique de Coro', etiqueta: 'homenaje moderno (así lo da la pregunta; no se verificó la fecha)'}

  - id: cerro-manaure-falcon
    nombre: 'MANAURE, «Cerro donde nace el río Ricoa» (el OCR lee «Ricos»; el Ricoa nace en el Distrito Petit, Esteves p. 6 del tomo 6 del OCR, entrada RICOA)'
    ubicacion: 'Sierra de San Luis / Distrito Petit (Falcón); sin coordenada'
    primera_mencion: {fecha: '1989 (Esteves)', fuente: 'esteves-1989 p. 121', verificado: 'OCR, no imagen'}
    nota: 'ya registrado en 6-fusion/esteves_parte2_falcon.yaml; se nombra aquí porque es el único Manaure-lugar dentro de la Kaketiana que dan las fuentes del repo, y tampoco tiene fecha antigua'

  - id: mapaure-juruara
    nombre: 'Mapaure, «tierra de Xuduara» (Juruara), orilla sur-sureste del lago de Maracaibo'
    ubicacion: >-
      Sin coordenada: Jahn (1927 pp. 32 y 41) lo identifica con «Moporo», y
      Nominatim no devuelve «Moporo» (sí Tomoporo de Agua, node 5300664018,
      9.6227, -71.0600, que NO se iguala aquí). Es la provincia donde Oliver
      pone la aldea caquetía de Parepi entre bubures (DOC p. 201).
    primera_mencion:
      fecha: '29 de agosto de 1533'
      fuente: 'oviedo-y-valdes-1852-1855, t. II, lib. XXV, cap. VIII, p. 295'
      cita: '«Allí supieron que los chripstianos de Maracaybo estaban en Mapaure, tierra de Xuduara, çerca de allí, donde estaban haçiendo haçer caçabi y mahiz para la provission del pueblo de Maracaybo» … «desde donde toparon á aquel Françisco Martin hasta Mapaure, donde los chripstianos estaban»'
      url: 'https://archive.org/details/historiageneral01fernguat'
      verificado: 'sí, en imagen (pdf 309)'
    por_que_importa: >-
      Es el ÚNICO nombre en -aure de la esfera occidental documentado en el
      s. XVI que dan las fuentes del repo. Y está en la provincia de los
      bubures y los pemenos, «que hablan como los bubures» (la misma página),
      no en la Guajira ni en el Cesar.


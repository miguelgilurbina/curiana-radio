# ─────────────────────────────────────────────────────────────────────────
# PROPUESTA — Los Manaure de Colombia: ¿homenaje o herencia? 2026-10-09.
#
# Regla 5: esto PROPONE. No toca 3-mundo/, 2-lengua/toponimos.yaml,
# curiana_lexicon.py, lexicon_*.py ni curiana_polities.py.
# Regla 4: Manaure (La Guajira) y Manaure Balcón del Cesar caen en la esfera
# OCCIDENTAL (estado `futura`), no en la costera que se simula.
# Regla 3: nada de lo que nombra a estos dos pueblos es precontacto. Lo más
# temprano que se pudo leer sobre la región es de 1526-1534; lo más temprano
# que se pudo leer con el NOMBRE de estos dos lugares es de 1948 (La Guajira)
# y de la tradición de fundación de 1874-1875 (Cesar).
# Regla 2: cada versión del origen del nombre lleva su etiqueta; en duda, se
# degradó.
# Las cifras (sondas, aciertos, familia -aure, distancias) las emite
# 6-fusion/scripts/medir_manaure_colombia_2026-10-09.py en
# 6-fusion/medicion_manaure_colombia_2026-10-09.yaml; aquí se citan (regla 1).
# No se descargó nada: lo que falta va a `fuentes_a_buscar`.
# ─────────────────────────────────────────────────────────────────────────
meta:
  recogido: '2026-10-09'
  estado: sin-fusionar
  quien: 'minero de los Manaure de Colombia (Claude Opus 5.5), rama vault/manaure-colombia'
  bitacora: 4-fuentes/sesiones/13_manaure_colombia.md
  issue_borrador: 6-fusion/issues-pendientes/manaure-colombia-2026-10-09.md
  medicion: 6-fusion/medicion_manaure_colombia_2026-10-09.yaml
  script: 6-fusion/scripts/medir_manaure_colombia_2026-10-09.py
  pregunta: >-
    Miguel (2026-10-09): «hay un pueblo que tengo entendido que está también
    en la frontera, que se llama Manaure, en Colombia, lo cual me parece muy
    interesante… podríamos investigar más sobre esos Manaure de Colombia».
    Cuatro preguntas, en orden: (1) ¿desde cuándo existe cada topónimo?
    (2) ¿homenaje moderno al cacique de Coro o herencia colonial temprana?
    (3) ¿alguna fuente une un «Manaure» con los bubures y buredes del Perijá?
    (4) ¿hay otros topónimos en -aure en el oeste?
  lo_que_ya_sabia_el_vault:
    - '4-fuentes/antolinez-1944-manaure.md y comentario-32-dossier-d1.md: Manaure es TÍTULO, no nombre (cuatro testigos)'
    - '6-fusion/antroponimos_caquetios.yaml: manaure (título) y el formante -aure (Adaure, Timaure, Yaraure, Chunaure, Manaure, Anaure, Naure)'
    - '3-mundo/polities-caquetias.md §La quinta y curiana_polities.py «occidental»: la Guajira, Cabo de la Vela, Punta Espada–Chichibacoa, Juruara; «very little is known»'
    - '3-mundo/etnias.yaml etnia-004 bubure, etnia-005 burede, etnia-010 coanao, etnia-011 wanebucán'
    - '4-fuentes/esteves-1989.md: Manaure, apellido vivo de dos informantes (Misaray, El Vínculo)'
    - '6-fusion/esteves_parte2_falcon.yaml: MANAURE, «cerro donde nace el río Ricoa» (Esteves p. 121)'
    - '6-fusion/xaguas_achaguas_falcon_2026-10-09.yaml: sal de los xaguas con los caquetíos de Barquisimeto'
  fuentes_consultadas:
    repo:
      - {obra: oviedo-y-valdes-1852-1855, que: 't. II, lib. XXV cap. VIII p. 295 (Mapaure), vista en imagen; t. II pp. 271-272 (buredes); la lámina I del t. II (el mapa del lago y el Valle), vista en imagen; t. II p. 210 (Paralaure), t. II p. 217 y t. IV p. 538 (Parataure/Harataure)'}
      - {obra: jahn-1927, que: 'pp. 32, 36, 38, 41 (Axuduara, Mapaure = Moporo, Bobures, la carta de Chaves) y p. 75 (los motilones), en pdftotext'}
      - {obra: oliver-1989-cap3, que: 'edición DOC: pp. 201 (Parepi y Chorna), 203-205, 220-222 (bubures, pemenos) y 270 (Manaure «casado con hijas de caribes», 1526), en capa de texto'}
      - {obra: perez-de-tolosa-1546, que: 'Fernández Duro t. II p. 248, la «Tercera carta»: «un cacique llamado Manaore»'}
      - {obra: carvajal-1892, que: 'pp. 147, 168 y 317 del texto (OCR de archive.org, sin imagen) y la nota del editor en los «Apuntes biográficos» (p. 408 según el OCR)'}
      - {obra: alvarado-1921, que: 'MANARE, pp. 199-200 (pdf 229)'}
      - {obra: moron-2012-petroglifos, que: 'p. 167 (pdf 7): «Arco Manare o Arco Manaure»'}
      - {obra: steward-1948-hsai-4, que: 'p. 374 (Armstrong y Métraux, «The Goajiro»): «flock to Manaure»'}
      - {obra: esteves-1989, que: 'p. 13 (la serie de apellidos), p. 71 (los informantes Manaure), p. 121 (MANAURE, cerro) y el índice, en el OCR'}
      - {obra: aguado-1581, que: '«Managuare, el cacique de Coro»; Perataure (Meta) y «el del Guayaure o Paria» (el Orinoco); el texto de Gutenberg no da página'}
      - {obra: oviedo-y-banos, que: 'Baraure (ed. Ayacucho, pdf 111) y, en el t. II de Fernández Duro 1885, Urimaure (p. 50) y el índice de Manaure (I 36; II 248, 266)'}
      - {obra: castellanos-elegias, que: '«Mauaure» (dos veces, OCR del 1857) por Manaure, Elegías p. 183'}
      - {obra: antolinez-1946-hacia-el-indio, que: '«soberanía feudal de los manaure», «el Manaure único»'}
      - 'barrido de los 106 textos de fuentes_caquetios/ (los .txt y los PDF con capa por pdftotext): ver la medición'
    web:
      - {fecha: '2026-10-09', url: 'https://es.wikipedia.org/wiki/Manaure_(La_Guajira)', que: 'municipio por ordenanza 015 de 1973, vigente desde el 1-X-1974; «primeros indicios de habitantes de origen europeo y mestizo … 1723 aproximadamente»; nombre «del Cacique Manaure» según la tradición oral; cita a la alcaldía'}
      - {fecha: '2026-10-09', url: 'https://en.wikipedia.org/wiki/Manaure,_La_Guajira', que: 'infobox «Founded 1723» sin cita; la historia empieza en los coanaos y la sal industrial en los años 1920; cita a Aguilera Díaz 2004 (BanRep)'}
      - {fecha: '2026-10-09', url: 'https://es.wikipedia.org/wiki/Manaure_Balcón_del_Cesar', que: 'fundada en 1875 por Buenaventura Maya; municipio por ordenanza 019 de 1980; nombre de «un prestigioso y noble cacique de la región del Occidente Venezolano … más allá de la costa oriental del Lago de Maracaibo», sin cita'}
      - {fecha: '2026-10-09', url: 'https://en.wikipedia.org/wiki/Manaure,_Cesar', que: '1-I-1874, Buenaventura Maya; «named the village in honor of the Cacique Manaure which ruled Maracaibo» (cita «Cesar 30 Años de Progreso», Gobernación del Cesar, 1997); los «Bohures … descendants of the Caribs … crossing the Serranía del Perijá» (cita SINIC); corregimiento de Los Robles La Paz en 1913; ordenanza 28 del 28-XI-1980'}
      - {fecha: '2026-10-09', url: 'https://www.ecured.cu/Manaure_Balc%C3%B3n_del_Cesar_(Colombia)', que: 'las dos tradiciones: «indios bobures o boredes» con su cacique Manaure, y «sabana donde mana la ubre»; cita «Nuestro municipio», alcaldía'}
      - {fecha: '2026-10-09', url: 'https://www.universocentro.com/NUMERO90/Salinas.aspx', que: 'Camilo Alzate 2017: Mosquera 1862 (salinas guajiras para «la civilización de los indígenas»); una cédula real que reconoce a los wayuu las salinas de Manaure y Sorshimana, SIN fecha ni fuente; el cacique Manaure «habitó en dominios de lo que hoy es Venezuela»'}
      - {fecha: '2026-10-09', url: 'https://www.las2orillas.co/el-tesoro-de-las-salinas-de-manaure-en-la-guajira-que-el-congreso-ya-ordeno-revivir/', que: '«Ya en 1777, se otorgaban concesiones para explotar las salinas», sin fuente y sin decir que la salina fuera la de Manaure'}
      - {fecha: '2026-10-09', url: 'https://guajiranews.com/destacadas/las-salinas-de-manaure-y-su-historia/', que: 'columna de 2024: las fechas empiezan en 1835; cita IGAC 1977'}
      - {fecha: '2026-10-09', url: 'https://fr.wikisource.org/wiki/Voyage_%C3%A0_la_Nouvelle-Grenade/03', que: 'Reclus 1860, cap. III (Rio-Hacha y los goajiros), leído entero: NO nombra Manaure'}
      - {fecha: '2026-10-09', url: 'https://overpass.kumi.systems/api/interpreter', que: 'las dos consultas de la caja occidental (8.5,-74.5,12.6,-70.9), literal en la medición'}
      - {fecha: '2026-10-09', url: 'https://nominatim.openstreetmap.org/', que: 'coordenadas de Coro, Yaracal, Bobures, Cabo de la Vela y La Paz (ids en la medición); «Moporo» no devuelve nada'}
  sondas: >-
    Medidas por el script (medición §sondas): 106 textos leídos, 4 PDF sin
    capa o dañados (Fernandes 2020 Nature, Oviedo t. I sin la copia íntegra,
    Ramos Pérez 1978, Rouse y Cruxent 1963). Grafías del nombre: manaure 163,
    manavre 1 (Carvajal), manaore 1 (Pérez de Tolosa, FD t. II p. 248),
    managuare 1 (Aguado), managuanare/managuarire 2 (Palabras vivas), mauaure
    2 (OCR de Castellanos 1857), manahure 0. La homógrafa «manare» se cuenta
    aparte (39, casi todas el cernidor de Alvarado y de Fabo). De los 17
    aciertos con una palabra del oeste a menos de 600 caracteres (medición
    §oeste), leídos uno a uno: UNO es el Manaure de la Guajira (Steward 1948);
    dos atan el nombre al oeste sin ser lugar (la nota de 1892 del editor de
    Carvajal y el «Arco Manaure» de Morón); uno es el cernidor («manaures muy
    labrados», Carvajal); el resto es el Manaure de Coro con Coquibacoa,
    Maracaibo o la Guajira cerca por azar del texto. Ningún libro de fuentes
    del repo nombra un LUGAR Manaure en la Guajira, el Perijá, el Valle de
    Upar o Maracaibo antes de 1948.
  no_hallado:
    - 'Ningún «Manaure» como lugar en la Guajira o el Cesar antes del s. XIX en lo que se pudo leer (repo + web). La primera mención LEÍDA es de 1948 (La Guajira) y la tradición de fundación de 1874-1875 (Cesar).'
    - 'Ningún «Manaure» en la lámina del t. II de Oviedo (el mapa del lago, la Sierra de los Bubures y El Valle): vista en imagen.'
    - 'Ningún «Manaure» en Reclus 1860 (Rio-Hacha y los goajiros), leído entero en Wikisource.'
    - 'La fuente de la versión «el resplandor de un indígena de gran abolengo» (Manaure, La Guajira), citada en la pregunta: no localizada en la web (búsqueda 2026-10-09).'
    - 'Ninguna fuente que una a un Manaure con los bubures o los buredes, ni con el Perijá.'
    - 'Ninguna etimología wayuunaiki con diccionario detrás: sólo un sitio de nombres de bebé (venere.it), sin fuente.'
    - 'La fecha de creación del municipio Cacique Manaure (Falcón): no verificada.'
  no_descargado: >-
    Nada. Las fuentes que responderían la pregunta 1 son PDF o escaneos
    (Aguilera Díaz 2004, la edición de Unimagdalena de Julián 1787, Narváez y
    la Torre 1778, el Derrotero de 1810/1820, Simons 1885 con su mapa,
    Candelier 1893, Felipe Pérez 1863/1868, la Carta corográfica del
    Magdalena de 1864): van a `fuentes_a_buscar`.


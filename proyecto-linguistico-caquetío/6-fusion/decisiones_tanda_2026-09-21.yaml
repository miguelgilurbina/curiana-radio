d21.15_coro_es_espina:
  tipo: decisión de canon (curación con fuente)
  pregunta: >-
    La glosa de `coro` en el lexicón es «cardón grande, cactus columnar»,
    caquetío-hipotético, y su propia nota declara que NO sale de ninguna
    fuente localizada (el #181 de Zavala es `Koro` = 'Cotorra'). Se propuso
    quitarla; Miguel recordó una fuente.
  decision_literal: >-
    «Me parece que la fuente de coro = espina viene de una fuente que no
    recuerdo cuál fue que te compartí, de alguien que mencionaba que curiana
    era realmente Coriana y que venía de espina y que era porque Coro era un
    bosque tupido de cardones.»
  la_fuente: >-
    Encontrada: González Batista, «El nombre de Coro»
    (4-fuentes/gonzalez-batista-nombre-de-coro.md), trabajada en
    6-fusion/toponimia_coro_espina.yaml y ya registrada como lectura en
    2-lengua/toponimos.yaml §Coriana — con el veredicto del propio Miguel del
    2026-08-25: «PLAUSIBLE, la línea más prometedora del autor, abierta».
    Literal: `coro` 'espina' → Coriana 'tierra de las espinas, o la tierra
    del espinar, de vegetación espinosa, e INDIRECTAMENTE tierra de
    cardones', con `paragua` + `na` como paralelo, y «Coriana, y no Curiana,
    que nos parece un barbarismo». Reparos anotados: depende de `na` =
    'tierra', que ninguna fuente impresa da (Zavala #184: 'como, semejante');
    su ejemplo `corocoro` se refutó con Alvarado 1921 (onomatopeya del canto
    del ave). La tesis aguanta por `tococoro`/`totocoro` vivos en la
    arquitectura coriana, por el 'fruto del cardón' de Zavala y por el
    cardonal de Coro en los linderos. Compite con Arcaya (avispa o lagartija,
    1920 p. 170) y con Castellanos (viento, 1589).
  lectura_operativa: >-
    La curación NO es quitar la glosa sino cambiar la inventada por la que sí
    tiene fuente: `coro` 'espina' citando a González Batista, con su etiqueta
    de lectura en disputa; 'cardón' pasa a ser lo que la propia fuente dice
    que es, una consecuencia indirecta. `kadushi` se queda como la
    atestiguación insular del cactus (van Buurt 2014, islas A/B/C, var.
    *cadushi* en Aruba; Gatschet 1885 sobre material de Pinart, Aruba 1882,
    «kaduski»), con el matiz de que van Buurt advierte que su lista es de
    «words LIKELY to be of Caquetío origin» y «has a subjective element».
  se_aplica_en: 'curiana_lexicon.py (entrada `coro`), con la cita a gonzalez-batista-nombre-de-coro'

d21.16_las_glosas_baratas:
  tipo: curación (no mueve el scorer)
  contexto: >-
    Las cinco glosas que el issue de los pares dejó como curación barata, y
    que quedaron esperando fuera de los dos agentes de morfología.
  lectura_operativa: >-
    (1) `chaa` «hacer, construir, crear» → quitar «crear»: emparejaba con
    `eroa` «empezar, crear, originar» (atestiguada) y no son lo mismo — uno
    construye, el otro origina. Miguel: «efectivamente pasa lo mismo, son
    símiles pero que tienen significados distintos también».
    (2) `apana` «una luna (unidad de tiempo ~30 días)» → la CABEZA pasa a ser
    la medida: «medida de tiempo: una luna (~30 días)». NO se reglosa a
    «mes»: la fuente dice «Una luna. Medición de tiempo» (Zavala #10, GC) y
    su pareja `buiamati` «dos lunas» (#47), o sea un sistema de CONTAR lunas;
    llamarlo «mes» proyectaría el calendario europeo (regla 3). Miguel:
    «¿Entonces es más sobre el ciclo lunar pensando en la agricultura? Pero
    no sé si sea derechamente un mes, no?» — y lo de la agricultura tampoco
    lo dice la fuente, así que no se escribe.
    (3) `coro` → ver d21.15.
    (4) `bara`/`kuru` → declarar la convivencia en las notas de las dos (el
    palo cortado y el árbol vivo): variación real, no bug.
    (5) `sima`/`turumako` → declarar la convivencia y afinar las dos glosas
    para que dejen de emparejar. Por el criterio de la propia política d19.b
    NO son par —«cerro, montaña, elevación» contra «cerro, meseta» es
    solapamiento parcial, no glosa idéntica— y Miguel: «me parece bien que
    convivan sima y turumako […] al final no pasa nada si hay símiles».
    Y el argumento morfológico que cierra la tercera banda: `-bana` es un
    SUFIJO locativo, no un sustantivo; compone (`kali-bana`, `biro-bana`)
    pero no nombra, así que «cerro ya se dice con -bana» no se sostiene.
  se_aplica_en: 'curiana_lexicon.py (las cinco entradas y sus notas)'

# ─────────────────────────────────────────────────────────────────────────
# DECISIONES DE MIGUEL — tanda del 2026-09-21
#
# Las CATORCE de la auditoría de morfología
# (6-fusion/issues-pendientes/morfologia-revision-2026-09-20.md §6),
# respondidas una a una en la conversación, más dos que salieron de ella.
#
# Mismo patrón que las tandas anteriores: cita literal, lectura operativa y
# dónde se aplica. Cada decisión dice además de qué tipo es —corrección de
# error, decisión de canon, o corte de serie— porque eso decide quién la
# puede aplicar y si hay que volver a correr.
# ─────────────────────────────────────────────────────────────────────────
meta:
  fecha: '2026-09-21'
  decidido_por: Miguel
  responde_a: '6-fusion/issues-pendientes/morfologia-revision-2026-09-20.md §6 (14 decisiones)'
  modo: 'una a una, en la conversación'
  resumen: '1C · 2A · 3A · 4B · 5C · 6B · 7B · 8A · 9A · 10A · 11C+A · 12A · 13B · 14B'
  estado: >-
    DECIDIDAS las catorce (2026-09-21). Pendiente de aplicar. Las que mueven
    lo que el agente VE o lo que el motor CUENTA van en UN SOLO corte de
    serie, no en cuatro: la serie C se repite una vez, con todo dentro.
  linea_roja_de_toda_la_tanda: >-
    El scorer se toca aquí a propósito y con medición —los puntos 1 y 2 son
    correcciones de un error medido, no un rediseño de la métrica—, pero
    `capas_de_score` sigue fijo y `curiana_observer` no se modifica. Cambiar
    el PESO del aspecto (opción B del punto 3) queda fuera de esta tanda: es
    un rediseño y necesita su propio diseño en 5-experimento/.


cadenas_cotejadas:
  que_es: 'los eslabones donde se ha podido comparar lo que el intermediario dice que copió con lo que
    la fuente primaria dice de verdad. Es lo único que convierte una cadena de custodia en una comprobación.
    **No se deriva: se declara**, porque exige leer las dos fuentes, y cada fila dice quién midió cada
    lado.'
  cuantas: 2
  filas:
  - voz: los numerales taínos
    el_eslabon: Brinton 1871 p. 14 → Las Casas, *Apologética Historia* cap. 204
    lo_que_dice_el_intermediario:
      verbatim: «The following numerals are given by Las Casas (Hist. Apol. cap. 204). 1 hequeti. 2 yamosa.
        3 cauocum. 4 yaraoucobre»
      quien_lo_midio: esta parcela, sobre `fuentes_caquetios/Brinton_1871_texto.txt`, 2026-09-22
    lo_que_dice_el_primario:
      fuente: Las Casas, *Apologética Historia* (NBAE 13), p. 177 impresa
      formas:
      - yamocá (2)
      - canocúm (3)
      - yamoncobre (4)
      quien_lo_midio: 'el agente de la Apologética de esta misma campaña, 2026-09-22. ⚠️ DATO RECIBIDO,
        no verificado por esta parcela: el repo NO tiene la *Apologética*.'
    el_tercero_independiente:
      fuente: Goeje 1939 p. 17
      formas:
      - heketi (1)
      - yamoka (2)
      - kanokum (3)
      - yamonko-bre (4)
      quien_lo_midio: esta parcela
    veredicto: '🔴 **LA CADENA ESTÁ ROTA EN BRINTON, y en 3 de los 4 numerales.** En los tres, Goeje —que
      no copia a Brinton aquí— coincide con la *Apologética* y Brinton es el que se sale: `yamosa` contra
      `yamocá`/`yamoka`, `cauocum` contra `canocúm`/`kanokum`, `yaraoucobre` contra `yamoncobre`/`yamonko-bre`.
      El 1 (`hequeti` ~ `heketi`) es el único que aguanta.'
    la_prueba_interna: 'y no hace falta la *Apologética* para verlo: **Brinton se contradice a sí mismo**.
      Escribe que el 4 «evidently formed from yamosa» — pero su propia forma, `yaraoucobre`, no contiene
      `yamosa` por ningún lado, mientras que la forma real, `yamoncobre`, sí empieza por `yamo-`. El análisis
      es correcto y la transcripción no: Brinton leyó bien y copió mal. Esa frase estaba en el repo desde
      el 2026-07-29 y nadie la había puesto a prueba contra sí misma.'
    lo_que_toca_en_el_canon: 'la clave `yamosa` del lexicón —una de las 52— viene de la lectura mala.
      La forma atestiguada es `yamocá`, con `yamoka` de Goeje al lado. **Es un caso de la política «donde
      hay forma atestiguada, manda la atestiguada», sólo que aquí la rival no es una reconstrucción nuestra:
      es una errata de 1871.** Lo decide Miguel.'
    y_lo_general: si Brinton falla en 3 de 4 donde se le puede cotejar, **las 68 entradas de su vocabulario
      antillano y las 84 entradas del lexicón que lo citan quedan bajo sospecha de transcripción**, no
      de existencia. La voz existe; la letra hay que verificarla contra el cronista. Es la razón de ser
      de esta lista maestra.
  - voz: macana
    el_eslabon: Las Casas, *Apologética Historia* (NBAE 13), p. 177 impresa — directo
    lo_que_dice_el_primario:
      verbatim: «vocablo desta isla y no de la Tierra Firme»
      quien_lo_midio: el agente de la Apologética de esta misma campaña, 2026-09-22. ⚠️ DATO RECIBIDO,
        no verificado por esta parcela.
    lo_que_dice_el_intermediario:
      fuente: Brinton 1871
      formas: []
      quien_lo_midio: 'esta parcela: **`macana` aparece 0 veces en `Brinton_1871_texto.txt`**. Brinton
        no la trae.'
    el_tercero_independiente:
      fuente: Goeje 1939 p. 11
      formas:
      - makána 'sabre en bois, massue'; A sapakana, G guaika, achagua bakaba
      quien_lo_midio: esta parcela
    veredicto: '🔴 **ATRIBUCIÓN EXPLÍCITA DEL CRONISTA, y es de las que casi no hay.** Las Casas no glosa
      la voz: declara **de dónde es**, y dice que es de la isla y NO de Tierra Firme. Con Oviedo detrás
      (la lista maestra ya le da dos cronistas) es la voz mejor documentada de esta parcela en cuanto
      a origen.'
    lo_que_toca_en_el_canon: 'toca `6-fusion/propuesta_macana_etiqueta_2026-09-21.yaml` y toca la esfera:
      si `macana` es antillana por declaración del cronista, su presencia en tierra firme es **préstamo**,
      y Bachiller p. 239 documenta la vía (Gumilla la registra en uso en el Orinoco, con el castellano
      de por medio, en el s. XVIII). ⚠️ NO confundir con `matacán` ''venado'' (`6-fusion/matacan_venado_2026-09-14.yaml`):
      son dos palabras distintas y sólo se parecen de lejos.'
conceptos_comparables_con_el_caquetio_atestiguado:
  metodo: 'la MISMA normalización de glosa que `cruce_taino_caquetio.py`: se importa `conceptos()` de
    ese script, no se reimplementa. Cuenta un concepto cuando la cabeza de glosa es de UNA palabra en

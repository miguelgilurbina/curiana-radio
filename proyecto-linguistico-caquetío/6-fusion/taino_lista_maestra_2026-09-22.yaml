meta:
  campana: Segunda campaña del taíno — parcela T10 (los vocabularios antillanos)
  medido: '2026-09-22'
  script: 6-fusion/scripts/consolidar_taino.py
  estado: PROPUESTA (regla 5). No toca curiana_sim/, 2-lengua/, 3-mundo/ ni el canon.
  pregunta: que el proyecto tenga UNA lista de voces taínas donde cada voz lleve su cadena de custodia
    hasta el cronista del s. XVI, y saber cuántos conceptos comparables con el caquetío atestiguado aporta.
  por_que: el cruce del 2026-09-21 midió 4 conceptos comparables y 0 parejas, y su autor escribió «el
    cero mide la lista, no la lengua». Esta lista es la lista nueva.
  la_regla_que_manda: 'la atestación es del CRONISTA, no del compilador (skill `minar-fuente` §8). Brinton,
    Goeje y Bachiller son intermediarios: dos obras que citan al mismo cronista son UNA atestación. Por
    eso `atestaciones_independientes` cuenta cronistas distintos, no obras.'
  insumos:
    brinton-1871: 68
    oviedo-valdes-1851: 64
    las-casas-1875: 26
    pane-c1498: 33
    goeje-1939: 154
    bachiller-morales-1883: 34
  registros_leidos: 379
  registros_sin_forma_utilizable: 2
  aviso_de_lema: '`lema` agrupa grafías coloniales y fonémicas para poder contar; NO es el lema canónico
    de una entrada, que se fija en la fusión (`fusionar-propuesta` §5).'

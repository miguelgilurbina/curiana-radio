meta:
  recogido: '2026-09-21'
  estado: sin-decidir
  obra: oliver-1989-cap2 · zavala-reyes-2015 · van-buurt-2014 · esteves-1989 ·
        alvarado-1921 · jahn-1927 · arcaya-1920 · medina-colina-sxx
  encargo: >-
    d21.7 (« Si me parece, B », 2026-09-21): el motor enseña `-gua` = «región /
    área asociativa» en las dos plantillas y su único apoyo escrito es la frase

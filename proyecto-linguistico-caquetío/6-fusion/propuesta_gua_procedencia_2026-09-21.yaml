# ══════════════════════════════════════════════════════════════════
# 3. EL TEST DEL AZAR — una terminación no es un morfema
# ══════════════════════════════════════════════════════════════════
test_del_azar:
  porque: >-
    `-gua` es una sílaba frecuente. Un final sólo es morfema si el RESTO de la
    palabra es raíz conocida con sentido. Se mide sobre el universo de topónimos
    de Esteves (partes 1 y 2), con la fonemización del proyecto y contra las
    voces de familia caquetía del lexicón.
  universo: 565
  raices_caquetias_en_el_lexicon: 551
  metodo: >-
    curiana_fonotactica.fonemizar(resto), con y sin la regla abierta D5c
    `gu → /w/`; se aceptan el esqueleto, el esqueleto sin vocal final y el
    esqueleto + a/i/e. Mismo criterio para todos los finales.
  finales_de_3_mas_frecuentes: [{"final": "are", "n": 24}, {"final": "gua", "n": 23}, {"final": "ure", "n": 22}, {"final": "ana", "n": 22}, {"final": "ara", "n": 18}, {"final": "ima", "n": 15}, {"final": "ito", "n": 13}, {"final": "che", "n": 13}]
  puesto_de_gua: 2
  por_final:
    '-gua':
      termina_en: 23
      resto_es_raiz: 5
      resto_es_raiz_con_D5c: 5
      casos: ["bajarigua←bajarí", "baragua←bara", "barisigua←barici", "casigua←cazi", "guagua←gua"]
    '-are':
      termina_en: 24
      resto_es_raiz: 3
      resto_es_raiz_con_D5c: 3
      casos: ["camare←kama", "chibare←kiba", "chidare←kidi"]
    '-ure':
      termina_en: 22
      resto_es_raiz: 2
      resto_es_raiz_con_D5c: 2
      casos: ["chaure←ka", "chunaure←cuna"]
    '-ana':
      termina_en: 22
      resto_es_raiz: 5
      resto_es_raiz_con_D5c: 4
      casos: ["capuhana←capu", "guayana←guay", "jayana←jai", "paraguana←paragua", "tarana←tara"]
    '-ara':
      termina_en: 18
      resto_es_raiz: 1
      resto_es_raiz_con_D5c: 0
      casos: ["guara←gua"]
    '-ima':
      termina_en: 15
      resto_es_raiz: 1
      resto_es_raiz_con_D5c: 0
      casos: ["guima←gua"]
  el_filtro_de_significado:
    porque: >-
      skill minar-fuente §2: un parecido de formas sin filtro de significado es
      casi todo ruido — medido, 5 falsos de 7 en el cruce achagua. Los aciertos
      de `-gua` se revisan uno por uno contra la glosa de la fuente.
    casos:
      - toponimo: bajarigua
        raiz_que_casa: bajarí
        pasa: NO
        porque: '`bajarí` es ''recorrer, caminar'' (Zavala #25, p. 65); Bajarigua es una salina. Sin relación semántica.'
      - toponimo: baragua
        raiz_que_casa: bara
        pasa: PARCIAL
        porque: '`bara` es ''palo, árbol'' (Zavala #29, p. 65) y Baragua es «árbol de madera de construcción»: el significado SÍ casa. Pero entonces el resto es `-gua` sobre un árbol, no una región — y Esteves lo glosa como el nombre entero del árbol.'
      - toponimo: barisigua
        raiz_que_casa: barici
        pasa: NO
        porque: '`barici` es ''agua turbia / tierras coloradas'' y la barisigua es un bucare. Y Esteves segmenta bari+SIGUA, no barisi+GUA.'
      - toponimo: casigua
        raiz_que_casa: cazi
        pasa: NO
        porque: '`kasi` es ''sol'' (Zavala #76, p. 66) y la casigua es una marantácea. Coincidencia de forma.'
      - toponimo: guagua
        raiz_que_casa: gua
        pasa: CIRCULAR
        porque: 'el resto casa con `gua` mismo (la clave `wa`): es la propia forma bajo examen, no un despeje.'
    sobreviven: 0
  lectura: >-
    `-gua` es el 2.º final de tres letras más frecuente del
    gazetteer (23 de 565), codo a codo con `-are`,
    `-ure` y `-ana`: justo el perfil de una sílaba castellanizada productiva. Su
    tasa de «el resto es raíz» no se separa de la de esos controles, y sobre todo
    **ninguno de sus 5 aciertos sobrevive al filtro de
    significado**. Comparar con `-ana`, que da la misma tasa y cuya glosa 'lugar
    de' se RETIRÓ por eso en #109; y con `-bakoa`, que el canon sí tiene y cuyo
    despeje lo hizo la GLOSA de Esteves, no la forma.

# ══════════════════════════════════════════════════════════════════
# 4. LAS GLOSAS DE ESTEVES, UNA POR UNA
# ══════════════════════════════════════════════════════════════════
glosas_de_esteves:
  entradas_en_gua_leidas: 27
  por_clase: {"animal": 2, "hibrido-castellano": 1, "planta": 9, "segmenta-por-otro-sitio": 5, "sin-glosa-etimologica": 10}
  glosadas_como_region_de: 0
  obra: esteves-1989
  las_que_parten_por_otro_sitio:
    - forma: barisigua
      pagina_impresa: 19
      cita: >-
        «Bari —sigua: palo blando; bara; árbol. Sigua: blando». El `-gua` final
        es la cola de `sigua` 'blando' — voz caquetía ATESTIGUADA aparte
        (Zavala #227, p. 70, «Sigua (E): Blando», lema `siwa`).
    - forma: caradacagua
      pagina_impresa: 33
      cita: >-
        «es un poda, una reducción de Caramatacaigua… En lengua cumanagota,
        “caramata” es carbón y “caigua” es un molusco». Filiación declarada:
        CUMANAGOTO (caribe), no caquetío — y el `-gua` va dentro de `caigua`.
    - forma: dibaragua
      pagina_impresa: 38
      cita: >-
        «En el topónimo aparece la prótesis silábica “di” y la metátesis de
        “baragua” por “guaraba”. Guaraba es un árbol maderable, cuaguaro». El
        `gua` viene de la METÁTESIS de un `gua-` inicial.
    - forma: maquigua
      pagina_impresa: 49
      cita: >-
        «En antiguas escrituras se lee: Moriquigua. Mora es un árbol caparidáceo
        […] Quigua: concha de almeja y otros moluscos». El segmento final es
        `quigua` (Zavala #214, p. 70, lema `kiwa`), no `-gua`.
    - forma: chiguarigua
      pagina_impresa: 107
      cita: >-
        «Voz compuesta de “chigua”, nasa, cesto, y “arigua”, un insecto melífero».
        Esteves segmenta, y los DOS trozos llevan `gua` dentro de la raíz.
  el_caso_que_decide:
    forma: urupaguaduco
    pagina_impresa: 66
    cita: '«Urupaguaduco: significa la quebrada de las urupaguas»'
    porque: >-
      Aquí Esteves SÍ pone un locativo, y no es `-gua`: es `-duco` 'quebrada'.
      `urupagua` entra entero como nombre de planta. Es el contraejemplo limpio:
      donde el autor quiere decir lugar, usa otro morfema.
  el_hibrido_castellano:
    forma: quiyegua
    pagina_impresa: 57
    cita: '«Aparentemente es una voz híbrida de español y caquetío: Piedra y Yegua»'
    porque: 'la trampa 3 del encargo, medida: un -gua que es la YEGUA castellana'


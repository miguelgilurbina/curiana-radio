# ══════════════════════════════════════════════════════════════════
# 0. EL VEREDICTO
# ══════════════════════════════════════════════════════════════════
veredicto:
  en_una_frase: >-
    La pregunta cambia: `-gua` SÍ tiene fuente, pero no para lo que enseña. La
    FORMA está atestiguada como formante toponímico caquetío (Oliver 1989 cap. 2
    p. 148, sexto de sus seis «suffixes in Caquetío toponyms»), y hay un `gua`
    caquetío atestiguado con glosa (Zavala 2015 #122, p. 68) — que el lexicón ya
    tiene, bajo el lema fonémico `wa`. Lo que NO tiene fuente es la GLOSA que el
    motor enseña: «región, área amplia, menos específico que -ana». Ninguna obra
    del repo la dice, y las dos que dicen algo apuntan al revés — la única glosa
    atestiguada es 'conuco, heredad, TERRENO CERCADO', que es un lugar acotado, y
    Oliver, que sí glosa `-bana` y `-coa`, deja `-wa` sin valor.
  las_tres_preguntas:
    forma: 'SÍ — Oliver 1989 cap. 2 p. 148 (lista) y p. 142 (bari-si-gua)'
    valor: 'NO — cero fuentes para «región»; una fuente para «conuco, terreno cercado»'
    lema: >-
      El lema debería ser `-wa`, no `-gua`. Lo dice Oliver literalmente («gua=/wa/»,
      p. 142), lo dice van Buurt (p. 27) y lo dice el propio lexicón, que ya
      lematiza paragua→parawa, sibidigua→sibidiwa, quigua→kiwa, sigua→siwa,
      cumaragua→kumarawa. Es el mismo movimiento de d21.14 (-bacoa → -bakoa).
      ⚠️ NO se aplica aquí: es D5/D5c y decide Miguel.


    - {clave: chiriwa, forma_fuente: chirigua, cat: sust, capa: caquetío-retroabstraido, sig: 'recipiente de barro cocido, pequeño, manual, para contener agua u otro líquido. Es palabra'}
    - {clave: chirwa, forma_fuente: chirgua, cat: sust, capa: caquetío-atestiguado, sig: 'tinaja pequeña'}
    - {clave: dakawa, forma_fuente: dacagua, cat: sust, capa: caquetío-atestiguado, sig: 'árbol de corteza gris, madera compacta'}
    - {clave: duriwa, forma_fuente: durigua, cat: v_raiz, capa: caquetío-atestiguado, sig: 'hacer trabajos cortos'}
    - {clave: isikawa, forma_fuente: isicagua, cat: sust, capa: caquetío-retroabstraido, sig: 'árbol de nuestros montes utilizado en la medicina empírica para tratar hernias'}
    - {clave: kihuawa, forma_fuente: quihuagua, cat: sust, capa: caquetío-retroabstraido, sig: 'una variedad de frijol común en épocas pasadas y muy nutritiva'}
    - {clave: kiwa, forma_fuente: quigua, cat: sust, capa: caquetío-atestiguado, sig: 'concha de almeja y otros moluscos. Sitio del estado Lara'}
    - {clave: kiwawa, forma_fuente: quiguagua, cat: sust, capa: caquetío-atestiguado, sig: 'especie de haba grande y blanca'}
    - {clave: kumarawa, forma_fuente: cumaragua, cat: sust, capa: caquetío-atestiguado, sig: 'caracol de las costas de Paraguaná'}
    - {clave: nagua, forma_fuente: nagua, cat: sust, capa: caquetío-reconstruido, sig: 'nagua, falda de algodón de mujer'}
    - {clave: niwa, forma_fuente: nigua, cat: sust, capa: caquetío-reconstruido, sig: 'nigua, pulga que anida bajo la piel y cría en ella (Tunga penetrans); hoy desaparecida'}
    - {clave: parawa, forma_fuente: paragua, cat: sust, capa: caquetío-atestiguado, sig: 'mar'}
    - {clave: sibidiwa, forma_fuente: sibidigua, cat: sust, capa: caquetío-atestiguado, sig: 'arbusto euforbiaceo. Jatrofa Gossy Pifolia'}
    - {clave: siwa, forma_fuente: sigua, cat: v_raiz, capa: caquetío-atestiguado, sig: 'blando'}
    - {clave: tiwa, forma_fuente: tigua, cat: sust, capa: caquetío-atestiguado, sig: 'árbol rutáceo'}
    - {clave: urupagua, forma_fuente: urupagua, cat: sust, capa: caquetío-atestiguado, sig: 'arbusto espinoso usado para cercar conucos; y árbol de la serranía coriana de fruto amargo'}
    - {clave: wa, forma_fuente: gua, cat: sust, capa: caquetío-atestiguado, sig: 'conuco, heredad, terreno cercado cultivado'}
  el_argumento_distribucional: >-
    Entre las voces caquetías ATESTIGUADAS cuya forma fuente acaba en -gua hay
    un VERBO: `durigua` 'hacer trabajos cortos' (Zavala #116, p. 67, AM; lema
    `duriwa`). Un locativo 'región de X' no deriva un verbo. Y las demás son un
    muestrario semántico sin patrón: 'mar', 'concha de almeja', 'tinaja pequeña',
    'haba', árboles y arbustos. Eso es lo que se ve cuando una sílaba frecuente
    se lee como morfema.

# ══════════════════════════════════════════════════════════════════
# 6. LOS HALLAZGOS, CON OBRA · PÁGINA IMPRESA · CITA LITERAL
# ══════════════════════════════════════════════════════════════════
hallazgos:

  - id: H1
    que: 'LA FORMA SÍ ESTÁ ATESTIGUADA — y es la única fuente que la declara formante'
    obra: oliver-1989-cap2
    pagina_impresa: 148
    cita: >-
      «j) Suffixes /-bana/ and /-coa/ — The most common "suffixes" in Caquetío
      toponyms are those ending in: a) -bana · b) -coa/-koa · c) -oa · d) -kiva ·
      e) (e)-bo · f) -wa [gua-]»
    valor: >-
      ⭐⭐⭐ Es la clave foránea que `-gua` no tenía. Oliver es la única obra del
      repo que lo lista como sufijo toponímico caquetío. ⚠️ PERO: de los seis
      glosa tres (-bana 'surrounding/expanse', -coa 'superlativo de en/sobre',
      -oa reflexivo) y **nunca vuelve a f) -wa**. Da la FORMA, no el VALOR.
    independencia: 'primera atestación; no cita a Esteves ni a Zavala para esto'

  - id: H2
    que: 'OLIVER DICE EL VALOR FONÉMICO, con estas letras'
    obra: oliver-1989-cap2
    pagina_impresa: 142
    cita: >-
      «in the Borojó area there is a river designated today as bari-si-gua
      (gua=/wa/) and in the Bariro area we find bari-si-gu()-ita (-ita or -ito is
      a Spanish suffix for diminutives)»
    valor: >-
      ⭐⭐⭐ «gua=/wa/», escrito por Oliver en el mismo capítulo. Es el dato que
      D5c (#36) pedía, y aplicado por el propio autor al MISMO topónimo que
      Esteves segmenta como bari+sigua. Con él, el lema del morfema es `-wa`.

  - id: H3
    que: 'HAY UN `gua` CAQUETÍO ATESTIGUADO CON GLOSA — y no es «región»'
    obra: zavala-reyes-2015
    pagina_impresa: 68
    cita: '«122. Gua (HP): Conuco, heredad, terreno cercado con algo.»'
    ya_en_el_canon: >-
      El lexicón YA lo tiene: clave `wa`, cat sust, caquetío-atestiguado,
      forma_fuente `gua`, con esta cita en `notas` (curiana_lexicon.py). O sea que
      el repo lleva las dos cosas a la vez — un `gua` sustantivo 'terreno cercado'
      con cita, y un `-gua` sufijo 'región amplia' sin ella — y nadie las había
      puesto una al lado de la otra.
    la_glosa_va_al_reves: >-
      «terreno cercado con algo» es un lugar ACOTADO y cultivado. El motor enseña
      «zona más amplia asociada con X, MENOS ESPECÍFICO que -ana». Si el formante
      es el mismo, la glosa del prompt es la contraria a la de la fuente.
    independencia: >-
      HP = Aníbal Hill Peña, uno de los nueve compiladores que Zavala declara
      (p. 64). NO es Arcaya (PMA), así que no es una re-cita del mismo autor
      del que vienen otras entradas: es atestación propia. Pero es UNA, y de un
      compilador del s. XX sin obra localizada en el repo.

  - id: H4
    que: 'LA SEGUNDA FUENTE PARA gu = /w/, y con habla viva'
    obra: van-buurt-2014
    pagina_impresa: 27
    cita: >-
      «Words with the gua- prefix and names of trees ending in -o in Spanish may
      be Caquetío words which underwent Spanish influence. […] The Spanish
      language is known to replace /w/ sounds with /gw/ (written <gu>) […] The
      Papiamentu words watapana, wayaká and watakeli thus seem more original than
      guatapaná, guayacán, guatacare, guatacaro etc.»
    valor: >-
      Independiente de Oliver y en la otra orilla del corpus (papiamentu). Y en
      la lista de topónimos de Aruba (p. 41) van Buurt imprime la MISMA voz con
      las dos grafías: «Paraguana, Parawana».

  - id: H5
    que: 'EL -gua DE MAQUIGUA ESTÁ ATESTIGUADO APARTE, y es una concha'
    obra: van-buurt-2014
    pagina_impresa: 32
    cita: >-
      «kiwa (A, C, B) - kiwa is the West Indian top shell (Cittarium pica). This
      word is also found in Venezuela as quigua and in Cuba as cigua.»
    valor: >-
      Corrobora a Zavala #214 'concha de almeja' (lema `kiwa`) desde otra obra, y
      con eso el `Moriquigua` de Esteves queda despejado sin `-gua`: es
      `mora` + `quigua`. Un falso segmentable menos.

  - id: H6
    que: 'LO QUE NO SE HALLÓ — los ceros, medidos'
    ceros:
      - obra: alvarado-1921
        buscado: 'sufijo/desinencia/terminación + gua; gua + región'
        resultado: >-
          Cero enunciados sobre un formante. Lo que sí tiene son LEXEMAS:
          «BARISÍGUA. Árbol indeterminado de Coro y Zulia» (p. 23), «ARÍGUA.
          Especie de abeja silvestre», «ASYÁGUA. Médula del maguéi». Plantas y
          bichos, como en Esteves.
      - obra: jahn-1927
        buscado: 'desinencias toponímicas arahuacas'
        resultado: >-
          Jahn sí enumera desinencias, y no está `gua`: «los nombres indígenas de
          algunos ríos y quebradas tienen en sus terminaciones la desinencia ari,
          uri, e iri, que revelan su procedencia de las lenguas aruacas».
      - obra: arcaya-1920
        buscado: 'gua como morfema'
        resultado: 'cero. Aparece sólo dentro de topónimos (Acurigua, Barragua, Churuguara).'
      - obra: esteves-1989
        buscado: 'una glosa de -gua como lugar/región, en las 25 formas en -gua'
        resultado: >-
          Cero. Y no por falta de vocabulario locativo: cuando Esteves quiere decir
          lugar usa `bacoa`, `bana`, `ebo`, `uco/duco`, `are` — los cinco con glosa.
      - obra: medina-colina-sxx
        buscado: 'el final -igua en el habla viva de Paraguaná'
        resultado: >-
          Lo tiene registrado, y como lo contrario de un locativo:
          `patrones_observados` §-igua — «barisigua (Erythrina), con tacarigua y
          samanigua de Alvarado y los topónimos regionales en -igua: formante
          FITONÍMICO/toponímico de filiación no resuelta».
    lectura: >-
      Cinco obras, cinco búsquedas declaradas, cero apoyos para «región de». Una
      negativa así de repartida no es un hueco de minería: es un resultado.

  - id: H7
    que: 'LA COMPARANDA, que se declara y NO se importa'
    lokono_y_taino:
      - obra: van-buurt-2014
        pagina_impresa: 35
        cita: >-
          «yarima means ‘anus’, guaca “underground area, underground region”.
          Guacayarima then means ‘anus which leads to the underworld’ (Tejera, 1977)»
        porque_no_vale: >-
          Es lo más cerca de «región» que hay en todo el barrido, y no sirve: es
          TAÍNO, es `guaca` (no `-gua`), y va en posición INICIAL. Importarlo sería
          justo el error de la regla 4. Se declara para que nadie lo vuelva a
          encontrar y crea que cierra.
      - obra: oliver-1989-cap2
        pagina_impresa: 150
        cita: >-
          «(e.g. para- for ‘sea’ [Guajiro: /palaa'/, Taíno: /bara-wa/])»
        porque_importa: >-
          El taíno de 'mar' es `bara-wa`. O sea que el `-wa` de `parawa` tiene
          hermano arahuaco en la MISMA palabra, y por esa vía `parawa` es una voz
          heredada, no `para` + 'conuco'. Es la explicación rival de la lectura
          que d21.7 da por apoyo.

# ══════════════════════════════════════════════════════════════════
# 7. EL «APOYO QUE YA EXISTE EN EL CANON» — de qué se sostiene de verdad
# ══════════════════════════════════════════════════════════════════
la_circularidad:
  lo_que_dice_d21_7: >-
    «Apoyo que ya existe en el canon: `paragua` se lee como `para` 'mar' + `-gua`,
    y por eso el 2026-09-19 se decidió NO fusionar `parawa`/`para` — fusionarlas
    habría borrado este morfema.»
  lo_que_dice_la_decision_de_verdad:
    donde: 6-fusion/curacion_glosas_pares_2026-09-19.yaml, par 14
    tres_patas:
      - '(1) los esqueletos fonémicos NO coinciden: `para` da `para`, `parawa` da `parawa`, con y sin gu→w'
      - '(2) Zavala las trae como DOS entradas de DOS informantes: #190 (E+HP) y #191 (GC)'
      - "(3) «`-gua` es un LOCATIVO declarado del proyecto ('región de X', REGLAS_LOCATIVAS), así que `paragua` se lee sin forzar nada como `para` + `-gua`»"
    veredicto: >-
      🔴 La pata (3) es CIRCULAR y es la única que d21.7 recoge: el morfema se usa
      como prueba de sí mismo. Las patas (1) y (2) son independientes y siguen en
      pie, así que **la decisión del 09-19 de NO fusionar `parawa`/`para` no se
      cae** — lo que se cae es que ese par sea «apoyo» para `-gua`.
  y_el_mismo_toponimo_sostiene_dos_glosas_incompatibles:
    donde:
      - "curiana_lexicon.py REGLAS_LOCATIVAS['-gua'].ejemplos: «para + gua + na = Paraguaná»"
      - "2-lengua/toponimos.yaml toponimo-018 y 6-fusion/censo_ana_esteves_109.yaml: «para 'agua' + gua 'CONUCO, heredad, terreno cercado' (Zavala #122) + na 'como'»"
    veredicto: >-
      Paraguaná se cita como ejemplo de `-gua` 'región' en el prompt y como ejemplo
      de `gua` 'terreno cercado' en el canon. Es la patología (a) de la tabla de
      morfología, otra vez: el motor enseña una cosa y el canon declara otra.
  y_un_ejemplo_que_no_ejemplifica: >-
    El tercer ejemplo de la regla es «Araya (región salina)» — un topónimo de
    Sucre que NO contiene `-gua`. Quedó al reescribir los ejemplos en d21.14, que
    sólo miró si las raíces estaban en el lexicón.
  procedencia_de_la_frase: >-
    «Topónimos venezolanos de Falcón y Sucre» entró en el COMMIT INICIAL del repo
    (475457d, «chore: init repo + fix 3 critical bugs from audit») y no se ha
    tocado desde entonces: es anterior a la regla 8 y nunca tuvo clave foránea.

# ══════════════════════════════════════════════════════════════════
# 8. QUÉ HACE LA GENTE CON ÉL
# ══════════════════════════════════════════════════════════════════
uso_en_la_base:
  consulta: 'SELECT w.word, count(*) FROM word_uses w JOIN simulation_runs r ON r.id = w.run_id WHERE r.started_at < ''2026-09-21'' GROUP BY w.word'
  segmentacion: 'la del motor: _PREFIJOS_CAQ y _SUFIJOS_CAQ, prefijos primero (nucleo_de_token)'
  usos_totales_word_uses: 95445
  formas_totales_word_uses: 2546
  gua_usos: 102
  gua_formas: 49
  gua_raices_distintas: 37
  gua_raices_en_el_lexicon: 33
  por_categoria_de_raiz: {"v_raiz": 31, "sust": 29, "raiz-fuera-del-lexicon": 23, "adj": 7, "part": 6, "v_estativo": 6}
  muestra: ["awa-bana-gua", "awa-gua", "chaa-bana-gua", "dichiba-gua", "etamo-gua", "hueke-gua", "jagey-gua", "jai-bana-gua", "juri-bana-gua", "juri-gua", "kaa-bakua-gua", "kaa-ni-gua"]
  lectura: >-
    El grueso del uso cae sobre RAÍZ VERBAL, y una parte grande sobre raíces
    que no están en el lexicón. «La región de beber» o «la región de oír» no
    son lo que la glosa promete: el campo `uso` de la regla dice «RAÍZ + -gua»
    sin declarar slot, así que nada lo impide. Sea cual sea la decisión sobre
    la glosa, el SLOT hay que declararlo.

# ══════════════════════════════════════════════════════════════════
# 9. LO QUE ESTA CAMPAÑA NO PUDO MEDIR
# ══════════════════════════════════════════════════════════════════
huecos_declarados:
  - >-
    Hill Peña (HP), el compilador del que Zavala toma #122, no tiene obra en
    `fuentes_caquetios/` ni entrada en `bibliografia.yaml`. La cadena es Zavala →
    HP, y del segundo eslabón no se puede verificar nada.
  - >-
    El OCR de Esteves es PISTA, no cita (así lo declara su nota). Las cinco citas
    de §4 llevan página impresa y hay que verlas en imagen antes de sacarlas del
    repo. Las de Zavala, van Buurt y Oliver salen de capa de texto propia.
  - >-
    Esteves parte 1 se censó sobre el ÍNDICE (187 nombres) más el cuerpo por
    grep; parte 2 sobre las 387 entradas ya parseadas. Las dos partes no cubren
    los 413 topónimos que la nota de la fuente atribuye al libro entero.
  - >-
    No se midió el corpus insular (Gatschet, van Buurt ABC) como universo del
    test del azar: allí el formante frecuente es `-shi/-chi`, que `morfemas.yaml`
    declara sin glosar (morfema-007) y es otra campaña.


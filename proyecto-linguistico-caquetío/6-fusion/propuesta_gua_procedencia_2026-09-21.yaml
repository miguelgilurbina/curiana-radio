# 1. LA ORTOGRAFÍA, MEDIDA ANTES DE CONTAR  (skill minar-fuente §2)
# ══════════════════════════════════════════════════════════════════
ortografia:
  porque: >-
    Un grep que devuelve cero mide la consulta, no la fuente. Las crónicas no
    usan ortografía moderna. Antes de contar nada se mide cómo escribe CADA obra
    la secuencia, en sus siete variantes.
  variantes_buscadas: ["gua", "guá", "güa", "goa", "hua", "ua", "wa"]
  por_obra:
    alvarado-1921:
      caracteres: 689459
      via: 'pdf'
      por_variante: {"gua": 1256, "guá": 137, "güa": 3, "goa": 5, "hua": 89, "ua": 1984, "wa": 7}
    arcaya-1920:
      caracteres: 472917
      via: 'pdf'
      por_variante: {"gua": 437, "guá": 6, "güa": 0, "goa": 7, "hua": 34, "ua": 1131, "wa": 4}
    esteves-1989:
      caracteres: 168558
      via: 'ocr'
      por_variante: {"gua": 681, "guá": 5, "güa": 0, "goa": 0, "hua": 4, "ua": 944, "wa": 5}
    jahn-1927:
      caracteres: 629691
      via: 'pdf'
      por_variante: {"gua": 1089, "guá": 22, "güa": 0, "goa": 13, "hua": 50, "ua": 2125, "wa": 80}
    oliver-1989-cap2:
      caracteres: 260410
      via: 'pdf'
      por_variante: {"gua": 954, "guá": 0, "güa": 1, "goa": 4, "hua": 4, "ua": 1091, "wa": 701}
    van-buurt-2014:
      caracteres: 89240
      via: 'capa de texto'
      por_variante: {"gua": 159, "guá": 0, "güa": 0, "goa": 0, "hua": 6, "ua": 211, "wa": 306}
    zavala-reyes-2015:
      caracteres: 38575
      via: 'pdf'
      por_variante: {"gua": 123, "guá": 0, "güa": 0, "goa": 1, "hua": 10, "ua": 174, "wa": 33}
  lectura: >-
    Ninguna obra escribe `goa` ni `güa` de forma relevante; la competencia real
    es `gua` (castellana) frente a `wa` (papiamentu / fonémica). Oliver es el
    caso diagnóstico: usa las dos, y dice cuál es cuál.


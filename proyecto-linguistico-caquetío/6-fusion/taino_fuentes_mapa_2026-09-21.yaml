- id_propuesto: coll-y-toste-1897
  obra: Vocabulario indo-antillano (en *Prehistoria de Puerto Rico*)
  autor: Coll y Toste, Cayetano
  anio: 1897-1907
  que_es: vocabulario antillano puertorriqueño
  que_daria: >-
    MEDIO-ALTO, CON RESERVA. Es probablemente la colección de voces taínas más
    extensa de su época y circula muchísimo — pero circula sobre todo

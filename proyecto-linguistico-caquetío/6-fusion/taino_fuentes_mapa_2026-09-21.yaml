  autor: Bachiller y Morales, Antonio
  anio: 1883
  que_es: vocabulario + etnohistoria antillana
  que_daria: >-
    ALTO por relación coste/beneficio: es **gratis, íntegro y en línea hoy**, y
    Alvarado 1921 lo cita por página como autoridad («Bachiller, Cuba primit.
    242» para `ceiba`, «250» para el yopo/cohiba, «244» para la chicha). O sea:

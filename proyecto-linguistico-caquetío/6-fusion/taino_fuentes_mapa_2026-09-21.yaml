  en_linea_legal: por_verificar
- id_propuesto: pichardo-1836
  obra: Diccionario provincial casi razonado de vozes y frases cubanas
  autor: Pichardo y Tapia, Esteban
  anio: 1836 y ss.
  que_es: diccionario dialectal cubano
  que_daria: >-
    MEDIO, Y ES UN AVISO. Brinton apoya `taita` 'padre' en «Richardo», que es
    Pichardo — es decir, nuestra única atestación de `taita` sale de un
    diccionario del ESPAÑOL DE CUBA del s. XIX, no de un cronista. Tener a
    Pichardo permitiría ver qué dice de verdad y decidir si `taita` se degrada.

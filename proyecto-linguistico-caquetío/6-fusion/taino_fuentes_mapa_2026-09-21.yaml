# ══════════════════════════════════════════════════════════════════════
# 2. LA CUARENTENA
#
# Miguel, 2026-09-21: «Vi por ahí que hay esfuerzos para recuperarlo, con su
# propia escritura y todo. Obvio si es así la idea no es usar eso, ya que es
# algo contemporáneo».
#
# Cómo se describen aquí: son esfuerzos culturales legítimos de comunidades
# vivas que reclaman una identidad que la historiografía dio por extinguida, y
# el trabajo lingüístico que hacen es serio y está asesorado por arawakistas.
# Que no sean evidencia del s. XVI **no los desmerece**: es la misma frase que
# vale para nosotros. Este proyecto tampoco es evidencia del caquetío. La
# diferencia entre un pueblo que rehace su lengua y un corpus que la documenta
# no es de calidad: es de para qué sirve cada cosa.
# ══════════════════════════════════════════════════════════════════════
cuarentena:
  por_que_existe: >-
    porque las dos cosas se publican con la misma palabra encima —«taíno»— y en
    la web conviven en la misma lista. Una voz del vocabulario de Las Casas y
    una acuñada en 2023 desde el wayuu se ven igual en una tabla de dos
    columnas. Si una de ésas entra a nuestro lexicón como «taíno atestiguado»,
    el préstamo de esfera deja de medir contacto del s. XV y pasa a medir
    nuestro descuido.

  proyectos_identificados:
  - nombre: Hiwatahia — Hekexi Taíno
    quien: >-
      Kasike Jorge Baracutay Estevez y la educadora Jessie Hurani Marrero, con
      la organización Higuayagua Taíno of the Caribbean; 11 equipos de lengua,
      76 personas. Con asesoría de los arawakistas Konrad Rybka y Alexandra
      Aikhenvald.
    desde: >-
      el movimiento de reclamación taína arranca a finales de los 80 y crece
      hacia el V Centenario de 1992; el diccionario, 2ª edición, es de 2023
    que_publican: >-
      *Hiwatahia: Hekexi Taino Language Dictionary* (2023), unas 20.000
      entradas; una gramática en línea; un traductor para móvil y escritorio;
      canciones, rezos y reconocimientos de territorio. Unos 197 miembros de la
      tribu Higuayagua aprendiendo la variedad.
    escritura_propia: >-
      usan alfabeto latino. La escritura propia que circula asociada al mundo
      taíno es otra (ver Sague, abajo).
    de_donde_rellenan_los_huecos: >-
      declarado por ellos: la base es **ta-maipureana/ta-arawak** — es decir,
      las lenguas arahuacas emparentadas, que en la práctica son el lokono, el
      wayunaiki y el garífuna.
    urls:
    - https://en.wikipedia.org/wiki/Ta%C3%ADno_language
    - https://www.americanindianmagazine.org/waking-the-taino-language
    - https://tiboko.com/wp-content/uploads/2023/12/Hiwatahiaorigingrammarandsyntax1.pdf
    - https://books.google.com/books/about/Hiwatahia_Hekexi_Taino_Dictionary.html?id=p2EN0AEACAAJ
  - nombre: Tainonaíki (y Taíno-Borikenaíki)
    quien: Javier A. Hernández, lingüista puertorriqueño
    desde: >-
      *Primario Basíco del Taíno-Borikenaíki* en 2018, tras ~16 años de
      trabajo; el alfabeto Tainonaíki en 2019, tras 15 de investigación
    que_publican: >-
      un alfabeto propio (híbrido alfabeto-abyad: las vocales son diacríticos
      con estatuto de letra plena) y una lengua aprendible, escribible y
      hablable, con el artículo 1 de la Declaración de Derechos Humanos
      transliterado y grabado
    escritura_propia: >-
      SÍ. Modelada sobre el alfabeto pictográfico taíno de Naguaké, petroglifos
      taínos, el silabario cheroqui y los silábicos aborígenes canadienses
      unificados.
    de_donde_rellenan_los_huecos: >-
      declarado en su propia ficha: «fusión de palabras, prefijos y estructuras
      gramaticales taínas con palabras y estructuras del **wayuu, el garífuna y
      el arawak**». Y dicen la frase que nos importa: a diferencia del taíno
      clásico, limitado a ciertas palabras y frases, el Tainonaíki **sí** se
      puede hablar.
    urls:
    - https://omniglot.com/conscripts/tainonaiki.htm
  - nombre: Silabario taíno de Sague
    quien: Miguel A. Sague Jr. «Sobaoko Koromo»
    desde: fecha no declarada en la ficha consultada
    que_publican: >-
      un silabario al modo maya (la consonante lleva marcas vocálicas alrededor)
    escritura_propia: SÍ, silabario
    de_donde_rellenan_los_huecos: >-
      no declarado en la ficha. El ejemplo que da la propia página es
      «Daka naboria Yaya» = «soy un servidor del Gran Espíritu», y ahí se ve el
      método: `naboria` es voz de crónica (Las Casas), `Daka` es el pronombre
      de 1ª persona que el arahuaco de Guayana tiene (`da-`), y `Yaya` es del
      corpus de Pané. Tres capas distintas en tres palabras, sin marca.
    urls:
    - https://www.omniglot.com/conscripts/taino.htm
  - nombre: listas anónimas y reediciones sin aparato
    quien: >-
      sitios de divulgación y de tribus; la más citada reedita a Coll y Toste
      desde *Clásicos de Puerto Rico* (1972)
    que_publican: >-
      glosarios taíno-español largos, con flora, fauna, topónimos y nombres de
      caciques
    de_donde_rellenan_los_huecos: >-
      no lo dicen, que es el problema. Comprobado en taino-tribe.org: los
      cronistas (Oviedo, Las Casas, Pedro Mártir) se nombran dentro de algunas
      glosas, pero **no hay fuente por entrada ni fecha por entrada**, y el
      propio prólogo admite que Coll y Toste discrepa de otros autores. Alguna
      entrada la incluyen diciendo a la vez que Bachiller y Morales no la
      acepta.
    urls:
    - https://www.taino-tribe.org/terms1.htm
    - https://mipais.jmarcano.com/historia/pre-colombina/glosario-taino/

  aval_externo: >-
    la crítica lingüística de estos proyectos está publicada y coincide con lo
    que este criterio mide: Rybka y Sabogal advierten de la «mezcla de datos de
    edades distintas» y de que a veces se toman por taínas voces caribes. No es
    una objeción nuestra: es el estado de la cuestión.

  # ── EL CRITERIO OPERATIVO ───────────────────────────────────────────
  criterio_operativo:
    como_se_usa: >-
      son marcas, no veredictos. Una marca sola no descarta nada; dos mandan
      mirar el pasaje; tres mandan degradar hasta que alguien lea la fuente
      (regla 2: en duda, degradar). Y la marca NUNCA sustituye a la
      procedencia: la que decide de dónde vino una entrada nuestra es el commit,
      no el parecido.
    c1_sin_fuente_anterior_a_1900: >-
      la voz no aparece en ninguna fuente anterior a 1900 y la entrada no cita
      ninguna. Es la marca más barata y la que más se cumple: 42 de nuestras 52
      del lexicón y las 26 del JSON.
    c2_concepto_que_ningun_cronista_glosa: >-
      cubre un campo que las crónicas del XVI no glosan en taíno: números altos,
      colores, pronombres completos, saludos, partes del cuerpo, verbos
      conjugados. Los cronistas glosaron cosas —plantas, bichos, cargos,
      utensilios—, no paradigmas. El 95 % de lo registrado son sustantivos, y
      eso es precisamente lo que obliga a la recuperación contemporánea a
      inventar el resto.
    c3_grafia_del_proyecto_moderno: >-
      la grafía usa convenciones modernas (⟨k⟩ sistemática donde el XVI escribe
      ⟨c⟩/⟨qu⟩, ⟨w⟩, dígrafos propios, diacríticos de un alfabeto nuevo) en vez
      de la transcripción castellana de época. Ojo: NUESTRA retroabstracción
      hace lo mismo a propósito (`matakán`, `cacike`, `kunuku`), así que esta
      marca sola no dice nada sobre una clave nuestra — dice mucho sobre una
      voz copiada de una lista ajena.
    c4_se_explica_mejor_desde_el_andamio: >-
      la forma se explica mejor desde el lokono, el wayuu o el garífuna que
      desde una transcripción castellana del XVI. Es el método declarado de los
      dos proyectos vivos, y por eso es la marca que más discrimina.
    c5_la_lista_no_fecha_ni_cita_por_entrada: >-
      marca de la FUENTE, no de la voz: si la lista de la que se copia no dice
      por entrada de qué cronista sale y de qué año, la lista entera entra en
      cuarentena aunque contenga voces buenas. Es lo que pasa con las
      reediciones de Coll y Toste.

  # ── EL NÚMERO QUE MÁS IMPORTA ───────────────────────────────────────
  huele_alguna_de_las_nuestras_a_venir_de_ahi:
    respuesta_corta: >-
      NO. Ninguna de las 56 viene de la recuperación contemporánea, y no es una
      impresión: es procedencia. Las 52 del lexicón entraron en 5 commits, 51 de
      ellos entre el 2026-06-13 y el 2026-06-21 —el arranque del repo— y las 26
      del JSON las **generó este proyecto** con
      `arahuaco_comparative.reconstruir_taino()`, que aplica correspondencias
      lokono→taíno a una palabra lokono. El generador está en el repo y su
      salida es reproducible.
    pero: >-
      15 marcas de perfil (8 formas del lexicón y 7 del JSON, que en buena parte
      son las mismas claves) tienen el MISMO PERFIL que lo que produce la recuperación
      contemporánea, porque se hicieron con el mismo método: 8 de las 52 del
      lexicón cumplen tres criterios o más (`abba`, `acoa`, `aduri`, `agari`,
      `daca`, `thigisi`, `wacusi`, `wagulo` — todas `taíno-reconstruido` desde
      el lokono, todas de categoría `cuerpo` o `gramatica`) y 7 de las 26 del
      JSON cumplen tres. No nos contaminaron: **lo hicimos nosotros**, y eso es
      peor de arreglar y mejor de auditar, porque sabemos exactamente dónde
      está.
    y_lo_grave: >-
      2 de esas formas LLEGAN AL PROMPT. `voces_de_fuera_posibles()` devuelve 43
      candidatas y 2 son `taíno-reconstruido` desde el lokono: `akcicyaa`
      (< Lok. akkicyaha) y `wagulo` (< Lok. wabulo). El agente de tier 1 las ve
      en `[Voces de fuera]` etiquetadas como taínas. Como
      `normalize_source_language('taíno-reconstruido')` devuelve `'taíno'`, la
      capa que F8 separó en `fuente` se vuelve a juntar en la puerta del motor:
      el lokono —que es ANDAMIO y no debe verlo nadie, porque haría circular la
      medición— entra por la puerta de la esfera con etiqueta taína. Medido en
      `taino_inventario_2026-09-21.yaml` §d.
    contraprueba_del_metodo: >-
      el propio Brinton, en la página donde nuestro `abba` 'uno' se apoya, dice
      que el 1 taíno es **hequeti** (Las Casas, Hist. Apol. cap. 204) y que
      `abba` es el 1 ARAWACK. La reconstrucción nos dio una forma para un hueco
      que no existía: la atestación estaba al lado. Es el caso literal de la
      política «donde hay forma atestiguada, manda la atestiguada»
      (CLAUDE.md), aplicada al taíno en vez de al caquetío.

  en_linea_legal: >-
    ficha de *Prehistoria de Puerto Rico*:
    https://books.google.com/books/about/Prehistoria_de_Puerto_Rico.html?id=hRo7uAAACAAJ ·
    reedición sin aparato: https://www.taino-tribe.org/terms1.htm (ver cuarentena)
  por_verificar: si hay edición original de 1897/1907 con texto abierto
- id_propuesto: tejera-indigenismos
  obra: Indigenismos
  autor: Tejera, Emilio (y Emiliano Tejera)
  anio: 1951 / 1977
  que_es: repertorio dominicano de voces indígenas con sus testimonios
  que_daria: >-
    ALTO si se consigue: es el repertorio que reúne los testimonios coloniales
    voz a voz, que es justo lo que nos falta. Pero es moderno.

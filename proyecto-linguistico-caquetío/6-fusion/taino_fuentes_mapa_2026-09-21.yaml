# ─────────────────────────────────────────────────────────────────────────
# El mapa de las fuentes del taíno, y la cuarentena de lo contemporáneo
#
# Campaña del Taíno, parcela T3 (2026-09-21). Segunda mitad: la única parte de
# la campaña que sale a la web.
#
# Dos cosas:
#   (1) qué bibliografía usa un estudio serio del taíno, qué daría a ESTE
#       proyecto, y dónde está legalmente en línea;
#   (2) LA CUARENTENA: quién está recuperando hoy el taíno, cómo lo hacen, qué
#       listas de la web mezclan eso con el XVI sin decirlo, y un criterio
#       operativo para que no se nos cuele.
#
# ⚠️ Esto PROPONE (regla 5). Nada de aquí entra al canon sin que Miguel lo
# fusione. Y nada de aquí es una cita: las páginas web se leyeron para SABER
# QUÉ PEDIR, no para extraer datos de lengua. El dato de lengua sale de la obra
# leída, no de la ficha de la obra.
#
# ⚠️ Brinton, Oviedo, Las Casas y Pané son parcela de T1/T2 en esta campaña.
# Aquí sólo figuran como fichas y como huecos (los volúmenes que faltan).
# ─────────────────────────────────────────────────────────────────────────
meta:
  fecha: '2026-09-21'
  campana: Campaña del Taíno — parcela T3
  autor: minador T3 (inventario y mapa de fuentes)
  metodo: >-
    búsqueda web sobre catálogos y repositorios (archive.org, HathiTrust,
    Persée, dLOC, Open Library, Biodiversity Heritage Library) más la
    bibliografía que la literatura sobre el taíno cita. Cada ficha dice lo que
    se COMPROBÓ y lo que queda `por_verificar`: una URL que no se abrió no se
    da por buena.
  aviso_de_derechos: >-
    dominio público = se puede copiar literal. Obra moderna = paráfrasis y cita
    corta (menos de 15 palabras). Está marcado obra a obra en `derechos`.
  lo_que_resulto_falso_del_encargo:
  - afirmacion: '«las crónicas que faltan: … Pedro Mártir *Décadas*»'
    medido: >-
      Pedro Mártir de Anglería YA ESTÁ en el repo: `angleria-1892` (Fuentes
      Históricas sobre Colón y América / Décadas del Nuevo Mundo), vols. 1 y 4,
      460 + 492 páginas, `en_repo: true`, `estado_minado: parcial`. No hay que
      conseguirlo: hay que MINARLO. Y es la fuente que Brinton cita una y otra
      vez en su vocabulario antillano («Pet. Martyr, p. 9», «p. 26», «p. 293»,
      «p. 304»), así que es la verificación de primera mano más barata que
      tenemos hoy en casa.
  - afirmacion: «las 78» (52 del lexicón + 26 de `taino_hipotetico.json`)
    medido: >-
      son **56 formas distintas**, no 78: 22 de las 26 claves del JSON son
      también claves del lexicón. El JSON no es un corpus aparte sino, en su
      mayor parte, el mismo material antes de entrar. Sólo 4 de sus 26 son
      formas que el lexicón no tiene.
  - afirmacion: «52 entradas taínas … y 0 de 52 con `procedencia.obra`»
    medido: >-
      cierto las dos cifras, pero incompleto: 10 de las 52 SÍ citan una obra en
      PROSA dentro de `notas` (9 a Brinton 1871, 1 a Alvarado 1921 + Las Casas +
      van Buurt). Y de esas 9 citas a Brinton, 4 no se sostienen contra el texto
      del repo. Ver `taino_inventario_2026-09-21.yaml` §g.

# ══════════════════════════════════════════════════════════════════════
# 1. LA BIBLIOGRAFÍA, ORDENADA POR LO QUE DARÍA A ESTE PROYECTO
#
# El orden no es de prestigio: es de cuánto movería NUESTRA aguja, que es
# poder poner `procedencia.obra` + página a 52 entradas y separar el taíno
# atestiguado del panhispánico.
# ══════════════════════════════════════════════════════════════════════

# ── LAS TRES QUE YO PEDIRÍA PRIMERO ───────────────────────────────────
las_tres_que_pediria_primero:
- orden: 1
  id_propuesto: granberry-vescelius-2004
  obra: Languages of the Pre-Columbian Antilles
  autor: Granberry, Julian y Vescelius, Gary S.
  anio: 2004
  publicacion: University of Alabama Press, Tuscaloosa. 160 pp.
  que_es: estudio lingüístico + el léxico taíno más completo que existe reunido
  que_daria: >-
    ES LA PIEZA QUE FALTA. Trae el diccionario taíno/inglés más completo
    publicado y, sobre todo, **separa las siete comunidades de habla de las
    Antillas Mayores al contacto** — taíno clásico, taíno ciboney, macorís alto
    y bajo, ciguayo, guanahatabey, eyeri/kalinago y karina caribe. Eso es
    exactamente la trampa 3 de esta campaña («el taíno tampoco era una sola
    lengua») resuelta por una autoridad citable, y es lo que nos dejaría
    etiquetar cada una de nuestras 43 voces con QUÉ taíno es. También es la
    obra estándar para decidir si una voz es taína o caribe insular, que es
    nuestra clase (iv).
  derechos: >-
    EN COPYRIGHT (2004, University of Alabama Press). Paráfrasis y cita corta
    (< 15 palabras). No hay texto libre legal.
  en_linea_legal: >-
    no libre. Ficha en BiblioVault (https://www.bibliovault.org/BV.book.epl?ISBN=9780817351236)
    y reseñas abiertas en H-Net
    (https://networks.h-net.org/node/23910/reviews/54432/guitar-granberry-and-vescelius-languages-pre-columbian-antilles)
    y en IJAL (https://www.journals.uchicago.edu/doi/10.1086/598773).
  tamano: 160 pp.
  como_conseguirla: compra (ISBN 9780817351236) o préstamo interbibliotecario
  por_verificar: si la reseña de IJAL o la de H-Net reproducen parte del léxico
- orden: 2
  id_propuesto: angleria-1892
  obra: Décadas del Nuevo Mundo (Fuentes Históricas sobre Colón y América), vols. 1 y 4
  autor: Anglería, Pedro Mártir de
  anio: 1892 [c. 1530]
  que_es: crónica primaria — la más temprana que glosa voces de las islas
  que_daria: >-
    **YA ESTÁ EN EL REPO Y NO ESTÁ MINADA** (`estado_minado: parcial`,
    `entradas_lexicon: 0`). Brinton apoya en Pedro Mártir cinco de las voces de
    su vocabulario antillano citando página exacta. Minarlo convertiría citas
    de segunda mano («Brinton 1871») en atestaciones de primera con página, que
    es la diferencia entre la clase (ii) y la clase (i) del inventario. Coste
    cero de adquisición.
  derechos: dominio público (1892, autor del s. XVI). Copia literal permitida.
  en_linea_legal: no hace falta — local en `fuentes_caquetios/`
  tamano: 460 + 492 pp.
  como_conseguirla: hecho. Falta la sesión de minería.
  aviso: >-
    faltan las décadas de los volúmenes 2 y 3. Antes de pedirlos, medir cuánto
    dan el 1 y el 4 (la nota de `4-fuentes/angleria-1892.md` ya dice que el
    rendimiento es «muy desigual»: el vol. 4 dio el mejor dato de su sesión y el
    vol. 1 no dio nada).
- orden: 3
  id_propuesto: zayas-1914
  obra: >-
    Lexicografía antillana. Diccionario de voces usadas por los aborígenes de
    las Antillas Mayores y de algunas de las menores
  autor: Zayas y Alfonso, Alfredo
  anio: 1914
  publicacion: Imprenta «El Siglo XX», La Habana. 487 pp.
  que_es: vocabulario antillano del s. XX — el más extenso de la tradición cubana
  que_daria: >-
    Es el Alvarado de las Antillas: un glosario que va voz por voz y dice de
    dónde la toma. Nos daría cita con página para el grueso de las 34 entradas
    que hoy no citan nada, y —por el mismo método con el que Alvarado sirvió
    para el caquetío— nos dejaría separar la voz antillana atestiguada del
    tainismo panhispánico, que es la trampa 1 de esta campaña. Es el complemento
    exacto de Granberry: uno da la clasificación moderna, el otro la cadena de
    testimonios coloniales.
  derechos: dominio público (1914, autor muerto en 1934)
  en_linea_legal: >-
    dLOC (Digital Library of the Caribbean): https://dloc.com/es/AA00089831/00002/citation ·
    ficha en Open Library: https://openlibrary.org/books/OL6584885M/Lexicografi%CC%81a_antillana
  tamano: 487 pp.
  como_conseguirla: dLOC (comprobar si sirve el texto completo o sólo la ficha)
  por_verificar: >-
    que el ejemplar de dLOC sea descargable y tenga capa de texto. Si no, es un
    caso de `leer-fuente` §OCR.

# ── EL RESTO, POR LO QUE DARÍA ────────────────────────────────────────
resto_por_valor:

# --- crónicas primarias que faltan (los volúmenes, no las obras) ---
- id_propuesto: las-casas-apologetica
  obra: Apologética historia sumaria
  autor: Casas, Bartolomé de las
  anio: '[c. 1559]'
  que_es: crónica primaria — la etnografía, no la denuncia
  que_daria: >-
    ALTO. Es la fuente de la que cuelga media docena de nuestras entradas por
    interpósita persona: Brinton cita «Las Casas, Hist. Apol. cap. 197» para
    `nitaino` y `naboria`, «cap. 204» para `batey` y los numerales
    (1 hequeti, 2 yamosa, 3 cauocum, 4 yaraoucobre), «cap. 241» para `bixa` y
    `bejique`. Con la Apologética en casa, esas seis pasan de «Brinton lo dice»
    a atestación con capítulo. Y el cap. 204 resuelve de un golpe si nuestro
    `abba` 'uno' —reconstruido del lokono— debe ceder ante `hequeti`, que es el
    taíno atestiguado para lo mismo.
  derechos: dominio público
  en_linea_legal: >-
    PDF abierto en Boston University:
    https://sites.bu.edu/american-egypt/files/2020/02/Apologetica-Historia-Sumaria.pdf ·
    El Libro Total: https://www.ellibrototal.com/ltotal/ficha.jsp?idLibro=4072
  tamano: 2 tomos (ed. O'Gorman 1967)
  aviso: el repo sólo tiene la *Historia de las Indias* tomo I, que es otra obra
  por_verificar: qué edición es el PDF de BU y si trae los capítulos 197/204/241
- id_propuesto: oviedo-y-valdes-1851-vols-2-4
  obra: Historia general y natural de las Indias, vols. II-IV
  autor: Fernández de Oviedo y Valdés, Gonzalo
  anio: 1851-1855 [1535-1557]
  que_es: crónica primaria — el naturalista del Caribe
  que_daria: >-
    MEDIO-ALTO. El repo tiene el vol. I. Alvarado apoya sus «voz taina» en
    Oviedo tomo I casi siempre (`Ov. I. 63`, `I. 163`, `I. 164`, `I. 268`,
    `I. 273`), así que el vol. I puede bastar para bastantes; los otros abren
    los libros VII (agricultura: `conuco`) y XIII (fauna: `manati`), que son
    justo nuestras categorías flojas.
  derechos: dominio público
  en_linea_legal: >-
    Biodiversity Heritage Library, v.1 (1851) a v.3 (1855):
    https://www.biodiversitylibrary.org/item/30643 · Internet Archive, 2ª parte
    tomos I y II: https://archive.org/details/historia-general-y-natural-de-las-indias-segunta-parte-tomo-i
    y https://archive.org/details/historia-general-y-natural-de-las-indias-segunda-parte-tomo-ii
  tamano: ~600 pp. por volumen
- id_propuesto: colon-diario
  obra: Diario del primer viaje (en la transcripción de Las Casas)
  autor: Colón, Cristóbal / Casas, Bartolomé de las
  anio: '[1492-93]'
  que_es: crónica primaria — la primera transcripción de voces de las islas
  que_daria: >-
    MEDIO. Es donde se documenta `canoa` y donde Colón dice que la misma lengua
    se hablaba por todas las islas — que es el apoyo de la idea de «taíno» como
    unidad y, a la vez, lo que Granberry matiza. Poco léxico, mucha doctrina.
  derechos: dominio público
  en_linea_legal: por_verificar (múltiples ediciones abiertas)
- id_propuesto: colon-hernando
  obra: Historia del Almirante
  autor: Colón, Hernando
  anio: '[c. 1539]'
  que_es: crónica primaria de segunda generación
  que_daria: >-
    BAJO-MEDIO. Aporta poco léxico propio; su valor es corroborar a su padre.
    Regla de independencia (skill §8): si repite el Diario, no es una segunda
    atestación.
  derechos: dominio público
  en_linea_legal: por_verificar


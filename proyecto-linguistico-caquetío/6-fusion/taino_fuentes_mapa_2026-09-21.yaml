  derechos: dominio público
  en_linea_legal: por_verificar (hay ediciones en archive.org y HathiTrust)

# --- estudios lingüísticos ---
- id_propuesto: goeje-1939
  obra: >-
    Nouvel examen des langues des Antilles, avec notes sur les langues
    arawak-maipure et caraïbes
  autor: Goeje, Claudius H. de
  anio: 1939
  publicacion: Journal de la Société des Américanistes 31, pp. 1-128
  que_es: estudio lingüístico comparativo
  que_daria: >-
    ALTO Y GRATIS. 128 páginas de examen comparado de las lenguas antillanas con
    el arawak-maipure y el caribe, por el autor que sigue siendo la referencia
    previa a Taylor. Es la obra que decide, con método, si `caiman`, `piragua`,
    `papaya` o `maboya` son taínas o caribes insulares — nuestra clase (iv)
    entera. Y está **abierta en Persée**.
  derechos: dominio público / acceso abierto en Persée
  en_linea_legal: >-
    Persée: https://www.persee.fr/doc/jsa_0037-9174_1939_num_31_1_1984 ·
    Biblioteca Digital Curt Nimuendajú:
    http://www.etnolinguistica.org/biblio:goeje-1939-antilles
  tamano: 128 pp. (francés)
  aviso: en francés. El proyecto ya ha minado en francés (Adam 1879, Breton).
- id_propuesto: taylor-1977
  obra: Languages of the West Indies
  autor: Taylor, Douglas MacRae
  anio: 1977
  publicacion: Johns Hopkins University Press, Baltimore. xix + 278 pp.
  que_es: estudio lingüístico
  que_daria: >-
    MEDIO-ALTO para NOSOTROS, aunque sea una obra mayor: su núcleo es el caribe
    insular (kalinago) y los criollos, no el taíno. Nos serviría sobre todo para
    la otra lengua de la esfera —el kalinago, 23 entradas del lexicón— y para
    zanjar los casos caribe/taíno.
  derechos: EN COPYRIGHT (1977). Paráfrasis y cita corta.
  en_linea_legal: >-
    ficha: https://openlibrary.org/books/OL4902321M/Languages_of_the_West_Indies ·
    hay un ítem en Internet Archive con préstamo:
    https://archive.org/details/rosettaproject_arw_vocab-1 (por_verificar qué es exactamente)
- id_propuesto: arrom-lexicologia
  obra: Estudios de lexicología antillana
  autor: Arrom, José Juan
  anio: 1980 / 2000
  publicacion: Editorial de la Universidad de Puerto Rico
  que_es: estudios de lexicología taína
  que_daria: >-
    MEDIO-ALTO. Arrom es quien mejor ha trabajado el vocabulario religioso y
    cosmológico taíno (`cemí`, `maboya`, `behique`, `areíto`) — que son
    exactamente las entradas nuestras que NO aparecen ni en Alvarado ni en el
    vocabulario de Brinton, porque no son voces del español de Venezuela sino
    arqueología antillana. Es la fuente natural para ellas.
  derechos: EN COPYRIGHT. Paráfrasis y cita corta.
  en_linea_legal: >-
    fichas: https://openlibrary.org/books/OL3073135M/Estudios_de_lexicologi%CC%81a_antillana ·
    https://books.google.com/books/about/Estudios_de_lexicolog%C3%ADa_antillana.html?id=fr4uAAAAYAAJ
- id_propuesto: alvarez-nazario
  obra: El elemento afronegroide en el español de Puerto Rico / El habla campesina del país
  autor: Álvarez Nazario, Manuel
  anio: 1961 / 1990
  que_es: dialectología histórica puertorriqueña
  que_daria: >-
    BAJO-MEDIO para el taíno precontacto; alto para el indigenismo
    **panhispánico**, que es nuestra trampa 1. Sirve para el descarte, no para
    la atestación.
  derechos: EN COPYRIGHT
  en_linea_legal: por_verificar
- id_propuesto: rybka-sabogal
  obra: >-
    trabajos de Konrad Rybka y Andrés Sabogal sobre la reconstrucción del taíno
  autor: Rybka, Konrad; Sabogal, Andrés
  anio: 2020s
  que_es: crítica lingüística de los proyectos de reconstrucción
  que_daria: >-
    ALTO para LA CUARENTENA, que es lo que esta ficha mira. Son los lingüistas
    que ponen por escrito los dos fallos que nos importan: que las
    reconstrucciones mezclan datos de épocas distintas, y que a veces toman por
    taínas voces caribes. Es el aval externo del criterio de abajo — y también
    la razón de que la descripción de los proyectos vivos sea respetuosa: Rybka
    asesora a uno de ellos.
  derechos: según publicación
  en_linea_legal: por_verificar
  via: resumido en la entrada «Taíno language» de Wikipedia (https://en.wikipedia.org/wiki/Ta%C3%ADno_language)


    razon: 'bana se sostiene sin Esteves (HB, CGB, Velasco); judi/juri no, pero recurre con la misma glosa en tres
      nombres (Judibana, Jurijurebo, Tura): una pieza independiente más otra sólo de Esteves y recurrente = B.'

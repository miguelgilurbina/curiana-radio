    forma: cumarebo
    nivel_hoy: A
    procedencia: zavala-reyes-2015
    piezas_solo_de_esteves:
    - 'ebo (ebo: sólo Esteves)'
    propuesta: C
    razon: 'Zavala #94 (E) «Camino del cacique Cumare» es Esteves p. 105 («el camino del cacique Cumare: paso, senda
      y cumare, el cacique»). La razón del canon —«segunda atestación independiente de ebo (la otra es jurijurebo)»—
      cuenta dos veces a Esteves.'

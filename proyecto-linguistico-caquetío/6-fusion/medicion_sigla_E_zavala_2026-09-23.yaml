  uso_en_la_base_criterio: 'una forma cuenta para una voz si ES la voz, si la lleva como uno de sus segmentos separados
    por guion, o si la voz es uno de los candidatos de raíz del desafijador (medir_pares_atestiguado_reconstruido.rol_en_la_familia).
    Residuo: las formas aglutinadas sin guion no cuentan.'
  el_score_no_se_mueve: 'score_linguistico() no lee la capa: capas_de_score tiene las cuatro (5-experimento/perfiles_de_run.yaml).

# ══════════════════════════════════════════════════════════════════════
# La terminación -re — censo pedido por Miguel el 2026-09-10
# ══════════════════════════════════════════════════════════════════════
meta:
  de_donde_sale: >-
    Buscando si `visure` estaba en el lexicón salió `bisure`, y con él sus
    vecinos de glosario `barsure` 'alma' y el topónimo BISURE. Miguel: «me
    parece interesante esa terminación -re». Se mide en las tres capas.
  script: '6-fusion/scripts/censo_terminacion_re.py'

# ══════════════════════════════════════════════════════════════════════
# 1. No es una impresión: es la terminación más frecuente del gazetteer
# ══════════════════════════════════════════════════════════════════════
lo_primero_que_hay_que_descartar:
  la_objecion: >-
    «Casi todo acaba en vocal, claro que hay muchos en -re». Hay que medirlo
    antes de seguir, o el censo entero no dice nada.
  el_control: >-
    Contadas TODAS las finales de dos letras de las 387 entradas de la Parte II
    de Esteves, `-re` es la PRIMERA con 37. Detrás: `-al` 24 (que es el
    colectivo CASTELLANO de Guayacanal y Cacetal, o sea ni siquiera indígena),
    `-ro` 22, `-ua` 21, `-ra` 18.
  veredicto: >-
    ⭐ La terminación más frecuente del gazetteer de topónimos caquetíos es
    `-re`, y le saca 13 a la siguiente. La intuición de Miguel se sostiene.

# ══════════════════════════════════════════════════════════════════════
# 2. El censo, en las tres capas
# ══════════════════════════════════════════════════════════════════════
censo:
  lexicon_caquetio:
    de: 301
    en_re: 19
    porcentaje: '6%'
    reparto: {'-ure': 12, '-are': 3, '-ere': 2, '-ore': 2}
    las_doce_en_ure: >-
      bachure 'maneto', barsure 'alma, esencia vital', bisure 'lagartija',
      chaure 'lechuza que anida en cuevas de terreno arenoso', kasikure
      'levante, este', MANAURE 'título laudatorio del señor principal', maure
      'fibra de algodón', naure 'planta bejucosa', tupure 'siembra de cacao',
      URE 'raíz', wabarsure 'alma colectiva', yakure 'acacia'.
    lo_que_salta_a_la_vista: >-
      ⭐ `ure` = 'raíz' ES una entrada del lexicón por derecho propio,
      caquetío-atestiguada. O sea que las otras once podrían ser compuestos
      con ella — que es exactamente como Esteves lee GUAIMURE: «raíz de guay;
      "ure", raíz».
  canon_de_toponimos:
    de: 178
    en_re: 25
    porcentaje: '14%'
    reparto: {'-are': 15, '-ure': 6, '-ire': 2, '-ere': 1, '-ore': 1}
  gazetteer_esteves_parte_II:
    de: 387
    en_re: 36
    porcentaje: '9%'
    reparto: {'-ure': 15, '-are': 14, '-ire': 4, '-ore': 3}

  la_asimetria: >-
    ⭐⭐ En el LEXICÓN manda `-ure` (12 de 19). En el CANON DE TOPÓNIMOS manda
    `-are` (15 de 25). No es la misma terminación repartida al azar: cada capa
    prefiere una. Eso pide explicación, y es lo que hace interesante el censo.

# ══════════════════════════════════════════════════════════════════════
# 3. La prueba que decide: ¿sufijo, o final de raíz?
# ══════════════════════════════════════════════════════════════════════
la_prueba:
  como_se_hace: >-
    Si `-ure` es SUFIJO, quitarlo tiene que dejar una raíz que exista. Se probó
    sobre las 19 del lexicón, quitando -ure, -re y -e.
  resultado_en_el_lexicon: >-
    🔴 CERO de 19. Ninguna deja raíz atestiguada: `bisure` no deja `bis`,
    `maure` no deja `mau`, `manaure` no deja `mana`. En el léxico, `-ure` es
    final de raíz y no hay morfema que despejar.
  el_cero_tiene_matiz:
    - >-
      ⚠️ Regla 6: el lexicón caquetío son 301 palabras. Que la raíz no esté
      mide nuestro vocabulario, no la lengua.
    - >-
      ⭐ Y hay UNA excepción que mi propia prueba no vio porque solo quitaba
      por el final: `wabarsure` = `wa-` + `barsure`, y `barsure` SÍ está en el
      lexicón. La única morfología interna de todo el grupo -ure es
      PREFIJAL, no sufijal.

  resultado_en_los_toponimos: >-
    ⭐⭐⭐ Y aquí se da la vuelta. En el canon, `-ure` SÍ se separa, y la raíz
    que queda es atestiguada:
      · ADAURE  = a- + dar(a) + -ure   — y `dara` es el alcaraván
      · ABUDURE = (a)dabuda + ure      — con aféresis de la d-
      · GUAIMURE = guay + ure          — y `guay` es 'árbol parecido a la ceiba'
    Tres topónimos donde el corte funciona, frente a cero palabras del léxico.

  lo_que_se_concluye: >-
    ⭐⭐ `-ure` y `-are` se comportan como MORFOLOGÍA TOPONÍMICA, no como
    derivación léxica general. Se pegan a nombres de lugar sobre bases
    atestiguadas, y no forman palabras comunes.
  y_lo_que_eso_le_hace_a_la_disputa:
    la_disputa: >-
      `morfema-002` tiene la glosa de `-ure` EN DISPUTA: Esteves y van Buurt
      dicen 'raíz'; la evidencia toponímica dice 'sitio de'.
    lo_que_aporta_este_censo: >-
      Que el formante solo se despeje en topónimos, y nunca en palabras
      comunes, empuja hacia 'SITIO DE'. Un sustantivo que significa 'raíz'
      debería poder componer palabras corrientes, y no lo hace ni una vez en
      301. ⚠️ No lo cierra: `ure` 'raíz' es voz libre atestiguada, y un
      sustantivo que se gramaticaliza en formante de lugar es un camino
      normalísimo — las dos cosas pueden ser verdad a la vez, en orden.

# ══════════════════════════════════════════════════════════════════════
# 4. Una cifra a mano que quedó vieja
# ══════════════════════════════════════════════════════════════════════
morfema_002_no_estaba_desactualizado:
  lo_que_escribi_primero: >-
    🔴 Dije que `morfema-002` declaraba «recurrencia: 5» y que la cifra estaba
    vieja porque yo medía 15 en el canon y 14 en Esteves. FALSO, y lo vi al
    abrir la entrada: su `5` no cuenta finales en -are. Cuenta «5 de 7
    APARICIONES EN POSICIÓN FINAL CON GLOSA DESCRIPTIVA que denotan un
    LUGAR». Es una cifra más cuidadosa que la mía, no una más vieja.
  lo_que_mide_cada_una: >-
    Mi 15/14 es el conteo crudo de nombres terminados en -are. El 5/7 de
    morfema-002 es el subconjunto que además TIENE GLOSA y por tanto se puede
    juzgar. Denominadores distintos: las dos son correctas y no se comparan.
  lo_que_si_queda: >-
    ⭐ El conteo crudo sirve para lo que la entrada no dice: cuántos CANDIDATOS
    quedan por examinar. De 15 en el canon, solo 7 tenían glosa cuando se
    escribió morfema-002 — y desde entonces han entrado más glosados
    (Bariquire con `quire` 'color'). Vale la pena recontar los glosados, no la
    recurrencia.
  y_lo_que_la_entrada_ya_dice_y_yo_no_habia_leido: >-
    `morfema-002` NO está «sin glosa y sin nivel»: tiene `glosado: true` y
    `glosa_inferida: 'sitio de, paraje de (sufijo locativo)'`, con sus apoyos y
    sus DOS CONTRAEJEMPLOS declarados (guasare 'árbol cactáceo' y chunare
    'mazorca tierna', que no denotan lugar). Lo leí de una consulta que
    truncaba los campos.

# ══════════════════════════════════════════════════════════════════════
# 5. Lo que abre
# ══════════════════════════════════════════════════════════════════════
pendiente:
  - >-
    El `-dare` compite con el `-are`: el lexicón tiene `dare` 'diente; hijo'
    como palabra, y el canon ya segmenta CAPADARE como `capa-` + `dare`. Antes
    de dar por bueno un `-are` en un nombre terminado en -dare, hay que
    preguntarse si no es la palabra `dare` entera. Afecta a Capadare, Bidare,
    Chidare, Cabudare, Dabadubare, Codore.
  - >-
    `wa-` como prefijo: `wabarsure` 'alma colectiva' = wa + barsure 'alma'.
    Si `wa-` colectiviza, hay que buscarlo en más sitios — y el lexicón tiene
    `waya` 'nosotros'. Es la pista más limpia de morfología interna que ha
    dado este censo.
  - 'meter BISURE al canon: Esteves lo glosa «(Bisure: lagarto común)» y la base está atestiguada — candidato a nivel A'

# ══════════════════════════════════════════════════════════════════════
# CATIRE — la hipótesis de Miguel, 2026-09-10
# ══════════════════════════════════════════════════════════════════════
catire:
  lo_que_dijo: >-
    «Hay una palabra, CATIRE, que yo siento que justamente es como decir HIJO
    DE LA LUNA. Como para describir a los españoles por su tez blanca».

  # ── lo que se confirma, y no es poco ──
  la_mitad_que_la_fuente_ya_hacia:
    hallazgo: >-
      ⭐⭐⭐ No hay que reconstruir nada: **Zavala Reyes 2015, glosario #71
      (CGB)** dice, literal: «CATI: Luna [CATIRE: persona de tez blanca]». El
      propio glosario caquetío pone `catire` entre corchetes, pegado a la
      entrada de la luna.
    lo_que_eso_significa: >-
      La conexión luna→catire que Miguel intuyó **ya estaba hecha por la
      fuente**, y por González Batista, que es quien firma esa entrada. No es
      una corazonada: es una lectura que el glosario sostiene.
    y_la_base_esta_atestiguada: >-
      `kati` = 'luna' es **caquetío-atestiguado** en el lexicón (lema fonémico
      de `cati`, fusionado por D5). Y no está sola: la familia arahuaca la
      respalda entera — lokono `katsi` y `kathi`, kalinago `kati`, paraujano
      `keichare`. La palabra para luna es de las más firmes que tenemos.
    la_metafora_se_sostiene_sola: >-
      ⭐ Y ni siquiera hace falta 'hijo' para que funcione: la luna es lo
      PÁLIDO. 'Lunar, de la luna' → 'de tez clara' es una metáfora
      transparente y de un solo paso. Es la lectura más barata y la que menos
      asume.

  # ── el problema, que hay que decirlo ──
  la_mitad_que_no_se_sostiene:
    la_pieza: >-
      «Hijo de la luna» necesita que el `-re` venga de `dare` = 'hijo'
      (kati + dare → katire, con haplología). Y `dare` SÍ está en el lexicón
      como caquetío-atestiguado, glosado «diente; hijo (extensión metafórica)».
    el_problema: >-
      🔴 Su cita NO sostiene el 'hijo'. Las notas de la entrada dicen
      exactamente: «Zavala Reyes 2015, glosario #103 (HB): *Diente*; Oliver
      1989 la confirma en Paraguaná». Las dos fuentes dan **diente**. El «hijo
      (extensión metafórica)» no lo respalda nadie: entró en la glosa sin
      procedencia, que es lo que la regla 8 obliga a declarar como
      `deuda: sin-procedencia`.
    la_consecuencia: >-
      Con las glosas que SÍ están atestiguadas, `kati` + `dare` daría 'diente
      de la luna', no 'hijo de la luna'. Y no es una lectura rara: el canon
      segmenta CAPADARE como `capa-` + `dare` y razona «`dare` = 'diente'
      está en el lexicón y alinea» — el mismo `dare` de 'diente de tigre'.
    lo_que_NO_hace: >-
      ⚠️ Esto no refuta a Miguel. Refuta la pieza que yo pondría para
      explicarlo. La lectura 'lunar → pálido' no necesita `dare` en absoluto y
      sigue en pie.

  # ── el hueco ──
  catire_no_esta_en_el_lexicon:
    hecho: >-
      🔴 `catire` NO es una entrada del lexicón, ni en ninguna capa. Está
      únicamente dentro de las `notas` de `kati`, arrastrado como corchete al
      importar Zavala #71. La palabra estaba en la fuente y nadie la cosechó.
    por_que_pasa: >-
      Porque el importador de Zavala toma el LEMA de cada entrada y mete el
      resto en notas. Lo que va entre corchetes dentro de una glosa se
      transcribe pero no se convierte en entrada.
    y_es_el_unico: >-
      ✅ MEDIDO, y no es un fallo sistemático: barridos TODOS los corchetes
      del glosario de Zavala buscando el patrón «forma: glosa» cuyo lema no
      esté en el lexicón, sale exactamente UNO — `catire`. El importador no
      se dejó nada más por el camino. (Escribí «puede haber más casos» antes
      de medirlo; no los hay.)
    donde_iria: >-
      A `caquetío-retroabstraido`, la capa que se abrió hoy mismo. Razón:
      `catire` está documentada —Zavala la recoge— pero es también voz
      corriente del castellano venezolano, así que lo incierto es el sustrato,
      no la forma. Es el mismo caso exacto que `chiriware` y `tukeke`.

  # ── y lo que le hace al censo de -re ──
  lo_que_aporta_al_censo:
    - >-
      ⭐ Si `catire` es `kati` + `-re`, sería un `-re` NO TOPONÍMICO — un
      derivado sobre nombre común, que es justo lo que el censo no encontró
      («cero de 19» en el léxico). Un contraejemplo así vale mucho: o el censo
      se matiza, o `catire` no se segmenta así.
    - >-
      Y en la misma vecindad del glosario están `kasi`/`cazi` 'sol' (#76 GC) y
      `cazebo` 'poniente' (#75 GC). El campo semántico de los astros está
      inusualmente bien cubierto para un lexicón de 301 voces.
    - >-
      ⚠️ El paraujano da `keichare` para 'luna' (Jahn) — también en -re, y
      también sobre una base k-t/k-ch. Si `-re` fuera un formante compartido,
      aparecería ahí. Es una pista, no una prueba.

  propuesta:
    - 'añadir `catire` como entrada `caquetío-retroabstraido`, con la cita de Zavala #71 y la lectura de Miguel'
    - "declarar `deuda: sin-procedencia` sobre el 'hijo' de la glosa de `dare`, o retirarlo"
    - 'barrer los corchetes de las entradas de Zavala: puede haber más voces sin cosechar'

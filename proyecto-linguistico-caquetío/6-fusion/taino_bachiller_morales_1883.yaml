  variedad_o_isla: 'arawak de Guayana — NO taíno'
  campo: agricultura
  en_el_lexicon: kunuku
  lectura: >-
    ⚠️ **AVISO DE GLOSA**: en el arawak de Guayana `konoko` es **selva**, y en
    taíno `conuco` es el campo cultivado (Oviedo lib. VII cap. 2 vía Brinton;
    `komiko` en Goeje). Nuestro `kunuku` glosa 'conuco, campo cultivado'. La
    misma raíz con dos valores opuestos —lo desmontado y lo no desmontado— en
    las dos orillas. Es exactamente el tipo de cosa que un cruce por forma sin
    filtro de glosa junta mal (skill §2).
- forma_fuente: 'Areito, areyto'
  glosa_fuente: >-
    «Cantares acompañados de bailes en que recordaban sus tradicciones y

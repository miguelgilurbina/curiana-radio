# 5. NEGATIVAS MEDIDAS
# ══════════════════════════════════════════════════════════════════════
negativas:
- busqueda: caquetío / caiquetío / Curiana / Paraguaná
  resultado: 0
  lectura: esta obra no habla del caquetío. Se mina por el taíno y por la esfera.
- busqueda: 'mayani'
  resultado: 0
  lectura: >-
    la negación taína no entra en la lista de Bachiller. Su apoyo sigue siendo
    Brinton ('of no value') y Goeje ('rien'), y hay que decidir entre los dos.
- busqueda: 'yamosa / yamoka'
  resultado: 0
  lectura: >-
    los numerales taínos no están en Bachiller. Siguen colgando de Las Casas
    *Apologética* cap. 204, que el repo NO tiene.
- busqueda: 'abba / hequeti / heketi'
  resultado: 0
  lectura: ídem — y el 1 taíno es el caso más caro que queda abierto.
- busqueda: 'acoa, aduri, agari, akcicyaa, thigisi, wacusi, wagulo'
  resultado: 0 (las siete)
  lectura: >-
    las siete reconstruidas por este proyecto desde el lokono. Dos
    vocabularios antillanos independientes (Goeje y Bachiller) y ninguno las
    tiene. **No son taínas.**

# ══════════════════════════════════════════════════════════════════════
# 6. PROPUESTA (regla 5)
# ══════════════════════════════════════════════════════════════════════
propuesta:
  para_miguel:
  - id: b1
    asunto: '`taita` — degradar'
    evidencia: >-
      Bachiller la pone en su apéndice de voces que pasan por indígenas y vienen
      de fuera (p. 394), corrige a Pichardo —que es la única autoridad detrás
      de nuestra entrada, vía Brinton— y propone el vascuence `aita`. Goeje: 0
      ocurrencias.
    opciones: >-
      (A) sacarla de `taíno` y archivarla en `FUERA_DEL_HABLA` con la nota;
      (B) reetiquetarla `sin-clasificar` con `deuda: sin-procedencia`;
      (C) dejarla y anotar.
    recomendacion_del_minador: 'A o B. Regla 2: en duda, degradar.'
  - id: b2
    asunto: '`cohiba` / `tabako` — la pareja está al revés'
    evidencia: 'Brinton, Goeje y Bachiller, independientes, dicen que `cohiba` es la planta y `tabako` el instrumento.'
    opciones: '(A) corregir las dos glosas con las tres citas; (B) anotar y esperar; (C) nada.'
    recomendacion_del_minador: A.
  - id: b3
    asunto: '`guabina` — sube de «sin cita» a «Las Casas, libro por localizar»'
    evidencia: 'Bachiller p. 267: Las Casas enumera `guabinas` entre los peces de nombre indio.'
    opciones: '(A) anotar la cita indirecta y abrir la tarea de localizar el pasaje; (B) esperar a tenerlo.'
  - id: b4
    asunto: 'variedad por voz — lo que SÍ se puede poner ya'
    evidencia: >-
      del apéndice (A) y del cuerpo salen asignaciones de isla o variedad para
      `cayo` (yucaya/lucaya, apoyada dos veces), `hutia` (Lucayas), `tuna`
      (Cuba), `bejique` (Cuba y Lucayas), `bohio` (Cuba), `maisi` (Cuba),
      `cacique` (Cuba), `caiman` (Cuba), `nucay` (Cuba y Lucayas).
    opciones: >-
      (A) añadir un campo `variedad` a esas entradas del lexicón con su cita;
      (B) dejarlo en la lista maestra y no tocar el lexicón hasta tener
      Granberry.
    recomendacion_del_minador: >-
      B. La asignación por una lista del XIX que copia a Rafinesque no es
      Granberry; vale para saber qué pedirle, no para etiquetar el canon.
  - id: b5
    asunto: '`maboya`, `piragua` y `huracan` — el bloque eyeri'
    evidencia: >-
      las tres aparecen en la lista EYERI de Rafinesque, no en la taína. Para
      `maboya` y `piragua` coincide con Goeje, que es independiente; para
      `huracan` **no** coincide (Goeje la da taína), y la atribución al eyeri
      sale precisamente de Rafinesque.
    opciones: >-
      (A) mover `maboya` y `piragua` a `kalinago` y dejar `huracan` en taíno
      con nota; (B) marcar las tres `esfera-indecidible`; (C) no tocar nada.
    recomendacion_del_minador: >-
      A, y con el matiz dicho: dos fuentes independientes contra `maboya` y
      `piragua`, y una sola —y sospechosa— contra `huracan`.
  lo_que_este_archivo_NO_propone: >-
    ni un cognado nuevo, ni una entrada nueva, ni una re-etiqueta aplicada.
    Todo lo de arriba es propuesta.

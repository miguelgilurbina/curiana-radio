meta:
  obra_id_propuesto: bachiller-morales-1883
  autor: Bachiller y Morales, Antonio
  anio: 1883
  campana: taino2-2026-09-22
  parcela: T10
  advertencia: >-
    ESTO NO ES CAQUETÍO y NO es fuente primaria del taíno. Bachiller es un
    erudito cubano de 1883 que reúne a los cronistas, a los viajeros y a los
    aficionados de su siglo, y **discute** lo que reúne. Su valor para esta
    parcela no es que añada voces: es que dice de quién sale cada una y
    **corrige a quien se equivoca**, incluido Rafinesque, que es la raíz
    envenenada de la tradición.

  descarga:

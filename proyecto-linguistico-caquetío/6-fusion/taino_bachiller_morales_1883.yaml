    salida: fuentes_caquetios/Bachiller_Morales_1883_Cuba_Primitiva.txt
    bytes: 927988
    calidad: >-
      OCR de archive.org sin corregir sobre una impresión habanera de 1883.
      Falla en `c`/`e` (`easique` por `casique`, `cerní` por `cemí`), en
      `R`/`B` (`Bafinesque` por `Rafinesque`, `Eojas` por `Rojas`), y
      **desordena las secciones a dos columnas**: la 3ª y los apéndices salen

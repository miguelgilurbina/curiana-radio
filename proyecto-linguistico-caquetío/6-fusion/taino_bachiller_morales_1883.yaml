  variedad_o_isla: 'usadas EN EL ORINOCO, de origen antillano'
  campo: esfera
  en_el_lexicon: 'bixa · caiman · yuca — y `macana`, que tiene propuesta abierta'
  lectura: >-
    🔴 **LA ESFERA, DOCUMENTADA EN LA DIRECCIÓN QUE NOS IMPORTA.** Bachiller

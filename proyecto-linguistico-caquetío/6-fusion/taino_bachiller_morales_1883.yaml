  pagina_impresa: 210
  fuente_que_declara_el_autor: 'Irving, *Columbus* libro VI cap. 5; y Brett, *The Indian Tribes*'
  variedad_o_isla: Haití
  campo: materiales
  en_el_lexicon: 'no como taíno — el lexicón la tiene por el lado lokono'
  lectura: >-
    🔴 CIERRA EL PUNTO ABIERTO DEL INVENTARIO DE AYER, con Goeje (`T siba`) y
    con Pané (Bachiller p. 278: Guabonito dio a Guahagiona «las sibas y
    guaninos»). **`siba` es taína Y lokona, y la fuente lo dice de las dos a
    la vez.** No es un préstamo que haya que decidir: es patrimonio arahuaco
    compartido, documentado en 1883 en las dos orillas.
- forma_fuente: 'Konoko, conuco'
  glosa_fuente: >-
    «De la lengua taina sólo vemos estos rastros españolizando la pronunciación:
    **Konoko, conuco, que allí significa selva**; seeba, siba piedra; eweida,

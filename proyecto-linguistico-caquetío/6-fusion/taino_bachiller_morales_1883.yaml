    seccion_2_3: >-
      pp. 355-387, «Palabras usuales en Cuba de origen indio» — ⚠️ es el CUBANO
      MODERNO, no la lengua del XVI. Lo que sólo está aquí no es taíno
      atestiguado: es habla cubana del s. XIX con voz de origen indígena
    seccion_2_4: >-

  pagina_impresa: 210
  fuente_que_declara_el_autor: 'Herrera (para el areíto cristiano de Cuba)'
  variedad_o_isla: 'Antillas; `bátoco` en «algunas otras partes»'
  campo: [rito, transmision]
  en_el_lexicon: areito
  lectura: >-
    no añade atestación primaria —la de Oviedo, libro V cap. I, ya la tenemos—
    pero sí un **sinónimo de otra variedad**: `bátoco`. Y documenta el areíto
    cristiano, que es el género ya colonial: precontacto ≠ colonial (regla 3).
- forma_fuente: 'Gumilla trae otras palabras cubanas allí usadas'
  glosa_fuente: >-
    «bija ó bixa, embijado, macana, cabuya, jobo, caimán, yuca, papagayo,

# ══════════════════════════════════════════════════════════════════════
# 2. DESCARTES — agrupados por razón, como DESCARTES del módulo
#    «Descartado» = sin etimología despejable, NO «no existió»: un nombre
#    vivo es dato (Miguel, 2026-09-07). Referente entre paréntesis.
# ══════════════════════════════════════════════════════════════════════
descartes:

  sin_glosa:
    razon: >-
      Esteves da referente, a veces censo y forma documental, pero ninguna
      etimología; y ningún morfema del canon alinea sin forzar. Los formantes
      que se ven se anotan, sin subirlos.
    verificado: imagen salvo Arajó y Avotuca-Babahuro (p. 17-18, OCR limpio y p. 18 en imagen) y Guaricure (p. 42, 2026-09-16)
    formas:
      - {forma: arajó, pagina: 17, nota: 'cerro erosionado al suroeste de Moruy, lindero con Santa Ana; Esteves sospecha la llana «Arajo», pues las agudas escasean; homónimos en Sabaneta (Miranda) y Arajú (Federación); Arcaya 1920 ya lo nombra'}
      - {forma: avotuca, pagina: 18, nota: 'lugar desconocido; José Luis Cisneros (Descripción de la Provincia de Benezuela, 1764) lo da como vigía de las costas de Paraguaná; Esteves lo supone en La Boca del Caño, al norte de Adícora'}
      - {forma: bajarigua, pagina: 19, nota: 'fundo y salina al norte de El Vínculo, depresión a doce metros bajo el mar; -gua sin glosa'}
      - {forma: biniche, pagina: 23, nota: 'lindero de las tierras comuneras de Guacuira y Urupaguaduco'}
      - {forma: carajaima, pagina: 27, nota: 'ciénaga del caserío San Pedro (Adícora); papeles de 1698 (linderos de Urupaguaduco) la escriben Caramajaima; termina en -aima, afijo de REGLAS_ZAVALA sin glosa'}
      - {forma: cucurubano, pagina: 32, nota: 'lindero de Yauquiba y Guacujúa; «parece voz onomatopéyica»; termina en -bano pero no consta que sea cerro'}
      - {forma: cujicana, pagina: 32, nota: 'antiguo potrero de Carirubana, hoy zona residencial de Punto Fijo; -ana sin glosa (#109)'}
      - {forma: duracuaco, pagina: 37, nota: 'lugar del municipio Moruy, 3 casas y 20 vecinos en 1881; la cabecera impresa es DURACUACO y el índice escribe Duraguaco'}
      - {forma: guaricure, pagina: 42, nota: 'lugar del municipio Moruy, «no tenemos más noticias» (transcrito el 2026-09-16)'}
      - {forma: güima, pagina: 43, nota: 'vecindario de Charaima; nombre de un cacique albino de leyenda; los «montes de Güima» en el título de composición de Urupaguaduco'}
      - {forma: jabe, pagina: 44, nota: 'lugar desaparecido de Jadacaquiva, también San José de Tarbes; ver §mapa_vivo (Tabe)'}
      - {forma: juroguagua, pagina: 47, nota: 'lugar pecuario al este del cementerio de El Vínculo; la entrada sigue en la p. 49 (la p. 48 es una fotografía): Esteves remite a Jahn para un homónimo guajiro que en el texto de Jahn del repo da cero (ver medición)'}
      - {forma: manichare, pagina: 50, nota: 'lugar del municipio Moruy'}
      - {forma: matividiro, pagina: 51, nota: 'cerro de menos de 250 m y aldea (Buenavista); 37 casas y 286 vecinos en 1881; el cerro orienta a los pescadores de pargo'}
      - {forma: misaray, pagina: 52, nota: 'aldea de Santa Ana; deslinde de 1768 (Pedro de Llamas); «Masaray es la forma indígena»; cementerio y petroglifo en Machuruca/Misaray (ficha)'}
      - {forma: muaco, pagina: 54, nota: 'Caño del Muaco, albufera junto a Tacuato; el Río Muáco del mapa vivo es otro, en el Golfete continental'}
      - {forma: niraba, pagina: 54, nota: 'aldea de Moruy, 6 casas y 35 vecinos en 1881; ver §mapa_vivo (La Miraba)'}
      - {forma: perabay, pagina: 56, nota: 'lindero de Jadacaquiva, Pueblo Nuevo y Buenavista, cerca de Piedra Honda; -ay'}
      - {forma: pipiacoa, pagina: 56, nota: 'sabanas dentro del Vínculo de Curaidebo; «leemos en un documento de 1596» — la fecha documental más antigua del lote después del Cocodito de 1590; -coa sin glosa'}
      - {forma: quipayú, pagina: 57, nota: 'cuevas naturales en La Cieneguita, cerca de Punta Salinas (Los Taques)'}
      - {forma: saguatumo, pagina: 58, nota: 'lugar de Moruy, 2 casas y 8 vecinos en 1881; «el nombre es antiquísimo»'}
      - {forma: sarabón, pagina: 58, nota: 'punto costeño al norte de Punta Cardón, atalaya de pescadores'}
      - {forma: sarinao, pagina: 60, nota: 'aldea de Santa Ana, 20 casas y 157 habitantes en 1881; primitivo Sarinaro (la misma erosión -aro > -ao que Guaranaro > Guaranao)'}
      - {forma: siraba, pagina: 60, nota: 'cerro cónico de unos 500 m unido al de Santa Ana; petroglifos «Las Piedras del Almanaque»'}
      - {forma: supideo, pagina: 61, nota: 'lugar de Moruy; cf. «arboleda supide» en la glosa de Zavala para supí, sin que Esteves lo diga'}
      - {forma: tacuato, pagina: 62, nota: 'población de Santa Ana, 37 casas y 237 vecinos en 1881; iglesia en 1773, «Tocato escribe Martí»; ver lecturas'}
      - {forma: tiraya, pagina: 63, nota: 'ensenada al norte de Adícora; Taria y Taría en los papeles de Urupaguaduco'}
      - {forma: tobagía, pagina: 64, nota: 'lindero occidental de Pueblo Nuevo con Guaidabacoa y Chibuche'}
      - {forma: yaguarima, pagina: 67, nota: 'punto costeño del Golfete al este de Punta Cardón; termina en -ima, que Esteves glosa «húmedo» en la p. 93 sin aplicarlo aquí'}
      - {forma: yaima, pagina: 67, nota: 'bahía de aguas profundas al norte de Adícora, puerto colonial de la sal de Las Cumaraguas'}
      - {forma: yarí, pagina: 67, nota: 'sitio en la sabana de Barabara y otro en Santa Ana; Yaride, el primitivo'}
    lecturas:
      - {forma: tacuato, tipo: etimologia-popular, lectura: '«Ta a cuatro»: el precio de la sal, cuatro reales el almud', quien: informantes de Esteves, veredicto: 'Esteves se declara en desacuerdo y a la vez concede «visos de verosimilitud» por el Resguardo de Salinas colonial: se registra la ambigüedad'}

  no_indigena_segun_esteves:
    razon: >-
      El propio Esteves dice que el nombre no es indígena, o lo da por
      castellano, híbrido o transplantado. Se registran aparte (filtro 1 del
      habla paraguanera), no se descartan en silencio.
    formas:
      - {forma: antuní, pagina: 16, clase: castellano, nota: 'del apellido Antúnez «con pronunciación francesa o catalana»; copla de las datas y las vainas de cují'}
      - {forma: barbasco, pagina: 22, clase: castellano, nota: 'nombre común de plantas usadas para embarbascar en la pesca'}
      - {forma: bucuruy, pagina: 24, clase: castellano, nota: 'de buco, «muy español el vocablo», compuerta de regadío; malecones de 1740'}
      - {forma: camoruco, pagina: 26, clase: transplantado, nota: 'antes Semeruco (Malpighia); el camoruco «no existe en la flora autóctona de Paraguaná»'}
      - {forma: capacherúa, pagina: 26, clase: castellano, nota: 'el índice escribe Capacheruda, que es la etimología de Esteves («algo con aspecto de capacho»), no el nombre'}
      - {forma: cimiro, pagina: 30, clase: no-indigena, nota: 'cerro, lindero en Moruy; «No parece voz indígena»'}
      - {forma: garrapata, pagina: 38, clase: castellano, nota: 'cerro aislado del [ramal del] Cerro Atravesado (Santa Ana); «No parece vo[z indígen]a»'}
      - {forma: peticuare, pagina: 56, clase: hibrido, nota: '«voz indígena adulterada con una raíz afrancesada: peti, petit»; -cuare como Pachacuare y Maicuare'}
      - {forma: quitaire, pagina: 57, clase: no-indigena, nota: 'al este del Taparo (Santa Ana); «No parece voz indígena»'}
      - {forma: quiyegua, pagina: 57, clase: hibrido, nota: '«Piedra y Yegua» (ya medido en la campaña -gua)'}
      - {forma: sanquinche, pagina: 58, clase: castellano, nota: 'Quinche, hipocorístico de Joaquín; leyenda moderna del espanto de los arrieros'}
      - {forma: suriquiba, pagina: 61, clase: hibrido, nota: '«voz híbrida que dice: la Piedra del Sur»; el índice escribe Suriquiva, la cabecera SURIQUIBA'}

  estrato_no_caquetio_sin_glosa:
    razon: 'Esteves atribuye el nombre a otra lengua sin dar glosa. El estrato es lectura suya (skill §5), no dato.'
    formas:
      - {forma: cuara, pagina: 32, estrato: 'ayamán (según Esteves)', nota: 'ensenada de la ribera norte del Golfete (Santa Ana); homónimos en Aragua, Quíbor, Siquisique, Aroa'}
      - {forma: nonocoti, pagina: 55, estrato: 'timote-cuica (según Esteves: «no hay dudas»)', nota: 'tierras comuneras entre Los Taques y Moruy; la etimología jocosa «el abuelo Coty» (Guillermo Cossi) se registra como popular y rechazada'}
      - {forma: tumatey, pagina: 64, estrato: 'taíno (según Esteves)', nota: 'ensenada de la costa oriental cerca del Cabo de San Román; la entrada sigue en la p. 66, tras la foto de la p. 65: pescadores arubianos y tortugas (ver §correcciones y §fauna); -ey como Elegüey y Maragüey (B.6: fonética, no filiación)'}

# ══════════════════════════════════════════════════════════════════════
# 3. CORRECCIONES — a lo que ya está en el repo, con su prueba
# ══════════════════════════════════════════════════════════════════════
correcciones:
  - que: 'El topónimo «perdido» entre Tumatey y Tutubacoa NO existe'
    donde: 'toponimos_esteves_indice.yaml (cabecera) y 4-fuentes/sesiones/06_esteves_1989_barrido_lote3.md l. 323'
    prueba: >-
      La p. 64 cierra con TUMATEY; la p. 65 es una fotografía a página entera
      (Cerro Santa Ana, sin número de pie); la p. 66 abre con la cola de la
      misma entrada («La voz es taína…») y sigue con TURA. El barrido
      automático tomó la cola por una entrada sin cabecera y conjeturó
      «TUCACAS o similar». Vistas las tres páginas en imagen.
  - que: 'Carirubana: la glosa es de Esteves p. 28, no etimología popular'
    donde: 'toponimo-148 (lexicon_toponimos.py, NIVEL_B)'
    prueba: >-
      La p. 28 imprime «Carirubana significa: orilla del peñón, la orilla del
      cerro. Cari: orilla. Bana: sitio alto.» El canon la tiene sin
      glosa_fuente ni página y cuelga la misma frase como lectura de
      «divulgación local» con el veredicto «corroboración independiente de
      bana». No es independiente: la divulgación copia a Esteves (minar-fuente
      §8). Propuesta: glosa_fuente y pagina 28; el veredicto de la lectura
      pasa a «copia de Esteves». B se mantiene por la -ru-.
  - que: 'Acaboa y Aguaque sí tienen etimología en Esteves'
    donde: 'toponimo-153 y 154 (DESCARTES, grupo «Dictado de Miguel 2026-09-10»)'
    prueba: 'pp. 12 y 14 en imagen (ver §entradas). La razón del grupo («ningún paréntesis etimológico») no vale para estas dos.'
  - que: 'cumaragua en Arcaya es «viruela», no «ciruela»'
    donde: 'curiana_lexicon.py, notas de `kumarawa` (la lectura descartada por D10)'
    prueba: >-
      La nota cita a Arcaya 1920 como «mene y cumaragua nombre de la
      ciruela». La página (impresa 75, pdf 83) dice, vista en imagen: «mene y
      cumaragua (nombres de la viruela)». Una voz caquetía para una
      enfermedad que llegó con los europeos es dato de CONTACTO, y la
      Relación de Barquisimeto es de 1579 (regla 3). Qué hace el canon con
      eso lo decide Miguel; aquí sólo se corrige la cita.
  - que: 'Chunaure: la cita entrecomillada no está en Esteves'
    donde: '6-fusion/tura_la_tesis_de_miguel.yaml §y_la_cadena_se_cierra_con_el_caquetio'
    prueba: >-
      El archivo atribuye a Esteves «voz CAQUETÍA, jojota, mazorca tierna de
      maíz» como glosa de CHUNAURE. La p. 37 dice que Chunaure es un apellido
      indígena y da aparte «naure» 'jojoto' «en lengua caquetía». El eslabón
      tura ~ chunaure sigue en pie por la otra fuente (Fundación Polar) y por
      el `chunare` de Zavala, pero no con esa cita.
  - que: 'urupagua: la página de Urupaguaduco es la 66'
    donde: 'curiana_lexicon.py, notas de `urupagua` («p. 71»)'
    prueba: 'p. 66 en imagen.'
  - que: 'La cola del índice estaba desfasada'
    donde: '6-fusion/toponimos_esteves_indice.yaml'
    prueba: >-
      Acaboa, Aguaque y Carirubana seguían en por_procesar y están en el
      canon desde el lote 6 (toponimo-153, 154, 148). Se pasan a
      ya_registrados en este mismo PR y el meta se recuenta con el script.
  - que: 'Tres cabeceras impresas difieren del índice'
    donde: '6-fusion/toponimos_esteves_indice.yaml'
    prueba: 'Buchaquiba → BUCHAQUIVA (p. 24); Duraguaco → DURACUACO (p. 37); Suriquiva → SURIQUIBA (p. 61); y Capacheruda es la etimología, la cabecera es CAPACHERUA (p. 26). Al fusionar manda la cabecera; la del índice va en observación.'
  - que: 'curarí (toponimo-180) tiene fuente: es la glosa de Alvarado'
    donde: 'toponimo-180, sin procedencia'
    prueba: 'Alvarado 1921 p. 105 (capa de texto): «CURARÍ. Árbol de la región occidental (Barquisimeto, Zulia), propio para la construcción civil» — es la glosa_fuente del canon palabra por palabra. procedencia: alvarado-1921, pagina 105.'
  - que: 'El A de Judibana (y el de otros) descansa en Zavala (E), que es Esteves'
    donde: 'toponimo-075 y, en general, el criterio A/B del módulo'
    prueba: >-
      La skill pone Judibana de ejemplo de A: «judi + bana, Esteves y
      Zavala». `juri` en el lexicón es Zavala #178 con sigla (E) sola. La
      medición cuenta cuántas voces caquetías atestiguadas del lexicón no
      tienen más cita que Zavala (E); cuántos niveles del canon cambiarían
      es otra medición, que este lote no hizo: se deja como pregunta en el
      issue.
  - que: 'Coabana: la imprenta dice «cosas»'
    donde: 'toponimo-116, glosa_fuente'
    prueba: 'La p. 31 imprime «el cerro de las cosas»; el canon cita «el cerro de las coas» entre comillas. Es una errata evidente, pero una cita corregida en silencio deja de ser cita: añadir [sic].'

# ══════════════════════════════════════════════════════════════════════
# 4. EL MAPA VIVO — lo que el cruce con Esteves resuelve y lo que mide mal
# ══════════════════════════════════════════════════════════════════════
mapa_vivo:
  identificaciones_candidatas:
    nota: 'Descartados del canon que entraron por OSM «sin fuente» y que tienen candidato en Esteves. Todas fuera de las permutaciones documentadas o con distancia al límite: a revisar, no cuentan como encontradas.'
    casos:
      - {canon: toponimo-132, osm: 'Cumairebo, 12.003 -69.920', esteves: 'Curaidebo (p. 35), «entre Pueblo Nuevo y El Vínculo»', por_que: 'posición exacta entre las dos poblaciones que Esteves nombra; r~m; comparten -ebo'}
      - {canon: toponimo-138, osm: 'La Miraba 11.834 -70.054 y Cerro La Miraba', esteves: 'Niraba (p. 54), aldea de Moruy', por_que: 'en el municipio Moruy; n~m con artículo castellano delante'}
      - {canon: toponimo-135, osm: 'Tabe, 11.917 -70.104', esteves: 'Jabe o San José de Tarbes (p. 44), lugar desaparecido de Jadacaquiva', por_que: 'a unos dos kilómetros de Jadacaquiva; Tarbes > Tabe o Jabe > Tabe'}
      - {canon: toponimo-176, osm: 'Coduto 11.817 -70.213 y Coduto / Punta Coduto (Médanos)', esteves: 'Coduto (p. 31), los dos lugares', por_que: 'caduto (dictado) ~ Coduto, a~o; ver §entradas'}
  lo_que_barrer_mapa_mide_mal:
    que: >-
      `barrer_mapa.py --lote` (regenerado hoy) sigue diciendo que Paraguaná
      tiene nombres «nuevos, en ninguna fuente» y aproximados «a revisar». Los
      nuevos (Azaro, Bajo Aroa, Cividual, Guaquira Abajo y Arriba, Nueva
      Jayama, Teteguacure, Villa Real) están TODOS en el canon desde el lote 7
      bajo la forma de Esteves (Asaro, Bajabaroa, Sibidigual, Guacuira,
      Jayana/Guarama, Tequeguacare) o como descartado castellano (Villa Real):
      el script cruza por forma y las entradas del canon guardan la forma viva
      sólo en `observacion`. Y dos aproximados salen MAL asignados desde que
      `capana` (toponimo-156, Parte II) entró al canon: «Cerro Capuana» y
      «Cuabana» caen en capana en vez de en Capuhana y Coabana.
    propuesta: >-
      Que el canon guarde la forma viva en un campo propio (p. ej.
      `forma_viva:` con la coordenada) y que barrer_mapa.py lo lea antes del
      aproximado. Es cambio de curiana_sim/: lo decide Miguel.

# ══════════════════════════════════════════════════════════════════════
# 5. A LA COLA — nombres que traen otras parcelas (coordinador, 2026-09-23)
# ══════════════════════════════════════════════════════════════════════
cola_nueva:
  - forma: Sarasaragua
    fuente: castellanos-elegias
    donde: 'p. 201 según la parcela de Castellanos; línea 52537 del texto de 1857 del repo'
    que_dice: '«Guiábalos ya gente caquetía / Del pueblo que se diz Sarasaragua» — el regreso de Federmann a Coro (abril de 1531)'
    nota: 'Pueblo caquetío de la ruta de Federmann, no de Paraguaná: regla 4, su región la decide asentamientos.yaml. -gua sin glosa. Cero en Esteves y en el mapa vivo (mesa y OSM, con permutaciones).'
  - forma: Norupara
    fuente: castellanos-elegias
    nota: 'Lo trae la parcela de Castellanos; en el texto de 1857 del repo da cero con «norup» y «nurupa». Queda en la cola con la página que dé esa parcela.'
  - forma: Coriana
    fuente: castellanos-elegias
    nota: >-
      No es nombre nuevo: la parcela de Castellanos (PR #207) sitúa el único
      «Coriana» de las Elegías en La Ramada, en la lista «Dos Guaymaros,
      Debuya, Coriana, / Tapi, Paraguanil, Biriburare» (línea 69383 del texto
      de 1857), y toponimo-111 lo pone en Punta Espada. Se deja aquí porque
      «Paraguanil» es el topónimo de esa lista que más se parece a los de la
      mesa: no es Paraguaná (regla 4).
  - forma: Miraca
    fuente: 'Federmann 1530 (PR #210)'
    nota: 'toponimo-095 gana una atestación ocho años anterior a la carta de Bastidas de 1538. Para la cadena de formas fechadas en su observación.'

# ══════════════════════════════════════════════════════════════════════
# 6. FAUNA — el esquema común del preámbulo. Un topónimo con nombre de
#    animal es de lo poco que conserva el nombre indígena de un animal.
#    Incluye los animales de topónimos de Esteves que YA están en el canon.
# ══════════════════════════════════════════════════════════════════════
fauna:
  - nombre_en_fuente: Dara
    especie_probable: 'Burhinus bistriatus (por el nombre venezolano «alcaraván»; Esteves escribe «Charadius»)'
    texto: '«Dara, ave vocinglera de estas sabanas, conocida… con el nombre de Alcaraván»'
    obra: esteves-1989
    pagina_impresa: 12
    lugar: Punta de Adaro, costa occidental de Paraguaná
    epoca: moderno
    sonido: '«la voz onomatopéyica de la estridente dara… una ave corredora muy ruidosa» (p. 27, Caradacagua)'
    toponimos: [adaro, caradacagua, 'adaure (toponimo-080)']
  - nombre_en_fuente: Chaure / Cegue
    especie_probable: null
    texto: '«pequeña [l]echuza que para anidar hace cuevas en terrenos arenosos»'
    obra: esteves-1989
    pagina_impresa: 36
    lugar: puerto de Chaure, costa norte de Paraguaná
    epoca: moderno
    sonido: 'Alvarado p. 116 cita un verso: los carrizos «pitan cual de los chaures los nocturnos dejos»; y la locución «cantó un chaure», que se dice de quien anuncia algo fatídico'
    nota: >-
      Especie en conflicto, por eso null: la cueva en la arena apunta a la
      lechuza de hoyo (Athene cunicularia) — inferencia del escriba; Alvarado
      dice Strix flammea (la lechuza de campanario, Tyto alba).
  - nombre_en_fuente: Chuchube
    especie_probable: 'Mimus gilvus (la identificación que el lexicón ya da vía van Buurt y Medina)'
    texto: '«la paraulata chulinga, pájaro de canto melodioso»'
    obra: esteves-1989
    pagina_impresa: 36
    lugar: El Balsamar (Pueblo Nuevo)
    epoca: moderno
    sonido: '«pájaro de canto melodioso»'
  - nombre_en_fuente: Guacoa
    especie_probable: 'Patagioenas corensis (Esteves «columba corensi»; Alvarado p. 143 «Columba corensis y C. speciosa»)'
    texto: '«la columba corensi, paloma… con plumones blancos en la punta de las alas»'
    obra: esteves-1989
    pagina_impresa: 12
    lugar: Acaboa (Jadacaquiva); también Guacuira, Guacurebo y Guacujúa
    epoca: moderno
    sonido: 'Alvarado p. 143: las formas caribes del nombre (calínago uahikua, cumanagoto huakúa) «imitan… el canto de esta ave»: el nombre ES la onomatopeya'
    nota: 'Alvarado deriva guacoa del caribe y la cruza con «Bacóa, nombre geográfico usado en Coro»: lectura suya sobre -bacoa, a revisar contra morfema-001.'
    toponimos: ['acaboa (toponimo-153)', 'guacuira (toponimo-117)', 'guacurebo (toponimo-021)', 'guacujúa (toponimo-128)']
  - nombre_en_fuente: Guache
    especie_probable: null
    texto: '«"Guache": zorro»'
    obra: esteves-1989
    pagina_impresa: 39
    lugar: quebrada de Guachaco, al norte de Buenavista
    epoca: moderno
    sonido: null
    nota: 'Conflicto: Alvarado p. 145 GUACHE = Nasua (coatí), «del galibi»; Zavala #125 ''murciélago, zorro blanco''.'
  - nombre_en_fuente: Guara (cunareja)
    especie_probable: null
    texto: 'guar[a], «en caquetío», la cunareja, mayor que el zamuro, de occipucio rojo'
    obra: esteves-1989
    pagina_impresa: 42
    lugar: Guaruguaja (El Vínculo) y Guaraguaro (Jadacaquiva)

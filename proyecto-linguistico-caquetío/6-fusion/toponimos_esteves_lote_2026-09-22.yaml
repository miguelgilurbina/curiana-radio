# ─────────────────────────────────────────────────────────────────────────
# PROPUESTA — la cola de Esteves 1989 (Parte I, Paraguaná), leída entera
# Tercera campaña de minería, parcela M6 (2026-09-22/23)
#
# Regla 5: esto PROPONE. No toca curiana_sim/lexicon_toponimos.py ni
# 2-lengua/toponimos.yaml (GENERADO: se edita el módulo y se regenera — la
# trampa de CLAUDE.md). Al fusionar: campana-toponimos §6-7. Los ids NO se
# asignan aquí: hay varias parcelas proponiendo topónimos a la vez y el
# siguiente libre lo toma quien fusiona.
#
# Regla 1: ninguna cifra en este archivo. Los recuentos (por nivel, por
# filiación, por formante, fauna, cruces con el mapa y con el lexicón) los
# escribe 6-fusion/scripts/medir_lote_esteves_2026-09-22.py en
# 6-fusion/medicion_lote_esteves_2026-09-22.yaml.
#
# Copyright: Esteves 1989 es obra moderna. Las citas van recortadas (menos de
# quince palabras) y el resto parafraseado; la página impresa lleva al texto.
# ─────────────────────────────────────────────────────────────────────────
meta:
  recogido: '2026-09-23'
  estado: sin-fusionar
  obra: esteves-1989
  quien: escriba (Claude), parcela M6 de la tercera campaña de minería
  lote:
    criterio: >-
      La cola ENTERA de la Parte I (`toponimos_esteves_indice.yaml`,
      por_procesar), porque la campaña propone y no fusiona: cada entrada se
      leyó en el cuerpo del libro, casi todas en la IMAGEN (campo
      `verificado`), y se deja lista para que el fusionador la pase al módulo
      por tandas. Las glosadas van una a una (§entradas); las sin glosa y las
      que Esteves declara no indígenas van en grupos por razón (§descartes),
      como en DESCARTES del módulo.
    paginas: 'pp. 11-67 (tomos 1-3; desfase pdf→impresa +6/+25/+55, comprobado en el pie de cada página vista)'
  como_se_leyo: >-
    OCR local (`Esteves_1989_..._N.ocr.txt`) para llegar a la página; la
    cita se sacó de la página renderizada con pymupdf (105-400 dpi). Tres
    páginas del tomo 2 NO son texto: p. 42 (escaneada boca abajo, ya
    transcrita en `esteves_paginas_releidas_2026-09-16.yaml`), p. 48 y p. 65
    (fotografías a página entera). Alvarado 1921, Arcaya 1920 y Jahn 1927 se
    consultaron por su capa de texto (pdftotext); la cita de Arcaya que
    decide algo (cumaragua) se vio en imagen.
  regla_de_niveles_aplicada: >-
    La de la skill, con UNA precisión que este lote obliga a escribir: una
    voz del lexicón cuya única cita es Zavala con sigla (E) NO es atestación
    independiente de un topónimo de Esteves, porque (E) ES Esteves (Zavala p.
    64: «E = Juan Esteves»). Es control de transmisión (minar-fuente §8).
    Por eso: A = Esteves glosa, y cada pieza está en OTRA fuente (Zavala con
    sigla distinta de E, Alvarado, Medina, van Buurt, Oliver, Arcaya, Oviedo)
    con glosa compatible, sin residuo. B = como A pero con un residuo
    (alteración, epéntesis), o bien una pieza independiente más otra sólo de
    Esteves pero recurrente ≥ 2 con la misma glosa, tolerando una consonante
    de enlace — que es exactamente lo que el canon ya hizo con Buchuhaco
    (buche + aco, con h intercalada) y Abudure (dabuda + ure). C = media
    ecuación glosada por la fuente, ninguna pieza independiente, glosas en
    conflicto, o etimología en otra lengua según Esteves. Afijos que parecen
    atestiguados y NO lo son fuera de Esteves: `-uco/-uto` (REGLAS_ZAVALA lo
    cita como Zavala #268 (E)), `ure`, `ebo`, `aco`, `-dito`, `juri`, `cari`,
    `tuba`, `rao`: recurrentes, pero de una sola mano. Fitónimo o zoónimo sin componer: A si la voz está en
    otra fuente con la misma cosa (precedente Bisure), C si sólo la da Esteves
    (precedente Caseto). Un formante que reconocemos NOSOTROS y Esteves no
    glosa no sube a C: se anota en la observación del descarte.
  # Para que el script cruce con el índice: cabecera impresa ≠ forma del
  # índice, y la entrada de la cola que sólo se corrige (ya en el canon).
  indice_vs_cabecera: {buchaquiba: buchaquiva, duraguaco: duracuaco, suriquiva: suriquiba, capacheruda: capacherúa}
  cubiertas_en_correcciones: [carirubana]
  formantes_de_la_consigna: >-
    Los que el encargo pidió seguir (-bana, -coa/-bakoa, -wa [gua-], -ana,
    -ubana, -uru, -ey/-ay, -kiva, ja-) se anotan en `formantes` de cada
    entrada tal como la forma los muestra, y el script los cuenta con y sin
    glosa de la fuente. `-wa`/`-gua` va SIN GLOSA en todo el lote, por la
    decisión de Miguel sobre Oliver p. 148: donde Esteves glosa una forma en
    -gua, la glosa es de la raíz entera (planta, animal) o parte por otro
    sitio, como ya midió `propuesta_gua_procedencia_2026-09-21.yaml`.

# ══════════════════════════════════════════════════════════════════════
# 1. LAS ENTRADAS CON GLOSA — una por nombre, con los campos del módulo
# ══════════════════════════════════════════════════════════════════════
entradas:

  # ── A: la ecuación cierra con piezas atestiguadas fuera de Esteves ──
  - forma: barabara
    pagina: 19
    verificado: imagen
    nivel: A
    referente: ciénaga al sur de El Hato (Adícora), donde desagua la quebrada de Michaco
    glosa_fuente: '«Barabara, plural por duplicación, es el nombre de un árbol caparidáceo» (olivo)'
    segmentacion: bara + bara (reduplicación)
    voces: [bara, barabara]
    formantes: [reduplicacion]
    razon: >-
      Esteves toma la glosa de Alvarado y lo dice; el lexicón la tiene por
      Zavala #30 con sigla (A), no (E). Fitónimo reduplicado, sin residuo.
      Esteves llama a la reduplicación «plural»: es el cuarto caso suyo, y el
      conflicto con la lectura de intensidad sigue abierto (ficha, §4).
    observacion: >-
      Hay otra Barabara en el Distrito Zamora, junto a Píritu, pueblo que el
      obispo Martí visitó en 1773 y que desapareció por el paludismo (Parte II,
      fuera de la polity costera: regla 4).

  - forma: barisigua
    pagina: 23
    verificado: imagen
    nivel: A
    referente: punto costeño de la ribera norte del Golfete de Coro
    formas_antiguas: ['Punta de Barisigüita (mapa del brigadier Joaquín Fidalgo)']
    glosa_fuente: '«La barisigua es un árbol corpulento… Es una eritrina.»'
    segmentacion: barisigua (fitónimo sin componer)
    voces: [barisigua]
    formantes: [gua]
    razon: >-
      El árbol está en otras tres fuentes (Alvarado p. 23, Medina, Oliver p.
      142 «bari-si-gua»): la ecuación cierra como fitónimo. La partición
      propia de Esteves (bari + sigua 'palo blando') va a lecturas: su pieza
      `sigua` sólo tiene a Zavala #227 (E).
    lecturas:
      - {tipo: segmentacion-de-autor, lectura: '«Bari —sigua: palo blando; bara; árbol. Sigua: blando»', quien: Esteves, eje: significado, veredicto: 'deja el -gua dentro de sigua (campaña -gua); sigua sin atestación independiente'}

  - forma: buchaquiva
    cabecera: BUCHAQUIVA
    pagina: 24
    verificado: imagen
    nivel: A
    referente: lugar al norte de Jadacaquiva
    glosa_fuente: '«la piedra del buche. Buche: melocacto. Quiva: pedruzco.»'
    segmentacion: buche + kiba
    voces: [buche, kiba]
    formantes: [kiva]
    razon: >-
      `buche` es Zavala #45 (AM+E) y `kiba` 'piedra' es Zavala #92 (PMA), la
      grafía k de Arcaya; los dos fuera de Esteves. Núcleo al final, como en
      sus -bana. Es el caso que confirma lo que dijo el agente del cruce
      taíno: `-kiva` en composición es `kiba` 'piedra' (ver §formantes).
    observacion: 'El índice escribe Buchaquiba y la cabecera BUCHAQUIVA: el nombre del lote es el de la cabecera.'

  - forma: cayude
    pagina: 30
    verificado: 'imagen (2026-09-16, esteves_paginas_releidas)'
    nivel: A
    referente: fundo pecuario al oeste de Tacuato (Santa Ana) y quebrada homónima que desagua en el Golfete
    glosa_fuente: '«Cayude: árbol frutal, [guanábano silvestre], turagua.»'
    segmentacion: cayude (fitónimo sin componer)
    voces: [cayude]
    razon: >-
      La relectura del 09-16 lo dejó en C porque el lexicón sólo lo tenía por
      Zavala #73 (E). Pero Alvarado p. 75 lo registra aparte —«CAYÚDE. Anona
      palustris»—, que es la misma cosa: atestación independiente. Sube a A.
    observacion: 'Sitio de la era 2 (casa de los Cayudes). Nombre vivo: El Cayude.'

  - forma: chaure
    pagina: 36
    verificado: imagen
    nivel: A
    referente: puerto natural al oeste del Cabo de San Román y al este de Punta Macoya (Jadacaquiva)
    glosa_fuente: '«Chaure es otro nombre indígena que dan al Cegue, pequeña [l]echuza»'
    segmentacion: chaure (zoónimo sin componer)
    voces: [chaure, cegue]
    razon: >-
      `chaure` es Zavala #81 (HB+E) y Alvarado p. 116 («CHÁURE. Strix
      flammea. Lechuza»): dos fuentes fuera de Esteves. Zoónimo, sin residuo.
    observacion: >-
      Esteves describe una lechuza que anida en cuevas de terreno arenoso, lo
      que no es la lechuza de campanario que Alvarado identifica: el ave queda
      en duda (ver §fauna), la voz no. Otro sitio costero llamado Chaure en
      el oriente del país, según Esteves.

  - forma: chuchube
    pagina: 36
    verificado: imagen
    nivel: A
    referente: lugar pecuario en el caserío El Balsamar (Pueblo Nuevo)
    glosa_fuente: '«es la paraulata chulinga, pájaro de canto melodioso.»'
    segmentacion: chuchube (zoónimo sin componer)
    voces: [chuchube]
    razon: >-
      Zavala #85 (HB), Gatschet «shushubi», van Buurt «chuchubi» y Medina p.
      74: la voz mejor atestiguada del lote. Zoónimo, sin residuo.

  - forma: cucuy
    pagina: 32
    verificado: imagen
    nivel: A
    referente: Punta de Cocuy (Cucuy), costa occidental, al norte de Punta Salinas
    formas_antiguas: ['Punta de Cocuy (mapa del brigadier Joaquín Fidalgo)']
    glosa_fuente: 'planta rizomosa que, cocida, «da un vino agradable y una harina comestible»'
    segmentacion: cocuy (fitónimo sin componer)
    voces: [kokuy]
    razon: 'kokuy es Zavala #87 (HB+CGB+A). Fitónimo sin residuo. Voz panvenezolana: no prueba filiación, sólo la ecuación.'

  - forma: guachaco
    pagina: 39
    verificado: imagen
    nivel: A
    referente: quebrada al norte de Buenavista y tierras comuneras del mismo nombre
    glosa_fuente: '«los dos zorros. "Guache": zorro; Aco: dos, par.»'
    segmentacion: guache + aco
    voces: [guache, aco]
    formantes: [aco]
    razon: >-
      `guache` (Zavala #125, E+AM) y `aco` (Zavala #4, E+AM): las dos con
      sigla AM además de E. Es la tercera vez que Esteves glosa `aco` 'dos'
      (Buchuhaco, Michaco): con Guachaco, Buchuhaco (hoy B por `aco`
      «nuevo») podría subir.
    observacion: >-
      ⚠️ El animal no es seguro: Alvarado p. 145 da GUACHE = Nasua (coatí) y
      la saca «del galibi», o sea caribe; Zavala dice 'murciélago, zorro
      blanco'. Ver §fauna. Medina ∩ Esteves en la mesa.

  - forma: isiro
    pagina: 44
    verificado: imagen
    nivel: A
    referente: fundo pecuario al norte de Jadacaquiva, con el caserío Isirito al lado
    censo_1881: 3 casas, 24 vecinos
    glosa_fuente: '«Isiro: árbol corpulento, sapindáceo.»'
    segmentacion: isiro (fitónimo sin componer)
    voces: [isiro]
    razon: 'Zavala #167 (A) y Alvarado p. 176 «Árbol de construcción de Coro». Nombre de un personaje de la era 2.'

  - forma: laguarí
    pagina: 49
    verificado: imagen
    nivel: A
    referente: casona en el caserío Charaima (Baraived)
    glosa_fuente: '«es un árbol espinoso, una acacia. También le dicen: Laguadrí.»'
    segmentacion: laguarí (fitónimo sin componer)
    voces: [laguari]
    razon: 'Zavala #182 (E+A+PMA) y Alvarado «LAUADRÍ… D. t. Laguadrí»: la variante que Esteves da está en Alvarado.'

  - forma: saruro
    pagina: 60
    verificado: imagen
    nivel: A
    referente: cerro del Saruro, lindero de las tierras comuneras de Cerro Atravesado y Taparo
    glosa_fuente: '«Saruro: nombre de una serpiente no venenosa, la boa constrictora.»'
    segmentacion: saruro (zoónimo sin componer)
    voces: [saruro]
    razon: >-
      El lexicón lo apoya sólo en Zavala #224 (E), pero Medina Colina (pp. 41
      y 260) lo da vivo y peninsular frente al nacional tragavenados: fuente
      independiente con la misma cosa. Cierra #47 por el lado toponímico.

  - forma: taque
    pagina: 61
    verificado: imagen
    nivel: A
    referente: Los Taques (capital municipal); Santa Cruz de Los Taques, hoy Villa Marina; El Taque, hato al norte de Tacuato
    glosa_fuente: '«(Taque: árbol que produce una nuez comestible).»'
    segmentacion: taque (fitónimo sin componer; Los Taques con plural castellano)
    voces: [taque]
    razon: 'Zavala #236 es (E), pero Alvarado p. 284 lo registra aparte (nogal, Caryodendron). Recurre en Tacal y Tacaduto.'

  - forma: urupagua
    pagina: 66
    verificado: imagen
    nivel: A
    referente: La Urupagua, fundo pecuario cercano a El Vínculo
    glosa_fuente: 'arbusto espinoso, de hoja y fruto amargos, «buen pasto de cabras»'
    segmentacion: urupagua (fitónimo sin componer)
    voces: [urupagua]
    formantes: [gua]
    razon: 'Tres fuentes independientes en el lexicón (Alvarado p. 305, Esteves, Medina p. 292). Esteves distingue la de Paraguaná (retama) de la de la Sierra de Coro (árbol nucífero), como Medina.'

  - forma: yacure
    pagina: 67
    verificado: imagen
    nivel: A
    referente: conuco en las sabanas de Güima (Adícora); Yacural, vecindario de Cocodite
    glosa_fuente: '«Yacure: árbol leguminoso de hojas perennes, es una acacia.»'
    segmentacion: yacure (fitónimo sin componer)
    voces: [yacure]
    razon: 'Zavala #281 (AM+E) y Alvarado p. 308 «Acacia sp.». Yacural lleva el colectivo castellano -al encima.'
    observacion: 'El OCR lee «sabanas de Gutia»; la imagen dice Güima.'

  # ── B: un residuo, o una pieza sólo de Esteves pero recurrente ──
  - forma: adaro
    pagina: 12
    verificado: imagen
    nivel: B
    referente: Punta de Adaro, costa occidental (Los Taques); lindero de los distritos Carirubana y Falcón desde 1969
    glosa_fuente: '«La voz viene de Dara, ave vocinglera de estas sabanas»'
    segmentacion: 'a- (prótesis vocálica) + dara (con disimilación -a > -o)'
    voces: [dara]
    razon: >-
      `dara` 'alcaraván' es Zavala #102 (HB+E): fuera de Esteves. El residuo
      son las dos operaciones que el propio Esteves declara (prótesis y
      disimilación). En Adaure (toponimo-080) sólo «no descarta» a Dara; aquí
      lo afirma.
    observacion: 'Muelle de la Standard Oil (1927) y base militar de 1942: el sitio de la refinería de Amuay.'

  - forma: caibacoa
    pagina: 25
    verificado: imagen
    nivel: B
    referente: sabana al oeste del fundo de Aguaque, cerca de Pueblo Nuevo
    glosa_fuente: '«Cái es una alteración de guay… Bacoa es lugar, paraje.» (sitio de los guayes)'
    segmentacion: guay (> cai) + bacoa
    voces: [guay, bacoa]
    formantes: [bakoa]
    razon: >-
      `guay` es Zavala #147 (E+A) y `bacoa` #18 (AM+E): las dos fuera de
      Esteves. B y no A por la alteración guay > cai. `guay` recurre con la
      misma glosa en Guaidabacoa (p. 39, toponimo-008).

  - forma: camare
    pagina: 25
    verificado: imagen
    nivel: B
    referente: lugar del municipio Pueblo Nuevo; «el topónimo se repite muchas veces en Falcón»
    censo_1881: 8 casas, 48 vecinos
    glosa_fuente: '«Camare es un árbol frutal.»'
    segmentacion: camare (fitónimo sin componer)
    voces: [camare]
    razon: 'Alvarado p. 48 lo tiene («Arbusto indeterminado de Coro») sin decir que dé fruto: la cosa coincide a medias. En duda, B.'

  - forma: cararapa
    pagina: 27
    verificado: imagen
    nivel: B
    referente: sitio en el Istmo de Médanos, diez kilómetros al este de Tacuato
    glosa_fuente: '«Cararapa es una forma epentética de Carapa, árbol resinoso.»'
    segmentacion: carapa (con sílaba epentética)
    voces: [carapa]
    razon: 'Zavala #65 es (E), pero Alvarado p. 60 lo registra (Carapa guianensis). Residuo: la epéntesis.'

  - forma: cubiano
    pagina: 32
    verificado: imagen
    nivel: B
    referente: 'tres lugares: lindero de Cumujacoa, aldea de Los Taques, aldea de Jadacaquiva'
    formas_antiguas: ['Cujíbano, «que es la forma primitiva» (sin documento citado)']
    glosa_fuente: '«Cujíbano… quiere decir: el cerro del cují.»'
    segmentacion: cují + bano (= bana)
    voces: [cuji, bana]
    formantes: [bana]
    razon: >-
      `bana` 'cerro' es D9 (seis apoyos) y `cují` está en Alvarado p. 100
      (Acacia). Residuo: la metátesis Cujíbano > Cubiano y la variante -bano,
      que Esteves ya había anotado como cuarta atestación de bana.

  - forma: cunacho
    pagina: 33
    verificado: imagen
    nivel: B
    referente: serie de colinas del municipio Santa Ana, «las Escarpaduras de Cunacho»
    glosa_fuente: '«La voz viene Cuna, Cunaro, "promicrops guasa", pez»'
    segmentacion: cuna + -cho (sin despejar)
    voces: [cuna, cunaro]
    razon: >-
      `cuna` y `cunaro` son Zavala #95-96 (E), pero Alvarado p. 102 da CUNA =
      Promicrops guasa, «pez del mar Caribe que suministra un aceite útil
      para el alumbrado»: la misma cosa por otra fuente. Residuo: -cho.
    observacion: 'Con Iticuna, dos topónimos del mismo pez. El dato de mundo (la manteca de cuna en los jachos de pesca nocturna) va en §fauna.'

  - forma: curaidebo
    pagina: 35
    verificado: imagen
    nivel: B
    referente: antigua aldea de Pueblo Nuevo, hoy parte de la Comunidad de Cerro Pelón, entre Pueblo Nuevo y El Vínculo
    formas_antiguas: ['Curarirebo, «su forma primitiva»', 'iglesia en 1773 según la Visita del obispo Martí']
    glosa_fuente: '«el paso del Curarí. Curarí: árbol maderable, tecoma. Ebo: camino, paso»'
    segmentacion: curarí + ebo (con reducción Curarirebo > Curaidebo)
    voces: [curari, ebo]
    formantes: [ebo]
    razon: >-
      `curarí` está en Alvarado p. 105 (árbol de construcción de la región
      occidental); `ebo` sólo por Zavala (E), pero recurrente con la misma
      glosa (Gisebo, Guacurebo, Jurijurebo; y Oliver p. 148 lista «(e)-bo»
      como formante caquetío, sin glosa). Precedente Buchuhaco: B.
    observacion: >-
      🗺️ El mapa vivo tiene «Cumairebo» (toponimo-132, descartado sin
      fuente) en 12.003, -69.920: justo entre Pueblo Nuevo (11.948) y El
      Vínculo (12.069), donde Esteves pone Curaidebo. Candidato a ser el
      mismo nombre (r~m, que NO está entre las permutaciones documentadas):
      ver §mapa_vivo.

  - forma: chirache
    pagina: 36
    verificado: imagen
    nivel: B
    referente: la quebrada más larga de la península; nace en el centro, al sur de Caradacagua, y desagua cerca del Cabo de San Román
    glosa_fuente: '«Chirache: viene de Jiracha, árbol leñoso, laguarí.»'
    segmentacion: jiracha (alterado)
    voces: [jiracha]
    razon: 'jiracha está en Alvarado p. 181 («Árbol de construcción del Zulia»), no en el lexicón. Residuo: la alteración ji- > chi-, -a > -e. Recurre en Jariaca.'
    observacion: 'Cero en el mapa vivo pese a ser el cauce más largo que Esteves nombra.'

  - forma: guanadito
    pagina: 41
    verificado: imagen
    nivel: B
    referente: aldea del municipio Los Taques
    glosa_fuente: '«Dito es característica desinencial de nombres colectivos en caquetío.»'
    segmentacion: guana(jo) + dito
    voces: [guanajo]
    formantes: [dito]
    razon: >-
      `guanajo` (cardón lanoso) está en Alvarado p. 151 y en el canon por
      Zavala; `-dito` colectivo sólo lo glosa Esteves, pero recurre con la
      misma glosa (Cocodite, Jarayadito, Guanadito…). Residuo: la reducción
      guanajo > guana-.

  - forma: guaranao
    pagina: 41
    verificado: imagen
    nivel: B
    referente: salina del municipio Punta Cardón (destruida por aguas cloacales); meseta y puerto de Guaranao
    glosa_fuente: '«Guaranaro es un pez más pequeño que la lisa.»'
    segmentacion: guaranaro (con pérdida de -r-)
    voces: [guaranaro]
    formantes: [gua]
    razon: >-
      `waranaro` es Zavala #139 (HB+E): fuera de Esteves. Residuo: -aro >
      -ao, la misma erosión que Esteves anota en Sarinaro > Sarinao (p. 60).
    observacion: >-
      Es el nombre del nodo GUARANAO de la era 2. La sal de Guaranao tenía
      fama curativa para la piel y los ojos (examinada por J. M. Vargas en
      1834, según Hill Peña): dato colonial-republicano, regla 3.

  - forma: hayo
    pagina: 43
    verificado: imagen
    nivel: B
    referente: El Hayo, lugar al norte de Jadacaquiva
    glosa_fuente: 'árbol pequeño parecido al semeruco; la leyenda dice que masticaban sus hojas «para aliviar el hambre»'
    segmentacion: hayo (fitónimo sin componer)

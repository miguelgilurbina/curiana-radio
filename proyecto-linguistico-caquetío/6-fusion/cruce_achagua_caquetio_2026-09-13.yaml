  advertencias:
  - 'Las formas achagua son TRANSCRIPCIÓN POR VISIÓN (dos pasadas, 2026-09-12): verificar el pliego en imagen antes
    de citar cualquier forma de este cruce como exacta.'
  - 'Un parecido de forma con glosa exacta es un CANDIDATO a cognado, no un cognado: ninguno de estos pares ha pasado
    por correspondencias regulares verificadas (la prueba de predicción dice cuánto aguantan).'
  - 'Glosa exacta no es significado idéntico: el castellano del jesuita de 1762 y el de Zavala 2015 no recortan
    igual el mundo. Y los préstamos panamericanos (tainismos) pueden dar parecido sin filiación.'
  - 'El filtro no ve la aposición sin artículo («Pajaro, Dios te de», «Raya, pescado»): esos lemas entran como glosa
    exacta de su hiperónimo. Se auditaron a mano los emparejamientos de lema con varios segmentos: los que quedan
    así dan sin-parecido y solo engordan el número de candidatos, que el modelo nulo ya cobra.'
  - 'La capa atestiguada es mayoritariamente fitonimia y zoonimia de Paraguaná y Coro (Zavala): conceptos que un
    vocabulario de los Llanos rara vez nombra con la misma glosa. El hueco mide la lista, no la lengua.'

  metodo:
  - 'FILTRO DE SIGNIFICADO: cada glosa se parte en segmentos (coma, punto y coma, barra, «o», «vel»; nunca «y»,
    para que «maíz tostado y miel» no case con «miel»). Cuenta solo la glosa EXACTA: el segmento es una sola palabra
    en los dos lados, tras normalizar la ortografía castellana colonial (muger=mujer, v=b, z=s, plural). Lo que
    sigue a «v.g.» es ejemplo y se descarta; el segmento que abre con indefinido («Cachama, un pescado») es una
    clase y no cuenta como exacto.'
  - 'MIRAR LA CAPA: la entrada caquetía reconstruida o hipotética cuya `notas` dice de qué lengua sale la forma
    («cognado en lokono», «desde el WAYUU», «etiquetada `lokono/garifuna`», «< ... Wayunaiki») es CIRCULAR con esa
    lengua. Si sale del proto-arahuaco, es circular con todas. El resumen de filiación usa solo la capa atestiguada.'
  - 'SESGO INVERSO: se excluyen las entradas comparanda sin fuente cuya `notas` dice que se escribieron como cognado
    de una voz caquetía («Lokono katsi; cognado de cati caquetío»): compararlas mediría la mano que las escribió,
    no la lengua.'
  - 'DESCONFIAR: modelo nulo por permutación (mismo número de entradas al azar de la misma lengua, mismos radicales)
    y prueba de predicción a dos pliegues para las correspondencias.'
  capas_de_medicion:
  - diacríticos fuera salvo ü y ñ (fonemizar borraba ū, ẽ, ë enteras)
  - 'copista achagua: V/J iniciales ante consonante = u/i, en cada palabra de la forma'
  - 'ortografía lingüística (lokono, wayuu, reconstruido): la h suelta pasa a j, porque fonemizar borra la h'
  - 'curiana_fonotactica.fonemizar(); OJO: lleva <ch> a k y <sh> a s en todas las lenguas por igual'
  - forma_comparable() colapsa las geminadas de Perea; además se colapsan todas las repeticiones y ü -> u

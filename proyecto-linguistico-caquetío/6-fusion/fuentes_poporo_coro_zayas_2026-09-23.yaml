# ─────────────────────────────────────────────────────────────────────────
# PROPUESTA — Tres lecturas de fuente para cerrar la investigación (cc.3, cc.6, cc.7)
#   El poporo · `coro` no es 'viento' · las voces de Zayas
#   Campaña del 2026-09-23, rama campana/poporo-coro-zayas
#
# Las tres decisiones ya las tomó Miguel (6-fusion/decisiones_cierre_2026-09-23.yaml,
# rama tanda/base-2026-09-22). Aquí va el DATO que faltaba para aplicarlas: qué
# dice la fuente, con cita verbatim y página impresa, y la nota que se propone.
#
# Minar PROPONE, el humano fusiona (regla 5): nada de esto toca curiana_sim/,
# 2-lengua/ ni 3-mundo/. Los textos de `nota_propuesta` son para pegarlos en la
# fusión (skill fusionar-propuesta); los de `cambio_propuesto`, para decidir.
#
# CÓMO SE CITA
#   - Castellanos, partes I-III (castellanos-elegias): `linea` = línea del .txt
#     del repo; página de la BAE 1857 calculada con
#     6-fusion/scripts/castellanos_pagina.py (#207), corrida el 2026-09-23
#     sobre las líneas que se citan aquí.
#   - Castellanos, parte IV (castellanos-nuevo-reino-1886, NUEVA): la ficha
#     trae el desfase medido.
#   - «✅ imagen» = cotejado en la imagen de la página (pymupdf). Lo demás sale
#     de la capa de texto y lleva sus erratas; si una errata importa, la
#     lectura corregida va aparte en `lectura`.
# ─────────────────────────────────────────────────────────────────────────

resumen_para_el_fallo:
  suben_de_B_a_A: [maba, lefaria, barisigua, guatacare]
  suben_de_C_a_B: [igüira, chenga, guamaro, chamaco, chevebe, machire, chirita, tura]
  al_corpus_de_creencia: [seretón]
  siguen_como_estaban: 31
  lo_que_esto_no_hace: >-
    No convierte ninguna voz en caquetía. Todas estas fuentes dicen que la
    palabra existe, dónde se usa y qué nombra — el primer eslabón. El segundo
    —si el sustrato es caquetío— sigue sin tocar, y por eso ninguna sube a
    `caquetío-atestiguado` sin que Miguel lo decida.
  deuda_nueva:
    - 'El caserío Las Barisiguas (mun. Dabajuro) a la campaña de topónimos.'
    - 'Chunaure, ya en la cola de Esteves, ahora tiene la voz `tura` como lectura.'
    - '`erica`, segundo nombre local de la Melipona favosa, no está en ningún sitio del repo.'

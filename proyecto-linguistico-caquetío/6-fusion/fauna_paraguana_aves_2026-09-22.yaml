candidatos_referente:
  criterio: es_hueco true; presencia segura o probable; visible o audible a diario en su ambiente; con
    descripción y sonido de fuente (o su hueco declarado). Ordenados por la fuerza de la evidencia del
    sonido.
  tono: 'el de REFERENTES_NOVEDOSOS (curiana_koine.py): algo que se ve y se oye siempre y que hay que
    nombrar, sin nombre moderno ni castellano dentro.'
  lista:
  - id: ref-aves-03
    especie: ave-011
    referente: guacharaca
    desc_referente: un ave parda del tamaño de una gallina, de cola larga y papada roja, que desde los
      árboles del cerro grita al amanecer antes que todas
    se_oye: 'un grito de tráquea, fuerte y repetido: «ua-chará-cá»'
    periodo: todo el año; al amanecer
    donde: el cerro (Capubana, Moruy)
    fuerza: onomatopeya literal verificada en imagen (Alvarado p. 143)
    largo:
      desc_referente: 134
      se_oye: 53
  - id: ref-aves-09
    especie: ave-041
    referente: corocoro
    desc_referente: unas aves zancudas rojas como la sangre, de pico largo y curvo, que cruzan en fila
      sobre la laguna y el manglar
    se_oye: una voz que repite «coró, coró»
    periodo: todo el año; menos en el Tiempo de Siembra
    donde: manglar y laguna (Tiraya / Boca de Caño)
    fuerza: 'onomatopeya verificada (Alvarado p. 92); ojo: el silabeo choca con koro «cotorra»'
    largo:
      desc_referente: 111
      se_oye: 31
  - id: ref-aves-06
    especie: ave-015
    referente: colibrí
    desc_referente: un pájaro diminuto de pico como una espina que se queda quieto en el aire frente a
      la flor del cardón, con alas que no se ven
    se_oye: el zumbido de sus alas, como un insecto grande
    periodo: todo el año
    donde: cardonal y conuco
    fuerza: Alvarado p. 279 da «sunsún» como onomatopeya del zumbido (sin imagen)
    largo:
      desc_referente: 125
      se_oye: 46
  - id: ref-aves-04
    especie: ave-016
    referente: pitirre
    desc_referente: un pájaro de vientre amarillo y cabeza gris que espera en la rama más alta y sale
      de golpe a cazar insectos en el aire
    se_oye: un trino agudo que parece decir su propio nombre
    periodo: todo el año
    donde: cardonal, conuco, orilla
    fuerza: nombre onomatopéyico según Alvarado p. 255 (sin imagen)
    largo:
      desc_referente: 118
      se_oye: 48
  - id: ref-aves-08
    especie: ave-053
    referente: gaviota guanaguare
    desc_referente: unas aves blancas de lomo gris y pico rojo que siguen a la canoa y se pelean el pescado
      en la orilla; en la cría llevan la cabeza negra
    se_oye: 'un grito ronco que suena a risa: «ja, ja, ja»'
    periodo: todo el año; capucha negra en la cría
    donde: costa, playa, salina
    fuerza: transcripción vía Wikipedia de Birds of the World (primaria no leída)
    largo:
      desc_referente: 135
      se_oye: 45
  - id: ref-aves-01
    especie: ave-001
    referente: cardenal coriano
    desc_referente: un pájaro rojo entero con un penacho alto siempre erguido, que canta desde la punta
      del cardón; su hembra es gris y sólo lleva rojo el penacho
    se_oye: 'silbidos claros que suben y se repiten: «chío, chuí, chuí»'
    periodo: todo el año
    donde: cardonal y pie del cerro
    fuerza: transcripción vía Wikipedia de XC220411 (ficha no abierta); grabado en la caja (escuchar_en_la_caja
      de ave-001)
    largo:
      desc_referente: 142
      se_oye: 58
  - id: ref-aves-07
    especie: ave-050
    referente: alcatraz
    desc_referente: un ave grande y parda de pico larguísimo con una bolsa debajo, que vuela en fila sobre
      el agua y cae de golpe al mar sobre el pescado
    se_oye: 'no canta: se oye el golpe de su cuerpo contra el agua'
    periodo: todo el año
    donde: costa y mar
    fuerza: descripción de la conducta de fuente (Alvarado p. 292 citando a Codazzi); sin voz
    largo:
      desc_referente: 133
      se_oye: 53
  - id: ref-aves-02
    especie: ave-002
    referente: turpial
    desc_referente: un pájaro grande anaranjado y negro, de ojo amarillo rodeado de piel azul, que canta
      fuerte desde el espinar
    se_oye: silbidos largos y sonoros, como alguien que llama desde lejos
    periodo: todo el año
    donde: cardonal, espinar, conuco
    fuerza: la voz viva «turupial» y «ave canora» (Medina p. 288); sin transcripción de fuente
    largo:
      desc_referente: 108
      se_oye: 61
  - id: ref-aves-05
    especie: ave-006
    referente: carpintero
    desc_referente: un pájaro de espalda rayada en blanco y negro y coronilla roja que taladra el cardón
      con el pico para hacer su nido
    se_oye: golpes secos y rápidos de pico contra la madera
    periodo: todo el año
    donde: cardonal, cerro
    fuerza: conducta de fuente (Medina p. 67); el golpeteo no está transcrito; voz viva paraguanera «chamaco»
      sin fusionar
    largo:
      desc_referente: 115
      se_oye: 47
  - id: ref-aves-10
    especie: ave-005
    referente: chirito
    desc_referente: un pajarito blanco grisáceo, apenas mayor que un colibrí, de cola larga que abre y
      cierra, que anda por las ramas altas del monte
    se_oye: un hilo de voz fino y repetido desde lo alto
    periodo: todo el año
    donde: cardonal, espinar, cerro
    fuerza: Medina p. 73 («da su sonido en árboles altos»); sin transcripción
    largo:
      desc_referente: 129
      se_oye: 44
  reserva:
  - especie: ave-058
    referente: los playeros migratorios
    por_que_no: es el reloj del año (ecologia-038), pero su voz no tiene transcripción de fuente
  - especie: ave-051
    referente: la tijereta de mar
    por_que_no: el hueco más visible de la costa, pero es muda
  - especie: ave-023
    referente: el zamuro
    por_que_no: visible siempre, casi mudo
  - especie: ave-042
    referente: las garzas
    por_que_no: sin sonido de fuente
propuestas_ecologia:
  nota: Propuestas con el esquema de 3-mundo/corpus/ecologia.yaml; los id son provisionales y los pone
    quien fusione.
  entradas:
  - id: ecologia-P-aves-01
    contenido: 'Las aves del monte y de la orilla que un habitante oía a diario tienen en buena parte
      nombre caquetío, y casi siempre el nombre imita la voz: dara (el alcaraván), wakoa (la paloma, cuyas
      formas en cinco lenguas «imitan… el canto»), chuchubi (la paraulata), warawara (el caricare), chogogo
      (el flamenco), tijua («paloma de canto onomatopéyico»). La lengua nombró al ave por lo que se oye
      de ella.'
    fuente: reconstruido
    referencia: 'Zavala Reyes 2015 #85, #102, #127, #248; Alvarado 1921 p. 143; van Buurt 2014 pp. 29,
      37; 2-lengua/morfologia.md §9'
    procedencia:
      obra: alvarado-1921
      pagina: 143
    dominios:
    - ecologia
    - fauna
    - lengua
    agentes_relacionados: []
    palabra_lexicon: wakoa
    locacion: matorral
    implicacion_simulacion: 'Un agente que tenga que nombrar un ave sin nombre tiene en su propia lengua
      el modelo: nombrarla por lo que se oye. Por eso el referente llega con `se_oye`.'
  - id: ecologia-P-aves-02
    contenido: 'El año se oye y se ve en las aves: el waru (oripopo) y el águila pescadora abundan del
      Tiempo de Siembra al de Viento y casi desaparecen en la seca larga; la gaviotica y el pico de tijera
      llegan a criar en las salinas justo en la seca larga; la tijereta del sur sólo aparece en la seca
      larga; las bandadas de playeros llegan del norte hacia el final de la seca y se van con el viento.'
    fuente: reconstruido
    referencia: GBIF, índice por período (6-fusion/medicion_gbif_aves_paraguana_2026-09-22.yaml, campo
      patron), proyectado al s. XV por la antigüedad de las rutas migratorias
    procedencia:
      obra: gbif-aves-paraguana-2026
    dominios:
    - ecologia
    - fauna
    - clima
    agentes_relacionados: []
    palabra_lexicon: waru
    locacion: orilla
    implicacion_simulacion: Concreta ecologia-038 («las aves son un reloj») con especies y períodos del
      canon de la era 2.
  - id: ecologia-P-aves-03
    contenido: 'La guacharaca «con ese cacareo resonante anuncian mui temprano la llegada del día»: en
      el cerro, el amanecer tiene voz propia antes que la luz.'
    fuente: atestiguado
    referencia: 'Alvarado 1921 p. 143 (verificado en imagen); presencia en el cerro: monumento-cerro-santa-ana'
    procedencia:
      obra: alvarado-1921
      pagina: 143
    dominios:
    - ecologia
    - fauna
    agentes_relacionados: []
    palabra_lexicon: null
    locacion: null
    implicacion_simulacion: Frase candidata para el momento «amanecer» de los sitios del cerro (Capubana,
      Moruy) en [Tu tierra].
  - id: ecologia-P-aves-04
    contenido: La cotorra de hombros amarillos vivió en Paraguaná hasta mediados del s. XX, cuando se
      extinguió allí como en Aruba y Curazao; en el habla quedó la «cota», lora mayor que el perico.
    fuente: atestiguado
    referencia: Ferrer-Paris et al. 2014 vía Wikipedia es (aves-punteros-web-2026); Medina Colina p. 82
    procedencia:
      obra: medina-colina-sxx
      pagina: 82
    dominios:
    - ecologia
    - fauna
    agentes_relacionados: []
    palabra_lexicon: koro
    locacion: matorral
    implicacion_simulacion: 'Caso demostrativo de la regla de ecologia-037: el s. XV era más rico que
      el censo moderno.'
  - id: ecologia-P-aves-05
    contenido: La forma de tierra firme del nombre del flamenco es «togogo» (Coro y Falcón), frente a
      «chogogo» de las islas.
    fuente: hipotetico
    referencia: 'Alvarado 1921 p. 292 («¿Es el TOGOGO de Coro?») y Esteves 1989 p. 134 («Togogo: ave ansérida»),
      ambos verificados en imagen; la identidad con el flamenco es inferencia'
    procedencia:
      obra: alvarado-1921
      pagina: 292
    dominios:
    - ecologia
    - fauna
    - lengua
    agentes_relacionados: []
    palabra_lexicon: chogogo
    locacion: salina
    implicacion_simulacion: Si se confirma, chogogo tiene hermana continental y deja de ser una voz sólo
      insular.

# FAUNA DE PARAGUANÁ — LAS AVES (parcela FA2 de la campaña de fauna, 2026-09-22)
# Propuesta sin fusionar. Las cifras (`gbif`, `escuchar_en_la_caja`, `fonotactica`,
# `meta.medido`) las escribe 6-fusion/scripts/ensamblar_fauna_aves.py: no se editan a mano.
meta:
  recogido: '2026-09-22'
  estado: sin-fusionar
  parcela: FA2 — las aves de Paraguaná en el s. XV, residentes y migratorias (campaña de fauna, tercera
    minería)
  quien: minador de fauna FA2 (Claude Opus 5.5), a pedido de Miguel
  encargo: «buscar todos los animales que son de la ecología de Paraguaná, sean migratorios, endémicos
    o que sean simplemente de la ecología de la región, y luego va a realizar una campaña para describirlos
    visualmente, y si es posible encontrar la onomatopeya que hacen» (Miguel, 2026-09-22).
  para_que: Los referentes del experimento (REFERENTES_NOVEDOSOS) empiezan por los animales sin nombre
    caquetío conocido. Cada ave llega al agente con algo que VER (descripcion_visual) y algo que OÍR (sonido).
  respuesta_corta: 'El cardonal, el cerro, la salina y la costa de la península tienen hoy unas doscientas
    treinta especies de aves con registro (GBIF, `meta.medido`). De las que un hablante del s. XV veía
    u oía a diario, las del monte y las de la orilla, una parte grande YA tiene voz caquetía atestiguada
    —y casi siempre es un nombre que imita el canto: dara, wakoa, chuchubi, warawara, chogogo, tijua—.
    Los huecos de verdad son pocos y concretos: el cardenal, el turpial, la guacharaca, el pitirre, el
    carpintero, el colibrí, el alcatraz, la gaviota, el corocoro y el chirito. Esos son los candidatos.'
  como_se_midio:
  - GBIF por la caja de la península (6-fusion/scripts/medir_gbif_aves_paraguana.py → 6-fusion/medicion_gbif_aves_paraguana_2026-09-22.yaml),
    con las AUSENCIAS de PANGAEA restadas.
  - Alvarado 1921 extraído con pdftotext (704 KB) y barrido por entrada con glosa de ave; cada onomatopeya
    que se cita, verificada en imagen (pymupdf) salvo donde se dice.
  - 'Esteves 1989 (OCR del repo): los topónimos con nombre de ave; Togoco verificado en imagen.'
  - 'Medina Colina (6-fusion/medina_colina_dictado.yaml): las voces de ave del dictado de Miguel.'
  - 'van Buurt 2014 y Gatschet 1885 (textos del repo): los nombres insulares.'
  - 'El lexicón (curiana_lexicon.py, sólo lectura): las voces caquetías, wayuu, lokono y achagua de ave.'
  - Punteros web (Wikipedia es/en) sólo para llegar a la fuente primaria; cuando no se leyó la primaria,
    se dice.
  periodos_del_canon:
    fuente: 6-fusion/clima_era2.yaml §periodos
    P1_tiempo_de_viento: enero-mayo
    P2_seca_larga: junio-septiembre
    P3_tiempo_de_siembra: octubre-diciembre
  como_leer_gbif: '`gbif.indice_por_periodo` = registros de la especie en el período ÷ lo esperado por
    el esfuerzo de observación (1 = lo esperado). Un índice < 0,25 en un período, con n ≥ 30, es la firma
    de un ave que se va. El estatus migratorio lo pone la literatura, no el índice.'
  criterios_presencia_s_xv:
    segura: 'nativa, con hábitat que existía en el s. XV y con un indicio viejo propio de la esfera: voz
      indígena atestiguada (caquetía o insular), cita colonial o espécimen anterior a 1950.'
    probable: nativa, regular hoy en la península y con hábitat que existía en el s. XV (cardonal, cerro,
      salina, playa, arrecife); sin indicio viejo propio.
    dudosa: 'pocos registros, errante, hábitat reciente (el manglar de Guaranao es de 1985: laguna-guaranao-parque)
      o posible colonización moderna.'
    excluida: introducida o llegada después de 1500.
  regla_3: 'Todo registro moderno (GBIF, Bisbal 1990, Medina) dice que el ave CABE en este medio, no que
    estuviera en el s. XV. Y al revés (ecologia-037/039): el monte del s. XV era más rico que el de hoy;
    la cotorra de hombros amarillos y la yaguaza se perdieron en el s. XX.'
  convenciones:
    es_hueco: true si NO hay voz caquetía en el lexicón para ESE referente (ni atestiguada ni reconstruida).
      Una voz insular o viva sin fusionar se anota en nombres, pero no tapa el hueco.
    nombre_onomatopeyico: el nombre, en cualquier lengua, que la fuente dice que imita el canto; es el
      sitio donde una palabra indígena pudo sobrevivir por el sonido.
    onomatopeya_documentada: literal como está en la fuente; transcripción moderna, NO palabra caquetía.
    silabeo_propuesto: 'HIPOTÉTICO: el sonido pasado por la fonotáctica del caquetío atestiguado (2-lengua/fonotactica.md).
      No es un nombre ni se propone como tal: 2-lengua/morfologia.md §9 advierte que un agente no debería
      reduplicar para inventar un ave.'
  compartidas_con_FA3: las marinas y costeras (ambiente costa/mar/salina) son de esta parcela; FA3 las
    cita por su id.
  medido:
    entradas: 51
    por_presencia_s_xv:
      probable: 33
      segura: 12
      dudosa: 3
      excluida: 3
    es_hueco: 33
    con_voz_caquetia_en_el_lexicon: 18
    con_onomatopeya_documentada: 9
    con_descripcion_de_fuente: 23
    candidatos_referente: 10
    silabeos_propuestos: 9
    silabeos_que_pasan_la_fonotactica: 8
    silabeos_que_chocan_con_el_lexicon: 2
    gbif_total_registros_aves: 35828
    gbif_especies_en_la_caja: 230
lo_que_resulto_falso_al_medirlo:
- dato: 'La cotorra de hombros amarillos (Amazona barbadensis) «está» en GBIF en la península: 60 filas.'
  medido: 'Las 60 filas son del dataset de PANGAEA «Detection histories for eight species of Amazona parrots…
    NeoMaps 2010» y llevan organismQuantity = 0: son NO-detecciones publicadas como PRESENT. Las otras
    siete amazonas de Venezuela salen igual, a 60 filas cada una, incluidas A. farinosa y A. mercenaria,
    que no viven en un cardonal. Presencias reales en la caja: 0. Lo corrige el script.'
  y_sin_embargo: 'La especie SÍ estuvo: Ferrer-Paris et al. 2014 (vía Wikipedia es) da por extinta la
    población de Paraguaná en los años cincuenta, y Medina recuerda la «cota», lora mayor que el perico
    (p. 82). Presencia s. XV: segura. Es el caso que ecologia-037 buscaba: el censo moderno la borra,
    la memoria no.'
- dato: El alcaraván es ave de todos los días en la península (Medina p. 89; Esteves p. 12).
  medido: 'GBIF: 0 registros de Burhinus bistriatus en la caja, 1 en una caja más ancha. No prueba que
    falte (es nocturna y de sabana, y eBird se hace en la costa de día): mide la consulta, regla 6. Lo
    que sí tiene registros (desde 2007) es Vanellus chilensis, al que el resto del país llama «alcaraván».'
- dato: «Togogo» es un error de OCR por Tococo (6-fusion/esteves_parte2_falcon.yaml §conflictos).
  medido: 'Al revés. Verificado en imagen (Esteves 1989 p. 134): el lema es TOGOCO y la glosa «(Togogo:
    ave ansérida)»; el OCR leyó «TOCOCO». Y Alvarado 1921 p. 292, verificado en imagen, pregunta «¿Es
    el TOGOGO de Coro?». Togogo es una voz de tierra firme hermana de chogogo (ver ave-040 y el issue).'
- dato: 'Maraquita: «su canto reza: tii-tu-cú» (texto de pdftotext de Alvarado p. 212).'
  medido: La imagen dice «tu-tu-cú». El OCR de 1921 falla justo en la cursiva, como avisa el preámbulo.
- dato: La laguna de Guaranao, con su manglar, es hábitat de aves del s. XV.
  medido: 'No: laguna y manglar son de 1985 (laguna-guaranao-parque, corrección del 2026-09-16). Las aves
    de manglar se proyectan al s. XV por el manglar de Tiraya/Boca de Caño, no por Guaranao.'

# ══════════════════════════════════════════════════════════════════════
fuentes_que_este_barrido_identifica:
  - obra: 'Hernández Baño, Adrián — «Los Caquetíos de Falcón» (1984), INCUDEF, Coro'
    por_que: >-
      ⭐ Es la compilación de referencia sobre los caquetíos de Falcón, y el
      proyecto YA cita a Hernández Baño de segunda mano, vía el glosario de
      Zavala (la sigla HB). Tenerlo de primera mano cerraría muchas cadenas.
      ADQUISICIÓN a buscar.
  - obra: 'apellidoyajure.blogspot.com'
    por_que: >-
      Investigador aficionado con posts monográficos sobre formantes caquetíos
      (-ebo, -coa) y antroponimia. No es fuente citable, pero es un buen mapa
      de por dónde buscar. Sus series coinciden con Oliver en `-ebo`.
  - obra: 'lubesinho-folkloreando.blogspot.com, «Vocabulario caquetío»'
    por_que: >-
      ⚠️ NO es fuente nueva: es el glosario de 288 entradas de Zavala Reyes
      republicado, que el proyecto ya minó entero (F7, 288/288). Sirve sólo
      para confirmar las siglas de autoría que el proyecto ya usa: PMA =
      Pedro Manuel Arcaya, HB = Adrián Hernández Baño, E = Esteves,
      AM = Angulo Molina, A = Alvarado, CGB = González Batista.

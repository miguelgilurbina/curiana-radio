# 🔴 EL BARRIDO WEB SE PARA AQUÍ, Y POR UNA BUENA RAZÓN
# ══════════════════════════════════════════════════════════════════════
por_que_se_para:
  fecha: '2026-09-10'
  que_paso: >-
    Buscando `Maquigue` salió citada una obra: «Topónimos Indígenas de
    Paraguaná Y OTROS TOPÓNIMOS INDÍGENAS DEL ESTADO FALCÓN». Es Esteves 1989
    — el libro que el proyecto lleva meses minando. Y la ficha
    `4-fuentes/esteves-1989.md` ya tenía la tabla: pp. 11-67 Parte I,
    Paraguaná, tomos 1-3 (MINADA); pp. 81-144 **PARTE II, «otros topónimos
    indígenas del estado Falcón», tomos 4-6 (SIN MINAR)**.
  el_error: >-
    Estuve buscando en blogs lo que estaba, con página y autor citable, en un
    libro del estante. Los tomos 4-6 eran los únicos sin OCR, y por eso la
    Parte II nunca se había tocado. Mismo patrón que con Perea: preguntarle a
    la fuente equivocada teniendo la buena en casa.
  lo_que_se_hizo: >-
    OCR de los tomos 4, 5 y 6 con `ocr_fuente.py` (2026-09-10). Ya están sus
    `.ocr.txt` junto a los de los tomos 1-3.

  correccion_del_conteo:
    que_paso: >-
      🔴 El primer cruce se hizo con el tomo 6 A MEDIAS: lo commiteé mientras

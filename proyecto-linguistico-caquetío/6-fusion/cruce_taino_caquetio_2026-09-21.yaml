      y se anotan sus correspondencias consonánticas no idénticas. Cada una predice sobre TODOS los demás conceptos
      atestiguados con glosa exacta en esa lengua (fuera los que la sugirieron). La tasa por azar repite la prueba
      con entradas al azar de la misma lengua (300 réplicas). Juicio: hacen falta 3 apoyos para llamarla regla,
      y 5 casos aplicables para ponerla a predecir.'

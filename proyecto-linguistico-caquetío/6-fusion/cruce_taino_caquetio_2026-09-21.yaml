    hallazgos_de_etiqueta:
      que_es: curiana_sim/taino_hipotetico.json declara 14 formas «Taíno atestiguado». Esto mira cuántas de ellas
        NO llevan la etiqueta `taíno` en el lexicón, y si alguna tenía pareja caquetía que el cruce por glosa se
        pierde por eso.
      declaradas_atestiguadas_en_el_json: 14
      de_esas_sin_la_etiqueta_taino_en_el_lexicon: 1
      casos:
      - forma: siba
        glosa_en_el_json: piedra
        etiqueta_en_el_lexicon: lokono
        lo_que_dice_el_json: 'Taíno atestiguado: siba; cognado Lok. siba; Brinton 1871'
        pareja_caquetia_que_el_cruce_se_pierde:
          caquetio: kiba
          concepto: piedra
          similitud: 0.75
      lo_que_falta_del_todo:
        que_es: voces taínas que las propias fuentes del repo imprimen, que tienen pareja caquetía atestiguada declarada
          en cognados.yaml, y que NO están en el lexicón bajo ninguna etiqueta. Se listan como propuesta para T1/T2;
          este script no las añade (regla 5).
        casos:
        - taino: bagua / bara-wa 'mar'
          donde_esta_en_el_repo: '2-lengua/cognados.yaml cognado-016 (con cita: oliver-1989-cap2 p. 150) y cognado-019;
            brinton-1871 p. impresa 11 s.v. Bagua «the sea»'
          pareja_caquetia: para / parawa 'mar', caquetío-atestiguado
          por_que_importa: 'es la pareja CQ~TN mejor citada que hay, y el lexicón no tiene ninguna entrada taína
            para ''mar'': por eso el cruce por glosa no la ve'
        - taino: siba 'piedra'
          donde_esta_en_el_repo: el lexicón la tiene, pero etiquetada `lokono`; taino_hipotetico.json la declara
            «Taíno atestiguado»; brinton-1871 p. impresa 14 «Siba, a stone»
          pareja_caquetia: kiba 'piedra' (forma_fuente `quiva`), caquetío-atestiguado
          por_que_importa: el cruce la puntúa 0,75 contra el LOKONO y 0 contra el taíno, y es la misma forma. Es
            el ejemplo más claro de que el cero mide la etiqueta y no la lengua

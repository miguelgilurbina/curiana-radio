    filas:
    - morfema_caquetio: ma- privativo
      capa_y_cita_caquetia: 'atestiguado en la nota (2-lengua/morfologia.md §6): van Buurt 2014 §8 y el par mínimo
        lokono de Perea 1942 p. 555. La entrada del motor sigue con `deuda: sin-procedencia`'
      candidato_taino: ma- en mahite 'sin dientes'
      que_fuente_lo_afirma: 'brinton-1871 p. impresa 13: mahite «you have lost a tooth»; y compara el arahuaco «marikata,
        you have no teeth (ma negative, ari tooth)». Oliver 1989 cap. 2 p. 147 n. 43 lo generaliza: el privativo
        /mV-/ es común a las lenguas maipures'
      veredicto: 'MISMO MORFEMA, y el paralelo no es taíno-caquetío: es arahuaco común'
      por_que: Brinton segmenta ma- + ari 'diente' y Oliver lo declara maipure general. Sirve para confirmar que
        el caquetío tiene lo que la familia tiene; NO acerca el taíno al caquetío más que a cualquier otra hermana.
    - morfema_caquetio: ma- privativo
      capa_y_cita_caquetia: igual que la fila de arriba
      candidato_taino: manicato 'fuerte, valiente'
      que_fuente_lo_afirma: brinton-1871 p. impresa 13, citando a Oviedo. Brinton lo relaciona con un arahuaco «manikade»
        glosado «I am unhurt, I am unconquered», pero NO lo segmenta
      veredicto: INDECIDIBLE — el sentido es negativo y encaja, pero nadie lo segmenta
      por_que: 'El OCR de la etimología de Brinton («from indn, manin») no es legible y hay que verla en imagen
        antes de citarla. Sin segmentación explícita, contar manicato como apoyo de ma- sería la trampa que el proyecto
        se tragó dos veces hoy mismo: macana no sostenía -kana, y el -po de apopo era reduplicación. Comparte sílaba;
        el morfema está sin probar.'
    - morfema_caquetio: ka- atributivo / existencial
      capa_y_cita_caquetia: 'atestiguado en la nota: van Buurt 2014 §8 (Casibari «hay rocas duras») y el par mínimo
        k-ere-u-ti / m-ere-u-ti de Perea 1942 p. 555. d21.5 → C, 2026-09-21'
      candidato_taino: ka-/ca- inicial (caney, cacique, casabe, caona, caiman…)
      que_fuente_lo_afirma: NADIE en el repo. Brinton no segmenta ningún ca- taíno como prefijo; Oliver cap. 2 p.
        148 da el atributivo /k-/, /kV-/ entre los afijos ARAHUACOS generales, sin ejemplo taíno
      veredicto: SIN APOYO — la sílaba está, el morfema no está afirmado por ninguna fuente
      por_que: '`caiman` Brinton lo glosa «lit. to be strong» sobre el arahuaco k-aiman, que sí sería el atributivo;
        pero es su lectura del ARAHUACO de Guayana, no del taíno, y una sola lectura no hace regla. Queda como pregunta
        para el minado de T1/T2, no como corroboración.'
    - morfema_caquetio: da- / d- de 1ª persona singular
      capa_y_cita_caquetia: 'el motor NO lo tiene como regla: `ta-` (wayuu) es su posesivo de 1ª sg. El /dA-/ caquetío
        es dato de oliver-1989-cap2 pp. 146-147 en diao, dare, dato, datihao — y es el pilar de que el caquetío
        salga del mismo fondo que el lokono'
      candidato_taino: daca 'yo' (Pané); da- en da(i)tia-o; m-a(h)i-te que sería da-ai
      que_fuente_lo_afirma: 'pane-c1498 cap. XXV: «Dios naboria daca» glosado «yo soy siervo de Dios»; oliver-1989-cap2
        p. 147: «/da-/ in da(i)tia-o is first person singular marker», y p. 136 sitúa /dA-/ en lokono, taíno y «perhaps
        Caquetío»'
      veredicto: MISMO MORFEMA — y es el paralelo mejor sostenido de los tres
      por_que: 'Es el único de la lista con atestación taína dentro del repo (Pané) y con la afirmación explícita
        de Oliver. ⚠️ Pero es exactamente el argumento de filiación que ya sostiene D11, y NO es exclusivo taíno-caquetío:
        el lokono lo tiene igual. Acerca al caquetío al par lokono-taíno frente al guajiro-paraujano (/tA-/), no
        al taíno en particular.'
      alerta: '⚠️ CHOQUE CON EL LEXICÓN, y hay que mirarlo: el repo tiene `daca` como `taíno-reconstruido` con la
        glosa ''mano'' (desde el lokono daka). La forma que Pané atestigua es `daca` ''yo''. No se toca nada aquí
        —esto propone—, pero el par homógrafo tiene que decidirlo Miguel.'
    - morfema_caquetio: -gua (locativo, 'región')
      capa_y_cita_caquetia: 'reconstruido, `deuda: sin-procedencia` (d21.7 → B, 2026-09-21). Su único apoyo escrito
        es «Topónimos venezolanos de Falcón y Sucre»; el canon lo sostiene con paragua = para ''mar'' + -gua'
      candidato_taino: gua- prefijo de nombres propios; y el -wa de bara-wa 'mar'
      que_fuente_lo_afirma: 'brinton-1871 p. impresa 12, s.v. Gua: «a very frequent prefix», citando a Pedro Mártir
        (Decad. p. 285) sobre que casi ningún nombre de rey empieza sin él; oliver-1989-cap2 p. 147: «/wa- [gua-]/
        is a third person plural marker». Y p. 150 da el taíno bara-wa ''mar'' junto al caquetío para-'
      veredicto: DOS MORFEMAS DISTINTOS con la misma sílaba — pero el bara-wa taíno es el mejor cabo suelto que
        tiene la campaña de -gua
      por_que: 'El gua- taíno que documentan Brinton y Oliver es un PREFIJO (3ª plural / formante de nombres propios);
        el -gua caquetío del canon es un SUFIJO locativo. Misma sílaba, posición contraria, función contraria: contar
        el uno como apoyo del otro sería la trampa de -kana. Lo que SÍ es paralelo real es otra cosa: taíno bara-wa
        ''mar'' y caquetío para-gua tienen la misma raíz ''mar'' y el mismo elemento detrás. Eso no prueba la glosa
        ''región'', pero es la primera pista independiente que la campaña d21.7 tiene.'
    - morfema_caquetio: -bana (locativo, 'cerro, sitio alto')
      capa_y_cita_caquetia: 'ATESTIGUADO, D9 resuelta con seis apoyos: zavala-reyes-2015 #26, gonzalez-batista-nombre-de-coro,
        velasco-2015-resistencia'
      candidato_taino: Agüey-bana (antropónimo) y pana-pe(n) 'fruto del pan'
      que_fuente_lo_afirma: 'oliver-1989-cap2 p. 148: «Taíno, for example, has pana-pe(n) for ''breadfruit'' and
        Agüey-bana as an anthroponym»'
      veredicto: MISMO FORMANTE, GLOSA DISTINTA — y la distinta es la nuestra
      por_que: 'Oliver pone el -bana caquetío, el -bana/-pana taíno, el a-pana guajiro ''hoja'' y el -bana lokono
        ''techo'' bajo una misma glosa: ''rodear, cubrir, extensión''. El canon del proyecto le dio a -bana ''cerro,
        sitio alto'' (D9) con apoyo caquetío propio. Las dos cosas pueden convivir —la nota ya deja viva la lectura
        ''ancho/llano'' de van Buurt para kabana, darubana y guacaubana— pero el paralelo taíno NO corrobora D9:
        empuja al otro lado.'
    - morfema_caquetio: -coa / -bakoa (postposición toponímica)
      capa_y_cita_caquetia: '-bacoa ATESTIGUADO (morfemas.yaml morfema-001: cinco topónimos glosados de Esteves
        1989 + alvarado-1921 vía van-buurt-2014 §10); migra a -bakoa con el corte, d21.14 A'
      candidato_taino: coa 'palo cavador'; barbacoa
      que_fuente_lo_afirma: 'oliver-1989-cap2 p. 149: «Taíno has the noun coa for the digging stick»; brinton-1871
        p. impresa 11 s.v. Barbacoa: «a loft for drying maize», del arahuaco burrabakoa «a place for storing provisions»'
      veredicto: NO ES EL MISMO MORFEMA — el coa taíno es un NOMBRE, no una postposición
      por_que: 'Oliver trae el coa taíno como apoyo SEMÁNTICO de que la postposición arahuaca -coa se aplica a lo
        puntiagudo, no como paralelo morfológico: un palo cavador es un sustantivo. Y barbacoa lo avisa el propio
        Oliver p. 151: «one must be careful about some terms (e.g. barbacoa) offered by the Spanish as ''native''
        Caquetío». Es tainismo llegado con el castellano, no herencia compartida.'
    - morfema_caquetio: -(h)o nominalizador solemne · gentilicio -ío
      capa_y_cita_caquetia: 'NO está en TODAS_LAS_REGLAS: el motor no lo tiene. Es dato de oliver-1989-cap2 pp.
        146-148, que lo ve en diao, datihao, boratio y en el propio kaket-ío'
      candidato_taino: -hu/-o taíno-lokono; y los gentilicios Luca-yo, Cigüa-yo
      que_fuente_lo_afirma: 'oliver-1989-cap2 p. 147: el sufijo nominalizador solemne /-(h)o/ «characteristic of
        both Taíno and Lokono»; y la n. 44 p. 148 atribuye la serie -ío/-yo a Gary Vescelius, **comunicación personal
        de 1982**: «Luca-yo, Cigüa-yo, Kaket-ío»'
      veredicto: PLAUSIBLE PARA -(h)o · NO CITABLE PARA -ío/-yo
      por_que: 'El nominalizador lo afirma Oliver en su propio texto y con ejemplos de las dos lenguas. La serie
        de gentilicios, en cambio, es una comunicación personal en nota al pie: no hay dato publicado detrás, no
        hay lista, y Lucayo y Ciguayo son exónimos coloniales. Es sugerente y NO es evidencia; escribirlo como apoyo
        sería inventar una clave foránea.'
    - morfema_caquetio: -(i)tiao / -ati de parentesco y alianza
      capa_y_cita_caquetia: '`datihao` está en el lexicón como caquetío-atestiguado; también `boratio` ''chamán''
        y `dato` ''fruto del cardón'''
      candidato_taino: guatiao / waitiao / watiao 'amigo, aliado'
      que_fuente_lo_afirma: oliver-1989-cap2 p. 147, citando a Las Casas [1552] 1929 II:291 sobre el trueque de
        nombres entre Ponce de León y el cacique Agueybana; brinton-1871 p. impresa 12 s.v. Guatiao «friend, companion»,
        del arahuaco ahati
      veredicto: MISMO MORFEMA según Oliver — pero es EL caso que la skill §8 manda tratar con cuidado
      por_que: 'Oliver escribe «This Taíno term is cognate to Caquetio daitiao». Y en la n. 42 de la p. 146 DUDA
        de que datihao sea caquetío: Oviedo hablaba de «los indios de la Provincia de Venezuela» en general y su
        larga residencia en La Española pudo hacerle usar taíno; concluye que probablemente fuera «equally shared
        by both Taíno and Caquetío». O sea: la voz más taína del caquetío puede ser taína a secas. Y Jahn, que parecía
        corroborarla, cita el mismo apéndice de Oviedo. El lexicón sigue teniéndola como caquetío-atestiguado sin
        la reserva.'
    - morfema_caquetio: ni- / nitaíno (prefijo pronominal)
      capa_y_cita_caquetia: el caquetío no declara ningún ni-
      candidato_taino: nitaíno 'noble, principal'
      que_fuente_lo_afirma: 'nadie: brinton-1871 p. impresa 14 lo DESMIENTE'
      veredicto: 🔴 FALSO — la fuente del repo rechaza expresamente el análisis
      por_que: 'Brinton, sobre nitainos: «There is not the slightest authority for this, nor for supposing, with
        Von Martius, that the first syllable is a pronominal prefix». Lo deriva del arahuaco nuddan ''estar firme,
        hacer algo bien''. El análisis ni- + taíno ya estaba descartado en 1871 por la misma obra de donde el lexicón
        sacó sus voces taínas.'
    - morfema_caquetio: -bo / -abo (formante toponímico)
      capa_y_cita_caquetia: Oliver cap. 2 p. 148 lo lista como «(e)-bo» entre los sufijos más comunes de la toponimia
        caquetía; el canon del proyecto NO lo tiene ni en morfemas.yaml ni en TODAS_LAS_REGLAS
      candidato_taino: —
      que_fuente_lo_afirma: nadie lo afirma del taíno en el repo. La sonda sobre los lemas de Brinton dice cuántos
        acaban en -bo (ver `medido`)
      veredicto: SIN PAREJA — y además es un hueco del propio canon caquetío
      por_que: 'Oliver lo declara para el caquetío y el proyecto nunca lo recogió; el taíno no tiene quien lo afirme.
        La fila existe para que el hueco quede escrito (regla 8: el hueco se admite, callarlo no).'

  # ── Deuda 4 · Inventario de la laguna de Guaranao con autoría ──────
  - id: h23
    deuda: 4
    fuente: 'Aular Leal, Luis (2014). «Guaranao, una quebrada convertida en laguna». El Falconiano, 31-01-2014 (reeditado en su blog el 2014-09); fotos de Oniel Gómez; experta consultada: Keysa Sánchez de González, ingeniera forestal (ULA), 33 años en el Ministerio del Ambiente, profesora de Ingeniería Ambiental en la Universidad de Falcón'
    url: http://luisaularleal.blogspot.com/2014/09/guaranao-una-quebrada-convertida-en.html
    autor: Luis Aular Leal (periodista) con Keysa Sánchez de González (ingeniera forestal)
    anio: 2014
    cita: >-
      «En su desembocadura inicialmente hubo una salina a la que se aprovechó
      desde la época precolombina» · «Fue en 1985 cuando el colector de aguas
      negras que pasa al margen norte de la quebrada se partió en un sector»
      · «Creció un frondoso manglar en el que habitan muchas especies
      animales y vegetales» · «En la década de 1970 fue decretado como Parque
      Metropolitano Guaranao, con administración del Instituto Nacional de
      Parques» · «La laguna tiene una profundidad máxima de apenas dos
      metros» · Sánchez de González: «Si se eliminan las aguas servidas que
      llegan a la laguna, desaparece todo el ecosistema que se ha
      desarrollado» · La Ordenanza sobre el Control y Preservación del Medio
      Ambiente del municipio Carirubana prohíbe verter aguas servidas a la
      laguna. Sin lista de especies.
    verificacion: fetchado directo (dos veces, la segunda pidiendo textual)
    etiqueta_propuesta: >-
      atestiguado-moderno (periodismo regional con experta nombrada) para
      1985, la profundidad, el decreto de los 70 y el manglar; «desde la
      época precolombina» es afirmación moderna sobre el pasado (regla 3),
      corroborada por Arcaya p. 22 sólo en cuanto a la salina.
    peso: >-
      ⭐⭐ El hallazgo del barrido. La laguna y el manglar que Miguel recuerda
      tienen 40 años: son hijos de un colector roto. Lo que había antes era
      una QUEBRADA con una SALINA en la boca. Para la era 2 eso invierte el
      sitio: el Guaranao del s. XV es sal, no manglar.


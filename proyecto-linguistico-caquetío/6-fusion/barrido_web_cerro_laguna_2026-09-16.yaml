deudas:

  deuda_1_piedras_del_almanaque:
    pregunta: '¿Existe una lectura publicada de los petroglifos del cerro de Siraba («Las Piedras del Almanaque», Esteves 1989 p. 60)?'
    consultas:
      - 'petroglifos cerro Santa Ana Paraguaná Falcón "Piedras del Almanaque"'
      - 'petroglifos Siraba Paraguaná Falcón arte rupestre'
      - '"Piedra de Siraba" Caguao Morón mitología simbología arqueoastronomía'
      - '"Piedras Parlantes de Siraba" OR "Piedra de Siraba" Caguao Morón petroglifo Santa Ana Paraguaná'
      - '"Piedra de la Teresa" OR "Piedra del Calendario" petroglifo Cerro Santa Ana Misaray Paraguaná'
      - '"Piedra de la Teresa" petroglifo Falcón manantial'
      - '"Capubana" petroglifo OR petroglifos OR "arte rupestre" OR estación Santa Ana Falcón'
      - '"Hernández Baño" petroglifos Falcón "Santa Ana" OR Siraba OR Paraguaná OR Misaray calendario'
      - '"Chamuriana" "Santa Ana" Boletín Antropológico Zavala Reyes arqueología Paraguaná toponimia indígena tradición oral'
      - 'redalyc 71241008006 Boletín Antropológico Falcón petroglifos Santa Ana'
      - 'Morón "Panorama geológico, paleontológico, arqueológico, histórico y mitológico del estado Falcón" Boletín Antropológico año número páginas'
      - '"Enrique Acasio" "Piedras Parlantes de Siraba" libro Coro Punto Fijo arqueoastronomía Paraguaná'
      - 'grep en el repo: Moron_2012 y ZavalaReyes_2018 (pdftotext) → siraba|santa ana|capubana|misaray|almanaque|calendario'
    hallazgos: [h01, h02, h03, h04, h05, h06, h07]
    ceros: [h08, h09]
    lo_que_no_se_encontro:
      - 'El nombre «Piedras del Almanaque» fuera del repo: 0 en todas las variantes. Es nombre de Esteves (o de sus informantes de 1989); hoy se dice «Piedra del Calendario», «Piedra de Misaray», «Piedra de Siraba», «estación Capubana».'
      - 'Que las cuatro denominaciones sean la MISMA piedra o el mismo conjunto: nadie lo dice; sólo la lectura de Acasio y de Caguao-Morón lo aclararía.'
      - 'Hernández Baño 2000 («Petroglifos. Estado Falcón») en línea: 0.'
      - 'Un inventario del IPC en línea con el código FAL-152: 0 (el código sólo aparece en el extracto de Morón 2015).'
      - 'Wikipedia es «Cerro Santa Ana (Paraguaná)»: 0 menciones de petroglifos (fetchado).'
    que_lo_subiria:
      - 'Descargar y leer Acasio 2023 (PDF de la revista) y BACOA 20 / Cruxentiana 16 (Drive): dan la lectura, el sitio exacto y, quizá, la equivalencia con las «Piedras del Almanaque».'
      - 'Descargar Morón 2015 (Redalyc, 2,5 MB, acceso abierto): registro de sitios del cerro con códigos del IPC y el nombre Chamuriana.'
    recomendacion: >-
      Fusionar la EXISTENCIA (estación «Capubana», Piedra del Calendario en el
      sendero de Misaray, Piedra de la Teresa junto a un manantial) como
      atestiguado-moderno en sitios_era2 §Capubana y como adición a la ficha
      monumento-cerro-santa-ana. NO fusionar la lectura calendárica: es
      hipotética hasta leerla, y aun leída seguirá siendo arqueoastronomía de
      autor (regla 2: en duda, degradar). La leyenda de Siraba va a CREENCIA
      como retro-abstraído, no a ARTE (decisión 2026-08-25). Pedir a Miguel
      autorizar las tres descargas.

  deuda_2_pluviometria_por_piso:

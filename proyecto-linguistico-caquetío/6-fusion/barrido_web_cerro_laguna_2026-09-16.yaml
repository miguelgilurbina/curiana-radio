      - 'Una estación del INAMEH/MARNR en el cerro o en el pueblo de Santa Ana con serie publicada: 0 (la web del INAMEH no expone series).'
      - 'Una tesis UNEFM/UCV sobre el bosque nublado del cerro: 0 en el índice web.'

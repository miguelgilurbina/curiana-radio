# ─────────────────────────────────────────────────────────────────────────
# BARRIDO WEB — las cuatro deudas del Capubana y de la laguna de Guaranao
#
# Pedido 2026-09-16 (Miguel, vía coordinador). Deudas declaradas en
# 6-fusion/capubana_agua_y_microclima.yaml, 6-fusion/sitios_era2.yaml
# (§Capubana y §laguna de Guaranao) y 4-fuentes/laguna-guaranao-parque.md.
#
# Regla 5: PROPONE. No toca 4-fuentes/, 3-mundo/corpus/, 2-lengua/ ni el motor.
# Las fichas que valen la pena están en 6-fusion/fichas_propuestas/ y las
# lista §fichas_propuestas de abajo (la BANDEJA no escanea esa carpeta:
# generar_bandeja.py sólo lee 6-fusion/*.yaml e issues-pendientes/*.md).
#
# Regla 6 a escala web (como en barrido_web_medina_2026-09-09.yaml): un cero
# mide la consulta y el índice, no la fuente. Cada cero lleva sus consultas.
#
# ⚠️ SIN DESCARGAS. Sólo WebSearch y WebFetch. Lo que existe sólo como PDF
# está en §descargas_a_autorizar con URL y tamaño cuando se vio. Efecto
# secundario a declarar: WebFetch guardó tres PDF en la caché de resultados
# de la herramienta (fuera del repo) al intentar leerlos; NO se abrieron ni
# se usaron. Rutas en §descargas_a_autorizar.efecto_secundario.
# ─────────────────────────────────────────────────────────────────────────
meta:
  fecha: '2026-09-16'
  quien: escriba (Claude), agente de rastreo web
  pedido_por: Miguel (vía coordinador)
  obra: 'barrido web (varias) — Capubana y laguna de Guaranao'
  estado: sin-fusionar
  metodo: >-
    WebSearch + WebFetch de páginas HTML y de APIs abiertas (GBIF, iNaturalist);
    lectura de los PDF que YA están en el repo con pdftotext al scratchpad
    (Morón 2012, Zavala Reyes 2018). Cita textual sólo de lo fetchado directo;
    lo que viene de un extracto del buscador se marca «por extracto».
  resumen: >-
    Deuda 1: SÍ hay lecturas publicadas de los petroglifos del cerro, tres y
    recientes (Acasio 2023 en Ciencia en Revolución; Caguao y Morón 2024/2025
    en BACOA/Cruxentiana; el libro «Piedras Parlantes de Siraba»), pero todas
    son arqueoastronomía de autor y ninguna se ha podido leer sin descargar.
    Nadie fuera de Esteves usa el nombre «Piedras del Almanaque»: los nombres
    vivos son «Piedra del Calendario» (sendero de Misaray), «Piedra de
    Misaray», «Piedra de Siraba» y «estación Capubana». Deuda 2: no existe en
    línea un dato pluviométrico por piso; lo que sí hay es el MECANISMO
    atestiguado por un climatólogo (Foghin 2014: «constante captación de agua
    directamente de las nubes» en las cumbreras) y el gradiente cualitativo
    de INPARQUES 1978 («la precipitación es mayor que en el piso xerofítico»);
    la cifra que circula (457,5 mm) no tiene fuente primaria. Deuda 3: el
    Libro Rojo (Seijas, Barros y Babarro 2015) da el caimán de la costa en
    Falcón ORIENTAL (Hueque, Cuare, Morrocoy) y en toda la costa «desde la
    Guajira hasta [...] Paria», pero NO nombra Paraguaná ni Guaranao; GBIF e
    iNaturalist dan CERO registros de Crocodylus acutus y de Caiman crocodilus
    en la península; la única base del «cocodrilo de la costa» de Wikipedia
    es una nota de prensa muerta. Deuda 4: no hay inventario institucional
    con autoría en línea; hay periodismo con experta nombrada (Aular Leal
    2014), una sentencia (2010) y un inventario medido de ciencia ciudadana
    (GBIF/eBird, 787 registros en el polígono de la laguna). Y un hallazgo
    que cambia la lectura del sitio: el manglar y la laguna nacen en 1985 de
    la rotura de un colector; el sitio precontacto era una salina en la
    desembocadura de una quebrada.

# ══════════════════════════════════════════════════════════════════════
# HALLAZGOS — un ítem por fuente, con su deuda, su cita y su etiqueta
# ══════════════════════════════════════════════════════════════════════
hallazgos:

  # ── Deuda 1 · Las Piedras del Almanaque ────────────────────────────
  - id: h01
    deuda: 1
    fuente: 'Acasio, Enrique (2023). «Decodificación de un calendario lunar metónico representado en un petroglifo geométrico de la estación Capubana, en el Cerro de Santa Ana. Edo. Falcón. Venezuela». Ciencia en Revolución, vol. 9, n.º 25 (enero-junio 2023)'
    url: https://cienciaenrevolucion.com.ve/index.php/cienciaenrevolucion/article/view/101
    autor: Enrique Acasio (ingeniero; la prensa del Mincyt/VTV lo da como líder del proyecto, con «estudios arqueoastronómicos [...] desde 2012»)
    anio: 2023
    cita: >-
      «El objeto del presente trabajo de investigación es publicar de manera
      preliminar la decodificación de un posible calendario astronómico lunar
      presente en un petroglifo de diseño geométrico-matemático en la estación
      de arte rupestre Capubana, en la falda del cerro de Santa Ana, en la
      Península de Paraguaná.» (resumen, página OJS fetchada directo)
    palabras_clave: [arte rupestre, petroglifos, Calzadas, metónico, arqueoastronomía, estado Falcón]
    verificacion: página OJS fetchada directo; el PDF (article/download/101/122/206) NO se descargó
    etiqueta_propuesta: >-
      atestiguado-moderno para la EXISTENCIA de una estación de arte rupestre
      llamada «Capubana» en la falda del cerro con un petroglifo geométrico;
      hipotético para la LECTURA (calendario lunar metónico): trabajo
      «preliminar», autor único, revista del Mincyt sin arbitraje conocido.
    peso: >-
      ⭐ Es la lectura publicada que la deuda pedía, y la estación lleva el
      nombre que el canon le da al cerro (D9). Falta leerla: sólo con el
      resumen no se sabe si «Capubana» es la misma estación que Esteves llama
      «Piedras del Almanaque» del cerro de Siraba (p. 60), ni de dónde sale el
      nombre. En el resumen no aparece «Siraba»; en el cuerpo, según el
      extracto, cita «Piedras Parlantes de Siraba» y «Piedra de Misaray».

  - id: h02
    deuda: 1
    fuente: 'Acasio, Enrique. «Piedras Parlantes de Siraba» (libro de arqueoastronomía; prólogo de la Lic. María Gracia Gómez Ollarves; presentado en el Parque Metropolitano de Punto Fijo el 26-27 de septiembre de 2014 y exhibido en librerías de Coro y Punto Fijo)'
    url: https://obrasliterariasacasio.wordpress.com/piedras-parlantes-de-siraba/
    autor: Enrique Acasio
    anio: '2013-2014 (fotos de 2013; presentación 2014)'
    cita: >-
      Del prólogo: «el aporte que se hace con este material da un paso
      adelante en la continuidad de la preservación del legado que la
      naturaleza, la historia y la mano del hombre primitivo trazaron sobre
      las rocas». La página no trae el texto del libro. Otras obras del mismo
      autor que la web enumera: «Piedra de Misaray: Calendario Perpetuo
      Luni-solar» y «Cielo Ancestral. Decodificación de la manifestación
      rupestre de los Santos – El Mestizo».
    verificacion: página fetchada directo (sólo prólogo y fotos)
    etiqueta_propuesta: hipotético (obra de divulgación de autor único; texto no accesible)
    peso: >-
      Confirma que «Siraba» es el nombre bajo el que se publican las piedras
      del cerro. Sin texto no se puede citar nada de la lectura.

  - id: h03
    deuda: 1
    fuente: 'Caguao, Alfredo y Morón, Camilo. «La Piedra de Siraba: Mitología, Simbología y Arqueoastronomía». BACOA (revista interdisciplinaria de ciencias y artes, Santa Ana de Coro), n.º 20, 19-08-2024, p. 210; reeditado en Cruxentiana n.º 16, 21-01-2025, p. 280'
    url: https://revistabacoa.blogspot.com/2024/08/bacoa-20.html
    url_2: https://cruxentiana.blogspot.com/2025/01/cruxentiana-16.html
    autor: Alfredo Caguao y Camilo Morón (Morón es el autor de moron-2012-petroglifos, ya auditado)
    anio: '2024 (BACOA) / 2025 (Cruxentiana)'
    cita: >-
      Sólo el título, los autores y la página figuran en la web; el número
      entero está en Google Drive (BACOA 20: id 1gFv1lIj3o2h2Z_AjqYImzdr8gtkX9DfM;
      Cruxentiana 16: id 1D_7V6uhyTI-wV20_4jy5cObDAVUa6VGM). Ninguna de las dos
      páginas da ISSN, director ni depósito legal.
    verificacion: índices de ambos números fetchados directo; texto NO descargado
    etiqueta_propuesta: pendiente de lectura; por el título, mezcla mito (retro-abstraído), simbología y arqueoastronomía (hipotético)
    peso: >-
      ⭐ La segunda lectura publicada, y con Morón detrás: el autor cuya cadena
      de custodia el proyecto ya conoce. Es la que más vale la pena leer,
      porque el título promete separar mito de lectura, que es exactamente la
      división ARTE / CREENCIA decidida el 2026-08-25.

  - id: h04
    deuda: 1
    fuente: 'Morón, Camilo (2015). «Panorama geológico, paleontológico, arqueológico, histórico y mitológico del estado Falcón». Boletín Antropológico (ULA), año 33, n.º 89, enero-junio 2015, pp. 104-126'
    url: https://www.redalyc.org/pdf/712/71241008006.pdf
    url_2: http://erevistas.saber.ula.ve/index.php/boletin_antropologico/article/view/21065/0
    autor: Camilo Morón (UNEFM)
    anio: 2015
    cita: >-
      Por extracto del buscador (el PDF no se leyó): el cerro Santa Ana «o
      Chamuriana según la toponimia indígena conservada en la tradición oral
      de la península»; el «monolito de Siraba»; el «cementerio y petroglifo
      de Machuruca-Misaray (FAL-152)».
    verificacion: por extracto del buscador; la página HTML de Redalyc devolvió plantilla vacía y el OJS de la ULA rechazó la conexión; la referencia bibliográfica (año, número, páginas) la dio el índice del OJS por buscador
    etiqueta_propuesta: >-
      atestiguado-moderno para el REGISTRO de sitios (código FAL-152 sugiere
      inventario del IPC); retro-abstraído para «Chamuriana» como nombre
      indígena del cerro (tradición oral moderna).
    peso: >-
      ⭐⭐ Ya estaba como pista en petroglifos_y_manaure.yaml §9 sin saber que
      hablaba del cerro. Es del MISMO número 89 que zavala-reyes-2015. Da el
      código de sitio del petroglifo de Misaray y nombra al cerro Chamuriana,
      que es el nodo de la era 2. Descarga a autorizar; acceso abierto.

  - id: h05
    deuda: 1
    fuente: 'Aular Leal, Luis (2014-09-19). «Cerro Santa Ana, tesoro geológico de Paraguaná». Blog «Periodismo, historia e investigación» (periodista falconiano; cita al guardaparques José Núñez)'
    url: http://luisaularleal.blogspot.com/2014/09/cerro-santa-ana-tesoro-geologico-de.html
    autor: Luis Aular Leal
    anio: 2014
    cita: >-
      «La existencia de petroglifos, especialmente por el sendero de Misaray,
      donde se encuentra la llamada 'Piedra del Calendario' y otras
      demostraciones gráficas sobre roca son evidencia de la huella caquetía
      en territorio peninsular.»
    verificacion: fetchado directo
    etiqueta_propuesta: atestiguado-moderno para el nombre popular «Piedra del Calendario» y su sitio (sendero de Misaray); la atribución caquetía es afirmación periodística, no datación
    peso: >-
      Une el nombre vivo con el sendero. «Piedra del Calendario» ≈ «Piedras
      del Almanaque» de Esteves es una ecuación PLAUSIBLE (mismo cerro, mismo
      campo semántico) pero no probada: Esteves las sitúa en el cerro de
      Siraba, «unido al cerro de Santa Ana por el lado Noreste».

  - id: h06
    deuda: 1
    fuente: 'INPARQUES, «Monumento Natural Cerro Santa Ana» (página institucional; devuelve 404 desde el 2026-09-14)'
    url: https://www.inparques.gob.ve/monumento-natural-cerro-santa-ana/
    autor: INPARQUES
    anio: s. f.
    cita: >-
      Por extracto del buscador: el petroglifo llamado «Piedra de la Teresa»
      está sobre una roca de aproximadamente dos metros de altura, a orillas
      de un manantial, y no tiene representaciones zoomorfas ni antropomorfas
      como los otros petroglifos del país.
    verificacion: por extracto del buscador (dos consultas distintas devolvieron el mismo extracto); la página sigue en 404
    etiqueta_propuesta: atestiguado-moderno por extracto (misma calidad que las frases de INPARQUES ya citadas en monumento-cerro-santa-ana)
    peso: >-
      ⭐ Un petroglifo JUNTO A UN MANANTIAL del cerro: es el único dato que
      liga físicamente piedra escrita y agua en el Capubana. Propuesta de
      adición a la ficha monumento-cerro-santa-ana (§Qué da).

  - id: h07
    deuda: 1
    fuente: 'Centro de Historia de Paraguaná (blog), «Santa Ana de Paraguaná… historia, mitos y leyendas», junio de 2012 (sin autor firmado)'
    url: http://centrodehistoriadeparaguana.blogspot.com/2012/06/santa-ana-de-paraguanahistoria-mitos-y.html
    autor: Centro de Historia de Paraguaná (anónimo)
    anio: 2012
    cita: >-
      «Cuentan que Siraba danzaba a los pies del Cerro Santa Ana todos los
      domingos, Día del Señor, ritual al que los indígenas le atribuían
      poderes para que las lluvias llegaran al poblado». Y de Chamuriana:
      «asentamiento indígena ubicado en las faldas del cerro Santa Ana, donde
      hoy día se encuentran -a flor de suelo- valiosos restos de cerámica
      precolombina».
    verificacion: fetchado directo
    etiqueta_propuesta: 'retro-abstraído (leyenda moderna con marco cristiano: «domingos, Día del Señor», visión de Santa Ana); NO proyectar al precontacto'
    peso: >-
      Para CREENCIA, no para ARTE: la tradición viva asocia a «Siraba» con un
      rito de LLUVIA al pie del cerro. Es la misma asociación cerro-agua de
      la hipótesis de Miguel, pero en versión de leyenda de pueblo, con
      fecha del s. XX-XXI. Vale como rastro, no como dato.

  - id: h08
    deuda: 1
    fuente: 'Morón 2012, «Petroglifos en Falcón: entre la roca y la memoria» (PDF ya en el repo, leído con pdftotext)'
    url: https://www.redalyc.org/pdf/712/71226816005.pdf
    autor: Camilo Morón
    anio: 2012
    cita: 'grep -i «siraba|santa ana|capubana|misaray|almanaque|calendario|buenevara|chirache|moruy|caguao» → 0 líneas; «paraguan» → 3 líneas, todas genéricas (la península, Arcaya)'
    verificacion: medido en el repo (fuentes_caquetios/Moron_2012_Petroglifos_Falcon.pdf → scratchpad)
    etiqueta_propuesta: cero verificado
    peso: >-
      Responde la pregunta de sitios_era2 («comprobar si el inventario de
      Morón 2012 para Falcón incluye Siraba»): NO. El inventario de 2012 no
      cubre el cerro; el de 2015 (h04) sí.

  - id: h09
    deuda: 1
    fuente: 'Zavala Reyes, Miguel (2016). «Registro y documentación de los petroglifos de la quebrada de Chirache-Buenevara, estado Falcón». Boletín Antropológico, vol. 33, n.º 90, pp. 37-51'
    url: https://www.redalyc.org/jatsRepo/712/71243364003/html/index.html
    autor: Miguel Zavala Reyes
    anio: 2016
    cita: >-
      «La mayor altitud se observa en el Cerro Santa Ana (830 metros en su
      cúspide).» Estaciones que enumera para la península: «Están en la línea
      costera de la Península de Paraguaná, en El Supí, Adícora...». Registro
      «de acuerdo con los instrumentos diseñados por el Instituto de
      Patrimonio Cultural (IPC)». Bibliografía sin Siraba, Caguao ni
      Hernández Baño.
    verificacion: fetchado directo (HTML Redalyc)
    etiqueta_propuesta: cero verificado para Siraba; atestiguado-moderno para el método IPC
    peso: 'Zavala Reyes, el autor del 74 % de las citas del lexicón, también registra petroglifos en Paraguaná (Buenevara), pero no los del cerro.'

  # ── Deuda 2 · Pluviometría del cerro por piso ──────────────────────
  - id: h10
    deuda: 2
    fuente: 'Foghin-Pillin, Sergio (2014). «Evidencias de dos sistemas de circulación a meso-escala en la península de Paraguaná, Venezuela». Revista Catalana de Geografia, IV època, vol. XIX, n.º 48, marzo 2014. Departamento de Ciencias de la Tierra, UPEL-Instituto Pedagógico de Caracas'
    url: https://rcg.cat/contingut/evidencias-de-dos-sistemas-de-circulacin-a-meso-escala-en-la-pennsula-de-paraguan-venezuela
    autor: Sergio Foghin-Pillin (climatólogo, UPEL)
    anio: 2014
    cita: >-
      «En las cumbreras del cerro Santa Ana, debido a la constante captación
      de agua directamente de las nubes, la vegetación es de selva nublada,
      en marcado contraste con los elementos xerofíticos característicos de
      la mayor parte de la superficie peninsular.» · «Los totales anuales de
      precipitación disminuyen, en líneas generales, de este a oeste y
      promedian entre 500 y 250 milímetros, aproximadamente.» · «una
      evaporación cercana a los 2.000 milímetros anuales» · «Los vientos
      alisios, con direcciones entre el ENE y el ESE, soplan hacia tierra en
      la franja litoral oriental.» · Estación usada: Aeropuerto Josefa
      Camejo, 2012-2013.
    verificacion: fetchado directo (HTML de la revista)
    etiqueta_propuesta: atestiguado-moderno (climatólogo, revista académica catalana, texto directo)
    peso: >-
      ⭐⭐ Es el eslabón que faltaba en su versión de MECANISMO: la cumbre
      capta agua «directamente de las nubes» (lluvia horizontal, en la
      terminología del proyecto «neblina»). NO mide cuánto llueve en el cerro
      frente al llano: la cadena queda con el mecanismo atestiguado y la
      magnitud hipotética.

  - id: h11
    deuda: 2
    fuente: 'Tamayo, Francisco (1971). «El Cerro Santa Ana de Paraguaná, Monumento Natural». Defensa de la Naturaleza 3:35-40'
    url: https://es.wikipedia.org/wiki/Vertebrados_terrestres_del_Cerro_Santa_Ana_(Paraguan%C3%A1)
    autor: Francisco Tamayo (botánico; es la misma vía por la que Antolínez llega al dueño Capo, antolinez-1946)
    anio: 1971
    cita: >-
      Vía Wikipedia es («Vertebrados terrestres del cerro Santa Ana»), que lo
      cita como referencia [5] para los cinco pisos: xerofítico (espinar,
      ~300 m de banda), tropofítico (bosque caduco montano, ~250 m),
      hidrofítico mesotérmico (selva nublada, ~150 m; «vegetación exuberante»,
      suelo pantanoso con detritus y humus, árboles de 10-15 m), matorral
      antillano (~100 m) y seudoparamero (~50 m).
    verificacion: segunda mano (Wikipedia cita a Tamayo; el artículo de 1971 no está en línea)
    etiqueta_propuesta: atestiguado-moderno de segunda mano; fuente primaria a localizar en biblioteca
    peso: >-
      Es el origen de los «cinco pisos» que INPARQUES, MINEC y Wikipedia
      repiten. Con las bandas se puede decir dónde empieza la selva nublada
      (~550 m según WWF, h14) sin cifra de lluvia.

  - id: h12
    deuda: 2
    fuente: 'INPARQUES / Ministerio del Ambiente y de los Recursos Naturales Renovables (1978). «Parques Nacionales y Monumentos Naturales de Venezuela», Caracas, diciembre de 1978 — transcrito por costadevenezuela.com (2009-05-04)'
    url: https://costadevenezuela.com/2009/05/04/monumento-natural-cerro-santa-ana/
    autor: INPARQUES/MARNR (1978), vía blog
    anio: 1978 (transcripción 2009)
    cita: >-
      «En la parte Sur del Cerro nace un manantial que corre por una quebrada
      de frondosa vegetación.» · Del piso tropofítico: «El clima es menos
      caluroso y la precipitación es mayor que en el piso xerofítico.» · Junto
      al manantial crecen «contrayerba, cayube, turagua y orumo». · Selva
      nublada: «una vegetación exuberante, con frondosos árboles de 10 a 15
      m. de altura», suelo pantanoso.
    verificacion: fetchado directo (la transcripción declara su fuente de 1978)
    etiqueta_propuesta: 'atestiguado-moderno (institucional 1978, transcrito por un blog: verificar en el original si aparece)'
    peso: >-
      ⭐ Da el GRADIENTE cualitativo («la precipitación es mayor») y localiza
      un manantial permanente en la cara SUR del cerro, con nombre de sus
      plantas. Es la «fuente intermitente» de Arcaya, 58 años después y en
      documento del Estado. Ojo: ya lo citaba barrido_web_medina_2026-09-09
      para fauna y flora, sin haber visto el pasaje del agua.

  - id: h13
    deuda: 2
    fuente: 'La cifra «457,5 mm»: Haiman El Troudi (blog, 2022-09-27) y Wikipedia es «Vertebrados terrestres del cerro Santa Ana» (sin referencia adjunta)'
    url: https://haimaneltroudi.com/cerro-santa-ana-majestuoso-y-sobresaliente-monumento-natural/
    autor: Haiman El Troudi (ex ministro; blog sin fuente citada) / Wikipedia
    anio: 2022
    cita: >-
      «Posee una precipitación media anual de 457,5 mm y vientos del este al
      noreste; así como dos estaciones climáticas bien definidas, la
      temporada de lluvias (septiembre – enero) y la estación seca (febrero –
      agosto).» · «En los alrededores del Monumento Natural Cerro Santa Ana el
      clima es semiárido, con temperaturas de 22º C en las zonas altas y de
      35º C en las zonas bajas, durante el día.» · «hospeda subcuencas que
      proveen de agua los acuíferos subterráneos». Wikipedia: «La Serranía de
      Santa Ana posee una precipitación media anual de 457,5 mm y una
      temperatura media anual de 27 °C» (sin referencia).
    verificacion: ambas páginas fetchadas directo; la búsqueda «"457,5 mm" "Santa Ana" Paraguaná» no devolvió fuente primaria
    etiqueta_propuesta: hipotético como CIFRA (sin estación, sin período, sin autor); la comparación sí es sugerente
    comparacion: >-
      Si fuera cierta, el cerro (457,5) recibiría un 35-45 % más que el llano:
      Punto Fijo 320 mm (climatedata.org vía en.wikipedia «Punto Fijo»),
      península 340,2 mm (Foghin-Pillin, «Tiempo y Clima en Venezuela», UPEL,
      p. 32, vía es.wikipedia «Península de Paraguaná»), Montecano 319 mm
      (montecano-reserva), Coro 380-417 (ecologia-005). Y «vientos del este
      al noreste» concuerda con Foghin (ENE-ESE).
    peso: 'Una cifra que todos repiten y nadie firma. No sube nada; orienta dónde buscar (una estación «Santa Ana» del MARNR/INAMEH).'

  - id: h14

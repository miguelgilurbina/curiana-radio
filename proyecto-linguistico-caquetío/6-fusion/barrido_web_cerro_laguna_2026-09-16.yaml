    recomendacion: >-
      Partir el eslabón hipotético de capubana_agua_y_microclima.yaml en dos:
      (a) MECANISMO — la cumbre capta agua «directamente de las nubes» (Foghin
      2014, h10) y la selva nublada se forma a baja altura por masas de aire
      marino húmedas (FEP, h15, por extracto): sube a atestiguado-moderno;
      más el gradiente cualitativo de INPARQUES 1978 («la precipitación es

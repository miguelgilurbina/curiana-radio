hallazgos_laterales:
  - id: lat-capubana-nombre-vivo
    que: >-
      «Capubana» es el nombre VIVO de una estación de arte rupestre en la
      falda del cerro (Acasio 2023; prensa del Mincyt/VTV). El canon usa
      Capubana como nombre del cerro (D9, -bana) por Esteves; ahora hay un
      uso moderno independiente, anterior al proyecto (2023 < 2026), que lo
      sitúa en la falda y no en la cumbre.
    destino: 'campaña de topónimos (skill campana-toponimos: un nombre vivo es dato); lectura pendiente de toponimo del cerro'
  - id: lat-chamuriana-nombre-oral
    que: >-
      Morón 2015 (por extracto) da «Chamuriana» como nombre indígena del
      cerro «conservado en la tradición oral de la península»; el Centro de
      Historia de Paraguaná (2012) lo da como asentamiento al pie del cerro
      con «restos de cerámica precolombina» a flor de suelo. El nodo
      CHAMURIANA de la era 2 gana un apoyo toponímico moderno (retro-abstraído).
    destino: sitios_era2 §Chamuriana; campaña de topónimos
  - id: lat-dos-venados
    que: >-
      Wikipedia es «Vertebrados terrestres del cerro Santa Ana» (con 93
      referencias) da DOS cérvidos en el cerro: Mazama gouazoubira (venado
      cariaquito) y Odocoileus virginianus (venado caramerudo). La ficha
      monumento-cerro-santa-ana y matacan_venado_2026-09-14.yaml hablan sólo
      del «venado matacán (Mazama)».
    destino: matacan_venado_2026-09-14.yaml; ecología del Capubana
  - id: lat-maba-en-guaranao
    que: 'Melipona favosa (la abeja «maba» del dictado de Medina) tiene 11 registros en GBIF dentro del polígono de la laguna de Guaranao.'
    destino: barrido_web_medina_2026-09-09.yaml (maba ya subió a A; esto es una localidad más)
  - id: lat-boletin-89
    que: 'Morón 2015 sale en el MISMO número 89 del Boletín Antropológico que zavala-reyes-2015. El filón del Boletín (petroglifos_y_manaure.yaml §9) tiene ya tres piezas del proyecto en dos números.'
    destino: petroglifos_y_manaure.yaml §9 (marcar h04 como localizado con referencia completa)


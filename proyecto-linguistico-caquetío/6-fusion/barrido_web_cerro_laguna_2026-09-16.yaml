      - 'Una tesis de la UNEFM o de la Universidad de Falcón (Keysa Sánchez de González es la persona a preguntar).'
    recomendacion: >-
      No hay reemplazo institucional; hay COMPLEMENTO con autoría: Aular Leal
      2014 (h23, con experta) + sentencia 2010 (h24) + GBIF/eBird (h25). Y lo
      que sí cambia el canon: la laguna, el manglar, los peces y el eventual
      caimán son un ecosistema POST-1985 (h23, y Wikipedia lo insinuaba con
      «en la década de 1970 era una salina»). Regla 3: en sitios_era2 §laguna
      de Guaranao, marcar manglar/caimán/peces como «capa moderna, post-1985»
      y NO proyectarlos al s. XV; lo que se proyecta es la SALINA en la boca
      de la quebrada (Arcaya p. 22; Aular Leal «desde la época precolombina»
      como afirmación moderna). El nodo GUARANAO de la era 2 es un nodo de
      sal y ensenada, no de manglar. Es decisión de Miguel: los cuatro
      testimonios suyos del 2026-09-14 describen el sitio que él vio, y ese
      sitio no existía antes de 1985.


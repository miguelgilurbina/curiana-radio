recomendaciones_de_fusion:
  - orden: 1
    que: 'Deuda 4 primero: decidir la capa temporal de la laguna de Guaranao (post-1985) en sitios_era2 y en la ficha laguna-guaranao-parque; fusionar aular-leal-2014-guaranao y gbif-ebird-laguna-guaranao como fuentes.'
    por_que: 'Es lo único del barrido que cambia el canon en vez de completarlo: el sitio del nodo GUARANAO no es el que se describió.'
    decide: Miguel
  - orden: 2
    que: 'Deuda 3: degradar C. acutus en Guaranao a hipotético; fusionar seijas-2015-caiman-libro-rojo.'
    por_que: 'Una entrada atestiguado-moderno descansa en una nota de prensa muerta. Regla 2.'
    decide: Miguel (es re-etiqueta)
  - orden: 3
    que: 'Deuda 2: partir el eslabón hipotético en mecanismo (atestiguado-moderno: foghin-2014, INPARQUES 1978) y magnitud (hipotético); fusionar foghin-2014-circulacion-paraguana; anotar 457,5 mm como cifra sin fuente.'
    por_que: 'La cadena del Capubana pasa de «todo menos uno» a «todo, con la magnitud sin medir». Es honesto y es más fuerte.'
    decide: escriba puede proponer el texto; Miguel fusiona
  - orden: 4
    que: 'Deuda 1: fusionar la existencia de los petroglifos con nombre (estación Capubana, Piedra del Calendario/Misaray, Piedra de la Teresa junto al manantial) como atestiguado-moderno; autorizar las tres descargas (Acasio 2023, BACOA 20, Morón 2015) antes de decir nada de la lectura; la leyenda de Siraba a CREENCIA como retro-abstraído.'
    por_que: 'Lectura sin leer no se fusiona. Existencia sí.'
    decide: Miguel (descargas)

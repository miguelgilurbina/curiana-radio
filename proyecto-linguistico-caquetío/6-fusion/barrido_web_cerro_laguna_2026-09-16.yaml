      manglares como las ciénagas de los Olivitos, el río Limón (Zulia);
      Hueque, Cuare y Morrocoy (Falcón) y Laguna de Tacarigua (Miranda)
      (Maness 1982, Medem 1983, Pirela 1991, Arteaga y Herrera 1997, Barros

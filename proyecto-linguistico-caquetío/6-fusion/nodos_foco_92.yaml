  - fal: FAL-112
    forma: el-manglar
    nombre_oliver: "El Manglar East/West camp sites"
    region: coro-golfete
    afiliacion: "Neoindio"
    precontacto_propuesto: desconocido
    nota: >
      "Camp sites" — campamentos, no poblado. Si se confirma, es el primer

# PROPUESTA DE FUSIÓN A 3-mundo/asentamientos.yaml — #92
# ======================================================
# Los 17 sitios del Apéndice E de Oliver que son COSTEROS (Coro-Golfete o
# Paraguaná) Y caen dentro o cerca de la ventana simulada (s. XIV-XV).
# Un minador propone, el humano fusiona (regla 5).
#
# POR QUÉ ESTOS 17 Y NO LOS 134: el registro de nodos solo admite lo que tiene
# evidencia citable y pertenece a la esfera. Los otros 119 son costa occidental
# (¿misma polity?), sierra, Falcón oriental, o están fuera de época. (Los otros 117.)
#
# ─────────────────────────────────────────────────────────────────────────
# LA DISCRIMINACIÓN QUE HACE POSIBLE ESTE CIERRE
# ─────────────────────────────────────────────────────────────────────────
# "Dabajuroide" NO es una fecha, y no todas sus afiliaciones valen igual.
# Con las fechas calibradas que Oliver publica en el cap. 4 (p. 440 y ss.):
#
#   Túcua                ISGS-1173   A.D.  783-[944]-998     ANTERIOR
#   Urumaco Temprano     ISGS-1255   A.D. 1164-[1257]-1279   entra
#   Urumaco (Corralito)  ISGS-1184   concuerda con ISGS-1255 entra
#   Urumaco Tardío       ISGS-1257   A.D. 1278-[1336]-1393   ENTRA DE LLENO
#   Los Médanos A/B                  A.D. 1350-1600/1650     CRUZA EL CONTACTO
#
# Por tanto:
#   · afiliación "Urumaco Complex"  → termina ~1393/1450: PRECONTACTO por
#     definición del complejo. Es lo más fuerte que hay sin datación propia.
#   · afiliación "Los Médanos"      → cruza 1499: no decide nada por sí sola.
#   · "Dabajuroid" a secas (800-1600) → tampoco decide. `desconocido`.
#   · "Neoindian" sin complejo      → aún menos. `desconocido`.
#
# Esto responde a la advertencia que el propio asentamientos.yaml lleva en su
# cabecera: "ningún nodo continental tiene precontacto: si". Cuatro de estos
# quince pueden cambiarlo, y por la vía correcta — arqueología, no documento.

meta:
  para: 3-mundo/asentamientos.yaml
  issue: 92
  obra_base: oliver-1989-cap4
  detalle_base: "Apéndice E, pp. impresas 747-749; fechas del cap. 4 p. 440"
  generado: '2026-08-17'
  sitios: 17   # medido, no a mano (regla 1): corregido 2026-08-24, decia 15
  advertencia: >
    Ninguna de estas entradas trae coordenadas del Apéndice E. Las únicas
    coordenadas verificadas del registro son las de Tamers 1970 (IVIC-626 en
    11°26'N 69°40'O; IVIC-673 en 12°9'N 69°57'O). Las de Oliver habría que
    sacarlas de su Figura 77, que es un mapa y no se ha extraído.

# ══ Coro y el Golfete ═══════════════════════════════════════════════════

sitios:

  - fal: FAL-101
    forma: la-maternidad
    nombre_oliver: "Monumento a la Madre / La Maternidad / LM-1"
    region: coro-golfete
    complejo: "Los Médanos y Urumaco"
    precontacto_propuesto: si
    precontacto_razon: >
      ES EL CANDIDATO MÁS FUERTE DEL REGISTRO. Tres fuentes independientes
      convergen en el mismo punto del terreno: (1) Oliver lo registra con
      componentes Urumaco Y Los Médanos; (2) Tamers 1970 p. 512 lo data —es
      "La Maternidad Sur", IVIC-626, 500±60 BP = A.D. 1450— y Cruxent anota
      que VOLVIÓ AL SITIO y "we were unable to find any trace of European
      artifacts"; (3) Zavala Reyes et al. 2018 excava el área (MCa/1-9,
      Plaza de la Madre) y halla un antrosol de 36 cm sin cerámica híbrida.
      Una fecha dentro de la ventana + ausencia de material europeo declarada
      por el excavador + antrosol de ocupación prolongada.
    cautela: >
      La muestra de Tamers es carbón de SUPERFICIE en dunas activas, no de
      estratigrafía sellada. Y el mismo sitio tiene IVIC-625 (A.D. 1750) unos
      metros al norte: es un lugar reocupado, no un depósito puro.
    procedencia:
      obra: oliver-1989-cap4
      detalle: "Apéndice E FAL-101; fechas en Tamers 1970: 512; excavación en zavala-reyes-2018"
    cruces: [zavala-reyes-2018, tamers-1970]

  - fal: FAL-100
    forma: jose-gregorio-hernandez
    nombre_oliver: "José Gregorio Hernández / GH-1"
    region: coro-golfete
    complejo: "Los Médanos y Urumaco"
    precontacto_propuesto: si
    precontacto_razon: >
      ✅ LAS TRES FECHAS LOCALIZADAS (Table 15 del cap. 4, recalibrada con OxCal
      v3.10). Dos caen DENTRO de la ventana simulada y una es colonial:
        ISGS-1253 (Sector 1)  570±70 BP  → cal. A.D. 1299-[1363]-1424
        ISGS-1423 (Sector NW) 550±110 BP → cal. A.D. 1280-[1407]-1440
        ISGS-1424 (Sector 2)  330±110 BP → cal. A.D. 1521-[1572]-1641
      Dos dataciones propias en el s. XIV-XV, en sectores distintos del sitio.
      Ya no es inferencia por complejo cerámico: son fechas.
    cautela: >
      El sitio fue REOCUPADO: ISGS-1424 es colonial. Un nodo con ocupación
      precontacto **y** posterior; al ponerlo en escena hay que usar la capa,
      no el sitio entero. De FAL-100 Sector-2 procede además el cuenco de Los
      Médanos-B con motivo zoomorfo en espiral (Fig. 86).
    procedencia: {obra: oliver-1989-cap4, detalle: "Apéndice E FAL-100"}

  - fal: FAL-099
    forma: los-medanos-oeste-1
    nombre_oliver: "Los Médanos West-1"
    region: coro-golfete
    complejo: "Urumaco"
    precontacto_propuesto: probable
    precontacto_razon: >
      Afiliación Urumaco pura, sin componente Los Médanos: el complejo termina
      hacia 1393/1450, antes del contacto. Sin datación propia.
    procedencia: {obra: oliver-1989-cap4, detalle: "Apéndice E FAL-099"}

  - fal: FAL-111
    forma: la-posta
    nombre_oliver: "La Posta A through C"
    region: coro-golfete
    complejo: "Urumaco, Dabajuroide"
    precontacto_propuesto: probable
    precontacto_razon: "Urumaco + la lista marca C-14 (cf. Tamers 1965)."
    nota: >
      La Table 15 declara sus fuentes: "Sources for IVIC: Tamers 1965, 1967".
      Oliver ya publicó las fechas IVIC recalibradas, así que Tamers 1965 deja
      de ser bloqueante — sigue valiendo para el contexto de cada muestra.
    procedencia: {obra: oliver-1989-cap4, detalle: "Apéndice E FAL-111"}

  - fal: FAL-106
    forma: tara-tara
    nombre_oliver: "Tara-tara cemetery"
    region: coro-golfete
    complejo: "Dabajuroide"
    precontacto_propuesto: desconocido
    precontacto_razon: >
      "Dabajuroide" a secas abarca 800-1600: cruza el contacto y no decide.
      Interesa igual porque es CEMENTERIO — el corpus tiene rito funerario de
      crónica y aquí habría material.
    procedencia: {obra: oliver-1989-cap4, detalle: "Apéndice E FAL-106"}

  - fal: FAL-103
    forma: la-vela
    nombre_oliver: "La Vela"
    region: coro-golfete
    complejo: "Dabajuroide"
    precontacto_propuesto: desconocido
    nota: >
      El lexicón tiene `todarahuato` = 'indígena de La Vela'. El nodo-001
      (todariquiba) advierte que NO se ha demostrado relación entre ambos: este
      registro no la asume tampoco.
    procedencia: {obra: oliver-1989-cap4, detalle: "Apéndice E FAL-103"}

  - fal: FAL-109

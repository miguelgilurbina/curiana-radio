    procedencia: {obra: oliver-1989-cap4, detalle: "Apéndice E FAL-112"}

# ══ Península de Paraguaná ══════════════════════════════════════════════

  - fal: FAL-154
    forma: santa-ana-el-cerro
    nombre_oliver: 'Santa Ana ["El Cerro"]-1'
    region: paraguana
    complejo: "Urumaco"
    precontacto_propuesto: si
    precontacto_razon: >
      ⭐ EL MEJOR SOSTENIDO DE TODO EL REGISTRO. Tres dataciones propias en la
      Table 15, TODAS precontacto, cubriendo tres siglos de ocupación continua:
        IVIC-18  790±100 BP → cal. A.D. 1160-[1257]-1280
        IVIC-16  730±110 BP → cal. A.D. 1210-[1278]-1387
        IVIC-14  520±120 BP → cal. A.D. 1299-[1415]-1451
      La última la obtuvo Zucchi (com. pers.) y Oliver la llama "a terminal
      date… of cal. A.D. 1415". Su cerámica es Late Urumaco "still lavishly
      decorated", que Oliver contrapone al estilo empobrecido contemporáneo de
      Supidebo-Antúnez: es un sitio de plena vitalidad en la ventana simulada.
      Y cruza con Esteves, que describe una "antigua aldea indígena en cuyas
      cercanías los españoles fundaron en 1538 el pueblo de Santa Ana de
      Paraguaná", con "restos de cerámica indígena y europea".
    cautela: >
      Esteves llama al sitio Chamuriana; Oliver lo registra como Santa Ana
      "El Cerro". Hay que confirmar que hablan del mismo lugar antes de fundir
      las dos evidencias en un nodo.
    procedencia: {obra: oliver-1989-cap4, detalle: "Apéndice E FAL-154"}
    cruces: [esteves-1989]

  - fal: FAL-143
    forma: cayerua
    nombre_oliver: "Cayerúa"
    region: paraguana
    complejo: "Dabajuroide [cf. Howard 1943]"
    precontacto_propuesto: probable
    precontacto_razon: >
      ⭐ CIERRA UN HUECO DECLARADO. La nota de Esteves dice de CAYERUBA que es
      "el primer sitio de Paraguaná con evidencia precolombina" (cementerio +
      cerámica) pero que "sin excavación publicada ni fecha, no alcanza para
      precontacto: si". La prospección de Oliver 1981-83 ES ese registro
      arqueológico que faltaba, y Howard 1943 lo respalda desde antes.
    cautela: >
      Cayerúa (Oliver) ~ Cayeruba (Esteves): la equivalencia es muy probable
      pero hay que confirmarla. Y "Dabajuroide" sigue sin fechar la ocupación.
      Sube de `desconocido` a `probable`, no a `si`.
    procedencia: {obra: oliver-1989-cap4, detalle: "Apéndice E FAL-143"}
    cruces: [esteves-1989]

  - fal: FAL-152
    forma: machuruca
    nombre_oliver: "Machuruca"
    region: paraguana
    complejo: "Urumaco, Dabajuroide"
    precontacto_propuesto: probable
    precontacto_razon: >
      Componente Urumaco. Esteves registra "Machuruca/Misaray" como sitio
      arqueológico con cementerio indígena y PETROGLIFO FOTOGRAFIADO.
      Dos fuentes, una toponímica y otra de prospección, sobre el mismo lugar.
    procedencia: {obra: oliver-1989-cap4, detalle: "Apéndice E FAL-152"}
    cruces: [esteves-1989]

  - fal: FAL-149
    forma: moruy
    nombre_oliver: "Moruy"
    region: paraguana
    complejo: "Dabajuroide [cf. Howard 1943]"
    precontacto_propuesto: desconocido
    nota: >
      Moruy es hoy un pueblo vivo y Esteves lo usa como referencia geográfica
      de toda la zona. Dabajuroide sin precisar no decide la época.
    procedencia: {obra: oliver-1989-cap4, detalle: "Apéndice E FAL-149"}
    cruces: [esteves-1989]

  - fal: FAL-144
    forma: cerro-pelon-chuchube
    nombre_oliver: "Cerro Pelón / Chuchube"
    region: paraguana
    afiliacion: "Neoindio"
    precontacto_propuesto: desconocido
    nota: >
      ⭐ El topónimo lleva `chuchube`, que ES entrada del lexicón (van Buurt,
      Gatschet, Zavala) y aparece en la Tabla A-9 de Oliver como
      'paraulata / bird species'. Un nodo cuyo nombre es una palabra
      atestiguada del lexicón: material para toponimos.yaml, no solo para el
      registro de nodos.
    procedencia: {obra: oliver-1989-cap4, detalle: "Apéndice E FAL-144"}

  - fal: FAL-145
    forma: la-guaquira-abajo
    nombre_oliver: "La Guaquira Abajo"
    region: paraguana
    afiliacion: "Neoindio"
    precontacto_propuesto: desconocido
    procedencia: {obra: oliver-1989-cap4, detalle: "Apéndice E FAL-145"}

  - fal: FAL-153
    forma: la-aguada
    nombre_oliver: "La Aguada"
    region: paraguana
    afiliacion: "Neoindio"
    precontacto_propuesto: desconocido
    nota: "Nombre castellano; no aporta al léxico."
    procedencia: {obra: oliver-1989-cap4, detalle: "Apéndice E FAL-153"}


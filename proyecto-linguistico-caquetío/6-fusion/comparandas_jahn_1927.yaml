# 🔴 ESTO NO ES CAQUETÍO. Ni una sola de estas voces entra al lexicón ni al
#    habla de los agentes. Son las lenguas de la zona cultural que el caquetío
#    compartía, guardadas para poder COMPARAR — que es cosa distinta de
#    copiar. La trampa que CLAUDE.md ya mide: el 80% del lexicón son

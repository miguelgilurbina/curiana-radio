    dos preguntas de cc.11, en nombre de Miguel Gil; y la vía para Hernández
    Baño 1984 en la ficha 4-fuentes/angulo-molina.md. No se envía nada.
  estado: 'POR APLICAR → NECESITA A MIGUEL'
  aplicado_por: []

dp.3.03_citas_de_las_voces_tainas:
  eleccion: 'la del recopilador: T10 C, una sola pasada con la lista maestra (que ya separa primaria y secundaria); T3 A3 NO'
  lectura_operativa: >-
    Las citas van en `notas` de entradas de curiana_lexicon.py, que en este
    corte es de otro frente: el escriba genera la edición exacta por clave
    desde 6-fusion/taino_lista_maestra_2026-09-22.yaml (la clave, el campo y
    el texto) y marca las citas de Oviedo t. I que T1 dejó como
    `ocr-sin-imagen` (T1 A1: sólo lo verificado en imagen). No mueve el
    prompt: `notas` no llega a él.
  estado: 'POR APLICAR → PARA EL FRENTE DEL LEXICÓN'
  aplicado_por: []

dp.3.04_test_cognado_prestamo_y_sets:
  eleccion: 'T11 A (el test se queda como instrumento de campaña) + T4 G: retirar los 8 sets malos'
  lectura_operativa: >-
    Retirar NO es borrar: los ocho sets (cognado-020, -021, -022, -023, -027,
    -028, -034, -050) pasan de `cognados` a `no_son_cognados` de

    `calibracion_jahn` de 6-fusion/achagua_neira_ribero_1762.yaml; el
    generador de lexicon_achagua.py NO lee esa sección (lee `vocabulario` y
    `arte`), así que el módulo no cambia y no se regenera; las cifras de
    `meta.cobertura` las recuenta ensamblar_achagua_neira_ribero.py. B
    (texto de REGLAS_ATRIBUTIVAS, motor) y H (minar Gilij cap. X) quedan
    para después de la corrida base, como dice la recomendación.
  estado: POR APLICAR
  aplicado_por: []


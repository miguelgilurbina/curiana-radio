    petición al AGI). El escriba deja la vía exacta: si Arellano Moreno 1964
    está en HathiTrust en vista completa o sólo búsqueda, dónde se presta,
    y cómo se pide el manuscrito por PARES. Se escribe en la ficha
    4-fuentes/nueva-segovia-1579.md.
  estado: 'POR APLICAR → NECESITA A MIGUEL'
  aplicado_por: []

dp.3.02_angulo_molina:
  eleccion: 'A1 (ya decidida en cc.11) + A2 (conseguir Hernández Baño 1984)'
  lectura_operativa: >-

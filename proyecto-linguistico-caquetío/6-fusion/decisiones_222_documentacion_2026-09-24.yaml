# ─────────────────────────────────────────────────────────────────────────
# DECISIONES DE #222, GRUPO 3 — «Documentación y deuda» (dp.3.01-dp.3.25)
#
# La lista: 6-fusion/decisiones_pendientes_2026-09-23.yaml
#           §grupo_3_documentacion_y_deuda (datos, opciones, evidencia)
#           6-fusion/issues-pendientes/decisiones-pendientes-2026-09-23.md
#           §Grupo 3 (resumen legible con la recomendación a aplicar)
#
# La respuesta de Miguel, 2026-09-24, a la lista entera:
#
#   «Ok a todo, que no quede ninguna tarea pendiente. Lo único pendiente es
#   lo que tenga que ver con docker»
#
# Se registró ANTES de tocar nada (skill fusionar-propuesta §0, commit
# 7cae53e) y se cierra aquí. Por entrada: `eleccion` (qué recomendación se
# acepta: donde el resumen dice «mía», manda la del recopilador),
# `lectura_operativa` (lo que el escriba hizo con ella, escrito aparte para
# que no parezca que Miguel lo dijo), `estado` y `aplicado_por`.
#
# Estados:
#   APLICADA                     — hecha en esta rama.
#   CERRADA SIN CAMBIO           — la recomendación es no hacer nada, o ya
#                                  estaba hecho; se dice dónde.
#   NECESITA A MIGUEL            — sólo él puede hacerlo (comprar, pedir,
#                                  escribir): se deja preparado, no se inventa.
#   PARA EL FRENTE DEL LEXICÓN   — exige tocar curiana_lexicon.py, un
#                                  lexicon_*.py generado o su regeneración, que
#                                  en este corte son de otro frente: la edición
#                                  exacta está en
#                                  6-fusion/para_el_frente_del_lexicon_222_grupo3_2026-09-24.yaml
#
# «Ok a todo» es la recomendación de cada casilla, y nada más (§0: una
# autorización vale para lo que dice). Lo que salió al aplicar y nadie
# previó está en `lo_que_aparecio`, sin resolver.
# ─────────────────────────────────────────────────────────────────────────


  eleccion: 'la del recopilador: A + E + G ya (documentación); B y H después de la base'
  lectura_operativa: >-
    A: el achagua del arte de Neira y Ribero como tercera comparanda en
    2-lengua/morfologia.md §5, §6, §7, §10 y §11, sólo documentación. G: el

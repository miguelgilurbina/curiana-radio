propuesta:

  - id: prop-01
    donde: 6-fusion/taino_en_la_esfera_2026-09-21.yaml
    que: >-
      Corregir `gen-03` («DOS NEGATIVOS MEDIDOS en la clase genética») y el
      `aviso` de `arq-01`. El primero ya no es un negativo: Fernandes 2020 es
      accesible y habla, y lo que dice cambia el cuadro. El segundo sigue en
      pie pero ahora tiene un contrapeso genético.
    por_que: >-
      Es la misma campaña. Dejar en `6-fusion/` dos documentos que se
      contradicen sin decirlo es lo que la regla 1 evita para las cifras y
      debería evitarse también para los veredictos.

  - id: prop-02
    donde: 3-mundo/etnias.yaml
    que: >-
      Si Miguel fusiona la `etnia-009` que propuso la campaña 1 (taíno,
      `tipo_de_contacto: ninguno`), la ficha se sostiene **tal cual** con lo
      medido hoy: la evidencia nueva es de las Antillas MENORES, no del
      taíno. Pero esta parcela propone ADEMÁS una ficha distinta para el
      vecino que sí aparece.
    ficha_propuesta:
      id: etnia-010
      nombre: "arahuacos de las Antillas Menores"
      etiqueta: atestiguado
      familia_linguistica: arahuaca
      polity_caquetia: costera        # por sus islas: Curazao está dentro
      tipo_de_contacto: "poblacional — flujo génico mayor hacia las islas ABC"
      intensidad: alta
      epoca_propuesta: precontacto   # el campo sigue sin existir: ver el 🔴 de la campaña 1
      procedencia: {obra: fernandes-2020, pagina: "Nature 590:106; SI2 y SI9"}
      aviso_epoca: >-
        Los INDIVIDUOS son de 1160-1522 d.C.; el EVENTO de mezcla no está
        fechado y los autores declaran que no pudieron fecharlo. Si se
        fusiona, la etiqueta de época es del contexto funerario, no del
        contacto.
    aviso: >-
      🔴 Vuelve a chocar con el problema de esquema que la campaña 1 levantó:
      `etnias.yaml` no tiene campo `epoca` y el 9.º guardián no lo valida.
      Aquí muerde más que allí, porque esta ficha SÍ es `atestiguado` y sin
      época diría que el elenco del siglo XV tenía vecinos antillanos
      documentados, cuando lo documentado es ancestría sin fecha.

  - id: prop-03
    donde: 3-mundo/corpus/ecologia.yaml (o geografia_politica.yaml — lo decide Miguel)
    que: >-
      Un hecho nuevo: «el límite septentrional de la serie dabajuroide en las
      ABC es un límite de CACHARROS, no de gente». La cerámica para en las
      islas; los genes de las islas vienen en buena parte de más al este.
    procedencia: {obra: fernandes-2020}
    por_que: >-
      Es el matiz que `ecologia-013` no tiene y que cambia cómo se lee la
      frase «y ahí se detiene».

  - id: prop-04
    donde: 5-experimento/
    que: >-
      NADA. Esta parcela no propone tocar `ESFERA_DE_CONTACTO`, ni el prompt,
      ni el scorer. El hallazgo es de las Antillas Menores, y las voces de la
      esfera que el motor enseña son taínas: no se toca una etiqueta de
      lengua con un dato de ancestría. La auditoría de las 25 voces taínas que
      la campaña 1 dejó abierta (opción B) sigue abierta y sigue siendo la
      siguiente.

# ══════════════════════════════════════════════════════════════════
# 7. LO QUE VI DE PASO
# ══════════════════════════════════════════════════════════════════
de_paso:
  - >-
    `4-fuentes/martinez-cruzado-2003.md` pedía Dijkhoff 1997 como deuda
    documental. Está descargada y minada: la deuda se cierra. También pedía
    Versteeg y Ruiz 1995 y Hartog 1961, que siguen sin localizarse en abierto.
  - >-
    Dijkhoff 1997 trae el episodio de la deportación con **otra tercera
    versión** de la fecha y el nombre: «In 1515 Diego de Salazar, in order of
    the Spanish underking of Hispaniola Diego Colón, took about 2000 Indians
    of Aruba, Bonaire and Curaçao» (Hartog 1953:28). Arcaya daba 1513 y
    Salazar; Oliver, 1515 y Martín Baso Zabala. Dijkhoff da 1515 y Salazar.
    La discrepancia que la campaña 1 marcó como «NO se promedia» tiene ahora
    tres lecturas, y las tres bajan de Hartog o de Oliver.
  - >-
    Dijkhoff sostiene, citando a Oliver 1989:306, que **Aruba pudo funcionar
    como puesto comercial o asentamiento de frontera** del caquetío costero, y
    que el contacto entre los caquetíos de la Guajira y los de Paraguaná
    pasaba, entre otras vías, por Aruba. Es geografía política y es de otra
    parcela, pero está sin entrar al corpus.
  - >-
    Dijkhoff también anota que el contacto entre Aruba y Curazao «possibly
    went for a great deal via the mainland», porque las corrientes entre las
    islas son traicioneras. Si eso es cierto, la esfera insular no es un arco
    isla-a-isla sino un radio desde la costa — y eso sí toca cómo se imagina
    el mar en el motor.
  - >-
    Haviser 1990 da la fecha de C-14 de los dos esqueletos de de Savaan
    exhumados en 1980: 1.500 ± 200 a.p. sobre hueso. El suplemento de
    Fernandes da para el yacimiento un contexto de 1160-1500 d.C. (o sea,
    ~790-450 a.p.). **No son la misma fecha ni de lejos.** O los individuos
    secuenciados no son los de 1980, o hay dos fechados del mismo sitio que
    no se han conciliado. Es una discrepancia real, no se promedia, y quien
    quiera afinar la época de `gen-01` tiene que resolverla.
  - >-
    La mayoría de estas obras están en congresos de la IACA digitalizados y
    abiertos en la University of Florida Digital Collections (ufdc.ufl.edu) y
    en el fondo `mana.aw` / Biblioteca Nacional Aruba de archive.org. Son dos
    filones de arqueología insular abierta que el repo no había tocado.

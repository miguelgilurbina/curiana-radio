# 3. LA TABLA DE PREDICCIONES
# ══════════════════════════════════════════════════════════════════
# Las seis del encargo, cada una con si se vio, dónde, y con qué fuerza.
predicciones:

  - n: 1
    prediccion: "El guanín: ¿de dónde del continente, y pasa la ruta por Falcón o las ABC?"
    vista: "parcialmente — y NO por aquí"
    donde: met-01 (martinon-torres-2012)
    fuerza: media
    resumen: >-
      El guanín llegó a las Antillas antes de 1492 (Maisabel, Puerto Rico,
      primer milenio d.C.). Su origen probable es Colombia —Tairona, Zenú,
      Nahuange—, por argumento ICONOGRÁFICO, no geoquímico. La ruta dentro de
      Cuba se lee de este a oeste. Ni Falcón ni las ABC aparecen. No hay
      análisis LA-ICP-MS que resuelva procedencia.

  - n: 2
    prediccion: "Las piedras verdes: ¿alguna procedencia venezolana o guajira?"
    vista: "no"
    donde: pie-01 (queffelec-2024)
    fuerza: alta (como negativo)
    resumen: >-
      La lapidaria antillana se emparenta con el área ístmo-colombiana, no
      con el bajo Orinoco; las fuentes de jadeíta conocidas son Motagua, el
      oriente de Cuba y el norte dominicano. El área caquetía no figura en la
      síntesis ni como productora ni como intermediaria. Pendiente: Knaf
      et al. 2021 (Sr-Nd-Pb), localizada y no descargada.

  - n: 3
    prediccion: "La cerámica: ¿tiestos dabajuroides/valencioides en las Antillas Mayores, u ostionoides/chicanos en Falcón, las ABC o Los Roques?"
    vista: "no en un sentido; un caso dudoso en el otro"
    donde: cer-01, cer-02, cer-03, cer-04
    fuerza: alta (como negativo), muy baja (el positivo)
    resumen: >-
      Cero sondas antillanas en Urbina 2011 (192 yacimientos de Falcón
      costero) y en Zavala Reyes et al. 2018 (Médanos de Coro), con control
      positivo. Cero en Antczak 2015 (Las Aves) salvo una mención
      bibliográfica. El único positivo es un sello de cerámica de Aruba con
      «similitudes tipológicas» con sellos de Haití y Santo Domingo, dicho de
      pasada y sin catálogo, por un autor que en la misma página concluye que
      de conexiones con las Antillas Mayores «no se puede decir mucho
      todavía». La petrografía de Aruba (Casale 2024) deja un tercer grupo
      cerámico decorado de origen incierto: es el hilo vivo.

  - n: 4
    prediccion: "Las conchas y el botuto: ¿tráfico documentado Venezuela ↔ Antillas Mayores?"
    vista: "no"
    donde: con-01, con-02
    fuerza: media-alta (como negativo)
    resumen: >-
      El botuto del Golfete es consumo local (1,0 % de la malacofauna en
      Médanos de Coro). El valioso de concha taíno —el guaíza— no baja del
      sur de las Antillas Menores. No se halló ni un objeto de concha con
      procedencia antillana en el área caquetía.

  - n: 5
    prediccion: "La genética: ¿flujo continente↔islas DESPUÉS de la migración cerámica inicial?"
    vista: "⭐⭐ SÍ, y en dirección islas→continente"
    donde: gen-01, gen-02
    fuerza: alta
    resumen: >-
      Sí: ~2/3 de la ancestría de los caquetíos de Curazao viene de las
      Antillas MENORES, en un flujo posterior a la llegada del dabajuroide, y
      los autores lo llaman «major gene flow from the Antilles». Y no al
      revés: ninguna migración continental posterior entró en las Antillas,
      con potencia declarada de ~2-8 %. Poblaciones de referencia del norte
      de Suramérica usadas: `Venezuela_Ceramic` (Las Locas, Quíbor), y entre
      las actuales piapoco, wayuu, yukpa y arara. Ningún individuo antillano
      con ancestría continental reciente.

  - n: 6
    prediccion: "El puente ABC: ¿qué dice la arqueología de Aruba, Curazao y Bonaire de contactos hacia el NORTE?"
    vista: "dice que no sabe, y en huesos dice que sí"
    donde: cer-04, rup-01, gen-01
    fuerza: alta
    resumen: >-
      La arqueología arubeña publicada reconoce conexiones al oeste
      (Guajira, Coro), al sur (Venezuela central y oriental) y quizá al
      interior andino, y sobre las Antillas Mayores dice literalmente que no
      se puede decir mucho todavía. El único rasgo compartido con las Mayores
      son las pictografías, y están sin fechar. Pero el ADN antiguo de
      Curazao dice que por ahí pasó gente de las Antillas Menores. El puente
      existió; no se ve en los objetos.


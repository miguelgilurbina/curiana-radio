  - "Ni un tiesto dabajuroide ni valencioide en las Antillas Mayores."
  - "Ni una pieza de guanín, tumbaga, jadeíta, cemí, trigonolito, duho ni guaíza al sur de Santa Lucía."
  - "Ningún análisis de procedencia geoquímico (LA-ICP-MS o equivalente) que ligue metal antillano a una fuente venezolana — ni a ninguna otra de forma concluyente."
  - "Ninguna fecha para el evento de mezcla de Curazao: los autores declaran que no la pudieron obtener."
  - "El número exacto de individuos de Curazao analizados (está en un .xlsx que PMC no sirve)."
  - "Nägele et al. 2020 (Science): sin versión abierta; no descargado."
  - "Rouse y Cruxent 1963: préstamo digital controlado en archive.org; no descargable sin saltarse el control."
  - "Oliver 2000, «Gold symbolism among Caribbean chiefdoms»: capítulo de libro sin versión abierta; no obtenido."
  - "Knaf et al. 2021 (jade Sr-Nd-Pb, CC-BY) y Casale et al. 2024 (petrografía de Aruba, CC-BY): localizadas, abiertas por licencia, bloqueadas a la descarga automática por el editor. Sólo se leyó el resumen de Casale."
  - "Boomert 2000 sobre Trinidad y el bajo Orinoco, Keegan y Hofman 2017, Rouse 1992 y Haviser 1987 (la monografía de Curazao): sin versión abierta localizada."
  - "Ningún objeto arubeño o curazoleño publicado con análisis de pasta o de isótopos que diga de dónde vino."


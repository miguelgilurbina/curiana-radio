# ─────────────────────────────────────────────────────────────────────────
# PROPUESTA — la evidencia MATERIAL del contacto: arqueología y genética
#
# Segunda campaña del taíno, parcela T8 (2026-09-22). Encargo de Miguel:
# «Ve avanzando con la búsqueda, descarga y minado de fuentes para corroborar
# pre contacto con Taíno y minar más info», sobre la intuición de la noche
# anterior: «tiene que haber una forma de probar si hubo algún tipo de
# contacto. O sea de que es plausible es plausible.»
#
# La parcela pregunta por OBJETOS y GENES, no por crónicas: ¿hay evidencia
# material de relación entre la costa caquetía / las islas ABC y las Antillas
# ANTES de 1492? ¿Directa, o por la cadena de las Antillas Menores?
#
# Regla 5: esto PROPONE. Regla 1: las cifras del lado del REPO las imprime
# `python 6-fusion/scripts/medir_taino2_evidencia_material.py`; las del lado
# de las fuentes son citas y llevan obra y página. Regla 3, que aquí vuelve a
# ser la que más muerde: cada pieza lleva su ÉPOCA, y la época es la que
# decide si vale.
# ─────────────────────────────────────────────────────────────────────────
meta:
  recogido: '2026-09-22'
  estado: propuesta
  parcela: T8 — la evidencia material del contacto (arqueología y genética)
  medido_por: 6-fusion/scripts/medir_taino2_evidencia_material.py
  continua_a: 6-fusion/taino_en_la_esfera_2026-09-21.yaml   # campaña 1, T5
  pregunta: >-
    ¿Hay evidencia material —objetos, materias primas, cerámica, genes— de
    relación entre la polity caquetía costera (con Aruba, Curazao y Bonaire)
    y las Antillas antes de 1492? Y si la hay, ¿directa o por la cadena de
    las Antillas Menores?

# ══════════════════════════════════════════════════════════════════
# 0. LO QUE DEL ENCARGO RESULTÓ FALSO AL MEDIRLO
# ══════════════════════════════════════════════════════════════════
correcciones_al_encargo:

  - id: corr-01
    afirmacion_del_encargo: >-
      «la sección de evidencia arqueológica y genética [de la campaña 1] es tu
      punto de partida (concluyó "nada precolombino")».
    lo_medido: >-
      El punto de partida CAE en su pieza central. Fernandes et al. 2020 —la
      obra que la campaña 1 no pudo abrir porque el archivo estaba en 0
      bytes— contiene ADN antiguo de DOS aldeas caquetías de Curazao, y sus
      autores describen «major gene flow from the Antilles that affected
      Curaçao in the centuries after the arrival of Dabajuroid pottery».
      El cero de la campaña 1 era un cero de la BIBLIOTECA, no del registro.
      Ver `gen-01`.
    consecuencia: >-
      No invalida el veredicto anterior sobre el TAÍNO en sentido estricto
      (Antillas Mayores) — lo refuerza, porque ahora es un negativo medido y
      no un silencio. Sí invalida la frase «la esfera no se fuerza para que
      quepa» aplicada a las Antillas en general: por el sur del arco, la
      esfera YA entraba, con gente.

  - id: corr-02
    afirmacion_del_encargo: >-
      «Descarga Fernandes et al. 2020 (es acceso abierto; comprueba la
      licencia)» y «Nägele et al. 2020, Science (versión en PubMed Central si
      la hay)».
    lo_medido:
      - >-
        Fernandes 2020: el texto SÍ es accesible (Europe PMC lo sirve como
        `fullTextXML`, y el suplemento entero está publicado abierto por el
        Reich Lab), pero **el PDF no se puede descargar de PMC con
        herramientas automáticas** —devuelve una página «Preparing to
        download»— y su licencia **no es CC**: es la de Nature («view, print,
        copy, and download text and data-mine … for the purposes of academic
        research»). O sea: minable, no redistribuible.
      - >-
        Nägele et al. 2020, Science 369(6502): **NO tiene versión de acceso
        abierto**. Europe PMC lo marca `isOpenAccess=N`, sin PMCID y con
        «Subscription required». No se descargó. Anotado en
        `4-fuentes/nagele-2020.md` con su DOI y qué daría.
    consecuencia: >-
      El archivo `Fernandes_et_al_2020_Nature_Genetic_History_Caribbean.pdf`
      **sigue en 0 bytes y se deja así a propósito**. Lo que entra al repo es
      el preprint de bioRxiv, que sí lleva licencia CC (BY-NC-ND 4.0), y NO
      es el mismo texto: le falta justamente el material suplementario donde
      está el hallazgo. Ver `descargas`.

  - id: corr-03
    afirmacion_del_encargo: >-
      «Rouse y Cruxent 1963 (descárgalo si está en archive.org en préstamo
      legal o en acceso abierto; si no, anota)».
    lo_medido: >-
      Está en archive.org en DOS ejemplares (`venezuelanarchae0000rous` y
      `venezuelanarchae0000irvi`), los dos con `access-restricted-item: true`
      y en las colecciones `inlibrary` / `printdisabled`: **préstamo digital
      controlado**, que exige cuenta y préstamo y no es descarga. Sin
      `licenseurl` ni `rights`. Tampoco respondió el servicio de «search
      inside», así que no se pudo ni sondear por dentro.
    consecuencia: >-
      NO se descargó (habría sido saltarse un control de acceso). Sigue
      siendo el hueco declarado desde 2026-07-29. Anotado.

  - id: corr-04
    afirmacion_del_encargo: >-
      «José Oliver … publicó "Gold symbolism among Caribbean chiefdoms"
      (en *Precolumbian Gold*, ed. McEwan, 2000) sosteniendo que el guanín
      llegaba a las Antillas desde el norte de Suramérica».
    lo_medido: >-
      El capítulo existe y la referencia es correcta (pp. 196-219), pero es un
      capítulo de libro de British Museum Press **sin versión abierta**: no se
      obtuvo y NO se le atribuye ninguna tesis en este documento. Lo que sí
      se pudo leer de primera mano es la arqueometalurgia que lo cita y lo
      pone a prueba —Martinón-Torres et al. 2012— y su respuesta es más
      precisa y menos favorable de lo que el encargo suponía: ver `met-01`.

  - id: corr-05
    afirmacion_del_encargo: >-
      «Rodríguez Ramos y otros han rastreado la procedencia de la jadeíta …
      ¿Alguna procedencia venezolana o de la Guajira?»
    lo_medido: >-
      La pregunta tiene respuesta y la respuesta es **no, y por el lado
      contrario**: la síntesis lapidaria de Queffelec 2024 concluye que la
      producción de cuentas y colgantes del arco antillano **no tiene que ver**
      con la del bajo Orinoco saladoide y sí con el área **ístmo-colombiana**.
      Es decir, la piedra verde antillana mira al OESTE por un camino que no
      pasa por Falcón. Ver `pie-01`.

# ══════════════════════════════════════════════════════════════════
# 1. EL VEREDICTO
# ══════════════════════════════════════════════════════════════════
veredicto: >-
  Sí hay evidencia material de contacto precolombino entre la esfera caquetía
  y las Antillas, y es genética y de primer orden: los individuos enterrados
  en dos aldeas CAQUETÍAS de Curazao, fechadas 1160-1500 y 1443-1522 d.C.,
  llevan ~dos tercios de ancestría de las ANTILLAS MENORES, y los autores lo
  leen como «flujo génico mayor desde las Antillas» posterior a la llegada de
  la cerámica dabajuroide. Pero esa misma fuente cierra la puerta que Miguel
  quería abrir: la ancestría es de las Antillas MENORES y **no** de las
  Mayores, y de la vía taína —Antillas Mayores, guanín, piedra verde,
  cerámica, concha— no aparece ni una pieza. El contacto existió; era por la
  cadena del sur, no con el taíno.

veredicto_largo: >-
  La campaña 1 dijo «primos, no vecinos» y midió un cero. Con las dos fuentes
  que le faltaban abiertas, el cero se parte en dos. (a) Hacia las Antillas
  MAYORES sigue a cero, y ahora es un cero medido: la prospección de 192
  yacimientos de Falcón costero (Urbina 2011) y la arqueología de los Médanos
  de Coro (Zavala Reyes et al. 2018) no mencionan ni una vez ostionoide,
  chicoide, meillacoide, guanín, jadeíta, cemí ni Antillas Mayores; el
  guanín de Cuba se atribuye a orfebres TAIRONA y ZENÚ de Colombia por vía
  iconográfica, y la ruta que se propone dentro de Cuba es oriental; la pieza
  «taína» mejor candidata de Aruba resulta parecerse a un tipo que Rouse
  clasifica como falsificación; y el guaíza más meridional con contexto
  arqueológico se queda en Santa Lucía. (b) Hacia las Antillas MENORES, en
  cambio, hay gente: dos tercios del genoma de los caquetíos de Curazao. La
  esfera caquetía no estaba sellada por el norte-este; lo que no tocaba era
  el mundo taíno. Y una asimetría que conviene decir entera: de los tres ejes
  largos del caquetío —Guajira/Ranchería al oeste, Los Roques/Las Aves al
  este, el arco antillano más allá— el tercero sólo se ve en los HUESOS, no
  en los objetos. Nadie ha encontrado todavía el correlato arqueológico, y
  los propios autores lo dejan escrito como tarea pendiente.

# ══════════════════════════════════════════════════════════════════
# 2. LA EVIDENCIA, PIEZA A PIEZA
# ══════════════════════════════════════════════════════════════════
evidencia:

  # ───────────────────────── GENÉTICA ─────────────────────────
  - id: gen-01
    clase: genética
    titulo: "⭐⭐ Los caquetíos de Curazao llevan ~2/3 de ancestría de las Antillas Menores"
    obra: fernandes-2020
    pagina: >-
      Nature 590:106 (texto principal) y Supplementary Information, SI2
      «Curaçao» (pp. 30-32 del suplemento) y SI9 (Tablas S14-S15)
    cita_corta: >-
      «major gene flow from the Antilles that affected Curaçao»
    cita_segunda: >-
      «The individuals analysed for this study come from two Caquetio
      settlements»
    epoca: >-
      precontacto tardío para los INDIVIDUOS (contexto de De Savaan
      1160-1500 d.C.; Santa Cruz 1443-1522 d.C. — o sea, la ventana simulada
      y su borde colonial); indeterminada para el EVENTO de mezcla
    etiqueta: atestiguado
    que_prueba: >-
      Que la población enterrada en dos aldeas caquetías de Curazao —
      identificadas como caquetías por la abundancia de cerámica dabajuroide,
      y una de ellas señalada por los españoles como el pueblo de un cacique
      caquetío— no es genéticamente continental pura. El modelo qpAdm que
      los autores reportan es 74,5 ± 3,7 % de ancestría emparentada con
      `*LesserAntilles_Ceramic` y 25,5 ± 3,7 % con `*Venezuela_Ceramic`
      (p = 0,362, con competencia de modelos). Sin competencia de modelos, el
      ajuste de dos vías con los clados mayores es 68,0 ± 5,1 % `*Caribbean_Ceramic`
      y 32,0 ± 5,1 % `*Venezuela_Ceramic` (p = 0,298).
      El componente continental lo asocian a la llegada de la cerámica
      dabajuroide hacia 500 d.C.; el antillano, a un flujo posterior.
    que_NO_prueba:
      - >-
        NO prueba contacto con el TAÍNO. El texto principal es explícito en
        sentido contrario: la ancestría se comparte con las Antillas Menores
        «but not the Greater Antilles». Las dos poblaciones de referencia del
        subclado son Anse à la Gourde (Guadalupe) y Lavoutte (Santa Lucía).
      - >-
        NO prueba contacto en el siglo XV. **No hay fecha para la mezcla**:
        los propios autores escriben que no pudieron obtener estimaciones
        viables de fecha de mezcla para los individuos de Curazao (SI14,
        donde sí las dan para Haití: 16,5 ± 3,3 generaciones). «En los siglos
        posteriores a la llegada de la cerámica dabajuroide» es su lectura,
        no una medición. El evento puede caer en cualquier punto entre
        c. 500 y c. 1300 d.C.
      - >-
        NO prueba tráfico de objetos. Los autores lo dicen: identificar el
        correlato arqueológico de estos eventos es «an important topic for
        future research». Hoy hay huesos y no hay cacharros.
      - >-
        NO es un contacto entre iguales medido con muchas muestras. El
        subclado `*Curacao_Ceramic` lo componen DOS yacimientos (de Savaan y
        Santa Cruz) y el propio artículo advierte que forman clado entre sí
        sólo «marginally» (p = 0,011).
    aviso_de_cifra: >-
      ⚠️ El número EXACTO de individuos de Curazao no se pudo leer: está en
      Supplementary Data 1, un .xlsx que PMC no sirve a una descarga
      automática. El preprint de bioRxiv (junio 2020), anterior a que se
      añadiera Santa Cruz, listaba 2 individuos de de Savaan. No se escribe
      un total a mano (regla 1): queda como hueco declarado.
    aviso_de_matiz: >-
      ⚠️ Y el «no las Mayores» tiene un matiz que el propio suplemento pone y
      que en duda hay que degradar: en el modelo de grafo (qpGraph), la mejor
      fuente de mezcla para `*Curacao_Ceramic` es «a population between the
      Ceramic-associated populations from Greater and Lesser Antilles».
      El texto principal afirma «Menores y no Mayores»; el grafo dice «entre
      las dos». Se registran las dos lecturas.

  - id: gen-02
    clase: genética
    titulo: "El flujo hacia el otro lado no existe: ninguna migración continental posterior entró en las Antillas"
    obra: fernandes-2020
    pagina: "Nature 590:103 (resumen) y 590:106-107"
    cita_corta: >-
      «cultural changes during the Ceramic Age were not driven by migration of
      genetically-differentiated groups from the mainland»
    epoca: toda la Edad Cerámica antillana (~2.500-500 a.p.)
    etiqueta: atestiguado
    que_prueba: >-
      Que el caquetío continental —o cualquier otro grupo continental
      genéticamente distinto— NO se metió en las Antillas después de la
      migración cerámica inicial. Los autores probaron expresamente la
      hipótesis de una migración caribe desde el occidente de Venezuela hacia
      1.150 años atrás (Ross et al., morfología craneofacial) y no hallaron
      ancestría nueva, con una potencia declarada de detección de tan poco
      como ~2-8 % usando `Venezuela_Ceramic`, `LesserAntilles_Ceramic` o los
      arara actuales como sustitutos. Y no encuentran asociación entre los
      subclados genéticos y las tipologías cerámicas tradicionales
      (saladoide, ostionoide, meillacoide, chicoide).
    que_NO_prueba: >-
      No excluye migración desde «un grupo continental no muestreado
      genéticamente más parecido a la gente cerámica caribeña» que los
      sustitutos usados — los autores lo dicen. Y no mide viajes, comercio ni
      visitas: mide aportación reproductiva detectable.
    lectura_para_el_proyecto: >-
      Esto es lo que convierte el asunto en ASIMÉTRICO y hay que decirlo así:
      entró gente de las Antillas a Curazao, y no salió gente de aquí a las
      Antillas. Una esfera con una sola dirección medible.

  - id: gen-03
    clase: genética
    titulo: "Lo que Schroeder 2018 dejó abierto, esta fuente lo contesta a medias"
    obra: fernandes-2020
    pagina: "Nature 590:107"
    epoca: n/a — es método
    etiqueta: reconstruido
    que_prueba: >-
      `4-fuentes/schroeder-2018.md` dejó escrita una pregunta: si Paraguaná
      tiene topónimos «taínos» pero los linajes maternos de Aruba no son los
      del taíno antillano (Martínez-Cruzado 2003, población MODERNA, n=13),
      entonces ese estrato parecería préstamo y no población asentada. Con
      ADN ANTIGUO de Curazao la pregunta cambia de forma: en las islas SÍ hay
      población de origen antillano, y en cantidad. Lo que no hay es
      población de origen antillano MAYOR.
    que_NO_prueba: >-
      No valida el estrato toponímico de Esteves 1989 (que el repo ya degradó
      por otras razones: parecido de sonido sin documento). Ancestría no es
      lengua. Y Curazao no es Paraguaná: no hay ADN antiguo de la península.
    aviso: >-
      Fernandes et al. citan a Toro-Labrador, Wever & Martínez-Cruzado 2003
      —el mismo paper de Aruba que el repo tiene— como apoyo de la hipótesis
      de que los arahuacos se partieron, unos por el Orinoco a las Antillas y
      otros hacia la costa occidental venezolana. Es la misma fuente, usada
      para lo mismo: **no es una corroboración independiente** (skill §8).

  - id: gen-04
    clase: genética
    titulo: "🔴 NEGATIVO MEDIDO — Nägele et al. 2020 no es accesible"
    obra: nagele-2020
    pagina: n/a
    epoca: n/a
    etiqueta: atestiguado   # el cero está medido hoy
    detalle: >-
      *Genomic insights into the early peopling of the Caribbean*, Science
      369(6502):456-460, doi:10.1126/science.aba8697. Europe PMC:
      `isOpenAccess = N`, sin PMCID, única vía «Subscription required».
      No se descargó. Mitiga el hueco que Fernandes et al. co-analizaron sus
      93 individuos y discuten sus resultados en SI4 y SI13, así que lo que
      Nägele aporta a esta parcela llega de segunda mano y así se etiqueta.

  # ───────────────────────── METAL / GUANÍN ─────────────────────────
  - id: met-01
    clase: metal
    titulo: "El guanín de Cuba apunta a Colombia, por iconografía, y entra por el este"
    obra: martinon-torres-2012
    pagina: "Journal of Anthropological Archaeology 31:449 y 31:451"
    cita_corta: >-
      «The strongest argument supporting Colombia as a source … comes from
      iconographic rather than chemical data»
    epoca: >-
      precontacto para la pieza fechada más antigua (guanín de Maisabel,
      Puerto Rico, primer milenio d.C.); el conjunto de El Chorro de Maíta es
      de contacto temprano
    etiqueta: atestiguado
    que_prueba:
      - >-
        Que metal continental llegó al Caribe insular ANTES del contacto
        europeo: la fecha del guanín de Maisabel (Puerto Rico) lo demuestra,
        y los autores lo formulan así.
      - >-
        Que el origen probable de parte del guanín cubano es **Colombia**:
        una cabeza ornitomorfa de El Chorro de Maíta corresponde al tipo que
        coronaba los pectorales TAIRONA de la Sierra Nevada de Santa Marta, y
        una figurilla antropomorfa de Santana Sarmiento al estilo ZENÚ. Los
        colgantes planos perforados se relacionan con la orfebrería NAHUANGE
        de la misma Sierra Nevada.
      - >-
        Que la ruta dentro de Cuba se lee de ESTE a oeste: casi todo el
        guanín cubano aparece en el nordeste de la isla, «supporting the idea
        of an eastern route for the movement of this metal».
    que_NO_prueba:
      - >-
        NO hay análisis de procedencia geoquímico concluyente. Los autores lo
        declaran: la composición sólo les permite inclinarse («we are
        inclined to suggest») por un origen colombiano, y el argumento fuerte
        es estilístico. La pregunta del encargo —«si hay análisis de
        composición (LA-ICP-MS) de piezas antillanas, qué dicen de la
        procedencia»— tiene por tanto respuesta NEGATIVA para 2012.
      - >-
        NO implica a la costa caquetía ni a las ABC en ningún punto de la
        ruta. Ni Falcón, ni Paraguaná, ni Aruba, ni Curazao aparecen en el
        artículo. Que la ruta pase por delante de la Guajira es geografía, no
        dato: no hay una sola pieza intermedia publicada.
    lectura_para_el_proyecto: >-
      ⚠️ Aquí hay una tentación que hay que nombrar para no caer en ella.
      Oliver liga las «piedras verdes» y las tuumás del comercio caquetío a la
      **Sierra Nevada de Santa Marta** (cap. 3, §3.2). El guanín de Cuba
      apunta a orfebres **de la Sierra Nevada de Santa Marta**. Eso NO es
      contacto entre caquetíos y taínos: es que los dos eran clientes del
      mismo taller, por caminos distintos. Mismo proveedor, no mismo trato.

  - id: met-02
    clase: metal
    titulo: "Y el paralelo iconográfico caribe↔Tairona puede ser colonial"
    obra: mol-2007
    pagina: "p. 67"
    cita_corta: >-
      «it is also possible that these links are colonial, rather than
      Pre-Columbian»
    epoca: en disputa — ése es el punto
    etiqueta: hipotetico
    que_prueba: >-
      Nada positivo. Lo que hace es poner la reserva de método: la semejanza
      entre los amuletos taínos de oro y la orfebrería tairona se ha usado
      para sostener un vínculo Antillas Mayores ↔ continente, y un
      especialista de la región advierte expresamente que el vínculo puede
      ser del siglo XVI.
    lectura_para_el_proyecto: >-
      Es la regla 3 dicha por un tercero y en la dirección contraria a la que
      el proyecto la usa de costumbre. Vale la pena tenerla escrita.

  # ───────────────────────── PIEDRA ─────────────────────────
  - id: pie-01
    clase: piedra
    titulo: "La lapidaria antillana mira al ístmo-colombiano, y no toca la costa caquetía"
    obra: queffelec-2024
    pagina: >-
      Revista de Arqueología Americana 41, pp. 231-232 (la comparación
      continente/archipiélago y las placas aladas) y pp. 233-234 (la
      conclusión)
    cita_corta: >-
      «the absence of an evident link … with the original Saladoid groups of
      the lower Orinoco valley»
    epoca: Edad Cerámica antillana, con el grueso en la temprana (~500 a.C.-500 d.C.)
    etiqueta: atestiguado
    que_prueba: >-
      Síntesis sobre un corpus grande de cuentas y colgantes líticos del
      archipiélago: la producción lapidaria saladoide del bajo Orinoco «no
      tiene nada que ver» con la antillana ni en tipología, ni en variedad de
      materias primas, ni en cantidad; en cambio hay proximidad estilística y
      cronológica con las tradiciones NAHUANGE (Colombia) y con Costa Rica.
      Las «placas aladas» se distribuyen de Costa Rica a Venezuela pasando
      por Panamá y Colombia, y son sobre todo de los primeros siglos d.C.
    que_NO_prueba: >-
      No dice nada de Falcón, Paraguaná ni las ABC — que es justamente el
      hallazgo: **en una síntesis de la lapidaria caribeña, el área caquetía
      no aparece**. Ni como productora, ni como intermediaria, ni como
      destino. Cero menciones de Aruba, Bonaire, dabajuroide o Guajira.
    respuesta_a_la_prediccion: >-
      Predicción 2 del encargo («¿alguna procedencia venezolana o de la
      Guajira para la jadeíta y las piedras verdes antillanas?»): **no**, y la
      literatura ni siquiera la plantea. Las fuentes de jadeíta conocidas son
      el valle del Motagua (Guatemala), el oriente de Cuba y el norte de la
      República Dominicana.
    deuda: >-
      La pieza que cerraría esto del todo —Knaf et al. 2021, la discriminación
      Sr-Nd-Pb del jade circumcaribeño, CC-BY— está localizada y NO se pudo
      descargar (Elsevier devuelve 403 a la descarga automática). Ver
      `4-fuentes/knaf-2021.md`.

  # ───────────────────────── CERÁMICA ─────────────────────────
  - id: cer-01
    clase: cerámica
    titulo: "🔴 Cero antillano en el registro arqueológico del Golfete — medido hoy"
    obra: urbina-jimenez-2011
    pagina: "toda la memoria (base de datos de 192 yacimientos)"
    epoca: precontacto agroalfarero
    etiqueta: atestiguado   # el cero está medido
    que_prueba: >-
      Que en una prospección que sistematiza 192 yacimientos agroalfareros
      prehispánicos de Falcón costero, las subtradiciones que se nombran son
      **Tortolitana** y **Dabajurana**, y las 24 sondas de cultura material
      antillana (ostionoide, chicoide, meillacoide, elenoide, palmetto,
      guanín, tumbaga, jadeíta, cemí, guaíza, duho, trigonolito, Antillas
      Mayores, Greater Antilles, Hispaniola, taíno, lucayo…) dan **cero**.
      El control del mismo barrido sale positivo (dabajuro=29, caquet=8,
      ceramic=34, sherd=3), así que el cero no es del extractor (regla 6).
    corroboracion: >-
      Zavala Reyes et al. 2018 sobre los Médanos de Coro —dos áreas de
      recolección caquetías de los siglos XIV-XVIII, o sea la ventana
      simulada— da el mismo cero en las 24 sondas, con control positivo
      (dabajuro=21, caquet=21, concha=19).
    que_NO_prueba: >-
      Que no exista nada: sigue siendo un negativo sobre lo que el repo
      tiene. Urbina es una memoria de máster de prospección, no un catálogo
      de materiales, y su propia portada advierte que es un ejemplar de
      examen sin revisar que no debería citarse sin permiso del Instituto.
      La obra que lo zanjaría —Rouse y Cruxent 1963— sigue sin estar.

  - id: cer-02
    clase: cerámica
    titulo: "La cerámica de Aruba es local, y su tercer grupo no se sabe de dónde es"
    obra: casale-2024
    pagina: "Geoarchaeology 39(6):609-627 — resumen"
    epoca: precolonial; el grupo 3 es del Urumaco Temprano
    etiqueta: hipotetico   # EN DUDA DEGRADAR: sólo se leyó el resumen, no el pasaje
    que_prueba: >-
      Análisis petrográfico de cerámica de nueve yacimientos de Aruba contra
      fuentes de arcilla de la isla: tres composiciones mineralógicas; dos
      grupos de vasijas sin decorar son de arcillas locales (cuarzo-diorita
      del noroeste; mezcla calcárea-volcánica del sureste); el tercero,
      mayoritariamente DECORADO y del Urumaco Temprano, tiene matriz calcárea
      con pellets, vetas de arcilla y desgrasante de concha, y su origen
      queda incierto.
    aviso: >-
      ⚠️ **Sólo se leyó el resumen** (Crossref), no el pasaje: Wiley devuelve
      403 a la descarga automática aunque el artículo es CC-BY. Por la skill
      §3 esto NO cuenta como minado y la etiqueta baja. Queda como la pieza
      abierta más prometedora de la parcela: si el grupo 3 resultara importado,
      la petrografía diría DE DÓNDE.

  - id: cer-03
    clase: cerámica
    titulo: "Un sello de cerámica de Aruba con paralelos en Haití y Santo Domingo"
    obra: dijkhoff-1997
    pagina: "§3.5, p. 56 del PDF (la memoria no lleva paginación impresa en la capa de texto)"
    cita_corta: >-
      «a pottery stamp … showing typological similarities with stamps from
      Haïti and Santo Domingo»
    epoca: Período Cerámico de Aruba (900/1000-1500 d.C.) — dentro de la ventana
    etiqueta: hipotetico
    que_prueba: >-
      Que existe al menos UN objeto cerámico arubeño para el que un
      arqueólogo de la isla registró parecido tipológico con las Antillas
      Mayores. Es, hasta donde llega esta parcela, la única pieza material
      positiva en esa dirección.
    que_NO_prueba: >-
      Casi nada más. Es parecido tipológico dicho de pasada, sin figura, sin
      número de catálogo, sin análisis de pasta, y en la misma página el
      autor concluye: «Of connections with the Greater Antilles, I think not
      much can be said yet». Un sello con motivos parecidos no es un sello
      importado.

  - id: cer-04
    clase: cerámica
    titulo: "🔴 Y en dirección contraria: Aruba mira al oeste y al sur, nunca al norte"
    obra: dijkhoff-1997
    pagina: "§3.5, p. 56 del PDF"
    cita_corta: >-
      «Of connections with the Greater Antilles, I think not much can be said
      yet»
    epoca: Período Cerámico de Aruba (900/1000-1500 d.C.)
    etiqueta: atestiguado
    que_prueba: >-
      Que la lista de conexiones que la arqueología arubeña sí reconoce es:
      Venezuela noroccidental, central y oriental; la península de la Guajira
      en Colombia; y posiblemente el área andina interior de Venezuela — y
      que el autor las atribuye a difusión o comercio, no a migración. La
      cerámica estilo Savaneta (Los Médanos) «points to direct contact with
      the Guajira Península and Coro». Los adornos de ala ancha y los
      amuletos líticos hallados en Aruba se conocen del área andina
      (Trujillo). La materia del comercio marítimo más temprano con el
      continente, según Van Heekeren, era sal y cuentas de concha.
    lectura_para_el_proyecto: >-
      Confirma `arq-02` de la campaña 1 desde una fuente independiente y de
      primera mano sobre la isla: cuando la esfera caquetía comercia lejos,
      comercia al OESTE. Y cierra una deuda documental que
      `4-fuentes/martinez-cruzado-2003.md` llevaba abierta («Versteeg y Ruiz
      1995 · Dijkhoff 1997 | arqueología arubeña»).

  - id: cer-05
    clase: piedra / falsificación
    titulo: "La estatuilla «taína» de Aruba se parece a lo que Rouse clasifica como falsificación"
    obra: dijkhoff-1997
    pagina: "§3.5, p. 56 del PDF"
    cita_corta: >-
      «of which Rouse says that they are Taino falsifications»
    epoca: indeterminada — ése es el problema
    etiqueta: hipotetico
    que_prueba: >-
      Que de las tres estatuillas de piedra esculpidas halladas en Aruba,
      cuyo origen Versteeg da por desconocido y «ciertamente no hechas en
      Aruba», la mejor documentada —un hombre sentado con ojos de grano de
      café, caliza cristalina, 27,5 cm, de Tanki Lender— tiene un paralelo
      llamativo con una figura de caliza coralina de la República Dominicana
      que Rouse (1992:164-165, fig. 40b) clasifica como falsificación taína,
      y Oliver coincide.
    que_NO_prueba: >-
      Nada a favor del contacto, y bastante en contra del método: el mejor
      candidato «taíno» del archipiélago ABC se empareja con un tipo
      sospechoso de ser moderno. Es exactamente la clase de afirmación que
      Antolínez 1944 hacía sin catálogo (campaña 1, §4), vista de cerca.

  # ───────────────────────── CONCHA ─────────────────────────
  - id: con-01
    clase: concha
    titulo: "El guaíza más meridional con contexto se queda en Santa Lucía"
    obra: mol-2007
    pagina: "§6.7.5 (p. 122) y §6.6 (pp. 119-120)"
    cita_corta: >-
      «The most southern guaíza for which an archaeological context could be
      established is STL1 from the Lavoutte site on St. Lucia»
    epoca: Edad Cerámica tardía (800-1492 d.C.) — la ventana
    etiqueta: atestiguado
    que_prueba: >-
      Que el valioso social taíno por excelencia hecho en concha —las
      caretas de concha o guaízas, 52 en el catálogo— se distribuye por las
      Antillas Mayores y baja por las Menores hasta Santa Lucía, y ahí para.
      Ni una en el continente, ni una en las ABC. El autor barrió a propósito
      la posibilidad de una distribución continental y concluye que la
      iconografía de caras es demasiado universal para probar nada.
    que_NO_prueba: >-
      No prueba que no viajaran objetos de concha: prueba que ESTE tipo de
      objeto no llegó. Y el propio autor declara los límites del corpus
      (colecciones de museo sin procedencia, sin fechas absolutas, al menos
      una pieza sospechosa de falsificación).
    coincidencia_que_no_es_prueba: >-
      ⚠️ Lavoutte (Santa Lucía) es a la vez el guaíza más meridional con
      contexto Y uno de los dos yacimientos que componen el subclado
      `*LesserAntilles_Ceramic` de `gen-01`. Es una coincidencia de muestreo
      —son los yacimientos excavados—, NO un argumento. Se anota para que
      nadie la use como si lo fuera.

  - id: con-02
    clase: concha
    titulo: "El botuto del Golfete es comida, no mercancía antillana"
    obra: zavala-reyes-2018
    pagina: "Interciencia 43(6):404, Tabla II"
    epoca: siglos XIV-XVIII — la ventana y su borde colonial
    etiqueta: atestiguado
    que_prueba: >-
      Que *Lobatus gigas* está presente en los depósitos caquetíos de los
      Médanos de Coro, pero es minoritario: 3 unidades sobre 304 fragmentos
      de concha recogidos en las dos áreas (1,0 % del total), frente a
      *Donax striatus* (42,4 %) y *Callista* sp. (27,0 %). El conjunto es de
      malacofauna de consumo local.
    que_NO_prueba: >-
      No hay ni un objeto de concha con procedencia o estilo antillano. La
      predicción 4 del encargo («¿hay tráfico de *Lobatus gigas* o de objetos
      de concha entre Venezuela y las Antillas Mayores documentado?») sale
      **negativa** con lo que se pudo abrir.

  # ───────────────────────── ARTE RUPESTRE ─────────────────────────
  - id: rup-01
    clase: arte rupestre
    titulo: "Las pictografías ABC se parecen a las de las Antillas Mayores y no a las del continente"
    obra: dijkhoff-1997
    pagina: "§3.7, p. 60 del PDF (citando a Dubelaar 1991:613 y Versteeg y Ruiz 1995:34)"
    cita_corta: >-
      «Pictographs are found on Aruba, Bonaire and Curaçao and the Greater
      Antilles, while none has been found in the Lesser Antilles»
    epoca: >-
      🔴 SIN FECHAR — «The pictographs have not been ascribed to the
      Preceramic or Ceramic Period»
    etiqueta: hipotetico
    que_prueba: >-
      Que hay un rasgo de cultura material compartido entre las ABC y las
      Antillas Mayores y ausente de las Menores, y que el continente enfrente
      tiene pocas pictografías, lo que «distingue a las islas de Sotavento
      neerlandesas del continente en su registro arqueológico».
    que_NO_prueba: >-
      Prácticamente nada mientras no estén fechadas, y no lo están. Además,
      el propio autor traza la conexión posible por el CONTINENTE —
      concentraciones por el Orinoco hasta el Apure, al noroeste por el
      Portuguesa o el Guanare y por el Tocuyo hasta las islas (Haviser
      1991:97)—, no por el mar. Pintar en roca es una práctica demasiado
      extendida para que una distribución compartida sea contacto. Se anota
      porque es el único rasgo material compartido ABC↔Mayores que aparece en
      toda la parcela, y porque tiene una vía de resolución barata:
      Versteeg y Van Leeuwen recogieron material orgánico para datar por AMS.


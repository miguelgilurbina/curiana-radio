# 6. PARA MIGUEL — el issue: issues-pendientes/rivero-caquetios-casanare-2026-09-23.md
# ═════════════════════════════════════════════════════════════════════════
para_miguel:
  polity: >-
    NO hay «tercera polity» nueva: curiana_polities.py ya tiene cuatro
    atestiguadas más la occidental, y la `llanos` ya dice «hasta Casanare, y
    algunos grupos hacia el Orinoco en el estrecho de Barraguán» (desde Jahn,
    que lo saca de Rivero). Lo que Rivero añade es que ese extremo es otro
    mundo: s. XVII-XVIII, piedemonte andino, reducido en misión con Tunebos y
    Támaras, con una lengua que un misionero tenía que aprender aparte del
    achagua. Opciones en el issue.
  canon_parentesco_021: 'bajar de capa o partir la entrada (ver cruces.tamude). Opciones en el issue.'

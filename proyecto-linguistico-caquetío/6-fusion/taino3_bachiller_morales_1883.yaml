lectura_del_bloque:
  el_eyeri_es_el_habla_de_mujeres_de_goeje: >-
    🔴 cruzado con Goeje 1939 (ver `kalinago_goeje_1939.yaml`), casi todo el
    «eyeri» de Rafinesque es el HABLA DE MUJERES del caribe insular de Breton:
    `Eyeri` 'hombre' = Goeje p. 40 `f eyeri`; `Inara` 'mujer' = `f inharu`;
    `Kati` 'luna' = `f kati` (p. 54); `Kachi` 'sol' = `f kaši` (p. 54);
    `Ubec` 'cielo' = `ubeku` (p. 53); `Balana` 'mar' = `h balana` (p. 55, esa
    es de HOMBRES); `Nekera` 'cama' = `f ek(ê)ra` 'hamaca' (p. 46); `Boyez` =
    `boye, boyei` (p. 37); `Tuhonoco` 'casa' ~ `f ubonoko` (p. 45). O sea: la
    cabecera tiene razón al llamarlo «dialecto de las mujeres caribes», y es
    caribe insular, no taíno. **Lo único que Rafinesque añade es el error de
    llamarlo «de Borinquen».**
  la_lista_B_es_otra_cosa: >-
    las voces `B.` son taíno o castellano de las Antillas Mayores (`Ceiba`,
    `Maga`, `Guage` ~ guayacán, `Yocana` ~ Yocahu, `Ditaino` ~ nitaíno,
    `Piraguas`, `Coquillas`, `Manzanila`). Bachiller mismo descarta tres
    (`Boba`, `Furzidi`, `Saine`). No es eyeri.


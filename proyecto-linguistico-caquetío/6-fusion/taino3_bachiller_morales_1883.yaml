# ══════════════════════════════════════════════════════════════════════
# BACHILLER Y MORALES 1883 — *Cuba primitiva* — lo que la parcela T10 dejó a medias
#
# PROPUESTA (regla 5). Tercera campaña de minería, parcela M5. 2026-09-23.
# DOMINIO PÚBLICO: se transcribe literal.
#
# Complementa `6-fusion/taino_bachiller_morales_1883.yaml` (T10, 2026-09-22), que
# sólo transcribió del apéndice (A) las entradas que tocaban el lexicón, y las leyó
# en el OCR, que en los apéndices ENTRELAZA las dos columnas. Aquí va el apéndice
# (A) ENTERO y el bloque «eyeri» ENTERO, leídos en la IMAGEN (pp. 388-389 = pdf
# 392-393), columna a columna.
#
# El cotejo de su retraducción de Pané va aparte, porque lo emite un script:
# `6-fusion/taino3_pane_bachiller_cotejo.yaml` (`scripts/cotejar_pane_bachiller.py`).
# ══════════════════════════════════════════════════════════════════════
meta:
  obra_id: bachiller-morales-1883
  campana: tercera campaña de minería — parcela M5
  medido: '2026-09-23'
  como_se_leyo: >-
    en imagen, con `pymupdf` a 230 ppp, cada columna por separado. El OCR de
    archive.org de estas dos páginas no se usa para nada: entrelaza las
    columnas línea a línea (es lo que ya avisaba T10).
  pagina_impresa: 388-389
  que_es_la_lista: >-
    la de Rafinesque (1836), «recogidas por Rafinesque de los cronistas y
    viajeros», con cada voz marcada por isla — C. Cuba, J. Jamaica, L.
    Lucayas — y con las correcciones de Bachiller entre corchetes o
    paréntesis. ⚠️ Rafinesque es el compilador del que Goeje 1939 (p. 5)
    avisa que mezcló voces de un diccionario caribe: todo lo que sólo tiene
    esta lista detrás es clase (ii) como mucho, y la regla del consolidador
    lo marca como conjetura salvo que Bachiller nombre al cronista.

  # ── 🔴 lo que resultó FALSO al medirlo (de la parcela T10, ayer) ─────
  correcciones_a_T10:
  - afirmacion: '«`piragua` … Rafinesque vía Bachiller la marca EYERI» (T10, issue §7 y YAML b3)'
    medido: >-
      **FALSO.** En la imagen de la p. 389 la entrada es «Bote, *Piraguas*,
      **B.**» — y en la misma lista, «Bote, *Canoa*, *Payes*, **E.**». El
      bloque lleva DOS marcas, no una: `E.` (eyeri) y `B.`, que la cabecera no
      define y que por el contenido es **Borinquen** (voces del taíno de Puerto
      Rico: `Ceiba`, `Maga`, `Guage`, `Yocana`). Rafinesque pone `piragua` en
      Borinquen y `canoa` en el eyeri — al revés de lo que se leía en el OCR.
      Con esto `piragua` pierde uno de los «tres» apoyos para sacarla del
      taíno: quedan Goeje (caribe insular, sospecha del español *vela*) y la
      distinción funcional de Bachiller (p. 245). Dos manos, no tres.
  - afirmacion: '«`Ditaino` … aparece también en la lista eyeri» (T10)'
    medido: >-
      **FALSO.** «Noble, *Ditaino*, **B.**». Es de la lista de Borinquen, no de
      la eyeri. Lo que sí es eyeri es `Nucu-chilli`/`Nucu-churon` (padre/madre),
      `Mabuya`, `Uragan`, `Boyez`, `Chemin`, `Opoyun`, `Kati`, `Kachi`, `Balana`.
  - afirmacion: '«Perro "Aleo" (C)»; «Gusano "casi" (J)» (T10, erratas)'
    medido: '`Alco` y `cusi` en la imagen. Lecturas del OCR.'
  - afirmacion: '«Hutía / Quinaxes: Quinaxes = C; Hutía = L» (T10)'
    medido: >-
      la línea es «Conejo, *Usias. Hutia*, *Quinaxes*, C., *Hutia*, L.»: la
      marca C. va detrás de las TRES primeras formas (`Usias`, `Hutia`,
      `Quinaxes`), y L. detrás de la segunda `Hutia`. `hutia` es de Cuba Y de
      las Lucayas según esta lista, no sólo de las Lucayas.
  - afirmacion: '«Opoyem» (T10)'
    medido: '`Opoyun` en la imagen («Espíritu, *Opoyun*, E.»).'


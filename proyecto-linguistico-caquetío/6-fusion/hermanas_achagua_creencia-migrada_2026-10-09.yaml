# Propuesta de la creencia achagua y maipure (minería 1) migrada al esquema de
# 3-mundo/hermanas/README.md (§3). Origen: 6-fusion/creencia_achagua_2026-10-09.yaml,
# que no se toca. Los hechos llevan id_origen; lo que no es hecho va al final, sin cambios.
meta:
  pueblo: achagua
  recogido: '2026-10-09'
  estado: sin-fusionar
  quien: migración al esquema de hermanas (Claude Haiku 5.5), rama vault/hermanas-achagua-migracion
  origen: 6-fusion/creencia_achagua_2026-10-09.yaml
  plan: 4-fuentes/sesiones/09_creencia_achagua_mineria.md
  hechos_origen:
    total: 27
    achagua: 22
    maipure: 5
  hechos_migrados: 27
  huecos_de_migracion:
  - 'wayuu como segunda tradición (regla C, reconstruido) en ach-cr-06, ach-cr-11 y ach-cr-12: la propuesta nombra la tradición pero no trae obra ni página. Se toman de la referencia de creencia-003/005/008 del corpus caquetío (Perrin 1992-1995 y Paz Reverol 2017-2018), sin página: `pagina` lo dice. Perrin no está consultado (en_repo: false en la bibliografía).'
  - 'tema: asignado por el migrador. Donde el origen no decide entre dos temas, va `tema_duda`. No hay tema cerrado para la adivinación (yopa, agüeros): se propone `adivinacion` en meta.temas_propuestos y se usa en ach-cr-08 y ach-cr-09.'
  - 'testigo: el origen no lo trae por campo. Se decide por su `describe`: `vio` sólo en ach-cr-14, ach-cr-15 y ach-cr-16 (el origen dice «ve», «vio», «visto»); `lexico` cuando la fuente principal es una entrada de vocabulario de Neira; el resto `oyo`. ach-cr-05 y ach-cr-18 quedan `oyo` porque el origen no dice que el misionero lo presenciara.'
  - 'etiqueta: `atestiguado` en los 27: todos citan una primaria (Rivero, Neira o Gilij) con página. No hay hecho que sólo se apoye en steward-1948-hsai-4.'
  - 'epoca: no está por hecho en el origen. Se pone la de la primera obra de `fuente`, según el encargo (Rivero 1660-1736; Neira 1762; Gilij «1749-1767 (Gilij publica 1780-1784)» tal cual viene en el encargo, aunque el id de la obra dice 1780-1783).'
  - 'donde: no está en el origen. Se deriva de la obra (Llanos de Casanare; Orinoco medio, La Encaramada) y se amplía donde el origen generaliza.'
  - 'via_a: veredictos derivados del texto del origen, que lo dice en prosa. Donde el origen dice «corrobora» con alcance parcial («el núcleo», «con reservas», «en parte» o «NO dice» algo de la misma tesis) se usa `corrobora-en-parte`, por la regla «en duda, degradar». La prosa completa va a via_a_nota. Donde el texto es sólo «no toca…», no hay `via_a` y el texto va a via_a_nota.'
  - 'capa: `no-se-proyecta` del origen pasa a `no-proyecta` (vocabulario del validador); el original queda en proyeccion.capa_origen. `proyeccion.nota` lleva el texto de proyeccion del origen (con `corrobora:` cambiado a `corrobora ` y el id también en caquetio).'
  - 'procedencia: el `pagina` del origen se parte por fuente cuando el origen lo separa; las anotaciones («sin transcribir», «no vista hoy») se conservan dentro. `independiente` es false donde el origen dice que Rivero y Neira son un testigo (Juan Ribero = Juan Rivero) o que Gilij cita a Gumilla y conoció el manuscrito de Rivero; es null, con «sin declarar en el origen», donde el origen no lo dice.'
  - 'capa_colonial: se rellena sólo donde el origen marca explícitamente lo doctrinal o lo colonial; el resto de los hechos no lo lleva.'
  - 'sustrato: no está en el origen; el encargo sólo lo exige en kalinago. No se rellena.'
  - 'lectura: el campo `lectura` del origen se traslada como `lectura_origen`, para no confundirlo con `proyeccion.capa = lectura`.'
  - 'pueblo: los hechos con pueblo mixto (''achagua y maipure'', ''achagua (Gilij, Orinoco en general)'', ''maipure (y achagua por el nombre)'') conservan el texto del origen en pueblo_nota; el pueblo es el de su id.'
  - 'hermanas: los vínculos son los que el origen escribe en el texto (ach-cr-02, ach-cr-04, ach-cr-12 → mai-cr-01/-04; mai-cr-01 → ach-cr-02; mai-cr-04 → ach-cr-12; ach-cr-22 ↔ mai-cr-05). El vínculo tabaminarro (panteón de Neira, pliego 56) no es un hecho con id: queda sólo en el texto.'
  - 'fuera_del_encargo (fx-01 a fx-05): no son hechos de la hermana (no tienen capa ni etiqueta): se copian tal cual al final. panteon_neira_56 no estaba en la lista del encargo: se copia igual para que nada se pierda.'
  - 'comentarios del YAML origen (la cabecera, las notas de «Regla 1/5» y el marcador `# >>> censo_neira`) no se trasladan: son comentarios, no datos. Las claves de datos sí van completas.'
  - 'dominios: libres, a criterio del migrador (la etiqueta areal-orinoco se pone donde el origen habla de todo el Orinoco o del llano).'
  temas_propuestos:
    creencia:
    - adivinacion

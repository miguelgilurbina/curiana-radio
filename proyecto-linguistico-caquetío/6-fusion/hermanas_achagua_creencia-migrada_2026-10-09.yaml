  lectura_origen: '`tanasimi` admite tres cortes y ninguno se decide sin el arte: `tana-` ''sombra'' (`tanari, Nutana`, 92 izq.), `tana` ''jagua'' (71 izq.) o `Tanasí` ''convite, honras del difunto'' (42 izq., 68 izq.), más `-mi`. La sombra del muerto y el convite del muerto llevan las dos al mismo sitio; el parecido no decide.'

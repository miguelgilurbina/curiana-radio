- id: achagua-creencia-003
  id_origen: ach-cr-03
  esfera: creencia
  tema: espiritu-tutelar
  contenido: 'Dioses menores con dominio y con nombre, que no se adoran: uno de las labranzas, uno de las riquezas, uno del fuego, el que causa los temblores, un «dios tonto», y «así iban haciendo un catálogo de dioses y diosas, que omito». El vocabulario del mismo autor añade un flechero, uno de las tempestades, el de los truenos (`Eno`) y un «Dios signo del cielo», y diosas: la criadora de los achaguas,
    la madre del lucero de la tarde y una estrella. Qué nombre va con qué dominio en el vocabulario está corrido un escalón (sección `panteon_neira_56`).'
  cita: '«á los dioses particulares de los Achaguas los llamaban así: Jurrana-minari, al de las labranzas; Baraca, al de las riquezas; Cuisiabirri, al del fuego; Pruvisana, al causador de los temblores; Achacató, dios tonto» (Rivero p. 113).'
  grafia: 'Jurrana-minari, Baraca, Cuisiabirri, Pruvisana, Achacató, Neira: Jurruna minari, Varaca, Cuisiaberri, Prubisana, Apichabirri, tarrari, Eno, Achacato, Amaribaca Vreca, capurraye; diosas tabaminarro, Vrumadua, Jarrutua, Jumenirro'

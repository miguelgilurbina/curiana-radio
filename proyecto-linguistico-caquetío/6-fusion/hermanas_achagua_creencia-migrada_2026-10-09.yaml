fuera_del_encargo:
- id: fx-01
  contenido: 'SÁLIVA: un segundo entierro con los huesos bebidos. «Con sus difuntos tienen un rito particular»: los entierran como las demás naciones y celebran su «cabo de año ó aniversario»: convocan a parientes y vecinos, «desentierran los huesos del difunto, y poniéndolos en medio de la casa, se sientan al rededor», los velan «cuatro, seis y ocho días con sus noches», y al fin ponen la osamenta
    en una pira y beben las cenizas con la bebida, «en lo cual les parece que beben toda la valentía y propiedades del difunto á quien celebran».'
  fuente: rivero-1883
  pagina: pp. 210-211 (pdf 231-232), vista en imagen la p. 211
  pueblo: sáliva (familia sáliba-piaroa, no arahuaca)
  para_que_sirve: 'Es la comparanda REGIONAL del caquetío que bebe los huesos (creencia-010, 010c), mucho más cerca de él que el wayuu que los redeposita, y trae su propio porqué: beber la valentía del muerto. No es hermana: no puede subir ninguna capa. Pero pesa en la auditoría de 010d.'
- id: fx-02
  contenido: 'GIRARA Y AIRICOS (Rivero cap. VIII): «Toda la gentilidad de los Llanos y del río Orinoco es tan parecida en sus abusos y ritos... que lo que se dice de los unos se puede aplicar á los otros». En los entierros, «los mismos ritos que los Achaguas»; la viuda airica llora nueve días al amanecer en el arroyo, se corta el pelo y se pinta de negro; el ajuar (totumas, bebidas, bollos, arco, flechas,
    hacha); nadie usa las cosas del muerto y su maíz se deja perder; usan la yopa «como los Achaguas»; dos dioses hermanos (el mayor creó y mandó el diluvio, el menor bajó y mueve la tierra con el brazo), la lluvia es el vino que derraman los dioses borrachos, viven en las estrellas; los mojanes airicos curan soplando, y ponen «Moján» en el pecho de las madres.'
  fuente: rivero-1883
  pagina: pp. 113-118 (pdf 134-139), vistas en imagen las pp. 113, 115-116 y 118
  pueblo: girara y airicos (vecinos del piedemonte, no achaguas según Rivero)
  para_que_sirve: 'Separa lo achagua de lo llanero general: el funeral con ajuar, la yopa, el mohán que sopla y el temor a las cosas del muerto son del llano entero; el panteón con nombres, Cuaygerri, el relato de sueños al alba, la Chuvay, la chaca, la berría de cazabe y el llanto que alaba las virtudes los da Rivero como achaguas.'
- id: fx-03
  contenido: 'OTOMACOS: lloran a sus muertos «due ore innanzi dell''aurora», en casa, cantando: «i tali ci recavano de'' pesci, e delle testuggini per alimentarci. Ora non abbiam più veruno, che ci nudrisca. Oh quanto foste mai buoni verso noi! Ma alcun dì ci rivedremo nel luogo del vostro riposo».'
  fuente: gilij-1780-1783
  pagina: t. III p. 402 (pdf 423), notas; Gilij cita a otro ex-misionero
  pueblo: otomaco (lengua aislada, no arahuaca)
  para_que_sirve: Tercer pueblo de la región con el llanto que recita lo que el muerto hacía por los suyos (con el caquetío de Oviedo y el achagua de Rivero). Regional, no hermana; y otra vez el alba.
- id: fx-04
  contenido: 'TAMANACOS: a Mavàri, «genio infesto», «in certi balli gli fanno offerte di bevande, e di cibi, affinchè non sia loro molesto»; «Mavàri sac-matepù», «facciamo così per rallegrare Mavàri, acciocchè non ci nuoca».'
  fuente: gilij-1780-1783
  pagina: t. III pp. 16-17 (pdf 37-38); Gilij cita a Gumilla t. I cap. X
  pueblo: tamanaco (caribe)
  para_que_sirve: 'Ofrenda de comida y bebida a un ser temido, para que no dañe: la forma de creencia-016, pero en un pueblo caribe. No es hermana: no sirve de ruta arahuaca.'
- id: fx-05
  contenido: 'La carta del Superior de las misiones a la Real Audiencia (1665), que Rivero copia: «Hallamos en dicho pueblo los indios sin noticia de Dios, tan metidos en sus ritos y supersticiones antiguas... Mojanes, muchísimos, todos Yoperos y supersticiosos; unos reconocían á los cerros por sus dioses, otros á los pájaros, otros á las estrellas, muchos al Sol».'
  fuente: rivero-1883
  pagina: p. 198 (pdf 219), vista en imagen
  pueblo: 'SIN FIJAR: «dicho pueblo» puede ser Pauto (la doctrina que la Compañía tomó, de «Cacatíos de nación», p. 54) o el Puerto de Casanare (achagua), el último nombrado'
  para_que_sirve: 'Es el testimonio más viejo de todo lo leído (1665, antes que el texto de Rivero) y el único que pone CERROS como dioses en los Llanos. Si «dicho pueblo» es Pauto, sería la única noticia de la creencia de un grupo caquetío, el de los Llanos (regla 4: comparanda interna, nunca dato costero); si es el Puerto, sería achagua. Fijar el antecedente pide leer la carta entera (pp. 197-201):
    queda para quien integre o para Miguel. Toca creencia-015 (el dueño del paisaje) más que nada de lo leído.'
lo_que_no_hay:
- 'SEGUNDO ENTIERRO ACHAGUA: ninguno. Leídos enteros los caps. VI-VIII de Rivero (pp. 102-118) y leídas en contexto todas las páginas del OCR entero con `huesos`, `calavera`, `difunt` o `entierr`: el único segundo entierro del libro es el sáliva (fx-01). Neira tiene el lema «Desenterrar = Numichedau, masicanimí» (54 der.), sin ejemplo que diga para qué.'
- 'BEBER LOS HUESOS: sólo el sáliva (fx-01). Ni achaguas, ni girara, ni airicos en Rivero; ni maipures en el libro I de Gilij.'
- 'TIERRA DE LOS MUERTOS CON NOMBRE: ni en Rivero (sólo «el camino de la otra vida») ni en Neira (los ejemplos con «Infierno» son de doctrina, 65 der.). El maipure tiene lugares para buenos y malos, sin topónimo.'
- 'LA EXHUMADORA Y SUS TABÚES (creencia-011): nada en los tres.'
- 'HUESOS O CENIZAS Y LLUVIA (creencia-012): nada en los tres. La lluvia como vino derramado por los dioses es girara/airica (fx-02), no achagua.'
- 'EL MAR: ningún ser ni rito del mar en lo leído (ya medido en cosmovision_marina; se confirma).'
- 'LAS MUJERES EXCLUIDAS DE LA CHUVAY «lest they die» (HSAI 4 p. 410): no está en Rivero pp. 102-118; `grep` de `chuv|pruvis|tanasu|mueran` sobre el texto de Gumilla: sin acierto. Hernández de Alba trae además «Tanafimi and Tanasuri», Pruvisana que «holds up the earth» y el culto a las lagunas: nada de eso en Rivero. La fuente queda sin localizar (¿Karsten 1926?).'
- 'DUEÑO DE UN LUGAR (un cerro, un manantial que veda): no en lo achagua leído (ach-cr-04). Un solo indicio en el libro: la carta de 1665 (fx-05), «unos reconocían á los cerros por sus dioses», de un pueblo que no se puede fijar. La laguna de la p. 98 (pdf 119) donde Satanás habla en forma de serpiente es de los tunebos (chibchas), no achagua.'
- 'QUETI: no es un ser. En maipure es ''animal'': Gilij pone `Purrunaminàri, Vasùri, Queti` junto a las voces tamanacas del ser supremo, el demonio y el animal (t. III p. 159). El «ballo Queti» del t. II sería un baile del animal; el t. II no está en el repo.'
correcciones:
- que: 'plan 08 §1.2 y §4 1º: «Rivero escribe Cuaygerri y Cuoygerri en la misma página»'
  medido: la imagen de la p. 112 dice Cuaygerri las dos veces; «Cuoygerri» es del OCR.
- que: 'plan 08 §1.3 y §3 C: páginas de Gilij t. III'
  medido: Purrùnaminàri está en las pp. 6-7, no 8-9; la costilla en la p. 23, no 25; Queti y el demonio maipure en la p. 159, no 155. Las cifras del plan eran el marcador «impresa» del OCR (pdf − 19), y en el libro I el desfase es − 21 hasta el pdf 50. El demonio es `Vasùri` (imagen pp. 14, 15, 33, 159), no «Vasìtri». El índice da «Tapanimarru, chi sia? 6»; el texto está en la p. 7.
- que: el PDF del t. III de Gilij
  medido: 'salta las pp. 30-31 (pdf 50 = p. 29, pdf 51 = p. 32): faltan dos páginas del cap. VII «Riflessioni». Desde ahí el desfase es − 19.'
- que: Rivero p. 106, el OCR
  medido: la oruga del veneno es `barbarí`, no «barban».
- que: YAML de Neira (6-fusion/achagua_neira_ribero_1762.yaml)
  medido: '(1) `Purubisana` → `Prubisana` (56 izq.). (2) «Espíritu, alma = Guabasi, Guabauimi» (62 izq.): la imagen parece `Guabaimi`; verificar a 2-3×. (3) SIETE PÁGINAS SIN TRANSCRIBIR: 32 der., 40 izq., 41 der., 52 izq., 72 izq., 79 der., 92 der. (medido por lado en `censo_neira.lados_sin_entradas`; las siete se vieron en imagen y tienen entradas). El ensamblador mide los huecos por pliego y no los
    ve. Dos traen creencia: 52 izq. («Curar = Nuidebeayu, numeda ridebe», «Curar soplando = Nugiayu», «Cura tal = Chabicuri», «Danza = Ybabedacasi», «Dado á mugeres = Inaminari») y 92 der. («Soñar = Masiu numaca», «Sueño = Dasuisi», «Soñar, tener pesadillas = Carrunata numayu», «Soplar à los enfermos = Numariuni», «Soplam.to tal = Chabicuri»): leídas aquí por visión, para la creencia; el resto de esas
    páginas sigue sin transcribir.'
- que: 'ficha neira-ribero-1762 y plan 08 §1.1: «No queda ninguna página por leer en imagen»'
  medido: 'no es cierto: quedan las siete páginas de arriba.'
- que: notas que dicen que Gilij no tiene capa de texto
  medido: 'el t. III tiene OCR desde el 2026-09-23 y su libro I está minado aquí. Lo dicen: 3-mundo/ensayos/03_creencia_caquetia.md línea 20; 3-mundo/mapa-creencia.md líneas 61 y 76; 3-mundo/mapa-transmision.md línea 62; 4-fuentes/INDICE_FUENTES.md línea 104; 4-fuentes/sesiones/03_creencia.md líneas 169 y 177.'
auditoria_via_a:
  creencia-002: 'no toca / matiza: el sueño achagua lo cuenta cada casa y lo abre el cacique, no el especialista (ach-cr-10). Se queda con una sola tradición (wayuu): señalado para revisión, no degradado.'
  creencia-003: 'corrobora en parte: tabaco y canto en el oficio de curar (ach-cr-06), segunda tradición arahuaca; licor, urari y espíritu-serpiente sin apoyo achagua; «piache-mohán» es voz regional (ach-cr-07).'
  creencia-005: 'corrobora el núcleo: el alma sale del cuerpo y vuelve (ach-cr-11) y lo soñado pesa (ach-cr-10); el viaje nocturno del alma en el sueño sigue siendo sólo wayuu.'
  creencia-006: 'corrobora con reservas: desmayarse y revivir son el alma que se va y vuelve a su lugar (ach-cr-11); que la enfermedad sea eso y que el especialista negocie el regreso, no; matiza con las armas contra la muerte (ach-cr-14).'
  creencia-007: 'no toca: ni la división de males comunes y del espíritu ni la cura por semejanza aparecen en lo leído.'
  creencia-008: 'corrobora: el muerto es un ser temido con nombre propio (guabaimi; maipure vasùri) (ach-cr-12); matiza: en el maipure el peligro lo da la muerte violenta; nada de los antiguos que protegen.'
  creencia-009: 'corrobora en parte (el camino a la otra vida, allá sirven las mismas cosas: ach-cr-16); no da topónimo; contradice en parte el «sin premio ni castigo» por el lado maipure, con sospecha de eco doctrinal (mai-cr-03).'
  creencia-010d: 'no toca: ni achaguas ni maipures exhuman ni redepositan. La comparanda regional que SÍ bebe los huesos es sáliva (fx-01) y da otro porqué —beber la valentía del muerto—, no la fusión con los ancestros del wayuu: 010d queda sin hermana arahuaca y con un vecino que lo lee distinto.'
  creencia-011: 'no toca: ninguna exhumadora ni tabú en los tres. Sigue siendo sólo wayuu.'
  creencia-012: 'no toca: nada de huesos y lluvia; la lluvia como vino de los dioses es girara/airica (fx-02). Sigue siendo sólo wayuu-cumanagoto.'

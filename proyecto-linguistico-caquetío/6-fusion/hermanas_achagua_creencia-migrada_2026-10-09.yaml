  contenido: 'El alma está dentro del cuerpo o fuera de él, y vuelve. «Ánima en el cuerpo — Gabasí. Fuera d[e] él = Guabasimi»; «Revivir — Guabasi esuayua» y «Bolver en sí — Ribaba esua», con el mismo `esua-` de «Bolver à mi lugar — Nuesuayua»: revivir y volver en sí es que el alma (o el corazón, `-baba`) vuelve a su lugar. Y desmayarse se dice con ella: «Desmayarse = Nubaba decuayu», «Parasismo = Guabasí».
    `Guabasí` es a la vez alma, corazón y estómago, y entra en gemir, suspirar, alegrarse y el albedrío: una sede de la vida en el pecho y el vientre.'
  cita: «Anima en el Cuerpo — Gabasí. fuera d[e]l = Guabasimi» (Neira 35 der.); «Revivir — Guabasi esuayua» (89 der.); «Bolver en sí — Ribaba esua» (42 der.).

  contenido: 'El alma del muerto anda como un ser, y se la teme. El duende es `Guabaimi` (el alma con el `-mi` de lo que ya fue), y a los españoles los llaman igual: «Blanco Español — Guabaymi. Guabaymigerrai. Así llaman los Duendes». Hay «Ojos p.a ver almas = Guabaimi tuibabare». El demonio de los jesuitas es `tanasimi`. En el maipure, Gilij encuentra que alma separada y demonio se confunden, y que
    el demonio (`Vasùri`) son sólo las almas de los muertos en guerra o en pleito (mai-cr-04).'

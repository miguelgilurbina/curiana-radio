  contenido: 'Un creador sabio, sin culto. Los achaguas reconocen «un Supremo Señor que lo crió todo», Cuaygerri, «que quiere decir el que todo lo sabe»; «esto enseñan á sus hijos», y cuando hablan de quién creó el cielo «dicen que fué el mismo Cuaygerri quien lo crió»; pero no le adoran. El maipure de Gilij tiene la misma figura: Purrùnaminàri, que hizo al hombre y al que no se le rinde culto (mai-cr-01).'
  cita: «un Supremo Señor que lo crió todo, á quien llaman Cuaygerri en su lengua, que quiere decir el que todo lo sabe, y esto enseñan á sus hijos» (Rivero p. 112).
  grafia: Cuaygerri
  pueblo: achagua

  contenido: 'El sueño es asunto público y se cuenta cada mañana: «su primera distribución por la mañana al rayar el día ha de ser ir refiriendo todos cuantos disparates han soñado, y esto en cada caney ó casa, empezando el primero de todos su Cacique ó Capitán; van contando el sueño en tono de lamentación muy á la larga, con un sonsonete tan triste y melancólico, que pone en confusión á todo el pueblo».
    El vocabulario tiene `Masiu numaca` ''soñar'', `Dasuisi` ''sueño'' y, aparte, «Soñar, tener pesadillas — Carrunata numayu», con la raíz de ''miedo'' (`Carrunicaí`).'

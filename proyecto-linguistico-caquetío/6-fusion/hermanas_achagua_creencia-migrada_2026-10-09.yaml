panteon_neira_56:
  imagenes:
    neira: pliego 56 izq. (056.jpg), recortes a 4,2 px/pt y la palabra Prubisana a 9 px/pt
    rivero: p. 113 (pdf 134), a 2,6 px/pt
  la_copia_dice: «Dioses de los Achaguas = Jurruna minari. El de las Labranzas = Varaca. El de las riquezas = Cuisiaberri. El del fuego [=] Prubisana. El causador de temblores = Apichabirri. Flechero = tarrari. De las tempestades = Eno. De los truenos [=] Achacato. Dios tonto = Amaribaca Vreca, capurraye Dios signo del cielo.» (Los «=» tras «fuego» y «truenos» caen en el lomo y no se ven.)
  rivero_dice: «Jurrana-minari, al de las labranzas; Baraca, al de las riquezas; Cuisiabirri, al del fuego; Pruvisana, al causador de los temblores; Achacató, dios tonto»
  leida_sin_correr: ninguno de los cinco pares de Rivero casa; Eno queda en «las tempestades».
  leida_corrida_un_escalon:
  - 'Jurruna minari — el de las labranzas (Rivero: Jurrana-minari)'
  - 'Varaca — el de las riquezas (Rivero: Baraca)'
  - 'Cuisiaberri — el del fuego (Rivero: Cuisiabirri)'
  - 'Prubisana — el causador de temblores (Rivero: Pruvisana)'
  - Apichabirri — flechero
  - tarrari — de las tempestades
  - 'Eno — de los truenos (el vocabulario: «Rayo, el trueno = Eno»)'
  - 'Achacato — dios tonto (Rivero: Achacató)'
  - 'Amaribaca Vreca, capurraye — Dios signo del cielo (sin «=»: conserva el orden nombre, glosa)'
  por_que_correrlo:
  - casan los cinco pares de Rivero, que es el mismo autor;
  - '`Eno` cae en «los truenos», que es lo que dice el vocabulario (87 der., 96 izq.);'
  - 'la copia se lee como la frase de Rivero —«Nombre, glosa; Nombre, glosa»— con los «=» puestos al estilo del vocabulario («glosa = voz»): cada glosa quedó pegada al nombre que la seguía. El último ítem, «Amaribaca Vreca, capurraye Dios signo del cielo», no tiene «=» y conserva el orden nombre-glosa: es el resto del orden original;'
  - 'indicio débil: «Rico = Cabarruanicayi / Riqueza = Guarrua» (89 der., visto) suena a Varaca/Baraca.'
  lo_que_queda_abierto:
  - '«Dioses de los Achaguas = Jurruna minari» y «Diosas = tabaminarro» forman un par -minari / -minarro (m. / f.): sin correr, serían los dos nombres genéricos; corriendo, son los primeros nombres de cada lista. Las dos lecturas lo explican.'
  - 'Las diosas: «Diosas = tabaminarro. Criadora de los Achaguas = Vrumadua. Madre del lucero de la tarde = Jarrutua. Vna estrella = Jumenirro». A favor de correr: `tabaminarro` se parece a `Tapanimarru`, la madre maipure (mai-cr-02), y daría «tabaminarro, criadora de los Achaguas». En contra: `Jarrutua` lleva `-tua` ''madre'' («Madre... mía = Nutua», 73 der.) y casa sin correr con «Madre del lucero
    de la tarde». No se decide. Lo robusto: entre las diosas hay una madre del lucero vespertino y una estrella.'
  grafia: La imagen dice `Prubisana` (P + la r del copista + ubisana), no `Purubisana` como trae el YAML de la transcripción. Rivero imprime `Pruvisana`.
  quien_lo_corrige: 'No se toca aquí el YAML de Neira: genera lexicon_achagua.py, que importa el motor. Lo corrige quien fusione, con esta sección delante.'
meta_origen:
  obra: rivero-1883 · neira-ribero-1762 · gilij-1780-1783
  recogido: '2026-10-09'
  estado: sin-fusionar
  quien: minero de fuentes (Claude Opus 5.5), rama vault/creencia-mineria-achagua
  pregunta: ¿Qué creían y hacían los achaguas con sus dioses, sus especialistas, sus muertos y sus fiestas; qué dice Gilij de los maipures como segundo observador; y qué de eso es un gesto que el caquetío ya atestigua, que el canon sólo reconstruye desde el wayuu (Vía A) o que sólo sostiene María Lionza (Vía B)?
  decision_de_miguel: 'Opción C (2026-10-09). Lo NUEVO entra con la regla estricta del lexicón: `reconstruido` sólo con dos tradiciones arahuacas independientes; con una sola, `hipotetico`; si sólo ilumina un hecho caquetío ya atestiguado, `lectura`. Lo wayuu de la Vía A se queda como comparanda y se audita con lo que aquí se encontró (sección `auditoria_via_a`).'
  campos_de_cada_hecho:
    capa: la capa que el hecho tendría AL PROYECTARSE al canon caquetío (reconstruido / hipotetico / lectura / no-se-proyecta). El hecho achagua o maipure en sí es atestiguado para su pueblo y su época, nunca dato caquetío.
    fuente: id de 4-fuentes/bibliografia.yaml (una o varias).
    pagina: página impresa (y del PDF o pliego), con lo visto en imagen.
    verificado_en_imagen: sí / en parte / no. La cita que decide una capa se vio en imagen.
    pueblo: achagua, maipure o los dos.
    describe: qué describe la fuente (gentilidad recordada, misión presente) y cómo se escribió.
    medio: proyectable / no-proyectable. No-proyectable = lo decide el medio de los Llanos (río, laguna, yuca brava, planta de sabana) y no se lleva a la costa seca.
    proyeccion: corrobora:<id> · segunda-hermana:<id> · ruta-arahuaca:<id> · nuevo · no-se-proyecta:<motivo> (el vocabulario del plan 08 §4).
    via_a: 'qué hace con los hechos de la Vía A (creencia-002, 003, 005-009, 010d, 011, 012): corrobora / contradice / matiza / no toca.'
    toca_canon: hechos del canon que no son de la Vía A (atestiguados o Vía B).
  las_fuentes:
    rivero-1883:
      que_es: 'Juan Rivero S.J. (1681-1736), Historia de las Misiones de los Llanos de Casanare, escrita hacia 1736, impresa en Bogotá en 1883. Libro II caps. VI-VIII (pp. 102-118) leídos enteros: el OCR de archive.org para localizar y la imagen para citar (desfase pdf − 21 en el tramo).'
      como_lee: 'Misionero del XVIII, «averiguado por larga experiencia de los fundadores de estos pueblos, y lo que se ha ido notando y averiguando después» (p. 102): mezcla la gentilidad recordada del XVII con los pueblos de misión de su tiempo. Todo rito es «trato con el demonio»; el creador es «á su modo el verdadero Dios»; el diluvio, Noé. Y avisa él mismo (p. 113) que «toda la gentilidad de los
        Llanos» se parece tanto que lo de unos vale para otros.'
    neira-ribero-1762:
      que_es: Arte y vocabulario achagua de Alonso de Neira y Juan Ribero, trasuntado en 1762, copia de 1788 (RB II/2910). Se le preguntó por la creencia sobre el YAML de la transcripción por visión (6-fusion/achagua_neira_ribero_1762.yaml) y se vio en imagen cada voz que se cita (los JPG, sólo en OneDrive, fuentes_caquetios/neira_ribero_1762/).
      como_lee: 'Un vocabulario castellano → achagua hecho por jesuitas: el lema lo elige el misionero, muchas veces para la doctrina («Criar de nada», «Dar el alma», «Resucitar»). La voz achagua es lo indígena; el lema, no siempre. Juan Ribero ES Juan Rivero: Neira y Rivero cuentan como UN testigo, y una coincidencia entre los dos no es una segunda atestación.'
    gilij-1780-1783:
      que_es: Filippo Salvatore Gilij S.J., Saggio di Storia Americana t. III (Roma, 1782), libro I «Della religione antica degli Orinochesi», pp. 1-34 (pdf 22-53), leído entero en el OCR del repo y en imagen. Gilij fue misionero en La Encaramada (Orinoco medio) de 1749 a 1767; sus informantes maipures tienen nombre (el regolo Caravàna).
      como_lee: 'Otro observador, con otros informantes y otro pueblo: los maipures, no los achaguas. Pero (1) para él el achagua es «un dialetto del Maipùre» (t. III p. 205): dos observadores de UNA tradición, no de dos; (2) supo del manuscrito de Rivero y leyó a Gumilla; (3) escribe en Roma para refutar a los «increduli»: busca en cada mito la verdad revelada y lo dice (la costilla, «parola per parola
        nel Genesi»).'
  independencia: 'Rivero y Neira y Ribero: un testigo. Gilij: otro observador del ramo maipure (achagua y maipure son, para él, una lengua con dialectos). Hernández de Alba (HSAI 4, pp. 399-412) resume a Rivero, Gumilla y Karsten y no cuenta. Si achagua y maipure valen como dos tradiciones para la regla de opción C es DECISIÓN DE MIGUEL; esta propuesta los cuenta como una, y por eso casi todo lo nuevo
    sale `hipotetico`.'
  respuesta_corta: 'El achagua corrobora, con un observador independiente de otro pueblo arahuaco, tres gestos que el caquetío ya atestigua: el llanto que canta las virtudes y hazañas del muerto (creencia-010), el ajuar «para el camino de la otra vida» (008c) y la muerte atribuida al hechizo (008b); y la ausencia de culto a los dioses (008c), con un matiz: el vocabulario sí tiene voz para «ídolo», y
    es la máscara de la danza (chubay). Da una segunda hermana arahuaca a tres hechos de la Vía A: el especialista que cura con tabaco y canto (003), el alma que sale del cuerpo y vuelve (005/006) y el muerto como ser temido (008). NO corrobora el segundo entierro, el beber los huesos, la tierra de los muertos con nombre ni a la exhumadora (010d, 011, 012). Lo nuevo —un creador sabio sin culto, dioses
    con dominio, el sueño contado al alba por el cacique, las estrellas como personas— sale `hipotetico`, porque achagua y maipure son una sola tradición mientras Miguel no diga otra cosa.'

  contenido: El llanto que canta lo que el muerto hizo. Un pregonero «que sirve de campana» convoca desde la puerta; en media hora están todos y lloran en comunidad; luego, uno a uno, «diciéndole sus requiebros al muerto, preguntándole que para qué se murió y los dejó solos, besándole las manos, haciendo memoria de su valentía, y de que jugaba bien con ellos el arco y flecha y macana; y descienden también
    á los pies, alabando su ligereza, que corría bien, que seguía mucho la caza, y así le van refiriendo sus virtudes»; a la mujer, «aquellas manos que hacían tan buen cazabe, que sazonaban tan buena bebida». Tres o cuatro días «de cuerpo presente», con chicha, hasta «una solemne borrachera».

  contenido: 'El ser supremo maipure es `Purrùnaminàri`. Gilij lo parte en `minàri` ''padrone'' y una forma vieja, supuesta por él, de `ununà` ''todo'': «Purrùnaminàri sarebbe, il padrone del tutto»; los maipures no sabían qué quería decir, porque habían muerto los viejos que «fan le veci de'' libri», y «non dispiaceva loro la mia interpetrazione». Hizo al hombre, no se le rinde culto, y los misioneros

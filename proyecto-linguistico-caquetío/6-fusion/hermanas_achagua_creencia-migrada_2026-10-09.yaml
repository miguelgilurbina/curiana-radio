  tema_duda: enfermedad-cura
  contenido: 'El especialista cura con el canto y el soplo, y con humo de tabaco. El vocabulario lo dice con una raíz: `Numariu` ''encantar, curar cantando'', `Maricai` ''encanto'' y ''brujería'' («curar con ella = Numariu»), `Camaricacayi` ''encantador'' y `Camaricacay` ''brujo'', y, en una página que el YAML no transcribió, «Soplar à los enfermos — Numariuni» y «Soplam.to tal — Chabicuri», que es
    también ''ensalmo'' y ''cura tal''. Rivero: el piache «sirviéndole su propia boca de incensario, va incensando... con ciertos ensalmos», y a los moribundos los parientes «más humanos» los soplan y sahúman «con humo de tabaco».'
  cita: «Encantar, curar cantando — Numariu, nutaimariu» (Neira 61 izq.); «Brugeria — Maricai. Curar con ella = Numariu» (43 der.); «Soplar à los enfermos — Numariuni» (92 der.); «va incensando poco á poco con muchas ceremonias y gestos y con ciertos ensalmos» (Rivero p. 105).
  grafia: Numariu, nutaimariu, Maricai, Camaricacayi, Camaricacay, Numariuni, Chabicuri, Nugiayu 'curar soplando', Debi minari médico, chema 'tabaco'

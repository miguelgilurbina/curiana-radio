  contenido: '«Dueño» (`-minari`) es en achagua un sufijo de uso general, y además el de algunos seres: `Debi minari` ''médico'' (de `Debe` ''medicina''), `Jda minari` ''patrón de la nao'', `Cagina minarí` ''labrador'' (de `Cagina` ''labranza''), `Cuitaminarí` ''amo de casa'', `Eriminari` ''dueño del cielo'', `Ecunai minarí` ''idólatra''; pero también ''pacífico'', ''parlero'', ''astuto'', ''bárbaro'',
    ''compasivo'', y en una página sin transcribir `Inaminari` ''dado a mujeres''. Uno de los dioses de Rivero lo lleva (`Jurrana-minari`, el de las labranzas) y el ser supremo maipure también: Gilij lo parte en `minàri`, «la quale vuol dire padrone».'
  cita: '«Dueño del cielo = minari. Eriminari» (Neira 57 izq.); «Medico — Debi minari» (74 der.); Gilij p. 6: «della voce minàri, la quale vuol dire padrone».'

- id: achagua-creencia-005
  id_origen: ach-cr-05
  esfera: creencia
  tema: ofrenda-fiesta
  contenido: 'La fiesta a los dioses es una danza de máscaras, la Chuvay, y el vocabulario llama «ídolo» a lo mismo: `Ydolo = Chuai, Chubay`, e «idolatrar» es `Nuchubaidau`. Rivero: «se ha visto llevarlos ya en procesión tal vez, y hacer fiesta á sus dioses, la cual se reduce á una danza, en que se disfrazan todos á manera de matachines»; la última, «no há dos años», en un pueblo nuevo y en ausencia
    del Padre, sin que se pudiera averiguar «que sacasen ídolos».'
  cita: «llaman Chuvay» (Rivero p. 106); «Ydolo — Chuai, Chubay. Ydolatrar — Nuchubaidau» (Neira 69 izq.)

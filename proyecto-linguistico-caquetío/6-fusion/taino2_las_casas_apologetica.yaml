# 7. VEREDICTO MEDIDO sobre las 52 entradas taínas del lexicón
#    Cifras emitidas por el script de medida, no a mano (regla 1).
# ══════════════════════════════════════════════════════════════════════
veredicto_cobertura:
  universo: >-
    las 52 claves de `VOCABULARIO_BASE` con `fuente: taíno` o
    `taíno-reconstruido` que mide
    `6-fusion/taino_inventario_2026-09-21.yaml` §a_censo. El mismo
    fichero mide que **0 de 52** tienen hoy `procedencia.obra`.
  script: 6-fusion/scripts/medir_taino2_apologetica.py
  A_atestacion_primaria_limpia:
    n: 24
    definicion: "forma + glosa o marca prosódica + atribución declarada a la lengua de La Española o de las islas"
    claves: [aji, batata, batey, bejique, bixa, bohio, "bohío", caney, casabe,
             cazabi, cemi, guabina, guanin, guayaba, huracan, hutia, kunuku,
             maisi, manati, "maíz", naboria, nitaino, tabako, yuca]
    aviso: >-
      3 de esas 24 son pares de claves duplicadas en el lexicón para la
      misma voz (bohio/bohío, casabe/cazabi, maisi/maíz): **21 voces
      distintas**, 24 claves.
  B_misma_glosa_otra_forma: {n: 2, claves: [dujo, yamosa]}
  C_misma_forma_otra_glosa: {n: 1, claves: [daca]}
  D_usada_sin_marca_metalinguistica: {n: 2, claves: [cacique, cacike]}
  E_cero:
    n: 23
    claves: [abba, acoa, aduri, agari, akcicyaa, areito, cai, caiman, cayo,
             cobo, cohiba, higuana, iwana, maboya, manigua, mayani, papaya,
             piragua, taita, thigisi, tuna, wacusi, wagulo]
  resumen_en_una_linea: >-
    **24 de las 52 pasan de «cero cita primaria» a tener una, con página
    impresa exacta; 3 más reciben cita pero con conflicto de forma o de
    glosa; 25 siguen sin cita después de esta parcela.**
  voces_nuevas_que_la_obra_da_y_el_lexicon_no_tiene:
    n: 17
    lista: ["Guaoxerí", "Baharí", "Matunherí", "exbuneyes", "cohoba",
            "Vaybrama", "Yocahu Yagua Maorocotí", "Atabex", "Guaca",
            "Yocahuguama", "hupía", "taguaguas", "çibas", "batea",
            "hequetí", "canocúm", "yamoncobre"]
    nota: >-
      No se proponen para fusión. Son comparanda de la esfera y la
      decisión de si entran —y con qué etiqueta— es de Miguel. Tres de
      ellas (`Guaoxerí`, `Baharí`, `Matunherí`) son tratamientos de
      registro, que es la categoría donde el caquetío ya tiene
      `kudanga`/`kuté`.

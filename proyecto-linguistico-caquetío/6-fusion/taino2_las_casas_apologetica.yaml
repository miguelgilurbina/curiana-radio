    cuenta Las Casas como testigo de vista («Preguntando yo á los
    indios», «Yo los vi algunas veces celebrar su cohoba»). El
    **Yocahuguama**, el **ayuno** y el **Vaybrama** los atribuye
    explícitamente a fray Ramón. La cadena no es única: hay dos capas y
    conviene no mezclarlas al citar.


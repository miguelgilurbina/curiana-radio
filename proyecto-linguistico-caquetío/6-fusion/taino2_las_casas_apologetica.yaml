# ══════════════════════════════════════════════════════════════════════
# TAÍNO — Las Casas, *Apologética historia sumaria* (NBAE 13, Serrano y
# Sanz 1909 [c. 1527-1559])
# PROPUESTA (regla 5). Comparanda de la ESFERA DE CONTACTO, no caquetío.
# SEGUNDA campaña del taíno, parcela T9. 2026-09-22.
# ══════════════════════════════════════════════════════════════════════
meta:
  obra: las-casas-apologetica
  campana: taino2-2026-09-22
  parcela: T9
  advertencia: >-
    ESTO NO ES CAQUETÍO. Es taíno de La Española (y algo de Cuba y los
    lucayos) y entra como COMPARANDA de la esfera de contacto
    (CLAUDE.md, «El préstamo de esfera no es una fuga»). Ninguna voz de
    aquí se proyecta al caquetío. Lo que hace es dar CITA PRIMARIA a
    entradas taínas del lexicón que hasta hoy no citaban a nadie, y
    poner al lado del canon caquetío un paralelo institucional medido.
  colonial_por_definicion: >-
    Regla 3. Las Casas escribe c. 1527-1559 sobre lo que vio desde 1502
    y sobre lo que le contaron de 1492-1500. TODO es post-contacto. No
    se proyecta nada al precontacto caquetío: se señala el paralelo y
    se dice quién lo afirma.
  regla_8: >-
    `procedencia.obra` de cualquier fusión que salga de aquí apunta a
    `las-casas-apologetica` en 4-fuentes/bibliografia.yaml, id creado
    en esta misma rama.

  # ── §0 lo que de ESTE ENCARGO resultó falso al medirlo ─────────────
  correcciones_al_encargo:
  - afirmacion: «lo que la primera campaña dejó incluye
      `6-fusion/decisiones_campanas_2026-09-21.yaml` §dc.4»
    medido: >-
      Ese archivo NO EXISTE en main. `ls 6-fusion/decisiones_*` devuelve
      once ficheros y ninguno se llama `decisiones_campanas`; el de la
      fecha es `decisiones_tanda_2026-09-21.yaml`, y un grep
      insensible por «taino|taíno|apologet» sobre él devuelve 0. La cola
      de decisión de la primera campaña del taíno vive en
      `6-fusion/issues-pendientes/taino-*-2026-09-21.md` (cinco ficheros).
      No se pudo leer «§dc.4» porque no hay dónde.
  - afirmacion: «el desfase pdf ↔ impresa hay que calcularlo, como en la
      *Historia* de 1875, donde iba de +8 a +69»
    medido: >-
      Aquí el desfase es CONSTANTE: impresa = pdf − 14, y se sostiene en
      367 de las 388 páginas donde el número impreso se lee en la
      cabecera (las 21 restantes son ruido de OCR, no otro desfase).
      Esta edición imprime su propia foliación en la cabecera de cada
      página, así que la cita se ancla en la página impresa EXACTA y no
      por interpolación dentro del capítulo. Es la diferencia práctica
      más grande con la fuente de la parcela T2.
  - afirmacion: «areítos» (el encargo los pide como institución a buscar)
    medido: >-
      **La palabra `areíto` no aparece NI UNA VEZ en toda la obra.**
      Medido con los tres extractores y cuatro grafías del XVI
      (`areito`, `areyto`, `areit`, `areyt`): 0, 0, 0. Lo que SÍ hay es
      la INSTITUCIÓN descrita con todo detalle y sin nombrarla
      (pp. 537-538): ver `instituciones.i05`. Es el caso inverso al de
      `macana` en la *Historia* tomo I, donde estaba el nombre y no la
      cosa.
  - afirmacion: «la sucesión matrilineal de La Española, si aparece,
      aparecerá donde el encargo la buscó (parentesco/gobierno)»
    medido: >-
      Aparece, pero el primer barrido la dio por ausente porque se buscó
      «sobrino». Las Casas NO escribe «sobrino»: escribe «no los hijos
      de los señores, sino los de sus hermanas sucedían en sus estados»
      (p. 521). Un grep por `sobrino` sobre La Española da 0 y es
      la consulta, no la fuente — regla 6 otra vez. El pasaje se
      encontró leyendo el capítulo entero (skill §3).
  - afirmacion: «Brinton cita Apol. cap. 204 para los numerales
      (1 hequeti, 2 yamosa, 3 cauocum, 4 yaraoucobre)»
    medido: >-
      El capítulo es correcto (CCIV, p. impresa 538) y el primer numeral
      también, pero **tres de los cuatro no coinciden con esta edición**.
      NBAE 13 lee `hequetí`, `yamocá`, `canocúm`, `yamoncobre`.
      Verificado en IMAGEN, no sólo en la capa de texto. Nuestro lexicón
      tiene `yamosa` 'dos' vía Brinton: queda como conflicto de forma
      para Miguel (`conflictos.c02`), no se reescribe (skill §8).
  - afirmacion: «taíno»
    medido: >-
      **Las Casas nunca llama taínos a los taínos en esta obra.** Los
      dos únicos casos de `taino/tayno` son `Titano` y `Jano` partidos
      por el OCR, y `taheño` (p. 37) es 'pelirrojo' en castellano. El
      etnónimo que la bibliografía moderna usa no está en su fuente
      principal.

  # ── §1 desconfiar del extractor ────────────────────────────────────
  extraccion:
    herramientas: [pdftotext -enc UTF-8, pdftotext -enc UTF-8 -layout, djvu.txt de archive.org]
    plano_bytes: 3478376
    layout_bytes: 5566091
    djvu_bytes: 4244300
    paginas_pdf: 725
    imagecount_archive: 726
    por_que_los_tres: >-
      Los tres dan conteos DISTINTOS de la misma voz. Medido:
      `behique` 6 / 4 / 4, `guaoxeri` 0 / 0 / 1, `dujo` 21 / 21 / 24,
      `macorix` 8 / 8 / 9, `xaragua` 19 / 18 / 20, `opia` 85 / 84 / 84.
      **`guaoxerí` —uno de los tres tratamientos de rango, que es de lo
      más valioso de la parcela— sale SÓLO en el djvu de archive.org y
      en la imagen; los dos pdftotext lo pierden.** Si se hubiera
      trabajado con un extractor, faltaría.
    columnas_zipeadas: >-
      El cuerpo va a dos columnas y pdftotext entrelaza CARÁCTER A
      CARÁCTER las líneas de columnas vecinas en las zonas apretadas.
      No es la trampa de CLAUDE.md («tablas a dos columnas») sino su
      versión peor: `-layout` NO la arregla. Ejemplo real, p. 516:
      «elááloslmoasByaoshreañroírseesñloordlelqatumíeatlbulaonp;rdiemceeir--a».
      Ahí estaban las glosas de `baharí` y `matunherí`. Se resolvió
      leyendo la IMAGEN.
    imagenes: >-
      archive.org sirve la página por hoja:
      https://archive.org/download/historiadoresdei01serr/page/n<HOJA>.jpg
      (hoja = página pdf − 1), a 2412×3631 px. Ocho páginas se leyeron
      así. Las citas marcadas `verificado: imagen` salen de ahí; las
      marcadas `verificado: capa-de-texto` sólo de pdftotext.

  paginacion:
    que_es_el_pdf: >-
      facsímil escaneado por la University of Toronto (2011) del
      impreso de 1909, con capa de texto ABBYY. No es un ebook
      re-compuesto: es el libro.
    desfase: impresa = pdf_1based − 14  (CONSTANTE)
    como_se_midio: >-
      se extrajo el número suelto de la cabecera de cada página; 388
      páginas lo dan legible y en 367 el desfase es exactamente 14. Las
      21 restantes son lecturas basura del OCR (−36, −486, +104…), no
      otro desfase.
    indice_original: pdf 711-725 (impresas 697-704), tabla a dos columnas; necesita -layout
    como_se_cita_aqui: >-
      `pagina_impresa` es EXACTA en todas las entradas de este fichero.
      `capitulo` se da cuando la cabecera del capítulo se leyó en la
      misma página o en la anterior; cuando se deduce del mapa
      automático va con `~`.

  # ── §2 medir la ortografía ANTES de contar ─────────────────────────
  ortografia_medida:
    nota: >-
      conteos sobre el texto NFD sin diacríticos, minúsculas, de los
      tres extractores. La edición de Serrano y Sanz moderniza a medias:
      acentúa «á», «ó», «é», conserva la ç en voz indígena y escribe
      «munchos» donde hoy «muchos».
    ce_cedilla_viva: >-
      `çibas` (p. 521) y `çabanas` (p. 39) llevan cedilla en el
      impreso; los dos pdftotext las devuelven como `yibas`/`ribas`/
      `f'ibas` y `abanas`. **Un grep por `ciba` o `sabana` se pierde la
      entrada entera.**
    grafias_que_hay_frente_a_las_que_se_esperaban:
      cemi: "`cemi` 9, `cemies` 2, `çemi` 9 · `zemi` 0 · en el cuerpo la forma es «Cemí»"
      behique: "`behique(s)` 6, `bohique(s)` 2, `behico(s)` 2 · `buhuitihu` 0, `buhiti` 0, `bohiti` 0"
      areito: "`areito` 0, `areyto` 0, `areit` 0, `areyt` 0 — CERO en los tres extractores"
      haiti: "`Haytí` 1 y `Haití` 1 (misma voz, dos grafías, pp. 17 y 516)"
      caribe: "`caribes` 8 · `canníbales`/`caníbales` 2 — y Las Casas declara que son la MISMA gente con dos nombres en dos momentos"
      macorix: "`Macorix` 8-9, `Maçorix`, `macoriges` 1 · `macoriz` 0, `mazorix` 0"
      ciguayo: "`ciguayos` 3 · `cyguayo` 0 — al revés que en la *Historia* de 1875, donde `cyguayo` era la mayoritaria. La misma voz cambia de grafía entre las dos obras del MISMO autor"
      atabey: "`atabey` 0 — la forma de esta edición es **`Atabex`** (p. 321). Un cero que mide la consulta"
      yocahu: "`Yocahu` 1, y es parte de `Yocahu Yagua Maorocotí`; `Yocahuguama` aparte (p. 447)"
      guatiao: "`guatiao` 0, `guaitiao` 0, `datihao` 0 — cero REAL, ver `negativos.n01`"
      naboria: "`naboría` 3, siempre en el mismo pasaje (p. 447)"
      duho: "el impreso lee **`duohos`** (p. 446, verificado en imagen); `duho` 1 y `dujo` 21-24 son ruido de OCR sobre «dijo»/«dicho»"
    conteos_de_control:
      penultima: 38        # en la *Historia* 1875 era 0
      ultima_silaba: 33
      luenga: 127
      aguda: 47
      silaba: 83
      vocablo: 45
      lengua: 257
      lenguaje: 21
      interprete: 14
      quiere_decir: 109
      universal: 122

  cobertura_real:
    capitulos_de_la_obra: 267
    capitulos_localizados_por_cabecera: 169
    paginas_impresas_del_cuerpo: 696
    leido_pasaje_a_pasaje:
      - "caps. CXX-CXXI (pp. 321-325): religión de La Española, cemíes, behiques, las tres lenguas"
      - "cap. CXXX (p. 345): el caney como único «templo»"
      - "caps. CLXVI-CLXVII (pp. 444-448): sacrificios, cohoba, ayuno, Yocahuguama, naboría daca"
      - "caps. CXCVI-CXCIX (pp. 514-523): los cinco reyes, los tres tratamientos, las tres lenguas, matrimonio, herencia, çibas y guanín"
      - "caps. CCIII-CCV (pp. 535-540): hupía, cura por soplo, comida, canoas, bailes, batey, numerales, caribes"
      - "cap. XLIV (pp. 114-121): esclavos exbuneyes y el batey como plaza"
      - "caps. X-XIII (pp. 26-39): mantenimientos, cazabi, conuco, yuca, bohíos, çabanas"
      - "cap. LXV (p. 177) y cap. LXX (p. 181): «vocablos desta isla» y los tabacos"
      - "cap. CCXLI (pp. 631-635): coincidencias de lenguas y la herencia en Panamá"
    barrido_por_patron_sobre_el_tomo_entero:
      - "(penultima|ultima silaba|silaba (luenga|aguda|breve)|acento|se pronuncia|pronunciaci) → 107 bloques leídos"
      - "voz + marca prosódica, red automática → 108 ocurrencias, 97 formas distintas"
      - "guatiao|datihao|trocar nombres|tomar el nombre → 0"
      - "areito|areyto|bailes y danzas|cantares|cantaban → 45 bloques"
      - "canoa|caribe|behique|cacique|naboria|cemi|conuco|caney|duho|hupia|batey|tabaco|taino → 180 líneas"
      - "las 52 claves taínas del lexicón, con grafías del XVI declaradas"
    no_leido_pasaje_a_pasaje: >-
      El grueso del libro: los ~180 capítulos de erudición clásica
      (Grecia, Roma, Egipto, la India) y los bloques de Nueva España y
      del Perú, salvo donde el patrón los tocó. Es ~75 % de la obra y
      NO alimenta esta parcela, pero sí alimentaría una de
      «cómo compara Las Casas» que nadie ha pedido.

# ══════════════════════════════════════════════════════════════════════
# 1. LÉXICO — voces dadas como de la lengua de La Española (u otra isla)
#    Esquema heredado de 6-fusion/taino_las_casas_1875.yaml.
#    `marca_prosodica` es el aporte propio de esta obra: Las Casas
#    acentúa sistemáticamente, cosa que en la *Historia* hace 3 veces.
# ══════════════════════════════════════════════════════════════════════
lexico:

# --- gobierno y rango -------------------------------------------------
- id: lx.01
  forma_fuente: nitaynos
  glosa_fuente: "nobles y principales"
  cita_verbatim: >-
    «Habia en esta Isla y en cada reino della munchos nobles y estimados
    por de mejor sangre que los demas, y que tenian cargo sobre otros
    como de regillos y guiallos; éstos, en la lengua comun desta Isla,
    se llamaban nitaynos, la y letra luenga, nobles y principales.»
  marca_prosodica: "la y letra luenga"
  capitulo: CXCVII
  pagina_impresa: 516
  pagina_pdf: 530
  atribucion: declarada           # «en la lengua comun desta Isla»
  campo: jerarquia
  en_el_lexicon: "nitaino 'nitaíno, noble, principal, hombre de rango' (fuente: taíno, sin procedencia.obra)"
  verificado: imagen

- id: lx.02
  forma_fuente: Guaoxerí
  glosa_fuente: "el menor de los tres grados de señor; equivale a «vuestra merced»"
  cita_verbatim: >-
    «Tres vocablos tenian con que pronunciaban el grado y la dignidad ó
    estado de los señores: el uno era Guaoxerí, la última sílaba luenga,
    el cual ser el menor de los tres grados, como nosotros decimos á los
    caballeros «vuestra merced», significaba»
  marca_prosodica: "la última sílaba luenga"
  capitulo: CXCVII
  pagina_impresa: 516
  pagina_pdf: 530
  atribucion: declarada
  campo: jerarquia
  en_el_lexicon: NO
  verificado: imagen
  aviso_de_extractor: >-
    los dos pdftotext devuelven 0 ocurrencias de `guaoxeri`; el djvu da 1.
    La forma se leyó en la imagen.

- id: lx.03
  forma_fuente: Baharí
  glosa_fuente: "grado medio; equivale a «señoría», para los señores de título"
  cita_verbatim: >-
    «el segundo era Baharí, la misma última luenga, y éste como á mayor
    señor quel primero, como cuando á los señores de título decimos
    «señoría», ellos Baharí lo llamaban»
  marca_prosodica: "la misma última luenga"
  capitulo: CXCVII
  pagina_impresa: 516
  pagina_pdf: 530
  atribucion: declarada
  campo: jerarquia
  en_el_lexicon: NO
  verificado: imagen

- id: lx.04
  forma_fuente: Matunherí
  glosa_fuente: "grado supremo; sólo para los reyes; equivale a «Vuestra Alteza»"
  cita_verbatim: >-
    «era el tercero y supremo Matunherí, asimismo el acento en la
    postrera sílaba, que á solos los reyes supremos, como nosotros á los
    reyes decimos «Vuestra Alteza», ellos Matunherí lo aplicaban.»
  marca_prosodica: "el acento en la postrera sílaba"
  capitulo: CXCVII
  pagina_impresa: 516
  pagina_pdf: 530
  atribucion: declarada
  campo: jerarquia
  en_el_lexicon: NO
  verificado: imagen
  nota: >-
    Los tres son TRATAMIENTOS, no títulos de cargo: Las Casas los traduce
    por la escala castellana merced / señoría / alteza. Eso los pone al
    lado del `kudanga`/`kuté` caquetío (registro formal, d21.10) y no al
    lado de `cacique`.

- id: lx.05
  forma_fuente: naboría
  glosa_fuente: "sirviente o criado"
  cita_verbatim: >-
    «decian á grandes voces: «Dios naboría daca, Dios naboría daca», que
    quiere decir, en la lengua más comun y más universal desta Isla, «yo
    soy sirviente y criado de Dios» […] Naboría queria decir sirviente ó
    criado, y daca quiere decir yo.»
  capitulo: CLXVII
  pagina_impresa: 447
  pagina_pdf: 461
  atribucion: declarada           # «en la lengua más comun y más universal desta Isla»
  campo: jerarquia
  en_el_lexicon: "naboria 'naboría, servidor permanente, trabajador dependiente del cacique' (taíno, sin procedencia.obra)"
  verificado: imagen
  nota: >-
    Es la ÚNICA frase taína completa de toda la obra: tres palabras con
    traducción palabra por palabra dada por el cronista.

- id: lx.06
  forma_fuente: daca
  glosa_fuente: "yo"
  cita_verbatim: "«y daca quiere decir yo.»"
  capitulo: CLXVII
  pagina_impresa: 447
  pagina_pdf: 461
  atribucion: declarada
  campo: gramatica
  en_el_lexicon: "daca 'mano' (taíno-reconstruido desde Lok. daka) — GLOSA DISTINTA, ver conflictos.c01"
  verificado: imagen

- id: lx.07
  forma_fuente: exbuneyes
  glosa_fuente: "los de Cuba tenidos por esclavos por los de La Española"
  cita_verbatim: >-
    «cuando pasó la gente de esta isla Española, y poco á poco sojuzgó á
    la de aquella […] tuviéronlos como por esclavos y llamábanlos
    exbuneyes, la penúltima sílaba luenga, pero ninguna ó cuasi ninguna
    diferencia habia entre los hijos y aquellos que habian sojuzgado.»
  marca_prosodica: "la penúltima sílaba luenga"
  capitulo: XLIV
  pagina_impresa: 115
  pagina_pdf: 129
  atribucion: declarada
  campo: jerarquia
  en_el_lexicon: NO
  verificado: capa-de-texto
  nota: >-
    En la misma página Las Casas declara que **en La Española no hubo
    esclavos entre los indios** («porque en esta isla ninguno hovo entre
    los indios»): la voz es de un régimen INTER-INSULAR de conquista, no
    de una clase interna. Dato de contacto además de léxico.

# --- religión ---------------------------------------------------------
- id: lx.08
  forma_fuente: Cemí
  glosa_fuente: "los ídolos o estatuas; «el que hace llover y hace que haya sol, y nos da los hijos»"
  cita_verbatim: >-
    «tenian algunos ídolos ó estatuas de las dichas, y éstas
    generalmente llamaban Cemí, la última sílaba luenga y aguda; éstas
    creían que les daban el agua, y el viento y el Sol cuando lo habían
    menester» (p. 322) · «Preguntando yo á los indios algunas veces:
    ¿quién es aqueste Cemí que nombráis? respondíanme: el que hace
    llover y hace que haya sol, y nos da los hijos, y los otros bienes
    que deseamos» (p. 445)
  marca_prosodica: "la última sílaba luenga y aguda"
  capitulo: CXX y CLXVI
  pagina_impresa: [322, 445]
  pagina_pdf: [336, 459]
  atribucion: declarada
  campo: cosmos
  en_el_lexicon: "cemi 'cemí, ídolo sagrado, espíritu materializado' (taíno, sin procedencia.obra)"
  verificado: capa-de-texto
  nota: >-
    La segunda cita es de PRIMERA MANO y en estilo directo: Las Casas
    preguntando y el indio respondiendo. Es la mejor atestación de la
    entrada que hay en el repo.

- id: lx.09
  forma_fuente: cohoba
  glosa_fuente: "los polvos que se sorben por las narices, y el acto o ceremonia de tomarlos"
  cita_verbatim: >-
    «Estos polvos y estas cerimonias ó actos se llamaban cohoba, la
    media sílaba luenga, en su lenguaje» · «tomada su cohoba (que es
    sorber por las narices aquellos polvos, como está dicho)»
  marca_prosodica: "la media sílaba luenga"
  capitulo: CLXVI (y la variante del ms. en nota de CXX)
  pagina_impresa: [445, 446, 323]
  pagina_pdf: [459, 460, 337]
  atribucion: declarada
  campo: ritual
  en_el_lexicon: "NO como `cohoba`. El lexicón tiene `cohiba` 'tabaco' (taíno, vía Brinton). Son dos lemas distintos: ver conflictos.c03"
  verificado: imagen

- id: lx.10
  forma_fuente: behiques · bohiques · behicos
  glosa_fuente: "sacerdotes; sus teólogos, profetas y adivinos; y médicos"
  cita_verbatim: >-
    «Estos, pues, sacerdotes, que en la lengua destas Islas se llamaban
    behiques, que eran sus teólogos, profetas y adivinos, hacían á estas
    gentes algunos engaños, mayormente cuando se hacían médicos»
    (p. 323) · «los sacerdotes que tenían y llamaban bohiques, eran los
    hechiceros y agoreros y médicos» (p. 365)
  capitulo: CXX, CXXXV, CLXVI-CLXVII, CCIII
  pagina_impresa: [322, 323, 365, 445, 446, 447, 535]
  pagina_pdf: [336, 337, 379, 459, 460, 461, 549]
  atribucion: declarada           # «en la lengua destas Islas»
  campo: cosmos
  en_el_lexicon: "bejique 'bejique, chamán taíno, mediador ritual' (taíno, sin procedencia.obra)"
  verificado: capa-de-texto
  nota: >-
    Tres grafías en la misma obra y ninguna es la moderna `bejique`.
    La glosa de Las Casas es CUÁDRUPLE —teólogo, profeta, adivino,
    médico— y es más rica que la nuestra.

- id: lx.11
  forma_fuente: duohos
  glosa_fuente: "banquetes bajos muy bien labrados, donde se sienta el señor para la cohoba"
  cita_verbatim: >-
    «y tomábase asentados en unos banquetes bajos, pero muy bien
    labrados, que llamaban duohos (la primera sílaba luenga)»
  marca_prosodica: "la primera sílaba luenga"
  capitulo: CLXVI
  pagina_impresa: 446
  pagina_pdf: 460
  atribucion: declarada
  campo: utiles
  en_el_lexicon: "dujo 'dujo, asiento de madera tallado del cacique' — FORMA DISTINTA, ver conflictos.c02"

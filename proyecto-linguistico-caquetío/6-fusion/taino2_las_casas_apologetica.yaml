negativos:

- id: n01
  que_se_buscaba: el guatiao — intercambio de nombres entre señores
  grafias_y_paráfrasis_probadas:
    ["guatiao", "guaitiao", "datihao", "trocar nombres", "trocaban … nombre",
     "tomar el nombre", "se nombraban … nombre"]
  resultado: "**0 en los tres extractores.**"
  por_que_importa: >-
    El encargo lo pedía como el paralelo institucional principal con el
    `datihao` de Oviedo. **La Apologética no lo conoce.** Eso no lo
    niega —Oviedo lo trae— pero sí dice que la etnografía taína más
    detallada del XVI, escrita por quien vivió allí cincuenta años, no
    lo registra. Quien apoye el paralelo caquetío en el guatiao tiene
    que apoyarlo en Oviedo y sólo en Oviedo.


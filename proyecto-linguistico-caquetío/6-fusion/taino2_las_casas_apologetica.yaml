# ══════════════════════════════════════════════════════════════════════
# 2. LA LENGUA MISMA
# ══════════════════════════════════════════════════════════════════════
metalinguistico:

- id: ml.01
  tema: cuántas lenguas había en La Española — LA VERSIÓN NÍTIDA
  cita_verbatim: >-
    «Tres lenguas habia en esta Isla distintas, que la una á la otra no
    se entendía: la una era de la gente que llamábamos el Macoríx de
    abajo, y la otra de los vecinos del Macoríx de arriba, que arriba
    pusimos en el capítulo… y capítulo… por cuarta y por sexta
    provincias; la otra lengua fué la universal de toda la tierra, y
    ésta era más elegante y más copiosa de vocablos y más dulce el
    sonido; en ésta, la de Xaraguá, como dije arriba, en todo llevaba
    ventaja y era muy más prima.»
  capitulo: CXCVII
  pagina_impresa: 517
  pagina_pdf: 531
  verificado: capa-de-texto
  por_que_importa: >-
    Es lo que la parcela T2 predijo que estaría aquí: en la *Historia*
    tomo I la tripartición es floja y Las Casas «no se acuerda» si
    macoriges y ciguayos diferían entre sí. Aquí es tajante: TRES
    lenguas mutuamente ininteligibles.
  ⚠️_corrige_lo_que_se_creia: >-
    **La tripartición NO es «taíno / macorix / ciguayo».** Las tres son
    *Macorix de abajo*, *Macorix de arriba* y *la universal*. El
    ciguayo no entra en esta lista. La fórmula corriente en la
    bibliografía (y en el encargo de esta campaña) no es lo que dice el
    pasaje.

- id: ml.02
  tema: «Macorix» es un GLOSÓNIMO, no un etnónimo opaco
  cita_verbatim: >-
    «Macorix quiere decir como lenguaje extraño, cuasi bárbaro, porque
    eran estas lenguas diversas entre sí y diferentes de la general
    desta isla.»
  capitulo: III
  pagina_impresa: 9
  pagina_pdf: 23
  verificado: capa-de-texto
  por_que_importa: >-
    El nombre de las provincias es la palabra taína para «el que habla
    raro». Es el mismo mecanismo que `guaycarí`/`jirajara` en nuestro
    lado de la esfera: el vecino se nombra por cómo suena. Hipótesis
    NUESTRA, no de Las Casas.

- id: ml.03
  tema: prestigio dialectal declarado — Xaraguá
  cita_verbatim: >-
    «Excedían todas las destas Isla en la lengua ser más delgada y de
    mejores y suaves vocablos polida […] habia entre nosotros tal manera
    de decir, que aquel reino de Xaraguá era la corte desta Isla.»
  capitulo: CXCVII
  pagina_impresa: 516
  pagina_pdf: 530
  verificado: imagen (parcial)
  por_que_importa: >-
    Un cronista del XVI declarando una variedad de PRESTIGIO dentro de
    una lengua indígena. Es exactamente el mecanismo que
    `curiana_social.py` pondera con `prestigio_de()` y el que
    `DISENO_KOINE` §4 quiere ver emerger. NO es prueba de nada
    caquetío: es un precedente documentado de que el fenómeno existía
    en la esfera.

- id: ml.04
  tema: quién sabía la lengua — y la calidad del dato de Pané
  cita_verbatim: >-
    «Este fray Ramón escudriñó lo que pudo, según lo que alcanzó de las
    lenguas, que fueron tres las que habia en esta Isla; pero no supo
    sino la una de una chica provincia que arriba dejimos llamarse
    Maçorix de abajo, y aquélla no perfectamente, y de la universal supo
    no mucho, como los demás, aunque más que otros, porque ninguno,
    clérigo, ni fraile, ni seglar, supo ninguna perfectamente dellas si
    no fué un marinero de Palos ó de Moguer, que se llamó Cristóbal
    Rodríguez»
  capitulo: CXX
  pagina_impresa: 321-322
  pagina_pdf: 335-336
  verificado: capa-de-texto
  por_que_importa: >-
    **Las Casas descalifica su propia fuente principal de religión
    taína.** Pané sabía bien una lengua MINORITARIA (el macorix de
    abajo) y mal la general, y además —dice Las Casas en p. 447— «no
    hablaba del todo bien nuestra castellana lengua, como fuese catalán
    de nación». Esto le pone un techo a `taino_pane_c1498.yaml`, de la
    primera campaña, que hay que escribir en su nota.

- id: ml.05
  tema: por qué nadie aprendió la lengua
  cita_verbatim: >-
    «Y esto de no saber alguno las lenguas desta Isla, no fué porque
    ellas fuesen muy difíciles de aprender, sino porque ninguna persona
    eclesiástica ni seglar tuvo en aquel tiempo cuidado, chico ni
    grande, de dar doctrina ni cognoscimiento de Dios á estas gentes,
    sino sólo de servirse todos dellas, para lo cual no se aprendían más
    vocablos de las lenguas, de «daca pan», «ve á las minas», «saca
    oro»»
  capitulo: CXX
  pagina_impresa: 322
  pagina_pdf: 336
  verificado: capa-de-texto
  por_que_importa: >-
    Es la explicación del propio cronista de por qué el corpus taíno es
    tan pobre. Y da de paso un uso más de `daca` en boca castellana
    («daca pan»), que es el castellano *daca* 'dame acá' y NO la voz
    taína: coincidencia de forma, no préstamo. Ojo a quien cuente.

- id: ml.06
  tema: el acento, sistemáticamente
  medida: >-
    La obra marca la prosodia de la voz indígena **97 formas distintas**
    (108 ocurrencias) con las fórmulas «la última / penúltima / media /
    primera sílaba luenga / aguda / breve» o «la letra e luenga».
    `penúltima` sale 38 veces; en la *Historia de las Indias* tomo I
    salía **0** (parcela T2). Es LA diferencia entre las dos obras.
  ejemplos_de_las_cuatro_fórmulas:
    - "«la última sílaba aguda» — axí, Guanahaní, Haytí, Samaná, quemí, maní"
    - "«la penúltima luenga» — cazabi, conuco, bohíos, hutías, guayabas, hupías, Vaybrama, exbuneyes"
    - "«la media sílaba luenga» — cohoba, tabacos, taguaguas, libupa"
    - "«la letra e luenga» / «la y letra luenga» — batéy, nitaynos, Higuéy, ceybas, caoban"
  verificado: capa-de-texto (la red) + imagen (los casos citados arriba)
  advertencia: >-
    La red automática NO es exhaustiva: pierde los tratamientos de rango
    (`guaoxerí`, `baharí`, `matunherí`) porque la columna venía zipeada,
    y pierde `batéy` p. 538 porque la fórmula es «la letra e luenga».
    97 es un SUELO, no un total.

- id: ml.07
  tema: coincidencias de forma entre lenguas — y el aviso de Las Casas
  cita_verbatim: >-
    «en la lengua de Popayán decían umbra por cierta provincia, y en la
    del Perú, michi por el pastor, y homo por sacerdote. Ítem, en la
    lengua general de la Española decían batea por dornajo, y en
    Cataluña hay una villa que se llama Batea»
  capitulo: CCXLI
  pagina_impresa: 633
  pagina_pdf: 647
  verificado: capa-de-texto
  por_que_importa: >-
    Las Casas está haciendo, en 1559, exactamente lo que la skill §2
    manda no hacer: enumerar parecidos de FORMA entre lenguas sin
    parentesco — y lo hace **para desmontarlos** (su tesis es que no
    prueban que los indios vinieran de los judíos). Es un precedente
    metodológico citable. De paso atestigua `batea` 'dornajo' en la
    lengua general de La Española, que el lexicón no tiene.

- id: ml.08
  tema: intérpretes
  medida: "`intérprete` sale 14 veces en la obra; ninguna en los capítulos de La Española."
  verificado: capa-de-texto

# ══════════════════════════════════════════════════════════════════════
# 3. EL MUNDO — instituciones que el canon caquetío también tiene
#    Para cada una: qué dice Las Casas (con página), qué dice nuestro
#    canon (con id) y QUIÉN afirma el paralelo. SIN proyectar.
# ══════════════════════════════════════════════════════════════════════
instituciones:

- id: i01
  institucion: sucesión por la hermana (matrilineal)
  lo_que_dice_las_casas: >-
    «Lo mismo de las herencias, del todo punto no lo penetramos, más de
    haber entendido que **no los hijos de los señores, sino los de sus
    hermanas sucedian en sus estados**; la razon que daban era porque no
    eran tan ciertos ser sus hijos los que por hijos tenian, como los
    que parian sus proprias hermanas, y de las hermanas eran ciertos ser
    sus hermanas, pues habia parido á ellos y á ellas una sola madre.»
  capitulo: CXCIX
  pagina_impresa: 521
  pagina_pdf: 535
  verificado: imagen
  lo_que_dice_nuestro_canon: >-
    `3-mundo/corpus/parentesco.yaml` declara el precontacto caquetío
    MATRILINEAL (memoria del proyecto: «precontacto = matrilineal, el
    dato patrilineal de Oliver es del cacicazgo colonial»).
  quien_afirma_el_paralelo: >-
    **NADIE. Lo vemos nosotros.** Las Casas no menciona a los caquetíos
    en este pasaje. Lo que tenemos son dos pueblos arahuacos de la misma
    esfera con la misma regla y —esto es lo notable— **la misma razón
    declarada**: la certeza de la maternidad. Que la razón coincida es
    más fuerte que que coincida la regla, porque la regla puede
    converger y el argumento es cultural.
  ⚠️_advertencia: >-
    Las Casas abre con «del todo punto no lo penetramos». Es un dato que
    su propio autor marca como flojo. Y en p. 635 da la MISMA regla y la
    MISMA razón para **Panamá**, que no es arahuaco: el argumento no es
    exclusivo de la familia y no sirve como prueba de filiación.

- id: i02
  institucion: el señor que es también el que adivina (nuestro díao/boratio)
  lo_que_dice_las_casas: >-
    «El primero que la comenzaba era el señor, y en tanto que él la
    hacia todos callaban; tomada su cohoba […] estaba un rato la cabeza
    á un lado vuelta y los brazos puestos encima de las rodillas, y
    despues alzaba la cara hácia el cielo hablando sus ciertas palabras
    […] El les daba cuenta de su visión, diciendo que el Cemí le habia
    hablado» (p. 446) · «en éstas se cree que á los sacerdotes, que
    llamaban behicos, hablaba el diablo, **y también los señores ó reyes
    cuando para ello se disponían**» (p. 445)
  capitulo: CLXVI
  pagina_impresa: [445, 446]
  pagina_pdf: [459, 460]
  verificado: capa-de-texto
  lo_que_dice_nuestro_canon: "`3-mundo/corpus/creencia.yaml` → **creencia-001b** (el cacique que es también piache: nuestro díao/boratio)"
  quien_afirma_el_paralelo: >-
    **NADIE. Lo vemos nosotros.** Y es el paralelo más limpio de la
    parcela: no es que el señor tenga un adivino, es que el señor
    ADIVINA, en público, el primero, y los demás responden «cuasi como
    cuando nosotros respondemos Amen». La función es la misma que
    creencia-001b describe. Que la sustancia sea distinta (allá polvo
    por la nariz, acá el ayuno) no rompe el paralelo de FUNCIÓN.

- id: i03
  institucion: el ayuno del que adivina
  lo_que_dice_las_casas: >-
    «cierto cacique y rey dellos hizo cierta abstinencia al Señor Grande
    que vive en el cielo […] el abstinencia fué que seis ó siete días
    estaban encerrados sin comer cosa alguna, sino cierto zumo de
    yerbas, para no del todo desfallecer […] Durante aquel ayuno, con la
    flaqueza de la cabeza les venian ó les aparecían ciertas formas ó
    imaginaciones de lo que deseaban saber» (p. 446) · en Cuba,
    «ayunaban cuatro meses, y más, continos» (p. 447)
  capitulo: CLXVII
  pagina_impresa: [446, 447]
  pagina_pdf: [460, 461]
  verificado: capa-de-texto
  lo_que_dice_nuestro_canon: "el ayuno del **boratio** en `creencia.yaml`"
  quien_afirma_el_paralelo: >-
    **NADIE. Lo vemos nosotros.** Nota epistémica: Las Casas explica la
    visión por la debilidad del ayuno —«con la flaqueza de la cabeza les
    venian»— y no por lo sobrenatural. Es una explicación NATURALISTA
    del trance, en 1559, y la misma que serviría para el boratio.
  ⚠️_advertencia: >-
    El ayuno de La Española lo INICIA un cacique según fray Ramón, y por
    tanto cuelga de la misma cadena que ml.04 descalifica en parte.

- id: i04
  institucion: la cura por el soplo y el estregar
  lo_que_dice_las_casas: >-
    «los sacerdotes ó hechiceros, que arriba dejimos llamarse behicos,
    les tomaban los brazos desde los hombros con ambas manos
    estregándolos y soplando, y lo mismo las piernas y por todo el
    cuerpo, cuasi como que con aquel estregar y soplar echasen el mal
    fuera» · y «sacaban» piedras de los cuerpos de los enfermos, de tres
    clases, cada una con su virtud: las sementeras, el buen parto, el
    agua (p. 323)
  capitulo: CXX y CCIII
  pagina_impresa: [323, 535]
  pagina_pdf: [337, 549]
  verificado: capa-de-texto
  lo_que_dice_nuestro_canon: "la cura del piache en `creencia.yaml`"
  quien_afirma_el_paralelo: >-
    **NADIE. Lo vemos nosotros.** El soplo curativo es panamericano y
    precisamente por eso NO prueba contacto ni filiación: es la trampa
    del `picure` (skill §3) en clave de rito. Se anota como paralelo de
    la esfera, no como derivación.

- id: i05
  institucion: el areíto — la COSA sin el NOMBRE
  lo_que_dice_las_casas: >-
    «Eran muy amigos de sus bailes, al son de los cantos que cantaban y
    algunos atabales roncos de madera, hechos todos sin cuero ni otra
    cosa pegada; era cosa de ver su compás, así en las voces como en los
    pasos, porque se juntaban trecientos ó cuatrocientos hombres, los
    brazos de los unos puestos por los hombros de los otros, que ni una
    punta de alfiler salia un pié más que el otro, y así de todos. Las
    mujeres por sí bailaban con el mismo compás, tono y orden; **la
    letra de sus cantos era referir cosas antiguas**, y otras veces
    niñerías, como «tal pescadillo se tomó desta manera y se huyó» […]
    Cuando se juntaban munchas mujeres á rallar las raíces de que hacian
    el pan caçabí, cantaban cierto canto que tenia muy buena sonada.»
  capitulo: CCIV
  pagina_impresa: [537, 538]
  pagina_pdf: [551, 552]
  verificado: capa-de-texto
  lo_que_dice_nuestro_canon: "`areito` está en el lexicón como voz taína, glosada «danza ritual narrativa, celebración colectiva»"
  quien_afirma_el_paralelo: "no aplica: aquí el problema es la PALABRA, no la institución"
  ⚠️_hallazgo: >-
    **La institución está entera y la palabra no está.** `areito` = 0 en
    toda la obra, en tres extractores y cuatro grafías. Nuestra glosa
    —«danza ritual narrativa»— es exactamente lo que Las Casas describe
    («la letra de sus cantos era referir cosas antiguas»), así que la
    glosa es buena; lo que no hay es la forma. La cita primaria de
    `areito` sigue debiéndose y hay que buscarla en Oviedo (que sí la
    usa) o en la *Historia* lib. III.
  y_ademas: >-
    Dos datos que nadie pidió y que el canon caquetío sí puede usar:
    (a) el canto de trabajo de las mujeres rallando yuca — un género
    aparte del baile; (b) los bailes son de hombres Y de mujeres, pero
    **por separado**.

- id: i06
  institucion: el caney como único «templo»
  lo_que_dice_las_casas: >-
    «no eran los templos, si en algo á religión ó superstición se
    enderezaban, sino las mismas casas de los caciques y señores» — y
    las primicias de la cosecha «poníanla en la casa grande de los
    señores y Caciques, que llamaban Caney, ofreciéndola y dedicándola
    al Cemí»
  capitulo: CXXX y CLXVI
  pagina_impresa: [345, 445]
  pagina_pdf: [359, 459]
  verificado: capa-de-texto
  lo_que_dice_nuestro_canon: >-
    la casa del díao en `3-mundo/corpus/` y los sitios de
    `6-fusion/sitios_era2.yaml`
  quien_afirma_el_paralelo: >-
    **NADIE. Lo vemos nosotros.** Lo aprovechable no es la palabra sino
    la ESTRUCTURA: una sociedad sin edificio de culto, donde la casa del
    señor hace de templo y de granero ritual a la vez. Si el canon
    caquetío tiene que decidir dónde pasa el rito, éste es el precedente
    documentado más cercano de la esfera.

- id: i07
  institucion: matrimonio y precio de la novia
  lo_que_dice_las_casas: >-
    «no entendimos que tomasen por mujer, hermana, ni prima hija de
    hermanos, ni que tuviesen los particulares más de una» ·
    «Los reyes y señores tenian munchas mujeres; no supe hasta qué
    tantas; del rey Behechío se dijo que tuvo treinta» ·
    «Los señores y los demás compraban á los padres las hijas que habian
    de ser sus mujeres, enviándoles por paga ciertas sartas de cuentas
    que llamaban çibas […] Daban tambien por precio ciertas hojas de
    guanín»
  capitulo: CXCIX
  pagina_impresa: [520, 521]
  pagina_pdf: [534, 535]
  verificado: imagen
  lo_que_dice_nuestro_canon: "`parentesco.yaml` (poligamia del díao, alianza entre casas)"
  quien_afirma_el_paralelo: "**NADIE. Lo vemos nosotros.**"
  ⚠️_advertencia: >-
    Las Casas declara TRES veces en tres líneas que no sabe: «no
    entendimos», «tampoco alcancé», «tampoco caímos en inquirir con
    cuáles ó con cuántas cerimonias se casaban». El pasaje es una lista
    de huecos con dos datos dentro. **Monogamia del común + poligamia
    del señor** es el dato firme; lo demás es su confesión de ignorancia
    y así hay que citarlo.

- id: i08
  institucion: las causas de la guerra
  lo_que_dice_las_casas: >-
    «las causas dellas eran, según entendimos, por alguna de tres […]
    la una, porque algunos de otros reinos venían á cazar en los campos,
    dentro de los términos del otro reino; la otra, si venían á pescar
    en los ríos; la tercera, cuando algún rey ó señor se concertaba con
    el otro que le diese su hija ó hermana por mujer, y le enviaba por
    ello ciertas preseas, y el otro, por alguna razón que le movía no se
    la enviaba, ó la daba á otro»
  capitulo: CXCVIII
  pagina_impresa: 520
  pagina_pdf: 534
  verificado: capa-de-texto
  lo_que_dice_nuestro_canon: "las tensiones declaradas de `6-fusion/elenco_era2.yaml` y `geografia_politica.yaml`"
  quien_afirma_el_paralelo: >-
    **NADIE. Lo vemos nosotros.** Dos de las tres causas son de
    TERRITORIO DE SUBSISTENCIA (caza y pesca ajenas) y la tercera es una
    alianza rota. Si el motor tuviera que generar un conflicto entre
    nodos, ésta es la tipología documentada más cercana.

- id: i09
  institucion: el guatiao (intercambio de nombres)
  lo_que_dice_las_casas: NADA. Ver `negativos.n01`.

# ══════════════════════════════════════════════════════════════════════
# 4. EL CONTACTO — islas ↔ Tierra Firme
# ══════════════════════════════════════════════════════════════════════
contacto:

- id: co.01
  tema: UNA sola área religiosa, de la Florida a Paria y hasta Veragua
  cita_verbatim: >-
    «las gentes desta Española, y la de Cuba, y la que llamamos de San
    Juan, y la de Jamayca, y todas las islas de los Lucayos, y
    comunmente en todas las demás que están en cuasi renglera desde
    cerca de la Tierra Firme que se dice la Florida, hasta la punta de
    Paria, que es en la Tierra Firme […] **y también por la costa de la
    mar las gentes de la Tierra Firme, por aquella ribera de Paria, y
    todo lo de allí abajo hasta Veragua, cuasi toda era una manera de
    religión**»
  capitulo: CXX
  pagina_impresa: 321
  pagina_pdf: 335
  verificado: capa-de-texto
  por_que_importa: >-
    **Es el hallazgo de contacto más grande de la parcela.** Un cronista
    del XVI declarando un ÁREA CULTURAL única que va de las Antillas a
    la costa continental, y el tramo «Paria → Veragua» **contiene la
    Kaketiana**. No dice «los caquetíos»; dice la costa entera. Es una
    afirmación de esfera hecha por la fuente, no por nosotros, y es
    exactamente el marco de `3-mundo/esfera-de-interaccion.md`.
  ⚠️_lo_que_NO_dice: >-
    No dice que sea la misma GENTE, ni la misma LENGUA, ni que hubiera
    tráfico. Dice «una manera de religión». Y lo dice para sostener su
    tesis apologética de que estas gentes tenían noticia natural de
    Dios: hay interés. Degradar en consecuencia.

- id: co.02
  tema: la cohoba también en Tierra Firme
  cita_verbatim: >-
    «las cohobas, que eran como sus sacrificios ó servicios, las
    celebraban desta manera, **y algo más se ha hallado desto en la
    tierra firme, hacia las provincias de Popayan**»
  capitulo: CXXX
  pagina_impresa: 345
  pagina_pdf: 359
  verificado: capa-de-texto
  por_que_importa: >-
    Segunda afirmación de continuidad isla ↔ continente, esta vez de un
    RITO concreto y nombrado. Popayán está lejos de la Kaketiana, así
    que no es nuestro nodo; lo que prueba es que el complejo de los
    polvos inhalados no se detiene en el mar.

- id: co.03
  tema: guanín — qué es y por qué lo valoraban
  cita_verbatim: "ver lx.25: «cierta especie de oro bajo que ellos olian», valorado POR EL OLOR"
  capitulo: CXCIX
  pagina_impresa: 521
  ⚠️_lo_que_NO_dice: >-
    **Las Casas NO dice de dónde venía el guanín.** No hay una sola
    palabra sobre su origen continental, ni sobre comercio de guanín, ni
    sobre quién lo traía. La cadena guanín → Tierra Firme, que es la que
    la arqueología usa, NO está en esta obra. Un cero verificado
    (regla 6) con `guanin` y `guanín` sobre el texto entero: 4
    ocurrencias, todas en la misma página 521, todas sobre el uso y el
    olor.

- id: co.04
  tema: canoas
  cita_verbatim: >-
    «Tenian sus barcos, como queda dicho, hechos de un madero cavado,
    que llamaban canoas, donde cabian cincuenta y cient hombres, y
    destos se usan en todas estas Indias» (p. 537) · «Habíalas en esta
    isla Española y en la de Cuba muy grandes, que cabían ochenta
    personas […] **El nombre de canoas es desta isla**» (p. 182)
  capitulo: LXX y CCIV
  pagina_impresa: [182, 537]
  pagina_pdf: [196, 551]
  verificado: capa-de-texto
  ⚠️_lo_que_NO_dice: >-
    **Nada de navegación de altura.** Ni una travesía entre islas, ni
    una ruta, ni un viaje a Tierra Firme en canoa. Las canoas salen
    descritas como objeto (tamaño, remos, material) y como el medio de
    la laguna de México. Un barrido por «canoa» + mar/navegar/isla da 0.
    Lo que hay son barcos grandes; lo que no hay es a dónde iban.

- id: co.05
  tema: los caribes — una gente, dos nombres, y la ola que llega a los dos lados
  cita_verbatim: >-
    «las naciones que habitaban, y habitan hoy en aquellas islas, que á
    los principios que á estas tierras venimos llamábamos caníbales, y
    agora se nombran caribes […] infestan y salen de sus proprias islas
    y tierras por hacer guerra **á los de otras partes, islas y Tierra
    Firme**» (p. 539) · «creyeron ellos que aquella gente debia ser los
    que llamamos caribes, y entonces los llamaban y llamábamos
    canníbales» (p. 447)
  capitulo: CLXVII y CCV
  pagina_impresa: [447, 539]
  pagina_pdf: [461, 553]
  verificado: capa-de-texto
  por_que_importa: >-
    `caribe` y `caníbal` son el MISMO referente con dos nombres en dos
    momentos, y lo declara el cronista. Y la presión caribe se describe
    tocando islas Y Tierra Firme: es el único mecanismo de contacto
    inter-regional que la obra describe en movimiento.
  ⚠️_lo_que_NO_dice: >-
    **Los caribes NO aparecen como intermediarios de nada.** No hay
    comercio, ni transporte, ni trueque: sólo razzia. La hipótesis del
    caribe como correa de transmisión de la esfera no tiene apoyo aquí.
  y_ademas: >-
    p. 583: «los indios que llamamos caribes, cuyas mujeres son tan
    varoniles […] sea corriendo en tierra, sea nadando en la mar,
    acometen y persiguen á los enemigos». Mujeres combatientes caribes,
    declarado.

- id: co.06
  tema: movilidad de personas entre islas
  cita_verbatim: >-
    «[Caonabó] según entendimos los que á los principios á esta Isla
    venimos, **era de nación Lucayo, natural de las islas de los
    Lucayos, que se pasó dellas acá, y por ser varón en las guerras y en
    la paz señalado, llegó á ser rey de aquella provincia**»
  capitulo: CXCVII
  pagina_impresa: 515
  pagina_pdf: 529
  verificado: capa-de-texto
  por_que_importa: >-
    Un extranjero llega de otra isla y acaba siendo uno de los cinco
    reyes de La Española, y se casa con la hermana del rey de Xaraguá.
    Es movilidad personal de largo alcance con ascenso social, no
    comercio. Si el elenco de la era 2 necesita un precedente para un
    foráneo que llega y sube, es éste.
  y_ademas: >-
    lx.07 (exbuneyes) es la otra cara: gente de La Española conquista
    Cuba y le pone nombre a los sometidos. Las islas no estaban quietas.

# ══════════════════════════════════════════════════════════════════════
# 5. CONFLICTOS con lo que el lexicón ya tiene (skill §8: NO se reescribe)
# ══════════════════════════════════════════════════════════════════════
conflictos:

- id: c01
  clave_lexicon: daca
  glosa_lexicon: "mano"
  etiqueta_lexicon: taíno-reconstruido (desde Lok. daka)
  lo_que_dice_la_fuente: "«daca quiere decir yo» — Apologética cap. CLXVII, p. 521→447"
  gravedad: ALTA
  por_que: >-
    No es una variante ortográfica: es OTRO SIGNIFICADO para la MISMA
    forma. Y el lado atestiguado es el de Las Casas, mientras el lado
    del lexicón es una reconstrucción del lokono. La política
    «la atestiguada manda» (2026-09-19) está escrita para el caquetío,
    pero el criterio —glosa normalizada idéntica— aquí ni siquiera se
    aplica, porque las glosas **no coinciden**: 'mano' ≠ 'yo'.
  lo_que_propongo: >-
    NO tocar la entrada. Levantar la pregunta: ¿el taíno `daca` es
    'yo' (atestiguado) y nuestro `daca` 'mano' es una reconstrucción
    homógrafa que hay que renombrar o retirar? Lo decide Miguel.

- id: c02
  claves_lexicon: [dujo, yamosa]
  lo_que_dice_la_fuente:
    dujo: "el impreso lee **duohos** (p. 446, verificado en imagen)"
    yamosa: "el impreso lee **yamocá** para 'dos' (p. 538, verificado en imagen)"
  gravedad: MEDIA
  por_que: >-
    Las dos entradas citan a Brinton 1871 en `notas`, y Brinton cita a
    la *Apologética*. Si nuestra fuente última es esta obra, las formas
    que tenemos no son las que esta edición imprime. O Brinton leyó otro
    testimonio del manuscrito, o hay un salto en la cadena. En los
    numerales el desacuerdo es de tres sobre cuatro: `yamosa`/`yamocá`,
    `cauocum`/`canocúm`, `yaraoucobre`/`yamoncobre`; sólo `hequeti`
    coincide.
  lo_que_propongo: >-
    NO tocar. Anotar en `notas` que NBAE 13 lee otra forma, con página,
    y dejar la decisión de cuál manda para cuando se pueda comparar con
    la edición de O'Gorman 1967 (que no tenemos y está en copyright).

- id: c03
  clave_lexicon: cohiba
  glosa_lexicon: "tabaco"
  lo_que_dice_la_fuente: >-
    `cohiba` = **0** ocurrencias. Lo que la obra atestigua son DOS
    lemas distintos: `cohoba` (los polvos que se sorben por la nariz y
    la ceremonia, p. 445) y `tabacos` (los canutos de humo que se toman
    por la boca, p. 181).
  gravedad: MEDIA
  por_que: >-
    La entrada `cohiba` 'tabaco' funde en una lo que la fuente separa en
    dos, y su forma no está en la fuente que la sostiene por interpósita
    persona. Además el lexicón ya tiene `tabako`.
  lo_que_propongo: >-
    NO tocar. Preguntar si `cohiba` debe (a) quedarse con su cita de
    Brinton y una nota de que la Apologética no la trae, (b) ceder ante
    `cohoba` con esta cita, o (c) archivarse por duplicar `tabako`.

- id: c04
  clave_lexicon: caney
  glosa_lexicon: "caney, bohío rectangular del cacique"
  lo_que_dice_la_fuente: >-
    «caney era la casa del señor principal», y Las Casas declara que
    **nunca preguntó qué significaba el vocablo** (p. 345).
  gravedad: BAJA
  por_que: "«rectangular» no está en la fuente. Es un dato que el lexicón afirma y no cita."
  lo_que_propongo: "añadir la cita de p. 345 y marcar «rectangular» como `deuda: sin-procedencia` (regla 8)."

- id: c05
  clave_lexicon: higuana
  glosa_lexicon: "iguana"
  lo_que_dice_la_fuente: >-
    **0** atestaciones para La Española. Las tres ocurrencias de
    `iguana/yguana/higuana` son: el zoo de Moctezuma (p. 133), y dos
    veces la reina **Higuanamá** (pp. 47 y 516), que es un antropónimo.
  gravedad: MEDIA
  por_que: "la entrada está etiquetada `taíno` atestiguado y esta obra no la atestigua."
  lo_que_propongo: "dejarla como está y anotar el cero medido; su cita sigue siendo Brinton."

- id: c06
  clave_lexicon: macana
  etiqueta_actual: caquetío-reconstruido
  lo_que_dice_la_fuente: >-
    «Estos vocablos cotaras, **macanas**, bixa, y maiz, y maguey, fueron
    vocablos desta isla y no de la Tierra Firme, porque por otros
    vocablos allá estas cosas llaman.» — cap. LXV, p. 177, verificado en
    imagen.
  gravedad: ALTA
  por_que: >-
    La campaña abierta en `6-fusion/issues-pendientes/macana-etiqueta-2026-09-21.md`
    midió que el apoyo achagua de `macana` **no existe** (las tres formas
    de Neira y Ribero significan 'dormidera', 'mazorca de maíz' e
    'indecible'). Aquí aparece un dato NUEVO y de signo contrario: Las
    Casas declara `macana` **voz de La Española y explícitamente NO de
    Tierra Firme**. Si eso es así, `macana` en el habla caquetía sería
    un préstamo de la ESFERA (taíno), no una raíz propia reconstruida.
  lo_que_propongo: >-
    NO tocar. Llevar esta cita al issue de macana como tercer dato, y
    que la decisión de etiqueta se tome con las tres piezas a la vez:
    (a) el achagua no apoya, (b) la cita actual es de otra glosa,
    (c) Las Casas la declara antillana y no continental.


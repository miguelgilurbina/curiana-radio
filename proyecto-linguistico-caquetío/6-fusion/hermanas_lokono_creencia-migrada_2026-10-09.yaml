- id: lokono-creencia-003
  id_origen: lok-03
  titulo: El espíritu propio del piache, con el que habla cada noche
  esfera: creencia
  tema: espiritu-tutelar
  tema_duda: especialista
  contenido: Un piache aruaca le dice al flamenco Eglin que «su demonio, con quien hablaba todas las noches, era muy bravo»; para hablar con «el demonio de los Blancos» manda a su familia a otra casa. Goeje da para el lokono seme-he 'dieu, génie tutélaire', y para el taíno, el habla de mujeres kalinago y el lokono la misma raíz para los «dieux ou esprits qui leur apparaissent dans l'état de transe».
  cita: 'Gumilla p. 156: «un Aruaca le dixo á éste, que su demonio, con quien hablaba todas las noches, era muy bravo». p. 157: «mandó á la familia, que se mudasen á otra, porque tenia que hablar con el demonio de los Blancos». Goeje p. 38: «dieu, Dieu f šeme, dieu, génie tutélaire A seme-he».'
  grafia: Piache, Aruaca (Gumilla) · seme-he, seme(-he) (Goeje)
  pueblo: lokono

- id: lokono-creencia-008
  id_origen: lok-09
  titulo: 'Orehu da a Arawanili la maraca y el semeci: el arte del piache viene del agua'
  esfera: creencia
  tema: iniciacion-especialista
  tema_duda: cosmos-origen
  contenido: 'En el mito de Brett, la mujer Orehu, espíritu de las aguas, sale de las olas y le enseña a Arawanili el semeci —la hechicería que agrada y domina al yauhahu— y le da la maraka; Arawanili «did not die, but went up». Pané cuenta algo del mismo molde: Guabonito, una mujer que Guahayona había dejado en el mar, lo cura en una guanara («lugar apartado») y le da guanines y cibas, y él pasa a llamarse Biberoci Guahayona; Goeje p. 7 lee ese nombre como el del behique tras la cura («initiation?»).'
  cita: 'Brinton p. 18: «the spirit of the waters, the woman Orehu, rose from the waves and addressed him. She taught him the mysteries of semeci, the sorcery which pleases and controls Yauhahu, and presented him with the maraka». Pané cap. VI: «Llamábase esta mujer Guabonito, y Guahayona cambió de nombre, llamándose en lo sucesivo Biberoci Guahayona».'
  grafia: Orehu, Arawanili, semeci, maraka, watra-mamma (Brinton) · Guabonito, Biberoci Guahayona, guanara (Pané, ed. Wikisource)
  pueblo: lokono
  epoca: Brett 1868; Pané c. 1498
  etiqueta: hipotetico
  testigo: tercera-mano
  procedencia:
    obra: brinton-1871
    pagina: 18 (imagen), nota 49 → Brett 1868
  procedencia_extra:
  - obra: goeje-1939
    pagina: p. 7 (imagen)
    independiente: null
    nota: sin declarar en el origen
  como_se_escribio: El lokono, de tercera mano y de un misionero; las identificaciones Orehu = Atabeira y Yauhahu = Yocauna son de Brinton
  hermanas:
  - pueblo: taino
    obra: pane-c1498
    pagina: cap. VI (Wikisource, sin página)
    que: Guabonito, mujer que Guahayona deja en el mar, lo cura en una guanara y le da guanines y cibas; el molde coincide, el contenido no
  segunda_hermana_origen: Taíno, Pané cap. VI (pane-c1498; texto de Wikisource, sin página). El molde coincide (mujer del agua, héroe, objetos sagrados, cambio de condición); el contenido no (guanines y cibas, no maraca ni arte de curar).
  filtro: 'la coincidencia es de molde, no de contenido, y el lado lokono es de tercera mano: en duda, degradar'
  caquetio: []
  proyeccion:
    capa: hipotetico
    nota: 'Ninguna por ahora: comparanda. Complementa cm24-c-l01 (6-fusion/cosmovision_marina_2026-09-24.yaml), no lo sustituye, y no reabre cc.10: no hace sagrado el mar caquetío ni da un dueño del mar. Si Brett se lee en primera mano (B4 de la nota 08) y la minería taína confirma la lectura iniciática de Guabonito, es el candidato mejor puesto para un origen reconstruido del arte del boratio.'
  via_a: {}

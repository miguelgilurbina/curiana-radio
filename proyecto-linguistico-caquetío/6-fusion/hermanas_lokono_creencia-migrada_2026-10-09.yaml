- id: lokono-creencia-007
  id_origen: lok-08
  titulo: El médico aruaca se lleva los bienes del muerto
  esfera: creencia
  tema: especialista
  tema_duda: muerte-entierro
  contenido: 'Al morir el enfermo, el piache aruaca cobra con «todo lo mejor del difunto, ménos lo que la pobre viuda pudo esconder». Gumilla lo da como la excepción aruaca a la norma del Orinoco, que es enterrar o quemar con el muerto sus armas y alhajas. Choca con su propia p. 200 («con todas armas»): o las armas van a la fosa y lo demás al médico, o Gumilla junta dos noticias distintas.'
  cita: 'p. 155: «lo que cobra por su trabajo, despues que muere el enfermo, y es todo lo mejor del difunto, ménos lo que la pobre viuda pudo esconder». p. 207: «Es uso casi universal entre aquellas Naciones de Orinoco y sus vertientes, ó enterrar con el difunto sus armas y alhajas, ó quemarlas; ménos entre los Aruacas, en donde (como dixe) el Médico carga con casi todo lo que era del difunto.»'
  grafia: Médico, Aruacas

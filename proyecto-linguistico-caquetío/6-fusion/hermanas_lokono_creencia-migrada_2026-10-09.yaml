  - obra: goeje-1939
    pagina: 7 y 37 (imagen)
    independiente: null
    nota: sin declarar en el origen
  como_se_escribio: Gumilla, de oídas y con desprecio; Brett, misionero, y Brinton, de tercera mano
  segunda_hermana_origen: No la hay. El «hochet» taíno de Goeje p. 7 (maiohaua) es su lectura del mayohavau de Pané, que Pané describe como un instrumento de madera, cóncavo y largo, para cantar (cap. XIV), no como un calabazo con piedras. El habla de mujeres kalinago nombra el sonajero del piache con otra palabra (šišira), y su cultura no cuenta (th.4 / D4).

- id: lokono-creencia-004
  id_origen: lok-04
  titulo: La enfermedad es una flecha que tira un espíritu
  esfera: creencia
  tema: enfermedad-cura
  contenido: En el mito de Brett que Brinton reescribe, el dolor y la enfermedad son las flechas invisibles que el yauhahu tira a los hombres, y los piaches lo invocan en sus conjuros. La frase lokona usa la palabra de todos los días para 'flecha', que ya está en la lista de Trinidad de 1598 (symare; semaara en 1800).
  cita: 'Brinton p. 18: «They tell of a supreme spiritual being Yauwahu or Yauhahu. Pain and sickness are the invisible shafts he shoots at men, yauhahu simaira the arrows of Yauhahu, and he it is whom the priests invoke in their incantations.» Brinton p. 9: «sagittæ, symare, semaara».'
  grafia: Yauwahu, Yauhahu, yauhahu simaira (Brinton) · symare (1598), semaara (1800)
  pueblo: lokono
  donde: Guayana británica
  epoca: Brett, Guayana británica, 1840-1860; Pané, La Española, c. 1498
  etiqueta: hipotetico
  testigo: tercera-mano
  procedencia:
    obra: brinton-1871
    pagina: 18 y 9 (imagen); el mito lo toma de Brett 1868, Part II chap. x (nota 49)
  como_se_escribio: 'Tercera mano (Brett → Brinton). «Supreme spiritual being» es el marco del misionero: el propio índice de Brett dice «Yauhahu or Demons», en plural (nota 08 §3.2). Se proyecta la flecha, no el ser supremo.'
  hermanas:
  - pueblo: taino
    obra: pane-c1498
    pagina: cap. XVI (Wikisource, sin página)
    que: el behique chupa y escupe lo que traía en la boca, y dice «mira cómo te lo he sacado del cuerpo, donde tu cemí te lo había puesto»
  segunda_hermana_origen: 'Taíno, Pané cap. XVI: el behique chupa, escupe lo que traía en la boca y dice «mira cómo te lo he sacado del cuerpo, donde tu cemí te lo había puesto». Independiente (c. 1498) y del mismo sentido: un espíritu mete en el cuerpo lo que enferma.'
  filtro: 'dos hermanas independientes (lokono y taíno), pero la enfermedad metida en el cuerpo por un ser invisible es pan-americana: baja a hipotético. Sin el filtro de especificidad de la nota 08 §3.3 sería `reconstruido`: lo decide Miguel.'
  caquetio:
  - creencia-006
  - creencia-007
  - creencia-008b
  proyeccion:
    capa: hipotetico
    nota: 'Hipotético: lo que el boratio saca del cuerpo lo puso un espíritu. No se proyecta ni el nombre (yauhahu) ni el ser supremo. Convive con creencia-008b (atestiguado: la muerte por conjuros de hechiceros, a los que obedecen los muertos).'
  ilumina: 'Oviedo t. II p. 299 (caquetío ATESTIGUADO, imagen): el boratio chupa el lugar del dolor, escupe, y al cabo de cinco o seis días saca de la boca «la espina ó piedra ó palo» y dice «Cata aqui lo que te mataba y causó el mal que tenias». Oviedo no dice QUIÉN puso la espina: ése es el hueco que llenan las hermanas. La cura entera no tiene hecho en el corpus; la propuso ya 6-fusion/taino2_oviedo_venezuela.yaml (creencia-001, «y_lo_que_se_gana»).'
  via_a:
    creencia-006: contradice
    creencia-007: no-toca
  via_a_nota:
    creencia-006: 'contradice: las dos hermanas dan otra causa (algo metido en el cuerpo), no el alma que se aleja'
    creencia-007: 'no toca: para Brett TODA enfermedad es flecha; no separa males comunes y del espíritu'
  verificado_en_imagen: si
  dominios:
  - enfermedad
  - etiologia
  - flecha-espiritu

# Migración al esquema de 3-mundo/hermanas/README.md §3 de
# 6-fusion/creencia_lokono_2026-10-09.yaml. Los hechos se trasladan campo a campo;
# lo que no es hecho va al final, copiado tal cual del origen.
meta:
  pueblo: lokono
  recogido: '2026-10-09'
  estado: sin-fusionar
  quien: migración al esquema de hermanas (Claude Haiku 5.5), rama vault/hermanas-lokono-migracion
  origen: 6-fusion/creencia_lokono_2026-10-09.yaml
  plan: 4-fuentes/sesiones/09_creencia_lokono_mineria.md
  hechos_origen: 8
  hechos_migrados: 8
  huecos_de_migracion:
  - 'capa_colonial: el origen no tiene el campo. Lo colonial (el plátano y el sesgo del cronista de lokono 07; «de oídas» de lokono 03) va en como_se_escribio. No se inventó.'
  - 'sustrato e implicacion_simulacion: el origen no los trae; no se completan (sustrato sólo aplica a kalinago).'
  - 'donde: omitido en lokono 02, 03, 05, 07 y 09, porque ni epoca ni contenido nombran región. Sí en 01 (de epoca), 04 (de epoca: Guayana británica), 08 (de contenido: Orinoco).'
  - 'procedencia_extra[].independiente: null (nota «sin declarar en el origen») en lokono 02 (Brinton y Goeje), 03 (Goeje) y 09 (Goeje p. 7). El origen no declara independencia entre Gumilla, Brinton y Goeje. No cambia la regla C: ningún hecho sale reconstruido.'
  - 'Brett 1868 (lokono 04 y 09): el origen lo cita sólo como capítulo o nota de Brinton, sin página ni lectura. No se añadió como procedencia_extra; queda en procedencia.pagina. CONFLICTO sin resolver: lo_que_queda dice que Brett 1868 está sin descargar, y 4-fuentes/sesiones/09 §6 dice que se descargó el 2026-10-09. Se copia tal cual.'
  - 'Pané (lokono 03, 04 y 09): va en hermanas con obra y «cap.», porque el texto de Wikisource no tiene página. El origen dice «sin páginas: se cita el capítulo».'
  - 'creencia-001: lokono 04 lo nombra en ilumina, pero es el id de la propuesta taino2_oviedo_venezuela.yaml, no del corpus caquetío. Se excluye de caquetio.'
  - 'via_a: el veredicto de cada hecho es lectura de su propio texto (lokono 01 creencia-003 = corrobora; lokono 02 creencia-003 = matiza). El global de creencia-003 en auditoria_via_a sigue siendo «corrobora en parte». El texto completo va en via_a_nota.'
  - 'ilumina: lokono 02 y 09 no lo traen en el origen; no se inventó. lokono 02 sí trae proyeccion.'
  - segunda_hermana (texto del origen) se conserva como segunda_hermana_origen; filtro se conserva como campo extra en 03, 04 y 09.
  - 'tema_duda: en 01, 03, 05, 08 y 09 el origen no decide el tema; se eligió el principal y se deja el otro.'
  - 'temas_propuestos: ninguno. Todos los temas caben en el vocabulario cerrado del README §4.'
  - otras_fuentes_lokonas (origen) pasa a procedencia_extra con el mismo texto de página e independiente null.
hechos:
- id: lokono-creencia-001
  id_origen: lok-01
  titulo: 'La consulta del piache aruaca: de noche, en una casita apartada'
  esfera: creencia
  tema: especialista
  tema_duda: enfermedad-cura
  contenido: El piache aruaca consulta encerrado en una casita apartada, «pero á vista de las Poblaciones», toda la noche, a gritos y con la maraca; pregunta al espíritu y, «quando se le antoja, muda de voz, y finge las respuestas»; lo que se quiere saber es si el enfermo vivirá.
  cita: «Para estas consultas tienen sus casitas apartadas, pero á vista de las Poblaciones; y encerrados en ellas los Médicos, se pasan toda la noche gritando, y sin dexar dormir á nadie, así por los gritos, como por la Maráca […] grita y pregunta al demonio el Piache (así llaman á los tales Médicos) y quando se le antoja, muda de voz, y finge las respuestas del demonio»
  grafia: Piache, Médico, Maráca (cursiva), Aruacas (cursiva)
  pueblo: lokono
  donde: Orinoco bajo y costa hacia Cayena
  epoca: Orinoco bajo y costa hacia Cayena; Gumilla trata con ellos en 1731 y publica en 1741 (ed. 1791)
  etiqueta: atestiguado
  testigo: oyo
  procedencia:
    obra: gumilla-1791
    pagina: t. I, impresa 155 (pdf 179; vista en imagen)
  como_se_escribio: 'Jesuita hostil: «embustero», «demonio», «todo es una pura mentira». Describe la forma (dónde, cuándo, con qué) y descree del contenido. Gumilla no fue misionero de los aruacas; el capítulo X es una «visita» de naciones.'
  caquetio:
  - creencia-002
  - creencia-003
  - creencia-025
  proyeccion:
    capa: lectura
    nota: 'Ninguna nueva: el encierro ya es caquetío atestiguado. Lo lokono sólo dice que la consulta en casa aparte es también de la hermana.'
  ilumina: 'Oviedo t. II p. 298 (caquetío ATESTIGUADO, visto en imagen): el boratio, para responder, «se ençierran en un buhío solo», con «ahumadas que llaman tabacos», «un día, y dos y tres, é á veçes mas». La forma —casa aparte, encierro, el espíritu que responde— es la misma. Ese encierro no tiene hecho propio en el corpus (creencia-025 cita la p. 298 sólo por la pintura del espíritu).'
  via_a:
    creencia-002: contradice
    creencia-003: corrobora
  via_a_nota:
    creencia-002: 'contradice el sueño: la consulta lokona es de vigilia'
    creencia-003: corrobora «cierra la casa para el rito»
  verificado_en_imagen: si
  dominios:
  - especialista
  - consulta-nocturna
  - vigilia
- id: lokono-creencia-002
  id_origen: lok-02
  titulo: 'La maraca: un calabazo con piedrecillas, invento que Gumilla da a los aruacas'
  esfera: creencia
  tema: especialista
  contenido: 'Gumilla cree a los aruacas «los inventores de la Maráca, que se ha introducido tambien en otras Naciones»: un calabazo con muchas piedrecillas dentro, que el piache suena en la consulta nocturna. El mito de Brett, reescrito por Brinton, la llama «the holy calabash containing white pebbles», cuyo sonido «summons the beings of the unseen world». Goeje da la voz A maraka para el «hochet de l''homme-médecin», compartida con el tupí y lenguas caribes.'
  cita: 'Gumilla: «aun creo que son los inventores de la Maráca, que se ha introducido tambien en otras Naciones» · «la Maráca, que es un calabazo con mucho número de piedrecillas adentro». Brinton: «the maraka, the holy calabash containing white pebbles which they rattle during their exorcisms». Goeje p. 37: «hochet de l''homme-médecin h malaga, K, A maraka (Tupi maraka)»; «id. f šišira, G yeirü».'
  grafia: Maráca (Gumilla) · maraka (Brinton, Goeje) · el kalinago de mujeres dice šišira, no maraka
  pueblo: lokono
  epoca: Gumilla 1741; Brett 1868; Goeje 1939 (léxico)
  etiqueta: atestiguado
  testigo: oyo
  procedencia:
    obra: gumilla-1791
    pagina: t. I, impresa 155 (pdf 179; imagen)
  procedencia_extra:

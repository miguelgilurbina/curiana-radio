# 5. AUDITORÍA DE LA VÍA A — un veredicto por id (el detalle, en la nota)
# ══════════════════════════════════════════════════════════════════
auditoria_via_a:
  creencia-002:
    veredicto: contradice
    en_corto: >-
      La hermana cura despierta (lok-01, lok-05) y la cura caquetía
      atestiguada también (Oviedo pp. 298-299). Corrobora sólo el espíritu
      auxiliar (lok-03). Ninguna fuente arahuaca del repo pone la cura en el
      sueño.
  creencia-003:
    veredicto: corrobora en parte
    en_corto: 'la casa cerrada y el cobro (lok-01, lok-08); añade la maraca (lok-02); no toca tabaco, licor, urari ni serpiente'
  creencia-005:
    veredicto: no toca
    en_corto: 'cero sueño lokono en las tres obras; Brinton da akkuyaha «the spirit of a living animal» (p. 12), sin teoría del sueño'
  creencia-006:
    veredicto: contradice
    en_corto: 'lokono (Brett vía Brinton p. 18) y taíno (Pané cap. XVI) dan intrusión, no alma perdida (lok-04); y Oviedo p. 299 tiene un gesto sobre el alma sin leer'
  creencia-007:
    veredicto: no toca
    en_corto: 'Brett hace de toda enfermedad una flecha; Goeje da una sola palabra para remedio y hechizo (lok-L3)'
  creencia-008:
    veredicto: no toca
    en_corto: 'nada lokono sobre los muertos que rondan o protegen'
  creencia-009:
    veredicto: no toca
    en_corto: 'las armas en la fosa (lok-07) sin el porqué; el más allá lokono del repo es sólo waka (creencia-028)'
  creencia-010d:
    veredicto: no toca
    en_corto: 'negativa medida: Gumilla no dice nada de los huesos aruacas; el segundo tratamiento que da es warao y caribe'
  creencia-011:
    veredicto: no toca
    en_corto: 'sin segundo entierro lokono no hay exhumadora; el «ni duermen» es del piache en la cura, no del que toca los huesos'
  creencia-012:
    veredicto: no toca
    en_corto: 'nada lokono une huesos, nubes y lluvia'

# ══════════════════════════════════════════════════════════════════
# 6. LO QUE QUEDA
# ══════════════════════════════════════════════════════════════════
lo_que_queda:
  - 'Roth 1915 (caps. V, VI, XII, XIII, XVII, XX; §304 Navarrete) y Brett 1868 (Parte II; «The Arawaks or Lokono»): localizados en la nota 08 §3.2, sin descargar; esperan el «adelante» de Miguel. Son los que pueden subir lok-04 y lok-09 o tumbarlos.'
  - 'Rybka 2018 (web, CC BY-NC): el mito lunar lokono; es lo único que haría de kati ~ kathi un puente de creencia y no sólo de léxico.'
  - 'Navarrete (s. XVI) y Goeje 1942 (la iniciación del piache lokono): sin copia localizada.'
  - 'El gesto del boratio sobre el alma (Oviedo t. II p. 299, «diçe que le allega el alma á un cabo») tiene dos lecturas —devolver el alma o juntar el mal para soplarlo— y decide si creencia-006 tiene apoyo caquetío. No es lokono: queda para Miguel.'
  - 'Gumilla t. II no se barrió para creencia más allá del eclipse (p. 274) y de su única mención aruaca (pdf 63, la costa hacia Cayena).'

meta_origen:
  recogido: '2026-10-09'
  estado: sin-fusionar
  quien: 'minero lokono (Claude Opus 5.5)'
  rama: vault/creencia-mineria-lokono
  plan: 4-fuentes/sesiones/08_creencia_lokono_que-minar.md
  nota_de_sesion: 4-fuentes/sesiones/09_creencia_lokono_mineria.md
  pregunta: >-
    ¿Qué dicen de la creencia lokona las obras que ya están en el repo
    (Gumilla t. I, Brinton 1871, Goeje 1939), qué autoriza eso para el
    caquetío con la regla estricta de Miguel, y qué le hace a la Vía A wayuu?
  campos: >-
    capa = la capa que tendría la PROYECCIÓN al caquetío (no la del dato
    lokono en su obra). fuente + pagina = la obra lokona (clave de
    4-fuentes/bibliografia.yaml) y su página impresa vista en imagen.
    segunda_hermana = la otra tradición, si la hay. proyeccion = qué pasaría
    al mundo caquetío y qué no. via_a = los ids de creencia.yaml que toca, con
    su veredicto corto (el largo, en §auditoria_via_a). epoca y
    como_se_escribio = la regla 3.
  pueblo_y_epoca: >-
    Lo lokono del repo es de TRES épocas, ninguna precontacto: la lista de
    Trinidad de 1598 (sólo léxico, Brinton p. 9), los «Aruacas» de Gumilla
    (Orinoco bajo y costa hacia Cayena, 1731-1741, jesuita) y el mito de Brett
    1868 (Pomeroon, misionero anglicano) que Brinton reescribe en 1871. Goeje
    1939 es un compilador: su columna A remite a su propio Arawak de 1928.
  respuesta_corta: >-
    El repo tiene poco de creencia lokona y casi todo de segunda o tercera
    mano, pero lo que tiene apunta a otro sitio que la Vía A. El piache aruaca
    de Gumilla cura DESPIERTO —consulta toda la noche en una casita apartada,
    con la maraca, y «ni duermen, ni dexan dormir»— y tiene un espíritu
    propio con el que habla cada noche; la enfermedad, en el mito de Brett,
    es una flecha invisible del yauhahu, y el taíno de Pané dice lo mismo con
    otras palabras (el cemí puso en el cuerpo lo que el behique saca). Eso
    choca con la teoría wayuu del sueño (002) y del alma que se aleja (006), y
    casa con lo que Oviedo ya atestigua del boratio: encierro en un buhío solo
    (p. 298) y cura a gritos, chupando y sacando una espina (p. 299). Del
    segundo entierro, los huesos y la lluvia (010d, 011, 012), lo lokono del
    repo no dice nada. El puente kati ~ kathi se sostiene en cinco grafías
    lokonas (1598-1939), pero no hay mito lunar lokono en el repo.

# ══════════════════════════════════════════════════════════════════
# 2. PARA EL LEXICÓN — no son hechos de creencia; se dejan para quien
#    fusione el lexicón (fusionar-propuesta). Nada se toca aquí.
# ══════════════════════════════════════════════════════════════════
para_el_lexicon:

  - id: lok-L1
    tema: 'luna: el puente kati ~ kathi, verificado'
    caquetio: 'kati «luna», caquetío-atestiguado (Zavala Reyes 2015, glosario #71: «CATI: Luna»; clave `kati` de curiana_lexicon.py)'
    lokono:
      - {forma: cattehel, fecha: '1598 (Trinidad; lista de De Laet)', obra: brinton-1871, pagina: '9 (imagen)'}
      - {forma: katsi, fecha: '1800 (moravos)', obra: brinton-1871, pagina: '9 (imagen)'}
      - {forma: kathi, fecha: '—', obra: oliver-1989-apendice-a, pagina: 'Tabla A-2, fila 73 (vía lexicon_a2.py; no se volvió a ver)'}
      - {forma: kači, fecha: '1939 (compilación)', obra: goeje-1939, pagina: '54 (imagen)'}
      - {forma: 'kati u-bule «nouvelle lune»', fecha: '1939', obra: goeje-1939, pagina: '53 (imagen)'}
    otra_hermana: 'habla de mujeres kalinago: kati (Goeje p. 54, imagen: «lune kati, 2 f kati»)'
    sol: >-
      No casa: lokono adaly (1598) / hadalli (1800), Brinton p. 9; el
      caquetío kasi sólo lo comparte el kalinago de mujeres (kaši, Goeje p.
      54). Coincide con lo que la nota 08 §1.3 ya decía.
    veredicto: >-
      Se sostiene: cinco grafías lokonas de 1598 a 1939, la más antigua de
      época de contacto. `kati` sigue caquetío-atestiguado (la atestiguada
      manda); lo lokono no cambia nada. La nota de `kati` («LK katsi […]
      Brinton 1871») queda comprobada contra la imagen.
    lo_que_no_hay: >-
      Ningún mito, eclipse ni rito lunar LOKONO en el repo (Brinton: 0
      «moon»; Goeje: sólo léxico; Gumilla: nada de los aruacas). Dos pistas
      areales que no son hermanas: los loláca y atabáca de Gumilla t. II p.
      274 («¿No vés, como se nos muere la Luna?», y esconden los tizones
      porque «si la Luna muere, todo el fuego muere con ella»; imagen) y el
      kalinago de HOMBRES de Goeje p. 80 («éclipse de lune h li-huesekebu-li
      nonum», de uekebu 'mourir'; imagen). El mito lokono (la luna Kathi y el
      eclipse como muerte o sueño) está en Rybka 2018 y Brett, fuera del
      repo.

  - id: lok-L2
    tema: 'espíritu que se aparece en trance: la raíz seme-'
    formas:
      - {lengua: taíno, forma: semi, obra: goeje-1939, pagina: '7 (imagen)'}
      - {lengua: 'kalinago, habla de mujeres', forma: šeme, obra: goeje-1939, pagina: '7 y 38 (imagen)'}
      - {lengua: lokono, forma: 'seme(-he) / seme-he «dieu, génie tutélaire»', obra: goeje-1939, pagina: '7 y 38 (imagen)'}
      - {lengua: lokono, forma: 'semeti «sorcerers, diviners, priests»', obra: brinton-1871, pagina: '13 (imagen)'}
      - {lengua: lokono, forma: 'semeci «the sorcery»', obra: brinton-1871, pagina: '18 (imagen)'}
    lectura: >-
      En lokono la raíz nombra al espíritu (seme-he) y, derivada, al piache y
      su arte (semeti, semeci; Roth escribe semi-chichi, fuera del repo).
      Goeje alinea taíno, kalinago de mujeres y lokono en la misma entrada
      («2 am 10»), y en la misma pone «doux I A seme»: homófono a vigilar.
    capa_si_se_fusiona: >-
      La forma de 'espíritu' tendría dos hermanas (lokono + taíno, más el
      habla de mujeres): `reconstruido` por N1. Es un hueco: no hay voz
      caquetía atestiguada para 'espíritu'. Pero el piache sigue siendo
      `boratio` (atestiguado manda) y `cemi` taíno ya circula como voz de la
      esfera (con `semi` propuesta en SIN_FORMA_DE_LA_ESFERA): decidir si una
      reconstrucción *seme choca con ella es de quien fusione.
    curacion: >-
      La clave `semett` de curiana_lexicon.py cita a Brinton, que escribe
      `semeti` (p. 13, imagen). La clave `seme` (Perea p. 62, «mágico, mago»)
      es otra atestación lokona de la misma raíz, de 1802; no se volvió a ver.

  - id: lok-L3
    tema: 'remedio, hechizo y tinte: una sola palabra'
    formas:
      - {lengua: lokono, forma: ibina, obra: goeje-1939, pagina: '38 (imagen)'}
      - {lengua: 'kalinago, habla de mujeres', forma: ibien, obra: goeje-1939, pagina: '38 (imagen)'}
    cita: '«sortilège, remède, teinture ebene, f ibien, A ibina» (margen «1 am 137»)'
    lectura: >-
      Dos hermanas con la misma forma y la misma glosa triple. No se comprobó
      si el lexicón tiene una voz caquetía para 'remedio'; queda como pista
      léxica, no como hecho de creencia.

  - id: lok-L4
    tema: 'el sonajero del piache: las hermanas no coinciden'
    formas:
      - {lengua: lokono, forma: maraka, obra: goeje-1939, pagina: '7 y 37 (imagen)'}
      - {lengua: 'kalinago, habla de mujeres', forma: šišira, obra: goeje-1939, pagina: '37 (imagen)'}
    lectura: >-
      maraka es tupí-caribe-lokono (areal); el habla de mujeres dice šišira,
      que se parece al `isira` wayuu del lexicón (clave `isira`, fuente
      wayunaiki). No hay dos hermanas con la misma forma: sin reconstrucción.

  - id: lok-L5
    tema: 'curación: dos claves lokonas que no dicen lo que Brinton dice'
    hallazgo: >-
      (1) `akkicyaha` («espíritu del ser vivo», cita Brinton 1871): Brinton
      p. 12 escribe «Ar. akkuyaha, the spirit of a living animal» (imagen a
      600 ppp). (2) La clave `akkuyaha` de curiana_lexicon.py guarda otra
      cosa: «poder», fuente wayunaiki, con nota «Way. apülain». Parece una
      colisión de claves. Se anota; no se toca (regla 5).

# ══════════════════════════════════════════════════════════════════
# 3. LO QUE NO SE PROYECTA (y por qué)
# ══════════════════════════════════════════════════════════════════
lo_que_no_se_proyecta:
  - que: 'un ser supremo (Yauhahu como «supreme spiritual being»)'
    por_que: >-
      Es el marco de Brett/Brinton (p. 18). Aiomun Kondi y Kururumanni dan 0
      en Brinton y en Goeje (sondas en la nota de sesión). La clave `Adajali`
      del lexicón (lokono 'Dios/ser supremo', Pet 1987) es léxico misional:
      su propia nota da «Adajali boko = Biblia».
  - que: 'el origen en una isla del norte (Kairi = Trinidad)'
    por_que: >-
      Brinton p. 9 y p. 18. Es historia lokona, y Raleigh (1595) la
      confirma; el caquetío no tiene mito de origen atestiguado y su norte es
      el mar de las ABC, no Trinidad. Nada que proyectar.
  - que: 'la muerte como «paso» (haikahu de haikan)'
    por_que: >-
      Brinton p. 8 (imagen): «from haikan to pass by, comes haikahu death,
      the passing away». Es etimología de Brinton sobre léxico moravo, no
      una creencia descrita.

# ══════════════════════════════════════════════════════════════════
# 4. AREAL — de la misma obra, sin nombre de hermana: no cuenta
# ══════════════════════════════════════════════════════════════════
areal_no_cuenta:
  - id: lok-06   # areal: va aquí y no en `hechos` porque no es lokono
    titulo: 'El ayuno de toda la parentela: general del Orinoco, no aruaca'
    contenido: >-
      La primera receta del piache, en «todas quantas Naciones» trató
      Gumilla, es imponer ayuno al enfermo y a toda la parentela: nadie de la
      casa come caliente, guisado ni pimentón. No es un dato aruaca: es la
      respuesta a G2 de la nota 08.
    cita: >-
      p. 208: «(y aquí hablo de todas quantas Naciones he tratado)». p. 210:
      «la primera receta es intimar un ayuno general al enfermo y á toda la
      parentela: los mas de ellos mandan, que ninguno de la casa coma cosa
      caliente ni guisada, ni pimentón; y prohibe lo que ellos mas desean
      comer»
    grafia: 'Piache, Médico'
    pueblo: 'areal (naciones del Orinoco y el Meta; sin nombre)'
    fuente: gumilla-1791
    pagina: 't. I, impresas 208 y 210 (pdf 238 y 242; imagen)'
    epoca: 'Gumilla, 1741'
    como_se_escribio: 'Generalización del misionero sobre las naciones que trató'
    capa: lectura
    ilumina: >-
      creencia-023 (atestiguado, Oviedo t. II p. 299): el boratio manda
      ayunar «á todos los que hay en casa» con «maçamorra rala de mahiz que
      ellos llaman caça». Pané cap. XV da otra variante taína: ayunan el
      médico y el enfermo, no la casa.
    proyeccion: 'Ninguna: es areal y no cuenta como hermana.'
    via_a: {}

  - dato: 'los guaraúnos (warao) limpian el esqueleto en el río y guardan los huesos en un canasto colgado del techo, junto a los de sus antepasados'
    fuente: gumilla-1791
    pagina: 't. I, impresa 199 (imagen)'
    toca: 'creencia-010d (segundo tratamiento de los huesos), pero el warao no es arahuaco'
  - dato: 'los caribes, al cabo del año, sacan los huesos del capitán y los cuelgan en una caja «para perpetua memoria»'
    fuente: gumilla-1791
    pagina: 't. I, impresa 201 (pdf 231; imagen)'
    toca: 'creencia-010d; caribe, no hermana'
  - dato: '«en algunas Naciones, que reconocen que las almas no mueren, piensan todos, que andan vagueando no lejos de sus sepulturas»'
    fuente: gumilla-1791
    pagina: 't. I, impresas 210-211 (imagen la 210)'
    toca: 'creencia-008b (atestiguado: el alma ronda la sepultura), sin nombre de pueblo'
  - dato: 'la viuda arranca las sementeras del difunto «para arrancar de su memoria al difunto» (casi universal en el Orinoco)'
    fuente: gumilla-1791
    pagina: 't. I, impresa 207 (imagen)'
    toca: 'nada de la Vía A'
  - dato: 'en su arenga de bienvenida (el «Mirray»), el cacique cuenta que «habia soñado» que llovía sobre sus sementeras marchitas, y que «todo aquello eran avisos» de la llegada del Padre; cada nación remata con sus palabras, y la achagua con «Taquetá, nude yaquetá»'
    fuente: gumilla-1791
    pagina: 't. I, impresa 311 (pdf 343; imagen)'
    toca: 'creencia-005 («lo soñado puede traer un aviso»): el sueño-aviso es de la arenga de todas las naciones, no sólo aruaca'


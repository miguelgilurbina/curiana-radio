- id: lokono-creencia-006
  id_origen: lok-07
  titulo: El aruaca va a la sepultura con sus armas y sin tierra encima; el achagua, sólo si es jefe
  esfera: creencia
  tema: muerte-entierro
  contenido: 'La nación aruaca entierra a sus muertos con muchas ceremonias, la principal que vaya «con todas armas» y que no le caiga tierra encima: un cañizo a un palmo sobre el cuerpo, hojas anchas de plátano, y la tierra pisada encima. Los achaguas gentiles hacen lo mismo, pero sólo con capitanes y caciques, y sellan con barro para que las hormigas no inquieten al difunto.'
  cita: 'p. 199: «La Nacion Aruaca entierra sus muertos con muchas ceremonias; y la principal es, que vaya» p. 200: «con todas armas á la sepultura, y que en ella no le cayga encima tierra alguna: para lo qual, sobre el difunto, cosa de un palmo en alto, ponen un cañizo fuerte, y sobre éste muchas hojas anchas de Plátano, y sobre todo pisan la tierra. Los Achaguas Gentiles usan el mismo rito; pero es únicamente con sus Capitanes y Caciques»'
  grafia: Aruaca, Achaguas Gentiles, Plátano

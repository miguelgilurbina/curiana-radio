  - obra: 'Caguao, Alfredo y Morón, Camilo (2024). «La Piedra de Siraba: Mitología, Simbología y Arqueoastronomía». BACOA n.º 20; Cruxentiana n.º 16 (2025)'
    citada_en: 'NO la cita Acasio (es posterior); localizada en el barrido del 2026-09-16 (h03)'
    prioridad: 2
    por_que: 'La segunda lectura de Siraba, con Morón detrás. Ficha propuesta: 6-fusion/fichas_propuestas/caguao-moron-2024-piedra-de-siraba.md'

# 7. TOPONIMIA — propuesta para la campaña (formato de 2-lengua/toponimos.yaml)
# Se fusiona editando curiana_sim/lexicon_toponimos.py y regenerando con
# migrar_toponimos.py; toponimos.yaml NO se edita a mano.
# ══════════════════════════════════════════════════════════════════════
toponimia_propuesta:

  - id: toponimo-113
    accion: 'añadir una lectura y una frase a `observacion`; nivel, forma y glosa sin cambios'
    lecturas_nuevas:
      - tipo: glosa-fuente
        lectura: >-
          Acasio (2023) usa «Capubana», con b, como nombre de una estación de
          arte rupestre «en la falda del cerro de Santa Ana», a 210 m s. n. m.,
          «en el primer piso biótico del monumento natural» y «muy cerca de las
          calzadas». Al cerro lo llama siempre «Cerro de Santa Ana». No da
          glosa ni origen del nombre, que toma ya hecho del título de Salazar
          2017 (Inparques): «estación Capubana – Santa Ana».
        quien: Enrique Acasio (UNEFM); minado el 2026-10-09
        fecha: '2026-10-09'
        eje: referente
        procedencia:
          obra: acasio-2023-capubana-calendario
          pagina: '305, 307, 308 y 325 (pdf 1, 3, 4 y 21)'
        veredicto: >-
          No da glosa: sólo el referente. Ancla el nombre en la falda del
          macizo del Santa Ana y no en el «pequeño cerro cerca de Misaray» de
          Esteves, sin decir si son el mismo sitio. No confirma que el macizo
          se llamara Capubana. La -b- coincide con el capubana de Zavala #61
          (sigla HB, Hernández Baño): mientras no se lea Salazar 2017, no
          cuenta como atestación independiente. No mueve el nivel.
    observacion_añadido: >-
      Tercera forma viva (2026-10-09): «estación Capubana», una estación de
      petroglifos en la falda del Santa Ana a 210 m (Acasio 2023, tomando el
      nombre de Salazar 2017, Inparques); sin coordenadas. Es la única forma
      viva con -b- y ancla el nombre en el macizo, pero no decide entre dos
      Capubana, el nombre que bajó y un nombre de sector.
    alternativa_no_recomendada:
      forma_viva:
        - forma: estación Capubana
          tipo: lugar
          lat: null
          lon: null
          fuente: acasio-2023-capubana-calendario
          nota: 'sin coordenadas: el artículo no las da'
      por_que_no: >-
        Todas las formas_vivas del canon llevan lat/lon de OSM y el mapa las
        dibuja (export_mapa_seed.py); una sin punto habría que ver si el
        exportador la tolera. La lectura dice lo mismo sin ese riesgo.
    pregunta_para_la_campana: >-
      La lista cerrada de tipos de lectura (compilar_lengua.TIPOS_LECTURA) no
      tiene uno para «fuente impresa que usa el nombre sin glosarlo»: aquí se
      usa glosa-fuente con eje referente y el veredicto lo declara. Si la
      campaña prefiere otro, que lo diga; esta propuesta no toca la lista.

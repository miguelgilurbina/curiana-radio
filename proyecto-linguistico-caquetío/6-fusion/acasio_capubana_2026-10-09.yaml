# 6. FUENTES NUEVAS A BUSCAR (no se descargó nada: descargar lo decide Miguel)
# ══════════════════════════════════════════════════════════════════════
fuentes_nuevas_a_buscar:

  - obra: 'Salazar, Eva (2017). «Primera Caracterización de los Petroglifos de la estación Capubana – Santa Ana». Inparques'
    citada_en: 'Acasio 2023, ref. [4], p. 325'
    prioridad: 1
    por_que: >-
      ⭐ Es la que decide el nombre: de dónde sale «Capubana» (tradición
      local, un mapa, Hernández Baño, el glosario de Zavala), dónde está la
      estación (con coordenadas, si es una caracterización de Inparques) y
      qué grabados tiene. También el binomio de «quipito hediondo» y el de
      «urupaguita».
    donde: 'probablemente literatura gris de Inparques (informe técnico); sin localizar en línea'
    estado: sin localizar

  - obra: 'Acasio, Enrique (2013). «Piedras Parlantes de Siraba». Wordpress / libro presentado en Punto Fijo en 2014'
    citada_en: 'Acasio 2023, ref. [1], p. 324'
    prioridad: 2
    por_que: >-
      La lectura de la Piedra de Siraba, candidata a las «Piedras del
      Almanaque» de Esteves (creencia-022). Velasco 2015 la resume (la rana
      leída como Atabey/Pléyades). Sería hipotética, pero diría DÓNDE está la
      piedra.
    donde: 'https://obrasliterariasacasio.wordpress.com/piedras-parlantes-de-siraba/ (la página trae prólogo y fotos, no el texto: barrido 2026-09-16 h02)'
    estado: localizada, sin texto

  - obra: 'Acasio, Enrique (2016). «Piedra de Misaray: Calendario Perpetuo Luni-solar». Wordpress'
    citada_en: 'Acasio 2023, ref. [2], p. 325, y pp. 308, 313 y 317'
    prioridad: 3
    por_que: >-
      De ahí sale el sentido de lectura que aplica en Capubana. Probable
      «Piedra del Calendario» del sendero de Misaray (Aular Leal 2014), y
      probable sitio FAL-152 de Morón 2015 («cementerio y petroglifo de
      Machuruca-Misaray»).
    donde: 'https://obrasliterariasacasio.wordpress.com/piedra-de-misaray/'

# 4. «CALZADAS»
# ══════════════════════════════════════════════════════════════════════
calzadas:

  - id: acasio-020
    contenido: >-
      «Calzadas» es nombre de lugar y el artículo no dice qué es. Sale nueve
      veces: como palabra clave (pp. 305, 306), como nombre del petroglifo
      («calendario de Las Calzadas», «Calendario de las Calzadas», «modelo
      geométrico-matemático de Las Calzadas»: pp. 307, 312, 321, 322, 323,
      324) y una sola vez como lugar: «Esta estación rupestre se localiza muy
      cerca de las calzadas» (p. 308). No hay descripción: ni piedra, ni
      empedrado, ni muro, ni alineamiento, ni camino. Lo más probable es que
      sea el nombre de un sector de la falda, y que el petroglifo tome de él
      su nombre de autor.
    fuente: atestiguado
    capa: 'moderno; el cero de definición es de esta fuente'
    referencia: >-
      Acasio 2023, pp. 305-324 (pdf 1-20), las nueve vistas en imagen.
      Sondas: «calzad» 9; «camino» 0, «sendero» 0, «empedr» 0, «muro» 0,
      «trocha» 0, «carretera» 0; «alinea» 2, las dos sobre el glifo. Fuera
      del artículo: «calzad» 0 en los seis OCR de Esteves 1989 («alzad» 3,
      las tres «poca alzada» de un animal) y 0 en los seis extractos OSM de
      la Kaketiana.
    procedencia: {obra: acasio-2023-capubana-calendario, pagina: '308 (pdf 4)'}
    dominios: [toponimia, geografia]
    esfera_destino: toponimia
    toca_canon: []
    implicacion_simulacion: >-
      Ninguna para creencia. Si «Las Calzadas» es un sector con nombre, va a
      la cola de topónimos (castellano, moderno) para situar la estación.

  - id: acasio-021
    contenido: >-
      Aviso para no confundir: las «calzadas» de este artículo no tienen nada
      que ver con las calzadas y terraplenes de los Llanos que la tradición
      atribuye a los caquetíos de Manaure (Carvajal 1646-47 vía Alvarado y
      Arcaya, en petroglifos_y_manaure.yaml §manaure-en-los-llanos). Son otra
      región, otra polity (regla 4) y otra cosa. Nada en Acasio enlaza unas
      con otras.
    fuente: atestiguado
    capa: 'distinción del minador sobre dos fuentes'
    referencia: 'Acasio 2023, p. 308 (pdf 4); 6-fusion/petroglifos_y_manaure.yaml §manaure-en-los-llanos'
    procedencia: {obra: acasio-2023-capubana-calendario, pagina: '308 (pdf 4)'}
    dominios: [geografia]
    esfera_destino: geografia_politica
    toca_canon: []
    implicacion_simulacion: >-
      Ninguna obra pública en el Capubana sale de esta fuente.


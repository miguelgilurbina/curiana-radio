# ─────────────────────────────────────────────────────────────────────────
# MINERÍA — Acasio 2023, la estación Capubana y el «Calendario de las Calzadas»
#
# Regla 5: PROPONE. No toca 3-mundo/corpus/, 2-lengua/toponimos.yaml,
# curiana_lexicon.py, 6-fusion/sitios_era2.yaml ni ningún índice compartido.
# La entrada de topónimo de §toponimia_propuesta es para la campaña de
# topónimos (se edita lexicon_toponimos.py y se regenera; toponimos.yaml no
# se toca a mano).
#
# Páginas: «impresa (pdf N)». El artículo va de la 305 a la 325 del volumen;
# impresa = pdf + 304, constante en las 21 (medido en el pie de cada página).
# ─────────────────────────────────────────────────────────────────────────
meta:
  recogido: '2026-10-09'
  estado: sin-fusionar
  quien: minero (Claude Opus 5.5), rama vault/acasio-capubana
  pedido_por: Miguel (vía sesión principal)
  obra: acasio-2023-capubana-calendario
  cobertura: >-
    Las 21 páginas leídas en texto (fuentes_caquetios/Acasio_2023_Capubana_Calendario.txt,
    que es la salida de pdftotext byte a byte: 29.912 bytes los dos, acentos
    enteros, 0 acentos descompuestos) y en imagen (render a 150 ppp con
    pymupdf). Las figuras se leyeron además desde la imagen incrustada a su
    resolución nativa: Fig. 1 (pdf 5, 1256×576 px), Fig. 2 (pdf 6: calco,
    ficha técnica y foto tratada), Fig. 3 (pdf 9), Figs. 4-8 (pdf 14, 15, 16,
    17 y 19) y la Tabla 1 (pdf 12). Las pp. 15 y 19 del PDF se leyeron por la
    figura nativa y el pie en texto, sin render de página entera.
  conteo: >-
    21 hechos (acasio-001 a acasio-021) en cuatro secciones, más 12 ceros
    medidos, 8 obras a buscar y 1 propuesta de topónimo. La BANDEJA cuenta
    la lista más larga del archivo, no la suma.
  no_leido: >-
    Nada del artículo queda sin leer. Lo que NO se ha leído son las obras que
    cita y de las que depende: Salazar 2017 (el origen del nombre de la
    estación), Acasio 2013 (Siraba) y 2016 (Misaray), y Rebullida 1990/1999
    (el método). Ver §fuentes_nuevas_a_buscar. No se descargó nada.
  sondas: >-
    Regla 6. Antes de contar se midió la ortografía: el .txt conserva los
    acentos (179 «ó», 86 «í», 0 acentos descompuestos «´»). Cada sonda es una
    raíz corta buscada sin acentos y en minúsculas sobre el texto entero
    (normalización NFD, se quitan las marcas), y los conteos se repitieron
    sobre una extracción nueva con pdftotext: mismo tamaño, mismos conteos.
    Cada negativa de este archivo nombra su sonda. Las coincidencias
    parciales se miraron en contexto: «teresa» (3) es «interesante», «ipc»
    (1) es «descripción», «sur» (1) es «apresurarnos», «°» (21) es el «N°» de
    la cabecera, «longitud» (1) son los «4 metros de longitud».
  resumen: >-
    Acasio llama «Capubana» a una ESTACIÓN de arte rupestre de la falda del
    cerro, a 210 m, nunca al cerro, que es siempre «Cerro de Santa Ana». El
    nombre no es suyo: lo trae ya el título de Salazar 2017 (Inparques). No
    da coordenadas, ni glosa, ni tradición del nombre. El petroglifo existe y
    está bien descrito (atestiguado, moderno); la lectura metónica es una
    hipótesis de autor único que no se puede refutar tal como está
    construida. No atribuye el grabado a ningún pueblo ni lo fecha. «Las
    Calzadas» es el nombre de un lugar junto a la estación, sin definir.
    Distingue la estación de la Piedra de Siraba y de la de Misaray, que son
    obras suyas anteriores: la estación Capubana no es, por él, las «Piedras
    del Almanaque».

veredicto_nombre: >-
  Acasio NO dice que el Cerro de Santa Ana se llamara Capubana: en las seis
  apariciones del nombre (pp. 305 ×2, 306 ×2, 307, 325) es «estación», y el
  cerro es siempre «Cerro de Santa Ana» o «monumento natural Cerro de Santa
  Ana». Lo que sí da es un uso vivo e institucional del nombre, con b, para un
  lugar de la falda del macizo (2017 en Salazar, 2023 en Acasio). Eso afina
  toponimo-113 en dos sentidos: (1) el nombre está pegado hoy a la falda del
  Santa Ana, no sólo a un «pequeño cerro cerca de Misaray»; (2) la forma con
  -b- coincide con el capubana de Zavala Reyes 2015 #61, cuya sigla es HB
  (Hernández Baño, que escribió también sobre los petroglifos de Falcón). Por
  eso NO se puede contar todavía como atestación independiente: si Salazar
  tomó el nombre de Hernández Baño o del glosario de Zavala, es el mismo dato
  con otro sello (minar-fuente §8). Para la lectura de Miguel (2026-09-01:
  el Capubana es el Santa Ana entero) el artículo es compatible y no
  confirmatorio. No decide entre las tres salidas que la entrada deja
  abiertas: dos Capubana, el nombre bajó del grande al pequeño, o un nombre
  de sector de la falda. Lo decide Salazar 2017 con coordenadas.

# ══════════════════════════════════════════════════════════════════════
# 1. EL NOMBRE
# ══════════════════════════════════════════════════════════════════════
nombre_capubana:

  - id: acasio-001
    contenido: >-
      Acasio llama «Capubana» a una estación de arte rupestre, no a un cerro.
      Título: «petroglifo geométrico de la estación Capubana, en el Cerro de
      Santa Ana». Resumen: «en la estación de arte rupestre Capubana, en la
      falda del cerro de Santa Ana, en la Península de Paraguaná».
      Introducción: «el calendario de Las Calzadas, estación Capubana». El
      nombre sale seis veces en 21 páginas (título y resumen en castellano y en
      inglés, la introducción y la referencia [4]) y las seis va con
      «estación».
    fuente: atestiguado
    capa: moderno (2023)
    referencia: 'Acasio 2023, pp. 305, 306, 307 y 325 (pdf 1, 2, 3 y 21), vistas en imagen'
    procedencia: {obra: acasio-2023-capubana-calendario, pagina: '305, 307 y 325 (pdf 1, 3 y 21)'}
    dominios: [toponimia, arte-rupestre]
    esfera_destino: toponimia
    toca_canon: [toponimo-113, 'sitios_era2 §Capubana', D9]
    implicacion_simulacion: >-
      Ninguna directa. El canon puede seguir llamando Capubana al cerro (D9 y
      sitios_era2 lo hacen como canon-simulacion); este artículo no lo
      autoriza ni lo contradice.

  - id: acasio-002
    contenido: >-
      El cerro, en todo el artículo, se llama «Cerro de Santa Ana» o
      «monumento natural Cerro de Santa Ana». «Santa Ana» sale siete veces:
      seis para el cerro (título y resumen en las dos lenguas, dos en la
      introducción) y una en el título de Salazar 2017. En ninguna parte dice
      que el cerro se llamara Capubana, ni de dónde sale el nombre de la
      estación, ni qué significa: no hay glosa, ni tradición, ni mapa.
    fuente: atestiguado
    capa: 'moderno; el cero es de esta fuente'
    referencia: >-
      Sondas sin acentos sobre el texto entero: «santa ana» 7; «llamad» 0,
      «nombre» 0, «denomin» 0, «toponim» 0, «duende» 0; «capu» 6, todas
      «Capubana» (las de acasio-001), así que «capuh» y «capuan» dan 0.
    procedencia: {obra: acasio-2023-capubana-calendario, pagina: '305-325 (barrido entero)'}
    dominios: [toponimia]
    esfera_destino: toponimia
    toca_canon: [toponimo-113]
    implicacion_simulacion: >-
      La frase «Acasio confirma que el Santa Ana se llamaba Capubana» no se
      puede escribir con esta fuente.

  - id: acasio-003
    contenido: >-
      El nombre no es de Acasio: lo trae ya el título de la referencia [4],
      «Salazar E. Primera Caracterización de los Petroglifos de la estación
      Capubana – Santa Ana. Inparques: Instituto Nacional de Parques; 2017».
      Acasio sólo la cita para la vegetación del sitio (p. 308). Es el uso
      más antiguo del nombre que el artículo deja ver. «– Santa Ana» puede ser
      el cerro o el municipio Santa Ana: no se decide.
    fuente: atestiguado
    capa: moderno (2017, citado en 2023)
    referencia: 'Acasio 2023, p. 325 (pdf 21), ref. [4], vista en imagen; p. 308 (pdf 4) para el uso que hace de ella'
    procedencia: {obra: acasio-2023-capubana-calendario, pagina: '308 y 325 (pdf 4 y 21)'}
    dominios: [toponimia, fuentes]
    esfera_destino: fuentes
    toca_canon: [toponimo-113]
    implicacion_simulacion: >-
      Salazar 2017 es la obra que decide de dónde sale el nombre. Va primera
      en §fuentes_nuevas_a_buscar.

  - id: acasio-004
    contenido: >-
      Dónde está la estación, con sus palabras: «en la falda del cerro de
      Santa Ana» (p. 305 y 307); una de «las estaciones de arte rupestre
      presentes en las inmediaciones del monumento natural Cerro de Santa Ana»
      (p. 307); «muy cerca de las calzadas, en el primer piso biótico del
      monumento natural a una altura de 210 m.s.n.m, enclavada en una
      topografía con cierta pendiente y un suelo rocoso con poca materia
      orgánica» (p. 308). No da coordenadas, ni vertiente, ni rumbo, ni la
      distancia a ningún pueblo. Misaray y Siraba salen sólo como otras
      piedras y otras obras, no como vecinos de la estación.
    fuente: atestiguado
    capa: moderno (2023)
    referencia: >-
      Acasio 2023, pp. 305, 307 y 308 (pdf 1, 3 y 4), vistas en imagen.
      Sondas: «coorden» 0, «utm» 0, «latitud» 0, «gps» 0, «norte» 0, «oeste»
      0, «noreste» 0, «vertiente» 0, «ladera» 0, «moruy» 0, «machuruca» 0,
      «maitiruma» 0, «chamuriana» 0, «buena vista» 0; «misaray» 6 y
      «siraba» 4, todas como obra o piedra aparte.
    procedencia: {obra: acasio-2023-capubana-calendario, pagina: '305, 307 y 308 (pdf 1, 3 y 4)'}
    dominios: [toponimia, geografia, arte-rupestre]
    esfera_destino: toponimia
    toca_canon: [toponimo-113, 'sitios_era2 §Capubana']
    implicacion_simulacion: >-
      Si la estación entra en sitios_era2, entra sin coordenada propia: «en la
      falda, a 210 m», no un punto.

  - id: acasio-005
    contenido: >-
      (Medición del minador.) Con lo que hay en el repo la estación no se
      puede situar. En OSM (paraguana-1.json) el Cerro Capuana está a 6,7 km
      al ENE (rumbo 65°) de la cumbre del Santa Ana, y Misaray a 3,9 km al NE;
      el Cerro Capuana queda a 3,3 km al E de Misaray. Las 1.900 ha del
      monumento equivalen a un círculo de unos 2,5 km de radio. Si la estación
      está «en el primer piso biótico del monumento natural», lo más probable
      es que esté en la falda del macizo y no en el Cerro Capuana de OSM. Pero
      el polígono del monumento no está en el repo, OSM no da la cota del
      Cerro Capuana y el artículo no da coordenadas: no se decide.
    fuente: hipotetico
    capa: 'inferencia del minador, 2026-10-09'
    referencia: >-
      Distancias por haversine sobre los nodos OSM «Cerro Santa Ana» (11.8183,
      -69.9524, ele 830), «Cerro Capuana» (11.8440, -69.8963, sin ele) y
      «Misaray» (11.8425, -69.9265); las 1.900 ha son de monumento-cerro-santa-ana.
    procedencia: {obra: osm-kaketiana, pagina: 'paraguana-1.json'}
    dominios: [toponimia, geografia]
    esfera_destino: toponimia
    toca_canon: [toponimo-113]
    implicacion_simulacion: >-
      Ninguna mientras no haya coordenadas. Deuda: el polígono del monumento
      (Decreto 1005 de 1972, o el de 2019) y la cota del Cerro Capuana.

  - id: acasio-006
    contenido: >-
      La forma con b de la estación coincide con la de `kapubana` 'duende del
      cerro' del lexicón, que viene de Zavala Reyes 2015 #61 con sigla HB:
      Adrián Hernández Baño. Hernández Baño escribió también «Petroglifos.
      Estado Falcón» (2000), que Morón 2012 cita con reservas («una tendencia
      literaria dada a la hipérbole»). Esteves escribe «Capuhana» y OSM
      «Capuana». Si Salazar 2017 tomó el nombre de Hernández Baño o del
      glosario de Zavala, la estación no es una atestación nueva del
      compuesto, sino el mismo dato repetido.
    fuente: hipotetico
    capa: 'inferencia del minador sobre la cadena de la forma'
    referencia: >-
      curiana_sim/lexicon_zavala.py, entrada kapubana («Duende del cerro
      [Zavala Reyes 2015 #61 (HB)]»); 4-fuentes/zavala-reyes-2015.md (HB =
      Adrián Hernández Baño); 4-fuentes/moron-2012-petroglifos.md (la reserva
      sobre Hernández Baño 2000). Acasio no cita a Hernández Baño: sondas
      «hernandez» 0 y «baño» 0.
    procedencia: {obra: zavala-reyes-2015, pagina: 'glosario #61 (HB)'}
    dominios: [toponimia, lengua]
    esfera_destino: toponimia
    toca_canon: [toponimo-113, kapubana]
    implicacion_simulacion: >-
      Hasta leer Salazar 2017, el nivel de toponimo-113 no sube por esta
      fuente.


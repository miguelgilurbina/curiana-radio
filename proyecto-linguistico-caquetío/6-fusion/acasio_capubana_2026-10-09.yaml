# 2. EL PETROGLIFO Y LA LECTURA
# ══════════════════════════════════════════════════════════════════════
petroglifo_y_lectura:

  - id: acasio-007
    contenido: >-
      El soporte: una «roca satélite de 0.76 x 0,70 m de largo y ancho»,
      «muy cerca de una pieza monolítica de casi 4 metros de longitud, también
      con una serie de glifos en su superficie» (p. 308). La ficha técnica de
      la Fig. 2 (p. 310) añade: perímetro 2,38 m, área del soporte 0,40 m²,
      área del petroglifo 0,026 m² (6,56 % del soporte), surco tallado de
      1,60 m, glifo de 0,33 × 0,19 m. El texto da 330 × 190 mm (p. 312). La
      foto de la Fig. 2 está tratada con DStretch y en la reproducción del
      PDF el motivo no se distingue: lo que se ve del grabado es el calco.
    fuente: atestiguado
    capa: moderno (medición del autor, 2023)
    referencia: 'Acasio 2023, pp. 308, 310 y 312 (pdf 4, 6 y 8); ficha técnica leída en la imagen nativa de la Fig. 2'
    procedencia: {obra: acasio-2023-capubana-calendario, pagina: '308, 310 y 312 (pdf 4, 6 y 8)'}
    dominios: [arte-rupestre, geografia]
    esfera_destino: geografia_politica
    toca_canon: ['sitios_era2 §Capubana (materiales)']
    implicacion_simulacion: >-
      Un objeto del paisaje con medidas: una piedra grabada de menos de un
      metro junto a un bloque de cuatro. Sirve a [Tu tierra] como cosa que se
      ve, no como cosa que se sabe leer.

  - id: acasio-008
    contenido: >-
      El motivo, como lo describe (p. 311-312) y como se ve en el redibujo
      (Fig. 3, p. 313): un rectángulo horizontal dividido en dos filas y tres
      columnas, con el sector izquierdo de cada fila más ancho que los otros
      dos (seis sectores: dos rectangulares y cuatro casi cuadrados). Dentro
      de cada sector salen de la base trazos verticales cortos, hasta un
      tercio de la altura: dos en cada sector ancho y uno en cada cuadrado,
      ocho en total. Encima, en el lado opuesto al apéndice, tres trazos
      cortos: uno en cada extremo y uno sobre el sector central de arriba.
      Once trazos. Del centro del lado inferior sale un trazo largo que
      remata en una figura cuadrangular menor y abierta, atravesada por él
      («apéndice» y «caja»). Comprobado en imagen: 8 + 3 = 11 en las Figs. 3 y
      4; el apéndice y la caja se ven sólo en el calco de la Fig. 2, porque la
      Fig. 3 los corta.
    fuente: atestiguado
    capa: moderno (calco y redibujo del autor, 2023)
    referencia: 'Acasio 2023, pp. 311-313 (pdf 7-9) y Fig. 2 (p. 310, pdf 6); visto en la imagen nativa de las Figs. 2, 3 y 4'
    procedencia: {obra: acasio-2023-capubana-calendario, pagina: '311-313 (pdf 7-9)'}
    dominios: [arte-rupestre]
    esfera_destino: creencia
    toca_canon: ['6-fusion/petroglifos_imagenes_2026-10-05.yaml (entrada acasio)']
    implicacion_simulacion: >-
      Es el motivo que el catálogo de imágenes resume como «rectángulos
      encadenados»: no lo son. Es un solo rectángulo partido en seis, con
      trazos dentro y encima, sobre un vástago. Si el catálogo se corrige, lo
      hace quien lo mantiene.

  - id: acasio-009
    contenido: >-
      Los otros grabados de la estación. La roca satélite tiene un segundo
      motivo geométrico, «mucho más elaborado» y con «perfectos trazos
      paralelos como cuentas» (Fig. 2, p. 310; p. 309), que el autor da por
      «otro instrumento calendárico» de «otro ciclo astronómico»: la
      existencia es dato, el ciclo es su lectura. La Fig. 1 (p. 309) es un
      mosaico de fotos cenitales de varios bloques contorneados, con los
      grabados resaltados en amarillo y una escala roja y blanca: en la roca
      satélite, el calendario y el motivo de trazos paralelos; en el bloque
      grande del centro, dos surcos largos paralelos en diagonal, un círculo
      con segmentos radiales sobre un vástago que acaba en una base, una
      figura horizontal con un anillo y un remate de trazos, y una figura de
      líneas quebradas con una espiral. El texto no describe ninguno de esos
      grabados del bloque grande.
    fuente: atestiguado
    capa: moderno (2023)
    referencia: 'Acasio 2023, pp. 309-310 (pdf 5-6); Fig. 1 leída en la imagen nativa (1256×576 px). La descripción de la Fig. 1 es del minador'
    procedencia: {obra: acasio-2023-capubana-calendario, pagina: '309-310 (pdf 5-6)'}
    dominios: [arte-rupestre]
    esfera_destino: creencia
    toca_canon: ['sitios_era2 §Capubana (materiales)', creencia-022]
    implicacion_simulacion: >-
      La estación es un conjunto, no una piedra: varios bloques grabados en
      pocos metros. El círculo con radios es el único motivo que alguien
      podría leer como astro, y el autor no lo lee.

  - id: acasio-010
    contenido: >-
      La lectura: el motivo sería «un calendario que incorpora en su diseño el
      ciclo metónico» (p. 310), 19 años solares = 235 lunaciones. El método es
      de Rebullida (1990, 1999), escrito para el arte rupestre del Neolítico y
      el Bronce de España (p. 313-314): años de 12 o 13 lunas que empiezan con
      el primer plenilunio tras el solsticio de invierno, y un patrón de
      cuatro años (13, 25, 38, 50) que se repite. La cuenta (pp. 317-323,
      Figs. 4-8): el trazo exterior de arriba a la izquierda es la luna 1;
      cada trazo siguiente recibe el total de lunaciones al cerrar cada año
      (13, 25, 38…), de izquierda a derecha y de arriba abajo, «saltándose»
      el primer trazo de cada sector ancho; los años 1 a 8 llenan ocho trazos
      (99 lunaciones), los años 9 a 16 caen en los mismos ocho (112…198), los
      años 17 y 18 en los trazos exteriores (211, 223), el año 19 (235) en el
      primer trazo del primer rectángulo, «por apartarse de la regla», y el
      último trazo libre recibe 118 = 235 / 2 redondeado, «la mitad del ciclo».
      Conclusión del autor: «La hipótesis ha sido comprobada con total
      propiedad» (p. 322); «Se trata de un auténtico calendario Lunar» (p. 324).
    fuente: hipotetico
    capa: 'lectura de autor único, s. XXI; «Revisión preliminar / Artículo de divulgación» (p. 305); recibido el 15 y aceptado el 25 de mayo de 2023'
    referencia: 'Acasio 2023, pp. 305, 310, 313-324 (pdf 1, 6, 9-20); asignaciones comprobadas en las imágenes nativas de las Figs. 4-8'
    procedencia: {obra: acasio-2023-capubana-calendario, pagina: '310, 313-324 (pdf 6, 9-20)'}
    dominios: [creencia, calendario, arqueoastronomia]
    esfera_destino: creencia
    toca_canon: [creencia-013, creencia-014, creencia-022]
    implicacion_simulacion: >-
      No sube. Una cuenta metónica en el motor sería importar una hipótesis
      del s. XXI (reglas 2 y 3).

  - id: acasio-011
    contenido: >-
      (Lectura del minador.) Por qué la lectura no se puede refutar tal como
      está. (1) Los trazos no cuentan lunaciones: once trazos no son 235, ni
      19, ni 50. Lo que se pone en cada trazo es un rótulo, el total al cerrar
      cada año; un trazo es, a lo más, un año. (2) La repetición desde el año
      9 descansa en que 99 lunaciones son casi 8 años solares, el ciclo de
      ocho años; eso no es el metónico y el autor no lo nombra. (3) La regla
      de «saltar» el primer trazo de los sectores anchos no sale del diseño
      ni de Rebullida: es la que deja libres justo los trazos que luego
      reciben el 235 y el 118. (4) La excepción del año 19 se toma de la cita
      de Rebullida («al ocupar el número 37, indicaba ser el final», p. 315),
      que la deriva de contar sobre una serie de 50; Acasio no cuenta sobre
      50, coloca el 235 donde queda sitio. (5) El 118 no se calcula: se busca
      un valor para el trazo que sobra y se declara comprobado. (6) Son libres
      la orientación del redibujo, el sentido de lectura, el trazo inicial,
      qué trazos cuentan (el apéndice y la caja quedan fuera, p. 312), la
      regla del salto, la excepción y el valor del hueco. Con esas siete
      elecciones la cuenta no tiene cómo fallar: no hay resultado posible que
      hubiera contado en contra. (7) No hay nada medido en el cielo: ni orientación de la roca,
      ni horizonte, ni azimut, ni observación de solsticio, ni si la roca
      satélite está en su sitio. Lo que la haría refutable: aplicar las mismas
      reglas, sin elecciones nuevas, al segundo motivo de la roca o a rejillas
      de control, y medir la orientación en el sitio.
    fuente: hipotetico
    capa: 'crítica del minador, 2026-10-09'
    referencia: >-
      Sobre Acasio 2023, pp. 312, 315, 317-323 (pdf 8, 11, 13-19). Sondas:
      «orient» 0, «azimut» 0, «horizonte» 0, «equinoccio» 0; «solsticio» 4,
      las cuatro generales (la teoría de Rebullida y la ilustración del
      ciclo, pp. 311, 314 y 324), ninguna en el sitio.
    procedencia: {obra: acasio-2023-capubana-calendario, pagina: '312, 315, 317-323 (pdf 8, 11, 13-19)'}
    dominios: [creencia, calendario, metodo]
    esfera_destino: creencia
    toca_canon: [creencia-022]
    implicacion_simulacion: >-
      Ninguna. Es la razón para no llevar la lectura al corpus como nada más
      que «lectura de autor».

  - id: acasio-012
    contenido: >-
      Errores y descuidos del texto, que pesan en la etiqueta. Da el ciclo
      metónico como de «19 años, 18.61 años para ser más exactos» (p. 314):
      18,61 años es la regresión de los nodos lunares, otro ciclo; el
      metónico son 19 años. Rebullida es «(1990) [6]» y «(1999) [7]», pero la
      Tabla 1 es «la aportada por Rebullida (1990) [7]» (p. 315) y el método
      el de «Rebudilla (1990) [7]» (p. 317). Las secciones saltan de la 2 a
      la 4. «Navaja de Ocan» (p. 322). Diez días entre recibido y aceptado
      (p. 305).
    fuente: atestiguado
    capa: 'sobre el texto; la corrección del ciclo es del minador'
    referencia: 'Acasio 2023, pp. 305, 314, 315, 317, 322 (pdf 1, 10, 11, 13, 18), vistas en imagen'
    procedencia: {obra: acasio-2023-capubana-calendario, pagina: '305, 314, 315, 317 y 322 (pdf 1, 10, 11, 13 y 18)'}
    dominios: [metodo]
    esfera_destino: fuentes
    toca_canon: []
    implicacion_simulacion: >-
      Ninguna. Confirma «hipotético» para toda lectura de esta serie de
      trabajos mientras no aparezca una revisión de pares.

  - id: acasio-013
    contenido: >-
      Quién, cuándo y para qué, según el autor: los que lo hicieron son
      «nuestros arcanos escudriñadores del firmamento», «nuestros
      originarios», «nuestros astrónomos ancestrales», «culturas pretéritas»;
      nunca un pueblo con nombre. No da fecha, ni material asociado, ni
      contexto excavado. La función es computar el tiempo y predecir la luna,
      con «su debida implementación en la vida social de las culturas
      pretéritas: la caza, pesca, la cosecha, la siembra, la tala etc.»
      (p. 324), sin prueba. Llama a estos sitios «santuarios astronómicos»
      (p. 307). Nada de navegación.
    fuente: atestiguado
    capa: 'lo que el autor afirma; el cero de atribución y de fecha es de esta fuente'
    referencia: >-
      Acasio 2023, pp. 307, 311 y 324 (pdf 3, 7 y 20). Sondas: «caquet» 0,
      «aquet» 0, «caiquet» 0, «indigen» 0, «indio» 0, «aborig» 0, «prehisp»
      0, «precolomb» 0, «arahu» 0, «arawak» 0, «aruac» 0, «jirajar» 0,
      «datac» 0, «ceramic» 0, «dabaj» 0, «ritual» 0, «sagrad» 0, «ceremon» 0;
      «siglo» 1 y «a.c» 1, los dos de Metón; «ancestr» 9, «originari» 3.
    procedencia: {obra: acasio-2023-capubana-calendario, pagina: '307, 311 y 324 (pdf 3, 7 y 20)'}
    dominios: [creencia, cronologia]
    esfera_destino: creencia
    toca_canon: [creencia-022]
    implicacion_simulacion: >-
      Regla 3: atribuir el grabado a los caquetíos de los s. XIV-XV es
      hipotético, y el autor ni siquiera lo hace. Zavala Reyes 2015 (Chirache)
      al menos asocia sus grabados a cerámica dabajuroide cercana; Acasio no
      trae ni eso. Morón 2012 da los motivos geométricos como los propios de
      la costa y la sabana árida: el de Capubana encaja en el estilo, y el
      estilo no fecha.

  - id: acasio-014
    contenido: >-
      (Lectura del minador.) Lo que un pueblo que cuenta lunas sabría, y lo
      que el canon ya tiene. El lexicón trae `apana` «Una luna. Medición de
      tiempo» y `buiamati` «dos lunas. Medición de tiempo», las dos
      caquetío-atestiguadas en Zavala Reyes 2015 (#10 y #47) con sigla GC,
      Galeotto Cey, del s. XVI; y `kati` 'luna' (#71), que manda desde el
      2026-09-19 (`kasha` está archivada). Ésa es la base atestiguada de una
      cuenta de lunas, de época de contacto e independiente de Acasio. Contar
      lunas da, sin escritura, el año de doce o trece (se ve en el cielo), las
      noches oscuras y claras para la pesca nocturna del Golfete y una medida
      para las tres estaciones del canon. Un ciclo de 19 años pide registro
      sostenido o un instrumento; de eso no hay prueba.
    fuente: hipotetico
    capa: 'lectura del minador; lo atestiguado son las tres voces del lexicón'
    referencia: 'curiana_sim/curiana_lexicon.py, entradas apana, buiamati, kati y kasha (archivada); 4-fuentes/zavala-reyes-2015.md (GC = Galeotto Cey)'
    procedencia: {obra: zavala-reyes-2015, pagina: 'glosario #10, #47 y #71'}
    dominios: [creencia, calendario, lengua]
    esfera_destino: creencia
    toca_canon: [creencia-014, apana, buiamati, kati]
    implicacion_simulacion: >-
      El motor tiene un año de tres períodos (viento 50 / seca larga 40 /
      siembra 30) y un ciclo ritual mayor en el Capubana. Si Miguel quiere
      lunas en ese calendario, la base es `apana`/`buiamati`, no Acasio. Este
      artículo no da base para una cuenta lunar en el canon. No se diseña
      nada aquí.

  - id: acasio-015
    contenido: >-
      El medio de la estación, según Salazar 2017 vía Acasio: a 210 m,
      vegetación xerófita con «quipito hediondo (Anagyris foetida), dividive
      (Caesalpinia coriaria), cují yaque (Prosoplis juliflora), el buche
      (Melocactus caeseus y/o Melocactus lobelli), salvia (Salvia coccínea),
      tuna brava (Opuntia wentiana), cardón o dato (Ritterocereus griceus),
      trompillo (Jacquinia aristata y/o Jacquinea revoluta), urupaguita
      (Castela erecta Turpin), cruceta (Guettarda divaricata…) y varios tipos
      de pastos», que «no proporcionan sombra» a la roca. Dos pistas para
      otras esferas: «urupaguita» lleva binomio (Castela erecta), y el
      lexicón tiene `urupagua` 'arbusto espinoso usado para cercar conucos'
      sin taxón («árbol indeterminado», Alvarado); y «dato» nombra aquí la
      planta, no sólo el fruto. Anagyris foetida es una especie mediterránea:
      el binomio hay que verlo en Salazar.
    fuente: atestiguado
    capa: 'moderno, de segunda mano (Salazar 2017 vía Acasio 2023); la duda del binomio es del minador'
    referencia: 'Acasio 2023, p. 308 (pdf 4), vista en imagen'
    procedencia: {obra: acasio-2023-capubana-calendario, pagina: '308 (pdf 4)'}
    dominios: [ecologia, flora]
    esfera_destino: ecologia
    toca_canon: [urupagua, kadushi, ecologia-005]
    implicacion_simulacion: >-
      Confirma lo que sitios_era2 ya dice de las partes bajas del cerro (monte
      xerófilo y espinar). «urupaguita» = Castela erecta es una pista para la
      glosa de `urupagua`, no una identificación: el diminutivo puede nombrar
      otra planta.

# ══════════════════════════════════════════════════════════════════════
# 3. LAS OTRAS PIEDRAS Y LA BIBLIOGRAFÍA
# ══════════════════════════════════════════════════════════════════════
otras_piedras_y_bibliografia:

  - id: acasio-016
    contenido: >-
      Acasio separa tres piedras del cerro, y una cuarta sin lugar en este
      texto, todas leídas por él como calendarios o cielo: la Piedra de Siraba («glifos lunares
      estudiados en la Piedra de Siraba», p. 313; obra de 2013), la Piedra de
      Misaray («calendario Luni-solar de Misaray», p. 313; «Calendario
      Perpetuo Luni-solar», p. 308; obra de 2016), la estación Capubana (este
      artículo) y «la manifestación rupestre de los Santos – El Mestizo»
      (2022, sin lugar en este texto). El diseño de Capubana «se aleja un
      poco» de los de Siraba y Misaray (p. 313), y el sentido de lectura lo
      toma del de Misaray (p. 317). Su investigación viene «desde el año 2012»
      (p. 308).
    fuente: atestiguado
    capa: moderno (2023, sobre obras de 2013-2022)
    referencia: 'Acasio 2023, pp. 308, 313, 317, 324-325 (pdf 4, 9, 13, 20-21), vistas en imagen'
    procedencia: {obra: acasio-2023-capubana-calendario, pagina: '308, 313 y 317 (pdf 4, 9 y 13)'}
    dominios: [arte-rupestre, toponimia]
    esfera_destino: creencia
    toca_canon: [creencia-022, 'sitios_era2 §Capubana (materiales)']
    implicacion_simulacion: >-
      El cerro tiene al menos tres sitios grabados con nombre propio, más la
      «Piedra de la Teresa» junto a un manantial que da INPARQUES por extracto
      (barrido_web_cerro_laguna_2026-09-16.yaml h06), que Acasio no nombra
      (sonda «teresa» 3, las tres dentro de «interesante»).

  - id: acasio-017
    contenido: >-
      ¿Es la estación Capubana las «Piedras del Almanaque» de Esteves (cerro
      de Siraba, p. 60)? Por lo que dice Acasio, no: él trata Siraba como
      piedra y obra aparte, y de Siraba dice que tiene «glifos lunares», que
      es lo que el nombre «del Almanaque» hace esperar. La candidata a las
      Piedras del Almanaque es la Piedra de Siraba de Acasio 2013, no la
      estación Capubana. Y la «Piedra del Calendario» del sendero de Misaray
      (Aular Leal 2014) es, por el lugar, más probablemente la Piedra de
      Misaray de Acasio 2016 que el «Calendario de las Calzadas». Queda una
      duda que el artículo no resuelve: la «pieza monolítica de casi 4
      metros» junto a la roca satélite, que no nombra, y el «monolito de
      Siraba» de Morón 2015 y Velasco 2015. En la Fig. 1 no se reconoce la
      rana con que Velasco describe el de Siraba.
    fuente: hipotetico
    capa: 'inferencia del minador sobre lo que Acasio distingue'
    referencia: >-
      Acasio 2023, pp. 308, 309 y 313 (pdf 4, 5 y 9). Sondas: «almanaque» 0.
      Esteves 1989, p. 60 (OCR, archivo 3: «En el cerro de Siraba están
      localizadas unos petroglifos que llaman: "Las Piedras del Almanaque"»).
      barrido_web_cerro_laguna_2026-09-16.yaml h04, h05; velasco-2015-resistencia §6.
    procedencia: {obra: acasio-2023-capubana-calendario, pagina: '308, 309 y 313 (pdf 4, 5 y 9)'}
    dominios: [arte-rupestre, creencia, toponimia]
    esfera_destino: creencia
    toca_canon: [creencia-022]
    implicacion_simulacion: >-
      creencia-022 no sube con este artículo: no es la lectura de esas
      piedras. Su «que lo subiría» cambia: la lectura publicada de Siraba
      existe (Acasio 2013; Caguao y Morón 2024) y no está en el repo. Y aun
      leída, una lectura de Acasio sería hipotética. Distinción que conviene
      fijar: «del Almanaque» es nombre de la tradición local (Esteves: «que
      llaman»); «Calendario de las Calzadas» es un rótulo del autor.

  - id: acasio-018
    contenido: >-
      Una discordancia de mapa que esta minería no resuelve: Esteves pone el
      cerro de Siraba «unido al cerro de Santa Ana por el lado Noreste»
      (p. 60), y el nodo «Siraba» de OSM (place=locality) está a 2,3 km al SSE
      de la cumbre (rumbo 148°). Puede ser que la localidad y el cerro no
      estén en el mismo sitio.
    fuente: atestiguado
    capa: 'las dos fuentes; la discordancia es medida del minador'
    referencia: 'Esteves 1989, p. 60; OSM paraguana-1.json, nodo Siraba (11.8004, -69.9409)'
    procedencia: {obra: esteves-1989, pagina: '60'}
    dominios: [toponimia, geografia]
    esfera_destino: toponimia
    toca_canon: ['sitios_era2 §Capubana (materiales)', creencia-022]
    implicacion_simulacion: >-
      Antes de pintar las Piedras del Almanaque en un mapa, decidir qué
      Siraba es.

  - id: acasio-019
    contenido: >-
      La bibliografía completa del artículo son siete obras: tres del propio
      autor (2013, 2016, 2022), Salazar 2017 (Inparques), una página web de la
      Universidad de Barcelona sobre el ciclo de Metón y las dos de Rebullida
      (1990, página web; 1999, «Astronomía y Religión en el
      Neolítico-Bronce», Madrid). No cita a ningún autor de arqueología
      venezolana fuera de sí mismo y de Salazar.
    fuente: atestiguado
    capa: 'sobre el texto; el cero es de esta fuente'
    referencia: >-
      Acasio 2023, pp. 324-325 (pdf 20-21), vistas en imagen. Sondas:
      «esteves» 0, «moron» 0, «zavala» 0, «hernandez» 0, «oliver» 0,
      «arcaya» 0, «cruxent» 0, «rouse» 0, «reichel» 0, «patrimonio» 0,
      «fal-» 0.
    procedencia: {obra: acasio-2023-capubana-calendario, pagina: '324-325 (pdf 20-21)'}
    dominios: [fuentes]
    esfera_destino: fuentes
    toca_canon: []
    implicacion_simulacion: >-
      El artículo no se apoya en la cadena que el proyecto ya conoce
      (Esteves, Morón, Zavala Reyes, Hernández Baño): ni la confirma ni la
      contradice. Lo nuevo a buscar está en §fuentes_nuevas_a_buscar.


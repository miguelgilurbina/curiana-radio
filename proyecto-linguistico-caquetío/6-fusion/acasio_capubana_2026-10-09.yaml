  - obra: 'Hernández Baño, Adrián (2000). «Petroglifos. Estado Falcón»; y (1984) «Los Caquetíos de Falcón», INCUDEF'
    citada_en: 'NO la cita Acasio. Morón 2012 cita la de 2000; Zavala Reyes 2015 cita a HB (#61 capubana)'
    prioridad: 2

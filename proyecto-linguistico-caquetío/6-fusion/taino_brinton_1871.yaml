# ══════════════════════════════════════════════════════════════════════
# 5. LO QUE BRINTON CONSERVA Y NOSOTROS NO TENEMOS
# ══════════════════════════════════════════════════════════════════════
citas_de_obras_ausentes_del_repo:
  la_penultima_luenga:
    pagina: 14
    nota_de_brinton: 28
    cita_verbatim_de_las_casas: >-
      Esta era la natural y nativa de aquella ysla, y llamábanse en su lengua,
      Cibon-eyes, la penúltima sílaba luenga; y los desta por grado ó por
      fuerza se apoderaron de aquella ysla y gente della, y los tenian como
      sirvientes suyos.
    fuente_de_la_cita: "Las Casas, *Hist. Gen. de las Indias*, MSS., lib. iii, cap. 21"
    por_que_importa: >-
      🔴 **AQUÍ está «la penúltima luenga» que el encargo buscaba en el tomo I
      y que en el tomo I NO existe.** Es del libro III, que no tenemos, y llega
      por Brinton. Con esto, las marcas de acento que tenemos suman cuatro:
      tres del tomo I (todas «la última aguda») y esta, que es paroxítona. O
      sea: **Las Casas anota el acento cuando le parece notable, y no siempre
      es final.**
    y_ademas: >-
      la cita trae un dato de mundo: los ciboneyes eran los naturales de Cuba y
      fueron sometidos por los de La Española, que los tenían «como sirvientes
      suyos». Es estratificación étnica dentro del área, no un pueblo único.
  macorix_de_arriba_y_de_abajo:
    pagina: 18
    cita_verbatim: >-
      Of the two remaining languages said to have been spoken in the small
      provinces of Macorix de arriba and Macorix de abajo, in Hayti, we have no
      certain knowledge. Las Casas gives one word from the former. It is bazca,
      no, not. I cannot identify it.
    por_que_importa: >-
      tercera fuente sobre la trampa 3, y la única que da **una palabra de
      macorix**: `bazca` 'no'. Súmese a Pané (p01/p02), que aprendió macorix, y
      a Las Casas tomo I (m07). Nótese que Brinton habla de macorix de arriba y
      de abajo como DOS provincias, o sea que la cuenta de variedades sube.
    lo_que_brinton_propone_y_no_se_importa: >-
      que una de las dos fuera tupí, porque `Bugi` 'feo' y `Aiba` 'malo' de
      Pané le parecen tupí puras. ⚠️ Esas dos formas **NO están en el texto de
      Pané que tenemos** (medido: 0 ocurrencias). O son de otra edición, o
      Brinton las tomó de otro sitio. La hipótesis tupí, además, está
      descartada por la lingüística posterior. Se anota y no se usa.
  angleria_esta_en_el_repo: >-
    Pedro Mártir es la fuente de 12 entradas del vocabulario y de la única
    conversación taína que hay. `Angleria_1892_Fuentes_Historicas_Colon_America`
    vols. 1 y 4 ESTÁN en `fuentes_caquetios/`. **Verificar esas 12 contra el
    original es la tarea de mayor rendimiento que deja esta parcela**, y no
    necesita descargar nada.

# ══════════════════════════════════════════════════════════════════════
# 6. QUÉ PROPONE ESTO
# ══════════════════════════════════════════════════════════════════════
propuesta:
  al_lexicon_como_procedencia:
    que: >-
      Brinton puede dar `procedencia.obra: brinton-1871` a muchas entradas,
      **pero es procedencia de segunda mano**. Lo correcto, donde se pueda, es
      citar al cronista y poner a Brinton como vía. Donde no tengamos la obra
      del cronista, Brinton es lo que hay y se dice: `via: brinton-1871`.
  la_que_pide_decision: >-
    `taita`. Su único apoyo en Brinton es Richardo, diccionario cubano del
    s. XIX. Hoy está en el lexicón como `taíno`. **En duda, degradar** (regla
    2) apuntaría a bajarla o a marcarle `deuda: sin-procedencia-colonial`.
    La decide Miguel.
  a_la_nota_de_la_fuente_y_al_glosario: >-
    que el proyecto diga, donde explique qué es el taíno, que **«taíno» es un
    truncamiento de `nitayno` acuñado por Rafinesque en 1836 y rechazado por
    Brinton en 1871**. No cambia ninguna etiqueta; evita afirmar de paso lo que
    nuestra propia fuente niega.
  voces_nuevas_candidatas:
    ojo: "todas por vía secundaria; van con la obra del cronista, no con Brinton, salvo aviso"
    de_nucleo:
    - {forma: siba, glosa: 'piedra', tambien_en: "Pané cap. VI"}
    - {forma: nacan, glosa: 'medio, centro', tambien_en: "Las Casas tomo I cap. XLIV"}
    - {forma: bagua, glosa: 'el mar'}
    - {forma: hequeti, glosa: 'uno', cronista: "Las Casas Hist. Apol. 204"}
    - {forma: cauocum, glosa: 'tres', cronista: "Las Casas Hist. Apol. 204"}
    - {forma: yaraoucobre, glosa: 'cuatro', cronista: "Las Casas Hist. Apol. 204"}
    - {forma: bazca, glosa: "'no' (MACORIX, no la lengua general)", cronista: "Las Casas, vía Brinton p. 18"}
    de_titulos_y_rangos:
    - {forma: matunheri, glosa: 'señor de los más altos', cronista: "Las Casas Hist. Apol. 197"}
    - {forma: bajari, glosa: 'señor de aldea', cronista: "Las Casas Hist. Apol. 120"}
    - {forma: guaoxeri, glosa: 'la clase más baja', cronista: "Las Casas Hist. Apol. 197"}
    nota: >-
      los tres rangos de arriba más `cacique` y `nitayno` (Las Casas tomo I)
      dan una escala social COMPLETA y ordenada. Eso es material de
      `3-mundo/` (geografía política) además de léxico.
  lo_que_este_yaml_NO_propone: >-
    ni una re-etiqueta, ni una glosa nueva, ni tocar ningún módulo. Y en
    particular **no propone importar ninguna correspondencia lokono al
    caquetío**: el lokono es ANDAMIO de la reconstrucción (CLAUDE.md) y esta
    tabla es para que T4 la lea, no para que entre al motor.

        **Verificable en el repo**: Pedro Mártir está aquí como
        `Angleria_1892` vols. 1 y 4. Es tarea para otra sesión, no para esta.
      no_identificadas_por_brinton: "duiheyniquen, «dives fluvius»; maguacochios, «vestiti homines» (ambas de Pedro Mártir)"


# ══════════════════════════════════════════════════════════════════════
# TAÍNO ↔ LOKONO — Brinton 1871, *The Arawack Language of Guiana*
# PROPUESTA (regla 5). Comparanda. Campaña del taíno, parcela T2. 2026-09-21.
# La tabla de correspondencias de §3 es INSUMO DIRECTO para el agente T4.
# ══════════════════════════════════════════════════════════════════════
meta:
  obra: brinton-1871
  campana: taino-2026-09-21
  parcela: T2
  advertencia: >-
    ESTO NO ES CAQUETÍO, y tampoco es una fuente PRIMARIA del taíno. Brinton es
    un comparatista de 1871 que recopila lo que dijeron los cronistas. Ver
    `independencia_de_las_atestaciones`, que es lo más importante de este
    archivo.

  # ── lo que resultó FALSO al medirlo ────────────────────────────────
  correcciones_al_encargo:
  - afirmacion: "«`fuentes_caquetios/Brinton_1871_texto.txt` (+ el PDF)»"
    medido: >-
      **el PDF tiene 0 bytes.** `Brinton_1871_Arawack_Language_Guiana.pdf` =
      0 bytes, verificado el 2026-09-21; el `.txt` tiene 87.820 bytes y está
      íntegro. Ya lo decía la nota de la fuente desde 2026-07-29 y sigue igual:
      no se ha reconseguido. Todo lo de aquí sale del `.txt`.
  - afirmacion: "«comparándolo con el lokono de Guayana»"
    medido: >-
      cierto de contenido y FALSO de término: **`lokono` aparece 0 veces en el
      texto**. Brinton dice siempre `Arawack`, y da el autónimo como `lukkunu`
      (2 ocurrencias), glosado 'men'. Quien busque «lokono» en esta fuente
      encontrará cero y concluirá mal (regla 6). En este archivo se conserva la
      abreviatura del autor, `Ar.`, y se traduce a `lokono` sólo en la tabla de
      §3, que es la que va a T4, y ahí se dice.
  - afirmacion: "«el primer estudio que demuestra que el taíno es arahuaco»"
    medido: >-
      lo que hace, y hay que decirlo con precisión, es demostrar que la lengua
      de las Antillas Mayores es arahuaca. **Brinton RECHAZA el nombre
      «taíno»** y explica de dónde salió. Ver `sobre_el_nombre_taino`: es un
      hallazgo de fondo para esta campaña entera.

  # ── §1 el extractor ────────────────────────────────────────────────
  extraccion:
    fuente: "`Brinton_1871_texto.txt`, 87.820 bytes — OCR de archive.org, ya en el repo"
    calidad: >-
      OCR de 1871 sin corregir. Hay confusiones sistemáticas (`l`/`i`, `n`/`ii`,
      `e`/`c`, `tt`/`tl`) y bloques de basura al principio (las guardas del
      ejemplar escaneado). Toda forma arawack de este archivo va marcada
      `ocr: dudoso` cuando el OCR la deja ambigua — es literalmente ilegible en
      algunos casos (`akhxtyalia`, `kaijaunan`).
  paginacion:
    estado: PARCIALMENTE recuperable
    como: >-
      el OCR perdió los números de página sueltos pero conservó los
      ENCABEZADOS CORRIDOS, que los llevan: «12 THE ARAWACK LANGUAGE OF
      GUIANA» (par) y «IN ITS LINGUISTIC AND ETHNOLOGICAL RELATIONS. 13»
      (impar). Recuperadas así: 3, 4, 9 (el OCR la da como «0»), 10, 11, 12,
      14, 15, 18.
    no_recuperadas: 13, 16, 17 (sus encabezados perdieron el número en el OCR)
    como_se_cita_aqui: >-
      `pagina` es la página impresa del ancla más cercana ANTERIOR. Para las
      entradas del vocabulario es exacta, porque el vocabulario cae entero
      entre anclas conocidas (pp. 11-14).

  cobertura:
    leido: el vocabulario entero (pp. 11-14) y el análisis toponímico (pp. 14-15), pasaje a pasaje
    no_leido_pasaje_a_pasaje: >-
      la gramática y el vocabulario del arawack de Guayana (pp. 3-10) y la
      mitología comparada (pp. 15-18). Barridos por patrón. Son lo que la nota
      de la fuente ya declaraba minado en 2026-07-29 (84 entradas del lexicón
      citan a Brinton, casi todas por el lado lokono).

# ══════════════════════════════════════════════════════════════════════
# 1. 🔴 INDEPENDENCIA DE LAS ATESTACIONES (skill §8)
#    Lo primero que hay que leer de este archivo.
# ══════════════════════════════════════════════════════════════════════
independencia_de_las_atestaciones:
  regla: >-
    **la atestación es del cronista, no de Brinton.** Brinton no oyó hablar
    taíno a nadie: la lengua llevaba tres siglos muerta cuando escribió. Cada
    entrada de su vocabulario es una cita, y lo que vale como procedencia es
    la obra citada, con Brinton como intermediario declarado.
  quien_esta_detras_de_cada_entrada:
    las_casas_hist_apologetica: "caps. 2, 46, 61, 120, 197, 199, 204, 241 — NO está en el repo"
    las_casas_hist_general: "lib. i cap. 90 y 120, lib. iii caps. 21 y 33, lib. iv cap. 48, lib. xvii cap. 1 — sólo tenemos el lib. i (tomo I)"
    pedro_martir_decadas: "pp. 9, 25, 26, 63, 279, 285, 286, 293, 302, 303, 304, 380 — el repo tiene Angleria_1892 vols. 1 y 4"
    oviedo_hist_general: "lib. v caps. 1 y 2, lib. vi cap. 8, lib. vii caps. 1 y 2 — el repo tiene Oviedo_Valdes_1851 vol. 1"
    pane: "pp. 443, 444 de una edición que no tenemos"
    navarrete_viages: "tomo 1, pp. 45, 134, 135, 231 — el DIARIO DE COLÓN. No está en el repo"
    richardo: "*Diccionario Provincial* cubano, siglo XIX"
  la_trampa_concreta:
  - caso: caona / nozay / tuob
    brinton: "p. 13, «Nucay or nozay, gold [...] The words caona and tuob were in vogue in Haiti (Navarrete, Viages, Tom. 1, pp. 45, 134)»"
    las_casas: "tomo I cap. LXVII, «Aquí no llaman caona al oro [...] ni nozay [...] sino tuob»"
    veredicto: >-
      🔴 **NO SON DOS ATESTACIONES.** Navarrete edita el diario de Colón, y el
      tomo I de Las Casas es un resumen comentado de ese mismo diario. Brinton
      y Las Casas están citando **el mismo texto por dos puertas**. Contarlas
      como corroboración independiente sería exactamente el error de `datihao`
      con Jahn (skill §8). Apoyo real: UNO.
  - caso: guanara
    brinton: "p. 12, «Guanara, a retired stop. (Pane, p. 444)»"
    veredicto: "misma fuente que `taino_pane_c1498.yaml` pv11. Apoyo real: UNO."
  - caso: macana
    brinton: "p. 13, «Macana, a war club. (Navarrete, Viages. i. p. 135)»"
    veredicto: >-
      el diario de Colón otra vez — y en el tomo I de Las Casas la palabra
      **sólo aparece en el epígrafe del cap. LXVII**, no en el cuerpo. Es la
      trampa 1 de la campaña vista desde el otro lado: dos apariciones que
      parecen dos fuentes y son la misma página de Navarrete.
  - caso: taita
    brinton: "p. 13, «Taita, father (Richardo)»"
    veredicto: >-
      🔴 la fuente es un diccionario provincial cubano del siglo XIX, no una
      crónica. `taita` está hoy en el lexicón como `taíno`; con este apoyo NO
      es atestación colonial. **Es una entrada a revisar**, y la decide Miguel.
  lo_que_si_es_de_brinton: >-
    la comparación con el arawack y las etimologías. Eso es análisis suyo de
    1871, y va etiquetado como tal: es hipótesis comparativa, no atestación.

# ══════════════════════════════════════════════════════════════════════
# 2. EL NOMBRE «TAÍNO» — hallazgo de fondo para la campaña
# ══════════════════════════════════════════════════════════════════════
sobre_el_nombre_taino:
  pagina: 13
  cita_verbatim: >-
    Nitainos, the title applied to the petty chiefs, (regillos ó guiallos. Las
    Casas, Hist. Apol. cap. 197) ; tayno vir bonus, taynos nobiles, says Pet.
    Martyr, (Decad. p. 25). The latter truncated form of the word was adopted
    by Rafinesque and others, as a general name for the people and language of
    Hayti. There is not the slightest authority for this, nor for supposing,
    with Von Martius, that the first syllable is a pronominal prefix.
  segunda_cita:
    pagina: 10
    verbatim: >-
      Rafinesque christened it the " Taino " language, and discovered it to be
      closely akin to the " Pelasgic " of Europe.
  que_dice: >-
    «taíno» NO es como se llamaba a sí misma esa gente ni su lengua. Es
    `nitayno`, un TÍTULO de nobleza ('caballero y señor principal' en Las Casas
    tomo I cap. LVIII, `taynos nobiles` en Pedro Mártir), truncado y ascendido
    a nombre de pueblo por Rafinesque en 1836. Brinton, en 1871, lo rechaza:
    «no hay la menor autoridad para esto».
  para_el_proyecto: >-
    Miguel abrió esta campaña diciendo que la recuperación contemporánea del
    taíno —escritura propia incluida— no es dato porque es contemporánea. Esto
    es la capa de debajo del mismo problema: **la etiqueta `taíno` de nuestras
    52 entradas es un término académico del siglo XIX, no un autónimo**, y el
    nombre se inventó dos veces antes de que nadie lo reviviera. No propongo
    renombrar nada: propongo que la nota de la fuente y el glosario del vault
    lo DIGAN, para que ni el lexicón ni la web afirmen de paso algo que la
    fuente que cita niega expresamente.
  lo_que_los_de_alli_si_decian: >-
    `lucayos` sale de `lukku` 'hombre' + `kairi` 'isla' = «hombres de las
    islas» (Brinton p. 15); `Siboneyes` de `siba` 'piedra' + `eyeri` 'hombres'
    = «hombres de las rocas» (p. 14). Los autónimos que hay son locales, no de
    una nación antillana. Es coherente con la trampa 3: **no había un solo
    pueblo ni una sola lengua a los que poner un solo nombre.**


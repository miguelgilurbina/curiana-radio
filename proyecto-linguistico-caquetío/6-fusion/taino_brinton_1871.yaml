# 3. LA TABLA — «Vocabulary of the Ancient Language of the Great Antilles»
#    pp. 11-14. INSUMO DIRECTO PARA T4 (el cruce con el caquetío).
# ══════════════════════════════════════════════════════════════════════
vocabulario_antillano:
  declaracion_del_autor:
    pagina: 11
    verbatim: >-
      In the following vocabulary I have not altered in the least the Spanish
      orthography of the words, and so that the analogy of many of them might
      at once be preceived, I have inserted the corresponding Arawack
      expression, which, it must be borne in mind, is to be pronounced by the
      German alphabet.
    lo_que_implica: >-
      (a) la grafía antillana es la del CRONISTA, no normalizada por Brinton —
      bien; (b) la grafía arawack sigue convención ALEMANA (de los misioneros
      moravos de Guayana), así que su `j` es /j/, su `w` es /v/ y su `ch` es
      /x/. Quien lea la columna lokono con valores ingleses la lee mal.
  campos:
    forma: como la escribe Brinton (OCR del original)
    glosa: glosa de Brinton, VERBATIM
    cronista: quien la atestigua según Brinton — ES LA PROCEDENCIA REAL
    lokono: la comparanda arawack que Brinton propone (análisis suyo, 1871)
    pagina: página impresa
    en_el_lexicon: clave del lexicón si la hay

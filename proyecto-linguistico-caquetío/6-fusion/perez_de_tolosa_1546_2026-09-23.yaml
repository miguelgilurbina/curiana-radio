    - id: ptol-27
      polity: "yaracuy (probable) — interior, NO costera"
      obra: perez-de-tolosa-1546
      documento: "Segunda carta, continuación (1547)"
      pagina_impresa: 241
      cita: >-
        «el valle que se dice de las Damas, el cual hice todo de paz: es uno de
        los valles más gentiles que puede haber en Indias, de muchos indios y

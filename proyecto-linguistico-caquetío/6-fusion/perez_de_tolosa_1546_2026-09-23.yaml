      verificado_en_imagen: "pp. 228 y 232 sí"
      epoca: contacto-temprano
      etiqueta: atestiguado
      nota: >-
        Tres grafías de la misma gente en el mismo impreso: «Piracoras»
        (probable errata por Xiracoras), «Xiracoras», «Xiraras». La sierra
        maicera abastecía a Coro: el reparto costa-pesca / sierra-maíz, visto en
        1546. Para `3-mundo/etnias.yaml`: dato para el vecino jirajara.

    - id: ptol-29
      polity: "Tocuyo (Cuibas, Coyones) — otra gente"
      obra: perez-de-tolosa-1546
      documento: "Primera carta (1546); Relación (1546)"
      pagina_impresa: [223, 235]
      cita: >-
        p. 223: «tierra muy poblada de indios y muy pobres […] están docientos
        y más caciques de paz con su gente». p. 235: «los indios son de nación
        Cuibas y Coyones y de otras muchas y diversas lenguas».
      epoca: contacto-temprano
      etiqueta: atestiguado
      nota: >-
        ⚠️ «Docientos y más caciques» es del TOCUYO, no de la costa. Fácil de

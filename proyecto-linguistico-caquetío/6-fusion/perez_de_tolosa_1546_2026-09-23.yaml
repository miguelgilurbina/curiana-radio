    - id: ptol-30
      polity: "Maracapana (Chirigotos) — otro extremo de la gobernación"
      obra: perez-de-tolosa-1546
      documento: "Relación de las tierras (1546)"
      pagina_impresa: [225, 226]
      cita: >-
        «por la población pasa un río muy caudaloso que se llama Hunare: tenían
        los pueblos muy buenos asientos: había pueblo de á seiscientas casas:
        era gente que, sobre sus pesquerías y términos, tenían guerra unos con
        otros»
      verificado_en_imagen: true
      epoca: contacto-temprano
      etiqueta: atestiguado
      nota: >-
        El pasaje que la obra secundaria parece haber trasladado a los caquetíos
        (ver lo_que_resulto_falso). Guerra «sobre sus pesquerías y términos»:
        territorios de pesca defendidos — dato de los Chirigotos, no de la
        costa caquetía.

# ══════════════════════════════════════════════════════════════════════
# COTEJO: la carta de Ampíes en Fernández Duro (1885) contra Arcaya (1920)
# y contra Velasco (2015, que leyó el manuscrito)
# ══════════════════════════════════════════════════════════════════════
cotejo_ampies:
  por_que: >-
    La carta de Ampíes es la fuente del episodio de la hija de Manaure y de la
    embajada de Baracoica. El repo la cita por Arcaya pp. 160-161; aquí está el
    texto de la edición que Arcaya dice copiar.
  arcaya_dice_copiar_de: >-
    «Está publicada en la Historia de Oviedo y Baños, edición de Fernández Duro,
    tomo II, pág. 209» (Arcaya p. 160 n. 3). Es esta edición.
  veredicto: >-
    **La cita de Arcaya se confirma en lo sustancial**: Baracoica «está en las
    islas y es su pariente y deudo», el gran cacique «diez leguas la tierra
    adentro en la provincia de Coro», «Naure ó Anaure», la india criada en su
    casa, Gonzalo de Sevilla, la armada que tomó «una india hija del gran
    Cacique de Coro», «una hija suya con su marido». Pero con cuatro diferencias
    que importan:
  diferencias:
    - que: "ELISIÓN"
      detalle: >-
        Arcaya corta con «. . . .» justo después de «Naure o Anaure» y se salta
        la frase «el cual por ser tan gran señor se hace adorar como Dios, dando
        á entender á los indios que él da los temporales». Quien cite a Manaure
        «vía Arcaya p. 160» NO tiene el dato del culto ni el de los temporales:
        el repo lo tenía sólo por Velasco 2015 (folio 14 del manuscrito).
    - que: "VARIANTE DE LECTURA — decide el dato de creencia"
      detalle: >-
        Fernández Duro imprime «se hace adorar **como Dios**» (verificado en
        imagen, p. 212). Velasco 2015, leyendo el manuscrito del AGI, transcribe
        «se haze adorar **como digo**» (ficha `velasco-2015-resistencia`, §2).
        Son la misma carta: o el editor de 1885 leyó «dios» donde había «digo»,
        o Velasco al revés. Con «como digo» el cacique se hace adorar y punto;
        con «como Dios», se hace adorar COMO UN DIOS. Lo que no cambia en
        ninguna lectura: «se hace adorar» y «él da los temporales». Pide ver el
        manuscrito → issue.
    - que: "PÁGINA"
      detalle: >-
        El pasaje está en la p. 212, no en la 209 (donde empieza la carta).
        `antroponimos_caquetios.yaml` hereda la 209 de Arcaya.
    - que: "GRAFÍAS"
      detalle: >-
        Arcaya moderniza: «Paraguaná» con tilde (el impreso: «Paraguana»),
        «enviar» (impreso: «inviar»), «recibir» (impreso: «rescibir»), «Sauca e
        Paraguaná e otras» (impreso: «Sauca, y Paraguana é otros»). Velasco da
        «Baracoyca» del manuscrito; Fernández Duro y Arcaya, «Baracoica».
  lo_que_la_carta_no_dice:
    - >-
      que Baracoica sea hijo de Manaure. La carta dice «es su pariente y deudo»,
      y el «su» son los indios de la costa que lo envían. «Hijo del mismo
      Manaure» es de Arcaya p. 199, que no da fuente allí.
    - >-
      el nombre de la hija («Judibana»), ni el pueblo del marido.
    - >-
      la fecha. El impreso no la trae; «fines de 1525 o principios de 1526» es
      inferencia de Arcaya (p. 160), anclada en la cédula de 17-XI-1526.
  independencia: >-
    Fernández Duro, Arcaya y Velasco son TRES lecturas de UNA atestación (la
    carta), no tres atestaciones (minar-fuente §8). La de Fernández Duro y la
    de Velasco son independientes ENTRE SÍ como lecturas (el impreso de 1885,
    cuya procedencia no localicé en el tomo, y la del manuscrito del AGI);
    Arcaya depende de Fernández Duro.

# ══════════════════════════════════════════════════════════════════════
# PROPUESTAS AL CANON (propone, no toca — regla 5)
# ══════════════════════════════════════════════════════════════════════
propuestas:

  - destino: 3-mundo/asentamientos.yaml
    que: >-
      Añadir a los nodos de la región `paraguana` (o a una nota de región) el
      dato demográfico de 1546: «cuatro poblezuelos», «no hay en toda ella
      trecientos indios» (p. 228), con `atestacion: colonial` y
      `precontacto: desconocido`. NO es un nodo nuevo: los cuatro no tienen
      nombre. Y a la región `golfete-de-coro`: «4-5 pueblos» comarcanos a Coro
      y «más de quinientos» sacados (p. 274, acusación de 1545).
    no_proponer: >-
      El «pueblo de cuatrocientas casas»: no está en la fuente, y el de
      seiscientas es de los Chirigotos.

  - destino: 3-mundo/corpus/geografia_politica.yaml — geografia_politica-011
    que: >-
      Cambiar `procedencia` a la fuente primaria: `{obra: perez-de-tolosa-1546,
      pagina: "229"}`, dejando a Oliver 1989 como apoyo; y corregir el
      `contenido`: el primario NO nombra a los kirikires ni a los caquetíos en
      ese comercio (eso es de Oliver/Oviedo y Valdés), y escribe «Puruara» /
      «Xuruara».

  - destino: 3-mundo/corpus/creencia.yaml — creencia-013
    que: >-
      Su `referencia` es vaga («crónicas del contacto sobre Manaure»). Tiene
      cita primaria: Ampíes, en esta edición p. 212 («se hace adorar como Dios,
      dando á entender á los indios que él da los temporales»), y en el
      manuscrito vía Velasco 2015 (folio 14). Con la variante «Dios/digo» a la
      vista (issue).

  - destino: 6-fusion/antroponimos_caquetios.yaml
    que: >-
      (a) Naure/Anaure: página 209 → 212. (b) Manaure: añadir las grafías
      primarias **Manaore** (Tolosa, tercera carta, p. 248) y **Manabre**
      (interrogatorio, p. 266, errata probable; el índice del editor la asienta
      como Manaure). (c) Baracoica: la carta dice «pariente y deudo», no
      «hijo»; el «hijo del mismo Manaure» de Arcaya p. 199 queda sin fuente
      primaria en este tomo.

  - destino: 3-mundo/polities-caquetias.md y curiana_sim/curiana_polities.py (polity `llanos`)
    que: >-
      Añadir a la polity `llanos` el rasgo de LENGUA, que hoy no tiene: «de
      nación Caquetios, aunque algo difieren en la habla á los de Coro» (p. 234,
      de segunda mano), y el de ECONOMÍA: «viciosos de comida de carne y
      pescado; no son grandes labradores». Ver el issue: es decisión.

  - destino: 3-mundo/etnias.yaml (jirajara)
    que: >-
      Tres grafías del impreso (Piracoras, Xiracoras, Xiraras; pp. 228, 232,
      255) y el dato «grandes labradores de maíz» que abastecían a Coro en
      tiempo de paz, «no tenían pueblos grandes».


        lo sitúa con precisión.

    - id: ptol-28
      polity: "sierra de Coro — jirajara (vecinos, otra etnia)"
      obra: perez-de-tolosa-1546
      documento: "Relación (1546); Tercera carta (1548)"
      pagina_impresa: [228, 232, 255]
      cita: >-
        p. 228: «De la ciudad de Coro están las sierras tres leguas; están
        pobladas de indios de nación Piracoras, gente belicosa y guerrera; son

# ─────────────────────────────────────────────────────────────────────────
# PROPUESTA — la campaña de ANTROPÓNIMOS de la esfera caquetía
#
# Encargo de Miguel, 2026-09-14: «¿No deberíamos rehacer los nombres en base
# a lo que conocemos y tenemos de caquetío?» → «Sí a los dos puntos».
# Registro de la decisión: 6-fusion/decisiones_tanda_2026-09-14.yaml
# §antroponimos_era2.
#
# Esto MINA y PROPONE (regla 5). No toca el lexicón ni 3-mundo/corpus/.
# Método: el mismo de la campaña de topónimos — una entrada por nombre, con
# procedencia (clave foránea a 4-fuentes/bibliografia.yaml), etiqueta
# epistémica, y regla_3 / regla_4 declaradas donde apliquen.
#
# Lo que este archivo da de comer: 6-fusion/sistema_de_nombres_era2.yaml
# (las reglas) y 6-fusion/mapa_nombres_era2.yaml (los 63 del elenco).
# Medición: python 6-fusion/scripts/medir_antroponimos.py
# ─────────────────────────────────────────────────────────────────────────
meta:
  fecha: '2026-09-14'
  estado: sin-fusionar
  quien: escriba (Claude), a pedido de Miguel
  obra: varias

  pregunta: >-
    ¿Qué nombres de PERSONA de la esfera caquetía están documentados en las
    fuentes del repo — caciques, principales, títulos, mujeres con nombre,
    apellidos vivos, nombres de leyenda —, con qué forma, de qué época, de
    qué comarca, y qué formantes recurren en ellos?

  como_se_midio:
    barrido: >-
      python, expresiones regulares sobre el texto plano de las fuentes:
      fuentes_caquetios/*.txt y *.ocr.txt (Castellanos, Esteves 1-6, Gatschet
      ×2, van Buurt, Brinton, Pané, Fabo, Perea, Oliver cap. 3 §324) más el
      texto extraído con `pdftotext -layout` de Arcaya 1920, Oviedo y Baños,
      Oliver 1989 cap. 3 (Ethnohistory) y la tesis. Normalización NFD sin
      diacríticos antes de buscar, porque tres de los cuatro PDF salen en
      latin-1 y los acentos rompían el patrón.
    patrones: >-
      caciqu|caziqu|casiqu + (llamado|dicho|nombrado|por nombre|se llama|se
      dize) + Mayúscula · principal(es) + (dicho|llamado|nombrado|se dize) ·
      (india|muger|mujer|cacica|hija|hermana|vieja|moza|señora|princesa) +
      (llamada|dicha|nombrada|de nombre) · Don/Doña + Mayúscula · «apellido»
      · «nombre propio» · «antropónim» · y las raíces cortas de los nombres
      que el repo ya tenía (uriaco-, cagual-, bonyat-/boniat-, categu-,
      baracoic-, hurihureb-/hurehureb-/jurijureb-, manaure, naure/anaure,
      tumarur-, judiban-, jayan-, borob-, y los apellidos vivos).
    ortografias_coloniales_probadas: >-
      cazique/casique/caciqu; se dize/se dice; Don/Doña con y sin acento;
      Bonyata~Boniata; Hurihurebo~Hurehurebo~Jurijurebo; Goyabaco~Gorybacoa~
      Guaibacoa; Todariquiba~Todarequiba~Tubariquiba; Alexandro~Alexandre.
    fuente_del_recuento: >-
      6-fusion/scripts/medir_antroponimos.py lee ESTE archivo y
      2-lengua/toponimos.yaml, y vuelve a contar la recurrencia de cada
      formante. Si `formantes[].recurrencia` no coincide con lo que mide, es
      un bug de este YAML (regla 1).

  ceros_verificados:
    - raices: 'india|muger|mujer|cacica|hija|hermana|vieja|moza|señora|princesa + llamada/dicha/nombrada/de nombre'
      resultado: >-
        CERO nombres de mujer indígena en la esfera caquetía. Los ocho aciertos
        del patrón en todo el corpus son: «mujer llamada Juana», «india llamada
        Catalina», «moza dicha Ana» (Castellanos, fuera de Coro), «mujer llamada
        Itiba» (Pané, taíno), «mujer llamada Francisca» (Arcaya, colonial),
        «señora … llamada», «mujer llamada Leonor» y «vieja llamada Apacuana»
        (Oviedo y Baños; Apacuana es de los Quiriquires del valle de Caracas,
        regla 4). Ninguna caquetía, ninguna con nombre indígena.
    - raices: 'cacica|casica|cazica'
      resultado: >-
        13 aciertos en Castellanos y 1 en Perea, todos fuera de la esfera
        (Antillas, Nueva Granada, Banda Oriental). Ninguna cacica caquetía con
        nombre.
    - raices: 'género en el nombre: -ko, -sha, -ru, -tu, -ma, -na como marca de sexo'
      resultado: >-
        CERO. Ninguna de las 62 obras de bibliografia.yaml dice que el caquetío
        marque género en el antropónimo. Los sufijos -ko «hombre de» y -sha
        «mujer de» de REGLAS_AGENTIVAS no tenían campo de evidencia: eran
        convención de la era 1 nunca declarada. RETIRADOS por decisión de Miguel
        del 2026-09-14 («Sí o sí hay que sacar eso de -ko y -sha. Si es
        inventado, tanto de la gramática como de los nombres»), de los nombres
        y de la gramática que el prompt enseña.
    - raices: 'nombre propio|nombres propios|antropónim en Perea Alonso 1942 Tomo I'
      resultado: >-
        3 aciertos, y ninguno sirve: los «nombres propios» de Perea son de los
        CHANÁ y los CHARRÚA de la Banda Oriental (líneas 869, 1045, 4368). No
        hay antroponimia lokono en el tomo I. Perea queda FUERA de esta campaña:
        no aporta ni comparanda de nombres.
    - raices: 'chief|cacique|proper name|surname|personal name en Gatschet 1885 y van Buurt 2014'
      resultado: >-
        CERO antropónimos. Gatschet habla de nombres de PLANTA e ISLA (arabo,
        Aruba, Curaçao). Van Buurt trae un cacique caquetío de Curazao que viajó
        a Europa con el padre Schabel y murió en Bruselas, «descendiente del
        gran Manaure» (Schabel, Notitia 1705, p. 112) — pero SIN NOMBRE.
    - raices: 'Uriacoa|Caguallo en Arcaya, Castellanos, Oviedo y Baños'
      resultado: >-
        Uriacoa aparece UNA sola vez en Arcaya (p. 327) y Caguallo NINGUNA: la
        cadena Uriacoa → Caguallo → Martínez Manaure sólo está entera en Oliver
        1989 cap. 3 pp. 255-256, que cita A.G.I. y Arcaya 1978 (otra obra, no la
        de 1920 que tiene el repo). No hay redundancia: es una sola fuente.

  lo_que_no_se_encontro:
    - 'ni un solo nombre de mujer caquetía en fuente escrita; las tres que circulan (Judibana, Jayana, Yanara) son tradición oral sin documento'
    - 'ningún nombre de persona ANTERIOR al contacto: el registro empieza en 1526-1538. Precontacto hay CERO (regla 3)'
    - 'ninguna fuente explica cómo se ponía el nombre, ni si cambiaba con la iniciación, el oficio o la muerte'
    - 'ningún nombre de linaje o clan caquetío: los seis de D1 (Corie, Buio, Kaira, Warana, Paugis, Chiriware) son canon-simulación, y la estructura ya lo declara'
    - 'ninguna glosa de autor para -aure, -ata ni -ika: la serie de apellidos en -aure se declara como serie (Esteves p. 13) sin decir qué significa el elemento'
    - 'Castellanos NO tiene una «elegía de Coro» con nombres caquetíos: ver verificacion_categue abajo'

  verificacion_categue:
    encargo: '«principal dicho Categue» en la línea 52079 de Castellanos; verifica que esté dentro de la elegía de Coro y quién es'
    medido: >-
      La línea 52079 existe y dice «Con otro principal dicho Categue». Pero NO
      está en una elegía de Coro: está en la PARTE II, ELEGÍA I («A la muerte
      de micer Ambrosio, primero gobernador por los alemanes»), CANTO II, cuyo
      argumento es la marcha de Juan de Leiva y Pedro de Limpias «del Cabo de
      la Vela y Soturiua». Y el pasaje concreto narra la entrada de FEDERMANN
      («el dicho Fedrimán») tierra adentro, «en demanda de los llanos»: los
      cristianos se presentan como «carísimos hermanos del cacique Manaure, rey
      de Coro» (línea 52133), pasan ocho días entre esos indios, y luego «dieron
      muy lejos ya desta frontera, en un pueblo de chipas EN LOS LLANOS».
    quien_es_categue: >-
      Un «principal» que un guía —al que el verso llama «el indio caquetío»
      (línea 52100)— nombra junto a otros tres al ver acercarse gente:
      Catimayagua, Categue, Gecoagua y Badurajara (líneas 52078-52082; la
      segunda sale del OCR como «Geeoagúa»). No son de Paraguaná ni del Golfete:
      son del camino de Federmann hacia los llanos.
    consecuencia: >-
      🔴 REGLA 4. Categue y los otros tres quedan marcados como del INTERIOR /
      los llanos, no de la polity costera. NO se reutilizan como nombres del
      elenco de la era 2 sin marca, que es exactamente el error que Oliver
      denuncia. El encargo los daba por «de la elegía de Coro»: no lo son.
    valor_que_si_tienen: >-
      ⭐ La misma página da «el cacique Manaure, rey de Coro» en verso de
      Castellanos — atestación literaria del título aplicado al señor de Coro,
      independiente de Oviedo y Baños y de Arcaya.

# ══════════════════════════════════════════════════════════════════
# 1. LOS ANTROPÓNIMOS
# ══════════════════════════════════════════════════════════════════
antroponimos:

  # ────────────── TÍTULOS (el lexicón ya los tiene) ──────────────
  - forma: manaure
    variantes: [Manaure, managuanare, managuarire, Manare, Anaure, Naure]
    tipo: título
    genero: 'no consta'
    epoca: 'contacto (1526-1538) y s. XX como apellido vivo'
    polity: 'costera — Coro, Todariquiba, Paraguaná'
    procedencia: {obra: zavala-reyes-2015, pagina: 'nota al pie (2), citando a Carlos González, PLINCODE p. 23'}
    etiqueta: atestiguado
    segmentacion: 'ma- + -naure (no aplicada)'
    formantes: ['-aure']
    apoyos:
      - {obra: oviedo-y-banos, pagina: '27 (Bibl. Ayacucho)', que: '«el Cacique Manaure, poderoso en riquezas y vasallos, era señor de toda aquella provincia, habitada de la nación caiquetía»'}
      - {obra: castellanos-elegias, pagina: 'Parte II, Elegía I, Canto II (línea 52133 del texto plano)', que: '«Del cacique Manaure, rey de Coro»'}
      - {obra: arcaya-1920, pagina: '112-115', que: 'Manaure jefe-hechicero; «Manaure era, pues, un diao»'}
      - {obra: oliver-1989-cap3, pagina: '256 n. 107', que: '«Manaure was baptized with the name of Don Martín by Juan de Ampíes the Elder»'}
      - {obra: antolinez-1944-manaure, pagina: 'vía moron-2012-petroglifos', que: '«Manaure no es nombre propio de varón, sino el nombre de una jerarquía política»'}
    nota: >-
      Es TÍTULO, no nombre propio: el canon ya lo dice y por eso el agente
      Manaure se conserva tal cual en la era 2. La variante NAURE / ANAURE de
      Arcaya (abajo) es la pieza nueva de esta campaña.

  - forma: diao
    variantes: [díao, tiao, yatii]
    tipo: título
    genero: 'no consta'
    epoca: contacto
    polity: 'costera, y Apure según el P. Carvajal (regla 4 para esa extensión)'
    procedencia: {obra: zavala-reyes-2015, pagina: '67 (glosario, entrada 106)'}
    etiqueta: atestiguado
    apoyos:
      - {obra: oliver-1989-cap3, pagina: '251', que: '«the main diao or great cacique, Manaure»'}
      - {obra: arcaya-1920, pagina: '47 y 114-115', que: '«los Caquetíos de Coro llamaban díaos a sus caciques principales»; el diao es más que el boratio'}
    nota: 'cargo, no nombre. La era 2 lo usa como cargo (regla c del sistema de nombres).'

  - forma: apopo
    tipo: título
    genero: 'no consta'
    epoca: contacto
    polity: costera
    procedencia: {obra: zavala-reyes-2015, pagina: '65'}
    etiqueta: atestiguado
    nota: 'jefe de parcialidad pequeña; cargo, no nombre.'

  - forma: boratio
    variantes: [boratia, piache]
    tipo: título
    genero: 'no consta — la forma boratia es del canon del proyecto, no de la fuente'
    epoca: contacto
    polity: costera
    procedencia: {obra: zavala-reyes-2015, pagina: '66'}
    etiqueta: atestiguado
    apoyos:
      - {obra: arcaya-1920, pagina: '115', que: '«el simple médico hechicero a quien llamaban boratio»'}
      - {obra: jahn-1927, pagina: '213 n. 29', que: '«adivino o sacerdote», vía Oviedo y Valdés'}
    nota: 'cargo, no nombre.'

  # ────────────── CACIQUES Y PRINCIPALES CON NOMBRE ──────────────
  - forma: Naure
    variantes: [Anaure]
    tipo: cacique con nombre
    genero: 'no consta'
    epoca: 'contacto (carta de Ampíes al Rey, c. 1521-1526)'
    polity: 'costera — «diez leguas la tierra adentro en la provincia de Coro»'
    procedencia: {obra: arcaya-1920, pagina: '160'}
    cita: >-
      «…esto principalmente me enviaba a decir un gran cacique que está diez
      leguas la tierra adentro en la provincia de Coro, y el dicho Cacique se
      llama Naure o Anaure…» (carta de Juan de Ampíes, publicada en los
      Documentos de la Historia de Oviedo y Baños, ed. Fernández Duro, t. II,
      p. 209; transcrita por Arcaya 1920 p. 160)
    etiqueta: atestiguado
    segmentacion: '(a)- + naure'
    formantes: ['-aure']
    por_que_importa: >-
      ⭐⭐ HALLAZGO DE ESTA CAMPAÑA. Es la forma DESNUDA del elemento que la
      serie de apellidos de Esteves lleva detrás (Ad-aure, Tim-aure, Yar-aure,
      Chun-aure, Man-aure), en primario del contacto y aplicada a una persona.
      Y `naure` ya está en el lexicón como voz caquetía atestiguada. El nombre
      no es opaco: es material léxico, como dice el principio de transparencia
      de velasco_primarios_agi.yaml §principio_general.
    reserva: >-
      Arcaya no dice que Naure sea Manaure, y el propio texto los trata como
      dos noticias (aquí «un gran cacique … diez leguas la tierra adentro»;
      el Manaure del pacto está en Todariquiba, «dos leguas» de Coro según
      Bastidas 1538). Que Naure ~ Manaure sean el mismo nombre con y sin `ma-`
      es LECTURA, no dato: entra como `hipotetico` y no se aplica.
    regla_3: 'atestación de contacto; no se proyecta como norma precontacto'

  - forma: uriakoa
    variantes: [Uriacoa, Don Sancho Uriacoa, Don Sancho de Uriacoa]
    tipo: cacique con nombre
    genero: 'no consta (el portador documentado es varón)'
    epoca: 'colonial — fines del s. XVI'
    polity: 'costera occidental — «los Caquetíos del Occidente», entre Coro y Maracaibo; después también Paraguaná'
    procedencia: {obra: zavala-reyes-2015, pagina: 'glosario — «Uriacoa: apellido de un cacique del s. XVI»'}
    etiqueta: atestiguado
    segmentacion: 'uria + -koa'
    formantes: ['-koa']
    glosa_de_la_segmentacion: >-
      `uria` «plantío, siembra» está en el lexicón como caquetío-atestiguado y
      `-koa` es la familia de `bakoa` «bosque, lugar, paraje, sitio fértil» /
      `-bacoa` (morfemas.yaml morfema-001). Uriacoa = «el del sitio sembrado».
      Etiqueta de la segmentación: reconstruido (la fuente no la da).
    apoyos:
      - {obra: arcaya-1920, pagina: '327', que: '«De estos Caquetíos del Occidente se le había dado el título de Cacique general a un indio llamado don Sancho de Uriacoa, que creemos era deudo de Manaure … sus descendientes usaron como apellido el nombre del célebre caudillo caquetío»'}
      - {obra: oliver-1989-cap3, pagina: '255-256', que: '«the Crown recognized Don Sancho Uriacoa as the Caquetío paramount chief»'}
    regla_3: 'colonial (s. XVI-XVII). Es el nombre de un cacicazgo bajo la Corona, no de un señor precontacto'

  - forma: Caguallo
    variantes: [Don Luis Caguallo]
    tipo: cacique con nombre
    genero: 'no consta (el portador documentado es varón)'
    epoca: 'colonial — hasta 1636'
    polity: 'costera — paramount caquetío reconocido por la Corona'
    procedencia: {obra: oliver-1989-cap3, pagina: '255-256'}
    cita: >-
      «He [Don Sancho Uriacoa] was succeeded by his son Don Luis Caguallo, who
      in 1636 "abdicated" in favor of his brother Don Luis Martínez Manaure.»
    etiqueta: atestiguado
    segmentacion: 'cagua- + -llo (no resuelta)'
    formantes: ['-allo']
    reserva_ortografica: >-
      🔴 El dígrafo <ll> es castellano. El filtro fonotáctico del proyecto sólo
      admite `ll` en el inventario «atestiguado» por residuo castellano
      (`caquetillo`, `casquito`: curiana_fonotactica.py, advertencia 2). Así que
      -allo NO se toma como formante productivo: puede ser la pluma del
      escribano. La raíz `cagua-` sí casa con el apellido vivo Caguao/Caguado.
    regla_3: colonial

  - forma: Bonyata
    variantes: [Boniata]
    tipo: cacique con nombre
    genero: 'no consta'
    epoca: 'contacto/colonial temprano — 1538'
    polity: 'costera — Paraguaná, cacique de Myraca (Miraca)'
    procedencia: {obra: velasco-2015-resistencia, pagina: 'Folio 2, Legajo 218, Audiencia de Santo Domingo, AGI; carta de Rodrigo de Bastidas, 8-X-1538'}
    cita: '«…y a Bonyata Cacique d Myraca el qual en su jornada murió…»'
    etiqueta: atestiguado
    segmentacion: 'bony- + -ata'
    formantes: ['-ata']
    apoyos:
      - {obra: arcaya-1920, pagina: '220', que: '«Boniata, de Miraca, quien a pocas jornadas murió» — la misma noticia por Herrera (Década VI, lib. III, cap. XV), con la OTRA grafía'}
    por_que_importa: >-
      ⭐ Dos grafías independientes del mismo nombre (Bonyata en el traslado del
      AGI, Boniata en Herrera vía Arcaya) y un sitio que sigue vivo: Miraca.
      Es el antropónimo mejor anclado de PARAGUANÁ.
    regla_3: 'contacto. Su pueblo, Miraca, sí está en el mundo precontacto del proyecto; el hombre no'

  - forma: Baracoica
    variantes: [Don Juan Baracoica]
    tipo: cacique con nombre
    genero: 'no consta'
    epoca: 'contacto — c. 1521-1531'
    polity: 'costera insular — «está en las islas»; Zavala lo da de Curazao'
    procedencia: {obra: zavala-reyes-2015, pagina: 'glosario #31 — «Baracoica (HP): Cacique de Curazao»'}
    etiqueta: atestiguado
    segmentacion: 'bara- + -coica (no resuelta; cf. -koa)'
    formantes: ['-ika']
    apoyos:
      - {obra: arcaya-1920, pagina: '160', que: 'carta de Ampíes: «acordaron de me enviar un cacique que se dice D. Juan Baracoica, que está en las islas y es su pariente y deudo»'}
      - {obra: arcaya-1920, pagina: '199', que: '«otro llamado Don Juan Baracoica, hijo del mismo Manaure»'}
    por_que_importa: >-
      ⭐ El glosario de Zavala y el primario de Ampíes coinciden en persona,
      nombre y función: emisario de Manaure hacia las islas. `bara` «palo,
      árbol» es voz atestiguada del lexicón, así que la primera mitad no es
      opaca.
    regla_3: contacto

  - forma: Barbo
    tipo: cacique con nombre
    genero: 'no consta'
    epoca: 'contacto/colonial temprano — 1538'
    polity: 'costera — «de Goyabaco (Guaibacoa?)», Distrito Colina, Falcón'
    procedencia: {obra: arcaya-1920, pagina: '220'}
    cita: '«…y Barbo de Goyabaco (Guaibacoa?)» — de la lista de caciques que Federmann se llevó, por Herrera'
    etiqueta: atestiguado
    reserva: >-
      El mismo pasaje en el traslado del AGI que transmite Velasco dice «llevo
      otro Cacique en cadenas q se dize verbo y su pueblo Gorybacoa», con el
      nombre marcado como lectura dudosa. `Barbo` (Herrera) y `verbo` (el
      traslado) son la misma palabra mal leída dos veces: la forma no es firme.
    regla_3: contacto

  - forma: Tumarure
    variantes: [Tumarusa]
    tipo: apellido vivo
    genero: 'no consta'
    epoca: 'tradición oral y s. XIX-XX (aldea del municipio Moruy; censo de 1881: 6 casas, 39 vecinos)'
    polity: 'costera — Paraguaná, municipio Moruy'
    procedencia: {obra: esteves-1989, pagina: '64'}
    cita: >-
      «Se nos ha informado que Tumarure era el apellido de un cacique. La grafía
      es dudosa: el historiador P. M. Arcaya, quien manejó documentos de primera
      mano, siempre escribió Tumarure, pero el pueblo ya se ha acostumbrado con
      Tumarusa.»
    etiqueta: 'retro-abstraido (apellido de cacique según informante; el sitio es lo documentado)'
    segmentacion: 'tuma- + -rure (no resuelta)'
    formantes: ['-ure']
    apoyos:
      - {obra: zavala-reyes-2015, pagina: 'glosario — «tumarure: Apellido de un cacique»'}
    nota: >-
      Grep verificado: Arcaya 1920 NO trae Tumarure en ninguna de sus 520 KB de
      texto. La atribución de Esteves («Arcaya siempre escribió Tumarure») no se
      puede comprobar con la obra que el repo tiene.

  - forma: Cumare
    tipo: cacique con nombre
    genero: 'no consta'
    epoca: 'tradición recogida en el s. XX'
    polity: 'costera oriental — Cumarebo, Falcón'
    procedencia: {obra: zavala-reyes-2015, pagina: 'glosario — «cumarebo: Camino del cacique Cumare»'}
    etiqueta: 'retro-abstraido (el nombre se deduce de la glosa del topónimo)'
    apoyos:
      - {obra: esteves-1989, pagina: '(índice, entrada Cumarebo)', que: '«Cumarebo significa: el camino del cacique Cumare»'}
    nota: 'topónimo que devuelve antropónimo, el patrón inverso de Manaure. Ver patrones.'

  - forma: Mauroa
    tipo: cacique con nombre
    genero: 'no consta'
    epoca: 'tradición recogida en el s. XX'
    polity: 'costera occidental — Distrito Mauroa, Falcón'
    procedencia: {obra: esteves-1989, pagina: '122'}
    cita: '«(Mauroa: apellido de un cacique)»'
    etiqueta: retro-abstraido
    formantes: ['-oa']

  - forma: Borobo
    variantes: [Borobó, Borojó]
    tipo: leyenda
    genero: 'no consta'
    epoca: 'tradición oral (barrido web 2026-09-10)'
    polity: 'costera occidental — Borojó, Distrito Buchivacoa'
    procedencia: null
    deuda: sin-procedencia
    etiqueta: hipotetico
    cita: '«del cacique BOROBO que existió en el lugar» — una de tres etimologías en circulación para Borojó'

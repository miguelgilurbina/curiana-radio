# ══════════════════════════════════════════════════════════════════
# 2. LOS FORMANTES
# ══════════════════════════════════════════════════════════════════
# `recurrencia` = cuántas formas DISTINTAS de la lista de arriba lo llevan.
# Lo recuenta 6-fusion/scripts/medir_antroponimos.py.
formantes:

  - formante: '-aure'
    recurrencia: 7
    ejemplos: [Adaure, Timaure, Yaraure, Chunaure, Manaure, Anaure, Naure]
    glosa_de_fuente: 'ninguna — Esteves lo declara SERIE («los apellidos de la gran familia caquetía») sin decir qué significa'
    etiqueta: atestiguado
    que_dice_el_canon_de_toponimos: >-
      `2-lengua/morfemas.yaml` NO lo tiene: los once morfemas del canon son
      toponímicos (-bacoa, -are, ada-, bari-, yacare, wa-, -shi/-chi, -ari/-ri,
      -kuri/-curi, -bari, -ana). `-aure` es de nombre de PERSONA y entra aquí
      por primera vez. En `toponimos.yaml` hay `adaure` (toponimo-080) y
      `chunare` (toponimo-025, nivel C, «el único antropónimo del corpus con
      glosa descriptiva», sin procedencia).
    lectura_abierta: >-
      Que -aure sea el `naure` «jojoto / planta bejucosa» del lexicón (X + naure)
      es lectura del proyecto, no de Esteves: `hipotetico`, NO aplicada. La nota
      de 4-fuentes/esteves-1989.md ya avisa: «No lo apliques a Manaure todavía».
    productivo_en_la_era_2: true

  - formante: '-ure'
    recurrencia: 8
    ejemplos: [Adaure, Timaure, Yaraure, Chunaure, Manaure, Anaure, Naure, Tumarure]
    glosa_de_fuente: ninguna
    etiqueta: atestiguado
    nota: >-
      Superconjunto de -aure. Se declara aparte porque Tumarure no tiene la `a`
      y porque el lexicón trae `ure` como voz suelta, v_raiz «raíz»
      (caquetío-atestiguado), y `maure` «fibra de algodón, hilo para tejer»,
      que es una palabra común con esta misma cola.
    que_dice_el_canon_de_toponimos: >-
      la familia -are/-ure es densa en la toponimia (morfema-002 `-are`, 5
      apoyos; abudure, dabudare, araure, capadare, botucare, camare). El canon
      declara `-are` locativo; para -ure de persona no dice nada.
    productivo_en_la_era_2: true

  - formante: '-koa'
    recurrencia: 1
    ejemplos: [uriakoa]
    glosa_de_fuente: 'ninguna directa; por la vía de `bakoa` «bosque, lugar, paraje, sitio fértil» (caquetío-atestiguado)'
    etiqueta: 'reconstruido (la glosa «sitio de»); atestiguado (la forma)'
    recurrencia_medida_aparte: >-
      ⚠️ En NOMBRE DE PERSONA la recurrencia es 1: sólo Uriacoa. Lo que tiene
      cuatro-cinco apoyos es el `-bacoa` TOPONÍMICO (morfema-001), y el pueblo
      del cacique «Barbo/verbo» se llama Gorybacoa ~ Goyabaco ~ Guaibacoa: es
      lugar, no persona. Se declara productivo por la fuerza del morfema
      toponímico y la transparencia de Uriacoa, no por su recurrencia
      antroponímica, que es de una sola forma.
    que_dice_el_canon_de_toponimos: >-
      ⭐ Es el morfema mejor sostenido del canon: `morfema-001` `-bacoa`, con
      cuatro-cinco apoyos (adabacoa, guadabacoa, yacarebacoa, quibacoas,
      sazaribacoa) y ahora un primario de 1538 (Gorybacoa, velasco_primarios).
      Y `REGLAS_TOPONIMICAS` del motor ya lo enseña (motor_era2.afijos).
    por_que_vale_para_personas: >-
      Uriacoa = `uria` «plantío, siembra» + -koa. Es el único antropónimo de la
      esfera costera que se segmenta entero con voces del lexicón. Sirve de
      plantilla: raíz de cosa/lugar + -koa = «el/la del sitio de X».
    productivo_en_la_era_2: true

  - formante: '-ata'
    recurrencia: 4
    ejemplos: [Bonyata, Boniata, quiciroata, quiceromata]
    glosa_de_fuente: ninguna
    etiqueta: atestiguado
    aviso_de_recuento: >-
      ⚠️ Cuatro FORMAS, tres NOMBRES: Bonyata y Boniata son las dos grafías del
      mismo cacique de Miraca. El script cuenta formas, no personas.
    que_dice_el_canon_de_toponimos: >-
      no está en morfemas.yaml. En el lexicón hay tres voces atestiguadas con
      esta cola (`ikoroata` «caraota», `kiboata` y `kidiboata` «engañar»,
      `yapamata` «siembra, plantío»), así que la forma es caquetía aunque el
      valor no esté anotado.
    reserva_regla_4: >-
      Dos de las tres recurrencias son de BARQUISIMETO (quiciroata,
      quiceromata). La única costera es Bonyata, de Miraca — pero es la mejor:
      primario de 1538 y dos grafías independientes.
    productivo_en_la_era_2: true

  - formante: '-bana'
    recurrencia: 2
    ejemplos: [Yarosabana, Judibana]
    glosa_de_fuente: '«cerro, sitio alto» (Esteves, seis apoyos; D9 resuelta 2026-08-31)'
    etiqueta: 'atestiguado (el morfema); reconstruido (que vaya en nombre de persona)'
    que_dice_el_canon_de_toponimos: >-
      D9 lo resolvió con seis apoyos: Capuhana, Carirubana, Coabana, Cujíbano,
      Chichibana, Judibana. Es morfema TOPONÍMICO. El motor lo enseña en
      REGLAS_LOCATIVAS.
    reserva: >-
      🔴 Las dos recurrencias tienen problema: Yarosabana es del YARACUY (regla
      4) y Judibana es leyenda sin documento. El formante es firme como
      toponímico y débil como antroponímico.
    productivo_en_la_era_2: false
    por_que_no: >-
      Se CONSERVA en los dos nombres de la era 1 que ya lo llevan (Kunaro-bana,
      Dara-bana) y no se acuña ninguno nuevo: meter el morfema del cerro en más
      nombres de persona sería importar la toponimia a la antroponimia por la
      puerta de atrás.

  - formante: '-ika'
    recurrencia: 1
    ejemplos: [Baracoica]
    glosa_de_fuente: ninguna
    etiqueta: atestiguado
    que_dice_el_canon_de_toponimos: 'nada. Puede ser -koa con metátesis o con la `i` del escribano.'
    productivo_en_la_era_2: false
    por_que_no: 'un solo caso y sin segunda grafía: no se generaliza (regla 2, en duda degradar).'

  - formante: '-allo'
    recurrencia: 1
    ejemplos: [Caguallo]
    glosa_de_fuente: ninguna
    etiqueta: 'atestiguado (la forma escrita); hipotetico (que sea caquetío y no del escribano)'
    que_dice_el_canon_de_toponimos: 'nada; ningún topónimo del canon lleva <ll>.'
    productivo_en_la_era_2: false
    por_que_no: >-
      🔴 <ll> es dígrafo castellano. curiana_fonotactica.py avisa que el
      conjunto «atestiguado» tiene residuo castellano y que `caquetillo` mete
      `ll` en el inventario y ensancha el filtro. Acuñar nombres en -allo sería
      acuñar castellano con acento colonial.

  - formante: '-oa'
    recurrencia: 3
    ejemplos: [Mauroa, quiceroaboa, uriakoa]
    glosa_de_fuente: ninguna
    etiqueta: reconstruido
    que_dice_el_canon_de_toponimos: 'cf. `acaboa`, `duraboa`, `bakoa`, `wakoa` en el lexicón; probable variante de -koa/-boa.'
    productivo_en_la_era_2: false
    por_que_no: 'se subsume en -koa, que está mejor sostenido.'

# ══════════════════════════════════════════════════════════════════
# 3. LOS PATRONES — qué se puede decir con honestidad
# ══════════════════════════════════════════════════════════════════
patrones:

  - id: patron-transparencia
    afirmacion: >-
      Los antropónimos caquetíos son TRANSPARENTES: están hechos de material
      léxico con significado, no de formas opacas reservadas a los nombres.
    evidencia:
      - 'uriakoa = uria «plantío» + -koa'
      - 'quiquiba, glosado «nombre propio indígena», se descompone qui~quiba «piedras»'
      - 'Baracoica lleva `bara` «palo, árbol»'
      - 'Naure ES una voz del lexicón'
      - 'Chunaure trae su glosa dentro: «naure es jojoto»'
      - 'Yarosabana lleva -bana «cerro»'
    etiqueta: reconstruido
    procedencia: {obra: zavala-reyes-2015, pagina: 'glosario, entradas de antropónimo'}
    nota: 'ya enunciado como regla en 6-fusion/velasco_primarios_agi.yaml §principio_general. Esta campaña lo confirma sobre 40 formas.'

  - id: patron-titulo-como-nombre
    afirmacion: >-
      El título funciona como nombre: los cronistas escriben «el Manaure» y
      «Manaure» indistintamente, y el título acaba siendo apellido de familia
      viva.
    evidencia:
      - 'Antolínez 1944: «los cronistas nos hablan de EL Manaure … no es nombre propio de varón sino el nombre de una jerarquía política»'
      - 'Oviedo y Baños: «venía (cargado en hombros de caciques) el Manaure»'
      - 'Esteves p. 13 pone Manaure en la lista de APELLIDOS de la gran familia caquetía'
      - 'dos informantes de Esteves se apellidan Manaure (Don Jesús Manaure Pulgar, de Misaray; Don Miguel Manaure, de El Vínculo)'
    etiqueta: atestiguado
    procedencia: {obra: antolinez-1944-manaure, pagina: 'vía moron-2012-petroglifos'}
    consecuencia_para_la_era_2: 'Manaure se conserva como nombre del señor. Los otros tres títulos (diao, apopo, boratio) se usan como CARGO, no como nombre.'

  - id: patron-nombre-y-topónimo
    afirmacion: >-
      Nombre de persona y nombre de lugar circulan en los dos sentidos: el
      cacique da nombre al sitio y el sitio da nombre a la familia.
    evidencia:
      - 'Cumarebo = «el camino del cacique Cumare» (persona → lugar)'
      - 'Mauroa y Tumarure, «apellido de un cacique», son hoy Distrito y aldea (persona → lugar)'
      - 'Adaure y Chunaure son a la vez apellido y sitio'
      - 'Uriacoa: los descendientes «usaron como apellido el nombre del célebre caudillo» (Arcaya p. 327)'
      - 'Judibana y Jayana: la tradición resuelve el topónimo opaco con una princesa (lugar → persona, inventada)'
    etiqueta: atestiguado
    procedencia: {obra: esteves-1989, pagina: '64, 122'}
    consecuencia_para_la_era_2: >-
      🔴 Por eso la unicidad del elenco EXCLUYE los topónimos del canon: si un
      nombre de agente coincide con una `forma` de toponimos.yaml, el lector no
      puede saber si el texto habla de la persona o del sitio. La excepción son
      los antropónimos ya declarados como tales (clase `antropónimo` en
      toponimos.yaml).

  - id: patron-sin-genero
    afirmacion: >-
      Ninguna fuente marca el género en el nombre caquetío, y no hay un solo
      nombre de mujer caquetía documentado.
    evidencia:
      - 'cero verificado (meta.ceros_verificados, dos patrones distintos)'
      - 'la única mujer de la esfera con nombre en fuente escrita es Doña Sancha, y su nombre es castellano'
      - 'los tres nombres femeninos que circulan (Judibana, Jayana, Yanara) son tradición oral sin documento'
    etiqueta: 'atestiguado (el cero); reconstruido (la conclusión)'
    consecuencia_para_la_era_2: >-
      Los sufijos -ko «hombre de» y -sha «mujer de» se retiran de los nombres Y
      de la gramática que el prompt enseña (decisión de Miguel, 2026-09-14). El
      género vive en el campo `genero` de la ficha.

  - id: patron-apellido-en-aure
    afirmacion: >-
      Hay una serie morfológica real de nombres de familia en -aure, viva en
      Paraguaná y reconocida como caquetía por dos autores independientes.
    evidencia:
      - 'Esteves p. 13: «algunos de los apellidos de la gran familia caquetía: Adaure, Timaure, Yaraure, Chunaure, Manaure»'
      - 'Medina Colina p. 328 (mc-mundo-029), un paraguanero hablando de lo suyo, repite Manaure y Timaure y añade Adaure y Chunaure como topónimos'
      - 'Zavala registra `timaure` «Apellido» y `tumarure` «Apellido de un cacique» sueltos'
      - 'y el contacto da la forma desnuda: Naure ~ Anaure (Ampíes vía Arcaya p. 160)'
    etiqueta: atestiguado
    procedencia: {obra: esteves-1989, pagina: '13'}
    consecuencia_para_la_era_2: '-aure y -ure son los dos formantes productivos de nombre de persona.'

  - id: patron-cero-precontacto
    afirmacion: >-
      No hay ni un solo antropónimo caquetío anterior al contacto. Todo el
      registro empieza con Ampíes (1521-1527) y Bastidas (1538).
    evidencia:
      - 'la fuente más antigua con nombre de persona es la carta de Ampíes al Rey (Arcaya p. 160)'
      - 'los diez nombres indígenas del s. XVI son de la generación que negoció o resistió la conquista'
      - 'lo demás es apellido del s. XX o tradición oral'
    etiqueta: 'atestiguado (el cero)'
    consecuencia_para_la_era_2: >-
      🔴 REGLA 3. Los nombres reales atestiguados (Uriacoa, Caguallo, Bonyata,
      Baracoica, Naure, Barbo) son de personas del CONTACTO. Ponérselos a un
      agente del s. XV es proyectar un dato colonial sobre el mundo
      precontacto. Por eso el sistema de nombres los declara REUTILIZABLES pero
      RESERVADOS, y construye los 63 con raíces del lexicón, que sí son voces
      de la lengua y no personas fechadas.

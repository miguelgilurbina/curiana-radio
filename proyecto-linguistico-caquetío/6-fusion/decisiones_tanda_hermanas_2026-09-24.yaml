# Decisiones de Miguel para la TANDA DE LAS HERMANAS (2026-09-24)
#
# Tres propuestas quedaron abiertas en la rama campana/kalinago-mujeres (#234):
#   · 6-fusion/kalinago_mujeres_2026-09-23.yaml          (D1-D5)
#   · 6-fusion/nucleo_fundacional_hermanas_2026-09-24.yaml (N1 y las 36 voces)
#   · 6-fusion/taino_tradicion_viva_2026-09-24.yaml      (T1-T5, con T2b)
# El escriba le resumió lo que faltaba («Vale, me parece. Que nos falta?») y
# su respuesta cubre las tres de una vez:
#
#   «Acepto todo lo recomendado»
#
# Entra en UN corte antes de la corrida base, como la tanda final: se aplica,
# se mide contra main (prompt, pre-vuelo, guardianes y, con Docker, el
# control y el uso histórico) y sólo entonces se mergea.

meta:
  estado: 'APLICADA (2026-09-24) en la rama tanda/hermanas-2026-09-24, SIN MERGEAR — queda la medición con la base (Docker) y el ok de Miguel; 0 decisiones de la tanda por aplicar salvo T5 (después de la corrida)'
  aplicado_por:
    - 6-fusion/scripts/aplicar_tanda_hermanas.py            # el lexicón: archivo, voces nuevas, capas, T4, claves lokono
    - curiana_sim/minar_a2_swadesh.py --generar-modulo       # ada/hime a COLISIONES_A2
    - 6-fusion/scripts/generar_lexicon_achagua.py            # uni/unia → -achagua
    - curiana_sim/minar_zavala_glosario.py --generar-modulo  # T2 komoho y T4 (SIG_CURADO, NOTA_ANADIDA)
    - curiana_sim/migrar_toponimos.py                        # T2b
    - 6-fusion/scripts/consolidar_taino.py                   # T3
    - 'a mano, en el mismo corte: plantillas, koiné, cronista, corpus (D4 y tres palabra_lexicon), sitios/clima, pre-vuelo y tests'
  medido_en: '6-fusion/medicion_tanda_hermanas_2026-09-24.yaml (6-fusion/scripts/medir_tanda_hermanas.py; sin la base: control y score pendientes)'

th.0_el_paquete:
  decision_literal: '«Acepto todo lo recomendado»'
  lectura: >-
    Acepta la opción recomendada en cada casilla de las tres propuestas. Donde
    dos recomendaciones se tocan, manda la posterior y más general, y se
    declara aquí (th.2: N1 decide la etiqueta de las ocho voces de #234).

th.1_D1_el_kalinago_como_hermana:
  eleccion: 'A — el habla de mujeres kalinago cuenta como cuarta hermana para el criterio (a) de D11'
  aplica: >-
    `bui`, `lihi` y `tuhu` pasan de caquetío-hipotético a caquetío-reconstruido
    (lokono y kalinago de mujeres con la misma forma: Goeje p. 24; Adam p.
    277). Las formas no cambian. `dai` sigue reconstruido; su nota añade que el
    kalinago de mujeres y el achagua dicen n-, no d-.
  fuente: 6-fusion/kalinago_mujeres_2026-09-23.yaml §pronombres_y_gramatica.decision_d1

th.2_D2_las_ocho_voces_del_wayuu:
  eleccion: 'la recomendada en cada una: anasa→saika (A), mütsia→uli (B), kasuta→halira (A), sünatü→kule (A), outa→huda (A), kataa→kake (A), talata→halikebe (A), jashichi→aiima (C)'
  la_etiqueta: >-
    #234 las escribió todas hipotéticas (la regla de tf.5). N1, aceptada en el
    mismo paquete y escrita después, pone la frontera en «dos hermanas con la
    misma forma o con la correspondencia regular declarada». Dos de las ocho
    la cruzan y entran RECONSTRUIDAS: `kake` (kalinago de mujeres kakê =
    lokono kake, Goeje p. 79, la misma forma) y `huda` (lokono huda =
    kalinago hila por d = l, Adam pp. 288-289). Las otras seis son
    hipotéticas: la raíz se parece pero la forma no coincide (uli/uele,
    halira/alu, aiima/iam, saika/sa-, kule/quirra) o hay una sola hermana
    (halikebe).
  archivo: las ocho viejas van a FUERA_DEL_HABLA con su capa intacta
  renombre: 'la clave lokono `huda` pasa a `huda-lokono` (precedente kuba-lokono, tuhu-lokono)'
  fuente: 6-fusion/kalinago_mujeres_2026-09-23.yaml §las_ocho_voces_del_wayuu

th.3_D3_alaain_y_japu:
  eleccion: '`alaain` al archivo sin sustituta; `japü` al archivo y entra `aburi` ''tener vergüenza'''
  aburi: >-
    reconstruida: kalinago de mujeres aburi = lokono (h)aburi (Goeje p. 74,
    visto en imagen). Encontrado al aplicar, y declarado en su nota: `aburi`
    ya es una grafía del glosario de Zavala, como TOPÓNIMO («Para designar
    las aguas de un río lleno de arena», lexicon_zavala.TOPONIMOS_ZAVALA),
    fuera del habla y fuera de 2-lengua/toponimos.yaml. No choca en
    VOCABULARIO_BASE; es un homógrafo con un nombre de lugar, como los 52 del
    elenco.
  fuente: 6-fusion/kalinago_mujeres_2026-09-23.yaml §las_ocho_voces_del_wayuu.las_dos_hipoteticas_con_la_misma_etiqueta

th.4_D4_el_mundo:
  eleccion: 'transmision-035 entra en 3-mundo/corpus/transmision.yaml: el habla de mujeres kalinago, hecho kalinago, NO proyectado a las caquetías'
  fuente: 6-fusion/kalinago_mujeres_2026-09-23.yaml §mundo

th.5_D5_breton:
  eleccion: 'ya resuelto el 2026-09-23 («Te dejo descargarlo»): los tres libros están en fuentes_caquetios/; su minería queda para después de la corrida'

th.6_N1_la_etiqueta:
  eleccion: 'A — dos hermanas con la misma forma (o correspondencia regular declarada) = caquetío-reconstruido y sale en la muestra; una hermana = caquetío-hipotético y llega sólo por plantilla'
  reconstruidas: [ani, aeke, ati, dunku, aita, isi, akusi, kibe, ada, uni, unia, butu]
  suben_a_reconstruidas: [diki, marisi]
  fuente: 6-fusion/nucleo_fundacional_hermanas_2026-09-24.yaml §decision_n1_la_etiqueta

th.7_N2_las_36_voces:
  eleccion: 'A en las 36'
  grupo_1_archivo_sin_nueva: 'kono (jusual), sima (kidi), nomi (ateri), wari (iero), arua (ako), buri (dare)'
  grupo_2_dos_hermanas: 'chaa→ani, masa→aeke, awa→ati, suna→dunku, panaa→aita, kabo→isi, nii→akusi, wara→kibe, kuru→ada, duna→uni, kaya→unia, taa→butu'
  grupo_3_una_hermana: 'naa→kunu, waa→sile, raka→hiti, rua→kudu, amana→hikihi, arima→hime, dali→wunabu, baba→iti, ka→badia, mara→ika, saa→bena, naka→kia'
  grupo_4_se_quedan: 'kaa, maa (achagua Numau), suka (lokono ca-saccu-da), ama, bari, puna — todas a caquetío-hipotético'
  renombres: >-
    claves de comparanda que el núcleo nuevo ocupa: lokono `kia` y `wunabu`
    (curiana_lexicon) → `kia-lokono`, `wunabu-lokono`; achagua `uni` y `unia`
    (lexicon_achagua, generado) → `uni-achagua`, `unia-achagua`. Las lokono
    `ada` y `hime` de la Tabla A-2 (lexicon_a2, generado) NO se renombran:
    la disciplina de ese módulo es declarar la colisión, y pasan a
    COLISIONES_A2 como `siba` u `oni`.
  fuente: 6-fusion/nucleo_fundacional_hermanas_2026-09-24.yaml §grupos

th.8_T1_la_tradicion_viva_taina:
  eleccion: 'A — cuenta como dato taíno con su propia etiqueta, separada de la del cronista; lo conjeturado sigue fuera'
  aplica: >-
    en la lista maestra la tradición viva ya va aparte (clase ii, sin cronista)
    y lo conjeturado en la iii; lo que T1 cambia es que la clase ii CUENTA como
    dato en los cruces, y el cruce que lo usa es T11, que se vuelve a correr
    después de la corrida (T5). No se renombra la clase: ii también trae
    voces de Brinton o Bachiller sin cronista que no son tradición viva, y
    llamarlas así sería afirmar de más.
  fuente: 6-fusion/taino_tradicion_viva_2026-09-24.yaml §decisiones

th.9_T2_komoho:
  eleccion: 'sí — Oviedo pp. 313-315 como segunda atestación, y la glosa se precisa como ''fruto del cardón de las tunas (higo de tuna)'''
  matiz: >-
    la propuesta añadía «también el cardón»; el borrador que Miguel leyó no, y
    Oviedo tampoco lo sostiene: «la qual … se llama comoho» es la FRUTA. Se
    aplica la glosa del borrador. Va por SIG_CURADO en minar_zavala_glosario.py

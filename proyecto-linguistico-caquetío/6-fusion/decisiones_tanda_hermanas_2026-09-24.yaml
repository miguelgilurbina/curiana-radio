# ══════════════════════════════════════════════════════════════════════
# LO QUE APARECIÓ AL APLICAR — declarado, y lo que queda para Miguel
# ══════════════════════════════════════════════════════════════════════
lo_que_aparecio_al_aplicar:
  los_generadores_no_eran_reproducibles:
    que: >-
      Antes de tocar nada se regeneraron los tres módulos generados que el
      motor importa, para comprobar que salían iguales. Dos no:
      generar_lexicon_achagua.py comparaba contra un lexicón que YA llevaba su
      propia comparanda y renombraba las 3.569 claves con `-achagua`; y
      minar_a2_swadesh.py dejaba entrar el paraujano `pia` 'tú' porque el
      `pia` caquetío se archivó en la tanda final y el archivo no contaba
      como ocupado.
    arreglo: >-
      los dos generadores excluyen lo propio por IDENTIDAD de la entrada (no
      por clave) y cuentan FUERA_DEL_HABLA como ocupado; el de Zavala también
      (ver `baja`). Una voz archivada sigue siendo canon y ninguna comparanda
      puede capturarla. Con el arreglo, A-2 y Zavala salen idénticos a lo
      commiteado antes de la tanda.
    deriva_que_entra_en_esta_tanda: >-
      el achagua sí cambia fuera de lo decidido en dos claves que llevaban
      chocando en silencio desde después de su fusión (2026-09-13): `maba`
      'cera' (con `maba` 'panal', retroabstraída de Medina) y `debe`
      'medicina' (palabra castellana de ES_STOPWORDS). Pasan a
      `maba-achagua` y `debe-achagua`. En el habla no cambia nada: la voz
      caquetía y el castellano ya ganaban por setdefault.
  baja_cano_para_miguel:
    que: >-
      Zavala #23 «Baja (baba)» 'caño' (sigla E) nunca entró al habla porque el
      minador la daba por «ya está»: casaba por grafía con `baba` 'padre', una
      voz DISTINTA. Al archivar `baba` se destapaba y entraba como
      caquetío-atestiguado. No entra en esta tanda: el minador cuenta ahora
      lo archivado como existente y el estado queda como estaba.
    pregunta: >-
      ¿entra `baja` 'caño' al habla? Su única fuente es Esteves (la sigla E,
      cc.4 → B), así que entraría HIPOTÉTICA por la regla de cc.4. Y su
      variante «baba» es homógrafa del `baba` archivado.
  aburi_toponimo: >-
    `aburi` 'tener vergüenza' es homógrafo del topónimo de Zavala «aburi»
    ('aguas de un río lleno de arena'). Va a NO_ES_LA_MISMA_VOZ en
    minar_zavala_glosario.py; sin esa fila, la regeneración sacaba el
    topónimo de TOPONIMOS_ZAVALA.
  las_seis_hipoteticas_de_d2_en_la_breve: >-
    N1 dice que lo hipotético llega por las plantillas que enseñaban la voz
    vieja; las ocho de D2 no las enseñaba ninguna (llegaban por la muestra).
    Aplicada al pie de la letra, `saika`, `uli`, `halira`, `kule`, `halikebe`
    y `aiima` no las vería nadie en el perfil era2, y #234 contaba con que
    «en la corrida base se dirán las nuevas desde el día 1». Se enseñan en la
    línea VOCES de la plantilla breve, como hizo la tanda final con `ruku`,
    `kasalini` y `mautia`, y en la completa. `huda` y `kake` son
    reconstruidas y salen en la muestra. Si Miguel prefiere que no, se quitan
    de la línea: es una edición de la plantilla.
  dos_glosas_mas_estrechas: >-
    `badia` hereda de `ka` 'y, también, además' pero NO el 'con' (lokono
    BADDIA 'y, también', Perea p. 538, no da 'con'), y `bena` hereda de `saa`
    'cuando' pero NO el 'si' condicional (lokono BENNA 'cuando', p. 504). En
    duda, degradar: el agente pierde 'con' y 'si' como voz propia. El ejemplo
    de la completa se rehízo sin ellos («kia dai badia kunu-ba», 'después yo
    también voy').
  cuatro_nombres_del_elenco_sobre_raiz_archivada: >-
    Dunakoa (duna), Ruata (rua), Simaure (sima) y Talata (talata). Los
    nombres se quedan —el canon del elenco no se reescribe, y es el criterio
    de la sigla E: «el agente no cambia, la voz sí»—; el test de la regla a de
    los nombres exige ahora que esas cuatro raíces estén ARCHIVADAS por esta
    tanda. Si Miguel quiere renombrarlos, es otra decisión.
  el_mundo_apuntaba_a_las_voces_viejas: >-
    sitios_era2.yaml y clima_era2.yaml nombraban la voz caquetía de cada cosa
    con `voz_caquetia: {clave, capa}`, y el bloque [Tu tierra] decía «Lo decís
    duna.» / «Lo decís arima.»: el pre-vuelo lo encontró en 14-20 de 126
    prompts. Se repuntaron a la sustituta con su capa de hoy (duna→uni,
    kaya→unia, arima→hime, amana→hikihi, kuru→ada, kono→jusual) y marisi sube
    a reconstruida; las hipotéticas no se dicen en [Tu tierra] con el perfil
    era2, que es la regla de siempre. Y 3-mundo/corpus/ecologia.yaml: tres
    `palabra_lexicon` (kaya, arima, kuru) repuntadas igual.
    verificar_sitios_era2.py daba 22 fallos y NO está entre los guardianes:
    ahora está en verde.
  la_semilla_derivada_se_quedaba_corta: >-
    Buriche (oficio: el fermento) sólo dispara el campo «cuerpo», y ese campo
    se quedó con una voz sembrable (`bari` bajó a hipotética, `sünatü` se
    archivó): arrancaba con 3 formas y el mínimo son 5. formas_derivadas() se
    completa ahora con el caquetío sembrable entero cuando el oficio agota sus
    campos, como ya hacía con quien no dispara ninguno. La era 1 no cambia.
    Y la semilla cambia en 62 de 63 agentes: el sorteo determinista cae sobre
    otro conjunto de voces (medido).
  ejemplos_de_regla_con_voces_archivadas: >-
    -bana (sima-bana, kuru-bana), -bakoa (kuru-bakoa), -aima (arima-aima) y
    el aspecto (naa-kuba, naa-ba) pasan a kidi/ada/hime/kunu. `ada-bakoa`
    devuelve el ejemplo a la raíz del topónimo que la morfema-001 cita
    (Adabacoa 'todo arboleda'): d21.14 lo había quitado sólo porque `ada` era
    lokono. Que no se haya dicho nunca en la base queda POR MEDIR.


# ══════════════════════════════════════════════════════════════════════
# 4. EL MUNDO — el habla de las mujeres como hecho kalinago
# ══════════════════════════════════════════════════════════════════════
mundo:
  propuesta_para_3-mundo/corpus/transmision.yaml:
    id: transmision-035
    contenido: >-
      Entre los kalinago de las Antillas Menores (s. XVII) había dos maneras de
      hablar: las mujeres usaban entre ellas unas cuatrocientas palabras y
      unos prefijos que los hombres entendían pero no decían, y esa habla de
      mujeres era la arahuaca. Adam atribuye que la gramática de las mujeres
      pesara más a que eran ellas quienes criaban a los niños de los dos sexos
      hasta los nueve o diez años.
    fuente: atestiguado
    procedencia: {obra: adam-1879}
    referencia: 'Adam 1879 pp. 275-277 y 301 (que cita a Labat y a Breton)'
    dominios: [transmision, genero, comparanda_kalinago]
    restringido: false
    matiz_obligatorio: >-
      El relato de la conquista (los caribes mataron a los hombres y tomaron a
      las mujeres) es el de los informantes de Breton y hoy está discutido:
      ver parentesco-032 y la nota de 4-fuentes/adam-1879.md. Lo que se
      documenta es el doble registro, no la conquista.
    implicacion_simulacion: >-
      Ninguna directa: es un hecho kalinago y NO se proyecta a las caquetías
      (no hay dato de un habla de mujeres caquetía). Sirve de comparanda si
      alguna vez se pregunta por qué la gramática arahuaca es la de las madres.
  lo_que_no_se_propone: >-
    un habla de mujeres caquetía, o que las agentes mujeres hablen distinto.
    Sería importar un rasgo sin dato (reglas 3 y 4).

# ══════════════════════════════════════════════════════════════════════
# 5. BRETON — la fuente de los 400 pares
# ══════════════════════════════════════════════════════════════════════
breton:
  que_hay: >-
    Internet Archive tiene los tres libros de Breton digitalizados por la John
    Carter Brown Library (dominio público, s. XVII): Dictionaire caraibe-
    françois (1665, PDF 63,5 MB), Dictionaire françois-caraibe (1666, 54,4
    MB — es el que marca hombres/mujeres palabra a palabra, según Adam p. 276)
    y Grammaire caraibe (1667, 23,1 MB). Medido en la API de metadatos de
    archive.org, sin descargar.
  descargado: 'no — hace falta el permiso de Miguel'
  si_cambia_el_nucleo: >-
    Probablemente no. Goeje ya leyó a Breton, y lo que decide el núcleo
    (pronombres, las ocho voces) está en Goeje, Adam, Perea y Neira. Breton
    daría más formas de mujeres para voces nuevas y confirmaría las de aquí.
    Recomendación: bajarlo y archivarlo para después de la corrida, no antes.


# 2. LOS PRONOMBRES Y LA GRAMÁTICA DE LAS MUJERES
# ══════════════════════════════════════════════════════════════════════
pronombres_y_gramatica:
  lo_que_dice_adam:
    prefijos: >-
      p. 277: de los prefijos personales kalinago, tres son sólo de hombres
      (i-, a-, k-), tres sólo de mujeres (n-, b-, oua-) y los demás comunes
      (t-, h-, nh-; l- aparece en los dos). Adam demuestra (pp. 279-280) que los
      de mujeres y los comunes son los del arrouague (lokono: da-, bo-, li-,
      tu-, wa-, hu-, na-) y los de hombres los del galibi.
    pronombres_libres: >-
      pp. 278-279: de mujeres noukoya 'yo' y boukoya 'tú'; comunes likia 'él',
      tokoya 'ella', ouakia 'nosotros', hokoya 'vosotros', nhamkia 'ellos'; de
      hombres ao y amanle, del galibi.
    negacion: 'p. 277: los hombres niegan con el sufijo -pa (galibi); las mujeres con el PREFIJO ma-, m- (arrouague)'
    futuro: 'p. 300: «L''indice du futur caraïbe est -ba» (n-aronc-ou-ba ''dormiré''), tomado del arrouague'
    atributivo: 'pp. 300-301: la partícula ka- (k-açae-ti-na ''tengo una olla''), como el lokono k-aeke-de ''tengo ropa'''
    quien_ensena: >-
      p. 301 (parafraseado): Adam explica que ganara la gramática de las
      mujeres porque ellas criaban solas a los niños de los dos sexos hasta los
      nueve o diez años. Es su explicación; el hecho viene de los misioneros.
  goeje_lo_confirma: 'p. 24: I sing. n(u)- «f»; II b(u)-; III masc. l(i)-, fém. t(u)-; I plur. w(a)-; III nh(a)- — todos de origen am.'
  la_tabla_con_la_cuarta_hermana:
    - casilla: yo
      caquetio: dai
      lokono: da-
      taino: daca
      achagua: nu-
      kalinago_mujeres: n(u)-
      lectura: 'dos contra dos. `dai` se queda (tf.1: lokono + taíno), pero el kalinago NO lo apoya: va con el achagua'
    - casilla: tú
      caquetio: bui
      lokono: bu-
      achagua: 'j- (jia)'
      kalinago_mujeres: b(u)-
      lectura: 'lokono + kalinago de mujeres, igual forma'
    - casilla: él
      caquetio: lihi
      lokono: li-hi
      achagua: 'ri- (ria)'
      kalinago_mujeres: 'l(i)- (común), likia'
      lectura: 'lokono + kalinago, igual forma'
    - casilla: ella, ello
      caquetio: tuhu
      lokono: tu-hu
      achagua: 'ru- (ruya)'
      kalinago_mujeres: 't(u)- (común), tokoya'
      lectura: 'lokono + kalinago, igual forma'
    - casilla: nosotros
      caquetio: waya
      kalinago_mujeres: 'oua- / w(a)-, ouakia'
      lectura: las cuatro
    - casilla: ellos
      caquetio: naya
      kalinago_mujeres: 'nh(a)-, nhamkia'
      lectura: las cuatro
  decision_d1:
    pregunta: '¿cuenta el kalinago (su habla de mujeres, que es la capa arahuaca) como hermana para el criterio (a) de D11?'
    opciones:
      - letra: A
        que: >-
          SÍ, como cuarta hermana. `bui`, `lihi` y `tuhu` pasan de hipotéticos a
          RECONSTRUIDOS (dos hermanas con la misma forma: lokono y kalinago).
          `dai` sigue reconstruido y se escribe en su nota que el kalinago va
          con el achagua. Las formas no cambian: sólo la etiqueta y la cita.
        coste: >-
          el perfil `era2` muestrea la capa reconstruida: las tres pasan a
          poder salir también en la muestra de vocabulario, además de en la
          plantilla (que ya las enseña). Es un cambio del prompt: va en el
          corte, medido.
      - letra: B
        que: 'NO: se cita como apoyo en las notas y las etiquetas se quedan como están'
        coste: '0 en el prompt'
    recomendacion: A
    por_que: >-
      el criterio de Miguel era «desde el lokono, el taíno o el achagua» para
      sacar el wayuu del núcleo; el kalinago de mujeres es arahuaco por
      demostración (Adam pp. 279-280, Goeje p. 24) y cumple el fin. Pero
      amplía la lista que Miguel nombró: por eso es pregunta y no aplicación.
  el_aspecto_no_cambia: >-
    -kuba (Goeje p. 26: «Parfait … 2 -kuba») y -ba (Adam p. 300; Goeje p. 26)
    ganan un testigo más, pero el aspecto sigue HIPOTÉTICO por la regla de las
    formas cortas sin paradigma (D11 fase 3). Sólo se anota en las notas.
  apoyos_que_se_anotan_sin_cambiar_nada:
    - 'ma- privativo: la negación de las mujeres kalinago es ma- (Adam p. 277)'
    - 'ka- atributivo: Adam pp. 300-301'
    - '-ba futuro y -kuba perfecto: Adam p. 300, Goeje p. 26'
  lo_que_no_se_propone: >-
    el causativo -keta (Adam p. 301, lokono -kitti): gramática nueva sin
    ningún dato caquetío. Se deja escrito por si Miguel lo quiere; no entra.


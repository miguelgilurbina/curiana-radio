# PROPUESTA — el habla de las mujeres kalinago: la cuarta hermana
#
# Miguel, 2026-09-23, antes de la corrida base:
#   «kalinago ya tenemos todo? No sería interesante ver si podemos tener más
#   info sobre todo del lado de mujeres? Tomando en cuenta que comparten Kati y
#   Kazi?»
#   «la idea es que nuestro core sea potente para no tener que hacer más
#   campañas y poder correr el experimento con la mayor cantidad de info
#   posible de las lenguas hermanas. Es que si usan las mismas palabras para el
#   Sol y la Luna podrían compartir más conceptos, obvio no todos pero debe
#   haber una base que compartan. Dale tú mismo esa campaña y lo comentamos»
#
# Regla 5: PROPONE. No toca curiana_sim/, 2-lengua/, 3-mundo/ ni CLAUDE.md.
# Regla 1: toda cifra sale de 6-fusion/medicion_kalinago_mujeres_2026-09-23.yaml,
#   que emite 6-fusion/scripts/medir_kalinago_mujeres.py (`--check` verifica que
#   las de aquí son las de allí).
# Regla 2: una etiqueta por forma; en duda, degradar.
# Regla 3: el kalinago de Breton es del s. XVII y de las Antillas Menores. Nada
#   de aquí es dato caquetío: es FORMA de una hermana, y lo que se diga del
#   habla de las mujeres es un hecho kalinago, no caquetío.
# Borrador legible: issues-pendientes/kalinago-mujeres-2026-09-23.md
# ══════════════════════════════════════════════════════════════════════
meta:
  recogido: '2026-09-23'
  rama: campana/kalinago-mujeres
  estado: sin-fusionar — propuesta con decisiones para Miguel
  escriba: el coordinador de la sesión, en serie (Miguel pidió que no fuera en paralelo)
  obras: adam-1879 · goeje-1939 · perea-alonso-1942 · neira-ribero-1762 · oliver-1989-apendice-a · taino_lista_maestra
  como_se_leyo: >-
    Goeje 1939 con `pdftotext -layout` para localizar y la IMAGEN de la página
    para leer: el OCR rompe la cursiva (las formas) y corre la columna de
    siglas. Adam 1879 por su capa de texto, que es buena (francés de 1879, de
    dominio público). Página impresa en los dos.
  verificado_en_imagen:
    - 'Goeje 1939 pp. 33, 39-40, 53, 54-55 (M5), 57, 59, 64, 79, 86, 116'
  como_leer_a_goeje: >-
    Margen izquierdo: `h` habla de hombres, `f` habla de mujeres; `K` origen
    kalina (caribe continental), `A` arahuaco (= lokono), `am` su vocabulario
    comparado arahuaco-maipure, `—` sin origen hallado. En el cuerpo, `A` es la
    forma lokona y `K` la kalina (M5, `kalinago_goeje_1939.yaml` §meta).

# ══════════════════════════════════════════════════════════════════════
# LO QUE RESULTÓ FALSO AL MEDIRLO
# ══════════════════════════════════════════════════════════════════════
falso_al_medirlo:
  - dicho: '(el escriba, al proponer la campaña) «Adam cuenta unos 400 pares; usamos 2»'
    medido: >-
      Adam CUENTA unos 400 pares (p. 276) pero no los da: los 400 están en el
      Dictionaire françois-caraïbe de Breton (1666), que no está en el repo. Lo
      que Adam sí publica son dos tablas de cotejo: 160 voces galibi (caribe)
      contra el kalinago (110 caen en el habla de hombres, 9 en la de mujeres)
      y 79 voces arahuacas (lokono) contra el kalinago (60 caen en la de
      mujeres, 5 en la de hombres) — pp. 282-290. Esas cifras son de Adam.
  - dicho: '(CLAUDE.md, tf.5) «las voces wayuu que quedaban eran 11»'
    medido: >-
      Quedaban OCHO más en el núcleo reconstruido, las que llegan a los
      agentes: `anasa` 'bueno', `mütsia` 'negro', `kasuta` 'blanco', `sünatü`
      'rojo', `outa` 'muerte', `kataa` 'vida', `talata` 'alegría' y `jashichi`
      'rabia'. Sus propias glosas lo dicen («< anasü Wayunaiki»). La campaña de
      tf.5 buscó la cadena «DEUDA D11» y sus notas dicen «entra en la deuda de
      D11 fase 3»: la búsqueda distinguía mayúsculas. Ver medición §voces.la_lista.
  - dicho: '(Adam p. 304) el taíno `kachi` ''sol'' como tercer testigo del par sol/luna'
    medido: >-
      No es independiente. Goeje (p. 5, parafraseado) avisa de que Adam tomó su
      taíno del vocabulario de Rafinesque-Martius, que mete palabras de un
      diccionario caribe: el `kachi` taíno de Adam puede ser el `kaši` de
      Breton de vuelta. Tampoco lo trae ningún cronista en la lista maestra
      taína. No se cuenta.
  - dicho: '(la nota de `hadalli` en el lexicón) «cognado de cazi caquetío»'
    medido: >-
      Para 'sol' el lokono dice `hadali` (Oliver 1989 Tabla A-2) y el achagua
      `erri` (Neira, pl. 34 der., «acayu erri, alto esta el sol»). El caquetío
      `kasi` sólo tiene pareja formal en el habla de MUJERES kalinago: `kaši`
      (Goeje p. 54, sigla f 1 am 62). La nota de `hadalli` afirma un cognado
      que la forma no enseña; se deja anotado, no se toca aquí.


# 3. LAS OCHO VOCES QUE SEGUÍAN SALIENDO DEL WAYUU
# ══════════════════════════════════════════════════════════════════════
las_ocho_voces_del_wayuu:
  metodo: >-
    el de D11 fase 3 y tf.5: la forma de una hermana TAL CUAL, en grafía
    fonémica; dos hermanas con la misma forma (o con una correspondencia
    regular medida) = la mejor apoyada, pero todo léxico nuevo entra
    HIPOTÉTICO (en duda, degradar). Las cuatro hermanas: lokono, taíno,
    achagua y —si D1 es A— el kalinago de mujeres. La clase: los colores y
    'bueno' como ESTADO (v_estativo, como apo y usera, d21.4); morir, vivir y
    alegrarse como verbo que es también su nombre (dc.3).
  voces:
    - voz: anasa
      glosa: bueno, bien, bello
      hoy: 'reconstruido desde el wayuu anasü'
      opciones:
        - letra: A
          formas: [saika]
          etiqueta: caquetío-hipotético
          derivacion: >-
            achagua «Saica» (Neira, pl. 43d-44i: «Saicauní, Bueno está»,
            «Saicay, Buena casa» y otras del mismo pliego); en el lokono la
            segmentación de Perea aísla SA en la palabra que traduce BIEN (p.
            499, «Ú-SA-NÚ-wai … has hecho BIEN»). Dos hermanas en la raíz, la
            forma de una.
          coste_medido:
            usos_de_la_voz_vieja_que_dejan_de_contar: 122
            usos_como_nucleo_de_otra_forma: 53
            respuestas_que_la_dicen: 220
            formas_de_la_base_a_raiz_de_ninguna_parte: 3
            colisiones_de_la_nueva: {saika: 0}
        - letra: B
          formas: [saino]
          etiqueta: caquetío-hipotético
          derivacion: >-
            taíno «taíno/saino» 'bueno' (Chanca, 1494; lista maestra, clase
            i); la misma raíz sa-. Un solo cronista.
          aviso: '`saíno` es en Venezuela el pecarí de collar: homógrafo con el castellano del país'
          coste_medido:
            usos_de_la_voz_vieja_que_dejan_de_contar: 122
            usos_como_nucleo_de_otra_forma: 53
            respuestas_que_la_dicen: 220
            formas_de_la_base_a_raiz_de_ninguna_parte: 3
            colisiones_de_la_nueva: {saino: 0}
      recomendacion: A
      por_que: 'dos hermanas en la raíz, muchas atestaciones, y sin choque con el castellano venezolano'
    - voz: mütsia
      glosa: negro, oscuro
      hoy: 'reconstruido desde el wayuu mütsiisü'
      opciones:
        - letra: A
          formas: [wele]
          etiqueta: caquetío-hipotético
          derivacion: >-
            lokono «uele-hi» 'être noir' (Goeje p. 86, columna A) y kalinago
            «uli» 'noir', moderno wiri (Goeje p. 53, sigla 1 am 133: origen
            arahuaco). La forma lokona en grafía fonémica.
          coste_medido:
            usos_de_la_voz_vieja_que_dejan_de_contar: 111
            usos_como_nucleo_de_otra_forma: 122
            respuestas_que_la_dicen: 301
            formas_de_la_base_a_raiz_de_ninguna_parte: 5
            colisiones_de_la_nueva: {wele: 0}
        - letra: B

# 1. LA PRUEBA DE LA BASE COMPARTIDA — lo que Miguel preguntó
# ══════════════════════════════════════════════════════════════════════
prueba_de_la_base_compartida:
  pregunta: >-
    Si el caquetío y el kalinago dicen igual «sol» y «luna», ¿comparten más? Y
    si comparten, ¿es con las mujeres (la capa arahuaca) o con los hombres (la
    caribe)?
  metodo: >-
    Se buscó en Goeje, por su glosa francesa, cada voz caquetía ATESTIGUADA
    que tiene un concepto que un vocabulario antillano pueda tener (la lista
    de búsqueda está en `sin_equivalente_en_goeje` y en `conceptos`). El
    CONTROL es el habla de los hombres: donde el kalinago tiene dos palabras
    para lo mismo, una de hombres y otra de mujeres, el caquetío podría
    parecerse a cualquiera de las dos. Si la base compartida fuera parecido
    por azar, iría con las dos por igual.
  criterio_de_parecido: >-
    Del escriba, leído voz a voz y escrito en `por_que`: al menos dos
    consonantes en el mismo orden, con las correspondencias que las propias
    fuentes muestran (p~b, r~l, s~š; el lokono d = kalinago r/l, Adam pp.
    288-289: adiki/arika 'ver', ada/ara 'árbol'). `fuerte` = la forma casi
    entera; `moderada` = la raíz; `débil` = coincide menos que la raíz.
  conceptos:
    - caquetio: kasi
      glosa: sol
      kalinago_mujeres: kaši
      kalinago_hombres: hueyu
      lokono: hadali (otra raíz)
      pagina: 'Goeje p. 54 (f 1 am 62 / hK)'
      veredicto: con-las-mujeres
      fuerza: fuerte
      por_que: 'la forma entera; y es la ÚNICA hermana que la tiene: ni el lokono (hadali) ni el achagua (erri)'
    - caquetio: kati
      glosa: luna
      kalinago_mujeres: kati
      kalinago_hombres: nonum
      lokono: kathi
      pagina: 'Goeje p. 54'
      veredicto: con-las-mujeres
      fuerza: fuerte
      por_que: la forma entera, igual que el lokono
    - caquetio: parawa
      glosa: mar
      kalinago_mujeres: 'balaua (Dominica moderna: barawa)'
      kalinago_hombres: 'balana (de origen kalina/tupí: parana)'
      lokono: bara
      pagina: 'Goeje p. 55 (f 1 am 70 / hKTu)'
      veredicto: con-las-mujeres
      fuerza: fuerte
      por_que: 'parawa = barawa letra por letra salvo p~b; la de hombres termina en -na'
    - caquetio: para
      glosa: mar, agua extensa
      kalinago_mujeres: balaua
      kalinago_hombres: balana
      lokono: bara
      pagina: 'Goeje p. 55'
      veredicto: ambiguo
      fuerza: '—'
      por_que: 'para se parece a la raíz de las dos (bala-) y al lokono bara; no decide'
    - caquetio: dare
      glosa: diente
      kalinago_mujeres: ari
      kalinago_hombres: 'ie (kalina ye)'
      lokono: ari
      pagina: 'Goeje p. 33 (f 1 am 19 / hK)'
      veredicto: con-las-mujeres
      fuerza: moderada
      por_que: '-are ~ ari; la de hombres no comparte consonante. La d- inicial queda sin explicar aquí'
    - caquetio: ateri
      glosa: hombre, varón
      kalinago_mujeres: eyeri
      kalinago_hombres: 'uekeli (kalina wokere)'
      lokono: '—'
      pagina: 'Goeje pp. 39-40 (f 1 am 30 / hK)'
      veredicto: con-las-mujeres
      fuerza: moderada
      por_que: '-eri en las dos; la de hombres es otra raíz (w-k-l)'
    - caquetio: iero
      glosa: mujer
      kalinago_mujeres: inharu
      kalinago_hombres: 'uele (kalina wori)'
      lokono: hiaro
      pagina: 'Goeje p. 40 (f 1 am 32 / hK)'
      veredicto: con-las-mujeres
      fuerza: moderada
      por_que: 'iero ~ (h)iaro: vocal + r + o; la de hombres es otra raíz'
    - caquetio: kiba
      glosa: piedra
      kalinago_mujeres: šiba
      kalinago_hombres: 'tebu (roca; sigla K, la común)'
      lokono: siba
      pagina: 'Goeje p. 57 (f 1 am 75 / K)'
      veredicto: con-las-mujeres
      fuerza: debil
      por_que: '-iba igual; la inicial k frente a š/s no tiene correspondencia medida'
    - caquetio: kachikamo
      glosa: armadillo
      kalinago_comun: 'kašikamon (sigla K: origen kalina)'
      pagina: 'Goeje p. 59'
      veredicto: con-el-caribe
      fuerza: fuerte
      por_que: la forma entera; Goeje la da de origen kalina
    - caquetio: maure
      glosa: algodón, hilo
      kalinago_hombres: 'manhulu (kalina mauru, tupí amaniu)'
      pagina: 'Goeje p. 64 (hKTu)'
      veredicto: con-el-caribe
      fuerza: fuerte
      por_que: 'maure = kalina mauru; sólo hay forma de hombres'
    - caquetio: chogogo
      glosa: flamenco
      kalinago_comun: 'tuguku (kalina tokoko); «dialecte de Bonaire chogogo»'
      pagina: 'Goeje p. 60'
      veredicto: de-la-esfera
      fuerza: fuerte
      por_que: 'la voz caquetía ES la de Bonaire que Goeje cita (M5); el kalinago tiene la kalina'
    - caquetio: kerekere
      glosa: ave pequeña
      kalinago_comun: '(ti)erere; kalina kerekeru; lokono kirekire'
      pagina: 'Goeje p. 59'
      veredicto: de-la-esfera
      fuerza: fuerte
      por_que: 'la tienen el kalina y el lokono a la vez: voz de la esfera (y onomatopéyica)'
    - caquetio: wakoa
      glosa: paloma
      kalinago_comun: 'uakukua (sigla K); kalina akokowa; lokono wakukua'
      pagina: 'Goeje p. 59'
      veredicto: de-la-esfera
      fuerza: moderada
      por_que: 'la tienen el kalina y el lokono: voz de la esfera, imitativa del arrullo'
    - caquetio: buiamati
      glosa: dos lunas
      kalinago_comun: 'biama ''dos'' (en los dos registros)'
      lokono: biama
      pagina: 'Adam p. 281 (galibi oco / arrouague biama / caraïbe biama); Goeje p. 30'
      veredicto: arahuaco-comun
      fuerza: moderada
      por_que: >-
        la palabra caquetía para 'dos lunas' lleva dentro el 'dos' arahuaco
        (bia-ma), que es también el del kalinago; el caribe dice oco. OJO: el
        caquetío atestiguado para 'dos' suelto es `gudamuen`, que no se parece
        a nada de esto
  sin_equivalente_en_goeje: [koke, buio, arata, arika, bisure, barbache, cege, chaure, wache,
    waka, koro, ruba, surupa, kumarawa, yagruma, warawara, kiricias, baharuko, wasima, barsure,
    buriche, masato, boratio, waitiao, jai, were, bariki, yaro, piritu, kana, kapu, paro, wike,
    tarika, pariri, kidi, kabana, darubana, ebo, supi, dabuda, chirwa, karebe, wairon, urari,
    tara, korie, pana, gudamuen, sabuenen, katarí, ako, usera, etamo, humokaro, despopo, bakoa,
    komoho, ikoroata, kiwawa]
  no_se_pudo_buscar: >-
    kasá, sawaka, hayo, mene, biro, dara, kiwa, bagre, waranaro, apo, bajarí,
    jakura, chuchubi, paugis: Goeje no trae el concepto o su glosa francesa no
    aparece en las páginas legibles. No cuentan ni a favor ni en contra.
  lectura: >-
    Sí hay una base compartida, y es la que Miguel intuyó. En los conceptos
    donde el kalinago tiene una palabra de hombres y otra de mujeres, el
    caquetío va con las MUJERES en todos los que deciden, y con los hombres en
    ninguno (cifras: medición §prueba). Son las palabras más básicas —sol,
    luna, mar, diente, hombre, mujer, piedra— y son las de la capa arahuaca.
    Lo caribe aparece en otro sitio: en fauna y cosas que circulan
    (armadillo, algodón, flamenco), que es la esfera. Y la mayoría de lo
    atestiguado caquetío (topónimos, flora xerófila, fauna del Golfete) no
    tiene nada enfrente, porque es de aquí.
  lo_que_no_dice: >-
    (1) No dice que caquetíos y kalinago estuvieran en contacto: el parecido es
    de FAMILIA (arahuaca), el lokono suele tener la misma forma. (2) Con 'sol'
    sí dice algo más: ahí sólo el kalinago de mujeres tiene la forma
    caquetía, y por eso esa capa no es redundante con el lokono. (3) La
    muestra es pequeña y el juicio de parecido es del escriba; está escrito
    voz a voz para que se pueda discutir.


# Goeje 1939 — el habla de MUJERES kalinago que faltaba (transcrita en imagen, 2026-09-24).
meta:
  obra_id: goeje-1939
  que_es: 'El habla de MUJERES del caribe insular (kalinago) en Goeje 1939: las entradas con «f» en la sigla del
    margen de las páginas que la parcela M5 (kalinago_goeje_1939.yaml) no transcribió, con la forma lokona (columna
    A) cuando Goeje la da.'
  pedido: 'Miguel, 2026-09-24: «Pero no tenemos más palabras del Kalinago femenino?» … «Dale». Para reforzar el
    núcleo con dos hermanas y rehacer la cercanía con más conceptos.'
  como_se_leyo: se localizan en la capa de texto las siglas con f del margen (x < 120 pt en impares, < 205 en pares)
    y se lee en IMAGEN cada bloque con la entrada anterior, porque «id.» remite a la glosa de arriba. Páginas impresas
    = índice PyMuPDF (pdf − 1).
  sigla: f = habla de mujeres; h = de hombres; A = arahuaco (la forma lokona va en el cuerpo tras «A»); am = vocabulario
    comparado arahuaco-maipure de Goeje; K = kalina; T = taíno; — = sin origen
  derechos: 'Goeje †1955: dato lexicográfico (forma, glosa corta, página); nada más literal'

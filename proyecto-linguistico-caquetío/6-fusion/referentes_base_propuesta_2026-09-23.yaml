# EL CATÁLOGO DE REFERENTES PARA LA BASE — PROPUESTA (2026-09-23)
#
# Lo que la simulación larga le pone delante a los agentes para NOMBRAR. Sale de
# la decisión db.4 (Miguel, 2026-09-22): novedades + huecos, uno cada dos días,
# fuera las dos coloniales, y «las cosas que debemos empezar por nombrar son las
# de los animales que no sabemos cómo se llamaban originalmente, por ejemplo la
# Tarántula azul». Los animales vienen de las tres campañas de fauna (PRs #211
# tierra, #205 aves, #208 mar): este archivo ELIGE y ORDENA; la evidencia de cada
# uno está en su YAML de origen y no se repite aquí.
#
# PROPUESTA (regla 5): Miguel la aprueba antes de que entre al motor.

meta:
  base: 30 días del Tiempo de Viento (P1), uno cada dos días → 15 referentes, días 1, 3, … 29
  extension: si la base se alarga a 50 días, los de `reserva` entran en su orden
  criterios:
    - hueco real (sin voz caquetía conocida) o novedad (lo que no habían visto)
    - presencia en el siglo XV segura o probable (regla 3), con su fuente en el YAML de origen
    - de la estación: todos valen para el Tiempo de Viento; la tortuga que desova (junio-julio, P2) queda fuera
    - variedad: tierra, aire y agua se alternan, para que las disputas no se mezclen
    - los animales primero (db.4); la tarántula azul abre
  el_sonido: >-
    `se_oye` DESCRIBE el sonido (cuántas veces, grave o agudo, a qué hora) y NO lo
    transcribe. Si se le escribe «ua-chará-cá», el agente lo copia, y varias
    transcripciones son casi el nombre castellano del animal. Así la onomatopeya
    la inventa el agente. Las transcripciones de fuente se quedan en los YAML de
    origen. PENDIENTE DE MIGUEL (ver `lo_que_falta_decidir`).
  estimulo: >-
    Hoy el estímulo dice «[ALGO NUEVO EN PARAGUANÁ]: … Esto no tiene nombre en
    caquetío todavía». Un HUECO no es nuevo: se ve siempre. Hace falta un segundo
    molde para `tipo: hueco` («Esto lo ves siempre y no le has dado nombre…») y una
    línea «[Lo que se oye]» cuando haya sonido. Es cambio de código, va con la tanda.

referentes:

  - {orden: 4, dia: 7, tipo: hueco, id: cascabel, de: 'fauna_paraguana_tierra fa1-036',
     desc: 'la serpiente gruesa de rombos oscuros y cabeza de triángulo que duerme entre los cujíes y, al sentir el paso, levanta la cola y la hace sonar',

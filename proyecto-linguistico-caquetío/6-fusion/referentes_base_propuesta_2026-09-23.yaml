  - {orden: 2, dia: 3, tipo: hueco, id: guacharaca, de: 'fauna_paraguana_aves ave-011',
     desc: 'un ave parda del tamaño de una gallina, de cola larga y papada roja, que desde los árboles del cerro grita al amanecer antes que todas',

reserva:
  en_orden: [pitirre, colibri, pez_que_ronca, marea_roja, raya, carpintero, mapurite, turpial, planta_quema, cuenta_insular, tambor_caribe, alcatraz, concha_perlifera, chicharra]
  y_los_huecos_no_animales: >-
    la duna, el alisio como ser con nombre, la marea, el istmo, la costra de sal,
    la madera de canoa (hueco-lex-001, 003, 005, 007, 008) — para la extensión o la
    era 3.

fuera:
  - {id: cuentas_vidrio, por_que: 'el vidrio es europeo (regla 3); decisión db.4'}
  - {id: fiebre_manchas, por_que: 'apunta a la viruela, que llegó en 1518 (regla 3); decisión db.4'}
  - {id: bestia_orilla, por_que: 'la sustituye la ballena, con descripción de fuente'}
  - {id: tortuga_que_desova, por_que: 'desova en junio-julio (P2): fuera del Tiempo de Viento'}
  - {id: manglar_que_chasquea, por_que: 'el manglar con fauna que la campaña pudo situar es moderno; queda para cuando haya dato del s. XV'}

lo_que_falta_decidir:
  onomatopeya_y_raiz: >-
    Con la regla de la raíz (db.1 A + C) una raíz nueva por onomatopeya se
    rechaza. Opciones: A mantenerla (el agente compone con raíces conocidas); B
    abrir una puerta estrecha SÓLO para los referentes de animal, con el filtro de
    forma caquetía; C dejar los animales para la era 3. Recomendación del
    escriba: B. Sin esto, varios de los 12 animales pueden no llegar a fijarse.
  el_sonido_en_el_prompt: 'describirlo sin transcribirlo (recomendado) o dar la transcripción de fuente'

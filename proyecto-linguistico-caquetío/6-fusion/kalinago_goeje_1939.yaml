dudas_de_los_escribas:
- pagina_impresa: 68
  que: las siglas del margen salen corridas en el layout (p. ej. «K» pegada al título «Verbes B, P»);
    todas se tomaron de la imagen
  resuelta: sí
  escriba: K4
- pagina_impresa: 68
  que: el layout da «h h-abaa» para 'nuire'; en la imagen se lee «h k-abaa»
  resuelta: sí
  escriba: K4
- pagina_impresa: 69
  que: las siglas del margen del layout están corridas y en otro orden (p. ej. «f, h 1 am 131 ?» sale
    partido en varias líneas); todas se tomaron de la imagen
  resuelta: sí
  escriba: K4
- pagina_impresa: 93
  que: la línea «prendre, porter A anaki, onaki» lleva «hK» en el margen pero sólo trae formas arawak
    (A anaki, onaki); no se crea entrada. O la sigla está corrida una línea (la línea siguiente, «se farder
    … h it-unema, K ot-unemu», con sigla «—», casaría con hK), u «onaki» es caribe insular sin marca.
    No se resuelve
  resuelta: false
  escriba: K5

# ══════════════════════════════════════════════════════════════════════
# GOEJE 1939 — EL CARIBE INSULAR (kalinago): pp. 21-120
# *Nouvel examen des langues des Antilles*, JSA 31: 1-120.
#
# PROPUESTA (regla 5). Tercera campaña de minería, parcela M5 (vocabularios
# antillanos). 2026-09-22/23. Rama `campana/mineria3-vocabularios`.
#
# ⚠️ DERECHOS. Goeje murió en 1955: la obra NO es de dominio público en todas
# las jurisdicciones. Aquí va DATO LEXICOGRÁFICO (forma, glosa francesa de pocas
# palabras, página, sigla) y todo lo demás se PARAFRASEA.
#
# ESTO NO ES CAQUETÍO. El kalinago es una de las cinco lenguas de la ESFERA DE
# CONTACTO del motor (`ESFERA_DE_CONTACTO` en `curiana_sim/curiana_lexicon.py`).
# Lo que se pregunta aquí es qué sostiene Goeje de las 23 voces kalinago del
# lexicón, y qué dice del «dialecte de Aruba».
# ══════════════════════════════════════════════════════════════════════
meta:
  obra_id: goeje-1939
  campana: tercera campaña de minería — parcela M5
  medido: '2026-09-23'
  texto: >-
    `fuentes_caquetios/Goeje_1939_Nouvel_examen_langues_Antilles.pdf` (el mismo
    PDF que la parcela T10 bajó de la Biblioteca Curt Nimuendajú). Página impresa
    = página del PDF − 1. Para esta parcela se extrajo además con
    `pdftotext -layout`, que es lo que alinea la columna de siglas del margen
    con su renglón (sin `-layout` la columna sale apilada en bloques, y es lo que
    la parcela T10 no pudo leer).
  como_se_lee_una_linea: >-
    margen izquierdo = sigla de Goeje: `h` habla de hombres, `f` habla de
    mujeres; `K` origen kalina (caribe continental), `A` origen arawak (=
    lokono), `T` taíno, `Tu` tupí, `—` origen no hallado, `am`/`1 am N`/`2 am
    N` = su vocabulario comparado arahuaco-maipure (origen arahuaco). Forma sin
    número = caribe insular ANTIGUO (Breton 1665-67, s. XVII); `2` = caribe
    insular moderno (Dominica, S. Vicente, s. XIX-XX); `5` y `6` = caribe de
    Honduras (garífuna) antiguo y moderno.
  la_tesis_de_goeje_sobre_la_lengua: >-
    (parafraseado, pp. 21-22) los kalina conquistaron las Antillas Menores poco
    antes de Colón; la lengua de las madres, que él llama iñeri (arahuaca), se
    mantuvo y absorbió muchas voces kalina. Por eso casi cada concepto tiene
    dos formas: la de los hombres, muchas veces de origen kalina, y la de las
    mujeres, muchas veces arahuaca. Y la gramática es de fondo arahuaco. Esto
    es exactamente el «registro de hombres caribe / registro de mujeres
    arahuaco» que el lexicón nombra en `baruwa` y `hiñaru`.

  # ── lo que resultó falso al medirlo ────────────────────────────────
  correcciones_al_encargo:
  - afirmacion: >-
      «el "dialecte de Aruba" que Goeje cita dos veces sin decir de dónde sale»
    medido: >-
      es de dónde sale, sí, aunque no lo diga: las dos voces son las de Pinart
      (1882) publicadas por Gatschet (1885), con la misma glosa y hasta con el
      mismo comentario de Gatschet reproducido. Ver §aruba. Y no son dos citas
      insulares sino CUATRO: Goeje nombra también un «dialecte de Bonaire»
      (`chogogo`, flamenco, p. 60) y el papiamento de Curaçao (`ayaka`, p. 115).
  - afirmacion: '(ficha y T10) «luaidanga» calabaza'
    medido: >-
      **`waidanga`**. «luaidanga» es una lectura del OCR (la `w` cursiva sale
      `lu`). Verificado en imagen, p. 15.
  - afirmacion: '(ficha y T10) «hanuhana» hormiga'
    medido: >-
      `hanuhana` es lo que imprime Goeje (verificado en imagen, p. 61), pero
      Gatschet 1885 p. 302 escribe `hanahana`. Goeje copió con una vocal
      cambiada — o corrigió sin decirlo.
  - afirmacion: '(el lexicón) varias de las 23 voces kalinago son «Garifuna X»'
    medido: >-
      Goeje separa el caribe insular antiguo (Breton, s. XVII) del garífuna
      (Honduras, s. XIX-XX). Cinco de las voces del lexicón son garífunas (5/6)
      y no aparecen así en el caribe insular antiguo. No es una etiqueta falsa
      —el garífuna ES caribe insular—, pero es otra época: el caribe insular
      que un caquetío del s. XV pudo oír es el de Breton, no el de Honduras.

  cobertura:
    lo_que_se_hizo_entero: >-
      el CRUCE de las 23 voces kalinago del lexicón con Goeje, cada una leída
      en la IMAGEN de su página (§cruce_con_el_lexicon), y el «dialecte de
      Aruba» con sus dos vecinos (Bonaire, Curaçao), también en imagen (§aruba).
    vocabulario_transcrito: >-
      §vocabulario lo escribieron cinco escribas de apoyo en paralelo, cada
      uno sobre su tramo de `pdftotext -layout`, verificando en imagen lo que
      el OCR rompía. **Se cortaron por el límite de uso a mitad de trabajo**
      (2026-09-22 noche): lo que dejaron está aquí tal cual, con el tramo de
      cada uno, y la cobertura real es la de `tramos` (medida sobre las
      entradas, no declarada). Lo que el coordinador cotejó contra la imagen
      (pp. 33, 46) coincide entrada a entrada.
    lo_que_NO_se_transcribio: >-
      pp. 35-43 (resto de cuerpo, religión, familia y tribu), pp. 49-67
      (resto de aldea, naturaleza, ANIMALES y plantas), pp. 70-84 y 94-101
      (verbos) y pp. 103-118 (verbos S-Y, préstamos europeos, shebayo y
      guayana). Las líneas que el cruce necesitó de esas páginas se leyeron
      en imagen y van en §cruce y §fauna_leida_en_imagen, no en §vocabulario.

# ══════════════════════════════════════════════════════════════════════
# 1. 🔴 EL CRUCE: las 23 voces kalinago del lexicón contra Goeje
#
# Cada fila está leída en la IMAGEN de la página (no en el OCR). `veredicto`:
#   apoyo       = misma forma (o la misma con la grafía de Goeje) y mismo concepto
#   apoyo-parcial = mismo concepto, forma emparentada pero no la del lexicón
#   sin-apoyo   = Goeje da el concepto con OTRA forma, o no lo da
# Es PROPUESTA DE CITA, no edición: la clave del lexicón no se toca aquí.
# ══════════════════════════════════════════════════════════════════════
cruce_con_el_lexicon:
- clave: kati-kalinago
  glosa_en_el_lexicon: luna, mes
  veredicto: apoyo
  goeje: 'lune kati, 2 f kati, 6 hati, 6 sa h, f hati, 6 wl hat, kat, A kači, mois 6 wl kat'
  pagina_impresa: 54
  sigla: f 1 am 62
  lectura: >-
    es la forma de MUJERES, de origen arahuaco; la de hombres es `nonum` (hK,
    K `nuno`). El lexicón no dice el registro. Verificado en imagen.
  propuesta_de_cita: 'goeje-1939 p. 54 (habla de mujeres; hombres: nonum)'
- clave: barana
  glosa_en_el_lexicon: mar, agua extensa
  veredicto: apoyo
  goeje: 'la mer h balana, 2 h barana, 6 sa h barani, 5, 6 wl barana, K parana (Tupi parana)'
  pagina_impresa: 55
  sigla: hKTu
  lectura: >-
    🔴 apoyo de FORMA con un giro de ORIGEN: `barana` es la forma de HOMBRES y
    Goeje la da de origen kalina/tupí (K `parana`, Tupi `parana`), no
    arahuaco. La de MUJERES es `balaua` (f 1 am 70, 2 f `barawa`, A `bara`), y
    ésa sí es la arahuaca. La nota del lexicón («cognado de CQ para, LK bara,
    PA *para») junta las dos. Verificado en imagen.
  propuesta_de_cita: 'goeje-1939 p. 55 (hombres, origen kalina; mujeres: balaua ~ A bara)'
- clave: kasabi-kalinago
  glosa_en_el_lexicon: casabe, pan de yuca
  veredicto: sin-apoyo
  goeje: >-
    'gâteau de manioc h aleiba, ereba, 6co areba, K arepa' (hK) · 'cassave
    maru, cassave fraîche maru-maru' (—)
  pagina_impresa: 49
  lectura: >-
    `kasabi` no aparece en el vocabulario kalinago de Goeje (0 en el texto
    entero con grafía k/c/s/š). El pan de yuca kalinago es `aleiba`/`ereba`
    (hombres, K `arepa` — la arepa) o `maru`. `kasabi` es taíno (`ka-sabi`,
    p. 9) y lokono. Verificado en imagen.
  propuesta_de_cita: >-
    ninguna en Goeje. La nota del lexicón («Kalinago kasabi») queda sin fuente
    en esta obra.
- clave: buyei
  glosa_en_el_lexicon: chamán, curandero ritual
  veredicto: apoyo
  goeje: 'homme-médecin boye, boyei, boyahi-ku, 6 buyey, K puye (Tupi paje)'
  pagina_impresa: 37
  sigla: KTu
  lectura: >-
    forma confirmada, y el origen que Goeje le da es KALINA/TUPÍ (`puye`,
    `paje`), no arahuaco. La nota del lexicón («cognado irregular de LK
    piaye») es otra etimología: Goeje no la sostiene. Y en p. 18 da el
    `behiko` que Las Casas oyó en Haití como caribe insular, con `boyahiku,
    boye` al lado. Verificado en imagen.
  propuesta_de_cita: 'goeje-1939 p. 37 (y p. 18 para behiko)'
- clave: iwana-kalinago
  glosa_en_el_lexicon: iguana (Iguana iguana)
  veredicto: apoyo-parcial
  goeje: "iguane yoana (car.-fr. p. 63), A iuwana · id. uayamaka, 6wl uayamaga, K wayamaka"
  pagina_impresa: 60
  sigla: '2 am 37 (yoana) · K (uayamaka)'
  lectura: >-
    la forma de Breton es `yoana` (arahuaca, A `iuwana`); hay además
    `uayamaka` de origen kalina. `iwana` tal cual no está. Verificado en
    imagen.
  propuesta_de_cita: 'goeje-1939 p. 60 (forma de Breton: yoana)'
- clave: kairi-kalinago
  glosa_en_el_lexicon: isla, cayo
  veredicto: apoyo-parcial
  goeje: >-
    'île, bosquet, pays, patrie h ubao, 6 ubaw, K pa'u' (hK) · 'île, pays,
    patrie f akaera, 5, 6 agaira, île A kairi' (f 1 am 71)
  pagina_impresa: 56
  lectura: >-
    `kairi` es la forma ARAWAK (lokono) que Goeje pone de comparanda; la
    kalinago es `akaera` (mujeres) y la garífuna `agaira`; la de hombres,
    `ubao`. Emparentadas, no iguales. Verificado en imagen.
  propuesta_de_cita: 'goeje-1939 p. 56 (f akaera ~ A kairi; h ubao)'
- clave: yuka-kalinago
  glosa_en_el_lexicon: yuca, mandioca
  veredicto: sin-apoyo
  goeje: "manioc h, 2 h, K kiere (hK) · id. f key, f kanh-im, 2 f kai, 6 vi gai, A kali (f 1 am 120)"
  pagina_impresa: 65
  lectura: >-
    la yuca kalinago es `kiere` (hombres, kalina) y `key` (mujeres, arahuaca, A
    `kali`). `yuka` no aparece. Verificado en imagen.
  propuesta_de_cita: ninguna en Goeje.
- clave: marisi-kalinago
  glosa_en_el_lexicon: maíz
  veredicto: apoyo
  goeje: "maïs h aoasi, 6 wl auas, 5, K a-wasi (Tupi awati) · id. f mariši, A mariši"
  pagina_impresa: 65
  sigla: f 1 am 122
  lectura: >-
    forma de MUJERES, arahuaca; la de hombres es `aoasi` (kalina/tupí). La
    línea de `mariši` está verificada en imagen; la de `aoasi`, en el OCR.
  propuesta_de_cita: 'goeje-1939 p. 65 (habla de mujeres; hombres: aoasi)'
- clave: achi-kalinago
  glosa_en_el_lexicon: ají, pimienta
  veredicto: apoyo-parcial
  goeje: "piment h boemoin, 2 f bürmüi, K pomui (hK) · id. f ati, 6 sa, 6 wl ati, A haši (1 am 126)"
  pagina_impresa: 66
  lectura: >-
    la forma de mujeres (y la garífuna) es `ati`, con `t`; `achi` no está. A
    `haši` es la lokono. Verificado en imagen.
  propuesta_de_cita: 'goeje-1939 p. 66 (f ati)'
- clave: kalinagu
  glosa_en_el_lexicon: Kalinago, gente propia (autónimo)
  veredicto: apoyo
  goeje: >-
    'Indien Caribe des Iles, Indien Kaliña h Kalinago, Indien Kaliña K Kaliña,
    Karinako, le peuple caribe 2 Karinaku' · 'Indien Caribe des Iles f
    Kaliponam, 2 nl Kaifuna, 2 tay Karifuna, … 6 co Garif (leur langue 6
    Garifuna)'
  pagina_impresa: 43
  sigla: voir T
  lectura: >-
    `Kalinago` es la forma de HOMBRES; la de mujeres es `Kaliponam`. La
    etimología que el lexicón le da («kalina + -gu arahuaco, compuesto
    híbrido») NO está en Goeje: es análisis del lexicón y queda como
    conjetura. Verificado en imagen.
  propuesta_de_cita: 'goeje-1939 p. 43 (habla de hombres; mujeres: Kaliponam)'
- clave: kalínagu
  glosa_en_el_lexicon: Caribe, kalínagu (autónimo del pueblo Caribe insular)
  veredicto: apoyo
  goeje: la misma línea que `kalinagu`
  pagina_impresa: 43
  lectura: >-
    ⚠️ `kalinagu` y `kalínagu` son DOS claves del lexicón para la misma voz de
    Goeje. Duplicado a curar (no es de esta parcela decidirlo).
  propuesta_de_cita: 'goeje-1939 p. 43'
- clave: ikoa
  glosa_en_el_lexicon: casa, vivienda
  veredicto: sin-apoyo
  goeje: >-
    'maison imamün, moene, mana' (K) · 'carbet h inobo' (hK) · 'id. f rabui,
    itabui' (fK) · 'maison, place, habitation obogne, f ubonoko, 2 ubuye, A
    bawhu' (f 1 am 116, 117) · 'maison ubana, bade, 6 sa uba, 6 uban, A
    ubanabu' (1 am 117) · 'loge, appentis, hamac h (i)bati … maison 2 bati' (hK)
  pagina_impresa: 45
  lectura: >-
    seis voces para 'casa' y ninguna es `ikoa`. Coll y Toste (cap. X, s. v.
    Casa) da `Ci. tubana`, que es la `(t-)ubana` de Goeje. Verificado en
    imagen.
  propuesta_de_cita: ninguna en Goeje; si se busca una voz kalinago para 'casa', es `ubana` (arahuaca) o `mana`/`moene` (kalina).
- clave: duna-kalinago
  glosa_en_el_lexicon: agua, río
  veredicto: apoyo-parcial
  goeje: "eau, rivière tonê, tona, 2nl, 2, K tuna, 5, 6 duna"
  pagina_impresa: 55
  sigla: K
  lectura: >-
    `duna` es la forma GARÍFUNA (5, 6); la del caribe insular antiguo es
    `tonê`/`tona`, y Goeje la da de origen KALINA (K `tuna`), no arahuaco. 🔴
    La nota del lexicón («LK tuna → duna») atribuye `tuna` al lokono; Goeje,
    en la misma página, da el agua arawak como `wuini` («eau, rivière A
    wuini», s. v. Koiuini). Verificado en imagen.
  propuesta_de_cita: 'goeje-1939 p. 55 (garífuna duna; caribe insular antiguo tona, origen kalina)'
- clave: hamaka-kalinago
  glosa_en_el_lexicon: hamaca, cama colgante
  veredicto: sin-apoyo
  goeje: "hamac h akat, K fr akado … (hK) · hamac f ek(ê)ra, 6 wl ue-kura-u, A u-luira (fA)"
  pagina_impresa: 46
  lectura: >-
    la hamaca kalinago es `akat` (hombres) y `ekera` (mujeres). `hamaka` es
    taína, y Goeje (p. 19 nota) cree que llegó a otras lenguas indígenas por
    el español. Verificado en imagen (lo leyó el escriba K2 y lo cotejó el
    coordinador).
  propuesta_de_cita: ninguna en Goeje.
- clave: aban
  glosa_en_el_lexicon: uno
  veredicto: apoyo
  goeje: "un abana, 5 id., 2, 6 sa, A aba"
  pagina_impresa: 29
  sigla: 1 am 131
  lectura: forma de Breton `abana`, arahuaca. Verificado en imagen.
  propuesta_de_cita: 'goeje-1939 p. 29'
- clave: biama-kalinago
  glosa_en_el_lexicon: dos
  veredicto: apoyo
  goeje: "deux biama, 5, A id., 2 biaba, 6 sa biam, 6 bianve"
  pagina_impresa: 30
  sigla: 1 am 132
  lectura: arahuaca, igual en lokono. Verificado en imagen.
  propuesta_de_cita: 'goeje-1939 p. 30'
- clave: ma-kalinago
  glosa_en_el_lexicon: no, negación (prefijo)
  veredicto: apoyo
  goeje: >-
    'ne fais pas, non m- a-ni, 6, A id.' · 'pas du tout mania, 2, 6, A id.' (A,
    p. 25) · y aparte 'négation -pa, K id.' (sufijo kalina, p. 26) y 'non ua,
    2, 6 id., K uwa' (K, p. 31)
  pagina_impresa: 25
  lectura: >-
    el prefijo negativo/privativo `m(a)-` está, y Goeje lo da de origen
    ARAHUACO. Pero la negación kalinago tiene tres piezas: `m-` (arahuaca), el
    sufijo `-pa` (kalina) y la palabra `ua` 'no' (kalina). Leído en el OCR
    (p. 25 de la parte gramatical, que va en prosa y sale limpia).
  propuesta_de_cita: 'goeje-1939 p. 25 (m-, arahuaco); pp. 26 y 31 para -pa y ua'
- clave: kasaku
  glosa_en_el_lexicon: firmamento, bóveda celeste
  veredicto: sin-apoyo
  goeje: "le ciel … kahue, ciel K kapu (hK, p. 52) · le ciel, le temps, les nuées ubeku, 5 ubehu (1 am 60 A, p. 53)"
  pagina_impresa: 52
  lectura: >-
    el cielo kalinago es `kahue` (kalina) y `ubeku` (arahuaco; Coll y Toste
    lo copia como `Ci. ubécu`). `kasaku` no aparece en todo el texto.
  propuesta_de_cita: ninguna en Goeje.
- clave: hiñaru
  glosa_en_el_lexicon: persona, ser humano (registro femenino Kalinago)
  veredicto: apoyo
  goeje: "femme h uele, 2 h würi, 6 wuri, 6 sa h vuri, K wori (hK) · id. f inharu, 2 f yaru, 6 sa f uñaru, A hiaro (f 1 am 32)"
  pagina_impresa: 40
  lectura: >-
    🔴 la forma está —`inharu`, garífuna `uñaru`—, pero **la glosa no**: Goeje
    la da como 'MUJER' en habla de mujeres, con A `hiaro` 'mujer'. No es
    'persona'. El lexicón la glosa mal. Verificado en imagen.
  propuesta_de_cita: 'goeje-1939 p. 40 — y revisar la glosa: «mujer (habla de mujeres)», no «persona»'
- clave: baruwa
  glosa_en_el_lexicon: hombre (registro masculino Kalinago)
  veredicto: sin-apoyo
  goeje: "homme, mâle h uekeli, 2 h wüküri, 6 woguri, 5 st h vügueri, 6 sa h vuquiri, K wokere (p. 39) · id. f, 2 f eyeri, 5 st f eierili, 6 sa f eyeri (f 1 am 30, p. 40)"
  pagina_impresa: 39
  lectura: >-
    'hombre' en habla de hombres es `uekeli` (kalina) y en habla de mujeres
    `eyeri` (arahuaca: es el «eyeri» de la lista de Bachiller, que Rafinesque
    tomó por nombre de lengua). `baruwa` no aparece. Verificado en imagen.
  propuesta_de_cita: >-
    ninguna en Goeje. El par del lexicón baruwa/hiñaru queda así: `hiñaru` con
    apoyo (pero es 'mujer'), `baruwa` sin él. El par REAL de Goeje es
    uekeli (h) / eyeri (f) para 'hombre' y uele (h) / inharu (f) para 'mujer'.
- clave: kanawa-caribe
  glosa_en_el_lexicon: canoa (forma caribe del Kalinago)
  veredicto: apoyo
  goeje: "canot (1 ro grand canot) kanaoa, K kanawa, A kanoa (K) · canot f kuliala, 2b guayara, 6 guriyara, A kuliala (fA)"
  pagina_impresa: 46
  lectura: >-
    `kanaoa` en Breton, de origen kalina (K `kanawa`), «gran canoa» según
    Rochefort; la de mujeres es `kuliala`, arahuaca. El lexicón acierta en
    llamarla «forma caribe». Verificado en imagen.
  propuesta_de_cita: 'goeje-1939 p. 46'
- clave: pira
  glosa_en_el_lexicon: pez, pescado (forma caribe del Kalinago)
  veredicto: sin-apoyo
  goeje: "poisson aoto, 2, 2nl utu, 6 udu, K woto (K)"
  pagina_impresa: 60
  lectura: >-
    el pez kalinago es `aoto` (kalina, K `woto`). `pira` no aparece en el
    vocabulario kalinago de Goeje. Verificado en imagen.
  propuesta_de_cita: ninguna en Goeje.
- clave: amourou
  glosa_en_el_lexicon: guerra, combate
  veredicto: sin-apoyo
  goeje: "guerre ualime, K fr ualime, K esp guariñu, Tupi uarini, faire la guerre ualine-buike (KTu?, p. 43) · faire la guerre, bataille h huetuku (p. 42)"
  pagina_impresa: 43
  lectura: >-
    'guerra' es `ualime` (kalina/tupí) y `huetuku` (hombres). `amourou` no
    aparece; el parecido más cercano en Goeje es `amoro`, pronombre kalina de
    2ª persona (p. 23), que no tiene que ver. Verificado en imagen (p. 43).
  propuesta_de_cita: ninguna en Goeje.

resumen_del_cruce:
  claves_kalinago_en_el_lexicon: 23
  nota_de_conteo: >-
    las cifras de abajo las recuenta `6-fusion/scripts/consolidar_taino.py`
    sobre esta lista (regla 1); se escriben aquí sólo como índice de lectura.
  apoyo: [kati-kalinago, barana, buyei, marisi-kalinago, kalinagu, kalínagu, aban, biama-kalinago, ma-kalinago, hiñaru, kanawa-caribe]
  apoyo_parcial: [iwana-kalinago, kairi-kalinago, achi-kalinago, duna-kalinago]
  sin_apoyo: [kasabi-kalinago, yuka-kalinago, ikoa, hamaka-kalinago, kasaku, baruwa, pira, amourou]
  lo_que_dice_el_patron: >-
    🔴 las ocho sin apoyo son, casi todas, la voz TAÍNA o LOKONO del concepto
    puesta con la etiqueta kalinago (`kasabi`, `yuka`, `hamaka`, `ikoa` ~ LK
    `sikoa`, `kasaku` ~ LK `kassaku`) o una voz caribe continental (`pira`).
    Es el mismo patrón que la primera campaña del taíno encontró en las nueve
    «taíno-reconstruido»: una lengua vecina disfrazada con otra etiqueta. Y en
    las que tienen apoyo, el lexicón casi nunca dice el REGISTRO: `kati`,
    `marisi`, `hiñaru` son de mujeres; `barana`, `kalinagu` de hombres.

# ══════════════════════════════════════════════════════════════════════
# 2. LO QUE EL CRUCE DEJÓ VER DE PASO — sol y luna
# ══════════════════════════════════════════════════════════════════════
sol_y_luna:
  goeje: "soleil h hueyu, 2 nl wayu, 5 weiu, 6 sa, 6, Kesp veyu, 2, K weyu (hK) · id. f kaši (f 1 am 62)"
  pagina_impresa: 54
  lectura: >-
    en habla de MUJERES el sol es `kaši` y la luna `kati`, las dos con la
    misma sigla arahuaca (1 am 62). El caquetío ATESTIGUADO del lexicón tiene
    `kasi` 'sol' (la forma que la política del 2026-09-19 puso por encima de
    `kali`) y `kati` 'luna'. **Es la misma pareja, en la esfera de contacto.**
    Y Bachiller p. 388 da en su bloque eyeri `Kachi/Cochi` 'sol' y `Kati`
    'luna' — que son estas mismas, vía Rochefort. Comparandum, no
    propuesta: no cambia ninguna glosa, pero es el cognado de esfera mejor
    apoyado que tiene el par sol/luna.
  verificado: en imagen

# ══════════════════════════════════════════════════════════════════════
# 3. 🔴 ARUBA, BONAIRE Y CURAÇAO EN GOEJE
# ══════════════════════════════════════════════════════════════════════
aruba:
  pregunta: >-
    Goeje cita un «dialecte de Aruba» sin decir de dónde lo saca. Aruba está en
    la Kaketiana. ¿Es Gatschet? ¿Es van Buurt? ¿Hay una fuente arubana que el
    proyecto no conoce?
  las_citas:
  - forma_goeje: waidanga
    glosa_goeje: calebasse (Crescentia cujete)
    pagina_impresa: 15
    seccion: vocabulario TAÍNO, VI. plantas — como comparanda de T `hibuera`
    verificado: en imagen
    en_gatschet_1885: '«totumba, waidanga water-gourd» — p. 301, lista de Pinart'
    coincide: sí, letra por letra
  - forma_goeje: hanuhana
    glosa_goeje: fourmi (hormiga)
    pagina_impresa: 61
    seccion: vocabulario KALINAGO, V. animales — junto a «fourmi, esp. hagué»
    sigla: 1 am 107 A
    verificado: en imagen
    en_gatschet_1885: '«hanahana Formica cephalota» — p. 302, lista de Pinart'
    coincide: con una vocal distinta (Goeje `hanuhana`, Gatschet `hanahana`)
  la_prueba_de_que_es_gatschet: >-
    Gatschet (p. 303) comenta que la voz genérica del caribe insular para
    'hormiga', `hage`, se puede comparar con el arubano `hanahana`. Goeje pone
    el arubano exactamente en la entrada de «fourmi, esp. `hagué`». Dos voces,
    las dos de la lista de Pinart, con la glosa de Gatschet y con la
    comparación de Gatschet. La fuente es **Pinart (1882), publicado por
    Gatschet (1885)** — la que el repo ya tiene. No hay una fuente arubana
    nueva.
  lo_que_valen: >-
    ⚠️ la lista de Pinart la recogió en 1882 de «nativos muy viejos» de Aruba,
    que habían dejado su lengua por el papiamento hacia 1800 (Gatschet p.
    300). Son voces del s. XIX, recordadas: `epoca: moderno`. Y Gatschet
    mismo no logró clasificarlas. Goeje las pone, sin decirlo, como arahuacas
    (hanuhana bajo la sigla 1 am 107 A).
  en_van_buurt_2014: >-
    ni `waidanga` ni `hanahana` están en van Buurt (0 y 0, con la raíz corta
    `dang` y `hana`). Van Buurt sí conoce a Pinart («Pinart wordlist from
    1890») y a van Koolwijk (1880), pero de esas listas cita otras voces
    (`dabaraida`, `purantsi`, `Wakubana`). Nadie ha cruzado las dos de Goeje
    con el caquetío.
  bonaire:
    forma_goeje: chogogo
    glosa_goeje: flamant (flamenco)
    pagina_impresa: 60
    linea: "flamant tuguku, K tokoko, dialecte de Bonaire chogogo"
    sigla: K
    verificado: en imagen
    lectura: >-
      🔴 Goeje pone el `chogogo` de Bonaire como cognado del kalinago `tuguku`
      y del kalina `tokoko`, bajo sigla K (origen caribe). Van Buurt 2014 da
      `chogogo` (Bonaire, Curaçao; `chògògò` en Aruba) 'Phoenicopterus ruber'
      en su lista de voces caquetías del papiamento. Si Goeje tiene razón, la
      voz del flamenco en las islas caquetías es CARIBE, no arahuaca —
      préstamo de esfera o sustrato, pero no caquetío. Goeje no dice de dónde
      saca el «dialecte de Bonaire».
  curacao:
    forma_goeje: ayaka
    glosa_goeje: gâteau enveloppé dans une feuille (papiamento de Curaçao)
    pagina_impresa: 115
    linea: "faire de la cassave f ayàka, gâteau enveloppé dans une feuille Papiamento (Curaçao) ayaka"
    verificado: en el OCR (no en imagen)
    lectura: >-
      la hallaca/ayaca del papiamento, comparada con el kalinago `ayaka`
      'hacer casabe' (habla de mujeres). Comparandum de esfera.
  veredicto: >-
    el «dialecte de Aruba» es Pinart-vía-Gatschet (1882/1885), ya en el repo;
    lo nuevo son el `chogogo` de Bonaire como voz caribe y el `ayaka` de
    Curaçao. Ninguna de las cuatro es caquetío del s. XV: son islas caquetías
    en el s. XIX.


# ══════════════════════════════════════════════════════════════════════
# 5. LO QUE NO SE ENCONTRÓ
# ══════════════════════════════════════════════════════════════════════
negativas:
- que: 'las ocho voces kalinago sin apoyo (§resumen_del_cruce)'
  como_se_midio: >-
    búsqueda de la forma con raíz corta sobre el `-layout` de pp. 31-120 y
    sobre el texto plano entero (k/c/s/š alternando), y del CONCEPTO por su
    glosa francesa; la línea del concepto se leyó en imagen. Un cero de forma
    con el concepto presente y otra voz al lado es un cero de la fuente, no
    de la consulta (regla 6).
- que: la errata de 1940
  como_se_midio: 'sigue en HTTP 500 (T10); no se volvió a intentar'
- que: la fuente del «dialecte de Bonaire»
  como_se_midio: >-
    Goeje no la da, y ni Gatschet (0 `chogogo`) ni la bibliografía final de
    Goeje (pp. 118-120, 0 `Bonaire`) la nombran. Queda abierta.

# ══════════════════════════════════════════════════════════════════════
# 6. PROPUESTAS (ninguna edita el lexicón; las decide Miguel)
# ══════════════════════════════════════════════════════════════════════
propuesta:
- id: k1
  que: poner `procedencia.obra goeje-1939` con su página a las 11 voces con apoyo
  coste: ninguno en el motor (es cita, no forma ni glosa)
- id: k2
  que: >-
    añadir el REGISTRO (hombres/mujeres) a las voces que lo tienen en Goeje:
    `kati`, `marisi`, `hiñaru` (mujeres); `barana`, `kalinagu` (hombres)
  coste: ninguno en el motor (va a `notas`)
- id: k3
  que: corregir la glosa de `hiñaru` de 'persona' a 'mujer (habla de mujeres)'
  coste: mueve una glosa del canon → curación
- id: k4
  que: >-
    las ocho sin apoyo en Goeje: buscarles otra fuente (Breton 1665 directo,
    Taylor 1977) o bajarlas a `deuda: sin-procedencia`; `kasabi`, `yuka` y
    `hamaka` son además la voz TAÍNA del concepto con la etiqueta cambiada
  coste: >-
    si alguna de las ocho está entre las candidatas de `[Voces de fuera]`, el
    prompt cambia; hay que medirlo antes
- id: k5
  que: '`kalinagu` y `kalínagu` son la misma voz: fundirlas'
  coste: una clave menos
- id: k6
  que: >-
    anotar en `kati`/`kasi` del caquetío el comparandum kalinago de mujeres
    `kati`/`kaši` (Goeje p. 54) y eyeri `Kati`/`Kachi` (Bachiller p. 388)
  coste: ninguno (comparandum en notas)


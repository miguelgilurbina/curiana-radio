# ─────────────────────────────────────────────────────────────
# GENERADO por 6-fusion/scripts/derivar_escena_por_lugar.py --canon
# No se edita a mano: se edita el script (la tabla ESCENA, las
# reglas de clase, CAMINOS_COMPARTIDOS) y se regenera.
# De aquí sale curiana_sim/curiana_escena_era2.py
# (6-fusion/scripts/generar_escena_era2.py).
# ─────────────────────────────────────────────────────────────
meta:
  fecha: '2026-09-17'
  estado: 'DECIDIDO por Miguel el 2026-09-17 (las diez preguntas de §7 del diseño). Es el
    canon de la escena: de aquí sale curiana_sim/curiana_escena_era2.py.'
  quien: escriba (Claude), con las decisiones de Miguel
  lee: 6-fusion/issues-pendientes/existir-en-el-mundo-escena-por-lugar-2026-09-17.md
  medido_por: python 6-fusion/scripts/derivar_escena_por_lugar.py --canon
  genera: python 6-fusion/scripts/generar_escena_era2.py
  derivado_de:
  - 6-fusion/elenco_era2.yaml
  - 6-fusion/sitios_era2.yaml
  - 6-fusion/clima_era2.yaml
  - 6-fusion/estructura_social_era2.yaml
  - 2-lengua/toponimos.yaml
  aviso: Ninguna fila se escribió agente a agente. La clase de oficio sale de `oficio` y `rol_en_la_casa`
    por palabras clave declaradas (§reglas_de_clase); el lugar sale de una plantilla resuelta
    con la ficha; quién anda por el camino compartido sale de los destinos que la ficha del
    mensajero nombra. Cambiar el elenco cambia esta tabla sin tocarla.
  propuesta_de_la_que_viene: 6-fusion/escena_por_lugar_propuesta_2026-09-17.yaml
decisiones_de_miguel:
  1: A — tabla por momento, con las excepciones que el canon fecha
  2: 'B — compartidos: el Capubana y el camino Moruy–Caseto («la alianza»)'
  3: 'A — las escenas que salgan, sin tope: un pescador solo en el agua es el dato'
  4: A — la ventana de 12 no cambia; la escena sólo dice dónde está cada uno
  7: A — `--capubana-cada N` declarado y sellado en la config (N = 3 en la primera cadena)
momentos:
- amanecer
- mañana
- mediodia
- tarde
- anochecer
- noche
periodos:
- viento
- seca_larga
- siembra

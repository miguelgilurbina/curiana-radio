nota_supidebo: >
  "Supidebo Coast, Shell mound 'C', aceramic shell lense beneath sterile sand
  and, in turn, beneath a ceramic shell lense." — estratigrafía sellada: capa
  de concha SIN cerámica bajo arena estéril bajo capa de concha CON cerámica.
  Es el tipo de secuencia que el registro de nodos necesitaría para declarar
  precontacto sin depender de superficie.

lo_que_esto_cambia:
  - >
    FAL-154 (Santa Ana, Paraguaná) tiene TRES dataciones propias, todas
    precontacto, cubriendo 1160-1451. Oliver llama a IVIC-14 "a terminal date
    of cal. A.D. 1415" y describe su cerámica Late Urumaco como "still
    lavishly decorated", en contraste con el estilo empobrecido contemporáneo
    de Supidebo-Antúnez. Es el nodo mejor sostenido del registro.
  - >
    FAL-100 tiene tres, dos en la ventana (1299-1424, 1280-1440) y una
    colonial (1521-1641): ocupación precontacto Y reocupación posterior.
  - >
    Ocho dataciones caen de lleno en la ventana simulada. Hasta hoy el registro
    de nodos no tenía NINGUNA para el continente.
  - >
    Las islas están igual de bien fechadas que la costa (Knip, Tanki Flip),
    lo que sostiene la esfera marítima con cronología, no solo con cerámica.

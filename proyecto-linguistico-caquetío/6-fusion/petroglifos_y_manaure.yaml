# 9. EL FILÓN DEL BOLETÍN — dónde buscar y qué hay ya localizado
# ══════════════════════════════════════════════════════════════════
filon_boletin:
  revista: "Boletín Antropológico, Universidad de Los Andes (Mérida). ISSN 1325-2610"
  cobertura: "números 50 (2000) a 101 (2021) — unos 50 boletines, acceso abierto"
  donde_buscar:
    - {via: "OJS de la ULA — el mejor, tiene buscador por texto", url: "http://erevistas.saber.ula.ve/index.php/boletin_antropologico"}
    - {via: "Colección completa en el repositorio SaberULA", url: "http://www.saber.ula.ve/handle/123456789/4223"}
    - {via: "Espejo en Redalyc, navegable por número", url: "https://www.redalyc.org/revista.oa?id=712"}
  terminos_de_busqueda: [caquetío, Falcón, Paraguaná, Coro, petroglifos, arte rupestre, toponimia, dabajuroide, Manaure]
  ya_localizados:
    - obra: "Registro y documentación de los petroglifos de la quebrada de Chirache-Buenevara, Estado Falcón"
      autor: "Zavala Reyes"
      url: "http://erevistas.saber.ula.ve/index.php/boletin_antropologico/article/view/21037/0"
      por_que: >-
        ⭐ MISMO AUTOR que zavala-reyes-2015, la fuente que sostiene el 74% de
        las citas del lexicón. Petroglifos de Paraguaná, con registro y
        documentación — material directo para la esfera ARTE, y de un autor
        cuya cadena de custodia el proyecto ya auditó.
    - obra: "Panorama geológico, paleontológico, arqueológico, histórico y mitológico del estado Falcón"
      autor: "Morón, Camilo"
      url: "http://erevistas.saber.ula.ve/index.php/boletin_antropologico/article/view/21065/0"
      por_que: >-
        Del mismo autor de la fuente que acabamos de minar, pero de alcance
        mucho mayor: cubre arqueología, historia y mitología de Falcón entero.
  nota: >-
    ⭐ Dos de las fuentes más útiles del proyecto salen de esta revista
    (zavala-reyes-2015 nº 89 y moron-2012 nº 84). Acceso abierto, con capa de
    texto, sin OCR. Es la vía de adquisición más barata identificada hasta hoy.


# 4. VOCES QUE APARECEN
# ══════════════════════════════════════════════════════════════════
voces:
  - {forma: tamudi, glosa: "abuelos (en los Llanos)", via: "Antolínez, referido a la voz Zaquitios", nota: "apelativo genérico para los indígenas: 'los viejos'. Clarac da 'Taitas' para Mérida"}
  - {forma: urupagua, glosa: "Aveledoa nucifera — árbol de nuez amarga, 'muy apreciada en todo Falcón desde tiempos antiguos'", nota: "da nombre a Los Urupaguales; candidata para el mapa de ecología"}
  - {forma: manare, glosa: "serpiente blanca de los ríos falconianos, llamada también 'príncipe'", nota: "homófono del título Manaure; ver manaure-en-la-tradicion-viva"}

# ══════════════════════════════════════════════════════════════════
# 5. UNA ESFERA QUE EL PROYECTO NO TIENE
# ══════════════════════════════════════════════════════════════════
esfera_nueva:
  propuesta: >-
    Los petroglifos son EXPRESIÓN SIMBÓLICA ATESTIGUADA MATERIALMENTE — no
    lengua, pero sí producción de sentido del mismo pueblo, con geografía,
    estilos y cronología propios. El corpus tiene creencia, ecología,
    parentesco, transmisión y geografía política; no tiene arte.
  lo_que_habria_que_decidir: >-
    Si entra como esfera propia, como subconjunto de creencia, o solo como
    capa geográfica sobre asentamientos.yaml.
  estilos_por_region:
    - {region: "costa y sabana árida", motivos: "geométricos y abstractos"}
    - {region: "serranía (Sierra de San Luis)", motivos: "rostros cuadrangulares, espirales, círculos concéntricos y radiados, predominio antropomorfo"}
    - {region: "Piedra Grande (Mun. Democracia)", motivos: "las 'ranitas', como las documentadas en Táchira"}
  aviso: >-
    ⚠️ Ningún petroglifo está datado en este artículo. La asociación
    petroglifo↔caquetío es de contigüidad geográfica, no de datación. Falcón
    tuvo ocupación anterior y posterior: Taima-Taima es paleoindio.


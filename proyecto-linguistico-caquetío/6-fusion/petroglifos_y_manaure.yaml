# 6. LO QUE ESTA FUENTE ABRE
# ══════════════════════════════════════════════════════════════════
seguimiento:
  - id: filon-boletin-antropologico
    hallazgo: >-
      ⭐ Morón 2012 y [[zavala-reyes-2015]] salen de la MISMA revista: el
      Boletín Antropológico de la Universidad de Los Andes (ISSN 1325-2610),
      números 84 y 89. Dos de las fuentes más útiles del proyecto, de la misma
      publicación, ambas en abierto vía Redalyc/SaberULA.
    accion: >-
      Barrer el índice del Boletín buscando Falcón, caquetío, Paraguaná, Coro,
      arte rupestre y toponimia. Es la vía de adquisición más barata
      identificada: acceso abierto, sin OCR, con capa de texto.
  - id: hernandez-bano-2000
    obra: "HERNÁNDEZ BAÑO, Adrián (2000): Petroglifos. Estado Falcón. Litografías López, Coro"
    nota: >-
      Pionero del registro sistemático de estaciones en Falcón. ⚠️ Morón avisa:
      "hay que reconocer en Hernández Baño una tendencia literaria dada a la
      hipérbole". Y su etimología quechua de Cabure ya quedó descartada.

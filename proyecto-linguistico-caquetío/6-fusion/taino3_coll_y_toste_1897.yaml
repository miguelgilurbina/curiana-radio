  texto: El fruto con que se alimentaban los indíge- nas en ultratumba, según fray Román Pane. La pobre
    fanta- sía de los indo-antillanos no pudo llegar a crear la ambrosía del paganismo para el sostenimiento
    del alma material; ni tampoco remontarse a la concepción metafísica de los semitas (hebreos) y mantener
    la inmortalidad del soplo divino, mediante la pro- pia inmortalidad y unidad. Para los arios el alma
    era material , aunque etérea; y también para los griegos. Para los romanos (Tertuliano) venía a ser
    una cosa parecida a la actual creación del peri-espíritu de Alian Kardec y sus discípulos.

- forma_fuente: Cartb
  glosa_fuente: Don Martín Fernández Navarrete, en 1825, anotando el Diario de navegación del Almirante,
    conservado por Las Casas, fue el que aplicó por vez primera esta palabra Ca- ri/, a la isla
  texto: Don Martín Fernández Navarrete, en 1825, anotando el Diario de navegación del Almirante, conservado
    por Las Casas, fue el que aplicó por vez primera esta palabra Ca- ri/, a la isla de Puerto- Rico;
    pero con documentos de cronistas y cartógrafos hemos probado ser Ronquen el verdadero nom- bre indígena
    de la isla de Puerto Rico. Don Manuel Felipe Castro y don Juan Manuel Echevarría, el ano de 1854,
    en sus cantos épicos consagrados al asedio británico de esta ciu- dad en 1797, volvieron a cometer
    el error de Navarrete. Y el padre Nazario {Oi?. cit.) a seguirles en esta equivocación.

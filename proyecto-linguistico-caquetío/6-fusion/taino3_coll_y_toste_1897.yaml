- forma_fuente: Guayacán
  glosa_fuente: Arbol medicinal.
  texto: 'Arbol medicinal. Los cronistas le llaman palo santo , porque el cocimiento de su corteza se
    aplicaba por los conquistadores a combatir el mal de las bubas. (Oviedo). Hay el guayacum afjicinalis
    y el lygophyllum arboreum, cuyas cor- tezas tienen propiedades sudoríficas. Dice Las Casas: el palo
    de la isla de San Juan se tiene por mejor, no sé si es de la misma especie del desta isla (La Española)
    o de otra quelitera en cualidad, al qual llaman los españoles el palo santo . Los pri- meros pobladores,
    para combatir la enfermedad de las bubas (sífilis) bebían por agua común el cocimiento de la corteza
    del guayacán y se ponían a dieta de yemas de huevo y casa e, y cada quince días un purgante.'

- forma_fuente: Anacaona
  glosa_fuente: Célebre cacica haytiana, hermana del cacique Bojekio y mujer del cacique Caonabó.
  texto: 'Célebre cacica haytiana, hermana del cacique Bojekio y mujer del cacique Caonabó. Pedro Mártir
    (Déc. III lib. IX cap. II) dice: “a Anacaona se la reputaba entre los más egregios vates para componer
    areytos o ritmos ” . Por orden de Ovando fue aprisionada y ahorcada en Santo Do- mingo, no obstante
    haber encarecido Isabel la Católica, que esta cacica fuera respetada. Su nombre significa flor de
    oro, según Bachiller y Morales (Ob. cit. p. 200); pero nosotros dudamos que ana signifique flor.'
  pagina_impresa: 184

  glosa_fuente: Bueno.
  texto: 'Bueno. Dice el doctor Chanca: E llegándose alguna barca a tierra a hablar con ellos, diciéndoles
    tayno, tay- m que quiere decir bueno \ Bachiller y Morales aplica este nombre a los indo-antillanos,
    en general, para oponerlo al de Caribe. Los caribes insulares procedían de los caribes del Con- tinente;
    y los otros indígenas, anteriores a los caribes en la ocu- pación del Archipiélago antillano, venían
    de los Aruacas de Tie- rra Firme; por lo tanto, lo natural y lógico es llamarles los Aruacas insulares;
    y al determinarlos decir haytianos, quisque- yanos, ciguayos, boriqueños, siboneyes, xamayquinos,
    etc., se- gún la isla.'

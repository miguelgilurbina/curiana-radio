  texto: Según Oviedo, llamaban así los hay- tianos, a la india que viva, se enterraba con el cadáver
    del ca- cique. Cuando murió Bojekio, régulo de X aragua, en Hay tí, la más hermosa de sus mujeres,
    llamada Guanajatabenekena, y dos compañeras más fueron enterradas vivas con el cadáver del célebre
    cacique. Pedro Mártir (Dec. 3. , lib. IX, cap. II) escribe Guanahattabenechena, y añade “que en toda
    la isla no había otra tan hermosa”.

- forma_fuente: Babeque
  glosa_fuente: Vocablo indo-antillano que ha dado origen a varias interpretaciones.
  texto: 'Vocablo indo-antillano que ha dado origen a varias interpretaciones. El Diario de Colón (lunes
    12 de no- viembre) dice: “partió del puerto y río de Mares, al rendir al quarto del alba para ir a
    una isla, que afirmaban los indios que traía, que se llamaba Babeque, adonde, según dicen por señas,
    que la gente della coge el oro con candelas de noche en la playa y después con martillo diz que hacían
    vergas dello, y para ir a ella era menester poner la proa al Leste quarta del Sueste... No se quiso
    detener... para ir demanda de Babeque . Hoy se aplica esta palabra a la isla Grande Inagua. Para unos
    escritores, los indios que informaban a Golón, se referían a Sabito Domingo; para otros a Costa Firm
    […]'

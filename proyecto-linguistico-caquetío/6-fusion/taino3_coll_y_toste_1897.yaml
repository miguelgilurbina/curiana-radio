  glosa_fuente: El quinto y último cacicazgo de Santo Domin- go, en la parte E. y S. E. de la isla, subdividido
    en las poblacio- ciones de Asua, Mamex, Bonao, Cayemú, Cacao, Hicayagua y Boyá.
  texto: El quinto y último cacicazgo de Santo Domin- go, en la parte E. y S. E. de la isla, subdividido
    en las poblacio- ciones de Asua, Mamex, Bonao, Cayemú, Cacao, Hicayagua y Boyá. Este cacicazgo también
    tenía el nombre de Iguayagua. Su régulo era Cayacoa y más tarde Cotubanamá. Tenía de 45 a 50 leguas
    de costa de mar y de 25 a 30 leguas de territorio hacia el Sur y 30 leguas de tierra adentro. Regado
    por los ríos Ozama, Yamasá, Guabanimo (hoy Isabela), Quabón, Yuma, Yabacoa, Anamuya, Jaina y Sabita
    (Jiguero).

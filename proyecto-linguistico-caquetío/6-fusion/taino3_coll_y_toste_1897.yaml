  glosa_fuente: Variedad de liabas llevan este nombre, Oviedo y Las Casas escriben Bexuco.
  texto: 'Variedad de liabas llevan este nombre, Oviedo y Las Casas escriben Bexuco. Servían a los indios
    como cuer- das y para medicinarse. Las Casas (t. v. p. 320) dice: “Otra cosa para purgar, no sé para
    qué enfermedades, hay en esta isla, e sospecho que debe de ser para males de flema, e esta es una
    correa o raiz, no porque esté debajo de tierra, sino que tiene su raiz debajo della y encarámase por
    los árboles de la manera de la hiedra, e así parece algo, no en la hoja, porque no la tiene, sino
    en parecer correa e encaramarse como la hiedra; llamábanla los indios bexuco, la penúltima sílaba
    luen- ga. Pueden atar cualquiera cosa con ella, como una cuerda, porque es nervosa e tiene 20 ó 25
    brazas e […]'

- forma_fuente: Batata
  glosa_fuente: Pedro Mártir (Dec.
  texto: 'Pedro Mártir (Dec. II, lib. X, cap. I) dice: “Cavan también de la tierra unas raices, que nacen
    naturalmente, y los indígenas llaman batatas; cuando yo las vi, las juzgué nabos de Lombardía o gruesas
    criadillas de tierra. De cualquier modo que se aderecen, asadas o cocidas, no hay pasteles ni otro
    ningún manjar de más suavidad y dulzura”. Las Casas (t. v. pág. 307 y 308) anota: “Hay otras raíces
    que llamaron los indios ajes o batatas”, Y llama yucaba la planta que produce la batata. Oviedo da
    los nombres indios de seis variedades: amguamar , atibumex, guaraco, guacara, cayca y guananagax .'

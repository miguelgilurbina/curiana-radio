- forma_fuente: Casabe
  glosa_fuente: El pan indo-antillano hecho de la harina de la yuca brava.
  texto: 'El pan indo-antillano hecho de la harina de la yuca brava. Colón en su Diario dice: “Miércoles
    26 de Di- ciembre. El rey Guacanagarí comió en la carabela con el Al- mirante, e después salió con
    él a tierra, donde hizo al Almiran- te mucha honra e le dió colación de dos o tres maneras de ajes
    e camarones e caza e otras viandas quellos tenían e de su pan, que llamaban cazabí. ” Las Casas anota:
    “tornando al pan, que los indios llaman cazabí” . Pedro Mártir (Déc. 1 lib. IX, cap. V) dice: “pidiendo
    cazabí, es decir, pan”. En árabe existe el vocablo kasabe, significando caña de azúcar, según Eguilaz;
    pero nada tiene que ver un vocablo con otro.'

- forma_fuente: Areyto
  glosa_fuente: Canción romancesca, acompañada del baile.
  texto: 'Canción romancesca, acompañada del baile. Pe- dro Mártir (Dec. III, lib. VII, cap. II) dice:
    “ambas cosas de preceptos (origen y sucesión de las cosas y hazañas de sus padres) las tienen compuestas
    en ritmos, en su lengua; a su modo cantan los areytos y danzan al son del cantar. También tienen areytos
    de amores, y otros lastimeros, otros bélicos, con sus respectivas sonatas acomodadas”. Entre los populares
    de Hay tí, según Guridi, había el areyto ijí, aya, bcngbé: pri- mero, muerto que siervo. Si las dos
    primeras palabras llevan radicales indo-antillanas, la tercera parece africana. Creemos que esta canción
    pertenece a la época en que los negros empe- zaron a alzarse en La Española y a irse […]'

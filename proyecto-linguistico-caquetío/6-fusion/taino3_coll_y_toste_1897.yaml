  glosa_fuente: 'Piso alto de tablas de palma de yagua, para guardar frutos, granos, etc.: servía también
    de camastro.'
  texto: 'Piso alto de tablas de palma de yagua, para guardar frutos, granos, etc.: servía también de
    camastro. Ovie- do (libro VII, cap. I) dice: “Así como el maiz va creciendo tienen cuidado de lo deshervar,
    hasta que esté tan alto que señoree la hierva; e cuando está bien crecido es menester po- nerle guarda,
    en lo qual los indios ocupan los muchachos, e a este respecto los hacen estar encima de los árboles
    e de anda- mios que les hacen de madera e cañas e cubiertos con ramadas por el sol e el agua, e a
    estos andamios llaman barbacoas” .'

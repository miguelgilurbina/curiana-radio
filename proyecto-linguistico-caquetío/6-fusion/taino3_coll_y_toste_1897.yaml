  texto: Nombre del cacique principal de Boriquén, cuando visitó la isla Juan Ponce de León en 1508. Nombre
    también de otro cacique, que en 1514 se encomendó a las haciendas e minas e granjerias del Rey, en
    Santo Domingo, y se llamaba Francisco de Agüeybana, de la Saona, con 154 per- sonas. Las Casas dice,
    que a la provincia Cayacoa, de Haytí, se a llamaba también Agüeybana. Fray Iñigo anota errónea- mente
    en su Historia de Puerto Rico, Agüeynaba. Es fácil que esta equivocación venga del impresor Valladares,
    que editó la obra de Abbad por vez primera en Madrid, no pudiendo el celebre benedictino corregirla.

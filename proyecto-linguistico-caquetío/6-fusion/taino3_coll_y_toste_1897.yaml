- glosa_fuente: Indio
  forma_fuente: Los del alto Maroní, del Varí y del Paró, cono- cidos con el nombre de Rucuyanos, se llaman
    entre sí guayana
  comparanda: null
  resto: 'el indio de Panamá, guanú el de Chapura, guaque el de Chin- ga (Venezuela), bakairí el de Cuba,
    siboney el de la bahía de Samaná, ci guayo el caribe insular, calinago el galibe, calma. El aruaca
    llamaba al caribe continental kalipina y se aplicaba a sí mismo el apelativo luku , y decía: kahpina
    guaraúna abáka makúrkia luku uburia: el caribe y el aruaca son de dos nacio- nes diferentes.'
  pagina_impresa: 162
  capitulo: X

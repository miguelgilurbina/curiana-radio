  texto: 'Una raíz indo-antillana. La usaban los indígenas principalmente como prefijo y sufijo. Como
    prefijo equivalía al artículo el, la lo; y como sufijo a la preposición de. Así como decimos en castellano
    el Quijote, el Cid, el Rey, el Guadalqui- vir, el Ebro, etc., ellos, aglutinando el artículo al nombre,
    de- cían Guacanagarí, Guarionex, Guatiguaná para designar sus régulos, y Guaorabo, Guamaní, Guaynabo,
    para indicar sus ríos. Como sufijo tenemos Xaragua, equivalente a de Jara, Ani- guayagua, de Aniguaya,
    Macaguamgua, de Macaguaní, etc. Pedro Mártir (Dec. III, lib. VII, cap. III) dice: “ Gua es entre ellos
    artículo.” También gua equivale, otras veces, a lugar o sitio.'

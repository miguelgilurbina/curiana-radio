- forma_fuente: Jamayca
  glosa_fuente: Pedro Mártir (Dec.
  texto: 'Pedro Mártir (Dec. 1. , lib. III, cap. III) dice: “al lado meridional de Cuba encontró el Almirante
    primeramente la isla que los indígenas llaman Jamayca . En la información que Colón hizo practicar
    ante el escribano de la nave que él capitaneaba, cuando reconoció el sur de Cuba, se lee: “y siguió
    la costa della (Cuba) al occidente de la parte del Austro, para ir a una isla muy grande, que los
    indios llaman jamayca , la qual falló, después de haber andado mucho ca- mino e le puso por nombre
    la Isla de Santiago . Significa: Lugar grande con agua, ja, por gua, equivalente a he aquí, ma, grande;
    y por ni, agua; ca por coa, lugar, sitio.'

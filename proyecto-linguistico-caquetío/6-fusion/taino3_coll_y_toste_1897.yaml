- forma_fuente: Cuba
  glosa_fuente: Nombre de la mayor de las islas del Archipiéla- go antillano.
  texto: 'Nombre de la mayor de las islas del Archipiéla- go antillano. Bachiller y Morales (ob. cit.
    p. 255) manifiesta, que la significación de la palabra no está determinada. Opi- namos, que significa,
    sitio grande. El vocablo tiene dos raíces indo-antillanas: coa, lugar o sitio, y baña, grande. Aglutinadas
    estas dos raíces resulta coabana. La fermentación del vocablo trae cuabana, como tenemos en Puerto
    Rico coamo y cuamo, designando un río, y un lugar de la isla. El polisintetismo trae la contracción
    de la palabra y tenemos entonces cuaba y cuba finalmente. Pedro Mártir, en su carta CLXIV a Pomponio
    Le- to, dice: “Esta región de anchura desigual, que los indígenas llaman Cuba. ”'

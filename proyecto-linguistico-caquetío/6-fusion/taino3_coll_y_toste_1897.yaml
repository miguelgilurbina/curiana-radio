    los indígenas llaman manatí" . Las Casas (t. v. p. 304) dice: “Hay en este mar, en especial por estas
    islas, a la boca de los ríos, entre el agua salada y dulce, peces que llamaban los indios manatíes,
    la penúltima sílaba luenga”.'

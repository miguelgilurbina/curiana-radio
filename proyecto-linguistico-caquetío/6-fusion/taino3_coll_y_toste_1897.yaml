  texto: Lugar de Añasco, Puerto Rico. Entre este barrio y el de Playa se encuentran en una gran extensión
    de terrenos, los escombros del primitivo San Germán, fundado allí en 1511, por orden del virrey don
    Diego Colón, gobernador de La Española, a orillas del Guaorabo, hoy río Grande de Añas- co. Punto
    histórico, algo dudoso, y negado por algunos escri- tores puertorriqueños, y cuyas pruebas hemos desarrollado
    extensamente en nuestro Repertorio histórico de Puerto Rico , página 6.

  glosa_fuente: Faldellín de algodón, que de media cintura abajo usaban las indias casadas.
  texto: 'Faldellín de algodón, que de media cintura abajo usaban las indias casadas. Dice Fernando Colón
    (cap. XXIV): “las mujeres andaban cubiertas con una fajilla de algodón e otras con un paño tejido,
    que parecía tela”. Oviedo ( lib . III, cap. V) dice: “Las mujeres andan desnudas e desde la cinta
    abajo traen unas mantas de algodón fasta la mitad de la pan- torrilla, e las cacicas e mujeres principales
    fasta los tobillos. Este hábito traían las que eran casadas, las doncellas ninguna cosa traían destas
    mantas, que llaman naguas”. El vocablo ha pasado al español convertido en enagua.'

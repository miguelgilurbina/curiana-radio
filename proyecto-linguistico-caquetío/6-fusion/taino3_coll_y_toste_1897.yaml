  glosa_fuente: I, lib, II, cap.
  texto: 'I, lib, II, cap. VI) dice: “ llaman al rey cacique Juan Ignacio de Armas en sus Orígenes del
    lenguaje criollo (Habana, 1882), siguiendo a Fr. P. Simón (Noticias historiales) cree que el vocablo
    cacique procede del árabe. Eguilaz en su Glosario etimológico de las palabras españolas de origen
    orien- té, Granada, 1886, no la consigna. El árabe tiene al-qadi, juez: de donde procede nuestra voz
    alcalde; al-qaid, jefe ca- pitán: que origina nuestra palabra alcaide; cheikl, señor; charif , noble;
    ualí, gobernador; al-wazir, el vizir: de donde viene nuestro alguacil; al-fans, el caballero, que
    trajo nuestro alférez, etc., pero cacique es voz indo-antillana.'

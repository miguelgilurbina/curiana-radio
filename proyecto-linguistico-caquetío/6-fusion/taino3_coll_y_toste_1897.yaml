- forma_fuente: Alcatraz
  glosa_fuente: Algunos escritores modernos han cometido el error de creer que esta voz procedía del lenguaje
    indo-anti- llano.
  texto: 'Algunos escritores modernos han cometido el error de creer que esta voz procedía del lenguaje
    indo-anti- llano. Se aplica al pelícano. Pedro Mártir (Dec. VI lib. VIII cap. II) dice: “A estas aves
    llamaban los españoles alcatraces” . En árabe existen las palabras alca jal, caparazón, alcafaz ,
    jaula, alear toz, cucurucho de papel. Dada la figura del alcatraz, puede proceder este nombre de algunas
    de las voces árabes citadas.'

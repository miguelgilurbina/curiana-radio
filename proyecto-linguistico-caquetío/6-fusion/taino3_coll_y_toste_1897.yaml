- forma_fuente: Batú
  glosa_fuente: La pelota.
  texto: 'La pelota. Las Casas (t. v. p. 307) dice: Era bien de ver cuando jugaban a la pelota, la qual
    era como las de viento nuestras, al parecer; mas no quanto al salto que era mayor que seis de las
    de viento; tenían una plaza comunmente ante la puerta de la casa de su señor, muy barrida, tres veces
    más luenga que ancha, cercadas de unos lomillos de un palmo o dos de alto; salir de los quales lomillos
    la pelota era falta. Poníanse 20 e 30 de cada parte, a la luenga de la plaza. Cada uno ponía lo que
    tenía, no mirando que valiese mucho más lo que el uno más que el otro a perder aventuraba; e así acaecía,
    después que los españoles llegamos, que ponía un cacique un sayo de grana e otro metía un paño v […]'

- forma_fuente: Macana
  glosa_fuente: Garrote grueso de madera.
  texto: 'Garrote grueso de madera. Arma ofensiva de los indígenas. Según Pichardo, procede la palabra
    de pirama, cerca de Popayán. Nosotros opinamos, que es de origen indo- antillano, porque lo son sus
    raíces ma y cana. Las Casas (t, v. p. 331) dice hablando de las palmas de yagua; “desta madera hacían
    los indios las que llamaban macanas” . Vargas Machuca ( Milicia indiana, t. 1.'', p. 38) dice: “Usan
    también unas maca- nas como montantes o espadas de mano, son de palmas y juéganlas a dos manos”. Es
    un ertor de Bachiller y Morales el anotar que los indo-antillanos le incrustaban espinas y pe- dernales.
    Es confundir la azagaya con la macana. Los indios mexicanos incrustaban a sus macanas pedacitos cort
    […]'

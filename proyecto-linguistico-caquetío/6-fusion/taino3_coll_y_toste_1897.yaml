  texto: Nombre de la primera población de españo- les, año de 1508, en Puerto Rico. Algunos escritores
    moder- nos cometen el error de creer que es el vocablo de origen indio. La palabra es castellana y
    corresponde a la señal que se da cuando se hace algún ajuste. Este nombre se lo puso Juan Ponce de
    León a la primera población en el Boriquén, por orden del Comendador Ovando, gobernador de La Española
    en esa época; y el Rey mandó, que se cambiase por el de Cibdad de Puerto Rico , que llevó hasta 1521,
    en el lugar llamado hoy Pueblo Viejo , en la jurisdicción de Bayamón.

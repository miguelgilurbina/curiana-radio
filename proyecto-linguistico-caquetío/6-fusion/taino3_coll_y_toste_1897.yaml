- forma_fuente: Ají
  glosa_fuente: (Capsicum).
  texto: '(Capsicum). Planta de la cual hay varias especies. Pedro Mártir (Dec. 3 libro. IV cap. III)
    dice: "Digamos ahora un poco acerca de la pimienta de las islas y del Continente. Tienen selvas llenas
    de frutales, que crían pimienta: pimienta digo, aunque no lo es, porque tiene la fortaleza y el aroma
    de la pimienta, ni vale menos que la pimienta aquel grano; ellos le llaman haxí, con acento en la
    final: es más alta que la ador- midera. Se cogen sus granos como los del enebro o el abeto, aunque
    no llegan a ser tan grandes. Hay dos especies de aquel grano; cinco dicen otros: la una es de largo
    como dedo y me- dio de hombre; más picante y aguda que la pimienta; y la otra es redonda y no menor
    en for […]'

  glosa_fuente: El almidón sacado de la yuca.
  texto: 'El almidón sacado de la yuca. Dice Echa- goian (Relación de las cosas de la isla Española, 1561):
    “De la flor de la harina desta raíz (la yuca), que se llama anaiboa, se hace un potaje con leche,
    como manjar blanco, que es muy sabroso”. No debe confundirse este vocablo con naiboa, que es el jugo
    venenoso de la yuca, como lo ha hecho un escri- tor moderno.'

  texto: 'Dice Gomara: “Probó la tierra (Haytí) a los es- pañoles con muchas maneras de dolencias, de
    las quales dos fueron perpetuas: bubas, que hasta entonces no sabían qué mal era; e mudanza de color
    amarillo, que parecían azafrana- dos”. Y más adelante añade: “Desde aquella fortaleza (Santo Tomé

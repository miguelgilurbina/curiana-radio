  glosa_fuente: Palabra de origen mexicano.
  texto: Palabra de origen mexicano. Corrupción de atotli. Primeramente, se hacía de harina de maíz, después
    de sagú, y hoy de maranta. Viene a ser un caldo, o compuesto farináceo, hecho de una cucharadita de
    harina, una cucharada de azúcar y cinco o seis onzas de agua; una vez hervido toma punto ge- latinoso.
    Hoy se le suele aromatizar con un poco de agua de azahar; y hasta se le mejora agregándole leche de
    vaca.

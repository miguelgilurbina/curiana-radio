- forma_fuente: Maisí
  glosa_fuente: El maíz.
  texto: 'El maíz. Algunos escritores antiguos anotan mahiz, entre ellos, Oviedo. Pedro Mártir (Dec. 1,
    lib . I, ca- pítulo III) dice: “a esta clase de trigo le llaman maíz" . Las Casas narra: “Sembraban
    y cogían dos veces al año, el grano que llamaban mahiz, no para hacer pan dél, sino para comer”. El
    indo-antillano comía el maíz tostado, el indio de Tierra Firme hacía pan de maíz, moliéndolo en un
    mortero de piedra y haciendo tortas llamadas arepas. Fernando Colón (capítu- lo XXVII) dice: “y otro
    grano que llamaban maíz" . La h in- terpolada por Las Casas y Oviedo induce a creer que el voca- blo
    original fuese majisí.'

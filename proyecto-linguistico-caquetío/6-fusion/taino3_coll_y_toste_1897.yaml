    Cahaya y la islita Guanabo. Las Casas escribe Xaragua. Anotamos, de paso, que al hablar de La Española
    en su período indígena la llamamos indistintamente Santo Domingo o Haytí, sin fijarnos en los límites
    posteriores de estas dos Repúblicas, que constituyen hoy dos nacionalidades distintas.

  texto: 'Dice el Diario de Colón: “(Lunes 17 de di- ciembre). Vieron a uno, que tuvo el Almirante por
    goberna- dor de aquella provincia, que lo llamaban Casique” . Y, en martes 18 de diciembre, anota:
    “Este vino a la nao, después del rey, al cual dio el Almirante algunos de los rescates, y allí supo
    que al rey llamaban en su lengua Casique” . En la carta del doctor Chanca se lee: “Vienen aquí continuamente
    muchos indios, e cauques con ellos, que son como capitanes dellos, e muchas indias”. Las Casas escribe
    cacique. Oviedo (libro II, cap. VI) dice: “E allí salió el Almirante con toda su gente, e luego vinieron
    a habla e conversación con los chrystianos muchos indios de paz de aquella tierra, la qual […]'

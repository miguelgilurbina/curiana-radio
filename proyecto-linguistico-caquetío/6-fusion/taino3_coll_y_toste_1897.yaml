  texto: 'Uno de los ammalejos encontrados por los espa- ñoles en las grandes Antillas, Pichardo describe
    las varieda- des de Cuba, En Puerto Rico parece no la había. En el infor- me del bachiller Santa Clara
    al rey Felipe 11, describiendo la isla de San Juan, en 1.582, hay una palabra, por desgracia mal recogida
    por el copista, que induce a creer la hubiera. Dice así el cronista: “cinco leguas más arriba a la
    costa se halla una baya honda, buen puerto, que llaman Mosquita!, mar muerta, pueden surgir en él
    nabtos de cualquier parte, es arena limpia, haze el abrigo una vsleta que tendrá de amphdo tres quartos
    de legua, llámase Y sla de Antias; púsosele este nombre por unos animalejos que hay en ella a […]'

- forma_fuente: Burén
  glosa_fuente: Especie de hornillo de barro cocido para pre- parar el casabe.
  texto: 'Especie de hornillo de barro cocido para pre- parar el casabe. Dice Las Casas: “la harina, así
    limpia e apa- rejada, tienen ya los hornos calientes, tres e quatro, si quieren hacer cantidad de
    pan; estos hornos son como unos suelos de lebrillos en que amasan e lavan las mujeres de Andalucía;
    son hechos de barro, redondos e llanos; de dos dedos en alto, como una rodela grande, toda llana;
    llamábanlos burén, aguda la última. Tiénenlos puestos sobre tres o quatro piedras, e de- bajo todo
    el fuego que cabe.”'

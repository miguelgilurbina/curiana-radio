- forma_fuente: Auyama
  glosa_fuente: La calabaza común en Hay tí, según García y Bachiller y Morales.
  texto: La calabaza común en Hay tí, según García y Bachiller y Morales. Las Casas no hace referencia
    que el aborigen la cultivara. Oviedo (lib. VII, cap. VIII) confunde la calabaza alimenticia ( cucúrbita
    pepo) con la candungo o marimbo ( cucúrbita lagenaira o moschata) y con el fruto totumo o p güero
    ( crecentia cu je te). Probablemente, después de importada la calabaza alimenticia por los españoles
    y multipli- carse prodigiosamente, los indígenas le pusieron el nombre de auyama. No es de extrañar
    este error, cuando todavía hay escritores modernos que creen que los cocos y los plátanos eran naturales
    en las Antillas, antes del Descubrimiento.

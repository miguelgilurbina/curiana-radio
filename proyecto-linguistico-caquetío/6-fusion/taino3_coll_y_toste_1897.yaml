  texto: Una variedad de piña. ytfw— Árbol S llamaban los indo-antillanos a las bu- bas Según el padre
    R. Bretón (1666) también los caribes in- sulares le llamaban así. Es el pénftgo de la enfermedad cons-
    titucional la sífilis; viene a ser una determinación epidérmica de la dolencia. Oviedo, y los que

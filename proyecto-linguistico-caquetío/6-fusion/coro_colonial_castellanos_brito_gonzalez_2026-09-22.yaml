# ══════════════════════════════════════════════════════════════════════════
# 2. GONZÁLEZ BATISTA 2002 — «Coro: el problema de la fundación»
#    Bol. Acad. Nac. Historia (Caracas) 85 (338): 147-172. NUEVA en el repo.
# ══════════════════════════════════════════════════════════════════════════
gonzalez_batista_2002:
  que_es: >-
    Discurso de incorporación como socio correspondiente en Falcón. Trata la
    FECHA y el LUGAR de la fundación de Coro, no el nombre: espina 0, cardón 0,
    viento 0, Paragua- 0, tococoro 0 (medido sobre el .txt). Pero trae la
    etnohistoria de Coro mejor documentada del repo: probanza de 1680, Cey,
    Ballesteros, Díez de la Calle, la primera acta municipal (1529).
  hechos:
    - id: m7-gb02-001
      afirmacion: >-
        «Coriana» es la forma que usan los documentos para la provincia o el
        territorio: la capitulación de Enciso (dic. 1526) exceptúa «al
        cacique de Coro y Coriana», encomendados a Ampiés; Oviedo y Baños
        (1723) funda Santa Ana de Coro «por ser en la provincia de Coriana»; y
        el Memorial de Díez de la Calle (1646) dice de Coro «que los Yndios
        diçen coriana».
      cita_corta: '«…ciudad de coro que los Yndios diçen coriana de Veneçuela»'
      obra: gonzalez-batista-2002-fundacion
      pagina_impresa: '157 (Enciso); 150 (Oviedo y Baños); 166 (Díez de la Calle)'
      via: >-
        Enciso: declaración de Honorato Vicente, 1533, citada por Ramos 1978
        p. 252; Díez de la Calle: Biblioteca Nacional de Madrid, ms. 3010,
        f. 54v. Verificado en imagen, p. 166.
      epoca: colonial   # 1526-1646
      etiqueta: atestiguado
      destino: 2-lengua/toponimos.yaml toponimo-111 (lecturas, eje referente) y D2 (#33)
      valor: >-
        Primera fuente del repo que dice QUIÉN decía «Coriana»: los indios, en
        1646. Y «Coro y Coriana» en la misma cláusula de 1526 separa el
        pueblo del cacique de la provincia, como Arcaya p. 169.
    - id: m7-gb02-002
      afirmacion: >-
        Manaure residía en el pueblo de Coro, no en Todariquiba: Cey (en Coro
        desde 1545, con servidumbre caquetía) escribe que el señor del llano,
        Manaure, estaba en el pueblo de Coro en una casa grandísima que luego
        fue iglesia; y en la probanza de 1680 los vecinos declaran por
        tradición que tenía allí «su corte».
      cita_corta: '«…estaba en dicho pueblo de Coro, en una casa grandísima…» (Cey)'
      obra: gonzalez-batista-2002-fundacion
      pagina_impresa: '163-164'
      via: 'Galeotto Cey, Viaje y descripción de las Indias 1539-1553, Caracas 1995, p. 56; probanza del procurador del cabildo, 1680, copia en AHC, Fondo Arcaya, t. VII'
      epoca: colonial   # 1545 y 1680
      etiqueta: atestiguado   # lo que dicen Cey y los testigos; que fuera así en 1527, reconstruido
      conflicto_con_el_canon: >-
        3-mundo/asentamientos.yaml nodo-001 (todariquiba): «Poblado real donde
        residió Manaure […] el mejor candidato a lo que la simulación llama
        la Curiana». González Batista lo discute de frente: Todariquiba era
        un refugio a una legua, ocupado de forma temporal cuando llegaron los
        alemanes (1529). No se resuelve aquí: son dos lecturas de documentos
        coloniales.
    - id: m7-gb02-003
      afirmacion: >-
        Todariquiba estaba a una legua de Coro (a dos, según una primera carta
        de Bastidas de 1538 que él mismo rectifica), era en 1538 «pueblo del
        cacique D. Alexandre» y estaba casi despoblado; debió desaparecer a
        mediados del XVI. González Batista la sitúa, con Mons. Pineda, tras la
        fila de Buena Vista, hacia Caujarao.
      obra: gonzalez-batista-2002-fundacion
      pagina_impresa: '161 (n. 47-48)'
      epoca: colonial
      etiqueta: 'atestiguado (distancias, D. Alexandre); hipotético (Caujarao: opinión del autor)'
      destino: asentamientos.yaml nodo-001 — «La ubicación de Todariquiba» (hueco abierto)
    - id: m7-gb02-004
      afirmacion: >-
        Otro poblado indígena junto al puerto de Coro: «Norupara».
      cita_corta: '«cabe el puerto de esta ciudad que se llama Norupara»'
      obra: gonzalez-batista-2002-fundacion
      pagina_impresa: '162 (n. 49)'
      via: 'ANH, Descubrimiento y conquista de Venezuela, t. II, Caracas 1988, p. 309'
      epoca: colonial
      etiqueta: atestiguado
      destino: 'campana-toponimos: topónimo NUEVO (grep en toponimos.yaml, lexicon_toponimos.py, asentamientos.yaml y 6-fusion: 0)'
    - id: m7-gb02-005
      afirmacion: >-
        En la probanza de 1680 los testigos llaman al señor «managuarire»
        (el cura rector Pérez Ortiz), «managuanare» (Gervasio del Barrio, 75
        años) y «managuanaré» (el capitán Esteban de Quero, que dice haber
        estado «en el solar donde tenía su palacio»). González Batista afirma
        que son dictados de honor «correctamente caquetíos», sin dar prueba.
      obra: gonzalez-batista-2002-fundacion
      pagina_impresa: '163-164'
      via: 'probanza de 1680, AHC, Fondo Arcaya, t. VII, pp. 5-21'
      epoca: colonial   # 1680, por tradición
      etiqueta: atestiguado   # las formas, en boca de testigos de 1680; su valor caquetío, hipotético
      destino: >-
        3-mundo/corpus/geografia_politica.yaml geografia_politica-008 hoy cita
        «González, PLINCODE p. 23, vía Zavala». Esto da el DOCUMENTO debajo:
        una probanza de 1680, siglo y medio después. Sube la cadena y a la vez
        la data: son formas coloniales tardías, no de 1527.
    - id: m7-gb02-006
      afirmacion: >-
        La presa («buco») y la acequia de dos leguas del río Coro llegaban al
        pueblo; el río daba nombre también a la vega. Ballesteros (1550): en
        tiempos en que la comarca de Coro tenía «catorce o quince mil indios»
        la reparaban en tres o cuatro días; en 1550 sólo nombra «seis pueblos
        de indios de esta nación caquetíos, comarcanos a la ciudad de Coro».
      obra: gonzalez-batista-2002-fundacion
      pagina_impresa: '160-161 (n. 46-47)'
      via: 'Ballesteros 1550, en Maldonado, Seis primeros obispos…, AGN 1973, pp. 110 y 129'
      epoca: colonial
      etiqueta: atestiguado
      ya_en_el_canon: >-
        sí, por otra vía (geografia_politica-004/005: Oliver citando a Bécker
        1950). Esta es una SEGUNDA TRANSCRIPCIÓN del mismo documento
        (Maldonado 1973), no una segunda atestación: confirma la lectura de
        las cifras, no las cifras.
    - id: m7-gb02-007
      afirmacion: >-
        «Mil ánimas poco más o menos» en todos los pueblos caquetíos «para
        entonces».
      obra: gonzalez-batista-2002-fundacion
      pagina_impresa: '161 (n. 47)'
      via: 'Nectario María, Los orígenes de Maracaibo, 1959, p. 84 (y AGI Justicia 5)'
      epoca: colonial   # 1529 o 1538: la nota no fija la fecha
      etiqueta: atestiguado
      aviso: >-
        la nota no deja claro si el «entonces» es abril de 1529 o 1538, ni si
        «todos los pueblos» son los de la comarca o los del cacicazgo. No se
        usa como cifra hasta ver a Nectario María.
    - id: m7-gb02-008
      afirmacion: >-
        Palo de brasil abundante en todo el territorio caquetío, sobre todo en
        el piedemonte serrano de Coro, y en Aruba: la expedición de 1527 iba a
        cortarlo; Ampiés contrató 4.500 quintales (30-VII-1527); los caribes
        de la sierra y parte de los caquetíos lo impidieron.
      obra: gonzalez-batista-2002-fundacion
      pagina_impresa: '157-158; 160 (n. 44)'
      via: 'Ramos 1978 pp. 278-361'
      epoca: colonial
      etiqueta: atestiguado
      destino: 3-mundo/corpus/ecologia.yaml (el árbol) — la explotación es colonial
    - id: m7-gb02-009
      afirmacion: >-
        La cruz de la fundación de Coro es de madera de cují (comprobado al
        restaurarla en 1987) y la tradición pone el encuentro Ampiés-Manaure y
        la primera misa bajo un cují grande; para sacar maderos rectos de ese
        largo hace falta un cují «de singulares dimensiones».
      obra: gonzalez-batista-2002-fundacion
      pagina_impresa: '149 (n. 3)'
      epoca: 'colonial (la cruz); moderno (la restauración)'
      etiqueta: atestiguado
      destino: 'ecologia: cujíes grandes en la vega de Coro'
    - id: m7-gb02-010
      afirmacion: >-
        Primera acta municipal de Coro, localizada por el autor en Sevilla
        (1992): Alfinger nombra alcaldes el 28-II-1529 «en la costa del puerto
        que se dize de Coro».
      obra: gonzalez-batista-2002-fundacion
      pagina_impresa: '170-171'
      via: 'AGI, Santo Domingo 202, f. 42'
      epoca: colonial
      etiqueta: atestiguado
      valor: 'el «puerto de Coro» con nombre en 1529: para el Golfete.'
    - id: m7-gb02-011
      afirmacion: >-
        Castellanos trató en 1540 a la hija y al yerno de Ampiés (Bejarano y
        doña María), y en el Nuevo Reino a Fernán Gallego, que vino en la
        expedición de 1528: su relato de la fundación es oral y de primera
        mano familiar.
      obra: gonzalez-batista-2002-fundacion
      pagina_impresa: '162'
      epoca: colonial
      etiqueta: atestiguado
      valor: >-
        convergente con lo que dice el propio poema (líneas 47956-47969,
        p. 184; 48296, p. 185). Sube el peso de Castellanos como testigo de
        lo de Coro.
  sobre_el_autor: >-
    El mismo González Batista de «El nombre de Coro». Aquí trabaja como
    historiador de archivo (AGI, AHC, BNM) y no hace lingüística; lo que dice
    de lengua (que «managuarire» es «correctamente caquetío») va sin prueba y
    se trata como lo trató Miguel el 2026-08-25: con cautela, afirmación por
    afirmación.

# ══════════════════════════════════════════════════════════════════════════
# 3. GONZÁLEZ BATISTA — «El nombre de Coro»: verificar lo que Miguel recordaba
# ══════════════════════════════════════════════════════════════════════════
gonzalez_batista_nombre_de_coro:
  recuerdo_de_miguel: >-
    «curiana era realmente Coriana y venía de espina y era porque Coro era un
    bosque tupido de cardones» (d21.15, 2026-09-21).
  veredicto_por_partes:
    - parte: «Coriana, y no Curiana»
      es_de_aqui: sí
      donde: 'transcripción de las capturas de Miguel (6-fusion/toponimia_coro_espina.yaml §familia_coro)'
      pagina: 'no recuperable: las capturas no la traían y la obra no está en el repo'
    - parte: coro = 'espina' → Coriana 'tierra de las espinas'
      es_de_aqui: sí
      pagina: ídem, no recuperable
    - parte: «bosque tupido de cardones»
      es_de_aqui: 'NO literalmente, en lo que el repo transcribió'
      lo_que_si_dice: >-
        «de vegetación espinosa, e indirectamente, tierra de cardones»; y la
        nota del repo añade que el cardonal de Coro «figuraba entre los
        linderos» y el testimonio de 1533 sobre la fruta de los cardones
        grandes, ambos por vía del autor.
      fuente_primaria_mas_cercana: >-
        Castellanos 1589, p. 185 (líneas 48221-48223): Coro «es tierra de
        fructíferos cardones / Con que gran parte della se embaraza». Es la
        imagen del bosque de cardones con fecha del XVI; puede ser la que
        González Batista tenía delante (cita a Castellanos, ed. ANH 1987,
        p. 175, que es esa misma página).
  lo_que_no_se_pudo:
    - >-
      Conseguir el texto: no está en archive.org (búsqueda por autor: 0), ni
      en HEVILA/Biblat (sí está su artículo de 2002, que no trata el nombre),
      ni en Google Books con vista. La copia que Miguel vio estaba en Scribd,
      que el repo no acepta como acceso abierto legítimo (sesión 07, rastreo
      documental, 2026-08-14). Año, editorial y páginas siguen sin saberse.
    - >-
      Datarla: sólo sabemos que es posterior a 2000 (cita a Fernández Heres
      2000) y que su autor escribe de «nuestro libro» Tierras de Falcón/
      Paraguaná (1999).
  lo_que_si_se_suma:
    - 'm7-gb02-001: la forma Coriana en 1526, 1646 («que los Yndios diçen») y 1723, con cadena documental.'
    - 'm7-cast-012: dos testigos (1550 y 1589) de que Coro era el nombre del río, y la lectura «viento» deja de ser indígena.'
    - 'm7-cast-013: el único Coriana de Castellanos es de La Ramada.'

# ══════════════════════════════════════════════════════════════════════════
# 4. BRITO FIGUEROA 1962 — Población y economía en el pasado indígena venezolano
# ══════════════════════════════════════════════════════════════════════════
brito_figueroa:
  ficha_corregida:
    editorial: '[Ediciones Historia] (entre corchetes en el catálogo: la da el catalogador)'
    paginas: '48 pp., con mapa; 22 cm; bibliografía en pp. 47-48'
    materias_bnv: 'Indígenas de Venezuela — condiciones económicas — época colonial (1556-1810); Región Nororiental — vida social y costumbres'
    fuente_del_dato: 'Catálogo de la Biblioteca Nacional de Venezuela, koha.bnv.gob.ve, biblionumber 677 (consultado 2026-09-22); cinco ejemplares en la red de la BNV'
  estado: >-
    NO se pudo minar hoy. No hay texto en el repo (capa_texto: no); no está en
    archive.org (búsqueda por autor: tres ítems, ninguno éste), ni en HEVILA;
    el autor murió en 2000 y la obra tiene derechos. Lo que el repo tiene de
    ella es lo que Miguel leyó en Scribd el 2026-08-25 (polities_no_costeras_
    federmann.yaml): Barquisimeto, Yaracuy, llanos, Caracas — nada de la costa
    de Coro.
  aviso: >-
    Las materias del catálogo dicen «Región Nororiental». Con 48 páginas para
    toda Venezuela, es improbable que traiga la demografía de Coro con el
    detalle que la pregunta pide; lo que sí da es su aparato de notas.
  la_pregunta_contestada_con_lo_que_si_hay: ver §escala_del_mundo

# ══════════════════════════════════════════════════════════════════════════
# 5. LA ESCALA DEL MUNDO — lo que las fuentes dicen del tamaño de la Kaketiana
#    costera, para los 63 agentes en dos nodos (pregunta de la parcela).
#    Ninguna cifra es de este minador: todas son de la fuente que se nombra.
# ══════════════════════════════════════════════════════════════════════════
escala_del_mundo:
  - que: asentamientos alrededor de Coro
    dato: 'once «ciudades de grandísimo momento» con nombre, en doce leguas, «con otros que callamos»; y gente numerosa hasta Paraguaná'
    fuente: 'castellanos-elegias p. 185 (m7-cast-004)'
    epoca: contacto-temprano (1525-1529, escrito en 1589)
    proyectable_al_xv: >-
      como MÍNIMO, con reserva: en 1527 la costa ya llevaba dos décadas de
      armadas de salteo (González Batista 2002 p. 162; cédula de 1526 que las
      prohíbe en la jurisdicción de Ampiés, p. 156). La red de 1400 no pudo
      ser menor por causa europea; pudo ser mayor.
  - que: radio de la red de Manaure
    dato: 'pueblos que vinieron a la paz «hasta catorce leguas más adentro»; su nombre vale de salvoconducto camino de los llanos'
    fuente: 'castellanos-elegias pp. 186, 199 (m7-cast-005, 006)'
    epoca: contacto-temprano
    proyectable_al_xv: con reserva
  - que: población de la comarca de Coro
    dato: '«catorce o quince mil indios» en tiempos de más gente; «cuatro o cinco mil» para reparar la acequia; en 1550, seis pueblos caquetíos'
    fuente: 'ballesteros-1550 (ya en el corpus: geografia_politica-004/005, vía Oliver); segunda transcripción en gonzalez-batista-2002-fundacion pp. 160-161'
    epoca: colonial (retrospectiva de 1550)
    proyectable_al_xv: 'con reserva: es la memoria de 1550 de la comarca antes del derrumbe, el mejor techo que hay.'
    nota: 'Oliver infiere de ahí más de 30 poblados suponiendo 150-200 personas por poblado: eso es un SUPUESTO suyo, no un dato (ya declarado en asentamientos.yaml).'
  - que: población caquetía hacia 1529-1538
    dato: '«mil ánimas poco más o menos» en todos los pueblos caquetíos'
    fuente: 'gonzalez-batista-2002-fundacion p. 161 n. 47, vía Nectario María 1959 p. 84 (m7-gb02-007)'
    epoca: colonial
    proyectable_al_xv: 'no: es la población después del contacto, y la fecha y el ámbito de la cifra no están claros.'
  - que: saca de esclavos
    dato: 'cautivos de la sierra marcados con hierro y vendidos «por las islas en públicos pregones» (1529); caquetíos y bubures de Juruara herrados en Maracaibo y enviados a Santo Domingo'
    fuente: 'castellanos-elegias p. 188 (m7-cast-023); oliver-1989-cap3 p. 201 (ya en taino_en_la_esfera)'
    epoca: colonial
    proyectable_al_xv: 'no.'
  - que: encomienda
    dato: 'en 1526 «el cacique de Coro y Coriana» quedan «encomendados» a Ampiés (exceptuados de la capitulación de Enciso); Manaure se hace «poco a poco tributario»; en 1680 la tradición dice que a Manaure «de todas partes le venían a pagar sus tributos»'
    fuente: 'gonzalez-batista-2002-fundacion pp. 157, 164; castellanos-elegias p. 186'
    epoca: colonial
    proyectable_al_xv: >-
      no la encomienda. El tributo A MANAURE de la tradición de 1680 podría
      ser institución prehispánica, pero es memoria de siglo y medio después:
      hipotético.
  - que: economía indígena (sal, pesca, trueque)
    dato: 'Coro: «grande pesquería de pescados», cardón de sustento; Maracaibo: pescadores-salineros que truecan con labradores de maíz; La Ramada: salina con pesca estacional «para comer, ya para trueque»; islas: arqueros certeros en aves, conejos y peces'
    fuente: 'castellanos-elegias pp. 184, 185, 189, 252'
    epoca: contacto-temprano
    proyectable_al_xv: 'como patrón, con reserva (m7-cast-020); Coro, sí (medio físico).'
escala_del_mundo_para_los_63: >-
  Lo que dicen las fuentes, sin hacer cuentas nuevas: la comarca costera de
  Coro tenía al menos once asentamientos con nombre en doce leguas, más los
  de Paraguaná, y una población que en su mejor memoria se contaba por
  miles. Dos nodos de 63 personas son una muestra de esa red, no la red; y
  ninguna fuente minada hoy dice cuánta gente vivía en UN poblado. El único
  número por poblado del repo es el supuesto de Oliver (150-200), que no es
  dato.

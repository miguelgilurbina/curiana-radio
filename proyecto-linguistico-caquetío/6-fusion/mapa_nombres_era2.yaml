# ────────────────────────────────────────────────────────────────────────
# EL MAPA — los 63 nombres del elenco de la era 2, viejo → nuevo
#
# Reglas:     6-fusion/sistema_de_nombres_era2.yaml
# Evidencia:  6-fusion/antroponimos_caquetios.yaml
# Aplicado:   6-fusion/elenco_era2.yaml (campo `nombre` + `alias_era1`)
# Verificado: 6-fusion/scripts/verificar_elenco_era2.py (sección NOMBRES)
#
# `nombre_era1` es el nombre que el agente tenía en el casting (#127): para
# 43 es el de su agente de la era 1, para 4 el de una persona de fondo de
# genealogia.yaml y para 16 el que el casting acuñó. Los tres que no cambian
# llevan `nombre_nuevo: se conserva` y repiten su nombre en `nombre`.
#
# Ninguna cifra de este archivo está escrita a mano: los conteos los imprime
# verificar_elenco_era2.py. La verdad la tiene el elenco; si el mapa y el
# elenco no coinciden, el verificador falla.
# ────────────────────────────────────────────────────────────────────────
meta:
  fecha: '2026-09-14'
  estado: sin-fusionar
  quien: escriba (Claude), a pedido de Miguel
  decision: >-
    Miguel, 2026-09-14: «¿No deberíamos rehacer los nombres en base a lo que
    conocemos y tenemos de caquetío?» → «Sí a los dos puntos»; y «Sí o sí hay
    que sacar eso de -ko y -sha. Si es inventado, tanto de la gramática como
    de los nombres».
  como_se_midio: 'python 6-fusion/scripts/verificar_elenco_era2.py'

nombres:
- nombre_era1: Kunaro-bana
  nombre_nuevo: se conserva
  casa: los Tacuatos
  raiz: kunaro
  glosa: pez del golfete de Coro. Promicops Guasa
  fuente_de_la_raiz: caquetío-atestiguado
  cita_de_la_raiz: 'Pez del golfete de Coro. Promicops Guasa [Zavala Reyes 2015
    #96 (E)]'
  formante: -bana
  fuente_del_formante: 'CONSERVADO, no productivo: Yarosabana, cacique del Yaracuy
    (Zavala Reyes 2015) con regla 4 declarada, mas D9 -bana «cerro, sitio alto»
    con seis apoyos'
  razon: 'Se conserva: el apopo de los Tacuatos se llama como el pez que persigue
    en la seca, y la raíz ya era atestiguada.'
  nombre: Kunaro-bana

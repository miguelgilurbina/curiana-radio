# HALLAZGOS INMEDIATOS (antes de cualquier cómputo)
# ══════════════════════════════════════════════════════════════════
hallazgos:
  - id: nucleo-del-proyecto-es-guajiro
    que: >-
      ⭐⭐ Los pronombres del núcleo fundacional de la simulación son la
      COLUMNA GUAJIRO casi literal: taya' (I) = taya, pia' (thou) = pia,
      waya' (we) ~ tayamaa. El lokono difiere de raíz (*day/dei/dai, bii,
      oai). Y siguen: kai' (sun) ~ kai, kashi' (moon) ~ kashi, wuin (water)
      ~ wuin, eka (eat), piama (two). El "cognado en wayunaiki" que
      justifica el núcleo reconstruido queda a la vista fila por fila — y
      D11 tiene aquí su primera medición parcial: el núcleo YA es guajiro.
  - id: bana-hoja-higado
    que: >-
      ⭐ La fila 25 (leaf) da lokono adobona/-bana e IC -bana, y la 53
      (liver) remite a ella (vid. n25) con lokono -bana, IC -bana, guajiro
      apa'na: HOJA e HÍGADO comparten la raíz *pana en el norte arahuaco
      (polisemia hoja/órgano-plano). El cognado de bana-2 'hígado' queda
      verificado — y enriquecido: el étimo es 'hoja'.
  - id: kipa-maipure
    que: >-
      ⭐ Fila 77 (stone): guajiro ipa, paraujano ipah, lokono siba, maipure
      KIPA. El maipure kipa (k+ipa) es el paralelo exacto de la serie
      caquetía quiva/cuiva/kiba 'piedra' — se suma al conjunto
      cognado-piedra de lengua_toponimia_quibacoa.yaml.
  - id: aituu-el-azul
    que: >-
      La fila sky da guajiro "aituu (=the blue..)": el cielo nombrado como
      'el azul'. Eco directo del iruma 'azul celeste' de Maitiruma (Esteves)
      — el campo semántico cielo/azul celeste existe en el área.
  - id: prestamos-marcados
    que: >-
      Oliver marca préstamos por celda y eso ES dato de contacto: el
      ISLAND-CARIB dice CARIB en long/sun/water/stone/sand/path/mountain...
      (el sustrato caribe del eyeri), KARIB en fish/bird, AFRICANISM en
      person; el PARAUJANO dice SPANISH en bird/dog/cloud y LOS CUATRO
      COLORES; dog es SPANISH en guajiro, paraujano y lokono a la vez.
  - id: paraujano-t-prefijo
    que: >-
      El paraujano marca posesión con t- donde el guajiro no (taki 'head',
      tai 'tooth', tou 'eye', tapat 'foot', tawala 'hair'): las formas están
      recogidas con el prefijo fosilizado. Relevante para comparar formas
      caquetías que empiecen por t- (¿ta- posesivo lexicalizado?).


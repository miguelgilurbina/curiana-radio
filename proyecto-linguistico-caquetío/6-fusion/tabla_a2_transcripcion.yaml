# TRANSCRIPCIÓN — Tabla A-2 de Oliver 1989: Swadesh-100 comparado del norte
#
# Oliver 1989, Apéndice A, pp. impresas 561-565 (pdf 588-592, offset −27).
# Columnas: GUAJIRO (Wayu, Guajira P.) · PARAUJANO (Añu, Sinamaica) ·
# ARAWAK (Lokono, Guyanas/Surinam) · ISLAND-CARIB ("Eieri",
# Antillas-Honduras) · MAIPURE (Waminari, Orinoco).
#
# MÉTODO (doble extracción, 2026-08-31): lectura A OJO de las cinco páginas
# renderizadas a 200dpi (protocolo del proyecto) + OCR tesseract 400dpi como
# contraste. Donde el ojo dudó hay «(?)». Los apóstrofos son glotales del
# original; las subrayadas del original van sin marcar (limitación nuestra).
# «---» = celda vacía en el original. Palabras en MAYÚSCULA (SPANISH, CARIB,
# KARIB, AFRICANISM) son anotaciones DE OLIVER marcando préstamo.
#
# ⚠️ Esto ES transcripción (a ojo), no OCR — pero de una fotocopia de tesis:
# para citar una forma en el canon, verificar la celda contra la imagen
# (scratchpad/oliver_p588-592.png en la sesión; regenerables con offset −27).

# EL CÓMPUTO DE D11 — ahora es posible
# ══════════════════════════════════════════════════════════════════
plan_d11:
  que: >-
    Con la A-2 transcrita, D11 pasa de opinión a medición: (1) tomar las 226
    formas caquetío-atestiguadas; (2) para las que tengan glosa en el
    Swadesh (o campo semántico mapeable), comparar la forma caquetía contra
    las columnas guajiro y lokono con las reglas fonémicas de D5; (3) contar
    a cuál se acerca más. El resultado es el dato que la condición 8 del
    gate espera. Sesgo a declarar: el núcleo RECONSTRUIDO no entra al
    cómputo (es guajiro por construcción — ver hallazgo 1); solo lo
    atestiguado vota.

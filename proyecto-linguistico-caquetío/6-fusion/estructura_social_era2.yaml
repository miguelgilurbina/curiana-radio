# 0. DECISIÓN CREATIVA DEL 2026-09-14 — dos subgrupos por nodo
# ══════════════════════════════════════════════════════════════════
decision_creativa_2026-09-14:
  estado: DECIDIDA por Miguel
  etiqueta: canon-simulacion
  registro: 6-fusion/decisiones_tanda_2026-09-14.yaml
  literal: '«Para esta era podríamos elegir dos subgrupos por nodo. Lo dejamos establecido como nuestra decisión creativa para efectos de la simulación.»'
  manda_sobre: 'niveles (propuesta_de_reparto y GUARANAO_subgrupos_con_nombre), zonas_pesqueras e institucion_kapubana.caracter. Lo que más abajo lo contradiga queda como alternativa descartada, no se borra'
  nodos:
    GUARANAO:
      - {subgrupo: los Tacuatos, sitio: Tacuato, lat: 11.708, lon: -69.841, zona_de_pesca: ZG2, apoyo: 'Petit 2012 («la constituían los Tacuato»); Esteves p. 62'}
      - {subgrupo: los Cayudes, sitio: El Cayude, lat: 11.701, lon: -69.957, zona_de_pesca: ZG2, apoyo: 'Petit 2012; kayude, voz caquetía atestiguada'}
    AMUAY:
      - {subgrupo: los Guasicures de Caseto, sitio: Caseto, lat: 11.762, lon: -70.017, zona_de_pesca: ZA1, apoyo: 'Petit 2012; Esteves p. 30'}
      - {subgrupo: los Corubos, sitio: 'la costa oeste hacia Los Taques (el sitio concreto se fija en el casting)', zona_de_pesca: ZA1, apoyo: 'Petit 2012; Miguel: «los otros estaban en Amuay hacia Los Taques»', aviso: 'Curubitos (Esteves p. 34) está en la costa oriental; queda descartado por decisión'}
  zonas_de_pesca: 'separadas y exclusivas: GUARANAO pesca el Golfete (ZG2) y AMUAY la costa oeste (ZA1). ZG1, ZA2, ZA3 y ZX quedan de fondo, sin agentes'
  capubana: 'centro compartido que congrega y centraliza lo espiritual, por lo menos lo del Manaure, «no necesariamente como institución sino a nivel energético». Moruy, Chamuriana, Siraba y Maitiruma forman el conglomerado del cerro y no son subgrupos en escena'
  frontera: 'pasa a ser oeste (AMUAY) contra sureste (GUARANAO) alrededor del cerro; la línea interior de lat. 11.90 queda descartada'
  elenco: 'un linaje de D1 por subgrupo, con lo que el «2 linajes por nodo» de DISENO_ERA2 §3 se conserva; el reparto de linajes se decide en el casting'

# ══════════════════════════════════════════════════════════════════
# 1. LOS NIVELES — de la polity a la casa
# ══════════════════════════════════════════════════════════════════
niveles:

  - nivel: 0
    nombre: polity costera
    titulo: manaure (título laudatorio) y diao principal
    hechos:
      - afirmacion: >-
          Paramount único que es a la vez gran chamán y controla o predice los
          fenómenos naturales. Lo llevan siempre en hamaca con un séquito
          («possibly as his naborias») y lo distinguen oro y collares de concha.
        etiqueta: atestiguado
        capa: contacto (s. XVI)
        procedencia: {obra: oliver-1989-cap3, pagina: '251; pdf 84 (impresa sin verificar)'}
      - afirmacion: >-
          Ampíes (c. 1520), en primario: el gran cacique «se haze adorar...
          dando a entender a los indios q el da los temporales».
        etiqueta: atestiguado
        capa: contacto
        procedencia: {obra: velasco-2015-resistencia, pagina: 'Ampíes, folio 14'}
      - afirmacion: >-
          Su poder «still had to operate through a council of second-order
          chiefs»; el territorio se subdividía en unidades menores, quizá
          controladas por jefes de segundo orden.
        etiqueta: reconstruido
        procedencia: {obra: oliver-1989-cap3, pagina: 'pdf 107, resumen del capítulo (impresa sin verificar)'}
      - afirmacion: >-
          «Multitud de cacicazgos independientes» sometidos al «gran señor de
          Paraguaná», depositario de la autoridad religiosa y capaz de hacer
          abundar las sementeras.
        etiqueta: atestiguado
        capa: historiografía del s. XX, tres eslabones (Salas, vía Antolínez 1944, vía Morón)
        procedencia: {obra: moron-2012-petroglifos}
        aviso: Antolínez 1946 se contradice («no tienen sacerdocio»); ver institucion_kapubana.caracter
      - afirmacion: >-
          Diao es título genérico de señor principal; Oviedo lo aplica al jefe
          que tiene caciques sujetos. Oliver lo lee como «second-order and
          paramount chiefs».
        etiqueta: atestiguado
        procedencia: {obra: oliver-1989-cap3, pagina: 'pdf 88, citando Oviedo [6]:41'}
    unidades:
      comun_a_los_dos_nodos: >-
        Manaure (Tier I actual). Dónde reside en el s. XV NO está dicho:
        Todariquiba es el reasentamiento de 1527 (Oliver p. 251), y Miguel
        advirtió el 2026-09-01 que «que ahí se fundara Coro no implica que
        Manaure residiera ahí». Ver preguntas_para_miguel.
    etiqueta_del_nivel: atestiguado (con capa de contacto)

  - nivel: 1
    nombre: clan (sub-grupo supra-aldea)
    titulo_propuesto: diao de segundo orden
    hechos:
      - afirmacion: >-
          Paraguaná estaba dividida en dos territorios de dos sub-grupos
          caquetíos, Amuayes y Guaranaos. Cada uno tenía sus propias cabezas de
          playa con zonas de pesca, y cabe suponer parcelas agrícolas igual de
          definidas.
        etiqueta: atestiguado
        capa: s. XVI, con cadena larga (Delmonte 1883 → González Batista 1984 → Oliver)
        procedencia: {obra: oliver-1989-cap3, pagina: '275'}
      - afirmacion: >-
          Los derechos territoriales mutuamente excluyentes implican lazos de
          parentesco o alianza dentro de cada grupo y UN jefe superior por clan,
          los dos integrados en la polity de Manaure.
        etiqueta: reconstruido
        procedencia: {obra: oliver-1989-cap3, pagina: '276'}
      - afirmacion: >-
          1538: «otro Cacique de la Provincia de Paraguana que le dize Don
          Alonso y su pueblo se dize Hurihurebo». Es el único jefe con alcance de
          «provincia» nombrado en Paraguaná, y su pueblo cae en el territorio
          AMUAY de #122.
        etiqueta: atestiguado
        capa: colonial (1538)
        regla_3: plantilla de escala; no dice cómo era el jefe de clan del s. XV
        procedencia: {obra: velasco-2015-resistencia, pagina: 'carta de Bastidas, AGI Legajo 218 f. 2 (transcrita en 6-fusion/velasco_primarios_agi.yaml)'}
      - afirmacion: >-
          La tradición popular nombra dos tribus en la península: «Amuayes... junto
          con los Moruyes».
        etiqueta: hipotetico
        deuda: sin-procedencia
        apoyo_en_repo: toponimia_paraguana_miguel.yaml §cola_de_etimologia_coloquial (amuay), divulgación web
        nota: bajo la lectura de #122 los Moruyes son los Guaranaos; bajo Delmonte literal serían los Amuayes reasentados
    unidades:
      GUARANAO:
        territorio: 'centro-sur: el Cerro Santa Ana y sus faldas sur y oeste, Moruy, Chamuriana, hasta la laguna de Guaranao y la costa del Golfete'
        ancla_decision: '#122'
        etiqueta: reconstruido
        nombre: >-
          guaranao ~ waranao. `waranao` 'salado, ácido' es voz caquetía
          atestiguada del lexicón (toponimia_paraguana_miguel.yaml, lista del
          2026-09-10), y Arcaya p. 22 dice que las salinas más importantes de
          Paraguaná son «las de Guaranao». Lectura HIPOTÉTICA: el clan de las
          salinas del suroeste. Aviso onomástico: no confundir con el pez
          waranaro de Waranaro-sha.
        jefe: 'diao de segundo orden — HUECO, sin agente'
      AMUAY:
        territorio: 'norte y costa oeste: Cayerúa y el interior norte, la costa norte hasta el Cabo San Román y la costa oeste de Los Taques hasta la bahía de Amuay'
        ancla_decision: '#122'
        etiqueta: reconstruido
        nombre: >-
          amuay (toponimo-090). Esteves p. 14 lo lee 'cavidad subterránea, cueva
          grande' por las cuevas cercanas (inferencia fonética sin documento);
          la tradición popular dice 'región de los vientos y las aguas
          encontradas' (etimología popular). Ninguna despeja con morfemas del
          canon.
        jefe: 'diao de segundo orden — HUECO, sin agente; plantilla colonial: Don Alonso de Hurihurebo (1538)'
      frontera:
        propuesta: >-
          Una línea interior hacia lat. 11.90, entre Moruy (11.822) y Cayerúa
          (11.986), con Adaure, Cocodite y Pueblo Nuevo encima. Por la costa
          oeste, la frontera caería entre la bahía de Amuay (11.775) y la
          laguna de Guaranao (11.682), en Punta Judibana (11.745). La costa
          oriental media (Adícora, Baraived, Miraca) queda SIN ASIGNAR.
        etiqueta: canon-simulacion
        deuda: sin-procedencia
        apoyo: coordenadas de osm-kaketiana; #122

  - nivel: 2
    nombre: subgrupo (aldea con su tierra y su playa)
    titulo_propuesto: apopo (jefe de parcialidad pequeña)
    hechos:
      - afirmacion: '«Apopo: nombre de jefe de parcialidad pequeña.»'
        etiqueta: atestiguado
        procedencia: {obra: zavala-reyes-2015, pagina: '65, #12'}
      - afirmacion: >-
          La aldea tenía un «chief» principal menor, «who probably was the head
          of a lineage group».
        etiqueta: reconstruido
        procedencia: {obra: oliver-1989-cap3, pagina: 'pdf 107 (impresa sin verificar)'}
      - afirmacion: >-
          Aldeas «medianas»: 150-200 habitantes en una estimación y 200-500 en
          el resumen. No estaban nucleadas; se dispersaban por el llano costero.
        etiqueta: reconstruido
        procedencia: {obra: oliver-1989-cap3, pagina: 'pdf 80 y pdf 97 (impresas sin verificar)'}
      - afirmacion: >-
          Paraguaná es la excepción al patrón costero, porque no tiene ríos:
          «the settlements are concentrated around the Santa Ana (extinct)
          volcano, which provides the water necessary for agriculture, and where
          the soils are most suited for farming». Y «Moruy and Santa Ana» están
          entre las aldeas más grandes del s. XVI localizadas arqueológicamente.
        etiqueta: atestiguado
        capa: arqueología y crónica del s. XVI según Oliver
        procedencia: {obra: oliver-1989-cap3, pagina: 'pdf 80 (impresa sin verificar)'}
      - afirmacion: >-
          En 1556 existían en Paraguaná Santa Ana, Moruy, Miraca y Cayeruba.
        etiqueta: atestiguado
        capa: colonial
        procedencia: {obra: esteves-1989, pagina: '52, citando a Arcaya'}
      - afirmacion: >-
          Tradición oral: «El Cacique de la Buena Vara», elegido por los
          comarcanos para medir las tierras de labranza y ante quien acudían a
          dirimir querellas posesorias.
        etiqueta: retro-abstraido
        procedencia: {obra: esteves-1989, pagina: '24-25 (Buenevara)'}
        valor: una figura de árbitro de linderos entre aldeas; ver oficio of-13
      - afirmacion: >-
          Etimología popular de Baracara, entre Santa Ana y Moruy: una
          «expresión insolente» de un cacique que le disputaba al vecino
          «ciertos fueros jurisdiccionales».
        etiqueta: retro-abstraido
        procedencia: {obra: esteves-1989, pagina: '19'}
        valor: la tradición recuerda fronteras disputadas entre caciques vecinos justo en la frontera interior de GUARANAO
    propuesta_de_reparto:
      etiqueta: canon-simulacion
      criterio: >-
        Tres subgrupos por clan, cada uno con una FUNCIÓN económica y ritual
        distinta —aldea madre, aldea del cerro y aldea de costa—, para que el
        elenco se atomice por oficio y no solo por linaje. Es la forma mínima en
        que cada clan tiene a la vez tierra, agua o monte, y playa.
      GUARANAO:
        - id: G1
          nombre: Chamuriana (el sitio de Santa Ana)
          coordenadas: {lat: 11.782, lon: -69.947, fuente: osm-kaketiana, nota: 'poblado moderno de Santa Ana'}
          funcion: el agua que baja del cerro y los conucos de la falda sur; sede propuesta del diao guaranao
          evidencia:
            - dato: Sitio FAL-154 «Santa Ana (El Cerro)», con tres dataciones precontacto (cal. A.D. 1160-1451) y cerámica Late Urumaco «still lavishly decorated»
              etiqueta: atestiguado
              procedencia: {obra: oliver-1989-cap4, pagina: 'Apéndice E FAL-154; Tabla 15'}
              apoyo_en_repo: asentamientos.yaml nodo-024
            - dato: «Antigua aldea indígena en cuyas cercanías los españoles fundaron en 1538 el pueblo de Santa Ana de Paraguaná»
              etiqueta: atestiguado
              procedencia: {obra: esteves-1989, pagina: '35'}
            - dato: «elegida por los nativos debido a la abundancia de agua dulce que bajaba del cerro»
              etiqueta: hipotetico
              deuda: sin-procedencia
              apoyo_en_repo: toponimia_paraguana_miguel.yaml (Chamuriana)
            - dato: '«the village of Santa Ana (of Pipiacoa)» en los juicios de residencia de 1538-1546: ¿un segundo nombre nativo del sitio?'
              etiqueta: atestiguado
              capa: colonial
              procedencia: {obra: oliver-1989-cap3, pagina: 'pdf 79, citando Ponce y Vaccari 1977:241'}
            - dato: Hay «apenas una fuente intermitente en el cerro de Santa Ana»
              etiqueta: atestiguado
              procedencia: {obra: arcaya-1920, pagina: '22'}
        - id: G2
          nombre: Moruy
          coordenadas: {lat: 11.822, lon: -69.983, fuente: osm-kaketiana}
          funcion: el merejuy y la chicha ritual; alfarería; aldea «belicosa»
          evidencia:
            - dato: Sitio FAL-149, Dabajuroide sin fechar
              etiqueta: atestiguado
              procedencia: {obra: oliver-1989-cap4, pagina: 'Apéndice E FAL-149'}
            - dato: «alteración de merejuy, cierta levadura o preparación agria... [para] la chicha embriagadora, que consumían en ceremonias religiosas»
              etiqueta: hipotetico
              procedencia: {obra: esteves-1989, pagina: '53'}
              nota: es una etimología del autor, sin cita; el dato etnográfico dentro de ella no tiene segunda fuente
            - dato: «los indios de Moruy eran los más belicosos de Paraguaná», con testimonios de peleas contra los españoles
              etiqueta: atestiguado
              capa: colonial
              procedencia: {obra: esteves-1989, pagina: '53'}
            - dato: San Nicolás de Moruy se fundó a fines del XVI «con otros Caquetíos que antes ocupaban otros sitios de Paraguaná»
              etiqueta: atestiguado
              capa: colonial
              procedencia: {obra: arcaya-1920, pagina: '327'}
              consecuencia: apoya la lectura de #122; el pueblo de Moruy es reducción, y el sitio precontacto queda por fechar
          satelites:
            - {nombre: Guacurebo, lat: 11.843, lon: -69.954, dato: 'en 1881 «toda Guacurebo pertenecía a Moruy»', procedencia: {obra: esteves-1989, pagina: '38'}, etiqueta: atestiguado, capa: s. XIX}
            - {nombre: Abudure, lat: 11.803, lon: -70.015, dato: 'aldea al SO de Moruy; «sitio de donde se extrae barro»', procedencia: {obra: esteves-1989, pagina: '11'}, etiqueta: reconstruido, valor: 'barro para las múcuras de la chicha (hipotético)'}
            - {nombre: Varacara (Baracara), lat: 11.798, lon: -69.974, dato: 'entre Santa Ana y Moruy; leyenda de caciques en disputa de fueros', procedencia: {obra: esteves-1989, pagina: '19'}, etiqueta: retro-abstraido}
            # Segunda vuelta (2026-09-13): las demás rancherías que Esteves da como del
            # municipio Moruy. Capa s. XIX-XX: son del padrón de 1881, no aldeas del s. XV.
            # Sirven para atomizar G2 en casas con sitio y nombre, no como dato de asentamiento.
            - {nombre: Yauquiba (Yabuquiba), dato: 'población del municipio Moruy; 1881: 26 casas, 199 vecinos, la mayor después de la cabecera', procedencia: {obra: esteves-1989, pagina: '67'}, etiqueta: atestiguado, capa: s. XIX, canon: toponimo-105}
            - {nombre: Guacujúa, dato: 'aldea del municipio Moruy; 1881: 14 casas, 97 vecinos', procedencia: {obra: esteves-1989, pagina: '38'}, etiqueta: atestiguado, capa: s. XIX, canon: 'toponimo-128, descartado como etimología, no como aldea'}
            - {nombre: Barunú (Parunu en el mapa vivo), dato: 'aldea al norte de Moruy; 1881: 5 casas, 29 habitantes', procedencia: {obra: esteves-1989, pagina: '23'}, etiqueta: atestiguado, capa: s. XIX, canon: toponimo-103}
            - {nombre: Jarayadito (Uarayadito en el mapa vivo), dato: 'aldea del municipio Moruy, junto a Moruy y Cayerúa', procedencia: {obra: esteves-1989, pagina: '46'}, etiqueta: atestiguado, capa: s. XIX, canon: toponimo-102}
            - {nombre: Tumarusa, dato: 'aldea del municipio Moruy; 1881: 6 casas, 39 vecinos; «se nos ha informado que Tumarure era el apellido de un cacique»', procedencia: {obra: esteves-1989, pagina: '64'}, etiqueta: atestiguado, capa: 's. XIX; lo del cacique es noticia de informante del s. XX'}
            - {nombre: Tacaduto, dato: 'aldea del municipio Moruy; 1881: 4 casas, 17 vecinos', procedencia: {obra: esteves-1989, pagina: '61'}, etiqueta: atestiguado, capa: s. XIX}
            - {nombre: Saguatumo, dato: 'lugar del municipio Moruy; 1881: 2 casas, 8 vecinos; «el nombre es antiquísimo»', procedencia: {obra: esteves-1989, pagina: '58'}, etiqueta: atestiguado, capa: s. XIX}
            - {nombre: Supideo, dato: 'lugar del municipio Moruy; «no tenemos más noticias»', procedencia: {obra: esteves-1989, pagina: '61'}, etiqueta: atestiguado, capa: s. XX}
            - {nombre: Tequeguacare, dato: aldea del municipio Moruy, procedencia: {obra: esteves-1989, pagina: '62'}, etiqueta: atestiguado, capa: s. XX, canon: 'toponimo-129, descartado como etimología'}
          escala_y_oficios_del_municipio:
            - {dato: 'en 1881 todo el municipio contaba 213 casas y 1.349 vecinos y «ya había perdido la populosidad que ostentaba en los tiempos coloniales»', procedencia: {obra: esteves-1989, pagina: '53'}, etiqueta: atestiguado, capa: s. XIX}
            - {dato: 'una de las comunidades de Paraguaná «con más apego a las costumbres de sus antepasados»; conserva la cerámica, las silletas y bernegales y el jabón de la tierra', procedencia: {obra: esteves-1989, pagina: '53'}, etiqueta: retro-abstraido, valor: 'la alfarería de G2 tiene una continuidad de oficio registrada en el s. XX'}
          nombres_de_casa_candidatos:
            pedido: '«Habíamos mencionado no sé en dónde algunos nombres de subgrupos de parte de los Moruyes» (Miguel, 2026-09-13). Los subgrupos con nombre están en GUARANAO_subgrupos_con_nombre; aquí van los apellidos, que sirven para nombrar casas dentro del centro'
            lo_que_hay:
              - {dato: 'en Moruy «los apellidos no han sufrido deformaciones acomodaticias»: Caguao, Cuauro, Mabo, Guarecuco, Cotopo', procedencia: {obra: esteves-1989, pagina: '53'}, etiqueta: atestiguado, capa: 's. XX, apellidos vivos'}
              - {dato: 'apellidos paraguaneros «que devienen de nuestros naturales»: Caguado, Cauro, Gotopo, Guanipa, Guarecuco, Guariato, Mabo, Manaure y Timaure', procedencia: {obra: medina-colina-sxx, pagina: '328'}, etiqueta: atestiguado, capa: s. XX, nota: 'los cinco de Esteves reaparecen (Caguao ~ Caguado, Cuauro ~ Cauro, Cotopo ~ Gotopo, Guarecuco, Mabo); no está verificado que Medina escriba sin haber leído a Esteves'}
              - {dato: 'la «etnia Mabo» de Guacurebo, con representantes', procedencia: {obra: velasco-2015-resistencia}, etiqueta: atestiguado, capa: s. XXI, nota: 'Guacurebo era de Moruy en 1881: el apellido y la ranchería satélite coinciden'}
              - {dato: '«Tumarure era el apellido de un cacique» (entrada Tumarusa)', procedencia: {obra: esteves-1989, pagina: '64'}, etiqueta: retro-abstraido}
              - {dato: 'la familia en -aure, «apellidos de la gran familia caquetía»: Adaure, Timaure, Yaraure, Chunaure, Manaure; y los «indios adaures», «tribu belicosa» según Hill Peña, con pleitos por sus tierras contra los españoles', procedencia: {obra: esteves-1989, pagina: '13'}, etiqueta: atestiguado, capa: 'colonial (los pleitos) y s. XX (los apellidos)', nota: 'Adaure (11.872, -69.988; 87 casas en 1881) cae al norte de Moruy, dentro de la franja de frontera propuesta'}
            regla_3: >-
              Son apellidos vivos. El canon ya tiene un caso de nombre indígena que
              pasa a apellido (el título manaure en Don Luis Martínez Manaure), pero
              ninguno de estos está documentado como nombre de linaje o de
              parcialidad del s. XV. Son semilla onomástica, nunca dato.
            propuesta:
              etiqueta: hipotetico
              que: >-
                Atomizar G2 en casas con nombre propio sacado de esos apellidos y
                anclado a una ranchería del padrón: Mabo en Guacurebo, Tumarure en
                Tumarusa, y Cuauro, Caguao, Guarecuco y Cotopo repartidos entre la
                cabecera, Yauquiba y Guacujúa. Los Adaures, como subgrupo propio en
                la frontera norte de Moruy: la tradición los nombra como «tribu».
                Si conviven con los linajes de D1 (Corie, Buio) o los sustituyen
                en Moruy lo decide Miguel (P15).
        - id: G3
          nombre: Guaranao de costa (laguna de Guaranao y orilla del Golfete)
          coordenadas: {lat: 11.682, lon: -70.196, fuente: osm-kaketiana, nota: 'Laguna de Guaranao'}
          funcion: pesca de laguna y Golfete; las salinas de Guaranao
          evidencia:
            - dato: las salinas más importantes de Paraguaná son las de Guaranao
              etiqueta: atestiguado
              capa: s. XX
              procedencia: {obra: arcaya-1920, pagina: '22'}
            - dato: ninguna aldea precontacto atestiguada en esta costa; la aldea es posición del proyecto
              etiqueta: canon-simulacion
              deuda: sin-procedencia
      GUARANAO_subgrupos_con_nombre:
        recuperado: '2026-09-14, del barrido web del 2026-09-10, a pedido de Miguel («revisa en nuestro historial, ya que lo habíamos conversado»)'
        dato:
          cita: '«Pernotaban indígenas caquetíos de la tribu de los guaranaos que la constituían los Tacuato, los cuales poblaban las costas y el golfete de Coro conjuntamente con los corubos, los cayudes y los guasicures de Caseto.»'
          quien: 'Osman Petit, cronista de Miraca, «Tacuato», blog Centro de Historia de Paraguaná, 18-08-2012 (http://centrodehistoriadeparaguana.blogspot.com/2012/08/tacuato.html)'
          etiqueta: retro-abstraido
          deuda: sin-procedencia
          nota: 'no cita fuente; el resto de la entrada sigue a Esteves p. 62 (Martí 1773 y el Resguardo de Salinas) y remite al cronista local Osteicoechea. Hay que perseguir la lista hasta Hernández Baño 1984 o Arcaya'
          apoyo_en_repo: '6-fusion/barrido_toponimos_web_2026-09-10.yaml (Tacuato; la_lista_de_clanes_confirmada)'
        lectura: >-
          Es la tradición que Miguel recordaba. Nombra a los Guaranaos como
          tribu mayor y le da subgrupos con nombre, y los cuatro nombres son
          topónimos vivos de Paraguaná, dos con voz caquetía atestiguada. Con
          la lectura de #122 (los Moruyes son los Guaranaos), son los subgrupos
          de los Moruyes.
        cero_verificado: 'guasicure y corubo como grupo no aparecen en ninguna fuente cruda del repo (raíces guas[ie]cur, guaz[ie]cur, coru[bv]o en fuentes_caquetios/*.txt: solo el Curubitos de Esteves y los fundos Cayude)'
        subgrupos:
          - nombre: los Tacuatos
            sitio: {lugar: Tacuato, lat: 11.708, lon: -69.841, fuente_coord: osm-kaketiana}
            datos:
              - {dato: 'pueblo «muy antiguo», con iglesia en 1773; 1881: 37 casas, 237 vecinos; Resguardo de Salinas colonial para vigilar el comercio de sal', procedencia: {obra: esteves-1989, pagina: '62'}, etiqueta: atestiguado, capa: 'colonial y s. XIX'}
              - {dato: 'la Playa Prudencio, «excelente» para la pesca', etiqueta: retro-abstraido, deuda: sin-procedencia, fuente_web: 'Petit 2012'}
            en_la_estructura: 'el subgrupo que «constituye» la tribu: aldea de la orilla del Golfete, con el trueque de la sal hacia Coro (ZG2). Ocupa el lugar de G3'
          - nombre: los Cayudes
            sitio: {lugar: El Cayude, lat: 11.701, lon: -69.957, fuente_coord: osm-kaketiana}
            datos:
              - {dato: 'fundo pecuario al oeste de Tacuato', procedencia: {obra: esteves-1989, pagina: '30-31 (OCR dañado, sin verificar)'}, etiqueta: atestiguado, capa: s. XX}
              - {dato: 'kayude «guanábano silvestre» es voz caquetía atestiguada: el grupo lleva nombre de árbol', etiqueta: atestiguado, apoyo_en_repo: 'curiana_lexicon.py (kayude); barrido_toponimos_web_2026-09-10.yaml'}
            en_la_estructura: 'la otra aldea de la orilla del Golfete, al oeste de los Tacuatos (ZG2)'
          - nombre: los Guasicures de Caseto
            sitio: {lugar: Caseto, lat: 11.762, lon: -70.017, fuente_coord: osm-kaketiana}
            datos:
              - {dato: 'aldea del municipio Santa Ana; 1881: 45 casas, 303 vecinos; caseto es una malva (Malvastrum spicatum)', procedencia: {obra: esteves-1989, pagina: '30'}, etiqueta: atestiguado, capa: s. XIX, canon: toponimo-088}
              - {dato: 'kaseto «planta herbácea» es voz caquetía atestiguada; guasicure no tiene glosa en el repo', etiqueta: atestiguado, apoyo_en_repo: 'curiana_lexicon.py (kaseto)'}
            en_la_estructura: 'aldea del interior entre Moruy y la laguna de Guaranao: el subgrupo natural de la laguna y sus salinas (ZG1)'
          - nombre: los Corubos
            sitio: {lugar: 'Curubitos, en La Boca del Caño, cerca de Santa Rita (municipio Adícora)', lat: null, lon: null, nota: 'el Corubo del mapa vivo (11.155, -70.376) es un caserío de Falcón occidental y no sirve'}
            datos:
              - {dato: '«Cuzubitos. Podría ser Curubitos, diminutivo de Corubo, caparazón de moluscos. El nombre aparece en los antiguos mapas en el punto costeño donde está localizada La Boca del Caño, lugar de pesquería cercano a Santa Rita»', procedencia: {obra: esteves-1989, pagina: '34 (pie del OCR)'}, etiqueta: atestiguado, capa: 'mapas antiguos y s. XX'}
            en_la_estructura: >-
              Si Curubitos es su huella, los Corubos pescaban en la costa
              oriental, junto a ZA3 y a la zona en disputa ZX: serían la
              presencia guaranaa en la costa que #122 dejó sin asignar. Choca
              con la crónica, que los pone en «las costas y el golfete». Queda
              abierto (P15).
        propuesta_de_reajuste:
          etiqueta: canon-simulacion
          que: >-
            GUARANAO deja los tres subgrupos definidos por función y pasa a un
            centro y cuatro subgrupos con nombre de la tradición. El centro son
            Moruy y Chamuriana, los Moruyes, con el merejuy y el agua del cerro.
            En la costa: los Tacuatos y los Cayudes en el Golfete (ZG2), los
            Guasicures de Caseto en la laguna y sus salinas (ZG1) y los Corubos
            en la costa oriental (ZX). AMUAY sigue sin subgrupos con nombre.
          consecuencia: 'rompe la simetría de tres por tres; la asimetría refleja lo que la tradición recuerda, no un dato del s. XV'
      AMUAY:
        - id: A1
          nombre: Cayerúa (Cayerda, Cayeruba, Cayarua)
          coordenadas: {lat: 11.986, lon: -69.959, fuente: osm-kaketiana}
          funcion: aldea madre del clan; cementerio antiguo; conucos del interior norte; sede propuesta del diao amuay
          evidencia:
            - dato: 'Delmonte: primer asiento de los Amuayes'
              etiqueta: atestiguado
              capa: s. XVI, cadena larga
              procedencia: {obra: oliver-1989-cap3, pagina: '276'}
            - dato: Sitio FAL-143, Dabajuroide; «el primer sitio de Paraguaná con evidencia precolombina» (cementerio y cerámica)
              etiqueta: atestiguado
              procedencia: {obra: oliver-1989-cap4, pagina: 'Apéndice E FAL-143'}
              apoyo: 'esteves-1989 p. 30; asentamientos.yaml nodo-025'
            - dato: '1538: «Esteban (?) principal de Cayarua»'
              etiqueta: atestiguado
              capa: colonial
              procedencia: {obra: velasco-2015-resistencia, pagina: 'carta de Bastidas, AGI Legajo 218 f. 2'}
            - dato: 'Bustillos 1760: todo el Moruy «con todo su Continenti de savanetas» por la posesión de San Juan de Cayarba'
              etiqueta: atestiguado
              capa: colonial (1760)
              procedencia: {obra: oliver-1989-cap3, pagina: '276, n. 113'}
              consecuencia: en 1760 las tierras de Moruy y de Cayerúa se defendían juntas; es otra razón por la que el reparto de #122 es frontera y no muro
          satelites:
            - {nombre: Buenevara, lat: 11.978, lon: -69.988, dato: 'el «Cacique de la Buena Vara», medidor de tierras', procedencia: {obra: esteves-1989, pagina: '24-25'}, etiqueta: retro-abstraido}
            - {nombre: Pueblo Nuevo, lat: 11.948, lon: -69.921, etiqueta: canon-simulacion, deuda: sin-procedencia}
        - id: A2
          nombre: Hurihurebo (Hurehurebo, Jurijurebo)
          coordenadas: {lat: 12.049, lon: -69.94, fuente: osm-kaketiana, nota: 'Jurujurebo; cerca de El Vínculo'}
          funcion: aldea de la costa norte; pescado seco y trueque; la de mayor rango documentado del clan
          evidencia:
            - dato: '1538: pueblo de Don Alonso, «Cacique de la Provincia de Paraguana»'
              etiqueta: atestiguado
              capa: colonial
              procedencia: {obra: velasco-2015-resistencia, pagina: 'carta de Bastidas'}
            - dato: «Señor de la ciudad Hurehurebo», y el pueblo aparece en la lista de las once ciudades
              etiqueta: atestiguado
              capa: colonial (1589)
              procedencia: {obra: castellanos-elegias, pagina: 'línea 48166 del txt; lista en 48246 ss.'}
            - dato: «todavía hay vestigios de su cementerio»
              etiqueta: atestiguado
              procedencia: {obra: esteves-1989, pagina: '47'}
            - dato: una «industria indígena» de pulpa de pescado salado y tostado al sol, envasada en totumos, que atraía caravanas de cuicas y timotes con tejidos; conchales en el sitio
              etiqueta: hipotetico
              procedencia: {obra: esteves-1989, pagina: '71-78 (página exacta sin verificar)'}
              nota: reconstrucción del autor sin cita; los conchales son observables, el comercio con los andinos no tiene fuente
            - dato: 'la leyenda de Judibana, hija de Manaure casada con el señor de Jurijurebo'
              etiqueta: retro-abstraido
              capa: colonial (1525-1526)
              apoyo_en_repo: toponimos.yaml toponimo-075, velasco_primarios_agi.yaml
              valor: 'como forma, no como hecho: una alianza matrimonial entre la casa del paramount y el señor de un clan'
        - id: A3
          nombre: Amuay de costa (bahía de Amuay y costa oeste de Los Taques)
          coordenadas: {lat: 11.775, lon: -70.241, fuente: osm-kaketiana, nota: 'poblado de Amuay'}
          funcion: pesca de la costa oeste (Golfo de Venezuela); cuevas; puerta hacia la Guajira
          evidencia:
            - dato: «en las cercanías de Amuay hay unas cuevas naturales que debieron ser habituales residencias de los nativos»
              etiqueta: hipotetico
              procedencia: {obra: esteves-1989, pagina: '14'}
            - dato: ninguna aldea precontacto atestiguada; la aldea es posición del proyecto
              etiqueta: canon-simulacion
              deuda: sin-procedencia
      sin_asignar_costa_oriental:
        - {nombre: Miraca, lat: 11.877, lon: -69.865, dato: '1538: Bonyata «Cacique de Myraca»; Castellanos: «ciudad de grandísimo momento»', procedencia: {obra: velasco-2015-resistencia, pagina: 'carta de Bastidas'}, etiqueta: atestiguado, capa: colonial, apoyo_en_repo: 'asentamientos.yaml nodo-031'}
        - {nombre: Adaure, lat: 11.872, lon: -69.988, dato: '1881: 87 casas; «tribu belicosa» (Hill Peña); quizá «la Dara fuera el ave totémica de la tribu»', procedencia: {obra: esteves-1989, pagina: '13'}, etiqueta: hipotetico}
        - {nombre: Baraived, lat: 11.887, lon: -69.853, procedencia: {obra: esteves-1989, pagina: '21'}, etiqueta: atestiguado, capa: s. XIX}
        - {nombre: Adícora, lat: 11.94, lon: -69.809, etiqueta: reconstruido, procedencia: {obra: zavala-reyes-2015}, nota: 'asentamientos.yaml nodo-012: solo el nombre está atestiguado'}
      recinto_del_cerro:
        nota: no pertenece a ningún subgrupo; es del Kapubana (ver institucion_kapubana.lugares)
        etiqueta: canon-simulacion

  - nivel: 3
    nombre: linaje matrilineal
    titulo: sin título caquetío atestiguado para la cabeza de linaje; en lo político la cabeza es el apopo, y en lo doméstico la matriarca y el tío materno
    hechos:
      - afirmacion: pertenencia, nombre y herencia por línea materna
        etiqueta: reconstruido
        procedencia: {obra: jahn-1927, pagina: '172 (wayuu)'}
        apoyo_en_repo: parentesco-005, parentesco-023 (el cúmulo wayuu, taíno, lokono y achagua)
      - afirmacion: exogamia de parcialidad; la mujer ha de ser de una parcialidad distinta a la del marido
        etiqueta: reconstruido
        procedencia: {obra: jahn-1927, pagina: '172 (wayuu)'}
      - afirmacion: linajes con nombre de animal, cada uno con casa comunal propia dentro de la aldea
        etiqueta: reconstruido
        deuda: sin-procedencia
        apoyo_en_repo: parentesco-022 (comparanda achagua, etnografía secundaria)
      - afirmacion: '«es posible que las diferencias del tatuage correspondiesen más bien a distinciones de clanes»'
        etiqueta: atestiguado
        nota: es intuición del autor, no dato de cronista
        procedencia: {obra: arcaya-1920, pagina: '127'}
      - afirmacion: élite avunculocal; el tío materno introduce a los varones y el sobrino-heredero vive junto a él
        etiqueta: reconstruido
        procedencia: {obra: keegan-1989}
      - afirmacion: los 6 linajes de D1 (Buio, Chiriware, Corie, Paugis, Kaira, Warana)
        etiqueta: canon-simulacion
        decision: D1 (2026-09-01); tótem y nombre de Kaira y Warana siguen abiertos
        apoyo_en_repo: 3-mundo/corpus/genealogia.yaml
    regla_de_residencia_propuesta:
      etiqueta: canon-simulacion
      regla: >-
        Por matrilocalidad el linaje queda DENTRO de un clan: sus mujeres no se
        mueven y sus hombres casados salen. Por eso el contacto permanente entre
        nodos son los esposos (DISENO_ERA2 §4.1). Un linaje solo aparece en los
        dos clanes por fisión (una rama que funda casa en el otro territorio), y
        eso se declara caso por caso.
      apoyo_en_repo: parentesco-016, parentesco-025
    propuesta_de_reparto:
      etiqueta: canon-simulacion
      aviso: es una propuesta para vetar; los seis nombres son de D1, y las casas costeras llevan linajes nuevos sin nombre
      GUARANAO:
        G1-Chamuriana: [Kaira, Corie]
        G2-Moruy: [Corie, Buio]
        G3-costa: [Kaira (rama), 'linaje nuevo G3 (nombre y tótem abiertos)']
      AMUAY:
        A1-Cayerúa: [Warana, Paugis]
        A2-Hurihurebo: [Chiriware, Warana (rama)]
        A3-costa-oeste: [Paugis (rama), 'linaje nuevo A3 (nombre y tótem abiertos)']
      razones:
        - Kaira (el linaje materno de Manaure) en GUARANAO porque el recinto del cerro y los asentamientos que dependen de su agua son centro-sur (Oliver pdf 80). Condicionado a la pregunta de dónde vive Manaure
        - Warana (el linaje de Nubiri-sha) en AMUAY, de modo que el matrimonio del paramount sea ya una alianza ENTRE clanes, con la misma forma que la leyenda de Judibana y el señor de Hurehurebo
        - Buio (los boratios) en Moruy, junto al merejuy y al recinto de Siraba y Misaray
        - Chiriware (vigilancia) en la costa norte, que es la que da al mar abierto
        - Corie (agricultura, maíz) en Chamuriana y Moruy, las tierras que Oliver da como las mejores para cultivar
        - Paugis (medicina, partería, memoria femenina) en AMUAY; así las matriarcas que ratifican al heredero Kaira son del OTRO clan (ver preparacion_del_manaure)

  - nivel: 4
    nombre: casa (grupo residencial)
    hechos:
      - afirmacion: >-
          La única vivienda costera descrita es una maloca grande de 40 a 50
          personas (Vespucci, Curazao); si vale para tierra firme, una aldea
          mediana tendría hasta cuatro.
        etiqueta: reconstruido
        procedencia: {obra: oliver-1989-cap3, pagina: '275'}
      - afirmacion: vivienda de familia extensa de 40-50 (maloca); varias de ellas hacen un «poblado» a ojos del cronista
        etiqueta: reconstruido
        procedencia: {obra: oliver-1989-cap3, pagina: 'pdf 107 (impresa sin verificar)'}
      - afirmacion: el caney de dos aguas, a veces sobre pilotes, como vivienda corriente kaketía de tierras bajas
        etiqueta: atestiguado
        capa: etnografía de 1946
        procedencia: {obra: antolinez-1946-hacia-el-indio}
        aviso: en el lexicón `caney` es taíno
      - afirmacion: grupo residencial creíble = matriarca + hermanas con hijos + hermanos adultos + esposos venidos de otros linajes
        etiqueta: canon-simulacion
        decision: D1
        apoyo_en_repo: genealogia.yaml
      - afirmacion: 'las casas de 5-8 familias son de Yaracuy y Barquisimeto, NO de la costa'
        etiqueta: atestiguado
        procedencia: {obra: oliver-1989-cap3, pagina: 'pdf 97'}
        regla_4: no importar
    propuesta:
      etiqueta: canon-simulacion
      regla: >-
        Una casa (maloca de linaje) por linaje y aldea. En escena, un núcleo de
        agentes representa a sus 40-50 moradores. Los agentes de una casa
        comparten fogón, deudas y la palabra de la matriarca.


# ══════════════════════════════════════════════════════════════════
# 5b. PROPUESTAS A OTRAS ESFERAS (regla 7) — nada de esto se ha tocado
# ══════════════════════════════════════════════════════════════════
propuestas_a_otras_esferas:
  ecologia:
    - tipo: hecho nuevo
      contenido: >-
        El sobrepastoreo como corte colonial del paisaje de la costa de Falcón:
        clima y vegetación casi iguales a los del s. XVI, pero el suelo perdió
        su cobertura, y con ella la humedad, por las cabras y el abandono de los
        conucos tras 1527. La agricultura del s. XV era un casi-equilibrio
        manejado (ciclo corto, acequias, jagüeyes).
      fuente: reconstruido
      procedencia: {obra: oliver-1989-cap3, pagina: '252-254'}
      dominios: [ecologia, agricultura, suelos]
      locacion: conuco
      cero_verificado: 'el corpus no lo tenía: sobrepastoreo, pastoreo, cabra, chivo, caprino, overgraz y goat dan 0 en 3-mundo/corpus/ecologia.yaml; el único pastoreo del corpus es wayuu (transmision.yaml)'
    - tipo: nota a ecologia-033
      que: >-
        La fauna «escasa por el clima desértico» es la del Parque Nacional
        Médanos de hoy. Castellanos, testigo de la década de 1540, llama a la
        tierra de Coro «abundantísima de toda caza». Se propone la nota de la
        regla 3: la caza como complemento sigue en pie, pero la escasez moderna
        es en parte colonial.
      procedencia: {obra: castellanos-elegias, pagina: 'línea 48228 del txt'}
    - tipo: nota a ecologia-036 (tierra pobre, mar rico)
      que: 'matizar a «tierra difícil pero manejada, empobrecida después»; el clima por sí solo no explica la pobreza agrícola de hoy (Oliver p. 253)'
      procedencia: {obra: oliver-1989-cap3, pagina: '253'}
  geografia_politica_y_motor:
    - tipo: corrección de regla 4
      donde: ['curiana_sim/curiana_polities.py (costera.economia)', '4-fuentes/oliver-1989-cap3.md (§Economía)', '3-mundo/horizonte-de-contacto.md (fila Comercio)']
      que: >-
        Los tres atribuyen a la polity costera una red de alianzas por comercio
        de cuentas de concha, sal y azabache, y la nota de la fuente dice además
        que esas aldeas «desarrollaron una confederación». Oliver lo dice de las
        aldeas JIRAJARAS (p. 245; DOC 238), y dice lo contrario sobre la
        confederación: ninguna la formó, pero sí alianzas por comercio. Lo que
        Oliver dice de la costa está en las pp. 285-286: sal abundante que se
        comercia tierra adentro y cuentas con valor fijo. Se propone corregir el
        rasgo con esa cita.
      procedencia: {obra: oliver-1989-cap3, pagina: '245 y 285-286'}
      nota: 'curiana_polities --check sigue en verde, porque el rasgo tiene fuente; lo que falla es que la fuente habla de otra polity'
  lexicon:
    - tipo: voces candidatas
      formas: [boroyda, mamas, querequetero, quitero]
      glosa: los tres tipos de cuentas de collar con valor de cambio
      procedencia: {obra: oliver-1989-cap3, pagina: '285, citando a Naveros y Vázquez de Acuña [1538] en Gabaldón 1962'}
      etiqueta_propuesta: caquetío-hipotético
      por_que_no_mas: 'Oliver no dice en qué lengua están, y Naveros escribe en castellano en 1538. boroyda y quitero dan 0 en el repo y en lexicon_zavala. El lexicón ya tiene ucibo «cuenta de piedra, chaquira» (caquetío-atestiguado, Zavala #267)'
      aviso: 'no emparentar quitero con la quiripa achagua (las cuentas de concha de Neira y Ribero) sin regla fonética: el parecido es de superficie'

# ══════════════════════════════════════════════════════════════════
# 6. PREGUNTAS PARA MIGUEL — lo que la evidencia no resuelve
# ══════════════════════════════════════════════════════════════════
preguntas_para_miguel:
  - id: P1
    pregunta: ¿Dónde vive Manaure en el s. XV?
    por_que_importa: decide en qué clan va el linaje Kaira y si la casa del Señor es de un nodo o del cerro
    opciones:
      - 'a) en GUARANAO, al pie del cerro (Salas: la cabecera está en Paraguaná; Oliver: los asentamientos se concentran alrededor del volcán)'
      - 'b) en el recinto del cerro, como espacio de nadie, con su casa servida por los dos clanes'
      - 'c) fuera de Paraguaná (Todariquiba), y el Kapubana es solo el asiento religioso al que sube'
    recomendacion: b, por DISENO_ERA2 §2 («no es capital de ningún clan») y porque hace del cerro un escenario de contacto
  - id: P2
    pregunta: ¿Cuántos subgrupos por clan, y cuántos en escena?
    resuelta: '2026-09-14: dos subgrupos por nodo (decision_creativa_2026-09-14)'
    propuesta: tres por clan (aldea madre, aldea del cerro o interior, aldea de costa), dos en escena y uno de fondo
  - id: P3
    pregunta: ¿De quién es la costa oriental media (Miraca, Baraived, Adícora, Adaure)?
    resuelta: '2026-09-14: queda de fondo, sin agentes; las zonas de pesca en escena son ZG2 y ZA1'
    opciones: ['asignarla a un clan', 'dejarla como frontera disputada: el caladero del pargo de Adícora (ZX) como conflicto que se arbitra en el cerro']
    dato_que_pesa: 'Miraca tenía cacique propio en 1538 (Bonyata), lo que podría hacer de ella un tercer grupo que #122 no contempla'
  - id: P4
    pregunta: Tótems y nombres de Kaira, Warana y de los dos linajes costeros nuevos
    materiales:
      - 'linajes con nombre de animal (comparanda achagua, parentesco-022)'
      - '«quizás la Dara [alcaraván] fuera el ave totémica de la tribu» de Adaure (Esteves p. 13, conjetura)'
      - 'los apellidos que Esteves (p. 53) da como indígenas sin deformar en Moruy: Caguao, Cuauro, Mabo, Guarecuco, Cotopo; y la «etnia Mabo» de Guacurebo (Velasco). Son del s. XX: servirían de semilla, nunca de dato'
  - id: P5
    pregunta: ¿Los «Moruyes» de la tradición son los Guaranaos (la lectura de #122) o los Amuayes reasentados (Delmonte literal)?
    por_que_importa: 'si son una tercera cosa, la tradición «Amuayes y Moruyes» no nombra los dos clanes de #122'
  - id: P6
    pregunta: ¿El linaje queda dentro de un clan (matrilocalidad estricta) o hay linajes con ramas en los dos?
    propuesta: dentro, con ramas por fisión declaradas (niveles.3.regla_de_residencia_propuesta)
  - id: P7
    pregunta: 'El merejuy: ¿lo hacen mujeres, de un solo linaje, y es saber restringido?'
    propuesta: 'sí, del linaje Corie de Moruy, marcado restringido: true como el piazgo'
  - id: P8
    pregunta: ¿Se acepta la preparación del heredero con oficiantes de los dos clanes (reclusión en el cerro, ancianas amuay, boratio guaranao)? ¿Hay cambio de nombre?
    etiqueta_de_lo_que_se_decide: hipotetico (como historia); canon-simulacion si se aprueba
  - id: P9
    pregunta: ¿Rivalidad entre boratios (Antolínez 1946 «enemistados entre sí») entre el del cerro y los de pueblo, o entre los de los dos clanes?
  - id: P10
    pregunta: ¿Una convergencia mayor por año simulado (cada 120 días) y el resto por evento?
    nota: la frecuencia fina es de implementación (DISENO_ERA2 §9), con el modelo de costos delante
  - id: P11
    pregunta: 'Guaycaríes, serranos y el buco: ¿quedan fuera del elenco de Paraguaná, entran como visitantes, o se reanclan sus oficios?'
  - id: P12
    pregunta: 'Don Alonso, «Cacique de la Provincia de Paraguaná» en 1538, tenía su pueblo en Hurihurebo, en el NORTE: ¿indica que la jefatura peninsular del contacto era amuay?'
    lectura_prudente: puede ser reconfiguración colonial de 1527-1538 (el reasentamiento de Manaure, las capturas de Federmann); no contradice que el recinto religioso esté en el cerro
  - id: P13
    pregunta: ¿Pipiacoa (Santa Ana «of Pipiacoa», 1538-1546) y Chamuriana son dos nombres del mismo sitio?
    donde_se_resuelve: campaña de topónimos (Pipiacoa no está en el canon)
  - id: P14
    choca_con: 'DISENO_ERA2 §4.3: «nada de mercados inventados»; el comercio real se monta en las ceremonias'
    pregunta: ¿La sal se modela como excedente de toda la península, con un trueque hacia afuera (la feria de la sal) separado de la redistribución ritual?
    propuesta: 'sí: dentro, don y redistribución por Manaure; fuera, trueque por sartas de cuentas después de la cosecha de sal de la seca'
    por_que_importa: da sitio a los forasteros (serranos, isleños) sin inventarles un pueblo en Paraguaná
  - id: P15
    resuelta: '2026-09-14: los cuatro subgrupos con nombre, dos por nodo (Tacuatos y Cayudes en GUARANAO; Guasicures de Caseto y Corubos en AMUAY). Sigue abierto si los apellidos de Moruy nombran casas'
    pregunta: ¿Se reajusta GUARANAO a un centro (los Moruyes, en Moruy y Chamuriana) y los cuatro subgrupos con nombre de la tradición (Tacuatos, Cayudes, Guasicures de Caseto, Corubos)? ¿Los Corubos van en el Golfete, como dice la crónica, o en la costa oriental, como sugiere Curubitos?
    y_los_apellidos: ¿Los apellidos indígenas de Moruy (Mabo, Cuauro, Caguao, Guarecuco, Cotopo, Tumarure) nombran casas dentro del centro, y los Adaures entran como subgrupo de frontera? ¿Conviven con Corie y Buio de D1 o los sustituyen?
    deuda: perseguir la lista de Petit 2012 hasta Hernández Baño 1984 o Arcaya
  - id: P16
    pregunta: ¿Se sube el peso del conuco en las aldeas del interior y se añade el monte como recurso con dueño (frutos, leña, caza y sombra del suelo)?
    propuesta: sí, y proponer al corpus de ecología el hecho del sobrepastoreo con los matices a ecologia-033 y ecologia-036
  - id: P17
    pregunta: ¿Se corrige el rasgo economía de la polity costera (curiana_polities.py, la nota de Oliver y horizonte-de-contacto), que da a la costa la red jirajara de cuentas, sal y azabache?
    propuesta: sí, con la cita de las pp. 285-286; es un error de regla 4 y de lectura

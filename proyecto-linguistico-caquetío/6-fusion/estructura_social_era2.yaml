# ══════════════════════════════════════════════════════════════════
# 2b. EL MEDIO PRECONTACTO — el suelo del s. XV no es el de hoy
# ══════════════════════════════════════════════════════════════════
medio_precontacto:
  pedido: '«Oliver dice que Paraguaná tenía igual otra disposición ecológica, ya que había matorrales y arbustos que hacían que el microclima en el suelo fuese distinto, y eso se perdió con el sobrepastoreo» (Miguel, 2026-09-13)'
  lo_que_dice_oliver:
    - afirmacion: >-
        La costa de Falcón es una provincia semiárida y xerófila donde la
        agricultura es difícil de sostener, «although not impossible»: pide
        cultivos de ciclo corto que coincidan con las lluvias breves, o riego
        por acequias, o riego a mano con el agua de lluvia recogida en charcas
        artificiales (jagüey).
      etiqueta: reconstruido
      procedencia: {obra: oliver-1989-cap3, pagina: '252 (DOC 245), §3.4.1'}
    - afirmacion: >-
        Ese casi-equilibrio de agricultura manejada, que «had to prevail in pre-
        and proto-historic times», sufrió presiones que aceleraron la erosión y
        arruinaron la capacidad del suelo de retener humedad.
      etiqueta: reconstruido
      procedencia: {obra: oliver-1989-cap3, pagina: '252 (DOC 245)'}
    - afirmacion: >-
        La vegetación y el clima de comienzos del s. XVI eran casi idénticos a
        los de hoy. La gran diferencia es el sobrepastoreo que trajo la
        explosión del ganado y sobre todo de las cabras, que caquetíos y wayuu
        adoptaron con facilidad: con las cabras, suelos precarios quedaron de
        golpe expuestos a una insolación extrema, la evapotranspiración subió a
        niveles casi intolerables y la agricultura se volvió riesgosa.
      etiqueta: reconstruido
      procedencia: {obra: oliver-1989-cap3, pagina: '253 (DOC 245)'}
      matiz_a_la_lectura_de_miguel: >-
        Oliver no dice que el monte fuera otro: dice que la vegetación era casi
        la misma y que se perdió la COBERTURA del suelo («loss of vegetative
        cover», p. 254). La lectura de Miguel —matorral y arbusto que daban otro
        microclima a ras de suelo— es ese mismo mecanismo: las mismas especies,
        con el suelo cubierto y sombreado en vez de pelado.
    - afirmacion: >-
        Los estudios de desertificación de la costa centro-occidental de Falcón
        (COPLANARH) señalan el mal manejo de los rebaños de cabras como la causa
        principal de la erosión, de la pérdida de tierra agrícola y de las zonas
        de «desierto»; el clima por sí solo no explica el estado de la
        agricultura de Falcón.
      etiqueta: reconstruido
      procedencia: {obra: oliver-1989-cap3, pagina: '253, nota al pie (DOC 245, n. 88)'}
    - afirmacion: >-
        La dependencia de las cabras viene de los primeros veinte años de la
        Conquista, sobre todo con los Welser (1527-1546): los varones caquetíos
        fueron capturados para las expediciones de El Dorado y los demás se
        volvieron casi nómadas para no ser apresados («estar alzados»). Los
        conucos quedaron sin atender, el sobrepastoreo los dejó sin cobertura y
        la erosión se volvió irreversible.
      etiqueta: reconstruido
      procedencia: {obra: oliver-1989-cap3, pagina: '253-254 (DOC 245-246), citando Oliver Ms. 1987c'}
    - afirmacion: >-
        Paraguaná va con la costa oeste de Falcón: a diferencia del valle de
        Barquisimeto, no tiene ríos que den agua casi constante para regar.
      etiqueta: atestiguado
      procedencia: {obra: oliver-1989-cap3, pagina: 'DOC 246, comienzo de §3.4.2 (impresa sin comprobar)'}
  el_testigo:
    - afirmacion: >-
        «Es tierra de fructíferos cardones [...] Hay hobos, cimirucos y mamones;
        abundantísima de toda caza: hay perdices, conejos y venados, y grande
        pesquería de pescados. De ganados hay hoy los campos llenos [...] De
        cabras muchedumbre copiosa [...] Y la cercana sierra les da grano si les
        falta por ser largo verano.»
      etiqueta: atestiguado
      capa: 'colonial: Castellanos vio Coro en la década de 1540 y lo publicó en 1589; las cabras ya están'
      procedencia: {obra: castellanos-elegias, pagina: 'líneas 48221-48246 del txt (Oliver cita la ed. de 1962, pp. 174-175, estrofas 86-87)'}
      nota: 'es la tierra de Coro, frente a Paraguaná. En el OCR de 1857 «bobos» es hobos (jobos) y «cenados» es venados'
  consecuencias_para_la_era_2:
    - que: >-
        El conuco del interior es una economía de verdad, no un complemento
        marginal del mar. Chamuriana, Moruy y Cayerúa cultivan en un
        casi-equilibrio manejado: ciclo corto en las lluvias, agua del cerro,
        jagüeyes y un suelo que el monte bajo mantiene sombreado. Da peso a la
        frase de Oliver sobre las parcelas agrícolas «igual de definidas» que
        las playas y a la función agrícola de G1, G2 y A1.
      etiqueta: canon-simulacion
      apoyo: ['oliver-1989-cap3, pp. 252-253', 'Oliver DOC 262: los asentamientos se concentran alrededor del volcán, que da el agua y los mejores suelos']
    - que: >-
        El monte es recurso y tiene dueño. El matorral que cubre el suelo da
        frutos (cardón, jobo, semeruco, mamón), leña y caza menor, y le guarda
        la humedad al conuco: talarlo o quemarlo de más es quitarle agua a la
        aldea. Es materia de lindero para el de la buena vara (of-13), y el dueño
        del cerro que no deja cortar los árboles (Capo) es la misma norma dicha
        en clave sagrada.
      etiqueta: hipotetico
      apoyo: ['castellanos-elegias, líneas 48221-48232 del txt', 'institucion_kapubana.lugares: el dueño Capo que impide cortar los árboles (Antolínez 1946, vía Tamayo)']
    - que: >-
        Ni cabras, ni ganado, ni caballos en el s. XV. El motor no tiene
        ninguno: en curiana_agents, curiana_state, curiana_lexicon y el
        orquestador, las raíces cabra, chivo, ganado, goat, caprin, vaca, oveja,
        caball, burro, mula, cerdo y gallina solo aparecen en glosas de
        comparanda lokono y wayuu (aüjawaa «matar (ganado)», «amansar (caballo,
        mula)»), que no llegan al prompt porque el muestreador filtra por
        fuente. El único «chivo» es de «archivo».
      etiqueta: atestiguado
      como: 'grep en curiana_sim, 2026-09-13'
    - que: 'Dos hechos del corpus de ecología leen el paisaje de hoy como si fuera el del s. XV: ver propuestas_a_otras_esferas.ecologia'
      etiqueta: canon-simulacion

# ══════════════════════════════════════════════════════════════════
# 2c. LAS SALINAS Y EL MERCADO
# ══════════════════════════════════════════════════════════════════
sal_y_mercado:
  pedido: '«Tenemos que tener las salinas, por lo que está otra disposición de mercado ahí» (Miguel, 2026-09-13)'
  lo_que_dicen_las_fuentes:
    - afirmacion: >-
        La costa caquetía participaba en comercio de larga distancia. El oro,
        que era signo de rango, lo conseguía de los jirajaras de Nirgua-Buria o
        de los coanaos del valle de Upar; la sal la tenía en abundancia y la
        comerciaba tierra adentro.
      etiqueta: atestiguado
      capa: s. XVI
      procedencia: {obra: oliver-1989-cap3, pagina: '285 (DOC 271)'}
    - afirmacion: >-
        Lo más extendido con valor fijo eran las cuentas de collar, de piedra
        (cuarzo, serpentinita) y de concha, estas diminutas: tres tipos,
        boroyda, mamas y querequetero o quitero. Valían por el largo de la sarta
        y por el tamaño de la cuenta (cuanto más chica, más valor), «almost like
        a monetary system», y los españoles las adoptaron enseguida para comprar
        comida a los caquetíos y cambiarlas por oro.
      etiqueta: atestiguado
      capa: '1538 (Naveros y Vázquez de Acuña, vía Gabaldón 1962) y arqueología de Oliver'
      procedencia: {obra: oliver-1989-cap3, pagina: '285-286 (DOC 271-272)'}
      valor: 'la unidad de cuenta del trueque ya existe: la sarta. ucibo «cuenta de piedra, chaquira» es voz caquetía atestiguada (Zavala #267)'
    - afirmacion: >-
        Jirajaras y xaguas también valoraban las cuentas de concha marina, y un
        sistema parecido existía entre achaguas, caribes y otros grupos de los
        Llanos. Los caquetíos eran buenos comerciantes, con asentamientos de
        frontera, como los de la Guajira, que surtían a Falcón de bienes
        exóticos.
      etiqueta: atestiguado
      procedencia: {obra: oliver-1989-cap3, pagina: '286 (DOC 272), citando Morey 1975'}
    - afirmacion: >-
        Los caquetíos de la Guajira eran probablemente puestos de avanzada que
        cambiaban productos del mar, «such as salt», por oro y otros bienes del
        valle de Upar y de la Sierra Nevada.
      etiqueta: reconstruido
      procedencia: {obra: oliver-1989-cap3, pagina: '188 (DOC 189)'}
    - afirmacion: >-
        La sal cruza las enemistades: los caquetíos de Barquisimeto la
        comerciaban en paz con aldeas xaguas de las que eran enemigos.
      etiqueta: atestiguado
      regla_4: 'es otra polity: vale como forma (el trueque no se para por la guerra), no como dato de la costa'
      procedencia: {obra: oliver-1989-cap3, pagina: '247 (DOC 240), citando Federmann [1557]'}
    - afirmacion: >-
        En el lago de Maracaibo, la salina de los onotos abastecía «toda la
        laguna y muy gran parte de la tierra y sierras por vía de contratación»,
        y los pescadores que no sembraban vendían pescado por maíz en sus
        mercados.
      etiqueta: atestiguado
      regla_4: 'polity occidental: es el modelo más cercano de un mercado de sal y pescado'
      procedencia: {obra: oliver-1989-cap3-vecinos, pagina: '227-228'}
      apoyo_en_repo: geografia_politica-011
    - afirmacion: '«la cercana sierra les da grano si les falta por ser largo verano» (la tierra de Coro)'
      etiqueta: atestiguado
      capa: colonial, década de 1540
      procedencia: {obra: castellanos-elegias, pagina: 'líneas 48245-48246 del txt'}
      valor: 'en años de seca larga el maíz entra desde la sierra: el otro lado del trueque de la sal'
  las_salinas_de_paraguana:
    aviso_regla_3: 'la lista es de Esteves (s. XX) y Arcaya (1920). Que una salina produzca hoy no prueba que se raspara en el s. XV; lo constante es la costa y la seca que evapora (ecologia, salinas)'
    GUARANAO:
      - {nombre: salina de Guaranao, sitio: 'municipio Punta Cardón, laguna de Guaranao', dato: 'las más importantes de Paraguaná (Arcaya); a su sal «le atribuían excelentes propiedades curativas en enfermedades de la piel y en carnosidades oculares»; hoy destruida por aguas cloacales', procedencia: {obra: esteves-1989, pagina: '40-41 (pie de página del OCR, sin comprobar)'}, apoyo: 'arcaya-1920 p. 22', etiqueta: atestiguado, capa: 's. XIX-XX', zona: ZG1}
    AMUAY:
      - {nombre: Las Cumaraguas, sitio: al este de El Vínculo, dato: '«extensas salinas»; hoy un poblado alrededor del complejo salinero', procedencia: {obra: esteves-1989, pagina: '33'}, etiqueta: atestiguado, capa: s. XX, zona: ZA3}
      - {nombre: Bajarigua, sitio: al norte de El Vínculo, dato: '«extensa salina» en una depresión a doce metros bajo el nivel del mar', procedencia: {obra: esteves-1989, pagina: '19'}, etiqueta: atestiguado, capa: s. XX, zona: 'ZA3, interior de A2'}
      - {nombre: Yaima, sitio: al norte de Adícora, dato: 'bahía de aguas profundas que en la Colonia fue puerto de la sal de Las Cumaraguas', procedencia: {obra: esteves-1989, pagina: '67'}, etiqueta: atestiguado, capa: colonial, zona: ZA3, valor: 'la salina del norte tiene su puerto de salida'}
      - {nombre: Sanajaquí, sitio: municipio Los Taques, dato: salinas, procedencia: {obra: esteves-1989, pagina: '58'}, etiqueta: atestiguado, capa: s. XX, zona: ZA1}
    sin_asignar_o_en_disputa:
      - {nombre: Tura, sitio: al sur de Baraived, lat: 11.826, lon: -69.826, dato: '«extensas salinas»', procedencia: {obra: esteves-1989, pagina: '66'}, etiqueta: atestiguado, capa: s. XX, zona: 'costa oriental sin asignar, junto a ZX'}
      - {nombre: Cariguariana, sitio: cerca de Adícora, dato: 'salineta de la que se sacaba sal «de excelente calidad para el consumo humano», sin la coloración rojiza de otras salinas; el nombre sería «la playa de los tabacones»', procedencia: {obra: esteves-1989, pagina: '28'}, etiqueta: atestiguado, capa: s. XX, zona: ZX}
    en_la_orilla_del_golfete:
      - {nombre: Tacuato, lat: 11.708, lon: -69.841, dato: 'en la Colonia funcionó allí un Resguardo de Salinas «para vigilar el comercio de sal que se practicaba en la localidad»; la etimología popular del nombre sale del precio de la sal, y Esteves la rechaza', procedencia: {obra: esteves-1989, pagina: '62'}, etiqueta: atestiguado, capa: colonial, zona: ZG2, valor: 'en la Colonia el control del comercio de sal estaba en la orilla que mira a Coro'}
    lectura: >-
      Los dos clanes tienen sal: GUARANAO la de la laguna, AMUAY las del norte y
      la del oeste, y la costa oriental sin asignar tiene las suyas (Tura,
      Cariguariana). Así que la sal NO es lo que un clan le da al otro: es lo que
      la península entera tiene de sobra y saca afuera. Eso corrige el reparto
      de aportes del ciclo del merejuy, que ponía la sal en la cuenta de cada
      clan como si fuera su diferencia.
    etiqueta_de_la_lectura: canon-simulacion
  dos_circuitos:
    etiqueta: canon-simulacion
    aviso: 'la separación entre don ritual y trueque es propuesta del proyecto; ninguna fuente costera la describe'
    redistribucion:
      que: >-
        Dentro de la polity no hay mercado. Los clanes entregan al Manaure en la
        convergencia y él reparte (of-01): pescado, maíz, chicha, sal y cuentas
        circulan como don y obligación, y las deudas se recuerdan, no se saldan
        en el acto.
      apoyo: 'nivel 0 (el paramount que redistribuye); el evento gran_cosecha_sal ya pone a Manaure decidiendo «cuánto se guarda y cuánto se cambia»'
    trueque_hacia_afuera:
      que: >-
        La sal, el pescado seco y salado y las cuentas de concha salen de la
        península; entran maíz en los años de seca larga, algodón, oro, piedra
        para cuentas y madera para canoas. La unidad de cuenta es la sarta.
      apoyo: 'Oliver pp. 285-286; Castellanos, líneas 48245-48246; ecologia-032 (la madera de canoa es importada)'
      puntos_de_trueque:
        - {lugar: 'la orilla del Golfete (Tacuato, ZG2)', con_quien: 'la tierra firme de Coro y la sierra', clan: GUARANAO, etiqueta: hipotetico, apoyo: 'el Resguardo colonial de Tacuato (Esteves p. 62)'}
        - {lugar: 'Yaima y la costa norte (ZA3, ZA2)', con_quien: 'Aruba y las islas; la sal de Las Cumaraguas sale por Yaima', clan: AMUAY, etiqueta: hipotetico, apoyo: 'Yaima, puerto colonial de la sal (Esteves p. 67); el contacto Alto Vista-Santa Ana (van Buurt, nodo-010)'}
        - {lugar: 'la costa oeste (Amuay, ZA1)', con_quien: 'la Guajira, donde había puestos caquetíos que cambiaban sal por oro', clan: AMUAY, etiqueta: hipotetico, apoyo: 'Oliver p. 188'}
        - {lugar: 'Hurihurebo (A2)', con_quien: 'serranos que bajan por sal y pescado', clan: AMUAY, etiqueta: hipotetico, apoyo: 'Esteves pp. 71-78, sin cita'}
      cuando: >-
        Después de la gran cosecha de sal, que el motor pone en la seca
        (curiana_state, gran_cosecha_sal), y alrededor de la convergencia de fin
        de seca: la feria de la sal sería la cara profana de la chicha del
        Kapubana. Los forasteros llegan cuando hay sal que cambiar.
      oficios_nuevos:
        - {id: of-14, nombre: 'salineros de cada clan (dueños del raspado)', funciones: [abrir y cerrar el raspado, repartir las charcas entre casas, guardar la sal de la polity], etiqueta: hipotetico, agentes_que_encajan: [Biro-ko], hueco: 'uno por clan'}
        - {id: of-15, nombre: 'la que lleva la cuenta de las sartas (memoria del trueque)', funciones: [recordar quién dio y quién debe, fijar cuántas sartas vale un cesto de sal], etiqueta: hipotetico, agentes_que_encajan: [Nubiri-sha], apoyo: 'el evento trueque_visitantes_plaza ya la pone «anotando en su memoria cada deuda»'}
      consecuencia_para_el_elenco: >-
        Da un lugar legítimo a agentes que encajaban mal: los serranos
        (Nabaraka, Raka-bi, Chorota, Jiru-ko) como forasteros de la feria, sin
        inventarles un pueblo en Paraguaná. Responde en parte a P11.

# ══════════════════════════════════════════════════════════════════
# 3. EL KAPUBANA COMO INSTITUCIÓN
# ══════════════════════════════════════════════════════════════════
institucion_kapubana:

  caracter:
    decision_2026-09-14: >-
      Miguel: el asiento religioso del Capubana «congrega y centraliza todo lo
      espiritual, por lo menos lo que es del Manaure, no necesariamente como
      institución sino a nivel energético». Manda sobre la lectura de abajo:
      el cerro es el centro, y los oficios son papeles de personas de los
      subgrupos que suben a él, no un aparato con puestos fijos. La lista de
      oficios se conserva como repertorio de papeles para el casting.
    lectura_propuesta: >-
      Una JURISDICCIÓN RITUAL EN RED anclada en un cerro, no un sacerdocio con
      templo. Las fuentes niegan el templo y el culto comunal, y a la vez dan un
      boratio por pueblo principal, un paramount que es gran chamán, un dueño
      del cerro con nombre y ritos que convocan a toda la tierra. Lo que hace
      «institución» es que los oficios sobreviven a las personas y se reclutan
      de linajes de LOS DOS clanes.
    etiqueta: canon-simulacion
    a_favor:
      - afirmacion: '«en cada pueblo principal hay un boratio», al que todos acuden'
        etiqueta: atestiguado
        procedencia: {obra: arcaya-1920, pagina: '97-100, citando Oviedo t. II p. 298'}
      - afirmacion: el boratio costero vive DENTRO de la aldea (en Barquisimeto, en cambio, vive en una casa aparte)
        etiqueta: reconstruido
        procedencia: {obra: oliver-1989-cap3, pagina: 'pdf 93 (impresa sin verificar)'}
      - afirmacion: el diao es boratio; gobernar y mediar con lo sobrenatural son la misma dignidad
        etiqueta: atestiguado
        procedencia: {obra: arcaya-1920, pagina: '48, 116, 118'}
      - afirmacion: '`boratio` = «piache, cacique, jefe, sacerdote, médico»'
        etiqueta: atestiguado
        procedencia: {obra: zavala-reyes-2015, pagina: '66, #43'}
      - afirmacion: 'el gran señor de Paraguaná, «depositario de la autoridad religiosa»'
        etiqueta: atestiguado
        capa: tres eslabones (Salas, vía Antolínez 1944, vía Morón)
        procedencia: {obra: moron-2012-petroglifos}
    en_contra_y_matices:
      - afirmacion: 'los kaketío de tierras bajas «generalmente, no tienen sacerdocio, sino médicos-hechiceros no asociados sino enemistados entre sí y en conflicto de potencias»'
        etiqueta: atestiguado
        capa: etnografía de 1946
        procedencia: {obra: antolinez-1946-hacia-el-indio}
        consecuencia: los boratios de la red compiten entre sí; la institución tiene rivalidad interna, y eso es modelable
      - afirmacion: no había culto comunal de ídolos ni templos; los seres sobrenaturales los invocaban especialistas
        etiqueta: atestiguado
        procedencia: {obra: arcaya-1920, pagina: '103, 110'}
      - afirmacion: los cronistas no mencionan estructura especializada alguna; «the Caquetío managed to be quite secretive about their most ritual/sacred spaces»
        etiqueta: reconstruido
        procedencia: {obra: oliver-1989-cap3, pagina: '275'}
        consecuencia: un recinto de monte fuera de la vista del cronista costero es compatible con ese silencio
      - afirmacion: 'para toda la provincia: adoratorios «en profundas quebradas o montes encumbrados», y caneyes donde «se juntaban los mohanes» a invocar al demonio con fotutos y ofrendas de hilo de algodón'
        etiqueta: atestiguado
        capa: 1723, generalización provincial
        regla_4: no es dato costero; se registra como marco, no como rito del Kapubana
        procedencia: {obra: oviedo-y-banos, pagina: '21-22 (libro I, cap. I)'}

  lugares:
    - nombre: Cerro Santa Ana (el Capubana, Cerro de Capú)
      coordenadas: {lat: 11.818, lon: -69.952, fuente: osm-kaketiana}
      datos:
        - {dato: 'kapubana «duende del cerro»; kapo «duende, ente sobrenatural»; kapu «demonio»', etiqueta: atestiguado, procedencia: {obra: zavala-reyes-2015, pagina: '#59, #60, #61'}}
        - {dato: '«el Cerro de Capú, al cual le cambiaron el nombre»', etiqueta: atestiguado, capa: s. XXI, procedencia: {obra: velasco-2015-resistencia, pagina: '49, 51'}}
        - {dato: 'en el cerro de Santa Ana un dueño llamado Capo, con una serpiente emplumada con una estrella en la cabeza, impide que se corten los árboles', etiqueta: retro-abstraido, procedencia: {obra: antolinez-1946-hacia-el-indio, pagina: 'vía Francisco Tamayo'}}
        - {dato: 'los hechiceros podían tratar con Capu; «allí dentro llaman al demonio, que en su lengua llaman capú (y ésto es en la lengua caquetía)»', etiqueta: atestiguado, capa: '1578-1579, polity de Barquisimeto: dato de lengua, no de la costa', procedencia: {obra: nueva-segovia-1579}}
        - {dato: 'la fuente intermitente del cerro, única agua corriente de la península', etiqueta: atestiguado, procedencia: {obra: arcaya-1920, pagina: '22'}}
        - {dato: 'hoy uno de los pocos bosques xerófitos que quedan (Monumento Natural)', etiqueta: hipotetico, deuda: sin-procedencia, apoyo_en_repo: 'toponimia_paraguana_miguel.yaml §capubana-centro-sagrado (Miguel sobre el mapa)'}
    - nombre: Cerro Capuana (Capuhana)
      coordenadas: {lat: 11.844, lon: -69.896, fuente: osm-kaketiana}
      datos:
        - {dato: '«pequeño cerro, cerca de Misaray. Quiere decir: el cerro del duende»', etiqueta: atestiguado, procedencia: {obra: esteves-1989, pagina: '26'}}
      tension: ¿dos Capubana, o el nombre bajó del cerro grande al pequeño? (toponimo-113)
    - nombre: Siraba (el monolito, «Piedra del Sacrificio»)
      coordenadas: {lat: 11.8, lon: -69.941, fuente: osm-kaketiana}
      datos:
        - {dato: 'monolito con petroglifos encabezados por una rana; los lugareños lo llaman «Piedra del Sacrificio»', etiqueta: retro-abstraido, procedencia: {obra: velasco-2015-resistencia, pagina: '51, vía Acasio 2013'}, nota: 'la lectura taína (Atabey) es interpretación; el glifo es el dato'}
    - nombre: Machuruca y Misaray
      coordenadas: {lat: 11.806, lon: -69.907, fuente: osm-kaketiana}
      datos:
        - {dato: 'sitio FAL-152 (Urumaco y Dabajuroide); cementerio indígena y petroglifo fotografiado', etiqueta: atestiguado, procedencia: {obra: oliver-1989-cap4, pagina: 'Apéndice E FAL-152'}, apoyo: 'esteves-1989 p. 49; nodo-026'}
    - nombre: Maitiruma (el manantial al pie este)
      coordenadas: {lat: 11.823, lon: -69.89, fuente: osm-kaketiana}
      datos:
        - {dato: '«manantial azul» (lectura de Esteves por el caribe insular, sin documento)', etiqueta: hipotetico, procedencia: {obra: esteves-1989, pagina: '49'}}
    - nombre: Chamuriana (el agua al sur)
      ver: niveles G1
    - nombre: Moruy (el merejuy, al oeste)
      ver: niveles G2
    - nombre: El Supí (estación costera de piedras escritas)
      coordenadas: {lat: 12.01, lon: -69.834, fuente: osm-kaketiana}
      datos:
        - {dato: '«un placer de piedras escritas»', etiqueta: atestiguado, procedencia: {obra: esteves-1989, pagina: '61'}}
      propuesta: 'la estación ritual del lado AMUAY: donde el clan del norte guarda sus propias piedras (hipotético)'

  oficios:
    - id: of-01
      nombre: el Manaure (diao-boratio mayor)
      voz: [manaure, diao, boratio]
      funciones:
        - gobernar y redistribuir
        - «dar los temporales», la lluvia y la tormenta
        - presidir la convergencia del cerro
        - repartir el primer trago
      evidencia: 'nivel 0; creencia-001b, creencia-013; Oliver p. 251 y pdf 84; Ampíes f. 14'
      etiqueta: atestiguado
      reclutamiento:
        linaje: Kaira (D1)
        clan: GUARANAO (propuesto, condicionado a la pregunta de residencia)
        via: 'las tres puertas (parentesco-038, regla del modelo por D1, hipotético como historia): elegibilidad matrilineal, ratificación de los diaos de clan, legitimación como boratio en el Kapubana'
      agente_actual: Manaure
    - id: of-02
      nombre: boratio mayor del Kapubana (el que habla con Capo)
      voz: boratio
      funciones:
        - 'oráculo de la polity: se encierra solo en un buhío uno, dos o tres días con «ahumadas» de tabaco y responde si lloverá, si el año será seco o abundante, si ir a la guerra'
        - conduce la reclusión y el ayuno del heredero (puerta 3)
        - pide permiso al dueño del cerro y abre y cierra la convergencia
        - valida el sueño o la visión del heredero
      evidencia:
        - {dato: 'el oráculo del boratio, con el encierro de 1-3 días, el tabaco y el pago en joyas de oro', etiqueta: atestiguado, procedencia: {obra: arcaya-1920, pagina: '97-100, citando Oviedo t. II p. 298'}}
        - {dato: 'que haya UNO asentado en el cerro por encima de los de pueblo', etiqueta: canon-simulacion, deuda: sin-procedencia}
      etiqueta: canon-simulacion
      reclutamiento:
        linaje: Buio
        clan: GUARANAO (Moruy)
        via: 'llamado por sueño, no por sangre (transmision-017, transmision-030: comparanda wayuu); nunca de Kaira, para que siga siendo el «único contrapeso» (CULTURA_CAQUETIA §6)'
      agente_actual: Shaboro
    - id: of-03
      nombre: boratio de pueblo (uno por aldea principal de cada clan)
      voz: boratio
      funciones:
        - curar, por pasos - ayuno de la casa con kasá, juntar el alma, soplar, chupar y extraer el objeto
        - adivinar para su aldea
        - rivalizar con el boratio del otro clan
      evidencia:
        - {dato: '«en cada pueblo principal hay un boratio»; la cura paso a paso', etiqueta: atestiguado, procedencia: {obra: arcaya-1920, pagina: '97-100, citando Oviedo t. II p. 298'}}
        - {dato: 'enemistados entre sí, «en conflicto de potencias»', etiqueta: atestiguado, capa: 1946, procedencia: {obra: antolinez-1946-hacia-el-indio}}
      etiqueta: atestiguado (el oficio); canon-simulacion (uno por clan en escena)
      reclutamiento:
        GUARANAO: {linaje: Buio, aldea: Moruy, candidata: Buio-sha cuando termine su formación}
        AMUAY: {linaje: 'Paugis o Warana (abierto)', aldea: Cayerúa, candidata: HUECO}
    - id: of-04
      nombre: ayunantes (aprendices del boratio)
      funciones: [ayunar, leer sueños, reconocer plantas, preparar el urari, dejarse el pelo largo]
      evidencia:
        - {dato: 'el médico-hechicero adquiría su carácter «mediante prolongado ayuno» y llevaba «los cabellos muy largos como una mujer»', etiqueta: atestiguado, capa: 'Relación de Nueva Segovia = Barquisimeto; regla 4 marcada', procedencia: {obra: arcaya-1920, pagina: '101'}}
        - {dato: 'ayuno en el manglar; el llamado marca a la persona', etiqueta: canon-simulacion, apoyo_en_repo: 'transmision-001'}
        - {dato: 'achagua: «Abstinencia, ayuno» = Dacãiba; «Abstenerse, ayunar» = Nuidagua', etiqueta: reconstruido, procedencia: {obra: neira-ribero-1762, pagina: 'pliego 29 der'}, nota: 'hay palabra para el ayuno en la lengua de los primos declarados (parentesco-021)'}
      etiqueta: reconstruido
      reclutamiento: {linaje: 'cualquiera, por sueño', clan: los dos}
      agentes_actuales: [Buio-sha, Sha (llamado incipiente)]
    - id: of-05
      nombre: preparadores del heredero (la casa del ayuno)
      funciones: ver preparacion_del_manaure
      etiqueta: hipotetico
      reclutamiento: 'de LOS DOS clanes, por diseño (ver preparacion_del_manaure.oficiantes)'
    - id: of-06
      nombre: guardianes del agua del cerro
      funciones:
        - cuidar la fuente intermitente y los manantiales de Chamuriana y Maitiruma
        - dar el agua para la chicha y para el rito de las primeras lluvias
        - llevar la cuenta de cuándo baja el agua
      evidencia:
        - {dato: 'la fuente del cerro y la concentración de los asentamientos alrededor del volcán por el agua', etiqueta: atestiguado, procedencia: {obra: oliver-1989-cap3, pagina: 'pdf 80'}, apoyo: 'arcaya-1920 p. 22'}
        - {dato: 'el oficio de guardarla', etiqueta: hipotetico, deuda: sin-procedencia}
      etiqueta: hipotetico
      reclutamiento: {linaje: 'Corie o Kaira', clan: GUARANAO, aldea: Chamuriana}
      agente_que_encaja: 'Wari-ko (el mejor lector de tierra y agua) — requiere reanclar'
    - id: of-07
      nombre: maestras del merejuy (fermentadoras de Moruy)
      voz:
        - "buriche 'licor fermentado, chicha de maíz' (Zavala #50)"
        - "masato 'bebida de harinas fermentada' (Alvarado p. 217)"
        - "macato 'vino de maíz' (Oviedo vía Arcaya p. 117)"
        - "kasá 'puche de maíz' (Zavala #74)"
      funciones: [guardar y reproducir el merejuy (la levadura agria), fermentar la chicha de la convergencia, medir las múcuras de cada clan]
      evidencia:
        - {dato: 'merejuy como levadura para acelerar la fermentación del maíz cocido de la chicha «que consumían en ceremonias religiosas»', etiqueta: hipotetico, procedencia: {obra: esteves-1989, pagina: '53'}}
        - {dato: 'que lo hacen mujeres mascando el maíz, y que es de Moruy', etiqueta: canon-simulacion, deuda: sin-procedencia, apoyo_en_repo: 'curiana_state.py evento preparar_chicha; DISENO_ERA2 §2 (tradición vía Miguel)'}
        - {dato: 'achagua: Masato = Amu; «Emborracharse» = Nucamau, el mismo verbo que «embarbascar» (pescar con barbasco)', etiqueta: reconstruido, procedencia: {obra: neira-ribero-1762, pagina: 'pliegos 74 der, 58 izq, 40 der'}, nota: 'la borrachera dicha con la pesca: una asociación léxica entre chicha y pesca en la lengua de los primos; Esteves (p. 22, El Barbasco) registra el barbasco en la pesca de Paraguaná'}
      etiqueta: hipotetico
      reclutamiento: {linaje: Corie, clan: GUARANAO, aldea: Moruy, restringido: 'propuesto como saber de linaje (transmision: restringido true)'}
      agentes_que_encajan: [Moruy-sha (por nombre; hoy cultiva la orilla salobre), Naure-sha (la semilla de maíz), Tina-sha (cocina y reparto), Sha-korie (hoy ya en el evento preparar_chicha)]
    - id: of-08
      nombre: cantores de hazañas (la genealogía cantada)
      funciones: [cantar de noche lo que hizo el muerto, recitar las hazañas de los ancestros en la fiesta, nombrar a los que no deben olvidarse]
      evidencia:
        - {dato: 'lloran al cacique de noche «en tono alto y cantando, y diciendo en aquel cantar lo que hizo mientras vivió», con las comarcas vecinas', etiqueta: atestiguado, procedencia: {obra: arcaya-1920, pagina: '116, citando Oviedo t. II p. 299-300'}}
        - {dato: 'el areíto antillano, genealogía del cacique cantada ante la comunidad', etiqueta: reconstruido, procedencia: {obra: angleria-1892, pagina: 'vol. 4 p. 236'}}
      etiqueta: atestiguado
      reclutamiento: {linaje: abierto, clan: 'uno por clan (propuesta), para que la convergencia tenga dos versiones del pasado'}
      agente_actual: Bana-mana (sin heredero; transmision-006)
    - id: of-09
      nombre: los de los huesos (desecar al díao, renovar su hamaca, moler los huesos)
      funciones: [sostener el fuego sin llama bajo la hamaca del díao muerto, dejarlo en hamaca nueva «como si estuviesse un hombre echado durmiendo», renovarla por años, moler los huesos para el macato]
      evidencia:
        - {dato: 'el rito de dos tiempos del díao', etiqueta: atestiguado, procedencia: {obra: arcaya-1920, pagina: '117-118, citando Oviedo t. II p. 300'}}
        - {dato: 'lo renueva «el hijo y sucesor»', etiqueta: atestiguado, capa: colonial, regla_3: 'léxico castellano; bajo el modelo matrilineal sería el sobrino-heredero'}
        - {dato: 'quien manipula huesos queda bajo tabúes severos; suelen ser mujeres o ancianos', etiqueta: reconstruido, procedencia: {obra: paz-reverol-2017-2018}}
      etiqueta: atestiguado (el rito); reconstruido (quién lo hace)
      reclutamiento: {linaje: 'Paugis (ancianas)', clan: AMUAY}
      agentes_que_encajan: [Paugis-sha, Sha-korie]
    - id: of-10
      nombre: pintores rituales (bija, jagua, bariquire)
      funciones: [pintar a los que suben al cerro, pintar la figura del boratio en joyas y madera]
      evidencia:
        - {dato: 'al beber los huesos del díao vienen «pintados de bija y jagua (busera)» y con sus joyas de oro', etiqueta: atestiguado, procedencia: {obra: arcaya-1920, pagina: '117-118, citando Oviedo t. II p. 300'}}
        - {dato: 'pintan la figura del boratio «en sus joyas y en madera»', etiqueta: atestiguado, procedencia: {obra: arcaya-1920, pagina: '97-100'}}
        - {dato: 'bariquire, «árbol tanante que da una tinta como óxido de hierro» con la que «se pintaban los aborígenes en ciertas ceremonias religiosas»', etiqueta: hipotetico, procedencia: {obra: esteves-1989, pagina: '22 (Bariquí)'}, nota: '«según hemos leído», sin cita'}
      etiqueta: reconstruido
      reclutamiento: {linaje: abierto, clan: los dos}
      agentes_que_encajan: [Pira-sha, Saruro-sha (la memoria visual)]
    - id: of-11
      nombre: el séquito de la hamaca (portadores de Manaure)
      funciones: [cargar a Manaure en hamaca, escoltarlo en la subida al cerro]
      evidencia:
        - {dato: '«always carried in hammocks by a retinue of Indians —possibly as his naborias»', etiqueta: atestiguado, capa: contacto, procedencia: {obra: oliver-1989-cap3, pagina: 'pdf 84, citando Oliver Ms. 1987a'}}
      etiqueta: atestiguado (el séquito); canon-simulacion (que lo pongan los dos clanes por turnos)
      reclutamiento: {linaje: 'jóvenes varones de todos los linajes', clan: 'los dos, por turnos: otro canal de contacto'}
      agentes_que_encajan: [Taku-ko, Suri-bana, Daru]
    - id: of-12
      nombre: mensajeros del llamamiento
      funciones: [anunciar por toda la tierra la convergencia o que «quieren beber los huesos del díao»]
      evidencia:
        - {dato: 'se hace «un llamamiento general por toda la tierra y las comarcas»', etiqueta: atestiguado, procedencia: {obra: arcaya-1920, pagina: '117-118, citando Oviedo t. II p. 300'}}
      etiqueta: reconstruido
      reclutamiento: {clan: 'los dos (uno por clan)'}
      agente_que_encaja: Pari-nu
    - id: of-13
      nombre: el de la buena vara (árbitro de linderos de playa y conuco)
      funciones: [medir tierras de labranza, dirimir querellas de posesión, fijar qué playa es de quién cuando dos clanes chocan]
      evidencia:
        - {dato: 'el «Cacique de la Buena Vara», escogido «por los comarcanos para la medición de terrenos de labranza»', etiqueta: retro-abstraido, procedencia: {obra: esteves-1989, pagina: '24-25'}}
        - {dato: 'la pregunta abierta del palabrero: ¿mediador separado de Manaure?', etiqueta: reconstruido, procedencia: {obra: guerra-curvelo-palabrero}, apoyo_en_repo: 'transmision-031, transmision-034'}
      etiqueta: hipotetico
      reclutamiento: {clan: 'propuesto del clan que NO es parte del pleito, o de los tíos maternos mayores (talaula wayuu)'}
      agente_actual: HUECO

  preparacion_del_manaure:
    lo_que_hay: >-
      Nada directo (ver meta.ceros_verificados). Hay tres piezas vecinas: el
      ayuno colectivo antes de «sacrificar o hacer alguna cosa de mucha
      importancia», con el jefe de familia y los suyos «muy flacos y
      descoloridos» (Arcaya p. 118, que cita a Oviedo t. II p. 329); la formación
      del boratio por ayuno prolongado (Arcaya p. 101, de Barquisimeto); y el
      boratio que se encierra en un buhío con tabaco para saber (Arcaya pp.
      97-100). A eso se suma la regla del modelo de las tres puertas
      (parentesco-038, D1).
    etiqueta: hipotetico
    fases_propuestas:
      - fase: 1. elegibilidad
        que: 'los sobrinos uterinos de Manaure (pluralidad de candidatos, parentesco-039); la madre del candidato y las ancianas lo presentan'
        oficiantes: [matriarca de Kaira (Itana-sha, fondo), tío materno]
        etiqueta: hipotetico
      - fase: 2. ratificación
        que: los dos diaos de clan (GUARANAO y AMUAY) aceptan o vetan al candidato
        oficiantes: [diao guaranao, diao amuay]
        etiqueta: hipotetico
        apoyo: 'el consejo de jefes de segundo orden (Oliver pdf 107, reconstruido)'
      - fase: 3. reclusión en el cerro
        que: >-
          ayuno en un buhío del recinto del Kapubana (kasá una vez al día, como
          en el ayuno de la cura), tabaco, sueño; el boratio mayor valida la
          visión; las ancianas del OTRO clan cuidan su comida y su cuerpo
        oficiantes: [boratio mayor (of-02, Buio, GUARANAO), ancianas Paugis (of-09, AMUAY)]
        etiqueta: hipotetico
        comparanda: 'reclusión con transmisión densa en la pubertad wayuu (Jahn 1927 pp. 208-211); cambio de nombre al asumir el oficio (Amodio y Pérez 2006 pp. 41-42)'
      - fase: 4. presentación
        que: sale en la convergencia del merejuy, pintado de bija y jagua; bebe la primera chicha; ¿recibe nombre nuevo?
        oficiantes: [pintores (of-10), cantores (of-08), maestras del merejuy (of-07)]
        etiqueta: hipotetico
    por_que_une_a_los_nodos: >-
      Ningún clan puede hacer Manaure solo: el boratio que valida es guaranao,
      las ancianas que cuidan el ayuno son amuay y los dos diaos ratifican. La
      sucesión se vuelve el rito que obliga a converger, además del merejuy.
    etiqueta_del_reparto: canon-simulacion

# ══════════════════════════════════════════════════════════════════
# 4. EL CICLO RITUAL DEL MEREJUY — lo que une a los dos nodos
# ══════════════════════════════════════════════════════════════════
ciclo_ritual_merejuy:
  evidencia:
    - afirmacion: merejuy, fermento de la chicha ritual, hecho en Moruy
      etiqueta: hipotetico
      procedencia: {obra: esteves-1989, pagina: '53'}
      nota: 'DISENO_ERA2 §2 lo daba como tradición vía Miguel con deuda: sin-procedencia; la fuente de esa tradición es esta página (toponimia_paraguana_miguel.yaml, 2026-09-07)'
    - afirmacion: 'el funeral del cacique común convoca a las comarcas vecinas; al díao se le «beben los huesos» con macato durante dos o tres días, tras un llamamiento general, pintados y enjoyados'
      etiqueta: atestiguado
      procedencia: {obra: arcaya-1920, pagina: '116-118, citando Oviedo t. II pp. 299-300'}
    - afirmacion: 'en el funeral del cacique menor echan al fuego una figurilla de madera con la semblanza del muerto, y los huesos molidos se beben con maçato'
      etiqueta: atestiguado
      procedencia: {obra: oliver-1989-cap3, pagina: 'pdf 88, citando Oviedo [6]:34-47'}
      nota: la figurilla no está en creencia.yaml
    - afirmacion: calendario ritual de dos polos, la fiesta de fin de seca y el ritual de las primeras lluvias
      etiqueta: reconstruido
      procedencia: {obra: jahn-1927, pagina: '384 (paralelo de rito estacional)'}
      apoyo_en_repo: creencia-014; curiana_state.py (fiesta_cosecha_chicha, ritual_siembra_primeras_lluvias)
    - afirmacion: '`waitiao` «amigo ritual, aliado de alianza»: el pacto de guaitiao, con intercambio de nombres entre aliados'
      etiqueta: atestiguado
      procedencia: {obra: oliver-1989-cap2, pagina: '147, sobre Oviedo'}
      valor: la voz caquetía para el vínculo ritual entre personas de nodos distintos
    - afirmacion: el paramount «hace abundar las sementeras» y da los temporales
      etiqueta: atestiguado
      capa: contacto
      procedencia: {obra: velasco-2015-resistencia, pagina: 'Ampíes f. 14'}

  por_que_obliga_a_converger:
    etiqueta: canon-simulacion
    complementariedad:
      GUARANAO_aporta: [el merejuy y la chicha (Moruy), el agua del cerro (Chamuriana), el maíz de las mejores tierras, el recinto y el boratio mayor, la sal de Guaranao]
      AMUAY_aporta: [pescado seco y salado, tortugas y botuto de la costa norte, caracol y sal de Las Cumaraguas, lo que llega de Aruba, las ancianas de los huesos (Paugis)]
      los_dos: [un diao que ratifica, jóvenes para el séquito, mensajeros, cantores con su versión del pasado, algodón y hamacas]
      nota_sal: 'la sal no distingue a los clanes: los dos la tienen (sal_y_mercado.las_salinas_de_paraguana). Lo que cada clan lleva al cerro es SU sal como parte del don; la sal como excedente sale por el trueque hacia afuera'
    apoyo_de_la_complementariedad:
      - {dato: 'asentamientos concentrados alrededor del volcán por el agua y el suelo', etiqueta: atestiguado, procedencia: {obra: oliver-1989-cap3, pagina: 'pdf 80'}}
      - {dato: 'tierra pobre, mar rico', etiqueta: atestiguado, apoyo_en_repo: ecologia-036}
      - {dato: 'el reparto de recursos por clan', etiqueta: canon-simulacion, deuda: sin-procedencia}

  calendario:
    base: 'curiana_state: 60 días por estación, el día 1 es seca; un año simulado son 120 días'
    etiqueta: canon-simulacion
    ciclos:
      - id: CM
        nombre: la chicha del Kapubana (convergencia mayor, fin de la seca)
        frecuencia: una por año simulado
        fases:
          - {dias_de_la_seca: '40-42', fase: anuncio, que: 'el boratio mayor se encierra en el buhío del cerro y responde si vendrán las lluvias; salen los mensajeros a los dos clanes', oficios: [of-02, of-12]}
          - {dias_de_la_seca: '42-50', fase: aportes y fermento, que: 'Moruy recibe maíz y agua y fermenta con merejuy; AMUAY junta pescado seco, tortuga y sal; se arreglan en cada clan los pleitos de playa que se llevarán al cerro', oficios: [of-07, of-06]}
          - {dias_de_la_seca: '48-54', fase: ayuno, que: 'ayunan las casas de los oficiantes y, si hay, el heredero en reclusión', oficios: [of-02, of-05, of-09]}
          - {dias_de_la_seca: '55-58', fase: subida y convergencia, que: 'las delegaciones de los dos clanes suben pintadas; el diao de cada clan entrega lo suyo a Manaure, que redistribuye; se canta; se bebe dos o tres días; se hacen pactos de waitiao, se negocian matrimonios y se arbitran linderos', oficios: [of-01, of-08, of-10, of-11, of-13]}
          - {dias_de_la_seca: '59-60', fase: regreso, que: 'cada delegación baja a su territorio con lo recibido y con las formas nuevas', oficios: []}
        canal_de_contacto: 'contacto periódico de alta intensidad de DISENO_ERA2 §4.2: los agentes de los dos nodos comparten escena 3-4 días por año, con pactos (waitiao) y matrimonios que crean contacto continuo'
        engancha_con: [fiesta_cosecha_chicha, preparar_chicha, gran_cosecha_sal]
      - id: CL
        nombre: las primeras lluvias (ciclo menor, cada clan en lo suyo)
        frecuencia: una por año, al inicio de las lluvias
        fases:
          - {dias_de_las_lluvias: '1-5', fase: pedir el agua buena, que: 'cada clan hace su rito con su boratio de pueblo; el boratio mayor manda agua del cerro a los dos', oficios: [of-03, of-06]}
        canal_de_contacto: 'bajo: solo el agua y un emisario cruzan'
        engancha_con: [ritual_siembra_primeras_lluvias]
      - id: CF
        nombre: el llanto de un jefe (funeral de diao de clan o de apopo)
        frecuencia: por evento
        fases:
          - {fase: llanto de noche, que: 'se convoca a las comarcas vecinas, incluido el otro clan; se canta lo que hizo', oficios: [of-08, of-12]}
          - {fase: fuego y huesos, que: 'el fuego con la figurilla; los huesos molidos se beben en maçato', oficios: [of-09]}
        engancha_con: [duelo_ritual_difunto]
      - id: CX
        nombre: beber los huesos del díao (extraordinario)
        frecuencia: 'una vez por generación, años después de la muerte de un Manaure, cuando «el cuerpo se descoyunta»'
        que: 'llamamiento general; toda la tierra sube; dos o tres días de macato con los huesos; es el máximo de convergencia posible'
        etiqueta: atestiguado (el rito); canon-simulacion (dónde y cuándo)
        uso_en_campana: 'un clímax de episodio, no un evento del calendario'
      - id: CC
        nombre: continuo — esposos y amigos rituales
        que: 'los esposos exogámicos cruzados viven en el nodo de su mujer; los waitiao se visitan'
        etiqueta: canon-simulacion
        apoyo: DISENO_ERA2 §4.1

# ══════════════════════════════════════════════════════════════════
# 5. HUECOS DE ELENCO — lo que la estructura pide y el elenco de 60 no tiene
# ══════════════════════════════════════════════════════════════════
huecos_de_elenco:
  nota: >-
    El elenco actual es UNA comunidad del Golfete de Coro (casa_cacique, buco,
    guaycaríes, serranos, un caribe). Aquí se dice qué agente de los 60 cabe en
    qué puesto de la estructura de Paraguaná y qué puestos quedan vacíos. No se
    reescribe a nadie.

  encajan:
    - {puesto: of-01 Manaure, agentes: [Manaure], nodo: 'GUARANAO (Kaira), a decidir'}
    - {puesto: esposa principal y redistribución, agentes: [Nubiri-sha], nodo: 'AMUAY (Warana), propuesto', aviso: 'si ella es amuay y rige la matrilocalidad, ¿dónde vive la casa del Señor? (pregunta)'}
    - {puesto: of-02 boratio mayor, agentes: [Shaboro], nodo: 'GUARANAO (Buio), recinto del cerro'}
    - {puesto: of-04 ayunantes, agentes: [Buio-sha, Sha], nodo: GUARANAO}
    - {puesto: of-09 los de los huesos y matriarcas ratificadoras, agentes: [Paugis-sha, Sha-korie], nodo: 'AMUAY (Paugis)'}
    - {puesto: of-08 cantor, agentes: [Bana-mana], nodo: 'abierto'}
    - {puesto: of-07 merejuy y chicha, agentes: [Moruy-sha, Naure-sha, Tina-sha], nodo: 'GUARANAO (Moruy)'}
    - {puesto: of-10 pintura ritual y múcuras, agentes: [Pira-sha, Saruro-sha, Tawi, Kawa], nodo: 'GUARANAO (Moruy, alfarería)'}
    - {puesto: 'hamacas del díao y regalos de alianza', agentes: [Kahu-sha], nodo: abierto}
    - {puesto: of-12 mensajero, agentes: [Pari-nu], nodo: abierto}
    - {puesto: of-11 séquito de la hamaca, agentes: [Taku-ko, Suri-bana, Daru], nodo: 'los dos, por turnos'}
    - {puesto: 'pescadores de playa asignada', agentes: [Bagre-ko, Waranaro-sha, Kunaro-bana, Uro-ko, Nubi, Piri], nodo: 'repartir entre ZG1-2 y ZA1-3'}
    - {puesto: 'vigía de cardúmenes (atalaya)', agentes: [Dara-bana], nodo: 'GUARANAO ZG1 (Sarabón, Suriquiba) o AMUAY ZA2'}
    - {puesto: canoeros y la travesía a Aruba, agentes: [Dara-ko, Dare-nu, Buko-ni], nodo: 'AMUAY ZA2'}
    - {puesto: 'isleños (Aruba a ~25 km; pescadores arubianos en Tumatey)', agentes: [Kadushi, Watapana], nodo: 'AMUAY costa norte; con trato en Santa Ana (van Buurt)'}
    - {puesto: salinero, agentes: [Biro-ko], nodo: 'GUARANAO (salinas de Guaranao) o AMUAY (Las Cumaraguas); hacen falta dos'}
    - {puesto: 'agricultores del maíz y del agua del cerro', agentes: [Ita-ko, Wama-ko, Wari-ko, Piri-sha], nodo: 'GUARANAO (Chamuriana, Moruy)'}
    - {puesto: cuidadora y canciones, agentes: [Wama-sha], nodo: abierto}
    - {puesto: cordelera de redes, agentes: [Kori-sha], nodo: 'AMUAY (costa)'}
    - {puesto: herbolaria aprendiz, agentes: [Suba-ko], nodo: 'AMUAY (Paugis)'}
    - {puesto: 'vidente anciana', agentes: [Ita-sha], nodo: abierto}
    - {puesto: 'guerreros o vigilancia de costa', agentes: [Chiriware, Chiri-ko, Tawaka], nodo: 'AMUAY A2 (Chiriware)'}
    - {puesto: 'niños y ancianos de casa', agentes: [Kori, Buko, Piru, Moro-ko], nodo: 'repartir por casa'}

  encajan_mal:
    - agentes: [Korie-ko, Buko-ko, Buko]
      problema: >-
        El buco es la presa del río de Coro (Ballesteros 1550, vía Oliver pp.
        262-263). Paraguaná no tiene «ningún río, ni siquiera un arroyo» (Arcaya
        p. 22; Oliver pdf 80). En la península su oficio tendría que reanclarse
        al agua del cerro o a charcas y jagüeyes (hipotético; en el mapa vivo hay
        unos «Estanquecitos de Los Taques»).
      procedencia: {obra: arcaya-1920, pagina: '22'}
    - agentes: [Tariwa, Kawa-ni, Piru-sha, Tari-ko, Wata-ni]
      problema: >-
        Los Guaycarí documentados son pescadores del Cojedes (Federmann) y de
        Margarita; en Paraguaná no hay ninguno (regla 4). Si se quedan en la
        era 2, entran como forasteros con otra lengua, no como pescadores de un
        clan.
      procedencia: {obra: oliver-1989-cap3, pagina: 'pdf 100'}
    - agentes: [Nabaraka, Raka-bi, Chorota, Jiru-ko]
      problema: >-
        Son serranos y bajarían a la feria. Lo único que los pone en Paraguaná
        es la frase de Esteves sobre cuicas y timotes que iban a Jurijurebo por
        sal y pescado (pp. 71-78, sin cita).
    - agentes: [Marokoto-ni]
      problema: el nodo caribe es la era 3 (decisiones_tanda_2026-09-01 §rumbo_era2)
    - agentes: [Chiriware, Taku-ko, Tawaka, Chiri-ko, Suri-bana, Pari-nu, Daru]
      problema: >-
        Hay siete agentes con ubicación perímetro o guerreros para una polity
        de la que Oliver dice que carecía de «an effective military organization»
        y cuya norma ante el conflicto era «alzarse». Se propone pasar a varios
        al séquito, al mensaje y a la vigía de costa.
      procedencia: {obra: oliver-1989-cap3, pagina: 'pdf 107'}


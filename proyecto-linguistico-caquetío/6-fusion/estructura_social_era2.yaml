# ─────────────────────────────────────────────────────────────────────────
# PROPUESTA — La estructura social atomizada de la era 2 (Paraguaná)
#
# Encargo de Miguel, 2026-09-13, sobre el elenco de «2 linajes por nodo» de
# DISENO_ERA2 §3:
#   «el elenco hay que pensarlo mejor para atomizarlo más para definir los
#   subgrupos también. Y hay que identificar que ambos grupos tenían sus zonas
#   pesqueras. Y que el merejuy es algo que debería unir a los dos nodos para
#   los procesos ritualísticos. Recordemos que Kapubana es un asiento
#   religioso por lo que debe haber varios puestos religiosos, los que
#   preparan al Manaure por ejemplo. Una "institución" por así decirlo.»
#
# Regla 5: esto PROPONE. No toca curiana_agents.py, el motor, el lexicón ni
# 3-mundo/corpus/. Nada de aquí es canon hasta que Miguel lo fusione.
# Resumen legible: 6-fusion/issues-pendientes/diseno-elenco-era2-estructura.md
# ─────────────────────────────────────────────────────────────────────────
meta:
  recogido: '2026-09-13'
  estado: sin-fusionar
  obra: varias
  quien: escriba (Claude), a pedido de Miguel
  pregunta: >-
    ¿Cuál es la estructura social —polity, clan, subgrupo, linaje, casa— sobre
    la que se arma el elenco de los dos nodos de Paraguaná (GUARANAO y AMUAY,
    #122)? ¿Dónde pescaba cada clan? ¿Qué oficios religiosos sirven al
    Kapubana, incluida la preparación del Manaure? ¿Qué ciclo ritual del
    merejuy obliga a los dos clanes a converger?
  ancla: >-
    #122 cerrada el 2026-09-12 (paraguana_dos_clanes.yaml §verificacion):
    GUARANAO = Moruy, Santa Ana (Chamuriana) y la laguna, centro-sur; AMUAY =
    Cayerúa y la costa oeste, norte. El Moruy de Delmonte se lee como
    reasentamiento colonial. Etiqueta reconstruido, con la deuda de la frase
    cardinal de Oliver.
  vocabulario_de_etiquetas:
    atestiguado: una fuente lo dice, con página. Si la fuente es del s. XVI o posterior se marca `capa` y, si se proyecta, `regla_3`
    reconstruido: inferencia de un autor o comparanda arahuaca citada
    canon-simulacion: posición que el proyecto toma para simular, sobre piezas citadas
    hipotetico: plausible sin respaldo, o propuesta nueva de esta sesión
    retro-abstraido: tradición viva del s. XX (la capa de creencia.yaml); a efectos de proyección vale como hipotético
  convencion_de_paginas: >-
    Oliver 1989 cap. 3: las pp. 251, 262-263, 265-266, 275 y 276 están
    verificadas a ojo en sesiones anteriores. El resto se cita por la página del
    PDF comprimido (`fuentes_caquetios/Chapter 3 Ethnohistory.DOC-comprimido.pdf`,
    pdftotext) porque ese PDF no guarda un desfase constante con la impresa: la
    p. 251 cae en la pdf 69 y la 275 en la pdf 82. Esteves 1989: la página sale
    del número de pie del OCR y coincide con el canon de topónimos donde lo hay.
  paginas_de_oliver_medidas_2026-09-13: >-
    Medido en la segunda vuelta. El PDF comprimido del cap. 3 es la edición en
    DOC de 2006 («only in PDF version, 2006», pdf 62) y lleva su PROPIA
    paginación en la cabecera (cabecera = pdf + 182 en sus 113 páginas). La
    tesis impresa de 1989 pagina distinto: con OCR del escaneo de UCL (impresa =
    pdf − 27) se comprobó que la sal de la Guajira está en la p. 188 (DOC 189),
    la alianza jirajara de cuentas, sal y azabache en la 245 (DOC 238), la sal
    con los xaguas en la 247 (DOC 240), el paisaje de la costa de Falcón en las
    252-254 (DOC 245-246), el reasentamiento en Todariquiba en la 259 (DOC 251)
    y el comercio costero con las cuentas en la 285-286 (DOC 271-272). La
    «p. 251» con que el canon cita Todariquiba es la del DOC. Las otras
    «verificadas a ojo» (262-263, 265-266, 275, 276) no se recomprobaron en
    esta vuelta. En las secciones nuevas se cita la impresa comprobada y, entre
    paréntesis, la del DOC. Auditoría completa: encargo aparte.
  medido:
    elenco_actual:
      total: 60
      tier_1: 15
      tier_2: 33
      tier_3: 12
      como: 'python: curiana_agents.ALL_AGENTS, 2026-09-13'
    dias_por_estacion:
      valor: 60
      como: 'curiana_state.DIAS_POR_ESTACION; el día 1 es seca'
  fuentes_usadas:
    obras: [oliver-1989-cap3, oliver-1989-cap2, oliver-1989-cap4, zavala-reyes-2015, arcaya-1920,
            esteves-1989, velasco-2015-resistencia, castellanos-elegias, oviedo-y-banos,
            antolinez-1946-hacia-el-indio, moron-2012-petroglifos, alvarado-1921, jahn-1927,
            keegan-1989, amodio-perez-2006, perrin-1992-1995, paz-reverol-2017-2018,
            guerra-curvelo-palabrero, angleria-1892, van-buurt-2014, antczak-2015-las-aves,
            neira-ribero-1762, medina-colina-sxx, osm-kaketiana, perez-de-tolosa-1546,
            ballesteros-1550, federmann-1916, nueva-segovia-1579]
    repo: [3-mundo/corpus/parentesco.yaml, 3-mundo/corpus/genealogia.yaml, 3-mundo/corpus/creencia.yaml,
           3-mundo/corpus/transmision.yaml, 3-mundo/corpus/ecologia.yaml, 3-mundo/asentamientos.yaml,
           3-mundo/polities-caquetias.md, 3-mundo/ensayos/05_geografia_politica_y_sucesion.md,
           3-mundo/CULTURA_CAQUETIA.md, 2-lengua/toponimos.yaml, 6-fusion/paraguana_dos_clanes.yaml,
           6-fusion/toponimia_paraguana_miguel.yaml, 6-fusion/toponimos_mapa_kaketiana.yaml,
           6-fusion/antolinez_1946_capo_y_ortografia.yaml, 6-fusion/petroglifos_y_manaure.yaml,
           6-fusion/velasco_primarios_agi.yaml, 6-fusion/medina_colina_dictado.yaml,
           6-fusion/achagua_neira_ribero_1762.yaml, curiana_sim/curiana_agents.py,
           curiana_sim/curiana_state.py, curiana_sim/curiana_lexicon.py, curiana_sim/lexicon_zavala.py]
    texto_crudo_releido: >-
      Oliver cap. 3 entero (pdftotext), Arcaya 1920 entero (pdftotext), Velasco
      2015, Oviedo y Baños, los seis OCR de Esteves y Castellanos 1857 (txt),
      buscando por raíces cortas. Se leyeron las fuentes, no solo sus notas en
      el vault.

  # Regla 6: cada cero con su consulta. Un cero mide la consulta, no la fuente.
  ceros_verificados:
    - que: preparación, iniciación, reclusión o ayuno del Manaure o del heredero al cargo de diao
      raices: [ayun, fast, encierr, seclu, iniciac, inicia, initiat, reclu]
      resultado: >-
        CERO en fuente costera. Arcaya 1920 da 4 de `ayun` y ninguno es del
        diao: la formación del piache (p. 101, Nueva Segovia, que es
        Barquisimeto), el ayuno de la casa del enfermo (pp. 97-100) y el ayuno
        colectivo antes de la guerra (p. 118). En Oliver cap. 3 `fasting` da 0 y
        los 2 de `initiat` no son rito («reinitiated our travel» y una nota
        sobre los juicios de residencia). Esteves y Velasco dan 0 de `ayun`. En
        la elegía de Coro de Castellanos `ayun` da 2, los dos en sentido
        figurado. Los 4 `inicia` de Arcaya son el verbo o «inicial».
    - que: nombre de un oficio religioso caquetío distinto de boratio o diao
      raices: [piach, boratio, mohan, mohán, sacerdot, behique, bohit, boiti, boíti]
      resultado: >-
        `behique`, `bohit` y `boíti` dan 0 en todo el repo y en todas las fuentes
        crudas. La elegía de Coro de Castellanos (líneas 48483-55152 del txt) da
        0 en piach, boratio, mohan, sacerdot, chich, macato, areit, borrach y
        santuario. Los aciertos del texto completo (piach 2, mohan 3, chicha 4,
        macato 1, areito 1) caen todos fuera de esa elegía. Oviedo y Baños
        habla de «piaches y mohanes» para toda la provincia de Venezuela, no
        para la costa. La única voz caquetía es `boratio`, y `diao` para el jefe.
    - que: merejuy
      raices: [merej]
      resultado: >-
        UNA sola aparición en todo el material: Esteves 1989 p. 53, dentro de la
        etimología de Moruy y sin cita. 0 en Arcaya, Velasco, Oviedo y Baños,
        Oliver cap. 3 y Castellanos; 0 en el dictado de Medina Colina; no está en
        el lexicón (lo dice toponimo-108).
    - que: chicha o bebida de maíz en la costa
      raices: [chich, macato, maçato, mazato, masato, buriche, cazá, kasá]
      resultado: >-
        Los 8 `chich` de Arcaya son el topónimo Chichiriviche o finales en
        -chiche. Los `maçato` de Oliver cap. 3 son jirajaras (la casa de hombres,
        pdf 59), de Barquisimeto (el jefe de paz, pdf 93-94) y del funeral de
        los caciques menores costeros (pdf 88, vía Oviedo [6]:34-47). En el
        lexicón hay tres voces atestiguadas: `buriche` 'licor fermentado,
        chicha de maíz' (Zavala #50), `masato` (Alvarado p. 217, que cita a
        Oviedo II.297 y 300) y `kasá` 'puche de maíz' (Zavala #74).
    - que: localización de las playas de pesca de cada clan
      raices: [beach, fishing, pesca, pesc, pesquer, playa]
      resultado: >-
        Oliver p. 275 lo dice sin rodeos: cómo se repartían las zonas de captura
        «can not be inferred from the available data». En la elegía de Coro de
        Castellanos `pesc` da 9, pero la feria «a trueco de la sal y del
        pescado» y los labradores que van a «rescatar con estos pescadores» son
        de Maracaibo (líneas 49205-49330), y «diestros en la pesca y en la caza»
        es de la Guajira. Los 3 `pesquer` de Arcaya son de perlas. Todo lo que se
        localiza abajo es reconstrucción sobre topónimos del s. XX.
    - que: Oviedo y Valdés t. II (pp. 297-300, 329), la fuente de casi todo el ritual costero
      resultado: >-
        NO se puede leer en el repo: pdftotext falla con
        Oviedo_Valdes_1851_Historia_General_Indias_vol1.pdf (xref dañado), y
        además es el vol. 1. Todo Oviedo llega vía Arcaya 1920, Oliver cap. 3 y
        Alvarado 1921.

  lo_que_no_se_encontro:
    - Ningún dato de cómo se preparaba, iniciaba o legitimaba al Manaure (ver ceros). La institución que se propone abajo es reconstrucción e hipótesis sobre piezas vecinas
    - 'Ningún cronista describe estructuras rituales caquetías: Oliver p. 275 («quite secretive»), Arcaya pp. 103 y 110 (sin templos ni culto comunal), Antolínez 1946 («no tienen sacerdocio»)'
    - Del merejuy no consta quién lo hacía, cuándo, ni que uniera clanes; solo existe la frase de Esteves p. 53
    - No hay reparto de playas por clan, ni número de aldeas por clan, ni nombre precontacto de ningún jefe de clan
    - No hay tótems ni nombres de linaje caquetíos; hay la comparanda achagua (parentesco-022) y la conjetura de Esteves p. 13 sobre Adaure
    - No hay residencia precontacto de Manaure; Todariquiba es el reasentamiento de 1527
    - 'No están en el repo: Delmonte 1883, González Batista 1984 (el que cita Oliver; gonzalez-batista-nombre-de-coro es otra obra), Salas directo, el artículo de Antolínez 1944 (solo vía Morón), Acasio 2013, Martí 1774, Ponce y Vaccari 1977'
    - 'Ningún mercado ni feria de sal costera antes de la Colonia: el Resguardo de Salinas de Tacuato y el puerto de la sal en Yaima son coloniales (Esteves pp. 62, 67); en los seis OCR de Esteves feria, mercado, trueque, rescate e intercambio solo dan el trueque de cuicas y timotes en Jurijurebo, sin cita'
    - 'Ninguna fuente CITABLE da subgrupos de Paraguaná con nombre. Los que hay (Tacuatos, Corubos, Cayudes y Guasicures de Caseto, de la tribu de los Guaranaos) son de un cronista local de 2012 sin cita; ver niveles, GUARANAO_subgrupos_con_nombre'

  avisos_regla_3:
    - La geografía de los clanes es de Delmonte 1883, sobre papeles perdidos, vía González Batista y Oliver. Santa Ana y Moruy como PUEBLOS son coloniales (Esteves p. 35, fundación de 1538; Arcaya p. 327, San Nicolás de Moruy fundado a fines del XVI «con otros Caquetíos que antes ocupaban otros sitios de Paraguaná»)
    - 'Los caciques de Paraguaná con nombre son de 1538 (carta de Bastidas): Don Alonso de Hurihurebo, Bonyata de Myraca y Esteban, principal de Cayarua. Sirven como plantilla de escala, no como norma del s. XV'
    - '«Hijo y sucesor» en el funeral del díao (Oviedo) es léxico colonial: ver parentesco-002 (¿carnal o clasificatorio?)'
    - Hermandades y Alcaldes gobernaban Santa Ana y Moruy en el s. XVIII (Oliver pdf 74). Son instituciones castellanas y NO se proyectan
    - Los topónimos pesqueros (atalayas, ensenadas, «hoy aldea de pescadores») son de Esteves 1989, del s. XX. El nombre puede ser viejo; la función que describe es la de hoy
    - Oviedo y Baños (1723) generaliza para toda la provincia de Venezuela; por la regla 4 no es dato costero


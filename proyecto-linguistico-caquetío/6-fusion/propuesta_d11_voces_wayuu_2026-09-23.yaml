# LAS PREGUNTAS PARA MIGUEL, CON LETRA
# ══════════════════════════════════════════════════════════════════════
preguntas:
  - 'kashi (ahora): A danu · B chabaka · C archivar. (recomiendo A)'
  - 'yama (aquí): A popoi, la atestiguada «ahí» · B yaha · C wayare. (recomiendo A; B si quieres el contraste aquí/ahí)'
  - 'sulu (adentro): A ruku · B loko · C archivar. (recomiendo A)'
  - 'wana (ver): A diki · B kaba · C archivar. (recomiendo A)'
  - 'naba (pensar): A kuburuku · B ikisi · C archivar. (recomiendo A)'
  - 'tüshi (frío): A kasalini · B archivar. (recomiendo A)'
  - 'kapua (amanecer): A mautia · B tukamara · C archivar. (recomiendo A)'
  - 'anüiki (habla, lengua): A archivar, lo cubre maa · B dia · C chuani. (recomiendo A)'
  - 'pütchi (palabra sagrada): A archivar, lo cubren maa y barsure · B dia · C chuani. (recomiendo A)'
  - 'wanü (anciano): A wasima, la atestiguada · B baharuko. (recomiendo A)'
  - 'bana (hígado): A se queda, justificada por el lokono de Goeje y en hipotético · B archivar. (recomiendo A)'

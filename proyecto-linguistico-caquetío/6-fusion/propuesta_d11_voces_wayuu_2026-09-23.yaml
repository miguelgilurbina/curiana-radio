# ══════════════════════════════════════════════════════════════════════
# LO QUE NO SABEMOS
# ══════════════════════════════════════════════════════════════════════
lo_que_no_sabemos:
  - 'Ninguna de las once tiene forma caquetía propia salvo las dos que cubre una atestiguada. Todo lo demás sale de una sola hermana.'
  - 'Si el caquetío distinguía aquí/ahí/allí. Zavala da un solo deíctico, `popoi` «Ahí», y la cadena pasa por Angulo Molina, que no está en el repo.'
  - 'El «frío» lokono: las fuentes del repo no lo tienen. Un cero de ESTAS fuentes (regla 6).'
  - 'El achagua es la lectura por visión de un solo lector; sólo Yrrico y Casalinibe se re-verificaron en imagen aquí.'
  - 'La página propia del vocabulario achagua: en la esquina de algunos pliegos hay un número (p. ej. «37.» en 64 der.) que nadie ha medido; se cita por pliego y lado.'
  - 'Brinton 1871 no tiene página medida en el .txt del repo.'

# ══════════════════════════════════════════════════════════════════════
# CÓMO SE APLICA SIN ROMPER EL INSTRUMENTO
# ══════════════════════════════════════════════════════════════════════
como_se_aplica:
  - 'Es parte del mismo corte de serie de la tanda final (tf.9): nada de lo dicho se reescribe.'
  - 'Se archivan en FUERA_DEL_HABLA, con la capa intacta: kashi, yama, sulu, wana, naba, tüshi, kapua, anüiki, pütchi y wanü. Quedan en la puerta y no se pueden reacuñar.'
  - 'Entran seis formas hipotéticas nuevas: danu, ruku, diki, kuburuku, kasalini, mautia. `bana` cambia de nota y baja a hipotético.'
  - 'Las plantillas: la lista de conectores de la completa y de la breve; personas, naturaleza y cuerpo de la completa; el EJEMPLO de IDENTIDAD (que tf.1-tf.3 ya obligan a reescribir: «Dai diki-kuba…», «Da-barsure kuburuku»); el ejemplo ideal de la completa.'
  - '⚠️ `prompt_refuerzo` enseña por RECORTE (`[:4]`): `kashi` y `yama` están en su lista de conectores (posiciones 5 y 7, y `kashi` también en el respaldo «ka, mara, kashi, wara») y `naba` en la de verbos (posición 7); la medición estática, con `palabras_usadas=[]`, sólo ve `wana`, que va primera. Hay que cambiar las LISTAS, como se hizo con `kira`/`kali` el 2026-09-19.'
  - 'La koiné: `FORMAS_SEED` (7 `wana-*` y 2 `naba-*`) y `_NUCLEO_FALLBACK` (`wana`).'
  - 'El evento «tüshi-juri» de curiana_eventos.py; y los otros sitios que las nombran fuera del motor medido (seed_demo_run.py, la lista de prueba de curiana_database.py).'
  - 'Las reglas: los ejemplos con `anüiki` (6) y con `wanü` (2).'
  - 'Los tests: 105 apariciones de las diez voces que cambian (57 son de `wana`).'
  - 'Renombrar ninguna clave lokono si se aceptan las recomendadas. Sí, si se elige B en yama (`yaha`), sulu (`loko`) o naba (`ikisi`), o C en yama (la achagua `guayare`).'
  - >-
    ⚠️ La capa. Las seis nuevas son hipotéticas, como `bui`, `lihi` y `tuhu` en
    tf.1. El perfil `era2` NO muestra la capa hipotética en el muestreador
    (5-experimento/perfiles_de_run.yaml): allí sólo llegan por la plantilla.
    Hoy `sulu`, `yama`, `kapua` y `tüshi` son reconstruidas y el muestreador
    del perfil era2 las puede sacar; sus sustitutas no. Si la corrida base va
    con el perfil era2, hay que medir que la plantilla las enseña a los tiers
    que hoy las ven por muestra.
  - 'No se midió el score entero con el motor nuevo: hace falta la tanda aplicada.'


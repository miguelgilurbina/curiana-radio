  - 'Glosario del bajo español (Alvarado 1929) s.v. matacán — cerraría la etimología con fuente venezolana; requiere descargar los tomos (BNV)'
  - 'medina-colina-sxx s.v. matacán en el físico'
  - 'Diccionario de americanismos s.v. matacán (403 el 2026-09-14)'
  - 'si se fusiona algo que cite al DLE/Wikcionario: ficha en 4-fuentes/ (regla 8)'

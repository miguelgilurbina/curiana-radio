# ══════════════════════════════════════════════════════════════════════════
# D. EL MAR — lo que Oliver dice, y el cero bien medido
# ══════════════════════════════════════════════════════════════════════════
# La pregunta de Miguel: ¿era el mar esencial en la cosmovisión caquetía?
# Respuesta de Oliver 1989: el mar es ESENCIAL en la economía, el territorio y
# la expansión de los caquetíos costeros, y no aparece NUNCA en lo que dice de
# su creencia. El cero está medido (medición §mar): en qué ventanas de texto
# coinciden una palabra del mar y una de la creencia, y qué dicen.

mar:
  lo_que_si_dice:
    - {tema: navegacion, pagina: 483, obra: oliver-1989-cap4, texto: '«At this time the Dabajuran (Urumaco) had also learned maritime navigation, and had colonized the Netherlands Antilles»', verificado: imagen}
    - {tema: ruta, pagina: '474-475', obra: oliver-1989-cap4, texto: '«This contact and diffusion must have involved a maritime route, from Ranchería [...] to Curacao, and from there to [...] FAL-100 [...] and [...] FAL-101»'}

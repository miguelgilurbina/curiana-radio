    discrepancia_interna: >-
      El TEXTO (p. 456, verificado en imagen) da ISGS-1423 como «500 ± 110
      B.P.»; la TABLA, «550 ± 110». La calibración (1280-[1407]-1440) es la
      misma en los dos. Una de las dos BP es errata del autor; no se decide aquí.
    errata_de_sitio: 'la p. 436 dice «Túcua (FAL-69 [...])» y la p. 419 y el resto, FAL-60: FAL-69 es Corralito. Errata del original.'

  cultura_material:
    ceramica:
      - 'dos vajillas netamente separadas: «Ordinary Ware» de cocina y almacén, tosca, y «Fine Ware» de servir, pintada; en algunas subtradiciones la fina guarda los huesos de los muertos (p. 421)'
      - 'desgrasantes: calcáreo (zazare /çaçare/) en Túcua; en Corralito, CONCHA — «about 75%» guarataro, ostra fósil quemada y molida, y el resto otras conchas marinas (pp. 438, 447)'
      - 'del budare al aripo: Túcua usa budares gruesos; en Early Urumaco aparecen los aripos finos y en Corralito el budare ya se abandonó. Oliver: «One is tempted to suggest a shift from caçabe (cassava bread) to arepa (maize "cake") consumption» (pp. 440-441)'
      - 'el maíz, desde el principio: impresiones de tusa en las bases, del penúltimo nivel de Túcua en adelante; la técnica sigue viva en Pola Urbina de Sarinao, Paraguaná (pp. 441-443)'
      - 'el cuenco tetrápodo biomorfo para beber, con pico y cabeza modelada, asociado a urnas de entierro secundario: Oliver lo liga al masato del segundo funeral del díao; el más antiguo fechado, Corralito, cal. A.D. 1278-[1336]-1393 (p. 442)'
      - 'motivos: un BATRACIO aplicado (patas, manos, ojos, cabeza) que se abstrae con el tiempo hasta una «M» (p. 451); el motivo «claviforme», exclusivo dabajurano (p. 452); y en Los Médanos un AVE negro-sobre-rojo que llega de Portacelli y se vuelve espiral en el lugar (pp. 473-474)'
    piedra: 'manos y metates abundantes en Túcua, Corralito y Los Médanos (p. 438); cuentas de cuarzo y serpentinita de baja calidad (DOC p. 271); fogones de piedra en anillo (p. 456)'
    concha: 'cuentas de concha «as small as a pinhead», con valor por largo de sarta (DOC p. 271); concha como desgrasante (p. 447); concheros (abajo, `fauna`)'
    metal: >-
      CERO en la arqueología del cap. 4. El oro de los caquetíos es dato
      ETNOHISTÓRICO (Neukomm 1535, Naveros y Vázquez de Acuña 1534): narigueras
      y orejeras biomorfas, brazaletes, collares; Oliver añade que el oro «is
      negligible in the coastal plains of Falcón» y tenía que venir de fuera
      — la Guajira/Ranchería o las serranías de Nirgua-Buria (tesis pp. 217-218).
    entierros: 'urnas de entierro secundario; en Túcua, un grupo de huesos humanos cortados y quemados junto a cuencos tetrápodos (tesis p. 284); «more than one type of (secondary) burial» por fase (tesis p. 284)'

  contactos:
    norte_antillas: >-
      Sólo las ABC, y dentro de la polity: fechas en Knip-9, Knip-26, Knip-27
      (Curazao), Tanki Flip y Savaneta (Aruba); el estilo Santa Cruz de du Ry =
      Early Urumaco y el Savaneta = Late Urumaco / Los Médanos-A (p. 424); «the
      great majority of the archaeological sites reported for Aruba, Curacao
      and Bonaire» son Urumaco (p. 452). NINGÚN contacto con las Antillas
      Mayores en el cap. 4: medido en la medición §antillas.
    ruta_maritima_oeste: >-
      El hallazgo mayor del capítulo. Tras A.D. 1300, cuencos negro-sobre-rojo
      con un ave idéntica a la de Portacelli-2 (valle del Ranchería) aparecen
      en FAL-100 y FAL-101, hechos EN Coro (pasta local), y en Curazao; en
      ningún sitio intermedio por tierra. Oliver: «This contact and diffusion
      must have involved a maritime route, from Ranchería [...] to Curacao, and
      from there to J. Gregorio Hernández (FAL-100) and La Maternidad
      (FAL-101)» (pp. 474-475). Y propone que la gente de Los Médanos eran los
      caquetíos de frontera de Chichibacoa y el Cabo de la Vela «who commuted
      via the Islands back and forth to Coro» (p. 477). Coanaos y wanebucanes
      son sus candidatos a la gente de Portacelli (p. 476).
    al_lado_de_casale_2024: >-
      Dato del coordinador (otra parcela): Casale 2024 une cada isla ABC sólo
      con la costa de enfrente. Oliver no lo contradice en lo LOCAL (la gente de
      Curazao con «strong kinship ties to the Caquetío of Paraguaná», p. 476),
      pero propone además un tránsito largo Ranchería–Curazao–Coro. Las dos
      cosas pueden ser ciertas; si Casale midió redes y no halló ese tránsito,
      ése es el punto a contrastar.
    oeste_por_tierra: 'Bachaqueroan hacia Maracaibo (1350-1500); tiestos «Mauroa-like» en Kusi''a, Guajira oriental (p. 432); Hakaritama emparentado con el guajiro (p. 411 n. 285)'
    este: 'Dabajurano en Campoma (Cumaná) y Margarita; tiestos Urumaco de comercio en Chuao (p. 428); y en Nueva Cádiz de Cubagua (1516-1543), por caquetíos cautivos «as pearl divers for the Spanish» — COLONIAL (p. 428)'


# ─────────────────────────────────────────────────────────────────────────
# PROPUESTA — mundo. Un minador propone, el humano fusiona (regla 5).
# Tercera campaña de minería, parcela M1: Oliver 1989, lo que quedaba a medias.
# La lengua va aparte: 6-fusion/oliver1989_lexico_restante_2026-09-22.yaml.
#
# DOS EDICIONES Y DOS PAGINACIONES — no se mezclan:
#   · `tesis`: el escaneo UMI de 1989 (fuentes_caquetios/
#     Oliver_1989_Tesis_Arawakan_NW_Venezuela_UCL.pdf). Página impresa =
#     pdf − 27, comprobado en tres puntos: 559 (pdf 586), 593 (pdf 620) y 745
#     (pdf 771, número leído por OCR sobre la cabecera). El texto sale del OCR
#     guardado en fuentes_caquetios/ (tres .ocr.txt nuevos de esta campaña).
#   · `doc`: la versión DOC del cap. 3 que tiene el repo («Chapter 3
#     Ethnohistory.DOC-comprimido.pdf», con capa de texto). Es la edición
#     REVISADA para el PDF de 2006 («Illustration added for the PDF version
#     only»): página = pdf + 182, y NO coincide con la tesis (el funeral del
#     díao está en la p. 270 del DOC y en la 283-284 de la tesis). La ficha
#     oliver-1989-cap3 cita por el DOC.
#
# Verificado en imagen: la Tabla 15 (p. 459), p. 438, p. 439 y p. 483. El
# resto es OCR de prosa limpia en inglés: sirve para citar la idea; una forma
# que decida algo se mira en la imagen antes de citarla.
#
# Las cifras de este archivo (cuántas fauna, cuántas páginas, cuántas
# menciones del mar) las emite 6-fusion/scripts/oliver1989_restante.py en
# 6-fusion/medicion_oliver1989_restante_2026-09-22.yaml. Aquí no hay cifras
# de conteo escritas a mano (regla 1); las que hay son del autor (fechas,
# porcentajes) y van entre comillas.
# ─────────────────────────────────────────────────────────────────────────

meta:
  recogido: '2026-09-22'
  campana: tercera campaña de minería, parcela M1
  obras: [oliver-1989-cap3-vecinos, oliver-1989-cap4, oliver-1989-apendice-a]
  obras_de_contraste: [oliver-1989-cap3, oliver-1989-cap2]
  estado: propuesta — nada fusionado
  medicion: 6-fusion/medicion_oliver1989_restante_2026-09-22.yaml
  ocr_nuevo:
    - fuentes_caquetios/Oliver_1989_cap3_s323_chibchas.ocr.txt       # tesis pp. 211-222
    - fuentes_caquetios/Oliver_1989_cap3_s33_falcon_lara.ocr.txt     # tesis pp. 231-254
    - fuentes_caquetios/Oliver_1989_cap4_s47_s415_dabajuroide.ocr.txt  # tesis pp. 411-487

# ══════════════════════════════════════════════════════════════════════════
# A. GEOGRAFÍA POLÍTICA Y VECINOS (cap. 3, §3.2.3 y §3.3)
# ══════════════════════════════════════════════════════════════════════════

vecinos:

  - grupo: coanao
    variantes: [coanaos, guamos (Castellanos)]
    familia: 'chibcha (probable) — «can not be proven on linguistic grounds, but rather in terms of dress etiquette»'
    donde: 'Ranchería medio y César alto, compartido con los buredes; puestos en el norte de la Sierra de Jarara (Guajira)'
    relacion_con_caqueties: >-
      Socios comerciales: sal hacia el interior a cambio de oro. El intérprete
      Esteban Martín, que dominaba el caquetío, se entendía con coanaos y
      buredes sin intermediario, y Oliver concluye que «the Caquetío of coastal
      Falcón could and did communicate with the Coanao as well as the Burede».
    polity_caquetia: occidental
    tipo_de_contacto: mercado
    procedencia: {obra: oliver-1989-cap3-vecinos, pagina: '214-218', edicion: tesis}
    en_etnias_yaml: 'NO — nombrado en polities-caquetias.md y en la ficha, sin entrada en etnias.yaml'
    epoca: contacto-temprano

  - grupo: wanebucán
    variantes: [guanebucán, Duanabuká (tradición kogi)]
    familia: 'desconocida — Oliver sospecha arahuaca por nombres de aldea «suspiciously Caquetío» (Paragua-nil, Coria-na)'
    donde: 'La Ramada, costa entre la Sierra Nevada y el río Hacha; con aldeas en la Guajira (Punta Espada–Chichibacoa)'
    relacion_con_caqueties: >-
      Nexo comercial en Punta Espada–Chichibacoa. «excellent sailors and
      fishermen», con canoas monóxilas y una casa ceremonial con «a thousand
      Indians sculptured in wood» (Castellanos vía Reichel-Dolmatoff). Tras la
      conquista se refugian en la Sierra Nevada y los absorben los kogi como
      clanes (tuxe/dake).
    polity_caquetia: occidental
    tipo_de_contacto: mercado
    procedencia: {obra: oliver-1989-cap3-vecinos, pagina: '211-213', edicion: tesis}
    en_etnias_yaml: 'NO'
    epoca: contacto-temprano

  - grupo: tairo / tairona
    familia: chibcha (antepasados de los kogi)
    donde: Sierra Nevada de Santa Marta (Buritaca, Guachaca)
    relacion_con_caqueties: 'indirecta: vecinos de los wanebucanes «never there was war between them»; sin contacto caquetío documentado'
    polity_caquetia: occidental
    tipo_de_contacto: ninguno
    procedencia: {obra: oliver-1989-cap3-vecinos, pagina: '211-213', edicion: tesis}
    en_etnias_yaml: 'NO'

  - grupo: xiriguana
    variantes: [yrriguanas, jiriguana]
    familia: desconocida («other differences in their speech»)
    donde: al sur de coanaos y buredes, a 25 leguas; aldeas de 10 a 15 casas
    rasgo: 'las mujeres se tatuaban pechos y brazos con pintura negra «fijas que nunca se quitan»'
    polity_caquetia: occidental
    tipo_de_contacto: ninguno
    procedencia: {obra: oliver-1989-cap3-vecinos, pagina: '215-216', edicion: tesis}
    en_etnias_yaml: 'NO'

  - grupo: arhuaco / haruacana
    variantes: [aruaco, aruacana, aruago, haroacana, haraocana]
    familia: 'chibcha (Oliver: los de Chinacota, quizá barí/motilón)'
    donde: laderas sur y sureste de la Sierra Nevada; valle de Chinacota (Pamplona); dos aldeas en el suroeste del lago
    rasgo: flechas envenenadas; aldea de tres barrios de doce casas (quizá organización tripartita)
    polity_caquetia: occidental
    tipo_de_contacto: guerra
    contacto_nota: 'con los españoles (mataron a Alfinger y a Monsarrate); con los caquetíos, ninguno documentado'
    procedencia: {obra: oliver-1989-cap3-vecinos, pagina: '218-220', edicion: tesis}
    en_etnias_yaml: 'NO'

  - grupo: jirajara
    variantes: [girara, jirara, xidehara, piracoras (Pérez de Tolosa, «in all probability a mistranscription»)]
    familia: jirajara (con ayomán y gayón; Greenberg la mete en el paezano, Oliver tiene «serious doubts»)
    donde: 'Sierra de San Luis, «three leagues from the city of Coro»; Nirgua, Aroa, valle del Yaracuy; Sierra de Jirajara'
    relacion_con_caqueties: >-
      El vecino de TIERRA ADENTRO inmediato de la polity costera. Tres hechos:
      (1) entre 1527 y 1530, en paz, abastecían de maíz a Coro — «excellent
      maize farmers» (Pérez de Tolosa 1546); (2) Federmann cruzó la sierra
      cercana a Coro sin ataques y sólo los halló hostiles en Churuguara;
      (3) Oliver propone que las «hijas de caribes» con que estaba casado
      Manaure (Probanza de Ampíes, 1526) eran JIRAJARAS de San Luis, porque a
      los jirajaras se los llamaba «caribes» por belicosos (DOC pp. 269-270;
      tesis pp. 281-282). Hacia el interior, guerra endémica de rapto de
      mujeres y niños y «shifting and ephemeral alliances»; comercio de
      cuentas de concha, sal y azabache aun entre enemigos.
    polity_caquetia: costera
    tipo_de_contacto: corresidencia
    contacto_nota: 'matrimonio del diao (propuesta de Oliver, no dato) y abasto de maíz (dato colonial temprano); ⚠️ compilar_etnias exige procedencia para `costera`'
    procedencia: {obra: oliver-1989-cap3-vecinos, pagina: '236-237, 244-245', edicion: tesis}
    en_etnias_yaml: 'NO como pueblo — sólo como etnónimo `ayaman`/`ajagua` en el lexicón, y parentesco-019 advierte contra agrupar por etnónimo'
    epoca: contacto-temprano
    aviso_regla_3: 'el abasto de maíz y la boda son de 1526-1530, con los españoles ya en Coro'

  - grupo: ayomán
    variantes: [ayamán]
    familia: jirajara
    donde: 'sur de Churuguara, valle del Tocuyo, Sierra de Parúpano-Matarere («midgets»)'
    relacion_con_caqueties: >-
      Ninguna directa. Importa por lo que dice del MAR desde fuera: compraban
      conchas marinas a otras naciones «and because they live far from it
      [sea] they esteem them as exotic items, since they know nothing about
      the sea and never go there» (Federmann, tesis p. 243).
    polity_caquetia: barquisimeto
    tipo_de_contacto: mercado
    contacto_nota: 'comercio «down-the-line» de azabache y concha; la concha, «perhaps via Yaracuy»'
    procedencia: {obra: oliver-1989-cap3-vecinos, pagina: '237-243', edicion: tesis}
    en_etnias_yaml: 'NO'

  - grupo: gayón
    variantes: [coyón, cuyón, cayones]
    familia: jirajara
    donde: sierras al norte de Barquisimeto, «three leagues» de Nueva Segovia
    relacion_con_caqueties: 'archienemigos de ayomanes y jaguas; su lista es la que trae `auri` perro (ver la propuesta léxica)'
    polity_caquetia: barquisimeto
    tipo_de_contacto: ninguno
    procedencia: {obra: oliver-1989-cap3-vecinos, pagina: '244', edicion: tesis}
    en_etnias_yaml: 'NO'

  - grupo: xagua
    variantes: [axagua, jagua]
    familia: desconocida («the few words recorded [...] have no relationship to either Jirajaran or Caquetío»)
    donde: Sabana de Carora; hacia 1546, en las alturas de Baragua
    relacion_con_caqueties: >-
      Con los caquetíos de Barquisimeto, enemigos Y socios: «some Xaguas of the
      last villages [...] trade salt with those [Caquetío] peacefully»
      (Federmann, tesis p. 247). Oliver no acepta que sean los achaguas.
    polity_caquetia: barquisimeto
    tipo_de_contacto: mercado
    procedencia: {obra: oliver-1989-cap3-vecinos, pagina: '245-247', edicion: tesis}
    en_etnias_yaml: 'NO'

  - grupo: camagos
    donde: sierras al norte de Barquisimeto, junto a gayones, jaguas y jirajaras
    familia: desconocida («todos éstos diferentes en lenguas»)
    procedencia: {obra: oliver-1989-cap3-vecinos, pagina: '244', edicion: tesis, via: 'Relación de Nueva Segovia 1579 (Arellano 1964: 182)'}
    polity_caquetia: barquisimeto
    tipo_de_contacto: ninguno
    en_etnias_yaml: 'NO'

  - grupo: chipa
    variantes: [cyparicotes, chiparicotos]
    familia: 'desconocida — «clearly different from the Caquetío, and perhaps related to Carib»'
    donde: montaña de Aroa
    relacion_con_caqueties: >-
      «There is a reference to a Chipa Indian who knew how to speak Caquetío»;
      enemigos de los caquetíos de Barquisimeto. Oliver: `chipa` es
      probablemente voz CAQUETÍA para esa gente ('piedra, montaña'), y -coto
      un sufijo caribe que, siguiendo a Butt Colson, NO significa 'esclavo'
      sino gente de un tramo de río: chipa-coto = «Mountain People».
    polity_caquetia: yaracuy
    tipo_de_contacto: vecindad
    procedencia: {obra: oliver-1989-cap3-vecinos, pagina: '249-251', edicion: tesis}
    en_etnias_yaml: 'SÍ — es etnia-003 `ciparicoto`, y ver la contradicción abajo'

cruce_con_etnias_yaml:
  ya_estan: [etnia-003 ciparicoto (= chipa), etnia-004 bubure, etnia-005 burede, etnia-006 pemeno, etnia-007 kirikire]
  faltan_con_pagina_de_oliver: [coanao, wanebucán, tairo, xiriguana, haruacana, jirajara, ayomán, gayón, xagua, camagos]
  contradice:
    - entrada: etnia-003 ciparicoto
      campo: familia_linguistica
      canon: 'arahuaca (Zavala Reyes 2015 p. 61 vía Molina 2009)'
      oliver: '«Their language was clearly different from the Caquetío, and perhaps related to Carib, since no one in Federmann''s expedition could communicate with them» (tesis p. 251)'
      propuesta: 'bajar a `desconocida` con aviso_familia que dé las dos lecturas; en duda, degradar (regla 2)'
    - entrada: etnia-003 ciparicoto
      campo: etimologia
      canon: 'formantes «cotos y gotos» caribes = «pueblo, gente» (Arcaya 1920 p. 36)'
      oliver: 'n. 178: chipa + -coto = «Mountain People»; «the inference of coto or goto as a "slave" is wrong»'
      propuesta: 'no contradice a Arcaya; añadir a Oliver como segunda lectura concordante'
  la_propuesta_de_jirajara_costera: >-
    Si Miguel quiere al jirajara como vecino de la polity costera, es la
    primera entrada de etnias.yaml con `polity_caquetia: costera` y fuente
    (el caribe del elenco, etnia-008, no la tiene). El guardián lo exige y
    aquí la hay: tesis pp. 236-237 (San Luis a tres leguas de Coro, maíz a
    Coro) y DOC pp. 269-270 (la propuesta de las esposas). La etiqueta, por la
    boda: `hipotetico` — es inferencia de Oliver sobre la palabra «caribes».

cruce_con_polities_caquetias_md:
  lo_que_ya_esta: 'la tabla de cinco polities, el diao paramount que es gran chamán, la occidental como avanzada comercial'
  lo_que_falta:
    - 'los LÍMITES de la costera según Oliver: «between the Golfo Triste and somewhere near the Cocuiza-Maticora river», con Aruba, Curazao, Bonaire y Paraguaná (tesis p. 251)'
    - 'el correlato arqueológico por polity: costera = subtradición Dabajurana; Barquisimeto-Yaracuy = Tierrana (cap. 4, pp. 424, 481-485)'
    - 'la sede de Manaure (abajo)'
  lo_que_contradice: 'nada medido: el cap. 3 §3.3 y el cap. 4 sostienen la tabla tal como está'

manaure:
  sede_segun_oliver: >-
    Dos datos que no se deben fundir. (1) PROPUESTA de Oliver para antes del
    pacto: «I would venture to suggest that Manaure's immediate and most direct
    authority as a great diao was the territory (cacicazgo?) of Caçicure, with
    its seat of power being in the so-called (by the Spanish) Pueblo Viejo»,
    que él identifica con el sitio FAL-77, al NE de Mitare (tesis p. 277 n.
    206 = DOC pp. 265-266 n. 114; «I have a strong hunch»). (2) DATO de 1527:
    Manaure acuerda con Ampíes «to resettle near what is today Coro (a village
    called Todariquiba)» (DOC p. 251); Todariquiba estaba «about 1 or so
    leagues from Coro» y Oliver sospecha que quedó «within the urban expansion
    of modern Coro» (DOC p. 259). Y Manaure y su hijo Alexandre dejan
    Todariquiba juntos por los abusos de Santillana (DOC p. 268).
  al_lado_de_lo_que_trajeron_otros:
    castellanos: 'pp. 185-186: «sobre caciques tuvo mando», en andas, bautizado don Martín (dato del coordinador, otra parcela)'
    cey_1545: 'pone a Manaure en Coro y no en Todariquiba (dato del coordinador, otra parcela)'
    lectura: >-
      No chocan con Oliver: si Todariquiba quedó dentro del Coro moderno,
      «en Coro» y «en Todariquiba» pueden ser el mismo sitio visto por un
      cronista de 1545 y por un documento de 1527. Lo que Oliver añade que nadie
      más da es la sede ANTERIOR al pacto (Caçicure / Pueblo Viejo, en la costa
      occidental), y ésa es la única que toca el precontacto. Es corazonada
      suya, declarada como tal.
  andas_y_adornos: 'DOC p. 266: «always carried in hammocks by a retinue of Indians»; oro y collares de cuentas de concha (coincide con Castellanos)'
  poder_sobre_el_clima: >-
    Ampíes 1525 (DOC p. 258): «makes himself be worshiped as God, telling the
    Indians that he gives [controls, predicts] the storms»; Aguado vía Nectario
    María (DOC p. 266): autor de «the rain, hale, thunders and lightenings,
    coldness, and drought; and the fruitfulness of the land». Ya en creencia
    (creencia-001b y el hecho de las tormentas). Es cielo y tierra de cultivo:
    NO nombra el mar.
  esposas_y_parientes: >-
    Casado con doña Sancha; «confederated and married with daughters of the
    caribes» (Probanza 1526); hija casada con un principal de Hurihurebo, con
    residencia en el pueblo del marido; los hijos, virilocales. Oliver lee
    «caribes» como jirajaras (arriba).
  sucesion: 'el oficio de diao «in the XVIth century inherited by the son of the diao»; Alexandre hereda «upon retiring» su padre (DOC pp. 268, 289). Ya en parentesco-001: nada nuevo.'
  guerra: 'la costa «Military organizations were deemphasized» (DOC p. 291). Nada nuevo.'
  comercio: 'sal hacia el interior; cuentas de concha (boroyda, mamas, querequetero o quitero) con valor «fixed», casi moneda (DOC p. 271). Ya en estructura_social_era2.yaml.'

# ══════════════════════════════════════════════════════════════════════════
# B. ARQUEOLOGÍA (cap. 4, §4.7-4.15)
# ══════════════════════════════════════════════════════════════════════════

arqueologia:

  cronologia_dabajurana:   # tesis pp. 422-423 (verbatim de la clasificación)
    tucua: 'A.D. 800 to 1100/1200'
    urumaco: 'A.D. 1100/1200 to 1400/1450'
    los_medanos: 'A.D. 1350 to 1600/1650'
    bachaqueroan: {bachaquero: 'A.D. 1300-1600', las_minas: 'ca 1300-1500', supidebo_antunez: 'A.D. 1300-1450'}
    campoman: 'Guaraguao, Punta Arenas, Playa Guacuco ca. A.D. 1000-1500; Campoma A.D. 1100-1300 (costa oriental: Cumaná, Barcelona, Margarita)'
    tierran: 'Tierra de Los Indios y San Pablo, ca. A.D. 1000 to Post-Contact (Barquisimeto-Quíbor y Yaracuy)'
    antes_de_800: >-
      «I have not found any evidence of pottery complexes in coastal Falcón
      prior to A.D. 800» salvo Coy-Coy y un Tortolitan en el Borojó (p. 434);
      la costa la ocupaban «Meso-Indian hunters, gatherers, and fishermen until
      very late», y Oliver cree que sobrevivieron «until, and probably well
      after, the colonization of the region by the Dabajuran peoples»
      (pp. 434-435). La costa que colonizan los dabajuranos NO estaba vacía.

  expansion:   # p. 452 y p. 483, verificada en imagen la 483
    - 'Early Urumaco: expansión «fairly rapid, perhaps a matter of two to three generations»; «By A.D. 1200 most of the region delimited above had been settled» (p. 452)'
    - '«By A.D. 1100 to 1200 the Dabajuran (Earl Urumaco) had colonized much of Eastern Falcón [...], Coro, Paraguana, and had settled along major coastal rivers in western Falcón between Borojó and Mitare rivers. At this time the Dabajuran (Urumaco) had also learned maritime navigation, and had colonized the Netherlands Antilles» (p. 483)'
    - '«by at least A.D. 1300 the Dabajuran peoples had sailed as far as the west coast of the Guajira» (p. 483)'
    - 'Bachaqueroan: expansión tardía y «regresiva» hacia el oeste de Falcón y la cuenca de Maracaibo, 1350-1500 (pp. 427, 483)'

  sitios_nombrados_en_el_texto:
    # El inventario completo (134 códigos) ya está en 6-fusion/nodos_oliver_apendice_e.yaml.
    # Aquí sólo lo que el TEXTO del cap. 4 dice de cada uno.
    - {codigo: FAL-60, nombre: Túcua, dice: 'piedemonte, cul-de-sac; complejo Túcua abajo, Early Urumaco arriba; fogones con fauna (ver `fauna`); pocas conchas marinas', pagina: '436-443'}
    - {codigo: FAL-69, nombre: Corralito, dice: '= El Mamón de Nomland 1935; junto al Urumaco (Codore); «extensive shell refuse»; se ve el cerro Santa Ana de Paraguaná', pagina: '436, 444-452'}
    - {codigo: FAL-100, nombre: José Gregorio Hernández, dice: 'Los Médanos A y B; sin estratigrafía (dunas); tres C14; jarra de aceite española s. XVI en el sector 2', pagina: '452-476'}
    - {codigo: FAL-101, nombre: La Maternidad, dice: 'mismo patrón que FAL-100; saqueado por turistas y huaqueros', pagina: '473-475'}
    - {codigo: 'FAL-18 a 23', nombre: Supidebo, dice: 'Bachaqueroan; conchero «C» con una lente de concha SIN cerámica bajo arena estéril', pagina: '427, 459'}
    - {codigo: 'FAL-30, 31, 33, 34', nombre: Quebrada Antúnez, dice: 'Bachaqueroan (posible)', pagina: '427'}
    - {codigo: FAL-154, nombre: Santa Ana (Paraguaná), dice: 'Late Urumaco «still lavishly decorated», fecha terminal cal. A.D. 1415 (IVIC-14, de Zucchi)', pagina: '473'}
    - {codigo: 'FAL-143 / FAL-149', nombre: 'Cayerúa / Moruy (Paraguaná)', dice: 'quizá un Los Médanos-A local, por pocos bordes huecos y más engobe rojo en los datos de Howard; sin el motivo zoomorfo negro-sobre-rojo — «do not allow me to be absolutely certain»', pagina: '471-472'}
    - {codigo: FAL-7, nombre: 'Maticora', dice: 'planta de una maloca de 18 × 22 m con dos fogones, complejo Maticora: «the only known Pre-Columbian structure in Falcón State»', pagina: '431 n. 300'}
    - {codigo: 'FAL-94 / FAL-93', nombre: 'Coy-Coy de Uria / La Maleta (Sierra de San Luis)', dice: 'cuevas con cerámica dabajurana tardía mezclada; Oliver liga lo Dabajuroide de 1500-1600 en la sierra a la huida de la costa y a las esposas jirajaras de Manaure', pagina: '432-433'}
    - {codigo: FAL-77, nombre: Pueblo Viejo (NE de Mitare), dice: 'la sede propuesta de Manaure; concheros de chipichipi (foto del PDF de 2006)', pagina: 'tesis 277 n. 206; DOC 265'}

  tabla_15_escaneo:
    # Leída en IMAGEN en el escaneo de 1989, p. 459 (pdf 486). Se compara con
    # 6-fusion/tabla15_c14_oliver.yaml, que salió del .DOC y dice «recalibrada
    # por el propio Oliver con OxCal v3.10 para la versión PDF de 2006». El
    # script mide si las cifras difieren.
    pagina_impresa: 459
    titulo: 'Table 15: C14 dates from Coastal Falcón and the Netherlands Antilles'
    calibracion_declarada_en_el_texto: 'Stuiver and Reimer 1986 (pp. 440, 447, 456)'
    filas:
      - [ISGS-1173, 'Túcua', '1100 ± 70', 783, 944, 998]
      - [ISGS-1174, 'Píritu-La Luz', '920 ± 110', 1000, 1098, 1220]
      - [IVIC-223, 'Knip-9', '910 ± 50', 1027, 1112, 1192]
      - [IVIC-224, 'Knip-9', '830 ± 60', 1158, 1215, 1261]
      - [IVIC-12, 'La Luz, Parag.', '830 ± 50', 1160, 1215, 1260]
      - [IVIC-18, 'Sta. Ana, Parag.', '790 ± 100', 1160, 1257, 1280]
      - [ISGS-1255, 'Túcua', '790 ± 70', 1164, 1257, 1279]
      - [I-4026, 'Tanki Flip', '765 ± 105', 1162, 1262, 1284]

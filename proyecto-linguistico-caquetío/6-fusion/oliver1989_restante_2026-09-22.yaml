  lo_que_no_dice: >-
    Ni un rito, un mito, un ser, una ofrenda ni un tabú ligado al mar para la
    polity costera. Lo sagrado que Oliver atribuye a la costa es el poder de
    Manaure sobre la lluvia, el granizo, el trueno, el frío, la sequía y «the
    fruitfulness of the land» (DOC p. 266): cielo y tierra de labranza. El
    rito descrito con detalle (la muchacha dada «al sol por mujer» junto al
    río) es de Barquisimeto. La iconografía dabajurana es de batracio y de ave,
    no de pez ni de concha. Y la A-9, el vocabulario caquetío que Oliver
    reúne, trae una sola voz marina (guaranaro, la lisa) y ninguna palabra
    para 'mar' — la del proyecto, `para`, sale de su cap. 2.
  lectura_para_miguel: >-
    Oliver no refuta que el mar fuera central en la cosmovisión: no la tiene.
    Su fuente de creencia costera es mínima (Ampíes, Aguado, Oviedo para el
    funeral) y ninguna la pregunta. Lo que SÍ sostiene, con fechas, es que la
    polity costera se hizo NAVEGANDO: colonizó las ABC hacia 1100-1200, tuvo
    parientes en Curazao y, desde 1300, una ruta de mar hasta el Ranchería que
    cambió hasta la manera de servir la comida en Coro. Si el mar era esencial
    en la vida, lo era en la de los que cruzaban. Llevar eso a CREENCIA es un
    paso que la fuente no da: iría como `hipotetico`, no como dato.

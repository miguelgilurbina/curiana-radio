      - [ISGS-1423, 'FAL-100: NW', '550 ± 110', 1280, 1407, 1440]
      - [IVIC-14, 'Sta. Ana, Par.', '520 ± 120', 1299, 1415, 1451]
      - [ISGS-1254, 'Supibedo 1b', '470 ± 70', 1409, 1432, 1452]
      - [IVIC-241, 'Gaito', '340 ± 50', 1455, 1567, 1640]
      - [ISGS-1424, 'FAL-100: S2', '330 ± 110', 1521, 1572, 1641]

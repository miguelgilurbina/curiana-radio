# Decisiones de Miguel sobre el GRUPO 2 de #222 — «Canon del mundo (no
# cambian el prompt)», diecisiete entradas dp.2.01-dp.2.17 (2026-09-24)
#
# De dónde sale la lista: 6-fusion/decisiones_pendientes_2026-09-23.yaml,
# clave `grupo_2_mundo` (datos, citas y opciones de cada una), y su resumen
# legible 6-fusion/issues-pendientes/decisiones-pendientes-2026-09-23.md
# §Grupo 2 (la recomendación que se aplica: donde el escriba dice «Mía»,
# manda la suya).
#
# Lo que dijo Miguel, en dos tiempos:
#
#   «Acepto todo lo recomendado»                       (tanda de las hermanas)
#
#   «Ok a todo, que no quede ninguna tarea pendiente. Lo único pendiente es
#   lo que tenga que ver con docker»                   (2026-09-24)
#
# Registrado ANTES de tocar nada (fusionar-propuesta §0). Cada entrada lleva
# `eleccion` (la recomendación del resumen), `lectura_operativa` (lo que el
# escriba entiende que eso obliga a hacer, escrito aparte para que no parezca
# que lo decidió Miguel), `estado` (APLICADA / CERRADA SIN CAMBIO / NECESITA
# A MIGUEL) y `aplicado_por`.
#
# Tres reglas del encargo que mandan sobre todas las entradas:
#   1. Lo que la recomendación manda ESPERAR se cierra como decidido y
#      declarado, sin aplicar nada.
#   2. Lo que sólo Miguel puede hacer (reconocer un sitio, mirar un folio en
#      PARES) no se inventa: queda NECESITA A MIGUEL con la pregunta exacta y
#      el resto de la entrada aplicado.
#   3. Lo que aparezca al aplicar y nadie previó (una colisión, una capa
#      dudosa, un dato que contradice) NO se resuelve de paso: se salta, se
#      escribe en `lo_que_aparecio_al_aplicar` y se dice en el informe.
#
# Y una frontera de este frente: no se tocan curiana_lexicon.py, los
# lexicon_zavala/a2/achagua generados, el motor (curiana_*.py) ni las
# plantillas — otro frente trabaja ahí. Lo que lo exija queda NECESITA A
# MIGUEL con la razón.


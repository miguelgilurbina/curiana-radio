  estado: EN CURSO — se pone al día al cerrar cada entrada

decisiones:

  dp.2.01:
    tema: el contacto precolombino con las Antillas Mayores — ¿qué capa?
    eleccion: 'C + E — se parte en dos afirmaciones (C1 reconstruida, C2 hipotética) y se reformula como contacto «por cadena de tramos cortos», falsable'
    lectura_operativa: >-
      Las tres afirmaciones de dc.4 entran al corpus de geografía política con
      su capa: costa ↔ ABC con parentesco (atestiguado), costa/islas ↔ La
      Española 1513-1526 (atestiguado, colonial) y la tercera partida en C1
      «el guanín circulaba entre Tierra Firme y las Antillas Mayores antes de
      1492» (reconstruido) y C2 «la esfera caquetía participaba en ese
      circuito» (hipotético), con la forma E —si lo hubo, fue por cadena de
      tramos cortos— y sus predicciones falsables escritas.
    estado: APLICADA (2026-09-24)
    aplicado_por:
      - '3-mundo/corpus/geografia_politica.yaml: geografia_politica-016 (costa ↔ ABC con parentesco, atestiguado), -017 (la embajada, la hija y La Española, atestiguado, colonial), -018 (C1: el circuito del guanín antes de 1492, reconstruido) y -019 (C2 + E: la esfera en ese circuito, hipotético, formulado como cadena de tramos cortos con sus predicciones)'
      - '4-fuentes/ampies-1526-carta.md: ficha nueva (la carta, vista en imagen en Fernández Duro t. II p. 212), que sostiene -016 y -017'
    verificado: 'Fernández Duro t. II p. 212 en imagen; Arcaya pp. 160-161 y 167-168; Colón en Navarrete t. I pp. 400-401; Oviedo vol. I p. 507; Anglería vol. 1 p. 309; Casale 2024 fig. 1 en imagen; Oliver DOC pp. 198, 258, 266'

  dp.2.02:
    tema: la polity de los llanos — misma lengua con variación, y los caquetíos del Casanare
    eleccion: 'Federmann A + Tolosa A + Rivero (b) + Gumilla A, aplicadas juntas: un solo hecho con cuatro testigos; el motor no se toca'
    lectura_operativa: >-
      Un hecho del corpus (geografía política) con las cuatro citas; el rasgo
      de lengua y de economía a `llanos` en 3-mundo/polities-caquetias.md con
      la nota de Rivero (cita directa, sin continuidad política probada) y
      «Cacatia» de Gumilla en la ficha y en el mapa de dispersión del
      etnónimo. `curiana_polities.py` NO se toca (es del motor): la nota que
      Rivero (b) pide para `llanos` va al vault.
    estado: APLICADA (2026-09-24), salvo el espejo en el motor, que NECESITA A MIGUEL
    aplicado_por:
      - '3-mundo/corpus/geografia_politica.yaml: geografia_politica-020, un hecho con cuatro testigos (Federmann 1916 pp. 58 y 108; Pérez de Tolosa p. 234; Rivero pp. 29, 54, 144, 151, 201, 392; Gumilla t. II p. 55), atestiguado'
      - '3-mundo/polities-caquetias.md: §«Los llanos: la misma lengua, con variedades — y el Casanare» (el rasgo de lengua y de economía de Tolosa A, la cita directa de Rivero (b)) y la tabla del etnónimo fuera de la costa (el mapa de dispersión de Gumilla A)'
    verificado: 'Pérez de Tolosa p. 234, Rivero pp. 29, 151 y la lista de pueblos, y Gumilla t. II p. 55, en la capa de texto; Federmann por su propuesta (visto en imagen por su parcela)'
    necesita_a_miguel: >-
      Tolosa A y Rivero (b) piden también la línea en la polity `llanos` de
      curiana_sim/curiana_polities.py (hoy `llanos` no tiene rasgo de lengua).
      Es motor y este frente no lo toca (regla 6 del encargo). Pregunta: ¿se
      lo pasas al frente del motor con esta edición? — añadir a `llanos` un
      rasgo de LENGUA «misma nación que la costa, "aunque algo difieren en la
      habla á los de Coro" (Pérez de Tolosa 1546, p. 234, de segunda mano)»,
      uno de ECONOMÍA «"no son grandes labradores", carne y pescado (ibid.)»
      y, en el territorio, la nota «el "hasta Casanare… Barraguán" descansa en
      Rivero 1883 (pp. 29, 54, 144, 151, 201, 392) vía Jahn; colonial, sin
      continuidad política probada».

  dp.2.03:
    tema: el campo `epoca` en 3-mundo/etnias.yaml
    eleccion: 'Sí, antes de dp.2.04 (T8 D)'
    lectura_operativa: >-
      `epoca` con vocabulario cerrado (precontacto · contacto-temprano ·
      colonial · varias), exigido cuando `polity_caquetia: costera`, validado
      por curiana_sim/compilar_etnias.py (el 9.º guardián; no es motor).
    estado: APLICADA (2026-09-24)
    aplicado_por:
      - 'curiana_sim/compilar_etnias.py: EPOCAS, `epoca` en los vocabularios cerrados (matiz en `epoca_nota`) y el error `costera-sin-epoca`'
      - 'curiana_sim/tests/test_etnias.py: tres tests nuevos (costera sin época, vocabulario cerrado, fuera de la costera no se exige)'
      - '3-mundo/etnias.yaml: el esquema de la cabecera, y `epoca: precontacto` en etnia-008 (la única costera al aplicar: la ficción del elenco en la ventana simulada)'
    no_se_hizo: 'no se rellenó `epoca` en las fichas no costeras: la decisión la exige sólo para la costera, y fecharlas es leer cada fuente otra vez'

  dp.2.04:
    tema: los vecinos que faltan en etnias.yaml
    eleccion: 'M1 B, T5 D, T8 B y C, en ese orden (epoca primero)'
    lectura_operativa: >-
      M1 B: los grupos de Oliver que faltan, con el jirajara como vecino de la
      costera (hipotético por la boda) y etnia-003 a familia `desconocida`.
      T5 D: el taíno (contacto ninguno) y sus dos hechos de geografía
      política. T8 B: la corrección a la campaña 1 (gen-03 y el aviso de
      arq-01). T8 C: los arahuacos de las Antillas Menores, atestiguado,
      contacto poblacional hacia las ABC, con `epoca`.
    estado: APLICADA (2026-09-24) salvo T8 C, que NECESITA A MIGUEL
    aplicado_por:
      - '3-mundo/etnias.yaml: M1 B — etnia-010 coanao, -011 wanebucán, -012 tairo, -013 xiriguana, -014 haruacana, -015 jirajara (costera, hipotético por la boda, contacto-temprano), -016 ayomán, -017 gayón, -018 xagua, -019 camagos; etnia-003 ciparicoto baja a familia `desconocida` con las dos lecturas y gana el apoyo concordante de Oliver n. 178'
      - '3-mundo/etnias.yaml: T5 D — etnia-020 taíno (costera, hipotético, contacto ninguno, época `varias`); T5 la proponía como etnia-009, número que ya era del guaiquerí'
      - '3-mundo/corpus/geografia_politica.yaml: T5 D — geografia_politica-014 (la deportación de 1513-1526, colonial) y -015 (el horizonte marítimo, precontacto, con nota de lo que llegó después)'
      - '6-fusion/taino_en_la_esfera_2026-09-21.yaml: T8 B — gen-03 corregido (el cero de Fernandes era de la biblioteca) y el contrapeso genético en el aviso de arq-01'
      - 'curiana_sim/tests/test_etnias.py: el cable-trampa de quién toca la costera pasa a {caribe del elenco, jirajara, taíno} y exige que ninguna sea atestiguada y que todas tengan época'
    verificado: 'Oliver tesis pp. 211-220, 236-247 y 251 (OCR con marcador de página) y DOC pp. 198, 250 y 269-270; Arcaya pp. 154 y 159; Martínez-Cruzado 2003 p. 4; el preprint de Fernandes 2020 p. 14'
    lecturas_del_escriba:
      - 'donde M1 escribió una familia «probable» (coanao y haruacana, chibcha), el campo cerrado dice `desconocida` y la probable va a aviso_familia (regla 2)'
      - 'haruacana: M1 escribió `tipo_de_contacto: guerra`, pero la guerra documentada es con los españoles y su propia nota dice «con los caquetíos, ninguno»: va `ninguno`'
      - 'intensidad: M1 no la daba; va `desconocida` donde el dato no la mide y `ninguna` donde no hay contacto'
      - 'taíno: `polity_caquetia: costera`, como la propuso T5 (el único contacto documentado, la deportación, es con la costera y sus islas); `ninguna` (tf.7 B) nació después y podría ajustar mejor: ver lo_que_aparecio_al_aplicar'
    necesita_a_miguel: >-
      T8 C — la ficha «arahuacos de las Antillas Menores», atestiguado, NO
      entró: su dato no se pudo verificar en la fuente (ver
      lo_que_aparecio_al_aplicar.fernandes_2020). Pregunta: ¿autorizas bajar
      el texto publicado de Fernandes et al. 2020 y su suplemento (Europe PMC
      sirve el XML; el suplemento está abierto en la web del laboratorio
      autor) para verificar «Lesser Antilles, but not the Greater Antilles»
      antes de escribir la ficha? ¿O entra ya con lo que dice el preprint del
      repo —«arahuacos antillanos de la Edad Cerámica», sin distinguir Mayores
      de Menores, cinco individuos de Curazao, 68,1 %—?

  dp.2.05:
    tema: las tres Curianas; toponimo-111 mal situado
    eleccion: 'A, después de verificar Navarrete en imagen'
    lectura_operativa: >-
      Verificar en imagen Navarrete t. III pp. 13 n. 4 y 32 n. 3 (y la p. 32
      de «riego», dp.2.06 C); registrar la separación de las Curianas
      (oriental / occidental / La Ramada) donde el canon la necesita, y curar
      toponimo-111: el «Coria-na» de Oliver está en La Ramada, no en Punta
      Espada.
    estado: POR APLICAR
    aplicado_por: []

  dp.2.06:
    tema: los hechos de contacto temprano de las crónicas (1499-1502)
    eleccion: 'C primero, luego B; D como nota; E en espera'
    lectura_operativa: >-
      C: ver en imagen las pp. 32, 86-89, 518 y 544 de Navarrete. B: al corpus
      el rescate en guanines, la cédula de 1501 y el palafito de «veinte»
      casas (que corrige geografia_politica-006 y nodo-008). D: Isabel,
      intérprete de 1502, como nota (no como hecho). E: la isla de las
      hierbas se CIERRA en espera, sin aplicar.
    estado: 'APLICADA en B, D y E (2026-09-24); C NECESITA A MIGUEL'
    aplicado_por:
      - '3-mundo/corpus/geografia_politica.yaml: B — geografia_politica-021 (el rescate en guanines, 1502, Navarrete p. 33), -022 (la cédula de 1501, pp. 518-519) y -023 (el palafito de «veinte» casas, pp. 8 y 219); la «tierra de riego» (m2.c3) y las grafías de Coquibacoa (m2.g2) NO se citan, como mandaba M2 sin C'
      - '3-mundo/corpus/geografia_politica.yaml: en geografia_politica-006 la nota abierta de las «40 casas» se da por resuelta (son veinte) y se declaran los dos sitios de Navarrete; 3-mundo/asentamientos.yaml: la misma corrección en nodo-008, y -023 en su `corpus`'
      - 'D como nota: Isabel, intérprete de 1502, en la nota_abierta de geografia_politica-021; y la corrección de t7.l4 en 6-fusion/taino2_etnohistoria_contacto.yaml'
      - 'E: la isla de las hierbas (m2.p1) queda EN ESPERA, declarado en geografia_politica-021; no entra nada'
    lectura_del_escriba: >-
      «C primero» pedía la imagen antes de B. B entró desde la capa de texto,
      que en este tomo lleva el folio en el flujo (la ficha lo declara: «la
      cita se verifica sin la imagen»), y sin lo que C tenía que decidir: la
      palabra «riego» y las grafías de Coquibacoa. Si Miguel prefiere que B
      espere a C, se revierten -021 a -023 sin tocar nada más.
    necesita_a_miguel: >-
      C — ver en imagen Navarrete 1829 t. III pp. 32 (el OCR dice «rieeo»:
      ¿«riego»?), 86-89 (la capitulación: ¿«Qoiquevacoa» = Quiquevacoa?), 518
      y 544 (las grafías de Coquibacoa). El PDF no está en el repo (21,7 MB,
      archive.org bub_gb_HFzXrEyoeCAC, dominio público). Hoy el visor de
      archive.org falla con ese ítem («Unable to fetch …_page_numbers.json») y
      Google Books pide una comprobación anti-robot, que no se salta; y bajar
      un archivo pide tu permiso. Pregunta: ¿autorizas bajar el PDF, o miras
      tú esas cinco páginas?

  dp.2.07:
    tema: creencia-013 — la cita de Ampíes, «como Dios» o «como digo»
    eleccion: 'Tolosa A + HSAI a (el mismo gesto); B, ver el folio en PARES, cuando se pueda'

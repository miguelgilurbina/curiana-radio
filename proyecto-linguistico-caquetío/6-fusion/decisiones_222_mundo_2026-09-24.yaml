    estado: POR APLICAR
    aplicado_por: []

  dp.2.14:
    tema: las aldeas de Aruba en asentamientos.yaml
    eleccion: 'B: esperar a la fuente primaria (Dijkhoff 1997, Versteeg y Rostain 1997)'
    lectura_operativa: >-
      Decidido esperar: no se aplica nada. Se cierra declarado.
    estado: POR APLICAR
    aplicado_por: []

  dp.2.15:
    tema: parentesco-021 (tamude ← mude «primo»)
    eleccion: '(a): partirla'
    lectura_operativa: >-
      parentesco-021 se queda con lo que Rivero atestigua (el etnónimo y la

    aplicado_por:
      - 'P3 A — curiana_sim/lexicon_toponimos.py: una lectura `hipotesis` (eje referente, quien M6, con la página de Esteves y el veredicto «a revisar») en toponimo-132 cumairebo (~ Curaidebo, 201), 138 la miraba (~ Niraba, 278), 135 tabe (~ Jabe, 272) y 176 caduto (~ Coduto, 219); nada se funde'
      - 'P4 — `forma_viva` con su coordenada en 33 topónimos (18 entradas de nivel y 15 descartes), pasada de la prosa de la propia entrada por 6-fusion/scripts/formas_vivas_al_canon.py; curiana_sim/migrar_toponimos.py la emite; curiana_sim/barrer_mapa.py la lee ANTES del cruce aproximado; curiana_sim/tests/test_barrer_mapa.py (3 tests); 2-lengua/datos-de-lengua.md documenta el campo'
    mide: 'barrer_mapa: Paraguaná pasa de 8 nuevos y varios aproximados a 0 nuevos, 0 a revisar, 124 de 124 en alguna fuente; «Cerro Capuana» y «Cuabana» dejan de caer en `capana`'
    necesita_a_miguel: >-
      P3 B — sólo tú puedes decirlo sobre el terreno. Pregunta: ¿reconoces
      estos cuatro sitios como el mismo lugar que nombra Esteves? (1) Cumairebo
      (12.003, -69.920, entre Pueblo Nuevo y El Vínculo) = Curaidebo; (2) La
      Miraba y el Cerro La Miraba (11.834, -70.054; municipio Moruy) = Niraba;
      (3) Tabe (11.917, -70.104, a unos dos km de Jadacaquiva) = Jabe o San
      José de Tarbes; (4) Coduto (11.817, -70.213, al este de Los Taques) y
      Coduto / Punta Coduto en Médanos = el caduto del dictado. Los que
      reconozcas se funden (la forma viva pasa a la entrada de Esteves y el
      descartado de OSM se retira como `reubicado`).

  dp.2.10:
    tema: la cola nueva de topónimos (Sarasaragua, Norupara, Buinare, Paraguaná 1548)
    eleccion: 'A la cola; T1 E1 (con la reserva de M3 sobre comoho)'
    lectura_operativa: >-
      Sarasaragua, Norupara y Buinare a la cola de campana-toponimos;
      `Paraguana` (Oviedo t. I p. 205) a la campaña de topónimos; `comoho` a
      ecologia.yaml con la reserva de M3 (una sola cadena, el obispo
      Bastidas); `hado` congelado hasta verificar.
    estado: APLICADA (2026-09-24)
    aplicado_por:
      - '6-fusion/toponimos_cola_otras_fuentes.yaml (nuevo): la cola de la campaña para lo que no es de Esteves ni del mapa de Miguel — Sarasaragua (Castellanos p. 201), Norupara (González Batista 2002 p. 162) y Buinare (Castellanos p. 184); curiana_sim/juntar_toponimos.py la lee (extractor cola_otras_fuentes) y la mesa la muestra'
      - '`Paraguana` (Oviedo t. I p. 205): YA APLICADA por la tanda de las hermanas (th.10, T2b): toponimo-018 tiene esa procedencia del nombre; no se repite'
      - '3-mundo/corpus/ecologia.yaml: ecologia-085 `comoho`, el cardón de las tunas y su fruta en la provincia de Venezuela (Oviedo vol. I pp. 313-315, en el texto), con la reserva de M3 en `limite` (una sola cadena, el obispo Bastidas)'
      - '`hado`: CONGELADO, sin aplicar (el OCR dice hado y el contexto pide hayo; sin imagen no se decide)'
    aparecio:
      - 'Buinare NO es nombre nuevo: el canon ya tiene la isla como toponimo-066 «buynari» (van Buurt) y nodo-011. El «grep: 0» de M7 era un cero de consulta (la grafía de 1589). Queda en la cola anotado: al procesarlo entra como grafía fechada de 066.'
      - 'La fecha de Paraguaná: T1 escribe «atestación de 1548» y la tanda de las hermanas (T2b, vista en imagen) «testigos jurados… el 13 de julio de 1540 (p. 206)». No se promedió; lo que está en el canon es lo de T2b.'
      - 'ecologia-078 a -084 viven bajo la clave `huecos_lexicos` de ecologia.yaml, no bajo `entradas` (fusión del 2026-09-16): el validador los cuenta igual; no se movieron. Los hechos nuevos de este frente van al final de `entradas`.'

  dp.2.11:
    tema: Miraca en 1530 (nodo-031)
    eleccion: 'A, junto con Oviedo t. IV p. 533'
    lectura_operativa: >-
      Sumar federmann-1916 p. 20 (1557 [13]) a la procedencia de nodo-031 y
      1530 al principio de su cadena, con la segunda atestación de Oviedo t.
      IV p. 533; `precontacto` sigue `desconocido`.
    estado: APLICADA (2026-09-24)
    aplicado_por:
      - '3-mundo/asentamientos.yaml: nodo-031 empieza su cadena en enero de 1530 (Federmann 1916 p. 20, verificado en el texto) y suma junio de 1534 (Oviedo t. IV pp. 533-534, verificado en la capa de texto con el folio de cabecera); las dos obras van en `procedencia_adicional` porque `procedencia` admite una sola; `precontacto` sigue `desconocido`, con la razón'

  dp.2.12:
    tema: Coro, nombre de río
    eleccion: 'Sí'
    lectura_operativa: >-
      Una lectura `glosa-fuente` de referente en toponimo-111: la ciudad tomó
      el nombre del río Coro (Ballesteros 1550 y Castellanos 1589,
      independientes).
    estado: APLICADA (2026-09-24)
    aplicado_por:
      - 'curiana_sim/lexicon_toponimos.py → 2-lengua/toponimos.yaml: lectura `glosa-fuente`, eje referente, en toponimo-111 — Ballesteros 1550 vía Arcaya p. 170 (verificado en el PDF, pdf 178) con Castellanos 1589 p. 185 como segundo testigo independiente'

  dp.2.13:
    tema: las propuestas a ecologia.yaml de las tres parcelas de fauna
    eleccion: 'D1: todas, las de las tres parcelas (y FA3 (c) A: el cunaro en disputa)'
    lectura_operativa: >-
      Las propuestas de ecología de tierra (FA1), aves (FA2) y mar (FA3) al
      final de ecologia.yaml con su capa y su procedencia; en ecologia-015 la
      identificación del cunaro queda declarada en disputa (FA3 c A). La
      parte que toca el lexicón no es de este frente.
    estado: APLICADA (2026-09-24, por el frente del lexicón al fusionar la rama)
    aplicado_por:
      - '6-fusion/scripts/fusionar_fauna_ecologia_dp213.py: 19 entradas nuevas en 3-mundo/corpus/ecologia.yaml (ecologia-086 a -104): las 7 de tierra (FA1), las 5 de aves (FA2) y los 7 hechos nuevos del mar (FA3), con su capa y su procedencia; los de FA3 llevados al esquema del corpus (referencia desde la procedencia, el apoyo a `nota`)'
      - 'ecologia-015: `identificacion` EN DISPUTA (FA3 (c) A, pe-7): la especie del cunaro no se fija'
    mide: 'compilar_corpus --check: 242 hechos, 0 avisos (era 1); pre-vuelo verde'
    lecturas_del_escriba:
      - 'la única corrección de forma: `locacion: salina` (FA2, el flamenco) no es locación del motor y pasa a `salinar`'
      - 'la parte del LEXICÓN de FA3 (c) A no tiene dónde ir: `kunaro` no es clave del lexicón (es hueco; ecologia-015 ya lo dice)'

  dp.2.14:
    tema: las aldeas de Aruba en asentamientos.yaml
    eleccion: 'B: esperar a la fuente primaria (Dijkhoff 1997, Versteeg y Rostain 1997)'
    lectura_operativa: >-
      Decidido esperar: no se aplica nada. Se cierra declarado.
    estado: CERRADA SIN CAMBIO (2026-09-24)
    aplicado_por: []
    queda_declarado: >-
      Tanki Flip, Ser'i Noka y Savaneta NO entran a asentamientos.yaml hasta
      tener la fuente primaria (Dijkhoff 1997; Versteeg y Rostain 1997), que
      el repo no tiene. Lo que Casale 2024 resume de ellas sigue en
      6-fusion/arqueologia_insular_falcon_2026-09-22.yaml (prop-02).

  dp.2.15:
    tema: parentesco-021 (tamude ← mude «primo»)
    eleccion: '(a): partirla'
    lectura_operativa: >-
      parentesco-021 se queda con lo que Rivero atestigua (el etnónimo y la
      voz *mude*, pp. 29 y 420); la etimología y el «como primos» pasan a una
      entrada nueva `hipotetico` que cita a Jahn.
    estado: APLICADA (2026-09-24)
    aplicado_por:
      - '3-mundo/corpus/parentesco.yaml: parentesco-021 queda con lo que Rivero atestigua (Tamudes, p. 29; mude, pp. 419-420), `procedencia: rivero-1883`'
      - '3-mundo/corpus/parentesco.yaml: parentesco-040 (nueva, hipotético): la unión de las dos cosas y el «como primos», de Jahn 1927 p. 213 (verificado en el texto, pdf 267) y Oliver, con las otras dos lecturas de la forma (Neira «Nude», Antolínez «tamudi»)'
    aparecio: >-
      parentesco-022 (la analogía achagua de linajes) se justifica con «los
      'primos' declarados del caquetío, ver parentesco-021»: ese «primos» es
      ahora la hipótesis de parentesco-040. No se tocó -022 (no es de esta
      decisión); queda anotado en -021.

  dp.2.16:
    tema: parentesco-012 («daitiao» cognado del taíno)
    eleccion: 'J: se queda con la reserva'
    lectura_operativa: >-
      parentesco-012 lleva escrita la reserva: el test (T11) no confirma el
      cognado (letra C) y la afirmación tiene una sola fuente.
    estado: APLICADA (2026-09-24)
    aplicado_por:
      - '3-mundo/corpus/parentesco.yaml: parentesco-012 lleva `aviso` con la reserva (letra C del test de T11, una sola fuente, la duda escrita de Oliver n. 42, y que db.2 pasó `datihao` al taíno); la etiqueta no cambia'

  dp.2.17:
    tema: la costa oriental de Federmann (Xaragua, Martinico, Atycares)
    eleccion: 'B: otra polity costera, fuera del mapa de la era 2'
    lectura_operativa: >-
      Se registra como `costa-oriental`, polity costera distinta de la
      Kaketiana y fuera del mapa de la era 2, donde el canon la necesita
      (vault de polities y la propuesta de Federmann); no entra ningún nodo.
    estado: APLICADA (2026-09-24)
    aplicado_por:
      - '3-mundo/corpus/geografia_politica.yaml: geografia_politica-024, `polity: costa-oriental`, atestiguado, contacto-temprano (Federmann 1916 pp. 120-123, visto en el texto)'
      - '3-mundo/polities-caquetias.md: §«La costa oriental de Federmann: otra polity, fuera del mapa»'
    no_se_hizo: 'ningún nodo nuevo en asentamientos.yaml (B la deja fuera del mapa) ni polity nueva en curiana_polities.py (motor; B no la pide)'

lo_que_aparecio_al_aplicar:

  fernandes_2020:
    donde: dp.2.04, T8 C (y la nota de geografia_politica-015 y -019)
    que: >-
      La ficha «arahuacos de las Antillas Menores», atestiguado, descansa en
      el texto publicado de Fernandes et al. 2020 y su suplemento, que el repo
      NO tiene (Fernandes_et_al_2020_Nature_Genetic_History_Caribbean.pdf pesa
      0 bytes a propósito). Lo que sí está, el preprint de bioRxiv, dice otra
      cosa en lo que importa: «We model five ancient individuals from Curaçao
      as having 68.1±5.1% Caribbean_Ceramic-related ancestry… indicating that
      people related to those who moved into the Greater Antilles also reached
      Curaçao» (p. 14 del PDF). Es decir: el clado cerámico caribeño sin
      distinguir, y cinco individuos. T8 dice además que el preprint «listaba
      2 individuos de de Savaan»: el texto dice cinco (de Curazao). Y el propio
      T8 declara que el grafo del suplemento pone la fuente «between» las
      Mayores y las Menores. No se resolvió: la ficha no entró y la pregunta
      va en dp.2.04 `necesita_a_miguel`. La corrección de B (gen-03) sí entró,
      porque el preprint basta para ella: hubo flujo antillano hacia Curazao.

  taino_costera_o_ninguna:
    donde: dp.2.04, T5 D (etnia-020)
    que: >-
      T5 (2026-09-21) propuso el taíno con `polity_caquetia: costera`; el valor
      `ninguna` —el vecino de la esfera que no toca ninguna polity, que exige
      `tipo_de_contacto: ninguno`— se abrió después (tf.7 B, 2026-09-23) y el
      resumen de #222 no lo mencionó. Se aplicó como lo propuso T5, con la
      duda en `polity_nota`. Cambiarlo a `ninguna` es una línea y un test
      (test_quienes_tocan_la_costera); decisión de Miguel.

  paginas_citadas_que_no_eran:
    que: >-
      Al verificar en el PDF, varias páginas de las propuestas eran la de al
      lado. Se escribió la verificada y se dejó dicho en la referencia:
      Arcaya 1920 «pp. 153 y 158» (T5) son las impresas 154 y 159; la
      identificación de Doña Juana, «pp. 166-167» (dc.4), está en las 167-168;
      el rescate en guanines de Navarrete, «p. 34» (T7), está en la 33 (ya lo
      había dicho M2). Arcaya: impresa = pdf − 8.

  baracoica_pariente_de_quien:
    que: >-
      dc.4 y T8 escribieron que Baracoica era «pariente y deudo» de Manaure.
      La carta (Fernández Duro t. II p. 212, vista en imagen) dice «es su
      pariente y deudo», y el sujeto son los indios de la costa que lo envían:
      pariente de ellos. Se escribió así en geografia_politica-016 y en la
      ficha nueva de la carta; «hijo del mismo Manaure» es de Arcaya p. 199,
      sin fuente.

  navarrete_sin_imagen:
    que: >-
      dp.2.05 y dp.2.06 C pedían ver Navarrete 1829 t. III en imagen, y el PDF
      no está en el repo. El visor de archive.org falla hoy con el ítem
      (bub_gb_HFzXrEyoeCAC) y Google Books responde con una comprobación
      anti-robot: no se intentó saltarla, y bajar el PDF pide el permiso de
      Miguel. Lo que se aplicó de Navarrete va desde la capa de texto, con el
      folio en el flujo, y lo que sólo la imagen decide quedó sin citar.

respuestas_de_miguel_2026-09-27:
  dp.2.02: 'Sí: los llanos ganan en curiana_polities.py la economía de Pérez de Tolosa («no son grandes labradores», carne y pescado) y, en `notas` (el modelo no tiene eje de lengua), la lengua («algo difieren en la habla á los de Coro») y el territorio colonial hasta Casanare vía Rivero y Jahn'
  dp.2.04_taino: 'etnia-020 pasa a `polity_caquetia: ninguna` («ninguna»); test_quienes_tocan_la_costera: la costera la tocan el caribe del elenco y el jirajara'
  dp.2.04_fernandes: 'VERIFICADO (4-fuentes/fernandes-2020.md, 2026-09-27): el texto publicado dice «Lesser Antilles but not the Greater Antilles» (74,5 % ± 3,7); cinco individuos de Santa Cruz y De Savaan, s. XIII-XIV; la mezcla sin fecha y el marco del artículo es de origen, no de trato. Miguel eligió «vecino sin contacto»: etnia-021, atestiguado, polity `ninguna`, contacto `ninguno`'
  dp.2.05_y_2.06_C: 'HECHO: PDF bajado (espejo europeo de archive.org; fuera de git por D8; impresa = pdf − 22) y vistas en imagen las cinco páginas: p. 32 «tierra de riego»; p. 86 «Quiquevacoa» (y p. 87 «la isla Caquevacoa», p. 89 «la isla de Caquivacoa»); p. 518 «Caquibacoa»; pp. 544-545 «Quinquibacoa» sin tilde. Citadas en toponimo-034 (observación, sin cambiar el nivel) y en la propuesta de M2; la proyección de «riego» al buco (regla 3) queda como pregunta'
  dp.2.07_B: 'NO SE PUDO: el buscador de PARES dio 503/502 el 2026-09-27. Y de paso: la cita de Velasco no es signatura del AGI, es un «Traslado… U. C. Caja Nº 1» (4-fuentes/ampies-1526-carta.md)'
  dp.2.09_P3_B: 'La Miraba = Niraba, Tabe = Jabe / San José de Tarbes y Coduto = caduto: FUNDIDAS (6-fusion/scripts/fundir_sitios_dp209b.py; toponimo-138, -135 y -176 quedan `reubicados` sin mover ningún otro id). Cumairebo NO: «Cumairebo y Curaidebo son dos lugares distintos en Paraguaná»; la hipótesis queda refutada, con su testimonio'
  oliver_col_01: 'no la marcó entre las correcciones a aplicar: la «confederación por comercio» de costera.economia se queda como está, con el colateral escrito en 6-fusion/paginas_oliver_cap3_doc_vs_impresa.yaml'
  riego_m2_c3: 'Miguel: nota, sin proyectar. En ecologia-028 (el buco): la tierra de riego de 1502 (Navarrete p. 32), que la nota 3 de Navarrete identifica con Coro'

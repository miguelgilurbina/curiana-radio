lo_que_aparecio_al_aplicar:

  fernandes_2020:
    donde: dp.2.04, T8 C (y la nota de geografia_politica-015 y -019)
    que: >-
      La ficha «arahuacos de las Antillas Menores», atestiguado, descansa en
      el texto publicado de Fernandes et al. 2020 y su suplemento, que el repo
      NO tiene (Fernandes_et_al_2020_Nature_Genetic_History_Caribbean.pdf pesa
      0 bytes a propósito). Lo que sí está, el preprint de bioRxiv, dice otra
      cosa en lo que importa: «We model five ancient individuals from Curaçao
      as having 68.1±5.1% Caribbean_Ceramic-related ancestry… indicating that
      people related to those who moved into the Greater Antilles also reached
      Curaçao» (p. 14 del PDF). Es decir: el clado cerámico caribeño sin
      distinguir, y cinco individuos. T8 dice además que el preprint «listaba
      2 individuos de de Savaan»: el texto dice cinco (de Curazao). Y el propio
      T8 declara que el grafo del suplemento pone la fuente «between» las
      Mayores y las Menores. No se resolvió: la ficha no entró y la pregunta
      va en dp.2.04 `necesita_a_miguel`. La corrección de B (gen-03) sí entró,
      porque el preprint basta para ella: hubo flujo antillano hacia Curazao.

  taino_costera_o_ninguna:
    donde: dp.2.04, T5 D (etnia-020)
    que: >-
      T5 (2026-09-21) propuso el taíno con `polity_caquetia: costera`; el valor
      `ninguna` —el vecino de la esfera que no toca ninguna polity, que exige
      `tipo_de_contacto: ninguno`— se abrió después (tf.7 B, 2026-09-23) y el
      resumen de #222 no lo mencionó. Se aplicó como lo propuso T5, con la
      duda en `polity_nota`. Cambiarlo a `ninguna` es una línea y un test
      (test_quienes_tocan_la_costera); decisión de Miguel.

  paginas_citadas_que_no_eran:
    que: >-
      Al verificar en el PDF, varias páginas de las propuestas eran la de al
      lado. Se escribió la verificada y se dejó dicho en la referencia:
      Arcaya 1920 «pp. 153 y 158» (T5) son las impresas 154 y 159; la
      identificación de Doña Juana, «pp. 166-167» (dc.4), está en las 167-168;
      el rescate en guanines de Navarrete, «p. 34» (T7), está en la 33 (ya lo
      había dicho M2). Arcaya: impresa = pdf − 8.

  baracoica_pariente_de_quien:
    que: >-
      dc.4 y T8 escribieron que Baracoica era «pariente y deudo» de Manaure.
      La carta (Fernández Duro t. II p. 212, vista en imagen) dice «es su
      pariente y deudo», y el sujeto son los indios de la costa que lo envían:
      pariente de ellos. Se escribió así en geografia_politica-016 y en la
      ficha nueva de la carta; «hijo del mismo Manaure» es de Arcaya p. 199,
      sin fuente.

  navarrete_sin_imagen:
    que: >-
      dp.2.05 y dp.2.06 C pedían ver Navarrete 1829 t. III en imagen, y el PDF
      no está en el repo. El visor de archive.org falla hoy con el ítem
      (bub_gb_HFzXrEyoeCAC) y Google Books responde con una comprobación
      anti-robot: no se intentó saltarla, y bajar el PDF pide el permiso de
      Miguel. Lo que se aplicó de Navarrete va desde la capa de texto, con el
      folio en el flujo, y lo que sólo la imagen decide quedó sin citar.

  control_del_test:
    por_que_es_obligatorio: '«si el test no separa lo que ya sabemos, no sirve para lo que no sabemos». Tres brazos:
      parejas que sabemos HEREDADAS (caquetío↔lokono con cita de Oliver), parejas que sabemos PRESTADAS (taíno→castellano,
      que el propio Brinton documenta) y un brazo de lengua NO pariente (jirajara/ayomán de Jahn 1927).'
    el_criterio_de_acierto: 'el test es SANO si nunca llama préstamo a una heredada ni herencia a una prestada.
      Es INCOMPLETO en la medida en que devuelve C, y eso no es un fallo: es la parte del material que no tiene
      consonante diagnóstica. Las dos cifras se dan por separado.'

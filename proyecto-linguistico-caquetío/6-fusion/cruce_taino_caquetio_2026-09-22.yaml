  las_predicciones:
    por_que_van_aquí_y_no_al_final: 'están escritas ANTES de mirar ninguna pareja, y el orden es parte del método:
      una correspondencia inventada después de ver el resultado explica todo y no predice nada. Viven en el código,
      en `CORRESPONDENCIAS_PREDICHAS`, por encima de cualquier función que toque un par.'
    de_donde_salen: 'NADIE ha publicado correspondencias caquetío↔taíno, y este proyecto no puede establecerlas
      con cuatro parejas. Lo que se hace es COMPONER las dos patas que sí existen: caquetío↔lokono (oliver-1989-cap2,
      C1-C13, con página) y taíno↔lokono (brinton-1871 pp. 11-14, recogidas por T2 en taino_brinton_1871.yaml §correspondencias_para_T4).
      Componer da una PREDICCIÓN, no un hecho.'
    los_tres_limites_declarados:
    - 'C8 — /r/ ~ /l/ es indecidible en todo el corpus (Oliver): una diferencia r/l no cuenta.'
    - 'C9 — Oliver EXCLUYE las vocales por falta de transcripción fiable: el test puntúa esqueletos consonánticos,
      no formas enteras.'
    - '⟨gu⟩ = /w/ (Oliver p. 147, «/wa- [gua-]/»): el test corre sobre la fonemización con gu_es_w=True, que es
      la que hace ⟨bagua⟩ = /bawa/ y deja ver la correspondencia P1. El resto del cruce sigue corriendo con el defecto,
      gu_es_w=False.'
    tabla:
    - id: P1
      regla: caquetío /r/  ~  taíno ∅ o /w/  (donde el lokono tiene /r/)
      pata_cq_lk: 'el caquetío CONSERVA la /r/ intervocálica del lokono: `dare` : LK `d-ari` ''diente''; `barisi`
        : LK `bálisi` ''ceniza''; `para` : LK `bara` ''mar'' (oliver-1989-cap2 pp. 147, 150; cognado-001, cognado-010)'
      pata_tn_lk: 'el taíno la PIERDE o la vuelve /w/: `maisi` : LK `marisi` ''maíz''; `cai/cayo` : LK `kairi` ''isla'';
        `bagua` : LK `bara` ''mar'' (brinton-1871 pp. 11-13, vía taino_brinton_1871.yaml §clase_B)'
      predice: 'una voz heredada tiene /r/ en caquetío y NADA o /w/ en taíno. El par canónico es caq `para` ~ taí
        `bagua` /bawa/ ~ LK `bara`, y Oliver lo escribe él mismo (p. 150: taíno `bara-wa` junto al caquetío `para-`)'
      la_falsaria: una pareja caquetío~taíno con /r/ en los DOS lados y sin otra diferencia. Sería la firma de que
        la palabra cruzó tarde, no de que se heredó
      apoyos: 3
      diagnostica: true
      es_diagnostica_porque: 'lo esperado NO es la identidad: el taíno normalmente pierde la /r/. Es la única consonante
        diagnóstica que el material da, y la única correspondencia que llega al listón de tres apoyos'
    - id: P2
      regla: caquetío /b/  ~  taíno /b/   (los dos del lado lokono, frente a wayuu /p/)
      pata_cq_lk: 'C3, «two very regular and systematic sound changes»: LK /b/ : WY /p/, y el caquetío cae del lado
        lokono — `barisi` : `bálisi` : WY `palíi`; y el sufijo es `-bana` y no `-pana` (oliver-1989-cap2 pp. 147-148)'
      pata_tn_lk: 'taíno `bagua`/`bara-wa` : LK `bara`; `siba` : LK `siba` (brinton-1871 pp. 11, 13)'
      predice: una voz heredada tiene /b/ en los dos lados; un /p/ caquetío frente a /b/ taíno es la excepción declarada
      la_falsaria: 'la excepción YA existe y Oliver no la explica: caq `para` ''mar'' frente a LK `bara` y TN `bara-wa`.
        Por eso /p/ ~ /b/ se admite como regular y se dice'
      apoyos: 2
      diagnostica: false
      es_diagnostica_porque: 'no lo es: lo esperado ES la identidad, y una identidad esperada no informa'
    - id: P2b
      regla: caquetío /p/  ~  taíno /b/   (la excepción declarada de `para`)
      pata_cq_lk: 'caq `para` ''mar'' : LK `bara` — oliver-1989-cap2 p. 150, y él mismo la deja sin explicar'
      pata_tn_lk: 'TN `bagua` / `bara-wa` : LK `bara` — brinton-1871 p. 11; oliver-1989-cap2 p. 150'
      predice: un /p/ caquetío puede corresponder a un /b/ taíno. Es UNA pareja, así que se admite y se marca
      la_falsaria: 'que no vuelva a salir en ninguna otra pareja: entonces es un caso suelto y no una regla'
      apoyos: 1
      diagnostica: false
      es_diagnostica_porque: 'no lo es: UN apoyo. Se admite para no llamar violación a lo que Oliver escribe, y
        no se usa para declarar nada por sí sola'
    - id: P3
      regla: caquetío /d-/  ~  taíno /d-/   (1ª persona singular, y /d/ en general)
      pata_cq_lk: 'C1: PA */nV-/ → /dA-/ en lokono, taíno y «perhaps Caquetío» → /tA-/ en guajiro-paraujano. Evidencia
        caquetía: `diao`, `datihao`, `dare`, `dato` (oliver-1989-cap2 pp. 136, 146-147). Falsificó la regla `^d
        → t` del proyecto (metodo-comparativo, issue #43)'
      pata_tn_lk: taíno `daca` 'yo' (pane-c1498 cap. XXV) y `da-` en `da(i)tia-o` (oliver-1989-cap2 p. 147)
      predice: 'una voz heredada tiene /d/ en los dos lados — y por eso mismo **este rasgo NO distingue herencia
        de préstamo entre caquetío y taíno**: separa a los dos JUNTOS del wayuu y el paraujano, que tienen /t-/.
        Es dato de FILIACIÓN y ya está contado en D11 por la vía lokono'
      la_falsaria: 'una forma caquetía con /t-/ donde el taíno tiene /d-/: sería vía guajiro-paraujana'

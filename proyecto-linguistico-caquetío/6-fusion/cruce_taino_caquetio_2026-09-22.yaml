    liston_de_apoyos: 3
    que_significa_diagnostica: 'que lo PREDICHO para esa consonante no es la identidad. Sólo entonces un «cero diferencia»
      se puede leer como préstamo: si tenía que cambiar y no cambió, cruzó tarde. Una pareja sin ninguna consonante
      diagnóstica no se puede decidir por la forma, por mucho que se parezca: no tiene dónde diferir. Ése es el
      caso de `-tiao`, y por eso el test devuelve C y no A. **Entre caquetío y taíno sólo /r/ es diagnóstica; entre
      caquetío y lokono, ninguna.**'
    que_significa_candidata: 'que la cadena la sugiere pero tiene menos de tres apoyos, que es el listón del propio
      proyecto («una correspondencia que sale una o dos veces no es nada»). Usarla no da un cognado: baja el veredicto
      a C y el YAML dice qué lo cerraría.'
  P1_puesta_a_prueba_sobre_el_corpus:
    que_mide: 'P1 dice que el taíno pierde o glidea la /r/ que el caquetío conserva. Si es verdad, tiene que verse
      SIN mirar ninguna pareja: en la proporción de /r/ sobre el total de consonantes de cada lista.'
    como_leerlo: 'es una prueba de la predicción, no una prueba de parentesco. Y arrastra el sesgo de las listas:
      la caquetía es fitonimia de Zavala y la taína es vocabulario de crónica. Una diferencia pequeña no dice nada;
      una diferencia de varias veces, con el control jirajarano en medio, sí.'

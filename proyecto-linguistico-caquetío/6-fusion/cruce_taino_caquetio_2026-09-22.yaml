  morfemas_compartidos_son_filiacion_no_contacto:
    la_regla: 'un morfema gramatical compartido es dato de FILIACIÓN (de dónde viene la lengua), no de CONTACTO
      (con quién habló el pueblo). Los morfemas casi nunca se prestan; el léxico de cultígenos, bichos, mercancías
      y ritos sí. Mezclar las dos columnas es contar dos veces: el /dA-/ que comparten taíno y caquetío lo comparte
      el lokono, y por esa vía ya está contado en D11.'
    filas:
    - morfema: ma- privativo
      taino: '`mahite` ''you have lost a tooth'', brinton-1871 p. 14, cronista Las Casas Hist. Apol. cap. 198, contra
        el lokono «marikata, you have no teeth (ma negative, ari tooth)»'
      esta_en_las_transcripciones: true
      caquetio: 'declarado en CLAUDE.md §morfología: van Buurt 2014 §8 y Perea 1942 p. 555'
      columna: FILIACIÓN, y ni siquiera taíno-caquetía
      por_que: Oliver p. 147 n. 43 declara el privativo /mV-/ común a las lenguas MAIPURES. Confirma que el caquetío
        tiene lo que la familia tiene; no acerca el taíno al caquetío más que a cualquier hermana
    - morfema: da- / d- de 1ª persona singular
      taino: '`daca` ''yo'' (pane-c1498 cap. XXV, «Dios naboria daca»); `da-` en `da(i)tia-o`'
      esta_en_las_transcripciones: true
      caquetio: '`diao`, `datihao`, `dare`, `dato` — oliver-1989-cap2 pp. 136, 146-147'
      columna: FILIACIÓN, y es el pilar de D11
      por_que: 'separa al trío caquetío-taíno-lokono del par guajiro-paraujano (/tA-/). Contarlo otra vez por la
        vía taína sería contar dos veces el mismo dato. Y para el test del contacto es INÚTIL: un préstamo taíno
        habría entrado con su /d-/ intacto'
    - morfema: -(h)o nominalizador solemne
      taino: 'oliver-1989-cap2 p. 147: «characteristic of both Taíno and Lokono»'
      esta_en_las_transcripciones: true
      caquetio: '`diao`, `datihao`, `boratio`, `kaket-ío` — el mismo Oliver, pp. 146-148'
      columna: FILIACIÓN
      por_que: 'lo comparte con el lokono, otra vez. Y es lo ÚNICO que `diao` y `datihao` comparten de verdad junto
        con el /d-/: no la raíz'
    - morfema: gua- / wa- de 3ª plural
      taino: brinton-1871 p. 12 s.v. Gua «a very frequent prefix»; oliver p. 147
      esta_en_las_transcripciones: true
      caquetio: '`guaitiao` (forma_fuente de `waitiao`), y los topónimos en gua-'
      columna: FILIACIÓN
      por_que: 'ojo: el `-gua` LOCATIVO del canon caquetío es otra cosa —sufijo, no prefijo— y contarlos juntos
        sería la trampa de `-kana`. Ver la tabla de `morfologia`'
    - morfema: -caco 'ojos'
      taino: '`buticaco` ''you are blue-eyed'', `xeyticaco` ''you are black-eyed'' — brinton-1871 p. 14, Las Casas
        Hist. Apol. cap. 198, contra el lokono `acou`/`akusi`'
      esta_en_las_transcripciones: true
      caquetio: NADA. El canon caquetío no declara ningún formante de 'ojo'
      columna: ninguna — es hueco caquetío, no pareja
      por_que: lo trajo T2 ayer junto con `mahite`. Sirve para saber que el taíno tiene morfología de posesión inalienable
        del cuerpo; del caquetío no hay con qué compararlo
    lo_que_esto_significa_para_la_pregunta_de_miguel: 'TODO lo que el taíno y el caquetío comparten en morfología
      cae en la columna de filiación, y el lokono lo comparte igual. **Ninguno de estos morfemas prueba contacto.**
      Lo que probaría contacto es léxico: una voz que viajó. Y para eso hace falta el test de correspondencias,
      no el inventario de afijos.'
  la_otra_orilla_estaba_en_casa:
    como_se_midio: 'barrido del PDF de Arcaya que el repo ya tiene (`fuentes_caquetios/Arcaya_1920_Historia_Estado_Falcon.pdf`,
      348 pp., 469.953 caracteres extraídos con pymupdf) el 2026-09-22. Conteos: `tiao` 1, `diao`/`díao` 8, `datihao`
      0, `daitiao` 0, `guaitiao` 0, `boratio` 15.'
    hallazgo_1_la_pagina_que_falta:
      que_es: la atestación «de la Provincia de Venezuela» que el encargo daba por perdida en «el apéndice al tomo
        IV» **está en el tomo II, y Arcaya da la página en nota al pie**.
      arcaya_p_impresa_48_nota_33: Oviedo y Valdez, Historia general y natural de las Indias, tomo 2, pág. 299
      arcaya_p_impresa_115_nota_22: Oviedo y Valdez, obra citada, tomo II, pág. 297
      arcaya_p_impresa_116_nota_23: obra y tomo citados, pág. 300 (el funeral del díao)
      y_la_glosa_de_oviedo_que_arcaya_copia: 'p. impresa 115: Manaure era un diao, «señor principal que tiene muchos
        indios y le son subjetos otros caciques» — la glosa es del propio Oviedo, tomo II p. 297'
      consecuencia: 'quien vaya a por la otra orilla ya no busca un apéndice inexistente: busca **Oviedo y Valdés
        tomo II, pp. 297-300**. Y lo que hay allí es `diao`, no `datihao`. La deuda documental cambia de forma y
        de tomo.'
    hallazgo_2_diao_tiene_una_segunda_fuente_INDEPENDIENTE:
      la_frase: 'Arcaya p. impresa 48: los caquetíos de Coro llamaban «díaos» a sus caciques principales, «nombre
        idéntico al de **tiaos**» con que se designaba, según el Padre Carvajal, a los **Caquetíos de Apure**'
      nota_34_de_arcaya: «Relación del descubrimiento del Río Apure. Pág. 317» (Jacinto de Carvajal, 1648)
      por_que_importa: es una atestación de la familia que **no pasa por Oviedo ni por Oliver**. Todo lo demás que
        el repo tiene de `-tiao` viene de la misma página de Oliver sobre el mismo Oviedo; esto no. Rompe la circularidad
        que este mismo cruce denunciaba hace tres bloques.
      y_tambien: Arcaya lo enlaza además con el tariana `yatii`/`yaivi` 'médico hechicero' vía Koch-Grünberg 1911
        — tercera vía, y arahuaca del noroeste amazónico
      ⚠️_lo_que_NO_prueba: 'que `tiao` sea caquetío COSTERO. Es de Apure, y la regla 4 es explícita: «los caquetíos
        no eran una sola sociedad», «importar un rasgo de Barquisimeto o los Llanos sin marcarlo es el error que
        Oliver denuncia». Se anota como dato de la esfera caquetía ancha, no de la polity que la simulación modela.'
    hallazgo_3_y_es_el_que_pesa:
      el_hecho: '`díao` en Coro y `tiao` en Apure, y Arcaya los llama «nombre idéntico»'
      por_que_pesa: 'es un contraste /d-/ ~ /t-/ **dentro del caquetío**, entre dos polities. Y /d-/ frente a /t-/
        es EXACTAMENTE la C1 de Oliver: el prefijo de 1ª sg. que sólo lokono y taíno conservan como /dA-/, mientras
        el guajiro-paraujano innova /tA-/. Es el pilar del que cuelga la tesis lokonoide del caquetío, y con ella
        D11.'
      las_dos_lecturas:
      - lectura: el contraste es REAL y es dialectal
        entonces: «el caquetío conserva /d-/» es una afirmación sobre el caquetío COSTERO, no sobre el caquetío.
          El caquetío de Apure caería del lado de la innovación /tA-/, y la posición de Oliver se vuelve más local
          —y más interesante— de lo que está escrita. Sería regla 4 mordiendo en la fonología, que es donde nadie
          la había mirado
      - lectura: el contraste es de COPISTA
        entonces: Carvajal oyó o escribió sin la /d-/ inicial, o Arcaya normalizó. Una sola ocurrencia en un texto
          de 1648 que el repo no tiene no sostiene un dialecto
      que_lo_decidiria: 'la p. 317 de la *Relación del descubrimiento del Río Apure* de Jacinto de Carvajal, que
        NO está en el repo. Es la misma clase de dato que falta para `datihao`: una página. Y ésta además es de
        dominio público y del s. XVII.'
      lo_que_NO_se_hace_aqui: 'tocar D11 ni la ficha de Oliver. Esto PROPONE (regla 5): deja el hallazgo medido
        y la página localizada para que Miguel decida si abre una pregunta o no.'
    hallazgo_4_datihao_no_esta_en_arcaya:
      medido: '`datihao` = 0, `daitiao` = 0, `guaitiao` = 0 en las 348 páginas'
      que_significa: 'Arcaya lee a Oviedo con lupa —le cita tomo, página y nota— y **no recoge la voz**. El único
        que la lee ahí es Oliver. Eso no la desmiente, pero sí confirma lo que el test ya decía por otra vía: el
        lado caquetío de `datihao` es **una lectura de un autor**, y hoy no hay manera de contrastarla.'
    y_el_corpus_ya_lo_sabia: '`3-mundo/corpus/creencia.yaml` §creencia-001b lleva escrito desde hace tiempo «el
      díao (diao; **tiao entre los caquetíos de Apure**)» con la referencia «Oviedo y Valdés t. II p.299; Arcaya
      1920:48,116,118». El dato estaba; lo que no estaba era la lectura: que ese `tiao` toca la C1 de Oliver, y
      que esa referencia es la página que la campaña andaba buscando en el tomo equivocado.'
  el_eje_prosodico_que_viene:
    estado: 'PENDIENTE de que entre el PR #194. Declarado aquí con su cita, no leído: el script sólo lee lo que
      está en main, para que `--check` no dependa de qué ramas tenga cada uno.'
    que_es: 'Las Casas marca el ACENTO de 97 formas taínas en la *Apologética* («la penúltima sílaba luenga», «la
      última luenga y aguda»…). Es un rasgo más, y del mejor tipo: el acento de una forma HEREDADA debería seguir
      un patrón regular entre las dos lenguas; el de un PRÉSTAMO no tiene por qué.'
    lo_que_ya_dice_sobre_diao_sin_necesidad_de_ejecutarlo:
      el_hecho: 'los TRES títulos de rango taínos que Las Casas acentúa son OXÍTONOS y acaban los tres en `-í` tónica:
        `Guaoxerí` «la última sílaba luenga», `Baharí` «la misma última luenga», `Matunherí` «el acento en la postrera
        sílaba»'
      la_lectura: 'no son tres palabras sueltas: son una SERIE. El taíno nombra los grados de señorío con un molde
        —raíz + `-í` tónica— y `diao` no tiene ese molde ni de forma ni de acento (la tradición venezolana lo escribe
        `díao`, con el acento al principio). Es una segunda razón, independiente de la forma, para que `diao` no
        tenga gemela taína: **no encaja en la serie con la que el taíno hace títulos**.'
      ⚠️_el_limite: 'el acento del caquetío no está medido en ninguna parte. La tilde de `díao` es editorial —Arcaya
        1920—, no una marca de cronista como las de Las Casas. Así que esto es un eje ASIMÉTRICO: sirve para describir
        el taíno y todavía no para comparar. Lo que lo cerraría es una fuente que marque acento en caquetío.'
    y_un_cero_que_pesa_en_el_caso_datihao: '**`guatiao` = 0 en toda la *Apologética***, y la institución del cambio
      de nombre SÍ está descrita allí. O sea: Las Casas cuenta el rito y no usa la palabra. Súmese a que el `Guatiao`
      de Brinton (p. 12) no viene de un cronista sino de **Richardo, *Diccionario provincial*** — obra cubana del
      siglo XIX. El lado taíno de `guatiao` es más flojo de lo que parecía, igual que el caquetío. **Las dos orillas
      del caso son finas.**'
    y_daca_gana_un_apoyo: '`daca` ''yo'' queda confirmado también en la *Apologética*, además de Pané cap. XXV.
      P3 (el /dA-/ de 1ª sg.) gana una atestación independiente — y sigue sin distinguir herencia de préstamo entre
      caquetío y taíno, que es lo que P3 ya declara.'
    cuando_entre_el_PR_194:
    - leer `6-fusion/taino2_las_casas_apologetica.yaml` §lexico como una fuente más en `YAML_TAINO` (trae `forma_fuente`,
      `glosa_fuente`, `pagina_impresa` y `verificado`);
    - añadir `marca_prosodica` al diagnóstico, como cuarto campo junto a regulares, candidatas y violaciones;
    - y antes que nada, buscar una fuente que marque acento en caquetío. Sin eso el eje describe una lengua y no
      compara dos.

meta:
  campana: la campaña del taíno — T4 (2026-09-21, el cruce) y **T11** (2026-09-22, la prueba lingüística del contacto)
  medido: '2026-09-22'
  script: 6-fusion/scripts/cruce_taino_caquetio.py
  estado: PROPUESTA (regla 5). No toca el lexicón, ni lexicon_*.py, ni 2-lengua/, ni 3-mundo/corpus/. Ningún cognado
    entra a cognados.yaml por este archivo. Toda cifra de `meta` la emite el script (regla 1).
  pregunta: ¿Qué comparten de verdad el taíno y el caquetío ATESTIGUADO —léxico, morfología, onomástica—, y qué
    de eso es herencia arahuaca común, qué préstamo por contacto en la esfera, y qué casualidad?
  la_pregunta_de_T11: 'un cognado heredado y un préstamo por contacto SE DISTINGUEN: el cognado sigue las correspondencias
    regulares de sonido y el préstamo las viola, o llega sin ninguna diferencia porque cruzó tarde, o cae en un
    campo donde las palabras viajan. Un préstamo prueba CONTACTO; un cognado prueba PARENTESCO. Aquí se construye
    ese test, se controla contra lo que ya sabemos y se aplica a `datihao` y a `diao`.'

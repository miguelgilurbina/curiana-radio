    el_estrato_taino_de_esteves:
      topónimos_del_canon_con_la_atribución:
      - amuay
      - coabana
      - guayacanal
      - maicara
      - maitiruma
      - oripopo
      - pitajaya
      lo_que_ya_dice_el_repo: '4-fuentes/esteves-1989.md §6: la atribución de Amuay, Elegüey, Maragüey, Jamaica
        y Maitiruma al «caribe insular»/taíno es de Esteves y sale de PARECIDO DE SONIDO sin documento — «por su
        fonética la voz pertenece al caribe insular, como batey, mamey, caney, carey» (p. 14), y esas cuatro son
        voces taínas del español general.'
      lo_que_este_cruce_añade: 'la serie -ey de Esteves es del castellano que llegó con los españoles vía La Española,
        no de un contacto taíno-caquetío precolonial: batey, mamey, caney y carey entran en el castellano antillano
        antes de que nadie escriba un topónimo de Paraguaná. Es el mismo aviso que Oliver da para maraca, cacique
        y barbacoa (p. 151). Un -ey en Paraguaná mide la boca del cronista, no la lengua del sitio.'
      y_la_etiqueta_esta_mal_puesta: el caribe insular de Breton es una lengua ARAHUACA (iñeri) con préstamos caribes
        en el habla de los hombres, hermana del taíno y del caquetío — ya está escrito en 4-fuentes/esteves-1989.md.
        Una coincidencia con él es parentesco de familia.
    los_gentilicios_en_-io_-yo:
      la_afirmacion: Luca-yo, Cigüa-yo, Kaket-ío comparten un formante de etnónimo
      de_donde_sale: oliver-1989-cap2 n. 44 p. 148, y Oliver la atribuye a Gary Vescelius, **comunicación personal
        de 1982**
      veredicto: NO CITABLE como evidencia. No hay dato publicado detrás, no hay lista, y Lucayo y Ciguayo son exónimos
        coloniales recogidos por cronistas. Que `kaketío` sea `kake-` + `-(h)o` sí lo argumenta Oliver aparte, con
        el lokono kakïtho (p. 148) — ese es el apoyo bueno, y no necesita a Vescelius.
  clasificacion:
    advertencia_de_entrada: El caquetío atestiguado son ~228 entradas de lexicón y ~78 topónimos sin descartar,
      casi todo fitonimia y zoonimia de Paraguaná y Coro recogida por Zavala. Del taíno el repo tiene 43 voces atestiguadas
      y **ninguna con `procedencia.obra`**. Eso NO da para una clasificación y este cruce no la intenta. Oliver,
      que tenía más, llama «tentative» a la suya y dice que del caquetío no hay medición porque no existe lista
      de 100 palabras.
    posiciones:
    - quien: Oliver 1989 (cap. 2, pp. 150-155)
      que_dice: el caquetío sale del mismo fondo que el lokono, no de una ascendencia guajiro-paraujana; y hace
        salir a lokono, island carib, taíno y caquetío del mismo nodo
      cita: «strongest affinities with Lokono» (p. 155)
      en_que_se_apoya: 'DATOS: el prefijo /dA-/ de 1ª sg. (sólo lokono y taíno lo tienen), la innovación léxica
        auri ''perro'', kaketío = lokono kakïtho, y -bana frente a -pana'
      y_en_que_no: 'en GEOGRAFÍA cuando descarta al guajiro: «a preliminary examination of selected Guajira-Falcón
        toponyms» (p. 150) — preliminar, y sin lista'
      lo_llama: «tentative» él mismo
    - quien: Noble 1965 (vía Oliver p. 97 y Rouse)
      que_dice: el taíno es un vástago directo del proto-arahuaco, aislado
      cita: —
      en_que_se_apoya: 'porcentajes de cognados sin lista publicada. Oliver: «Noble does not provide the actual
        word list(s) for Taíno, a major drawback»'
      y_en_que_no: —
      lo_llama: Oliver lo llama «misleading and ambiguous at the very best»
    - quien: Taylor 1977 (vía Oliver p. 97)
      que_dice: el taíno deriva del proto-maipure, con 60 palabras comparadas
      cita: «Taíno appears to have [share] more lexical cognates with Island Carib than Arawak [Lokono]», pero «borrowing
        cannot be excluded»
      en_que_se_apoya: 'DATOS, aunque pocos: una lista corta de 60 ítems'
      y_en_que_no: —
      lo_llama: el propio Taylor deja abierto el préstamo
    - quien: Rouse 1986 (citado por Oliver p. 97)
      que_dice: el taíno evolucionó del proto-norteño, como las demás del grupo
      cita: «So little is known about the Taíno language that there is room for disagreement»
      en_que_se_apoya: la opinión de Arróm y la escasez reconocida del dato
      y_en_que_no: —
      lo_llama: él mismo admite el desacuerdo
    - quien: Vescelius (comunicación personal 1982, en Oliver n. 44 p. 148)
      que_dice: los etnónimos en -ío/-yo (Luca-yo, Cigüa-yo, Kaket-ío) van juntos
      cita: —
      en_que_se_apoya: 'NADA publicado: es una nota al pie de una conversación'
      y_en_que_no: —
      lo_llama: «curious relationship»
    que_puede_aportar_nuestro_material:
    - confirmar o no que una voz caquetía atestiguada tiene pareja taína con la MISMA glosa, y de qué dominio es
      esa voz (que es lo que decide si el dato vale para filiación o para comercio);
    - medir cuántas de esas parejas salen también por azar, que es lo que ninguna de las posiciones de arriba hizo;
    - poner sobre la mesa los formantes que Oliver declara para el caquetío y que el canon del proyecto nunca recogió
      (-bo, -oa, -kiva), que son hueco propio antes que pregunta taína.
    que_NO_puede:
    - 'medir distancia lexicoestadística: no hay lista de 100 palabras ni del caquetío ni del taíno, y Oliver lo
      dice de las dos;'
    - decidir dónde cae el caquetío en el árbol. Con 43 voces taínas sin procedencia, cualquier número que salga
      de aquí mide nuestras dos listas, no las dos lenguas;
    - 'usar el taíno como prueba a favor o en contra de D11: el prefijo /dA-/ que comparten taíno y caquetío lo
      comparte también el lokono, y por eso el argumento ya está contado en D11. Contarlo otra vez por la vía taína
      sería contar dos veces el mismo dato.'

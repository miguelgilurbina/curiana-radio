    - id: P6
      regla: 'LA FIRMA DEL PRÉSTAMO: cero diferencia donde una regular tenía que haber'
      pata_cq_lk: Oliver mide lokono–guajiro en 2,6 milenios de separación y lokono–achagua en 3,8 (p. 97 y ss.).
        A esa distancia una voz heredada ha tenido tiempo de mostrar al menos una de las correspondencias de arriba
      pata_tn_lk: 'y el propio Oliver avisa (p. 151): «one must be careful about some terms (e.g. barbacoa) offered
        by the Spanish as ''native'' Caquetío»'
      predice: si las dos formas tienen el MISMO esqueleto consonántico y ese esqueleto contiene al menos una consonante
        diagnóstica (P1, P2, P2b), la pareja es préstamo o transmisión reciente, no herencia
      la_falsaria: 'una pareja idéntica SIN consonante diagnóstica no dice nada: la palabra no tiene dónde diferir.
        Ése es el caso que el test tiene que devolver como C, y es exactamente el de `-tiao`'
      apoyos: null
      diagnostica: false

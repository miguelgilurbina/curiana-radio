      cita_de_los_lemas_de_brinton: Brinton 1871 pp. impresas 11-14
      respuesta: '**NO.** En taíno no hay ninguna voz `diao` ni `dia-`.  Lo que sí hay es `guatiao` ''friend, companion''
        (brinton-1871 p. 12, cronista Richardo; lokono `ahati`), que es la gemela de `datihao` y NO significa rango
        sino alianza. Los títulos de rango taínos son otros y ninguno se parece a `diao`: `casique` ''a chief'',
        `nitainos` ''the title applied to the petty chiefs'', `matunheri` ''a title applied to the highest chiefs''
        (Las Casas, Hist. Apol. cap. 197), `guaoxeri` ''the lowest class'', `bajari` ''title applied to sub-chiefs
        ruling villages'' — todos en brinton-1871 pp. 11-13.'
      la_consecuencia: 'la frase de Miguel se parte en dos y las dos mitades miden distinto. **`datihao` SÍ tiene
        gemela taína** (`guatiao`), con la misma raíz y distinto prefijo de persona — y ésa es la que el test no
        puede decidir. **`diao` NO tiene gemela taína ninguna**: no hay dónde hacer match. Su pareja, la que Oliver
        le da, es LOKONA (`dai-yana-ho`), y ésa sí es dato de filiación, que es la columna de D11 y no la del contacto.'

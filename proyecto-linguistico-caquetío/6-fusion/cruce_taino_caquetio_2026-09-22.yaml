        el test daría «viola las correspondencias» y estaría midiendo al escáner. Se deja fuera y se dice.'
    la_respuesta_de_la_transitividad: 'P3 predice que un cognado caquetío de taíno `da-` + `-(i)tiao` se dice **`da-tiao`**:
      el caquetío conserva /d-/ igual que el lokono y el taíno (Oliver pp. 136, 146-147). Y eso es exactamente lo
      que se ve. **Pero el rasgo no decide nada**: /d-/ separa al trío caquetío-taíno-lokono del par guajiro-paraujano
      (/t-/), no al caquetío del taíno. Un préstamo taíno al caquetío habría entrado con su /d-/ intacto. En la
      raíz `-tiao` no hay ninguna consonante diagnóstica: /t/ está predicha idéntica en los dos lados (P4) y no
      hay /r/, /b/ ni /p/. La palabra **no tiene dónde diferir**.'
    las_dos_lecturas_con_su_peso:
    - letra: A — cognado heredado
      a_favor: 'Oliver lo escribe: «This Taíno term is cognate to Caquetio daitiao» (p. 147), y le da etimología
        en proto-arahuaco: /da-/ 1ª sg. + /-(i)tiao/ sobre la raíz de parentesco /atti/, con el lokono `da-tti`/`da-iti`
        y Brinton dando el lokono `ahati` ''companion, playmate'' (p. 12). La raíz de parentesco es vocabulario
        de FILIACIÓN, del que casi nunca viaja.'
      en_contra: 'la forma no exhibe ni una diferencia, y no puede exhibirla: sin consonante diagnóstica el argumento
        formal está vacío. Y la raíz /-atti-/ aparece en caquetío en `boratio`, `dato` y `datihao` — o sea que su
        presencia en la lengua no depende de esta voz.'
      peso: media — la etimología es buena y la evidencia formal es nula
    - letra: B — préstamo por contacto
      a_favor: 'el campo. `guatiao` no es una palabra de parentesco cualquiera: es el nombre de una INSTITUCIÓN
        de alianza entre señores —el trueque de nombres entre Ponce de León y Agüeybaná, Las Casas [1552] 1929 II:291—
        y las instituciones de alianza viajan con los aliados. Oviedo la oye en boca de un cacique de Boriquén hablando
        con españoles, en 1510 y pico. Y Oliver DUDA él mismo: «I have no absolute certainty that it belongs to
        a Caquetío language… He could very well have used Taíno», y concluye «equally shared by both Taíno and Caquetío»
        (n. 42, p. 146).'
      en_contra: '«compartida por las dos» no es lo mismo que «prestada»: puede ser herencia común que las dos conservaron.
        Y la etimología de Oliver la hace descender del proto-arahuaco, no cruzar el mar.'
      peso: media-alta — el campo empuja y el autor de la afirmación duda de su propio dato
    - letra: C — indecidible con lo que hay
      a_favor: 'es lo que el test devuelve, y lo devuelve por una razón concreta y no por prudencia: la palabra
        no tiene consonante diagnóstica. Además falta la mitad del dato (la otra orilla) y la mitad que hay es OCR
        sin imagen.'
      en_contra: —
      peso: ALTA — es el veredicto del instrumento
    el_test_que_queda_escrito_para_cuando_llegue_el_dato:
      como_usarlo: cuando otro agente traiga la forma del tomo II/IV (o una segunda copia de la impresa 473 con
        imagen), se mete en `GLOSA_DECLARADA` / en la transcripción y se re-corre el script. Esta tabla dice de
        antemano qué significa cada resultado, para que no se decida después de verlo.
      filas:
      - si_la_forma_de_venezuela_es: idéntica letra a letra a la de San Juan (`datihao` = `datihao`)
        entonces: B se refuerza mucho
        por_que: un cronista con veinte años en La Española escribiendo la MISMA cadena en dos orillas es, como
          poco, indistinguible de un cronista que proyecta. Y es justo el escenario que Oliver teme en la n. 42
      - si_la_forma_de_venezuela_es: '`datihao` frente a un taíno `guatiao` — o sea, difiere sólo en el prefijo
          de persona'
        entonces: sigue siendo C
        por_que: 'es lo que ya tenemos: /da-/ 1ª sg. contra /wa-/ 3ª pl. es MORFOLOGÍA compartida, no correspondencia
          de sonido. Prueba que las dos lenguas tienen el mismo juego de prefijos, que es dato de filiación y ya
          está contado en D11'
      - si_la_forma_de_venezuela_es: con /r/ donde el taíno no la tiene (p. ej. *`daritiao`, *`darihao`)
        entonces: A, y fuerte
        por_que: 'sería P1 cumpliéndose en la voz misma: la correspondencia diagnóstica por fin presente'
      - si_la_forma_de_venezuela_es: con /t-/ inicial (*`tatihao`)
        entonces: A por vía guajiro-paraujana, y falsaría P3
        por_que: el /tA-/ es la innovación guajiro-paraujana; sería dato contra la tesis lokonoide de Oliver
      - si_la_forma_de_venezuela_es: otra palabra distinta para lo mismo
        entonces: B se refuerza
        por_que: si el caquetío tiene voz propia para el aliado ritual, la -tiao es la importada
      - si_aparece: una atestación caquetía de la familia -tiao que NO venga de Oviedo
        entonces: cambia el fondo entero del caso
        por_que: 'las dos entradas caquetías del lexicón (`datihao`, `waitiao`) citan la misma página de Oliver
          sobre el mismo Oviedo. Una fuente independiente rompería la circularidad, que es el problema real. ⚠️
          Y **hay una, y estaba en casa**: el `tiao` de los caquetíos de Apure que Arcaya 1920 p. 48 atribuye al
          Padre Carvajal. Ver `meta.la_otra_orilla_estaba_en_casa` — pero es de Apure y no de la costa, así que
          la regla 4 manda antes que la alegría'
    ⚠️_leer_despues_de_esto: '`meta.la_otra_orilla_estaba_en_casa`, que se midió después de escribir este bloque
      y localiza la página que falta en el tomo **II** de Oviedo (pp. 297-300), no en el IV.'
  la_pregunta_diao:
    lo_que_dice_miguel: «diao y daitiao que son símiles son las versiones caquetías de la versión Taína. Un cognado
      que hace match.»
    lo_que_dice_oliver: 'que son DOS LEXEMAS y no uno: `diao` = /d-ia(o)/ sobre la raíz lokona /d-ai-/ de ''palabra,
      lengua'' (cognado-008, Oliver p. 146, con el lokono `dai-yana-ho`); `datihao`/`daitiao` = /da-/ + /-(i)tiao/
      sobre la raíz de parentesco /atti/ (cognado-009, p. 147). La frase «diao is, in many ways, closely related
      to datihao» (n. 42) **no es una identificación**: son parientes por compartir el prefijo /d-/ y el sufijo
      /-(h)o/, no la raíz. Ya está escrito así en 4-fuentes/oliver-1989-cap2.md.'
    que_comparten_con_precision:
    - el prefijo /d-/ de 1ª persona singular — el mismo que `dare` y `dato`, y el pilar de que el caquetío salga
      del fondo lokono (C1). Lo comparten con el lokono y con el taíno, así que NO es un lazo particular entre las
      dos palabras.
    - el sufijo /-(h)o/ nominalizador solemne, que Oliver llama «characteristic of both Taíno and Lokono» (p. 147)
      y que también lleva `boratio`.
    que_NO_comparten:
    - la RAÍZ. /-ai-/ 'palabra, lengua' contra /-atti-/ 'pariente'. Dos etimologías distintas, escritas por el mismo
      autor en dos páginas seguidas.
    - la GLOSA. `diao` es 'señor principal, jefe mayor' (Zavala p. 67, atestiguado por vía caquetía propia); `datihao`
      es 'padrino de cautivo, el que presta su nombre' (Oliver sobre Oviedo). Rango contra alianza. Bajo la política
      del 2026-09-19 —glosa normalizada idéntica o no hay par— no son el mismo concepto ni de lejos.
    y_la_pregunta_taina_medida:
      pregunta: ¿hay en taíno un `diao`, `tiao` o `-tiao` con valor de RANGO?
      sonda:
        diao:
          en_las_voces_taínas_del_cruce: []

  metodo:
  - 'FILTRO DE SIGNIFICADO: se empareja por glosa castellana EXACTA (el segmento es una sola palabra en los dos
    lados, tras normalizar la ortografía colonial). Un parecido de forma sin filtro de significado es casi todo
    ruido: medido 5 falsos de 7 en el achagua.'
  - 'MIRAR LA CAPA: sólo la capa caquetío-atestiguado decide; las reconstruidas se emiten aparte como circulares.
    Y las entradas taínas cuya `notas` se escribió comparándolas con el caquetío llevan aviso — la forma es de la
    fuente, la comparación no es independiente.'
  - 'LA CLASE NO LA DECIDE EL PARECIDO: el parecido sólo abre la candidatura. La clase la deciden el DOMINIO de
    la voz y si el mismo concepto se parece también en las hermanas.'
  - 'DESCONFIAR: modelo nulo por permutación, control no arahuaco (jirajara/ayomán) y prueba de predicción dejando
    fuera. Una correspondencia con 1 o 2 apoyos no es una regla.'
  capas_de_medicion:
  - diacríticos fuera salvo ü y ñ (sin esto fonemizar borraba ū, ẽ, ë enteras)
  - 'ortografía lingüística (lokono, wayuu, reconstruido): la h suelta pasa a j, porque fonemizar borra la h castellana'
  - 'curiana_fonotactica.fonemizar(); OJO: lleva <ch> a k y <sh> a s en todas por igual'
  - forma_comparable() colapsa las geminadas de Perea; se colapsan las repeticiones y ü -> u
  - 'las cuatro claves castellanas con gemela indígena (casabe/cazabi, maíz/maisi, cacique/cacike, bohío/bohio)
    entran UNA vez, por la indígena: FORMA_DE_LA_ESFERA'
  advertencias:
  - Un parecido de forma con glosa exacta es un CANDIDATO a cognado, no un cognado. Ninguna de estas parejas ha
    pasado por correspondencias regulares verificadas.
  - 'Las listas son cortas y muy distintas de dominio: el caquetío atestiguado es fitonimia y zoonimia de Paraguaná
    y Coro, y la lista taína de Brinton excluye a propósito «nearly all names of plants and animals» (p. impresa
    11). El hueco mide las listas, no las lenguas.'
  - 'Los tainismos son préstamos panamericanos que llegaron con el castellano vía La Española. Oliver lo avisa para
    maraca, cacique y barbacoa (p. 151): «one must be careful about some terms offered by the Spanish as ''native''
    Caquetío».'
  - 'El caquetío atestiguado y el taíno de Brinton están los dos en ortografía castellana colonial: parte del parecido
    que salga es del transcriptor español, no de las lenguas. fonemizar() normaliza lo que puede y no lo resuelve.'

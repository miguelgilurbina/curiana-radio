    contraste_de_formantes:
      que_es: 'la misma sonda sobre los tres corpus onomásticos, lado a lado. Es lo que contesta la pregunta: no
        si un formante existe en los dos sitios —con listas de fonología parecida casi todo existe en los dos sitios—
        sino si aparece en la misma proporción.'
      como_leerlo: 'una proporción parecida no prueba nada por sí sola; una MUY distinta, o un cero limpio contra
        un 20 %, sí dice algo. Y ningún número de aquí es un morfema: una sonda cuenta sílabas en posición, y la
        tabla de `morfologia` es la que dice si detrás hay morfema.'
      ⚠️_el_sesgo_que_hay_que_descontar: 'los tres corpus no son del mismo género. El caquetío sin descartar es
        sobre todo TOPONIMIA (nombres de sitio de Falcón y Paraguaná) y la sonda de Pané es sobre todo ANTROPONIMIA
        y nombres de mito de La Española. Parte de la diferencia es de género, no de lengua: que -bana y -coa —que
        son formantes de LUGAR— den cero en Pané puede medir que Pané casi no nombra lugares. La columna de antropónimos
        caquetíos es la que sí compara género con género, y es la que da los ceros más limpios: 0 de 48 en -ex y
        0 de 48 en -el contra 6 % y 21 % en Pané.'

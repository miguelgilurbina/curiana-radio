  - forma: taratara
    tipo: lectura
    donde: 6-fusion/toponimia_coro_espina.yaml §plural-reduplicacion
    dato: tara 'mariposa' → sitio donde abundan
    ref: plural por reduplicación
  - forma: corocoro
    tipo: lectura
    donde: 6-fusion/toponimia_coro_espina.yaml §plural-reduplicacion
    dato: coro 'espina' → espinar (implícito)
    ref: plural por reduplicación
  - forma: Curaidebo

    donde: 6-fusion/toponimia_coro_espina.yaml §plural-sufijo-bo
    dato: curaridal, lugar de muchos curaríes
    ref: sufijo -bo / -buno
    variantes:
    - Curaridebo
  - forma: Jurijurebo
    tipo: lectura
    donde: 6-fusion/toponimia_coro_espina.yaml §plural-superlativo
    dato: hure 'arena' -> hurehure 'arenal' -> hurehurebo 'lugar de muchos arenales'
    ref: reduplicación + sufijo -bo
    variantes:
    - Hurehurebo

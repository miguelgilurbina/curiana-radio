- obra: castellanos-elegias
  en_bibliografia: true
  descripcion: las 'ciudades de grandísimo momento' en torno a Coro (II, Elegía 1, 1589)
  menciones: 11
  formas: 11
  toponimos:
  - forma: Todariquibo
    tipo: lista-1589
    donde: 6-fusion/castellanos_1589_toponimos.yaml §lista_de_ciudades
    dato: = Todariquiba. TERCERA atestación temprana (Bastidas 1538 + Castellanos 1589), aquí 'ciudad de grandísimo
      mom…
    ref: II, Elegía 1
    identificado_con: Todariquiba
    epoca: colonial (1589)
  - forma: Zacerida
    tipo: lista-1589
    donde: 6-fusion/castellanos_1589_toponimos.yaml §lista_de_ciudades
    dato: = Sacerida/Zazárida (la lista de Arcaya)
    ref: II, Elegía 1
    identificado_con: Sacerida
    variantes:
    - Zazárida
    epoca: colonial (1589)
  - forma: Carao
    tipo: lista-1589
    donde: 6-fusion/castellanos_1589_toponimos.yaml §lista_de_ciudades
    dato: Arcaya lo suponía en el actual Carazao
    ref: II, Elegía 1
    epoca: colonial (1589)
  - forma: Tamadoré
    tipo: lista-1589
    donde: 6-fusion/castellanos_1589_toponimos.yaml §lista_de_ciudades
    dato: = Tomadoré, cerca de La Vela (Arcaya)
    ref: II, Elegía 1
    identificado_con: Tomadoré
    epoca: colonial (1589)
  - forma: Capatarida
    tipo: lista-1589
    donde: 6-fusion/castellanos_1589_toponimos.yaml §lista_de_ciudades
    dato: = Capatárida, hoy vivo
    ref: II, Elegía 1
    identificado_con: Capatárida
    epoca: colonial (1589)
  - forma: Carona
    tipo: lista-1589
    donde: 6-fusion/castellanos_1589_toponimos.yaml §lista_de_ciudades
    dato: 'Arcaya: ''ni el nombre queda'' — pues aquí está el nombre, en 1589'
    ref: II, Elegía 1
    epoca: colonial (1589)
  - forma: Guaybacoa
    tipo: lista-1589
    donde: 6-fusion/castellanos_1589_toponimos.yaml §lista_de_ciudades
    dato: ⭐ = Guaibacoa/Guaidabacoa — OTRO -bacoa temprano; GB lo segmenta guay 'ceiba' + bacoa
    ref: II, Elegía 1
    identificado_con: Guaibacoa
    variantes:
    - Guaidabacoa
    epoca: colonial (1589)
  - forma: Cumarebo
    tipo: lista-1589
    donde: 6-fusion/castellanos_1589_toponimos.yaml §lista_de_ciudades
    dato: hoy Puerto Cumarebo; lleva el -ebo de jurijurebo/curaidebo
    ref: II, Elegía 1
    epoca: colonial (1589)
  - forma: Miraca
    tipo: lista-1589
    donde: 6-fusion/castellanos_1589_toponimos.yaml §lista_de_ciudades
    dato: confirma a Bastidas 1538 (Myraca); comunidad viva
    ref: II, Elegía 1
    epoca: colonial (1589)
  - forma: Hurraqui
    tipo: lista-1589
    donde: 6-fusion/castellanos_1589_toponimos.yaml §lista_de_ciudades
    dato: = Hurraque. Oliver medía 0 apariciones de 'Hurraque' — la grafía en -i explica el cero
    ref: II, Elegía 1
    identificado_con: Hurraque
    epoca: colonial (1589)
  - forma: Hurehurebo
    tipo: lista-1589
    donde: 6-fusion/castellanos_1589_toponimos.yaml §lista_de_ciudades
    dato: cierra la serie Hurihurebo (1538) ~ Hurehurebo (1589) ~ Jurijurebo (moderno)
    ref: II, Elegía 1
    epoca: colonial (1589)

lecturas_propuestas:
- toponimo: toponimo-239
  forma: manare
  lecturas:
  - tipo: testimonio-residente
    lectura: Manare sería una culebra de ojos amarillos, «como de gemas»; y muchos nombres propios y de animales
      terminan en -re (mapanare, Manaure)
    quien: Miguel Gil Urbina
    fecha: '2026-10-10'
    eje: significado
  - tipo: glosa-fuente
    lectura: «CULEBRA-SAPA manare. Pequeña serpiente que suele hallarse a orillas de las vertientes y arroyos hecha
      un rollo […] Es mui ponzoñosa» (E. Portuguesa); y «Avispa MANARE», amarilla, nombrada por su nido «a modo
      de manare»
    quien: Alvarado 1921
    fecha: '2026-10-10'
    eje: significado
    procedencia:
      obra: alvarado-1921
      pagina: 200
    veredicto: 'sin decidir. Da a la lectura de Miguel un referente documentado —hay una culebra llamada manare—,
      pero en los Llanos y sin los ojos amarillos. El patrón de la entrada es nombrar por la forma del cedazo: la
      avispa por su nido en disco; la culebra, por enroscarse en rollo, es inferencia nuestra (Alvarado no lo dice)'
  contexto:
  - 'la glosa del canon es «cesto de fibra», voz cumanagota según Esteves p. 50; Alvarado p. 199 s.v. MANARE: harnero,
    «Voz car., ch. y cum. que existe asimismo en cal., gal., etc. En aruaco, mánali» — el cedazo tiene forma lokona
    (mánali)'
  - 'Alvarado p. 199: «Carvajal escribe incorrectamente manaure»; y en Carvajal (relación de 1647) se lee «cataures
    y manaures muy labrados»: ahí manaure es el objeto tejido, no el título. Para la campaña de Manaure (rama vault/manaure-colombia)'
  - en el achagua (Neira y Ribero 1762) chamanare es la iguana (pliego 69) y manari- da 'calamidad, perderse, arruinar'
    (pliegos 31, 47, 82); Fabo 1911 p. 101 trae mánare 'morir' y un río Manare entre los hidrónimos llaneros en
    -are
mapanare:
  pregunta: ¿alguna fuente del repo da el origen de «mapanare»?
  respuesta: 'no'
  lo_que_hay:
  - 'alvarado-1921 p. 205 s.v. MAPANARE: la serpiente («Color amarillo o rosado en el lomo con una serie de manchas
    pardas romboidales», y la especie más común «de un amarillo que degenera sensiblemente en blanco» por debajo),
    la variante mapanarí (s.v. RABO-FRITO) y la frase «ser una mapanare»; NINGUNA etimología, cuando la entrada
    vecina MAPÍRE sí la lleva («Del ch. mapiri») y MANARE dice «Voz car., ch. y cum.»'
  - 'neira-ribero-1762, pliego 80: «Palma = Cusí, guerrarí, mapanarí, gigirrí» — en achagua mapanarí es una PALMA,
    no la culebra: mismo nombre, otra cosa (el filtro de significado lo separa)'
  - 'el resto del repo nombra la mapanare como fauna de Falcón (corpus de ecología, sin voz caquetía: hueco declarado
    en 3-mundo/corpus/ecologia_lexicon_map.md)'
  maparari: 'toponimo-172 sigue igual: la variante mapanarí de Alvarado acerca la forma pero el salto n~r interior
    sigue sin permutación documentada; no se propone'
  a_buscar: un diccionario de venezolanismos con etimología (fuentes_a_buscar)

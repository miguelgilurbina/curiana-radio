para_el_lexicon:
- forma: -ana
  glosa_propuesta: los de X, la gente de X (colectivo de gente; gentilicio)
  capa_propuesta: hipotético
  linea: 'hermana: lokono (linaje, Brett 1880 pp. 178-179) + kalinago (gentilicio, Breton 1665 p. 416 y 1667)'
  contra: taíno Maguana 'la vega menor' (otra función); achagua -na relacional (no apoya)
  nota: 'es la glosa del morfema-011 en 2-lengua/morfemas.yaml y la del prompt (d21.6): cambiarla mueve canon y
    motor, decisión de Miguel'
- forma: nakan
  glosa_propuesta: en medio, centro
  capa_propuesta: 'reconstruido (regla de la tanda de las hermanas: dos hermanas = reconstruida)'
  linea: 'hermana: taíno nacan ''medio, en medio'' (Las Casas, Historia lib. I cap. XLIV) + lokono annakan ''centro''
    (Brinton 1871) / a-nnakù-di ''estar en medio'' (Perea p. 647)'
  nota: hueco del caquetío (no hay voz para 'en medio'); no sale de un topónimo glosado —sólo la apoya débilmente
    la tradición de Paraguaná— y la forma caquetía es nuestra (el segmento común), no de nadie
- forma: (jaguar)
  glosa_propuesta: —
  capa_propuesta: no se propone
  nota: 'capadare ~ kabadaro es una sola lengua y un préstamo: se queda como lectura del topónimo, no como palabra'
veredicto:
  ana: '-ana ''los de X, la gente de X'' (colectivo de gente, gentilicio): el topónimo sería el nombre de una gente
    pasado al lugar, como Guayana. Encaja con Curiana, que nombra «el pueblo» y «la costa» a la vez (Arcaya p. 169),
    y con Coria-na y Paragua-nil como nombres de aldea en La Ramada (Castellanos p. 264). Capa propuesta: hipotético,
    no reconstruido: el lado caquetío no tiene un solo -ana glosado y el paso de gentilicio a topónimo es inferencia
    nuestra (regla 2: en duda, degradar).'
  guayana: 'en el repo, Guayana es un ETNÓNIMO pasado al país, y de un pueblo de lengua caribe: no es un -ana lokono
    ni dice nada del -ana arahuaco. De las 38 obras del repo que escriben el nombre, 28 no traen nada con aire de
    etimología; los pasajes de las demás se leyeron uno a uno y sólo Goeje (p. 5) y Bachiller (p. 277) dicen de
    dónde viene.'
  cruce:
    hermanas:
      lokono: '11 topónimos con par frente a 9.37 por azar (p95 16; réplicas que igualan o superan: 0.34); con una
        voz por familia, 8 frente a 6 (réplicas que igualan o superan: 0.273)'
      taíno: '68 topónimos con par frente a 63.24 por azar (p95 70; réplicas que igualan o superan: 0.163); con
        una voz por familia, 56 frente a 49.01 (réplicas que igualan o superan: 0.1)'
      kalinago: '25 topónimos con par frente a 14.89 por azar (p95 22; réplicas que igualan o superan: 0.01); con
        una voz por familia, 16 frente a 9.69 (réplicas que igualan o superan: 0.057)'
    primas:
      achagua: '45 topónimos con par frente a 27.43 por azar (p95 36; réplicas que igualan o superan: 0.0); con
        una voz por familia, 16 frente a 11.06 (réplicas que igualan o superan: 0.103)'
      wayunaiki: '4 topónimos con par frente a 4.59 por azar (p95 8; réplicas que igualan o superan: 0.613); con
        una voz por familia, 4 frente a 3.89 (réplicas que igualan o superan: 0.53)'
      paraujano: '0 topónimos con par frente a 1.05 por azar (p95 3; réplicas que igualan o superan: 1.0); con una
        voz por familia, 0 frente a 0.89 (réplicas que igualan o superan: 1.0)'
    vecina_caribe: '2 topónimos con par frente a 2.16 por azar (p95 6; réplicas que igualan o superan: 0.543); con
      una voz por familia, 1 frente a 1.62 (réplicas que igualan o superan: 0.72)'
    propia_lengua_y_medina:
      caquetío: '64 topónimos con par frente a 46.67 por azar (p95 55; réplicas que igualan o superan: 0.0); con
        una voz por familia, 58 frente a 38.42 (réplicas que igualan o superan: 0.0)'
      medina: '32 topónimos con par frente a 20.65 por azar (p95 27; réplicas que igualan o superan: 0.007); con
        una voz por familia, 32 frente a 18.89 (réplicas que igualan o superan: 0.0)'
    lectura: 'Ninguna hermana pasa del azar de forma limpia. El lokono y el taíno dan lo que da el azar. El kalinago
      sale por encima con todas las voces y en el borde con una por familia, y lo que lo empuja son dos cognados
      que el canon YA TIENE: la piedra (šiba ~ kiba) y el mar (balaua, barana ~ para). El achagua sale muy por encima
      con todas las voces y vuelve al azar con una por familia: lo que se replica es que el achagua escribe muchas
      entradas sobre una misma raíz del agua (numa ''boca'', uni ''agua''), no un cognado. El caquetío y las voces
      de Medina salen por encima en las dos cuentas, y son el control positivo: los topónimos se nombran con las
      voces que el propio canon sacó de ellos.'
    candidatos: 499 pares (topónimo, voz) pasan el filtro de significado; 110 con parecido ≥ 0.75, 57 de ellos en
      una hermana; 39 son control positivo (el canon ya leía esa pieza)
  fauna_re: 'ninguna voz caquetía en -re de animal o planta tiene en una hermana o prima una voz con el mismo animal
    y la misma raíz: todas quedan bajo el umbral (fauna_re)'
  mapanare: ninguna fuente del repo da su origen; Alvarado la describe y no la etimologiza; en achagua mapanarí
    es una palma. Sí hay una culebra llamada manare (Alvarado p. 200, Portuguesa)
  lo_mejor_del_pase: de -ana, que dos hermanas glosan un -na de GENTE y ninguna un -na de lugar, y la primaria de
    Maguana; del cruce, cinco candidatos débiles, ninguno por encima de C

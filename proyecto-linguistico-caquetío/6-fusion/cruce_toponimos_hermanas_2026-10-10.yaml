ana:
  estado_en_el_canon: 'morfema-011: forma atestiguada SIN glosa desde #109 (Miguel, 2026-09-07, opción B) y en el
    prompt sin glosa desde d21.6. Casos caquetíos: Paraguaná, Curiana, Chamuriana, Cujicana, Jayana, Coria-na (La
    Ramada, Castellanos p. 264 vía Oliver cap. 3 p. 211); en el canon también Cariguariana, Maracapana y Capana,
    con el -ana dentro de la raíz.'
  por_lengua:
    taíno:
      linea: hermana (lokonoide)
      con_glosa:
      - nombre: Maguana
        lugar: provincia y vega de la Española (la de Caonabó)
        glosa: «Llamaban los indios á la Vega grande Magua […] y á esta provincia decían con adición Maguana, cuasi
          la Vega menor»
        procedencia:
          obra: las-casas-apologetica
          pagina: 19 (cap. VII)
          visto: capa de texto
        que_hace_el_ana: 'la -na añadida a Magua ''la vega grande'' da ''la vega menor'': valor de MENOR / la otra,
          más pequeña'
        separable: 'sí: magua ''vega grande'' lo glosa el mismo Las Casas'
        atestaciones: 'un cronista; Goeje 1939 p. 13 («la petite plaine»), Coll y Toste 1897 p. 240 y Zayas 1931
          (s.v. Abayagua) lo copian: no son independientes'
        nota: 'la lista maestra taína (T10) tenía maguana como ii-solo-secundaria por no haber visto el pasaje:
          esta es su primaria'
      - nombre: çabana / sabana
        glosa: «campiñas llanas y rasas que […] ellos llaman en su lengua çabanas»
        procedencia:
          obra: las-casas-1875
          pagina: lib. I cap. LVI
        que_hace_el_ana: 'nada que se pueda aislar: no hay *çab- ni *sab- con glosa; es la palabra entera'
        separable: 'no'
      - nombre: Habana
        glosa: «Sitio grande»; «Lo grande; ha, por gua, he aquí, lo; baña, grande»
        procedencia:
          obra: coll-y-toste-1897
          pagina: 169 y 227
        que_hace_el_ana: 'para su autor es -bana ''grande'', no -ana; sin cronista detrás (lista maestra: ii)'
        separable: conjetura de compilador
      - nombre: Sibana / Sibanacán
        glosa: '''pedregoso'' / ''piedras muchas'''
        procedencia:
          obra: coll-y-toste-1897
          pagina: 166-167 (su vocabulario inverso)
        que_hace_el_ana: siba 'piedra' + -na 'abundante en'?; Sibanacán es topónimo cubano
        separable: conjetura de compilador, sin cronista
      contra:
      - 'Del Monte 1853 (vía bachiller-morales-1883 pp. 120-121): «las terminaciones en ana son aplicables á la
        agricultura, plantas, frutos y sus poseedores»; Bachiller la da por equivocada y Zayas 1931 t. I p. 34 la
        llama arbitraria'
      - 'Cubanacan no es -ana: es Cuba + nacan ''medio, en medio'' (las-casas-1875 lib. I cap. XLIV). Va a Paraguaná,
        abajo'
      sin_glosa: 'Bayaguana, Yaguana, Caguana, Guatapaná, Bucaná, Jácana: nombres con referente (Coll y Toste) y
        sin significado'
    lokono:
      linea: hermana (lokonoide)
      con_glosa:
      - nombre: Ebesoana, Demaréna (y Korobohána)
        glosa: «From the “Ebesotu” (changed or transformed), heroine of the above legend, the Ebesoana (Arawak family)
          take their name»
        procedencia:
          obra: brett-1880
          pagina: 178-179, notas
          visto: imagen (minería 2, lokono-parentesco-002)
        que_hace_el_ana: 'hace del nombre de la antepasada el nombre del LINAJE matrilineal: Ebesō-tu → Ebeso-ana,
          Demare-du → Demaré-na: ''los de X, la gente que viene de X'''
        separable: sí en los dos primeros (la antepasada está nombrada en la misma nota)
      - nombre: -coa-na (no topónimo)
        glosa: 'nombres de lugar e instrumento sobre verbo: a-ha-cuba-coa-na ''lugar de reposo'', lu-yaccada-coa-na
          ''su cama'''
        procedencia:
          obra: perea-alonso-1942
          pagina: '561'
        que_hace_el_ana: nominalizador verbal; ya en 2-lengua/morfologia.md §8. No forma nombres de lugar sobre
          nombres
      guayana:
        lo_que_dicen_las_fuentes_del_repo:
        - obra: goeje-1939
          pagina: '5'
          dice: el nombre del país viene de un PUEBLO, los Guayana, que vivían junto a la desembocadura del Caroní
            en el Orinoco; Gumilla dice que su lengua es pariente del kalina, y el vocabulario de Raleigh (1595)
            y Keymis (1596) «confirme que c'était une langue de la famille caribe»
        - obra: bachiller-morales-1883
          pagina: 277 (s.v. Guainía)
          dice: 'Guainía «es palabra también de los indios de Costa Firme de que han derivado los españoles la voz
            Guiana ó Guayana», tras Dauxion Lavaysse: tercera mano'
        - obra: gumilla-1791
          pagina: t. I (la Nación Guayana)
          dice: nombra a la nación Guayana, «de genio duro y belicoso», sin etimología
        tierra_de_muchas_aguas: 'no aparece en ninguna fuente del repo (medido abajo, ana.medido.guayana): es etimología
          que circula fuera'
        veredicto: 'en el repo, Guayana es un ETNÓNIMO pasado al país, y de un pueblo de lengua caribe: no es un
          -ana lokono ni dice nada del -ana arahuaco'
      sin_glosa: 'los nombres en -ana de Brett 1868/1880, Roth 1915, Brinton 1871 y Perea 1942 son etnónimos (Wapisiana,
        Ojana, Layana), personajes (Kororomana, Marerewana, Amanna) o -banna ''hoja'' (Yuri-banna ''hoja de tabaco'',
        nombre de persona): ningún nombre de lugar en -ana con glosa'
    kalinago:
      linea: hermana (lokonoide, por el sustrato iñeri)
      con_glosa:
      - nombre: Ouâitoucoubouli-ri / Ouâitoucoubouli-na; caloucaera-ri / caloucaera-na; Liamaïga-ri / Liamaïga-na;
          Kaérabou-ri / Kaéra-bona; balaourcou-ri / balaourcou-na; aichi-na
        glosa: «vn sauuage ou habitant de la Dominique, les habitans de la Dominique. On forme des mots pareillement
          sur le nom des autres Isles»
        procedencia:
          obra: breton-1665
          pagina: 416 (s.v. Ouâitoucoubouli) y Grammaire 1667, hoja G iij («Les pluriers terminez en a, sont du
            commun»)
          visto: capa de texto
        que_hace_el_ana: 'GENTILICIO: isla + -ri ''un habitante'' (masculino), isla + -na ''los habitantes'' (plural
          común)'
        separable: 'sí: el nombre de la isla queda entero (Ouâitoucoubouli ''Dominica'', Caloucaera ''Guadalupe'',
          Liamaïga ''San Cristóbal'')'
        sustrato: 'sin-decidir: Breton da la regla sin marcar registro de hombres o de mujeres'
      sin_glosa: balanna 'mar' (Breton, femenino; Goeje f balaua) es palabra entera; ningún nombre de isla en -ana
    achagua:
      linea: 'prima (orinoco-llanos): comparanda, no reconstruye sola'
      con_glosa:
      - nombre: Casanare Numana 'Boca de Casanare' (pliego 42); Vní numāna 'Voca del Rio' (pliego 98)
        que_hace_el_ana: 'numa ''boca'' (Numasí, pliego 42) + -na relacional: ''la boca (de)''. Abaca Numa ''Boca
          del monte'' va sin -na. La nota del escriba de la transcripción («toponimo del Meta/Casanare con el locativo
          -ana») no se sostiene: el -na es del sustantivo ''boca'', no del topónimo'
        separable: sí, pero no es locativo
      - nombre: Jarrun 'Lugar, sitio' (pliego 73) ~ Jarruna 'Espacio, sitio' (pliego 61)
        que_hace_el_ana: '-na optativo sobre ''lugar'': la misma -na relacional'
      fabo_1911: 'p. 101: el -are hidronímico llanero; del -ana no dice nada'
    wayuu:
      linea: 'prima (guajiro-paraujana): sólo comparanda'
      medido: 'ver ana.medido.lexicon_por_lengua.wayunaiki: ninguna voz en -ana con glosa de lugar'
    caquetio_mismo:
      oliver_1989_cap2: 'pp. 148-149: los sufijos toponímicos caquetíos que lista son -bana, -coa, -oa, -kiva, -(e)bo
        y -wa; -ana no está entre ellos'
      oliver_1989_cap3: 'p. 211: «Coria-na» y «Paragua-nil», «suspiciously Caquetío», en La Ramada'
  paraguana_en_medio:
    por_que_aqui: Esteves p. 56 recoge «conuco en medio del mar» y al canon le falta el morfema de 'en medio'
    lo_que_hay:
    - 'taíno nacan ''medio, en medio'': «Cubanacan […] porque nacan quiere decir, en la lengua destas islas, medio
      ó en medio» (las-casas-1875 lib. I cap. XLIV)'
    - 'lokono annakan ''centro, punto medio'' (lexicón, Brinton 1871) y a-nnakù-di ''estar en medio, entre'' (perea-alonso-1942
      p. 647, Schumann 1755); brett-1868 p. 485: «anakabo n signifying “in the midst”» frente a nacan'
    lectura: paragua 'mar' + -ná como resto de *naka(n) 'en medio' daría 'en medio del mar', la tradición de Esteves
    veredicto: 'DÉBIL: exige perder -kan sin un solo paralelo de ese recorte, y Paraguaná se imprime con -ná tónica,
      no con -naka. Se deja como hipótesis'
  veredicto:
    lugar_de: 'ninguna línea —hermana ni prima— glosa un -ana como ''lugar de''. La retirada de #109 se confirma
      desde fuera'
    lo_que_recurre: '-(a)na como COLECTIVO DE GENTE, en dos hermanas lokonoides y con glosa de fuente primaria y
      separable: el linaje matrilineal lokono (Brett 1880) y el gentilicio plural kalinago (Breton 1665 y 1667).
      Guayana, el caso que trae Miguel, es lo mismo visto desde fuera —un pueblo cuyo nombre pasó al país, Goeje
      p. 5—, pero ese pueblo hablaba caribe.'
    lo_que_no_recurre: 'el taíno da un caso, Maguana ''la vega menor'' (Las Casas): -na sobre un nombre de lugar
      con valor de ''menor''. Uno solo, y otra función'
    candidato: '-ana ''los de X, la gente de X'' (colectivo de gente, gentilicio): el topónimo sería el nombre de
      una gente pasado al lugar, como Guayana. Encaja con Curiana, que nombra «el pueblo» y «la costa» a la vez
      (Arcaya p. 169), y con Coria-na y Paragua-nil como nombres de aldea en La Ramada (Castellanos p. 264).'
    linea: 'hermana: lokono + kalinago (dos tradiciones lokonoides). El achagua no lo apoya (su -na es relacional);
      el taíno lo contradice en su único caso'
    capa_propuesta: 'hipotético, no reconstruido: el lado caquetío no tiene un solo -ana glosado y el paso de gentilicio
      a topónimo es inferencia nuestra (regla 2: en duda, degradar)'
    lo_que_lo_subiria: un -ana caquetío usado por una fuente como nombre de GENTE (no de lugar), o una de las 27
      familias de Hilhouse en -ana con su epónimo
    decide: 'Miguel (ver el borrador de issue): dejar sin glosa, adoptar el candidato como hipotético, o esperar
      a Hilhouse y a Williams 1923'

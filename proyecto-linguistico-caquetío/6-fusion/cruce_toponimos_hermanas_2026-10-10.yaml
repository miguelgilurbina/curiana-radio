  mejores:
  - toponimo: toponimo-016
    forma: capadare
    nivel: C
    par: lokono kabadaro 'jaguar, yaguareté'
    referente: la glosa de fuente es «Diente de tigre» (Zavala; la atribución a Alvarado no se pudo verificar, censo_terminacion_re.yaml)
    lectura: 'capadare podría ser la palabra entera para el jaguar (kabadaro ~ capadare: p~b, -o~-e) y «diente de
      tigre» una relectura de -dare como dare ''diente''; conserva el ''tigre'' que la segmentación capa- + dare
      dejaba sin morfema'
    linea: 'hermana (lokono), con reserva: las notas del lexicón dicen que kabadaro es préstamo del caribe insular
      en el lokono (Goeje 1928, Pet 1987; no están en el repo). Si viene del estrato caribe, la línea es VECINA'
    por_que_es_debil: una sola lengua, y préstamo; el canon decía «el lexicón no tiene ninguna palabra para felino»
      y sí la tenía, como comparanda lokona
    medido:
    - 'kapadare ~ kabadaro (lokono) ''jaguar, yaguareté'' 0.75 [clase-viva: mamifero]'
  - toponimo: toponimo-285
    forma: siraba
    nivel: descartado
    par: 'taíno ciba ''piedra'' (Pané, Las Casas: lista maestra, i-primaria) · lokono siba ''piedra, roca'' · kalinago
      (habla de mujeres) šiba ''pierre'' (Goeje p. 57)'
    referente: cerro cónico de unos 500 m unido al de Santa Ana, con los petroglifos «Las Piedras del Almanaque»
      (Esteves p. 60)
    lectura: 'si(ra)ba: la piedra en las tres hermanas, en un cerro de piedras grabadas; el caquetío atestigua kiba/quiva
      ''piedra'' y van Buurt da siba en Aruba (Casibari)'
    linea: hermana, en las tres
    por_que_es_debil: queda un -ra- sin explicar; el parecido (0,8) lo hace la secuencia s-i-b-a, no un cognado
      limpio
    medido:
    - 'siraba ~ siba (lokono) ''piedra, roca'' 0.8 [paisaje: piedra]'
    - 'siraba ~ siba (taíno) ''piedra; las cibas, piedras como de mármol que se llevan colg'' 0.8 [paisaje: piedra]'
    - 'siraba ~ Ciba (taíno) ''a stone ## pierre ## «La palabra siba en el lenguage de Hait'' 0.8 [paisaje: piedra]'
    - 'siraba ~ šiba (kalinago) ''pierre'' 0.8 [paisaje: piedra]'
    - 'siraba ~ Bosiba (taíno) ''Piedra grande.'' 0.667 [paisaje: piedra]'
  - toponimo: toponimo-298
    forma: cimiro
    nivel: descartado
    par: caquetío (reconstruido) sima 'cerro, elevación del terreno' + -iro diminutivo (REGLAS_ESTEVES)
    referente: cerro, lindero en Moruy (Esteves p. 30)
    lectura: sim(a)-iro 'cerrito'; Esteves escribió «No parece voz indígena»
    linea: 'la propia lengua: no sale de una hermana (sima se declara por cognado lokono y por Barquisimeto, y ese
      cognado no está en el lexicón)'
    por_que_es_debil: las dos piezas son de capa baja (sima reconstruido, -iro leído en topónimos) y contradice
      a la fuente
    medido:
    - 'sim ~ sima (caquetío) ''cerro, elevación del terreno'' 0.857 [paisaje: cerro]'
  - toponimo: toponimo-090
    forma: amuay
    nivel: C
    par: kalinago (habla de mujeres) šauai 'côte rocheuse, falaise, caverne' (Goeje p. 57; grotte šauai-roku)
    referente: 'Esteves p. 16: «la voz da la idea de cavidad subterránea, haitón, cueva grande», y en las cercanías
      hay cuevas naturales'
    lectura: la cueva / el acantilado rocoso de la hermana para un sitio con cuevas
    linea: hermana (kalinago, estrato arahuaco de las mujeres)
    por_que_es_debil: m- frente a š- en el arranque no es correspondencia de nadie; y Amuay es ya C por el ETNÓNIMO
      (Oliver cap. 3 pp. 275-276)
    medido:
    - 'amuai ~ šauai (kalinago) ''côte rocheuse, falaise, caverne'' 0.8 [paisaje: piedra]'
  - toponimo: toponimo-264
    forma: bajarigua
    nivel: descartado
    par: taíno bagua 'mar' (Oviedo; lista maestra i-primaria) · kalinago (mujeres) balaua 'la mer' (Goeje p. 55)
    referente: fundo y salina al norte de El Vínculo, en una depresión bajo el nivel del mar (Esteves p. 19)
    lectura: el mar de las hermanas en un salar costero; el caquetío ya tiene para/parawa 'mar' (atestiguado)
    linea: hermana (taíno y kalinago)
    por_que_es_debil: el parecido lo hacen b-a…g-u-a con un -jari- en medio sin explicar, y el campo 'mar' es el
      que más pares da por azar
    medido:
    - 'bajarigua ~ bagua (taíno) ''mar'' 0.714 [paisaje: mar_costa]'
    - 'bajarigua ~ Bagua (taíno) ''the sea ## «Llaman los indios de aquesta Isla Española á la '' 0.714 [paisaje:
      mar_costa]'

lectura_provisional: >-
  De 36, dos con una hermana (maa en achagua, suka en lokono), una débil
  (waa), tres que son CARIBE de hombres (duna, wari, baba) y el resto sin
  pareja en lo que hay en el repo. Donde se buscó, el lokono y el kalinago de
  MUJERES suelen coincidir entre sí (Adam p. 290: 60 de 79 voces arahuacas caen
  en el habla de mujeres): ver, oír, comer, beber, dormir, sembrar. Es
  exactamente donde el núcleo podría rehacerse desde dos hermanas a la vez.

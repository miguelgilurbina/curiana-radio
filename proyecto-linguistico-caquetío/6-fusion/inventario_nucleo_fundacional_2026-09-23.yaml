# INVENTARIO — el «núcleo fundacional» contra las hermanas (PRIMERA PASADA)
#
# 2026-09-23, dentro de la campaña del habla de mujeres kalinago. Miguel:
# «preferiría usarlo de referencia […] o al menos poder medirlo y poder usar lo
# más posible». Para ver dónde se puede usar, se buscó cada voz reconstruida
# cuya nota dice sólo «núcleo fundacional, forma justificada por cognado en
# lokono/garífuna/proto-arahuaco» —sin página— en las fuentes del repo.
#
# ⚠️ PRIMERA PASADA: búsqueda por glosa en Perea 1942 (Fraseario, Hechos de los
# Apóstoles: su campo NO es el de la vida diaria), las entradas lokono del
# lexicón, Neira y Ribero 1762 y Goeje 1939 (capa de texto). NADA verificado
# en imagen todavía. «ninguna» = no se encontró; un cero hay que verificarlo
# (regla 6) antes de proponer nada.
# Propone, no fusiona (regla 5). No es decisión: es el mapa para pedirla.
# ══════════════════════════════════════════════════════════════════════

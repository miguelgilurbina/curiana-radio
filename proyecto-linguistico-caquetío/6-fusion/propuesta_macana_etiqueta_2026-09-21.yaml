que_cambiaria_de_hecho:
  estado_actual_medido:
    fecha_de_la_medicion: '2026-09-21'
    en_VOCABULARIO_BASE: true
    en_FUERA_DEL_HABLA: false
    en_FORMA_DE_LA_ESFERA: false
    en_SIN_FORMA_DE_LA_ESFERA: false
    ESFERA_DE_CONTACTO: >-
      es un frozenset de LENGUAS (taíno, kalinago, paraujano,
      caribe-continental, jirajaroide-contacto), no de palabras: `macana` no
      cuenta hoy como préstamo de esfera porque su `fuente` es
      `caquetío-reconstruido`, no `taíno`
    categoria: 'armas'
    unica_voz_de_arma: >-
      `macana` es la ÚNICA entrada del lexicón con `categoria: "armas"`, y no
      hay ninguna voz de familia caquetía glosada como arma, garrote, maza o
      clava. Esto importa para las opciones: al contrario que `paa` (cuyo
      paradigma se mudó a la raíz atestiguada `were` en d19.b), aquí archivar
      o retirar SÍ deja hueco funcional.

  uso_en_la_base:
    consulta: >-
      SELECT sobre word_uses ⋈ agent_responses ⋈ turns ⋈ simulation_runs con
      el corte simulation_runs.started_at < '2026-09-21'
    word_uses: 32
    de_un_total_de: 95445
    runs_distintos: 15
    agentes_distintos: 25
    por_serie: {'(sin serie)': 15, 'era2-c': 14, 'era2-b': 3}
    rango_de_fechas: '2026-09-14 a 2026-09-20'
    source_language: 'caquetío en las 32 — consecuencia directa de la etiqueta'
    loanword_uses: 0
    lectura: 'está viva y repartida: no es una voz muerta que se pueda mover sin coste'

  la_forma_D5:
    hoy: '`macana`, con grafía castellana'
    si_sube_a_familia_caquetia: >-
      el lema fonémico D5 sería `makana`, como `matakán` y `wayakán`. Pero
      subir es justo lo que la evidencia no permite.
    si_vuelve_a_taino: >-
      se queda `macana` y cae bajo la doctrina de la des-castellanización
      (2026-09-18): como NO tiene gemela indígena en el lexicón, entraría en
      `SIN_FORMA_DE_LA_ESFERA` y por tanto DEJARÍA DE ENSEÑARSE hasta que
      Miguel fusione una forma propuesta. Ése es el coste de C, y hay que
      decirlo antes: el lexicón se quedaría sin ninguna voz de arma.

  el_score:
    el_scorer_no_se_toca: true
    pero_el_score_se_mueve: >-
      cambiar la FUENTE mueve el score aunque `score_linguistico()` no se
      toque, como pasó en d19.b y en el corte de las raíces: con
      `fuente: taíno`, `macana` sale de `palabras_caquetias` y pasa a
      `prestamos_de_esfera`, que no penaliza pero tampoco suma, y deja de
      escribirse en `word_uses`. Los runs viejos NO se reescriben.
    exige: >-
      medición A/B previa con el patrón de
      `6-fusion/scripts/medir_politica_atestiguado_manda.py`, y corte de serie
      declarado, como el resto de los cambios que tocan curiana_sim/.


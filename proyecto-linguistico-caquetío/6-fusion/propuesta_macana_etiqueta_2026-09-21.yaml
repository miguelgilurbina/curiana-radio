correcciones_propuestas:
  - donde: '6-fusion/decisiones_tanda_2026-09-21.yaml → d21.8 → nota_de_miguel'
    dice: >-
      «…la raíz es `macana-` con SUS propios sufijos […] PERO esas tres formas
      achaguas son apoyo arahuaco INDEPENDIENTE para `macana` misma»
    deberia_decir: >-
      las tres formas existen pero glosan 'Dormidera', 'Mazorca de maíz' e
      'Yndecible'; `Mamacanayisa` es `ma-` + base + el «verbal en bilis»
      `-(da)canayisa` que el propio arte declara (26 izq.); no hay raíz
      `macana-` ni apoyo arahuaco. El Arte trae el lema CASTELLANO «Macana»
      con el achagua `Guacaba` (73 der.).
    nota: 'la conclusión de d21.8 (el -kana no se sostiene) NO cambia; cambia su razón, a mejor'
  - donde: 'curiana_sim/curiana_lexicon.py → comentario sobre `-kana` (≈ línea 7229)'
    dice: >-
      «(Esas tres formas sí son apoyo arahuaco independiente para `macana`
      misma, y revisar su etiqueta va propuesto aparte.)»
    deberia_decir: 'lo mismo que arriba — la frase es falsa tal como está'
  - donde: 'curiana_sim/curiana_lexicon.py → entrada `macana` → notas'
    que_falta: >-
      que la cita de Medina que la sostiene es para otra glosa, y que carece
      de página. Y, si Miguel quiere, la refutación achagua medida aquí.

deuda_que_deja_esta_campana:
  - 'Medina Colina s.v. macana: la PÁGINA sigue sin dictar (`pagina: null`). Sin folio no hay clave foránea (regla 8).'
  - >-
    El arte propiamente dicho de Neira y Ribero (pliegos 7-22: declinaciones,
    las seis conjugaciones, los tratados) sigue sin minar. La morfología que
    esta campaña necesitó —`-si` absoluto, `-yi` adjetival, `ma-` privativo,
    `-(da)canayisa` verbal en bilis— se reunió de migajas del vocabulario y de
    UNA entrada del arte. Ver la bitácora en 4-fuentes/neira-ribero-1762.md.
  - >-
    El precedente kanoa/hamaca/konuko y las trece voces de
    `tainismos_de_medina` (2026-09-12) heredan la misma pregunta que `macana`.
    Es una decisión de CLASE y no se toca por una palabra.
  - >-
    Queda sin resolver si `Macanasi` 'Dormidera' y `Macanayi` 'Mazorca de
    maíz' comparten de verdad una raíz `maca-`/`macana-` achagua. Es
    curiosidad, no bloqueante, y la contestaría el arte.

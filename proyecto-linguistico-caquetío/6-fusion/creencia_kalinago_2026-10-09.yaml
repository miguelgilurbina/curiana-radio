# ─────────────────────────────────────────────────────────────────────────
# PROPUESTA — La creencia KALINAGO como hermana del caquetío, con su tamiz
# Minería 1 de 4-fuentes/sesiones/08_creencia_kalinago_que-minar.md, 2026-10-09.
#
# Regla 5: esto PROPONE. No toca 3-mundo/corpus/, curiana_sim/, el lexicón,
# el ensayo 03 ni ningún índice compartido. Lo decide Miguel.
# Regla 3: todo lo kalinago escrito es de 1635-1667 (Breton vivió en Guadalupe
#   y Dominica 1635-1654), 140 a 170 años después del contacto: es COLONIAL por
#   fecha, y además la capa colonial está DENTRO de las glosas (Breton catequiza
#   con estas mismas palabras). Proyectarlo al s. XIV-XV caquetío es decisión
#   explícita (K4 de la nota 08).
# Regla 4: los kalinago son esfera de contacto, no polity caquetía ni vecino de
#   la Kaketiana. Entran como HERMANA (D1: el habla de mujeres es la cuarta
#   hermana arahuaca), nunca como «lo que se hacía en la costa».
#
# La nota de sesión que acompaña esto, con la auditoría de la Vía A:
#   4-fuentes/sesiones/09_creencia_kalinago_mineria.md
# El borrador de issue de las dos notas del lexicón sin respaldo:
#   6-fusion/issues-pendientes/lexicon-maboya-bejique-sin-respaldo-2026-10-09.md
# ─────────────────────────────────────────────────────────────────────────
meta:
  recogido: '2026-10-09'
  estado: sin-fusionar
  quien: 'minero kalinago de la campaña de creencia (Claude Opus 5.5), en worktree propio; rama vault/creencia-mineria-kalinago'
  plan: 4-fuentes/sesiones/08_creencia_kalinago_que-minar.md
  decision_de_miguel: >-
    2026-10-09, opción C: lo NUEVO entra con la regla estricta del lexicón
    (reconstruido sólo con dos tradiciones arahuacas independientes; con una
    sola, hipotetico; si sólo ilumina un hecho caquetío ya atestiguado,
    lectura). Lo wayuu de la Vía A se QUEDA como comparanda y se audita con lo
    que encuentre esta minería (sección auditoria_via_a).
  reglas_propias_de_lo_kalinago:
    - 'El par hombres/mujeres mide PALABRAS, no creencias: en cada hecho se separa el sustrato arahuaco (comparable) de la capa caribe (va a comparanda de esfera, no al caquetío).'
    - 'Breton confiesa (1665 p. 424) que usó «mapoya» para explicar el Diablo, y catequiza con «Ichéiri» y «chemiin» (1665 p. 41; 1666 pp. 103, 211): la capa colonial está dentro de las glosas. Cada hecho que la tenga lo dice en `capa_colonial`.'
  capas_de_esta_propuesta:
    reconstruido: 'NUEVO para el caquetío y con DOS tradiciones arahuacas independientes citadas (aquí: kalinago de Breton + taíno de Pané). Es candidato: necesita K4.'
    hipotetico: 'NUEVO con UNA sola tradición (o con la segunda sólo vía un compilador de tercera mano).'
    lectura: 'ilumina un hecho caquetío YA atestiguado; no crea hecho nuevo (opción C).'
    comparanda-esfera: 'capa CARIBE: sirve a un personaje de la esfera (Marokoto-ni), nunca al caquetío.'
    no-proyecta: 'capa COLONIAL, o léxico que no se caquetiza (decisión 5 del ensayo: los nombres de la hermana se citan, no se caquetizan).'
  sustrato_valores:
    arahuaco: 'el CONTENIDO está en otra hermana arahuaca con fuente propia (o la forma es de mujeres con sigla am/A en Goeje y el contenido acompaña)'
    caribe: 'nombre de hombres con sigla K/KTu en Goeje y contenido sin hermana arahuaca, o rasgo propio del caribe de tierra firme'
    colonial: 'la glosa o el hecho es del misionero (catequesis, categorías cristianas)'
    sin-decidir: 'el tamiz no alcanza: ni otra hermana ni el kalina medido. Se declara, no se fuerza'
  fuentes:
    primaria: 'breton-1665 (los tres libros: 1665 caraïbe-français, 1666 français-caraïbe). PDF en OneDrive (D8), leídos en imagen con pymupdf; desfases medidos en la ficha: 1665 impresa = pdf − 22; 1666 impresa = pdf − 8.'
    tamiz: 'goeje-1939 pp. 37-39 (pdf − 1), en imagen con la columna de siglas. Copyright (Goeje †1955): sólo forma, glosa corta y sigla.'
    indice: 'steward-1948-hsai-4, Rouse «The Carib» pp. 545-565 (el desfase deriva: pdf 697 = p. 545, pdf 716 = p. 564, pdf 723 = p. 565) y resumen de Steward p. 26 (pdf 50). Tercera mano: un reconstruido nunca se apoya sólo en él.'
    hermana_taina: 'pane-c1498 (texto de Wikisource en el repo, capítulos), primaria de 1494-1498, cadena castellano ← italiano (Ulloa 1571) ← perdido. Independiente de Breton.'
    lado_caqueti: 'oviedo-y-valdes-1852-1855, t. II pp. 298-300 (vistas en imagen hoy), y los ids de 3-mundo/corpus/creencia.yaml (leídos, no editados).'
  cobertura:
    breton_1665_en_imagen: [8, 9, 10, 21, 40, 41, 56, 83, 96, 135, 148, 167, 216, 217, 218, 221, 237, 238, 271, 283, 284, 286, 307, 341, 342, 370, 424]
    breton_1666_en_imagen: [17, 52, 68, 103, 118, 144, 158, 211, 268, 312]
    goeje_1939_en_imagen: [7, 18, 37, 38, 39]
    rouse_hsai_en_imagen: [559, 562, 563]
    rouse_hsai_capa_de_texto: [532, 535, 537, 545, 558, 561, 564, 565, 'Steward p. 26']
    oviedo_t2_en_imagen: [298, 299]
    breton_solo_capa_de_texto: '1665 pp. 46, 130, 255, 408 (pistas; no se citan como texto verificado)'
    como: 'pdftotext -enc UTF-8 de cada PDF al scratchpad para localizar (grafías de §4.2 de la nota 08, llanas y sin diacríticos); cada pasaje que se cita, recortado en bandas a 220-300 ppp y leído en imagen.'
  no_leido:
    - 'Los ~400 pares h/f del tomo de 1666 enteros: sólo las entradas religiosas listadas.'
    - 'Breton 1667 (Grammaire) y el Catéchisme: no se abrieron.'
    - 'Rochefort 1658, Du Tertre 1667 t. II, La Borde 1674, la edición crítica de Breton 1999: fuera del repo; esperan K1-K3.'
  independencia: >-
    Breton, Du Tertre y Rochefort no son tres testigos (nota 08 §3.1). Aquí
    sólo cuenta Breton como testigo kalinago; Rouse los mezcla a todos y Goeje
    los lee. Del lado taíno, Pané es independiente de Breton. Del lado
    caquetío, Oviedo describe también al taíno: donde un paralelo
    caquetío-taíno sólo lo cuenta Oviedo, puede ser su manera de contar —
    aquí el paralelo taíno sale de Pané, no de Oviedo.

# ═════════════════════════════════════════════════════════════════════════
# COMPARANDA KALINAGO — un hecho por id
# ═════════════════════════════════════════════════════════════════════════
comparanda:
  kalinago:
    hechos:

      - id: ck09-01
        pregunta: P1
        contenido: >-
          El espíritu tutelar tiene nombre de hombres y nombre de mujeres. En el
          tomo francés-caribe: «Dieu, Icheíri Iouloúca, f. Chemiin», «il a vn
          Dieu, kicheíriti, kayouloúcati, f. Kechemérati». En el caribe-francés,
          «chemijn, ou çemíjn, nechémeracou, Dieu, mon Dieu», plural
          «cheméignum», sin marca de registro, y Breton avisa de que la mayoría
          pronuncia esa ç como ch y «les autres çemijn, çemeignum».
        grafia: 'h. Icheíri, Iouloúca; f. Chemiin, Kechemérati; sin marca chemijn / çemíjn, chemeignum'
        registro: 'h. y f. (1666); sin marca (1665)'
        sigla_goeje: 'f. šeme «f 2 am 10», A seme-he; h. išeiri «hK?» (K ise «vouloir, désirer, aimer»); h. iuluka «hK» (A (h)ialoko, K yoroka)'
        testigo: lexico
        epoca: '1635-1654, Guadalupe y Dominica'
        fuente: breton-1665
        pagina: '1666 p. 118 (imagen); 1665 pp. 96, 135 (imagen); goeje-1939 p. 38 (imagen)'
        pueblo: kalinago
        sustrato: arahuaco
        sustrato_nota: 'La forma de MUJERES (chemiin/çemijn) es la arahuaca: Goeje la filia al lokono seme-he y es la del cemí taíno. Las dos de HOMBRES las filia al kalina (ichéiri con duda). El par mide la palabra: no dice que las mujeres creyeran otra cosa.'
        capa_colonial: 'Las dos palabras traducen «Dieu» y Breton catequiza con ellas: «La crainte de Dieu est le commencement de la sagesse» con Ichéiri (1665 p. 41, imagen), «la Divinité de IESUS-CHRIST, Lichéirigoni-Christê» (1666 p. 103, imagen), «Dieu s’est incarné, ebechouaàli chemiin ouekélli» (1666 p. 211, imagen). Que sean «Dios» es glosa del misionero.'
        capa: no-proyecta
        proyeccion: 'El nombre no se caquetiza. Va a lengua-cognados como CANDIDATO chemiin ~ cemí ~ seme-he (forma y glosa casan: espíritu tutelar), con el aviso de que la glosa «Dieu» es colonial. El contenido va en ck09-02/03.'
        via_a: {}

      - id: ck09-02
        pregunta: P1
        contenido: >-
          El ichéiri es el espíritu PROPIO DEL BOYÉ y se transmite en su
          iniciación. Quien quiere ser boyé ayuna, y el boyé que lo forma «fait
          descendre son Dieu pretendu qui luy en donne vn»; si el espíritu es
          hombre es un dios, si es mujer una diosa. «On ne dit pas ce Dieu est
          le Dieu des Sauvages, mais le Dieu d’vn tel boyé». No tienen nombre
          para la oración. Un boyé, hablando de otro que hizo boyé, dice
          «Nichiguiénli iouloúcayem lóne, ie luy ay donné vn Dieu».
        cita: '«Les Boyés font les autres boyés» (1665 p. 283)'
        grafia: 'Ichéiricou, Ichéiri; iouloúcayem'
        registro: h.
        sigla_goeje: 'išeiri hK?; iuluka hK'
        testigo: oido
        epoca: '1635-1654'
        fuente: breton-1665
        pagina: '1665 pp. 283, 286 (imagen)'
        pueblo: kalinago
        sustrato: arahuaco
        sustrato_nota: 'El contenido —el especialista tiene su espíritu, que habla con él y que se gana con ayuno— está en el taíno (el behique habla con sus cemíes tras la cohoba, Pané cap. XV; el ayuno de cinco o seis días para ver a los cemíes, cap. XXV). El nombre es de hombres y caribe.'
        divergencia: 'Rouse p. 562 (de Rochefort y Du Tertre) dice que CADA caribe tenía su ichieri, y llama maboya al espíritu del boyé. Breton lo contradice dos veces: el ichéiri es «le Dieu d’vn tel boyé» y «il est inoüy parmy eux qu’on aye offert des Sacrifices à mapoya» (p. 283). Breton es el testigo; Rouse, tercera mano.'
        capa_colonial: '«Dieu pretendu», «ou pour mieux dire vn diable qui se fait paroistre» (p. 283): la categoría Dios/diablo es de Breton.'
        hermana:
          - {pueblo: taino, obra: pane-c1498, pagina: 'caps. XV, XIX, XXV', que: 'el behique y el cacique hablan con sus cemíes tras la cohoba y el ayuno'}
        caquetio: {id: creencia-025, relacion: 'los boratios ven y hablan al espíritu que pintan (Oviedo t. II p. 298); el kalinago dice de quién es ese espíritu: del especialista'}
        capa: lectura
        proyeccion: 'Ilumina creencia-025 y creencia-004 (el piache se forma ayunando): el espíritu que ve el boratio sería el suyo propio, ganado al formarse. No crea hecho nuevo.'
        via_a: {creencia-002: corrobora-en-parte}

      - id: ck09-03
        pregunta: P1
        contenido: >-
          Qué hacen esos espíritus. No hay fiesta de bebida sin ofrenda para
          ellos, porque creen haber recibido la salud por su medio, o que hacen
          crecer la yuca y se les deben las primicias, o por miedo. Los
          espíritus tienen hijos y nietos que traen a beber las ofrendas; «l’vn
          se dit auoir esté autrefois Arroüagues, l’autre d’vne autre nation»;
          los hay jóvenes y viejos, hombres y mujeres; hacen los huracanes, dan
          males como la gota que los demás no pueden curar y mandan a los boyés
          tomar tales hierbas para tales males. Se les teme más de lo que se los
          ama. Ciertos pájaros que se posan en las casas «appartiennent aux
          Dieux des boyez»: si los matan, esos dioses los harían morir.
        grafia: 'Kichéiritina «i’ay vn Dieu»; Ichéiri'
        registro: h.
        sigla_goeje: 'išeiri hK?'
        testigo: oido
        epoca: '1635-1654'
        fuente: breton-1665
        pagina: '1665 pp. 283-284, 271, 341 (imagen)'
        pueblo: kalinago
        sustrato: arahuaco
        sustrato_nota: 'Contenido con hermana taína primaria: cemíes «donde tienen los huesos de su padre, de su madre … hay algunos que hablan; otros que hacen nacer las cosas de comer; otros que hacen llover, y otros que hacen correr los vientos» (Pané cap. XV); el cemí que manda enfermedad si no se le lleva yuca (cap. XX); Guabancex, cemí mujer que hace correr el viento y el agua (cap. XXIII). Que los espíritus kalinago digan haber sido arahuacos es, como mucho, una pista de que el mundo de los espíritus guarda el sustrato; no se usa como prueba.'
        capa_colonial: '«Dieux des Boyez», «vrays diables» y «Sacrifices» son categorías de Breton.'
        hermana:
          - {pueblo: taino, obra: pane-c1498, pagina: 'caps. XV, XX, XXIII; cap. XI (Boinayel y Maroya, cemíes de la lluvia)', que: 'espíritus (algunos con huesos de antepasados, alguno mujer) que hacen llover, soplar el viento, nacer la comida y que mandan enfermedad si no se les da de comer'}
        caquetio: {id: creencia-013, relacion: 'el díao «da los temporales» (atestiguado): el poder sobre el tiempo pasa por el especialista; aquí, por sus espíritus'}
        capa: reconstruido
        proyeccion: >-
          CANDIDATO (dos hermanas): los espíritus del especialista son gente que
          fue —hombres y mujeres, jóvenes y viejos—, mandan el viento fuerte y
          el temporal, hacen crecer la planta, mandan y curan enfermedades y
          piden comida. Para el caquetío, sólo la ESTRUCTURA: sin nombres y sin
          yuca (el rito caquetío atestiguado es de maíz, creencia-023). Lee
          además creencia-013 (lectura).
        via_a: {creencia-012: corrobora-reformulado, creencia-008: corrobora}

      - id: ck09-04
        pregunta: P1
        contenido: >-
          La ofrenda: «Nataguérguetiem nimatoútou loúbara, ie pose deuant luy mon
          Matoútou chargé de cassaue», y la glosa de Breton: cuando el boyé hace
          bajar a su espíritu y se le presenta porque se cree que devolvió la
          salud o hizo crecer la yuca, «c’est vn sacrifice, & vne idolatrie». En
          el tomo de 1666, «ie presente vne offrande, vn sacrifice, nátoubiénli
          téleli libónam Icheíri, f. nataguérguêtiem ànacri lone chemijn».
        grafia: 'ataguérgati, ataguérguétenni «offrande, sacrifice»; matoútou (la mesa); f. ànacri'
        registro: 'h. y f. (1666 p. 312)'
        sigla_goeje: 'offrande anakri «—» (sin origen)'
        testigo: oido
        epoca: '1635-1654'
        fuente: breton-1665
        pagina: '1665 p. 56; 1666 p. 312 (imagen); goeje-1939 p. 38'
        pueblo: kalinago
        sustrato: arahuaco
        sustrato_nota: 'Hermana taína: «Si algún día solemne llevan mucho de comer … ponen todo en la casa del cemí, para que coma de ello el ídolo» (Pané cap. XVI). Es también la hipótesis de Steward 1948 p. 26 («A reflection of Arawakan religion is seen in offerings made to guardian spirits»), que aquí se pone a prueba y pasa.'
        capa_colonial: 'En la misma entrada Breton pone la frase de catecismo «Mataguergátibá nháone mapoyanum, ne sacrifie pas aux diables» (1665 p. 56): prohíbe ofrecer a los «mapoyanum» lo que en p. 283 dice que se ofrece al ichéiri. El misionero rebautiza al ichéiri como mapoya.'
        hermana:
          - {pueblo: taino, obra: pane-c1498, pagina: 'cap. XVI', que: 'comida puesta en la casa del cemí'}
        capa: reconstruido
        proyeccion: 'CANDIDATO (dos hermanas): al espíritu del especialista se le pone comida y bebida. En el caquetío, si entra, con mazamorra o maçato (creencia-023), no con casabe.'
        via_a: {creencia-003: corrobora}

      - id: ck09-05
        pregunta: P5
        contenido: >-
          La sesión del boyé, contada por Breton en primera persona. Se le llama
          para la guerra o para un enfermo; la ofrenda va al fondo de la casa
          redonda, con una hamaca colgada; los asistentes a lo largo de la casa.
          El boyé (a veces con un segundo) entona una canción, uno de los dos
          echa humo de tabaco hacia arriba «au lieu d’encens» y así baja el
          espíritu, que cae «comme vn sac de farine»; el boyé le ofrece la
          hamaca para sentarse y la ofrenda para comer y beber. El espíritu no
          quiere luz: se apaga el fuego, se tapan las entradas de luz, y se hace
          siempre de noche. Breton quiso entrar con un tizón «& les femmes
          m’arresterent». Una vez se acercó con la estola y el Santísimo y oyó
          caer a la «deesse pretendue (c’estoit vne femme qui estoit boyée …)»,
          llorar y gritar un cuarto de hora. Tiene nombre la canción
          («Lerèmericani, chanson pour les faire descendre») y el ayudante
          («Lerèmeri aconum, le sous-chantre du Boyé»).
        grafia: 'Leremericayem bóye loúbara aráli racaútiũ «le boyé chante pour faire descendre ses Dieux»; Lerèmericani; Lerèmeri aconum'
        registro: comun
        sigla_goeje: 'chant de l’h. m. eremi «K»; hochet h malaga «hKTuA» (K, A maraka; tupí maraka)'
        testigo: 'visto y oído (Breton, desde fuera de la casa)'
        epoca: '1635-1654, Dominica'
        fuente: breton-1665
        pagina: '1665 pp. 216-218 (imagen); 1666 p. 68 (imagen)'
        pueblo: kalinago
        sustrato: arahuaco
        sustrato_nota: 'El contenido (noche, casa cerrada, canto, humo o polvo de tabaco, el espíritu que baja y habla, y la comida que se le da) está en el taíno: cohoba, canto y casa cerrada a la que sólo entran los principales (Pané caps. XV, XVI, XIX). Las voces de la canción y la sonaja son caribes o compartidas (eremi K; maraka hKTuA): el nombre no decide.'
        capa_colonial: 'Breton lo cierra con «bien certifié que c’estoit vn vray diable, la boyée vne magicienne, sa chanson, son pacte, que ie n’ay iamais voulu ny entendre, ny écrire» (p. 218): el misionero NO transcribió las canciones a propósito. El hueco del canto ritual kalinago es una censura, no un cero de la fuente.'
        hermana:
          - {pueblo: taino, obra: pane-c1498, pagina: 'caps. XV, XIX', que: 'sesión de cohoba con canto en casa cerrada; el cemí habla al behique o al señor'}
        caquetio: {id: 'creencia-024 / creencia-025 (y Oviedo t. II p. 298, fuera del corpus)', relacion: 'los boratios «se ençierran en un buhío solo: y allí se echan unas ahumadas que llaman tabacos», uno, dos y tres días, y salen con la respuesta del espíritu (Oviedo t. II p. 298, imagen)'}
        capa: lectura
        proyeccion: 'Ilumina lo que Oviedo ya atestigua del boratio (encierro, humo de tabaco, consulta con el espíritu). Diferencia que hay que conservar: el boratio caquetío se encierra SOLO y días; la sesión kalinago es de una noche, con gente dentro.'
        via_a: {creencia-003: corrobora}

      - id: ck09-06
        pregunta: P5
        contenido: >-
          Hubo mujeres boyé: la «deesse pretendue» que bajó en la sesión que
          Breton espió «estoit vne femme qui estoit boyée», y él la llama «la
          boyée vne magicienne». Y fueron las mujeres quienes le cerraron el
          paso a la sesión.
        grafia: 'boyée (en el francés de Breton)'
        registro: comun
        sigla_goeje: null
        testigo: 'visto y oído'
        epoca: '1635-1654'
        fuente: breton-1665
        pagina: '1665 pp. 217-218 (imagen)'
        pueblo: kalinago
        sustrato: sin-decidir
        sustrato_nota: 'Pané no da behiques mujeres (cero en su texto); la oütshii wayuu, que sí es mujer, es vecina desde D11 y no cuenta como hermana. Rouse p. 562 (tercera mano) añade que el espíritu habla a veces por boca de una anciana. Una sola hermana.'
        capa_colonial: '«magicienne», «pacte»: categorías del misionero.'
        caquetio: {id: null, relacion: 'el canon tiene a Buio-sha como aprendiz mujer; ninguna fuente caquetía la atestigua'}
        capa: hipotetico
        proyeccion: 'Una boratia sería hipotética (una sola hermana). El elenco de la era 2 ya la tiene (la boratia de Carirubana): esto no la sube de capa.'
        via_a: {creencia-011: no-toca}

      - id: ck09-07
        pregunta: P5
        contenido: >-
          El nombre del especialista: «boyáicou, bóye, niboyeíri, medecin,
          prestre des Sauuages, ou pour mieux dire, magicien»; «Manboyéiriti, il
          n’est point boyé». En el francés-caribe, «Boyé, le Prestre & le Medecin
          des Caraibes, boyáïcou, mon Boyé iboyéiri», SIN forma de mujeres.
          «Bóye» es además una mosca con dos lucecitas bajo la cola.
        grafia: 'boyáicou, bóye, niboyeíri; boyáhicou (1666 p. 313)'
        registro: 'h. o común; NO hay forma f.'
        sigla_goeje: '«KTu»: kalina puye, tupí paje (p. 37); y bajo «Caribe des Iles, 15e et 16e siècle»: «homme-médecin behiko (à Haïti, selon Las Casas), C boyahiku, boye, K(aliña) püyei» (p. 18)'
        testigo: lexico
        epoca: '1635-1654'
        fuente: breton-1665
        pagina: '1665 p. 83; 1666 p. 52 (imagen); goeje-1939 pp. 18, 37 (imagen)'
        pueblo: kalinago
        sustrato: caribe
        sustrato_nota: 'El nombre es caribe-tupí y no tiene forma de mujeres (negativa medida en 1666 p. 52). La institución, en cambio, tiene contenido arahuaco (ck09-02, 05, 08): el nombre no vuelve caribe a la institución.'
        capa_colonial: '«prestre», «magicien»'
        capa: comparanda-esfera
        proyeccion: 'El nombre boyé no se proyecta: el caquetío tiene boratio atestiguado (creencia-001). Sirve a Marokoto-ni. Y desarma la nota del lexicón de `bejique` (ver el issue).'

      - id: ck09-10
        pregunta: P4
        contenido: >-
          El mapoya en lo que los kalinago cuentan, quitando la catequesis: es
          «esprit malin» (plural mápoyanum); se le teme, junto a los oumécou; a
          él no se le ofrece nada («il est inoüy parmy eux qu’on aye offert des
          Sacrifices à mapoya»); se come la luna en el eclipse —«disent que le
          mapoya l’a mangé, dansent pendant cette nuit là, & n’osent en desister
          quand ils ont vne fois commencé»—; manda enfermedades; y las
          pesadillas son «comme s’ils estoient aux prises auec máboya». Sin
          forma de mujeres en el tomo de 1666.

        proyeccion: 'No se proyecta sin K4; si se proyecta, hipotético y sin el nombre. En ningún caso equivale al buio caquetío (ver el issue): el buio del canon es el animal del piache, y el mapoya es justo lo que el boyé NO sirve.'

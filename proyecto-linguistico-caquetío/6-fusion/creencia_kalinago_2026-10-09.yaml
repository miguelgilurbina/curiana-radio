      - id: ck09-14
        pregunta: P8
        contenido: >-
          El funeral, visto por Breton. Al morir, los pintan de rojo, los
          peinan y, si son considerables, los envuelven en una buena hamaca de
          algodón; abren en medio de la casa un hoyo redondo, hondo según la
          postura que les dan, «qui est celle qu’ils auoiet dans le ventre de
          leur mere»; los bajan sobre una tabla, los tapan con otra y echan
          tierra; lloran cantando en tono lúgubre, y vuelven a hacerlo tarde en
          la noche y antes del alba; ponen pan y bebida sobre las fosas y hacen
          fuego alrededor. «Au bout de l’an ils retournent pleurer, leuent les
          planches, iettent la terre sur les corps consommez, la foullent aux
          pieds, boiuent le reste du iour & de la nuict, & quelquefois quittent
          les maisons, & habitations, comme ie l’ay veu apres la mort d’Henri
          Comte leur Capitaine.»

# ─────────────────────────────────────────────────────────────────────────
# AUDITORÍA de la columna LOKONO de la tabla A-2 de Oliver (cap. 2)
# contra el texto de Schultz 1802 vaciado por Perea y Alonso 1942.
#
# 🔴 CORRECCIÓN (2026-09-09). La primera versión de este archivo decía que
# Perea era una fuente INDEPENDIENTE de Oliver. Es falso, y lo desmiente el
# propio Oliver en el mismo capítulo: al reseñar las fuentes del lokono
# escribe que las obras de Quandt y Schultz «have been the subject of a small
# paper by Brinton (1871) and a very detailed philological analysis by Silvio
# Perea y Alonso (1942)», y más adelante cita «(Perea y Alonso 1942)» como la
# fuente de sus etimologías lokono. Perea es UNA DE LAS FUENTES DE OLIVER.
#
# Lo que esto convierte a esta tabla: de corroboración independiente en
# CONTROL DE TRANSMISIÓN. No prueba que la columna sea cierta; prueba que es
# fiel a la fuente que Oliver usó. Vale para detectar deriva y errores de
# copia, no para sumar un voto a D11. Es exactamente la trampa del §8 del
# protocolo —la corroboración falsa de Jahn citando el mismo apéndice de
# Oviedo— y esta vez me tocó a mí.
#
# Cada fila se LEYÓ en el texto —Fraseario y Compendio Gramatical—, no sale
# del cruce automático.
# ─────────────────────────────────────────────────────────────────────────
que_mide: >-
  Si la columna lokono sobre la que se apoya D11 es FIEL a la fuente que
  Oliver dice haber usado. No es una prueba independiente: es un control de
  transmisión. Ver la corrección de la cabecera.
independencia: >-
  NINGUNA. Oliver cita a Perea y Alonso 1942 como fuente suya de lokono
  (cap. 2, reseña de fuentes y etimologías). Las catorce coincidencias son
  consistencia, no confirmación.
fuente_del_contraste: perea-alonso-1942 (Fraseario parte I + Compendio Gramatical parte II)
medido: '2026-09-08'


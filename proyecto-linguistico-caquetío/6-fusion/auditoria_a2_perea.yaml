# ─────────────────────────────────────────────────────────────────────────
# AUDITORÍA de la columna LOKONO de la tabla A-2 de Oliver (cap. 2)
# contra el texto de Schultz 1802 vaciado por Perea y Alonso 1942.
#
# Por qué importa: D11 se decidió sobre esa columna. Hasta hoy el proyecto
# no la había contrastado con una fuente primaria independiente. Perea lo es:
# vacía a Schultz 1802 directamente, y no depende de Goeje 1928 ni de
# Brinton 1871, que son de donde vienen las entradas lokono del lexicón.
#
# Cada fila se LEYÓ en el texto —Fraseario y Compendio Gramatical—, no sale
# del cruce automático.
# ─────────────────────────────────────────────────────────────────────────
que_mide: >-
  Si la columna lokono sobre la que se apoya D11 se sostiene cuando se la
  contrasta con el lokono de 1802, un estrato medio siglo anterior al de
  Brett y siglo y pico anterior al de Goeje.
fuente_del_contraste: perea-alonso-1942 (Fraseario parte I + Compendio Gramatical parte II)
medido: '2026-09-08'

resultado:
  confirma: 14
  diverge: 2
  ausente_de_toda_la_obra: 2
  de: 18
corregido: >-
  Primera pasada (2026-09-08, mañana): 12 confirma / 2 diverge / 1 parcial /
  3 no medibles. Estaba mal medida: sólo se habia buscado en el ÍNDICE DE
  LEMAS del Fraseario. Agua y árbol no tienen entrada propia ahí, pero sí
  aparecen en el Compendio Gramatical, con cita. Un cero hay que verificarlo
  contra la obra entera, no contra el índice.


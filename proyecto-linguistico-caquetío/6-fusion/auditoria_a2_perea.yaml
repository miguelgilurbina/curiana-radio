lectura: >-
  Catorce de las dieciséis filas medibles coinciden con la columna: la
  transmisión Perea → Oliver es fiel. Lo que de verdad aporta esta tabla, una
  vez retirada la pretensión de independencia, es otra cosa y sigue siendo
  útil: (1) ANCLA. Oliver da las formas lokono sin cita; Perea las da con
  capítulo y versículo del texto de Schultz, así que ahora se pueden verificar
  una a una en un texto primario. (2) Las dos DIVERGENCIAS (sangre, grande)
  pasan a ser más interesantes, no menos: son puntos donde la columna de
  Oliver se aparta de una fuente que él mismo reseñó, y cada una está
  sostenida en tres o cuatro lugares del libro. (3) Las dos ausentes lo están
  de la obra entera.

lo_que_esto_cambia_para_d11: >-
  Menos de lo que escribí en la primera versión. NO añade un voto independiente
  a favor del eje lokono. Lo que hace es dar ANCLA TEXTUAL a dos filas que el
  proyecto usa mucho: el lokono kathi 'luna' es el catti de Hechos 2-20 («dia
  tu-ppa CATTI ù-ttù bia» = «como también la luna en sangre»), recogido por
  Perea en las entradas LUNA (p. 60) y MES (p. 66); y el d-ari 'mi diente' que
  Oliver empareja con el caquetío dare en su p. 147 está en Hechos 7-54
  («crujían SUS DIENTES», na-ri-sibu). Poder señalar el versículo no es poca
  cosa —hasta hoy esas formas eran celdas de una tabla— pero es verificabilidad,
  no evidencia nueva.

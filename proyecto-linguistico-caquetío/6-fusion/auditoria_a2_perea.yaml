  - {concepto: uno,    a2: aba-,              perea: abba,         pagina: 5,   cita: null,   veredicto: confirma}
  - {concepto: dos,    a2: biama/bian,        perea: biama,        pagina: 113, cita: null,   veredicto: confirma}
  - {concepto: oir,    a2: kanabon/*kanabun,  perea: canna,        pagina: 399, cita: null,   veredicto: confirma}
  - {concepto: tu,     a2: bii,               perea: bu-/b-,       pagina: 165, cita: null,   veredicto: confirma}
  - {concepto: monte,  a2: hororo,            perea: huuru-isi,    pagina: 67,  cita: '1-12', veredicto: confirma,

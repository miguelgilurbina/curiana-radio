lectura: >-
  Catorce de las dieciséis filas medibles confirman la columna. Las dos que
  divergen (sangre, grande) no la desmienten: dicen que Schultz usa otra voz
  para ese concepto, lo que en un texto traducido del alemán puede ser
  elección del traductor — aunque ambas están sostenidas en tres o cuatro
  lugares del libro, no en un caso suelto. Las dos ausentes lo están de la
  obra entera.

lo_que_esto_cambia_para_d11: >-
  La fila bandera del cómputo del 2026-08-31 —caquetío cati ~ lokono kathi,
  similitud 1.00— deja de apoyarse en una sola columna de una sola tabla:
  Schultz la escribe catti en Hechos 2-20 («dia tu-ppa CATTI ù-ttù bia» = «como
  también la luna en sangre»), y Perea la recoge dos veces, en las entradas
  LUNA (p. 60) y MES (p. 66). Y el par CQ dare ~ LK d-ari, que Oliver anota en
  su p. 147, queda atestiguado en Hechos 7-54 («a-tanna-du-n NA-RI-SIBU» =
  «crujían sus dientes»).

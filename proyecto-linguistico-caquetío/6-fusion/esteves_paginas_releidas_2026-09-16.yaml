# DE PASO, EN LAS MISMAS PÁGINAS
# ══════════════════════════════════════════════════════════════════════
de_paso:
  - forma: Cayeruba (cola de la entrada, p. 30)
    transcripcion_literal: >-
      En un mapa de reciente confección hemos visto escrita una grafía
      —Cayerúa— la cual consideramos afectada de snobismo.

      ¿Origen de la voz? ¿Si[maruba]? Es posible, hay abundancia de este
      árbol rutáceo en sus [contornos].
    ya_en_el_canon: 'sí (lexicon_toponimos.py ~l. 2041 la cita así); se confirma en imagen'
    por_que_importa: >-
      Para #122. La aldea que Delmonte da como asiento primero de los
      Amuayes tiene cadena de formas: Cayaruba (pregón de la residencia de
      Arias de Villasinda, 1553, Arcaya 1920 p. 275-276: «Cayaruba (Cayerúa,
      en Paraguaná)»), Cayarba (Bustillos 1760, vía González Batista en
      Oliver DOC 264 n. 113), Cayerda/«Coyarna» (tesis de Oliver 1989,
      corregido a Cayerúa en la edición DOC), Cayeruba (Esteves 1989,
      cabecera) y Cayerúa (mapa moderno; Esteves lo tiene por snobismo).
      Material para la campaña de topónimos (permutar TODAS las vocales).
  - forma: Cimiro (p. 30)
    transcripcion_literal: 'Cerro que hace de lindero en[…] [M]oruy. No parece voz indígena.'
    legibilidad: 'la mitad de la primera línea está desvaída; no se recupera'
    propuesta: 'nada: Esteves mismo lo descarta como voz indígena'


lo_que_propongo:
  - >-
    Minar el bloque ACHAGUA primero (2 páginas): es lo que Miguel pidió, es
    corto, y da la lista de dialectos arahuacos con los que Jahn compara.
  - >-
    Después el bloque GUAJIRO-PARAUJANO (19 páginas), que es el que puede mover
    D11: paraujano es columna de la A-2 de Oliver.
  - >-
    El bloque JIRAJARA-AYOMÁN al final, y para descartar, no para sumar.
  - >-
    Y antes de nada: renderizar las páginas a imagen. Sin eso, este apéndice no
    se puede citar.

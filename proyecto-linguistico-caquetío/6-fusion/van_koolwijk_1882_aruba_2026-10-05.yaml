toponimos_en_prosa:
- forma: Parawana
  pagina: 222
  pdf: 4
  clase: indígena (Paraguaná)
  texto: «De nabijheid van de vaste kust van Venezuela (van Parawana) op vijf geographische mijlen afstand van Aruba…»;
    y «aan de noordzijde van Aruba ter plaatse Parawana geheeten, een opschrift, waarop een luiaard … schijnt afgebeeld»
  propuesta: 'DOS referentes con el mismo nombre en 1881: la península y un lugar del norte de Aruba. Para toponimo-018
    (paraguaná): una `lecturas`/`observacion` con la forma «Parawana» (grafía neerlandesa) y la noticia de su homónimo
    arubano, que es el sitio «Paraguana» (A 30) de Wagenaar Hummelinck 1962. No toca la glosa (#109).'
- forma: Fontein
  pagina: 226
  pdf: 8
  clase: neerlandés (la fuente de agua dulce que nace en la gruta)
  texto: gruta en caliza, entrada alta y abovedada, galerías; «indiaansche opschriften zijn er talrijk aanwezig»;
    de una galería «vloeit nog heden eene verfrisschende bron van zoet water, waaraan zij in latere tijden den naam
    Fontein ontleend heeft»
  propuesta: No es topónimo indígena. Va al catálogo de petroglifos (sitio con pinturas) y a `mundo` (agua dulce).
- forma: Carachito
  pagina: 226
  pdf: 8
  clase: indeterminada (¿castellano?)
  texto: cerro al sur del Hooiberg, con cuatro grutas; una con huesos de ocho a diez personas y la tradición de
    la matanza (ver `mundo`)
  propuesta: 'Probablemente el actual Seroe Canashito (al sur del Hooiberg, con dos grutas en caliza y pinturas:
    Wagenaar Hummelinck 1953 A 4-5). Identificación del minador, sin verificar: va como hipótesis.'
- forma: Seroe die Casjoe
  pagina: 223
  pdf: 5
  clase: papiamento ('cerro del merey')
  texto: «Vergelijk indiaansch opschrift van den berg Seroe die Casjoe op Aruba»
  propuesta: No es indígena. Sitio con inscripción (para el catálogo).
- forma: Tunnel (berg)
  pagina: 223
  pdf: 5
  clase: indeterminada
  texto: «Op den berg Tunnel (zoo genaamd volgens de traditie naar een indiaansch opperhoofd) hebben de Indianen
    eene roode verfaarde opgedolven»
  propuesta: 'Tradición: el cerro lleva el nombre de un jefe indio. Dato para antroponimos_caquetios.yaml (retro-abstraido,
    tradición oral de 1881), no para el canon de topónimos.'
- forma: Santa Cruz (Santa Croes)
  pagina: 223
  pdf: 5
  clase: castellano (papiamento entre paréntesis)
  texto: campamento indio al SE del Hooiberg; tiestos pintados, conchas de Strombus, urnas
  propuesta: No es indígena. Sitio arqueológico (ver `mundo` y `lamina`).
- forma: Savonet
  pagina: 225
  pdf: 7
  clase: indeterminada (es la Savaneta de hoy; Gatschet «Saboneta»)
  texto: campamento junto a la Commandeursbaai, en una altura; entierros en vasijas «tot in het begin dezer eeuw»
  propuesta: No es indígena. Sitio arqueológico.
- forma: Hooiberg
  pagina: 223
  pdf: 5
  clase: neerlandés
  texto: «eenen der voornaamste bergen van Aruba»
  propuesta: Referencia geográfica.
- forma: Commandeursbaai
  pagina: 225
  pdf: 7
  clase: neerlandés
  texto: primer desembarcadero y residencia de los comandantes
  propuesta: Referencia geográfica.
- forma: Oranjestad
  pagina: 223
  pdf: 5
  clase: neerlandés
  texto: cerca hay tierra blanca para pintar
  propuesta: Referencia geográfica.
- forma: orua / oruba
  pagina: 222
  pdf: 4
  clase: nombre de la isla
  texto: 'nota 1: «In Spaansche handschriften van het midden der vorige eeuw: orua en oruba»'
  propuesta: 'Para toponimo-051 (aruba → ''Oruba. Oruma. Oirubae'', descartado): añadir «orua» y «oruba» como formas
    que el autor dice leer en manuscritos españoles de mediados del s. XVIII. No sube el nivel (no es una glosa).'
caribe_surinam_1870:
  que_es: 'kari''ña (caribe) de Surinam, ríos Tibiti y Wojambo, apuntado por el autor en 1870 (p. 227). NO es arubano
    ni caquetío. Etiqueta propuesta: comparanda caribe continental, FUERA de la esfera (Surinam); no entra al lexicón.
    Sirve para dos cosas: separar lo arubano de lo que no lo es, y como control caribe (como el jirajara de Jahn).'
  pagina: 227-229 (pdf 9-11)
  verificado_en_imagen: 'sí — las tres páginas a resolución nativa (8,35 px/pt: 2576 px de imagen sobre 309 pt de
    página)'
  nota_del_cruce: coincide_en_forma_y_glosa = una entrada del lexicón con la misma glosa y forma parecida (ratio
    ≥ 0,75). Es un indicio de préstamo areal o de parentesco caribe, no una prueba (minar-fuente §2).

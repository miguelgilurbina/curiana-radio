  no_leido:
  - 'van Koolwijk 1881 (Curazao, TAG 5 pp. 57-68) y 1885 («Indiaansche opschriften te Aruba», Études Leemans pp.
    183-184): no están en el repo (Wagenaar Hummelinck 1953 los cita)'
  - 'Pinart 1890 sobre Aruba: no está en el repo (Wagenaar Hummelinck tampoco lo encontró)'
  - 'Hartog 1953/1968: no está en el repo; sólo llega por van Buurt'
  lo_que_cambia_el_encargo: 'La lista larga (töna, wato, kwai, toëkoëwari, porkoe…; 141 entradas) es el kari''ña
    de SURINAM (1870), no arubano: el autor la pone para mostrar que es otra lengua. Lo arubano son 17 voces y frases,
    7 nombres de plantas y animales y un conjuro (p. 227). Y kwai es ''kalebas'', no ''pijl'': el par lo había corrido
    pdftotext.'
  convencion: 'forma_fuente copia el macrón y la breve donde caen; el macrón sobre el dígrafo «oe» (= /u/) se escribe
    «ōe»; [corchetes] = letra rota. forma_llana quita los diacríticos. Los diacríticos se leyeron a resolución nativa,
    pero en tipo de 9 pt pueden fallar letra a letra: antes de citar una forma como exacta, mirar la imagen.'

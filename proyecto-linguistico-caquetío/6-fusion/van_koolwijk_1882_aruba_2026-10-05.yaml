    contacto: 'Wagenaar Hummelinck 1953 (WagenaarHummelinck_1953_Rotstekeningen_I.txt, línea 287): Pinart es «door
      VAN KOOLWIJK als een in oudheden belangstellende bezoeker van Aruba genoemd» — se conocían'

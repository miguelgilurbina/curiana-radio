mundo:
- id: vk-mundo-01
  esfera: geografía política / esfera de interacción
  pagina: 222
  pdf: 4
  dato: Un arubano que vivió cinco años en «Parawana» (Paraguaná) asegura que desde allí, con tiempo claro, se ven
    muy bien los cerros principales de Aruba; la costa está a «vijf geographische mijlen».
  etiqueta: atestiguado (testimonio de 1881)
  epoca: moderna
  propuesta: 'Para geografía política / esfera-de-interaccion.md: la intervisibilidad Aruba–Paraguaná, dicha por
    un testigo. Proyectarla al s. XV es reconstruido (la geografía no cambió), y esa proyección la decide quien
    fusione.'
- id: vk-mundo-02
  esfera: geografía política / esfera de interacción
  pagina: 222
  pdf: 4
  dato: 'El autor deriva a los indios de Aruba de Parawana: por la cercanía, por la intervisibilidad y porque en
    un lugar del norte de Aruba llamado Parawana hay una inscripción que parece un perezoso, animal de tierra firme
    y no de la isla.'
  etiqueta: hipotetico (lectura del autor, 1882)
  epoca: —
  propuesta: 'Es una LECTURA, no un dato: va con su autor. Choca con la lectura de Wagenaar Hummelinck 1962 del
    mismo sitio («Paraguana», A 30: un pájaro, tortugas o iguanas). No se fusiona como hecho.'
- id: vk-mundo-03
  esfera: ecología / subsistencia
  pagina: 223
  pdf: 5
  dato: Según la tradición, los primeros habitantes vivían en parte en grutas y bajo los bloques de granito, cultivaban
    poco y se dedicaban más a la pesca «en veeteelt»; limpiaban y trabajaban la tierra con un gancho de madera y
    sembraban al pie de los cerros o entre los bloques, donde se junta el agua.
  etiqueta: retro-abstraido (tradición oral de 1881)
  epoca: colonial/moderna
  propuesta: 'Para ecología: la técnica (palo-gancho, siembra donde se junta el agua al pie del cerro) es plausible
    precontacto y se puede proponer así. La «veeteelt» (ovejas y cabras) es colonial: NO se proyecta (regla 3).'
- id: vk-mundo-04
  esfera: ecología / alimentos
  pagina: 223
  pdf: 5
  dato: En la seca comían mariscos, las semillas del totumo (Crescentia cujete), las hojas de la «Koeki di Indian»
    (Agave) y los tallos de la «bringa mosa» (Janipha urens).
  etiqueta: retro-abstraido (tradición oral de 1881)
  epoca: colonial/moderna
  propuesta: Para ecología (alimentos de seca, hambruna). Los taxones son del autor (1882); el nombre actual va
    aparte, como en la política D7.
- id: vk-mundo-05
  esfera: cultura material / vivienda y vestido
  pagina: 223
  pdf: 5
  dato: Los que no vivían bajo los bloques cubrían sus chozas con cañas de maíz u hojas de cocotero y pieles; las
    mujeres vestían un manto largo («manta»), «dat nog door de Indianen op de vaste kust wordt gedragen».
  etiqueta: retro-abstraido
  epoca: colonial/moderna
  propuesta: 'El cocotero es poscontacto: no se proyecta. La manta como prenda que en 1881 todavía llevaban los
    indios de tierra firme es dato de la esfera (comparar con el vestido wayuu).'
- id: vk-mundo-06
  esfera: creencia / muerte
  pagina: 224
  pdf: 6
  dato: 'Entierro en urna hasta comienzos del s. XIX: un anciano de Savonet vio de niño enterrar a una india en
    cuclillas dentro de una urna, con la cabeza fuera; muchos invitados, se mataron ovejas y cabras. En Santa Cruz
    la urna de abajo aparece a menudo tapada con otra, que protegía la cabeza. El carbón en la capa de arriba le
    hace suponer al autor que se quemaban armas o enseres del muerto sobre la tumba. Nunca halló oro ni monedas
    en las urnas.'
  etiqueta: atestiguado (testigo, comienzos del s. XIX) / retro-abstraido para el s. XV
  epoca: colonial
  propuesta: 'Para creencia (ritos de muerte). ⚠️ Gatschet 1885 cuenta la MISMA anécdota (el viejo de «Saboneta»):
    no es una segunda atestación. La quema de enseres es inferencia del autor: va como su lectura.'
- id: vk-mundo-07
  esfera: ecología / creencia
  pagina: 224
  pdf: 6
  dato: 'Nota 1: la rana («dori») sólo vive en Aruba, no en Curazao ni en Bonaire. El autor supone que los indios
    la preferían porque su croar sólo se oye en lluvias y anuncia la buena estación, y compara el croar con el sonido
    de la marakka.'
  etiqueta: atestiguado (la distribución, 1881) · hipotetico (la preferencia, lectura del autor)
  epoca: moderna
  propuesta: 'La distribución la confirma van Buurt (Pleurodema brachyops, llevada a Curazao en 1910 y a Bonaire
    en 1928). La lectura simbólica es del autor: no se fusiona como hecho.'
- id: vk-mundo-08
  esfera: técnica / pigmentos
  pagina: 223
  pdf: 5
  dato: 'Pinturas minerales: tierra parda (¿ocre?) excavada en la gruta de Fontein; tierra roja sacada del cerro
    Tunnel, donde quedan hoyos rectangulares rellenos de piedra y muchas piedras trabajadas en cuña; tierra blanca
    cerca de Oranjestad y en la costa norte; tierra amarilla en Santa Cruz. Una tradición dice que los caribes usaban
    como aglutinante una savia viscosa de cactus. El negro pardo lo supone sacado de la tinta del calamar.'
  etiqueta: atestiguado (las canteras y hallazgos, 1881) · retro-abstraido (la savia de cactus, tradición)
  epoca: moderna
  propuesta: 'Para transmisión/técnica o ecología: las canteras de pigmento con nombre de lugar. Lo del calamar
    es conjetura del autor.'
- id: vk-mundo-09
  esfera: arte rupestre
  pagina: 226
  pdf: 8
  dato: Las inscripciones están en grutas de caliza (Fontein, Carachito) o bajo bloques de granito (todas al suroeste).
    Rojo y pardo son los colores más comunes, el blanco no es raro, el negro sólo lo vio dos veces. Según la tradición,
    algunas figuras bajo los bloques señalan a los antiguos dueños o habitantes del sitio.
  etiqueta: atestiguado (la observación, 1881) · retro-abstraido (lo de los dueños, tradición)
  epoca: moderna
  propuesta: 'Para el catálogo de petroglifos y para creencia/territorio: la tradición de que una figura marca al
    dueño del lugar. La lectura del autor sobre el significado de los colores (rojo = indios, blanco = blancos,
    negro = africanos) y el parentesco con los griegos y la Atlántida (p. 225) es especulación: se registra y no
    se fusiona.'
- id: vk-mundo-10
  esfera: memoria / geografía política
  pagina: 226
  pdf: 8
  dato: 'Tradición de Carachito: los indios se defendieron allí de los franceses; los últimos, escondidos en una
    gruta más alta, fueron delatados por un perro que se quedó atrás y asesinados. En esa gruta circular hay huesos
    de hombres y de niños: el autor calcula entre ocho y diez personas.'
  etiqueta: retro-abstraido (tradición oral) · atestiguado (los huesos, 1881)
  epoca: colonial
  propuesta: Memoria oral de un episodio colonial. No es precontacto.
- id: vk-mundo-11
  esfera: lengua (sociolingüística)
  pagina: 227
  pdf: 9
  dato: '«De Caraïbische taal wordt thans op Aruba niet meer gesproken»: la desplazó el papiamento. El autor sacó
    las voces «met moeite» de unos viejos, y las comparó con el caribe de Surinam y con el guajiro de la costa:
    «geheel verschilt» de los dos.'
  etiqueta: atestiguado (el estado de la lengua, 1881)
  epoca: moderna
  propuesta: Para 2-lengua (historia externa). La comparación con el guajiro es de aficionado y no pesa como dato
    de filiación; se registra porque es la primera que se hizo.
- id: vk-mundo-12
  esfera: población
  pagina: 222
  pdf: 4
  dato: En 1880-81, sobre todo en el sureste de Aruba, el autor ve un tipo físico indio «vrij zuiver»; en Curazao
    ha desaparecido y en Bonaire sólo se reconoce aquí y allá.
  etiqueta: atestiguado (la observación de 1881, con el sesgo racial de su época)
  epoca: moderna
  propuesta: Contexto de la población, no dato del s. XV. Las valoraciones morales del autor (p. 222) no se fusionan.

  padrenuestro:
    pagina: 229
    texto: Ana Pāpa kapoutānĕ, ajēte kōlŏ santo nānjĕ; a kon de leri kōlō nonĕ, o se nōle kōlō nēnjĕ nōnŏ, koēpo
      kāpoe tāno wāl, ĕlāpo eroēpa nānje āna, ĕlĕpāli īkō ĕrŏmē, āna wa pārdōn īkŏ ērŏ wālă erăpā; āna tāsa kāli
      wa kēnītān; ŏlīkoē wīnjī nānā ĕmīmāko ōlīkoē wīnjŏ. Hēpŏlōme.
    nota: kari'ña con préstamos («santo», «pardon», «Pāpa») y una frase que parece criolla («a kon de leri»)
  diez_mandamientos:
    pagina: 229
    texto:
    - Piēnjatākoe Tamōesie papolōto kontyōppo amkōlo ĕrŏpătōne.
    - Ĕrŏnōme lōnge Tamoesi kōlo jātotōkko.
    - (Neger-engelsch) Joe sa meki santa Tamoesi dei.
    - Pīnja tāko pāpa sana mēratāta.
    - Tēwo kolo ewanōme kōsi winkōlo.
    - Jawāssi takōlo.
    - Monawāi kōlo.
    - Oūdrŏtēn sjatōkko.
    - Ămŏlīri pāko te kolākte.
    - Ham te kōn pāko kolākte.
    nota: el 3.º lo marca el autor como neger-engels
lamina:
  veredicto: 'NINGUNA figura de la lámina es un signo rupestre. El texto (pp. 223-224) las identifica todas como
    cerámica de los campamentos de Santa Cruz y Savonet: motivos pintados en tiestos (1-10, que el autor compara
    con vasos griegos), ranas en relieve (11-13), asas (14-18), un pico (19), una vasija (20) y la urna (21). Las
    inscripciones de las grutas las describe con palabras (pp. 225-226) pero no las dibuja. Las primeras figuras
    publicadas de inscripciones arubanas son de Martin 1885 (Fontein y Canashito), según Wagenaar Hummelinck 1953;
    no está en el repo.'
  corrige: el catálogo 6-fusion/petroglifos_imagenes_2026-10-05.yaml, que leía zigzag, espirales, rana y cara como
    signos rupestres
  figuras:
  - figs: 1, 2
    donde_en_la_lamina: pdf 12
    pagina_texto: 223
    que_es: 'motivo pintado en tiestos: «eene uit rechte lijnen en rechte hoeken gevormde figuur» (greca de líneas
      rectas y ángulos rectos)'
    tipo: cerámica pintada
  - figs: '3'
    donde_en_la_lamina: pdf 12-13 (en el pliegue)
    pagina_texto: 223
    que_es: «eene afbeelding van het klaverblad» (trébol) en tiestos
    tipo: cerámica pintada
  - figs: '4'
    donde_en_la_lamina: pdf 13
    pagina_texto: 223
    que_es: «eene kronkelende lijn» (línea ondulante, el «zigzag») en tiestos
    tipo: cerámica pintada
  - figs: 5a, 5b
    donde_en_la_lamina: pdf 13
    pagina_texto: 223
    que_es: «eene in zich keerende ronde lijn» (espiral) en tiestos
    tipo: cerámica pintada
  - figs: '6'
    donde_en_la_lamina: pdf 13
    pagina_texto: 223
    que_es: «eene uit driehoeken bestaande randversiering» (cenefa de triángulos) en tiestos
    tipo: cerámica pintada
  - figs: '7'
    donde_en_la_lamina: pdf 12
    pagina_texto: 223
    que_es: «een grieksch kruis» en tiestos
    tipo: cerámica pintada
  - figs: '8'
    donde_en_la_lamina: pdf 12
    pagina_texto: 223
    que_es: «een halve cirkel» (semicírculos concéntricos) en tiestos
    tipo: cerámica pintada
  - figs: 9, 10
    donde_en_la_lamina: pdf 12 (9) y 13 (10)
    pagina_texto: 223
    que_es: «eene met stippeltjes versierde lijn» (línea con puntos; la 10 es un rombo con punto) en tiestos
    tipo: cerámica pintada
  - figs: 11, 12, 13
    donde_en_la_lamina: pdf 13
    pagina_texto: 224
    que_es: 'ranas y cabezas de rana en relieve en las vasijas pintadas: «Somtijds zijn ten onrechte aan de koppen
      der kikvorschen ooren toegevoegd: Plaat, fig. 11, 12 en 13» (la 11, la rana entera; la 12, la cabeza con orejas
      que parece de mono; la 13, la cara de «ojos y cejas»)'
    tipo: cerámica en relieve
  - figs: 14a, 14b, 14c
    donde_en_la_lamina: pdf 12

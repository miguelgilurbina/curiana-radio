    lectura: 3 veces donde la fuente impresa trae u, Gatschet trae n — y en una el propio Gatschet duda («kanla
      (?kaula)»). Es la confusión típica de quien copia de un manuscrito, no de quien oye.
  citas_de_koolwijk_en_el_repo:
    Casale_et_al_2024_Geoarchaeology_Petrografia_Aruba_CCBY.txt: 1
    Haviser_Strecker_2006_Rock_Art_Caribbean_Zona2.txt: 4
    VanBuurt_2014_CaquetioWords_Papiamentu.txt: 2
    WagenaarHummelinck_1953_Rotstekeningen_I.txt: 20
    WagenaarHummelinck_1962_Rotstekeningen_III.txt: 2
  van_buurt: 'Cita a van Koolwijk dos veces: (1) entre las listas de voces indígenas «in use in Aruba in the late
    19th century» (junto a Pinart); (2) s.v. dabaruida: «In a list from 1880 with Indian words from Aruba made by
    Father van Koolwijk we find dabaroida (Hartog, 1953)». Lo lee A TRAVÉS de Hartog. Y cita a Pinart (como «1890»)
    para Wakubana, purantsi y la fórmula de las espinas. Su lista de topónimos (§7) no dice de dónde sale cada nombre.'
  zayas_y_hartog: 'Zayas 1931 no cita a van Koolwijk (0 menciones en los dos tomos). Hartog 1953/1968 no está en
    el repo: sólo llega citado por van Buurt.'
  veredicto: 'Van Koolwijk 1882 NO es una segunda atestación independiente de lo que dicen Gatschet y van Buurt:
    es la FUENTE PRIMARIA DE LA CADENA. Firmó en noviembre de 1881, antes de que Pinart pisara la isla; las listas
    de topónimos de Gatschet son un subconjunto de las suyas (lugares: 14 de 14; cerros: 14 de 14; grutas: 3 de
    3); la anécdota y la fórmula son las mismas; y 3 confusiones n/u delatan copia de un escrito. Van Buurt, a su
    vez, lo lee vía Hartog y cita a Pinart. La cadena es van Koolwijk 1881 → Pinart 1882 / Gatschet 1885 → (Hartog
    1953) → van Buurt 2014. Lo que sí es independiente: el mapa de 1825 (Wacobana), los nombres VIVOS que van Buurt
    registra en el papiamento y en el mapa de hoy, y lo que sólo trae uno de los dos (Pinart: kafa, tomoi, sus plantas,
    peces, aves e insectos y 5 fórmulas más; van Koolwijk: auw, mimānta, bouserānja, kajappa, marākka, aboūssoe,
    pekinini, Takkitākki y 6 topónimos que Gatschet no trae en ninguna lista).'
  consecuencias:
  - 'karebe: sus DOS atestaciones independientes siguen siendo dos (Aruba y Paraguaná), pero la del lado arubano
    es van Koolwijk 1882 p. 227; Gatschet es la misma cadena.'
  - 'dabaraida (lexicon_gatschet.py): la «TRIPLE atestación independiente» es una cadena histórica más la forma
    viva de van Buurt.'
  - Toda voz o topónimo arubano que hoy se apoye en «Gatschet + van Buurt» como dos fuentes debe revisarse con esta
    cadena delante.

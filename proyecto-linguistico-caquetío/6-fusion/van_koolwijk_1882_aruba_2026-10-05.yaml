# GENERADO por 6-fusion/scripts/minar_van_koolwijk_1882.py: la transcripción
# (leída en imagen) y las propuestas viven en el script; los cruces y las
# cifras los calcula él. No se edita a mano: se corrige el script y se corre
# con --escribir. `--check` dice si este archivo está al día.
# ─────────────────────────────────────────────────────────────────────────

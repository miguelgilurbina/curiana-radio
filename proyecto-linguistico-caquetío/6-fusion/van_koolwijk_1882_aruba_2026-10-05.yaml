conjuro:
  id: vk-aru-25
  pagina: 227
  pdf: 9
  forma: sako den comanari marīa di watapōena fafa na douére sodji na ditiéri
  nl: Eene bezwering, bij het vangen van de leguana in gebruik
  es: un conjuro que se usa al cazar la iguana
  lengua: 'mixta: papiamento («den», «di», «na») con voces sin traducir'
  escala: 'R (fórmula ritual: no léxico)'
  veredicto: confirma-lectura (Gatschet «Sako den komanari manadi watapuna fafa na douere sadii na ditieri»)
  propuesta: 'No es léxico. La fuente primaria segmenta «marīa di watapōena» —en papiamento, «María de [el] watapana»—
    donde Gatschet imprime «manadi watapuna». Con eso «watapuna» no es una voz suelta: es «watapōena», el árbol
    watapana en grafía neerlandesa (oe = u). Va al corpus (creencia) como fórmula de caza, retro-abstraido, época
    moderna; nunca al habla.'
  verificado_en_imagen: 'sí — pdf 9 (8,35 px/pt: 2576 px de imagen sobre 309 pt de página)'
  cruce:
    gatschet_1885: Sako den komanari manadi watapuna fafa na douere sadii na ditieri (ratio 0.95)

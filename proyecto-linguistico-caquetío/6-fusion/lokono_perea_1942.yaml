meta:
  generado_por: curiana_sim/minar_perea.py
  obra: perea-alonso-1942
  que_es: Fraseario analógico del arawak (LOKONO) de las Guayanas Holandesa e Inglesa, extractado por
    Perea del texto bíblico de Theodor Schultz, 1802 — «Act Apostel-nu», los Hechos de los Apóstoles.
    Cada entrada da el concepto en español con sus glosas latina, portuguesa, francesa e inglesa, y debajo
    las frases lokono donde la voz aparece, citadas por capítulo-versículo y ya segmentadas en morfemas
    por el propio Perea.
  estrato: 'Lokono de 1802, no el moderno. El propio Perea documenta que el arawak de Brett 1849 ya diverge:
    «la g sustituye con frecuencia a la k de los Moravos, y la i, u, t de aquéllos se ha transformado
    en e, o, cx» (p. impresa 546). Es un estrato más cercano en el tiempo a los documentos caquetíos que
    Goeje 1928, Brinton 1871 o Pet 1987.'
  cobertura_medida:
    entradas_numeradas: 1060
    parseadas: 1040
    raices_conservadas: 724
    corroboran_el_lexicon: 38
    de_esas_con_glosa_coincidente: 12
    nuevas: 686
    paginas_impresas_ausentes_del_escaneo: 29
  desfase: 'el Fraseario ocupa pdf 165-763 = impresas 1-541, pero el escaneo repite pliegos: hay que leer
    el número impreso de cada página, no sumar una constante'
  etiqueta_propuesta: 'comparanda lokono atestiguada. No entra al canon por sí sola: minar propone, humano
    fusiona'
advertencias:
- 'El texto es una TRADUCCIÓN DEL ALEMÁN hecha por misioneros moravos. El propio Perea avisa (p. impresa
  CVII): «no son de extrañar los abundantes neologismos, exotismos, supresiones y aditamentos». Se cribaron
  germanismos, hispanismos y voces cristianas sin forma nativa.'
- 'El campo semántico es el de los Hechos de los Apóstoles, no el de la costa caribe. Verificado: el Fraseario
  no tiene ENTRADA propia para agua, árbol, arena, raíz, pez ni casa. Aviso medido el mismo día: agua
  (wuni-abu) y árbol (adda) sí están en el Compendio Gramatical, pp. 556 y 559 — el índice de lemas no
  es la obra. Arena y raíz sí faltan de las 926 páginas. Esta fuente NO equilibra la columna wayuu concepto
  por concepto: la equilibra en gramática, partículas, cuerpo, parentesco y vocabulario abstracto.'
- La raíz sale de quitar de la segmentación del PROPIO Perea los segmentos que su Compendio Gramatical
  declara afijos (p. impresa 587). Donde el OCR metió un espacio dentro de un guion la raíz podía salir
  partida; se corrigió pegando los guiones, pero quedan casos.
- 'Las corroboraciones marcadas `glosa_coincide: false` NO son falsas: casi todas son polisemia de una
  misma raíz (abba = uno / otro / alguno / nadie). Necesitan ojo humano, no descarte automático.'
- 'Trampa que el propio Perea nombra (p. impresa 546): la alternancia r/l hace que la postposición -ruccu
  ~ -luccu «en, dentro» colisione con luccu «hombre, persona, indio». El cruce la reencontró sola.'

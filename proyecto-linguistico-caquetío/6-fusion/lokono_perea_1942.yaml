    diverge: 2
    ausente_de_toda_la_obra: 2
    de: 18
  corregido: 'Primera pasada (2026-09-08, mañana): 12 confirma / 2 diverge / 1 parcial / 3 no medibles.
    Estaba mal medida: sólo se habia buscado en el ÍNDICE DE LEMAS del Fraseario. Agua y árbol no tienen
    entrada propia ahí, pero sí aparecen en el Compendio Gramatical, con cita. Un cero hay que verificarlo
    contra la obra entera, no contra el índice.'

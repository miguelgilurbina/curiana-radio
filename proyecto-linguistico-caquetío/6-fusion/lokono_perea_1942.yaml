auditoria_columna_lokono_de_la_A2:
  que_mide: Si la columna lokono sobre la que se apoya D11 se sostiene cuando se la contrasta con el lokono
    de 1802, un estrato medio siglo anterior al de Brett y siglo y pico anterior al de Goeje.

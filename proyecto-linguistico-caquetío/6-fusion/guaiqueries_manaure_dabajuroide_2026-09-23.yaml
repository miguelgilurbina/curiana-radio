    - {esquema: oliver-1989, tradicion: Dabajuroide, subtradicion: Bachaquerana, complejo: Supidebo/Antúnez, desde: 1300, hasta: 1450, region: 'Falcón occidental (Borojó)', obra: oliver-1989-cap4, pagina: 423, nota: 'expansión tardía y «regresiva» (pp. 427, 483); estilo empobrecido frente al Urumaco Tardío de Santa Ana (p. 473)'}

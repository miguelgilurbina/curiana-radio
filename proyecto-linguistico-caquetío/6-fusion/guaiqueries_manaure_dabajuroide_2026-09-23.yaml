    - {esquema: oliver-1989, tradicion: Dabajuroide, subtradicion: Dabajurana, complejo: Los Médanos, desde: 1350, hasta: [1600, 1650], region: 'costa de Falcón, Paraguaná, ABC', obra: oliver-1989-cap4, pagina: 422, nota: 'A prehistórica, B histórica (así lo resume Urbina 2007 Tabla 4, vía M8)'}
    - {esquema: oliver-1989, tradicion: Dabajuroide, subtradicion: Bachaquerana, complejo: Bachaquero, desde: 1300, hasta: 1600, region: 'cuenca de Maracaibo', obra: oliver-1989-cap4, pagina: 423}

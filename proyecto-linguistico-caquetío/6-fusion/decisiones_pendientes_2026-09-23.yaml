        - 'https://editorialsinderesis.com/producto/relaciones-y-descripciones-sobre-venezuela-y-la-nueva-granada-siglo-xvi/'
        - 'https://www.amazon.es/dp/8419199737'
        - 'https://www.librerialamistral.es/es/libro/relaciones-y-descripciones-sobre-venezuela-y-la-nueva-granada-siglo-xvi_MXF0280002'
      aviso_no_trae_la_relacion: >-
        El índice (muestra de la editorial:
        https://editorialsinderesis.com/wp-content/uploads/texto-relaciones-y-descripciones-sobre-venezuela-y-la-nueva-granada-del-siglo-xvi.pdf)
        tiene diecisiete documentos sobre Venezuela, 1520-1600, y ninguno es la
        Relación de Nueva Segovia (Barquisimeto) de 1579. El libro reúne
        manuscritos inéditos, y la de 1579 ya estaba publicada. Comprarlo NO
        consigue la Relación. Lo que sí trae y le sirve al proyecto: la
        «Relación de la gobernación de Venezuela y provincia de Maracaibo hecha
        por el licenciado Tolosa. Coro, 8 de julio de 1548» (p. 97), otra
        transcripción, desde el archivo, del texto que #209 leyó en Fernández
        Duro.
    donde_si_esta:
      referencia: 'Antonio Arellano Moreno (recopilación, estudio preliminar y notas), Relaciones geográficas de Venezuela, Caracas, Academia Nacional de la Historia, 1964 (colección Fuentes para la Historia Colonial de Venezuela), 578 pp.'
      como_conseguirlo: 'de segunda mano (el único anuncio que salió en la búsqueda, en AbeBooks, ya no está disponible; no se buscó más) o en préstamo de biblioteca; HathiTrust lo cataloga (Record 001448214), sin acceso libre comprobado; la vía B3 (el manuscrito del AGI por PARES) sigue abierta'
      nota: 'Zavala Reyes 2015 cita a Arellano Moreno con la sigla AAM (4-fuentes/zavala-reyes-2015.md)'
  zavala_reyes_contacto_profesional:
    obra: 'Miguel Enrique Zavala Reyes, «Palabras vivas de una lengua muerta: legado arawak-caquetío», Boletín Antropológico (Universidad de Los Andes, Mérida) vol. 33, n.º 89, enero-junio 2015, pp. 58-76'
    via_recomendada: >-
      Escribir a la redacción del Boletín Antropológico (Museo Arqueológico
      «Gonzalo Rincón Gutiérrez», Universidad de Los Andes, Mérida), que lo
      publicó, y pedir que reenvíe la consulta al autor. El artículo está en
      el repositorio de la ULA (http://www.saber.ula.ve/handle/123456789/40730)
      y en Redalyc.
    alternativa: 'su perfil académico público en Academia.edu, que lo presenta en el Centro de Antropología del IVIC: https://oarval.academia.edu/MiguelZavalaReyes'
    que_preguntarle: 'de qué obra sacó a «AM» (Angulo Molina), la fuente de los 19 verbos de acción del glosario; y, si se puede, qué obra de Hernández Baño está detrás de la sigla HB (la única fuente de `korie`, dp.1.06)'

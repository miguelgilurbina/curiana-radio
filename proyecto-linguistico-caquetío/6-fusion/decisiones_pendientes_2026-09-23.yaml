grupo_2_mundo:

  - id: dp.2.01
    tema: el contacto precolombino con las Antillas Mayores — ¿qué capa?
    de:
      - 'dc.4 `etiqueta_propuesta_pendiente_de_miguel` (decisiones_campanas_2026-09-21.yaml)'
      - '#199 (T7) taino2-etnohistoria-contacto-2026-09-22.md §6'
      - '#212 (M2) cronicas-contacto-costa-occidental-2026-09-22.md §3 (Metales)'
      - '#203 (M8) arqueologia-insular-falcon-2026-09-22.md §3'
      - '#196 (T8) taino2-evidencia-material-2026-09-22.md'
    pregunta: ¿La tercera afirmación de dc.4 («contacto precolombino con las Antillas Mayores») sube, se queda o se parte?
    opciones:
      T7_A: 'Sube a `reconstruido`'
      T7_B: 'Se queda en `hipotético`, con el expediente escrito (las citas clasificadas y las negativas medidas)'
      T7_C: 'Se parte: C1 «el guanín circulaba entre Tierra Firme y las Antillas Mayores antes de 1492» (reconstruido); C2 «la esfera caquetía participaba en ese circuito» (hipotético)'
      T7_D: 'Baja (descartada por su propio agente)'
      T7_E: 'Se cambia por una afirmación más fuerte: «el contacto, si lo hubo, fue por CADENA de tramos cortos, no por travesía» — hipótesis con predicciones y falsable'
    evidencia:
      - 'dc.4: costa ↔ ABC con parentesco = atestiguado; costa/islas ↔ La Española 1513-1526 = atestiguado, colonial; contacto precolombino con las Antillas Mayores = hipotético, «Miguel decide si sube»'
      - 'M2 (Navarrete pp. 518-519): la cédula de 1501 — los españoles sacaban guanines «de las islas de la Paria é de Caquibacoa» y «los han traído é traen á vender á los dichos indios de la dicha isla Española»: «todo guanín antillano posterior a 1499 deja de servir como prueba de contacto precolombino»'
      - 'M8 (Casale 2024, fig. 1): une cada isla con la costa y «ninguna isla con otra ni con las Antillas»'
      - 'T8: «Sí hubo contacto, y no fue con el taíno»: el vecino con ADN es de las Antillas Menores'
    recomendacion:
      origen: 'T7: «C + E»; «Si prefieres una sola afirmación y ninguna reformulación, entonces B».'
      recopilador: 'C + E. Lo que trajo la tercera minería (cédula de 1501, Casale) va en la misma dirección que E: tramos cortos, sin travesía documentada.'
    toca: canon del mundo (corpus y `6-fusion/taino_en_la_esfera_2026-09-21.yaml`); no el prompt
    depende_de: []

  - id: dp.2.02
    tema: la polity de los llanos — misma lengua con variación, y los caquetíos del Casanare
    de:
      - '#210 (Federmann) federmann-costa-2026-09-23.md §3'
      - '#209 (Pérez de Tolosa) habla-llanos-coro-perez-de-tolosa-2026-09-23.md'
      - '#217 (Rivero) rivero-caquetios-casanare-2026-09-23.md §2 Decisión A'
      - '#218 (Gumilla) gumilla-cacatia-y-achagua-2026-09-23.md pregunta 1'
      - '#207 (M7) coro-colonial-2026-09-22.md §3 (cruce)'
    pregunta: ¿Cómo entra al canon de polities que la costa y los llanos hablaban la misma lengua con variación, y que había caquetíos en el Casanare?
    opciones:
      Federmann_A: 'Al corpus (geografía política y lengua) como hecho atestiguado, contacto-temprano, con las dos citas, sin decir cómo era la lengua'
      Federmann_B: 'Como nota en `3-mundo/polities-caquetias.md`'
      Federmann_C: 'Esperar a Gumilla y Rivero (ya entregados: #217, #218)'
      Tolosa_A: 'Sólo al canon de polities: rasgo de lengua y de economía a `llanos`, con cita (p. 234, de segunda mano); el motor no se toca'
      Tolosa_B: 'A + nota de diseño en `DISENO_KOINE.md` (una segunda polity llegaría con su variedad)'
      Tolosa_C: 'Modelar variedades en `curiana_social` (no recomendada)'
      Rivero_a: 'No tocar `curiana_polities.py`; anotar que el «hasta Casanare… Barraguán» de `llanos` descansa en Rivero vía Jahn y es colonial'
      Rivero_b: 'Añadir a `llanos` una nota con cita directa a `rivero-1883` (pp. 29, 54, 144, 151, 201, 392), sin continuidad política probada'
      Rivero_c: 'Abrir una sexta polity `casanare`'
      Gumilla_A: 'Anotar «Cacatia» en la ficha y en el mapa de dispersión del etnónimo (colonial, polity de los Llanos)'
      Gumilla_B: 'Buscar voces de esos caquetíos de Casanare'
      Gumilla_C: 'Nada'
    evidencia:
      - 'Pérez de Tolosa 1546, en Oviedo y Baños ed. Fernández Duro t. II p. 234 (verificado en imagen): «son los indios de nación Caquetios, aunque algo difieren en la habla á los de Coro»'
      - 'Federmann 1557 [46]-[49]: un caquetío de Coro sirve de intérprete en Barquisimeto'
      - 'Rivero 1883 p. 151: «la lengua *Caquetá* de su pueblo de Pauto» (la impresión, en cursiva); p. 54: «Cacatíos de nación»'
      - 'Gumilla 1791 t. II p. 55 (verificado en imagen): «Nacion Cacatia, Christiana ya»'
    recomendacion:
      origen: 'Federmann: A. Tolosa: A (y B cuando se diseñe el contacto entre polities). Rivero: (b). Gumilla: A.'
      recopilador: 'Las cuatro recomendaciones son compatibles y se aplican juntas: un solo hecho con cuatro testigos. Ninguna toca el motor.'
    toca: canon del mundo (`3-mundo/polities-caquetias.md`, corpus de geografía política); `curiana_polities.py` sólo como nota
    depende_de: []


# ═════════════════════════════════════════════════════════════════════════
# VISTOS DE PASO SIN OPCIÓN — no son decisiones; se listan para que no se pierdan
# ═════════════════════════════════════════════════════════════════════════
vistos_de_paso_sin_opcion:
  - '`surupa` «Blatta orientalis. Cucaracha» (caquetío atestiguado): esa cucaracha es del Viejo Mundo; revisar la glosa (#211)'
  - '`duna` (núcleo, ''agua''): la nota atribuye `tuna` al lokono; Goeje la da a los kalina (sigla K); `duna` es garífuna (#219 §3)'
  - '`samuro` del lexicón es «punta hacia el mar», no el zamuro: homógrafo (#205)'
  - '`baba` ''caño'' (Esteves, Babahuro) choca con `baba` ''padre'' (reconstruido) si entra (#216)'
  - '`chaure`: lechuza de campanario (Alvarado p. 116) o mochuelo de hoyo (Zavala #81) (#205)'
  - '`tigi` y `tauta`, «palomitas que comen peces»: son otra ave; si fueran la gaviotica, la seca larga ya tendría nombre caquetío (#205, #216)'
  - 'el perro mudo, único animal doméstico precontacto documentado para la provincia, no está en el corpus (#211)'
  - '`manatí`, `kanawari`, `tüma`: aparecen como nombres pero son acuñaciones hipotéticas sin cita (#208)'
  - 'la casa gobernante de Coro decía venir del Chiguará (Métraux y Kirchhoff, HSAI 4 p. 353), sin fuente en el repo (#214)'
  - '`çabana`: una cedilla perdida puede estar dando /k/ a una /s/ (#213 §1.1)'
  - 'la «isla de las aves» del naufragio de 1534 y el pueblo de «Paragrachoa» (p. 252) quedan sin identificar (#206, #209)'


# ─────────────────────────────────────────────────────────────────────────
# LAS DECISIONES PENDIENTES, JUNTAS (2026-09-23)
#
# Encargo de Miguel (cc.8 de decisiones_cierre_2026-09-23.yaml):
#   «Hay que juntarlas, sí o sí. Eh, recomiendo un agente que junte todos.
#   Eh, para a, a, a que el trabajo sea más sencillo.»
# Y la orden que lo enmarca:
#   «prioricemos específicamente eh, poder ya cerrar todo el tema investigativo
#   para que nos enfoquemos solamente en la parte creativa de lo que es la
#   simulación»
#
# Esto NO decide nada ni aplica nada: junta, ordena y recomienda. Cada opción
# lleva la letra con la que la escribió su agente de origen. Lo que ya estaba
# decidido (cc.*, db.*, dc.*) no se vuelve a preguntar: va en `ya_decididas`,
# con dónde se decidió.
#
# Resumen legible: 6-fusion/issues-pendientes/decisiones-pendientes-2026-09-23.md
# ─────────────────────────────────────────────────────────────────────────

meta:
  fecha: '2026-09-23'
  recopilado_por: agente recopilador (encargo cc.8)
  fuentes:
    prs_mineria_3: 'cuerpos de los PRs #203-#220 y sus borradores en 6-fusion/issues-pendientes/, leídos de cada rama (campana/mineria3-*, campana/fauna-*)'
    informes_de_agente: 'último mensaje de las transcripciones tasks/*.output de la tercera minería (15 con texto; #209, #210 y #214 no dejaron informe allí: se leyeron su cuerpo de PR y sus archivos)'
    otras_campanas_con_letras_sin_decidir: >-
      Las dos campañas del taíno (#188-#192 del 2026-09-21 y #194-#199 del
      2026-09-22) dejaron opciones con letra que dc.*, db.* y cc.* sólo
      decidieron en parte, y la tercera minería las cita (T10 en #219, dc.4 en
      #212, T8 en #203). Entran aquí para que la lista sea la de TODAS las
      opciones sin decidir; su `de` lo dice.
    ya_decidido_contra: >-
      decisiones_cierre_2026-09-23.yaml (cc.*) y decisiones_base_2026-09-22.yaml
      (db.*), en la rama tanda/base-2026-09-22; decisiones_campanas_2026-09-21.yaml
      (dc.*) y decisiones_tanda_*.yaml, en main.
  reglas_de_lectura:
    - 'Las letras son las del agente de origen. Cuando dos agentes preguntan lo mismo, la entrada es una sola y guarda las letras de cada uno bajo su nombre.'
    - '`recomendacion.origen` es la del agente que la escribió; `recomendacion.recopilador` es la mía, y sólo aparece cuando difiere o cuando algo posterior cambia el cuadro.'
    - 'Las cifras de `evidencia` están copiadas de su fuente (el archivo que se cita), no recalculadas.'
    - 'GRUPO 1 = cambia lo que el prompt enseña o una etiqueta/glosa del lexicón que llega al prompt: va a la última tanda antes de la corrida base (cc.12). GRUPO 2 = canon del mundo (3-mundo/, geografía, topónimos, polities, corpus). GRUPO 3 = sólo documentación, `notas`, `procedencia`, fichas o deuda: no mueve el prompt ni el score.'
    - '`toca` dice si llega al prompt. `notas` y `procedencia` del lexicón no llegan (verificado en db.5 y dc.1: la huella de los prompts no cambia).'

# ═════════════════════════════════════════════════════════════════════════
# GRUPO 1 — CAMBIAN EL PROMPT O UNA ETIQUETA/GLOSA DEL LEXICÓN QUE LLEGA A ÉL
#           (la última tanda antes de la corrida base; de más a menos importante)
# ═════════════════════════════════════════════════════════════════════════
grupo_1_prompt_y_lexicon:

  - id: dp.1.01
    tema: D11 fase 3 — los pronombres personales
    de:
      - '6-fusion/issues-pendientes/decision-d11-fase3-nucleo-lokono-achagua.md §2, §6 (main, 2026-09-13)'
      - '#215 (campana/mineria3-achagua-llanos) 6-fusion/issues-pendientes/achagua-arte-morfologia-2026-09-22.md §1, §4 D, §5 G'
      - '#197 (T11) taino2-prueba-linguistica-2026-09-22.md §7 G'
    pregunta: ¿Qué formas sustituyen a `taya`, `pia`, `nüma` (y se confirman `waya`, `naya`), ahora que la fase 3 es obligatoria y nada puede venir del wayuu?
    opciones:
      D11_forma_propuesta: '1sg `daya` (hipotético) · 2sg `bia` (hipotético, ⚠️ ya es clave lokono) · 3sg `ria` / `ruya` (hipotéticos, ⚠️ claves achagua) · 1pl `waya` (se queda, reconstruido) · 3pl `naya` (se queda, reconstruido) · 2pl `ja` opcional'
      D11_fina_2: '¿Partir `nüma` en `ria` (m.) / `ruya` (no m.)? Las dos hermanas lo hacen, pero obliga al agente a elegir género'
      achagua_D: 'Importar el juego sufijado de persona (achagua y lokono parten la persona en dos juegos). No recomendada por su agente'
      achagua_G: '`pia` deja de ser «sólo wayuu»: el maipure de Gilij da `pìa` «tú»; no cambia su capa (sigue reconstruido)'
    evidencia:
      - 'cc.12, Miguel: «los pronombres y aspectos siguen reconstruidos desde el Wayu. Esto, no podemos seguir teniendo reconstrucciones desde el Wayu, tendría que ser desde el Locono. O el Taíno […] o el Achagua también»'
      - 'D11 §2: 1pl lokono `wa-` = achagua `Guaya` /waya/ y 3pl lokono `na-` = achagua `Naya` concuerdan; 1sg (d / n), 2sg (b / j) y 3sg no m. (t / r) no concuerdan'
      - 'Gilij 1782 t. III p. 186 (#215 §5): «nuja io, pìa tu … uaja noi» — «la primera no wayuu que da `pia`»'
      - 'Neira y Ribero 1762 p. 12 (#215 §1): «Dos juegos» de persona, prefijos para los verbos activos y sufijos para los de estado y el objeto'
      - 'D11 §4: `taya` sale en 3 de 6 constructores de prompt, incluido `_IDENTIDAD_LINGUISTICA`, «que reciben todos»; y «`taya` es la forma más usada del corpus»'
      - '#197 §7 G: `díao` (Coro) ~ `tiao` (Apure) es un contraste /d-/ ~ /t-/ dentro del caquetío, «y `/d-/` es el pilar de la tesis lokonoide» (Arcaya p. 48, Carvajal p. 317)'
    recomendacion:
      origen: 'D11: las formas de la propuesta (su opción B); `da-`/`daya` apoyado en la traza de *dare*. #215: A + B + E + G; D no.'
      recopilador: >-
        Difiere en la 2sg: con `pìa` en el maipure (#215 G), `pia` se puede
        re-justificar desde una hermana del norte que NO es wayuu, y así se evita
        `bia`, que colisiona con la clave lokono 'in' (trampa 2 de D11). Para la
        1sg, `daya` tiene ahora un apoyo que D11 no tenía: el taíno `daca` 'yo'
        (Las Casas, Apologética p. 447, ya en el lexicón por db.3) comparte la
        `d-` con el lokono; pero db.2 pasó `datihao` al taíno, así que de las
        dos trazas CAQUETÍAS de `d-` que D11 citaba (*dare*, *datihao*) queda
        *dare*; y #197 G anota el contraste `díao` (Coro) ~ `tiao` (Apure). No
        partir `nüma` en la base (obliga a elegir género y dobla las
        colisiones); dejar escrito que las dos hermanas lo parten.
    toca: prompt del motor (seis constructores cableados, `_NUCLEO_FALLBACK`, `FORMAS_SEED`) + canon del lexicón + `es_arahuaco()` del score
    depende_de:
      - 'las dos trampas del instrumento de D11 §5: el núcleo está cableado en seis sitios (un perfil no lo cambia) y `bia`/`ria`/`ruya` son claves de otra lengua (renombrar la comparanda antes de sembrar)'
      - dp.1.02
      - dp.1.03

  - id: dp.1.02
    tema: D11 fase 3 — los posesivos
    de:
      - 'decision-d11-fase3-nucleo-lokono-achagua.md §2, §6 («Tres decisiones finas dentro de B»)'
    pregunta: ¿El posesivo de 1sg pasa de `ta-` a `da-`, y con qué etiqueta?
    opciones:
      D11_forma_propuesta: 'pos. 1sg `da-` (reconstruido) · pos. 1pl `wa-` (se queda) · pos. 3pl `na-` (nuevo, reconstruido) · pos. 2sg/3sg `bi-` / `ri-`, `ru-` (hipotéticos)'
      D11_fina_1: '¿`da-` reconstruido (por *dare*) o hipotético (Oliver da la correspondencia para «PERHAPS Caquetío», p. 136, y duda de *datihao*, n. 42)?'
    evidencia:
      - 'D11 §2: pos. 1sg lokono `da-`, achagua `Nu-`; «**sí** (C1)» de traza caquetía'
      - 'D11 §4: `ta-` está en 5 constructores de prompt y en la tupla de `es_arahuaco`; «3.840» usos llevan prefijo posesivo (ANALISIS_BASE_2026-08-06)'
      - 'D11 §7: «`CLAUDE.md` declara los posesivos `pi-` y `nü-`, pero `REGLAS_POSESIVAS` no los tiene»'
    recomendacion:
      origen: '`da-` reconstruido; si la duda de Oliver pesa, se degrada.'
      recopilador: >-
        `da-` reconstruido, con la nota de que su segundo testigo caquetío
        (`datihao`) es hoy taíno (db.2): el taíno lo comparte, así que la
        concordancia lokono-taíno sube y la traza propiamente caquetía baja.
        `bi-`/`ri-`/`ru-` no hacen falta en la base si `pi-`/`nü-` tampoco están
        en el motor.
    toca: prompt del motor + `es_arahuaco()` del score (la tupla de prefijos pasa a la unión de los dos núcleos, D11 §5)
    depende_de: [dp.1.01]

  - id: dp.1.03
    tema: D11 fase 3 — el aspecto (`-ka` / `-ni` / `-da`)
    de:
      - 'decision-d11-fase3-nucleo-lokono-achagua.md §2, §3, §6 C'
      - '#215 achagua-arte-morfologia-2026-09-22.md §1 fila 2'
    pregunta: ¿Con qué se reemplazan las tres marcas de aspecto que vienen del wayuu?
    opciones:
      D11_C: 'perfil pleno: completivo `-bi`, continuativo `-bo`, prospectivo `-pa` — las tres hipotéticas; «dos chocan con claves o con morfemas vivos» y obligan a tocar el mapa de aspecto del score'
      D11_B_aspecto: 'dejar `-ka`/`-ni`/`-da` declarados como canon-simulación, como `-ana` (era la recomendación de D11 antes de cc.12)'
    evidencia:
      - 'D11 §3 punto 4 (Lo corto): «El aspecto (`-ka`/`-ni`/`-da`) no se puede re-derivar con lo que hay. Ninguna de las tres marcas tiene concordancia sistemática.»'
      - '#215 §1: en achagua `-ca` es infinitivo y `-ni` es 3sg.m; el autor: «el pres.te de Indicativo es el q.e hace el gasto» (Neira y Ribero p. 28), como Perea del lokono (p. 606)'
      - 'D11 §4: «18.752 de 54.936 usos llevan sufijo de aspecto» (ANALISIS_BASE_2026-08-06); los tres aspectos son regla propia en `REGLAS_ASPECTO` y 2 de 10 puntos del mapa de aspecto del score'
    recomendacion:
      origen: 'D11 recomendaba no tocar el aspecto (B); #215 dice que `-ka`/`-ni`/`-da` «no apoyados» y que la convergencia «aspecto, no tiempo» gana una segunda voz.'
      recopilador: >-
        B choca con cc.12 («no podemos seguir teniendo reconstrucciones desde el
        Wayu»), así que en rigor queda C o algo que ningún agente escribió con
        letra: las dos hermanas del norte dicen que casi todo se dice en
        presente sin marca (Neira p. 28, Perea p. 606). Si Miguel no quiere
        `-bi`/`-bo`/`-pa` (hipotéticas y con colisiones), la salida con fuente
        es enseñar el verbo sin marca de aspecto obligatoria y dejar las marcas
        como hueco declarado. Es la decisión más cara de la tanda (score y
        koiné): medirla sola.
    toca: prompt del motor + `REGLAS_ASPECTO` + `_aspectos_morfologicos` del score + `FORMAS_SEED` de la koiné
    depende_de: [dp.1.01]

  - id: dp.1.04
    tema: la clase de los tainismos en `[Voces de fuera]`
    de:
      - '#192 (T5) taino-en-la-esfera-2026-09-21.md §6'
      - 'dc.1 (decisiones_campanas_2026-09-21.yaml): «C queda DENTRO de la decisión de clase sobre los tainismos» (macana)'
      - '#194 (T9) taino2-apologetica-2026-09-22.md D3 (macana)'
      - '#196 (T8) taino2-evidencia-material-2026-09-22.md §6: «La auditoría de las 25 voces taínas que la campaña 1 dejó abierta (su opción B) sigue abierta»'
    pregunta: ¿Qué voces taínas deja de enseñar `[Voces de fuera]` — las que sólo llegaron a Venezuela en boca del español (`cacike`, `naboria`), o ninguna?
    opciones:
      T5_A: 'No tocar nada'
      T5_B: 'Partir la etiqueta taína por VECTOR: siguen las que tienen atestación indígena independiente en el área; salen de `[Voces de fuera]` las que sólo llegaron por el español de La Española. Sin tocar el scorer. Exige auditar las voces una a una'
      T5_C: 'Dejar sólo las voces de PRODUCTO y sacar las de institución y ritual (`cacike`, `nitaino`, `naboria`, `batey`, `areito`, `dujo`, `maboya`, `akcicyaa`)'
      T5_D: 'Dejar el motor quieto y arreglar sólo el MUNDO (entrar `etnia-009`); la decisión del prompt, después de la auditoría de B'
      T9_D3_macana: '(A) re-etiquetar `macana` como préstamo de la esfera con Las Casas p. 177 · (B) llevar la cita al issue de macana y decidir las tres piezas juntas · (C) no tocar'
    evidencia:
      - 'T5 §6: el taíno es «25 de las 43» voces que `[Voces de fuera]` puede mostrarle a un tier 1, y entre ellas «`cacike` y `naboria` — las dos que Oliver nombra expresamente como traídas por el español desde La Española»'
      - '#202: «`[Voces de fuera]` 43 → 42» tras la tanda de la base (db.3 sacó `akcicyaa` y `wagulo`)'
      - 'Las Casas, Apologética cap. LXV p. 177 (T9 D3): «Estos vocablos cotaras, macanas, bixa, y maiz, y maguey, fueron vocablos desta isla y no de la Tierra Firme»'
      - 'dc.1: «en la base, `macana` 45 usos de 32 agentes; `poporo`, 2 usos de 2»'
      - 'T5 §6: la decisión del 2026-09-17 («el producto de la esfera ES la esfera») no se toca: `cazabi`, `maisi`, `yuca`, `batata`, `papaya` son productos'
    recomendacion:
      origen: 'T5: D ahora, B como campaña siguiente. T9: (B) para macana.'
      recopilador: >-
        Con la base a punto de ser la vara nueva, «D ahora y B después» significa
        correr los 30 días enseñando `cacike` y `naboria`, que la propia campaña
        identificó como anacronismos. Recomiendo B RECORTADA antes de la base:
        sacar sólo las dos que la campaña ya identificó sin auditoría nueva
        (`cacike` y `naboria`, que Oliver nombra como traídas por el español);
        la auditoría del resto, después. `kunuku` NO: con el criterio de B se
        queda, porque tiene atestación en las islas (van Buurt; T3 la llama «la
        única entrada taína bien citada»). `macana` entra en la auditoría (T9 B).
    toca: prompt del motor (`[Voces de fuera]`); no el scorer
    depende_de: []

  - id: dp.1.05
    tema: '`kumarawa` (cumaragua): la glosa'
    de:
      - '#208 (FA3) fauna-paraguana-mar-2026-09-22.md §0.3 y §4 (b)'
      - '#216 (M6) toponimos-esteves-lote-2026-09-22.md §2'
      - '#213 (M1) oliver1989_lexico_restante_2026-09-22.yaml, A-9 fila 25'
      - 'dc.3 `de_paso_sin_decidir` J (decisiones_campanas_2026-09-21.yaml)'
    pregunta: ¿Se reabre la glosa de `kumarawa` ('caracol de las costas de Paraguaná', D10) con los testigos nuevos?
    opciones:
      FA3_A: 'Abrir de nuevo D10 con el testigo de Esteves p. 33 (cangrejo rosado de las salinas)'
      FA3_B: 'Anotarlo en `notas` y dejar la glosa'
      FA3_C: 'Nada'
      dc3_J: 'Curar `cumaragua`: Arcaya p. 75 escribe «viruela», Zavala leyó «ciruela»'
    evidencia:
      - 'Esteves p. 33, s.v. CUMARAGUAS (FA3): «Cumaragua es el nombre que dan a un pequeño cangrejo de caparazón rosada», con la significación «espuma rosada»'
      - 'M6 §2: «cumaragua en Arcaya es «viruela», no «ciruela» (p. 75, vista en imagen). La nota de `kumarawa` lo cita mal. Una voz para la viruela es dato de contacto (regla 3).»'
      - 'Oliver A-9 fila 25 (M1): `cumaragua` | `kumarawa` | «viruela» — «colonial por construcción»; `fuente_en_oliver: null`'
      - 'Lexicón hoy: glosa de Alvarado 1921 p. 102; la nota cita a Arcaya como «mene y cumaragua nombre de la ciruela»'
    recomendacion:
      origen: 'FA3: A. M6: corregir la cita de la nota en la primera tanda de topónimos.'
      recopilador: >-
        A, y en el mismo gesto la J de dc.3: son la misma voz y los tres agentes
        que la tocaron se enteraron por separado. Hay cuatro lecturas
        (caracol, cangrejo/espuma rosada, viruela, ciruela) y una de ellas
        (ciruela) es una mala lectura de otra (viruela). Mientras se decide,
        corregir la cita de Arcaya en `notas` no mueve nada.
    toca: canon del lexicón (glosa de una voz caquetío-atestiguada, llega al prompt si cambia); la corrección de `notas`, no
    depende_de: []

  - id: dp.1.06
    tema: '`korie` ''armadillo'': ¿una mala lectura de Oviedo?'
    de:
      - '#211 (FA1) fauna-paraguana-tierra-2026-09-22.md §C'
      - '#213 (M1) oliver1989_lexico_restante_2026-09-22.yaml, A-9 fila 24'
    pregunta: ¿Se verifica de dónde sale `korie` 'armadillo' antes de seguir enseñándolo como caquetío atestiguado?
    opciones:
      FA1_C1: 'Campaña corta de verificación: leer en imagen de dónde saca Oliver cada voz de la Tabla A-9 y qué es la sigla HB de Zavala #90'
      FA1_C2: 'Dejarlo como está, con una nota que cite Oviedo t. II p. 330'
    evidencia:
      - 'Oviedo t. II p. 330 (FA1, verificado en imagen): «Armados *cories* hay, pero son mayores que los desta isla y el pelage tiénenlo mas áspero»; en Oviedo `cori` es el cuy (t. I p. 390)'
      - 'M1 leyó la A-9 entera en imagen: fila 24 `corie` | `korie` | armadillo, `fuente_en_oliver: null`'
      - '4-fuentes/zavala-reyes-2015.md: «HB = Adrián Hernández Baño»'
    recomendacion:
      origen: 'C1: «Es barata y el precedente de `datihao` dice que vale.»'
      recopilador: >-
        La mitad de C1 ya la hizo #213: Oliver no da fuente para `corie`. Queda
        la otra mitad, que es Hernández Baño (la sigla HB), la misma obra que
        #204 propone conseguir para Angulo Molina (dp.3.02): un solo encargo
        resuelve las dos. Hasta entonces, C2 (la nota).
    toca: 'canon del lexicón: si cambia la etiqueta, llega al prompt (`korie` es además nombre de agente, Korie-ko, y db.4 lo cita como animal con voz, «NO es hueco»); la nota de C2, no'
    depende_de: [dp.3.02]

  - id: dp.1.07
    tema: '`poporo`: qué hacer después de leer la Parte IV'
    de:
      - '#207 (M7) coro-colonial-2026-09-22.md §2 D-a'
    pregunta: Leída la Parte IV de Castellanos (cc.3 ya lo ordenó), ¿`poporo` se queda atestiguado con la nota corregida o baja?
    opciones:
      A: 'Se queda atestiguado y se corrigen las `notas` (el verso que cita Alvarado es guanebucán) y se quita «ceremonial», que no tiene fuente'
      B: 'Se degrada a `caquetío-reconstruido` o pasa a voz de la esfera (guanebucán/Guajira) hasta que haya un caquetío con poporo'
      C: 'Antes, bajar la Parte IV y leer las pp. 46 y 65 del t. I (YA DECIDIDA: cc.3)'
    evidencia:
      - 'M7 §0.3: «Castellanos no pone el poporo en manos de ningún caquetío»; el pasaje que cita Alvarado es el de Boronata, «indio guanebucán» (p. 202)'
      - 'Lexicón hoy: «maza-porra, arma de combate ceremonial», caquetío-atestiguado, nota «Alvarado 1921, p.255»'
    recomendacion:
      origen: 'C y luego A o B según salga; «Mientras tanto, quitar «ceremonial» cuesta poco.»'
    toca: 'canon del lexicón: glosa y etiqueta de una voz caquetío-atestiguada, que llegan al prompt'
    depende_de: ['la lectura de la Parte IV que ordenó cc.3 (en curso)']
    ya_decidida_en: 'cc.3 decidió la C; A o B se eligen con el resultado'

  - id: dp.1.08
    tema: la Tabla A-9 de Oliver, verificada — `busera`, `kama`, `auri` y cinco notas
    de:
      - '#213 (M1) oliver1989-restante-2026-09-22.md §1.1 y §4 A, D'
      - '#192 (T4) taino-caquetio-similitudes-2026-09-21.md §6 K (`auri`)'
    pregunta: ¿Se toma la A-9 leída en imagen como tabla de referencia y se aplican sus notas al lexicón?
    opciones:
      M1_A: 'Tomar la A-9 verificada como tabla de referencia y aplicar: `busera` nueva (caquetío-atestiguado), `kama` sube con Barquisimeto declarado, `auri` no sube, notas en `warataro`, `kumarawa`, `dare`, `baperón`/`raporón`, `capu`/`kapubana`'
      M1_D: 'Nada al canon todavía: pedir antes Arellano Moreno 1964 (la Relación de Barquisimeto de 1579), que decide época y polity de varias voces'
      T4_K: '`auri` ''perro'' sigue etiquetada `achagua` aunque «Oliver p. 151 la declara la voz caquetía para ''perro''»'
    evidencia:
      - '`busera` (M1 §1.1): Oviedo t. II p. 300 la llama busera (la jagua, tinte negro-azulado); «Una atestación (Oviedo), no dos: Oliver bebe de él»'
      - '`kama` (M1 §1.1): la fila está en la A-9 (15) y el cap. 2 da la fuente, la Relación de Barquisimeto de 1579; huesos de tapir en Túcua (cap. 4, p. 439)'
      - '`auri`: M1 — «Oliver lo halló en una lista CUYÓN y lo infiere prestado del caquetío de Barquisimeto (cap. 2, p. 151)»; T4 K lee la misma página como declaración de voz caquetía. Las dos lecturas de p. 151 chocan'
      - 'Regla 4 (M1): la fuente de varias voces de la A-9 es la Relación de Barquisimeto de 1579, polity de Barquisimeto, no la costera'
    recomendacion:
      origen: 'M1: «A + B ahora, D en paralelo, C no.»'
      recopilador: >-

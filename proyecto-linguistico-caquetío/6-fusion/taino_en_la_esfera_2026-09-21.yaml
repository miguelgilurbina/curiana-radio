no_encontrado:
  - "Ningún objeto antillano en Falcón, Paraguaná o las islas ABC. Ni cerámica ostionoide, chicoide o meillacoide, ni guanín, ni cemí atribuido con catálogo."
  - "Ningún objeto dabajuroide en las Antillas Mayores."
  - "Ningún cronista que describa una travesía, un comercio o una noticia entre la costa caquetía y las Antillas Mayores antes de 1499."
  - "Ninguna cifra de distancia de travesía con fuente en el repo. Paraguaná↔Aruba está en el corpus (~25 km, ecologia-021); de las ABC a La Española no hay ninguna, y no se pone a mano."
  - "Nada sobre los lucayos llevados a las perlas de Cubagua: cero menciones de «lucay» en TODO el repo (etnias, asentamientos, corpus) y cero en Anglería vol. 1 y en Arcaya. Es una deportación real y documentada en otra literatura, pero el repo no la tiene y además Cubagua es de la costa oriental, fuera de la polity costera."
  - "Ninguna lista Swadesh del caquetío contra el taíno: el Apéndice A de la tesis de Oliver (las listas de 100 palabras para lenguas arahuacas, pp. 559-594 impresas) sigue con el OCR ilegible (#62). Es la pieza que mediría de verdad la distancia caquetío↔taíno, y no la tenemos."
  - "Ningún dato sobre la RECUPERACIÓN contemporánea del taíno, su escritura ni la identidad taína actual. Decisión de Miguel: no es dato del siglo XV, y no se buscó."
  - "tesseract NO está instalado en esta máquina (verificado: no está en PATH ni en C:/Program Files/Tesseract-OCR). El OCR que la memoria del proyecto da por disponible desde 2026-08-14 no se pudo usar, así que la tesis escaneada de Oliver (79 MB, 801 pp.) sólo se leyó por los capítulos 2 y 3, que tienen capa de texto propia."

# ══════════════════════════════════════════════════════════════════
# 8. OBRAS QUE HARÍAN FALTA — anotadas, NO descargadas
# ══════════════════════════════════════════════════════════════════
obras_a_conseguir:

  - obra: "Rouse, Irving y Cruxent, J. M. (1963), Venezuelan Archaeology"
    por_que: >-
      Define la tradición dabajuroide y la sitúa frente a las series
      antillanas. Es lo que cerraría arq-01 por el lado positivo. YA ESTÁ EN LA
      BIBLIOGRAFÍA (`rouse-cruxent-1963`) y el archivo está en 0 bytes.
    url: "Yale University Press, 1963 — sin edición abierta localizada; ejemplares en archive.org bajo préstamo controlado (https://archive.org/search?query=Venezuelan+Archaeology+Rouse+Cruxent)"
    derechos: "En copyright (Yale UP). Préstamo controlado, no descarga libre."
    tamano: "no medido — no se abrió"
    prioridad: alta

  - obra: "Rouse, Irving (1992), The Tainos: Rise and Decline of the People Who Greeted Columbus"
    por_que: >-
      La síntesis estándar del taíno y de las series cerámicas antillanas
      (saladoide → ostionoide → chicoide). Es lo que permitiría decir si el
      límite septentrional del dabajuroide y el límite meridional del
      ostionoide se tocan en algún punto o dejan un vacío.
    url: "Yale University Press, 1992 — https://yalebooks.yale.edu/ ; préstamo controlado en archive.org"
    derechos: "En copyright. No descargar."
    tamano: "no medido"
    prioridad: alta

  - obra: "Keegan, W. F. y Hofman, C. L. (2017), The Caribbean before Columbus"
    por_que: >-
      La síntesis moderna que sustituye a Rouse 1992 y que trata expresamente
      las conexiones continente↔islas y el «vacío del medio» que
      `horizonte-de-contacto` señala. También cerraría Keegan 1989, que el
      corpus cita sin haberlo leído entero.
    url: "Oxford University Press, 2017 — https://global.oup.com/academic/product/the-caribbean-before-columbus-9780190605247"
    derechos: "En copyright. No descargar."
    tamano: "no medido"
    prioridad: alta

  - obra: "Boomert, Arie (2000), Trinidad, Tobago and the Lower Orinoco Interaction Sphere"
    por_que: >-
      El eslabón entre el Orinoco y el arco antillano — la puerta por la que
      Oliver hace entrar al taíno a las Antillas. Es lo que documentaría que la
      ruta del taíno y la del caquetío NO se cruzan.
      Ya lo pedía `horizonte-de-contacto` §«Qué conseguir» (#5) y sigue ausente.
    url: "Cairi Publications, Alkmaar, 2000 — copias en repositorios institucionales; ficha en https://www.worldcat.org/"
    derechos: "En copyright. No descargar."
    tamano: "no medido"
    prioridad: media

  - obra: "Fernandes, D. M. et al. (2020/2021), A genetic history of the pre-contact Caribbean, Nature 590"
    por_que: >-
      Ya está en la bibliografía (`fernandes-2020`) y el archivo está en 0
      bytes. Es la única genómica con muestras de VARIAS poblaciones caribeñas
      precontacto; es lo que permitiría preguntar por afinidad insular ↔
      continental con más de un individuo.
    url: "Nature 590 (2021) — versión de acceso público en PubMed Central: https://pmc.ncbi.nlm.nih.gov/ (buscar «A genetic history of the pre-contact Caribbean»)"
    derechos: "Acceso abierto en PMC (depósito de los NIH). Descargable."
    tamano: "no medido — no se descargó"
    prioridad: alta

  - obra: "Antczak, A. y Antczak, M. M. (2006), Los ídolos de las Islas Prometidas"
    por_que: >-
      Arqueología de Los Roques y Las Aves de primera mano — el borde oriental
      del mar caquetío, y la fuente de segunda mano de la que el corpus toma la
      disputa por esas islas. `horizonte-de-contacto` ya lo pedía.
    url: "Editorial Equinoccio, Universidad Simón Bolívar, 2006 — ficha en https://www.worldcat.org/"
    derechos: "En copyright. No descargar."
    tamano: "no medido"
    prioridad: media

  - obra: "Ramos Pérez, Demetrio (1978), sobre Juan de Ampíes y el poblamiento de Coro"
    por_que: >-
      La fuente de archivo de la que Oliver saca las probanzas de 1526 y las
      cartas de Ampíes. Es lo que resolvería la discrepancia 1513/1515 y
      Salazar/Baso Zabala de col-02, y lo que daría el texto completo de lo que
      Ampíes dijo de los caquetíos con los que conversaba en Santo Domingo.
      Ya está en la bibliografía (`ramos-perez-1978`) sólo como reseña.
    url: "reseña en Persée ya en el repo (fuentes_caquetios/Ramos_Perez_1978_resenia_Persee.pdf); la monografía, no"
    derechos: "no verificado"
    tamano: "no medido"
    prioridad: alta

  - obra: "CoDoIn — Colección de Documentos Inéditos de Indias, tomos de 1864 y 1868"
    por_que: >-
      Las cartas de Ampíes al Rey (1525, 1526) que Oliver cita por página
      (CoDoIn 1864: 431-436; 1868: 27-32, 30-31). Son documento primario y
      están fuera de copyright por antigüedad.
    url: "digitalizados en Internet Archive y en la Biblioteca Virtual Miguel de Cervantes — https://archive.org/search?query=Coleccion+de+documentos+ineditos+de+Indias"
    derechos: "Dominio público (s. XIX)."
    tamano: "no medido"
    prioridad: media

  - obra: "Hartog, J. (1961 / 1968), historias de Aruba y de Curazao"
    por_que: >-
      La cronología de las deportaciones y los retornos que
      `martinez-cruzado-2003` y `van-buurt-2014` usan de segunda mano, y el
      «Puerto de los Indios Curaçao» al este de Cumarebo. Ya lo pedía la nota
      de Martínez-Cruzado.
    url: "De Wit, Oranjestad/Aruba — ficha en https://www.worldcat.org/"
    derechos: "En copyright. No descargar."
    tamano: "no medido"
    prioridad: media

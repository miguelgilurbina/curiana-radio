condicion_5_el_compuesto_nunca_dicho:
  # §7(a) pedía que el compuesto del ejemplo no se hubiera dicho nunca.
  # El script del issue lo midió sobre `word_uses`, que sólo tiene lo
  # que el SCORER reconoce: una forma que nadie adopta no llega ahí
  # (trampa «una forma recién acuñada no es una palabra_activa»). Sobre
  # el TEXTO de las respuestas el número es otro. Los dos, aquí.
  candidatas:
    - compuesto: biro-bana
      respuestas_en_texto: 198
      agentes_distintos: 45
      word_uses: 0
      neologisms: 0
      serie_c_limpia_respuestas: 7
    - compuesto: kali-bana
      respuestas_en_texto: 617
      agentes_distintos: 89
      word_uses: 235
      neologisms: 5
      serie_c_limpia_respuestas: 20
    - compuesto: kari-bana
      respuestas_en_texto: 31
      agentes_distintos: 23
      word_uses: 0
      neologisms: 0
      serie_c_limpia_respuestas: 3
    - compuesto: maure-bana
      respuestas_en_texto: 29
      agentes_distintos: 11
      word_uses: 0
      neologisms: 0
      serie_c_limpia_respuestas: 0
  lectura: >-
    Sobre `word_uses` las tres candidatas dan 0 y la condición se daba
    por cumplida. Sobre el texto, las tres se han dicho y `biro-bana`
    es la más dicha de las tres. Lo que sigue en pie —y es lo que la
    condición quería evitar— es que el ejemplo bendiga a una forma que
    ya COMPITE: `biro-bana` tiene 0 en `word_uses`, 0 en `neologisms` y
    no es variante de ningún referente abierto. Queda escrito para que
    la próxima medición no vuelva a decir «nunca» midiendo otra cosa.
  lo_que_deja_a_miguel: >-
    Si la condición que quería era la del TEXTO, la candidata que la
    cumple en la serie C limpia es `maure-bana` (0 respuestas allí, 29
    en toda la base). No se ha cambiado nada: la decisión dice
    `biro-bana` y eso es lo aplicado.
que_pasa_con_kali_bana_al_salir_de_la_puerta:
  lectura: >-
    Al salir de la puerta, `kali-bana` vuelve a poder registrarse como
    acuñación. Lo que la base acota: todos sus usos son de runs que
    tenían el ejemplo delante, así que no hay contrafactual. Pero el
    MOLDE `kali-…-bana` —que el corte de #169 nunca tocó— sí se dijo
    sin que ninguna plantilla lo enseñara, y `kali` sigue siendo clave
    del lexicón y voz del muestreador: la forma es componible y puede
    volver. Si debe quedar vetada por haber sido ejemplo histórico, es
    una decisión de Miguel y NO está implementada.

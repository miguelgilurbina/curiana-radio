numerales:
  gudamuen_fonemica: gudamuen
  similitud_difflib:
    achagua juchama- (raíz de 'dos' sin clasificador; arte/vocab. pliego 56-57): 0.429
    achagua Juchamata ('dos' general, pliego 56 der.): 0.375
    achagua Juchamana ('dos' hombres, pliego 56 der.): 0.5
    lokono bian (Pet 1987, lexicón): 0.333
    lokono biama (Brinton 1871, lexicón): 0.308
    wayuu piama (el que enseñaba el canon; D11): 0.308
  modelo_nulo:
    que_mide: similitud de gudamuen contra cada forma achagua distinta (tokens de >= 4 fonemas, fonemizados con
      la clave del copista), para saber si el parecido con juchama- es raro
    formas_achagua: 3429
    mediana: 0.286
    percentil_95: 0.471
    maximo: 0.706
    formas_achagua_tan_o_mas_parecidas_que_juchama: 424
    proporcion: 0.1237
  silaba_am:
    que_mide: 'porcentaje de formas (>= 4 fonemas) que contienen «am»: el elemento que ''dos'' comparte en achagua
      (juchAMa), lokono (biAMa), wayuu (piAMa) y caquetío (gudAMuen)'
    caquetio_atestiguado_pct: 6.0
    achagua_pct: 9.6

# ─────────────────────────────────────────────────────────────────────────
# MIGRACIÓN — la creencia kalinago (minería 1) al esquema único de hermanas
# (3-mundo/hermanas/README.md §3). Propuesta: nada fusionado, nada descargado.
#
# Origen: 6-fusion/creencia_kalinago_2026-10-09.yaml (21 hechos ck09-NN).
# Traslado campo a campo desde el origen, sin releer fuentes. Los huecos y las
# decisiones de migración están en meta.huecos_de_migracion. Lo que no es hecho
# (tamiz, auditoría Vía A, hallazgo lateral, negativas, pendiente, meta origen)
# va al final, sin cambios.
# ─────────────────────────────────────────────────────────────────────────


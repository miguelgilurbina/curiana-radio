- id: kalinago-creencia-002
  id_origen: ck09-02
  pregunta: P1
  esfera: creencia
  tema: iniciacion-especialista
  tema_duda: espiritu-tutelar
  contenido: El ichéiri es el espíritu PROPIO DEL BOYÉ y se transmite en su iniciación. Quien quiere ser
    boyé ayuna, y el boyé que lo forma «fait descendre son Dieu pretendu qui luy en donne vn»; si el espíritu
    es hombre es un dios, si es mujer una diosa. «On ne dit pas ce Dieu est le Dieu des Sauvages, mais
    le Dieu d’vn tel boyé». No tienen nombre para la oración. Un boyé, hablando de otro que hizo boyé,
    dice «Nichiguiénli iouloúcayem lóne, ie luy ay donné vn Dieu».
  cita: «Les Boyés font les autres boyés» (1665 p. 283)
  grafia: Ichéiricou, Ichéiri; iouloúcayem
  registro: h.
  sigla_goeje: išeiri hK?; iuluka hK
  pueblo: kalinago
  epoca: 1635-1654
  etiqueta: atestiguado
  testigo: oyo
  procedencia:
    obra: breton-1665
    pagina: 1665 pp. 283, 286 (imagen)
  capa_colonial: '«Dieu pretendu», «ou pour mieux dire vn diable qui se fait paroistre» (p. 283): la categoría
    Dios/diablo es de Breton.'
  sustrato: arahuaco
  sustrato_nota: El contenido —el especialista tiene su espíritu, que habla con él y que se gana con ayuno—
    está en el taíno (el behique habla con sus cemíes tras la cohoba, Pané cap. XV; el ayuno de cinco
    o seis días para ver a los cemíes, cap. XXV). El nombre es de hombres y caribe.
  divergencia: 'Rouse p. 562 (de Rochefort y Du Tertre) dice que CADA caribe tenía su ichieri, y llama
    maboya al espíritu del boyé. Breton lo contradice dos veces: el ichéiri es «le Dieu d’vn tel boyé»
    y «il est inoüy parmy eux qu’on aye offert des Sacrifices à mapoya» (p. 283). Breton es el testigo;
    Rouse, tercera mano.'
  hermanas:
  - pueblo: taino
    obra: pane-c1498
    pagina: caps. XV, XIX, XXV
    que: el behique y el cacique hablan con sus cemíes tras la cohoba y el ayuno
  caquetio:

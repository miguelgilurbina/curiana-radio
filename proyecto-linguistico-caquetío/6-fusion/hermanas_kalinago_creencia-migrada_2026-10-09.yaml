- id: kalinago-creencia-003
  id_origen: ck09-03
  pregunta: P1
  esfera: creencia
  tema: espiritu-tutelar
  contenido: 'Qué hacen esos espíritus. No hay fiesta de bebida sin ofrenda para ellos, porque creen haber
    recibido la salud por su medio, o que hacen crecer la yuca y se les deben las primicias, o por miedo.
    Los espíritus tienen hijos y nietos que traen a beber las ofrendas; «l’vn se dit auoir esté autrefois
    Arroüagues, l’autre d’vne autre nation»; los hay jóvenes y viejos, hombres y mujeres; hacen los huracanes,
    dan males como la gota que los demás no pueden curar y mandan a los boyés tomar tales hierbas para
    tales males. Se les teme más de lo que se los ama. Ciertos pájaros que se posan en las casas «appartiennent
    aux Dieux des boyez»: si los matan, esos dioses los harían morir.'
  grafia: Kichéiritina «i’ay vn Dieu»; Ichéiri
  registro: h.
  sigla_goeje: išeiri hK?
  pueblo: kalinago
  epoca: 1635-1654
  etiqueta: atestiguado
  testigo: oyo
  procedencia:
    obra: breton-1665
    pagina: 1665 pp. 283-284, 271, 341 (imagen)
  capa_colonial: «Dieux des Boyez», «vrays diables» y «Sacrifices» son categorías de Breton.
  sustrato: arahuaco
  sustrato_nota: 'Contenido con hermana taína primaria: cemíes «donde tienen los huesos de su padre, de
    su madre … hay algunos que hablan; otros que hacen nacer las cosas de comer; otros que hacen llover,
    y otros que hacen correr los vientos» (Pané cap. XV); el cemí que manda enfermedad si no se le lleva
    yuca (cap. XX); Guabancex, cemí mujer que hace correr el viento y el agua (cap. XXIII). Que los espíritus
    kalinago digan haber sido arahuacos es, como mucho, una pista de que el mundo de los espíritus guarda
    el sustrato; no se usa como prueba.'
  hermanas:

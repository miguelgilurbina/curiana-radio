  esfera: creencia
  tema: enfermedad-cura
  tema_duda: espiritu-tutelar
  contenido: 'El mapoya en lo que los kalinago cuentan, quitando la catequesis: es «esprit malin» (plural
    mápoyanum); se le teme, junto a los oumécou; a él no se le ofrece nada («il est inoüy parmy eux qu’on
    aye offert des Sacrifices à mapoya»); se come la luna en el eclipse —«disent que le mapoya l’a mangé,
    dansent pendant cette nuit là, & n’osent en desister quand ils ont vne fois commencé»—; manda enfermedades;
    y las pesadillas son «comme s’ils estoient aux prises auec máboya». Sin forma de mujeres en el tomo
    de 1666.'
  grafia: Mápoya, mápoyanum (1665 p. 424); máboya (p. 341); «Diable, mápoya» (1666 p. 118)
  registro: sin marca; 1666 no da f.
  sigla_goeje: '«fam?»: diable mapoya, garífuna mafuiya, mafuia, mafia «(sans-âme ?)» (p. 38)'

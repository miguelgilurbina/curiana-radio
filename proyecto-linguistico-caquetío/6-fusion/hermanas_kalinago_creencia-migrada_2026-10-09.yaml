    no es un año.'
  - 'testigo: «compilado» (ck09-17, 18, 20) → tercera-mano, y por eso etiqueta hipotetico (regla de la
    hermana).'
  - 'testigo: «visto y oído» (05, 06), «visto…» (14, 15, 16) → vio; se pierde el «oído» de 05 y 06. «oído»

    Con true la hermana declararía un segundo testigo que el origen niega. Cambiar a true sólo si Miguel
    decide otra lectura.'
  - 'procedencia_extra: las citas de Rouse/Steward dentro de pagina (p. ej. ck09-08 «Rouse en steward-1948-hsai-4
    p. 563») se quedan en procedencia.pagina; el esquema sólo pide extra para Goeje.'
  - 'via_a: ck09-03, id creencia-012, traía «corrobora-reformulado» (fuera del vocabulario). Se mapea
    a corrobora-en-parte (la versión amplia tiene dos hermanas; el mecanismo es caribe) y el texto queda
    en via_a_nota.'
  - 'caquetio: ck09-12 trae «barsure» (léxico, no es id de creencia): no entra en caquetio, queda en caquetio_relacion.
    ck09-05: Oviedo t. II p. 298 (fuera del corpus) junto a creencia-024 y -025: sólo los ids entran en
    caquetio; el texto, en caquetio_relacion. ck09-08: el origen dice «ninguno del corpus»: caquetio ausente.'
  - 'donde: sólo donde el epoca del origen lo dice (01 Guadalupe y Dominica; 05, 14, 16 Dominica). El
    resto queda sin donde.'
  - 'hermanas: sólo donde el origen tiene el campo `hermana` (02, 03, 04, 05, 08). ck09-09, ck09-17 y
    otros citan a Pané en sustrato_nota sin campo `hermana`: no se inventa la entrada.'
  - 'tema: ningún tema propuesto. El mapoya (10, 11) y el espíritu de 21 quedan en un tema cerrado con
    tema_duda: creencia no tiene un tema de espíritus malos. Si Miguel quiere uno, va en meta.temas_propuestos.'
  - 'tema_duda: escrito en 02, 06, 08, 10, 11, 15, 16, 17, 18, 19, 21 donde el hecho cabe en dos temas.'
  - 'como_se_escribio e implicacion_simulacion no existen en el origen: no se crean.'
  - 'campos extra conservados (no están en el esquema): pregunta, registro, sigla_goeje, divergencia,
    sustrato_nota.'
  - 'dominios: asignados por el traslado (libres).'
  - 'verificado_en_imagen: «si» si la página lleva «(imagen)», que es el criterio pedido.'
  - 'L1 (hallazgo_lateral_caqueti) no es un hecho kalinago: se copia sin cambios, no se migra; el origen
    propone creencia.yaml (decide Miguel).'
  - meta.plan es la nota 09 (la de este traslado); la nota 08 del origen queda en meta_origen.plan.
hechos:
- id: kalinago-creencia-001
  id_origen: ck09-01
  pregunta: P1
  esfera: creencia
  tema: espiritu-tutelar
  contenido: 'El espíritu tutelar tiene nombre de hombres y nombre de mujeres. En el tomo francés-caribe:
    «Dieu, Icheíri Iouloúca, f. Chemiin», «il a vn Dieu, kicheíriti, kayouloúcati, f. Kechemérati». En
    el caribe-francés, «chemijn, ou çemíjn, nechémeracou, Dieu, mon Dieu», plural «cheméignum», sin marca
    de registro, y Breton avisa de que la mayoría pronuncia esa ç como ch y «les autres çemijn, çemeignum».'
  grafia: h. Icheíri, Iouloúca; f. Chemiin, Kechemérati; sin marca chemijn / çemíjn, chemeignum
  registro: h. y f. (1666); sin marca (1665)
  sigla_goeje: f. šeme «f 2 am 10», A seme-he; h. išeiri «hK?» (K ise «vouloir, désirer, aimer»); h. iuluka
    «hK» (A (h)ialoko, K yoroka)
  pueblo: kalinago
  donde: Guadalupe y Dominica
  epoca: 1635-1654
  etiqueta: atestiguado
  testigo: lexico
  procedencia:
    obra: breton-1665
    pagina: 1666 p. 118 (imagen); 1665 pp. 96, 135 (imagen); goeje-1939 p. 38 (imagen)
  procedencia_extra:
  - obra: goeje-1939
    pagina: p. 38 (imagen)
    independiente: false
    nota: el tamiz de siglas, no un segundo testigo del hecho
  capa_colonial: 'Las dos palabras traducen «Dieu» y Breton catequiza con ellas: «La crainte de Dieu est
    le commencement de la sagesse» con Ichéiri (1665 p. 41, imagen), «la Divinité de IESUS-CHRIST, Lichéirigoni-Christê»
    (1666 p. 103, imagen), «Dieu s’est incarné, ebechouaàli chemiin ouekélli» (1666 p. 211, imagen). Que
    sean «Dios» es glosa del misionero.'
  sustrato: arahuaco
  sustrato_nota: 'La forma de MUJERES (chemiin/çemijn) es la arahuaca: Goeje la filia al lokono seme-he
    y es la del cemí taíno. Las dos de HOMBRES las filia al kalina (ichéiri con duda). El par mide la
    palabra: no dice que las mujeres creyeran otra cosa.'
  proyeccion:
    capa: no-proyecta
    nota: 'El nombre no se caquetiza. Va a lengua-cognados como CANDIDATO chemiin ~ cemí ~ seme-he (forma
      y glosa casan: espíritu tutelar), con el aviso de que la glosa «Dieu» es colonial. El contenido
      va en ck09-02/03.'
  verificado_en_imagen: si

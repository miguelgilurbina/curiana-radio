- id: kalinago-creencia-005
  id_origen: ck09-05
  pregunta: P5
  esfera: creencia
  tema: especialista
  contenido: 'La sesión del boyé, contada por Breton en primera persona. Se le llama para la guerra o
    para un enfermo; la ofrenda va al fondo de la casa redonda, con una hamaca colgada; los asistentes
    a lo largo de la casa. El boyé (a veces con un segundo) entona una canción, uno de los dos echa humo
    de tabaco hacia arriba «au lieu d’encens» y así baja el espíritu, que cae «comme vn sac de farine»;
    el boyé le ofrece la hamaca para sentarse y la ofrenda para comer y beber. El espíritu no quiere luz:
    se apaga el fuego, se tapan las entradas de luz, y se hace siempre de noche. Breton quiso entrar con
    un tizón «& les femmes m’arresterent». Una vez se acercó con la estola y el Santísimo y oyó caer a
    la «deesse pretendue (c’estoit vne femme qui estoit boyée …)», llorar y gritar un cuarto de hora.
    Tiene nombre la canción («Lerèmericani, chanson pour les faire descendre») y el ayudante («Lerèmeri
    aconum, le sous-chantre du Boyé»).'
  grafia: Leremericayem bóye loúbara aráli racaútiũ «le boyé chante pour faire descendre ses Dieux»; Lerèmericani;
    Lerèmeri aconum
  registro: comun
  sigla_goeje: chant de l’h. m. eremi «K»; hochet h malaga «hKTuA» (K, A maraka; tupí maraka)
  pueblo: kalinago
  donde: Dominica
  epoca: 1635-1654
  etiqueta: atestiguado
  testigo: vio
  procedencia:
    obra: breton-1665
    pagina: 1665 pp. 216-218 (imagen); 1666 p. 68 (imagen)
  capa_colonial: 'Breton lo cierra con «bien certifié que c’estoit vn vray diable, la boyée vne magicienne,
    sa chanson, son pacte, que ie n’ay iamais voulu ny entendre, ny écrire» (p. 218): el misionero NO
    transcribió las canciones a propósito. El hueco del canto ritual kalinago es una censura, no un cero
    de la fuente.'
  sustrato: arahuaco
  sustrato_nota: 'El contenido (noche, casa cerrada, canto, humo o polvo de tabaco, el espíritu que baja
    y habla, y la comida que se le da) está en el taíno: cohoba, canto y casa cerrada a la que sólo entran
    los principales (Pané caps. XV, XVI, XIX). Las voces de la canción y la sonaja son caribes o compartidas
    (eremi K; maraka hKTuA): el nombre no decide.'
  hermanas:
  - pueblo: taino
    obra: pane-c1498
    pagina: caps. XV, XIX
    que: sesión de cohoba con canto en casa cerrada; el cemí habla al behique o al señor

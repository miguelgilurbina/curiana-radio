tamiz:
  P1:
    veredicto: reconstruido-candidato (estructura) + lectura
    hechos:
    - ck09-01
    - ck09-02
    - ck09-03
    - ck09-04
    dice: El espíritu es del especialista, se gana ayunando, come lo que se le pone, manda viento, temporal,
      crecimiento y enfermedad. Dos hermanas (Breton + Pané). Lee creencia-025 y 013. El nombre no se
      caquetiza.
  P2:
    veredicto: hipotetico
    hechos:
    - ck09-12
    - ck09-13
    dice: 'Degradado: el taíno separa alma del vivo y del muerto; el kalinago de Breton sólo separa alma
      y espíritu. opoyem ~ opía, candidato a cognados con aviso.'
  P3:
    veredicto: hipotetico
    hechos:
    - ck09-12
    dice: Breton sólo da el pulso como «alma de la mano». Las varias almas son de Rouse (Rochefort/Du
      Tertre). Los destinos monte y orilla corroboran creencia-008b sólo por esa tercera mano.
  P4:
    veredicto: hipotetico, con capa colonial fuerte
    hechos:
    - ck09-09
    - ck09-10
    - ck09-11
    dice: 'mapoya no es «el diablo»: es el espíritu del eclipse, la pesadilla y el mal enviado, al que
      no se ofrece. Goeje: fam? (ma-poya «sin-alma»), lectura no prueba. No equivale al buio.'
  P5:
    veredicto: lectura (contenido) + comparanda-esfera (nombre) + hipotetico (mujeres)
    hechos:
    - ck09-05
    - ck09-06
    - ck09-07
    - ck09-08
    dice: 'Sesión nocturna con tabaco y canto, cura por succión: el caquetío ya lo tiene atestiguado en
      Oviedo t. II pp. 298-299. Boyé es KTu. Hubo boyés mujeres: una sola hermana.'
  P6:
    veredicto: lectura
    hechos:
    - ck09-17
    dice: El porqué de guardar al muerto (sede de un espíritu que habla) sale del taíno primario; lo kalinago,
      sólo por Rouse.
  P7:
    veredicto: sin-decidir / comparanda
    hechos:
    - ck09-16
    - ck09-18
    dice: Breton da exocanibalismo de enemigos (caribe) y bebida sobre la fosa, no beber al muerto. Las
      cenizas en bebida de Rouse p. 559 no tienen fuente.
  P8:
    veredicto: lectura
    hechos:
    - ck09-14
    - ck09-15
    - ck09-19
    dice: 'Breton vio un funeral de dos tiempos (al año, con bebida, casa dejada): corrobora 010/010b/010c
      y la estructura de 010d. No da «no nombrar al muerto» (p. 221 es tecnonimia de vivos).'
  P9:
    veredicto: negativa medida
    hechos:
    - ck09-20
    dice: 'Louquo: 0 en Breton; es de La Borde. Pendiente.'
  P10:
    veredicto: comparanda
    hechos:
    - ck09-10
    dice: El mapoya se come la luna y se baila toda la noche (1665 pp. 21, 370). El caquetío no tiene
      dato de eclipse.
auditoria_via_a:
  creencia-002:
    veredicto: corrobora-en-parte
    dice: 'El espíritu auxiliar que revela causa y remedio tiene dos hermanas: los espíritus «ordonnent
      aux Boyez de prendre de telles herbes pour tels maux» (Breton 1665 p. 284) y los cemíes dicen al
      behique «de dónde provino la enfermedad» tras la cohoba (Pané cap. XV). El SUEÑO como lugar de la
      cura: no toca; las dos lo hacen en sesión nocturna o con cohoba, no soñando.'
  creencia-003:
    veredicto: corrobora
    dice: 'Tabaco, canto, casa cerrada y a oscuras, de noche: Breton 1665 pp. 216-217 (visto) y Pané caps.
      XV, XVI y XIX. Y más: Oviedo t. II p. 298 ya lo ATESTIGUA del boratio («se ençierran en un buhío
      solo: y allí se echan unas ahumadas que llaman tabacos») y dice que se le paga con «alguna joya
      de oro». El espíritu-serpiente: sólo taíno (los cemíes «en forma de culebras», Pané cap. XVIII);
      en Breton el espíritu cae «comme vn sac de farine».'
  creencia-005:
    veredicto: no-toca
    dice: 'Ni Breton ni Rouse dicen que el alma salga al soñar. Las pesadillas son ataque de fuera: «comme
      s’ils estoient aux prises auec máboya» (Breton 1665 p. 341, con su lectura humoral), «nightmares»
      de los maboya (Rouse p. 562).'
  creencia-006:
    veredicto: contradice
    dice: 'Las dos hermanas antillanas dan el mal ENVIADO o INTRODUCIDO y la cura por SUCCIÓN y extracción
      (Breton 1665 pp. 167, 271, 342; Pané caps. XVI y XX), no el alma que se aleja. Y el caquetío lo
      atestigua igual: Oviedo t. II p. 299, el boratio chupa y saca «la espina ó piedra ó palo». La única
      palabra «alma» de ese pasaje —«diçe que le allega el alma á un cabo, y despues çierra el puño y
      sóplale … Allá yras mal»— es ambigua y se parece más al soplo que despide el mal de Pané cap. XVI
      que a traer de vuelta un alma perdida.'
  creencia-007:
    veredicto: corrobora-en-parte
    dice: 'La división entre males que curan las hierbas y males de los espíritus: los espíritus dan males
      «que les autres ne peuvent guarir» (Breton 1665 p. 284) y las mujeres curan con hierbas (Rouse p.
      563, tercera mano). La semejanza como CURA: no toca; en Breton la semejanza es causa de daño (el
      tabú del manatí, p. 275).'
  creencia-008:
    veredicto: corrobora
    dice: 'La ambivalencia: los espíritus que fueron gente curan, dan de comer y mandan enfermedad y huracán;
      se les teme más de lo que se los ama (Breton 1665 pp. 271, 283-284). Taíno: las opías nocturnas
      temidas (Pané cap. XIII) y los cemíes de huesos de antepasados que ayudan (cap. XV). Que roben el
      alma de los niños: no toca.'
  creencia-009:
    veredicto: no-toca
    dice: 'Breton no da tierra de los muertos con nombre. «Sin premio ni castigo»: Breton habla de «peines
      … coulpes» (p. 237), lectura de confesor; Rouse p. 561 n. 10 pone un paraíso sólo para guerreros
      (tercera mano). Ninguno sirve para medir. La tierra con nombre la da el taíno (Coaibai, Pané cap.
      XII): es del minero taíno.'
  creencia-010d:
    veredicto: corrobora
    dice: 'La ESTRUCTURA de dos tiempos con bebida, con fuente vista: «au bout de l’an ils retournent
      pleurer, leuent les planches … boiuent le reste du iour & de la nuict, & quelquefois quittent les
      maisons» (Breton 1665 pp. 237-238). El porqué (el alma individual que se funde con los mayores):
      no toca. El taíno de Pané da otro porqué posible: el hueso guardado es sede de un espíritu que habla
      (cap. XV).'
  creencia-011:
    veredicto: no-toca
    dice: Nadie en Breton manipula huesos con tabúes. Las mujeres aparecen como guardianas de la sesión
      y como boyé (p. 217), no como exhumadoras.
  creencia-012:
    veredicto: corrobora-reformulado
    dice: 'Lo que sí tiene dos hermanas es la versión amplia: los espíritus de gente que fue hacen el
      huracán y crecer la yuca (Breton 1665 pp. 56, 284) y los cemíes con huesos de antepasados hacen
      llover, soplar el viento y nacer la comida (Pané caps. XI, XV, XXIII). El mecanismo cenizas o huesos
      → nubes de la referencia (Civrieux, cumanagotos) es CARIBE de tierra firme: por el tamiz, a comparanda
      de esfera.'
hallazgo_lateral_caqueti:
- id: ck09-L1
  contenido: 'La cura del boratio, entera. Llamado por un enfermo que no se levanta de la hamaca, pregunta
    qué le duele, si quiere sanar y si sabe que él lo puede sanar; si dice que no, se va. Si dice que
    sí, manda ayunar a toda la casa (lo que ya está en creencia-023). Luego, con las manos cerrándolas
    y abriéndolas por encima, «como quien quiere juntar otra cosa, diçe que le allega el alma á un cabo,
    y despues çierra el puño y sóplale con la boca diçiendo: Allá yras mal», con tantas voces y aullidos
    que queda ronco; si el dolor sigue, «chúpale con la boca aquel miembro ó lugar del dolor, escupiendo
    de rato en rato», y a los cinco o seis días se mete en la boca una espina, piedra o palo, chupa y
    lo muestra: «Cata aqui lo que te mataba y causó el mal que tenias». Le pagan.'
  fuente: atestiguado
  procedencia:
    obra: oviedo-y-valdes-1852-1855
    pagina: t. II, impresa 299 (imagen)
  capa_colonial: 'Oviedo lo cuenta como fraude («y con todas ellas los fraudes, que el Plinio diçe») y
    lo encaja en Plinio: el qué es dato, el juicio es suyo.'
  limite: 'Época: contacto (Oviedo escribe 1535-1548). Polity: «los indios de Veneçuela», la gobernación
    (regla 4): no es exclusivo de la costa.'
  lectura: '«le allega el alma á un cabo» es ambiguo: el alma de quién, y para qué. Con el soplo y el
    «Allá yras mal» que siguen, se lee como juntar y despedir el mal (Pané cap. XVI: «Vete luego a la
    montaña, o al mar … y da un soplo como si despidiese una paja»), no como traer de vuelta un alma perdida.
    No se decide aquí.'
  hermanas: 'kalinago (Breton 1665 p. 167) y taíno (Pané cap. XVI): el mismo modelo en tres pueblos.'
  destino: 'creencia.yaml, como hecho atestiguado nuevo (lo decide Miguel). El elenco de la era 2 ya usa
    el encierro con tabaco de la p. 298 como atestiguado; la cura de la p. 299 no está en ninguna parte
    del repo (grep de hoy: «chúpa», «cata aqu», «allega el alma» = 0).'
negativas:
- 'Breton NO da forma de mujeres para el chamán: «Boyé … boyáïcou, mon Boyé iboyéiri», sin f. (1666 p.
  52, imagen).'
- 'Breton NO da forma de mujeres para el espíritu malo: «Diable, mápoya, les Diables, mápoyanum», sin
  f. (1666 p. 118, imagen). Goeje le pone igualmente sigla fam? (p. 38).'
- 'Varias almas: no en Breton. Sí «l’ame de la main» (el pulso, 1665 p. 41). Las almas del corazón y de
  las arterias son de Rouse p. 561.'
- 'Louquo: 0 en la capa de texto de 1665 y 1666 con cinco variantes; Goeje lo atribuye a La Borde (p.
  39, «1 bo»). Mide la capa, no la obra.'
- 'akamboue como «espíritus buenos» que suben con el alma (Rouse p. 561): en Breton acámbouée es sólo
  «esprit», de hombres (1665 p. 9; 1666 p. 158).'
- 'Huesos de antepasados guardados por el boyé: 0 en la capa de texto de Breton (os, ossemens, cheveux,
  calebasse junto a muerte o boyé).'
- 'Cenizas del jefe en bebida: 0 en la capa de texto de Breton («cendre» sólo en cocina y tabaco).'
- 'Canciones del boyé: Breton se negó a escribirlas (1665 p. 218). Es una ausencia deliberada.'
- 'Una tierra de los muertos con nombre: no en las páginas leídas de Breton.'
pendiente:
- 'K1/K2 (Rochefort 1658, Du Tertre 1667 t. II): verifican ck09-13 (opoyem = alma del muerto), ck09-17
  (huesos), ck09-18 (cenizas), ck09-19 (no nombrar al muerto), y la iniciación de cinco meses que Rouse
  p. 562 atribuye a Du Tertre t. II pp. 365-366.'
- 'La Borde 1674/1684 (fuera del repo): Louquo y la teogonía.'
- Cruzar ck09-03 y ck09-04 con el minero lokono (seme-he en Goeje p. 38) por si el lokono da una tercera
  hermana.
- 'K4 sigue abierta: sin ella, lo marcado reconstruido aquí es candidato, no capa.'
meta_origen:
  recogido: '2026-10-09'
  estado: sin-fusionar
  quien: minero kalinago de la campaña de creencia (Claude Opus 5.5), en worktree propio; rama vault/creencia-mineria-kalinago
  plan: 4-fuentes/sesiones/08_creencia_kalinago_que-minar.md
  decision_de_miguel: '2026-10-09, opción C: lo NUEVO entra con la regla estricta del lexicón (reconstruido
    sólo con dos tradiciones arahuacas independientes; con una sola, hipotetico; si sólo ilumina un hecho
    caquetío ya atestiguado, lectura). Lo wayuu de la Vía A se QUEDA como comparanda y se audita con lo
    que encuentre esta minería (sección auditoria_via_a).'
  reglas_propias_de_lo_kalinago:
  - 'El par hombres/mujeres mide PALABRAS, no creencias: en cada hecho se separa el sustrato arahuaco
    (comparable) de la capa caribe (va a comparanda de esfera, no al caquetío).'
  - 'Breton confiesa (1665 p. 424) que usó «mapoya» para explicar el Diablo, y catequiza con «Ichéiri»
    y «chemiin» (1665 p. 41; 1666 pp. 103, 211): la capa colonial está dentro de las glosas. Cada hecho
    que la tenga lo dice en `capa_colonial`.'
  capas_de_esta_propuesta:
    reconstruido: 'NUEVO para el caquetío y con DOS tradiciones arahuacas independientes citadas (aquí:
      kalinago de Breton + taíno de Pané). Es candidato: necesita K4.'
    hipotetico: NUEVO con UNA sola tradición (o con la segunda sólo vía un compilador de tercera mano).
    lectura: ilumina un hecho caquetío YA atestiguado; no crea hecho nuevo (opción C).
    comparanda-esfera: 'capa CARIBE: sirve a un personaje de la esfera (Marokoto-ni), nunca al caquetío.'
    no-proyecta: 'capa COLONIAL, o léxico que no se caquetiza (decisión 5 del ensayo: los nombres de la
      hermana se citan, no se caquetizan).'
  sustrato_valores:
    arahuaco: el CONTENIDO está en otra hermana arahuaca con fuente propia (o la forma es de mujeres con
      sigla am/A en Goeje y el contenido acompaña)
    caribe: nombre de hombres con sigla K/KTu en Goeje y contenido sin hermana arahuaca, o rasgo propio
      del caribe de tierra firme
    colonial: la glosa o el hecho es del misionero (catequesis, categorías cristianas)
    sin-decidir: 'el tamiz no alcanza: ni otra hermana ni el kalina medido. Se declara, no se fuerza'
  fuentes:
    primaria: 'breton-1665 (los tres libros: 1665 caraïbe-français, 1666 français-caraïbe). PDF en OneDrive
      (D8), leídos en imagen con pymupdf; desfases medidos en la ficha: 1665 impresa = pdf − 22; 1666
      impresa = pdf − 8.'
    tamiz: 'goeje-1939 pp. 37-39 (pdf − 1), en imagen con la columna de siglas. Copyright (Goeje †1955):
      sólo forma, glosa corta y sigla.'
    indice: 'steward-1948-hsai-4, Rouse «The Carib» pp. 545-565 (el desfase deriva: pdf 697 = p. 545,
      pdf 716 = p. 564, pdf 723 = p. 565) y resumen de Steward p. 26 (pdf 50). Tercera mano: un reconstruido
      nunca se apoya sólo en él.'
    hermana_taina: pane-c1498 (texto de Wikisource en el repo, capítulos), primaria de 1494-1498, cadena

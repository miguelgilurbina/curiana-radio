    des Boyez, sur les mapoya, ou sur les sorciers»; temen a los primeros más de lo que los aman, odian
    a los segundos y se vengan de los terceros. Y del menor mal dicen que es un maleficio o «vn mal donné
    de mapoya, ou des sorciers», «ce n’est pas à dire qu’ils les ayent battus, mais qu’ils leurs ont enuoyez,
    ou procurés ces maux».'

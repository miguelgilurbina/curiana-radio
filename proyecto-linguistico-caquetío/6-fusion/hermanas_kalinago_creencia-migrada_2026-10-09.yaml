  capa_colonial: 'FUERTE. Breton: «quand ie leurs ay voulu faire comprendre ce que c’est que le Diable,
    ie me suis serui de ce mot» (1665 p. 424); el catecismo usa mapoyanum para «diables» (p. 56); y el
    francés de las islas ya llamaba «maboya» a un lagarto (p. 8: «acacámoulou, lezard appellé maboya»).
    Breton además desmiente el tópico «que le Diable les bat» y lo atribuye a la melancolía y al bazo
    (p. 341): la pesadilla-mapoya llega filtrada por su medicina humoral.'
  sustrato: arahuaco
  sustrato_nota: 'POR EL NOMBRE y con duda: Goeje le pone sigla fam? y lo lee ma-poya «sin-alma», es decir,
    el privativo ma- con la raíz de opoyem «espíritu» (ck09-13). En Breton está el positivo de esa raíz:
    «Kapoyénti nyáim, il y a là vn esprit» (1665 p. 424). Es una LECTURA morfológica, no una prueba. El
    contenido (el eclipse que se come la luna, la pesadilla) no está en ninguna otra hermana medida.'

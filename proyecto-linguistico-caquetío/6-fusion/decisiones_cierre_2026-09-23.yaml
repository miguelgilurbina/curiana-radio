cc.11_angulo_molina_y_nueva_segovia:
  decision_literal: '«si podemos conseguir eh, dónde eh, escribirle a Zavala, por lo de Angulo Molina, sería bien interesante […] conseguir el trabajo de sobre Nueva Segovia para poder comprarlo, eh, igual no es prioritario»'
  eleccion: el escriba da la vía de contacto profesional y la referencia completa; no es prioritario

cc.12_d11_pronombres_y_aspectos:
  decision_literal: >-
    «los pronombres y aspectos siguen reconstruidos desde el Wayu. Esto, no
    podemos seguir teniendo reconstrucciones desde el Wayu, tendría que ser desde
    el Locono. O el Taíno […] o el Achagua también, que tienen una relación más eh,
    de parentesco, mucho más grande […] eso sí o sí lo tenemos que hacer»
  eleccion: D11 fase 3 es OBLIGATORIA — pronombres y aspectos se reconstruyen desde lokono, taíno o achagua, nunca desde el wayuu
  consecuencia_que_el_escriba_declara: >-
    Cambia el núcleo de lo que el prompt enseña (taya, pia, nüma, waya, naya;
    -ka, -ni, -da). Correr los 30 días de la base ANTES sería correrlos con el
    núcleo que esta decisión retira. Orden propuesto: se mergea #202 (medida y
    sana), pero la corrida base espera a una última tanda —D11 fase 3 + coro +
    poporo + la sigla E + las voces de Zayas—, medida una vez, y entonces se
    etiqueta el motor.


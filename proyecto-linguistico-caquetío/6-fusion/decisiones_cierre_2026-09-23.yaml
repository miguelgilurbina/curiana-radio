# Decisiones de Miguel para CERRAR LA INVESTIGACIÓN (2026-09-23)
#
# Respuesta, punto por punto, a la lista de pendientes que el escriba le dio al
# terminar la tanda de la base. La orden que lo ordena todo:
#
#   «prioricemos específicamente eh, poder ya cerrar todo el tema investigativo
#   para que nos enfoquemos solamente en la parte creativa de lo que es la
#   simulación»
#
# Las citas son del mensaje dictado, tal como llegó.

cc.1_referentes:
  decision_literal: '«me parece que la, el listado que hiciste está súper bien. Por lo menos para así probar y, y, y, y ver qué onda»'
  eleccion: el catálogo de 6-fusion/referentes_era2.yaml queda APROBADO para probar la base
  estado: registrado en referentes_era2.yaml y en decisiones_base §db.4

cc.2_los_merges:
  decision_literal: '«Mergemos 201 y 202 […] levantemos un nuevo agente Opus que revise los 20 PRs abiertos y eh, se encargue de todo ese merge»'
  eleccion: un agente Opus revisa y mergea #201-#220, en orden y sin romper nada; Miguel da los permisos
  cuidado: >-
    #209 (Pérez de Tolosa) y #217 (Rivero) vienen marcados «no mergear» por sus
    autores: el agente lee por qué antes de tocarlos y lo dice.

cc.3_poporo:
  decision_literal: '«lo de Poporo bueno, eh, también entonces hay que revisarla Y caso de que no sea caquetía, la, levantamos […] hay que leer la parte 4 de castellanos, eso lo podemos levantar con otro agente»'
  contexto: >-
    Error del escriba: afirmó que el poporo era el arma caquetía atestiguada (vía
    Alvarado) y la nota de la macana en main lo repite; el pasaje de Castellanos
    que lo sostiene habla de los guanebucanes de Boronata.
  eleccion: un agente lee las Elegías, Parte IV, y dice si hay poporo caquetío; si no lo hay, la nota se corrige

cc.4_la_sigla_E_de_zavala:
  decision_literal: '«la sigla es Zavala Esteves, eh, ok, miramos también el canon de eso»'
  eleccion: se re-mide el canon sabiendo que (E) = Esteves (43 de las 228 voces atestiguadas dependen sólo de esa fuente) — la opción 1-A

cc.5_manaure_guaiqueries_dabajuroide:
  decision_literal: >-
    «donde se sentaba Manaure donde ubicar los guaqueríes […] me encantaría poder
    tener la cronología de Ajuroide ubicar los guayqueríes eh, también hay que ver
    porque supuestamente los guayqueríes también estaban en la isla de Margarita
    entonces sería bien interesante ya que son parte de la esfera de contacto
    piensa que también le habíamos leído que Ferman identificó Eh, que había un
    poblado de guayquerías con caquetíos»
  eleccion: una campaña — el asiento de Manaure, los guaiqueríes (Margarita y el poblado que da Federmann) y la cronología dabajuroide
  lectura: los guaiqueríes entran como parte de la ESFERA de contacto (regla 4), no como caquetíos

cc.6_coro_no_es_viento:
  decision_literal: >-
    «lo de que coro es viento eh, era una apreciación de Oviedo era eh, de por el
    latín, así que efectivamente hay que sacarlo hay que sacar que esa definición
    significa viento»
  eleccion: >-
    «viento» sale de las lecturas de `coro`: es la etimología de un cronista por
    el latín (Corus/Caurus, el viento del noroeste), no una glosa caquetía
  a_verificar: >-
    el lexicón atribuye 'viento' a Castellanos 1589, no a Oviedo. La decisión no
    depende de quién fue; la NOTA sí, y se escribe con la atribución verificada.
    Archivar no es borrar: la lectura queda en `notas` como descartada y por qué.

cc.7_zayas:
  decision_literal: '«guardemos solamente el texto de Sayas. Eh, y bueno, eh, me parece también revisar ahí lo de […] las cosas que salen […] de Sayas. Este, y, efectivamente, decir si son taíno o no. Este, definirlo. En base a lo que decía el texto.»'
  eleccion: >-
    (1) sólo el texto: los dos PDF (381 y 441 MB, sin commitear) se mandaron a la
    Papelera el 2026-09-23; los .txt están en el repo. (2) se decide, leyendo el
    pasaje, si son taínas: manatí (Las Casas contra Oviedo), cohiba/tabako,
    bagua (glosario de la Academia, la trampa de datihao), anaki (eyerí),
    anua (no está en Zayas) y manaya (sin cronista).


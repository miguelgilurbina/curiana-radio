# ─────────────────────────────────────────────────────────────────────────
# ESTEVES 1989, PARTE II — «Otros topónimos indígenas del estado Falcón»
# pp. impresas 81-144 · tomos 4-6 del PDF · minada el 2026-09-10
#
# La mitad del libro que el proyecto NUNCA había tocado, porque los tomos 4-6
# eran los únicos sin OCR. Se descubrió persiguiendo la lista de topónimos que
# dictó Miguel: buscando uno de ellos en la web salió citada la obra entera,
# y la ficha `4-fuentes/esteves-1989.md` ya tenía la tabla que lo decía.
#
# ⚠️ REGLA 4: la Parte II NO es Paraguaná. Cubre sierra, oriente y occidente
# del estado — territorio de otras polities y de jirajaras, ayamanes, gayones
# y caribes. Nada de aquí entra al canon costero sin su marca geográfica, y
# por suerte Esteves da municipio y distrito en casi todas las entradas.
# ─────────────────────────────────────────────────────────────────────────
meta:
  obra: esteves-1989
  parte: 'II — Otros topónimos indígenas del estado Falcón'
  paginas_impresas: '81-144'
  tomos_pdf: [4, 5, 6]
  desfase: 'impresa = pdf + 72 en el tomo 4 (el número va al PIE de la página en el OCR)'
  minado: '2026-09-10'
  metodo: >-
    OCR con `ocr_fuente.py` y extracción por script: las entradas tienen
    formato fijo —NOMBRE en mayúsculas, tipo de lugar, «municipio X, Distrito
    Y», y la glosa entre paréntesis—. Script en 6-fusion/scripts/.
  advertencia_ocr: >-
    🔴 Es OCR, no transcripción. Las glosas de aquí sirven para llegar a la
    página; la cita se saca de la imagen. Hay entradas partidas y nombres mal
    leídos («Y abo» por Yabo, «Togogo» por Tococo, «Ácosta» por Acosta).

cobertura_medida:
  entradas_parseadas: 387
  con_municipio: 286
  con_distrito: 256
  con_glosa_entre_parentesis: 139
  de_la_lista_de_miguel_con_glosa: 16
  formas_que_ya_estan_en_el_lexicon: 18

# ══════════════════════════════════════════════════════════════════════
# 🔴 LA INDEPENDENCIA, MEDIDA ANTES DE CONTAR NADA
# ══════════════════════════════════════════════════════════════════════
independencia:
  el_problema: >-
    Dieciocho entradas de la Parte II coinciden en forma Y glosa con entradas
    del lexicón. Parece corroboración masiva. No lo es del todo.
  lo_que_se_midio: >-
    El lexicón cita a Esteves de segunda mano: en el glosario de Zavala Reyes
    la sigla **E es Juan Esteves**. Comprobado entrada por entrada: `dara` es
    «Zavala #102 (HB+E)», `bisure` «#41 (HB+E)», `yabo` «#278 (E+A+AM)`,
    `kakuro` «#54 (E+A)». Es decir, Esteves ya estaba dentro.
  consecuencia: >-
    Para esas entradas, esto es CONTROL DE TRANSMISIÓN —la glosa del lexicón es
    fiel a su fuente— y no una segunda atestación. Es la misma trampa del §8
    del protocolo con la que ya tropecé con Perea y Oliver hace dos días.
  lo_que_SÍ_es_nuevo:
    - >-
      ⭐ LA DISTRIBUCIÓN GEOGRÁFICA. El lexicón tenía estas voces como
      vocabulario; la Parte II las muestra como TOPÓNIMOS repartidos por todo
      el estado, con municipio y distrito. Que `dara`, `saruro`, `yabo` o
      `cacuro` den nombre a lugares en Petit, Acosta, Zamora y Buchivacoa es un
      dato de extensión que el lexicón no tenía.
    - >-
      Las entradas donde Zavala NO cita a Esteves. `isiro` viene con sigla (A),
      sólo Alvarado: ahí la Parte II sí es segunda fuente.
    - 'Dos conflictos de glosa y una variante gráfica — ver `conflictos`.'

# ══════════════════════════════════════════════════════════════════════
# LO QUE RESPONDE A LA LISTA DE MIGUEL
# ══════════════════════════════════════════════════════════════════════
de_la_lista_de_miguel:

  - forma: Cumarebo
    lugar: 'Distrito Zamora'
    glosa_esteves: '«Cumarebo significa: el camino del cacique Cumare: paso, senda y Cumare, el cacique»'
    por_que_importa: >-
      ⭐⭐ Es LA MISMA glosa que el blog de apellidoyajure daba para el sufijo
      `-ebo`. O sea que el blog copiaba a Esteves: la fuente divulgativa que
      encontré en el barrido web resulta ser esta página. Ahora la tenemos con
      autor y página en vez de con URL.
    lo_que_confirma: "`-ebo` = 'camino, paso, senda' — y con ello Jurijurebo 'camino del viento'"

  - forma: Camachima
    lugar: 'municipio Capadare, Distrito Acosta'
    glosa_esteves: >-
      «Hemos notado que la desinencia "ima", que significa HUMEDAD en caquetío,
      está presente en muchos topónimos»
    por_que_importa: >-
      ⭐ Confirma `-ima` 'humedad, quebrada', que el proyecto ya tiene en
      REGLAS_ZAVALA por Zavala #165. Con la cautela de independencia de arriba:
      Zavala cita a Esteves, así que probablemente es la misma voz. Lo NUEVO es
      la observación distribucional del propio Esteves: «está presente en
      muchos topónimos».

  - forma: Bariro
    lugar: 'municipio Bariro, Distrito Buchivacoa'
    glosa_esteves: '«La desinencia "iro" es diminutivo de voces indígenas»'
    por_que_importa: >-
      ⭐ Confirma `-iro` diminutivo, que también está en REGLAS_ZAVALA. Misma
      cautela de independencia.

  - forma: Tucacas
    lugar: 'municipio Tucacas, Distrito Silva'
    glosa_esteves: '«Tucacas: cangrejal»'
    nota: 'y queda zanjado que es de Falcón, como decía Miguel'

  - forma: Aguide
    lugar: 'municipio La Pastora, Distrito Acosta'
    glosa_esteves: '«Es voz taína, caribe insular»'
    aviso: >-
      ⚠️ «Taína, caribe insular» es la misma confusión que el proyecto ya midió
      en Amuay: el caribe insular de Breton es lengua ARAHUACA, no caribe, y el
      taíno es otra cosa. Se registra la atribución, no se acepta.

  - forma: Duvisí
    lugar: 'municipio Mapararí'
    glosa_esteves: '«Es un apellido de las tribus AYAMANES»'
    por_que_importa: 'filiación jirajaroide declarada por el autor — regla 4, no es caquetío'

  - forma: Tapatapa
    lugar: 'municipio Unión, Distrito Federación'
    glosa_esteves: '«Tapatapa es una voz AFRICANA que indica movimiento»'
    veredicto: 'DESCARTE con razón declarada por el autor'

  - forma: Curimagua
    lugar: 'municipio Curimagua, Distrito Petit'
    glosa_esteves: '«Puede que provenga de Curi, pequeño roedor, acure, picure»'
    nota: >-
      Contradice la glosa de folleto que dio el barrido web («hermoso valle de
      aguas frescas y limpias»). La de Esteves es analítica y la otra es
      descriptiva: se quedan las dos, marcadas por tipo.

  - forma: Cabure
    lugar: 'municipio Cabure, Distrito Petit'
    glosa_esteves: '«Si Cabure es alteración de Cambure (síncopa...)»'
    nota: 'el propio autor lo deja en condicional'

  - forma: Casigua
    lugar: 'Distrito Mauroa'
    glosa_esteves: >-
      «Cacigua, con "c" para diferenciarla de la voz geográfica, es una planta
      herbácea, enredadera, marantácea»

  - forma: Copey
    lugar: 'municipio Seque, Distrito Buchivacoa'
    glosa_esteves: '«Copey, palmera del género clusia»'

  - forma: Taguaqui
    lugar: 'municipio Píritu, Distrito Zamora'
    glosa_esteves: '«Taguaquí: acacia, árbol espinoso, juva, úbeda»'

  - forma: Guanabano
    lugar: 'Puerto...'
    glosa_esteves: '«Guanábano: árbol frutal»'

  - forma: Churuguara
    lugar: 'municipio Churuguara, Distrito Federación'
    glosa_esteves: >-
      «Sin explicar el significado, Alfredo JAHN registra la voz: Axodawara»
      («Aborígenes del Occidente de Venezuela»)
    por_que_importa: >-
      ⭐ Da la forma que Jahn recoge, `Axodawara`, para lo que hoy es
      Churuguara. El lexicón tiene `churuguara` como jirajaroide-contacto: esto
      añade la grafía del s. XIX y la referencia a Jahn, que el repo TIENE.
      Perseguible hasta fuente primaria.

  - forma: Guate
    lugar: 'municipio Guzmán, Distrito Miranda'
    glosa_esteves: '«Puente Huate»'

  - forma: Guacharaca
    lugar: 'varios: Mirimire/Acosta, Jacura/Acosta, Agualarga'
    glosa_esteves: 'entrada partida por el OCR; hay tres referentes'
    accion: 'releer en la imagen'


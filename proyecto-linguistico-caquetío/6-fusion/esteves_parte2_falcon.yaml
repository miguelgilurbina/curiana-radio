conflictos:
  - forma: casicure
    lexicon: "'levante, este'"
    esteves_parte_II: "«raíz de cacito; cacito: cacto de tallo aplanado»"
    lectura: >-
      ⚠️ Son glosas incompatibles: un punto cardinal y un cactus. Hay que mirar
      la página, porque una de las dos está mal atribuida. Issue.
  - forma: pauji
    lexicon: "'árbol espinoso de fruto pequeño (Bumelia buxifolia)'"
    esteves_parte_II: "«Paují: ave gallinácea de carne muy apreciada. Paují: árbol s...»"
    lectura: 'homonimia declarada por el propio Esteves: el ave y el árbol. El lexicón sólo tiene el árbol'
  - forma: tokoko
    lexicon: "'flamenco o ibis, ave roja de la laguna'"
    esteves_parte_II: "«Togogo: ave ansérida»"
    lectura: 'variante gráfica tococo ~ togogo; misma ave'


  caquetio: 5
  ayaman: 3
  taino: 2
  cumanagoto: 2
  chaima: 2
  caribe: 1
  gayon: 1
  lectura: >-
    Esteves atribuye filiación pocas veces y reparte entre seis lenguas. Es
    coherente con lo que el proyecto ya sabe del estado: Falcón no es
    monolingüe, y la Parte II cubre precisamente las zonas donde no es caquetío.


cruce_con_el_dictado_de_medina:
  correccion_de_metodo: >-
    🔴 El primer cruce dio 25 voces del dictado en la Parte II usando raíces de
    seis caracteres sin límite de palabra, y varias eran falsas: `guanariji`
    casaba con «Guanare», `urubana` con «Cucurubano», `tura` con «Natural» y
    «estructura», `guamaro` con «Guamare». Rehecho exigiendo palabra completa,
    son 19. Una raíz corta sin frontera no busca la palabra: busca las letras.
  voces_del_dictado_en_la_parte_II: 19

  suben_de_nivel:
    - voz: teco
      nivel_actual: C
      hallazgo: "CURIAJA: «planta bromeliácea, TECO, maya»"
      por_que: >-
        ⭐ Medina lo dicta como «planta xerófita de hojas lanceoladas, cortas y
        con espinas por sus bordes», y el barrido web no encontró NADA. Esteves
        lo da como sinónimo de curiaja y maya, bromeliácea: coincide con la
        descripción. Es justo lo que la advertencia del barrido decía — que un
        cero en la web mide la indexación, no la lengua.
    - voz: cuaguaro
      nivel_actual: B
      hallazgo: "BARAGUA: «árbol de madera de construcción, CUAGUARO»"
      por_que: >-
        ⭐ Medina: «árbol de madera dura que se utilizó para hacer las cercas de
        los conucos y el armazón de las viviendas». Esteves: madera de
        construcción. Misma glosa por dos vías, y de paso despeja BARAGUA.
    - voz: budare
      nivel_actual: B
      hallazgo: "«(Butare, ¿será budare?)»"
      por_que: "apoyo débil y en condicional, pero es el autor dudando, no una glosa inventada"

  no_aparecen: [memerea, matejea, marite, curubo, busuga, gatiao, guanariji, urubana, guamaro]
  aviso_sobre_los_ceros: >-
    ⚠️ Y sin embargo la Parte II SÍ trae «MEMERÍ: nido de avispas, colmena»,
    que es el `memerea` del dictado con otra terminación: el cruce por forma
    exacta la pierde. Cuando una voz del dictado no aparezca, hay que mirar
    también su vecindad fonética antes de dar el cero por bueno.

# ══════════════════════════════════════════════════════════════════════
# TERCERA PASADA — lo que salió buscando Mirimire
# ══════════════════════════════════════════════════════════════════════
mirimire:
  entrada_completa: >-
    «MIRIMIRE. I - Población capital del municipio San Francisco, Distrito
    Acosta. / II - Mirimirito, aldea del municipio San Francisco (Mirimire). /
    III - La Guacharaca de Mirimire, aldea de Mirimire». (p. impresa 123)
  veredicto: >-
    SIN GLOSA. Esteves lo registra con sus tres referentes y no le da
    etimología ni paréntesis — como hizo con Jayana en la Parte I. En la
    escala de la campaña es `descartado`: no porque el nombre no sea indígena,
    sino porque no hay ecuación bilingüe que despejar.
  lo_unico_que_se_puede_decir: >-
    Es una REDUPLICACIÓN: miri-miri. Y eso no es especulación, porque el propio
    Esteves documenta el recurso en la misma Parte II al glosar BARABARA
    «que es plural por duplicación». Con Taratara, Tapatapa y Chichiriviche
    (chi-chi) son cinco nombres reduplicados en el estado.
  accion_propuesta: >-
    Censar las reduplicaciones de Falcón como se hizo con `-ana` en #109. Si
    Esteves declara que la duplicación es plural en un caso, la pregunta es si
    lo es en todos — y eso se mide, no se supone.

  barrido_web_2026-09-10: >-
    Buscado a solas, no dentro de una consulta agrupada. La web TAMPOCO lo
    glosa: ni etimología, ni lengua, ni leyenda del nombre. Dos fuentes
    independientes —Esteves y la divulgación local— registran el nombre y
    ninguna lo explica. Eso ya es un resultado: el silencio es coincidente.
  lo_que_si_aporta_la_web:
    - >-
      ⭐ El nombre no es sólo del pueblo: hay CERRO MIRÍMIRE —esdrújulo, con
      tilde— y RÍO MIRIMIRE. «La zona central, donde se ubican Mirimire,
      Mirimirito, Belén y El Cristo, corresponde a un área montañosa, situada
      sobre la formación del cerro Mirímire». Esteves da tres referentes y NO
      menciona ni el cerro ni el río.
    - >-
      Que el mismo nombre cubra cerro, río y pueblo apunta a que nombró primero
      el accidente y después el poblado — el patrón normal. Y la tilde del
      cerro (Mirímire) frente al pueblo (Mirimire) es una diferencia de
      acentuación que conviene no perder: en esta campaña las tildes ya
      movieron tres lemas del canon.
    - 'En un decreto de 1885 aparece sólo como «aldea de campesinos».'
  hipotesis_de_miguel_2026-09-10:
    lo_que_dice: >-
      «No sé dónde había leído que el `miri` era un tipo de arbusto. Y Mirimire
      era justamente un lugar de muchos de estos».
    busqueda_hecha: >-
      🔴 NO CORROBORADA, y buscada en todo lo que el proyecto puede alcanzar:
      el lexicón (nada que empiece por miri-), Esteves entero —partes I y II—
      donde `miri` sólo aparece DENTRO de Mirimire, Alvarado 1921 a texto
      completo, van Buurt, Gatschet, y dos búsquedas web específicas de «miri
      arbusto Venezuela» y «mirimire planta». Cero en todas. El herbario de
      Coro, que sería el sitio, corta la conexión.
    por_que_NO_se_descarta: >-
      Porque no encontrarla mide lo que alcanzo, no lo que existe — la regla 6,
      que en esta misma campaña ya falló tres veces a favor del dato: `teco` y
      `cuaguaro` no aparecían en la web y estaban en Esteves; las voces del
      dictado sin rastro resultaron estar en la Parte II. Miguel lo leyó en
      algún sitio, y el sitio existe aunque yo no llegue.
    lo_que_la_hace_COHERENTE: >-
      ⭐ Y esto es lo que la hace valiosa aunque esté sin fuente: encaja con DOS
      patrones que esta campaña midió por separado, y no fue construida para
      encajar con ellos.
    los_dos_patrones:
      - >-
        LA REDUPLICACIÓN ES PLURAL. No es conjetura: el propio Esteves lo dice
        en la Parte II al glosar BARABARA «que es plural por duplicación». Si
        miri-miri es plural de `miri`, la lectura «lugar de muchos miri» sale
        de la propia gramática que el autor declara.
      - >-
        EN ESTA REGIÓN LOS PARAJES SE NOMBRAN CON SU PLANTA O SU BICHO. Medido
        en esta misma campaña: Adaro < `dara` el alcaraván, Yabuquiva < `yabo` +
        `quiva` 'yabal pedregoso', Buchuaco < `buche` el cardo, Baraived <
        `bara` 'árbol' + `bere` 'amargo', Sividigua, Chiguare, Guaibacoa 'lugar
        de los guays', Baragua < `cuaguaro`. Un arbusto nombrando un cerro es
        exactamente lo esperable.
    y_la_geografia_ayuda: >-
      El nombre cubre CERRO, RÍO y PUEBLO. Un arbusto que tapiza una ladera
      nombra primero el cerro y después lo que se funda debajo — que es el
      orden que los tres referentes sugieren.
    estado: 'hipótesis con dos apoyos estructurales y CERO atestación léxica. No entra a ningún sitio hasta que aparezca el `miri`.'
    donde_buscarlo:

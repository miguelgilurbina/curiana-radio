# ─────────────────────────────────────────────────────────────────────────
# PROPUESTA — La cosmovisión MARINA de los caquetíos de la costa
# Campaña cc.10 (la última del cierre), 2026-09-24.
#
# El encargo, en palabras de Miguel:
#   cc.10 (6-fusion/decisiones_cierre_2026-09-23.yaml): «esa campaña de
#   Cosmovisión Marina tenemos que dejarla a lo último, efectivamente no hay
#   nada eh, que tengamos establecido […] es una intuición nuestra por los
#   momentos». Y hoy: «que no quede ninguna tarea pendiente».
#   El origen de la intuición (FA3, 2026-09-22): «el aspecto marino era
#   esencial en la cosmovisión caquetía».
#
# La pregunta: ¿qué dicen las fuentes del proyecto sobre el MAR en la vida
# simbólica, ritual y cosmológica de los caquetíos de la costa (Paraguaná,
# Golfete de Coro, islas ABC), y qué es DATO, qué INFERENCIA y qué INTUICIÓN?
#
# Regla 5: esto PROPONE. No toca 3-mundo/corpus/, curiana_sim/ ni el lexicón.
# Regla 1: las cifras de `meta.medido` las escribe
#     python 6-fusion/scripts/medir_cosmovision_marina.py --conteos
# y el mismo script, sin bandera, valida este archivo (ids únicos, etiquetas,
# toda `obra` en 4-fuentes/bibliografia.yaml, y que `meta.medido` coincida).
# Regla 3: cada hecho dice su ÉPOCA; casi todo es crónica del XVI.
# Regla 4: cada hecho dice su POLITY o su lugar; lo que no es de la costa
#   caquetía va a `comparanda` con su lengua y su lugar, nunca al canon
#   caquetío sin decirlo.
# ─────────────────────────────────────────────────────────────────────────
meta:
  recogido: '2026-09-24'
  estado: sin-fusionar
  quien: 'minador de la campaña cc.10 (Claude Opus 5.5), con tres auxiliares: kalinago (Breton), arqueología, y taíno/lokono/wayuu/achagua'
  rama: campana/cosmovision-marina-2026-09-24
  parte_de: tanda/hermanas-2026-09-24 (c83937b)
  pregunta: >-
    ¿Qué dicen las fuentes del proyecto sobre el MAR en la vida simbólica,
    ritual y cosmológica de los caquetíos de la costa (Paraguaná, Golfete de
    Coro, islas ABC), y qué es dato, qué inferencia y qué intuición?
  punto_de_partida: >-
    FA3 (6-fusion/fauna_paraguana_mar_2026-09-22.yaml §cosmovision_marina)
    dejó ocho hechos sostenidos del mar en la VIDA (cm-s1 a cm-s8: léxico,
    nombre, despensa, moneda, adivinación de la pesca, camino, cerro-marca,
    pesca con teas), tres intuiciones sin fuente (cm-n1 el dueño del mar, cm-n2
    el mar esencial en la cosmovisión, cm-n3 la guarura ritual), tres
    comparandas (cm-c1 Orehu lokono, cm-c2 Yaya taíno, cm-c3 Pulowi wayuu) y
    tres caminos de prueba: (1) Oviedo t. II releído en contexto ritual, (2)
    los ajuares dabajuroides, (3) los petroglifos. M8 (arqueologia_insular_falcon
    §en_la_creencia) midió CERO de creencia en Urbina, Casale, Knaf y
    Moreno-Mayar; oliver1989_restante §mar, CERO en Oliver. Esta campaña
    recorre los tres caminos, añade la crónica que faltaba (Aguado), mina
    Breton por primera vez y cierra con las ventanas leídas.
  respuesta_corta: >-
    El mar es esencial en la VIDA de la costa y lo dicen las fuentes; en la
    CREENCIA caquetía no aparece nunca. Donde las crónicas ponen lo sagrado de
    esta gente, lo ponen en el cielo (el Manaure «da los temporales»; al
    boratio se le pregunta «si lloverá») y en el maíz (ayunos, funerales y
    ajuar son de mazamorra y maçato). El único acto ritual atestiguado que
    toca el mar es la adivinación doméstica con tabaco antes de salir a pescar,
    que es la misma para caminar, sembrar, cazar o saber si la mujer lo
    quiere. La arqueología da mar en DOS urnas de Curazao (un diente de
    tiburón en cada una, s. XIII-XIV) y ninguna imagen marina caquetía. Los
    vecinos sí ponen el mar en su creencia, cada uno a su manera: el kalinago
    en las estrellas que dan viento y se zambullen en el mar; el taíno en el
    origen del mar (Yaya), en la mujer del fondo del mar que da las joyas
    sagradas y en el pez al que se le habla; el lokono en la mujer del agua
    que da la maraca (Brett vía Brinton); el wayuu, sólo de segunda mano
    (Pulowi). Ninguno tiene un «dueño del mar» al que se pide permiso, y que
    el ser supremo taíno lleve el mar en el nombre es etimología de 1897.
    La intuición queda como intuición, con el cero medido y una hipótesis más
    fina: lo sagrado caquetío que conocemos es del cielo y de la tierra de
    labranza; el mar es lo cotidiano, lo que se trueca y lo que se cruza.
  como_se_midio: >-
    (1) COOCURRENCIA creencia × mar en 35 textos del repo, con creencia × cielo
    de control positivo (6-fusion/scripts/medir_cosmovision_marina.py; la
    ortografía del s. XVI normalizada: sin diacríticos, ç → c, palabras
    partidas a fin de línea unidas). (2) LECTURA de cada ventana en las obras
    de la costa, y de las que tienen un nombre de la costa occidental a ±2000
    caracteres en las obras de toda América (Castellanos, Anglería, Navarrete,
    el Handbook). (3) Relectura de los capítulos rituales de Oviedo (t. II lib.
    XXV caps. IX y XXII) y del lib. I cap. I de Aguado. (4) Breton leído por la
    capa de texto de cada página y ~40 páginas en imagen. (5) La arqueología de
    ~20 obras con sondas en cuatro lenguas y control positivo. (6) El cruce de
    las glosas caquetías atestiguadas de mar y de creencia. (7) Los 63 system
    prompts de la era 2, frase a frase.
  lectura_de_las_ventanas: >-
    Ninguna ventana creencia × mar de las obras de la costa es creencia
    caquetía del mar. Son de españoles (tormentas, navíos, Aguirre, «pescado o
    demonio» de un soldado en un río), de la conquista de Caracas (caracoles y
    fotutos de guerra), de otras gentes (Chicora, Santa Marta, el Orinoco, los
    girara, el lago de Valencia), o del s. XX sin dato (Antolínez). Lo que sí
    toca la costa está en los hechos de abajo, cada uno con su página.
  # ── lo escribe `python 6-fusion/scripts/medir_cosmovision_marina.py --conteos`;
  #    no se edita a mano (regla 1). «ventanas_*» son ventanas fundidas de ±300
  #    caracteres alrededor de un término de creencia. ──

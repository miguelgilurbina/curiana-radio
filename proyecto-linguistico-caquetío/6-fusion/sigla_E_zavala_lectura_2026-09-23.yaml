# ── LOS AFIJOS ────────────────────────────────────────────────────────────
afijos:
  '-iro':
    donde: REGLAS_ZAVALA (se enseña)
    zavala: [166]
    esteves:
      paginas: [88, 104]
      verificado: imagen
      clase: etimologia-de-toponimo
      lo_que_dice: >-
        Bariro (p. 88): «La desinencia "iro" es diminutivo de voces
        indígenas»; Coroquidiro (p. 104): «sólo conocemos la desinencia iro,
        que es diminutivo». Los dos topónimos son de la Parte II (distritos
        Buchivacoa); dice «voces indígenas», no «caquetío».
    otras_atestaciones: []
  '-uco':
    donde: REGLAS_ZAVALA (se enseña, con -uto como variante)
    zavala: [268]
    esteves:
      paginas: [31, 51, 57, 61, 66, 83, 128]
      verificado: imagen
      clase: etimologia-de-toponimo
      lo_que_dice: >-
        Coduto (p. 31): «El sufijo uto y uco, indistintamente lo hemos hallado
        formando voces compuestas» con el valor de quebrada. Es inducción suya
        desde Matuto (p. 51), Quibarute (p. 57), Tacaduto (p. 61),
        Urupaguaduco (p. 66), Acatuto (p. 83) y Quebrahuto (p. 128, «vocablo

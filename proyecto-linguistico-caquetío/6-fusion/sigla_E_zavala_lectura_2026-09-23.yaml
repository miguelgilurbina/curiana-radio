# ── LOS TOPÓNIMOS DEL CANON (A y B) CON UNA PIEZA SÓLO DE ESTEVES ─────────
# El script los detecta solo (piezas = claves de `morfemas` y tokens de
# `segmentacion`); aquí va el VEREDICTO, con la regla del lote del
# 2026-09-22: A = cada pieza en otra fuente; B = una pieza independiente más
# otra sólo de Esteves pero recurrente, o A con un residuo; C = ninguna pieza
# independiente, o las dos debilidades a la vez.
toponimos:
  toponimo-001:
    forma: jurijurebo
    propuesta: C
    razon: >-
      Las dos piezas (juri, ebo) son sólo de Esteves, y la glosa del topónimo
      también: Zavala #179 (E) «Paso de los vientos» es Esteves p. 47. Lo que
      no cambia es la ciudad: «Hurehurebo» está en Castellanos (1589) y
      Esteves reporta cementerio con urnas.
  toponimo-004:
    forma: cumarebo
    propuesta: C
    razon: >-
      Zavala #94 (E) «Camino del cacique Cumare» es Esteves p. 105 («el camino
      del cacique Cumare: paso, senda y cumare, el cacique»). La razón del
      canon —«segunda atestación independiente de ebo (la otra es
      jurijurebo)»— cuenta dos veces a Esteves.
  toponimo-075:
    forma: judibana
    propuesta: B
    razon: >-
      bana se sostiene sin Esteves (HB, CGB, Velasco); judi/juri no, pero
      recurre con la misma glosa en tres nombres (Judibana, Jurijurebo, Tura):
      una pieza independiente más otra sólo de Esteves y recurrente = B.
  toponimo-148:
    forma: carirubana
    propuesta: C
    razon: >-
      Ya era B por el residuo -ru-; ahora además cari es sólo de Esteves (dos
      nombres de la misma página). Las dos debilidades a la vez: C. (La glosa
      sí es de fuente —p. 28—, contra lo que dice el canon: corrección del
      lote del 2026-09-22.)
  toponimo-076:
    forma: abudure
    propuesta: B
    razon: 'dabuda se sostiene (HB); ure es sólo de Esteves pero recurre (Abudure, Babahuro): B, como estaba.'
  toponimo-086:
    forma: buchuhaco
    propuesta: B
    razon: 'buche se sostiene (AM, Alvarado); «aco: par» es sólo de Esteves y recurre (Buchuhaco, Guachaco, Michaco): B, como estaba.'
  toponimo-114:
    forma: bariquí
    propuesta: B
    razon: 'bara pasa a reconstruida pero corroborada (barabara, Alvarado); quire es de Esteves y recurre: B, como estaba.'
  toponimo-147:
    forma: bariquire
    propuesta: B
    razon: 'Como bariquí.'
  toponimo-143:
    forma: guarataro
    propuesta: B
    razon: 'La razón del canon ya contaba bien: Esteves y Medina Colina, dos testigos de la voz viva.'

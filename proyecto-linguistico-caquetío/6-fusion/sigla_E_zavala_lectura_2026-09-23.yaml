# ─────────────────────────────────────────────────────────────────────────
# LA SIGLA (E) DE ZAVALA, LEÍDA — voz por voz, lo que dice Esteves 1989
# Campaña corta de cierre, decisión cc.4 (6-fusion/decisiones_cierre_2026-09-23.yaml)
#
# «la sigla es Zavala Esteves, eh, ok, miramos también el canon de eso»
#                                                    (Miguel, 2026-09-23)
#
# Regla 5: esto PROPONE. No toca curiana_sim/, 2-lengua/ ni 3-mundo/.
# Regla 1: NINGUNA CIFRA en este archivo. Es la LECTURA —qué dice Esteves de
# cada voz, dónde, y qué otra fuente hay— y de ella el script
# 6-fusion/scripts/medir_sigla_E_zavala.py DERIVA las etiquetas por opción,
# cuenta, mide usos y exposición, y escribe
# 6-fusion/medicion_sigla_E_zavala_2026-09-23.yaml (`--check` dice si está
# al día). Las páginas son citas, no cifras.
#
# Copyright: Esteves 1989 es obra moderna. Las citas van recortadas (menos de
# quince palabras) y el resto parafraseado; la página impresa lleva al texto.
#
# CÓMO SE LEYÓ. OCR del repo (fuentes_caquetios/Esteves_1989_..._N.ocr.txt)
# para llegar a la página, y la página en IMAGEN (pymupdf) donde la lectura
# decide una etiqueta con consecuencias (`verificado: imagen`). El folio se
# leyó en el pie: los desfases son +6/+25/+55 (tomos 1-3), +72 en el tomo 4
# hasta el pdf 9 y +73 desde el pdf 10 (la p. 82, blanca, no se escaneó),
# +100 en el 5, y +129 en el 6 hasta el pdf 14 y +130 desde el 15 (falta la
# p. 144). La skill campana-toponimos sólo da los tres primeros.
# ─────────────────────────────────────────────────────────────────────────
meta:
  fecha: '2026-09-23'
  quien: agente de campaña (Claude), rama campana/sigla-E-zavala
  estado: sin-fusionar
  obra_leida: esteves-1989
  la_regla: >-
    Zavala Reyes 2015 p. 64 da las siglas de su glosario: «Juan Esteves (E)».
    Cuando el canon cita «Zavala #N (E)», cita a Esteves copiado por Zavala:
    no es una fuente más (minar-fuente §8). Y lo que Esteves da es, casi
    siempre, la ETIMOLOGÍA de un topónimo propuesta por él: su propia ficha
    (4-fuentes/esteves-1989.md §«Cómo se debe usar») ya decía que una
    etimología suya sin cita entra como `hipotetico`, sube a `reconstruido`
    si corrobora algo que ya teníamos, y sólo llega a `atestiguado` si se
    persigue el documento que cita. El canon aplicaba esa regla a Esteves
    citado por su nombre y no a Esteves citado por su sigla.
  de_donde_sale_cada_E: >-
    Las glosas (E) de Zavala son, frase por frase, las de Esteves 1989 —de las
    dos partes del libro—: #143 «Guaru: voltúrido, cataneja, ave mayor que el
    zamuro» es la p. 42 («voltúrido que llamamos cunareja, ave mayor que el
    zamuro»); #164 Iguí, #112 Dividive, #72 Caujaro y #264 Tuturutos son las
    glosas entre paréntesis de las pp. 117, 110, 100 y 66 casi palabra por
    palabra; #111 Dito, #165 Ima, #166 Iro y #268 Uco son las pp. 46, 93, 88
    y 31. Zavala no lista a Esteves en su bibliografía (pp. 74-76), así que
    la obra no la dice él: la dice la coincidencia.

# ── LAS CLASES ────────────────────────────────────────────────────────────
# `clase` dice QUÉ HACE Esteves con la voz en su libro:
#   etimologia-de-toponimo — la glosa sólo aparece al partir un nombre de
#       lugar («X quiere decir… Y: glosa»). Es análisis suyo.
#   dice-en-caquetio — afirma «en lengua caquetía X es Y» o «sabemos que»,
#       sin decir de dónde. Sigue siendo suyo.
#   voz-viva — nombra con un sustantivo corriente una planta, un animal, una
#       materia o un objeto de la península, como base de un topónimo: la
#       PALABRA existe (un nombre vivo es dato, Miguel 2026-09-07); lo que es
#       suyo —y de Zavala al copiarlo— es que sea CAQUETÍA.
#   no-esta — la glosa de Zavala no aparece en la página de Esteves.
#
# `otras_atestaciones[].estado`:
#   independiente-verificada   — otra obra del repo, leída, misma palabra y
#                                misma cosa, en el área (Coro, Falcón, «Occ.»)
#   independiente-sigla        — otra sigla de Zavala (AM, HB, PMA, HP, CGB,
#                                GC, A) que el repo no deja verificar
#   independiente-fuera-del-area — otra obra, misma palabra y misma cosa, pero
#                                localizada fuera (Lara, Zulia, Llano, oriente)
#                                o sin localizar: documenta la VOZ, no que sea
#                                caquetía (regla 4)
#   analisis-nuestro           — una forma independiente que la contiene,
#                                partida por nosotros: sube a reconstruido
#   forma-sin-glosa            — la forma aparece, sin glosa
#   otro-referente             — misma forma, otra cosa
#   copia-de-esteves           — la obra cita a Esteves: no cuenta
# ─────────────────────────────────────────────────────────────────────────

voces:

  # ═══ SÓLO (E): las que el canon da por atestiguadas ═══════════════════

  juri:
    zavala: [178]
    esteves:
      paginas: [47, 66]
      verificado: imagen
      clase: etimologia-de-toponimo
      lo_que_dice: >-
        Tres veces y las tres partiendo un topónimo: Judibana («Judi, juri:
        viento. Bana: sitio alto», p. 47), Jurijurebo («Juri: viento; Ebo:
        paso…», p. 47) y Tura, que en el censo de 1881 fue «Hato de Jura»
        («Jura, juri: ventarrón», p. 66). No cita a nadie.
    otras_atestaciones:
      - {obra: castellanos-elegias, pagina: null, dice: '«Hurehurebo», ciudad caquetía (1589): la forma, sin glosa', estado: forma-sin-glosa}
      - {obra: van-buurt-2014, pagina: '§8 Hudishibana', dice: 'juri, judi, hudi = wind, citando «(Cruz Esteves, 1989)»', estado: copia-de-esteves}
      - {obra: null, pagina: null, dice: '6-fusion/cruce_taino_caquetio_2026-09-22.yaml: sin cognado (taíno no-comparable; lokono wadu-lli y wayuu wawai, sin parecido)', estado: otro-referente}
    nota: >-
      La única otra glosa de 'viento' en todo el corpus es «Coro quiere decir
      viento en lengua generosa», de Castellanos, que Esteves recoge con
      ironía en la p. 73 y que cc.6 manda retirar como etimología por el
      latín. Juri 'viento' descansa, entero, en tres etimologías de un
      cronista de 1989.

  ebo:
    zavala: [117]
    esteves:
      paginas: [35, 38, 39, 47, 105]
      verificado: imagen
      clase: etimologia-de-toponimo
      lo_que_dice: >-
        Curaidebo «el paso del Curarí… Ebo: camino, paso, senda» (p. 35),
        Gisebo (p. 38), Guacurebo «por el sufijo ebo» (p. 39), Jurijurebo
        «paso, ruta, valle estrecho, cañón» (p. 47) y Cumarebo (p. 105).
    otras_atestaciones:
      - {obra: zavala-reyes-2015, pagina: 66, dice: '#75 Cazebo (GC) «Poniente» = cazi (GC) «sol» + -ebo: «el camino del sol» es partición NUESTRA (campaña del nominalizador, 2026-09-21)', estado: analisis-nuestro}
      - {obra: oliver-1989-apendice-a, pagina: 594, dice: 'A-9 #36 guacurebo «quebrada que crece», sin partir (= Zavala #129 HB)', estado: forma-sin-glosa}
      - {obra: zavala-reyes-2015, pagina: 71, dice: '#261 Turijerebo (AM) «Lugar de descanso», sin partir', estado: forma-sin-glosa}
      - {obra: castellanos-elegias, pagina: null, dice: '«Hurehurebo» (1589), sin glosa', estado: forma-sin-glosa}
    nota: >-
      La FORMA -ebo está en cuatro fuentes que no son Esteves, y en una de
      ellas (Cazebo, Galeotto Cey, s. XVI) la lectura 'camino' encaja. La
      GLOSA es de Esteves. Es exactamente lo que el canon llama reconstruido.

  kari:
    zavala: [66]
    esteves:
      paginas: [28]
      verificado: imagen
      clase: etimologia-de-toponimo
      lo_que_dice: >-
        Sólo en la p. 28, partiendo dos nombres: Cariguariana («Cari: orilla de
        mar») y Carirubana («Cari: orilla. Bana: sitio alto»).
    otras_atestaciones:
      - {obra: van-buurt-2014, pagina: '§9 Cariatavo', dice: '«cari means coast, shore (Cruz Esteves, 1989)»', estado: copia-de-esteves}
    nota: >-
      La nota del lexicón ya daba a van Buurt «vía» Esteves: es la misma
      fuente dos veces. Y es la voz que D9 usó para decir que -bana no es
      'orilla' («la costa atestiguada es kari»): las dos glosas, bana 'cerro'
      y cari 'orilla', salen de la MISMA línea de Esteves.

  ure:
    zavala: [272]
    esteves:
      paginas: [11, 18, 22]
      verificado: ocr
      clase: etimologia-de-toponimo
      lo_que_dice: >-
        Abudure (p. 11: «ure… quiere decir: raíz en nuestra primitiva lengua»,
        y que está en muchos topónimos de Paraguaná) y Babahuro (p. 18, 'el
        caño de las raíces'). En la p. 22, a propósito de Baraivere, trae el
        único paralelo que da en todo el libro: el pueblo GUARANÍ «Uretebere»
        de Cabeza de Vaca, «Ure: raíz; Bere: amargo». En Parte II lo repite
        en Camurujure (p. 94) y Guaimure (p. 112).
    otras_atestaciones:
      - {obra: van-buurt-2014, pagina: '§5', dice: '-ure «which according to Cruz Esteves (1989) means root»', estado: copia-de-esteves}
      - {obra: oliver-1989-apendice-a, pagina: 593, dice: 'A-9: bisure lagartija, chaure búho: -ure sobre animales, ni raíz ni lugar', estado: otro-referente}
    nota: >-
      El único apoyo que no es un topónimo es un topónimo guaraní. El
      conflicto con -are/-ure 'sitio de' (morfema-002) enfrenta, en rigor,
      a Esteves consigo mismo.

  tuba:
    zavala: [253]
    esteves:
      paginas: [64, 73]
      verificado: imagen
      clase: etimologia-de-toponimo
      lo_que_dice: >-
        p. 64: Todariquiba no significaría nada, pero «Tubariquiba» —la forma
        que él propone en lugar de la de Castellanos— sería 'pedregal':
        «Tuba: aglomeración. Quiba: pedruzco»; y Tubarao, «Tuba: montón».
        p. 73 (apéndice): el «cuar» cumanagoto de Caulín «tiene el mismo
        significado del tuba de los caquetíos».
    otras_atestaciones: []
    nota: >-
      La glosa nace de ENMENDAR un nombre atestiguado (Todariquiba, Castellanos
      1589) para que dé una etimología.

  rao:
    zavala: [219]
    esteves:
      paginas: [64, 92]
      verificado: imagen
      clase: etimologia-de-toponimo
      lo_que_dice: >-
        p. 64, Tubarao: «Rao: arena (r sencilla)». p. 92, Cabarao: «de la
        parte desinencial rao, sabemos que significa: aglomeración». Esteves
        se contradice: arena en una página, aglomeración en otra.
    otras_atestaciones: []

  siwa:
    zavala: [227]
    esteves:
      paginas: [23]
      verificado: ocr
      clase: etimologia-de-toponimo
      lo_que_dice: >-
        Barisigua, p. 23: «Bari-sigua: palo blando; bara: árbol. Sigua:
        blando». Lo repite sin partir en la Parte II (p. 88).
    otras_atestaciones: []
    nota: 'La clave `siwa` tiene además el homónimo siwa-2 «sal de comercio» (lokono): no se toca.'

  naure:
    zavala: [186]
    esteves:
      paginas: [37]
      verificado: imagen
      clase: dice-en-caquetio
      lo_que_dice: >-
        Chunaure, p. 37: Chunaure es apellido; «en lengua caquetía "ñaure" es
        planta bejucosa, y "naure", es jojoto».
    otras_atestaciones:
      - {obra: alvarado-1921, pagina: 226, dice: 'NÁURA «fruto en cierne del maíz»: es la OTRA acepción (#185 naure «jojoto»), no la del lexicón', estado: otro-referente}
    nota: >-
      ⚠️ La entrada `naure` del lexicón lleva la glosa de ÑAURE (#186, 'planta
      bejucosa'); #185 Naure es 'jojoto', y ésa sí tiene un testigo fuera de
      Esteves (Alvarado, náura). Corregir la glosa es curación, no esta
      campaña: queda propuesto en la medición.

  waru:
    zavala: [143]
    esteves:
      paginas: [42]
      verificado: imagen (esteves_paginas_releidas_2026-09-16.yaml; la p. 42 está escaneada boca abajo)
      clase: dice-en-caquetio
      lo_que_dice: >-
        Guaruguaja, p. 42: «Guar[a], en caquetío, es el voltúrido que llamamos
        cunareja, ave mayor que el zamuro». La saca del topónimo, que él lee
        como plural por duplicación (guaraguara).
    otras_atestaciones: []
    nota: >-
      Zavala escribe «Guaru» y «cataneja»: la cabecera impresa vacila
      (GUARUGUAJA / Guaraguaja) y «cunareja» se leyó mal. La voz del lexicón
      hereda la forma de la cabecera, no la del cuerpo.

  waranao:
    zavala: [140]
    esteves:
      paginas: [41]
      verificado: imagen
      clase: no-esta
      lo_que_dice: >-
        La entrada GUARANAO (p. 41) describe la salina de Punta Cardón, la fama
        de su sal para los ojos (citando a Hill Peña) y la Zona Franca. NO
        glosa la voz: no dice «salado» ni «ácido». La búsqueda en las dos
        partes del OCR da la voz sólo en esta página.
    otras_atestaciones:
      - {obra: arcaya-1920, pagina: null, dice: 'las salinas «más importantes son las de Guaranao»: el topónimo, sin glosa', estado: forma-sin-glosa}
    nota: >-
      «Salado, ácido» parece inferido del referente (una salina), por Zavala o
      por otra obra de Esteves que no está en el repo. Y es la voz que
      `prompt_reglas_breve` pone de EJEMPLO de verbo estativo a los 63.

  aka:
    zavala: [3]
    esteves:
      paginas: [83, 105]
      verificado: imagen
      clase: etimologia-de-toponimo
      lo_que_dice: >-
        Sólo en la Parte II: Acaca, Acarite y Acatuto (p. 83: «Aca: bejuco;
        uto: quebrada»). En la p. 105 da «aca: par, casal, pareja»: la misma
        forma con dos glosas.
    otras_atestaciones: []

  tubarao:
    zavala: [254]
    esteves:
      paginas: [64]
      verificado: imagen
      clase: etimologia-de-toponimo
      lo_que_dice: 'Tubarao, p. 64: «significa arenales. Tuba: montón. Rao: arena».'
    otras_atestaciones: []
    nota: 'Es un TOPÓNIMO (lugar cerca de Santa Ana) que el lexicón tiene como voz común.'

  jachos:
    zavala: [169]
    esteves:
      paginas: [33]
      verificado: imagen
      clase: voz-viva
      lo_que_dice: >-
        Cunacho, p. 33: del cunaro «extraían manteca para untar los "jachos",
        teas de madera… para encandilar en labores de pesca nocturna». La
        palabra va ENTRE COMILLAS y Esteves no la da por indígena.
    otras_atestaciones: []
    castellano_probable: >-
      «Jacho» es, con la h aspirada que conserva el habla de la península, el
      castellano «hacho» 'tea, manojo encendido para alumbrar' (DRAE, fuera
      del repo: verificar antes de fusionar). Ni Alvarado 1921 ni el dictado
      de Medina la traen como voz indígena.
    forzar_B: caquetío-hipotético
    razon_forzar_B: >-
      Por la clase le tocaría retroabstraído, pero una voz viva CASTELLANA no
      es retroabstracción de nada. Lo mínimo es hipotético; si Miguel
      confirma «hacho», es una reasignación a español como la de caraota
      (D10), y es decisión aparte.

  saruro:
    zavala: [224]
    esteves:
      paginas: [60, 131]
      verificado: ocr
      clase: voz-viva
      lo_que_dice: >-
        Sarinao (p. 60): el «Cerro del Saruro» es lindero de tierras comuneras,
        y saruro es una serpiente no venenosa, la boa. El Saruro (p. 131).
    otras_atestaciones:
      - {obra: alvarado-1921, pagina: 273, dice: 'SARÚRA «Boa constrictor», sin localizar', estado: independiente-fuera-del-area}

  wanepe:
    zavala: [137]
    esteves:

      verificado: ocr
      clase: voz-viva
      lo_que_dice: 'Guachunepe, p. 39: viene de guanepe, cesto de fibra para cargar a los recién nacidos.'
    otras_atestaciones:
      - {obra: alvarado-1921, pagina: 152, dice: 'GUANÉPE, el cabestrillo para los niños «en Barcelona y Guayana»', estado: independiente-fuera-del-area}

  kuna:
    zavala: [95]
    esteves:
      paginas: [33, 44]
      verificado: imagen
      clase: voz-viva
      lo_que_dice: 'Cunacho (p. 33): cuna, cunaro, pez lábrido que abunda en el Golfete; Iticuna (p. 44).'
    otras_atestaciones:
      - {obra: alvarado-1921, pagina: 102, dice: 'CUNA «Promicrops guasa», pez de las costas de Cumaná', estado: independiente-fuera-del-area}

  kunaro:
    zavala: [96]
    esteves:
      paginas: [33]
      verificado: imagen
      clase: voz-viva
      lo_que_dice: 'Cunacho, p. 33, junto a cuna.'
    otras_atestaciones:
      - {obra: alvarado-1921, pagina: 102, dice: 'CUNÁRO «Mesoprion sp., pez del mar Caribe»', estado: independiente-fuera-del-area}

  karapa:
    zavala: [65]
    esteves:
      paginas: [27, 98]
      verificado: ocr
      clase: voz-viva
      lo_que_dice: 'Cararapa (p. 27), «forma epentética de carapa, árbol resinoso»; Carapa (p. 98).'
    otras_atestaciones:

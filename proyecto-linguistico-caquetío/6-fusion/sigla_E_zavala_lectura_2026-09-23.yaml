  karuka:
    zavala: [67]
    esteves:
      paginas: [28, 49]
      verificado: imagen
      clase: voz-viva
      lo_que_dice: 'Caruca (p. 28): hierba áspera para la torta de barro de los techos; Machuruca (p. 49).'

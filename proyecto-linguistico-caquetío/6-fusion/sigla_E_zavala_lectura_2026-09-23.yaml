      clase: dice-en-caquetio
      lo_que_dice: >-
        Barabara (p. 19): «Sabemos que Bara, en lengua caquetía, es voz general
        para… árbol», y a continuación toma de Alvarado que barabara es un
        árbol, «plural por duplicación». Lo repite en Baraived (p. 22) y
        Bariquí (p. 88).
    otras_atestaciones:
      - {obra: alvarado-1921, pagina: 21, dice: 'BARABARA, «Árbol de Coro» (Clavija): la forma reduplicada, sin partir — la partición es de Esteves', estado: analisis-nuestro}
      - {obra: van-buurt-2014, pagina: '§5', dice: '«bara means tree in Caquetío», en el párrafo que cita a Esteves', estado: copia-de-esteves}
    nota: >-
      La nota del lexicón dice «con Esteves 1989 y van Buurt 2014 diciendo lo
      mismo»: son uno. La cita de barabara (Zavala #30, A) es otra voz, que el
      lexicón ya tiene aparte; lo que la hace apoyo es la reduplicación, que
      es análisis. El lokono balli 'árbol' la acerca a reconstruido.


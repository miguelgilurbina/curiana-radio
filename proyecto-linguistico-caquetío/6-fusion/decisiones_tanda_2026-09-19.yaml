  queda_abierto_y_es_de_Miguel:
    - >-
      `sima` — EL PAR 6, medido y NO aplicado. La política lo ALCANZA:
      `turumako` 'cerro, meseta' es atestiguada (Zavala #262) y, además, el
      caquetío ya dice 'cerro' con `-bana` (atestiguado, D9, seis apoyos). Es
      un par a tres bandas. No se aplicó porque es la pregunta que Miguel
      dejó abierta («¿`sima` sobra?») y aquí está su coste delante: `sima`
      tiene 510 usos en 49 formas, de los que el scorer reconoce 109 —el
      resto son compuestos que nunca contaron, porque `sima` no es raíz
      verbal—, mientras `turumako` tiene 1. Y está en el instrumento DOS
      veces: como voz en NATURALEZA de `prompt_reglas_completo` y, sobre
      todo, como el molde `sima-bana` del ejemplo de los locativos, que es
      justo lo que enseña `-bana`. Archivarla obligaría a reescribir ese
      ejemplo, que es lo que hace que el corte del 09-19 tenga sentido. Si la
      respuesta es que sobra, el mecanismo está montado y cuesta una línea.
    - >-
      LOS ONCE QUE NO SON PARES. El criterio laxo los sacó a la luz y no son
      rivalidades: `cat` equivocada (`wasima`, `barbache`), glosa demasiado
      ancha (`bagre`, `igi`, `apana`, `chaa`, `jusual`), deuda ya declarada
      (`dare`), castellano (`iguana`), ya decidido (`coro`) y una convivencia
      real que sólo hay que declarar (`bara` / `kuru`). Están propuestos uno a
      uno en 6-fusion/curacion_glosas_pares_2026-09-19.yaml. DOS de ellos
      mueven el scorer —`wasima` y `barbache` están declaradas `v_raiz` sin
      serlo, y de ahí sale `_RAICES_VERB`— así que piden su propia medición y
      no se hacen de paso. CINCO viven en `lexicon_zavala.py`, que es generado
      Y lo importa el motor: se corrige el minador, no el módulo.
    - >-
      `parawa` / `para` NO SE FUSIONÓ, y el encargo lo permitía. Lo que se
      midió: los esqueletos fonémicos NO coinciden (`para` da `para`, `parawa`
      da `parawa`, con y sin la regla abierta gu→w), Zavala las trae como dos
      entradas de dos informantes distintos (#190 E+HP y #191 GC), y `-gua` es
      un locativo declarado del proyecto, así que `paragua` se lee sin forzar
      nada como `para` + `-gua`, 'la región del agua'. Eso no es otra grafía:
      es una derivación, y fusionarlas borraría un morfema atestiguado en uso.
    - >-
      `haborü` 'marejada' (habo+rü, hipotética) SIGUE EN EL HABLA con su raíz
      archivada. No se tocó porque es una entrada con su propia clave y su
      propia glosa, no una flexión de `habo`, y decidir que cae con ella es
      una decisión sobre el significado. Queda escrito.
    - >-
      LA PREGUNTA (b) DEL ISSUE sigue sin responder: si el muestreador debe
      preferir la atestiguada cuando hay par. La recomendación medida era que
      no —o no primero—, porque lo que decide la exposición del muestreo no es
      la capa sino el tamaño del cubo (12 de 25 cubos tienen una sola voz).
      Después de esta política la pregunta cambia de sentido: donde había par
      con rival atestiguado ya no hay dos formas que sortear.

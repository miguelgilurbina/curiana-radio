# ─────────────────────────────────────────────────────────────────────────
# REGISTRO CANON — los pueblos documentados en contacto social con los
# caquetíos. Una entrada por pueblo: quién es, qué familia lingüística, qué
# tipo de contacto está atestiguado, con qué polity caquetía, y con qué fuente.
#
# POR QUÉ EXISTE: el proyecto modela una sociedad multiétnica (#89), pero no
# tenía un registro de CON QUIÉN. Cada vez que una fuente documenta a los
# caquetíos conviviendo, comerciando o guerreando con otro pueblo, ese pueblo
# entra aquí con su ficha — no diluido dentro de un hecho del corpus.
#
# 🔴 Casi todo el contacto documentado es de polities NO costeras. Se declara
#    en cada entrada (`polity_caquetia`, vocabulario cerrado). Nada entra al
#    Golfete sin decisión explícita: `compilar_etnias.py` lo exige.
#
# ESQUEMA (lo valida `curiana_sim/compilar_etnias.py`):
#   cerrados  etiqueta · familia_linguistica · polity_caquetia ·
#             tipo_de_contacto · intensidad
#             (polity_caquetia admite además `ninguna` desde tf.7 B,
#             2026-09-23: el vecino de la esfera que no toca ninguna polity;
#             exige `tipo_de_contacto: ninguno`)
#   matiz     aviso_familia · polity_nota · contacto_nota · intensidad_nota
#   fuente    procedencia{obra, pagina, via} — obra y via son claves foráneas
#             contra 4-fuentes/bibliografia.yaml — o `deuda: sin-procedencia`
#   cruces    ver_tambien: lista de hechos del corpus o archivos del repo
# ─────────────────────────────────────────────────────────────────────────
meta:
  recogido: '2026-08-25'
  estado: canon   # fusionado el 2026-09-07 por decisión de Miguel (era 6-fusion/etnias_en_contacto.yaml)
  extensible: true
  guardian: curiana_sim/compilar_etnias.py   # 9.º guardián, 2026-09-07
  nota: >-
    Registro canon de los pueblos en contacto con los caquetíos, hermano de
    asentamientos.yaml. Cada entrada cita obra y página (o declara la deuda)
    y declara la polity caquetía a la que toca (regla 4). La única que toca
    la costera es el «caribe» del elenco, y es canon-simulación (etnia-008).

etnias:

  - id: etnia-001
    nombre: cuiba
    variantes: [cuiva, cuiba, wamonae]
    etiqueta: atestiguado
    familia_linguistica: guahibo
    aviso_familia: >-
      Guahibana. NI arahuaca NI caribe. Es una tercera familia lingüística,
      independiente de las dos que dominan el mundo caquetío. Eso hace de este
      contacto el más distante tipológicamente que tenemos documentado. Zavala
      Reyes 2015 (p. 61, citando a Molina 2009) coloca a los "Guajibos" entre
      los grupos "sin filiación precisa", fuera de arawak, caribe y chibcha.
    donde: llanos venezolanos — Hacarigua
    polity_caquetia: llanos
    polity_nota: NO la costera del Golfete
    tipo_de_contacto: corresidencia
    intensidad: maxima
    intensidad_nota: >-
      La MÁXIMA de las documentadas: no aldeas vecinas sino población mezclada
      dentro del mismo caserío.
    cita: >-
      "Estos habitantes de los cuales unos son cuibas y otros caquetíos, viven
      junto y entremezclados."
    procedencia: {obra: federmann-1916, via: brito-figueroa-poblacion-economia}
    ver_tambien: [6-fusion/polities_no_costeras_federmann.yaml#prop-polity-007]

    # ⚠️ HIPÓTESIS, NO DATO — pero vale la pena registrarla
    hipotesis_etimologica: >-
      El lexicón tiene `cuiva` = 'piedra' como caquetío-atestiguado, y la
      fuente lo declara así: Zavala #92 «Cuiva. Kiba (PMA): Piedra», más #218
      «Quiva (E): Piedra». Es decir: el etnónimo es HOMÓGRAFO de la palabra
      caquetía para 'piedra'.
      Si no es coincidencia, "Cuiba" sería un EXÓNIMO caquetío — cómo los
      llamaban ellos, no cómo se llamaban a sí mismos —, exactamente el mismo
      patrón que `Ciparicoto` = 'gente de la piedra' (ver etnia-003).
      ⚠️ NO verificado. El autónimo cuiba documentado es *wamonae*. La
      coincidencia puede ser eso y nada más. Lo que la haría dato es una
      fuente que gloce el etnónimo, no la homografía.

  # tf.7 A (Miguel, 2026-09-23): corregida con Federmann directo — la 1916 y el
  # alemán de 1557, vistos en imagen. Era `guayqueri`, `hipotetico`, familia
  # caribe y cita vía Brito Figueroa. Propuesta y citas completas:
  # 6-fusion/guaiqueries_manaure_dabajuroide_2026-09-23.yaml §pregunta_2.
  - id: etnia-002
    nombre: guaycarí de los llanos
    variantes: [Guaycaríes, Guaycaries, guayquerí, guaiquerí]
    etiqueta: atestiguado
    familia_linguistica: desconocida
    aviso_familia: >-
      Ninguna palabra guaycarí en el repo, y Federmann no da ninguna: la
      «descripción» que promete («als hernach dern art auch wirt volgen») no
      llega. Las filiaciones que circulan son de OTROS: caribe si son los
      guaiqueríes de Margarita (Oliver DOC p. 281, con McCorkle 1952; Zavala
      Reyes 2015 p. 61 vía Molina, lista moderna de segunda mano), guamos
      emparentados con el taparita y el otomaco para Kirchhoff (HSAI p. 464),
      «rama de la familia Guarauna» para Arcaya (nota a, 1916 p. 89, sin
      fuente). Ninguna fuente del repo los hace arahuacos. En duda, degradar:
      `desconocida`.
    donde: >-
      el río Coaheri —el Cojedes; Arcaya lo pone cerca de El Baúl (notas b-e,
      pp. 90-95) y Oliver en la juntura Sarare-Cojedes (DOC p. 281)—, en tierra
      de Itabana; enero-febrero de 1531 (contacto temprano, regla 3)
    polity_caquetia: llanos
    polity_nota: >-
      la polity de los llanos, NO la costera: ninguna fuente del repo pone
      guaycaríes ni guaiqueríes en Falcón, Paraguaná o las ABC
    tipo_de_contacto: vecindad
    contacto_nota: >-
      «vecindad» se queda corta y el vocabulario cerrado no tiene más: el
      alemán dice que las dos naciones viven «vnthereinander gemischt»
      —mezcladas en el territorio, con caquetíos «enthalb vñ her enhalb», a los
      dos lados del río— «doch iede in sondern Pueblos oder flecken», cada una
      en sus propios pueblos (1557 [77]-[78]). Hay mercado de pescado por
      frutas y víveres en las casas de pesca guaycaríes, donde acude gente de
      muchas aldeas (1916 p. 95 = 1557 [83]); dos guaycaríes «die auch der
      Caquetios sprach kundten» (1916 p. 94 = 1557 [83]); y una alianza de
      guerra entre el señor guaycarí y el cacique caquetío de Caraho (1916 p.
      100). No es un poblado mixto.
    intensidad: media
    intensidad_nota: >-
      Mismo territorio y dependencia económica mutua, pero pueblos separados:
      contraste deliberado con etnia-001, donde la población está mezclada
      dentro del mismo caserío.
    cita: >-
      «Allí hacen mercado con los Caquetíos, que cambian frutas y otros víveres
      por pescado, porque es la pesca su única industria y hanse adueñado del
      río. Viven estas dos naciones en paz en el mismo territorio porque se
      necesitan mutuamente, pero cada una habita aldeas distintas.»
    cita_1557: >-
      «vnnd also vnthereinander gemischt / wonen / dise zwo Nation wonen
      fridlich / doch iede in sondern Pueblos oder flecken für sich selbst /
      vnnd darumb das aine Nation der andern bedarff» ([77]-[78] = imágenes
      87-88 del PDF; glosa marginal «Guaycari kolschw[artz] vischer»)
    aviso: >-
      Federmann los NOMBRA sin duda —«otro pueblo que llaman Guaycaríes» (1916
      p. 84), «die Guaycaries gehaissen» (Klüpfel p. 55)—: el «supusieron eran
      Guayqueríes» que traía esta ficha era de Brito Figueroa, la vía por la
      que llegó la cita, y se quita (medido el 2026-09-23). Lo ATESTIGUADO es
      el contacto con los caquetíos de los llanos, por testigo ocular. Lo
      HIPOTÉTICO es la identidad con los guaiqueríes de Margarita (etnia-009):
      Arcaya no lo sabe (nota a, p. 89), Oliver lo cree probable (DOC p. 281)
      y Kirchhoff hace del nombre un genérico de pueblos pescadores (HSAI p.
      464). No se funden.
    procedencia: {obra: federmann-1916, pagina: "89-90 (y 94-95, 100); 1557 [77]-[78], [83]"}
    ver_tambien: [6-fusion/polities_no_costeras_federmann.yaml#prop-polity-012, 6-fusion/guaiqueries_manaure_dabajuroide_2026-09-23.yaml (§pregunta_2)]

  - id: etnia-003
    nombre: ciparicoto
    variantes: [ciparigoto, cipariconto]
    etiqueta: atestiguado
    familia_linguistica: arahuaca
    aviso_familia: >-
      Zavala Reyes 2015 (p. 61, vía Molina 2009) los lista como ARAWAK, junto a
      achaguas y caquetíos. Pero su etnónimo lleva formante caribe — ver abajo.
    donde: Yaracuy y sierras de Falcón
    polity_caquetia: yaracuy
    polity_nota: frontera oriental del área caquetía
    tipo_de_contacto: vecindad
    contacto_nota: etnónimo dado desde fuera
    intensidad: desconocida
    etimologia: >-
      'gente de la piedra' / 'hombre de la montaña'. Arcaya 1920 p. 36 lo
      descompone: los formantes «cotos y gotos» son caribes y designan "pueblo,
      gente, u hombres"; y `cipa`~`chipa`~`cipare`~`chipare` "quizás sea de
      origen nuarhuaco, significando piedra, pues en todos los dialectos de
      esta familia se encuentra con ese sentido la raíz `ipa` o `iba`. En uno
      de ellos, el conocido guajiro, `ipar` es piedra, e `iparcoa` cascajo".
    relevancia: >-
      ⭐ Etnónimo HÍBRIDO: raíz arahuaca + formante caribe. Y es un nombre
      dado por vecinos, no un autónimo — Miguel lo leyó como forma despectiva
      caquetía para la gente de montaña. El `cipa` cae del lado del reflejo
      lokono `siba` 'piedra, roca', no del caquetío `quiva`/`cuiva`: la
      sibilante lo delata. Ver la propuesta de cognados en
      lengua_toponimia_quibacoa.yaml.
    procedencia: {obra: arcaya-1920, pagina: "36"}
    ver_tambien: [6-fusion/lengua_toponimia_quibacoa.yaml]
    apoyo_2026-09-07: >-
      Segunda aparición del formante -goto en nombre de grupo que otra vía da
      como caribe: AYNAGOTO, aldea de los pemenos/bubures de Juruara en la
      lista de Oviedo y Valdés (Oliver §3.2.4 p. 227, «toponyms suggest Carib
      affiliations»). Apoyo independiente a la lectura de Arcaya.
    apoyo_2026-09-10: >-
      TERCER apoyo, y este hace paradigma: los dialectos documentados del
      cumanagoto —lengua caribe -- incluyen PIRITUGOTO (de Píritu) y
      AVARICOTO. Con Cumanagoto (de Cumaná) son tres nombres de grupo
      construidos igual: topónimo o raíz + -goto/-coto. Que el formante sea
      productivo dentro del propio caribe respalda la lectura de Arcaya mejor
      que un caso suelto. Y subraya lo raro de `ciparicoto`: los otros llevan
      raíz caribe, este lleva raíz ARAHUACA (`cipa` 'piedra') con formante
      caribe — lo que encaja con que sea exónimo, nombre puesto desde fuera.

  # ── Los grupos de lengua caribe de Oliver §3.2.4 (B.6, 2026-09-07) ──
  # Todos de la esfera OCCIDENTAL (Maracaibo, Perijá): regla 4. Detalle y
  # citas en 6-fusion/oliver_324_caribes.yaml §2.

  - id: etnia-004
    nombre: bubure
    variantes: [bubures, bugure]
    etiqueta: atestiguado
    familia_linguistica: caribe
    aviso_familia: >-
      Perijá Carib (Durbin 1977). La filiación caribe la sostiene Oliver con
      Durbin de acuerdo; la única pista léxica que cita es que llamaban
      «Onoto» (voz caribe para el achiote) al grupo vecino. Y «caribe» en las
      crónicas es categoría política, no lingüística (Oliver §3.2.4.2).
    donde: laderas orientales de la Sierra de Perijá, al oeste de la villa de Maracaibo; y la provincia de Juruara, sur-sureste del lago
    polity_caquetia: occidental
    polity_nota: Maracaibo — NO la costera del Golfete
    tipo_de_contacto: corresidencia
    contacto_nota: «a few Caquetío villages, such as Parepi» entre los bubures de Juruara
    intensidad: alta
    intensidad_nota: >-
      La más alta entre los caribes: «Of all the Cariban-speaking groups,
      only the Bubure appear to have had relationships with Arawakan-speaking
      groups»; «more than a simple trade partnership» (p. 229).
    cita: >-
      Esteban Martín (1534): «domestic» y «peaceful», aldeas de tres o cuatro
      casas; los hombres con estuche fálico de totuma, las mujeres con
      pampanillas de algodón.
    procedencia: {obra: oliver-1989-cap3-vecinos, pagina: "226-229"}
    ver_tambien: [geografia_politica-009, 6-fusion/oliver_324_caribes.yaml (§2)]

  - id: etnia-005
    nombre: burede
    variantes: [coronados]
    etiqueta: atestiguado
    familia_linguistica: caribe
    aviso_familia: >-
      Perijá Carib — «another nation of Indians but with little differences
      in the language» respecto a los bubures (Martín 1534).
    donde: Sierra de Perijá por el río Macomite (Guasare); valle del Ranchería, compartido con los coanaos
    polity_caquetia: occidental
    polity_nota: sin contacto directo con caquetíos documentado
    tipo_de_contacto: ninguno
    contacto_nota: ninguno documentado
    intensidad: ninguna
    cita: >-
      «crowned like friars», de ahí coronados. Oliver los cree ancestrales de
      los yukpa que siguen en la sierra.
    procedencia: {obra: oliver-1989-cap3-vecinos, pagina: "226"}
    ver_tambien: [6-fusion/oliver_324_caribes.yaml (§2)]

  - id: etnia-006
    nombre: pemeno
    variantes: [pemono, pemones, pemeos]
    etiqueta: atestiguado
    familia_linguistica: caribe
    aviso_familia: >-
      «hablan como los bubures» (Oviedo y Valdés [6]:33); «basically the same
      nation» que los de Perijá (Martín).
    donde: al este de los bubures de Juruara; y «pemeos» lejos al sur, por el Magdalena, en tierra de pantanos
    polity_caquetia: occidental
    polity_nota: mercado, no corresidencia documentada
    tipo_de_contacto: mercado
    contacto_nota: >-
      Pemenos y bubures («and possibly the Caquetío as well») cambiaban
      productos agrícolas por pescado del lago con kirikires y onotos.
    intensidad: media
    intensidad_nota: alianzas de intercambio formalizadas, «highly selective between groups»
    cita: >-
      Pérez de Tolosa (1546): los onotos «lo venden en sus mercados a los
      indios bubures de la provincia de Juruara, a trueque de maíz, yuca, y
      otras cosas».
    procedencia: {obra: oliver-1989-cap3-vecinos, pagina: "226-228"}
    ver_tambien: [geografia_politica-011, 6-fusion/oliver_324_caribes.yaml (§2)]

  - id: etnia-007
    nombre: kirikire
    variantes: [quiriquires, güerigüeris]
    etiqueta: atestiguado
    familia_linguistica: desconocida
    aviso_familia: >-
      «I have a hunch that they were a Carib-speaking group» (Oliver, n. 155):
      corazonada declarada del autor; no entra como filiación.
    donde: «along the coast and inside the water of the lake itself, many villages constructed with wood» — palafitos del lago de Maracaibo; «travel always by canoe»
    polity_caquetia: occidental
    polity_nota: socios de mercado de los pemenos
    tipo_de_contacto: mercado
    contacto_nota: pescado por productos agrícolas
    intensidad: media
    cita: >-
      «Junto con estos, dentro de la costa y agua de la misma laguna, hay
      muchos pueblos armados sobre madera de una generación de indios que se
      dicen güerigüeris que tractan con estos otros pemenos y andan siempre en
      canoas» (Oviedo y Valdés [6]: 32).
    procedencia: {obra: oliver-1989-cap3-vecinos, pagina: "227-228"}
    ver_tambien: [geografia_politica-011, 6-fusion/oliver_324_caribes.yaml (§2)]

  # ── El caribe del elenco (decisión de Miguel, 2026-09-07) ──
  - id: etnia-008
    nombre: caribe del elenco
    variantes: [Marokoto-ni «guerrero y comerciante caribe»; el raid caribe de la biografía de Chiriware]
    etiqueta: canon-simulacion
    familia_linguistica: caribe
    aviso_familia: >-
      Sin grupo fijado. CANON-SIMULACIÓN, no dato. B.6 (Oliver §3.2.4) no da
      ningún grupo de lengua caribe en Paraguaná ni en la costa de Falcón: los
      caribes documentados están al sur y oeste de Maracaibo, y el «caribe
      insular» de Esteves es inferencia. Un contacto caribe en la polity
      costera solo cabe POR MAR, desde el Caribe Costero Venezolano (chayma,
      cumanagoto, yao, tamanaco: costa central y oriental) o desde las
      Antillas.
    donde: llega a la Curiana por mar; no reside
    polity_caquetia: costera
    polity_nota: la simulada
    tipo_de_contacto: visita
    contacto_nota: comercio y, en la memoria de Chiriware, un raid
    intensidad: baja
    intensidad_nota: episódica
    procedencia: null
    deuda: sin-procedencia
    ver_tambien: [6-fusion/oliver_324_caribes.yaml (§5), geografia_politica-013]

  # ── El vecino de la esfera que no toca ninguna polity (tf.7 B, 2026-09-23) ──
  # cc.5: los guaiqueríes «son parte de la esfera de contacto». Las fuentes lo
  # permiten sólo como vecino LEJANO de la costa oriental, sin contacto
  # documentado con la Kaketiana; por eso `polity_caquetia: ninguna`, el valor
  # que compilar_etnias.py abrió para esto. No entran al motor (la C del issue
  # quedó descartada: ningún contacto con la costa occidental).
  - id: etnia-009
    nombre: guaiquerí de Margarita
    variantes: [guaiqueri, guayqueri, guayquiri, guajqueri, guajkeri, waikerí]
    etiqueta: atestiguado
    familia_linguistica: desconocida
    aviso_familia: >-
      Ninguna palabra guaiquerí en el repo. La lectura mayoritaria es CARIBE
      —Oliver, «the Carib-speaking Guayquerí of Margarita Island» (DOC p. 281,
      con McCorkle 1952, que no está en el repo); el área cultural caribe de
      Kirchhoff (HSAI p. 481, que no los nombra); Zavala Reyes 2015 p. 61 vía
      Molina—, y Castellanos pone a Juan de Salas hablando «en lengua
      guayqueri que bien entienden» a los caribes de las islas (p. 24), sin
      decir si por parentesco o por trato. Arcaya los cree «rama de la familia
      Guarauna» (nota a, Federmann 1916 p. 89) y Antolínez duda, con signos de
      interrogación, entre warao y «prekaribe» (1946 pp. 161-162). Ninguna
      fuente del repo los hace arahuacos. En duda, degradar: `desconocida`.
    donde: >-
      la tierra de Cumaná, las islas de Margarita, Coche y Cubagua y parte de
      Trinidad: la costa ORIENTAL (HSAI p. 399); colonial, desde 1550 en las
      crónicas del repo (regla 3: nada de esto es del s. XV)
    polity_caquetia: ninguna
    polity_nota: >-
      vecino de la ESFERA (cc.5), no de una polity: ninguna fuente del repo
      pone guaiqueríes en Falcón, Paraguaná ni las ABC. El único hilo que los
      ataba a Paraguaná —el «cacique Charaima de la Isla de Margarita» de
      Esteves p. 35— no aguanta: Charayma era cacique del valle de Maya, en la
      provincia de Caracas (Oviedo y Baños p. 168; toponimo-082). Y Paraguachoa,
      que hoy pasa por nombre guaiquerí de Margarita, es en Ampíes, Oviedo y
      Oliver un lugar del Falcón oriental
    tipo_de_contacto: ninguno
    contacto_nota: >-
      ninguno documentado con los caquetíos, ni antes de 1500 ni después. Su
      red documentada es la costa CENTRAL: Doña Isabel, cacica guaiquerí y
      madre de Francisco Fajardo, era nieta de Charayma, del valle de Maya, y
      sobrina de Naiguatá, «el más poderoso señor» de esa costa (Oviedo y
      Baños pp. 168-169). Desde 1555 van como aliados de Fajardo, Losada y
      Juan de Salas, en piraguas y como «prácticos de la provincia» (pp. 177,
      222, 280-281, 312)
    intensidad: ninguna
    cita: >-
      «The Guaiqueri (Guayqueri, Guayquiri, Guajqueri, Guajkeri) occupied the
      country around Cumana, the islands of Margarita, Coche, and Cubagua, and
      part of Trinidad. They were essentially coastal and insular.»
    aviso: >-
      Que sean los mismos que los guaycaríes de Federmann (etnia-002) es
      hipótesis y no se funde. Y la arqueología no los ata: el complejo Playa
      Guacuco de Margarita es de la sub-tradición Campomana, dabajuroide para
      Oliver (cap. 4 pp. 423, 427), con filiación tentativa por muestra pequeña
      (Cruxent y Rouse 1958 vía Oliver), y ninguna fuente lo atribuye a los
      guaiqueríes. El mismo capítulo del HSAI mezcla a estos guaiqueríes con
      los guayquiri del Orinoco de Gumilla (p. 406): son otros.
    procedencia: {obra: steward-1948-hsai-4, pagina: "399 (Hernández de Alba, «The Achagua and their neighbors»)"}
    ver_tambien: [6-fusion/guaiqueries_manaure_dabajuroide_2026-09-23.yaml (§pregunta_2)]

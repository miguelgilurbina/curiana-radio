  # ── El taíno (dp.2.04 de #222, T5 D; «Ok a todo»). Propuesta:
  # 6-fusion/taino_en_la_esfera_2026-09-21.yaml §propuesta_etnias (#192), que
  # la proponía como etnia-009 antes de que ese número lo tomara el guaiquerí.
  # T5 la escribió `costera` antes de que existiera `polity_caquetia:
  # ninguna` (tf.7 B): se aplica como la propuso y la duda va al registro. ──
  - id: etnia-020
    nombre: taíno
    variantes: [taino, arahuaco insular, antillano, lucayo]
    etiqueta: hipotetico
    aviso: >-
      En duda, degradar (regla 2). No hay un solo hecho de contacto precolombino
      documentado; lo documentado es colonial y de sentido único.
      `atestiguado` diría que la relación existió en la ventana simulada, y no
      consta; `canon-simulacion` diría que la inventamos, y tampoco: el taíno
      está en el motor por la puerta del léxico (ESFERA_DE_CONTACTO), no por
      la del mundo. Y el circuito del guanín entre el istmo y las Mayores no
      pasa por la Kaketiana (geografia_politica-018, -019).
    familia_linguistica: arahuaca
    aviso_familia: >-
      Del mismo nodo del árbol arahuaco que el caquetío (Oliver 1989 cap. 2
      pp. 150, 155), con el caquetío más cerca del lokono. Eso es profundidad
      temporal —de 1,8 a 2,6 milenios—, no vecindad; y las rutas los separan:
      el taíno entró a las Antillas por Trinidad y la costa oriental, el
      caquetío se fue al oeste. Primos, no vecinos.
    donde: >-
      las Antillas Mayores —La Española, Cuba, Boriquén, Jamaica— y las
      Lucayas. Ningún asentamiento taíno en la costa de Falcón, en Paraguaná ni
      en las islas ABC está documentado por fuente alguna del repo.
    polity_caquetia: ninguna
    polity_nota: >-
      Decisión de Miguel, 2026-09-27 («ninguna», sobre la duda que dp.2.04 de
      #222 dejó escrita): vecino de la ESFERA, no de una polity. La campaña del
      taíno midió «ni vecino ni pariente medible» y la cerámica antillana se
      detiene antes de las ABC (T8). Entró el 2026-09-24 como `costera`, como
      lo propuso T5 —la polity costera con sus islas, que Oliver mete dentro
      («including the Netherland Antilles», p. 198)—, porque el único contacto
      documentado, la deportación, es con ella; pero esa deportación es
      colonial y aquí se declara la ventana simulada. Las voces taínas de la
      esfera no cambian: entran por la puerta del léxico, no por ésta.
    tipo_de_contacto: ninguno
    contacto_nota: >-
      ninguno documentado en precontacto, que es la ventana simulada. Lo
      documentado es de otra época y de otra naturaleza: desde 1513 los
      españoles deportaron caquetíos de las islas ABC —y, según Arcaya, de
      Paraguaná y la costa de Coro— a La Española y Puerto Rico, a sustituir la
      mano de obra taína que se moría (geografia_politica-014).
    intensidad: ninguna
    intensidad_nota: >-
      cero en precontacto. En la colonia la intensidad es alta y traumática,
      pero es deportación, no vecindad, y ninguna de las dos poblaciones la
      eligió.
    epoca: varias
    epoca_nota: >-
      precontacto: ninguno · contacto temprano: ninguno · colonial:
      deportación (1513-1526). Es el desglose que T5 dejó como
      `epoca_propuesta` cuando el campo no existía.
    cita: >-
      «the Coast of the Province of Venezuela, especially Falcón, was subjected
      to Spanish raids, especially designed to supply Hispaniola and with
      Indian labor, since the local Taíno population had dramatically
      decreased due to disease and other effects of the Conquest» (Oliver 1989,
      cap. 3, p. 250).
    procedencia: {obra: oliver-1989-cap3, pagina: "250"}
    apoyo: >-
      Arcaya 1920 pp. 154 y 159 (el año 1513, Diego de Salazar, dos mil indios,
      Puerto Rico además de Santo Domingo, y Ampíes conversando con los
      deportados). T5 citaba «153, 158»: vistas en el PDF son las impresas
      154 y 159.
    ver_tambien:
      - geografia_politica-014
      - geografia_politica-015
      - 6-fusion/taino_en_la_esfera_2026-09-21.yaml
      - 3-mundo/esfera-de-interaccion.md
      - 3-mundo/horizonte-de-contacto.md


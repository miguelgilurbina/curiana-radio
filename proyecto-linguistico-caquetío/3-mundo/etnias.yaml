      p. 237).
    procedencia: {obra: oliver-1989-cap3-vecinos, pagina: "236-237, 244-245; DOC 269-270"}
    ver_tambien: [6-fusion/oliver1989_restante_2026-09-22.yaml (§vecinos)]


      Con ayomán y gayón. Greenberg la mete en el paezano; Oliver tiene
      «serious doubts» (p. 236).
    donde: >-
      la Sierra de San Luis, «Three leagues from the city of Coro»; también
      Nirgua, Aroa, el valle del Yaracuy y la Sierra de Jirajara (pp. 236-237)
    polity_caquetia: costera
    polity_nota: >-
      el vecino de TIERRA ADENTRO inmediato de la polity costera. Es la primera
      ficha de este registro que toca la costera con fuente (la del caribe del
      elenco es canon-simulación).
    tipo_de_contacto: corresidencia
    contacto_nota: >-
      por el matrimonio del diao (propuesta de Oliver, no dato); y el abasto: en

    atestacion: arqueologica
    precontacto: probable
    rol: >
      Sitio FAL-143 del inventario de Oliver (prospección 1981-1983),
      registrado como "Cayerúa". Afiliación cerámica: Dabajuroide [cf. Howard
      1943].
    procedencia:
      obra: oliver-1989-cap4
      detalle: "Apéndice E FAL-143"
    etimologia: sin-resolver

    nota: >
      ⭐ CIERRA UN HUECO DECLARADO. La nota de Esteves dice de CAYERUBA que es
      "el primer sitio de Paraguaná con evidencia precolombina" (cementerio +
      cerámica) pero que "sin excavación publicada ni fecha, no alcanza para
      precontacto: si". La prospección de Oliver 1981-83 ES ese registro
      arqueológico que faltaba, y Howard 1943 lo respalda desde antes.
      CAUTELA: Cayerúa (Oliver) ~ Cayeruba (Esteves): la equivalencia es muy
      probable pero hay que confirmarla. Y "Dabajuroide" sigue sin fechar la
      ocupación. Sube de `desconocido` a `probable`, no a `si`.

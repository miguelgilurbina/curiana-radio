    precontacto_razon: ruta dabajuroide ~900 d.C. (Antczak et al. 2017 p.157).

  # ── Paraguaná: nombrada, casi sin sostener ─────────────────────────────

  - id: nodo-012
    forma: adicora
    variantes: [Adicoura]
    tipo: asentamiento
    region: paraguana
    etiqueta: reconstruido
    atestacion: colonial
    precontacto: desconocido
    rol: >
      Topónimo de Paraguaná recogido por Zavala Reyes. NO hay en el repo
      ninguna fuente que lo describa como asentamiento caquetío ni que lo feche.
    procedencia:
      obra: zavala-reyes-2015
    etimologia: descartada
    nota: >
      En toponimos.yaml consta como `descartado`, que ahí significa "el
      comentario del autor es histórico o anecdótico, no etimológico" — NO
      significa que el lugar no exista. Degradado a `reconstruido` porque lo
      único atestiguado es el NOMBRE, no el asentamiento.

  - id: nodo-013
    forma: santa-ana
    variantes: [Chamuriana]
    tipo: asentamiento
    region: paraguana
    etiqueta: atestiguado
    atestacion: colonial
    precontacto: desconocido
    rol: >
      Pueblo de Paraguaná con el que los indios de Alto Vista (Aruba)
      mantuvieron contacto regular hasta el s. XIX.
    procedencia:
      obra: van-buurt-2014
    etimologia: no-aplica
    nota: >
      Nombre castellano y de misión: el topónimo es colonial con seguridad,
      aunque el asentamiento pudiera ser anterior con otro nombre. Entra por la
      RUTA que documenta, no por sí mismo.

      (2026-09-07) El nombre anterior existe: CHAMURIANA, «antigua aldea indígena en cuyas
      cercanías los españoles fundaron en 1538 el pueblo de Santa Ana de Paraguaná», con
      cerámica indígena y europea (Esteves 1989 p. 35; toponimo-109). Si es el mismo
      complejo que el sitio FAL-154 del cerro (nodo-024) no está probado: Esteves dice «en
      cuyas cercanías». Miguel: el pueblo es fundación colonial; el sitio y su agua se
      llamaban Chamuriana.

# ── Lo que falta, dicho en voz alta ───────────────────────────────────────
#
# Regla 8 de CLAUDE.md: el hueco se admite, callarlo no.

  # ── Los 17 sitios arqueológicos de Oliver (Apéndice E) ─────────────────
  #
  # Fusionados el 2026-08-24 (#92). Vienen de PROSPECCIÓN, no de crónica:
  # por eso `atestacion: arqueologica` en los diecisiete. Su `etiqueta` es
  # `atestiguado` porque la existencia del sitio no está en duda — lo que se
  # discute es su ÉPOCA, y eso vive en `precontacto`.
  #
  # LA REGLA QUE LOS CLASIFICA: "dabajuroide" no es una fecha. Con las
  # calibraciones de Oliver (cap. 4 p. 440 y Tabla 15), el complejo Urumaco
  # termina hacia 1393/1450 —antes del contacto— mientras Los Médanos A/B va
  # de 1350 a 1650 y lo cruza. Por eso una afiliación Urumaco sostiene
  # `probable` por sí sola y "Dabajuroide" a secas (800-1600) no sostiene
  # nada.
  # (2026-09-23, tf.7 «Cronología C» regional: la regla se sostiene con los
  # dos esquemas —con Casale 2024 el Urumaco Tardío llega a 1500, también
  # antes del contacto—, pero el corte entre Urumaco Tardío y Los Médanos A
  # NO se fija: conviven en la ventana. Qué está fechado y qué es posible,
  # lugar por lugar y con su fuente, en `cronologia_dabajurana` al final de
  # este archivo.)
  #
  # Coro y el Golfete

  - id: nodo-014
    forma: la-maternidad
    tipo: sitio-arqueologico
    region: golfete-de-coro
    etiqueta: atestiguado
    atestacion: arqueologica
    precontacto: si
    rol: >
      Sitio FAL-101 del inventario de Oliver (prospección 1981-1983),
      registrado como "Monumento a la Madre / La Maternidad / LM-1".
      Afiliación cerámica: Los Médanos y Urumaco.
    precontacto_razon: >
      ES EL CANDIDATO MÁS FUERTE DEL REGISTRO. Tres fuentes independientes
      convergen en el mismo punto del terreno: (1) Oliver lo registra con
      componentes Urumaco Y Los Médanos; (2) Tamers 1970 p. 512 lo data —es
      "La Maternidad Sur", IVIC-626, 500±60 BP = A.D. 1450— y Cruxent anota
      que VOLVIÓ AL SITIO y "we were unable to find any trace of European
      artifacts"; (3) Zavala Reyes et al. 2018 excava el área (MCa/1-9, Plaza
      de la Madre) y halla un antrosol de 36 cm sin cerámica híbrida. Una
      fecha dentro de la ventana + ausencia de material europeo declarada por
      el excavador + antrosol de ocupación prolongada. CAUTELA: La muestra de
      Tamers es carbón de SUPERFICIE en dunas activas, no de estratigrafía
      sellada. Y el mismo sitio tiene IVIC-625 (A.D. 1750) unos metros al
      norte: es un lugar reocupado, no un depósito puro.
    procedencia:
      obra: oliver-1989-cap4
      detalle: "Apéndice E FAL-101; fechas en Tamers 1970: 512; excavación en zavala-reyes-2018"
    etimologia: sin-resolver

  - id: nodo-015
    forma: jose-gregorio-hernandez
    tipo: sitio-arqueologico
    region: golfete-de-coro
    etiqueta: atestiguado
    atestacion: arqueologica
    precontacto: si
    rol: >
      Sitio FAL-100 del inventario de Oliver (prospección 1981-1983),
      registrado como "José Gregorio Hernández / GH-1". Afiliación cerámica:
      Los Médanos y Urumaco.
    precontacto_razon: >
      ✅ LAS TRES FECHAS LOCALIZADAS (Table 15 del cap. 4, recalibrada con
      OxCal v3.10). Dos caen DENTRO de la ventana simulada y una es colonial:
      ISGS-1253 (Sector 1) 570±70 BP → cal. A.D. 1299-[1363]-1424 ISGS-1423
      (Sector NW) 550±110 BP → cal. A.D. 1280-[1407]-1440 ISGS-1424 (Sector 2)
      330±110 BP → cal. A.D. 1521-[1572]-1641 Dos dataciones propias en el s.
      XIV-XV, en sectores distintos del sitio. Ya no es inferencia por
      complejo cerámico: son fechas. CAUTELA: El sitio fue REOCUPADO:
      ISGS-1424 es colonial. Un nodo con ocupación precontacto **y**
      posterior; al ponerlo en escena hay que usar la capa, no el sitio
      entero. De FAL-100 Sector-2 procede además el cuenco de Los Médanos-B
      con motivo zoomorfo en espiral (Fig. 86).
    procedencia:
      obra: oliver-1989-cap4
      detalle: "Apéndice E FAL-100"
    etimologia: sin-resolver

  - id: nodo-016

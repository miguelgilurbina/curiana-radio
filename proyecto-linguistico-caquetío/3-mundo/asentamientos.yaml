  # Península de Paraguaná

  - id: nodo-024
    forma: santa-ana-el-cerro
    tipo: sitio-arqueologico
    region: paraguana
    etiqueta: atestiguado
    atestacion: arqueologica
    precontacto: si
    rol: >
      Sitio FAL-154 del inventario de Oliver (prospección 1981-1983),
      registrado como "Santa Ana ["El Cerro"]-1". Afiliación cerámica:
      Urumaco.
    precontacto_razon: >
      ⭐ EL MEJOR SOSTENIDO DE TODO EL REGISTRO. Tres dataciones propias en la
      Table 15, TODAS precontacto, cubriendo tres siglos de ocupación
      continua: IVIC-18 790±100 BP → cal. A.D. 1160-[1257]-1280 IVIC-16
      730±110 BP → cal. A.D. 1210-[1278]-1387 IVIC-14 520±120 BP → cal. A.D.
      1299-[1415]-1451 La última la obtuvo Zucchi (com. pers.) y Oliver la
      llama "a terminal date… of cal. A.D. 1415". Su cerámica es Late Urumaco
      "still lavishly decorated", que Oliver contrapone al estilo empobrecido
      contemporáneo de Supidebo-Antúnez: es un sitio de plena vitalidad en la
      ventana simulada. Y cruza con Esteves, que describe una "antigua aldea
      indígena en cuyas cercanías los españoles fundaron en 1538 el pueblo de
      Santa Ana de Paraguaná", con "restos de cerámica indígena y europea".
      CAUTELA: Esteves llama al sitio Chamuriana; Oliver lo registra como
      Santa Ana "El Cerro". Hay que confirmar que hablan del mismo lugar antes
      de fundir las dos evidencias en un nodo.
    procedencia:
      obra: oliver-1989-cap4
      detalle: "Apéndice E FAL-154"
    etimologia: sin-resolver

  - id: nodo-025

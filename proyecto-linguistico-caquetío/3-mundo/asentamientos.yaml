    tipo: asentamiento
    region: golfete-de-coro
    etiqueta: atestiguado
    atestacion: colonial
    precontacto: desconocido
    rol: Nombrado en la carta de Bastidas a Carlos V (1538). Nada más se sabe.
    procedencia:

huecos:

  - que: >
      Los demás poblados de Paraguaná: Baraived, Jadacaquiva, Adaure, Charaima…
      (Miraca entró como nodo-031 el 2026-09-07; Moruy ya era nodo-027.)
    por_que_no_estan: >
      Hasta 2026-09 no había en el repo ninguna fuente que los nombrara. Ahora
      Esteves 1989 los nombra con censo de 1881 y a veces con papeles del s. XVIII
      (Jadacaquiva: iglesia de 1740; Cocodite: papel de 1590), y
      2-lengua/toponimos.yaml los tiene. Entran como nodos cuando se decida uno
      por uno, con su época declarada; ponerlos como precontacto sería inventarlos.
    candidato_a_verificar: >
      `jadicuar` está en toponimos.yaml y SE PARECE a Jadacaquiva. Parecerse no
      es evidencia — hay que comprobarlo, no asumirlo.
    donde: "issue #92"

  - que: Los "más de 30 poblados" que infiere Oliver.
    por_que_no_estan: >
      La carta de Ballesteros (1550) dice que reparar el canal del `buco`
      requería "cuatro o cinco mil indios", de lo que Oliver infiere
      coordinación entre más de 30 poblados (geografia_politica-004). Tenemos
      trece nodos, y siete de ellos son una sola lista. Faltan dos tercios.
    donde: "issue #92"

  - que: La ubicación de Todariquiba.
    por_que_no_estan: >
      Sigue en debate en la propia literatura. Descansa parcialmente en Ramos
      Pérez 1978, que no está en el repo.
    donde: "issue #92, y 4-fuentes/ramos-perez-1978.md"

  - que: Qué lengua o lenguas hablaba cada nodo.
    por_que_no_estan: >
      Que la esfera fuera multiétnica no dice cuánto ni dónde. El lexicón tiene
      7 formas jirajaroides y 4 de solapamiento caribe: no alcanza para modelar
      un nodo bilingüe.
    donde: "3-mundo/esfera-de-interaccion.md §6"

# ══════════════════════════════════════════════════════════════════════
# LA LOZA DE LA VENTANA — la cronología dabajurana, lugar por lugar
# ══════════════════════════════════════════════════════════════════════
#
# Decisión de Miguel del 2026-09-23 (decisiones_tanda_final_2026-09-23.yaml
# tf.7, «Cronología C», en la versión regional que recomendaba la campaña
# cc.5; cierra #203 M8 D1). Cada fase y cada lugar cita obra y página:
# `obra` es clave foránea a 4-fuentes/bibliografia.yaml y `nodos` a este
# registro, y compilar_asentamientos.py lo comprueba.
#
# Sólo va la sub-tradición DABAJURANA, que es la de la costa. La tabla entera
# (Bachaquerana, Campomana —la de Margarita—, Capachoana, Tierroide, Arvelo y
# López 2004) y su medición contra la ventana —qué complejos se solapan, qué
# C-14 de la Tabla 15 caen dentro— viven en
# 6-fusion/guaiqueries_manaure_dabajuroide_2026-09-23.yaml §pregunta_3.fases y
# las mide 6-fusion/scripts/medir_cronologia_dabajuroide.py (regla 1: los
# conteos no se escriben aquí).

cronologia_dabajurana:
  decision: >-
    C regional: no se fija un corte entre esquemas. En la ventana simulada
    conviven dos lozas dabajuranas —el Urumaco Tardío y Los Médanos A— y se
    dice lugar por lugar qué está fechado y qué es sólo posible. Oliver 1989
    (costa de Falcón) y Casale 2024 (Aruba) no se promedian.
  ventana: [1300, 1500]
  que_no_es: >-
    «Dabajuroide» no es sinónimo de «caquetío»: la tradición incluye la
    sub-tradición Campomana de Cumaná, Barcelona y Margarita (Oliver cap. 4 p.
    427). Lo que Oliver correlaciona con las polities caquetías son la
    Dabajurana, la Bachaquerana y la Tierrana (p. 424). Ver ecologia-013.

  fases:   # desde / hasta en años d.C.; «a/b» es el rango que da la fuente
    - {esquema: oliver-1989, complejo: Túcua, desde: 800, hasta: '1100/1200', region: 'costa de Falcón, Paraguaná, ABC', obra: oliver-1989-cap4, pagina: '422'}
    - {esquema: oliver-1989, complejo: 'Urumaco (Temprano y Tardío)', desde: '1100/1200', hasta: '1400/1450', region: 'costa de Falcón, Paraguaná, ABC', obra: oliver-1989-cap4, pagina: '422, 424', nota: 'Late Urumaco = estilo Savaneta de du Ry en las Antillas'}
    - {esquema: oliver-1989, complejo: 'Los Médanos (A prehistórico, B histórico)', desde: 1350, hasta: '1600/1650', region: 'costa de Falcón, Paraguaná, ABC', obra: oliver-1989-cap4, pagina: '422'}
    - {esquema: casale-2024, complejo: Túcua, desde: 850, hasta: 1200, region: Aruba, obra: casale-2024, pagina: '3 (Tabla 1)'}
    - {esquema: casale-2024, complejo: Urumaco Temprano, desde: 1200, hasta: 1350, region: Aruba, obra: casale-2024, pagina: '3 (Tabla 1)', nota: 'el texto (p. 4) fecha Tanki Flip en 950-1250 «Early Urumaco»: tabla y texto no coinciden'}
    - {esquema: casale-2024, complejo: Urumaco Tardío, desde: 1350, hasta: 1500, region: Aruba, obra: casale-2024, pagina: '3 (Tabla 1)'}
    - {esquema: casale-2024, complejo: Los Médanos A, desde: 1400, hasta: 1450, region: Aruba, obra: casale-2024, pagina: '3 (Tabla 1)', nota: 'el texto (p. 5) da «Los Médanos phases in Venezuela (1400–1600/1650 C.E.)»'}
    - {esquema: casale-2024, complejo: Los Médanos B, desde: 1450, hasta: 1515, region: Aruba, obra: casale-2024, pagina: '3 (Tabla 1)', nota: 'sólo Savaneta; el tope de 1515 es de las islas y el artículo no dice por qué'}

  donde_divergen: >-
    Hasta 1450 los dos esquemas ponen en la costa el Urumaco y, desde 1350
    (Oliver) o 1400 (Casale), también Los Médanos. De 1450 a 1500 se separan:
    con Oliver sólo queda Los Médanos; con Casale siguen el Urumaco Tardío y
    Los Médanos B. La segunda mitad del s. XV es donde elegir esquema cambiaría
    lo que hay en las manos, y por eso no se elige.

  por_lugar:
    - lugar: Paraguaná — lo fechado
      nodos: [nodo-024]
      que: >-
        Urumaco Tardío en Santa Ana «El Cerro» (FAL-154), con fecha terminal
        IVIC-14 cal. A.D. 1299-[1415]-1451 (la obtuvo Zucchi, com. pers. a
        Oliver) y loza «still lavishly decorated», frente al estilo empobrecido
        contemporáneo de Supidebo-Antúnez en Borojó.
      etiqueta: atestiguado
      obra: oliver-1989-cap4
      pagina: '473'
    - lugar: Paraguaná — lo posible
      nodos: [nodo-025, nodo-027]
      que: >-
        Un Los Médanos A local en Cayerúa (FAL-143) y Moruy (FAL-149): bordes
        huecos, más engobe rojo, sin el ave negro sobre rojo. Oliver: «do not
        allow me to be absolutely certain». Sin ninguna fecha. Moruy es de
        GUARANAO y Cayerúa de AMUAY: uno en cada nodo de la era 2 (#122).
      etiqueta: hipotetico
      obra: oliver-1989-cap4
      pagina: '471-472'
    - lugar: Coro y el Golfete
      nodos: [nodo-014, nodo-015]
      que: >-
        Los dos, en los mismos sitios: La Maternidad (FAL-101) y José Gregorio
        Hernández (FAL-100) tienen componentes Urumaco Y Los Médanos, con
        fechas propias dentro de la ventana (IVIC-626, A.D. 1450, vía Tamers
        1970; ISGS-1253 e ISGS-1423 en la Tabla 15).
      etiqueta: atestiguado
      obra: oliver-1989-cap4
      pagina: 'Apéndice E (FAL-100, FAL-101) y Tabla 15'
    - lugar: las islas
      nodos: [nodo-010]
      que: >-
        Según Casale et al. 2024, cuya tabla es de Aruba: Urumaco Tardío
        1350-1500 junto a Los Médanos A (1400-1450) y B (1450-1515, sólo
        Savaneta). Que valga igual para Curazao y Bonaire es extensión, no
        dato.
      etiqueta: atestiguado
      obra: casale-2024
      pagina: '3 (Tabla 1)'

  lo_que_no_se_leyo: >-
    Rouse y Cruxent 1963 (0 bytes en el repo; préstamo controlado en
    archive.org), Cruxent y Rouse 1958 (sólo vía Oliver pp. 422-427 y Antczak
    2015 p. 18), Arvelo y Zucchi (sólo citados por otros). Si alguno entra,
    esta tabla se re-mide.

# Curiana — registro de nodos de la esfera de interacción
# =========================================================
#
# Responde a UNA pregunta: ¿qué asentamientos existían, cuándo, y con qué
# evidencia? Es un artefacto DISTINTO de 2-lengua/toponimos.yaml, que responde
# a "¿qué significa este nombre?".
#
# La distinción no es burocrática. En `toponimos.yaml`, Adícora, Curaçao y
# Aruba están los tres como `descartado` — que ahí significa "sin etimología
# despejable", NO "no existió". Un registro de nodos tiene que poder decir
# "este lugar existió y no sabemos qué quiere decir su nombre".
#
# LOS TRES CAMPOS QUE NO SE PUEDEN CONFUNDIR
# ------------------------------------------
#   etiqueta      ¿tenemos evidencia de que este asentamiento existió?
#                 atestiguado | reconstruido | hipotetico   (las del corpus)
#
#   atestacion    ¿de qué época es el DOCUMENTO que lo atestigua?
#                 colonial | precolonial | arqueologica
#
#   precontacto   ¿existía en la ventana que simulamos (s. XIV-XV)?
#                 si | probable | desconocido
#
# El tercero es el que importa y el que casi siempre dice `desconocido`.
# Un poblado nombrado en una carta de 1538 está *atestiguado* sin que eso diga
# nada de si existía cien años antes. Confundir `etiqueta: atestiguado` con
# "sirve para la simulación" es exactamente la regla 3 de CLAUDE.md.
#
# EL HALLAZGO QUE DEJABA VER ESTE REGISTRO — Y CÓMO CAMBIÓ
# ---------------------------------------------------------
# Hasta el 2026-08-24 este archivo decía: "ningún nodo continental tiene
# `precontacto: si`; los únicos que lo tienen son los insulares, y no por
# documento sino por ARQUEOLOGÍA". Era cierto, y era el argumento de que para
# la ventana simulada las islas estaban mejor sostenidas que la costa.
#
# YA NO LO ES. La fusión de los 17 sitios del Apéndice E de Oliver (#92) trae
# TRES nodos continentales con `precontacto: si`, y por la misma vía que los
# insulares — arqueología fechada, no crónica:
#
#   nodo la-maternidad     Tamers 1970 IVIC-626, A.D. 1450, y Cruxent anota que
#                          volvió al sitio y no halló material europeo
#   nodo jose-gregorio-hernandez   dos dataciones en ventana (1299-1424,
#                          1280-1440) más una colonial: sitio reocupado
#   nodo santa-ana-el-cerro   TRES dataciones, todas precontacto, hasta A.D. 1415
#
# Lo que sigue siendo cierto: el continente depende de MUY POCOS sitios
# fechados, y casi todo lo demás sigue en `desconocido`. La asimetría se
# redujo; no desapareció. Sigue importando al decidir qué nodo se pone en
# escena (#90).
#
# Valida: python curiana_sim/compilar_asentamientos.py --check

meta:
  pregunta: "¿Qué asentamientos existían en la esfera, cuándo, y con qué evidencia?"
  creado: 2026-08-08
  ambito: >
    La esfera de interacción del Golfete de Coro — ver 3-mundo/esfera-de-interaccion.md.
    NO es un gazeteer de Falcón: solo entran nodos con evidencia citable.
  advertencia: >
    Siete de los nodos continentales vienen de UNA sola fuente: la carta del
    obispo Rodrigo de Bastidas a Carlos V (1538), vía Oliver 1989 cap.3.
    Una lista de 1538 es documentación colonial once años posterior al pacto
    Ampíes-Manaure. Sirve para saber qué topónimos existían; no para dar por
    buena la organización política que describe.

nodos:

  # ── El eje continental: Coro y el Golfete ──────────────────────────────

  - id: nodo-001
    forma: todariquiba
    tipo: asentamiento
    region: golfete-de-coro
    etiqueta: atestiguado
    atestacion: colonial
    precontacto: desconocido
    rol: >
      Pueblo atestiguado en 1538: el de Don Alexandre, hijo de Manaure y
      «cacique principal de la Provincia» (carta del obispo Bastidas). Que
      MANAURE residiera aquí es reconstruido, no atestiguado (ver
      `residencia_de_manaure`). Es el mejor candidato a lo que la era 1
      llamaba "la Curiana".
    residencia_de_manaure:
      etiqueta: reconstruido
      epoca: '1527-1531 (contacto temprano; regla 3: no dice nada del s. XV)'
      que: >-
        El pacto de 1527 con Ampíes lo REASIENTA junto a Coro, en Todariquiba
        (Oliver DOC p. 251, vía Ramos Pérez 1978 y Arcaya 1977, sin el
        documento en el repo), y Manaure y Don Alexandre dejan juntos
        Todariquiba por los abusos del teniente de Alfinger (DOC p. 268, vía
        los juicios de residencia). Que sea un REASENTAMIENTO dice también que
        no era su asiento anterior.
      alternativa: >-
        Galeotto Cey, en Coro desde 1545, pone a Manaure en el pueblo de CORO,
        en una «casa grandísima» que luego fue iglesia, y la probanza de 1680
        le da allí «su corte» (González Batista 2002 pp. 163-164, vía M7).
      antes_de_1527: >-
        Ninguna fuente. La única anterior al pacto —Ampíes, c. 1526, de oídas—
        lo pone «diez leguas la tierra adentro en la provincia de Coro»
        (Fernández Duro 1885 t. II p. 212). Ninguna lo pone en Paraguaná.
      procedencia: {obra: oliver-1989-cap3, pagina: 'DOC pp. 251, 268'}
      decision: 'tf.7, Manaure A (Miguel, 2026-09-23): de atestiguado a reconstruido'
    ubicacion: >
      A «dos leguas» de la actual Coro según la carta de Bastidas del 8-X-1538
      (Velasco 2015 p. 33) y a una según otra carta suya que la rectifica
      (González Batista 2002 p. 161 n. 47-48): las dos distancias son del mismo
      testigo; con la legua de 4,5-6 km de Oliver, 4,5-12 km. LA UBICACIÓN
      EXACTA SIGUE EN DEBATE: no se ha hallado sitio arqueológico del tamaño
      correspondiente en la periferia de Coro. Oliver sospecha que quedó bajo
      la expansión urbana moderna, o más allá de la distancia que sugieren las
      crónicas.
    procedencia:
      obra: oliver-1989-cap3
      detalle: "pp. 251 (pacto de 1527), 259 (carta de Bastidas 1538: Todariquiba, el pueblo de Don Alexandre), 261-262 (registros Welser, Ponce y Vaccari 1977), 268 (la salida de Manaure y Don Alexandre); la carta de Bastidas transcrita en velasco-2015-resistencia p. 33"
    corpus: [geografia_politica-003]
    etimologia: sin-resolver
    nota: >
      NO está en toponimos.yaml. Sí está `todarahuato` ('Indígena de la Vela'),
      que NO se ha demostrado relacionado — no asumirlo.
      ⚠ Trampa de extracción medida: `pypdf` parte "Todariquiba" en
      "T odariquiba" en sus 7 apariciones de Oliver cap.3. Usar `pdftotext`.

  - id: nodo-002
    forma: cumarebo
    tipo: asentamiento-puerto
    region: golfete-de-coro
    etiqueta: atestiguado
    atestacion: colonial
    precontacto: desconocido
    rol: >
      Nombrado en la carta de Bastidas (1538). Su interés no es el poblado sino
      la costa: una ensenada JUSTO AL ESTE de Puerto Cumarebo se llamaba
      "Puerto de los Indios Curaçao", y es el punto de partida documentado
      desde el que los caquetíos de Curazao cruzaban a la isla en canoa.
      Es, con eso, el enlace continente-isla mejor sostenido del registro.
    ubicacion: costa oriental del estado Falcón, al este de Coro.
    procedencia:
      obra: van-buurt-2014
      detalle: "Puerto de los Indios Curaçao, citando a Hartog 1968; la lista de 1538 en Oliver 1989 cap.3 p.251"
    corpus: [geografia_politica-001, geografia_politica-003]
    etimologia: sin-resolver
    etimologia_detalle: >
      toponimo-004, nivel C desde el 2026-09-23 (era A): `Cumare`
      (antropónimo — la fuente lo identifica como el nombre del cacique) +
      `ebo` ('camino, paso, senda') = 'camino de Cumare'. La glosa (Zavala #94)
      y la de `ebo` (#117) son de la sigla (E), que es Esteves 1989 (p. 105), y
      la «segunda atestación independiente de `ebo`» que daba esta nota
      —`jurijurebo`— también es suya: la ecuación cierra, pero con las
      etimologías de un solo autor. Por eso baja de `resuelto` a
      `sin-resolver` (en duda, degradar). tf.0, la sigla E, opción 5-a.


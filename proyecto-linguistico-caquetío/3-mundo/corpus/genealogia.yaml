# Corpus cultural — Genealogía propuesta
# Sesión 1/4 del programa "corpus cultural". Ver README.md para el esquema.
#
# ALCANCE: esta sesión ancla 6 linajes matrilineales con los miembros para los que ya hay evidencia
# (relación explícita en curiana_agents.py) o una propuesta bien razonada (ver ensayo §5). Para el
# resto de los 60 agentes se registra una entrada completa por consistencia de esquema, pero madre/
# linaje/conyuge quedan en null cuando no hay base para proponer algo mejor que una invención vacía —
# eso es trabajo de una sesión futura o de Miguel directamente, no algo que deba forzarse aquí.
#
# curiana_agents.py NO se modifica. Esto es una propuesta en datos, para revisar y vetar.

# Los linajes son las UNIDADES DE EXPANSIÓN del elenco (dirección de Miguel, 2026-07-16; ver
# parentesco-025 y ensayo §5.1): cuando la simulación crezca más allá de 60 agentes, se puebla un
# linaje completo (matriarca + hermanas con hijos + hermanos adultos + esposos de otros linajes), no
# individuos sueltos. `capacidad_de_expansion` anota qué le falta a cada linaje para ser un grupo
# residencial creíble — es la lista de casting para la expansión futura. Modelo comparativo: los
# linajes totémicos achagua, cada uno con casa comunal propia en la aldea (parentesco-022).

linajes:
  Buio:
    totem: "buio (serpiente-espíritu)"
    dominio: "piache, visión, barsure"
    fundadora: "no propuesta (ancestral, se asume fallecida hace generaciones)"
    capacidad_de_expansion: >
      Hoy: Buio-sha, Sha y (por oficio, no sangre) Shaboro. Le falta la generación intermedia: la
      madre Tuqa-sha está propuesta solo como fondo, no hay hermanos adultos (tíos maternos de
      Buio-sha y Sha) ni matriarca viva. Expansión natural: 3-5 agentes (un tío materno pescador o
      guerrero, una hermana mayor casada con hijos, la propia Tuqa-sha si se decide que vive).
  Chiriware:
    totem: "chiriguare (gavilán)"
    dominio: "guerra, defensa"
    fundadora: "no propuesta (ancestral)"
    capacidad_de_expansion: >
      Hoy: Chiriware y Chiri-ko (vía Yagua-sha, fondo). Le falta todo el núcleo femenino: Yagua-sha
      podría promoverse a agente, y no hay hermanas de Chiri-ko ni sobrinas — es decir, el linaje
      guerrero no tiene todavía quien lo continúe después de Chiri-ko. Expansión natural: 3-4 agentes
      centrados en las mujeres del linaje.
  Corie:
    totem: "corie (armadillo)"
    dominio: "agricultura, prudencia, lo común"
    fundadora: "no propuesta (ancestral)"
    capacidad_de_expansion: >
      Hoy es el linaje más poblado de la propuesta: Korie-ko, Buko-ko, Buko (vía Peri-sha), Wata-ni
      (vía Tuisa-sha), Tawari-ko (esposo de Piru-sha) — más los hijos futuros de Piru-sha, que serían
      del linaje guaycarí de ella, no de Corie (buen material dramático). Le falta la matriarca viva
      que ate esas ramas. Expansión natural: 2-3 agentes (la matriarca, una hermana de Tuisa-sha).
  Paugis:
    totem: "paugis (paují)"
    dominio: "medicina, partería, memoria oral femenina"
    fundadora: "no propuesta (ancestral)"
    capacidad_de_expansion: >
      Hoy: Paugis-sha, Sha-korie, Suba-ko (propuesta). Es el linaje más envejecido: dos ancianas y una
      aprendiza. Le falta la generación del medio completa — la hermana de Paugis-sha murió de parto
      (atestiguado en su ficha) y no se sabe si dejó más hijos que Suba-ko. Expansión natural: 3-4
      agentes (hijas/sobrinas adultas con niños, para que el saber de partería tenga a dónde ir).
  Kaira:
    totem: "no fijado — linaje propuesto, nombre y tótem abiertos a que Miguel decida"
    dominio: "linaje materno de Manaure"
    fundadora: "Kaira-sha (propuesta, fondo:true, fallecida antes del presente narrativo)"
    capacidad_de_expansion: >
      Hoy: solo Manaure como agente; Itana-sha y Waimo-ko son fondo. Es deliberadamente el linaje con
      más recorrido de expansión: promover a Waimo-ko (el sucesor) e Itana-sha a agentes es el primer
      paso natural, y el linaje del Señor merece densidad (más hermanas, más sobrinos rivales entre
      sí por la sucesión). Expansión natural: 4-6 agentes.
  Warana:
    totem: "no fijado — linaje propuesto, nombre y tótem abiertos a que Miguel decida"
    dominio: "linaje materno de Nubiri-sha"
    fundadora: "Warana-sha (propuesta, fondo:true, fallecida antes del presente narrativo)"
    capacidad_de_expansion: >
      Hoy: solo Nubiri-sha. Sus hijos con Manaure (no nombrados en el canon) serían de ESTE linaje, no
      del de Manaure — el dato estructural más cargado de la propuesta: la casa del cacique cría hijos
      que no heredan. Expansión natural: 3-5 agentes (los hijos de Nubiri-sha y Manaure, una hermana
      de Nubiri-sha, la red femenina que sostiene su poder de redistribución).

  # Vías de entrada de LINAJES NUEVOS al expandir (parentesco-025): matrimonio exogámico con otro
  # asentamiento caquetío; rama insular vía Aruba/Bonaire (gancho natural: Kadushi); grupo desplazado
  # por raid caribe que pide adopción. Cada vía trae su propio conflicto narrativo de integración.


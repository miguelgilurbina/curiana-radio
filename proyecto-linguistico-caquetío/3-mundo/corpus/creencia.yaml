- id: creencia-024
  contenido: 'La pesca se adivina con tabaco, como cualquier otra faena, y cada uno es su propio adivino: «para ver
    si caminarán ó yrán á pescar ó sembrarán, y para saber si matarán caça ó si su muger los quiere bien, cada uno
    es boratio»: envuelven la hoja alrededor de la mazorca, encienden un cabo, soplan, y si lo quemado queda «á manera
    de hoz encorvado» saldrá bien, y si «derecho», mal. Es el único acto ritual atestiguado que toca el mar, y no
    lo distingue: la pesca va en la misma lista que caminar, sembrar, cazar y el amor.'

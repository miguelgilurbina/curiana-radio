- id: creencia-020
  contenido: >
    La regla moral de la caza: los indios de Coro «abominaban tanto la traición que
    aun a los conejos y venados no querían en caza tirar, estando echados o detenidos,
    porque decían era matarlos a traición, sino cuando huían». Es la única norma de
    caza caquetía del repo, y es moral, no técnica: define la traición.
  fuente: atestiguado
  referencia: "Arcaya 1920, p. 42, citando a fray Pedro Simón sobre los de Coro (contacto, s. XVI)"
  procedencia:
    obra: arcaya-1920
    pagina: 42
  dominios: [creencia, caza, moral]
  agentes_relacionados: []
  palabra_lexicon: matakán
  locacion: matorral
  lectura: >-
    Capa contacto sobre «los de Coro» (regla 4: la costa, no los Llanos). Con el
    matacán en el mundo (ecologia-077), la regla tiene animal: al venado echado no se
    le tira. Va al bloque [Tu tierra] de los sitios de monte.

- id: creencia-021
  contenido: >
    El bosque del cerro tiene dueño y no se corta: «en el cerro de Capuhana hay un
    duende llamado [Capó] quien junto con una serpiente emplumada... impide que sean
    cortados los árboles de la localidad». Antolínez (1946, vía Tamayo) da la misma
    figura: un dueño llamado Capo que impide cortar los árboles del cerro de Santa
    Ana.
  fuente: hipotetico
  referencia: "Esteves 1989, parte 2, p. 26, entrada Capuhana (tradición viva del s. XX); Antolínez 1946 vía Francisco Tamayo (6-fusion/capubana_agua_y_microclima.yaml). Retro-abstraído: forma documentada en boca viva, sustrato incierto — a efectos de proyección vale como hipotético"

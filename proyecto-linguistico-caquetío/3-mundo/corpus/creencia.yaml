- id: creencia-022
  contenido: >
    La piedra escrita del conjunto del cerro: en el cerro de Siraba, «cerro cónico,
    unido al cerro de Santa Ana por el lado Noreste», de casi 500 m, «están
    localizadas unos petroglifos que llaman: "Las Piedras del Almanaque"». Es el
    único objeto del repo que la tradición asocia a un calendario, y está pegado al
    Capubana.
  fuente: hipotetico
  referencia: "Esteves 1989, parte 3, p. 60, entrada Siraba; el nombre es de la tradición local y Esteves no lo interpreta. Retro-abstraído a efectos de proyección"

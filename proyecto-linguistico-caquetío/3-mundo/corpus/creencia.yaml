  agentes_relacionados: []
  palabra_lexicon: kapubana
  locacion: null
  lectura: >-
    En términos materiales, el tabú de la tala es la protección de la captura de
    humedad: sin bosque arriba no hay agua abajo (capubana_agua_y_microclima.yaml,

- id: creencia-023
  contenido: 'La comida del rito caquetío es de MAÍZ, no del mar. El boratio, antes de curar, manda ayunar a toda
    la casa: «que no coman sino magamorra rala de mahiz que ellos llaman caça, y no mas de una vez cada dia». Antes
    de la guerra o de «sacrificar», la casa entera ayuna y sólo come «una magamorra». Y en los dos funerales, el del
    señor y el del díao, los huesos molidos se beben en `maçato`, brebaje de maíz. Ninguno de los ritos que Oviedo
    describe usa pescado, concha ni agua de mar.'
  fuente: atestiguado
  referencia: oviedo-y-valdes-1852-1855, p. t. II, impresas 297 (funeral de los çaquitios), 299 (el ayuno de la cura),
    300 (el díao), 329 (el ayuno de la guerra)
  procedencia:
    obra: oviedo-y-valdes-1852-1855
    pagina: t. II, impresas 297 (funeral de los çaquitios), 299 (el ayuno de la cura), 300 (el díao), 329 (el ayuno
      de la guerra)
  dominios:
  - creencia
  - alimentacion
  - rito
  agentes_relacionados: []
  implicacion_simulacion: 'Un rito, un ayuno o un funeral se hace con mazamorra y con maçato; el pescado es comida
    de todos los días. Si un agente ofrenda pescado o concha en un rito, eso no lo enseña el canon: es emergencia
    y se mide.'
  lectura: 'Es un dato negativo con forma positiva: dice qué comida es la del rito. No prueba que el mar no tuviera
    rito; prueba que los tres que conocemos son de tierra de labranza.'
  limite: 'Época: contacto (Oviedo escribe 1535-1548; el cap. XXII, de boca del obispo Bastidas). Polity: los çaquitios
    de la gobernación (p. 297); el díao «en algunas partes desta gobernaçión» (p. 299); el ayuno, «los indios en aquella

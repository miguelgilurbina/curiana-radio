- id: creencia-026
  contenido: 'En Curazao, hacia los s. XIII-XIV, las dos urnas dabajuroides de De Savaan llevaban entre los huesos
    un diente de tiburón cada una: la primaria, «a (2.2 cm. long) sharks tooth», 14 discos de concha, calcita y una
    punta de sílex, y alrededor huesos de pez, coral y una lapa; la secundaria, un diente de 9 mm, fragmentos de ostra
    perlera (Pinctada), un fragmento de Strombus y huesos de pez. El excavador lo dice con condicional: «could have
    been / may have been grave goods». En San Hironimo, junto a los pies de un adulto, un plastrón de tortuga marina

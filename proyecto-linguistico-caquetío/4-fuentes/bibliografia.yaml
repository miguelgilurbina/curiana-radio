  acceso: '🔴 NO IDENTIFICADA, verificado el 2026-09-22. Zavala Reyes 2015 nombra a «Angulo Molina (AM)»
    entre los nueve autores de su glosario (p. 64) y NO lo incluye en sus referencias bibliográficas (pp.
    74-76): no hay título, año ni editorial. (Página según el encabezado del texto extraído; verificar
    en imagen antes de citarla.) Tampoco lo trae la entrada de blog que copia el glosario (Folkloreando,
    2015). Búsquedas web sin resultado: «Angulo Molina» con caquetío, Falcón, Coro, toponimia, glosario,
    vocabulario, Lara, Yaracuy, Carora; y dos glosas suyas literales («Alcaboa… tierras solas», «Aburí…
    río lleno de arena») sólo devuelven a Zavala. En el repo: 0 menciones de «Angulo Molina» en los `.txt`
    de `fuentes_caquetios/` (sólo «Angulo» como apellido de conquistadores, obispos y un autor antillano
    que cita Bachiller y Morales).'
  aliases:
